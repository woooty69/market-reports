## 🗓 주말 요약

**① 한 주의 결론은 '지수는 밀렸고, 금리·유가는 새 레벨에 올라섰다'**
3대 지수는 나흘 연속 하락 뒤 금요일 반등으로 낙폭을 줄였지만 주간으로는 나스닥 **−0.66%**, S&P 500 **−0.80%**, 다우 **−1.57%**로 모두 내렸다. S&P 500의 4거래일 낙폭은 6월 이후 최대였다(뉴스핌·IG). 반면 같은 주에 **WTI는 +9.37%(\$100.05)**, **2년물은 +25.1bp(4.630%)**, **10년물은 +18.6bp(4.969%)** 움직였다. 지수 낙폭만 보면 완만한 조정이지만, 주식을 할인하는 두 변수 — 유가와 금리 — 가 각각 **100달러**와 **5%**라는 상징적 문턱에 동시에 도달한 주다. SOX가 **+0.76%**로 지수를 이긴 것은 금요일 오라클 효과(+1.81%)가 목요일 −2.66%를 상쇄한 결과이고, 러셀2000은 이 주에도 대형주보다 약했다.

**② 9월 인상은 확정됐고, 논쟁은 '몇 번'으로 옮겨갔다**
8월 PPI(9/10)가 전년비 **5.4%**(예상 5.3%, 전월 4.8%), 8월 CPI(9/11)가 전월비 **+0.4%·전년비 +3.4%**로 부합했지만 근원 CPI가 **+0.3%**(예상 0.2%)로 웃돌면서 CME 페드워치의 9월 25bp 인상 확률은 주초 **58.4%** → 목요일 **71%** → 금요일 마감 **86.5%**까지 올랐다. 현재 기준금리 **3.50~3.75%**에서 **3.75~4.00%**로의 인상이 기본 시나리오가 됐고(IG), 블룸버그에 따르면 시장은 연말까지 **두 차례 인상**을 반영했다. 2년물은 2024년 7월 이후 최고, 10년물은 장중 **4.978%**로 5% 재시도, 30년물은 2004년 이후 최고(5.360%)를 찍은 뒤 5.34%대에서 마감했다. 커브는 단기물이 더 오르는 **베어 플래트닝**이었고 10-2년 스프레드는 **40.4bp → 33.9bp**로 좁혀졌다. 프린시펄의 시마 샤는 "논쟁이 '올리느냐'에서 '몇 번 올리느냐'로 옮겨갔다"고 했다.

**③ 유가 100달러 — 미군의 유조선 5척 격침과 이란의 10척 보복 공격이 한 주 안에 벌어졌다**
9/9 미군이 이란 유조선 5척을 격침·파괴했고, 이란은 같은 날 호르무즈 인근에서 **10척의 선박**을 공격했다고 발표했다 — 2월 개전 이후 최대 규모의 선박 공격이다(KBS·FT). 9/10에는 후티가 홍해 항구를 장악하고 사우디가 1990년 이후 최저 생산을 보고하면서 WTI가 하루 **+6.69%(\$102.48)** 급등했고, 9/11 사우디는 여러 차례 공격받은 **동서(East-West) 송유관을 예방적으로 폐쇄**했다. 금요일 걸프국-이란 협상 기대와 IEA의 수요 전망 하향(올해 세계 석유 공급 하루 **570만 배럴, 약 6%** 감소 전망)으로 **−2.37%** 되돌렸지만 레벨은 100달러 위에 남았다. 미국 디젤 소매가는 갤런당 **6달러**를 처음 넘었고 정유주 발레로(VLO)·필립스66(PSX)·마라톤페트롤리엄(MPC)은 52주 신고가를 썼다. 개전 이후 이란에 공격당한 상선은 약 **70척**이며, 선박 중개업체 클락슨스는 호르무즈 운항 차질이 **내년 하반기까지** 이어질 수 있다고 봤다.

**④ AI 인프라는 '수주'에서 '매출'로 넘어갔다 — 오라클이 증명했고 델·HPE가 받았다**
오라클(ORCL)의 FY2027 1분기(9/10 마감 후)는 매출 **193억 5,000만 달러(+30%)**, OCI 매출 **74억 달러(+121%)**, RPO **6,640억 달러**(분기 중 +2,090억 달러), 분기 GPU 인도 **30만 개**였다. 본주는 잉여현금흐름 **−54억 달러**·분기 자본지출 **285억 달러**가 재확인되며 금요일 **−1.74%**로 마감했지만, 그 숫자가 '발주가 실제 매출로 전환된다'는 증거로 읽히면서 델테크놀로지스(DELL) **+11.98%**, 휴렛팩커드엔터프라이즈(HPE) **+12.44%**, 넷앱(NTAP) **+8.54%**, 슈퍼마이크로(SMCI) **+7.28%**, 아리스타네트웍스(ANET) **+5.61%**가 일제히 뛰었다. 반도체 안에서는 온세미컨덕터(ON) **+8.51%**, 아나로그디바이스(ADI) **+4.85%** 등 아날로그·통신칩이 이끌었고 엔비디아(NVDA) **−0.03%(\$218.29)**, 마이크론(MU) **−0.22%**는 제자리였다. 이번 주 AI 로직·메모리 대장주는 지수를 이기지 못했고, 수혜는 서버·네트워킹·전력 체인 쪽으로 번졌다.

**⑤ 메모리는 한 주 안에 '바닥 통과'와 '되돌림'을 모두 겪었다**
9/9 골드만삭스의 메모리 '바닥 통과' 노트에 SKHY가 **+7.05%(\$198.63)**로 올랐다가, 9/10 SOX **−2.66%**와 함께 **−5.20%(\$188.30)**로 되돌렸고 금요일은 **+0.14%(\$188.57)** 보합이었다. 주간으로는 **+6.54%**. 같은 기간 국내 SK하이닉스(000660)는 **1,647,000원 → 1,812,000원(+10.02%)**으로 ADR보다 더 올랐고, 그 결과 SKHY 괴리율은 **+45.1%(9/4) → +40.1%(9/11)**로 **5.0%p 축소**됐다 — 축소의 원인이 ADR 하락이 아니라 **국내 상승**이라는 점이 이번 주의 특징이다. 주 중 궤적은 +33.1%(9/7) → +39.3% → +43.0% → +37.2% → +40.1%로 국내와 ADR이 번갈아 움직였다. 스토리지에서는 시게이트(STX) **−3.73%**, 샌디스크(SNDK) **−3.50%**, 웨스턴디지털(WDC) **−2.98%**가 금요일 차익실현으로 밀렸고 회사 고유 재료는 확인되지 않았다.

**⑥ 한국은 주간 +3.33%로 7,000을 넘었다가 내줬고, 수급은 주초 매수·주말 매도로 갈렸다**
코스피는 9/7 **+4.61%** 급등(GPT-6 아스트라 촉매) 뒤 9/9 **7,051.64**로 7월 23일 이후 처음 7,000선을 회복했지만, 9/11 유가·금리 충격에 **6,909.91(−1.76%)**로 밀리며 주간 **+3.33%**로 마쳤다. 코스닥은 **820.64(+0.88%)**. 외국인은 9/7 하루 SK하이닉스를 **77만 2,036주** 순매수했으나 9/10 **−95만 6,724주**, 9/11 **−60만 6,502주**로 돌아서 주간 합계는 **−65만 1,929주**였고, 기관은 주간 **+43만 8,838주** 순매수였다. 코스피 전체로는 9/10 **2조 7,140억원**, 9/11 **2조 2,915억원**의 외국인 순매도가 이틀 연속 나왔다. 코스피200 야간선물은 9/7 밤 **1,123.30**까지 올랐다가 9/10 밤 **1,073.00(−3.51%)**로 급락한 뒤 금요일 밤 **1,098.85(+0.97%)**로 마감해, 주간으로는 **+0.45%**에 그쳤다. 원/달러는 **1,345.9원**으로 주간 4.5원 내렸다.

## 📰 섹션 1. 한 주간(9/7~9/11) 주요 뉴스 5선

**1. 8월 CPI 3.4%·근원 0.3% — 9월 인상 확률 86.5%, 남은 질문은 점도표**
8월 CPI는 전월비 **+0.4%**, 전년비 **+3.4%**로 컨센서스에 부합했으나 근원 CPI가 전월비 **+0.3%**(예상 0.2%)로 웃돌았다. 전날 PPI는 전년비 **5.4%**(전월 4.8%), 근원 PPI **4.6%**로 항공료 등 근원 PCE 연결 항목의 상승이 컸다(신한투자증권). 9월 FOMC 인상 확률은 발표 직후 **91.6%**까지 치솟았다가 **86.5%**로 마감했고, 미시간대 9월 소비자심리 예비치는 **47.8**(예상 51.0), 1년 기대인플레이션은 **4.6%**(8월 4.0%)로 나왔다. LSEG 리퍼 집계로 미국 주식펀드는 한 주간 **322억 7,000만 달러** 순유출, 대형주 펀드는 **404억 4,000만 달러**로 사상 최대 주간 순유출을 기록했다.
**투자자 함의:** 인상 자체는 가격에 들어갔다. 9/16 FOMC에서 시장이 볼 것은 **점도표의 최종금리와 워시 의장의 회견 톤**이며, 연말 두 차례 인상(블룸버그 반영치)보다 매파적이면 10년물 5% 돌파와 30년물 신고가가 재개된다. 한국은행이 8/27 기준금리를 **3.00%**로 2회 연속 올린 상태라 한미 동시 긴축 조합은 유지되고, 국내에서는 금리가 이익보다 **할인율**을 먼저 건드린다(신한 노동길).

**2. 호르무즈 '유조선 전쟁' 격화 — 미군 유조선 5척 격침, 이란 10척 공격, 사우디 송유관 폐쇄**
9/9 미군이 이란 유조선 5척을 격침·파괴했고, 이란은 호르무즈 인근 선박 **10척**을 공격했다고 발표했다. 9/10 후티 반군은 홍해 항구를 장악했고 사우디는 1990년 이후 최저 생산을 보고했으며, 9/11에는 드론 공격을 받은 사우디 동서 송유관 — 호르무즈를 거치지 않는 핵심 우회로 — 가 예방 폐쇄됐다. WTI는 주간 **+9.37%(\$100.05)**, 브렌트는 **+8.65%(\$104.61)**로 마쳤고 국내 기준유가 두바이유는 100달러를 웃돈다. 중국은 **13억 배럴** 비축유를 헐어 버티다 100달러 유가에서 수입을 재개했다(글로벌이코노믹).
**투자자 함의:** 이번 유가는 지정학 재료이면서 동시에 **연준 인상 확률을 밀어 올리는 매크로 변수**다. 국내에서는 정제마진 강세(에쓰오일·SK이노베이션)·조선·방산이 수혜 경로이고, 항공·해운·화학과 원가 전가력이 낮은 소비재에 부담이다. 트럼프 대통령이 '중간선거 후 종전'을 반복하면서 폴리마켓 기준 연내 호르무즈 정상화 확률은 8월 초 50% → 9/10 **16%**로 급락했다(LS증권 황산해).

**3. 오라클 FY27 1분기 — OCI +121%, RPO 6,640억 달러, 그러나 FCF −54억 달러**
매출 **193억 5,000만 달러(+30%)**, 클라우드 매출 **116억 달러(+62%)**, OCI **74억 달러(+121%)**, 조정 EPS **\$1.92**(컨센서스 \$1.74). RPO는 **6,640억 달러**로 분기 중 2,090억 달러 늘었고 신규 AI 클라우드 계약 300억 달러 이상이 포함됐다. 2분기 가이던스는 매출 **208억 8,000만~215억 2,000만 달러**, 클라우드 성장률 **65~71%**, FY2027 자본지출 **900억~950억 달러**를 유지했다. 시간외 +7%에서 정규장 **−1.74%(\$150.28)**로 돌아선 것은 분기 잉여현금흐름 **−54억 달러**와 자본지출 **285억 달러**(전년 85억 달러)가 재부각됐기 때문이다(CNBC·마켓워치).
**투자자 함의:** 'AI 수주가 매출이 되느냐'는 질문에 처음으로 숫자로 답한 실적이다. 수혜는 오라클 본주가 아니라 **서버(델·슈퍼마이크로)·네트워킹(HPE 주니퍼·아리스타·시스코)·전력(이튼·GE버노바·버티브)**으로 갔다. 국내로는 서버 부품·기판(대덕전자(353200)·이수페타시스(007660)·심텍(222800))과 전력기기(효성중공업(298040)·HD현대일렉트릭(267260)) 경로가 가장 직접적이다. 다만 자본지출을 부채로 조달하는 구조는 금리 5% 시대에 할인율 리스크로 남는다.

**4. GPT-6 아스트라가 코스피를 7,000으로 되돌렸다 — 미국이 쉬는 사이 한국이 4.61% 뛰었다**
미국이 노동절(9/7)로 쉬는 동안 코스피는 오픈AI GPT-6 아스트라(9/3 공개, 9/4 유료 배포)를 재료로 **+4.61%** 급등했고, 외국인·기관이 하루 **5조원 이상** 순매수로 전환했다. 아스트라는 컴퓨터 조작 등 에이전트 기능을 강화한 모델로, 토큰 사용량 증가 → 추론 메모리·스토리지 수요라는 서사가 반도체에 붙었다(대신 이경민). 9/9 골드만삭스가 메모리 '바닥 통과' 노트를 내면서 SKHY **+7.05%**, 국내 SK하이닉스(000660) **+3.51%(1,856,000원)**가 이어졌고 코스피는 **7,051.64**로 33거래일 만에 7,000선을 탈환했다.
**투자자 함의:** 이번 주 국내 반도체 상승분은 **미국 반도체(SOX 주간 +0.76%)보다 훨씬 컸다** — SK하이닉스(000660) 주간 +10.02% vs SKHY +6.54%. 즉 한국이 미국을 따라간 것이 아니라 앞서 갔고, 괴리율 축소(45.1% → 40.1%)는 그 결과다. 9/10~9/11 외국인이 이틀간 5조원을 팔면서도 지수가 6,900선을 지킨 것은 개인(9/11 1조 8,679억원 순매수)이 받았기 때문이라, **외국인 재유입 없이는 7,000 안착이 어렵다**는 구조가 남았다.

**5. SK하이닉스 — 충칭공장 매각 '검토 중' 재공시(12월 재공시), 성과급 현금 50% 재합의**
9/9 재공시에서 SK하이닉스는 4조원 규모 중국 충칭 낸드 후공정 공장 지분 매각설에 대해 "다양한 방안을 검토 중이나 확정된 사항 없음"을 유지하고 **확정 시점 또는 3개월 이내(12월) 재공시**로 기한을 늦췄다(글로벌이코노믹). 솔리다임 프리IPO 건도 9/4 같은 방식으로 **12월 3일**로 유예된 상태다. 한편 9/10 노사는 초과이익분배금(PS)을 **현금 50%·자사주 50%**로 지급하는 재합의안을 도출했다 — 기존 잠정합의안(현금 40%·주식 60%)이 조합원 투표에서 부결된 뒤 나온 수정안이며, 조합원 재투표는 이번 주 진행된다(매경·뉴스토마토).
**투자자 함의:** 두 자산 재편 건이 모두 12월로 밀리면서 **단기 촉매도, 중복상장 할인 요인도 당장은 없다.** 성과급의 절반을 자사주로 지급하는 구조는 회사가 보유 자사주를 임직원에게 넘기는 방식이라 유통주식 증가 요인이 될 수 있어 재투표 결과와 지급 방식 공시를 확인해야 한다. 2026년 컨센서스 영업이익 **265조 2,552억원**·컨센서스 PER **5.18배**라는 밸류에이션 자체는 바뀌지 않았다.

## 🌙 섹션 2. 휴장·주말 신규 뉴스 5선

**1. 트럼프, 사우디 송유관 공격 배후로 이란 지목 — "종전은 중간선거 직후, 그때 유가 급락" (9/12 더블린)**
아일랜드 더블린을 방문한 트럼프 대통령은 사우디 동서 송유관 드론 공격에 대해 "아마 이란일 것"이라고 답했다. 그러나 사우디와 이라크 당국은 드론이 **이라크 영토에서 발진**한 것으로 파악했고 이라크는 지역 군 지휘관을 해임했다(뉴스1·AFP). 트럼프는 빈 살만 왕세자와 통화했다고 밝히면서 이란 전쟁이 "아주 곧, 아마 중간선거 직후" 끝날 것이며 그 경우 "유가는 급락할 것"이라는 기존 전망을 반복했고, 후티 반군이 "우리와 싸우고 싶어 하지 않는다"고 연락해 왔다고 주장했다.
**관전 포인트:** '중간선거 후 종전'은 11월 3일까지 **최소 7주간 현 국면 지속**을 뜻한다. 시장은 이 발언을 조기 종식 기대의 후퇴로 읽었고(LS증권), 후티는 홍해 남단 바브엘만데브 요충지 페림섬까지 진출해 호르무즈에 이어 **두 번째 병목**이 생긴 상태다. 월요일 유가 갭의 방향은 이 발언보다 아래 2번 회의 결과에 달렸다.

**2. 이란·걸프국 14일 오만 회의 — 바레인 불참, 이란 "서명 합의 기대 안 해"**
이란과 걸프 국가들이 9/14 오만에서 호르무즈 문제를 논의한다. 이란 고위 당국자는 AFP·로이터에 "호르무즈 통항 문제와 관련해 서명된 합의가 나올 것으로 기대하지 않는다"고 했고, 이란은 통항 선박에 **통항료를 부과하는 체계**를 원하지만 오만은 반대한다. 바레인은 "역내 안보는 유화 정책으로 유지될 수 없다"며 이란과 외교관계 복원 전엔 참석하지 않겠다고 밝혔고, 오만은 회의 계획을 공식 발표하지 않았다(뉴스1). 같은 날 CENTCOM은 7월 봉쇄 재개 후 60일간 이란행 상선 **100척**을 우회시켰으며 "허가 없이 봉쇄를 뚫은 선박은 한 척도 없다"고 밝혔다.
**관전 포인트:** 금요일 WTI −2.37%는 바로 이 협상 기대를 반영한 값이다. 회의가 열리되 합의 없이 끝나는 것이 이란 스스로 밝힌 기본 시나리오이므로, **월요일 유가는 되돌림보다 재상승 쪽 비대칭**이 크다. 미군이 이란 봉쇄를 유지하는 한 이란의 상선 보복도 유지된다.

**3. 미군, 호르무즈 선박 호위를 하루 2회로 축소 — 장기전 비용 관리 (FT, 9/12)**
미 해군 선박협력지침(NCAGS)이 해사 자문관에게 보낸 이메일에 따르면 이달 초부터 미군이 공중 엄호를 제공하는 호르무즈 통과 시간대가 **하루 두 번 특정 시간대**로 제한됐다. 해군분석센터(CNA)의 조슈아 탈리스는 호위 항공기 운용비가 시간당 **2만 5,000~7만 5,000달러**라며 무기한 방어 비용을 관리하려는 조치로 봤고, 전 중동 해군 사령관 존 밀러는 "24시간 연중무휴 공중 엄호는 매우 어렵다"고 했다(KBS·FT). 클락슨스는 호르무즈 운항 차질이 **내년 하반기까지** 이어질 수 있다고 전망했다.
**관전 포인트:** 호위 축소는 봉쇄 해제 신호가 아니라 **장기전 준비**다. 통항 창이 좁아지면 유조선 운임과 보험료가 오르고, 이라크의 지중해 우회로(원유 수출 하루 300만 배럴 회복)·사우디 동서 송유관(폐쇄 중) 같은 우회 인프라의 가동 여부가 유가의 상단을 정한다. 국내에서는 해운 운임 수혜와 정유 원가 부담이 동시에 커진다.

**4. 베선트, 월요일 '대형 은행' 제재 예고 — 이란 자금줄 차단 '경제적 디데이' 후속**
베선트 재무장관은 9/11 이란 자금 경로와 연관된 **'대형 은행'을 월요일(9/14)에 제재**하겠다고 밝혔다. 은행명과 국적은 공개하지 않았다(CNBC·US뉴스). 8월 '경제적 디데이(Operation Economic Outcast)'로 약 **60개** 기업·개인·선박을 제재하고 2차 제재 범위를 넓힌 데 이은 조치다.
**관전 포인트:** 대상이 중국계 은행이면 위안화·중국 은행주와 중국의 이란산 원유 수입(위 1번 뉴스에서 재개 확인)에 직접 영향을 주고, 걸프·터키계 은행이면 역내 결제망 문제로 번진다. 어느 쪽이든 **월요일 아시아 장중에 발표될 가능성**이 있어 한국 개장 시점엔 미확인 변수로 남는다.

**5. 증권가 이번 주 코스피 밴드 6,400~7,400 — "V자보다 W자", 순환매·실적 저평가 업종 주목**
이투데이·뉴스토마토·조선비즈 집계 기준 증권사들의 이번 주 코스피 예상 범위는 **6,400~7,400**이다. 신한투자증권 노동길은 "금리 상승이 기업 실적보다 주식 할인율을 높이는 방식으로 부담을 준다. V자 반등보다 W자 가능성이 커져 공격적 매수의 실익은 작다"고 했고, 김찬희는 "점도표 내 최종금리 힌트를 주시해야 한다"고 했다. NH투자증권 이상준은 "아스트라 효과로 반도체 중심 7,000 탈환은 AI 수혜라는 기본 틀이 견고하다는 뜻이며, 변동성 확대와 펀더멘털 훼손은 구분해야 한다"고 봤다. 대신증권 이경민은 반도체 주도 속 **IT하드웨어·IT가전·유통·보험·조선·자동차** 등 실적 대비 저평가 업종의 순환매를 예상했다. 키움증권 김유미는 FOMC 동결을 예상하되 매파적 기조를 경고했다.
**관전 포인트:** 증권사 컨센서스가 'FOMC 동결'(블룸버그 컨센서스)과 '86.5% 인상'(페드워치) 사이에 갈려 있다는 점 자체가 이번 주 변동성의 원천이다. 9/12 새벽 북한의 단거리 탄도미사일 발사(한미일 '프리덤 에지' 종료 다음 날)는 시장 재료로는 약하지만 외국인 수급이 이틀 연속 5조원 순매도인 국면에서 겹친 변수다.

## 🔭 섹션 3. 다음 개장일(9/14 월) 섹터별 전망

미국은 **9월 14일(월)** 정상 개장한다. 한국이 먼저 열리므로 국내는 오만 회의·베선트 제재·유가 갭을 **미국 가이드 없이 장중에 소화**한다.

**⬆️ 우호적 재료가 있는 섹터**

**정유·에너지** — WTI \$100.05·브렌트 \$104.61에서 출발하고, 오만 회의는 이란 스스로 '서명 합의 없음'을 예고했다. 미국 정유주 3사가 52주 신고가를 쓴 배경(디젤 6달러·정제마진)은 에쓰오일(010950)·SK이노베이션(096770)에 같은 방향으로 작용한다. 다만 유가가 금리 인상 확률을 밀어 올린다는 점에서 지수 전체엔 역풍이다.

**AI 서버·네트워킹·전력기기** — 델 +11.98%·HPE +12.44%·아리스타 +5.61%·이튼 +3.96%·GE버노바 +3.61%의 금요일 랠리는 오라클의 GPU 30만 개 인도·자본지출 900억 달러 유지에서 나왔다. 국내 기판·서버 부품·전력기기가 직접 경로이며, 반도체 대형주보다 이쪽의 전달력이 이번 주 더 컸다.

**해운** — 호르무즈 호위 시간대 축소와 후티의 바브엘만데브 진출은 운임·우회 항로 비용을 올린다.

**⬇️ 부담이 큰 섹터**

**고밸류 성장주·소프트웨어** — 10년물 4.969%, 30년물 5.34%는 할인율 부담이 가장 큰 구간이다. 어도비(ADBE)는 실적 상회에도 신규 ARR −38%가 남았고, 9/4 가이드와이어·유아이패스 급락 이후 반등 계기가 없다.

**항공·화학·소비재** — 바클레이즈가 유가를 이유로 항공 8개사 목표가를 일괄 하향했고(델타 \$105→\$95 등), 미시간대 9월 소비자심리 예비치 47.8(예상 51.0)은 소비 여력 둔화를 가리킨다. 유가 주간 +9.37%는 원가에 직접 반영된다.

**헬스케어·메드텍** — 스트라이커(SYK)·레스메드(RMD) 9거래일 연속 하락, 유나이티드헬스(UNH) 옵텀 마진 재조명으로 미국 헬스케어는 이번 주 하락한 두 섹터 중 하나였다.

**⚠️ 방향이 갈리는 곳**

**메모리 반도체** — 골드만 '바닥 통과'(9/9)와 SOX −2.66%(9/10)가 하루 간격으로 나왔다. 금요일 SOX +1.81%의 주역이 메모리가 아니라 아날로그·통신칩이었으므로 월요일 국내 메모리 대형주에 대한 미국발 직접 전달력은 지수 수치보다 약하다. SKHY 괴리율 **+40.1%**는 국내 상승으로 좁혀진 값이라 ADR 쪽 '따라 내릴' 압력은 크지 않다.

### 🇰🇷 한국 관전 포인트

**🇰🇷 [전달]** 코스피200 야간선물은 금요일 밤 시가 **1,094.55**로 정규장 종가(1,088.30) 위에서 출발해 고가 **1,107.50**·저가 **1,085.45**를 오간 뒤 **1,098.85(+0.97%, +10.55)**로 마감했다(거래량 30,217계약). 저가가 정규장 종가를 밑돈 구간은 짧았고 미국 반등을 초반부터 반영했으므로, 월요일 개장에는 **약 +10포인트의 갭업 여지가 이미 선반영**돼 있다. 주간으로 보면 야간선물 **+0.45%** vs 코스피 **+3.33%**로, 이번 주는 **국내 현물이 미국보다 앞서 간 주**다 — 9/4 주말 리포트 시점의 '국내가 덜 반영한 구간'과 정반대 위치다. SK하이닉스(000660)는 주간 **+10.02%(1,812,000원)**로 SKHY **+6.54%(\$188.57)**를 앞섰고 괴리율은 **+45.1% → +40.1%**로 5.0%p 축소됐다. 축소의 원인이 국내 상승이므로 ADR이 국내를 끌어내리는 경로는 약하지만, 반대로 국내가 미국보다 먼저 올라 있는 만큼 **금리·유가 충격을 받을 때 낙폭도 먼저 나오는 위치**다(9/11 코스피 −1.76% vs 나스닥 +0.96%가 그 사례다). 원/달러는 주간 4.5원 내린 1,345.9원이지만 9/10~9/11 이틀은 달러 강세로 돌아섰다.

**🇰🇷 [수급]** SK하이닉스(000660) 외국인 수급은 한 주간 **+772,036주(9/7) → +97,545주(9/8) → +41,716주(9/9) → −956,724주(9/10) → −606,502주(9/11)**로 움직여 주간 합계 **−651,929주**였다. 9/10 대규모 순매도 뒤 9/11 매도 규모는 **3분의 2로 줄었지만**, 기관이 9/10 **+287,228주** 순매수에서 9/11 **−274,533주** 순매도로 돌아서 '외국인 감속 + 기관 전환'이라는 매도 클라이맥스 통과 조건은 절반만 충족됐다. 외국인 지분율은 **50.63%(9/7) → 50.47%(9/11)**로 낮아졌다. 코스피 전체로는 9/10 **−2조 7,140억원**, 9/11 **−2조 2,915억원**의 외국인 순매도를 개인이 받았고(9/11 개인 **+1조 8,679억원**), 기관도 9/11 **−1조 2,257억원**으로 매도에 가담했다. 월요일 확인할 것은 두 가지다 — 외국인 순매도가 사흘째 감속하는지, 그리고 기관이 순매수로 복귀하는지. 둘 다 충족되기 전까지 7,000 재탈환은 개인 자금에 의존하는 구조다.
