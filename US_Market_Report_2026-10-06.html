## 🗓 시장 요약

**① 나스닥 27,477.31(+1.05%) 사상 최고 종가·나스닥100 31,076.44(+0.87%) 이틀 연속 최고, S&P500 +0.66%·다우 +0.18% — 엔비디아 +2.12%(장중 \$240.10 최고)·마이크로소프트 +1.48%·브로드컴 +2.08% vs 10년물 5.315% 52주 최고**
월요일 미국 지수는 장기 금리가 52주 최고로 올라선 가운데서도 대형 기술주가 지수를 끌어올려 나스닥이 사상 최고 종가를 새로 썼다. S&P500은 **7,773.95(+51.23, +0.66%)**, 나스닥은 **27,477.31(+286.45, +1.05%)**, 다우는 **51,267.90(+90.94, +0.18%)**였고 나스닥100은 **31,076.44(+268.51, +0.87%)**, 러셀2000은 2,847.14(+0.50%), VIX는 15.52(+1.37%)였다. 장중 S&P500은 고가 7,794.35·저가 7,727.59, 나스닥은 고가 27,544.06·저가 27,223.49, 다우는 저가 50,862.85에서 고가 51,404.86까지 움직였는데, 다우는 오전 한때 −0.24%까지 밀렸다가 오후에 플러스로 돌아섰다. 종목별로는 엔비디아(NVDA)가 장중 \$240.10으로 사상 최고를 다시 쓰고 **\$238.90(+2.12%)**, 마이크로소프트(MSFT)가 매수 의견 상향 보도에 **\$525.18(+1.48%)**, 브로드컴(AVGO) \$362.51(+2.08%), TSMC(TSM) \$485.80(+2.75%), 비자(V) \$369.71(+2.51%), 스페이스X(SPCX) \$171.09(+7.63%), 모더나(MRNA) \$203.21(+6.95%)가 올랐다. 인수합병(M&A)도 지수를 받쳤다. 슈나이더 일렉트릭이 PTC(PTC)를 약 \$220억에 전액 현금 인수하기로 하면서 PTC는 **\$192.26(+33.49%)**로 뛰었다. 반면 C.H. 로빈슨(CHRW)은 RXO 인수 발표에 **\$140.61(−10.85%)**, 레나(LEN) \$74.44(−6.73%), 치폴레(CMG) \$30.85(−4.67%), 인텔(INTC) \$116.19(−2.63%)로 내렸다. 장 마감 무렵 S&P500 구성 종목 약 340개가 올라 상승 폭은 넓었다. 올스타차트의 숀 맥러플린은 "시장은 팔릴 이유가 충분했지만 아직 팔리지 않았다"고 했다. 해석하면 금리 상승을 이겨 낸 것은 AI 대형주와 M&A 재료였고, 금리에 민감한 주택·소비주는 여전히 눌려 '두 개의 시장'이 이어진 하루였다.

**② 9월 ISM 서비스업 55.9(전월 55.4)·가격지수 74.0(전월 72.6, 예상 73) — 10년물 5.315%(+3.8bp)·20년물 5.717%·30년물 5.670% 52주 최고, 2년물 4.823%(−0.2bp)로 장단기 금리차 약 49bp 확대**
9월 ISM 서비스업지수는 **55.9**로 전월 55.4에서 올라 27개월 연속 확장 국면을 이어 갔고, 가격지수는 **74.0**으로 전월 72.6과 예상치 73을 모두 웃돌았다. 앞서 나온 9월 제조업 가격지수가 77.9였던 만큼 서비스 물가도 2022년 이후 가장 높은 수준으로 올라선 셈이다. 채권시장은 이를 장기 금리 상승으로 받았다. 10년물은 **5.315%(+3.8bp)**, 20년물은 5.717%(+4.1bp), 30년물은 5.670%(+4.0bp)로 모두 52주 최고를 새로 썼고, 단기 금리인 2년물은 **4.823%(−0.2bp)**로 거의 움직이지 않아 2년·10년 금리차는 약 49bp로 벌어졌다. 금요일 9월 고용이 2만9,000명 증가에 그치고 7~8월 수치가 합계 6만 명 하향되며 10월 인상 기대가 물러났지만, 장기 금리는 오히려 오르는 '베어 스티프닝'이다. 캐피털닷컴의 다니엘라 해손은 장기물 매도가 "높은 실질금리, 대규모 국채 발행, 자본 확보 경쟁"을 반영한다며 성장주는 오르는데 무위험 금리는 "이례적으로 높은" 상태에 머무는 "특이한 괴리"라고 했다. 유럽에서는 프랑스 예산 교착으로 프랑스·독일 10년물 금리차가 145.50bp(+5bp)로 벌어지고 유로가 17개월 최저로 밀리면서 달러가 강세를 보였고, 코메르츠방크의 하우케 지엠센은 "국가부채 위기를 다소 연상시킨다"고 했다. 해석하면 고용은 식는데 서비스 물가는 오르는 조합이 장기 금리를 밀어 올리고 있어, 수요일 9월 FOMC 의사록과 다음 주 9월 CPI가 금리 경로의 다음 분기점이다.

**③ WTI \$90.68(−0.47%)·브렌트 \$102.90(+0.64%) — 사우디 아람코 CEO "세계 원유 재고가 무서울 정도로 얇다", G7 비축유 방출과 중동 긴장 사이 \$90대 공방, 금 \$4,189.50(+0.65%)·은 \$62.19(+2.94%) 반등**
WTI는 **\$90.68(−\$0.43, −0.47%)**로 이틀 연속 내렸지만 브렌트는 **\$102.90(+0.64%)**로 올라 두 유종이 엇갈렸다. 금요일 G7의 4개월간 최대 1억 배럴 원유·디젤 방출 합의가 WTI 상단을 누르는 가운데, 사우디 아람코의 아민 나세르 최고경영자는 세계 원유 재고가 "무서울 정도로 얇아졌다"며 상황이 "심각하다"고 경고했고 정제유 가격이 원유보다 더 가파르게 올랐다고 했다. 이라크가 호르무즈 해협을 통과할 초대형 유조선을 용선했다는 소식과 겨울 난방비 급등 우려도 브렌트를 \$100 위에 묶어 뒀다. 귀금속은 반등해 금은 \$4,189.50(+0.65%), 은은 \$62.19(+2.94%)였고, 비트코인은 장중 \$85,500 안팎(+0.3%)이었다. 에너지 수요 우려와 공급 불안이 맞서면서 WTI는 지난주 \$88~95 박스 안에서 움직이고 있다. 해석하면 비축유 방출은 미국 유가를, 중동 공급 리스크는 국제 유가를 각각 지배하고 있어 WTI·브렌트 차이가 \$12대로 넓게 유지되는 것이 특징이다.

**④ AI·반도체 — 엔비디아 +2.12%(장중 사상 최고 \$240.10, 시가총액 약 \$5.8조)·TSMC +2.75%·브로드컴 +2.08%, 반면 인텔 −2.63%(머스크 "TSMC도 테라팹 합류 가능")·글로벌파운드리 −3.21%·마이크론 −1.02%, SOX +0.28%**
필라델피아 반도체지수는 **13,172.74(+36.06, +0.28%)**로 저가 13,004.67에서 회복해 소폭 올랐다. 엔비디아(NVDA)는 시가 \$236.09에서 고가 \$240.10(+2.63%)까지 오르며 이틀 연속 장중 사상 최고를 갈아치운 뒤 **\$238.90(+\$4.95, +2.12%)**로 마감했고, 시가총액은 약 \$5.8조로 불어났다. 지난주 발표한 \$1,500억 규모 자사주 매입 추가와 모건스탠리의 '최선호주' 재지정이 매수를 받쳤다. TSMC(TSM)는 \$485.80(+2.75%), 브로드컴(AVGO)은 \$362.51(+2.08%)로 올랐고, 폭스콘(훙하이)이 3분기 매출 3조300억 대만달러(+47%, 예상 2조8,300억)를 발표한 것도 AI 서버 수요 확인으로 받아들여졌다. 반면 인텔(INTC)은 일론 머스크가 텍사스 반도체 공장 프로젝트 '테라팹'에 TSMC가 합류할 수 있다고 확인하자 **\$116.19(−2.63%)**로 내렸고, 글로벌파운드리(GFS)는 \$48.56(−3.21%), AMD(AMD)는 \$631.75(−0.34%)였다. 메모리는 마이크론(MU) \$1,063.96(−1.02%), SK하이닉스 ADR(SKHY) \$195.02(−0.06%)로 금요일 도시바 HDD 증설 보도 이후 약세가 이어졌다. 스카이웍스(SWKS)는 코보 합병을 마무리했지만 \$81.66 안팎(약 −4%)으로 내렸다. 해석하면 AI 연산의 정점인 엔비디아·TSMC로 자금이 쏠리고 위탁생산 경쟁 구도에 영향을 받는 인텔·글로벌파운드리, 공급 확대 우려가 걸린 메모리는 소외되는 차별화가 계속됐다.

**⑤ 회사 고유 재료 — PTC +33.49%(슈나이더 일렉트릭 약 \$220억 전액 현금 인수), C.H. 로빈슨 −10.85%·RXO +22.54%(약 \$58억 인수), 백사이트 +30.70%(VAX-31 임상 3상 성공), 브라질 대선 1차 투표에 이타우 +15.48%·XP +30.93%·브라데스쿠 +18.76%, 레나 −6.73%·치폴레 −4.67%**
산업용 소프트웨어 업체 PTC(PTC)는 프랑스 슈나이더 일렉트릭이 약 \$220억에 전액 현금으로 인수하기로 하면서 **\$192.26(+\$48.23, +33.49%)**로 뛰었다. 물류에서는 C.H. 로빈슨(CHRW)이 RXO를 주당 현금 \$17.25와 자사주 0.0856주를 주는 방식으로 사들이기로 했는데 내재 가치는 약 \$58억이며, 인수자인 C.H. 로빈슨은 저가 \$132.05(−16.27%)를 거쳐 **\$140.61(−10.85%)**, RXO(RXO)는 **\$28.65(+22.54%)**로 엇갈렸다. 백신 개발사 백사이트(PCVX)는 21가 폐렴구균 백신 VAX-31의 성인 대상 임상 3상(OPUS-1)이 모든 1차 평가지표를 충족했다는 발표에 장중 \$90.75(+60.68%)까지 올랐다가 장 마감 뒤 유상증자·전환사채 발행 계획을 앞두고 **\$73.82(+30.70%)**로 마감했다. 브라질에서는 대선 1차 투표에서 플라비우 보우소나루 후보가 약 47%를 얻어 룰라 대통령(약 45%)을 여론조사 예상보다 앞서자 금융주 ADR이 급등해 이타우 우니방쿠(ITUB) \$9.92(+15.48%), 브라데스쿠(BBD) \$4.33(+18.76%), XP(XP) \$28.15(+30.93%), 누뱅크(NU) \$15.18(+13.03%)를 기록했고 헤알화는 4% 넘게 올라 달러당 5.00 아래로 내려왔다. 반면 금리에 민감한 주택건설 레나(LEN)는 \$74.44(−6.73%), 치폴레(CMG)는 \$30.85(−4.67%)로 내렸다. 나이키(NKE)는 S&P글로벌이 신용등급을 A+에서 A로 낮추고 전망을 '부정적'으로 매기자 장중 \$32.76(−3.28%)까지 밀렸다가 \$33.96(+0.27%)로 회복했고, 드래프트킹스(DKNG)는 \$19.60(+5.43%), 비자(V)는 \$369.71(+2.51%)였다.

**⑥ 🇰🇷 국내 증시 10/5 개천절 대체공휴일 휴장 — 코스피 직전 종가 7,003.74(10/2), 이번 주는 10/6~8 사흘 거래, SKHY \$195.02(−0.06%)·괴리율 약 +43%, 10/8 삼성전자 3분기 잠정실적**
국내 증시는 10/5(월) 개천절 대체공휴일로 휴장해 코스피는 10/2 종가 **7,003.74**, 원/달러 환율은 1,350.6원에 머물러 있다. 따라서 10/6(화) 개장에는 금요일 미국장(나스닥 +1.19%·필라델피아 반도체 +2.40%)과 월요일 미국장(나스닥 +1.05%·필라델피아 반도체 +0.28%) 두 거래일의 결과가 한꺼번에 반영된다. 미국에서는 SK하이닉스 ADR(SKHY)이 시가 \$193.64·저가 \$190.42(−2.41%)·고가 \$195.97을 거쳐 **\$195.02(−\$0.11, −0.06%)**로 마감했고, 괴리율은 ADR 10주 = 원주 1주 기준 10/2 원주 종가 1,841,000원과 환율 1,350.6원으로 계산하면 약 +43%다. 이번 주는 10/9 한글날 휴장으로 10/6~8 사흘만 열리며, 10/8(목) 삼성전자 3분기 잠정실적(영업이익 컨센서스 약 108조원)이 최대 변수다. 해석하면 엔비디아 사상 최고·TSMC +2.75%는 반도체 대형주에 우호적이지만, 미국 10년물 5.315%의 52주 최고와 마이크론 −1.02% 등 메모리 약세는 상단을 제한할 변수다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) +2.12% — 장중 \$240.10으로 이틀 연속 사상 최고, 시가총액 약 \$5.8조, \$1,500억 자사주 매입 추가·모건스탠리 '최선호주' 재지정 효과 지속**
엔비디아는 시가 \$236.09에서 고가 \$240.10(+2.63%)까지 오르며 금요일 \$237.87에 이어 장중 사상 최고를 다시 쓴 뒤 \$238.90(+\$4.95, +2.12%)로 마감했다. 시가총액은 약 \$5.8조로 불어났고 올해 상승률은 약 28%다. 지난주 발표한 \$1,500억 규모 자사주 매입 추가 승인과 모건스탠리의 비중확대 의견·'최선호주' 재지정이 매수의 근거로 거론됐고, 폭스콘이 3분기 매출 3조300억 대만달러(+47%)로 예상(2조8,300억)을 웃돌았다고 발표한 것도 AI 서버 수요를 확인시켰다. 10년물 금리가 5.315%로 52주 최고를 썼지만 엔비디아의 강세로 나스닥은 27,477.31(+1.05%)로 사상 최고 종가를 기록했다.

**2. 마이크로소프트 (MSFT) +1.48% — 'AI의 어른' 평가와 함께 매수 의견 상향 보도, 짐 크레이머 "코파일럿의 시간, 큰 움직임 온다", 유료 M365 코파일럿 3,000만 석 돌파**
마이크로소프트는 시가 \$521.82에서 고가 \$532.35(+2.86%)까지 오른 뒤 \$525.18(+\$7.65, +1.48%)로 마감했다. 인베스터스 비즈니스 데일리와 배런스는 마이크로소프트가 AI 경쟁에서 '어른 역할'을 하는 기업으로 평가받으며 투자의견이 매수로 상향됐다고 보도했고, 짐 크레이머는 장 시작 전 "코파일럿의 시간이다, 큰 움직임이 온다"고 했다. 회사는 7월 실적 발표에서 유료 M365 코파일럿 사용자가 3,000만 석을 넘었고 인텔리전트 클라우드 매출이 \$393.1억(+32%)이라고 밝힌 바 있다. 시장 평균 목표가는 약 \$578.82이며 주가는 52주 최고 \$549.20보다 약 4% 낮은 수준이다.

**3. PTC (PTC) +33.49% — 슈나이더 일렉트릭이 약 \$220억에 전액 현금 인수 합의, 산업용 설계·제품수명주기 관리(PLM) 소프트웨어 확보**
PTC는 시가 \$195.84로 갭 상승해 고가 \$196.05(+36.12%)를 찍은 뒤 \$192.26(+\$48.23, +33.49%)로 마감했다. 프랑스 전력·자동화 기업 슈나이더 일렉트릭은 PTC를 약 \$220억(기사에 따라 \$226억) 규모에 전액 현금으로 인수하기로 합의했다고 발표했다. PTC는 3D 설계(CAD)와 제품수명주기 관리(PLM) 소프트웨어를 만드는 회사로, 슈나이더는 산업 자동화 하드웨어에 설계·운영 소프트웨어를 결합하려는 전략이다. 이날 거래는 S&P500 상승을 받친 M&A 재료로 꼽혔고 프리마켓 상승률은 +36.08%였다.

**4. C.H. 로빈슨 (CHRW) −10.85% — RXO를 주당 현금 \$17.25+자사주 0.0856주에 인수, 내재 가치 약 \$58억, 2027년 상반기 종결 목표**
C.H. 로빈슨은 시가 \$140.67에서 저가 \$132.05(−16.27%)까지 밀렸다가 \$140.61(−\$17.11, −10.85%)로 마감했다. 회사는 화물 중개업체 RXO를 RXO 1주당 현금 \$17.25와 C.H. 로빈슨 주식 0.0856주를 주는 방식으로 인수하기로 했고 거래의 내재 가치는 약 \$58억이다. 대가에 주식이 섞여 있어 기존 주주의 지분 희석과 화물 경기 둔화 속 대형 인수에 대한 우려가 주가를 눌렀고, 반대로 RXO(RXO)는 \$28.65(+22.54%)로 뛰었다. 거래는 규제 승인을 거쳐 2027년 상반기 종결이 목표다.

**5. 백사이트 (PCVX) +30.70% — 21가 폐렴구균 백신 VAX-31 성인 임상 3상(OPUS-1) 모든 1차 평가지표 충족, 미즈호 매수·목표가 \$163 유지, 장 마감 뒤 증자 발표**
백사이트는 시가 \$87.21로 급등 출발해 고가 \$90.75(+60.68%)를 찍었다가 \$73.82(+\$17.34, +30.70%)로 상승 폭을 줄여 마감했다. 회사는 성인 대상 VAX-31 임상 3상 OPUS-1에서 모든 사전 지정 1차 평가지표를 충족했으며 기존 백신과 겹치는 혈청형에서는 비열등성, 백사이트만 포함한 여러 혈청형에서는 우월성을 보였다고 발표했다. 미즈호는 데이터가 "매우 깨끗하다"며 매수 의견과 목표가 \$163을 유지했고, 시장 규모는 약 \$80억으로 거론된다. 다만 장 마감 뒤 보통주·전환사채 발행 계획을 발표해 시간외 거래에서는 희석 부담이 반영될 수 있다.

**6. 이타우 우니방쿠 (ITUB) +15.48% — 브라질 대선 1차 투표에서 플라비우 보우소나루 약 47%로 룰라(약 45%) 앞서, 헤알화 4% 넘게 급등·브라질 금융주 동반 랠리**
이타우 우니방쿠 ADR은 시가 \$9.83에서 고가 \$10.19(+18.63%)까지 오른 뒤 \$9.92(+\$1.33, +15.48%)로 마감했다. 일요일 치러진 브라질 대선 1차 투표에서 플라비우 보우소나루 후보가 약 47%를 얻어 약 45%의 룰라 대통령을 여론조사 예상보다 앞섰다는 개표 결과가 발표됐고, 결선 투표는 이달 중 치러진다. 시장 친화적 정책 기대에 은행 실적 전망 상향과 투자의견 재평가 기대가 겹치며 브라질 대형 은행주에 매수가 몰렸다. 헤알화는 4% 넘게 올라 달러당 약 5.22에서 5.00 아래로 내려왔고 보베스파 선물은 8% 넘게, MSCI 브라질 ETF는 16% 넘게 뛰었다. 폰토벨의 티에리 라로즈는 "브라질 자산 전반에 강한 랠리를 예상한다"며 시장이 새 지도자에게 "의심의 여지를 줄 것"이라고 했다.

**7. XP (XP) +30.93% — 브라질 대선 결과에 따른 브라질 자산 재평가, 장기 할인 해소 기대, 고가 \$29.00**
브라질 증권·자산관리 플랫폼 XP는 시가 \$25.84에서 고가 \$29.00(+34.88%)까지 오른 뒤 \$28.15(+\$6.65, +30.93%)로 마감했다. 대선 1차 투표에서 시장 친화적 후보로 평가받는 플라비우 보우소나루가 룰라 대통령을 약 2%p 앞서자 거래량과 자금 유입에 민감한 증권 플랫폼 주가가 가장 크게 반응했다. 인베스팅닷컴은 투자자들이 그동안 길게 이어진 할인을 해소하며 주가를 컨센서스 밸류에이션 쪽으로 재평가하고 있다고 분석했다. 같은 날 브라데스쿠(BBD)는 \$4.33(+18.76%), 누뱅크(NU)는 \$15.18(+13.03%)로 올랐다.

**8. 인텔 (INTC) −2.63% — 일론 머스크가 텍사스 '테라팹' 반도체 프로젝트에 TSMC 합류 가능성 확인, 인텔은 첫 참여 기업이었으나 위탁생산 경쟁 우려**
인텔은 시가 \$115.57·저가 \$115.31(−3.37%)까지 밀린 뒤 \$116.19(−\$3.14, −2.63%)로 마감했다. 일론 머스크는 텍사스에 짓는 반도체 생산 프로젝트 '테라팹'에 TSMC가 합류할 수 있다고 확인했는데, 인텔은 이 프로젝트를 처음으로 지지한 기업이어서 수주 독점 기대가 약해졌다는 해석이 나왔다. 반면 TSMC(TSM)는 \$485.80(+2.75%)로 올라 두 회사 주가가 정반대로 움직였다. 인텔은 지난 금요일에도 고가 \$126.00에서 밀려 \$119.33(−0.56%)로 마감한 바 있어 이틀 사이 고점 대비 약 8% 내려왔다.

**9. 모더나 (MRNA) +6.95% — 10월 9일 나스닥100 편입 발효를 앞두고 지수 추종 매수 기대, 고가 \$205.76**

나이키는 시가 \$33.82에서 저가 \$32.76(−3.28%)까지 밀렸다가 \$33.96(+\$0.09, +0.27%)로 강보합 마감했다. 신용평가사 S&P글로벌 레이팅스는 나이키의 신용등급을 A+에서 A로 한 단계 낮추고 등급 전망을 '부정적'으로 제시했으며, 더딘 실적 회복과 중화권 부진, \$10억 규모의 추가 구조조정 비용을 이유로 들었다. 나이키는 지난주 회계연도 1분기 매출 \$112.1억(예상 \$113.3억)과 2027 회계연도 매출 한 자릿수 후반 감소 전망, 5년간 \$25억 비용 절감 계획을 내놓아 금요일 −3.64% 하락한 바 있다. 주가가 10여 년 만의 최저 수준에 머물러 있어 신용등급 하향에도 추가 매도는 제한된 모습이었다.
