### 2026년 10월 11일(일) 작성 · 미국 정규장 휴장 · 직전 세션: 10월 9일(금)

## 🗓 주말 요약

**① 한 주의 결론은 '지수는 사상 최고를 찍고 지켰고, 반도체는 꺾였다'**
S&P500은 10/6(화) 7,818.93, 나스닥은 같은 날 27,599.79로 나란히 사상 최고 종가를 쓴 뒤 사흘간 숨을 고르고 금요일 반등으로 마쳤다. 주간으로는 S&P500 **+1.15%**, 다우 **+0.93%**, 나스닥 **+0.64%**로 3대 지수가 모두 올랐지만, 필라델피아 반도체지수(SOX)는 **−4.30%**로 홀로 크게 밀렸다. 목요일 하루 SOX **−3.39%**가 결정적이었고 금요일에도 −0.41%로 반등에 실패했다. 러셀2000은 주간 하락이었다. 지수 상승을 이끈 것은 반도체가 아니라 헬스케어·부동산·산업재로의 순환매였다.

**② 10년물은 장중 5.35%로 2002년 이후 최고권을 찍고 5.24%로 내려왔다**
9월 ISM 서비스업 가격지수 **74.0**과 9월 FOMC 의사록의 "연내 추가 인상 예상" 문구에 10년물은 수요일 장중 **5.35%**까지 올랐다. 그러나 금요일 종가는 **5.24%**로 주간 **−0.05%p**, 2년물은 **4.80%**로 주간 **−0.04%p**였다. 30년물은 **5.60%**다. 금요일 10월 미시간대 소비자심리 예비치는 **46.3**으로 예상치 47.6을 밑돌았다. 의사록은 추가 인상을 '보험성'으로 표현했고, 시장의 시선은 10/14(현지) 9월 CPI로 옮겨 갔다.

**③ 유가는 \$87~\$92 박스 — G7 비축유 방출과 호르무즈 긴장이 맞섰다**
WTI는 G7의 원유·디젤 최대 **1억 배럴** 방출 합의로 화요일 **\$87.77**까지 밀렸다가, 페르시아만 유조선 공격과 멕시코만 허리케인 이사이아스로 다시 올라 금요일 **\$91.85**(주간 **+0.81%**)로 마쳤다. 브렌트는 **\$104.72**다. 허리케인으로 멕시코만 원유 생산의 약 **63%**(하루 약 128만 배럴)가 멈췄고, 트럼프 대통령은 11월 3일 중간선거 전에는 이란을 공격하지 않겠다고 밝혔다. 이란은 호르무즈를 7일 안에 다시 여는 방안에 대한 미국 측 답변을 검토 중이다.

**④ SK하이닉스 ADR 주간 −13.38% — 메모리가 이번 주 가장 크게 빠졌다**
SKHY는 \$195.13에서 **\$169.03**으로 한 주에 **−13.38%** 밀렸다. 화요일 시게이트 −9.18%·웨스턴디지털 −6.93%와 함께 **−6.39%**, 목요일 SOX 급락에 **−4.35%**, 금요일 **−0.86%**로 엿새째 약세다. 마이크론(MU)은 금요일 \$1,029.00(−0.66%)였다. 오픈AI의 9월 연환산 매출이 약 **\$500억**으로 앞서 거론된 수치보다 약 \$200억 적다는 보도, 아이폰 18 프로 부품 주문 **15~20%** 감축 보도, HP의 2027년 PC 출하 감소 전망이 AI 수요와 메모리발 가격 부담을 동시에 건드렸다.

**⑤ 금요일은 스페이스X가 통신 업종을 흔들었다**
스페이스X(SPCX)가 그레인 매니지먼트로부터 800MHz 저대역 주파수를 약 **\$80억**에 사들이기로 하자 위성-휴대폰 직접통신이 기존 통신사를 위협할 수 있다는 우려로 티모바일(TMUS) **−13.27%**, AT&T(T) **−9.81%**, 버라이즌(VZ) **−8.75%**가 급락했고 통신탑 업체 크라운캐슬(CCI)은 **+15.60%** 뛰었다. 스페이스X 본주는 바클레이스의 '매수'·목표주가 \$254 커버리지 개시와 함께 **+1.25%(\$162.57)**로 마감했다.

**⑥ 한국은 10/9 한글날 휴장 — 10/12(월) 사흘 만에 연다**
코스피200 야간선물은 10/8 세션 **1,028.95(−1.84%)**가 마지막 값이다. 그 뒤 미국은 목요일 반도체 급락(SOX −3.39%)과 금요일 지수 반등(S&P500 +0.59%)을 모두 거쳤으므로, 월요일 국내 개장은 이틀치 미국장을 한꺼번에 반영한다.

## 📰 섹션 1. 한 주간(10/5~10/9) 주요 뉴스 5선

**1. S&P500·나스닥 사상 최고 종가 — 엔비디아 장중 \$240.10, AMD 장중 \$658.52 최고**
10/5(월) 나스닥은 27,477.31(+1.05%)로 사상 최고 종가를 썼고 엔비디아(NVDA)는 장중 **\$240.10**, 시가총액 약 **\$5.8조**로 최고가를 다시 썼다. 10/6(화)에는 S&P500 **7,818.93**·나스닥 **27,599.79**가 나란히 사상 최고 종가였고 AMD는 장중 **\$658.52**, 마벨은 인베스터 데이에 **+5.81%**였다. 그러나 금요일 엔비디아는 \$229.28로 고점 대비 약 4.5% 아래에서 마쳤다.
**투자자 함의:** 지수 신고가와 반도체 약세가 같은 주에 나왔다. 상승의 폭이 대형 기술주에서 방어·실적 업종으로 넓어지는 국면이라 국내 반도체 대형주에 대한 미국발 지원은 지수 수치보다 약하다.

**2. 10년물 장중 5.35% — 9월 FOMC 의사록 "연내 추가 인상 예상"**
10/7(수) 공개된 9월 FOMC 의사록에서 다수 위원이 연내 추가 인상을 예상한 것으로 나타나 10년물은 장중 **5.35%**로 2002년 이후 최고권에 올랐다. 이에 앞서 9월 ISM 서비스업은 **55.9**, 가격지수는 **74.0**(예상 73)으로 물가 압력을 보여 줬다. 목요일 신규 실업수당 청구는 **19.7만 건**으로 예상을 밑돌아 고용도 견조했다. 다만 10년물은 금요일 **5.24%**로 마쳐 주간으로는 오히려 내렸다.
**투자자 함의:** 10/28 FOMC의 추가 인상 여부는 10/14(현지) 9월 CPI가 가른다. 10년물 5.3%대 재진입은 성장주 할인율 부담을 다시 키우는 신호다.

**3. 반도체 '좁은 하락' — 목요일 SOX −3.39%, 주간 −4.30%**
10/8(목) 엔비디아 −2.94%, AMD −3.90%, 브로드컴 −4.35%, TSMC −3.01%, 마이크론 −4.79%, 샌디스크 −4.90%, 루멘텀 −5.62%, AAOI −13.58%가 동시에 밀렸지만 S&P500 상승 종목 비중은 **50.3%**로 하락보다 많았다. 금요일에는 오픈AI 9월 연환산 매출이 약 **\$500억**에 그쳤다는 보도가 반등을 막았고, 루멘텀만 CEO의 '2029년 초까지 생산능력 매진' 발언에 **+5.22%** 반등했다.
**투자자 함의:** AI 인프라 내부에서 '수요가 확인된 곳'과 '기대가 앞선 곳'이 갈리고 있다. 광부품처럼 증설 계약이 숫자로 확인된 쪽이 먼저 반등했다.

**4. 유가 — G7 1억 배럴 방출 vs 페르시아만 유조선 공격·멕시코만 허리케인**
G7의 비축유 방출 합의로 브렌트는 10/6(화) \$98.67까지 내려 \$100 아래로 갔지만, 사우디 공항 피격과 페르시아만 유조선 공격, 미국의 대이란 공습 준비 보도가 이어지며 목요일 장 초반 \$107을 넘었다. 금요일에는 트럼프 대통령의 "중간선거 전 이란 공격 없음" 발언과 이란의 호르무즈 재개방 검토 소식이 상단을, 허리케인 이사이아스에 따른 멕시코만 생산 **63%** 중단이 하단을 받쳐 WTI **\$91.85**, 브렌트 **\$104.72**로 마쳤다.
**투자자 함의:** 중동 군사 위험은 선거 일정에 묶여 다소 누그러졌지만 공급 차질이 유가를 \$90대에 묶어 두고 있다. 국내 정유주에는 우호적이고 항공·화학에는 원가 부담이 이어진다.

**5. M&A·실적 — 슈나이더의 PTC 인수, 구글-컨스텔레이션 원전 계약, 델타 가이던스 하향**
슈나이더 일렉트릭의 약 **\$220억** 전액 현금 PTC 인수(PTC +33.49%), 구글과 컨스텔레이션 에너지의 **890MW** 신규 원전 20년 계약(컨스텔레이션 +12.25%), 맥케슨·CD&R의 옵션 케어 헬스 인수 협상(+32.65%)이 한 주 동안 나왔다. 금요일 델타항공(DAL)은 2년 만에 처음 이익 예상치를 밑돌고 2026년 조정 EPS 가이던스를 **\$5.10~\$5.60**(기존 \$6.50~\$7.50)으로 낮췄지만 주가는 **+0.04%**로 버텼다.
**투자자 함의:** AI 전력 수요를 겨냥한 장기 원전 계약과 산업용 소프트웨어 인수가 이어지면서 'AI 인프라 수혜'의 범위가 반도체 밖으로 넓어지고 있다. 다음 주부터 시작되는 3분기 실적 시즌에서 가이던스 하향이 주가에 얼마나 반영되는지가 관건이다.

## 🌙 섹션 2. 휴장·주말 점검 5선

**1. 스페이스X 주파수 인수의 후폭풍 — 통신 3사 시가총액 하루 급감**
스페이스X가 확보한 800MHz 저대역 주파수는 건물 안까지 잘 닿는 대역이라 위성-휴대폰 직접통신의 실내 품질을 끌어올릴 수 있다. 티모바일 **−13.27%**·AT&T **−9.81%**·버라이즌 **−8.75%**의 금요일 낙폭은 주말 동안 증권가의 경쟁 영향 분석으로 이어질 재료다.
**관전 포인트:** 월요일 미국 통신주의 추가 하락 여부와 크라운캐슬 등 통신탑 업체의 수혜 지속성이 확인 대상이다. 국내 통신주 투자심리에도 경계 요인이다.

**2. 허리케인 이사이아스 — 멕시코만 원유 생산 약 63% 중단, 플랫폼 121곳 인력 철수**
3등급 허리케인으로 하루 약 **128만 배럴**의 생산이 멈춘 상태로 주말을 맞았다. 복구 속도가 월요일 유가의 방향을 정한다.
**관전 포인트:** 생산 재개가 빠르면 WTI \$90 아래 재시도, 지연되면 브렌트 \$105 위 안착 가능성이 있다.

**3. 이란의 호르무즈 재개방 답변 — '7일 안에 재개방' 방안 검토 중**
이란이 호르무즈 해협을 7일 안에 다시 여는 방안에 대한 미국 측 답변을 검토하고 있고, 트럼프 대통령은 중간선거(11/3) 전 이란 공격 계획이 없다고 밝혔다.
**관전 포인트:** 재개방 수용이 확인되면 유가 급락·항공·화학 반등, 결렬되면 유가 재급등이라는 양방향 재료다. 답변 시한은 10월 셋째 주다.

**4. 9월 CPI(10/14 현지) — 9월 인상 이후 첫 물가 지표**
10월 미시간대 소비자심리 예비치 **46.3**은 생활비 부담을 보여 줬고, 의사록은 추가 인상을 '보험성'으로 규정했다. 10년물 **5.24%**, 2년물 **4.80%**에서 CPI를 맞는다.
**관전 포인트:** 예상 상회 시 10/28 FOMC 추가 인상 확률이 올라가고 10년물 5.3%대 재진입, 하회 시 동결 기대와 함께 성장주 반등 여지가 생긴다.

**5. 콜럼버스 데이(10/12) — 미국 주식 개장·채권 휴장, 대형 은행 3분기 실적 시작**
월요일 미국 채권시장은 쉬고 주식시장만 열린다. 이어 대형 은행들의 3분기 실적이 시작돼 금리 5%대에서의 대출 마진과 투자은행 수수료가 확인된다.
**관전 포인트:** 채권 휴장일은 거래가 얇아 금리 신호가 약하다. 은행 실적은 높은 금리가 신용 비용으로 번지는지를 보여 줄 첫 지표다.

## 🔭 섹션 3. 다음 개장일(10/12 월) 섹터별 전망

미국은 **10월 12일(월)** 주식시장이 정상 개장하고 채권시장은 콜럼버스 데이로 휴장한다. 한국은 사흘 만에 열리며 미국보다 먼저 이틀치 미국장을 반영한다.

**⬆️ 우호적 재료가 있는 섹터**

**헬스케어·보험** — 금요일 업종 +1.48%, 휴매나 +11.56%(메디케어 어드밴티지 별점 4개 회복), 모더나 +14.21%(나스닥100 재편입). 금리 고점 국면의 방어주 선호가 이어지고 있다.

**광통신·AI 포토닉스** — 루멘텀 +5.22%(\$1,103.36), AAOI +3.53%. 생산능력이 2029년 초까지 매진됐다는 발언은 국내 광트랜시버·광부품주에 우호적이다.

**정유·에너지** — WTI \$91.85·브렌트 \$104.72, 멕시코만 생산 차질이 하단을 받친다.

**⬇️ 부담이 큰 섹터**

**메모리 반도체** — SKHY 주간 −13.38%·엿새째 약세, SOX 주간 −4.30%. 국내 메모리 대형주는 목요일·금요일 미국 약세를 월요일에 한꺼번에 반영해야 한다.

**스마트폰·PC 부품** — 아이폰 18 프로 부품 주문 15~20% 감축, HP 2027년 PC 출하 한 자릿수 중반 감소 전망. 국내 애플 공급망(카메라 모듈·기판)과 PC용 부품주에 부담이다.

**통신** — 스페이스X발 경쟁 우려로 미 통신 3사가 −8~−13% 급락했다.

**⚠️ 방향이 갈리는 곳**

**항공·화학** — 이란의 호르무즈 재개방 답변 결과에 따라 유가가 양방향으로 움직일 수 있다. 델타의 가이던스 하향에도 주가가 버틴 것은 수요가 아직 견조하다는 신호다.
