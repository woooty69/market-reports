## 🗓 주말 요약

**① 이번 주의 주인공은 수요일 FOMC다 — 인상은 가격에 들어갔고, 남은 것은 점도표와 워시의 입이다**
연준은 9/15~16 FOMC를 열고 한국시간 9/17(목) 03:00에 결과를, 03:30에 케빈 워시 의장의 기자회견을 내놓는다. CME 페드워치 기준 0.25%p 인상 확률은 9/12 오후 **86.3%**(뉴스1 집계 87.3%)로, 현재 **3.50~3.75%**에서 **3.75~4.00%**로의 인상이 기본 시나리오다. JP모건 수석 이코노미스트 마이클 페롤리는 "근원 PCE가 올해 매달 3%를 웃돌았고 2%를 향한 진전이 거의 없다"며, 7월 회의에서 카시카리·해맥·로건 세 명이 인상 소수의견을 냈던 만큼 이번에 인상하면 만장일치일 가능성이 높다고 봤다. 워시 의장은 잭슨홀에서 "물가 안정은 저절로 되지 않으며 인플레이션이 반드시 평균으로 회귀하지도 않는다"고 못 박았고, 트럼프 대통령은 주말에도 "미국이 세계에서 가장 낮은 금리를 적용받아야 한다"며 반대로 인하를 압박했다. 시장이 볼 것은 인상 자체가 아니라 **점도표의 최종금리**와 **30년물의 반응**이다 — 선물시장은 이미 2027년 말까지 세 차례 추가 인상(하나증권 집계로는 네 차례)을 반영하고 있어, 그보다 매파적이면 10년물 5% 돌파와 30년물 신고가가 재개되고, 그보다 온건하면 "부담 선반영" 인식으로 시중금리가 단기 정점을 만들 수 있다.

**② 오만 회의가 회의 전날 밤 연기됐다 — 금요일 유가 −2.37%의 근거가 사라졌다**
금요일 WTI가 \$100.05로 내린 것은 이란과 걸프국이 9/14 오만 살랄라에서 호르무즈 통항 문제를 논의한다는 보도 때문이었는데, 바드르 알부사이디 오만 외무장관이 9/13 밤 X에 "합의 도출을 위해 내일 회의를 연기한다"고 밝혔다. 파르스통신은 "일부 역내 국가들의 요청에 따른 이란·오만 공동 결정"이라고 전했고 새 일정은 없다. 참석을 공개 확인한 나라는 이라크뿐이었고 바레인은 "이란의 역내 기반시설 공격을 묵과할 수 없다"며 불참을 선언한 상태였다. 이란은 오만과 합의한 새 항로·해도를 설명하되 "해협 개방을 뜻하지 않으며 미국이 양해각서를 이행해야 한다"는 입장을 유지하고 있다(MBC·한국일보·뉴시스). 같은 날 호르무즈 게슘섬 인근에서 이란 상선 한 척이 피격돼 1명이 숨졌고, 영국 해군 해사무역기구(UKMTO)도 통과 선박 한 척의 발사체 피격을 확인했다. 트럼프 대통령은 미군 관여 여부에 "말하고 싶지 않다"고 답했다. 회의 기대로 내렸던 유가가 그 기대를 잃은 채 월요일을 맞는다는 뜻이고, 사우디 동서 송유관(하루 최대 500만 배럴)은 여전히 가동 중단, 미군의 호르무즈 호위는 하루 2회로 축소된 상태다.

**③ 트럼프는 '중간선거 후 종전'을 반복하면서 유가 책임을 우크라이나에 돌렸다**
트럼프 대통령은 9/13 "이란이 합의를 너무나 원해 끊임없이 전화해 온다"며 전쟁이 "50일 정도 뒤, 중간선거 전후"에 끝나고 휘발유 가격이 급락할 것이라고 거듭 말했다. 동시에 미국 경유 가격이 갤런당 **6달러**를 넘어 사상 최고를 기록한 데 대해 "이것은 중동 때문이 아니라 러시아·우크라이나 전쟁 때문"이라며 우크라이나에 러시아 경유 시설 공격 중단을 요구했다. 베네수엘라 모델을 거론하며 "남아서 석유를 확보하기로 결정하지 않는다면 결국 철수할 것"이라고도 했다. 이란 메흐르통신은 "이란이 합의를 원한다는 주장은 터무니없다"고 반박했다(SBS·MBC·YTN). 페제시키안 이란 대통령은 뉴델리 브릭스 정상회의에서 UAE 아부다비 왕세자와 전쟁 후 첫 회담을 했고, 브릭스는 '뉴델리 선언'에서 중동 자제를 촉구하되 특정국 책임은 묻지 않았다. 종합하면 **협상 신호(UAE 회담·트럼프 발언)와 실제 교전(상선 피격·회의 연기)이 같은 주말에 나왔고**, 폴리마켓 기준 연내 호르무즈 정상화 확률은 16%대에 머문다.

**④ AI 3사 CEO가 한목소리로 "속도를 늦추자"고 했고, 오픈AI는 올해 IPO를 접었다**
다리오 아모데이 앤트로픽 CEO가 9/12 블로그에 약 3,800단어의 에세이 「We Must Pace the Frontier」를 올려 "모델 성능 향상 속도를 의도적으로 늦추고, 외부 평가자에게 직원급 접근 권한을 주자"고 제안하자 샘 올트먼 오픈AI CEO가 "동의한다, 오픈AI도 따르겠다"고 했고 일론 머스크는 "다리오가 옳다", 데미스 허사비스는 "방향은 옳다"고 답했다. 같은 날 올트먼은 포천 인터뷰에서 **오픈AI가 올해 상장하지 않는다**며 "지금 IPO는 시기적으로 부적절하다"고 했고, AI가 10년 내 인류 멸종을 초래할 위험이 10%라도 있다면 "용납할 수 없다"고 말했다(CNBC·워싱턴포스트·포천). 사상 최대 IPO 후보가 2027년 이후로 밀린 것이다. 시장 함의는 두 갈래다 — 프런티어 모델 '성능 경쟁' 속도가 실제로 늦춰지면 GPU·HBM 수요 곡선의 기울기에 대한 의문이 생기지만, 3사 모두 "개발은 계속 빠르게 진행된다"고 단서를 달았고, 같은 주에 GPT-6 아스트라(ARC-AGI-3 62.7%)가 나와 에이전트 활용 확대에 따른 '제본스의 역설'(효율이 오를수록 총사용량이 는다) 서사가 국내 반도체의 상승 논리로 자리 잡은 상태다(뉴스1). 월요일 미국장에서 엔비디아(NVDA)·오라클(ORCL)·AI 인프라주가 이 뉴스를 어떻게 소화하는지가 첫 확인 지점이다.

**⑤ 국내는 '금요일 미국 반등 미반영분'과 '개인 13조 매도'가 동시에 걸려 있다**
코스피는 주간 **+3.33%(6,909.91)**였지만 9/11 하루 **−1.76%**로 7,000을 내줬고, 금요일 미국 3대 지수 반등(+0.86~0.98%)·SOX +1.81%·MSCI 한국지수 ETF **+3.25%**·코스피200 야간선물 **+0.97%**는 그 뒤에 나왔다. 수급은 구조가 바뀌었다 — 9월 들어 11일까지 **개인이 SK하이닉스(000660) 7조 8,180억원, 삼성전자(005930) 5조 2,120억원**을 순매도해 5개월 만에 '팔자'로 돌아섰고, 외국인도 이달 두 종목을 각각 1조 9,530억원·1조 9,660억원 팔았다(CBC·MTN). 지난주 코스피 전체로는 개인 **−9조 9,104억원**, 외국인 **−2조 1,259억원**, 기관 **+3조 5,900억원**, 그리고 양사 자사주 매입을 담은 기타법인 **+8조 4,906억원**이었다(서울경제·한국경제TV). 즉 **자사주 매입이 하단을 받치고 개인·외국인이 위에서 파는 구도**다. 원/달러는 7/10 1,501.4원에서 9/11 **1,345.9원**으로 두 달 새 10.4% 내려 삼성전자·SK하이닉스의 올해 합산 영업이익 컨센서스가 661조원에서 **640조원**으로 21조원 줄었다(한국경제TV·EBN). 이번 주 국내 고유 일정은 SK하이닉스 임단협 **9/15~16 재투표**(1차 부결이 25표 차)와 한국 8월 생산자물가(9/18)다.

## 🎯 이번 주 관전 포인트

**1. 금리 — '인상 여부'가 아니라 '인상 이후'를 본다**
2년물 4.630%(2024년 7월 이후 최고)·10년물 4.969%·30년물 5.34%는 이미 25bp 인상을 소화한 값이다. 하나증권 이재만은 선물시장이 내년 말까지 약 네 차례 인상을 반영하고 있어 "9월 인상 시 부담 일부가 선반영됐다는 인식이 형성될 수 있다"고 했고, 삼성증권 김종민은 "인상이 기대인플레이션을 진정시키면 주식시장이 불확실성 해소로 받아들일 가능성"을 짚었다. 반대로 NH투자증권 이상준은 "7월 회의에서 3명이 인상 소수의견을 낸 만큼 점도표 상향 가능성을 열어둬야 한다"고 했다. 갈림길은 점도표다 — 연말 두 차례 인상(블룸버그 반영치)보다 매파적이면 10년물 5% 돌파, 온건하면 시중금리 단기 정점.

**2. 유가 — 금요일 하락의 근거가 사라진 채 개장한다**
WTI \$100.05·브렌트 \$104.61은 오만 회의 기대를 반영한 값인데 회의는 연기됐고, 주말 사이 이란 상선 피격이 추가됐다. IEA는 올해 세계 산유량 감소분을 하루 570만 배럴로 추산하고, 사우디 동서 송유관 폐쇄·미군 호위 축소·바브엘만데브 후티 장악이 겹쳐 있다. 다만 트럼프의 '50일 내 종전' 발언과 UAE-이란 회담이라는 반대 방향 재료도 있어 월요일 아시아 시간대 원유 전자거래(07:00 KST 개장)의 첫 갭이 국내 정유·항공·화학의 초반 방향을 정한다. 유가가 오르면 인상 확률과 장기금리를 다시 밀어 올리는 경로가 이번 주 가장 큰 하방 위험이다.

**3. 반도체 — 미국 메모리는 갈렸고, 한국은 앞서 가 있다**
금요일 SOX +1.81%의 주역은 온세미컨덕터(ON) +8.51%·아나로그디바이스(ADI) +4.85% 등 아날로그·통신칩이었고, 마이크론(MU) −0.22%·샌디스크(SNDK) −3.50%·웨스턴디지털(WDC) −2.98%·시게이트(STX) −3.73%는 딥시크 V4.1 플래시(KV 캐시 HBM 소요 75%·SSD 87.5% 절감)와 중국 GPU 업체 엔플레임 상장 첫날 +179%로 밀렸다. 그 와중에 SKHY는 **+0.94%(\$190.07)**로 올라 주간 **+7.38%**를 기록했다. JP모건은 9/9 SKHY를 비중확대·목표주가 **\$245**(원주 환산 330만원대)로 커버리지를 개시하며 메모리 상승 사이클이 5년 이상, ASP 상승은 2028년 4분기 이후까지 이어진다고 봤고, 마이크론 대비 20% 할인을 근거로 들었다. KB증권 김동원은 3분기 삼성전자·SK하이닉스 메모리 재고가 **10일 미만**(통상 3~4주)이라 "판매 물량 자체가 고갈되는 초유의 사태"를 경고했다. 트렌드포스는 3분기 범용 D램 계약가격을 전 분기 대비 13~18% 상승으로 본다.

**4. 국내 — 반도체 밖으로 번지는지, 그리고 누가 사는지**
지난주 건설·건축 +12.8%, 기계 +11.9%로 반도체 +11.1%를 웃돌았고 외국인·기관 합산 순매수 상위 업종에 건설·상사·자본재·에너지가 올랐다(이데일리). 외국인은 이달 우리금융지주(316140) 4,760억원, SK스퀘어(402340) 4,510억원, 대한항공(003490) 2,130억원, SK이노베이션(096770) 1,850억원을 순매수했다. 반도체 대형주에 수급이 다시 집중되면 확산 탄력이 제한되고, 순환매가 이어지면 지수 상승의 폭이 넓어진다. 증권사 코스피 밴드는 NH투자증권 **6,400~7,400**, 대신증권 등 종합 6,400~7,400이다.

### 🇰🇷 한국 관전 포인트

**🇰🇷 [전달]** 코스피200 야간선물은 금요일 밤 시가 1,094.55에서 고가 1,107.50·저가 1,085.45를 오간 뒤 **1,098.85(+0.97%, +10.55)**로 마감해 정규장 선물 종가(1,088.30)보다 10.55포인트 위에 있다. 금요일 미국 반등과 MSCI 한국지수 ETF +3.25%는 국내 정규장 마감 뒤의 사건이라 아직 현물에 반영되지 않았다. 주간으로는 야간선물 +0.45% vs 코스피 +3.33%로 국내가 앞서 간 상태이며, 9/11 코스피 −1.76%(나스닥 +0.96%)가 보여주듯 금리·유가 충격을 받을 때 낙폭이 먼저 나오는 위치다. SKHY 괴리율은 **+40.1%(9/11 잠정) → +41.2%**(확정 종가 \$190.07 기준)로 소폭 확대됐고, 확대 원인은 ADR 상승(9/10 \$188.30 → \$190.07)이다. 9/4 +45.1%에서 좁혀진 흐름은 유지되지만 이번 축소는 국내 상승분(주간 +10.02%)이 만든 것이므로, 월요일에 국내가 ADR을 따라 오르면 괴리는 다시 좁아지고 국내가 밀리면 넓어진다. 원/달러 1,345.9원은 외국인 수급에 우호적이나 수출주 이익 컨센서스에는 이미 21조원 부담으로 반영됐다.

**🇰🇷 [수급]** SK하이닉스(000660) 외국인 수급은 9/7 **+772,036주 → 9/8 +97,545주 → 9/9 +41,716주 → 9/10 −956,724주 → 9/11 −606,502주**로, 9/10 대량 매도 뒤 9/11 매도 규모는 3분의 2로 줄었다. 그러나 기관이 9/10 +287,228주 순매수에서 9/11 **−274,533주** 순매도로 돌아섰고, 개인이 9/11 +277,145주로 받았다. 외국인 지분율은 50.67%(9/9) → **50.47%(9/11)**. 월 단위로는 개인이 9월 들어 SK하이닉스 7조 8,180억원을 팔아 4개월 연속 순매수(5월 이후)에서 순매도로 전환했고, 이 물량을 회사 자사주 매입(기타법인)이 흡수하는 구조다. 코스피 전체에서는 9/10 −2조 7,140억원, 9/11 −2조 2,915억원의 외국인 순매도가 이틀 연속 나왔다. 월요일 확인할 것은 외국인 순매도가 사흘째 감속하는지, 기관이 순매수로 복귀하는지, 그리고 9/15~16 임단협 재투표를 앞두고 자사주 지급 방식(현금 50%·주식 50%, 주식 비중 최대 100% 선택)에 대한 시장 해석이다 — 회사 보유 자사주를 임직원에게 넘기는 방식이라 유통주식 증가 요인으로 볼 여지가 있다.

## 💬 증권가 코멘트

- **NH투자증권 이상준 — 코스피 밴드 6,400~7,400.** "기준금리 결정보다 점도표와 워시 의장 발언에 따른 미국 30년물 금리의 방향이 더 중요하다. 선물시장에는 2027년까지 세 차례 추가 인상이 반영돼 있고 7월 회의에서 3명이 인상 소수의견을 냈던 만큼 점도표 상향 가능성을 열어둬야 한다." 상승 요인은 유가 하락·아스트라 효과, 하락 요인은 미·이란 전쟁 격화·시장금리 추가 상승. "변동성 확대와 펀더멘털 훼손은 구분해야 한다."

- **삼성증권 김종민 — "금리 인상이 단행될 경우 기대인플레이션이 진정되며 '불확실성 해소'로 받아들여질 가능성도 높다."** 유가·금리가 상단을 제한하되 AI 투자·기업 이익이 하단을 받치는 구도. 삼성전자·SK하이닉스 자사주 매입과 실적이 코스피 하단 지지.

## 📰 주말 체크한 기타 뉴스

- **이란, 지하시설에서 탄도미사일 생산 재개(WSJ).** 미·중동 당국자를 인용해 호지르 등 지하시설에서 저율 생산이 재개됐고 새 지하 조립시설도 건설 중이라고 보도했다. 다만 액체추진제 화학시설과 고체연료 혼합기는 파괴된 상태다. 빈 살만 사우디 왕세자는 트럼프에 두 차례 전화해 후티 직접 타격을 요청했으나 거절당했고, 미국은 대신 정보·표적 자료 제공과 군사고문 100여 명 파견을 택했다(악시오스·CNN). 이스라엘은 레바논 남부 헤즈볼라 터널 8개(총 5.4km)를 폭약 1,100톤으로 파괴 완료했다.
- **트럼프, 시진핑 방미(9/24) 앞두고 "중국이 미국에 車공장 지어도 괜찮다".** 폭스뉴스 인터뷰(9/11)에서 미국 내 생산은 용인하되 멕시코 우회 수출은 불가라고 선을 그었다. 교도통신은 중국이 "9/24 전 대만 무기판매 승인 시 회담 보류"를 미국에 통보했다고 보도했다. 미국 완성차 업계는 반발.
- **트럼프 '1인당 5,000달러 배당금' 재원 혼선.** 성인 2억 4,000만 명 기준 1조 2,000억 달러가 필요한데 러트닉 상무장관은 '플래티넘 카드'로 5,000억 달러, 밴스 부통령은 관세 수입을 재원으로 제시했다. CBO 기준 지난해 10월~올해 8월 관세 수입은 1,673억 달러(+1.2%), 향후 10년 연간 최대 4,240억 달러다(NBC·서울경제).
- **미국 주식펀드 주간 322억 7,000만 달러 순유출, 대형주 펀드 404억 4,000만 달러로 사상 최대(LSEG 리퍼).** 지수가 고점 근처인데 자금은 빠지는 조합이다.
