## 🗓 시장 요약

**① 코스피 '전강후약' 0.29% 반등 — 기관 7,529억원 매수, 개인 1조원 매도**
코스피는 전날 급락에 따른 저가 매수로 2%대 오르며 4,800선을 넘보다 금리 인상 발표 뒤 힘이 빠져 4,711.21로 마감했다. 개인이 1조 748억원을 순매도한 반면 기관이 7,529억원을 받아냈고 외국인은 880억원 순매도에 그쳐 전날(−1조 8,193억원)보다 매도가 크게 줄었다. 정부가 10조원대 증안펀드 증액을 검토하고 다음 주 금융권 긴급 점검 회의를 연다는 소식도 하단을 받쳤다.

**② 반도체: 하이닉스 105만원·삼성전자 17만원 사수, 삼성전기 3.8% 반등**
SK하이닉스는 2.23% 오른 1,053,000원, 삼성전자는 0.35% 오른 171,300원으로 마쳤고 두 종목 거래대금이 6조원을 넘었다. 삼성전기는 AI발 MLCC 가격 상승 기대에 장중 7%대까지 올랐다가 3.84% 상승으로 마감했다. 신현송 한은 총재는 올해 반도체 영업이익을 700조원으로 추정하면서 "반도체 시총이 2천조원으로 수익의 3배밖에 안 돼 설명하기 어렵다"고 말해 저평가 논쟁에 불을 붙였다. 삼성전자는 오늘(11/27) 약 30조원 규모의 배당금을 지급한다.

**③ 주도 업종: 창투·우주·엔터·화장품**
창업투자(+8.14%)·생명과학도구(+6.09%)·통신장비(+5.36%)·방송과엔터(+5.24%)·화장품(+3.61%)이 올랐다. 스페이스X의 우주 데이터센터용 위성 100만 기 배치가 승인됐다는 소식에 스페이스X 투자사인 미래에셋벤처투자, 부품사 스피어·에이치브이엠, 나노팀(상한가)·OCI홀딩스(+5.55%)가 급등했다. 한중 FTA 후속협상 타결과 해빙 기대에 하이브(+4.97%)·JYP(+4.62%)·에스엠(+4.05%)도 강했다.

**④ 약세 업종: 항공·자동차·통신**
항공화물운송(−3.21%)·항공사(−3.01%)·자동차(−2.86%)·무선통신(−2.79%)·자동차부품(−2.67%)이 약했다. 대한항공은 연말 노사 갈등에 따른 파업 긴장 속에 6.16% 떨어졌고, 현대차그룹은 무뇨스·송호성 사장 유임과 현대모비스 사장 교체(백철승) 인사를 냈지만 EU의 하이브리드 수입 쿼터(세이프가드) 부담 속에 현대모비스(−5.72%)·현대차(−3.90%)·기아(−2.40%)가 일제히 밀렸다.

**⑤ 금리·환율·외부 변수: 한은 3.25%로 인상, 성장률 4.1%로 '깜짝' 상향**
한은은 기준금리를 연 3.25%로 0.25%p 올리면서 황건일·이수형 위원이 동결 소수의견을 냈다. 올해 성장률 전망은 3.3%→3.9%, 내년은 2.9%→4.1%로 크게 높였고 점도표 상단이 3.75%까지 열려 증권가는 추가 인상 전망을 유지했다. 원/달러는 1,344.00원(하나은행 고시)으로 소폭 내렸고 미국은 추수감사절로 휴장, 오늘 밤은 조기 폐장한다.

**⑥ 코스닥 0.78% 상승 — 바이오·우주·보안 강세**
코스닥은 655.71로 5.07p 올랐고 기관이 2,378억원을 샀다. 보로노이(+18.17%)·올릭스(+13.51%)·알지노믹스(+14.98%) 등 바이오와 RFHIC(+11.94%)·케이엠더블유(+11.58%) 등 통신장비가 강했고, 해킹 우려 속 안랩(+4.18%)은 사상 최고가를 새로 썼다. 반면 에코프로비엠(−3.80%)·에코프로(−3.47%)·로보티즈(−2.77%)는 약했다.

## 1. 업종별 흐름

**상승 업종** — 창업투자(+8.14%, 49종목 상승/25종목 하락)는 스페이스X 위성 승인에 미래에셋벤처투자(+21.57%)·아주IB투자(+6.16%)가 끌어올렸다. 생명과학도구및서비스(+6.09%)·생물공학(+2.57%)은 보로노이·올릭스·쓰리빌리언 등 바이오 급등주가 주도했고, 통신장비(+5.36%, 41/10)는 RFHIC·케이엠더블유가 두 자릿수로 올랐다. 방송과엔터테인먼트(+5.24%)는 한중 해빙 기대, 화장품(+3.61%)은 에이피알(+2.23%)의 장 마감 후 3,900억원 M&A 발표, 전자장비와기기(+2.79%)는 삼성전기·대주전자재료(+11.45%)의 MLCC 기대가 이끌었다.

**하락 업종** — 항공화물운송과물류(−3.21%)·항공사(−3.01%)는 대한항공(−6.16%)과 현대글로비스(−3.37%)가 끌어내렸다. 자동차(−2.86%, 3/8)·자동차부품(−2.67%)은 현대모비스(−5.72%)·현대차(−3.90%)·현대오토에버(−4.12%)가 약했고, 무선통신서비스(−2.79%)는 SK텔레콤(−3.01%)이, IT서비스(−1.41%)·은행(−1.01%)도 동반 약세였다. 금리 인상 당일인데도 KB금융(−1.89%)·하나금융지주(−1.41%) 등 은행주가 내려 '선반영 후 차익'이라는 해석이 나왔다.

**시장의 시선** — 한은이 성장률 전망을 내년 4.1%로 올리며 추가 인상 여지를 남겨 성장주·고밸류주의 할인율 부담은 이어질 전망이다. 대신 메모리 2사 P/B가 5년 하위 5%라는 저평가 논리와 삼성전자 30조원 배당, 삼성SDI 1.4조원 자사주 소각 등 주주환원이 하단을 받치는 그림이다. 스페이스X 위성 승인으로 우주 테마가 다시 불붙었지만 흐름 전환 점검표상 우주 바구니는 여전히 '하락' 단계라 추격 매수보다 실적이 확인되는 종목 위주로 보는 시각이 많다. 미국 '과잉생산 관세' 세부안과 EU 하이브리드 세이프가드는 자동차 업종의 부담으로 남아 있다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
