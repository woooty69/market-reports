# 미국→한국 선점 2026-10-23 (미국 2026-10-22 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 75개 · 연결 종목 889개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 13개:** 화장품·K뷰티(격차 +14.0%p), Finance: Consumer Services(격차 +13.6%p), 유통·이커머스(격차 +12.9%p), 방산(격차 +11.3%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 음식료·K푸드, 물·환경, Oil & Gas Production, 바이오텍·기술수출 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** CDMO·바이오시밀러(-6.8%p)
- **이제 막 힘 붙는 조기 테마:** 방산(조기 60), 조선·LNG선·함정 MRO(조기 58), 바이오텍·기술수출(조기 58) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 한국콜마(화장품·K뷰티, 점수 100), 아모레퍼시픽(화장품·K뷰티, 점수 96), 코스맥스(화장품·K뷰티, 점수 82)
