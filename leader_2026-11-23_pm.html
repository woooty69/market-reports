## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** Advertising(격차 +18.4%p), Industrial Machinery/Components(격차 +14.3%p), 조선·LNG선·함정 MRO(격차 +13.1%p), 스마트폰·애플 부품(격차 +12.0%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 통신·5G, Real Estate Investment Trusts, 물·환경, 보험 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 사이버보안(-26.2%p), 항공·여행·카지노·면세(-22.3%p), Finance: Consumer Services(-14.0%p)
