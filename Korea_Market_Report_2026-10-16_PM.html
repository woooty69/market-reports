# 📊 한국증시 데일리 리포트 (저녁판)
### 2026년 10월 16일(금) 18시 작성 · 기준일: 10월 16일(금) 정규장 (저녁판)

> 10월 16일 정규장 마감과 장 마감 후 18시대까지 나온 뉴스·공시·증권사 리포트를 정리했습니다. '검은 목요일' 다음 날 코스피는 5,668.05(+2.05%)로 8거래일 만에 반등했고, 코스닥은 794.78(+4.46%)로 급등하며 장중 매수 사이드카가 발동됐습니다. 외국인이 코스피에서 순매수로 돌아섰고, 미국 국채금리 하락과 젠슨 황의 코어위브 관련 발언이 AI 신용위험 우려를 다소 누그러뜨렸습니다. 바이오·방산·화장품·자동차가 반등을 이끈 반면 항공(대한항공 −10.36%)과 2차전지 소재는 약했습니다.

*코스피는 전날보다 1.80% 높은 5,653.99로 출발해 장 초반 5,590.33까지 밀렸다가 오후 들어 5,809.94까지 오른 뒤 상승폭을 일부 반납하며 5,668.05(+2.05%)로 마감했다. 외국인이 3,621억원을 순매수하며 '팔자' 행진을 멈췄고 개인(−5,100억원)과 기관(−6,813억원)은 차익을 실현했다. 삼성전자(+2.86%)·삼성전자우(+6.10%)·현대차(+5.75%)·한화에어로스페이스(+7.89%)·셀트리온(+6.48%)이 지수를 끌어올렸고 SK하이닉스는 +0.48%에 그쳤다. 업종별로는 건강관리기술(+8.50%)·생물공학(+7.92%)·생명과학도구(+7.48%)·우주항공과국방(+6.07%)·화장품(+5.69%)·자동차(+5.29%)가 강했고, 항공사(−7.53%)·복합유틸리티(−1.30%)·전기제품(−0.69%)만 뚜렷하게 내렸다. 코스닥은 12시 55분 매수 사이드카가 발동되며 장중 807.54까지 올라 800선을 넘었다가 794.78(+4.46%)로 마감했다.*

## 🗓 시장 요약

**① 코스피 5,668.05(+2.05%), 8거래일 만의 반등…외국인 순매수 전환**
코스피는 113.83포인트 오른 5,668.05로 마감해 7거래일 연속 하락(누적 약 −20%)을 끊었다. 장중 고점 5,809.94까지 오르며 5,800선을 넘보기도 했지만 오후 들어 개인·기관 차익 매물에 상승폭이 1%대 후반으로 줄었다. 외국인은 코스피에서 3,621억원을 사들이며 순매수로 돌아섰고, 증권가는 "수급 회복은 아직 제한적"이라며 바닥 확인까지 단계적 접근을 권했다. 코스피 PER이 26년 만의 최저 수준이라는 분석도 나왔지만 매수 강도는 약했다.

**② 반도체: 삼성전자 +2.86%·SK하이닉스 +0.48%, 장비·테스트주가 더 강했다**
삼성전자는 216,000원(+2.86%)으로 반등했고 우선주는 6.10% 올랐지만 SK하이닉스는 0.48% 상승에 그쳤다. 대신 한미반도체(+9.00%)·피에스케이(+9.54%)·HPSP(+8.94%)·원익IPS(+5.55%)·엑시콘(+22.40%) 등 장비·테스트 업체가 강하게 튀었다. 간밤 필라델피아 반도체지수는 −0.88%였지만 젠슨 황 엔비디아 CEO가 코어위브에 대해 "별도 재정 지원은 필요 없을 것"이라고 말하며 코어위브 회사채 가격이 80.0에서 82.6으로 반등했고, SK증권은 삼성전자·SK하이닉스의 12개월 선행 P/E가 3.3배·3.0배로 극단적 다운턴을 선반영했다며 메모리 매수 적기를 주장했다.

**③ 주도 업종: 바이오·방산·화장품·자동차**
미국 국채금리 급락과 미국 헬스케어주 강세에 알테오젠(+9.37%)·셀트리온(+6.48%)·리가켐바이오(+9.24%)·삼성바이오로직스(+3.05%) 등 바이오가 일제히 올랐고, 엘앤씨바이오(+23.63%)·한스바이오메드(+25.07%)·리브스메드(+29.41%) 등 의료기기·미용 소재주가 급등했다. 중동 긴장이 다시 고조되며 한화에어로스페이스(+7.89%)·한화시스템(+5.73%) 등 방산주가 강했고, 원화 강세 우려를 털어낸 에이피알(+9.06%)·달바글로벌(+9.26%) 등 화장품과 현대차(+5.75%)·기아(+4.15%)·현대모비스(+4.30%) 등 자동차도 반등했다.

**④ 약세 업종: 항공·2차전지 소재·정유**
대한항공은 전날 장 마감 후 발표한 3분기 별도 영업이익 4,212억원이 컨센서스(약 5천억원대)를 밑돌았고 국제선 유류할증료가 3개월 연속 오르는 등 고유가 부담이 겹쳐 10.36% 급락했다. 2차전지 소재는 탄산리튬 재고평가손실로 3분기 적자전환이 예상된 엘앤에프(−9.74%)와 대주전자재료(−7.58%)·롯데에너지머티리얼즈(−4.89%)가 내렸고, 삼성SDI(−1.85%)·LG에너지솔루션(−0.37%)도 약보합이었다. 정유주 S-Oil(−3.70%)·SK이노베이션(−1.87%)과 LS에코에너지(−6.64%)도 약했다.

**⑤ 환율·금리·외부 변수**
미국 9월 PPI는 전년 대비 6.3%로 예상(5.3%)을 크게 웃돌았지만, 10년물 국채금리가 5.0%대로 내려오고 워시 연준의장의 발언이 비둘기파로 해석되며 뉴욕증시는 다우 +1.08%, S&P500 +0.33%로 반등했다. 원/달러 고시 환율은 1,332.50원으로 10.00원 내렸고, 국고채 3년물은 3.85%대로 하락했다. 아시아에서도 닛케이225가 1.39%, 항셍이 0.52% 올랐고 작성 시점 S&P500 선물은 +0.24%, 나스닥100 선물은 +0.29%다.

**⑥ 코스닥 794.78(+4.46%), 매수 사이드카 속 800선 일시 회복**
코스닥은 772.17로 출발해 12시 55분 매수 사이드카(프로그램 매수호가 5분 정지)가 발동됐고 장중 807.54까지 올라 800선을 회복했다가 794.78로 마감했다. 기관이 1,711억원을 순매수했고 개인(−937억원)과 외국인(−936억원)은 팔았다. 알테오젠·주성엔지니어링(+2.44%)·이오테크닉스(+5.44%)·리노공업(+5.65%) 등 시총 상위주가 고르게 올랐고, 우리로(+22.66%)·HT로보틱스(+24.34%)·서산(+22.22%)·에코앤드림(상한가) 등 재료주가 급등했다.

## 1. 업종별 흐름

**상승 업종** — 건강관리기술(+8.50%, 상승 13·하락 0)·생물공학(+7.92%)·인터넷과카탈로그소매(+7.85%)·생명과학도구및서비스(+7.48%)·컴퓨터와주변기기(+6.87%)·건강관리장비와용품(+6.55%)·우주항공과국방(+6.07%)·방송과엔터테인먼트(+5.84%)·화장품(+5.69%)·자동차(+5.29%)가 상위였다. 바이오는 미국 금리 하락과 일라이릴리 등 미국 헬스케어주 강세가 반발 매수를 불렀고 알테오젠(+9.37%)·셀트리온(+6.48%)·삼천당제약(+7.94%)·올릭스(+11.80%)가 앞장섰다. 방산은 중동 긴장 고조에 한화에어로스페이스(+7.89%)가, 엔터는 BTS 스포티파이 연간 100억 스트리밍 돌파 소식의 하이브(+7.75%)가, 자동차는 현대차(+5.75%)가 이끌었다.

**하락 업종** — 항공사(−7.53%, 상승 3·하락 6)가 유일하게 크게 빠졌고 복합유틸리티(−1.30%)·전기제품(−0.69%)·종이와목재(−0.65%)·전문소매(−0.63%)·도로와철도운송(−0.34%)·석유와가스(−0.21%)·가스유틸리티(−0.19%)가 소폭 약세였다. 항공은 대한항공(−10.36%)의 3분기 실적 쇼크와 유류할증료 상승에 따른 수요 둔화 우려가, 전기제품은 삼성SDI(−1.85%)·LS에코에너지(−6.64%)가, 석유와가스는 S-Oil(−3.70%)이 끌어내렸다. 반등장에서도 신한지주(−0.42%)·SK텔레콤(−0.51%)·HD현대중공업(−0.43%) 등 그동안 버팀목이던 방어주는 쉬어 갔다.

**시장의 시선** — 하루 만의 반등이지만 증권가 시각은 엇갈린다. 한화투자증권은 6,000pt 아래에서는 매수 대응을, 키움증권은 선행 PBR 1.0배인 5,100pt를 워스트 시나리오 저점권으로 제시했고, 대신증권은 매크로 부담 속 반등 난망을 경고했다. 다음 주에는 22일 한국은행 금통위(동결 전망 우세)와 빅테크 실적, 27～28일 FOMC를 앞두고 AI 인프라 자금조달 우려가 진정되는지가 관건이다. 야간선물은 개장 직후 883.40(+0.27%)로 출발했다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 53종목

*저녁판: 1～40번은 뉴스 후보 풀(최근 14시간 보도 건수) 순을 기본으로 거래대금·급등락·장 마감 후 공시를 고려해 골랐고(24·35·38·39번은 ★), 41～53번은 ★ 필수 편입(시총 1,000억원 이상 · +10% 이상 상승) 중 1～40번에 없는 종목이다. 등락률은 10/16 종가 기준.*

**1. SK하이닉스 (000660) 1,268,000원 · 926조 2,643억원 · +0.48% — 거래대금 5.7조원 1위, 반등장 속 '찔끔' 상승**

### 🇰🇷 내일 개장 관전 포인트
1. **하루짜리 반등인지 바닥 다지기인지** — 코스피는 8거래일 만에 2.05% 반등했지만 장중 고점 5,809.94에서 140포인트 넘게 밀렸다. 다음 거래일(10/19, 월)에는 주말 미국 증시와 금리, 야간선물 흐름이 첫 신호이며, 7월 말 저점대(5,500선)와 5,800선 사이에서 방향을 정하는지가 관건이다.
2. **외국인 순매수의 지속성** — 외국인이 코스피에서 3,621억원을 사며 매도 행진을 멈췄지만 코스닥에서는 936억원을 팔았고 증권가는 수급 회복을 '제한적'으로 본다. 원/달러가 1,332.50원으로 10원 내린 원화 강세가 외국인 매수를 이어 줄지 확인이 필요하다.
3. **반도체 대형주의 '저평가' 논리 vs AI 자금조달 우려** — 삼성전자·SK하이닉스 선행 P/E 3배대라는 저평가 논리와 CXMT 추격·코어위브 신용위험 우려가 맞서 있다. 젠슨 황 발언 이후 진정된 코어위브 채권·CDS가 다시 흔들리는지, 다음 주 빅테크 실적 전 매수세가 들어오는지 주목된다.
4. **바이오·방산·화장품 반등 종목의 지속성** — 알테오젠(+9.37%)·셀트리온(+6.48%)·엘앤씨바이오(+23.63%)·한화에어로스페이스(+7.89%)·에이피알(+9.06%) 등이 반등을 주도했다. 미국 금리 하락이 이어지는지, 중동 긴장이 방산 수급을 계속 지지할지가 관건이다.
5. **실적 쇼크 종목과 파업 변수** — 대한항공(−10.36%)·엘앤에프(−9.74%)처럼 3분기 실적이 컨센서스를 밑도는 종목에 매물이 몰리고 있다. HD현대중공업 노조의 21일 전면 파업 예고와 22일 금통위 결과도 업종별 차별화 요인이다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
