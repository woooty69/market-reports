# 미국→한국 선점 2026-11-02 (미국 2026-11-02 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 78개 · 연결 종목 882개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 10개:** 방산(격차 +21.6%p), 조선·LNG선·함정 MRO(격차 +17.1%p), 석유화학(격차 +15.3%p), 바이오텍·기술수출(격차 +13.3%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 건설·인프라·재건, 의류 OEM·패션, 비만치료제, 음식료·K푸드 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 항공·여행·카지노·면세(-5.7%p)
- **이제 막 힘 붙는 조기 테마:** 통신·5G(조기 73), 유통·이커머스(조기 72), 전선·케이블(조기 70) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 한국콜마(화장품·K뷰티, 점수 100), 아시아나항공(항공·여행·카지노·면세, 점수 98), 아모레퍼시픽(화장품·K뷰티, 점수 84)
