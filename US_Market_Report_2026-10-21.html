## 🗓 시장 요약

**① 다우 52,495.88(+1.02%)·S&P500 7,712.57(+0.28%)·나스닥 26,424.82(−0.02%) — 실적주 중심 순환매, 헬스케어 사상 최고치**
대형 우량주와 중소형주로 매수가 옮겨 가며 다우는 **52,495.88(+529.85, +1.02%)**, S&P500은 **7,712.57(+21.84, +0.28%)**로 올랐고, 나스닥은 장중 26,601.71까지 올랐다가 상승분을 모두 반납해 **26,424.82(−6.07, −0.02%)**로 마감했다. 나스닥100은 29,490.28(−0.13%)로 내렸고 러셀2000은 2,773.42(+1.65%)로 크게 올라 소형주가 시장을 앞섰다. VIX는 17.38(−5.75%)로 낮아졌다. 헬스케어 업종 ETF가 장중 2% 넘게 올라 사상 최고치를 썼고 부동산·유틸리티·금융도 1% 이상 올랐다. 메타(META) \$694.25(−1.59%) 등 대형 기술주는 약했다.

**② 2년물 4.79%(+2.0bp)·10년물 5.12%(−3.0bp)·30년물 5.42%(−6.0bp) — 주택 지표 부진에 장기물 하락**
미 재무부 기준 2년물은 **4.79%(+2.0bp)**로 소폭 올랐지만 10년물은 **5.12%(−3.0bp)**, 30년물은 **5.42%(−6.0bp)**로 내려 장단기 금리차가 좁아졌다. 9월 주택착공 건수는 연율 122.1만 건으로 시장 예상 130.5만 건을 크게 밑돌며 넉 달 만의 최저였고, 잠정 주택판매도 전월 대비 7.3% 줄었다. 전날 14년 만의 최저였던 NAHB 지수에 이어 주택 경기 둔화가 다시 확인되면서 장기물 금리가 내렸다.

**③ WTI \$101.09(−2.48%)·브렌트 \$108.95(−0.55%) — 브렌트 5개월 고점 찍고 반락**
후티 반군의 사우디 시설 공격과 이란 혁명수비대의 호르무즈 해협 해저 케이블 위협으로 브렌트는 장중 \$111.99까지 올라 5개월 만의 고점을 찍었지만, 이후 상승분을 반납해 12월물이 **\$108.95(−0.55%)**로 마감했다. 만기일을 맞은 WTI 11월물은 **\$101.09(−2.48%)**로 내렸다. 트럼프 대통령은 경유 비용 부담을 덜기 위한 \$80억 규모의 농가 '수확 연료 지원 프로그램'을 발표했다. 금은 \$4,130~4,140대로 소폭 내렸고 비트코인은 1% 안팎 올라 \$82,000대였다.

**④ AI·반도체 — SOX 11,283.81(−0.29%)·마이크론 −0.98%·SK하이닉스 ADR −2.16%… 반등 하루 만에 숨 고르기**
반도체지수는 장중 11,043.24까지 밀렸다가 11,000선 부근에서 저가 매수가 들어오며 **11,283.81(−0.29%)**로 낙폭을 줄였다. 엔비디아(NVDA)는 \$216.47(−0.29%), 마이크론(MU)은 \$896.07(−0.98%), 샌디스크(SNDK)는 \$1,365.38(−0.42%)로 소폭 내렸고, SK하이닉스 ADR(SKHY)은 \$139.79(−2.16%)였다. 코어위브(CRWV)는 장 초반 17개월 만의 최저까지 밀렸다가 \$62.13(+1.65%)로 반등했지만 10월 6일 이후 40% 넘게 빠진 상태다. 퀄컴(QCOM)은 크리스티아누 아몬 CEO가 11월부터 성과 중심 감원에 들어간다는 메모가 보도되며 \$175.71(+1.26%)로 올랐다.

**⑤ 실적 — GM −6.84%·GE −3.67%(호실적에도 하락), 3M +5.82%·에퀴팩스 +11.33%·해즈브로 +11.20%, 장 마감 후 스페이스X 깜짝 실적**
GM(GM)은 3분기 조정 EPS \$3.70로 예상을 웃돌고 \$200억 자사주 매입을 발표했지만 연간 조정 EBIT 가이던스 상단을 낮춰 **\$77.09(−6.84%)**로 2025년 7월 이후 최대 낙폭을 기록했다. GE 에어로스페이스(GE)도 실적·가이던스 상향에도 비용 증가 우려로 **\$299.87(−3.67%)**로 내렸다. 반면 가이던스를 올린 3M(MMM)은 **\$171.44(+5.82%)**, 에퀴팩스(EFX)는 **\$176.54(+11.33%)**, 해즈브로(HAS)는 **\$109.52(+11.20%)**로 급등했다. 세일즈포스(CRM)에 인수되는 브레이즈(BRZE)는 **\$45.57(+51.70%)**였다. 장 마감 후 스페이스X(SPCX)는 매출 \$146억(+161%)으로 예상치를 크게 넘어 시간외 1.6% 올랐고, 넷플릭스(NFLX)는 광고 매출 전망을 낮춰 시간외 3% 넘게 밀렸다.

**⑥ 🇰🇷 SK하이닉스 ADR \$139.79(−2.16%)·SOX −0.29%·코스피200 야간선물 876.90(+1.84%) — 미국 반도체 약세에도 야간선물은 주간 종가 대비 반등**

해석하면 수요일 국내 반도체 대형주는 SK하이닉스 ADR 약세와 메모리주 숨 고르기를 반영해 보합권 출발이 예상되며, 스페이스X 호실적에 따른 우주·위성 관련주의 반응이 관심이다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 스페이스X (SPCX) −0.11% — 3분기 매출 \$146억(+161%)·조정 EPS \$0.35로 예상 두 배, 시간외 +1.6%**
스페이스X는 정규장에서 저가 \$143.27(−3.17%)까지 밀렸다가 \$147.79(−\$0.17, −0.11%)로 마감한 뒤 장 마감 후 실적을 냈다. 3분기 매출은 \$146억으로 시장 예상 \$128.7억을 크게 웃돌며 전년 대비 161% 늘었고, 조정 EPS는 \$0.35로 예상 \$0.15의 두 배를 넘었으며 순이익은 \$44억(예상 \$18.8억)이었다. 부문별로는 AI 컴퓨팅(SI) \$76억, 스타링크 중심의 커넥티비티 \$52억(영업이익 \$24억, +99%), 우주 \$18억이었다. 분기 설비투자는 예상대로 \$196억이었고 이 중 \$164억이 AI 컴퓨팅 확충에 쓰여 9월 말 설비 용량이 1.7GW에 이르렀으며, 주가는 시간외에서 1.6% 올랐다.

**2. 넷플릭스 (NFLX) −1.66% — 3분기 EPS \$0.87로 예상 상회, 그러나 연간 광고 매출 전망 \$30억→\$27억 하향에 시간외 −3%대**
넷플릭스는 정규장에서 \$68.69(−\$1.16, −1.66%)로 마감한 뒤 3분기 실적을 발표했다. 매출은 \$128.7억(+11.8%)으로 예상에 부합했고 희석 EPS는 \$0.87로 예상 \$0.82를 웃돌았으며, 영업이익률은 34.6%로 전년 28.2%보다 크게 높아졌다. 하지만 광고 상품 출시 지연으로 2026년 광고 매출 전망을 약 \$30억에서 약 \$27억으로, 잉여현금흐름 전망을 \$125억에서 \$120억으로 낮췄고, 4분기 매출 가이던스는 \$134.4억·영업이익률 26.0%였다. 분기 자사주 매입은 사상 최대인 \$48억이었지만 주가는 시간외에서 3.32% 내렸다.

**3. GM (GM) −6.84% — 3분기 조정 EPS \$3.70로 예상 상회·\$200억 자사주 매입에도 연간 EBIT 가이던스 상단 하향**
GM은 시가 \$77.22에서 저가 \$75.10(−9.24%)까지 밀린 뒤 \$77.09(−\$5.66, −6.84%)로 마감해 2025년 7월 이후 최대 낙폭을 기록했다. 3분기 매출은 \$500억(+2.9%)으로 예상 \$485.2억을 넘었고 조정 EPS는 \$3.70, 조정 EBIT는 \$41억으로 모두 예상을 웃돌았으며 \$200억 규모의 새 자사주 매입도 발표했다. 그러나 연간 조정 EBIT 가이던스를 \$140억~160억에서 \$145억~155억으로 좁히며 상단을 낮췄고, 비용 증가 압력이 트럭 판매 호조를 가렸다는 평가가 나왔다.

**4. GE 에어로스페이스 (GE) −3.67% — 3분기 조정 EPS \$2.25로 예상 상회·연간 EPS 가이던스 \$8.00~8.10로 상향에도 비용·현금흐름 우려**
