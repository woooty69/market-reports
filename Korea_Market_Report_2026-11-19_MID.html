## 🗓 시장 요약

**① 5,100선 문턱에서 되밀려 5,000선 공방 — 외국인·기관 동반 매도**
수능일이라 1시간 늦은 10시에 개장한 코스피는 5,090.04로 출발해 5,103.85까지 올랐으나 개장 직후부터 외국인과 기관의 매도가 겹치며 4,963.61까지 밀렸고, 11:56 현재 5,014.71(−1.04%)로 일부 회복했다. 외국인이 −2,713억원, 기관이 −1,123억원을 순매도했고 개인이 +2,390억원을 받아냈다. 코스피200 선물(11:35, 773.60)은 현물 코스피200(779.26)보다 낮아 베이시스가 마이너스로 돌아섰다. 장 초반 사던 연기금이 매도로 돌아섰다는 보도도 나왔다.

**② 반도체 — 하이닉스·삼성전자 약세, 삼성전기만 플러스**
SK하이닉스는 1,132,000원(−1.05%)으로 거래대금 1조 3,089억원 1위, 삼성전자는 191,800원(−1.49%)이며 삼성전자우(−3.73%)의 낙폭이 더 크다. 엔비디아가 실적 발표 뒤 2.9% 내리고 AI 투자수익성 우려가 남은 영향이다. 삼성전기(+1.36%)는 엔비디아향 기판 공급 확대 기대 속에 iM증권이 이익 추정치를 올렸다는 소식에 강보합을 지켰고, 한미반도체(−3.94%)·심텍(−4.37%)·이오테크닉스(−8.29%)·원익홀딩스(−4.81%) 등 장비·부품주는 약하다.

**③ 한한령 해제 기대 — 엔터·미디어·여행·화장품 일제히 급등, IT서비스·통신은 급락**
전날 한중 정상회담에서 FTA 서비스·투자 후속협상이 실질 타결되며 K-콘텐츠 최혜국 대우 등 한한령 해제 기대가 커졌다. 스튜디오드래곤·한국화장품·위메이드맥스·노랑풍선이 상한가이고 CJ ENM(+24.08%)·제주항공(+24.00%)·하나투어(+20.33%)·파라다이스(+9.55%)·아모레퍼시픽(+6.58%)도 크게 올랐다. 반면 앤트로픽 상장을 앞두고 재료 소멸 우려가 나온 SK텔레콤(−5.33%)과 삼성에스디에스(−9.52%)·LG씨엔에스(−5.47%) 등 IT서비스, 삼성SDI(−5.41%)·현대모비스(−5.06%)가 약하다.

**④ 환율 1,330원대 하락, 미 지수 선물은 반등 — 항셍은 약세**
원/달러는 1,330.50원(−3.50원)으로 내렸다. 밤사이 미국은 엔비디아 약세와 월러 이사의 빅스텝 언급으로 흔들렸지만 아시아 시간 S&P500 선물은 +0.60%, 나스닥100 선물은 +1.04%로 반등했다. 닛케이225는 +0.20%로 보합권이고 항셍은 −1.69%로 약하다. 상해종합은 LS 기준 오늘 값이 확인되지 않아 전일 종가(3,587.83)를 적었다.

## 1. 업종별 흐름

**상승 업종** — 방송과엔터테인먼트(+8.61%, 상승 33/하락 14)는 스튜디오드래곤(+29.96%)·CJ ENM(+24.08%)·하이브(+8.52%)·에스엠(+7.17%)이 이끌었다. 호텔레스토랑레저(+5.31%)는 하나투어(+20.33%)·파라다이스(+9.55%), 항공사(+3.49%, 상승 8/하락 1)는 제주항공(+24.00%)·대한항공(+3.51%), 화장품(+2.86%, 상승 48/하락 15)은 한국화장품(+29.98%)·한국화장품제조(+16.94%)·아모레퍼시픽(+6.58%)이 강하다. 게임엔터테인먼트(+2.04%)·백화점과일반상점(+3.04%)도 한한령 수혜 기대에 올랐다.

**하락 업종** — 다각화된통신서비스(−5.07%)·무선통신서비스(−3.95%)는 SK텔레콤(−5.33%)이, IT서비스(−4.57%, 상승 34/하락 76)는 삼성에스디에스(−9.52%)·LG씨엔에스(−5.47%)가 끌어내렸다. 전자제품(−3.72%)·전기제품(−3.23%, 하락 55종목)·자동차부품(−3.15%, 하락 103종목)·우주항공과국방(−2.81%)·디스플레이장비및부품(−2.17%)도 약하다.

**시장의 시선** — 오후장에는 코스피가 5,000선을 지키는지, 오전 저점 4,963을 다시 시험하는지가 관건이다. 외국인 현·선물 매도가 줄어드는지와 미 지수 선물 반등이 반도체로 이어지는지, 한한령 테마의 상승 폭이 오후까지 유지되는지(옥석 가리기 여부)를 함께 볼 필요가 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 37종목

*① 12시 현재 시총 1,000억원 이상·+10% 이상 급등 ★ 17종목(1～17번) → ② 오전장 언론 최다 보도 20종목(18～37번).*

**1. CJ ENM (035760) 52,300원 · 1조 1,469억원 · +24.08% — 한한령 해제 최대 수혜 기대에 콘텐츠주 동반 급등**
CJ ENM은 52,300원으로 24.08% 올라 거래대금 307억원, 시총 1조 1,469억원이 됐다. 전날 한중 FTA 서비스·투자 후속협상 실질 타결로 K-콘텐츠 최혜국 대우가 거론되며 미디어·엔터주 상한가가 속출했고, 오늘 오전 CJ ENM의 K팝 채널이 샤오미 TV+를 통해 55개국에 송출된다는 소식도 나왔다. 키움증권은 11월 리포트에서 3분기 영업이익 221억원으로 기대치를 넘었고 4분기부터 수익성 회복 구간에 들어선다며 목표주가를 58,000원으로 올렸다. [리포트: Kiwoom 2026-11-09](https://woooty69.github.io/hw-pdf-arch-038/CJ%20ENM%EF%BC%BB035760%EF%BC%BD_20261109_Kiwoom_197840.pdf) · [리포트: Samsung 2026-11-06](https://woooty69.github.io/hw-pdf-arch-038/CJ%20ENM%EF%BC%BB035760%EF%BC%BD_20261106_Samsung_4061825330.pdf) · [리포트: Eugene 2026-11-06](https://woooty69.github.io/hw-pdf-arch-038/CJ%20ENM%EF%BC%BB035760%EF%BC%BD_20261106_Eugene_197783.pdf)

**2. 스튜디오드래곤 (253450) 30,800원 · 9,258억원 · +29.96% — 한한령 해빙 기대에 상한가**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
