# 📊 한국증시 데일리 리포트 (저녁판)
### 2026년 10월 14일(수) 18시 작성 · 기준일: 10월 14일(수) 정규장 (저녁판)

> 10월 14일 정규장 마감과 장 마감 후 18시대까지 나온 뉴스·공시·증권사 리포트를 정리했습니다. 코스피는 장중 6,190선까지 2.6% 반등했다가 ASML 3분기 실적 발표 뒤 반도체가 꺾이며 6,008.81(−0.44%)로 6거래일 연속 하락했고, 보험·은행이 약했던 반면 2차전지·해운·철강(알래스카 LNG)이 버텼습니다.

## 주요 지수·자산

| 지표 | 종가 / 레벨 | 등락 |
|---|---|---|
| 코스피 | 6,008.81 | **−26.54 (−0.44%)** |

*코스피는 6,062.08로 출발해 장중 6,190.65(+2.57%)까지 올랐지만, 오후 ASML 3분기 실적(매출 116.6억유로로 컨센서스 소폭 하회) 발표 뒤 반도체가 상승분을 반납하며 5,944.65까지 밀렸고 6,008.81(−0.44%)로 마감해 6거래일 연속 하락했다(6거래일 낙폭 약 995포인트). 외국인이 1조1,721억원을 팔아 7거래일 연속 순매도했고, 기관(+7,934억원)이 받아냈다. 삼성전자(+0.65%)는 소폭 올랐지만 SK하이닉스(−1.18%)는 약세였고, 코스닥은 반도체 장비주 급락에 823.88(−1.57%)로 더 약했다. 업종에서는 해운(+5.91%)·전기제품(+3.01%)·철강(+2.40%)이 강했고 손해보험(−4.63%)·생명보험(−4.04%)·은행(−2.65%)이 가장 약했다. 원/달러 고시 환율은 1,336.00원으로 7.00원 내렸다. 오늘 밤 21시30분 미국 9월 CPI가 발표된다.*

## 🗓 시장 요약

**① 코스피 6,008.81, +2.6% 반등이 ASML에 꺾이며 6일 연속 하락**
코스피는 전날 5.46% 폭락의 반발 매수로 장중 6,190.65까지 올랐지만 오후 들어 상승분을 모두 반납하고 26.54포인트(−0.44%) 내린 6,008.81로 마감했다. 6거래일 연속 하락은 2024년 9월 7거래일 연속 하락 이후 최장이며, 이 기간 낙폭은 약 995포인트(−14.2%)에 이른다. 외국인은 장 초반 순매수였다가 매도로 돌아서 1조1,721억원을 팔았고 기관이 7,934억원을 샀다. 장중 한때 6,000선이 깨지며 5,944.65까지 밀렸다.

**② 반도체: ASML '기대 미달'에 하이닉스 −1.18%, 장비주 급락**
ASML의 3분기 매출은 116.6억유로로 사상 최대였지만 컨센서스(117.2억유로)를 소폭 밑돌았고, 연간 가이던스를 440억～450억유로로 올렸어도 높아진 기대에는 못 미친다는 평가에 발표 직후 주가가 밀렸다. 이 여파로 SK하이닉스는 −1.18%로 마감했고 삼성전자는 +0.65%에 그쳤다. 코스닥 소부장은 외국인(−2,182억원)·기관(−1,816억원)이 함께 팔며 주성엔지니어링(−7.82%)·원익IPS(−7.13%)·하나마이크론(−9.12%)·엑시콘(−12.76%)이 급락했다. SEDEX 2026 개막에서 삼성전자는 zHBM·HBM4E, SK하이닉스는 HBF를 내세웠고, 삼성전자 송재혁 CTO는 CXMT가 예고한 4F² D램을 "우리도 개발 중"이라고 밝혔다.

**③ 버틴 업종: 2차전지·해운·철강(알래스카 LNG)·연료전지**
2차전지는 ESS 수요와 내년 업종 순이익 증가 전망에 삼성SDI(+5.36%)·엘앤에프(+6.04%)·포스코퓨처엠(+3.78%)·LG에너지솔루션(+2.07%)이 올랐다. 해운(+5.91%)은 사우디-예멘 후티 충돌로 운임 상승 기대가 커지며 팬오션(+10.23%)·HMM(+5.44%)이 강했다. 백악관 대변인이 "한국이 알래스카 LNG에 540억달러(약 72조원)를 투자한다"고 다시 언급하자 대한제강(+12.86%) 등 철강·강관(+2.40%)과 피팅·밸브주가 뛰었고, 연료전지(SOFC) 부품주 한선엔지니어링(+29.80%)·비나텍(+11.20%)도 급등했다.

**④ 약세 업종: 손해보험·생명보험·은행·제약**
손해보험(−4.63%)은 현대해상(−11.12%)·한화손해보험·삼성화재(−4.90%)가 뚜렷한 악재 공시 없이 매물에 밀렸고, 생명보험(−4.04%)도 삼성생명(−3.91%)이 약했다. 은행(−2.65%)은 신한지주(−4.41%)가 롯데손해보험 인수에 따른 자본비율·추가 투입 부담 우려로 낙폭을 키웠고, 미국 씨티그룹 실적 부진(−5.6%)도 금융주 심리를 눌렀다. 제약(−1.42%)은 한미약품(−11.15%)이 제넨텍 기술이전 계약금이 4분기로 넘어가며 3분기 실적 눈높이가 크게 낮아진 영향이 컸다.

**⑤ 환율·금리·외부 변수**
원/달러 고시 환율은 1,336.00원으로 7.00원 내렸고, 국고채 3년물은 3.883% 안팎으로 소폭 올랐다. 오늘 밤 21시30분 발표되는 미국 9월 CPI는 헤드라인 3.6%(전월 3.4%), 근원 2.5% 안팎이 예상돼 10월 FOMC(27～28일)를 앞둔 금리 경로의 분수령이다. 15일에는 TSMC 3분기 실적과 미국 9월 PPI·소매판매가 이어진다. 중동에서는 사우디 주도 연합군과 후티의 충돌이 계속되며 WTI가 배럴당 94달러대로 올라 있다.

**⑥ 코스닥 823.88(−1.57%), 소부장 매도·테마 급등 혼재**
코스닥은 835.90으로 출발해 846.95까지 올랐다가 813.49까지 밀린 뒤 823.88로 마감했다. 시총 상위 반도체 장비주가 주성엔지니어링(−7.82%)·HPSP(−7.79%)·원익IPS(−7.13%)·심텍(−6.31%) 등 일제히 밀린 반면, 2차전지 에코프로(+2.58%)·에코프로비엠(+1.94%)과 연료전지·알래스카 LNG 테마인 한선엔지니어링(+29.80%)·LS머트리얼즈(+6.69%)가 강했다. 시총 미달 상장폐지 유예 이후 하이퍼코퍼레이션·뉴인텍 등 초소형주 상한가도 이어졌다.

## 1. 업종별 흐름

**상승 업종** — 해운사(+5.91%)·상업서비스와공급품(+5.39%)·도로와철도운송(+3.22%)·컴퓨터와주변기기(+3.02%)·전기제품(+3.01%)·철강(+2.40%)·무선통신서비스(+2.23%)·자동차부품(+2.15%)·화학(+1.98%)이 올랐다. 해운은 사우디-후티 충돌과 호르무즈 통행 차질로 팬오션(+10.23%)·HMM(+5.44%)이 강했고 증권사들이 팬오션 목표가를 8,500～10,000원으로 올렸다. 상업서비스는 3분기 영업이익 654억원(+5.26%)을 낸 에스원(+10.92%), 도로·철도운송은 서울고속버스터미널 개발 기대의 천일고속(+29.78%)·동양고속(+22.13%)이 이끌었다. 전기제품은 ESS 기대의 삼성SDI(+5.36%)·LG에너지솔루션(+2.07%), 철강은 알래스카 LNG 재언급에 대한제강(+12.86%)이 앞장섰다.

**하락 업종** — 손해보험(−4.63%)·생명보험(−4.04%)·은행(−2.65%)·백화점과일반상점(−2.20%)·복합기업(−1.97%)·창업투자(−1.96%)·항공사(−1.72%)·카드(−1.64%)·증권(−1.57%)·제약(−1.42%)이 약했다. 손보는 현대해상(−11.12%)·삼성화재(−4.90%), 생보는 삼성생명(−3.91%)이 공시 없는 매물에 밀렸다. 은행은 롯데손보 인수 총비용이 1.5조～2조원에 이를 수 있다는 분석이 나온 신한지주(−4.41%)와 KB금융(−1.66%)·하나금융지주(−2.09%)가 약했고, 복합기업은 삼성물산(−3.33%)·SK(−1.80%)가 내렸다. 제약은 한미약품(−11.15%)이 3분기 영업이익 추정치가 컨센서스(1,079억원)의 3분의 1 수준으로 낮아지며 급락했다.

**시장의 시선** — 전날 5% 넘게 빠진 뒤의 반등이 ASML 실적 하나에 꺾였다는 점에서 반도체에 대한 시장 신뢰가 아직 약하다. 증권가는 코스피 12개월 선행 PER이 5배 아래로 내려온 밸류에이션 바닥 신호를 강조하지만, 외국인이 7거래일 연속 매도하는 동안 지수 반등은 기관·기타법인 수급에 기대고 있다. 2차전지(ESS)·해운(운임)·조선·철강(알래스카 LNG)처럼 실적이나 정책 재료가 있는 업종으로 순환매가 이어지는 가운데, 3분기 실적 시즌에서 컨센서스를 밑도는 종목(한미약품·에이피알·현대차)은 크게 흔들리고 있다. 야간선물은 개장 직후 944.60(+0.04%)로 출발했고 오늘 밤 미국 CPI가 방향을 정할 전망이다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 52종목

*저녁판: 1～40번은 뉴스 후보 풀(최근 14시간 보도 건수) 순을 기본으로 거래대금·급등락·장 마감 후 공시를 고려해 골랐고(16·39·40번은 ★), 41～52번은 ★ 필수 편입(시총 1,000억원 이상 · +10% 이상 상승) 중 1～40번에 없는 종목이다. 등락률은 10/14 종가 기준.*

**1. SK하이닉스 (000660) 1,426,000원 · 1,041조 6,821억원 · −1.18% — 장중 반등 후 ASML 실적에 반락, SEDEX서 'HBF' 차세대 메모리 제시**
SK하이닉스는 전날 10% 가까이 급락한 뒤 장 초반 3～4% 반등했지만 ASML 3분기 실적 발표 이후 상승분을 반납하고 1.18% 내렸으며, 거래대금은 5조850억원으로 시장 1위였다. 안현 사장은 SEDEX 2026 기조연설에서 2030년 AI 인프라 성능이 20배로 커진다며 HBM 대안으로 HBF(대역폭은 HBM의 약 절반, 용량은 약 10배)와 3D 적층 D램을 개발 중이라고 밝혔다. 하나증권은 3분기 매출 99조2,000억원, 영업이익 77조9,000억원(+29% QoQ)으로 컨센서스 부합을 전망하며 목표주가 360만원을 제시했다. 장 마감 뒤에는 솔리다임 나스닥 상장 시 중복상장 위약금이 20억원에 불과해 제재 실효성이 없다는 보도가 나왔다. [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf) · [리포트: SK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261012_SK_196606.pdf)

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
