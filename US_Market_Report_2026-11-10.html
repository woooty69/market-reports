## 🗓 시장 요약

**① 나스닥 25,253.14(+2.74%)·S&P500 7,549.94(+2.35%)·다우 52,389.75(+2.15%) — AI 매도 일단 멈춤, 11개 업종 전부 상승**
나스닥은 **25,253.14(+673.71, +2.74%)**, S&P500은 **7,549.94(+173.08, +2.35%)**, 다우는 **52,389.75(+1,104.02, +2.15%)**로 마감했다. 다우는 1,100포인트 넘게 오르며 중간선거 당일 종가를 다시 넘었고, S&P500 11개 업종이 모두 올랐다. 나스닥100은 27,907.63(+3.40%), 러셀2000은 2,840.81(+86.70, +3.15%), VIX는 **19.97(−5.67, −22.11%)**로 내려왔다. 지난주 S&P500은 2025년 4월 이후 최대 주간 하락을 기록했고 지난 목요일 하루에만 나스닥100 시가총액 약 \$2조3,000억이 사라졌다. 모건스탠리와 UBS는 새 의회가 투자자들이 걱정하는 만큼 강한 AI 데이터센터 규제를 도입할지 의문이라며 지난주 매도가 과도했다고 봤다.

**② WTI \$86.96(−4.26%)·브렌트 \$92.80(−5.61%) — 트럼프 "협상 진행 중엔 이란 추가 공습 가능성 낮다"**
WTI 12월물은 장중 \$85.02까지 밀린 뒤 **\$86.96(−\$3.87, −4.26%)**, 브렌트 1월물은 **\$92.80(−\$5.52, −5.61%)**로 마감했다. 트럼프 대통령이 일요일 평화 협상이 진전되는 동안에는 이란에 대한 추가 공격 가능성이 매우 낮다고 말한 것이 유가를 끌어내렸다. 다만 이란은 미국이 해상 봉쇄를 풀고 동결 자산을 돌려줘야 진전이 가능하다고 맞섰고, 루비오 국무장관도 협상이 돌파구 직전은 아니라고 했다. 미국 휘발유 평균 가격은 갤런당 \$4.01로 9월 말 고점(\$4.48 안팎)보다 약 10% 낮아졌다. 금 선물은 \$4,100선으로 1% 넘게 올랐고 비트코인은 \$75,000 아래로 밀렸다.

**③ 미국채 2년물 4.56%(+5.0bp)·10년물 4.88%(+2.0bp) — 10월 CPI 하루 앞두고 금리는 소폭 상승**

**④ AI·반도체 — SOX 10,033.93(+6.86%)·AMD +13.26%·브로드컴 +8.78%·마이크론 +6.25%, 엔비디아만 −4.27%**

**⑤ 실적·이슈 — 큐엑스오 +19.20%·NRG +10.32%·로켓랩 +10.91%·테슬라 +5.54%, 아이오니스 −21.36%·힘스앤허스 −11.77%**
3분기 예비 순매출이 \$49억(+79%)으로 집계된 큐엑스오(QXO)는 **\$13.78(+19.20%)**, 가스 발전소 6곳을 \$40억에 매각하기로 한 NRG에너지(NRG)는 **\$97.40(+10.32%)**, NASA 달 기지 사업자에 선정된 로켓랩(RKLB)은 **\$58.86(+10.91%)**로 올랐다. 테슬라(TSLA)는 텍사스 \$100억 태양전지 공장 착공 소식에 \$378.05(+5.54%)였다. 반면 트라이골자 연간 매출 전망을 절반으로 낮춘 아이오니스(IONS)는 **\$31.00(−21.36%)**, 장 마감 후 실적 발표를 앞둔 힘스앤허스(HIMS)는 **\$22.94(−11.77%)**, 4분기 성장 둔화를 예고한 먼데이닷컴(MNDY)은 **\$79.93(−9.10%)**로 밀렸다. 유가 급락에 퍼스트솔라(FSLR)도 \$191.61(−4.74%)로 약했다.

**⑥ 🇰🇷 SOX +6.86%·SK하이닉스 ADR \$134.38(+5.53%)·코스피200 야간선물 820.70(+5.78%) — 메모리 반등 탄력 회복**

엔비디아는 시가 \$173.04에서 출발해 저가 \$170.24(−8.79%)까지 밀린 뒤 \$178.67(−\$7.97, −4.27%)로 마감했다. 미 정보당국이 중국 정보기관이 싱가포르 고객사와 연결된 인물을 통해 젠슨 황 CEO에 대한 정보를 수집하려 했다고 판단한 것으로 보도되자, 이사회는 일요일 독립이사들과 외부 변호인으로 구성된 조사를 시작한다고 발표했다. 회사는 기밀 정보나 국가안보가 침해됐다고 볼 이유는 없다고 밝혔고, 젠슨 황(지분 약 3.6%)은 조사에 전면 협조하겠다는 사내 메모를 보냈다. 트럼프 대통령은 황 CEO가 자리를 지켜야 하느냐는 질문에 "그렇다고 본다"고 답했고, 3분기 실적은 11월 17일(현지) 발표된다.
