# 미국→한국 선점 2026-11-04 (미국 2026-11-04 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 78개 · 연결 종목 882개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 9개:** 방산(격차 +17.0%p), 바이오텍·기술수출(격차 +14.4%p), 의료기기·미용기기(격차 +12.2%p), 조선·LNG선·함정 MRO(격차 +12.0%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 비만치료제, 은행·밸류업, 유통·이커머스, 철도 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 항공·여행·카지노·면세(-10.7%p), 물·환경(-10.1%p), 엔터·K콘텐츠·웹툰(-9.6%p)
- **이제 막 힘 붙는 조기 테마:** 통신·5G(조기 70), 철도(조기 69), 엔터·K콘텐츠·웹툰(조기 69) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 대한항공(항공·여행·카지노·면세, 점수 100), 아시아나항공(항공·여행·카지노·면세, 점수 87), 파마리서치(의료기기·미용기기, 점수 86)
