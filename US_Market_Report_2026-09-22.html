### 2026년 9월 22일(화) 작성 · 기준일: 9월 21일(월) 현지 정규장

## 🗓 시장 요약

**① 나스닥 +2.26% 사상 최고 — 유가 \$100 붕괴가 위험선호를 되살렸고 메타·AMD·인텔·Arm이 지수를 끌어올렸다**
연준 인상 이후 넷째 거래일, 3대 지수가 모두 올랐다. 나스닥은 **27,122.09(+599.55, +2.26%)**로 사상 최고치를 새로 썼고 S&P500은 **7,764.70(+114.30, +1.49%)**, 다우는 **52,048.83(+367.62, +0.71%)**로 마감했다. 러셀2000도 2,876.06(+0.55%)로 동반 상승했다. 커뮤니케이션서비스(+3.84%)와 기술(+2.83%)이 지수를 만들었고 에너지(−1.89%)만 밀렸다. 캐피털닷컴의 다니엘라 해손은 "유가 하락이 몇 주간 인플레이션·금리 우려에 눌려 있던 위험선호를 되살리며 시장이 한 주를 건설적으로 시작했다"고 했다. 해석하면 지난주 만기일의 '방향 없는 혼조'가 월요일에는 '유가 하락 + AI 재료'라는 두 축의 랠리로 바뀌었다 — 다만 상승의 대부분은 메타(+11.43%)·AMD(+9.95%)·인텔(+12.14%)·Arm(+17.16%) 등 소수 대형 기술주에서 나왔다.

**② WTI \$95.78(−4.51%) — 사우디 송유관 절반 복구·수출 하루 400만 배럴 회복, 나흘째 하락에 \$100 아래로**
WTI는 **\$95.78(−\$4.52, −4.51%)**, 브렌트는 **\$100.34(−\$3.53)**로 나흘 연속 내렸고 WTI는 9월 들어 처음 \$100 아래에서 마감했다. 사우디가 손상된 동서 송유관 용량의 절반을 복구했고 원유 수출이 8월 하루 240만 배럴에서 400만 배럴 이상으로 급증했다는 보도가 직접 배경이며, 이란 페제시키안 대통령이 화요일 유엔총회에 참석한다는 소식으로 미국-이란 외교 기대가 더해졌다. 금 12월물은 \$4,383.90(−0.93%)로 사흘 만에 내렸고 은도 −1.09%였다. 해석하면 유가가 \$100을 내주면서 기대 인플레이션 경로가 낮아졌고, 이것이 채권(10년물 −3.3bp)과 성장주에 동시에 우호적으로 작용했다 — 다만 호르무즈 항로가 정상화된 것은 아니어서 \$95선의 지지 여부가 이번 주 변수다.

**③ 10년물 4.96%(−3.3bp) — 2년물은 2년여 만의 고점에서 소폭 되돌림, 굴스비 "수요발 인플레이션이면 인상 속도 빨라질 수도"**
10년물 금리는 **4.962%(−0.033%p)**로 5% 아래에 머물렀고, 지난주 2년여 만의 고점을 찍었던 2년물도 소폭 내려 4.7%대에서 움직였다. 달러인덱스는 100.44(+0.2%)로 올랐고 엔/달러는 157.45로 일본은행 인상 이후에도 엔 약세가 이어졌다. 시카고 연은 굴스비 총재는 인플레이션이 수요 주도로 확인되면 연준의 인상 속도가 빨라질 수 있다고 말해 10월 추가 인상 논쟁을 이어갔다. 해석하면 금리는 유가 덕에 숨을 돌렸지만 연준 인사의 톤은 여전히 매파적이고, 목요일 트럼프·시진핑 정상회담과 주 후반 PCE가 나올 때까지 5%를 축으로 한 박스권이 유지될 가능성이 크다.

**④ 반도체 이틀째 급등 — Arm +17.16%·인텔 +12.14%·AMD +9.95%(사상 첫 \$600 돌파·장중 시총 \$1조), 엔비디아 +2.30%·마이크론 +2.77%**
필라델피아 반도체지수는 약 12,200으로 100일 이동평균을 회복했고 반도체 ETF(SOXX)는 +3.4%로 한 달여 만의 고점이었다. 메타의 개인 AI 에이전트 앱 '뮤즈(Muse)'가 사흘 연속 애플 앱스토어 무료 앱 1위에 오르면서 에이전트형 AI가 추론 수요를 CPU까지 넓힌다는 서사가 힘을 얻었고, 제프리스는 "뮤즈가 서버 CPU에 대한 관심을 되살리고 있다"고 했다. AMD(AMD)는 **\$615.52(+9.95%)**로 사상 처음 \$600을 넘고 장중 \$616.68까지 올라 시가총액 \$1조를 잠시 넘었으며, Arm(ARM)은 **\$322.90(+17.16%)**, 인텔(INTC)은 AUO와의 마이크로 LED 첨단 패키징 협의 보도까지 겹쳐 **\$121.78(+12.14%)**로 급등했다. 엔비디아(NVDA)는 \$227.38(+2.30%), 마이크론(MU)은 \$1,043.96(+2.77%), SK하이닉스 ADR(SKHY)은 \$188.86(+0.73%)로 GPU·메모리는 상대적으로 조용했다. 해석하면 지난주 '메모리'로 좁혀졌던 자금이 이날은 'CPU·추론'으로 옮겨갔다 — 같은 AI 재료 안에서 주도주가 하루 단위로 회전하고 있다.

**⑤ 회사 고유 재료 — 메타 +11.43%(웰스파고 목표가 \$796), 그레일 +33.68%(FDA 자문위 D−2), WBD +10.79%(주 검찰 합의), 노보 −7.96%(성장 전략 실망), HP −4.22%(2027 PC 역성장 전망)**
메타(META)는 웰스파고가 목표가를 \$156 올린 **\$796**으로 제시하고 시티가 \$800 목표가로 90일 촉매 감시 종목에 올리자 **\$741.25(+11.43%)**로 급등했다. 그레일(GRAL)은 9/23 FDA 자문위원회의 다중암 조기진단 혈액검사 '갤러리' 심사를 앞두고 **\$107.97(+33.68%)**로 폭등했고, 워너브라더스디스커버리(WBD)는 파라마운트스카이댄스가 12개 주 검찰과 반독점 소송 합의에 이르러 \$1,110억 인수의 걸림돌이 걷히자 **\$30.80(+10.79%)**로 뛰었다. 반대로 노보노디스크(NVO)는 자본시장의 날에서 2030년까지 다중 블록버스터 후보 5개 이상 출시라는 계획을 내놓았지만 위고비 특허 만료(2032년) 이후 성장 우려를 지우지 못해 **\$39.80(−7.96%)**, HP(HPQ)는 2027년 PC 시장이 한 자릿수 중반 역성장한다는 전망에 **\$32.95(−4.22%)**, 파라마운트스카이댄스(PSKY)는 합의 대가로 캘리포니아 제작 투자 \$15억 등 양보가 부각되며 **\$9.91(−2.94%)**로 내렸다.

**⑥ 🇰🇷 코스피 +1.65%(7,007.72) 7거래일 만에 7,000 회복·외국인 이틀째 순매수, 삼성전자 +4.62%·SK하이닉스 +0.59%·SKHY +0.73% — 괴리율 약 +39.8% → 약 +40.2%**
9/21 코스피는 **7,007.72(+113.49, +1.65%)**로 약 7거래일 만에 7,000선을 되찾았고 코스닥은 836.27(+1.11%)였다. 외국인은 코스피에서 **+1,420억원**으로 이틀째 순매수했고 기관이 +2,850억원을 더했으며 개인은 −4,180억원으로 차익을 실현했다. 삼성전자(005930)는 AI 메모리 공급 확대 기대에 **272,000원(+12,000원, +4.62%)**로 주도주로 올라섰고 SK하이닉스(000660)는 **1,860,000원(+11,000원, +0.59%)**로 쉬어갔으며 원/달러는 **1,381.0원(−2.3원)**으로 내렸다. 미국에서는 SKHY가 시가 \$188.25, 고가 \$190.24, 저가 \$185.91을 거쳐 **\$188.86(+0.73%, +\$1.36)**로 마감해 국내 원주와 비슷한 폭으로 올랐고 괴리율은 약 +39.8%에서 **약 +40.2%**로 사실상 제자리였다. 코스피200 야간선물은 **1,137.00(+21.90, +1.96%)**로 마감했다 — 시가 1,119.55에서 저가 1,115.75를 거쳐 고가 1,140.55까지 오른 뒤 고가 부근에서 끝나 정규장 선물 종가 1,115.10 대비 큰 폭 위이며, 나스닥 사상 최고를 야간이 거의 그대로 반영했다.

## 1. 업종별 흐름

**상승 업종 3**
- **반도체·CPU** — Arm(ARM) +17.16%(\$322.90), 인텔(INTC) +12.14%(\$121.78), AMD(AMD) +9.95%(\$615.52), 엔비디아(NVDA) +2.30%, 마이크론(MU) +2.77%, SK하이닉스 ADR(SKHY) +0.73%, SOXX +3.4%. 메타 뮤즈 앱 1위가 '추론 수요가 CPU로 확산'이라는 서사를 만들었고 AMD는 사상 첫 \$600 돌파·장중 시총 \$1조를 기록했다.
- **커뮤니케이션·미디어** — 메타(META) +11.43%(\$741.25), 워너브라더스디스커버리(WBD) +10.79%(\$30.80), 레딧(RDDT) 강세. 업종 지수 +3.84%로 11개 업종 중 1위였고 메타 커넥트(9/23~24)와 파라마운트 합의가 재료였다.
- **광통신·가상자산·바이오(선별)** — 시에나(CIEN) +4.92%(투자의견 상향, 루멘텀·퀄컴·코닝 공동 시연), 코인베이스(COIN) +3.50%(\$201.05, 비트코인 \$86,330 터치), 그레일(GRAL) +33.68%(FDA 자문위 앞두고). 희토류(CRML·MP)는 미국-덴마크 그린란드 안보 협정 소식에 급등했다.

**하락 업종·종목**
- **에너지** — 업종 지수 −1.89%. WTI −4.51%(\$95.78)·브렌트 \$100.34로 나흘째 하락하며 정유·시추주가 밀렸고, 지난주 '유가 하락에도 정유 상승' 구도는 유지되지 않았다.
- **제약·PC** — 노보노디스크(NVO) −7.96%(\$39.80, 자본시장의 날 실망), 일라이릴리(LLY) −0.7%, HP(HPQ) −4.22%(\$32.95, 2027 PC 역성장 전망), 파라마운트스카이댄스(PSKY) −2.94%(합의 대가 양보 부담).
- **비료·외식** — CF·모자이크(MOS)·뉴트리엔(NTR)이 트럼프의 벨라루스 비료 구매 발언에 급락했고, 맥도날드(MCD)는 투자자의 날을 앞두고 52주 최저권(\$247.88, −0.15%)에 머물렀다.

**시장의 시선** — 지난주 "어디를 사는가"의 답이 월요일에는 'AI 추론과 유가 하락'으로 나왔다. 나스닥이 사상 최고를 새로 쓴 날 상승은 메타·AMD·인텔·Arm 네 종목에 집중됐고, S&P500 +1.49%는 9월 13번째 거래일 기준으로 여전히 월간 마이너스 구간을 벗어나려는 시도다 — 1950년 이후 이 시점에 하락 중이던 9월이 플러스로 마감한 것은 34번 중 1번뿐이라는 통계가 돌았다. 유가 \$95는 채권과 성장주에 동시 호재였지만 굴스비의 "수요발 인플레이션이면 인상 속도가 빨라진다"는 말이 같은 날 나왔고, 목요일 트럼프·시진핑 정상회담(관세·AI 협력)과 주 후반 PCE가 남아 있다. 한국 시장에는 '코스피 7,000 회복 + 야간선물 +1.96% + 삼성전자 주도주 교체'라는 우호적 조합이 도착하지만, SK하이닉스는 미국(SKHY +0.73%)과 국내(+0.59%) 모두 쉬어가는 국면이고 추석 연휴(9/24~26) 전 이틀만 남았다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 메타 플랫폼스 (META) +11.43% — \$741.25, 웰스파고 목표가 \$796으로 \$156 상향·뮤즈 앱 앱스토어 1위·시티 \$800 촉매 감시**
메타는 시가 \$680.38에서 장중 \$753.00까지 올라 \$741.25(+\$76.02, +11.43%)로 마감해 하루 상승률로는 올해 최대 수준이었다. 웰스파고의 켄 가렐스키는 "최근 AI 제품 출시가 마침내 메타의 AI 전략을 뒷받침하는 더 강한 서사를 만들고 있다"며 목표가를 \$640에서 \$796으로 올렸고, 시티는 \$800 목표가로 90일 촉매 감시 종목에 편입했다. 개인 AI 에이전트 앱 '뮤즈'가 사흘 연속 미국 애플 앱스토어 무료 앱 1위에 올랐고 '뮤즈 스파크'도 이용자가 늘고 있으며, 9/23 개막하는 메타 커넥트에서 추가 AI 제품과 웨어러블 발표가 예고돼 있다. 애널리스트 평균 목표가 \$763.67은 이날 종가와 거의 같아졌고 매수 38·보유 6·매도 0의 컨센서스가 유지됐다.

**2. AMD (AMD) +9.95% — \$615.52, 사상 첫 \$600 돌파·장중 시총 \$1조 진입, 메타 뮤즈발 CPU 추론 수요 기대**
AMD는 시가 \$583.88에서 장중 \$616.68까지 올라 \$615.52(+\$55.70, +9.95%)로 마감해 사상 처음 \$600 위에서 끝났고 장중 시가총액이 \$1조를 잠시 넘었다. 메타 뮤즈의 성공이 에이전트형 AI의 추론 부하를 GPU에서 서버 CPU로 넓힌다는 해석이 확산됐고, 제프리스는 "뮤즈가 서버 CPU에 대한 관심을 되살리고 있다"고 평가했다. 별도로 AMD가 칩 가격을 약 10% 인상한다는 보도가 나와 가격 협상력이 재확인됐으며, 엔비디아(NVDA) +2.30%·TSMC 소폭 상승과 비교해 AMD의 오름폭이 두드러졌다. 컨센서스 목표가 대비 상승 여지가 1% 안팎으로 줄어 이제부터는 목표가 상향이 뒤따라야 하는 구간이다.

**3. 인텔 (INTC) +12.14% — \$121.78, AUO와 마이크로 LED 첨단 패키징 협의·뮤즈 CPU 수요·SK하이닉스 협력 기대가 겹쳐 연초 대비 약 3배**
인텔은 시가 \$116.59에서 장중 \$124.73까지 올라 \$121.78(+\$13.18, +12.14%)로 마감했고 지난주 +7.67%(9/17)에 이어 닷새 만에 두 번째 두 자릿수 상승이다. 디지타임스는 인텔이 대만 AUO와 공동 패키징 광학·고밀도 컴퓨팅용 마이크로 LED 첨단 패키징을 협의 중이라고 보도했고, 회사 확인은 없지만 유리기판·마이크로 LED 공정을 결합한 차세대 패키징 기대가 붙었다. 메타 뮤즈발 서버 CPU 수요 재평가와 지난주 SK하이닉스와의 미국 내 메모리 생산 협의 보도가 같은 방향으로 작용했으며, 연초 이후 상승률은 금요일 종가 기준 194%였다. 10/22 예정된 3분기 실적에서 파운드리 수주와 마진이 확인돼야 랠리의 지속 여부가 정해진다.

**4. Arm 홀딩스 (ARM) +17.16% — \$322.90, 서버 CPU 시장 2030년 \$1,200억 전망·뮤즈발 CPU 수요에 반도체 중 최대 상승**
Arm은 시가 \$294.36에서 장중 \$324.16까지 올라 \$322.90(+\$47.29, +17.16%)로 마감해 이날 대형 반도체 중 가장 큰 폭으로 올랐다. 회사는 서버 CPU 시장이 연 35% 이상 성장해 2030년 \$1,200억에 이를 수 있다고 전망했고, 메타 뮤즈의 앱스토어 1위가 에이전트형 AI 추론의 CPU 수요를 키운다는 서사에서 라이선스 모델인 Arm이 제조 원가 부담 없이 수혜를 본다는 논리가 붙었다. 키뱅크의 저스틴 패터슨은 뮤즈가 월간 활성이용자 수억 명을 확보하면 플랫폼으로 성공한 것으로 볼 수 있다고 했다. 상반기에만 224% 오른 뒤의 추가 급등이어서 주가수익비율 200배대의 밸류에이션과 RISC-V 등 개방형 아키텍처 경쟁이 위험 요인으로 거론된다.

**5. 노보노디스크 (NVO) −7.96% — \$39.80, 자본시장의 날 '2030년까지 다중 블록버스터 5개 이상' 계획에도 위고비 특허 만료 이후 성장 우려**
노보노디스크 ADR은 시가 \$41.05에서 장중 \$39.54까지 밀린 뒤 \$39.80(−\$3.44, −7.96%)로 마감했고 코펜하겐 원주도 최대 7% 내렸다. 마이크 두스타 CEO는 자본시장의 날에서 2030년까지 다중 블록버스터 잠재력을 가진 신약 5개 이상을 출시하고 업계 평균 수준의 성장을 유지하겠다고 밝혔지만, 지난해 매출의 절반 이상을 차지한 세마글루타이드의 미국 특허가 2032년 만료된다는 점과 "거의 모든 제약사가 비만 시장에 뛰어들고 있다"는 경쟁 인정이 실망을 키웠다. 골드만삭스는 제시된 계획이 2030년 마진에 약 3%의 하방 요인이라고 짚었고, 일라이릴리(LLY)는 −0.7%(\$1,145.04), 바이킹테라퓨틱스(VKTX)는 +1%(\$29.41)로 업종이 아닌 회사 고유 재료로 분류됐다. 2030년 비만치료제 매출 목표 \$230억이 시장 기대에 못 미쳤다는 평가가 다음 실적까지 주가를 누를 변수다.

**6. 그레일 (GRAL) +33.68% — \$107.97, 9/23 FDA 자문위원회의 다중암 조기진단 혈액검사 '갤러리' 시판 전 승인 심사 앞두고 폭등**
그레일은 시가 \$93.47에서 장중 \$111.49까지 올라 \$107.97(+\$27.20, +33.68%)로 마감했다. 9/23 FDA 분자·임상유전학 자문위원회가 지난 1/29 제출된 갤러리의 시판 전 승인(PMA) 신청을 심사하며, 갤러리는 혈액 속 암 특이 메틸화 패턴을 AI로 읽어 증상 전 암 신호를 찾고 발생 장기를 예측하는 검사로 2018년 혁신의료기기 지정을 받았다. 근거 자료는 25,490명이 참여한 PATHFINDER 2와 영국 NHS-갤러리 시험(중재군 첫해 7만 명 이상)이며, 회사는 암 사망의 70~80%가 현재 권고된 선별검사가 없는 암에서 발생한다는 점을 강조한다. 같은 날 템퍼스(TEM)와의 리커전 데이터 파트너십이 2029년까지 연장됐고, 자문위 표결 결과에 따라 이틀 뒤 주가가 다시 크게 움직일 이벤트 종목이다.

**7. 워너브라더스디스커버리 (WBD) +10.79% — \$30.80, 파라마운트스카이댄스와 12개 주 검찰의 반독점 소송 합의로 \$1,110억 인수 걸림돌 해소**
워너브라더스디스커버리는 시가 \$29.77에서 장중 \$30.92까지 올라 \$30.80(+\$3.00, +10.79%)로 마감했다. 파라마운트스카이댄스가 캘리포니아를 포함한 12개 주 검찰과 인수 반대 소송을 합의로 마무리하기로 했다는 보도가 나왔고, 파라마운트가 캘리포니아 제작 투자 \$15억 등 양보안을 제시한 것으로 전해졌다. 총 \$1,110억 규모 인수의 최대 법적 장애물이 걷히면서 인수가와 시장가의 스프레드가 좁혀졌고, 세부 조건에 반대하는 일부 주가 남아 있다는 점은 잔여 위험이다. 파라마운트스카이댄스(PSKY)는 장중 \$11.49(+12.54%)까지 올랐다가 양보 부담이 부각되며 −2.94%로 되돌려 두 회사의 방향이 엇갈렸다.

**8. HP (HPQ) −4.22% — \$32.95, "2027년 PC 시장 한 자릿수 중반 역성장" 전망에 급락**
HP는 시가 \$33.40, 장중 고가 \$34.91에서 저가 \$32.62까지 밀린 뒤 \$32.95(−\$1.45, −4.22%)로 마감했다. 회사는 2027년 PC 산업 출하량이 한 자릿수 중반 비율로 줄어들 것이라고 밝혔고, 메모리 가격 급등에 따른 원가 부담과 함께 AI PC 교체 수요가 시장 전체의 역성장을 상쇄하지 못한다는 해석이 붙었다. 마이크론(MU) +2.77%·샌디스크 강세가 보여주듯 메모리 공급 부족은 부품 업체에는 호재지만 완제품 업체에는 비용이며, 델·레노버 등 동종 업체에도 같은 논리가 적용된다. 연중 저점권에서 나온 가이던스라 다음 실적 발표 전까지 반등 재료가 마땅치 않다.

**9. 파라마운트 스카이댄스 (PSKY) −2.94% — \$9.91, 장중 +12.54%에서 하락 반전, 합의 대가로 캘리포니아 \$15억 제작 투자 등 양보 부각**
파라마운트스카이댄스는 시가 \$10.65, 장중 고가 \$11.49(+12.54%)까지 급등했다가 \$9.84까지 밀려 \$9.91(−\$0.30, −2.94%)로 마감했다. 12개 주 검찰과의 반독점 소송 합의 소식 자체는 호재였지만, 캘리포니아 제작 투자 \$15억 등 양보 조건과 합의 조건에 반대하는 일부 주 검찰이 남아 있다는 보도가 이어지면서 인수 주체인 파라마운트의 부담이 부각됐다. 같은 재료로 피인수 기업 워너브라더스디스커버리(WBD)가 +10.79%로 오른 것과 정반대였고, \$1,110억 인수의 자금조달과 통합 비용이 다시 논쟁이 됐다. 규제 승인 완료 시점과 최종 합의 문서의 세부 조건이 다음 확인 지점이다.

**10. SK하이닉스 ADR (SKHY) +0.73% — \$188.86 (괴리율: 약 +40.2%), 반도체 급등장에서 메모리는 소폭 상승·장중 \$190.24**
SKHY는 시가 \$188.25·고가 \$190.24·저가 \$185.91에서 \$188.86(+\$1.36, +0.73%)로 마감해 Arm +17.16%·인텔 +12.14%·AMD +9.95%가 이끈 반도체 급등장에서 마이크론(MU) +2.77%와 함께 상대적으로 조용했다. 이날 재료가 GPU·메모리가 아니라 메타 뮤즈발 CPU 추론 수요였던 만큼 HBM 체인은 지난주 급등 이후 숨 고르기에 들어갔고, 국내 원주 SK하이닉스(000660)도 같은 날 +0.59%(1,860,000원)에 그쳐 삼성전자(005930) +4.62%에 주도주 자리를 내줬다. 괴리율은 원/달러 1,381.0원 기준 약 +40.2%로 전날과 거의 같았으며, 애널리스트 평균 목표주가 \$248.43 대비 상승 여지는 30% 안팎이다. 지난주 보도된 인텔과의 미국 내 메모리 생산 협의는 인텔 +12.14%의 배경으로 다시 거론됐고, 주 후반 마이크론 실적이 메모리 체인의 다음 재료다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **웰스파고(켄 가렐스키) — 메타(META) 목표가 \$796(+\$156).** "최근 AI 제품 출시가 마침내 AI 전략을 뒷받침하는 더 강한 서사를 만들고 있다." 시티는 \$800 목표가로 90일 촉매 감시 편입.
- **제프리스 — "메타의 뮤즈가 에이전트형 AI로 추론 수요를 넓히며 서버 CPU 관심을 되살리고 있다."** AMD·인텔·Arm 동반 급등의 논리.
- **골드만삭스 — 노보노디스크(NVO) 자본시장의 날 계획은 2030년 마진에 약 3% 하방.** SEC 토큰화 주식 면제에 대해서는 "미국 토큰화 주식을 처음으로 광범위하게 허용"이라고 평가.
- **BofA — 캔델테라퓨틱스(CADL) 매수 상향, 목표가 \$18.** JP모건은 로블록스(RBLX) 동시접속 2,870만 명(12월 중순 이후 최고)을 참여도 변곡점으로 지목.

**국내 증권사·시장**
- **비즈니스코리아** — "코스피 7,000선 탈환, 코스닥 동반 상승…원/달러 환율은 하락 마감." 외국인 +1,420억원, 기관 +2,850억원, 개인 −4,180억원.
- **위키트리** — "코스피 7000선 돌파 마감…SK하이닉스 누르고 주도주 등극한 삼성전자." 삼성전자 +4.62%(272,000원).

**구루·시장 코멘트**

- **오스탄 굴스비(시카고 연은 총재)** — 인플레이션이 수요 주도로 확인되면 연준의 인상 속도가 빨라질 수 있다.
- **마이크 두스타(노보노디스크 CEO)** — "독점 상실의 반대편에서 더 크고 훨씬 다각화된 회사로 나올 것"이며 "거의 모든 제약사가 비만 시장에서 경쟁하려 한다."
- **저스틴 패터슨(키뱅크)** — 뮤즈가 월간 활성이용자 수억 명을 확보하면 플랫폼으로서 성공한 것으로 볼 수 있다.
- **스콧 베선트 재무장관** — 미중 협상에 'AI 안전 통보 메커니즘'을 제안. 목요일 트럼프·시진핑 정상회담 의제는 관세 협상과 AI 협력.

### 🇰🇷 한국 개장 관전 포인트
- **야간선물이 +1.96%(1,137.00)로 나스닥 사상 최고를 그대로 받았다.** 시가 1,119.55에서 저가 1,115.75를 거쳐 고가 1,140.55까지 오른 뒤 고가 부근에서 마감해 정규장 선물 종가 1,115.10 대비 +21.90포인트다. 코스피 7,007.72(+1.65%)에 이어 갭 상승 출발 가능성이 크며, 개장 직후 갭을 지키는지가 첫 관문이다.
- **주도주가 하루 만에 바뀌었다 — 미국은 CPU(Arm·인텔·AMD), 국내는 삼성전자.** SK하이닉스는 미국 SKHY +0.73%·국내 +0.59%로 쉬어갔고 삼성전자 +4.62%가 7,000선을 만들었다. 메타 뮤즈발 '추론 수요가 CPU로 확산' 서사는 국내에서는 삼성전자 파운드리·시스템반도체와 AI 서버 부품주에 붙기 쉽다.
- **외국인 이틀째 순매수(+1,420억원)의 지속 여부.** 규모는 여전히 작다. 원/달러 1,381.0원(−2.3원)이 내리는 가운데 외국인이 사흘째 사면 '환율 요인 매도'가 끝났다는 신호이며, 달러인덱스 100.44(+0.2%)·엔/달러 157.45의 엔 약세는 원화에 중립적이지 않다.
- **추석 연휴(9/24~26) 전 이틀.** 연휴 첫날이 트럼프·시진핑 정상회담이고 연휴 중 그레일 자문위·메타 커넥트·PCE·마이크론 실적이 몰려 있다. 사흘간 미국 변동을 못 받는 만큼 수요일 오후 현물·선물 포지션 축소가 수급에 나타날 수 있다.
- **유가 \$95·10년물 4.96%의 조합.** WTI 나흘째 하락은 항공·화학·운송에 우호적이고 금리 되돌림은 성장주에 우호적이지만, 굴스비의 매파 발언과 10월 인상 확률 50% 안팎은 그대로다. 에너지 업종 −1.89%는 국내 정유주에 반대 방향 재료다.
- **SK하이닉스 괴리율 약 +40.2%는 제자리.** 지난주 +45.1% → +39.8%로 좁혀진 뒤 하루 쉬었다. 주 후반 마이크론 실적과 인텔 협력 후속 보도가 HBM 체인의 다음 재료이며, 그 전까지는 삼성전자와의 순환이 이어질 수 있다.
