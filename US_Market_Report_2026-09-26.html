## 🗓 시장 요약

**① 다우 +0.93%·S&P500 +0.51%·나스닥 +0.48% — 유가 반락과 장기금리 진정에 오후 상승폭 확대, 주간 나스닥 +2.3%·S&P500 +2.0%, 마이크로소프트 +3.66%·코스트코 +2.93% vs 메타 −3.33%·인텔 −3.45%**
연준 인상 이후 여덟째 거래일이자 추석 연휴 중 두 번째 미국 거래일, 지수는 개장 직후 S&P500 +0.07%·나스닥 +0.13%의 보합권에서 출발했다가 유가가 밀리고 장기금리가 더 오르지 않자 오후에 상승폭을 키웠다. 다우는 **51,828.59(+478.61, +0.93%)**로 사흘 만에 반등했고 S&P500은 **7,743.50(+39.37, +0.51%)**, 나스닥은 **27,068.72(+129.34, +0.48%)**, 러셀2000은 2,844.32(+0.31%)였다. 주간으로 나스닥 약 +2.3%·S&P500 약 +2.0%로 3대 지수 중 두 개가 오른 한 주를 마쳤고 다우만 약 −0.5%였다. 8월 내구재 주문은 0.0%(예상 −0.4%)로 예상보다 나았고 운송 제외는 +0.3%(예상 +0.6%)였으며, 미시간대 9월 소비심리 확정치는 48.1(예상 47.6, 넉 달 만의 최저)로 고물가가 가계 예산을 잠식하고 있음을 보여 줬다 — 1년 기대인플레이션은 4.6%(예상 4.7%), 5년은 3.4%였다. 캐피털닷컴의 카일 로다는 "기업 이익이 시장의 바닥을 받치고 있고, 지정학·정책 불확실성이 천장을 만들고 있다"고 했고, 블랙록의 릭 리더는 채권 매도를 "위기는 아니지만 경종"이라고 되풀이했다. 종목별로는 마이크로소프트(MSFT) **\$516.17(+3.66%)**·애플(AAPL) \$341.07(+1.53%)이 대형 기술주를 이끌었고, 코스트코(COST) \$922.77(+2.93%)는 실적으로, 휴마나(HUM) \$397.93(+4.63%)는 투자의견 상향으로 올랐으며 메타(META) **\$751.66(−3.33%)**·인텔(INTC) \$123.00(−3.45%)·Z스케일러(ZS) \$193.05(−10.06%)·트윌리오(TWLO) \$275.80(−7.96%)가 밀렸다. 해석하면 이번 주 시장은 '10년물 5%대·유가 \$90대'라는 두 악재를 소화하고도 나스닥이 2%대 올랐고, 금요일 유가 반락은 그 조합의 한 축이 느슨해졌다는 첫 신호였다. 공포·탐욕지수는 38(공포)로 한 주 전 30에서 올라왔다.

**② 10년물 5.18%(장중 5.225% 2007년 이후 최고)·30년물 5.46%·2년물 4.90% — 바 연준 이사 "추가 조정 필요", 10월 인상 확률 71%, 모기지 7.12%, PMI 5년 최강 뒤 글로벌 채권 동반 약세**
미국채 10년물 금리는 장중 5.225%로 2007년 이후 최고를 다시 썼다가 **5.18%(약 −1bp)**로 되돌렸고, 30년물은 장중 5.502%로 2004년 이후 최고를 찍은 뒤 **5.46%**로 마감했으며 2년물은 **4.90%(약 −2bp)**였다. 한 주 내내 이어진 장기물 매도가 금요일에는 멈춘 셈이지만 30년 고정 모기지 금리는 7.12%로 2년여 만의 최고를 유지했다. 연준의 마이클 바 이사는 인플레이션이 "2% 목표를 웃돌고 있고 목표를 향해 분명히 내려가고 있지 않다"며 "추가 정책 조정이 필요할 가능성이 크다"고 했고, 워시 의장은 "올여름 물가 지표는 기저 추세가 의미 있게 개선됐다고 말해 주지 않는다. 인플레이션은 너무 높고 너무 오래 그랬다"고 했다. 선물시장의 10월 인상 확률은 주초 64%에서 71%로 높아졌고, 9월 점도표에서는 19명 중 16명이 연내 추가 인상을 전망했다. ING의 파드라익 가비·벤저민 슈뢰더는 국채 금리가 "순수한 부채 역학"의 압력을 받고 있으며 스와프 스프레드가 특히 10년 구간에서 다시 벌어질 수 있다고 봤고, 일본 국채·영국 길트·독일 분트 금리도 이번 주 나란히 고점을 높였다. 달러는 약세로 엔/달러 157.26(−1.51), 유로/달러 1.1399였고 금은 \$4,321.20(+0.54%)로 사흘 만에 반등했다. 해석하면 '베어 스티프닝'은 이번 주 장기물 5.5% 문턱에서 일단 숨을 골랐지만, 연준 인사들의 발언은 10월 인상을 기정사실화하는 쪽이고 다음 분기점은 10월 10일 9월 CPI다.

**③ WTI \$92.41(−2.33%)·브렌트 \$104.32(−2.14%) 사흘 만에 반락, 주간 브렌트 약 −5% — 호르무즈 '단계적 합의' 협상 기대가 후티의 사우디 미사일 6발 공격을 눌러**
WTI 11월물은 **\$92.41(−\$2.20, −2.33%)**, 브렌트는 **\$104.32(−\$2.28, −2.14%)**로 이틀 급등 뒤 반락했고 주간으로 브렌트는 약 5% 내렸다. 미국과 이란 협상단이 유엔총회 사이드라인에서 이란의 호르무즈 재개방과 미국의 경제 봉쇄 해제를 맞바꾸는 단계적 합의를 논의했고, 이란은 미국이 군사 압박을 줄이면 일주일 안에 해협을 다시 열 수 있다고 밝힌 것으로 전해졌다. 같은 날 사우디아라비아는 예멘 후티 반군이 타이프와 홍해 연안 얀부(동서 파이프라인 수출 허브)를 겨냥해 쏜 탄도미사일 6발을 요격했지만 시장은 외교 쪽에 더 무게를 뒀다. JP모건 애널리스트들은 "우리는 이 게임의 결말을 어떻게 모형화해야 할지 모른다"고 했고, 골드만삭스는 공격이 격화되면 \$120, 수출이 정상화되면 \$80 안팎의 시나리오를 제시했다. 미국 휘발유 평균 가격은 갤런당 약 \$4.50, 베이커휴즈 원유 시추기는 455기(+3)였고, BP는 미국 셰일 확장을 위해 \$20~50억 규모 인수(데번에너지 이글포드 자산 포함)를 검토 중이다. 해석하면 목요일 '공급 차질 vs 외교 출구'의 힘겨루기에서 금요일은 외교 쪽이 이겼고, 유가 하락이 장기금리 상승을 멈춰 세우면서 주식이 오르는 9월 들어 가장 '정상적인' 연쇄가 나왔다.

**④ 반도체 +1.41% 반등 — 샌디스크 +1.38%·SKHY +2.78%·AMD +0.22%(BofA 목표가 \$720) vs 인텔 −3.45%, 아카마이 \$116억 앤스로픽 계약에 장중 +16% 뒤 +3.20%, 코어위브 −2.82%·이퀴닉스 −2.58%**
필라델피아 반도체지수는 장중 12,732.78까지 오른 뒤 **12,668.93(+1.41%)**로 마감해 사흘 만에 반등했다. 메모리에서는 SK하이닉스 ADR(SKHY) **\$191.56(+2.78%)**, 샌디스크(SNDK) \$1,777.80(+1.38%), 마이크론(MU) \$1,082.28(+0.16%)이 이틀 조정을 멈췄고, AMD(AMD)는 BofA가 목표가를 \$720으로 올린 뒤 \$630.63(+0.22%), 엔비디아(NVDA)는 \$225.07(+0.22%)로 보합권이었으며 엔스케일에 \$10억 투자를 약정했다는 소식이 더해졌다. 반면 전날 +3.91%로 가장 강했던 인텔(INTC)은 **\$123.00(−3.45%)**로 상승분을 반납했다. AI 인프라에서는 아카마이(AKAM)가 앤스로픽과 7년 \$116억 클라우드 계약을 발표해 시가 \$125.41·고가 \$128.46(+16.35%)까지 치솟았다가 **\$113.94(+3.20%)**로 상승폭 대부분을 반납했고, 코어위브(CRWV) \$87.59(−2.82%)·클라우드플레어(NET) \$349.02(−2.73%)·이퀴닉스(EQIX) \$1,008.08(−2.58%)·패스틀리(FSLY) \$24.96(−6.45%, 씨티의 AI 트래픽 수익화 의문)도 밀려 '앤스로픽 계약이 경쟁사 몫을 가져간다'는 해석이 붙었다. 오라클(ORCL)은 뉴멕시코 데이터센터 임차료를 가동 여부와 무관하게 내야 한다는 보도에 \$137.10(−1.75%)로 이틀째 약세였다. 대형 기술주에서는 마이크로소프트(MSFT) **\$516.17(+3.66%)**, 애플(AAPL) \$341.07(+1.53%), 알파벳(GOOGL) \$343.92(+0.46%), 아마존(AMZN) \$249.67(+0.12%)이 올랐고 메타(META) **\$751.66(−3.33%)**, 테슬라(TSLA) \$372.11(−1.54%)은 내렸다. 해석하면 반도체는 '재료 없는 조정' 이틀 뒤 유가·금리 진정과 함께 반등했고, 9/30 마이크론 실적 전 메모리 3종이 모두 플러스로 돌아선 것이 9/28 국내 개장에는 가장 직접적인 신호다.

**⑤ 회사 고유 재료 — 코스트코 +2.93%(4분기 EPS \$6.75·동일점포 +6.7%), Z스케일러 −10.06%(CRO 교체), 트윌리오 −7.96%(HSBC 매도 하향), 피플 +11.33%(MGM의 역인수 검토), 휴마나 +4.63%(바클레이스 비중확대·목표가 \$515), 지니어스스포츠 +11.03%(JP모건 신규 커버)**

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 아카마이 (AKAM) +3.20% — \$113.94, 앤스로픽과 7년 \$116억 클라우드 계약(확장 시 \$206억)·지분 최대 5% 워런트 부여, 설비투자 \$55억 예고에 장중 +16.35% 뒤 상승폭 대부분 반납**
아카마이는 시가 \$125.41·고가 \$128.46(+16.35%)에서 하루 종일 밀려 \$113.94(+\$3.53, +3.20%)로 마감했다. 앤스로픽이 7년간 \$116억의 클라우드 서비스 계약을 약정했고 추가로 \$90억을 쓰면 총 \$206억으로 늘어나는 구조이며, 그 대가로 앤스로픽은 보통주 770만 주(약 5%)에 해당하는 전환우선주 워런트를 행사가 \$111.33에 받는다(초기 약정으로 약 2%, 추가 \$90억 지출 시 3% 추가 베스팅). 아카마이는 이를 위해 \$55억의 설비투자를 예상하고 이 중 \$17억을 2026년 공급망 부품 확보에 쓰며, 올해 매출 가이던스에는 영향이 없다고 했다 — 올해 초 공개한 클라우드 인프라 약정 \$28억에 더해진 계약이다. 톰 레이턴 CEO는 "앤스로픽이 대규모 AI 인프라 구축·운영에 아카마이의 역량을 선택해 기쁘다"고 했지만, 시장은 워런트 희석과 \$55억 설비투자의 자금 부담, 그리고 CPU 중심 워크로드라는 계약 성격을 따지며 장중 상승분을 되돌렸다. 같은 날 이퀴닉스(EQIX) −2.58%·클라우드플레어(NET) −2.73%·코어위브(CRWV) −2.82%·패스틀리(FSLY) −6.45%가 동반 약세를 보여 '앤스로픽 물량이 어디로 가는가'가 AI 인프라 종목 간 차별화 재료가 됐다.

**2. 코스트코 (COST) +2.93% — \$922.77, 4분기 EPS \$6.75(예상 \$6.54)·매출 \$957억·동일점포매출 +6.7%(예상 +6.44%)·멤버십 수입 +7.3%, 골드만삭스 큰 폭 상승 여력 제시**
코스트코는 시가 \$886.62·저가 \$883.10(−1.49%)에서 출발해 고가 \$925.14까지 오른 뒤 \$922.77(+\$26.29, +2.93%)로 마감했다. 회계연도 4분기 EPS는 \$6.75로 예상 \$6.54를 넘었고 매출은 \$957억(예상 \$950억), 세전이익 \$40.1억(예상 \$38.8억), 순이익 \$30억이었으며 가스·환율 제외 전사 동일점포매출은 +6.7%로 예상 +6.44%를 웃돌았다. 멤버십 수수료 수입은 전년 대비 +7.3%의 \$18.49억이었고 매출총이익률은 11.02%(−11bp)로 소폭 낮아졌으며, 2026 회계연도 디지털 매출은 \$330억을 넘어 20% 이상 성장했고 2027 회계연도에는 연 30개 순증 출점을 계획한다. 골드만삭스는 실적 뒤 주가의 큰 폭 상승을 전망했고 일부 증권사는 밸류에이션을 이유로 목표가를 조정해 시각이 갈렸지만, 1년간 횡보·하락하던 주가는 소비심리 넉 달 최저(48.1)에도 회원제 소매의 방어력이 확인되며 반등했다. 미시간대 조사에서 고물가가 가계 예산을 잠식하고 있다는 응답이 늘어난 날, 필수소비 업종 안에서 코스트코가 가장 강했다.

**3. Z스케일러 (ZS) −10.06% — \$193.05, 마이크 리치 최고매출책임자(CRO) 개인 사유 사임·로스 태킷 10월 1일자 후임 발표에 영업 조직 불안 우려로 급락**
Z스케일러는 시가 \$205.50에서 장중 \$192.74(−10.20%)까지 밀린 뒤 \$193.05(−\$21.59, −10.06%)로 마감했다. 회사는 전날 장 마감 뒤 마이크 리치 CRO가 개인 사유로 물러나 12월 31일까지 전략 고문으로 남고, 3년간 글로벌 영업 총괄을 맡아 온 로스 태킷(서비스나우·델 출신, 기술 영업 경력 30년 이상)이 10월 1일자로 CRO에 오른다고 공시했다. 제이 초드리 CEO는 태킷이 "운영 규율·글로벌 규모·고객 우선 리더십의 탁월한 조합"을 가져온다고 했지만, 시장은 회계연도 초입의 영업 수장 교체를 가이던스 달성 불확실성으로 읽어 시간외 −4%에서 정규장 −10%로 낙폭을 키웠다. 200여 개 데이터센터에서 제로 트러스트 익스체인지를 운영하는 회사의 펀더멘털 변화는 없다는 것이 회사 설명이지만, 금리 5%대에서 소프트웨어 멀티플이 압축된 상태라 경영진 변동에 대한 반응이 커졌고 사이버보안 업종 전반도 약세였다.

**4. 트윌리오 (TWLO) −7.96% — \$275.80, HSBC가 보유에서 매도로 하향(목표가 \$211) "메타 뮤즈의 AI 음성 스택이 트윌리오의 가치 포착을 제한", 뮤즈 출시 뒤 +30% 랠리 되돌림**
트윌리오는 시가 \$286.68·고가 \$298.45에서 밀려 저가 \$273.65(−8.68%) 부근인 \$275.80(−\$23.86, −7.96%)로 마감했다. HSBC는 투자의견을 보유에서 매도로 내리고 목표가 \$211을 제시하며, 메타가 9월 8일 뮤즈를 출시한 뒤 트윌리오 주가가 30% 올랐지만 메타의 AI 음성 스택이 자체 완결적이어서 트윌리오가 그 가치의 상당 부분을 가져가기 어렵다고 봤다. 뮤즈 수혜주로 묶여 오르던 커뮤니케이션 API 종목에 처음 나온 명시적 매도 의견이라 반응이 컸고, 같은 날 메타(META) 자체도 −3.33%로 밀려 '뮤즈 밸류체인' 전반이 조정받았다. 목표가 \$211은 이날 종가보다 23% 낮은 수준으로, HSBC는 뮤즈발 트래픽 증가가 트윌리오의 매출로 얼마나 전환되는지 확인되기 전까지 프리미엄이 정당화되지 않는다고 했다.

**5. 피플 (PPLI) +11.33% — \$40.00, 전날 MGM 인수 제안 철회 하루 만에 MGM리조트가 거꾸로 피플 인수를 검토한다는 보도, 피플의 MGM 지분 27%(약 \$25억)가 매력**
피플은 시가 \$38.39에서 고가 \$40.50까지 올라 \$40.00(+\$4.07, +11.33%)로 마감했다. 배리 딜러의 피플이 전날 MGM리조트에 대한 \$124억 규모 인수 제안을 철회한 데 이어, 이번에는 MGM이 시가총액 약 \$27억의 피플을 인수하는 방안을 검토한다는 보도가 나왔다 — 피플이 보유한 MGM 지분 약 27%(약 \$25억 상당)를 되사들이는 효과가 있어 사실상 자사주 매입과 같은 거래 구조다. MGM(MGM)은 차입 부담 우려에 \$32.58(−3.29%)로 이틀째 내렸고 BofA는 전날 MGM을 중립으로 내린 상태다. 피플 주가는 여전히 딜러 측이 제시했던 인수 프리미엄에는 못 미치지만, 27% 지분의 처분 경로가 생겼다는 점에서 이틀간의 급락·급등이 갈렸다. 카지노 업종은 라스베이거스 방문객 감소와 금리 5%대가 겹쳐 인수 재료가 아니면 오르기 어려운 국면이다.

**6. 휴마나 (HUM) +4.63% — \$397.93, 바클레이스 앤드루 목이 비중확대로 상향·목표가 \$407 → \$515, "H5216 계약(240만 명, EBIT 약 \$15억·EPS \$9) 보너스 등급 복귀 확률 75%", 장중 +8.74%**
휴마나는 시가 \$389.70에서 장중 \$413.57(+8.74%)까지 치솟아 6월 이후 최대 상승률을 기록한 뒤 \$397.93(+\$17.61, +4.63%)로 마감했다. 바클레이스의 앤드루 목은 투자의견을 동일비중에서 비중확대로 올리고 목표가를 \$407에서 \$515로 27% 높이며, 240만 명이 가입한 핵심 메디케어 어드밴티지 계약 H5216이 2028 등급 사이클에서 보너스 등급(4스타 이상)으로 복귀할 확률을 75%로 봤고 이 계약의 가치가 EBIT 약 \$15억·주당순이익 약 \$9에 해당한다고 추정했다. 그는 회사가 "1년 전보다 훨씬 강한 위치에서 2028 등급 사이클에 들어간다"며 여러 계약이 보너스 등급으로 전환될 것이라는 "점점 더 건설적인 시각"을 밝혔고, 촉매는 10월 8일 전후 발표될 메디케어 스타 등급이다. 2026년 등급에서 4스타 이상 플랜 가입자 비중이 20%로 떨어졌던 회사라 반등 폭이 컸고, 헬스케어 업종에서 가장 큰 상승 종목이었다.

**7. 메타 플랫폼스 (META) −3.33% — \$751.66, 커넥트 랠리 뒤 첫 급락·뮤즈 사용자 급증에 따른 컴퓨트 용량 부담과 오펜하이머의 수익화 시점 의문, HSBC의 트윌리오 하향과 겹쳐 '뮤즈 밸류체인' 조정**
메타는 시가 \$768.84·고가 \$769.57에서 밀려 저가 \$746.54(−3.99%)를 거쳐 \$751.66(−\$25.93, −3.33%)로 마감했고, 전날 +4.50%로 2월 이후 최고를 썼던 상승분의 대부분을 하루 만에 반납했다. 뮤즈의 폭발적 사용자 증가가 컴퓨트 용량 부족으로 이어져 응답 지연과 기능 제한이 보고됐고, 오펜하이머는 뮤즈의 수익화 경로와 시점이 아직 불명확하다고 지적했으며, 전날 JP모건(\$920)·키뱅크(\$900)·시티즌스(\$885)의 목표가 상향 랠리 뒤 차익 매물이 겹쳤다. HSBC가 같은 날 트윌리오를 매도로 내리며 "메타의 AI 음성 스택이 파트너의 가치 포착을 제한한다"고 한 것은 역설적으로 메타의 컴퓨트 비용이 그만큼 커진다는 뜻이기도 하다. 커뮤니케이션 업종은 −1.04%로 S&P500 11개 업종 중 최약이었고, 뮤즈 출시(9/8) 이후 약 18% 오른 주가에서 처음 나온 의미 있는 조정이라 다음 주 컴퓨트 증설 발표나 수익화 로드맵 여부가 관건이다.

**8. 테슬라 (TSLA) −1.54% — \$372.11, 세미 전기트럭 첫 고객 인도 개시(펩시코·DHL·US푸즈, 네바다 연 5만 대 목표)에도 옵티머스 로봇 생산 차질·EU의 FSD 표결 연기 보도에 장중 +2.35%에서 반락**
테슬라는 시가 \$384.90·고가 \$386.83(+2.35%)에서 밀려 저가 \$367.67(−2.72%)를 거쳐 \$372.11(−\$5.83, −1.54%)로 마감했다. 회사는 세미 전기트럭의 첫 고객 인도를 시작했고 초기 고객은 펩시코·DHL·US푸즈이며 네바다 공장에서 연 5만 대 생산을 목표로 한다고 밝혀 장 초반 주가를 밀어 올렸다. 그러나 옵티머스 휴머노이드 로봇의 생산 라인에서 차질이 빚어지고 있다는 보도와 유럽연합이 FSD(완전자율주행) 승인 표결을 연기했다는 소식이 이어지며 상승분을 반납했다 — 두 사안 모두 '자동차 회사'가 아니라 '로봇·자율주행 회사'로서의 밸류에이션을 받치는 핵심 서사에 닿는 재료다. 나스닥이 +0.48% 오른 날 대형 기술주 가운데 메타와 함께 하락한 두 종목 중 하나였고, 10월 초 3분기 인도량 발표가 다음 확인 지점이다.

**9. 나이키 (NKE) −0.67% — \$35.75, BofA가 중립에서 언더퍼폼으로 하향·목표가 \$47 → \$30, 2027~2028 회계연도 EPS 추정 11~12% 하향 "2027 회계연도까지 매출 감소 지속"**
나이키는 시가 \$35.25·저가 \$35.22(−2.15%)에서 고가 \$36.18까지 반등했다가 \$35.75(−\$0.24, −0.67%)로 마감했다. BofA는 투자의견을 중립에서 언더퍼폼으로 내리고 목표가를 \$47에서 \$30으로 36% 낮추며 2027 회계연도와 2028 회계연도 EPS 추정치를 각각 11%·12% 하향했고, 2027 회계연도까지 매출 감소가 이어져 2027 회계연도 EPS가 컨센서스보다 14% 낮을 것으로 봤다. 목표가 \$30은 이날 종가보다 16% 낮은 수준으로 대형 소비재 종목에 대한 이례적으로 강한 매도 의견이지만, 주가는 이미 1년 새 크게 낮아진 상태라 낙폭은 −0.67%에 그쳤고 장중에는 플러스로 돌아서기도 했다. 미시간대 소비심리 넉 달 최저·고물가에 따른 재량 소비 위축이라는 거시 배경에 재고·도매 채널 정리라는 회사 고유 문제가 겹쳐 있으며, 다음 주 회계연도 1분기 실적 발표가 BofA 시나리오의 첫 검증대다.

**10. 지니어스 스포츠 (GENI) +11.03% — \$6.44, JP모건 새뮤얼 닐슨이 비중확대·목표가 \$8(당시 주가 대비 +26%)로 신규 커버 "강한 매출 성장과 개선되는 수익성", 상반기 매출 +46%**
지니어스스포츠는 시가 \$6.15에서 고가 \$6.57(+13.27%)까지 올라 \$6.44(+\$0.64, +11.03%)로 마감했다. JP모건의 새뮤얼 닐슨은 스포츠 리그·스포츠북·광고주에 데이터와 기술을 공급하는 이 회사를 비중확대·목표가 \$8로 신규 커버하며 "강한 매출 성장과 개선되는 수익성"을 근거로 들었고, 목표가는 커버 개시 시점 주가보다 26% 높다. 회사는 2025년 매출 \$6.7억에 시가총액 \$20억 미만이며 올해 상반기 매출은 약 46% 성장했지만 주가는 1년간 50% 내려 4월의 수년래 저점 근처에 머물러 왔다 — 대형 증권사의 첫 커버가 저평가 소형주의 가시성을 높인 전형적 사례다. 스포츠 베팅 시즌(NFL 개막) 한가운데 나온 커버라 거래량도 급증했고, 러셀2000이 +0.31%에 그친 날 소형주 가운데 두드러진 상승이었다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **바클레이스 — 휴마나(HUM) 비중확대 상향, 목표가 \$407 → \$515.** 앤드루 목: H5216 계약(240만 명) 보너스 등급 복귀 확률 75%, EBIT 약 \$15억·EPS \$9 상당. 촉매는 10월 8일 전후 스타 등급 발표.

### 🇰🇷 한국 개장 관전 포인트
- **연휴 마지막 날 — 국내 정규장·야간선물 모두 휴장(9/24~26), 9/28(월) 재개.** 코스피200 야간선물은 연휴 기간 파생상품 야간시장이 열리지 않아 조회 스크립트가 ERR(시세 미갱신)을 반환했고 직전 9/22 밤 세션 종가는 1,140.70이다. 연휴 중 미국 3거래일은 나스닥 9/23 −0.6%대 → 9/24 +0.01% → 9/25 +0.48%로 합산 소폭 상승, 다우는 금요일 +478포인트로 주간 낙폭을 만회했다.
- **메모리 반등 — SKHY +2.78%(\$191.56)·샌디스크 +1.38%·마이크론 +0.16%, 괴리율 약 +36.0% → 약 +39.7%.** 9/23 원주 1,862,000원·환율 1,358.4원 기준으로 ADR 프리미엄이 다시 40% 가까이 벌어져 9/28 SK하이닉스 개장 갭은 소폭 플러스 쪽이 유력하다. 다만 9/30 새벽 마이크론 실적이 이틀 뒤라 갭 이후 추격보다는 실적 확인이 먼저다.
- **아카마이-앤스로픽 \$116억 계약과 'AI 지출의 행선지'.** 앤스로픽이 CPU 중심 워크로드를 아카마이에 맡기고 아카마이가 \$55억 설비투자를 예고한 것은 AI 인프라 총량이 계속 커진다는 뜻이지만, 이퀴닉스·코어위브·클라우드플레어 동반 하락은 시장이 '누가 가져가는가'를 가르기 시작했다는 신호다. 국내 전력기기·서버 부품주에는 총량 증가가, HBM에는 GPU 클러스터(xAI 콜로서스2 GB300 44만 개 등) 확장이 각각의 근거다.
- **금리·유가 — 10년물 5.18%(장중 5.225%)·30년물 5.46%, WTI \$92.41(−2.33%).** 장기물 매도가 일단 멈추고 유가가 사흘 만에 밀린 조합은 연휴 뒤 외국인 수급에 우호적이나, 바 이사·워시 의장 발언은 10월 인상(확률 71%)을 예고한다. 달러 약세(엔/달러 157.26)는 원화 강세 요인이고, 10/10 CPI까지가 안도 구간이다.
- **뮤즈 밸류체인 조정 — 메타 −3.33%·트윌리오 −7.96%.** 뮤즈 수요 급증이 컴퓨트 용량 부담과 수익화 의문으로 되돌아온 것은 국내 AI 소프트웨어·광고 테마의 과열 점검 신호이며, 반대로 컴퓨트 증설 압력은 메모리·전력 수요에는 우호적이다.
- **소비 둔화 신호 지속 — 미시간 소비심리 48.1(넉 달 최저), 나이키 BofA 매도, 코스트코만 강세.** 회원제·필수소비는 버티고 재량 소비는 밀리는 구도가 뚜렷해졌고, 국내 소비재의 미국향 수요보다는 금리 사이클 종료 시점을 앞당기는 변수로 읽는 것이 맞다.
