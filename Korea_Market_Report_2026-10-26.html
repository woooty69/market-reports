# 📊 한국증시 데일리 리포트 (휴장 브리핑)
### 2026년 10월 26일(월) 작성 · 기준일: 10월 23일(금) 정규장 (휴장 브리핑 — 10/24～10/25 휴장)

> 주말 휴장이 끝나고 오늘(10월 26일 월) 증시가 다시 열립니다. 마지막 거래일인 10월 23일(금) 코스피는 5,550.30(+0.30%), 코스닥은 751.69(−1.62%)로 마감했고, 외국인은 코스피에서 9,811억원을 팔았습니다. 일요일 오후부터 월요일 새벽 사이에는 SK하이닉스의 키옥시아 지분 차익을 활용한 16조원 규모 특별배당 추진 보도, 노무라의 삼성전자 67만원·SK하이닉스 470만원 목표가 유지, HD현대의 미국 키윗과 합작 조선소 설립, 방사청의 LIG디펜스앤에어로스페이스 2년 입찰 제한, 삼성바이오로직스 노조의 12억원 파업기금 가결, 미래에셋증권 스페이스X 공모주 '0주 배정' 제재 착수 등이 새로 나왔습니다. 이번 주는 10월 FOMC(10/27～28)와 삼성전자·SK하이닉스 3분기 실적(28·29일 전후)이 몰린 '슈퍼위크'입니다.

## 🗓 시장 요약

**① 반도체 투톱 '주주환원' 기대 재점화** — 휴장 중 SK하이닉스가 일본 키옥시아 지분 평가차익 약 16조원을 활용한 특별배당을 추진한다는 단독 보도가 나왔다. 삼성전자·SK하이닉스는 "초과현금 환원"과 자사주 매입 한도 증액 등을 언급하며 주주환원 확대 기조를 밝혔고, 두 회사의 3분기 합산 영업이익이 180조원을 넘을 수 있다는 전망도 나왔다. 노무라는 주가 급락에도 삼성전자 67만원·SK하이닉스 470만원 목표주가를 유지했다.

**② 외국인 이탈·증시 체력 저하** — 외국인은 10월 들어 삼성전자·SK하이닉스를 대거 팔았고 23일에도 코스피에서 9,811억원을 순매도했다. 투자자예탁금은 90조원 아래로 내려갔고 거래대금은 연중 최저 수준으로 줄었으며, 10대 그룹 시총은 한 달 새 1,100조원가량 사라졌다(이 중 '삼전닉스' 995조원). 정부의 '코리아 디스카운트' 개혁 논의가 다시 부각됐다.

**③ 조선·방산 엇갈린 뉴스** — HD현대는 미국 건설사 키윗과 'HD키윗조선' 합작 계약을 맺고 미국에 새 조선소를 짓기로 해 한화와 '마스가' 주도권 경쟁에 나섰다. 반면 방사청은 뇌물 혐의와 관련해 LIG디펜스앤에어로스페이스에 2년 입찰 참가 제한을 내리고 대드론 체계 방산업체 지정 취소도 추진해 방산주 투자심리에 부담이 됐다.

**④ 금융주: 3분기 실적 무난, 가계대출 증가** — 하나금융지주(지배순이익 1조 2,214억원, 컨센서스 부합)와 우리금융지주(1조 492억원, 컨센서스 7.8% 상회)의 3분기 실적에 대해 증권사들은 매수 의견을 유지했다. 은행 가계대출은 주식 빚투와 주담대로 2.6조원 늘어 가산금리·건전성 이슈가 함께 부각됐다.

**⑤ 약세 우려 요인** — 현대차는 판매 부진으로 3분기 실적에 '비상'이 걸려 기아에 이익이 추월당할 수 있다는 보도가 나왔다. 삼성바이오로직스 노조는 12억원 파업기금 조성안을 가결해 총파업 재개를 준비하고, 포스코 노조는 11월 2일 무기한 파업을 예고한 상태다. K배터리는 전기차 시장 회복에도 점유율이 떨어졌다는 분석이 나왔다.

**⑥ 다음 거래일(10/26) 변수** — 이번 주는 10월 FOMC(10/27～28)와 삼성전자·SK하이닉스 3분기 실적, 미국 빅테크 실적이 몰린 '슈퍼위크'다. 코스피는 5,500선 지지 여부가 관건이며, 외국인 매도 강도와 원/달러(1,320원대) 흐름, 11월 3일 미국 중간선거를 앞둔 업종 순환이 함께 변수로 꼽힌다.

## 1. 업종별 흐름

**상승 업종** — 휴장 중 뉴스 기준 호재 업종은 반도체와 조선이다. 반도체는 SK하이닉스의 16조원 특별배당 추진 보도와 3분기 합산 영업익 180조원 전망, 구형 D램까지 가격이 오르는 AI발 공급난 기사가 겹쳤다(직전 거래일 반도체와반도체장비 업종 +0.89%). 조선은 HD현대의 미국 키윗 합작 조선소 설립으로 '마스가' 기대가 이어졌고, 건설은 삼성물산의 도시정비 첫 '10조 클럽' 입성과 30조원 규모 목동 재건축 수주전이 부각됐다(직전 거래일 건설 +1.05%).

**하락 업종** — 악재 업종은 방산·자동차·2차전지다. 방산은 LIG디펜스앤에어로스페이스의 2년 입찰 제한으로 신규 수주 공백 우려가 커졌다(직전 거래일 우주항공과국방 −4.49%). 자동차는 현대차 3분기 실적 부진 우려가, 2차전지는 K배터리 점유율 하락과 전고체 '속도조절론'이 부담이다(직전 거래일 전기장비 −4.28%, 화학 −3.86%). 증권은 예탁금 90조원 붕괴와 미래에셋증권 제재 착수가 겹쳤다.

**시장의 시선** — 다음 거래일에는 실적 발표를 앞둔 반도체 투톱과 주주환원 수혜가 거론되는 지주사(SK·SK스퀘어), 3분기 실적이 확인된 금융지주가 관심이다. 제약 업종은 직전 거래일 +2.26%로 가장 강했고 연말 기술수출 성수기 기대가 이어진다. 보안주는 PHP 취약점 해킹 여파 속 일본 시장 공략 뉴스가 나왔다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 45종목

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
