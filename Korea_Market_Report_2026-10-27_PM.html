# 📊 한국증시 데일리 리포트 (저녁판)
### 2026년 10월 27일(화) 18시 작성 · 기준일: 10월 27일(화) 정규장 (저녁판)

> 10월 27일 정규장 마감과 장 마감 후 18시대까지 나온 뉴스·공시·증권사 리포트를 정리했습니다. 코스피는 앤트로픽의 상장 신청(S-1 공개)으로 AI 수익성 기대가 되살아나며 장중 매수 사이드카가 발동됐고, 168.87포인트(+3.09%) 오른 5,638.34로 마감해 하루 만에 5,600선을 되찾았습니다. 외국인(+5,953억원)과 기관(+2,876억원)이 함께 샀고 프로그램도 6,173억원 순매수였습니다. SK하이닉스(+6.98%)·삼성전자(+4.69%)·SK스퀘어(+9.88%)·삼성전기(+8.50%)가 지수를 끌었고 소캠·CXL·반도체 기판·HBM 테마가 일제히 급등했습니다. 3분기 GDP는 전기 대비 1.0% 늘어 예상을 웃돌았습니다. 장 마감 후에는 HD현대일렉트릭·한화오션·셀트리온·신한금융의 3분기 호실적, 네이버의 브룩필드 12조원 AI 인프라 계약, ㈜두산의 3,992억원 김제 CCL 증설, HD현대중공업 임단협 타결, 'JYP 공개매수 예고'에 대한 금감원 경고가 나왔습니다.

## 🗓 시장 요약

**① 코스피 5,638.34(+3.09%), 매수 사이드카 속 5,600선 탈환… 외국인 5,953억원·기관 2,876억원 쌍끌이**
간밤 앤트로픽이 상장 신청 서류(S-1)를 공개하며 흑자전환과 대규모 컴퓨팅 투자 계획을 내놓자 AI 수익성 의구심이 누그러졌고, 필라델피아 반도체지수(+2.82%)가 급등한 흐름을 이어받아 코스피는 장 초반 4%대 오르며 매수 사이드카가 발동됐다. 외국인은 KRX 기준 5,953억원, NXT를 포함한 통합 기준 8,263억원을 순매수했고 기관은 투신(+1,804억원)·금융투자(+1,652억원) 중심으로 2,876억원을 샀지만 연기금은 1,265억원을 팔았다. 정규장 마감(15:35) 기준 수급(외국인 +5,930억원·기관 +2,804억원)과 일 최종치의 차이는 크지 않았다. 한국은행이 발표한 3분기 GDP가 전기 대비 1.0%(전년 대비 3.4%) 늘어 시장 예상을 웃돈 것도 투자심리를 거들었다.

**② 반도체: SK하이닉스 +6.98%·삼성전자 +4.69%… '136만닉스·22만전자' 복귀, 기판·장비주로 온기 확산**
SK하이닉스는 1,364,000원으로 거래대금 3조 9,397억원으로 시장 1위였고 프로그램 매매로 3,666억원이 순매수됐다. 삼성전자는 223,000원으로 올랐지만 프로그램은 881억원 순매도였고, 장 마감 후에는 삼성전자·SK하이닉스가 주주에게 '210조원+α'를 환원할 것이라는 보도와 증권사들이 두 종목의 신규 신용융자를 중단한다는 보도가 함께 나왔다. 테마로는 소캠(SOCAMM) +9.03%(11종목 전부 상승)·CXL +8.53%·반도체 기판 +8.23%(14종목 중 13종목 상승)·HBM +5.31%·반도체 장비 +5.42%(97종목 중 91종목 상승)로 반도체 전반이 고르게 올랐다. 심텍(+10.16%)·코리아써키트(+14.31%)·대덕전자(+7.60%) 등 기판주와 티에프이(+24.23%)·엑시콘(+21.98%) 등 테스트 장비주가 급등했다. 내일(28일)은 SK하이닉스 3분기 실적과 주주환원 규모 발표가 예정돼 있다.

**③ 강세 업종: 전자부품·소프트웨어·보안·카메라모듈**
전자장비와기기(+7.08%, 상승 80·하락 20)는 삼성전기(+8.50%, 거래대금 9,112억원)가 이끌었고, 소프트웨어(+6.95%)는 PHP 보안 취약점 확산에 국정원이 공공 전산망 일시 중지를 검토한다는 보도가 나오며 안랩(+20.32%)·지니언스(+11.83%)·샌즈랩(+27.49%) 등 보안주가 급등했다. 현대차그룹 보스턴다이내믹스의 휴머노이드 '아틀라스' 공급망 윤곽이 보도되면서 카메라모듈/부품 테마(+4.99%)의 나무가(+29.96%, 상한가)·엠씨넥스(+20.23%)와 감속기 관련 우림피티에스(+17.13%)도 올랐다. 2차전지는 삼성SDI(+5.07%)·에코프로(+6.74%)·에코프로비엠(+5.69%)이 반등했고 에코앤드림(+12.38%)은 유미코아향 173억원 전구체 공급 계약을 공시했다.

**④ 약세 업종: 제약·바이오와 실적 부진주**
제약 업종이 −2.60%(상승 76·하락 80)로 가장 약했고 삼성바이오로직스(−5.72%)가 반도체 쏠림 장세에서 크게 밀렸다. 에스티팜(−9.49%)은 3분기 매출 976억원(+19% YoY)을 발표했지만 하락했고, 전날 급등했던 지투지바이오(−13.05%)는 중국 파트너 측이 평가계약을 공시하지 않았다는 보도에 급락했다. HD현대에너지솔루션(−12.15%)은 3분기 영업이익이 컨센서스를 41% 밑돈 '실적 쇼크'에 증권사 목표가가 줄줄이 내려갔다. 금융주는 BNK금융지주(+7.39%)가 낙폭 과대 인식에 반등했지만 메리츠금융지주(−2.08%)·기업은행(−1.93%)·우리금융지주(−0.68%)는 약했다. 테마로는 김밥(−3.67%)·주류(−1.61%)·리츠(−0.90%)·면역항암제(−0.75%)가 하위였다.

**⑤ 환율·금리·외부 변수: 미국 지수 선물 보합, FOMC·빅테크 실적 대기**
전날 미국 증시는 앤트로픽 상장 기대에 나스닥(+0.83%)·S&P500(+0.70%)이 올랐고 필라델피아 반도체가 2.82% 급등했다. 작성 시점 S&P500 선물은 −0.08%, 나스닥100 선물은 −0.27%로 보합권이고 닛케이는 +1.73%, 상해종합(−1.33%)·항셍(−0.73%)은 내렸다. 원/달러 하나은행 고시는 1,326.70원으로 보합이었다. 주간 선물에서 외국인은 463계약을 순매도했고 미결제약정은 149,548계약(+673), 월물 옵션 미결제 PCR은 0.43(콜 950·풋 800에 미결제 집중)이다. 고객예탁금은 10/23 기준 89조 8,626억원으로 1조 1,784억원 늘었고 신용잔고는 30조 1,522억원이다. 미국 FOMC(10/27～28)와 마이크로소프트·알파벳·아마존 실적이 이번 주 남은 변수다.

**⑥ 코스닥 743.83(+2.29%), 기관 1,505억원 매수… 반도체 소부장 급등, 바이오는 약세**
코스닥은 기관이 투신(+663억원)·연기금(+431억원) 중심으로 1,505억원을 사고 외국인도 238억원을 순매수해 2.29% 올랐다. 시가총액 상위주는 심텍(+10.16%)·에코프로(+6.74%)·원익IPS(+6.04%)·에코프로비엠(+5.69%)·주성엔지니어링(+5.19%)·이오테크닉스(+4.22%)가 강했고 알테오젠(−0.23%)은 보합이었다. 멜콘·나무가·액스비스가 상한가를 기록했고 티에프이(+24.23%)·엑시콘(+21.98%)·안랩(+20.32%)·기가비스(+15.38%)·네오셈(+14.88%)이 급등했다. 반면 지투지바이오(−13.05%)·에스티팜(−9.49%)·올릭스(−5.20%)·RF머트리얼즈(−4.52%)는 약했고, 상장 직후 급락했던 엘리스(+5.74%)는 거래대금 3,800억원으로 코스닥 1위를 기록하며 반등했다.

**시장의 시선** — 하루 전 5,500선을 내줬던 코스피가 앤트로픽 상장 신청 하나로 3% 넘게 반등하며 'AI 투자 회수' 우려와 기대가 하루 단위로 교차하는 장세가 이어지고 있다. 장 마감 후 반도체주에 대해 'PER 3배 저평가, 빅테크 실탄이 충분해 반등할 것'이라는 분석과 '11월 고비를 넘기면 외국인이 돌아온다'는 전망이 나왔고, 현대차증권은 외국인 수급이 미국 중간선거(11/3) 이후 개선될 것으로 봤다. 다만 증권사들이 삼성전자·SK하이닉스 신규 신용융자를 중단하고 두 종목의 대차거래 잔액이 한 달 새 11조원(−26%) 줄었다는 보도처럼 레버리지 관리 움직임도 함께 나타났다. 거래소의 신규 산업분류(KRICS) 적용으로 삼성SDI는 산업재, SK는 IT로 분류가 바뀌며 ETF 88조원이 영향을 받을 수 있다는 분석도 나왔다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
