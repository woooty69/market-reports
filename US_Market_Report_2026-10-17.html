## 🗓 시장 요약

**① 나스닥 26,140.03(−2.15%)·S&P500 7,659.44(−1.09%)·다우 52,002.41(−0.34%) — 'AI 거품' 우려 재점화, 기술주 매도·방어주 순환**
장 초반 다우는 0.7% 가까이 오르고 S&P500도 보합권에서 출발했지만, 오전 중반부터 AI 인프라주 매도가 거세지며 지수가 차례로 밀렸다. 나스닥은 고가 26,674.66에서 **26,140.03(−572.99, −2.15%)**, S&P500은 **7,659.44(−84.62, −1.09%)**, 다우는 **52,002.41(−175.28, −0.34%)**로 마감했다. 나스닥100은 29,187.55(−2.50%), 러셀2000은 2,721.37(−1.66%), VIX는 19.99(+21.45%)로 뛰었다. S&P 기술 업종은 3% 넘게 내렸고 에너지 업종은 유가 급반등에 2.52% 올랐으며, 미국 상장 종목의 약 3분의 2가 하락했다. 주간 기준으로 S&P500과 나스닥은 하락, 다우는 상승으로 엇갈렸다.

**② 2년물 4.74%(−3.0bp)·10년물 5.09%(−1.0bp)·30년물 5.43%(보합) — 워시 의장 추가 긴축 신호 없어, 금리는 고점권 횡보**
미 재무부 기준 2년물은 **4.74%(−3.0bp)**, 10년물은 **5.09%(−1.0bp)**, 30년물은 **5.43%(보합)**였다. 케빈 워시 연준 의장은 방콕에서 중앙은행 관계자들 앞에서 연설했지만 추가 금리 인상에 대한 신호는 주지 않았다. 다만 이번 주 예상을 웃돈 CPI·PPI로 10년물이 5%대에 머물면서, 빌려서 AI 투자를 하는 기업들이 금리 민감주처럼 움직이는 흐름이 뚜렷해졌다. 9월 산업생산은 4월 이후 최대 폭으로 늘었고 수입물가도 크게 올랐다는 보도가 이어졌다.

**③ WTI \$98.97(+1.02%)·브렌트 \$109.77(+3.63%) — IEA 비축유 방출에 장 초반 약세, 오후 호르무즈·홍해 긴장에 급반등**
장 초반 국제에너지기구(IEA)가 3월 합의분 가운데 남은 1억 배럴을 방출하겠다고 밝히고 미국의 러시아 '그림자 선단' 제재 완화 검토 보도가 겹치며 WTI는 \$95.29까지 밀렸다. 그러나 트럼프 대통령이 이란 핵시설을 다시 타격할 수 있다고 언급하고 호르무즈 해협과 홍해에서 유조선 피격이 이어지면서 WTI는 **\$98.97(+1.02%)**, 브렌트는 고가 \$110.00 부근까지 올라 **\$109.77(+3.63%)**로 정산했다. 금 선물은 \$4,190 안팎으로 소폭 올랐고 비트코인은 \$81,000대에서 2주 연속 주간 하락이 예상됐다.

**④ AI·반도체 — SOX 11,137.29(−3.83%)·코어위브 −11.91%… 반도체 ETF 9거래일 연속 하락, 2006년 이후 처음**
코어위브(CRWV)는 약 \$500억 규모 부채가 AI 데이터센터 붐의 '신용 의존' 논란의 중심에 서면서 **\$61.39(−11.91%)**로 급락했고, 젠슨 황 엔비디아 CEO의 "코어위브의 재무 체력은 매일 좋아지고 있다"는 발언에도 매도가 멈추지 않았다. 엔비디아(NVDA)는 \$214.13(−1.43%), 코히어런트(COHR)는 \$232.90(−7.06%)였다. 반도체 ETF(SOXX)는 9거래일 연속 하락이 확실시되며 2006년 5월 이후 첫 기록을 썼고, 필라델피아 반도체지수는 **11,137.29(−3.83%)**로 저가 11,128.08 부근에서 마감했다. 캐피털닷컴의 다니엘라 하손은 금리 상승과 AI 투자 회수 의문이 겹쳐 나스닥이 특히 취약하다고 짚었다.

**⑤ 회사 고유 재료 — 트윌리오 −10.62%, 스트래티지 MSCI 편출 우려 −9.56%, 모더나 임상 발표 앞두고 −7.82%**
S&P500 편입 직후 차익 실현이 쏟아진 트윌리오(TWLO)는 **\$244.37(−10.62%)**, MSCI가 '비영업 회사'를 지수에서 제외하는 새 규칙을 내놓은 스트래티지(MSTR)는 **\$136.83(−9.56%)**, 머크와 공동 개발 중인 mRNA 암백신 3상 결과 발표를 앞둔 모더나(MRNA)는 **\$218.01(−7.82%)**로 내렸다. 반면 실적을 낸 트래블러스(TRV)는 장중 −3.98%에서 **\$389.54(+1.47%)**로, 트루이스트(TFC)는 **\$47.07(+1.07%)**로 돌아섰다. 테슬라(TSLA)는 신형 로드스터 공개로 장 초반 +2.25%까지 올랐다가 \$354.72(−2.13%)로 밀렸다.

**⑥ 🇰🇷 SK하이닉스 ADR \$136.49(−6.58%)·SOX −3.83%·코스피200 야간선물 850.70(−3.44%) — 반등 하루 만에 다시 반도체 압박**

해석하면 월요일 국내 반도체 대형주는 미국 반도체지수 −3.83%와 야간선물 −3.44%를 반영해 약세 출발 가능성이 높다. 주말 동안 중동 정세와 다음 주 테슬라·넷플릭스 실적이 변수다.

## 1. 업종별 흐름

**상승 업종 3**
- **에너지** — S&P 에너지 업종 +2.52%, WTI \$98.97·브렌트 \$109.77로 유가가 급반등했다.
- **소재** — 미국 철강 가격 상승에 뉴코어(NUE) +0.63%(\$256.29), 업종이 오후까지 강세를 지켰다.
- **금융·보험** — 트래블러스(TRV) +1.47%(\$389.54), 트루이스트(TFC) +1.07%(\$47.07). 비자·마스터카드·메트라이프가 장중 사상 최고가를 다시 썼다.

**하락 업종·종목**
- **반도체·AI 인프라** — 코어위브(CRWV) −11.91%(\$61.39), 코히어런트(COHR) −7.06%(\$232.90), 셈텍(SMTC) −5.19%(\$136.73), 엔비디아(NVDA) −1.43%(\$214.13), SK하이닉스 ADR(SKHY) −6.58%(\$136.49).
- **소프트웨어·인터넷** — 트윌리오(TWLO) −10.62%(\$244.37), 넷플릭스(NFLX) −2.86%(\$70.53).

**시장의 시선** — 'AI 기업이 스스로 돈을 버는 쪽과 빌려서 투자하는 쪽으로 갈리고, 빌리는 쪽은 금리 민감주처럼 움직인다'는 분석이 힘을 얻고 있다. 10년물 5%대가 이어지는 한 부채 의존도가 높은 AI 인프라주의 변동성은 쉽게 줄지 않을 전망이며, 자금은 에너지·금융·헬스케어 같은 현금창출형 우량주로 옮겨가고 있다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 코어위브 (CRWV) −11.91% — 약 \$500억 부채가 'AI 신용 붐' 논란의 중심, 젠슨 황 지지 발언에도 급락**
코어위브는 시가 \$65.19에서 저가 \$59.90(−14.05%)까지 밀린 뒤 \$61.39(−\$8.30, −11.91%)로 마감했다. 로이터 집계 기준 약 \$500억에 이르는 부채가 데이터센터 붐을 신용이 떠받치고 있다는 우려의 상징이 됐고, 최근 5거래일 하락폭은 20%를 넘었다. 지분 약 10%를 가진 2대 주주 엔비디아의 젠슨 황 CEO는 스톡홀름에서 "코어위브의 재무 체력은 매일 좋아지고 있고 자본 비용은 오히려 낮아지고 있다"고 말했으며, BofA의 탈 리아니는 '매수'와 목표주가 \$140을 유지하며 "펀더멘털이 아니라 심리 문제"라고 평가했다.

**2. 트윌리오 (TWLO) −10.62% — S&P500 편입 직후 차익 실현, 10월 29일 3분기 실적 앞둔 밸류에이션 부담**
트윌리오는 시가 \$276.58에서 고가 \$278.25(+1.77%)까지 오른 뒤 저가 \$236.85(−13.37%)까지 밀려 \$244.37(−\$29.03, −10.62%)로 마감했다. 프리마켓에서는 AI 에이전트 수요 기대에 따른 애널리스트들의 목표주가 상향으로 3.28% 올랐지만, S&P500 편입이 반영된 직후 차익 실현 매물이 쏟아졌다. 10월 29일 3분기 실적 발표를 앞두고 밸류에이션 부담이 부각되며 시가총액 \$20억 이상 종목 가운데 하락률 상위에 올랐다.

**3. 스트래티지 (MSTR) −9.56% — MSCI '비영업 회사' 지수 제외 규칙 발표, 11월 30일 장 마감 후 적용**
스트래티지는 시가 \$146.14에서 저가 \$134.11(−11.36%)까지 밀린 뒤 \$136.83(−\$14.46, −9.56%)로 마감했다. MSCI가 투자펀드처럼 보이는 '비영업 회사'를 지수에서 제외하는 새 규칙을 내놓으면서 스트래티지와 메타플래닛 등이 편출 대상으로 거론됐다. 최종 명단은 11월 11일 공개되고 규칙은 11월 30일 장 마감 후 적용되며, 전 세계 비트코인의 약 4%를 보유한 회사인 만큼 비트코인이 \$81,000대에서 2주 연속 주간 하락한 것도 부담이 됐다.

**4. 모더나 (MRNA) −7.82% — 머크와 공동 개발한 mRNA 암백신 인티스메란 3상 결과 발표 앞두고 포지션 축소**
모더나는 시가 \$234.90에서 저가 \$208.92(−11.66%)까지 밀린 뒤 \$218.01(−\$18.49, −7.82%)로 마감했다. 머크와 함께 개발 중인 mRNA 기반 개인 맞춤형 암백신 인티스메란의 3상 데이터가 이달 말 발표될 예정이어서, 결과를 앞두고 투자자들이 노출을 줄였다. 장중 한때 10% 넘게 빠졌다가 오후 들어 저가 대비 4% 가량 회복했다.

**5. 스페이스X (SPCX) −1.74% — 에버코어 ISI 목표주가 \$230→\$275 상향·'시장수익률 상회', 테슬라 로드스터 추진기 협력**
스페이스X는 시가 \$147.82에서 저가 \$142.96(−3.81%)까지 밀린 뒤 \$146.03(−\$2.59, −1.74%)로 마감했다. 에버코어 ISI는 투자의견 '시장수익률 상회'를 유지하며 목표주가를 \$230에서 \$275로 올렸고, 테슬라가 스페이스X 텍사스 시설에서 공개한 신형 로드스터에 스페이스X 추진기 기술이 쓰였다는 소식도 장 초반 매수를 불렀다. 6월 12일 공모가 \$135로 상장해 6월 16일 사상 최고가 \$225.64를 찍은 뒤 조정이 이어지는 가운데, 이날은 기술주 매도에 밀려 하락 마감했다.

**6. 셈텍 (SMTC) −5.19% — 투자자의 날에 3분기 가이던스 상향·2030년 목표 제시, 반도체 매도에 상승분 반납**
셈텍은 시가 \$145.77에서 고가 \$146.66(+1.70%)까지 오른 뒤 \$136.73(−\$7.48, −5.19%)로 마감했다. 회사는 투자자의 날에서 2027 회계연도 3분기 매출·이익 가이던스를 상향하고 2030년 장기 전망을 제시했으며, 이에 애널리스트들의 투자의견 상향이 이어지며 프리마켓에서 4.36% 올랐다. 그러나 반도체 업종 전반의 매도세에 휩쓸려 장 초반 상승분을 모두 반납했다.
