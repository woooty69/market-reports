# 미국→한국 선점 2026-10-14 (미국 2026-10-14 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 73개 · 연결 종목 881개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 16개:** Plastic Products(격차 +25.8%p), 유통·이커머스(격차 +22.4%p), 화장품·K뷰티(격차 +17.8%p), AI 소프트웨어·에이전트(격차 +17.6%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** Oil & Gas Production — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 사이버보안(-25.6%p), 의료AI·디지털헬스(-14.7%p)
- **이제 막 힘 붙는 조기 테마:** 의류 OEM·패션(조기 93), 중국 소비·관광 회복(조기 76), Oil & Gas Production(조기 76) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 코스맥스(화장품·K뷰티, 점수 100), 한국콜마(화장품·K뷰티, 점수 89), 아모레퍼시픽(화장품·K뷰티, 점수 84)
