## 🗓 주말 요약

**① 이번 주는 세 개의 이벤트가 방향을 결정한다 — 오늘부터 시작이다**
주말 중 미국 증시는 휴장이었지만, 이번 주는 **8/24(월) 베선트 대이란 제재 발표 → 8/26(수) 엔비디아 실적 → 8/28(금) 워시 잭슨홀 기조연설 + 7월 근원 PCE**로 이어지는 촘촘한 일정이 기다린다. 지난주 시장을 지배한 것은 실적이 아니라 **금리**였고, 30년물이 **5.3%를 웃돈 것**이 반도체를 무너뜨렸다(SOX 주간 −5.45%). 이번 주 세 이벤트는 각각 **유가·AI·금리**라는 세 축을 하나씩 건드린다. 하나라도 어긋나면 지난주의 금리 발작이 되풀이될 수 있고, 셋 다 무난하면 코스피 7,000선 재도전의 발판이 된다.

**② 오늘(8/24) 베선트가 두 가지를 동시에 꺼낼 가능성**
스콧 베선트 미 재무장관은 **오늘 대이란 추가 제재를 상세 공개**할 예정이다. 여기에 더해 그는 8/20 CNBC 인터뷰에서 **"이번 주말이나 다음 주 초쯤 재정 건전화에 대해 더 내놓겠다"**고 예고한 바 있어, **국채시장 대응책이 함께 나올 가능성**이 있다. 지난주 바이백 확대 카드가 **하루 만에 효력을 잃은 것**을 감안하면, 오늘 발표가 시장을 되돌릴 만큼 구조적인지가 관건이다. 제재가 강할수록 유가는 오르고, 유가가 오르면 인플레이션 기대를 통해 다시 장기금리를 밀어올리는 **자기모순 구조**가 이번 발표의 핵심 리스크다.

**③ 이란은 경제가 무너지고 있고, 그래서 더 위험하다**
IMF는 올해 말 이란의 물가상승률이 **70%에 육박**하고 경제성장률은 **−5% 이상 역성장**할 것으로 전망했다. 전쟁 전 대비 쌀값은 **60%**, 소고기는 **150%** 올랐고 5월 기준 일자리는 **100만 개 넘게** 사라졌다. 지도부는 갈라져 있다. 페제시키안 대통령은 **"승리를 선언하고 전쟁을 끝내는 편이 낫다"**고 했지만, 최고국가안보회의 수장 모흐센 레자이는 국영방송에서 주변국이 미국의 경제전쟁에 협력하면 **호르무즈를 우회하는 석유 수송로를 공격**하겠다며 **"지진급의 강력한 보복"**을 경고했다. 트럼프 대통령은 8/21 연설에서 **"호르무즈 해협은 미국의 영토"**라고 재차 말했다. **협상 가능성과 확전 위험이 동시에 커진 상태**로, 유가의 양방향 변동성이 이번 주 가장 큰 미지수다.

**④ 엔비디아는 '매출'이 아니라 '마진'이 관건이다**
8/26(수) 미국장 마감 후(한국시간 8/27 새벽) 엔비디아가 FY2027 2분기 실적을 낸다. 시장의 초점은 매출 서프라이즈가 아니다. **블랙웰에서 차세대 루빈으로 넘어가는 초기 단계**라 원가 부담이 커지는 구간이고, **매출총이익률을 지켜낼 수 있느냐**가 AI 투자 수익성에 대한 평가로 직결된다. 여기에 지난주 브로드컴이 **최대 1,000억 달러 부채 조달**을 협의 중이라는 보도가 나오면서, **AI 설비투자 재원이 잉여현금흐름에서 레버리지로 이동하는 국면**이라는 인식이 확산됐다. 엔비디아가 좋은 숫자를 내도 **"그 수요를 누가 어떤 돈으로 사는가"**라는 질문은 남는다. 엔비디아는 8/21까지 **6거래일 연속 하락**한 채로 실적을 맞는다.

**⑤ 국내는 130조 주주환원이라는 자체 엔진을 얻었다 — 다만 야간선물이 걸린다**
SK하이닉스 **40조원 자사주 소각**과 삼성전자 **최대 110조원 주주환원**(현금배당 30조원)으로 양대 메모리의 주주환원 규모가 **최소 130조원**으로 공식화됐다. 미국 반도체가 주간 −5.45%로 무너지는 동안 SK하이닉스(000660)가 **주간 +5.17%**로 오른 것은 이 재료가 미국 흐름을 상쇄했다는 뜻이다. 코스피는 주간 **−0.93%(6,912.95)**로 방어했고 원/달러는 **1,386.5원**까지 내려와 외국인 수급에 우호적이다. 다만 **금요일 야간선물이 −2.29%(1,074.55)**로 정규장 종가(1,099.70)를 크게 되밀었고, **코스닥이 −4.63%로 매도 사이드카까지 발동**됐다. 대형주로의 쏠림이 중소형주 자금을 빨아들이는 구조가 이번 주에도 이어질 소지가 크다.

## 🎯 이번 주 관전 포인트

**1. 금리가 먼저다 — 30년물 5.3%가 기준선**
지난주 재무부의 바이백 확대는 **하루짜리 효과**에 그쳤고 30년물은 5.276%로 되돌아왔다. 시장이 보는 원인은 바이백으로 못 건드리는 것들 — **인플레이션 불확실성, 재정적자, 국채 공급, 기간 프리미엄**이다. 30년물이 **5.3% 아래로 안착**하면 반도체·고밸류 성장주가 숨통을 틔우고, **5.4%를 뚫으면** 지난주 SOX −5.45%가 반복될 수 있다.

**2. 엔비디아는 양날의 칼이다**
호실적 + 마진 방어 + 강한 가이던스가 모두 충족되면 **AI·반도체 전반의 2차 반등 트리거**가 될 수 있다. 반대로 **루빈 전환 원가로 마진이 훼손되면**, 이미 6거래일 연속 하락한 주가가 추가 조정에 들어가고 국내 HBM 밸류체인이 직격탄을 맞는다. **주주환원은 밸류에이션의 하단을 받칠 뿐 상단을 만들지 못한다**는 점을 기억해야 한다.

**3. 유가는 이번 주 유일한 '양방향' 변수**
WTI는 주간 **+5.66%**, 브렌트는 **+6.39%**로 6거래일 연속 올랐다. 오늘 제재가 강하면 추가 상승, 이란 지도부의 종전 현실론이 힘을 받으면 급락도 가능하다. **유가 상승은 항공·화학·해운의 원가 부담**이자 **정유·비료의 수혜**이며, 무엇보다 **장기금리를 통해 증시 전체를 누르는 경로**를 갖는다.

**4. 국내는 코스피가 아니라 코스닥을 봐야 한다**
금요일 코스피는 +0.88%였지만 코스닥은 **−4.63%**로 매도 사이드카가 발동됐다. **지수만 보면 시장을 오독한다** — 지난 금요일 제가 코스닥 붕괴를 놓친 실수가 그 증거다. 대형주 쏠림이 지속되는 한 지수 상승과 체감 수익률의 괴리가 커진다.

**[판정]** **관망 우위 · 이벤트 전 포지션 확대는 자제.**
**상방 근거**: ①130조 주주환원이라는 국내 고유 엔진, ②원/달러 1,386원 원화 강세로 외국인 수급 우호, ③미 3대 지수 금요일 반등 마감, ④SKHY 괴리율 +31.0%로 3거래일 연속 축소.
**하방 근거**: ①**야간선물 −2.29%**, ②SOX 주간 −5.45%·엔비디아 6거래일 연속 하락, ③30년물 5.276% 재상승, ④유가 6거래일 연속 상승, ⑤코스닥 −4.63%·매도 사이드카.
**판정: 월요일은 대형주 강보합 / 중소형주 약세의 양극화가 이어질 것**으로 보되, **주 후반 이벤트(엔비디아·잭슨홀·PCE)까지는 방향성 베팅을 미루는 것**이 합리적이다. NH투자증권이 제시한 코스피 밴드 **6,400~7,500**은 폭이 1,100포인트에 달한다 — **증권가조차 방향을 못 정했다는 뜻**이다. (무효화: 오늘 베선트 발표로 30년물이 5.2% 아래로 내려오면 상방 재평가)

## 💬 증권가 코멘트

- **NH투자증권 — 이번 주 코스피 예상 밴드 6,400~7,500.** 상승 요인으로 **엔비디아 실적과 금리 변동성 완화**를, 하락 요인으로 **차익실현 매물**을 꼽았다. 밴드 폭이 1,100포인트로 이례적으로 넓다.
- **이경민(대신증권) — "엔비디아 호실적은 증시 2차 반등의 트리거."** **"최근 빅테크 실적을 통해 AI 투자 사이클에 대한 신뢰가 이어지고 있는 만큼 엔비디아의 호실적과 긍정적인 가이던스는 AI·반도체 전반의 투자심리 개선과 증시 2차 반등의 트리거가 될 수 있다"**면서도, **"대외환경 불확실성이 지속돼 실적 개선에도 상승 탄력이 제한될 가능성을 배제할 수 없다"**고 단서를 달았다.
- **잭슨홀 관전 포인트 — 금리 경로가 아니라 '인식'.** 증권가는 워시 의장이 향후 금리 경로를 직접 언급하기보다는, **최근 장기금리 상승과 재무부의 장기채 바이백 확대에 대한 연준의 시각**을 어떻게 드러내는지가 핵심이라고 본다.
- **엔비디아 체크리스트 — 마진이 먼저다.** 시장 예상치 상회 여부보다 **높은 총이익률 유지 가능성**이 관건이다. 블랙웰→루빈 전환 초기 단계라 **원가 부담에 따른 마진 훼손**이 곧 AI 투자 수익성에 대한 평가로 이어진다.
