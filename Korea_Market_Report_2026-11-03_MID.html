## 🗓 시장 요약

**① AI 수익성 우려 재부각에 코스피 3%대 급락, 외국인·기관 동반 매도**
전일 미국에서 AI 성장주 조정이 이어지며 국내 반도체 대형주가 장 초반부터 밀렸다. 코스피는 저점 5,638.06까지 내려간 뒤 낙폭을 2%대로 줄이기도 했으나 다시 −3.33%로 확대됐다. 외국인은 코스피에서 8,957억원, 기관은 3,657억원을 순매도 중이다.

**② 삼전닉스 3～5% 약세, '낸드 다운턴' 경고까지**
SK하이닉스는 1,400,000원(−4.89%), 삼성전자는 220,250원(−3.82%)으로 두 종목 거래대금만 3조원을 넘는다. 낸드 가격이 D램보다 먼저 꺾일 수 있다는 경고가 나오며 반도체 업종이 −4.19%(상승 8·하락 156)로 밀렸다. 반면 한국투자증권은 두 종목 커버를 새로 시작하며 SK하이닉스 목표가 320만원, 삼성전자 44만원을 제시했다.

**③ 항공·보안주 강세, 정유·전자장비 약세**
한진칼이 조원태 회장과 호반그룹의 지분 매입 경쟁으로 상한가에 올랐고 대한항공 +4.20%, 한진 +15.15%가 함께 뛰었다. 한양증권 고객정보 유출 등 연이은 해킹 소식에 지니언스 +13.11%·안랩 +5.08% 등 보안주가 급등했다. 미국-이란 종전 협상 기대에 국제유가가 7%대 급락하면서 석유와가스 업종은 −6.02%로 가장 약하다.

**④ 원/달러 1,339원대로 하락, 해외는 엇갈림**
유가 급락과 달러 약세로 원/달러는 6.60원 내린 1,339.40원이다. S&P500 선물 −0.16%, 나스닥100 선물 +0.02%로 미국 선물은 보합권이고, 항셍 지수는 +0.51%로 오르고 있다. 일본은 휴장이다.

## 1. 업종별 흐름

**상승 업종** — 항공사가 +15.82%(9종목 모두 상승)로 압도적이다. 한진칼 상한가, 한진 +15.15%, 대한항공 +4.20%로 한진그룹 경영권 분쟁 기대가 업종 전체를 끌어올렸다. 소프트웨어 +1.44%는 보안주(지니언스·안랩) 강세 덕이고, 제약은 +0.59%로 삼성바이오로직스 +1.76%·알테오젠 +0.94%가 버텼다.

**하락 업종** — 석유와가스 −6.02%(S-Oil −10.62%, SK이노베이션 −8.75%), 전자장비와기기 −5.05%(대덕전자 −11.76%), 전기제품 −4.90%(삼성SDI −6.88%), 반도체 −4.19%(이오테크닉스 −7.54%, 주성엔지니어링 −6.19%), 철강 −4.18%(POSCO홀딩스 −5.83%)가 약하다.

**시장의 시선** — 오후장은 외국인 매도가 1조원을 넘어서는지, 개인 매수가 지수를 5,700선 위로 끌어올릴 수 있는지가 관건이다. 한진칼 지분 경쟁, 보안 규제 강화 기대, 3분기 실적 발표(LG에너지솔루션·알테오젠·POSCO홀딩스 등)에 따른 종목별 차별화가 이어질 전망이다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 30종목

*① 오전장 새로 편입된 급등 대형주 9종목(1～9번) → ② 오전장 언론 최다 보도 21종목(10～30번).*

**1. 한진칼 (180640) 175,200원 · 11조 6,968억원 · +29.97% — 조원태·호반 지분 매입 경쟁, 상한가**
조원태 회장이 한진칼 지분 약 370억원어치를 사들인 데 이어 호반그룹이 공정위에 기업결합을 신고하며 최대주주 경쟁이 본격화됐다. '제2의 고려아연'이 될 수 있다는 관측 속에 주가는 오전에 상한가로 직행했고 거래대금은 1,690억원에 달한다. 산업은행의 역할까지 거론되며 국적항공사 경영 불확실성이 커졌다는 지적도 함께 나온다. 우선주 한진칼우도 +30.00% 상한가다. 증권사 커버 리포트 없음

**2. 대한유화 (006650) 88,600원 · 5,759억원 · +10.47% — 석유화학 구조 재편 기대**
대한유화는 오전에 88,600원까지 올라 10% 넘게 뛰었다. 에쓰오일 새 공장 가동을 앞두고 울산 석유화학 재편 논의가 평행선을 달리는 가운데 재편 수혜 기대가 다시 반영된 것으로 보인다. 다만 거래대금이 47.2억원에 그쳐 수급이 가볍고, 같은 시간 정유 업종은 유가 7%대 급락에 −6.02%로 약하다. [리포트: Samsung 2026-10-30](https://woooty69.github.io/hw-pdf-arch-035/%EB%8C%80%ED%95%9C%EC%9C%A0%ED%99%94%EF%BC%BB006650%EF%BC%BD_20261030_Samsung_4060218230.pdf) · [리포트: Korea Investment 2026-10-02](https://woooty69.github.io/hw-pdf-arch-029/%EB%8C%80%ED%95%9C%EC%9C%A0%ED%99%94%EF%BC%BB006650%EF%BC%BD_20261002_Korea%2BInvestment_4071544860.pdf) · [리포트: Yuanta 2026-09-22](https://woooty69.github.io/hw-pdf-arch-021/%EB%8C%80%ED%95%9C%EC%9C%A0%ED%99%94%EF%BC%BB006650%EF%BC%BD_20260922_Yuanta_1133016.pdf)

**3. 로킷헬스케어 (376900) 20,600원 · 3,604억원 · +21.39% — 12월 중국 수출 본격화 기대**
로킷헬스케어는 12월부터 중국 수출을 본격화하고 내년 현지에서 피부재생 시술을 시작한다는 계획이 부각되며 20,600원까지 올랐다. 거래대금은 209억원으로 코스닥 상승률 2위권이다. 맞춤형 재생의료 플랫폼의 해외 매출이 실제 실적으로 이어지는지가 다음 확인 포인트다. [리포트: Korea Investment 2026-09-09](https://woooty69.github.io/hw-pdf-arch-029/%EB%A1%9C%ED%82%B7%ED%97%AC%EC%8A%A4%EC%BC%80%EC%96%B4%EF%BC%BB376900%EF%BC%BD_20260909_Korea%2BInvestment_4075119070.pdf) · [리포트: SK 2026-06-26](https://woooty69.github.io/hw-pdf-arch-009/%EB%A1%9C%ED%82%B7%ED%97%AC%EC%8A%A4%EC%BC%80%EC%96%B4%EF%BC%BB376900%EF%BC%BD_20260626_SK_1108270.pdf) · [리포트: IBK 2026-03-10](https://woooty69.github.io/hw-pdf-arch-002/%EB%A1%9C%ED%82%B7%ED%97%AC%EC%8A%A4%EC%BC%80%EC%96%B4%EF%BC%BB376900%EF%BC%BD_20260310_IBK_1078612.pdf)

**4. 한진 (002320) 19,460원 · 3,020억원 · +15.15% — 한진칼 경영권 분쟁에 그룹주 동반 강세**
한진칼 최대주주 경쟁이 불붙자 그룹 물류 계열사 한진도 19,460원(+15.15%)까지 올랐다. 호반이 공정위에 기업결합을 신고하고 조원태 회장이 지분 370억원을 사들이는 등 분쟁 관련 보도가 15건 쏟아졌다. 한진은 한국광고학회 '올해의 브랜드상' 수상 소식도 나왔지만 주가는 지배구조 이슈가 이끌고 있다. [리포트: iM 2026-08-24](https://woooty69.github.io/hw-pdf-arch-016/%ED%95%9C%EC%A7%84%EF%BC%BB002320%EF%BC%BD_20260824_iM_1125809.pdf) · [리포트: iM 2026-02-19](https://woooty69.github.io/hw-pdf-arch-003/%ED%95%9C%EC%A7%84%EF%BC%BB002320%EF%BC%BD_20260219_iM_1073881.pdf)

**5. 지니언스 (263860) 31,050원 · 2,819억원 · +13.11% — 증권사 해킹 잇따르며 보안주 급등**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
