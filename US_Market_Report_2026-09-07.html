## 🗓 오늘의 요약

**① 오늘은 미국만 쉰다 — 한국·일본·중국·유럽은 정상 개장**
미 증시와 채권시장이 **노동절로 휴장**한다. 반면 한국 증시는 09:00, 유럽은 한국 시각 16:00 전후로 정상 개장한다. **미국이라는 기준점 없이 아시아·유럽이 먼저 움직이는 하루**이며, 거래량이 얕아 개별 뉴스에 지수가 과하게 반응할 수 있는 구조다. 미국 반영은 **9/8(화)**로 하루 밀린다.

**② OPEC+가 10월 쿼터를 동결했다 — 어제 예고했던 회의의 결과**
9/6 열린 OPEC+ 회의에서 **10월 원유 생산 쿼터를 동결**하기로 했다. 사우디·러시아 등 **7개국이 연말까지 현재 목표를 유지한다는 방침을 재확인**했다. 핵심은 그다음이다 — **미·이란 전쟁으로 호르무즈 수송이 막히면서 걸프 지역의 실제 수출이 이미 줄고 있어**, 명목상 쿼터를 늘려도 시장에 실제로 공급되는 물량은 그만큼 늘지 않는 상태다. **OPEC+의 가격 완충 기능 자체가 약해졌다**는 뜻이며, 이달 말 **2027년 생산능력 재평가**가 예정돼 있다.

**③ 예멘 사망자가 300명을 넘었다 — 이틀 만에 두 배 이상**
어제 리포트 시점에 **129명**이던 예멘 정부군-후티 반군 교전 사망자가 **300명을 넘어섰다**. 2022년 휴전이 올해 7월 파기된 이후 최악의 유혈 충돌이다. 후티는 정부군이 점령한 남부 항구도시 **모카를 차단**하고 **홍해 관문인 바브엘만데브 해협** 쪽으로 진격을 시도하고 있다. **원유·천연가스가 수에즈 운하로 향하는 핵심 병목**이 두 번째 전선이 됐다는 점에서, 호르무즈에 이어 유가의 두 번째 축이다.

**④ 러시아와 독일이 '선전포고' 언사까지 갔다**
세르게이 라브로프 러시아 외무장관이 **"프리드리히 메르츠 독일 총리가 사실상 러시아에 선전포고하고 있다"**며 **"독일이 다시 전쟁을 원한다"**고 주장했다. 배경은 **라이프치히 드론 사건** 이후 양국이 서로의 문화원을 맞폐쇄한 외교 충돌이다. 같은 기간 러시아는 **우크라이나 보안국(SBU) 본부를 처음으로 타격**했고, 젤렌스키 대통령은 **"대칭 보복"**을 지시했다. **중동에 이어 유럽에서도 리스크 프리미엄이 다시 붙을 수 있는 국면**이며, 유럽 증시가 오늘 이를 먼저 반영한다.

**⑤ 야간선물은 이미 갭업을 예고해 둔 상태다**
직전 코스피200 야간선물이 **1,093.90(+3.93%)**으로 마감했다. 국내 정규장 선물 종가(1,052.50) 대비 **41.40포인트 위**다. 금요일 미국에서 **SOX +3.38%, SK하이닉스 ADR +8.14%**가 나왔는데 국내 정규장은 그 전에 닫혔기 때문에, **그 강세가 아직 국내 현물에 반영되지 않은 상태**다. 오늘 한국 증시는 **미국 신호 없이 열리지만, 금요일치 미국 반도체 랠리를 뒤늦게 반영하는 하루**가 된다.

## 📰 섹션 1. 어제 아침 이후 신규 뉴스 (9/6~9/7 새벽)

**1. OPEC+ 10월 산유량 쿼터 동결 (9/6 회의 → 9/7 새벽 보도)**
사우디아라비아·러시아 등 **7개국이 연말까지 현재 생산 목표를 유지**하기로 재확인했다. OPEC+는 2023년 도입한 감산 조치를 그동안 상징적 증산으로 되돌려 왔지만, **미·이란 전쟁으로 호르무즈 원유 수송이 차질을 빚으면서 이 증산 결정이 실제 시장 공급 증가로 이어지지 않고 있다.** 걸프 지역의 실제 수출은 감소 중이며, 이달 말 **2027년 생산능력 재평가**가 예정돼 있다.

**투자자 함의:** 어제 리포트에서 "증산 여력이 소진된 상태에서 중동 공급 차질이 겹치면 OPEC+의 완충 기능이 약해진다"고 짚었던 시나리오가 **회의 결과로 확인**됐다. 동결은 유가에 중립~상방 재료다. 즉 **WTI \$91대의 하방 경직성이 강화**됐고, 이는 9/11 미 CPI의 에너지 항목으로 곧장 연결된다. 국내에서는 정유·조선·방산에 우호적, 항공·해운·화학에 부담이라는 구도가 유지된다.

**2. 예멘 내전 사망자 300명 돌파 — 후티, 바브엘만데브 진격 (9/7 새벽)**
예멘 남서부에서 사우디가 지원하는 정부군과 친이란 후티 반군의 교전이 격화되며 **사망자가 300명을 넘어섰다**. 9/4~9/5 하루 **129명**(단일 지상전 최대), 9/5 추가 **60명**, 이후 계속 누적된 결과다. 후티는 **남부 항구도시 모카를 차단**하고 **홍해 입구 바브엘만데브 해협** 인근으로 진격 중이다. **2022년 휴전이 올해 7월 파기된 이후 가장 치명적인 충돌**이다.

**투자자 함의:** 바브엘만데브는 **원유·LNG가 수에즈 운하로 향하는 관문**이다. 호르무즈(페르시아만 출구)와 바브엘만데브(홍해 출구)가 **동시에 위협받는 구도**는 이번 사이클에서 처음이다. 항로 우회는 운항 일수와 보험료를 동시에 올리므로 **해운 운임에는 상방, 항공·화학 원가에는 하방** 재료다. 유가가 되돌림 없이 레벨을 굳히는지가 관건이다.

**3. 러시아-독일 외교 충돌 격화 — "사실상 선전포고" (9/7 새벽)**
라브로프 러시아 외무장관이 **메르츠 독일 총리가 사실상 러시아에 선전포고하고 있다**고 주장하며 **"독일이 다시 전쟁을 원한다"**고 말했다. **라이프치히 드론 사건**(독일 공항 드론 공격 미수) 이후 양국이 **문화원을 맞폐쇄**한 데 따른 대응이다.

**투자자 함의:** 유럽 증시가 오늘 이를 **미국보다 먼저** 소화한다. 독일 DAX와 유로화, 유럽 방산주가 1차 반응처다. 국내와의 연결고리는 **방산 수출**이며, 유럽의 국방비 확대 기조가 강화되는 방향이다. 다만 언사 단계이므로 실제 조치로 이어지는지 확인이 필요하다.

**4. 러시아, 우크라이나 보안국 본부 첫 타격 — 젤렌스키 "대칭 보복" 지시**
러시아가 **우크라이나 보안국(SBU) 본부를 처음으로 타격**했고, 젤렌스키 대통령은 **"대칭 보복"**을 지시했다. 같은 기간 러시아 외무부는 **미국 특사 방문에 대해 "우크라이나 분쟁에서 전장의 현실을 고려해야 한다"**는 입장을 냈다.

**투자자 함의:** 미국이 특사를 보내 협상을 시도하는 동시에 전선은 오히려 격화되는 구조다. **종전 기대와 확전 우려가 동시에 존재**하므로, 에너지·곡물·비료 가격의 변동성이 커지는 방향이다. 러시아가 협상 테이블에서 **"전장 현실"**을 명시적으로 언급한 것은 영토 현상 유지를 전제로 하겠다는 신호로 읽힌다.

**5. 러시아-일본 마찰 — '국화 문장' 석상에 다카이치 총리 "용납 불가"**
러시아에서 **일본 왕실의 상징인 국화 문장을 파괴하는 모습을 묘사한 석상**이 설치되자 다카이치 일본 총리가 **"용납할 수 없다"**고 반발했다.

**투자자 함의:** 그 자체로는 시장 재료가 아니지만, **러시아가 유럽·일본을 동시에 겨냥하는 외교 기조**를 보인다는 점이 맥락이다. 엔화와 일본 증시의 안전자산 성격 판단에 부수적 변수이며, 오늘 니케이의 초반 흐름에서 확인할 수 있다.

## 🇰🇷 섹션 3. 오늘 한국 증시 관전 포인트

**🇰🇷 [전달] 미반영분이 남아 있다**
코스피200 야간선물이 **1,093.90(+3.93%)**으로 정규장 선물 종가(1,052.50)보다 **41.40포인트 높게** 마감했다. 금요일 미국 세션에서 나온 **SOX +3.38%**, **SK하이닉스 ADR +8.14%**, 마이크론 **+6.10%**, 샌디스크 **+11.90%**는 한국 정규장이 닫힌 뒤의 사건이라 **현물에 아직 반영되지 않았다**. 주간으로 보면 야간선물 **+2.79%** vs 코스피 **−1.50%**로 격차가 벌어져 있어, 오늘은 그 격차를 좁히는 방향의 압력이 우세하다.

**🇰🇷 [괴리율] +45.1% — 좁혀지는 방향인지 확인할 첫날**
SKHY는 주간 **+9.91%**(\$161.04 → \$177.00) 오른 반면 국내 SK하이닉스(000660)는 **−0.36%(1,653,000원 → 1,647,000원)**에 그쳤다. 그 결과 괴리율이 **+33.7%(8/28) → +45.1%(9/4)**로 11.4%p 확대됐고, 확대의 원인은 국내 상승이 아니라 **ADR 단독 상승**이다. 원/달러가 주간 **22.1원(−1.61%)** 내려 괴리율을 줄이는 방향으로 작용했는데도 벌어졌다는 점이 특징이다. **오늘 국내 주가가 ADR을 따라 올라 괴리가 좁혀지는지**가 첫 확인 지점이다.

**🇰🇷 [수급] 금요일에 방향이 바뀌었다**
SK하이닉스 외국인 수급은 한 주 동안 **−21만 1,935주(8/31) → +9만 1,835주(9/1) → −65만 1,507주(9/2) → −23만 4,626주(9/3) → +30만 8,833주(9/4)**로 움직였다. **9/2 대규모 순매도 이후 매도 규모가 줄었고 금요일 순매수로 전환**했으며, 기관도 같은 날 **+9만 6,776주**로 돌아섰다. 시장 전체로도 9/4에 외국인·기관·기타법인이 동반 매수했다. **이 전환이 하루짜리였는지 추세인지**가 오늘 확인된다.

**🇰🇷 [섹터] 유가가 만든 명암**
- **우호적**: 정유·조선·방산 — OPEC+ 동결로 유가 하방이 막혔고, 예멘·러시아 양쪽에서 지정학 프리미엄이 유지된다.
- **부담**: 항공·해운(원가)·화학 — 다만 해운은 **바브엘만데브 우회 시 운임 상승**이라는 반대 방향 재료가 공존한다.
- **핵심 변수**: 반도체 — 금요일 미국 메모리 랠리의 반영 강도가 오늘 지수 방향을 결정한다.

**🇰🇷 [환율] 1,350.4원 — 14개월 최저**
주간 **22.1원** 내려 작년 6월 30일(1,350.0원) 이후 최저 수준이다. 수출업체 네고 물량과 엔화 강세가 배경이며, 앞서 보도된 **SK하이닉스 ADR 상장 관련 달러를 외환당국이 약 200억 달러 흡수**한 구조도 함께 작용하고 있다. 원화 강세는 외국인 수급에 우호적이지만 수출주 채산성에는 부담이라는 양면이 있다.
