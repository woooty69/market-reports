## 🗓 시장 요약

**① 금리가 멈추자 증시가 돌아섰다**
3대 지수가 모두 올라 **3거래일 연속 하락**을 끊었다. 다우 **+0.56%(53,061.95)**, S&P 500 **+0.46%(7,666.60)**, 나스닥 **+0.45%(26,217.83)**. 반등의 직접적인 조건은 하나였다 — **국채금리의 상승세 진정**이다. 미 10년물은 장중 **4.818%까지 치솟아 2023년 11월 이후 최고 수준**을 찍었지만 이후 상승폭을 반납해 **4.782%(−1.4bp)**로 마감했다. 2년물도 **4.371%(−2.9bp)**로 내렸다.

**② 유가도 오르긴 했지만 속도가 꺾였다 — WTI +0.88%**
WTI는 배럴당 **\$91.01(+0.88%, +\$0.79)**, 브렌트유는 **\$95.63(+1.0%)**로 사흘 연속 올랐다. 다만 **직전 세션의 +5.20%와 비교하면 상승 속도가 확연히 둔화**됐다. 배경에 실물 데이터가 있다. 크리스 라이트 미 에너지부 장관은 **8월 31일 호르무즈 해협을 통과한 원유가 1,700만 배럴을 넘어 이란 전쟁 발발 이후 최대 규모**를 기록했다고 밝혔다. **교전은 계속되지만 실제 통항은 막히지 않고 있다**는 신호다.

**③ 고용은 식고 있다 — ADP 8월 민간고용 +3만 8,000명**
민간 고용정보업체 ADP에 따르면 **8월 미국 민간기업 고용은 전월보다 3만 8,000명 증가**하는 데 그쳐 시장 예상치 **4만 7,000~4만 8,000명**을 밑돌았다. 7월 증가폭은 4만 4,000명에서 **4만 6,000명으로 상향** 조정됐다. 이 지표가 나오면서 9월 FOMC 0.25%p 인상 확률은 **68.2% → 60.1%**로 내려왔다. **유가발 인플레이션과 노동시장 냉각이 정면으로 충돌하는 국면**이며, 9월 4일 노동부 고용보고서가 이를 정리할 관문이다.

**④ 델이 15.8% 급등하며 하드웨어를 끌어올렸다**
델테크놀로지스가 **연간 매출과 이익 전망치를 상향 조정**하며 **15.8% 급등**했다. AI 서버 수요가 실적 가이던스로 확인된 사례이며, 이날 시장 전체의 상승 분위기를 만든 개별 재료 중 가장 컸다.

**⑤ 반도체는 반등했지만 폭은 제한적이었다 — SOX +0.39%**
필라델피아 반도체지수가 **11,332.64(+0.39%)**로 소폭 올랐다. 엔비디아 **+3.21%**, 마이크론 **+2.40%**, 퀄컴 **+2.00%**, SK하이닉스 ADR **+2.61%**로 개별 종목은 2~3%씩 올랐는데 지수 상승폭이 0.39%에 그쳤다. **지수 내 종목 간 편차가 컸다**는 뜻이다.

**⑥ 소프트웨어는 반대로 밀렸다 — 'AI가 기존 사업모델을 위협한다'**
이날 업종별로는 **항공주·금은광산주·지역은행주가 강세**를 보인 반면 **소프트웨어·서비스 업종은 상대적으로 부진**했다. 이유로 지목된 것은 **AI 확산이 기존 사업모델을 위협할 수 있다는 우려**다. 지수는 올랐지만 업종 내부에서는 AI를 둘러싼 수혜와 잠식이 갈리고 있다.

**⑦ 한국은 4% 가까이 폭락했다 — 자사주 1.5조로도 못 막았다**
코스피가 **−273.08p(−3.99%, 6,562.72)**로 급락해 6,600선을 내줬다. **외국인과 기관이 합쳐 4조원을 순매도**했고, 삼성전자·SK하이닉스의 **자사주 1조 5,000억원 규모 매수**로도 방어가 되지 않았다. 코스닥도 **−2.10%(803.98)**로 3거래일 연속 하락했다. **SK하이닉스는 −4.73%(1,613,000원)**로 밀렸고 **외국인이 −65만 1,507주**를 팔았다. 원/달러는 오히려 **1,368.7원(−1.7원)**으로 내렸는데, **수출업체 네고 물량**이 유입된 결과다.

**⑧ SK하이닉스 ADR 상장이 남긴 200억 달러**
로이터에 따르면 **한국 외환당국이 SK하이닉스의 265억 달러 규모 ADR 상장(7월) 이후 회사가 매도한 달러 가운데 약 200억 달러를 매입**한 것으로 전해졌다. 대규모 달러 공급을 당국이 흡수해 **원화 급등을 완충한 구조**이며, 최근 원/달러가 1360~1370원대에서 지지되는 배경 중 하나로 볼 수 있다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  하드웨어·AI 서버 (이날 최강)**
델테크놀로지스가 **+15.80%** 급등했다. **연간 매출·이익 전망치 상향**이 재료다. AI 서버 수주가 실제 가이던스 상향으로 확인되면서, AI 자본지출의 수혜가 칩뿐 아니라 **서버·시스템 업체로 확산**되고 있음을 보여줬다.

**상승 ②  반도체 (저가 매수 유입)**
SOX **+0.39%(11,332.64)**, 엔비디아 **+3.21%**, 마이크론 **+2.40%**, SK하이닉스 ADR **+2.61%**, 퀄컴 **+2.00%**. 중동 긴장과 글로벌 국채금리 급등으로 낙폭이 컸던 구간에 저가 매수세가 들어왔다.

**상승 ③  항공·금은광산·지역은행**
유가 상승 속도가 둔화되자 **항공주**가 반등했고, **금·은 광산주**는 금 선물 **+0.86%**·은 **+0.85%**와 함께 올랐다. **지역은행주**는 금리 상승세 진정에 반응했다.

**하락 ①  소프트웨어·서비스**
지수가 오른 날 상대적으로 부진했다. **AI 확산이 기존 소프트웨어 사업모델을 위협할 수 있다는 우려**가 이유로 지목됐다. AI 인프라(하드웨어)와 AI 응용(소프트웨어) 사이의 온도차가 이날 뚜렷하게 드러났다.

**하락 ②  대형 기술주 일부**
애플이 **−0.06%(\$324.95)**로 약보합, 아마존이 **+0.02%(\$254.98)**로 사실상 보합에 그쳤다. 반등 국면에서 상승 대열에 합류하지 못했다.

**하락 ③  변동성·안전자산 수요**
VIX가 **15.23(−6.79%)**으로 급락했고 달러인덱스도 **99.53(−0.11%)**으로 내렸다. 위험 회피 심리가 되돌려진 하루다.

> 🇰🇷 [전달] **코스피200 야간선물이 +1.40%(1,043.60, +14.45)로 반등**했다. 장중 궤적은 정규장 선물 종가(1,029.15) 아래 **1,023.00으로 출발해 저가 1,020.25(−0.87%)까지 밀렸다가 고가 1,048.35(+1.87%)까지 오른 뒤** 소폭 되밀린 흐름이다. **하락 출발 → 상승 반전**이라는 점이 직전 세션(갭하락 후 추가 하락)과 반대다. 거래량 **22,676계약**으로 전 세션(30,651계약) 대비 **26% 감소**했고, 미결제약정은 **151,368계약(▼132)**으로 거의 변동이 없었다 — **급락 국면의 청산 압력이 일단락된 모습**이다.
>
> [수급] 전일 국내는 코스피 **−3.99%(6,562.72)**, 코스닥 **−2.10%(803.98)**로 동반 급락했다. **외국인·기관 합계 4조원 순매도**였고, 삼성전자·SK하이닉스의 **자사주 1조 5,000억원 매수**로도 방어되지 않았다. SK하이닉스는 **−4.73%(1,613,000원)**, **외국인 −65만 1,507주**·기관 −29만 5,219주 매도에 개인만 **+29만 6,807주** 받았다. 거래대금 **6조 5,378억원**, 시가총액 **1,178조원**. 괴리율은 **+30.1% → +40.0%**로 9.9%p 급확대됐다 — 국내가 −4.73% 빠지는 동안 ADR이 **+2.61%** 올라 방향이 정반대였기 때문이다.

**[시장의 시선]** 이날 반등의 조건은 **재료가 좋아진 것이 아니라 나빠지던 것이 멈춘 것**이다. 교전은 계속됐고 유가도 사흘째 올랐지만, **금리가 장중 고점(4.818%)을 찍고 되밀렸다는 사실 하나**로 지수가 돌아섰다. 최근 국면에서 주가를 실제로 움직이는 변수가 무엇인지 분명해진다.

유가 쪽에서는 **호르무즈 통항 1,700만 배럴(이란 전쟁 이후 최대)**이라는 실물 데이터가 나왔다. 시장이 우려한 것은 교전 자체가 아니라 **공급 차질**이었는데, 그 차질이 아직 현실화되지 않고 있다는 확인이다.

한국과 미국의 괴리는 이날 극단으로 벌어졌다. **국내 SK하이닉스 −4.73%, ADR +2.61%**로 같은 회사의 주가가 정반대로 움직였고 괴리율이 **9.9%p** 확대됐다. 국내는 **외국인·기관 4조원 순매도**라는 수급이, 미국은 **저가 매수**가 각각 지배했다.

주시할 변수는 세 가지다 — **①9월 4일 8월 고용보고서**(ADP가 이미 둔화 신호를 냈다), **②9월 FOMC 인상 확률 60.1%로의 후퇴가 이어질지**, **③브로드컴 실적 후 시간외 −5%**가 다음 세션 반도체에 미칠 영향.

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 델테크놀로지스 (DELL) +15.80% — 연간 매출·이익 전망 동시 상향, 이날 최대 상승**
서버·PC 제조업체가 **15.80% 급등**해 이날 시장에서 가장 크게 올랐다. 재료는 명확하다. 회사가 **연간 매출과 이익 전망치를 함께 상향 조정**했다.
의미가 큰 이유는 **AI 자본지출의 수혜 범위**에 관한 것이기 때문이다. 그동안 AI 투자의 과실은 GPU를 만드는 반도체 기업에 집중되는 것으로 인식돼 왔는데, 서버 시스템을 조립·공급하는 업체의 가이던스가 올라갔다는 것은 **수요가 칩 단계를 넘어 실제 인프라 구축 단계로 내려왔다**는 신호다.
다만 원가 측면의 부담은 남아 있다. 메모리 가격이 **15% 이상** 인상된 상황에서 서버 제조사는 부품 원가 상승에 직접 노출된다. **매출 성장과 마진 압박이 동시에 진행되는 구조**이므로 다음 분기 실적에서 마진율 추이를 확인할 필요가 있다.

**2. 엔비디아 (NVDA) +3.21% — \$224.41, 반도체 반등을 주도했다**
AI 반도체 대장주가 **3.21% 상승(\$224.41, +\$6.97)**해 이날 반도체 반등을 이끌었다. 최근 중동 긴장과 글로벌 국채금리 급등으로 낙폭이 컸던 구간에 **저가 매수세**가 유입됐다.
반등의 조건은 개별 재료가 아니라 **금리**였다. 10년물이 장중 **4.818%**까지 오른 뒤 **4.782%**로 되밀리면서, 장기 성장주에 걸려 있던 할인율 부담이 완화됐다. 9월 FOMC 인상 확률도 **68.2%에서 60.1%**로 내려왔다.
같은 날 나온 델의 **연간 전망 상향(+15.80%)**도 우호적 재료다. AI 서버 수요가 실적으로 확인된다는 것은 **GPU 발주의 최종 수요가 살아 있다**는 뜻이기 때문이다. 다만 장 마감 후 **브로드컴이 실적은 예상을 웃돌았으나 전망이 실망스럽다는 평가에 시간외 5% 급락**해, 다음 세션의 변수로 남았다.

**3. SK하이닉스 ADR (SKHY) +2.61% — \$164.98 (괴리율: +40.0%), 국내와 정반대로 움직였다**
ADR이 **2.61% 상승(\$164.98, +\$4.20)**했다. 시가 **\$159.77**에서 고가 **\$165.47**까지 올랐고 저가는 **\$158.67**, 거래량은 **1,108만 3,868주**였다. 시간외는 **\$163.95(−0.62%)**.
이날 가장 주목할 보도는 외환 쪽이다. 로이터는 소식통을 인용해 **한국 외환당국이 SK하이닉스의 265억 달러 규모 ADR 상장 이후 회사가 매도한 달러 중 약 200억 달러를 매입**했다고 전했다. 사업 재료로는 **키옥시아와의 공동 생산 협력을 검토**하고 있다는 보도가 나왔고, 앞서 알려진 **인텔 파운드리 HBM4E 베이스 다이 검토**·**일본 공장 검토**와 함께 생산 협력 다변화가 이어지고 있다.
국내 주가는 정반대였다. **−4.73%(1,613,000원)**로 급락했고 **외국인이 −65만 1,507주**, 기관이 −29만 5,219주를 팔았다(개인 +29만 6,807주). 그 결과 괴리율이 **+30.1% → +40.0%**로 벌어졌다. 컨센서스 PER **4.62배**, 12개월 목표주가 **\$247.31**(애널리스트 14명, Strong Buy).

**4. 애플 (AAPL) −0.06% — \$324.95, 반등장에서 홀로 제자리였다**
애플이 **0.06% 하락(\$324.95, −\$0.18)**해 사실상 보합에 머물렀다. 3대 지수가 모두 오른 날 대형 기술주 중 상승 대열에 합류하지 못한 몇 안 되는 종목이다.
**회사 고유의 신규 공시나 실적 발표는 없었다.** 이날 시장을 이끈 것이 낙폭 과대 종목에 대한 저가 매수였다는 점을 감안하면, 상대적으로 덜 밀렸던 종목에는 매수 유인이 작았던 것으로 볼 수 있다.
가장 가까운 이벤트는 **9월 9일 신형 아이폰 공개**다. 이 자리에서 **첫 폴더블폰**이 공개될 것으로 알려져 있으며, 신제품 발표를 **일주일 앞둔 관망 구간**에 들어섰다.
공급망 쪽에는 부담 요인이 남아 있다. 메모리 가격이 **15% 이상** 인상된 상황에서 폴더블 신제품의 부품 원가가 올라가며, 이는 국내 메모리·디스플레이 업체와의 **단가 협상 압박**으로 전가될 수 있는 사안이다. 같은 날 퀄컴이 **+2.00%** 오른 것도 신제품 사이클 기대가 부품 공급사에 먼저 반영된 흐름으로 해석된다.

**5. 마이크론 (MU) +2.40% — 메모리 슈퍼사이클의 고점 논쟁이 붙었다**
미국 메모리 대표주가 **2.40% 올랐다.** 직전 세션 개장 전 거래에서 샌디스크·웨스턴디지털·SK하이닉스와 함께 약세를 보였던 흐름이 하루 만에 되돌려졌다.
이날 시장에서 나온 핵심 질문은 **"메모리 슈퍼사이클의 고점이 가까운가"**였다. 메모리 가격 급등이 마이크론과 SK하이닉스 주가를 끌어올렸는데, 과거 메모리 사이클은 대체로 **주가 급락으로 끝났다**는 점 때문이다. 다만 이번 사이클은 **AI 데이터센터라는 구조적 수요**가 뒷받침한다는 점에서 과거와 다르다는 반론도 함께 제기되고 있다.
공급 측 재료는 여전히 유효하다. 엔비디아가 실적 발표에서 경고한 **메모리 부품 부족**이 그대로 가격 협상력으로 작동하고 있고, 메모리 가격은 **15% 이상** 인상된 상태다. 같은 날 델이 **연간 전망을 상향**하며 **+15.80%** 급등한 것도 서버용 메모리 수요가 실제 발주로 이어지고 있다는 방증이다.
반대편 압력도 커지고 있다. 중국 YMTC가 **2027년까지 세계 최대 낸드 생산업체**를 목표로 내걸었고, 장 마감 후 **브로드컴이 전망 실망으로 시간외 5% 급락**해 AI 반도체 수요의 지속성에 대한 의문이 함께 제기됐다.

**6. 메타 (META) +2.47% — \$592.85, 빅테크 중 최대 상승**
메타가 **2.47% 상승(\$592.85, +\$14.31)**해 주요 빅테크 가운데 가장 크게 올랐다. **회사 고유의 신규 공시나 보도는 확인되지 않았고**, 금리 진정에 따른 대형 성장주 전반의 반등에 함께 올라탄 것으로 보인다.
유가 쪽 부담도 이날은 완화됐다. WTI 상승폭이 **+0.88%**로 둔화되면서, 광고 매출 비중이 높은 기업에 걸리는 **소비 위축 우려**가 한 단계 낮아졌다.
다만 업종 차원의 변수는 남아 있다. 이날 **소프트웨어·서비스 업종은 AI가 기존 사업모델을 위협할 수 있다는 우려로 부진**했는데, 메타는 자체 AI 모델과 광고 플랫폼을 함께 보유해 이 논쟁에서 **잠식당하는 쪽이 아니라 활용하는 쪽**으로 분류되는 경향이 있다.

**7. 테슬라 (TSLA) +0.26% — \$357.01, 반등폭이 가장 작았다**
테슬라가 **0.26% 상승(\$357.01, +\$0.92)**하는 데 그쳤다. **회사 고유의 신규 재료는 확인되지 않았다.**
반등이 제한된 배경으로는 유가를 볼 수 있다. WTI가 **\$91.01**로 사흘 연속 오르며 90달러대에 자리를 잡았는데, 고유가는 통상 전기차 수요에 우호적이지만 동시에 **인플레이션·금리 경로**를 자극해 장기 성장주 밸류에이션에는 부담이다.
직전에 부각된 재료들은 진행형이다. 일론 머스크 CEO가 밝힌 **테슬라·스페이스X 각각 연간 100기가와트(GW) 태양광 생산 능력 확보**와 텍사스 오스틴의 **'사이버캡' 출시·FSD 개선**이 그것이며, 모두 회수 기간이 긴 프로젝트다.

**8. 넷플릭스 (NFLX) +2.38% — \$82.73, 금리 진정의 수혜를 받았다**
넷플릭스가 **2.38% 상승(\$82.73, +\$1.92)**했다. **회사 고유의 신규 재료는 확인되지 않았으며**, 금리 상승세 진정에 따른 성장주 전반의 반등 흐름에 포함됐다.
구독형 매출 구조라는 점이 이 국면에서 유리하게 작용한다. 이날 소프트웨어·서비스 업종이 **AI 위협 우려**로 부진한 것과 달리, 콘텐츠 제작·유통은 AI가 대체하기보다 **제작 비용을 낮추는 방향**으로 작동한다는 시각이 있다.
매크로 측면에서는 ADP 고용 둔화(**+3만 8,000명**, 예상 하회)가 양날의 검이다. 금리 부담은 낮추지만 **소비 여력 축소는 구독 서비스의 해지율에 영향**을 줄 수 있는 요인이기 때문이다.

**9. 퀄컴 (QCOM) +2.00% — 반도체 반등 대열에 합류했다**
모바일 칩 대표주가 **2.00% 올랐다.** 엔비디아(**+3.21%**)·마이크론(**+2.40%**)과 함께 이날 반도체 반등을 구성한 종목이다.
**회사 고유의 신규 공시나 실적 발표는 없었다.** 필라델피아 반도체지수가 **+0.39%**에 그친 것과 비교하면 개별 상승폭이 컸다.
가장 가까운 재료는 **9월 9일 애플 신형 아이폰 공개**다. 스마트폰 신제품 사이클은 모바일 칩 수요와 직접 연결되며, 이 자리에서 **애플의 첫 폴더블 모델**이 공개될 것으로 알려져 부품 구성이 달라질 여지도 있다.
업종 차원에서는 같은 날 델이 **연간 매출·이익 전망 상향**으로 **+15.80%** 급등한 것이 우호적으로 작용했다. AI 인프라 발주가 실적 가이던스로 확인되면 **모뎀·AP를 포함한 전방 수요 추정**도 함께 올라가기 때문이다. 다만 장 마감 후 나온 **브로드컴의 전망 실망(시간외 −5%)**은 반대 방향의 신호다.

**10. 알파벳 (GOOGL) +0.63% — \$337.14, 반등폭은 시장 평균 수준**
알파벳이 **0.63% 상승(\$337.14, +\$2.12)**했다. 나스닥(**+0.45%**)과 비슷한 수준의 반등이다. **회사 고유의 신규 재료는 확인되지 않았다.**
업종 구도에서는 미묘한 위치에 있다. 이날 부진했던 **소프트웨어·서비스 업종의 'AI 위협' 논쟁**에서 알파벳은 검색이라는 기존 사업이 AI에 잠식될 수 있는 쪽이자, 동시에 **제미나이와 자체 TPU로 AI를 직접 공급하는 쪽**이기도 하다.
AI 칩 조달 쪽 잡음은 이어지고 있다. 마벨테크놀로지가 **알파벳(구글)과 체결한 AI 칩 계약의 매출 인식 시점**을 둘러싼 의구심으로 최근 급락했는데, 이는 알파벳에게 **자체 칩 물량 확대라는 호재**인 동시에 **AI 투자 회수 시점에 대한 시장의 의심**을 보여주는 사안이다.

## 💬 섹션 3. 구루·기관 코멘트

- **뉴욕 연은 총재:** **"금리 인상이 필요할지 지켜봐야 한다"**며 **"경제는 강하다"**고 밝혔다. 시장이 반영하는 9월 인상 확률이 **68.2% → 60.1%**로 내려온 것과 같은 방향의 메시지다.
- **CME 페드워치(9/16 FOMC):** 0.25%p 인상 확률 **60.1%**, 동결 **39.9%**. ADP 고용 둔화가 확률을 끌어내린 직접 요인이다.
- **ADP 8월 민간고용:** **+3만 8,000명**으로 예상치(**4만 7,000~4만 8,000명**)를 하회. 7월치는 4만 4,000명에서 **4만 6,000명**으로 상향 조정됐다.
- **크리스 라이트 미 에너지부 장관:** **8월 31일 호르무즈 해협 통과 원유가 1,700만 배럴을 넘어 이란 전쟁 발발 이후 최대 규모**였다고 밝혔다. 교전 지속에도 실제 공급이 막히지 않고 있다는 근거로 인용됐다.
- **에드 야데니(야데니 리서치):** **"9월은 주식에 잔인할 수 있지만 매수하기 좋은 달"**이라는 견해를 제시했다. 9월 계절성 약세를 인정하면서도 조정을 매수 기회로 보는 시각이다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📊 8월 고용보고서(9/4) — 이번 주 최대 지표:** **ADP가 이미 둔화 신호(+3만 8,000명, 예상 하회)**를 냈다. 노동부 지표가 이를 확인하면 금리 인상 기대는 더 후퇴할 수 있고, 반대로 견조하게 나오면 **유가발 인플레이션과 겹쳐 인상 확률이 재상승**할 수 있다.
- **🏛 9월 FOMC(9/15~16) — 인상 확률 60.1%:** 워시 의장의 첫 정책회의다. 확률이 68.2%에서 내려왔으나 여전히 인상 쪽이 우세하다. 고용·물가 지표가 남은 2주간의 변수다.
- **📉 브로드컴 실적 — 시간외 −5%:** 실적은 예상을 웃돌았으나 **전망이 실망스럽다**는 평가에 시간외에서 5% 급락했다. AI 반도체 수요의 지속성에 대한 첫 균열 신호가 될지, 개별 이슈에 그칠지가 다음 세션 반도체 업종의 관전 포인트다.
- **⚔️ 미·이란 교전과 호르무즈 통항:** 교전은 이어지고 있으나 **8/31 통항 원유 1,700만 배럴**이라는 실물 데이터는 공급 차질이 현실화되지 않았음을 보여준다. **실제 봉쇄가 발생하는지**가 유가 90달러대의 정착 여부를 가른다.
- **🇰🇷 자사주 방어선의 한계:** 전일 국내 증시는 **자사주 1조 5,000억원 매수에도 −3.99%**로 급락했다. **외국인·기관 4조원 순매도** 앞에서 자사주 매입만으로는 지수를 지탱하기 어렵다는 점이 확인됐다. 수급 주체가 바뀌는지가 관건이다.
- **💱 원/달러 1,368.7원 — 네고 물량과 200억 달러:** 코스피가 4% 급락했는데도 환율은 내렸다. **수출업체 네고 물량**이 유입된 데다, 로이터 보도대로 **SK하이닉스 ADR 상장 관련 달러를 외환당국이 약 200억 달러 흡수**한 구조가 배경에 있다.
- **📌 SK하이닉스 미확정 공시 2건:** ①솔리다임 5조 프리IPO → **재공시 9/4**(내일), ②중국 충칭공장 지분 4조 매각 → **재공시 9/9**. 확정 시 실제 자산 재편이라 주가 촉매로 작용할 수 있다.
