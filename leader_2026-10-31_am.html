# 미국→한국 선점 2026-10-30 (미국 2026-10-30 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 76개 · 연결 종목 889개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 7개:** 방산(격차 +20.4%p), 조선·LNG선·함정 MRO(격차 +19.3%p), 화장품·K뷰티(격차 +14.5%p), 석유화학(격차 +13.9%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 비만치료제, CDMO·바이오시밀러, 반도체 소재·부품, 의류 OEM·패션 — 눌림 시 매수 관점.
- **이제 막 힘 붙는 조기 테마:** 전선·케이블(조기 74), 풍력(조기 72), 전력기기(조기 70) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** S-Oil(정유·LNG·가스, 점수 100), 한국가스공사(정유·LNG·가스, 점수 95), 에이비엘바이오(바이오텍·기술수출, 점수 86)
