### 2026년 9월 2일(수) 작성 · 미국 정규장: 9월 1일(화) 마감

## 🗓 시장 요약

**① 미군이 이란 혁명수비대를 타격했다 — 9월 첫 거래일을 지배한 사건**
전날 미군이 호르무즈 해협 내 이란 라라크섬 로켓 발사대를 공습하고 이란이 요르단·UAE 미군기지를 반격한 데 이어, 이날은 **미군이 이란 혁명수비대 목표물을 타격**했다고 발표했다. 교전이 사흘째 확대되면서 시장은 이를 **일회성 충돌이 아닌 확전 국면**으로 다시 가격에 반영했다. 3대 지수는 나스닥 **−1.03%**, 다우 **−0.79%**, S&P 500 **−0.71%**로 사흘 연속 하락했다.

**② 유가가 90달러를 넘었다 — WTI +5.20%, 브렌트 94달러대**
WTI는 배럴당 **\$90.22(+5.20%, +\$4.46)**, 브렌트유는 **\$94.65(+4.6%)**로 마감했다. 호르무즈 해협은 전 세계 해상 원유 수송의 핵심 통로이며, 공급 차질 우려가 실제 가격에 반영되기 시작했다는 뜻이다. **불과 지난주만 해도 WTI는 주간 −4.20%로 중동 프리미엄을 되돌리고 있었는데, 사흘 만에 90달러대로 올라섰다.**

**③ 진짜 사건은 채권이었다 — 글로벌 국채 동반 발작**
이날 증시를 실제로 무너뜨린 것은 유가보다 **채권**이었다. 미 10년물 금리는 장중 **4.803%**까지 올라 **2025년 1월 이후 최고 수준**을 기록하고 **4.796%(+4.4bp)**로 마감했다. 더 중요한 것은 이것이 미국만의 현상이 아니라는 점이다. **일본 10년물 국채금리가 1996년 이후 처음으로 3%를 돌파**했고, 영국·독일 등 주요국 장기금리도 수년에서 수십 년 만의 최고 수준으로 뛰었다. **미국 40조 달러 부채 우려와 인플레이션 재점화가 겹치며 선진국 국채가 동시에 팔린 것**이 이날의 본질이다.

**④ 이번엔 단기물이 더 올랐다 — 플래트닝**
2년물이 **4.400%(+5.6bp)**, 10년물이 **4.796%(+4.4bp)**로 **단기물이 더 크게 올랐다.** 10-2년 스프레드는 **약 39.6bp**로 소폭 축소됐다. 유가가 5% 넘게 뛰자 시장이 이를 **장기 인플레이션 프리미엄이 아니라 당장의 정책금리 경로 변경**으로 읽었다는 뜻이다. CME 페드워치 기준 9월 FOMC 0.25%p 인상 확률은 **68.2%**까지 올라, 이제 인상이 기본 시나리오에 가까워졌다.

**⑤ 반도체가 다시 최약이었다 — SOX −2.09%**
필라델피아 반도체지수가 **11,288.61(−2.09%)**로 밀렸다. 마이크론 **−2.60%**, SK하이닉스 ADR **−2.38%**, 엔비디아 **−1.51%**로 메모리와 AI 반도체가 함께 빠졌다. **금리 상승에 가장 민감한 장기 성장주라는 성격**이 이날도 그대로 작동했다. 테슬라도 **−3.22%**로 대형주 중 최대 낙폭이었다.

**⑥ 하락장에서 애플만 올랐다 — +2.61%**
애플이 **\$325.13(+2.61%, +\$8.28)**로 이날 대형 기술주 가운데 유일하게 의미 있게 올랐다. **9월 9일 신형 아이폰 공개**를 8일 앞둔 시점의 상승이다. 메타도 **+1.08%**로 소폭 올랐다. 반면 알파벳 **−1.28%**, 아마존 **−1.87%**로 나머지 빅테크는 내렸다.

**⑦ 위험자산이 아니라 '모든 자산'이 팔렸다 — 금도 −2.36%**
주식이 빠졌는데 금이 **−2.36%(\$4,375.70)**, 은이 **−3.47%**, 구리가 **−2.30%** 함께 빠졌다. VIX는 **16.34(+9.52%)**로 뛰었고 달러인덱스는 **99.62(+0.24%)**로 올랐다. **금리가 오르면 무이자 자산이 먼저 팔린다**는 구조가 지정학 리스크에 따른 안전자산 수요를 압도했다. 이날 오른 자산은 사실상 **유가와 달러뿐**이었다.

**⑧ 한국은 미국보다 먼저, 그리고 조용히 올랐다**
코스피는 **+0.23%(6,835.80)**로 이틀 연속 상승 마감했다. 다만 상승 주체는 **기타법인 홀로**였고 외국인·기관은 순매도였다. 코스닥은 **−1.56%(821.25)**로 이틀 연속 하락해 대형주와 중소형주가 갈렸다. **SK하이닉스는 +1.14%(1,693,000원)**로 올랐는데, 특히 **외국인이 +9만 1,835주 순매수로 전환**한 것이 눈에 띈다. 원/달러는 **1,370.4원(+1.8원)**, 장중 1,373원까지 올랐다.

## 🏭 섹션 1. 업종별 흐름

**하락 ①  반도체 (이날 최약)**
SOX **−2.09%(11,288.61)**, 마이크론 **−2.60%**, SK하이닉스 ADR **−2.38%**, 엔비디아 **−1.51%**, 인텔 **−0.60%**. AMD도 하락했다. **10년물이 2025년 1월 이후 최고 수준으로 오른 것**이 장기 성장주 전반의 할인율을 밀어올렸다.

**하락 ②  전기차**
테슬라가 **−3.22%(\$356.09)**로 대형주 중 최대 낙폭을 기록했다. 금리 민감도가 높은 데다 유가 급등이 전기차 수요에 미치는 영향은 양면적이라, 이날은 금리 쪽 부담이 우세했다.

**하락 ③  귀금속·산업금속**
금 선물 **−2.36%(\$4,375.70)**, 은 **−3.47%**, 구리 **−2.30%**. 지정학 리스크가 커진 날 금이 오히려 빠진 것이 이날 시장의 성격을 압축한다 — **실질금리 상승이 안전자산 프리미엄을 눌렀다.**

**상승 ①  에너지 (이날 유일한 확실한 상승)**
WTI **+5.20%(\$90.22)**, 브렌트 **+4.6%(\$94.65)**. 미군의 이란 혁명수비대 타격 발표 직후 상승 폭이 확대됐다. 정유·에너지 관련주가 이날 시장에서 가장 뚜렷한 상승 업종이었다.

**상승 ②  하드웨어 (애플 단독)**
애플이 **+2.61%(\$325.13)** 올랐다. **9월 9일 신형 아이폰 공개**와 **첫 폴더블 모델** 기대가 재료다. 기술주가 일제히 빠진 날의 상승이라 상대 강도가 컸다.

**상승 ③  광고·플랫폼 일부**
메타가 **+1.08%(\$578.54)** 올랐다. 알파벳(**−1.28%**)·아마존(**−1.87%**)과 방향이 갈렸다. 빅테크 안에서도 종목별 차별화가 나타난 날이다.

> 🇰🇷 [전달] **코스피200 야간선물이 −3.49%(1,040.50, −37.65)로 급락**했다. 이번 국면에서 가장 큰 낙폭이다. 장중 궤적은 정규장 선물 종가(1,078.15) 아래 **1,061.00으로 갭하락 출발해 고가 1,061.40에 그치고 저가 1,031.30(−4.35%)까지 밀린 뒤 소폭 회복**한 흐름이다. **반등 시도 자체가 거의 없었다는 점**이 직전 세션들과 다르다. 거래량 **30,651계약**으로 전 세션(22,349계약) 대비 **37% 급증**했고, 미결제약정은 **154,645계약(▼1,091)**으로 줄었다 — **신규 매도보다 기존 포지션 청산이 함께 나온 급락**으로 읽힌다.
>
> [수급] 전일 국내는 코스피 **+0.23%(6,835.80)**, 코스닥 **−1.56%(821.25)**로 갈렸다. 코스피 상승은 **기타법인 단독 매수**가 만들었고 외국인·기관은 순매도였다. SK하이닉스는 **+1.14%(1,693,000원)**로 올랐고, **외국인이 +9만 1,835주로 순매수 전환**(기관 −14만 2,669주, 개인 −59만 498주)했다. 거래대금 **6조 8,160억원**, 시가총액 **1,236조원**. 괴리율은 **+34.6% → +30.1%**로 4.5%p 축소됐다 — 국내가 오르고(+1.14%) ADR이 빠진(**−2.38%**) 결과다.

**[시장의 시선]** 이날의 성격은 **'중동 리스크'가 아니라 '글로벌 금리 발작'**이다. 미 10년물이 2025년 1월 이후 최고로 오른 것보다, **일본 10년물이 1996년 이후 처음 3%를 넘고 영국·독일 장기금리가 동반 급등**한 쪽이 크다. 특정 국가의 정책이 아니라 **선진국 국채 전반에서 자금이 빠지는 국면**이라는 뜻이기 때문이다.

자산 반응이 이를 뒷받침한다. 주식·금·은·구리가 모두 빠지고 유가와 달러만 올랐다. **지정학 리스크였다면 금이 올랐어야 하는데 −2.36%였다.** 시장이 이번 유가 급등을 안전자산 신호가 아니라 **인플레이션·금리 재료**로 처리했다는 근거다.

한국 쪽에서 확인된 사실은 두 가지가 엇갈린다. 하나는 **야간선물 −3.49%**로 이번 국면 최대 낙폭이자 반등 시도가 거의 없었다는 점, 다른 하나는 **SK하이닉스 외국인 순매수 전환(+9만 1,835주)**과 **괴리율 4.5%p 축소**다. 전자는 지수 전반, 후자는 개별 종목 수급이라 층위가 다르다.

주시할 변수는 세 가지다 — **①미·이란 교전의 확전 여부와 유가 90달러 정착 여부**, **②9월 FOMC 인상 확률 68.2%**(9/16), **③9월 4일 발표되는 8월 고용보고서**.

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 테슬라 (TSLA) −3.22% — \$356.09, 대형주 최대 낙폭, 금리 부담이 재료를 눌렀다**
전기차 대표주가 **3.22% 하락(\$356.09, −\$11.86)**해 이날 대형주 가운데 가장 크게 밀렸다. **회사 고유의 신규 악재는 확인되지 않았고**, 금리 급등과 위험자산 전반의 디리스킹에 대한 반응으로 해석된다.
직전에 부각됐던 재료들은 여전히 진행형이다. 일론 머스크 CEO가 밝힌 **테슬라·스페이스X 각각 연간 100기가와트(GW) 태양광 생산 능력 확보**와 텍사스 오스틴의 **'사이버캡' 출시·FSD 개선**이 그것이다.
문제는 이런 재료들이 모두 **회수 기간이 긴 장기 프로젝트**라는 점이다. 10년물이 **4.796%(+4.4bp)**로 2025년 1월 이후 최고 수준까지 오른 국면에서는 **먼 미래 현금흐름의 현재가치가 먼저 깎인다.** 테슬라는 그 구조에 가장 직접 노출된 대형주에 속한다.

**2. 애플 (AAPL) +2.61% — \$325.13, 아이폰 공개 8일 앞, 하락장에서 유일하게 크게 올랐다**
애플이 **2.61% 상승(\$325.13, +\$8.28)**해 3대 지수가 모두 빠진 날 대형 기술주 중 유일하게 뚜렷하게 올랐다.
가장 가까운 재료는 **9월 9일 예정된 신형 아이폰 공개**다. 이 자리에서 **애플의 첫 폴더블폰**이 나올 것으로 알려져 있어, 신제품 사이클 기대가 금리 부담을 상쇄했다.
공급망 쪽에는 반대 신호도 있다. 메모리 가격이 **15% 이상** 오른 상황이라 폴더블 신제품의 부품 원가 부담이 커지며, 이는 국내 메모리·디스플레이 업체와의 **단가 협상 압박**으로 이어질 수 있는 사안이다. 애플의 상승이 곧바로 한국 부품사 수혜로 직결되지는 않는다는 뜻이다.

**3. 마이크론 (MU) −2.60% — 메모리 랠리 하루 만에 차익실현**
미국 메모리 대표주가 **2.60% 하락**해 이날 주요 반도체주 중 낙폭이 가장 컸다. 개장 전 거래에서 이미 **약 2.1%** 밀린 채 출발했고, 샌디스크(**약 −3%**)와 SK하이닉스 ADR도 같은 방향이었다.
매도 근거는 **금리**다. 10년물이 **4.796%**까지 오르며 밸류에이션 부담이 커진 데다, 직전 세션의 메모리 강세에 대한 차익 실현 물량이 겹쳤다.
펀더멘털 쪽 재료는 유효하다. 엔비디아가 실적 발표에서 경고한 **메모리 부품 부족**은 여전히 가격 협상력으로 작동하고 있고, 메모리 가격은 **15% 이상 인상**된 상태다. 다만 중국 YMTC가 **2027년까지 세계 최대 낸드 생산업체**를 목표로 내걸며 중기 경쟁 압력도 함께 커지고 있다.

**4. SK하이닉스 ADR (SKHY) −2.38% — \$160.67 (괴리율: +30.1%), 목표주가 27.3% 하향이 나왔다**
ADR이 **2.38% 하락(\$160.67, −\$3.91)**했다. 시가 **\$161.63**에서 저가 **\$158.52**까지 밀렸다가 회복했고, 거래량은 **1,062만 7,781주**였다. 시간외는 **\$160.38(−0.18%)**.
악재는 명확하다. **HBM 수익성 우려를 이유로 목표주가가 27.3% 하향 조정**됐다는 보도가 나왔다. HBM은 SK하이닉스 이익의 핵심 축이고, **가격이 아니라 마진**이 문제로 지목됐다는 점이 무겁다.
반대편 재료도 함께 나왔다. **인텔 파운드리를 HBM4E 베이스 다이 공급처로 검토** 중이라는 보도가 이어졌고, WSJ은 **한국의 8월 수출이 반도체 주도로 증가세를 이어갔다**고 전했다(반도체는 올해 한국 수출액의 3분의 1 이상). 국내 주가는 **+1.14%(1,693,000원)**로 올랐고 **외국인이 +9만 1,835주 순매수로 전환**했다. 괴리율은 **+34.6% → +30.1%**로 축소됐다. 컨센서스 PER **4.85배**, 12개월 목표주가 **\$247.31**(애널리스트 14명, Strong Buy).

**5. 메타 (META) +1.08% — \$578.54, 빅테크 중 애플과 함께 오른 두 종목**
메타가 **1.08% 상승(\$578.54, +\$6.20)**했다. **회사 고유의 신규 재료는 확인되지 않았으나**, 알파벳(**−1.28%**)·아마존(**−1.87%**)과 방향이 갈렸다는 점이 특징이다.
해석의 여지는 **자본지출 구조**에 있다. AI 인프라 투자 회수 시점에 대한 의심이 시장 전반으로 번진 국면인데, 마벨테크놀로지가 **알파벳과의 AI 칩 계약 매출 인식 시점** 논란으로 급락한 것이 그 대표 사례다. **클라우드 인프라를 외부에 판매하지 않는 메타는 이런 계약 리스크에 노출되지 않는다**는 점이 상대 강도로 나타났다는 시각이 있다.
다만 유가 급등은 부담이다. WTI가 **+5.20%(\$90.22)**, 브렌트가 **\$94.65**까지 오르며 인플레이션 재점화 경로가 열렸고, 이는 통상 **광고주 예산 축소**로 먼저 나타나는 항목이다. CME 페드워치 기준 9월 FOMC 인상 확률 **68.2%**도 같은 방향의 압력이다.

**6. 엔비디아 (NVDA) −1.51% — \$217.44, 금리 급등에 AI 대장주도 못 버텼다**
엔비디아가 **1.51% 하락(\$217.44, −\$3.34)**했다. 개장 전 거래에서부터 마이크론·AMD·인텔과 함께 약세로 출발했다.
매도 근거는 **개별 재료가 아니라 금리**다. 10년물이 장중 **4.803%**까지 오르며 2025년 1월 이후 최고 수준을 기록했고, 9월 FOMC 인상 확률이 **68.2%**로 높아졌다. 실적 발표에서 제시한 **다음 회계연도 매출 약 70% 증가** 가이던스는 유효하지만, 그 성장이 실현되는 시점의 할인율이 계속 올라가고 있다.
구조적 부담도 남아 있다. 회사가 직접 경고한 **메모리 부품 부족**은 원가 상승 요인이고, **미국의 반도체 전면 관세 검토** 보도는 여전히 해소되지 않았다. 관세는 고객사의 데이터센터 구축 단가를 올려 **수요 시점을 늦춘다**는 점에서 더 직접적인 위험이다.

**7. 아마존 (AMZN) −1.87% — \$254.92, 유가 90달러가 물류 원가를 직격한다**
아마존이 **1.87% 하락(\$254.92, −\$4.85)**했다. **회사 고유의 재료는 확인되지 않았고**, 이날의 두 축인 유가와 금리 모두에 노출된 구조가 낙폭을 만들었다.
유가 쪽이 특히 직접적이다. WTI가 **\$90.22(+5.20%)**, 브렌트가 **\$94.65**까지 오르면 **물류·배송 원가**가 곧바로 압박받는다. 매출의 상당 부분이 물류 집약적 리테일에서 나오는 만큼 유가 스파이크에 마진이 그대로 노출된다.
금리 쪽도 마찬가지다. **10년물 4.796%**는 AWS라는 장기 성장 서사의 할인율을 올린다. **성장 부문과 원가 부문이 서로 다른 이유로 동시에 압박받는 구도**가 이어지고 있다.

**8. 인텔 (INTC) −0.60% — \$88.97, 시가 −3% 갭하락을 대부분 되돌렸다**
인텔이 **0.60% 하락(\$88.97, −\$0.54)**했다. 시가는 **\$86.84**로 전일 종가(\$89.51) 대비 3% 가까이 낮게 출발했고 저가 **\$85.72**까지 밀렸으나, 고가 **\$89.41**까지 회복하며 낙폭을 대부분 지웠다. 거래량은 **7,342만 주**였다.
회복을 뒷받침한 것은 **파운드리 수주 서사**다. **SK하이닉스가 HBM4E 베이스 다이 공급처로 인텔 파운드리를 검토** 중이라는 보도가 이어지고 있다. 베이스 다이는 HBM 적층의 최하단 로직 칩으로 그동안 TSMC가 사실상 독점해 온 영역이다.
반대 시각도 나왔다. 이날 **인텔 주가가 고평가 구간에 들어섰다는 분석**이 제기됐다. 회사는 최근 12개월 **순손실 112억 9,000만 달러**를 기록 중이고, 애널리스트 48명의 평균 투자의견은 **'Hold'**, 12개월 목표주가는 **\$114.88**이다. **파운드리 손익분기 목표는 2027년 말~2028년**으로 제시돼 있다.

**9. 알파벳 (GOOGL) −1.28% — \$335.02, 매크로 압력에 함께 밀렸다**
알파벳이 **1.28% 하락(\$335.02, −\$4.33)**했다. **개별 촉매는 확인되지 않았으며**, 장기금리 상승과 유가발 인플레이션 우려에 대한 반응으로 보인다.
AI 자본지출 구도에서는 부담이 계속되고 있다. 마벨테크놀로지가 **알파벳(구글)과 체결한 AI 칩 계약에서 매출이 발생하는 시점**을 둘러싼 의구심으로 최근 급락했는데, 이는 발주처인 알파벳 입장에서 **자체 TPU 물량 확대라는 호재**인 동시에 **AI 투자 회수 시점에 대한 시장의 의심이 공급망 전반으로 번지고 있다**는 신호이기도 하다.
광고 매출 비중이 높다는 점도 이날 국면에서는 불리했다. WTI **+5.20%**가 소비 위축 우려로 이어지고, 9월 FOMC 인상 확률 **68.2%**가 이를 강화하는 구조다.

**10. 넷플릭스 (NFLX) −0.30% — \$80.81, 하락장에서 방어에 성공했다**
넷플릭스가 **0.30% 하락(\$80.81, −\$0.24)**하는 데 그쳤다. 나스닥이 **−1.03%** 빠진 날의 낙폭이라 상대적으로 방어에 성공한 축이다.
**회사 고유의 신규 재료는 확인되지 않았다.** 다만 구독형 매출 구조가 광고 경기나 유가에 상대적으로 덜 민감하다는 점이 이날 방어의 배경으로 해석된다. 광고 의존도가 높은 알파벳(**−1.28%**)·메타와 비교하면 노출 경로가 다르다.
금리 측면에서도 상대적으로 유리했다. 이미 이익을 내고 있어 **먼 미래의 성장에 대한 할인율 민감도가 반도체·전기차보다 낮기 때문**이다. 이날 낙폭이 큰 종목들(테슬라 **−3.22%**, 마이크론 **−2.60%**)이 모두 장기 성장 서사에 의존하는 업종이었다는 점과 대비된다.

## 💬 섹션 3. 구루·기관 코멘트

- **CME 페드워치(9/16 FOMC):** 0.25%p **인상 확률 68.2%**. 인상이 사실상 기본 시나리오에 가까워졌으며, 이번 상승분의 촉매는 연준 발언이 아니라 **유가(WTI +5.20%)**였다.
- **글로벌 채권시장 신호:** 미 10년물 장중 **4.803%**(2025년 1월 이후 최고), **일본 10년물 3% 돌파(1996년 이후 처음)**, 영국·독일 장기금리도 수년~수십 년 만의 최고. **미국 40조 달러 부채 우려와 인플레이션 재점화가 겹친 선진국 국채 동반 매도**로 해석되고 있다.
- **에드 야데니(야데니 리서치):** 미국 부채 위기가 임박했는지에 대한 시장의 우려에 견해를 밝혔다. 채권금리 급등 국면에서 **재정 지속가능성 논쟁이 다시 전면에 나온 것** 자체가 이날의 특징이다.
- **미 7월 구인건수(JOLTS):** 예상보다 부진했으나 상향 수정된 6월 수치 대비로는 소폭 증가했다. **노동시장 냉각 신호와 금리 인상 기대가 정면으로 충돌**하는 구도이며, 9월 4일 8월 고용보고서가 이를 정리할 1차 관문이다.

## 📅 섹션 4. 일정 및 관전 포인트

- **⚔️ 미·이란 교전 — 사흘째 확대:** 라라크섬 발사대 공습 → 이란의 요르단·UAE 미군기지 반격 → 미군의 **혁명수비대 목표물 타격**으로 이어졌다. **호르무즈 해협 통항 여부**가 유가의 방향을 결정하고, 유가가 다시 금리와 연준 경로로 연결되는 구조다. WTI 90달러가 정착하는지가 1차 분기점이다.
- **📊 8월 고용보고서(9/4) — 이번 주 최대 지표:** 고용이 예상보다 개선되면 추가 금리 인상 전망이 확대되고, 노동시장 냉각이 뚜렷해지면 연준의 셈법이 복잡해진다. **유가발 인플레이션과 고용 둔화가 충돌하는 조합**이 나올 경우 변동성이 커질 수 있다.
- **🏛 9월 FOMC(9/15~16) — 인상 확률 68.2%:** 워시 의장의 첫 정책회의다. 확률이 3분의 2를 넘었으므로 **인상 여부보다 점도표와 성명 문구**가 변수가 된다.
- **🌏 글로벌 국채금리 — 미국만의 문제가 아니다:** 일본 10년물의 **3% 돌파(1996년 이후 처음)**는 **엔 캐리 트레이드 청산**이라는 별개의 경로를 열 수 있는 사안이다. 일본 국내 금리가 오르면 해외 자산에 투자된 엔화 자금이 회수될 유인이 생기며, 이는 신흥국·아시아 증시 수급에 직접 영향을 준다.
- **📱 애플 신형 아이폰 공개(9/9) — 첫 폴더블:** 국내 디스플레이·부품주에 직접 재료다. 다만 **메모리 가격 15% 이상 인상** 국면이라 세트 업체의 원가 압박이 부품 단가 협상으로 전가될 여지도 함께 본다.
- **🔧 SK하이닉스 — 목표주가 하향과 인텔 파운드리 검토가 동시에:** **HBM 수익성 우려로 목표주가 27.3% 하향**이 나온 반면, **인텔 파운드리 HBM4E 베이스 다이 검토**와 **일본 공장 검토**는 진행 중이다. 상반된 재료가 겹친 만큼 후속 보도 확인이 필요하다.
- **📌 SK하이닉스 미확정 공시 2건:** ①솔리다임 5조 프리IPO → **재공시 9/4**, ②중국 충칭공장 지분 4조 매각 → **재공시 9/9**. 이번 주와 다음 주에 연속 예정돼 있다.
