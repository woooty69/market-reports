# 📊 한국증시 데일리 리포트 (장중판)
### 2026년 10월 15일(목) 12시 작성 · 기준일: 10월 15일(목) 정규장 오전장(11:56 현재) (장중판)

## 주요 지수·자산

| 지표 | 현재 / 레벨 | 등락 |
|---|---|---|
| 코스피 | 5,551.35 | **−457.46 (−7.61%)** |
| 코스닥 | 760.58 | **−63.30 (−7.68%)** |
| 코스피200 | 860.81 | **−76.01 (−8.11%)** |
| 코스피200 선물 | 865.05 | **−79.15 (−8.38%)** |
| 원/달러(하나은행 고시) | 1,350.60원 | **+7.60원 (+0.57%)** |
| 코스피 순매수(장중 잠정, 억원) | 개인 +10,377 · 외국인 −26,518 · 기관 +12,803 | **외국인 2.6조원 순매도** |
| 코스닥 순매수(장중 잠정, 억원) | 개인 −16 · 외국인 +191 · 기관 −221 | **수급 중립** |
| 전일 미국(10/14) | 마이크론 −4.1% · 엔비디아 −3.2% · ASML −3.9% · 코어위브 −15.5% | **AI 반도체 약세** |

*11:56 현재 장중 잠정치 — 종가 아님*

*코스피는 전일(6,008.81) 대비 3.6% 낮은 5,673.01에 출발해 장 초반 5,751.45까지 반등을 시도했으나 매도 사이드카 발동 이후 낙폭을 키워 장중 5,533.16까지 밀렸고, 11시 56분 현재 5,551.35(−7.61%)로 오전장 저점 부근에 머물러 있다. 외국인이 코스피에서 2조 6,518억원을 순매도한 반면 개인(+1조 377억원)과 기관(+1조 2,803억원)이 받아내는 구도다. SK하이닉스(−10.71%)·삼성전자(−9.27%)·삼성전기(−16.08%)·SK스퀘어(−11.03%) 등 반도체·전자부품이 낙폭을 주도했고, 업종별로는 전자장비와기기(−14.16%)·전기장비(−11.40%)·반도체(−10.13%)가 가장 약했다. 상승 업종은 상업서비스(+4.09%)·담배(+4.07%) 정도에 그쳤다.*

## 🗓 시장 요약

**① 코스피 7%대 급락, 양 시장 매도 사이드카 — '검은 목요일'.** 미국 9월 CPI가 +3.7% YoY로 예상(+3.6%)을 웃돌고 근원물가도 2개월 연속 예상을 상회하면서 금리 인상 경계가 커졌고, 코어위브 회사채 금리 급등이 AI 신용위험 우려로 번졌다. 코스피는 개장 직후 5%대 하락으로 출발해 코스피·코스닥 모두 매도 사이드카가 발동됐고, 정오 무렵 −7.61%까지 낙폭이 확대됐다. 변동성지수(VKOSPI)는 장중 55선을 넘어 한 달 반 만에 최고치를 기록했다.

**② 반도체 투톱 10% 안팎 폭락, 소부장·기판까지 동반 급락.** SK하이닉스는 1,267,000원(−10.71%), 삼성전자는 210,500원(−9.27%)으로 거래대금이 각각 3조 6,087억원·3조 5,678억원에 달했다. 호실적에도 AI 투자수익성 의구심과 외국인 매도가 겹치며 연저점 수준으로 밀렸고, 삼성전기(−16.08%)·대덕전자(−14.41%)·이수페타시스(−14.66%) 등 기판주와 원익IPS(−13.50%)·테스(−15.94%) 등 장비주도 급락했다.

**③ 방어주·자사주 매입 종목만 버텼다.** 상업서비스(+4.09%)는 4,500억원 자사주 공개매수를 결정한 에스원(+12.49%)이, 담배(+4.07%)는 사상 최대 실적 기대의 KT&G(+3.85%)가 끌어올렸다. 삼성바이오로직스(+3.30%)·셀트리온(+0.61%) 등 바이오 대형주와 하나금융지주(0.00%)·KB금융(−1.32%) 등 금융주도 지수 대비 선방했다. 반면 전력기기(효성중공업 −14.15%, 산일전기 −15.80%)와 전기장비(−11.40%)는 낙폭이 컸다.

**④ 원/달러 1,350원대, 대외 변수는 금리·AI 신용.** 원/달러는 1,350.60원(+7.60원)으로 오르며 외국인 이탈 압력을 반영했다. 달러인덱스는 미국 물가 상회로 102.55까지 올랐고, 시장은 오후에 발표될 해외 지표와 이번 주 TSMC 실적에서 AI 수요 확인 여부를 기다리고 있다.

## 1. 업종별 흐름

**상승 업종** — 상업서비스와공급품(+4.09%)은 에스원(+12.49%)의 4,500억원 자사주 공개매수·기존 자사주 전량 소각 결정이 이끌었다. 담배(+4.07%)는 KT&G(+3.85%)가 사상 최대 영업이익 기대와 신한투자증권의 업종 최선호주 유지(목표가 230,000원)로 상승했다. 다각화된통신서비스(+0.38%)가 소폭 올랐고 제약(−0.20%)·식품(−0.47%)은 보합권을 지켰다.

**하락 업종** — 전자장비와기기(−14.16%, 상승 5/하락 94)가 가장 약했고 전기장비(−11.40%), 반도체와반도체장비(−10.13%, 하락 166종목), 통신장비(−8.77%), 에너지장비및서비스(−8.27%)가 뒤를 이었다. 삼성전기(−16.08%)·LG이노텍(−10.31%)·심텍(−13.40%) 등 AI 서버 부품주, 효성중공업(−14.15%)·HD현대일렉트릭(−9.94%)·LS ELECTRIC(−11.96%) 등 전력기기주가 동반 급락했다.

**시장의 시선** — 오후장은 외국인 순매도(현재 2.6조원)가 더 늘어나는지, 코스피가 오전 저점 5,533선을 지키는지가 관건이다. 코스피가 전일 대비 8% 이상 하락이 1분간 이어지면 서킷브레이커 1단계가 발동되는 만큼 남은 0.4%p 여유가 시장 심리를 좌우한다. 개인·기관 저가 매수가 반도체 대형주에 계속 유입되는지도 볼 대목이다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 29종목

**1. SK하이닉스 (000660) 1,267,000원 · 925조 5,338억원 · −10.71% — 호실적 무색한 폭락, 128만닉스까지 밀려**

미국 9월 CPI 상회와 코어위브발 AI 신용위험이 겹치며 오전장 10%대 급락해 1,267,000원까지 밀렸다. 거래대금은 3조 6,087억원으로 시장 1위였고 외국인 매도가 집중됐다. 호실적에도 AI 투자수익성 논란이 재부각되면서 삼성전자와 함께 연저점 수준까지 내려왔다는 평가다. [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf) · [리포트: SK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261012_SK_196606.pdf)

**2. 삼성전자 (005930) 210,500원 · 1,230조 6,416억원 · −9.27% — 21만전자로 후퇴, 개미는 7조원 '줍줍'**

삼성전자는 210,500원(−9.27%)으로 밀리며 거래대금 3조 5,678억원을 기록했다. 증시 폭락이 이어지는 가운데 개인은 최근 삼성전자·SK하이닉스를 7조원가량 순매수한 것으로 집계됐다. 7거래일 급락으로 코스피 시가총액이 1,200조원 증발했다는 분석이 나오는 등 반도체 쏠림의 역풍이 커지고 있다. [리포트: NH 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261012_NH_1137232.pdf) · [리포트: Kiwoom 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261012_Kiwoom_196578.pdf) · [리포트: IBK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261012_IBK_196588.pdf)

**3. 삼성전기 (009150) 1,153,000원 · 86조 1,218억원 · −16.08% — '300만원 간다'더니 하루아침에 −16%**

AI 서버용 기판·MLCC 기대로 급등했던 삼성전기가 1,153,000원(−16.08%)으로 폭락하며 거래대금 7,782억원을 기록했다. 미국 물가 충격 영향으로 기판주 전반이 급락했고 시가총액은 86조원대로 줄었다. 반도체 소부장 ETF 편입 기대가 나온 지 하루 만에 차익실현 매물이 쏟아졌다. [리포트: Yuanta 2026-10-08](https://woooty69.github.io/hw-pdf-arch-024/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261008_Yuanta_196548.pdf) · [리포트: Mirae Asset 2026-10-07](https://woooty69.github.io/hw-pdf-arch-024/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261007_Mirae%2BAsset_196491.pdf) · [리포트: Mirae Asset 2026-10-07](https://woooty69.github.io/hw-pdf-arch-024/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261007_Mirae%2BAsset_1136246.pdf)

**4. SK스퀘어 (402340) 758,000원 · 99조 9,984억원 · −11.03% — 하이닉스 급락에 지주 할인 확대**

SK하이닉스 지분 가치에 연동되는 SK스퀘어는 758,000원(−11.03%)으로 하이닉스보다 낙폭이 컸다. 거래대금은 4,499억원으로 코스피 4위였고 시가총액은 100조원 아래로 내려왔다. 한화투자증권 EPS LIVE에서 신흥국 EPS 상향 상위에 들었지만 오늘은 지주 레버리지가 하방으로 작용했다. [리포트: SK 2026-09-30](https://woooty69.github.io/hw-pdf-arch-021/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260930_SK_1134363.pdf) · [리포트: Daishin 2026-07-13](https://woooty69.github.io/hw-pdf-arch-011/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260713_Daishin_1112316.pdf) · [리포트: BNK 2026-07-10](https://woooty69.github.io/hw-pdf-arch-011/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260710_BNK_1112101.pdf)

**5. 주성엔지니어링 (036930) 210,000원 · 9조 7,610억원 · −12.68% — 코스닥 대장 장비주도 12%대 급락**

주성엔지니어링은 210,000원(−12.68%)으로 밀리며 코스닥 거래대금 2,588억원을 기록했다. 코스닥은 하락 종목이 1,500개를 넘으며 778선 아래로 밀렸고 시총 상위 장비주가 일제히 약세다. 코엑스 반도체 대전 참가 등 개별 이슈보다 반도체 투톱 급락이 소부장 전반의 투매로 번진 영향이 컸다. [리포트: BNK 2026-06-29](https://woooty69.github.io/hw-pdf-arch-009/%EC%A3%BC%EC%84%B1%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81%EF%BC%BB036930%EF%BC%BD_20260629_BNK_1108824.pdf) · [리포트: MERITZ 2026-02-12](https://woooty69.github.io/hw-pdf-arch-003/%EC%A3%BC%EC%84%B1%EC%97%94%EC%A7%80%EB%8B%88%EC%96%B4%EB%A7%81%EF%BC%BB036930%EF%BC%BD_20260212_MERITZ_1072802.pdf)

**6. 현대차 (005380) 294,500원 · 59조 9,209억원 · −6.06% — 인도 푸네공장 준공에도 3Q 눈높이 하향**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
