## 🗓 시장 요약

**미 재무부가 급한 불을 껐다.** 재무부가 **장기 국채 바이백을 통한 유동성 지원**에 나서면서 치솟던 장기금리에 제동이 걸렸다. 30년물이 **−1.82%(5.189%)**, 10년물이 **−6.4bp(4.641%)**로 급락했고, 이틀간 위험자산을 짓눌렀던 **글로벌 국채 발작이 일단 멈췄다.** 3대 지수는 사흘 만에 반등했다 — 다우 +0.22%, S&P +0.22%, 나스닥 +0.16%. VIX는 **−6.00%(14.89)**로 내려앉았다.

금리가 빠지자 **달러가 −0.87%(98.69)로 무너지고 귀금속이 폭발했다.** 금이 **+3.62%(\$4,580.75)**, 은이 **+4.84%(\$67.14)** 급등했다. 전날 금·은·구리가 동반 하락하며 레버리지 청산을 시사했던 것과 정확히 반대 방향이다.

**이날의 주인공은 모더나였다.** 암 백신 3상 성공 소식에 **+177.87%(\$174.95)** 폭등하며 거래량 **1억 8,276만 주**를 기록했다. 머크도 **+12.62%**로 동반 급등해 헬스케어가 지수를 떠받쳤다. 애플 +2.19%, 테슬라 +4.23%, 아마존 +2.46%, 넷플릭스 +3.15%까지 대형 기술주도 대체로 올랐다.

**그런데 반도체는 이틀째 팔렸다.** SOX가 **−2.12%(11,738.20)**로 밀리며 장중 11,633.8까지 내려갔다. 시가 12,063.9로 반등 출발했다가 되밀린 것으로, **지수가 오르는 날에도 반도체만 따로 조정받는** 국면이 이어지고 있다. 네비우스 −9.97%, 시게이트 −7.87%, 웨스턴디지털 −6.87%, 램리서치 −6.29%, 델 −6.65%. 반면 마벨은 **+9.85%**로 홀로 급반등해 업종 내 편차가 극심했다.

한국 쪽에서 가장 중요한 건 **SK하이닉스의 40조원 자사주 매입·전량 소각 발표**다. 최대 2,400만 주를 매입해 **전량 소각**하고 특별배당도 검토한다는 내용으로, **한국 증시 사상 최대 규모**다. SKHY는 프리마켓에서 **+6%(\$164.73)**까지 뛰었다가 종가는 **+0.35%(\$156.16)**로 축소됐고, 시간외에서 **+1.31%(\$158.21)**로 다시 올랐다. 반면 서울에서는 발표 당일 **−9.75%(1,500,000원)**로 폭락 마감해, **괴리율이 +32.4% → +47.0%로 14.6%p 급확대**됐다.

> *어제 판정 복기 — **틀렸다.** '갭다운 후 낙폭 축소 시도'로 봤으나 실제 코스피200 선물은 **−5.75%**, SK하이닉스(000660)는 **−9.75%**로 낙폭이 축소되기는커녕 확대됐다. 무효화 조건으로 적었던 **'외국인 순매도 대량 전환'이 정확히 실현**됐다(−119만 9,222주, 5거래일 만의 매도 전환). 더 뼈아픈 건 **'괴리율 +32.4%로 좁혀졌으니 국내 조정 폭이 ADR보다 작을 것'**이라는 논리다 — 실제로는 국내 −9.75%가 ADR −9.20%보다 **더 컸다.* *괴리율 축소가 국내 하방을 막아주지 않는다는 사실을 확인한 셈이다.*

## 📰 헤드라인 3선

**1. 미 재무부 장기국채 바이백 — 국채 발작 진화, 증시 사흘 만에 반등**
미국 재무부가 장기 국채 시장에 유동성을 공급하겠다고 나서면서 이틀간 급등하던 금리가 방향을 틀었다. **30년물 −1.82%(5.189%)**, 20년물 −1.95%, 10년물 −6.4bp(4.641%). 일본 10년물도 **−1.86%(2.897%)**로 함께 내려 **글로벌 국채 발작이 일단 진정**됐다. 로이터는 "재무부가 유동성 지원에 나서자 금리가 하락했다"고 전했다. 다만 **고금리 위험 자체가 해소된 것은 아니라는 평가**가 지배적이다.

**2. 모더나 +177.87% — 암 백신 3상 성공, 거래량 1.8억 주**
모더나가 암 백신 임상 3상 성공 소식에 **\$174.95(+177.87%)**로 폭등했다. 거래량은 **1억 8,276만 주**로 이날 시장 전체 최다였다. 머크도 **+12.62%(\$152.23)**로 동반 급등했다. 헬스케어 섹터의 이 이례적 상승이 **반도체 약세에도 S&P·다우가 플러스로 마감한 결정적 이유**다.

**3. SK하이닉스, 40조원(290억 달러) 자사주 매입·전량 소각 — 한국 사상 최대**
SK하이닉스 이사회가 **40조원 규모의 자사주를 매입해 전량 소각**하기로 결의했다. 최대 **2,400만 주**가 대상이며 **특별배당**도 검토 중이다. WSJ는 "한국 증시 사상 최대 규모의 자사주 매입"이라고 전했고, 회사는 **현재 주가가 내재가치를 반영하지 못한다**는 입장을 밝혔다(마켓워치). 배런스는 이 발표가 **AI 지출 둔화 우려를 완화할 수 있다**고 분석했다. 다만 발표 당일 서울 주가는 반도체 매도세에 휩쓸려 **−9.75%**로 마감했다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  헬스케어·바이오 (이날 최강)**
모더나 **+177.87%**, 머크 **+12.62%**. 암 백신 3상 성공이라는 단일 재료가 섹터 전체를 끌어올렸다. 알렉산드리아리얼에스테이트(생명과학 리츠)도 +10.27%로 동반 상승했다.

**상승 ②  귀금속·광산**
금 **+3.62%(\$4,580.75)**, 은 **+4.84%**. 뉴몬트마이닝이 **+7.85%(\$125.08)**로 올랐다. 금리 급락과 달러 약세(−0.87%)가 겹친 전형적 조합이다.

> 🇰🇷 [전달] 달러 약세는 원/달러 하락(1,411.93원)으로 이어져 **외국인 수급에 우호적**. 다만 8/19 외국인은 이미 −119.9만 주 순매도로 전환한 상태다.

**상승 ③  대형 기술주·소비**
테슬라 +4.23%, 넷플릭스 +3.15%, 아마존 +2.46%, 애플 +2.19%. 에스티로더가 **+16.34%**로 급등했고 마이크로스트래티지도 +12.68%. **금리가 내리자 고밸류 자산 전반이 반응**했다.

**하락 ①  반도체 (이틀째, SOX −2.12%)**
시게이트 **−7.87%**, 웨스턴디지털 **−6.87%**, 램리서치 **−6.29%**, 키사이트 −6.29%, 브로드컴 −4.62%, 샌디스크 −3.49%. 마이크론은 −0.37%로 선방했다. **지수가 오르는 날에도 반도체만 계속 매도**되는 구도다.

> 🇰🇷 [전달] **오늘 국내 개장의 핵심 갈등**이다. 야간선물은 +2.37% 반등했지만 SOX는 −2.12%로 이틀째 하락했다. **지수(반등) vs 반도체(약세)** 신호가 정면으로 충돌한다.

**하락 ②  AI 인프라**
네비우스가 **−9.97%(\$223.67)**로 이날 최대 낙폭을 기록했다. 델 −6.65%. 전날 코어위브 −12.10%에 이어 **AI 인프라 매도가 이틀째 이어졌다.** 금리가 내렸는데도 빠진 것이 특징이다.

**하락 ③  소재·철강**
스틸다이내믹스 −7.52%. 경기민감 소재가 약했다.

**[판정]** **혼조 출발, 반도체가 방향을 정한다.** 신호가 정면으로 엇갈린다.
**상방 근거**: ①야간선물 **+2.37%**(1,040.35), ②미 3대 지수 사흘 만에 반등, ③금리 급락(10년물 −6.4bp)과 국채 발작 진정, ④달러 약세로 원/달러 1,411.93원, ⑤**SK하이닉스 40조원 자사주 매입·소각**이라는 강력한 개별 재료(SKHY 시간외 +1.31%), ⑥괴리율 +47.0%가 국내 저평가를 시사.
**하방 근거**: ①**SOX −2.12%로 이틀 연속 하락**, ②스토리지·장비 −6~8% 급락, ③외국인이 전날 −119.9만 주 순매도로 전환, ④SK하이닉스(000660)는 이미 8/18 대비 −9.75%로 급락한 상태.
**판정: 자사주 매입 발표에 힘입은 반등 시도를 우선 보되, 상승폭은 야간선물(+2.37%)에 못 미칠 가능성**을 함께 본다. **40조원 소각은 발행주식의 상당 부분을 없애는 실질적 주주환원**이므로 SK하이닉스(000660) 개별로는 지수 대비 강세를 기대할 만하다. 다만 **어제 판정이 틀린 이유가 외국인 수급이었던 만큼, 개장 후 외국인 방향 전환 여부를 우선 확인**해야 한다. (무효화: 외국인 순매도 지속, 또는 오늘 밤 SOX 3일 연속 하락 시)

## 🔍 섹션 2. 이슈 종목 10선

**1. SK하이닉스 ADR (SKHY) +0.35% — \$156.16, 40조원 자사주 매입·전량 소각 발표**
이사회가 **40조원(약 290억 달러) 규모의 자사주를 매입해 전량 소각**하기로 결의했다. 최대 **2,400만 주**가 대상이고 **특별배당**도 검토 중이다. WSJ는 **한국 증시 사상 최대 규모**라고 전했다.
주가 반응은 극적이었다. 프리마켓에서 **+6%(\$164.73)**까지 뛰었고 장중 고가는 **\$163.80**이었으나, 반도체 전반의 매도세에 밀려 종가는 **+0.35%(\$156.16)**로 축소됐다. 저가는 \$155.62로 전일 종가와 동일했다. 다만 **시간외에서 +1.31%(\$158.21)**로 다시 올라 재료의 힘은 살아 있다.
서울에서는 정반대였다. 국내 SK하이닉스(000660)가 **−9.75%(1,500,000원)**로 폭락 마감했다. 외국인이 **−119만 9,222주 순매도로 전환**(5거래일 연속 매수 종료)했고 기관도 −31만 1,406주를 팔았다. 개인만 +146만 3,866주를 받았다. 시가총액은 1,214조 → **1,095조원**으로 하루에 119조원이 증발했다.
그 결과 **괴리율이 +32.4% → +47.0%로 14.6%p 급확대**됐다. 마켓워치는 회사가 **"현재 주가가 내재가치를 반영하지 못한다"**고 밝혔다고 전했는데, 자사주 소각 발표 당일 −9.75% 폭락은 그 주장을 역설적으로 뒷받침한다.

**2. 모더나 (MRNA) +177.87% — \$174.95, 암 백신 3상 성공**
암 백신 임상 3상 성공 소식에 하루 만에 **주가가 2.8배**가 됐다. 거래량 **1억 8,276만 주**로 이날 시장 전체 최다였다.
mRNA 플랫폼을 암 치료로 확장하는 데 성공했다는 의미로, 코로나 백신 이후 성장 동력을 잃었던 회사의 서사를 완전히 바꿔놓는 사건이다.
머크가 +12.62%로 동반 급등한 것은 양사의 개인맞춤형 암 백신 협업 관계 때문으로 읽힌다. **이 두 종목의 상승이 반도체 −2.12%에도 S&P·다우가 플러스로 마감하게 만든 직접적 원인**이다.

**3. 머크 (MRK) +12.62% — \$152.23, 모더나 동반 수혜**
거래량 2,936만 주와 함께 12% 넘게 급등했다. 대형 제약주가 하루에 12% 오르는 것은 이례적이다.
모더나와의 암 백신 공동 개발 파트너십이 재평가된 결과로 보인다. 시가총액이 큰 종목이라 **다우와 S&P 헬스케어 섹터를 실질적으로 밀어올렸다.**
AI·반도체에서 빠져나온 자금의 일부가 헬스케어로 이동한 정황도 함께 읽힌다.

**4. 마벨 (MRVL) +9.85% — \$237.27, 반도체 중 홀로 급반등**
전날 −7.81%로 급락했던 종목이 **+9.85%로 되돌렸다.** 거래량 **4,097만 주**로 평소의 2배였다.
SOX가 −2.12% 내린 날에 반도체 종목이 10% 가까이 오른 것은 **업종 내 선별이 극심하다**는 뜻이다. 커스텀 실리콘·데이터센터 연결 사업이 메모리 사이클과 분리돼 평가받기 시작한 것으로 보인다.
반면 램리서치 −6.29%, 키사이트 −6.29%로 장비주는 계속 밀렸다. **같은 반도체 안에서 방향이 정반대로 갈리는 국면**이다.

**5. 마이크로스트래티지 (MSTR) +12.68% — \$104.25, 금리 급락 수혜**
\$104.25로 +12.68% 급등하며 거래량 4,527만 주를 기록했다. 8/18 −4.16% → 8/19 +12.68%로 이틀 만에 방향이 완전히 뒤집혔다.
금리 급락과 달러 약세가 비트코인 관련 자산 전반에 우호적으로 작용했다. 금·은이 각각 +3.62%·+4.84% 오른 것과 같은 맥락이다.
**'통화 완화 기대 → 대체자산 강세'** 라는 단순한 논리가 하루 만에 복원됐다.

**6. 네비우스 (NBIS) −9.97% — \$223.67, AI 인프라 매도 이틀째**
\$223.67로 −9.97% 급락해 이날 최대 낙폭을 기록했다. 거래량 4,578만 주.
8/14 +8.88%, 8/12 +34.14%로 급등했던 종목이 이틀 만에 −9.97%까지 밀렸다. 전날 코어위브 −12.10%에 이어 **네오클라우드 전반이 연속 매도**되고 있다.
주목할 점은 **금리가 내린 날에도 빠졌다**는 것이다. 단순한 금리 민감도를 넘어 **AI 인프라의 부채 구조 자체에 대한 의구심**이 자리 잡고 있음을 시사한다.

**7. 시게이트 (STX) −7.87% · 웨스턴디지털 (WDC) −6.87%**
시게이트가 \$832.56으로 −7.87%, 웨스턴디지털이 \$462.09로 −6.87% 밀렸다. 8/17 종가(각 \$973.44·\$536.01) 대비로는 **이틀 만에 −14.5%·−13.8%**다.
8/11~8/17 스토리지 랠리를 주도했던 종목들이 가장 빠르게, 가장 깊게 되돌리고 있다. 8/17 하루에만 각각 +5.65%·+5.35% 올랐던 것을 감안하면 **상승분의 두 배 이상을 반납**한 셈이다.
샌디스크는 −3.49%로 상대적으로 선방했다. **낙폭의 크기가 직전 상승폭에 비례**하는 전형적 되돌림 국면이다.

**8. 램리서치 (LRCX) −6.29% — \$307.28, 장비주 약세 지속**
반도체 장비 대표주가 6% 넘게 밀렸다. 거래량 962만 주. 키사이트(KEYS)도 −6.29%로 같은 폭 하락했다.
메모리 가격 조정이 **증설 발주 지연 우려**로 직결되면서 장비주가 계속 매도되고 있다. 8/14 어플라이드머티리얼즈 −5.12%에서 시작된 흐름이다.
국내 반도체 소부장에 지속적인 부담 요인으로, **완제품보다 장비의 조정이 깊다**는 점을 주시할 필요가 있다.

**9. 델 (DELL) −6.65% — \$437.49, AI 서버 기대 되돌림**
\$437.49로 −6.65% 밀렸다. 8/13 +9.89%로 급등했던 것을 감안하면 **고점 대비 −9.7%**다. 거래량 634만 주.
슈퍼마이크로 가이던스 상향으로 촉발됐던 AI 서버 재평가가 일주일 만에 되돌려지는 중이다.
HPE·슈퍼마이크로 등 동종 업체도 함께 약했다. **AI 하드웨어 밸류체인 전반이 8월 중순 랠리 이전 수준으로 회귀**하는 흐름이다.

**10. 테슬라 (TSLA) +4.23% · 애플 (AAPL) +2.19%**
테슬라가 \$351.12로 +4.23%, 애플이 \$316.82로 +2.19% 올랐다. 애플은 **이틀 연속 상승**으로 8/18 +1.45%에 이어 강세를 이어갔다.
금리 급락이 대형 성장주의 할인율을 낮춘 결과이며, 특히 애플은 **AI 자본지출 부담이 상대적으로 작다**는 점이 계속 부각되고 있다.
반면 엔비디아는 **−1.01%(\$217.53)**로 사흘 연속 약세였다. **'AI에 돈을 덜 쓰는 기업'과 'AI 반도체를 파는 기업'의 방향이 계속 갈리는** 구도가 이어지고 있다.

## 💬 섹션 3. 구루·기관 코멘트

- **로이터 — "재무부가 유동성 지원에 나서자 국채 금리가 하락했다."** 워싱턴이 국채 시장을 backstop 하겠다는 신호를 보내며 **다년 최고치에서 물러난 글로벌 국채 금리**를 짚었다. 다만 이데일리는 **"급한 불은 껐지만 고금리 위험은 여전하다"**고 평가했다.
- **연준 금리선물(9/16 FOMC) — 인상 30.6% vs 동결 69.4%.** 전 거래일 35.3%에서 **4.7%p 내렸다.** 금리 급락과 함께 **동결 기대가 다시 강화**되는 흐름이다.
- **마켓워치 — "SK하이닉스가 자사주 매입에 나서며 주가가 너무 싸다고 시사했다."** 회사가 현재 주가는 사업의 **"내재가치(intrinsic value)"**를 반영하지 못한다고 밝혔다고 전했다.
- **배런스 — "SK하이닉스의 290억 달러 자사주 매입이 AI 지출 우려에 갖는 의미."** 자사주 매입·소각이 **AI 지출 붐이 시들해질 것이라는 공포를 완화할 수 있다**고 분석했다. 회사가 자기 주식을 사들일 만큼 현금흐름에 자신 있다는 신호로 읽힌다는 것이다.
- **키어런 칼더(UBP) — "중국이 한국의 메모리 지배력에 도전할 것이다."** 최근 변동성에도 한국 메모리주에 대해 여전히 강세 시각을 유지하지만, **중국의 반도체 역량 확대가 삼성·SK하이닉스에 갈수록 큰 경쟁 압력**이 될 것이라고 지적했다.
- **SKHY 컨센서스 — 애널리스트 14인 Strong Buy, 목표주가 \$245.21 유지.** 상승 여력 **+57.0%**. 8월 급락에도 목표가는 조정되지 않았다.

## 📅 섹션 4. 일정 및 관전 포인트

- **🇰🇷 오늘 국내 개장 — 40조원 자사주 소각 vs 반도체 매도:** SK하이닉스(000660)에는 **한국 사상 최대 자사주 소각**이라는 강력한 개별 재료가 있다. 2,400만 주 소각은 발행주식의 상당 부분을 없애는 것으로 **EPS·주당가치에 직접 반영**된다. 다만 SOX가 이틀째 −2.12% 밀린 상황이라 업종 전체의 상방은 제한적일 수 있다.
- **🇰🇷 외국인 수급 — 최우선 확인 항목:** 8/19 −119.9만 주 순매도로 5거래일 연속 매수가 끊겼다. **어제 판정이 틀린 직접적 원인**이 이 전환이었으므로, 오늘 개장 후 방향이 되돌아오는지가 가장 중요하다.
- **📊 FOMC 7월 의사록 — 공개 완료:** 시장은 9월 동결을 **69.4%**로 반영하며 소화했다. 금리는 오히려 내렸으므로 **매파적 서프라이즈는 없었다**고 볼 수 있다.
- **🛢 유가 — 3거래일 연속 상승, WTI \$85.83:** 브렌트·WTI 모두 **7월 24일 이후 최고 수준**이다. 미·이란 종전 협상 난항이 이어지고 있어 상방 압력이 유지된다. **\$90 접근 시** 물가 우려가 재점화될 수 있다.
- **⚠️ 국채 시장 — 진화됐지만 해소는 아니다:** 재무부 바이백은 응급처치에 가깝다. **재정적자·국채 발행 물량이라는 구조적 부담**은 그대로여서, 금리 재상승 시 반도체·AI 인프라가 다시 흔들릴 수 있다.
- **🇰🇷 괴리율 +47.0%:** 하루 만에 14.6%p 재확대됐다. 다만 **어제 확인했듯 괴리율 축소·확대가 국내 주가의 방향을 보장하지는 않는다.** 참고 지표로만 볼 필요가 있다.
