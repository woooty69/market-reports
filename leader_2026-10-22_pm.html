# 미국→한국 선점 2026-10-22 (미국 2026-10-21 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 75개 · 연결 종목 889개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 15개:** 정유·LNG·가스(격차 +14.2%p), AI 소프트웨어·에이전트(격차 +14.2%p), 유통·이커머스(격차 +13.3%p), Finance: Consumer Services(격차 +13.2%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 바이오텍·기술수출, CDMO·바이오시밀러, 의류 OEM·패션, 게임 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 의료AI·디지털헬스(-21.1%p), 유전체·유전자치료(-8.2%p)
- **이제 막 힘 붙는 조기 테마:** 비만치료제(조기 65), 가상자산·스테이블코인(조기 65), 항공·여행·카지노·면세(조기 62) — 다음 주 선점 후보군.
