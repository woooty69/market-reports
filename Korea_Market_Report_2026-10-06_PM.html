# 📊 한국증시 데일리 리포트 (저녁판)
### 2026년 10월 6일(화) 18시 작성 · 기준일: 10월 6일(화) 정규장 (저녁판)

> 연휴(10/3～10/5) 뒤 첫 거래일인 10월 6일 정규장 마감과 장 마감 후 저녁까지 나온 뉴스·공시·증권사 리포트를 정리했습니다. 이번 작성분은 21시대에 마무리돼 코스피200 야간선물은 21:34 기준 값입니다. 이번 주는 10/8(목) 삼성전자 3분기 잠정실적·옵션만기, 10/9(금) 한글날 휴장이 이어지는 사흘짜리 주간입니다.

## 주요 지수·자산

|---|---|---|

*연휴 뒤 첫 거래일, 코스피는 7,044.67로 출발한 뒤 고점이 곧 시가가 되며 밀려 6,941.39(−0.89%)로 마감해 하루 만에 7,000선을 다시 내줬다. 미 10년물 금리가 5.31%로 24년 만의 최고 수준에 오른 부담 속에 외국인이 코스피에서 1조7,575억원을 순매도했고, 그 대부분이 삼성전자(273,000원, −1.09%)와 SK하이닉스(1,784,000원, −3.10%)에 집중됐다. 반면 코스닥은 외국인·기관 동반 순매수에 +2.98% 오른 919.92로 3개월여 만에 900선을 종가로 회복했다. 주성엔지니어링(+19.41%)·HLB(+16.56%)·에코프로비엠(+12.88%) 등 시총 상위주가 일제히 올랐고, 금융권 연쇄 해킹 여파로 라온시큐어·샌즈랩·아톤이 상한가, 안랩(+17.14%)·지니언스(+20.10%)가 신고가를 썼다. 업종은 전자제품(+7.84%)·소프트웨어(+7.54%)·전자장비(+6.80%)·전기제품(+6.45%)이 강했고 우주항공과국방(−2.88%)·반도체(−1.49%)·조선(−1.43%)은 약했다. 장 마감 후 포스코퓨처엠·에코프로비엠의 삼성SDI향 양극재 공급 소식과 한미반도체의 삼성전기 첫 수주가 나왔고, 야간선물은 1,109.15(+0.56%)로 정규장 선물보다 6.15포인트 높게 거래되고 있다.*

## 🗓 시장 요약

**① 코스피 7,000선 하루 만에 반납, 외국인 1.76조원 순매도**
코스피는 시가 7,044.67이 그대로 고점이 되며 장중 6,897.38까지 밀렸다가 6,941.39(−0.89%)로 마감했다. 외국인이 1조7,575억원을 팔았고 개인이 7,441억원을 받아냈으며 기관은 39억원 순매도로 중립이었다. 미국 10년물 금리 5.31%(24년래 최고)와 9월 비농업고용 2.9만명 쇼크가 겹치며 대형주 할인율 부담이 커졌다. 코스피200(−1.19%)이 코스피보다 더 빠져 대형주 약세가 뚜렷했다.

**② 반도체: 삼전닉스 동반 약세, 소부장은 급등**
삼성전자는 273,000원(−1.09%), SK하이닉스는 1,784,000원(−3.10%)으로 밀렸고 외국인은 두 종목에서만 약 1.6조원을 순매도한 것으로 집계됐다. 10/8 3분기 잠정실적 발표와 15조원 자사주 매입 종료를 앞두고 차익실현이 나온 모습이다. 반면 주성엔지니어링(+19.41%)·케이씨텍(+15.54%)·두산테스나(+12.72%)·원익IPS(+3.26%)·리노공업(+3.56%) 등 소부장은 강세를 이어가 '삼전닉스를 앞지른 소부장'이라는 평가가 나왔다. 증권가의 삼성전자 3분기 영업이익 전망은 105～106조원으로 컨센서스(106.9조원)와 비슷하다.

**③ 주도 업종: 기판·전자부품, 2차전지, 보안**
삼성전기(+6.51%)·LG이노텍(+14.11%)·이수페타시스(+9.08%)·대덕전자(+6.97%)·심텍(+4.01%) 등 반도체 기판·전자부품이 대만 기판 업체 신고가와 서버 CPU 수요 기대에 동반 급등했다. 2차전지는 테슬라 3분기 인도량(48.7만대) 호조와 북미 ESS 기대에 삼성SDI(+9.07%)·포스코퓨처엠(+11.82%)·에코프로비엠(+12.88%)·LG에너지솔루션(+4.72%)이 올랐다. 신한·KB국민·하나은행 등 금융권 연쇄 해킹(최소 6.5만명 정보 유출) 여파로 보안주가 폭등해 라온시큐어·샌즈랩·아톤 상한가, 안랩 +17.14%, 지니언스 +20.10%를 기록했다.

**④ 약세 업종: 방산·조선·대형 바이오**
우주항공과국방(−2.88%)은 중동 긴장 완화로 '전쟁 헤지' 수요가 빠지며 한화에어로스페이스(−3.36%)·LIG디펜스앤에어로스페이스(−6.56%)·현대로템(−3.35%)·한국항공우주(−2.70%)가 내렸다. 누리호 5차 발사(10/7)를 하루 앞뒀지만 재료 소멸 우려가 컸다. 조선(−1.43%)은 원화 강세에 따른 이익 전망 하향으로 HD한국조선해양(−2.15%)·한화오션(−1.52%)이 약했고, 삼성바이오로직스(−2.66%)는 노조의 삼성전자 직접 교섭 요구 등으로 밀렸다. NC는 아이온2 글로벌 출시 동접 40만명에도 −6.22%로 재료 소멸 매물이 나왔다.

**⑤ 환율·금리·외부 변수**
원/달러 고시 환율은 1,339.20원으로 3.30원 내려 원화 강세가 이어졌다. 미국 10년물 금리는 5.31%, 30년물은 5.66%까지 올랐지만 고용 쇼크로 FedWatch 10월 동결 확률이 70～80%대로 높아졌다. 사우디 아람코가 11월 아시아향 원유 공급가(OSP)를 배럴당 3달러 낮췄고 G7의 비축유 1억배럴 방출 합의로 WTI는 90달러 아래로 내려왔다. 국내 국고 3년물은 3.937%로 7.3bp 하락했다.

**⑥ 코스닥 3개월 만에 900선 탈환, 919.92(+2.98%)**
코스닥은 외국인(+1,073억원)·기관(+1,047억원) 동반 순매수에 919.92로 마감해 일주일 새 8% 가까이 올랐다. 주성엔지니어링 거래대금이 9,521억원으로 SK하이닉스·삼성전자·삼성전기에 이어 시장 4위였고, HLB(+16.56%)·삼천당제약(+19.08%)·에코프로비엠(+12.88%)·에코프로(+7.87%)가 지수를 끌어올렸다. HLB는 간암 신약 제조시설 FDA 실사 종결로 그룹주 전체가 급등했다. 10/8 국내 주식형 ETF 리밸런싱이 소부장·코스닥 수급의 다음 변곡점으로 꼽힌다.

## 1. 업종별 흐름

**상승 업종** — 전자제품(+7.84%)·소프트웨어(+7.54%)·전자장비와기기(+6.80%)·전기제품(+6.45%)·건강관리장비(+5.40%)·화학(+5.25%)·핸드셋(+5.01%)이 상위였다. 전자장비·전자제품은 삼성전기(+6.51%, 거래대금 1조2,472억원)·LG이노텍(+14.11%)·LG전자(+7.87%)·이수페타시스(+9.08%)·두산(+9.77%)이 이끌었고, 장 마감 후 한미반도체(+2.57%)의 삼성전기향 첫 패키징 장비 수주와 삼성전기의 MLCC 장기계약 소식이 더해졌다. 소프트웨어는 라온시큐어(+29.98%)·샌즈랩(+30.00%)·안랩(+17.14%)·지니언스(+20.10%) 등 보안주가 견인했다. 화학·전기제품은 포스코퓨처엠(+11.82%)·에코프로비엠(+12.88%)·삼성SDI(+9.07%)·LG에너지솔루션(+4.72%) 등 2차전지가 주도했다.

**하락 업종** — 문구류(−7.00%)를 빼면 우주항공과국방(−2.88%)·가정용품(−2.30%)·반도체와반도체장비(−1.49%)·게임엔터테인먼트(−1.46%)·조선(−1.43%)·생명보험(−1.26%)이 약했다. 반도체 업종 지수 하락은 SK하이닉스(−3.10%)·삼성전자(−1.09%) 두 종목 영향이 절대적이었고, 업종 내 상승 종목은 137개로 하락(32개)보다 훨씬 많았다. 방산은 한화에어로스페이스(1,036,000원, −3.36%)·LIG디펜스앤에어로스페이스(−6.56%)·한화시스템(−1.33%)이, 게임은 NC(−6.22%)가 끌어내렸다. 금융주는 해킹 비용과 고금리 부담에 신한지주(−0.95%)·한국금융지주(−1.55%)가 내렸다.

**시장의 시선** — 내일(10/7)은 누리호 5차 발사(위성 15기)와 바이오재팬 개막, 10/8(목)은 삼성전자 3분기 잠정실적·옵션만기·국내 주식형 ETF 리밸런싱이 겹친다. 반도체 대형주와 소부장의 시소 흐름이 잠정실적 이후 어느 쪽으로 기울지, 코스닥 900선 위 안착 여부가 관건이다. 보안주는 금감원의 해킹 IP 28개 특정과 경찰 수사 착수, 정부의 공공부문 사이버보안 강화 방침이 이어져 단기 과열과 정책 모멘텀이 교차한다. 야간선물이 +0.56%로 반등해 내일 코스피 출발은 정규장 낙폭을 일부 되돌릴 가능성이 있다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 68종목

*저녁판: 1～40번은 뉴스 후보 풀(최근 14시간 보도 건수) 순, 41～68번은 ★ 필수 편입(시총 1,000억원 이상 · +10% 이상 상승) 중 1～40번에 없는 종목이다. 등락률은 10/6 종가 기준.*

**1. SK하이닉스 (000660) 1,784,000원 · 1,303조 1,984억원 · −3.10% — 외국인 삼전닉스 1.6조원 매도, 단일종목 레버리지 ETF 손실 2.3조원 첫 공개**
SK하이닉스는 연휴 뒤 첫 거래일 외국인 매도가 집중되며 1,784,000원으로 3.10% 내렸고 거래대금은 4조8,873억원으로 시장 1위였다. 외국인은 삼성전자와 SK하이닉스에서만 약 1.6조원을 순매도한 것으로 집계됐다. 장 마감 후에는 삼전닉스 단일종목 레버리지 ETF 투자자들이 석 달 새 2.3조원 손실을 봤다는 증권사 10곳 집계가 처음 공개됐고, SK하이닉스가 미국 AI·차세대 메모리 조직을 대폭 확대한다는 보도와 손자회사 솔리다임 상장 논의도 나왔다. 증권가는 3분기 영업이익을 70조원 안팎으로 본다.

**2. 삼성전자 (005930) 273,000원 · 1,596조 341억원 · −1.09% — 10/8 잠정실적 대기, 증권가 3분기 영업이익 105～106조원 전망**

**3. 삼성전기 (009150) 1,684,000원 · 125조 7,842억원 · +6.51% — MLCC 또 장기계약, 한미반도체 패키징 장비 첫 공급**

**5. SK스퀘어 (402340) 1,164,000원 · 153조 5,595억원 · +0.34% — 솔리다임 상장 논의, 게임업계 M&A 관심**

**6. 삼성SDI (006400) 577,000원 · 46조 4,979억원 · +9.07% — 포스코퓨처엠 6조원 LFP 양극재 장기공급, 에코프로비엠과도 맞손**

**7. LG전자 (066570) 233,000원 · 37조 9,521억원 · +7.87% — 엔비디아 수혜 기대, 누리호에 LG 계열사 부품 5종 탑재**

LG이노텍은 655,000원(+14.11%)으로 급등했고 거래대금은 2,871억원이었다. 대만 패키지기판 업체들의 신고가와 서버 CPU용 FC-BGA 숏티지 기대가 국내 기판주로 번지며 삼성전기와 함께 올랐고, 설립 10주년 베트남 법인을 광학·반도체 기판 전진기지로 키운다는 보도와 누리호 카메라 탑재 소식도 나왔다. 키움증권은 오늘 3분기 영업이익을 917억원(−55%)으로 컨센서스(1,432억원)를 36% 밑돌 것으로 보면서도 환율 탓의 일시 부진이라며 BUY·목표주가 1,100,000원을 제시했다. [리포트: Kiwoom 2026-10-06](https://woooty69.github.io/hw-pdf-arch-023/LG%EC%9D%B4%EB%85%B8%ED%85%8D%EF%BC%BB011070%EF%BC%BD_20261006_Kiwoom_196432.pdf) · [리포트: DAOL 2026-09-30](https://woooty69.github.io/hw-pdf-arch-021/LG%EC%9D%B4%EB%85%B8%ED%85%8D%EF%BC%BB011070%EF%BC%BD_20260930_DAOL_1134434.pdf) · [리포트: Daishin 2026-09-29](https://woooty69.github.io/hw-pdf-arch-023/LG%EC%9D%B4%EB%85%B8%ED%85%8D%EF%BC%BB011070%EF%BC%BD_20260929_Daishin_1134003.pdf)

**9. HLB (028300) 47,150원 · 6조 2,803억원 · +16.56% — 간암 신약 제조시설 FDA 실사 종결, '4수' 도전**
HLB는 47,150원(+16.56%)으로 마감했고 거래대금은 2,685억원이었다. 간암 신약 리보세라닙의 중국 제조시설에 대한 FDA 실사가 별도 지적 없이 종결됐다는 소식에 품목허가 재신청 기대가 커지며 HLB제약(+29.97%)·HLB생명과학(+25.03%)·HLB글로벌(+16.88%)·HLB테라퓨틱스(+15.79%) 등 그룹주가 동반 급등했다. 장 마감 후에는 'HLB, 간암 신약 4수 도전'이라는 분석 기사가 이어졌다. 코스닥 900선 탈환의 주역 중 하나로 꼽혔다. 증권사 커버 리포트 없음(최근 1년).

**10. 원익IPS (240810) 142,700원 · 7조 43억원 · +3.26% — 소부장 강세 지속, 거래대금 1,737억원**
원익IPS는 142,700원(+3.26%)으로 마감했고 시가총액은 7조원을 넘었다. 금리 부담에 외국인이 삼전닉스를 1.6조원 순매도하는 동안 소부장으로는 매수세가 이어지며 반도체 전공정 장비주가 강세를 지켰다. 코스닥 일주일 새 8% 급등을 이끈 업종으로 반도체 소부장이 꼽혔고, 10/8 19조원 규모 반도체 ETF 리밸런싱이 소부장 수급의 변곡점이 될 것이라는 분석도 나왔다. 삼성전자 평택 P5·SK하이닉스 M15X 등 증설 투자가 실적 기대를 받친다.

한화에어로스페이스는 1,036,000원(−3.36%)으로 밀렸고 거래대금은 1,424억원이었다. 10/7 누리호 5차 발사를 앞두고 한화가 체계종합을 맡아 위성 15기를 쏘아 올린다는 기사가 쏟아졌지만, 중동 긴장 완화로 '전쟁 헤지' 성격의 방산 매물이 나오며 업종 전체가 약했다. KAI 인수 논란과 채용 문제로 한화가 국감 검증대에 오른다는 보도도 부담이었다. 미래에셋증권 리포트는 조회수 5,839회로 관심이 높았다.

**13. 현대차 (005380) 348,500원 · 70조 9,081억원 · +0.58% — 제네시스 첫 하이브리드 GV80 출시, 미국 판매 +10%**
현대차는 348,500원(+0.58%)으로 강보합 마감했다. 장 마감 후 제네시스가 첫 하이브리드 모델인 'GV80 2.5 가솔린 터보 하이브리드'를 출시했고, 하나증권은 9월 현대차·기아 미국 판매가 각각 +10%·+18%로 시장(+4%)을 웃돌아 합산 점유율이 12.3%로 0.9%p 올랐다고 분석했다. 하이브리드 판매는 +47%로 고성장했다. 다만 미국 업계가 할인을 늘리는 사이 현대차·기아는 인센티브를 줄였다는 단독 보도도 나왔다.

KB금융은 167,400원으로 보합 마감했고 거래대금은 1,382억원이었다. KB국민은행 고객 119명 정보 유출 등 은행권 연쇄 해킹으로 '수조원 이익잔치에 보안 투자는 1%도 안 쓴다'는 비판 기사가 이어졌고, 금융권 보안 인력의 3분의 1이 외주라는 지적도 나왔다. 하나증권은 3분기 은행지주 순이익이 7.4조원(+1.5% QoQ)으로 선방하나 외화환산익 등 비경상 요인 덕분이라며 KB금융을 Top Pick(목표주가 235,000원)으로 유지했다.

에코프로는 95,900원(+7.87%)으로 마감했고 시가총액은 13조원대로 코스닥 3위를 지켰다. 코스닥이 3% 가까이 오른 날 2차전지가 소부장·바이오와 함께 지수를 이끌었고, 자회사 에코프로비엠(+12.88%)이 삼성SDI와의 협력 소식으로 급등하며 지주사도 따라 올랐다. 에코프로는 내년 사업계획 수립을 서두르며 인사 시계를 앞당겼다는 보도도 나왔다. 거래대금은 1,314억원이었다.

**16. 리노공업 (058470) 87,300원 · 6조 6,533억원 · +3.56% — DS "반등의 서막", 목표주가 100,000원 상향**

    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
