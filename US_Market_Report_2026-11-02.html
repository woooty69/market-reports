## 🗓 주말 요약

**① 이란은 '이틀 안 호르무즈 재개'안을 내놨고, 트럼프는 "서두르지 않는다"고 했다**
아바스 아락치 이란 외무장관은 토요일 호르무즈 해협을 **이틀 안에** 완전히 다시 여는 수정안을 제시했다. 첫날 미국이 먼저 조치하고 둘째 날 선박 통항이 재개되는 순서로, 앞서 내놨던 '1주일 재개'안은 미국이 거절했다. 이란 협상단은 금요일 테헤란에서 카타르 중재단과 12시간 넘게 협의한 데 이어 주말 도하에서 협상을 이어 갔다. 트럼프 대통령은 협상이 "잘 되고 있고" 이란이 합의를 원한다면서도 미국은 "서두르지 않는다"고 했고, 남은 이란 핵시설을 "10분이면" 제거할 수 있다고도 말했다. 루비오 국무장관은 추가 공습 여부는 "아직 결정되지 않았다", "협상은 한 번도 멈춘 적이 없다"고 했다. 시장에서는 공습 재개가 거론되더라도 중간선거(3일, 현지) 이전 가능성은 낮다는 해석이 우세하다.

**② 하메네이는 "지리적 제한 없는 대응"을, 레자에이는 '핵무기 금지 해제' 논의를 꺼냈다**
최고지도자 모즈타바 하메네이는 토요일 성명에서 "어떤 수준·형태의 위협이든 즉각적이고 강력하며 지리적으로 제한 없는 대응으로 맞서야 한다"고 밝혔다. 모흐센 레자에이는 전투가 재개되면 이란이 핵무기 보유 금지를 풀지 논의하고 있다고 했지만 결정된 것은 없다고 덧붙였다. 호르무즈 동쪽에서는 유조선 1척이 기뢰에 부딪혀 불이 났고, 미 중부사령부는 봉쇄 작전으로 지금까지 상선 **144척**의 항로를 돌렸다고 밝혔다. 주사우디 미국대사관은 후티 반군 공격과 공항 운항 차질 가능성을 경고했다. 협상 신호와 군사 긴장이 같은 주말에 나와, 브렌트 1월물 \$113.43·WTI 12월물 \$104.12의 위험 프리미엄은 월요일에도 그대로 남아 있다.

**③ 바이낸스는 일요일 단계적 출금 재개에 들어갔고, FBI는 북한 '트레이더트레이터'를 지목했다**
바이낸스는 약 **\$63억** 해킹 피해의 약 90%를 메웠다며 1일 싱가포르 시각 오후 2~5시를 1단계로 출금을 단계적으로 다시 열겠다고 밝혔다. 미 연방수사국은 이번 공격을 북한 연계 해킹 조직 트레이더트레이터 소행으로 판단했다. 비트코인은 일요일 **\$77,700** 안팎으로 공격 직전인 목요일 고점보다 약 5% 낮은 수준이다. 1단계 출금이 문제없이 끝났는지는 아직 회사 공식 확인이 나오지 않았다.

**④ 국내는 10월 수출 +93.7%와 저PBR 명단 공개가 겹친 채 '인텔 쇼크'를 소화한다**
산업통상부가 발표한 10월 수출은 **1,152억8,000만달러로 전년 대비 +93.7%**, 반도체 수출은 **+259%**였다. 한국거래소는 1일 주가순자산비율(PBR)이 낮은 기업 **151곳**(코스피 96곳·코스닥 55곳) 명단을 공표했고, 2일부터 매매 화면에 표시된다. 코스피는 10/30 하루 −3.5%로 5,700선에서 한 주를 마쳤고, 그 뒤 금요일 미국장에서 SOX가 −7.20%, SK하이닉스 ADR이 −7.95% 빠졌다. 수출 숫자는 메모리 업황이 여전히 강하다는 근거지만, 주가는 인텔이 던진 '메모리 가격발 PC 수요 둔화' 논리를 먼저 반영할 가능성이 크다.

## 🎯 이번 주 관전 포인트

**1. 반도체 — 인텔이 바꾼 질문에 AMD·애플·퀄컴이 답한다**
인텔은 4분기 매출 가이던스 \$150억~\$160억, 조정 총마진 38.0%를 내며 메모리 가격 부담에 따른 PC 둔화가 내년 상반기까지 간다고 밝혔고, 금요일 SOX는 하루 829.40포인트 빠진 10,688.80으로 마감했다. 이번 주에는 AMD(3일, 현지)가 PC·데이터센터 CPU 수요를, 애플(2일)과 퀄컴(4일)이 스마트폰 쪽 메모리 원가 부담을 보여 준다. 세 회사가 '수요는 견딘다'고 말하면 금요일 낙폭은 과매도로 바뀔 수 있지만, 원가 부담에 따른 가격 인상·물량 축소를 언급하면 인텔발 논리가 업종 전체로 굳어진다.

**2. 중간선거 — 역사적으로는 선거 뒤 강세, 이번에는 AI 인프라 정책이 변수**
하원 435석 전부와 상원 약 3분의 1이 걸린 선거가 3일(현지) 치러진다. 유안타증권 이재원은 "1990년 이후 9차례 중간선거에서 S&P500지수는 선거 후 15일간 평균 1.8% 올랐고, 9번 중 7번 상승했다"고 짚었다. 반면 LS증권 황산해는 "선거 이후 각 주정부의 스탠스가 재확인될 때까지 인프라 규제에 대한 불확실성이 불가피하다"고 했다. 데이터센터 인허가와 전력 정책 기대가 걸린 전력 설비·유틸리티주가 결과에 가장 민감하다.

**3. 금리 — 6일 고용이 12월 인상 '폭'을 정한다**
연준은 10월 회의에서 3.75~4.00%로 동결했지만 반대 2표가 모두 인상 주장이었고, 9월 PCE 물가 3.6%(근원 3.1%)와 3분기 GDP 3.4%로 12월 인상은 사실상 기본값이다. 그럼에도 금요일 위험회피로 10년물은 4.94%, 2년물은 4.56%로 내렸다. 2일 ISM 제조업, 4일 ISM 서비스업의 가격지수와 6일 고용·임금이 강하면 2년물이 다시 4.6%대로 오를 수 있고, 약하면 금리 하락이 기술주 낙폭을 줄이는 쪽으로 작용한다.

**4. 유가·지정학 — '이틀 재개안'과 '선거 후 공습' 사이**
이란의 이틀 재개안이 받아들여지면 브렌트 1월물 \$113.43에 붙은 위험 프리미엄이 빠르게 줄 수 있다. 반대로 협상이 틀어지면 선거 다음 날인 4일(현지) 이후가 위험 구간이다. 대신증권 이경민도 "트럼프 대통령은 중간선거 후 이란에 대한 공격을 재개할 가능성이 존재한다"고 봤다. 유가가 다시 오르면 물가와 장기금리를 밀어 올려 반도체 급락 이후의 반등 여지까지 좁힌다.

### 🇰🇷 한국 관전 포인트

국내 증시는 2일(월) 금요일 미국장의 **SOX −7.20%·SK하이닉스 ADR −7.95%(\$149.21)·마이크론 −5.30%**를 한꺼번에 반영한다. 코스피200 야간선물은 직전 10/30(금) 세션이 10/31 리포트에 06:00 확정치 **873.10(−2.93%, 정규장 종가 899.45 대비)**으로 기재돼 있어, 미국 반도체 급락의 상당 부분은 이미 야간선물 가격에 들어간 채 출발한다.

반대편에는 실적과 수급 받침이 있다. 10월 반도체 수출이 +259% 늘었고, 신한투자증권 강진혁은 SK하이닉스(000660)의 20조원 자사주 매입이 "시장의 수급 완충 장치 역할을 할 것"이라고 봤다. BNK투자증권 김성노는 코스피 12개월 선행 PER이 4.6배까지 내려온 것은 반도체의 저PER 국면 때문이라고 설명했다. 다만 10/30 외국인 현물은 −1조6,149억원 순매도였고 같은 날 외국인 코스피200 선물은 +6,002계약 순매수여서, 현물과 선물 방향이 엇갈린 상태로 한 주를 시작한다.

저PBR 명단 공개를 계기로 금융·지주사의 배당 확대·자사주 매입 공시가 늘어날지가 반도체 밖의 관전 포인트다. 이번 주 미국 실적·선거·고용 결과는 대부분 한국 시각 새벽에 나오므로, 국내는 매일 아침 전날 밤 결과를 반영하는 흐름이 이어진다.

## 💬 증권가 코멘트

- **NH투자증권 나정환 — 11월 첫째 주 코스피 밴드 5,700~6,500.** "반등 국면에서는 단순 주가 상승보다 거래대금 확대를 동반하며 상승하는 종목에 주목해야 한다." 저PBR 명단 공개 전후로 "배당 확대·자사주 매입 및 기업가치 제고계획 공시 등 주주환원 강화 움직임이 확대될 전망"이라고 봤다.
- **유안타증권 이재원 — "현 가격대에서 투매에 동참할 실익은 제한적."** 6,000선 이하에서 분할 매수를 제시했고, 중간선거 이후 15일간 S&P500이 평균 1.8% 올랐다는 과거 통계를 근거로 들었다.
- **LS증권 정다운 — "현재의 가격대는 여전히 매력적인 매수 구간."** 같은 회사 황산해는 선거 후 주정부 스탠스가 확인될 때까지 인프라 규제 불확실성이 남는다고 경계했다.
- **삼성증권 — 서두르지 말 것.** 김종민은 "현재의 공포국면에서 성급하게 투자의사결정을 내리기보다는" 확인 후 대응을 권했고, 조아인은 빅테크 본업 성장에 대한 실망과 AI 투자 지속성 우려가 맞물린 조정으로 진단했다.
- **신한투자증권 노동길 — "서두르지 않아도 된다."** 같은 회사 강진혁은 SK하이닉스 20조원 자사주 매입을 수급 완충 장치로 꼽았다.
- **다올투자증권 조병현 — "궁극적으로 미래 이익의 지속성에 대한 확신 제고가 필요하다."** 하나증권 이재만은 삼성전자·SK하이닉스가 2026년 연말~2027년 1분기 반등을 주도할 것으로 봤다.
- **업종 관심** — 반도체 대형주 유지에 더해 ESS, 반도체 소재·부품·장비, 방산, 전력기기, 실적 개선이 기대되는 건설, 주주환원 확대가 기대되는 금융·지주사가 이번 주 증권가 추천 업종으로 거론됐다.

## 📰 주말 체크한 기타 뉴스

- **이란 '1주일 재개안'은 미국이 거절, 수정안은 '첫날 미국 조치·둘째 날 통항'.** 이란은 미국 당국자와 직접 만날 계획은 당장 없다고 밝혔고, 협상은 카타르 중재 방식으로 이어진다.
- **독일 가스 저장률 61.35% — 겨울 목표치 80%에 크게 못 미쳐.** 호르무즈 봉쇄 장기화가 유럽 에너지 수급에 부담을 주고 있어, 유가뿐 아니라 천연가스 가격도 협상 결과에 민감하다.
- **바이낸스 해킹, FBI가 북한 연계 조직 소행으로 판단.** 상위 10개 토큰은 전액 보전됐고 나머지는 회사 자금과 보험기금으로 사들이고 있다. 금요일 코인베이스(COIN)는 \$143.54(−10.62%)였다.
- **국내 10월 반도체 수출 +259%.** 메모리 가격 강세가 수출 금액을 끌어올린 결과로, 인텔이 지적한 '가격 강세의 수요 훼손' 논리와 정면으로 맞서는 숫자다.
