- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 7개:** 탱커·가스선(격차 +31.2%p), 인터넷 플랫폼·광고(격차 +24.1%p), AI 소프트웨어·에이전트(격차 +17.5%p), 스마트폰·애플 부품(격차 +13.0%p) — 이번 리포트의 핵심 선점 영역.
