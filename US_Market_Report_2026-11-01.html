## 🗓 주말 요약

**① 한 주의 결론은 '사흘 오르고 이틀에 다 내줬다' — 나스닥 주간 −2.00%, 3주 연속 하락**
나스닥은 월요일 +0.83%, 화요일 +1.18%, 수요일 +0.27%로 사흘 연속 올라 26,549.85까지 갔지만 목요일 −1.38%, 금요일 **−2.86%**로 고점 대비 **−4.19%** 밀린 **25,437.00**에 한 주를 마쳤다. 주간으로 나스닥 **−2.00%**, S&P500 **−0.57%**, 다우 **−0.85%**로 내린 반면 러셀2000은 **+1.29%(2,811.84)**로 올라 대형 기술주에서 중소형주·헬스케어·금융으로 옮겨 가는 순환매가 보였다. 나스닥은 2025년 3월 이후 가장 나쁜 한 달로 10월을 마쳤고, VIX는 금요일 장중 23.93까지 치솟았다가 **19.42(+12.91%)**로 마감했다.

**② 반도체지수는 수요일까지 +8.39%, 금요일 하루 −7.20% — 인텔 가이던스가 메모리 논리를 뒤집었다**
SOX는 앤트로픽 상장 신고서와 브로드컴의 \$630억 금융 구조, SK하이닉스 실적에 힘입어 10,779.46에서 수요일 **11,684.00**까지 올랐다. 그러나 인텔이 4분기 매출 가이던스 **\$150억~\$160억**, 조정 총마진 **38.0%**를 내고 메모리 가격 부담에 따른 PC 둔화가 내년 상반기까지 이어진다고 밝히자 금요일 **10,688.80(−7.20%)**로 무너져 주간 **−0.84%**가 됐다. 인텔은 **\$65.76(−28.58%)**, 샌디스크 −13.47%, AMD −10.88%, 마이크론 −5.30%였다.

**③ 빅테크 실적이 남긴 숫자는 '설비투자는 늘고 현금은 빠져나간다'**
알파벳은 분기 설비투자 **\$514억**과 두 분기 연속 마이너스 잉여현금흐름에 목요일 **−12.64%**로 상장 이후 최악 수준의 하루를 보냈다. 아마존은 AWS 성장률이 **39%**로 약 5년 만에 가장 빨랐지만 분기 설비투자 약 **\$770억**에 최근 12개월 잉여현금흐름이 **−\$424억**으로 사상 최대 유출을 기록해 금요일 장중 −5.92%까지 밀렸다가 **\$240.35(−1.41%)**로 마감했다. 투자자들은 이제 매출 성장보다 설비투자가 마진·현금으로 돌아오는 속도를 따지고 있다.

**④ 연준은 3.75~4.00% 동결, 그러나 12월 인상 확률은 85% 안팎 — 금리는 위험회피에 오히려 하락**
28일(현지) FOMC는 10대 2(해맥 총재·쿡 이사 인상 주장)로 동결했고, 3분기 GDP 속보치 **3.4%**와 9월 PCE 물가 **3.6%**(근원 **3.1%**)는 연말 인상 전망을 그대로 유지시켰다. 금요일에도 무살렘 세인트루이스 연은 총재가 연준이 "곧" 움직여야 한다고, 바킨 리치먼드 연은 총재가 "문제는 얼마나 올리느냐"라고 말했다. 그럼에도 주식 급락에 따른 안전자산 수요로 10년물은 **5.00% → 4.94%(주간 −0.06%p)**, 2년물은 **4.69% → 4.56%(주간 −0.13%p)**로 내렸다.

**⑤ SK하이닉스 ADR은 주간 +8.90% — 수요일 +13.30% 뒤 금요일 −7.95%**
SKHY는 \$137.02에서 출발해 월 \$142.62, 화 \$145.36, 분기 매출 100조원을 처음 넘긴 3분기 실적이 나온 수요일 **\$164.70(+13.30%)**까지 올랐다. 목요일 \$162.09(−1.58%)에 이어 금요일 인텔발 메모리 가격 부담 논리에 **\$149.21(−7.95%)**로 밀렸지만 주간으로는 **+8.90%**를 지켰다. 같은 주 마이크론은 수요일 \$983.23까지 올랐다가 금요일 \$884.74로 마쳤다.

**⑥ 주말에는 이란 공습 재개 시점 논쟁과 바이낸스 복구 소식이 나왔고, 이번 주는 중간선거·애플·AMD·고용지표가 한꺼번에 몰린다**
루비오 국무장관은 31일(현지) 트럼프 대통령이 이란에 대한 군사 행동을 아직 결정하지 않았고 외교에 열려 있다고 말했지만, 미 행정부가 걸프 동맹국들에 이르면 **11월 4일** 공습 가능성을 설명했다는 보도도 나왔다. 바이낸스는 도난당한 약 **\$63억** 가운데 90%를 메웠고 일요일 출금 재개를 목표로 한다고 밝혔다. 이번 주에는 팔란티어·애플(2일, 현지), AMD(3일), 중간선거(3일), 10월 고용보고서(6일)가 이어진다.

## 📰 섹션 1. 한 주간(10/26~10/30) 주요 뉴스 5선

**1. 인텔 −28.58%·SOX −7.20% — 4분기 가이던스 \$150억~\$160억, "PC 둔화 내년 상반기까지"**
인텔은 3분기 매출 \$165억과 조정 주당순이익 \$0.52로 예상을 웃돌았지만, 4분기 매출 가이던스 \$150억~\$160억과 조정 주당순이익 \$0.25가 시장 예상(\$171억·\$0.43)에 크게 못 미쳤고 조정 총마진도 44.1%에서 38.0%로 떨어진다고 밝혔다. 립부 탄 CEO가 고객사들이 메모리 가격과 공급 문제로 PC 둔화 신호를 보낸다고 설명하면서, 메모리 가격 강세가 최종 수요를 깎는다는 논리가 부각됐다. 금요일 인텔은 \$65.76, 샌디스크는 \$1,150.89(−13.47%), AMD는 \$504.80(−10.88%)로 밀렸고 SOX는 하루 829.40포인트 빠졌다.
**투자자 함의:** 메모리 업황의 질문이 '가격이 얼마나 오르나'에서 **'오른 가격을 PC·스마트폰 수요가 견디나'**로 바뀌었다. 3일(현지) AMD 실적에서 PC용 CPU 수요 코멘트가 이 논리를 키울지 누그러뜨릴지 첫 시험대다.

**2. 알파벳 −12.64%·아마존 잉여현금흐름 −\$424억 — 'AI 투자 회수' 우려 재점화**
알파벳은 클라우드 매출이 두 배 넘게 늘었지만 분기 설비투자 \$514억과 두 분기 연속 마이너스 잉여현금흐름에 목요일 \$283.82(−12.64%)로 급락했다. 아마존은 3분기 매출 \$2,019억(+12%)과 AWS 성장률 39%를 냈지만 주당순이익 \$1.89가 예상(\$1.96)에 못 미쳤고, 분기 설비투자가 1년 전 \$350억에서 약 \$770억으로 늘며 최근 12개월 잉여현금흐름이 −\$424억이 됐다. 메타도 \$950억 신주 발행 부담에 화요일 \$620.19(−1.64%)로 내리는 등 빅테크 전반이 '현금흐름 시험'을 받았다.
**투자자 함의:** 빅테크의 설비투자 상향은 반도체·전력 설비 수요에는 우호적이지만, 주가는 이제 **투자 주체의 현금 체력**을 함께 본다. 내년 설비투자 가이던스가 더 커질수록 공급망 수혜와 빅테크 밸류에이션 부담이 동시에 커지는 구조다.

**3. 연준 3.75~4.00% 동결(10대 2) — 12월 9일 인상 확률 약 85%, GDP 3.4%·PCE 3.6%**
연준은 28일(현지) 기준금리를 동결했고 해맥 클리블랜드 연은 총재와 쿡 이사가 인상을 주장하며 반대했다. 성명은 경제가 강한 속도로 확장하고 물가가 여전히 높다고 평가해 '매파적 동결'로 받아들여졌고, 워시 의장은 2027년부터 연 8회 회의 가운데 1회를 금리 결정 없는 장기 전략 회의로 돌린다고 밝혔다. 3분기 GDP 속보치는 연율 3.4%로 예상(약 3.1%)을 웃돌았고 9월 PCE 물가는 3.6%, 근원 PCE는 3.1%로 전월(3.4%·3.0%)보다 높아졌다.
**투자자 함의:** 12월 인상은 사실상 기본값이 됐고, 6일(현지) 고용보고서가 **인상 폭과 이후 경로**를 가를 변수다. 그럼에도 10년물이 주간 −0.06%p 내린 것은 주식 위험회피가 물가 부담을 이긴 결과로, 고용이 둔화하면 금리 하락 폭이 더 커질 수 있다.

**4. SK하이닉스 3분기 매출 100조원 첫 돌파 — ADR 하루 +13.30%, 주간 +8.90%**
SK하이닉스의 3분기 실적에서 분기 매출이 처음으로 100조원을 넘었고, 수요일 ADR은 \$164.70(+13.30%)으로 급등했다. 같은 날 마이크론도 \$983.23(+5.86%)로 \$1,000선에 다가섰고 SOX는 11,684.00으로 사흘 연속 올랐다. 다만 금요일 인텔발 충격에 ADR은 \$149.21(−7.95%), 마이크론은 \$884.74(−5.30%)로 밀려 상승분의 상당 부분을 반납했다.
**투자자 함의:** 실적 자체는 메모리 사이클 정점 논쟁에 '아직 아니다'라는 답을 줬지만, 주가는 **수요 쪽 경고(인텔)**에 더 민감하게 반응했다. 국내 SK하이닉스(000660)는 10/30 코스피 −3.5% 하락 이후 금요일 미국장 충격까지 2일(월) 함께 소화해야 한다.

**5. 앤트로픽 S-1 공개·브로드컴 \$630억 금융 구조 — 주 초반 AI 공급망 랠리의 동력**
앤트로픽은 26일(현지) 나스닥 상장을 위한 증권신고서에서 상반기 매출 \$163억(2025년 연간 \$46억)과 상반기 AI 인프라 지출 \$90억을 공개했다. 이튿날 브로드컴은 금융사들이 앤트로픽의 AI 칩 구매 자금을 대는 \$630억 규모 구조를 발표해 \$342.33(+4.00%)로 올랐고, 'AI 투자 자금이 어디서 나오느냐'는 우려가 한때 누그러졌다. 이 흐름에 SOX는 월 +2.82%, 화 +3.60%로 이틀간 6% 넘게 올랐다.
**투자자 함의:** AI 수요의 크기는 숫자로 확인됐지만, 그 자금이 **부채·외부 금융**에 기대는 비중이 커지고 있다는 점도 함께 드러났다. 금리가 다시 오르거나 신용 여건이 빡빡해지면 이 구조가 가장 먼저 시험받는다.

## 🌙 섹션 2. 휴장·주말 신규 뉴스 5선

**1. 루비오 "트럼프, 이란 군사 행동 아직 결정 안 해·외교에 열려 있다" — 그러나 "이르면 11월 4일 공습" 설명 보도 (10/31 현지)**
마코 루비오 국무장관은 토요일 트럼프 대통령이 이란에 대한 추가 군사 행동을 아직 결정하지 않았으며 미국은 외교적 해법에 열려 있다고 말했다. 같은 날 미국 방송 MS NOW는 지역 당국자 3명을 인용해 트럼프 행정부가 걸프 동맹국들에 이르면 11월 4일 미국의 공습이 있을 수 있다고 설명했다고 보도했고, 백악관은 논평을 거부했다. 앞서 트럼프 대통령은 10월 8일 중간선거(11월 3일) 전에는 공격하지 않겠다고 했고, 금요일에는 이란과의 전쟁이 "곧 끝날 것"이라고 말했다.
**관전 포인트:** '선거 전 공격 없음'이 지켜진다면 실제 위험 구간은 **선거 다음 날인 4일(현지)부터**다. 국내 기준으로는 5일(목) 이후 유가와 방산·정유주 변동성이 커질 수 있다.

**2. 모즈타바 하메네이 "지리적 제한 없는 즉각 대응" 지시 — 도하에서는 '이틀 내 호르무즈 재개' 제안 논의 (10/31 현지)**
이란 국영매체에 따르면 최고지도자 모즈타바 하메네이는 전쟁 발발 이후 처음으로 공개된 군 지휘부 회의에서 미국·이스라엘의 위협에 "지리적 제한 없이" 즉각 대응하라고 지시하고 표적 목록을 미국·이스라엘 자산으로 넓히라고 명령했다. 같은 날 아바스 아락치 외무장관은 도하에서 카타르 중재단과 만나 호르무즈 해협을 이틀 안에 다시 여는 제안을 논의했다며, 제재 완화와 동결 자산 해제 등 이란의 조건이 붙어 있다고 밝혔다. 이란은 또 '제한 구역'을 지나던 유조선 1척이 기뢰에 부딪혔다고 발표했고, 바레인 안보포럼에 모인 아랍 당국자들은 전투 재개를 막아야 한다고 촉구했다.
**관전 포인트:** 강경 발언과 해협 재개 제안이 같은 날 나왔다. 호르무즈 재개가 실제로 합의되면 브렌트 1월물 \$113.43에서 **위험 프리미엄이 빠르게 줄 수 있고**, 결렬되면 금요일 12월물 만기 수준(\$117.55) 재시험이 기본 시나리오다.

**3. 바이낸스 "\$63억 해킹 손실의 90% 메웠다, 일요일 출금 재개 목표" (10/31 현지)**
바이낸스는 목요일 발표한 약 \$63억 규모 해킹 피해 가운데 최대 90%를 메웠으며, 비트코인·이더리움·USDT·BNB·솔라나·USDC·XRP 등 상위 10개 토큰은 100% 보전됐다고 밝혔다. 남은 10%는 유동성이 낮은 상위 10개 밖 토큰으로, 이용자 자산 보호 기금(SAFU)과 선물 보험기금 일부, 회사 자금을 동원해 시장·장외에서 계속 사들이겠다고 했다. 다음 목표는 보안 점검을 전제로 한 일요일 출금 재개이며, 블록체인 분석업체 TRM랩스는 이번 공격의 특징이 과거 북한 연계 해킹과 비슷하다고 짚었다.
**관전 포인트:** 금요일 코인베이스(COIN)는 \$143.54(−10.62%), 비트코인은 \$76,845(−2.40%) 안팎으로 밀렸다. **출금 재개가 실제로 이뤄지는지**가 월요일 가상자산 관련주 반등 여부를 가른다.

**4. 이번 주 실적 — 팔란티어·애플(2일)·AMD·화이자(3일), 시총 \$1,500억 이상 8곳 (현지)**
팔란티어는 2일(현지) 장 마감 후 3분기 실적을 내고 오후 5시(동부) 웹캐스트를 연다. 애플도 같은 날 컨퍼런스콜 시간을 잡았고, AMD는 3일 장 마감 후 실적을 발표하며 화이자는 3일 개장 전 실적을 낸다. 시총 \$1,500억 이상 미국 기업 가운데 실적이 확정된 곳은 8곳이며 화요일에 그 절반인 4곳이 몰렸고, 애플(약 \$5조)의 시총이 나머지 7곳을 합친 것보다 크다. AMD 시총은 약 \$8,240억이다.
**관전 포인트:** 인텔 쇼크 직후라 AMD의 **PC·데이터센터 CPU 가이던스**와 애플의 **메모리 원가·아이폰 마진 코멘트**가 메모리 가격 논리의 다음 단서다. 팔란티어는 소프트웨어주 급락(서비스나우 −26.95%, 포티넷 −20.09%) 이후 AI 소프트웨어 수요를 보여 줄 첫 대형 실적이다.

**5. 짐 크레이머 "아직 나스닥 바닥을 부르지 말라" — 의회 권력 교체가 데이터센터 계획을 위협할 수 있다는 경고 (10/30 현지)**

## 🔭 섹션 3. 다음 개장일(11/2 월) 섹터별 전망

미국은 **11월 2일(월)** 정상 개장하며, 서머타임 해제로 한국 시각 **23:30**에 열린다. 한국이 먼저 열리므로 국내는 금요일 미국장의 반도체 급락과 주말 사이 이란·호르무즈 협상 소식을 **미국 가이드 없이 장중에 소화**한다.

**⬆️ 우호적 재료가 있는 섹터**

**에너지·정유** — 엑슨모빌은 정제 이익이 처음으로 상류 부문을 넘어선 실적에 금요일 +2.16%, 셰브론은 +1.75%였다. 브렌트 1월물 \$113.43, WTI 12월물 \$103.01로 유가가 \$100 위에 머물고, 이르면 4일(현지) 공습 가능성 보도가 위험 프리미엄을 받친다.

**바이오·헬스케어** — 리제네론은 3분기 매출 \$51억(+36%)과 조정 EPS \$20.07에 +13.33%, 일라이릴리는 연간 매출 전망을 \$910억~\$920억으로 올려 목요일 +6.57%였다. 기술주에서 빠진 자금이 옮겨 가는 대표 업종이다.

**중소형주** — 러셀2000은 대형 기술주 약세 속에도 주간 +1.29%로 올랐다. 금리 하락(10년물 4.94%)이 이어지면 순환매가 계속될 여지가 있다.

**⬇️ 부담이 큰 섹터**

**반도체·메모리** — SOX −7.20%, 인텔 −28.58%, 샌디스크 −13.47%, AMD −10.88%, 마벨 −10.05%, Arm −9.97%. 인텔이 지목한 '메모리 가격발 PC 둔화'가 3일(현지) AMD 실적 전까지 업종 심리를 누를 가능성이 크다.

**인터넷·소셜·게임** — 레딧 −29.29%(4분기 일간 방문자 감소 경고), 로블록스 −18.07%(4분기 부킹 10~15% 감소 전망), 핀터레스트 −2.79%. 이용자 지표가 꺾인 플랫폼에 대한 매도가 이어지고 있다.

**가상자산** — 코인베이스 −10.62%. 바이낸스가 손실의 90%를 메웠다고 밝혔지만 출금 재개 확인 전까지는 관망이 우세할 전망이다.

**⚠️ 방향이 갈리는 곳**

**빅테크** — 아마존은 장중 −5.92%에서 −1.41%로 낙폭을 크게 줄였고, 마이크로소프트(−1.55%)·메타(−1.53%)·애플(−1.23%)도 1%대 하락에 그쳤다. 2일(현지) 애플 실적과 내년 설비투자 눈높이가 방향을 정한다.

### 🇰🇷 한국 관전 포인트

국내 증시는 2일(월) 개장에서 금요일 미국장의 **SOX −7.20%·SK하이닉스 ADR −7.95%·마이크론 −5.30%**를 한꺼번에 반영한다. 코스피200 야간선물은 일요일이라 조회 스크립트가 새 세션 값을 주지 않았다. 직전 10/30(금) 야간 세션은 전일 리포트에 06:00 확정치 **873.10(−2.93%, 정규장 종가 899.45 대비)**으로 기재돼 있어, 미국 반도체 급락의 상당 부분은 야간선물에 이미 반영된 상태로 출발한다.

SK하이닉스(000660)는 분기 매출 100조원 첫 돌파라는 실적 근거가 있지만, 인텔이 메모리 가격 상승을 PC 수요 둔화의 원인으로 꼽은 만큼 '가격 강세 = 수요 훼손' 논리가 단기 주가를 누를 수 있다. 10/30 코스피는 이미 −3.5%, 외국인 현물은 −1조6,149억원 순매도였고 같은 날 외국인 코스피200 선물은 +6,002계약 순매수여서, 현물 매도와 선물 매수가 엇갈린 상태다.

금리와 유가는 엇갈린 신호다. 10년물 4.94%로의 하락은 성장주 밸류에이션 부담을 덜어 주지만, 유가 \$100대와 이르면 4일(현지) 공습 가능성은 항공·화학에 부담, 정유·방산에는 우호적이다. 미국 정규장이 1시간 늦춰지면서 국내 개장 전에 확인할 수 있는 미국장 정보 시점도 06:00 이후로 밀린다.
