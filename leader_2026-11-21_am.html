# 미국→한국 선점 2026-11-20 (미국 2026-11-20 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 76개 · 연결 종목 891개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 7개:** Advertising(격차 +16.2%p), 조선·LNG선·함정 MRO(격차 +13.0%p), 방산(격차 +12.3%p), 스마트폰·애플 부품(격차 +10.4%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** Real Estate Investment Trusts, 물·환경, 보험, Hospital/Nursing Management — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 항공·여행·카지노·면세(-25.4%p), 사이버보안(-24.2%p), 중국 소비·관광 회복(-13.3%p)
- **이제 막 힘 붙는 조기 테마:** 해운(조기 73), 유통·이커머스(조기 70), 중국 소비·관광 회복(조기 68) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** LG유플러스(통신·5G, 점수 100), 삼양식품(음식료·K푸드, 점수 77), 녹십자(바이오텍·기술수출, 점수 76)
