## 🗓 시장 요약

**① 다우 49,097.06(−2.19%)·S&P500 7,175.83(−2.02%)·나스닥 23,879.20(−2.25%) — 앤트로픽 상장일 '장중 반전', 고점 대비 4% 넘게 밀려**
다우는 **49,097.06(−1,101.11, −2.19%)**, S&P500은 **7,175.83(−147.80, −2.02%)**, 나스닥은 **23,879.20(−550.69, −2.25%)**로 마감했다. 장 초반 나스닥100 선물이 2% 가까이 오르며 나스닥은 장중 24,939.62까지 올랐지만, 앤트로픽 거래가 시작된 뒤 반도체·AI 대형주가 상승분을 모두 내주면서 저가 23,870.70 부근에서 장을 마쳤다. 고가 대비 낙폭은 4%를 넘었다. S&P500은 6거래일 연속 하락했고, 다우는 하루에 1,100포인트 넘게 빠지며 49,000선 초반으로 내려왔다. 러셀2000은 **2,655.11(−59.20, −2.18%)**, VIX는 **29.13(+4.57, +18.61%)**로 뛰었다.

**② 앤트로픽, 공모가 \$83·조달액 \$813억으로 사상 최대 IPO — 시가 \$111.50에서 종가 \$97.17로 밀려**
앤트로픽은 공모가 \$83에 클래스A 보통주 9억8,000만 주를 팔아 \$813억을 조달했고, 6월 스페이스X의 \$750억을 넘어 역대 최대 IPO가 됐다. 첫 거래는 \$111.50(공모가 대비 +34%)에서 약 1억800만 주, 약 \$120억 규모로 체결됐고 시가총액은 \$1조5,000억을 넘었다. 장 초반 \$115.10까지 올랐다가 30분 만에 \$97 부근까지 13% 밀렸고, 종가는 **\$97.17(+17.07%)**였다. 개인 투자자 배정은 공모 물량의 15%였으며, 반다 리서치는 첫 30분 개인 순매수가 \$1,860만으로 올해 상장 종목 중 스페이스X 다음이었다고 집계했다. 개인이 앤트로픽을 사려고 AMD 등 기존 AI 종목을 판 흐름이 지수 하락을 키웠다는 분석이 나왔다.

**③ 미국채 — 2년물 4.76%(−4bp)·10년물 5.04%(−3bp)·30년물 5.40%(−1bp)**
미 재무부 고시 기준 2년물은 **4.76%(−4.0bp)**, 10년물은 **5.04%(−3.0bp)**, 30년물은 **5.40%(−1.0bp)**로 마감했다. 주식 급락에 안전자산 수요가 붙으며 단기물 중심으로 금리가 내렸고, 10년물은 장중 5.107%에서 5.04%까지 밀려 이틀 연속 하락했다. 이날 나온 11월 필라델피아 연은 제조업지수와 주간 신규 실업수당 청구는 시장 방향을 바꾸지 못했다.

**④ WTI \$83.91(+0.78%)·브렌트 \$92.56(+0.66%) — 금 −2.1%·비트코인 \$61,000대**
WTI 12월물은 **\$83.91(+\$0.65, +0.78%)**, 브렌트 1월물은 **\$92.56(+\$0.61, +0.66%)**로 마감했다. 전날 WTI가 3%대 급락해 8월 말 이후 최저 수준까지 내려간 데 따른 반발 매수가 들어왔고, WTI는 장중 \$82.60~84.88 사이에서 움직였다. 금 선물은 \$3,664.70(−2.06%)로 이틀째 밀렸고, 비트코인은 \$61,827(−0.69%)로 사흘째 내렸다.

**⑤ AI·반도체 — 엔비디아 −3.30%·AMD −7.72%, SOX 9,419.72(−2.42%)**
엔비디아(NVDA)는 장 초반 \$158.13(+4.75%)까지 올랐지만 **\$145.98(−3.30%)**로 마감하며 6거래일 연속 내렸다. AMD는 행동주의 성격의 공매도 리서치 업체 헌터브룩 캐피털이 공매도 포지션을 공개하고, AMD 칩이 중개상을 거쳐 미국 블랙리스트에 오른 중국 서버업체로 흘러갔을 가능성을 제기하면서 **\$489.19(−7.72%)**로 급락했다. 브로드컴(AVGO) \$346.65(−2.09%), 마이크론(MU) \$690.44(−2.10%)도 장중 상승분을 모두 반납했고, 인텔(INTC) \$55.72(+1.92%)·퀄컴(QCOM) \$162.01(+1.38%)만 오름세를 지켰다. SOX는 장중 10,109.88까지 올랐다가 **9,419.72(−233.07, −2.42%)**로 마감해 고가 대비 6.8% 밀렸다.

**⑥ 🇰🇷 SK하이닉스 ADR \$119.20(−2.67%)·코스피200 야간선물 766.85(−3.66%, 11/19 세션 06:00 확정)— 장중 +7%에서 하락 반전**

SK하이닉스 ADR은 장중 \$131.56(+7.42%)까지 올랐다가 **\$119.20(−\$3.27, −2.67%)**로 마감했다. 앤트로픽 상장 직후 개인 자금이 기존 AI 반도체에서 빠져나가며 마이크론 −2.10%·엔비디아 −3.30%와 함께 밀렸다. 코스피200 야간선물은 06:00 확정 종가 766.85로 주간 종가 796.00 대비 −3.66% 내렸고, 장중 고가 803.75에서 저가 762.10까지 41포인트 넘게 출렁였다. 다음 국내 개장은 11월 20일(금)이다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 앤트로픽 (ANT) +17.07% — 공모가 \$83·조달액 \$813억, 역대 최대 IPO로 나스닥 데뷔**
앤트로픽은 상장 첫날 \$97.17(+\$14.17, +17.07%)로 마감했다. 공모가는 당초 희망 범위 \$70~78을 넘은 \$83으로 정해졌고, 9억8,000만 주를 팔아 \$813억을 조달해 6월 스페이스X(\$750억) 기록을 넘었다. 시가는 \$111.50(+34%), 장중 고가는 \$115.10이었으나 30분 만에 \$97 부근으로 13% 밀리며 시가총액 약 \$2,000억이 사라졌다. 회사는 9월까지 9개월 매출이 \$330억을 넘었고, 같은 기간 영업손실은 \$13억으로 1년 전 \$52억에서 크게 줄었다고 공개했다. 옵션 거래는 다음 주 월요일부터 시작된다.

**2. 엔비디아 (NVDA) −3.30% — 장 초반 +4.75%에서 반전, 3분기 매출 \$1,158억 호실적에도 6일 연속 하락**
엔비디아는 \$145.98(−\$4.98, −3.30%)로 마감해 6거래일 연속 내렸다. 3분기 매출 \$1,158억(+103%)과 4분기 가이던스 \$1,300억이 이틀째 반영되며 장 초반 \$158.13(+4.75%)까지 올랐지만, 앤트로픽 거래 시작 뒤 AI 대형주 매도에 휩쓸렸다. 반다 리서치는 개인 투자자가 앤트로픽 매수 자금을 마련하려고 엔비디아·AMD 등 기존 AI 종목을 판 것으로 분석했다. 임시 CEO 체제와 10-Q 제출 지연, 호퍼 칩 중국 출하 중단도 여전히 부담이다.

**3. AMD (AMD) −7.72% — 헌터브룩 캐피털 공매도 공개, 중국 블랙리스트 서버업체 우회 공급 의혹 제기**
AMD는 \$489.19(−\$40.95, −7.72%)로 마감했고 장중 저가는 \$470.56(−11.24%)까지 밀렸다. 헌터브룩 캐피털이 AMD 공매도 포지션을 공개하면서 AMD 반도체가 수출 규제에도 중개상을 통해 미국 정부 블랙리스트에 오른 중국 서버업체로 흘러갔을 수 있다는 의혹을 제기했다. 장 초반에는 \$555.01(+4.69%)까지 올랐던 만큼 고가 대비 낙폭은 12%에 가까웠다. 반다 리서치는 오후 기준 AMD가 7% 내리며 개인 투자자의 AI 종목 차익 실현을 이끌었다고 분석했다.

**4. 월마트 (WMT) −1.04% — 3분기 매출 \$1,888억(예상 \$1,872억)·조정 EPS \$0.65, 연간 전망 재상향**
월마트는 \$126.04(−\$1.32, −1.04%)로 마감했다. 3분기 매출은 \$1,888억으로 시장 예상치(\$1,872억)를 넘었고, 조정 주당순이익(EPS)은 \$0.65로 예상치(\$0.64)를 소폭 웃돌았다. 미국 동일점 매출은 2.9% 늘어 예상과 비슷했고, 전자상거래 매출은 17% 증가했다. 회사는 연간 실적 전망을 다시 올렸지만 주가는 장중 \$123.29(−3.20%)까지 밀렸다가 낙폭을 줄이는 데 그쳤다.

**5. 유나이티드헬스 (UNH) −5.55% — CMS 메디케어 어드밴티지 감사 강화안(10년 \$902억 환수 추정) 여파 사흘째**
유나이티드헬스는 \$330.48(−\$19.43, −5.55%)로 마감하며 사흘 연속 하락했다. CMS가 메디케어 어드밴티지 위험조정 감사에서 표본 오류를 전체 계약에 외삽해 환수하는 규정안을 내놓았고, 2027~2036년 약 \$902억을 환수할 수 있을 것으로 추산했다. 전날 −10.21%에 이어 이날도 장중 \$324.67(−7.21%)까지 밀리며 다우 하락폭의 상당 부분을 차지했다. 규정안은 의견 수렴을 거쳐 확정될 예정이다.

**6. 아마존 (AMZN) −3.87% — 앤트로픽 주요 주주, 상장 직후 'AI 지분 재료 소멸' 매도**
아마존은 \$257.37(−\$10.37, −3.87%)로 마감했다. 아마존은 앤트로픽 지분을 공개적으로 보유한 주주로, 앤트로픽이 상장 과정에서 발표한 9개월 매출 \$330억과 시가총액 \$1조5,000억은 지분 평가이익 확대 요인이다. 그러나 장 초반 \$274.00(+2.34%)까지 올랐던 주가는 앤트로픽이 시가 \$111.50에서 \$97대로 밀리자 방향을 바꿔 저가 \$256.75 부근에서 장을 마쳤다. 시장은 평가이익보다 상장 이벤트가 끝났다는 점에 더 무게를 뒀다.

**7. 알파벳 (GOOGL) −3.46% — 앤트로픽 지분 보유 빅테크, 장중 +4.60%에서 하락 반전**
알파벳은 \$272.66(−\$9.78, −3.46%)로 마감했다. 아마존과 함께 앤트로픽의 공개 주주인 알파벳은 앤트로픽이 발표한 공모가 \$83과 조달액 \$813억이 확인되며 장 초반 \$295.43(+4.60%)까지 올랐다. 하지만 앤트로픽이 첫 30분 만에 13% 밀려 시가총액 약 \$2,000억이 줄어들자 지분 보유 빅테크로 매도가 번졌다. 종가는 장중 저가 \$272.36과 거의 같은 수준이었고, 고가 대비 하락률은 7.7%에 달했다.

**8. 코어위브 (CRWV) −6.11% — 한 달 새 25% 하락, 3분기 이자비용 \$8억4,600만·4분기 \$10억5,000만~11억5,000만 전망 부담**
코어위브는 \$44.91(−\$2.92, −6.11%)로 마감하며 52주 저점(\$40.58)에 다가섰다. 장 초반 \$52.86(+10.52%)까지 올랐다가 앤트로픽 상장 뒤 차익 매물이 쏟아졌다. 회사의 3분기 매출은 \$36억6,000만(+168%)으로 예상을 넘었지만 순손실이 \$7억900만으로 1년 전 \$1억1,000만에서 크게 늘었고, 순이자비용은 \$8억4,600만, 4분기 이자비용 전망은 \$10억5,000만~11억5,000만이다. 부채 부담과 연간 설비투자 \$370억~390억 계획이 주가를 누르고 있다.

**9. 코히어런트 (COHR) +0.99% — 이사회 최대 \$20억 자사주 매입 승인**
코히어런트는 \$214.94(+\$2.10, +0.99%)로 마감했다. 이사회는 11월 18일 최대 \$20억 규모의 자사주 매입 프로그램을 승인했고, 장내 매입과 가속 자사주 매입(ASR) 방식이 모두 가능하며 만료 기한은 없다. 장중 \$240.66(+13.07%)까지 치솟았다가 반도체 전반의 매도에 상승폭 대부분을 반납했다. 사흘 전 미 상무부의 수출 규정 발표로 8.3% 급락했고, 주가는 6월 기록한 52주 고점 \$426.89보다 50%가량 낮다.

**10. 마이크론 (MU) −2.10% — '메모리 부족 2028년까지' 발언에도 장중 +7.76%에서 반락**
마이크론은 \$690.44(−\$14.83, −2.10%)로 이틀째 내렸다. 회사가 전날 메모리 공급 부족이 2028년까지 이어질 것이라고 밝힌 데 이어 엔비디아의 데이터센터 매출 \$1,076억(+110%)이 HBM 수요를 확인하며 장 초반 \$760.00(+7.76%)까지 올랐다. 그러나 앤트로픽 거래 시작 뒤 AI 반도체 전반에 매도가 몰리며 저가 \$689.28 부근에서 마감했다. SK하이닉스 ADR도 \$119.20(−2.67%)로 같은 흐름을 보였다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **반다 리서치 — 앤트로픽 첫 30분 개인 순매수 \$1,860만, 올해 상장 종목 중 스페이스X(\$2,560만) 다음.** 같은 시간 개인 거래대금은 \$2억5,500만이었고, 개인 매수 비중은 57.2%에서 52.5%로 낮아졌다. 개인이 앤트로픽 매수 자금을 위해 AMD 등 AI 종목을 판 것으로 분석했다. 앤트로픽 \$97.17(+17.07%).
- **헌터브룩 캐피털 — AMD 공매도 포지션 공개.** AMD 칩이 중개상을 거쳐 미국 블랙리스트 중국 서버업체로 들어갔을 가능성을 제기했다. AMD \$489.19(−7.72%).

**구루·시장 코멘트**
- **비라지 파텔(반다 리서치)** — 개인 투자자가 앤트로픽을 활발히 거래하고 있지만 한쪽으로 사들이기보다 사고팔기를 동시에 하고 있다.
- **다니엘라 아모데이(앤트로픽 사장)** — 이 기술에 필요한 것은 사람들의 신뢰나 사용이 아니라 목소리다.
- **IPO 데이터** — 앤트로픽의 첫 30분 −13%는 2008년 이후 미국 대형 IPO 21건 가운데 가장 나쁜 출발이었다. 6월 스페이스X는 같은 시점에 10% 가까이 오른 상태였다.
