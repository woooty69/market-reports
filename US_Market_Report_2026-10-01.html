## 🗓 시장 요약

**① 나스닥 +0.24%·S&P500 −0.25%·다우 −0.86% — PCE 3.4%(예상 3.7%) 호재에 장중 +0.7%까지 올랐다가 10년물 5.297%에 3대 지수 모두 장중 저가 마감, 자빌 −10.03%·노스럽그러먼 −4.19%·모더나 −5.35% vs 유나이티드 테라퓨틱스 +12.55%·폼팩터 +9.59%·HPE +3.90%**
9월과 3분기의 마지막 거래일인 수요일, 미국 지수는 물가 지표 호재로 올랐다가 금리에 밀려 장중 저가에서 끝났다. 나스닥은 **26,861.06(+63.52, +0.24%)**, S&P500은 **7,651.54(−19.30, −0.25%)**, 다우는 **50,906.05(−443.87, −0.86%)**, 나스닥100은 30,408.50(+0.23%), 러셀2000은 2,796.86(−0.39%)이었다. 8월 PCE 물가가 전년 대비 3.4%(예상 3.7%), 근원 PCE가 3.0%(예상 3.3%)로 나오자 10월 인상 확률이 전일 51%에서 39%로 내려가며 S&P500은 장중 7,722.88, 나스닥은 27,108.20까지 올랐다. 그러나 9월 ADP 민간 고용 +9만 명(예상 약 7만)·2분기 GDP 확정치 2.2%(종전 1.5%) 상향에 10년물이 5.297%·30년물이 5.65%로 2002년 이후 최고 수준을 다시 쓰자 오후 들어 상승분을 모두 반납했고, 다우는 고가 51,473.93에서 570포인트 가까이 밀렸다. 종목별로는 애플(AAPL) **\$333.02(+1.10%)**·아마존(AMZN) \$249.15(+1.01%)·알파벳(GOOGL) \$344.08(+0.93%)·마이크로소프트(MSFT) \$512.90(+0.77%)·엔비디아(NVDA) \$228.38(+0.51%)·인텔(INTC) \$120.23(+3.71%)이 나스닥을 받쳤고, 유나이티드 테라퓨틱스(UTHR) **\$541.89(+12.55%)**·폼팩터(FORM) \$149.31(+9.59%)·젠디지털(GEN) \$22.02(+5.61%)·시보(CBOE) \$275.29(+5.17%)·HPE(HPE) \$63.89(+3.90%)가 개별 재료로 올랐다. 반면 자빌(JBL)은 호실적에도 **\$286.86(−10.03%)**, 세레브라스(CBRS) \$177.65(−8.87%), 카맥스(KMX) \$55.11(−6.96%), 모더나(MRNA) \$192.57(−5.35%), 노스럽그러먼(NOC) \$483.48(−4.19%), 메타(META) \$725.18(−1.84%)로 내렸다. 노스라이트자산운용의 크리스 자카렐리 CIO는 "경제는 견조한 속도로 확장하고 있지만 인플레이션은 너무 뜨겁다"고 했다. 해석하면 '물가 둔화 = 주식 호재'라는 공식이 장기 금리 앞에서 반나절 만에 무너진 날이고, 9월 다우 −4.3%·나스닥 +1.9%라는 월간 성적표는 금리 민감 경기주와 AI 대형주의 격차를 그대로 보여 준다.

**② 10년물 5.297%(+4.2bp, 2002년 이후 24년 만의 최고 수준)·30년물 5.65%(+5bp) — 8월 PCE 3.4%(예상 3.7%)·근원 3.0%(예상 3.3%)에도 ADP +9만·GDP 2.2% 상향에 장기물 상승, 10월 인상 확률 51% → 39%, 30년 모기지 7.30%**
미국채 10년물 금리는 **5.297%(+4.2bp)**로 2002년 5월 고점 5.303%에 닿을 만큼 올라 24년 만의 최고 수준이었고, 30년물은 **5.65%(+5bp)**로 2002년 이후 최고를 다시 썼다. 8월 PCE 물가는 전월 대비 +0.3%·전년 대비 **3.4%(예상 3.7%)**, 근원 PCE는 전월 대비 +0.2%(예상 +0.3%)·전년 대비 **3.0%(예상 3.3%)**로 모두 예상을 밑돌았고, CME 페드워치의 10월 25bp 이상 인상 확률은 1주 전 71%·전일 51%에서 약 39%로 내려왔다. 그런데도 장기 금리가 오른 것은 같은 날 나온 성장 지표가 강했기 때문이다 — 9월 ADP 민간 고용은 +9만 명(예상 약 7만, 8월 3만6,000명으로 하향), 2분기 GDP 확정치는 연율 2.2%(종전 추정 1.5%)로 개인소비가 +3.8%였고, 8월 상품 무역적자는 \$1,326억(예상 \$1,148억)으로 커졌다. 30년 고정 모기지 금리는 7.30%(전주 7.12%)로 6주 연속 올라 2023년 11월 이후 최고였다. 금은 \$4,186.70(+0.17%), 은은 \$60.57(−0.96%), 달러인덱스는 101.37, 유로/달러는 1.1325, 엔/달러는 157.45였다. 해석하면 단기 쪽은 '10월 인상은 없다'로 기울었는데 장기 쪽은 성장·재정·공급을 이유로 계속 오르는 '베어 스티프닝'이고, 주식에는 인상 확률보다 10년물 5.3% 돌파 여부가 더 중요한 변수가 됐다 — 10/2(금) 밤 9월 고용보고서가 이 선을 시험한다.

**③ WTI \$90.42(+1.16%)·브렌트 \$103.53(+\$0.94) — 화요일 급락 뒤 기술적 반등, 주간 원유 재고 +90만 배럴(예상 −20만)로 4억2,730만 배럴, 미·이란 간접 협상 결과 대기**
WTI 11월물은 **\$90.42(+\$1.04, +1.16%)**, 브렌트는 **\$103.53(+\$0.94)**로 화요일 −3.48% 급락의 일부를 되돌렸다. 주간 원유 재고는 90만 배럴 늘어 4억2,730만 배럴로 예상(20만 배럴 감소)과 반대였지만, 미·이란 간접 협상에서 구체적 합의가 나오지 않으면서 \$90 안팎의 지정학 프리미엄이 유지됐다. 유가가 다시 \$90 위로 올라오자 전날 급등했던 크루즈·소비 서비스는 차익 매물이 나와 카니발(CCL)이 \$24.54(−2.27%), 카맥스(KMX)가 \$55.11(−6.96%)로 되밀렸다. 분기 기준으로는 상하이종합이 3,842.19(3분기 −6.16%), 닛케이225가 66,753.72(3분기 −4.72%)로 아시아 증시가 미국보다 약했다. 해석하면 유가는 월요일 \$96 → 화요일 \$89 → 수요일 \$90으로 \$88~95 박스 안에 머물고 있고, 협상 헤드라인이 나오기 전까지는 금리 쪽 재료가 주식 방향을 정하는 구도가 이어진다.

**④ AI·반도체 — 마이크론 장 마감 뒤 실적: 매출 \$542.3억(예상 \$510.7억)·조정 EPS \$33.42(예상 \$31.61), 다음 분기 가이던스 매출 \$615억(예상 \$570억)·EPS \$38.15, 그러나 총마진 가이던스 86.25%가 눈높이에 못 미쳐 시간외 보합 — 정규장 마이크론 +0.00%·SKHY −1.36%·샌디스크 +0.59%·SOX 보합**
정규장에서 마이크론(MU)은 실적을 앞두고 **\$1,065.11(+\$0.03, +0.00%)**로 보합이었고 SK하이닉스 ADR(SKHY)은 **\$184.15(−1.36%)**, 샌디스크(SNDK)는 \$1,739.89(+0.59%), 필라델피아 반도체지수는 12,628.62(−0.54p)로 제자리였다. 장 마감 뒤 마이크론은 회계연도 4분기 매출 **\$542.3억(예상 \$510.7억)**, 조정 EPS **\$33.42(예상 \$31.61)**, 조정 총마진 87.0%를 발표했고, 1분기 가이던스로 매출 \$615억±\$15억(예상 약 \$570억)·조정 EPS \$38.15±\$1.00(예상 약 \$35.1)·총마진 약 86.25%를 제시했다. 연간 매출은 \$1,331.9억(전년 \$373.8억), 4분기 데이터센터 SSD 매출은 약 \$100억으로 1년 새 10배가 됐고, 전략적 고객 계약(SCA)은 17건에서 26건으로 늘었으며 1분기 설비투자는 \$115억·회계연도 상반기 \$250억으로 제시됐다. 다만 총마진 가이던스 86.25%가 시장 눈높이(86.7%, 일부는 87.5~88%)에 못 미쳤고 회사가 "1분기가 2027 회계연도 총마진의 바닥"이라고 설명했는데도 시간외 주가는 +0.3% 안팎의 보합권에 그쳤다. 모건스탠리는 논쟁이 "얼마나 좋아질 수 있나"에서 "얼마나 오래 이렇게 좋을 수 있나"로 옮겨 갔다고 평가했고, JP모건은 비중확대·목표가 \$1,540을 유지했다. 그 밖에 HPE(HPE)는 벌처(Vultr)의 \$12억 규모 AMD 헬리오스 AI 랙 주문에 \$63.89(+3.90%), 폼팩터(FORM)는 도이체방크 매수 개시에 \$149.31(+9.59%), 세레브라스(CBRS)는 OpenAI의 GPT-6.1이 자사 시스템에서 구동되지 않는다는 보도에 \$177.65(−8.87%), 브로드컴(AVGO)은 \$351.19(−1.10%), AMD(AMD)는 \$611.76(+0.69%), 마벨(MRVL)은 \$264.21(+0.36%), 오라클(ORCL)은 \$137.30(−0.36%)이었고, 미 연방거래위원회(FTC)가 앤스로픽·OpenAI의 AI 안전 문제 조사에 착수했다는 소식도 나왔다. 해석하면 마이크론은 숫자로는 '비트 앤드 레이즈'였지만 주가가 움직이지 않았다는 점이 핵심으로, 메모리 업황은 확인됐고 남은 질문은 '정점이 언제인가'다.

**⑤ 회사 고유 재료 — 보잉 −0.87%(미 해군 F/A-XX \$200억 이상 수주에도 고가 +2.83%에서 반락)·노스럽그러먼 −4.19%(탈락), 자빌 −10.03%(매출 \$106.2억·EPS \$4.40 상회에도 급락), 모더나 −5.35%(씨티 매도 하향), 유나이티드 테라퓨틱스 +12.55%(\$20억 자사주 매입 마무리·FDA 접수), 페어아이작 −4.11%(BofA 중립 하향·목표가 \$1,400 → \$700), 테슬라 +0.56%(\$300억 신규 신용 한도)**

보잉은 시가 \$192.05·고가 \$192.99(+2.83%)로 출발했다가 저가 \$185.26까지 밀려 \$186.05(−\$1.63, −0.87%)로 마감했다. 미 해군은 F/A-18E/F 슈퍼호넷과 EA-18G 그라울러를 대체할 6세대 함재 전투기 F/A-XX의 본격 개발 사업자로 보잉을 선정했고, 계약은 지상·감항·시스템·무장 통합 시험용 시제기 여러 대를 포함해 \$200억 이상 규모다. 2025년 공군 F-47에 이어 2년 새 두 번째 6세대 전투기 수주로, 양산과 해외 주문까지 이어지면 사업 규모가 수천억 달러에 이를 수 있다는 관측이 나왔고 마이클 더피 국방부 획득 책임자는 "결정적이고 타협할 수 없는 투자"라고 했다. 다만 소식이 전날 시간외(+2.20%, \$191.81)에 먼저 반영된 데다 다우가 −0.86%로 밀리면서 장중 상승분을 모두 내줬다.

**3. 노스럽그러먼 (NOC) −4.19% — F/A-XX 경쟁에서 보잉에 밀려 탈락, \$200억 이상 개발 계약 상실, 저가 \$480.00(−4.88%)**
노스럽그러먼은 시가 \$483.00으로 갭 하락 출발해 저가 \$480.00(−4.88%)을 찍고 \$483.48(−\$21.13, −4.19%)로 마감했다. 미 해군 F/A-XX 사업은 록히드마틴이 2025년 3월 먼저 탈락한 뒤 보잉과 노스럽그러먼의 2파전이었는데, 최종 승자가 보잉으로 결정되면서 \$200억 이상 개발 계약과 2030년대 이후 양산 물량을 모두 놓쳤다. 해군은 F/A-XX를 270대 이상 계획된 F-35C와 함께 운용할 예정이어서 장기 프로그램 가치가 컸고, 이번 결과로 6세대 유인 전투기 두 사업(공군 F-47·해군 F/A-XX)이 모두 보잉에 돌아갔다. 시장은 B-21 폭격기 외에 노스럽그러먼의 차세대 유인기 성장 동력이 줄었다는 점을 반영했고, 전날 시간외 −2.65%에서 낙폭이 더 커졌다.

**4. 모더나 (MRNA) −5.35% — 씨티 매도로 하향(목표가 \$60 → \$80), 200% 넘는 랠리 뒤 밸류에이션 부담 지적, 저가 −9.28%**
모더나는 시가 \$186.55·저가 \$184.58(−9.28%)까지 급락한 뒤 낙폭을 줄여 \$192.57(−\$10.89, −5.35%)로 마감했다. 씨티그룹은 목표가를 \$60에서 \$80으로 올리면서도 투자의견을 매도로 내렸는데, 주가가 200% 넘게 오른 뒤 현재 가격이 파이프라인 가치를 지나치게 앞서 반영했다는 밸류에이션 논리였다. 새 목표가 \$80은 종가 \$192.57의 절반에도 못 미쳐 하향 폭보다 목표가와 주가의 괴리가 더 크게 부각됐다. 같은 날 바이오 업종 안에서는 유나이티드 테라퓨틱스(UTHR) +12.55%와 방향이 갈려 개별 재료 장세가 이어졌다.

**5. 자빌 (JBL) −10.03% — 4분기 매출 \$106.2억(+28.6%, 예상 \$97.1억)·EPS \$4.40(예상 \$4.07), 연간 가이던스 매출 \$445억·EPS \$17.55 제시에도 급락, 저가 −10.80%**
자빌은 시가 \$306.00에서 고가 \$328.00(+2.87%)까지 올랐다가 저가 \$284.39(−10.80%)로 밀려 \$286.86(−\$31.98, −10.03%)로 마감했다. 회계연도 4분기 매출은 \$106.2억으로 전년 대비 28.6% 늘어 예상 \$97.1억을 웃돌았고 EPS도 \$4.40으로 예상 \$4.07을 넘었으며, 새 회계연도 가이던스로 매출 \$445억·EPS \$17.55(예상 \$16.92)를 제시했다. 숫자는 모두 예상을 웃돌았지만 AI 서버·데이터센터 위탁생산 기대가 주가에 크게 선반영돼 있었던 만큼 발표 직후 차익 매물이 쏟아졌고, 같은 전자 제조 서비스(EMS) 업체 산미나(SANM)도 투자의견 하향과 함께 장중 5%대 약세였다. 분기 말 '호실적에 파는' 흐름의 대표 사례로, 장 마감 뒤 마이크론의 시간외 보합 반응과 같은 맥락에서 읽혔다.

**6. 휴렛팩커드 엔터프라이즈 (HPE) +3.90% — 벌처(Vultr)에서 \$12억 규모 AMD 헬리오스 AI 랙 주문 수주, 네트워킹 전망 상향, 장중 +9.12%**
HPE는 시가 \$65.76에서 고가 \$67.10(+9.12%)까지 급등한 뒤 상승폭을 줄여 \$63.89(+\$2.40, +3.90%)로 마감했다. 회사는 클라우드 업체 벌처로부터 AMD의 헬리오스 랙 기반 AI 시스템 \$12억 규모 주문을 받았다고 발표했고 네트워킹 사업 전망도 함께 올렸다. 엔비디아 중심이던 AI 랙 시장에서 AMD 헬리오스 기반 대형 주문이 서버 업체 실적으로 연결된 첫 사례 중 하나라는 점이 주목받아 AMD(AMD)도 \$611.76(+0.69%)로 올랐다. 다만 오후 들어 10년물이 5.297%까지 오르고 지수가 저가로 밀리면서 장중 상승폭의 절반 이상을 반납했다.

**7. 유나이티드 테라퓨틱스 (UTHR) +12.55% — 씨티은행과 가속 자사주 매입으로 \$20억 프로그램 마무리, FDA가 타이바소 네뷸라이저(특발성 폐섬유증)·랄리네팩 신청 접수, 장중 +15.76%**
유나이티드 테라퓨틱스는 시가 \$482.20에서 고가 \$557.37(+15.76%)까지 치솟은 뒤 \$541.89(+\$60.42, +12.55%)로 마감했다. 회사는 씨티은행과 가속 자사주 매입(ASR) 계약을 맺어 \$20억 자사주 매입 프로그램의 잔여분을 한 번에 집행하기로 했고, FDA는 특발성 폐섬유증 대상 흡입형 타이바소와 폐동맥 고혈압 치료제 랄리네팩의 신청 2건을 접수했다. 연 매출 \$31.8억·순이익 \$13.3억의 수익성에 비해 최근 낙폭이 과도했다는 평가가 겹치며 매수가 몰렸고, 업종이 −0.17%로 내린 날 두 자릿수 상승을 기록했다. 같은 날 모더나(MRNA) −5.35%·일라이릴리(LLY) −2.33%와 대비돼 헬스케어 안에서도 주주환원과 규제 일정이 있는 종목으로 자금이 쏠렸다.

**8. 폼팩터 (FORM) +9.59% — 도이체방크 매수로 커버리지 개시·목표가 \$200, TSMC에서 엔비디아 GPU용 프로브카드 2차 공급사 지위 부각, 고가 +10.57%**
폼팩터는 시가 \$142.29에서 고가 \$150.65(+10.57%)까지 오른 뒤 \$149.31(+\$13.06, +9.59%)로 마감했다. 도이체방크는 매수 의견과 목표가 \$200(종가 대비 약 +34%)으로 커버리지를 시작하며, 폼팩터가 TSMC에서 생산되는 엔비디아 GPU의 웨이퍼 테스트용 프로브카드 2차 공급사로 자리 잡고 있다는 점을 근거로 들었다. 필라델피아 반도체지수가 12,628.62(−0.54p)로 제자리였던 날 반도체 후공정·테스트 장비 가운데 가장 큰 폭으로 올랐고, 장 마감 뒤 마이크론이 1분기 설비투자 \$115억·상반기 \$250억을 제시한 것도 테스트 장비 수요에 우호적인 재료다.

**9. 페어아이작 (FICO) −4.11% — BofA 매수 → 중립 하향·목표가 \$1,400 → \$700, FHFA 밴티지스코어 동등 대우 결정 이틀째 여진, 이틀 누적 약 −30%**
페어아이작은 시가 \$602.02·고가 \$612.00에서 저가 \$586.05(−5.15%)까지 밀린 뒤 \$592.47(−\$25.40, −4.11%)로 마감해 화요일 −26.52% 폭락에 이어 이틀째 내렸다. BofA는 투자의견을 매수에서 중립으로 내리고 목표가를 \$1,400에서 \$700으로 절반으로 낮췄는데, 연방주택금융청(FHFA)이 패니메이·프레디맥 모기지에서 밴티지스코어 4.0을 FICO와 동등하게 취급하기로 하면서 모기지 점수 가격 결정력이 훼손됐다는 판단이다. 이틀 전 \$840.89였던 주가는 \$592.47로 약 30% 낮아졌고, 새 목표가 \$700조차 독점 프리미엄이 사라진 뒤의 실적 추정에 기대고 있어 추가 하향 가능성이 거론됐다. 30년 모기지 금리가 7.30%로 6주 연속 오른 점도 모기지 신청 건수에 연동되는 점수 매출에 부담이다.

**10. SK하이닉스 ADR (SKHY) −1.36% — 마이크론 실적 대기 속 하락, 장 마감 뒤 마이크론 매출 \$542.3억·가이던스 \$615억으로 메모리 업황 확인, 원주 +0.62%와 엇갈려 괴리율 약 +44% → 약 +40%**
SK하이닉스 ADR은 시가 \$186.18·고가 \$187.70(+0.55%)에서 저가 \$183.90까지 밀려 \$184.15(−\$2.53, −1.36%)로 마감했다. 정규장에서는 마이크론(MU)이 \$1,065.11(+0.00%)·샌디스크(SNDK)가 \$1,739.89(+0.59%)로 실적을 앞두고 관망세였고, 10년물 5.297%에 지수가 장중 저가로 밀리며 ADR도 함께 내렸다. 장 마감 뒤 마이크론은 4분기 매출 \$542.3억(예상 \$510.7억)과 1분기 가이던스 \$615억(예상 약 \$570억)을 내놓고 HBM 마진이 일반 D램 수준에 근접했다고 밝혀 메모리 가격·수요 강세를 확인했지만, 총마진 가이던스 86.25%가 기대에 못 미쳐 시간외 주가는 보합권이었다. 한국 정규장에서 원주는 1,776,000원(+0.62%)으로 올랐는데 ADR은 내려 괴리율은 환율 1,352.8원 기준 약 +40%로 좁혀졌고, 목요일 국내 반응은 '매출 가이던스 서프라이즈'와 '마진 정점 논쟁' 중 어느 쪽에 무게를 두느냐에 달렸다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **씨티 — 모더나(MRNA) 매도 하향, 목표가 \$60 → \$80.** 200% 넘는 랠리 뒤 밸류에이션 부담. 주가 \$192.57(−5.35%).
- **BofA — 페어아이작(FICO) 매수 → 중립 하향, 목표가 \$1,400 → \$700.** FHFA 결정으로 모기지 점수 가격 결정력 훼손. 주가 \$592.47(−4.11%).
- **도이체방크 — 폼팩터(FORM) 매수 개시, 목표가 \$200.** TSMC 엔비디아 GPU용 프로브카드 2차 공급사. 주가 \$149.31(+9.59%).
- **번스타인 — 광통신·AI 네트워킹 5종(셀레스티카·루멘텀·코히런트·시에나·아리스타) 시장수익률 상회로 개시.** 당일 주가는 루멘텀 −0.23%·코히런트 −1.51%·시에나 −0.87%.
- **JP모건 — 마이크론(MU) 비중확대·목표가 \$1,540 유지.** "비트 앤드 레이즈 지렛대가 여럿 남아 있다." 모건스탠리는 논쟁이 '얼마나 오래 지속되나'로 이동했다고 평가.
- **씨티 — 다우(DOW)·라이온델바젤(LYB) 매수 → 중립 하향.** 바클레이즈는 모빌아이(MBLY)를 비중유지로, 웰스파고는 앨라이(ALLY)를 비중유지로 하향.
- **제프리스 — 서밋테라퓨틱스(SMMT) 매수 상향.** 아스트라제네카 \$20억 투자·이보네시맙 생존 데이터. 주가 \$16.91(+3.17%).
- **BofA — 그로서리아울렛(GO) 매수 상향(목표가 \$15), 오펜하이머 — 나이스(NICE) 시장수익률 상회 상향(목표가 \$150).**

**구루·시장 코멘트**
- **크리스 자카렐리(노스라이트자산운용 CIO)** — "경제는 견조한 속도로 확장하고 있지만 인플레이션은 너무 뜨겁다." 엇갈린 지표는 연준의 9월 인상이 "아마 옳았다"는 뜻.
- **산제이 메로트라(마이크론 CEO)** — "AI는 초지능(SI)이 되고 있고 메모리는 이 지능과 고객 플랫폼의 경쟁력을 높인다." 1분기가 2027 회계연도 총마진의 바닥.
- **모건스탠리(마이크론 실적 평가)** — 논쟁이 "얼마나 좋아질 수 있나"에서 "얼마나 오래 이렇게 좋을 수 있나"로 옮겨 갔다.
- **마이클 더피(미 국방부 획득 책임자)** — F/A-XX는 장기 공중전 역량을 위한 "결정적이고 타협할 수 없는 투자."
