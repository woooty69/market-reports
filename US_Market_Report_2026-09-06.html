## 🗓 주말 요약

**① 한 주의 결론은 '지수는 제자리, 반도체와 석유만 움직였다'**
3대 지수는 한 주 동안 사실상 멈춰 섰다 — 나스닥 **+0.40%**, S&P 500 **+0.09%**, 다우 **−0.27%**. 그런데 같은 주에 **SOX는 +2.37%**, **WTI는 +9.69%** 움직였다. 지수 레벨만 보면 조용한 주였지만 **안에서는 자금이 크게 이동한 주**다. 상승 동력은 반도체와 에너지 두 곳에 집중됐고, 소프트웨어·소비재는 그 반대편에서 매도됐다. 지수가 횡보할 때는 지수를 보지 말고 업종 간 이동을 봐야 한다는 전형적인 국면이다.

**② 금리 경로가 주중에 세 번 뒤집혔다 — 결론은 '인상 쪽'**
주 초 워시 의장의 잭슨홀 여진으로 9월 인상 확률은 **64%대**에서 출발했고, 9/2 **ADP 민간고용 +3만 8,000명**(예상 4만 7,000~4만 8,000명 하회)으로 **60.1%**까지 내려갔다. 9/3 **크리스토퍼 월러 이사의 '9월 동결 지지' 발언**이 나오며 **50.4%**로 반토막 났고, 9/4 **8월 비농업 신규고용 16만 2,000명**(예상 5만 3,000명의 약 3배)이 발표되자 다시 **58.4%**로 되돌아왔다. 결과적으로 **2년물은 주간 +3.1bp(4.379%)로 2025년 1월 이후 최고**, **10년물은 +6.3bp(4.783%)**로 마감했다. 10-2년 스프레드는 37.2bp → **40.4bp**로 소폭 스티프닝됐다.

**③ 유가가 한 주 만에 10% 가까이 뛰었다 — 이란 전쟁 7개월째**
WTI는 **\$83.40 → \$91.48로 주간 +9.69%** 급등했다. 미군이 8/30 이란 남부 라라크섬 IRGC 로켓 발사대를 타격하며 소강 국면을 깬 뒤, 9/1~9/2 혁명수비대 목표물 타격과 이란의 역내 미군기지 보복이 이어졌다. 국내 기준유가인 **두바이유는 배럴당 100달러를 넘어섰고** 브렌트유도 **\$96.28**까지 올랐다. 호르무즈 해협 봉쇄가 장기화되는 국면에서 **에너지는 이번 주 유일하게 매크로가 아니라 지정학으로 움직인 자산군**이었다.

**④ 금요일 하루가 한 주 전체의 색깔을 바꿨다 — SOX +3.38%, 메모리 급등**
주 초까지 반도체는 부진했다. 9/1 SOX **−2.09%**, SKHY **−2.38%**로 밀렸고 9/2·9/3에도 각각 **+0.39%·+0.17%**의 미미한 반등에 그쳤다. 그런데 금요일 하루 **SOX가 +3.38%(+383.13p)** 급등하며 주간 수익률을 통째로 플러스로 돌려놨다. 특히 메모리 쏠림이 뚜렷했다 — 샌디스크 **+11.90%**, SK하이닉스 ADR **+8.14%**, 마이크론 **+6.10%**. 반면 엔비디아 **+0.84%**, 브로드컴 **+0.2%**로 AI 로직 대장주들은 제자리였다. **강한 고용을 할인율이 아니라 데이터센터 수요로 읽은 하루**였고, 그 수혜가 로직이 아닌 메모리로 갔다.

**⑤ 반대편에서는 소프트웨어와 소비재가 무너졌다**
금요일 가이드와이어소프트웨어 **−19.90%**, 유아이패스 **−16.60%**, 아사나 **−12.70%**, 어도비 **−6.70%**가 동반 급락했고, 룰루레몬은 실적 가이던스 대폭 하향으로 **−17.77%(\$100.13)**까지 밀렸다. 룰루레몬의 2분기 매출은 전년비 **−4%인 24억 2,000만 달러**로 컨센서스 24억 6,000만 달러를 밑돌았고, 연간 EPS 가이던스를 **\$10.95~11.15 → \$9.48~9.73**으로 내렸다. 마이크 딕슨 호라이즌인베스트먼츠 운용 총괄은 **"반도체와 소프트웨어 두 업종이 시소 국면에 갇혀 있다"**고 진단했다.

**⑥ 한국은 주간으로 밀렸지만 금요일 수급이 바뀌었다**
코스피는 주간 **−1.50%(6,687.21)**, 코스닥은 **−2.97%(813.50)**로 마감했다. 주중 외국인은 SK하이닉스를 **1조 909억원**, 삼성전자를 **5,181억원** 순매도했다. 그런데 9/4 하루에는 외국인 **+4,798억원**, 기관 **+1조 6,692억원** 동반 순매수로 전환했고, 코스피는 **+1.64%** 반등했다. 원/달러는 **1,350.4원**으로 주간 22.1원 내리며 14개월 최저를 경신했다. 코스피200 야간선물은 금요일 미국 반도체 랠리를 반영해 **1,093.90(+3.93%)**으로 마감했다.

## 📰 섹션 1. 한 주간(8/31~9/4) 주요 뉴스 5선

**1. 8월 비농업 신규고용 16만 2,000명 — 예상의 3배, 금리 경로를 되돌렸다**
미 노동부의 8월 고용보고서에서 신규고용이 **16만 2,000명**으로 다우존스 집계 예상치 **5만 3,000명**의 약 3배로 나왔다. **5개월 만의 최대 증가폭**이며 6·7월치도 모두 상향 조정됐다. 실업률은 **4.1%**로 유지, 평균 시간당 임금은 **+0.3%**로 예상에 부합했다. 발표 직후 9월 FOMC 0.25%p 인상 확률은 **49.4% → 58.4%**로 뛰었고, 2년물은 장중 +8bp까지 올랐다가 **4.379%(+3.9bp)**로 마감했다.
**투자자 함의:** 9/15~16 FOMC까지 남은 지표는 **9/10 PPI·9/11 CPI** 둘뿐이고, 9/5부터 연준 인사들의 발언 공백(블랙아웃)이 시작됐다. 즉 **인상 여부를 가를 재료가 물가 지표 두 개로 압축**됐다. 한국은행이 8/27 기준금리를 3.00%로 2회 연속 인상한 상태라 한미 동시 긴축 시나리오가 계속 유효하며, 고밸류에이션 성장주와 장기 회수 프로젝트에는 계속 불리한 조합이다.

**2. 미·이란 무력충돌 격화 — WTI 주간 +9.69%, 두바이유 100달러 돌파**
8/30 미군의 이란 라라크섬 IRGC 로켓 발사대 타격으로 한 달여 소강 국면이 끝났고, 9/1~9/2 이란 혁명수비대 목표물 타격과 이란의 역내 미군기지 보복이 이어졌다. WTI는 **\$83.40 → \$91.48(+9.69%)**, 브렌트유는 **\$96.28**까지 올랐고 국내 기준유가인 **두바이유는 배럴당 102.40달러**를 기록했다. 미군은 9/1 유조선 40척·원유 1,800만 배럴 규모의 호송 작전을 수행했다.
**투자자 함의:** 유가 상승은 **인플레이션 재점화 경로로 직결**되며, 9/11 CPI에 에너지 항목으로 반영된다. 즉 이번 유가 급등은 지정학 이슈이면서 동시에 **연준 인상 확률을 높이는 매크로 변수**다. 국내에서는 정유·조선·방산에 우호적이고, 항공·해운·화학과 원가 전가력이 낮은 소비재에 부담이다.

**3. 브로드컴 FY26 3분기 — 매출 +86%, AI 반도체 +221%**
9/2 장 마감 후 발표된 실적에서 매출이 **296억 달러(전년비 +86%)**, GAAP 영업이익 **160억 달러**, 순이익은 3배 이상 늘어난 **131억 달러**를 기록했다. 핵심은 **AI 반도체 매출 167억 달러(+221%)**로 전체 매출의 **56%**를 차지했다는 점이다. 4분기 가이던스는 매출 **348억 달러(+93%)**, AI 반도체 **217억 달러(+236%)**이며, FY26 AI 매출 전망을 **580억 달러(+186%)**로 상향하고 FY27 **1,150억 달러**·FY28 **2,300억 달러**를 제시했다.
**투자자 함의:** AI 인프라 수요의 **지속성 논쟁에 대한 가장 강한 반박 자료**다. 다만 이 실적에도 9/4 브로드컴 주가는 **+0.2%**에 그쳤다 — 좋은 실적이 이미 가격에 있다는 뜻이다. 국내 밸류체인에는 **커스텀 ASIC·네트워킹 수요 확대**가 기판·패키징·전력 부품 쪽으로 파급되는 경로가 유효하다.

**4. OpenAI, GPT-6 Astra 공개 — 사이버보안 'Critical' 등급 첫 모델**
9/3 신뢰 파트너 대상 한정 프리뷰로 공개된 뒤 9/4 유료 사용자에게 제한 버전으로 배포됐다. 컴퓨터 사용(computer use)·소프트웨어 엔지니어링·전문 업무·과학 영역에서 최고 성능을 주장했고, OpenAI 자체 Preparedness Framework 기준 **사이버보안 'Critical' 임계값에 도달한 첫 모델**로 분류됐다. 그레그 브로크먼 사장은 **"안전이 핵심이 되어야만 AI가 사람에게 이로울 수 있다"**며 안전·정렬에 이전보다 많은 컴퓨트를 투입했다고 밝혔다.
**투자자 함의:** 모델이 무거워질수록 **추론 단계의 메모리·스토리지 요구가 비선형으로 늘어난다**. 9/4 메모리 3사(샌디스크 +11.90%, SKHY +8.14%, 마이크론 +6.10%)가 로직보다 크게 오른 배경에 이 서사가 깔려 있다. 연합인포맥스도 주말 기사에서 이 모델 공개를 국내 메모리 반도체주 급등의 촉매로 지목했다.

**5. 한국 8월 반도체 수출 +209% 사상 최대 · SK하이닉스 솔리다임 재공시**
한국의 8월 반도체 수출이 전년비 **209% 급증한 466억 5,000만 달러**로 사상 최대를 기록했다. SK하이닉스는 2분기 **글로벌 HBM 점유율 1위**를 유지했다(삼성전자 33% 추격). 한편 SK하이닉스는 9/4 **솔리다임 프리IPO 관련 재공시**에서 "경쟁력 강화를 위한 다양한 방안을 검토 중이나 확정된 사항은 없다"고 밝히고, **다음 재공시일을 12월 3일**로 정했다. 시장에는 모건스탠리·골드만삭스를 주관사로 기업가치 50조원, 조달 5~10조원 규모의 나스닥 상장 추진설이 있었다.
**투자자 함의:** 수출 지표는 **메모리 슈퍼사이클이 실물로 확인되는 데이터**다. 반면 솔리다임 건은 3개월 유예되면서 **중복상장 우려라는 할인 요인이 당장은 제거**됐다. 다만 **충칭공장 지분 4조원 매각 건의 재공시일이 9월 9일**로 남아 있어, 이번 주 중 실제 자산 재편 여부가 확인될 수 있다.

## 🌙 섹션 2. 휴장·주말 신규 뉴스 5선

**1. 미군, 이란 유조선 3척 타격 (9/5) — 카르그섬·자스크 인근**
CENTCOM은 9/5 이란 원유 운반선 3척을 타격해 2척을 영구 불능화하고 1척을 파괴했다고 밝혔다. 위치는 **카르그섬 인근 1척, 자스크 인근 1척, 오만만 1척**이다. 미군은 이 선박들이 IRGC와 역내 대리세력을 재정 지원하는 **수십억 달러 규모의 그림자 선단**의 일부라고 설명했다. 브래드 쿠퍼 CENTCOM 사령관은 **"우리 함정 2척에 쏘면 너희 배 3척을 없앤다"**고 밝혔다. 앞서 IRGC가 미 해군 함정 2척에 탄도미사일을 발사한 데 대한 보복이다.
**관전 포인트:** **카르그섬은 이란 원유 수출의 약 90%가 통과하는 터미널**이다. 수출 인프라 자체가 아니라 선박을 겨냥한 단계이지만, 타격 지점이 인프라에 가까워지고 있다는 점이 문제다. 9/8(화) 개장 시 **유가 갭업 여부와 에너지·방산 섹터의 초기 반응**이 첫 시험대다.

**2. 이란 "봉쇄 해제 전까지 더 가혹한 보복" 경고**
이란 하탐 알-안비아 중앙사령부는 미국이 이란 선박에 대한 위협과 **해상 봉쇄를 유지할 경우 역내 미 군함에 대한 공격이 이전보다 더 가혹해질 것**이라고 경고했다. 미국과 이란의 무력 충돌은 2월 28일 개전 이후 7개월째이며, 호르무즈 해협 봉쇄가 유가에 붙은 프리미엄의 핵심 근거로 남아 있다.
**관전 포인트:** 시장이 지금까지 보인 패턴은 **타격 → 유가 급등 → 며칠 뒤 되돌림**의 반복이었다. 이번에도 되돌림이 나올지, 아니면 카르그섬 근접 타격으로 **되돌림 없이 레벨이 굳어지는지**가 다음 주 유가의 갈림길이다. WTI \$91대는 8월 중순 이후 상단이다.

**3. OPEC+ JMMC 회의 (9/6) — 9월 증산이 마지막 트랜치**
OPEC+는 8/2 화상회의에서 **9월에도 하루 18만 8,000배럴 증산**을 결정했고, 이것으로 2023년 4월 구조화한 **하루 165만 배럴 자발적 감산 패키지의 되돌림이 완료**된다. 델리게이트들은 이후 **연말까지 쿼터를 동결할 것으로 예상**된다고 밝힌 상태이며, 공식 JMMC 점검 회의가 **9월 6일** 예정돼 있다.
**관전 포인트:** 증산 여력이 소진된 상태에서 중동 공급 차질이 겹치면 **OPEC+의 완충 기능 자체가 약해진다**. 회의에서 연말까지 동결 기조가 재확인되면 유가의 하방 경직성이 강화되고, 반대로 추가 증산 신호가 나오면 유가 되돌림의 명분이 된다.

**4. 연준 블랙아웃 개시 (9/5~9/17) — 남은 재료는 PPI·CPI 둘뿐**
9월 15~16일 FOMC를 앞둔 **발언 자제 기간이 9월 5일 토요일부터 9월 17일까지** 적용된다. 이 기간 연준 인사들의 공개 발언이 사라지므로, 시장이 참고할 새 정보는 **9/10 PPI**와 **9/11 CPI**밖에 남지 않는다.
**관전 포인트:** 이번 주는 **월러(비둘기)·워시(매파)의 발언 충돌로 확률이 하루 만에 10%p씩 튀는 패턴**이 반복됐다. 블랙아웃으로 그 변동성 요인이 제거되는 대신, **CPI 하루에 변동성이 응축**되는 구조가 된다. 9/11은 한국 시각 9/11 밤이라 국내 증시에는 9/14(월)에 반영된다.

**5. 주간 외국인 수급 공개 — SK하이닉스 1조 909억 순매도, 한미반도체는 순매수**
한국거래소·연합인포맥스 집계에 따르면 지난주 외국인 **주간 순매도 상위**는 SK하이닉스(**1조 909억원**), 삼성전자(**5,181억원**), 삼성SDI(**1,728억원**)였다. 반대로 **주간 순매수 상위**는 한미반도체(**883억원**), SK스퀘어(**844억원**), 대한항공(**794억원**), SK이노베이션(**654억원**)이었다.
**관전 포인트:** 외국인이 메모리 대형주를 팔면서 **HBM 장비(한미반도체)와 지주(SK스퀘어)는 담았다**는 것이 핵심이다. 대형주 밸류에이션 부담은 인정하되 **HBM 사이클 자체는 유지**한다는 포지션으로 읽힌다. 9/4 하루 외국인이 SK하이닉스를 **30만 8,833주 순매수**로 전환한 것과 함께 봐야 한다.

## 🔭 섹션 3. 다음 개장일(9/8 화) 섹터별 전망

미 증시는 **9월 7일(월) 노동절 휴장**으로, 다음 정규장은 **9월 8일(화)**이다. 한국 증시는 **9/7(월) 정상 개장**하므로, 국내는 **미국 가이드 없이 하루를 먼저 소화**해야 한다.

**⬆️ 우호적일 가능성이 큰 섹터**

**에너지·정유** — 주말 미군의 이란 유조선 3척 타격은 **아직 가격에 반영되지 않은 재료**다. WTI \$91.48에서 출발하며, 카르그섬 근접 타격이라는 성격상 프리미엄이 유지되기 쉽다. 다만 OPEC+ JMMC 결과가 상쇄 변수다.

**메모리 반도체** — 금요일의 로테이션(샌디스크 +11.90%, SKHY +8.14%, 마이크론 +6.10%)이 하루짜리였는지 추세인지가 9/8의 첫 질문이다. GPT-6 Astra 배포 확대와 한국 8월 반도체 수출 +209%는 서사를 뒷받침하지만, **SKHY 괴리율이 +45.1%까지 벌어진 상태**라 ADR 쪽 조정 여지가 있다.

**방산** — 이란과의 교전이 7개월째 이어지고 보복 경고까지 나온 상태에서, 지정학 프리미엄이 재차 반영될 여지가 있다.

**⬇️ 부담이 큰 섹터**

**소프트웨어·AI 애플리케이션** — 금요일 가이드와이어 −19.90%, 유아이패스 −16.60%, 아사나 −12.70%로 업종 전반이 매도됐다. **금리 상승과 'AI가 SW를 대체한다'는 서사가 겹친 구조**라 CPI 전까지 반등 계기를 찾기 어렵다.

**소비재·리테일** — 룰루레몬의 연간 가이던스 대폭 하향(EPS \$10.95~11.15 → \$9.48~9.73)은 개별 이슈를 넘어 **북미 소비 트래픽 둔화**의 신호로 읽혔다. 여기에 유가 상승분이 가계 지출을 잠식한다.

**항공·해운** — 유가 주간 +9.69%는 원가에 직접 반영된다. 호르무즈 봉쇄 장기화로 항로 우회 비용도 유지된다.

**⚠️ 방향이 갈리는 곳**

**AI 로직 대장주(엔비디아·브로드컴)** — 브로드컴이 AI 매출 +221%라는 압도적 숫자를 내고도 +0.2%에 그쳤다. **좋은 실적이 더 이상 주가를 밀어올리지 못하는 구간**에 들어섰는지가 9/8에 재확인된다.

### 🇰🇷 한국 관전 포인트

**🇰🇷 [전달]** 코스피200 야간선물은 **1,093.90(+3.93%)**으로 미국 반도체 랠리를 상당 부분 반영했다. 국내 정규장 종가(1,052.50 수준) 대비 41.40포인트 위에서 마감했으므로, **9/7(월) 개장에는 이미 갭업 여지가 선반영된 상태**다. 주간으로 보면 야간선물 +2.79% vs 코스피 −1.50%로, **국내 현물이 미국 반도체 강세를 아직 덜 반영한 구간**이다. SKHY는 주간 **+9.91%** 오르는 동안 국내 SK하이닉스(000660)는 **−0.36%(1,647,000원)**에 그쳤고, 그 결과 괴리율이 **+33.7%(8/28) → +45.1%(9/4)**로 11.4%p 확대됐다. 확대의 원인은 국내 상승이 아니라 **ADR 단독 상승**이다. 원/달러가 주간 22.1원(−1.61%) 내려 1,350.4원으로 14개월 최저를 찍은 것도 괴리율 계산상 프리미엄을 키우는 방향이 아니라 줄이는 방향이었음에도 괴리가 벌어졌다는 점은, ADR 프리미엄이 온전히 미국 쪽 수급에서 나왔음을 뜻한다.

**🇰🇷 [수급]** SK하이닉스(000660)의 외국인 수급은 한 주 동안 **−211,935주(8/31) → +91,835주(9/1) → −651,507주(9/2) → −234,626주(9/3) → +308,833주(9/4)**로 움직였다. 9/2 대규모 순매도 이후 **매도 규모가 3분의 1로 줄었고 금요일 순매수로 전환**했다. 기관도 같은 날 **+96,776주**로 전환해 외국인·기관이 동반 매수로 돌아섰다. 외국인 지분율은 50.56%(8/31) → **50.49%(9/4)**로 소폭 낮아진 상태다. 삼성전자(005930)는 외국인이 9/4에도 **−115,377주** 순매도를 이어갔으나 9/2의 **−1,321,536주** 대비 감속했고, 기관이 **+2,489,812주** 대규모 순매수로 전환했다. 시장 전체로는 9/4 외국인 **+4,798억원**, 기관 **+1조 6,692억원**, 기타법인 **+1조 5,741억원**(삼성전자 임직원 주식보상용 자사주 매입 및 SK하이닉스 자사주 매입 추정)이 유입됐고 개인이 **−3조 7,231억원** 순매도했다.
