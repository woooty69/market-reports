# 📊 한국증시 데일리 리포트
### 2026년 10월 20일(화) 작성 · 기준일: 10월 19일(월) 정규장

> 19일 코스피는 금요일 밤 나스닥 급락 여파에 5,488.41(−3.17%)로 출발했지만 기관(+5,302억원) 매수와 외국인 순매수 전환(+947억원)으로 오후 들어 상승 전환해 고가인 5,768.01(+1.76%)로 이틀째 올랐습니다. '중국 ESS 업체 미국 철수' 보도에 삼성SDI(+11.51%)·포스코퓨처엠(+10.02%)·에코프로(+10.82%) 등 2차전지가 반등을 이끌었고, 원/달러는 1,333원으로 약 2년 만의 최저 수준입니다. 밤사이 뉴욕은 AI·반도체주 저가 매수로 나스닥(+1.11%)·필라델피아 반도체(+1.61%)가 반등했지만, 코스피200 야간선물은 소폭 약세입니다.

*코스피는 금요일 밤 뉴욕에서 AI 인프라 부채 우려로 나스닥이 2.15%, 필라델피아 반도체지수가 3.83% 급락한 여파에 5,488.41로 출발했지만, 낙폭 과대 인식과 외국인 매도 완화로 장 마감 30분 전쯤 상승 전환해 이날 고가인 5,768.01(+1.76%)로 마감했다. 하루 변동폭은 280포인트였다. 기관이 5,302억원, 외국인이 947억원을 순매수했고 개인은 1조 1,767억원을 팔았다. 삼성SDI(+11.51%)·LG에너지솔루션(+6.33%)·삼성바이오로직스(+6.78%)·현대차(+4.01%)·삼성전자(+3.71%)·SK하이닉스(+2.52%)가 지수를 끌어올렸다. 업종별로는 전기제품(+7.83%)·화학(+6.25%)·에너지장비(+5.65%)·비철금속(+5.08%)·IT서비스(+4.24%)·자동차(+4.06%)가 강했고, 기타금융(−0.83%)·조선(−0.04%)·은행(−0.04%)은 약했다. 밤사이 뉴욕은 나스닥 +1.11%·필라델피아 반도체 +1.61%로 금요일 급락을 일부 되돌렸고 VIX는 18.51(−7.40%)로 내려왔다.*

## 🗓 시장 요약

**① 코스피 5,768.01(+1.76%), 3% 급락 출발 뒤 280포인트 '롤러코스터' 반등**
코스피는 장 초반 3% 넘게 밀리며 5,500선이 위태로웠지만 장 마감 30분 전쯤 상승 전환해 고가로 마감했다. 기관이 5,302억원을 순매수했고 외국인도 947억원 순매수로 돌아선 반면, 개인은 '빚투' 부담 속에 1조 1,767억원을 팔았다. 다만 외국인은 10월 1～16일에만 17조원 넘게 순매도했고 이 중 80%가 삼성전자·SK하이닉스에 몰려 있어 수급 회복은 아직 초기 단계다. JP모건은 한국 증시 PER이 역사적 저점에 들어서 매력적 구간에 진입했다고 평가했다.

**② 반도체: 삼성전자 +3.71%·SK하이닉스 +2.52%, 장비주는 약세**
삼성전자는 223,500원(+3.71%)으로 22만원대를 회복했고 SK하이닉스는 1,304,000원(+2.52%)으로 거래대금 4조 6,661억원의 1위였다. 장 마감 후 삼성전기(+2.69%)는 빅테크向 3,605억원 규모 메모리 패키지기판 장기공급계약을 공시했다. 반면 'AI 쇼크'에 티에스이(−3.36%)·피에스케이홀딩스(−1.16%)·케이씨텍(−2.27%) 등 장비·소부장은 약했다. 대신증권은 '이익 가치가 철저히 부정당한 과도한 하락'이라며 삼성전자 목표가 56만원·SK하이닉스 320만원과 비중확대를 유지했고, 20일 아침에는 정부·SK하이닉스·4대 은행의 소부장 협력사 2조원 금융지원 소식이 나왔다.

**③ 주도 업종: 2차전지·제약바이오·철강소재**
중국 ESS 업체들이 미국 사업을 사실상 포기했다는 보도에 북미 ESS 수요 기대가 커지며 삼성SDI(+11.51%)·LG에너지솔루션(+6.33%)·포스코퓨처엠(+10.02%)·에코프로(+10.82%)·에코프로비엠(+8.14%)이 급등했고, 롯데에너지머티리얼즈(+18.83%)·솔루스첨단소재(+23.94%)·삼아알미늄(+14.29%)·에스엠벡셀(상한가) 등 소재·부품주가 폭등했다. 연기금이 2차전지를 매집했다는 분석도 나왔다. 경기방어 수요가 몰린 제약바이오에서는 삼성바이오로직스(+6.78%)·유한양행(+8.08%)이 강했고, POSCO홀딩스(+4.89%)·OCI홀딩스(+9.41%) 등 소재주도 올랐다.

**④ 약세 업종: 조선·은행·화장품·반도체 장비**
HD현대중공업(−1.14%)은 노조의 크레인 농성과 21일 부분파업 예고, 키움증권의 3분기 컨센서스 하회 전망(목표가 72만원으로 하향)이 겹쳐 약했고 한화오션(−0.62%)도 내렸다. 은행은 5대 은행장 국감 출석 속 신한지주(−0.96%)·하나금융지주(−0.33%)가 하락했고, 화장품은 환율 하락에 따른 3분기 눈높이 하향으로 코스맥스(−3.55%)가 밀렸다. 한양디지텍(−9.51%)·라온시큐어(−7.37%)·한미사이언스(−4.51%)·엘앤씨바이오(−4.28%)도 하락률 상위였다.

**⑤ 환율·금리·외부 변수: 원화 2년 만의 강세, 밤사이 뉴욕 AI주 반등**
원/달러 하나은행 고시 환율은 1,333.00원으로 5.00원 내렸고, 19일 서울 외환시장 주간 종가(1,330.3원)는 2024년 10월 이후 약 2년 만에 가장 낮았다. 중국 3분기 GDP 성장률은 4.5%로 예상을 웃돌았다. 19일(현지) 뉴욕에서는 AI·반도체주 저가 매수와 중동 긴장 완화 기대로 나스닥이 1.11%, 필라델피아 반도체지수가 1.61% 올랐고 S&P500도 0.41% 상승했으며 다우만 0.07% 내렸다. 다만 코어위브 등 AI 인프라 기업의 신용 우려와 미국 10년물 금리 5%대, WTI 100달러 안팎의 고유가는 여전한 부담이다.

**⑥ 코스닥 808.89(+1.78%), 3거래일 만에 800선 회복**
코스닥은 773.06(−2.73%)으로 출발했다가 기관(+686억원)과 개인(+783억원) 매수에 상승 전환했고 외국인은 1,618억원을 팔았다. 에코프로(+10.82%)·에코프로비엠(+8.14%)·레인보우로보틱스(+7.80%)·로보티즈(+5.87%)·HLB(+3.72%)·알테오젠(+2.35%) 등 시총 상위주가 올랐다. 2차전지 부품 테마에서 알멕(+20.66%)·삼기에너지솔루션즈(+23.31%)·태성(+14.56%)·한중엔시에스(+16.23%)와 지투지바이오(+25.04%)가 급등했다.

## 1. 업종별 흐름

**상승 업종** — 전기제품(+7.83%, 상승 57·하락 8)·화학(+6.25%, 상승 100·하락 16)·에너지장비및서비스(+5.65%)·비철금속(+5.08%)·IT서비스(+4.24%, 상승 97·하락 17)·백화점과일반상점(+4.07%)·자동차(+4.06%, 상승 12·하락 0)·철강(+3.94%)·기계(+3.92%)·통신장비(+3.83%)가 상위였다. 전기제품·화학은 중국 ESS 업체 미국 철수 보도로 삼성SDI(+11.51%)·LG에너지솔루션(+6.33%)·롯데에너지머티리얼즈(+18.83%)·솔루스첨단소재(+23.94%)가, IT서비스는 3분기 실적 기대의 LG씨엔에스(+6.90%)와 현대오토에버(+10.08%)가, 백화점은 롯데쇼핑(+9.03%)이 이끌었다. 자동차는 현대차(+4.01%)·기아(+3.99%)·현대모비스(+3.26%)가 고르게 올랐고, 비철·철강은 POSCO홀딩스(+4.89%)·삼아알미늄(+14.29%)이 강했다.

**하락 업종** — 기타금융(−0.83%)·가정용품(−0.80%)·사무용전자제품(−0.65%)·식품소매(−0.51%)·컴퓨터와주변기기(−0.26%)·카드(−0.23%)·화장품(−0.07%)·은행(−0.04%)·조선(−0.04%)만 소폭 약세였다. 조선은 HD현대중공업(−1.14%)의 노조 파업 예고와 원화 강세에 따른 3분기 실적 하향 리포트가 부담이었고, 은행은 국정감사에서 해킹·가계부채·이자 장사 질타가 이어지며 신한지주(−0.96%)가 내렸다. 화장품은 환율 하락으로 3분기 눈높이가 낮아지며 코스맥스(−3.55%)가 약했지만, 에이피알(+1.23%)은 메디큐브의 미국 코스트코 400곳 입점으로 버텼다.

**시장의 시선** — 3% 급락 출발 뒤 반등으로 '검은 월요일'은 피했고, 밤사이 나스닥·필라델피아 반도체가 반등해 일단 숨을 돌렸다. 유안타증권은 심리·수급 진바닥을 5,500pt 내외로 보고 패닉이 빠르게 잦아들 것으로 봤고, iM증권은 단기 바닥을 5,100～5,340pt로 제시하며 고베타 섹터 분할 매수를 권했다. 반면 유진투자증권은 AI 인프라 기업 회사채·CDS 급등을 'AI 신용 균열'로 경고했다. 이번 주 빅테크·램리서치·테슬라 실적과 22일 금통위, 외국인 순매수 지속 여부가 관건이다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 66종목

### 🇰🇷 오늘 개장 관전 포인트
1. **사흘 연속 반등 여부** — 코스피는 5,488.41에서 5,768.01까지 280포인트를 회복하며 고가로 마감했고, 밤사이 나스닥(+1.11%)·필라델피아 반도체(+1.61%)도 반등했다. 다만 코스피200 야간선물은 작성 시점 소폭 약세여서 개장 초 차익 매물을 소화하며 5,800선을 회복하는지가 첫 관문이다.
2. **외국인 수급 전환 지속성** — 외국인은 코스피에서 947억원 순매수로 돌아섰지만 코스닥에서는 1,618억원을 팔았고 10월 누적 순매도가 17조원을 넘는다. 원/달러 1,330원대의 원화 강세가 외국인 매수를 이어 줄지, 삼성전자·SK하이닉스 매도가 줄어드는지 확인이 필요하다.
3. **2차전지 급등의 연속성** — 삼성SDI(+11.51%)·포스코퓨처엠(+10.02%)·에코프로(+10.82%)·롯데에너지머티리얼즈(+18.83%)가 '중국 ESS 업체 미국 철수' 보도로 급등했다. LG에너지솔루션-엘앤에프 LFP 양극재 계약 등 후속 뉴스와 연기금 매수가 이어지는지 지켜볼 필요가 있다.
4. **반도체와 AI 신용 우려** — 삼성전자·SK하이닉스는 반등했지만 장비주는 여전히 약했다. 필라델피아 반도체 반등이 국내 대형주·소부장으로 이어지는지, 코어위브 CDS·회사채 금리와 이번 주 빅테크·램리서치 실적이 AI 투자심리를 돌려놓을지 주목된다.
5. **실적 하향 종목과 파업·금통위 변수** — HD현대중공업·한화오션·고려아연·풍산 등 원화 강세와 조업일수 감소로 3분기 컨센서스 하회가 예상되는 종목의 목표가 하향이 잇따랐다. 21일 HD현대중공업 노조 파업과 22일 금통위 결과도 업종별 차별화 요인이다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
