## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 19개:** 유통·이커머스(격차 +16.7%p), AI 소프트웨어·에이전트(격차 +14.9%p), Finance: Consumer Services(격차 +13.8%p), 정유·LNG·가스(격차 +13.7%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** CDMO·바이오시밀러, 비만치료제, 게임, 방산 — 눌림 시 매수 관점.
