## 🗓 주말 요약

**① 한 주의 결론은 'AI 트레이드 붕괴' — 나스닥 주간 −10.02%, S&P500 조정 진입**
주간으로 나스닥 **−10.02%**, S&P 500 **−8.61%**, 다우 **−8.02%**, 러셀 2000 **−7.48%**로 직전 주 반등분을 모두 반납하고 더 밀렸다. S&P500은 7거래일 연속 내리며 10월 6일 기록 종가 대비 10% 넘게 빠져 조정 국면에 들어섰고, 이는 2020년 팬데믹 초기 이후 가장 긴 연속 하락이다. 나스닥은 2026년 상승분을 모두 지웠다. VIX는 월요일 20 안팎에서 금요일 **35.89**로 치솟아 2025년 4월 이후 가장 높았다.

**② 반도체가 진앙 — SOX 주간 −17.13%, 엔비디아 주간 약 −23%**
SOX는 월요일 **−5.28%**로 출발해 수·목 보합권에서 버티다 금요일 하루에 **−10.73%(8,408.59)** 무너졌다. 엔비디아는 11/13 \$162.85에서 금요일 **\$125.40**으로 주간 약 23% 내렸고, 금요일에만 **−14.10%**였다. 3분기 매출 **\$1,158억(+103%)**, 4분기 가이던스 **\$1,300억**이라는 숫자도 경영 공백과 규제 우려를 덮지 못했다. 마이크론 **−14.17%**, AMD **−14.00%**, 브로드컴 **−13.11%**가 금요일 동반 급락했다.

**③ 앤트로픽 사상 최대 IPO가 '유동성 블랙홀'로 — 공모가 \$83 턱밑**
앤트로픽은 목요일 공모가 **\$83**, 조달액 **\$813억**으로 역대 최대 IPO를 기록했고 시가 \$111.50에서 출발했지만, 종가는 첫날 **\$97.17**, 금요일 **\$88.85(−8.57%)**로 밀렸다. 금요일 장중 저가 **\$83.05**는 공모가와 불과 5센트 차이였다. 시장은 초대형 공모가 기존 AI 대형주에서 자금을 빨아들인 것으로 해석했다.

**④ 금리는 '인상 확실'과 '안전자산 쏠림' 사이 — 10년물 5%선 아래로**
수요일 공개된 10월 FOMC 의사록에서 거의 모든 참석자가 추가 인상이 적절하다고 봤고, 크리스토퍼 월러 이사는 12월 50bp 인상 가능성까지 거론했다. 그럼에도 금요일 주식 투매로 국채 매수가 몰려 미 재무부 기준 2년물은 **4.88% → 4.63%**, 10년물은 **5.15% → 4.92%**, 30년물은 **5.47% → 5.31%**로 한 주 동안 내려왔다. CME 페드워치 기준 12월 25bp 인상 확률은 금요일 늦게 약 **92%**였다.

**⑤ 유가·금·비트코인 동반 약세 — 비트코인 \$55,000대**
WTI 12월물은 호르무즈 해협 물동량이 전쟁 전 수준에 가까워졌다는 소식에 주간 **−5.24%**로 3주 연속 내렸고, 만기일인 금요일 **\$84.09**로 마감했다. 새 근월물인 1월물은 **\$82.44**, 브렌트 1월물은 **\$92.57**이다. 위험자산 현금화 매도에 금 선물은 금요일 장중 5% 가까이 밀렸고, 비트코인은 금요일 밤 **\$55,830**까지 떨어져 2024년 9월 이후 최저를 기록했다.

**⑥ 한국은 이미 금요일에 −5.2% — 월요일엔 미국 금요일 투매를 추가 반영**
금요일(11/20) 코스피는 **−5.2%**(5일 **−7.9%**)였고, 외국인은 코스피 현물을 하루 **1조956억원**, 5일 **4조5,175억원** 순매도했다. 그런데 그날 밤 SOX **−10.73%**, SK하이닉스 ADR **\$102.55(−13.97%)**, 코스피200 야간선물 **700.00(−7.01%, 11/20 세션)**이 나와 월요일(11/23) 국내 개장에 추가 하락 압력이 쌓였다.

## 📰 섹션 1. 한 주간(11/16~11/20) 주요 뉴스 5선

**1. 엔비디아 3분기 '호실적'에도 7거래일 연속 하락 — 주간 약 −23%**
엔비디아는 현지 11/18 장 마감 후 3분기 매출 **\$1,158억(+103%)**, 데이터센터 매출 **\$1,076억(+110%)**, 4분기 매출 가이던스 **\$1,300억**을 내놓아 시장 예상을 넘었다. 그러나 주가는 발표 다음 날 −2.89%, 목요일 −3.30%, 금요일 **−14.10%(\$125.40)**로 7거래일 연속 내렸다. 젠슨 황 사임 뒤 콜레트 크레스 임시 CEO 체제, 10-Q 제출 지연, 중국 출하 중단 우려가 이어졌고, D.A. 데이비드슨은 목표주가를 **\$300 → \$200**으로 내렸다(매수 유지).
**투자자 함의:** 실적이 아니라 지배구조·규제 할인이 주가를 결정하는 국면이다. 12월 초 의회 출석과 10-Q 제출 시한까지 불확실성이 남아 있어, HBM 밸류체인에도 '좋은 숫자로는 반등하지 못하는' 구간이 이어질 수 있다.

**2. 앤트로픽, 공모가 \$83·조달 \$813억으로 사상 최대 IPO — 이틀 만에 공모가 위협**
앤트로픽은 목요일 9억8,000만 주를 주당 **\$83**에 팔아 **\$813억**을 조달했다. 첫날 시가는 **\$111.50**이었지만 장중 반전해 **\$97.17**로 마감했고, 금요일에는 **\$88.85(−8.57%)**, 장중 저가 **\$83.05**까지 밀렸다. 회사가 공개한 9월까지 9개월 매출은 **\$330억**을 넘었다. 시장은 공모 자금 수요가 아마존·알파벳 등 기존 AI 대형주 매도로 이어졌다고 봤다.
**투자자 함의:** 공모가 \$83은 AI 밸류에이션 신뢰의 '심리적 바닥'이 됐다. 월요일 옵션 거래와 레버리지 ETF 상장이 시작되면 이 선을 지키는지가 AI 종목 전반 심리를 좌우한다.

**3. 10월 FOMC 의사록 '거의 모든 참석자 추가 인상 적절' — 월러 '12월 50bp 필요할 수도'**
수요일 공개된 의사록은 추가 인상 쪽으로 기운 연준의 분위기를 확인시켰다. 월러 이사는 12월 50bp 인상 가능성을 거론했고, 리사 쿡 이사는 인상을 늦출수록 뒤처질 위험이 커진다고 말했다. 애나 폴슨 필라델피아 연은 총재도 인플레이션이 너무 높아 다시 올려야 할 것이라고 했다. 그럼에도 10년물은 주간 **−0.23%p(4.92%)**로 내려 금리보다 위험회피가 시장을 지배했다.
**투자자 함의:** 금리가 내려도 기술주가 오르지 않은 것은 밸류에이션 재평가가 진행 중이라는 신호다. 12월 8~9일 FOMC까지 25bp가 기본, 50bp가 꼬리 위험이다.

**4. 반도체 규제 이중 압박 — 상무부 원격 접근·우회 수출 규제, AMD 공매도 보고서**
월요일 상무부는 첨단 반도체의 원격 접근과 인도네시아·말레이시아·싱가포르·태국·브라질을 거친 우회 수출을 허가제로 묶는 규제 강화안을 내놓았고, SOX는 그날 **−5.28%**였다. 목요일에는 헌터브룩 캐피털이 AMD 칩이 중개상을 거쳐 미국 블랙리스트에 오른 중국 서버업체로 흘러갔을 가능성을 제기했고, AMD는 목요일 **−7.72%**, 금요일 **−14.00%(\$420.72)**로 이틀 동안 20% 넘게 빠졌다.
**투자자 함의:** 수출 통제가 칩 판매뿐 아니라 클라우드 임대까지 넓어지면서 매출 경로 자체가 감시 대상이 됐다. 국내 장비·HBM 업체에는 중국향 비중 점검이 필요한 대목이다.

**5. 실적·정책이 가른 업종 — 월마트·갭 선방, 인튜이트·헬스케어 급락**
월마트는 3분기 매출 **\$1,888억**(예상 \$1,872억), 미국 동일점 매출 **+2.9%**로 연간 전망을 다시 올렸고, 갭은 핵심 브랜드 동일점 매출 호조로 금요일 **+11.44%** 뛰었다. 반면 인튜이트는 2027 회계연도 매출 가이던스를 **\$230억8,000만~233억7,000만**으로 낮춰 **−12.95%**였다. CMS가 메디케어 어드밴티지 감사 강화안(2027~2036년 약 **\$902억** 환수 추정)을 내놓자 유나이티드헬스는 이번 주 −10.21%, −5.55%로 급락했다가 금요일 **+2.84%** 반등했다.
**투자자 함의:** 소비는 '견조하지만 까다로운' 상태로 필수소비재·할인 소매가 방어처가 됐다. 반면 정책 리스크가 생긴 헬스케어는 방어주로서의 지위가 흔들렸다.

## 🌙 섹션 2. 휴장·주말 신규 뉴스 5선

**1. SEC, 엔비디아 회계 문제 검토 보도 — 캘리포니아 법무장관 소환장까지 '규제 이중고'**
로이터는 금요일 SEC 집행국 직원들이 엔비디아의 잠재적 회계 문제를 들여다보고 있다고 보도했고, SEC는 논평을 거부했다. 이에 앞서 롭 본타 캘리포니아주 법무장관은 목요일 중국으로의 칩 유입과 투자자 대상 허위 진술 가능성을 조사하는 소환장을 엔비디아에 송달했다. 젠슨 황 전 CEO는 **12월 1일(화)** 하원 3개 위원회에, 법무 총괄은 **12월 2일**에 출석할 예정이며, 분기 보고서(10-Q) 제출 시한은 **12월 4일**이다. 엔비디아 시가총액은 11/13 종가 이후 약 **\$8,990억**이 사라진 것으로 집계됐다.
**관전 포인트:** 회계 이슈는 실적 숫자 자체의 신뢰를 건드린다는 점에서 경영 공백보다 무거운 재료다. 12월 첫 주 의회 출석과 10-Q 제출이 확인될 때까지 반등은 기술적 되돌림에 그칠 가능성이 크다.

**2. 비트코인 \$55,830 — 2024년 9월 이후 최저, 11월 낙폭 20%대**
비트코인은 금요일 밤(현지 오후 11시 13분) **\$55,830**까지 하루 **5.10%** 밀려 2024년 9월 이후 가장 낮은 수준으로 내려갔다. 금요일 정규장에서 \$59,000선이 무너진 뒤 하락이 이어졌고, 11월 한 달 낙폭은 20%를 넘어 2022년 6월 이후 최악의 월간 성적을 향하고 있다. 스트래티지(MSTR)는 금요일 **−9.63%(\$77.84)**였다.
**관전 포인트:** 금리 인상기 투기 자산 디레버리징이 주말에도 이어졌다는 신호다. 비트코인은 24시간 거래되는 만큼 월요일 아침 위험 선호를 가늠하는 선행 지표로 볼 만하다.

**3. 앤트로픽, 월요일 옵션·레버리지 ETF 데뷔 — 이틀 거래량이 공모 물량의 111.6%**
나스닥 집계로 앤트로픽은 상장 후 이틀 동안 **12억5,777만 주**가 거래돼 공모 물량 **11억2,700만 주**의 약 **111.6%**가 손바뀜했다. 11/21~23 사이 추가로 최대 약 **14억4,000만 주(약 10.9%)**가 거래 가능해지는 것으로 알려졌고, 11월 23일(월)에는 옵션 거래와 함께 2배·−2배 레버리지 ETF 4종이 거래를 시작할 예정이다.
**관전 포인트:** 공모가 \$83과 금요일 저가 \$83.05가 사실상 같은 수준이라, 월요일 옵션·인버스 상품 출시가 하방 헤지 수요를 키울지가 관건이다. 공모가가 깨지면 AI 대형주 전반에 추가 매도 심리가 번질 수 있다.

**4. 오라클 "OpenAI 계약 자금 모두 확보" — 그래도 주가는 신주 발행가 12.8% 아래**
오라클은 11/20 X(옛 트위터) 게시물에서 OpenAI 계약 이행에 필요한 자금을 모두 확보했다고 밝혔다. 그러나 오라클 주가는 금요일 **\$101.19**로 최근 신주 발행가 **\$116.00**보다 **12.8%** 낮다. AI 인프라 기업들의 부채 조달 능력이 이번 주 매도의 핵심 의심 대상이었다는 점에서 시장 불안을 달래려는 발언으로 읽힌다.
**관전 포인트:** 코어위브(4분기 이자비용 \$10억5,000만~11억5,000만 전망)·네비우스 등 네오클라우드의 조달 우려가 남아 있어, 오라클의 확인이 업종 전반 신뢰 회복으로 이어질지는 월요일 주가 반응으로 판단해야 한다.

**5. 12월 인상 확률 약 92%·50bp 약 10% — 미시간대 1년 기대인플레 3.7%로 하락**
찰스 슈왑에 따르면 금요일 늦게 CME 페드워치 기준 12월 25bp 인상 확률은 약 **92%**, 50bp 인상 확률은 약 **10%**였다. 11월 미시간대 소비자심리지수 확정치는 **51.5**로 예비치 48보다 올랐고, 1년 기대인플레이션은 **3.7%**로 내려왔다. 주식 투매 속에 국채 수익률은 전 구간에서 내렸고, 달러지수는 103.9 부근으로 2025년 4월 초 이후 가장 강했다.
**관전 포인트:** 기대인플레 하락은 50bp 시나리오를 약하게 만드는 재료지만, 이번 주 PCE 물가가 예상(근원 전월 대비 약 +0.3%)을 넘으면 다시 매파 우려가 커질 수 있다. 강달러는 원화와 외국인 수급에 부담이다.
