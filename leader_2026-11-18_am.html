## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 9개:** Advertising(격차 +23.4%p), Hospital/Nursing Management(격차 +20.0%p), 조선·LNG선·함정 MRO(격차 +12.0%p), 석유화학(격차 +10.0%p) — 이번 리포트의 핵심 선점 영역.

- **한국이 미국보다 앞서간 테마(과열 점검):** 물·환경(-14.0%p), 음식료·K푸드(-7.7%p), 탱커·가스선(-7.0%p)
