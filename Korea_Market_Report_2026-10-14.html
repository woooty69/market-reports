# 📊 한국증시 데일리 리포트
### 2026년 10월 14일(수) 작성 · 기준일: 10월 13일(화) 정규장

> 10월 13일 정규장 확정 종가·수급과 밤사이 미국 증시(10/13), 코스피200 야간선물 마감, 직전 리포트 이후 나온 뉴스·증권사 리포트를 정리했습니다. 전날 저녁판과 종목·리포트가 일부 겹칩니다.

## 🗓 시장 요약

**① 코스피 6,035 '검은 화요일'… 외국인 4.6조원 투매, 매도 사이드카**
코스피는 348.89포인트(−5.46%) 내린 6,035.35로 마감해 7,000선 부근에서 5거래일 만에 약 1,000포인트가 빠졌다. 장중 코스피200 선물 급락으로 35거래일 만에 매도 사이드카가 발동됐고 지수는 한때 5,911.11까지 밀렸다. 외국인은 하루 4조5,789억원을 팔아 올해 누적 순매도가 200조원을 넘었다는 집계가 나왔고, 개인이 2조3,169억원을 사들였다.

**② 반도체: CXMT '4F² D램' 쇼크에 하이닉스 −9%·삼성 −7%**
SK하이닉스(−9.28%)는 거래대금 7조9,823억원, 삼성전자(−6.59%)는 5조9,164억원으로 시장 1·2위였다. 중국 창신메모리(CXMT)가 차세대 4F² 구조 D램을 먼저 제품화하겠다고 밝히자 '중국 추격' 우려가 커졌다. KB증권은 두 회사의 P/E가 4배 이하로 떨어져 시장이 여전히 반도체를 시클리컬로 의심하고 있다고 진단했다. 장 마감 뒤 삼성전자는 AMD와 AI 메모리 용량 확장 기술을 공개했고, 이재용 회장이 홍라희 관장으로부터 삼성전자 주식 약 2조6,000억원어치(1,115만8,000주)를 증여받는다고 공시했다. 밤사이 SOX는 −0.23%로 하락 폭을 줄였다.

**③ 버틴 업종: 2차전지·엔터·금융·코스닥 소부장**
LG에너지솔루션(+3.64%)은 3분기 영업이익 7,560억원 서프라이즈와 엘앤에프(+3.18%)와의 조단위 LFP 양극재 계약 보도에 올랐고, 밤사이 삼성SDI도 3분기 흑자 유지 전망이 나왔다. 방송·엔터(+1.70%)는 하이브(+3.64%), 기타금융(+1.70%)은 메리츠금융지주(+1.69%)가 강했다. 코스닥 반도체 소부장은 주성엔지니어링(+4.35%)·피에스케이홀딩스(+9.18%)·두산테스나(+8.56%)·티에스이(+8.44%)가 올랐고, 신한금융의 인수가 결정된 롯데손해보험(+9.66%), 호남 반도체 테마 서산(+29.88%)·AI 보안주 안랩(+12.31%)도 급등했다.

**④ 약세 업종: 반도체·화장품·바이오·지주**
반도체(−7.38%)는 대형주와 한미반도체(−7.44%)가, 화장품(−6.96%)은 에이피알(−18.89%)이 원화 강세·물류비 부담으로 3분기 영업이익이 기대치를 밑돌 것이라는 리포트와 목표가 줄하향에 상장 후 최대 낙폭을 보이며 한국콜마(−6.82%)·달바글로벌(−7.34%)까지 끌어내렸다. 생명과학도구(−5.39%)·생물공학(−3.80%)은 올릭스(−14.03%)·파마리서치(−7.91%)가 약했다. 복합기업(−4.23%)은 SK(−7.22%)·삼성물산(−5.25%), 생명보험(−5.03%)은 삼성생명(−5.23%)이 반도체 지분가치 하락에 동반 약세였다.

**⑤ 환율·금리·외부 변수**
원/달러 고시 환율은 1,342.50원으로 6.50원 올랐지만 외국인 4조원대 매도에 비하면 상승 폭은 제한적이었다. 원화 강세가 이어진 3분기 실적 시즌에서 현대차(−2.66%)·기아·에이피알처럼 환율·파업 탓에 이익 추정치와 목표가가 내려가는 수출주가 늘고 있다. 밤사이 미국 3대 지수는 다우 −0.35%, 나스닥 −0.15%, S&P500 −0.02%로 보합권이었고 VIX는 15.31에 머물렀다. 오늘 밤 미국 9월 CPI와 14～15일 ASML·TSMC 실적이 반도체 투자심리의 분기점이다.

**⑥ 코스닥 837.03(−1.43%), 장중 802.91에서 낙폭 축소**
코스닥은 823.69로 출발해 한때 802.91까지 밀렸지만 외국인(+1,339억원)·기관(+459억원) 순매수로 837.03까지 회복했다. 주성엔지니어링(+4.35%)·리노공업(+2.94%)·HPSP(+2.62%)·피에스케이(+6.50%)·원익IPS(+0.46%) 등 장비·부품주가 반등을 이끈 반면 알테오젠(−3.67%)·에코프로비엠(−2.16%)·올릭스(−14.03%)는 약했다. 시총 미달 기업 상장폐지 유예 소식에 형지I&C·뉴인텍·예선테크 등 초소형주 상한가가 이어졌다.

## 1. 업종별 흐름

**상승 업종** — 전기제품(+2.04%)·건강관리기술(+1.93%)·방송과엔터테인먼트(+1.70%)·기타금융(+1.70%)·무역회사와판매업체(+1.49%)·소프트웨어(+1.31%)·카드(+0.84%)·무선통신서비스(+0.82%)·해운사(+0.67%)만 올랐다. 전기제품은 LG에너지솔루션(+3.64%)이 3분기 영업이익 7,560억원으로 ESS 수익성을 확인시키며 이끌었고, 엘앤에프(+3.18%)는 LG엔솔과의 첫 LFP 양극재 계약이 더해졌다. 방송·엔터는 하이브(+3.64%), 소프트웨어는 AI 보안 ETF가 한 달 수익률 1위에 오른 가운데 안랩(+12.31%)이 주도했다. 금융은 신한금융의 롯데손보 인수(6,933억원)에 롯데손해보험(+9.66%), 메리츠금융지주(+1.69%)가 강했다.

**하락 업종** — 반도체와반도체장비(−7.38%)·화장품(−6.96%)·생명과학도구(−5.39%)·전자장비와기기(−5.27%)·인터넷과카탈로그소매(−5.15%)·생명보험(−5.03%)·복합기업(−4.23%)·생물공학(−3.80%)·가정용품(−3.45%)·전자제품(−3.41%)·통신장비(−3.25%)가 약했다. 반도체는 SK하이닉스(−9.28%)·삼성전자(−6.59%)·한미반도체(−7.44%), 화장품은 에이피알(−18.89%)·한국콜마(−6.82%)·달바글로벌(−7.34%)·실리콘투(−6.45%)가 낙폭을 키웠다. 전자장비는 삼성전기(−7.13%)·LG이노텍(−5.32%)·이수페타시스(−2.98%), 복합기업은 SK(−7.22%)·SK스퀘어(−11.89%)·삼성물산(−5.25%) 등 반도체 지분가치 연동 지주사가 약했다. 바이오는 올릭스(−14.03%)가 뉴질랜드 임상 2a상 반려에 급락했다.

**시장의 시선** — 반도체 대형주 실적은 사상 최대인데도 '중국 추격'과 'AI 투자 과열' 논란에 외국인이 6거래일 연속 매도하며 지수는 7월 폭락장 수준으로 되돌아갔다. 외국인이 코스피 대형주를 팔면서도 코스닥 소부장은 사들인 점은 메모리 수요보다 쏠림·밸류에이션을 문제 삼는 매도라는 해석을 낳는다. 2차전지는 ESS 실적·LFP 국산화로 주도 업종 교체 기대가 나오고, 화장품·자동차는 환율에 따른 3분기 눈높이 하향이 이어질 수 있다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 46종목

*10/13 정규장 확정 등락률 기준. 저녁판과 같은 종목·뉴스가 다시 나오며, 밤사이 새로 나온 뉴스는 본문에 덧붙였다. ★ 필수 편입(시총 1,000억원 이상·+10% 이상) 8종목을 모두 담았다.*

**1. SK하이닉스 (000660) 1,456,000원 · 1,063조 5,969억원 · −9.28% — CXMT 차세대 D램 예고·외국인 매도에 급락, 증권가 3Q 영업익 78조～79조원 추정**
SK하이닉스는 중국 CXMT가 4F² 구조 차세대 D램을 먼저 출시하겠다고 밝힌 데다 간밤 미국 반도체 지수가 2.67% 내린 여파로 9.28% 급락했고, 거래대금은 7조9,823억원으로 시장 1위였다. 장중 한때 10% 넘게 빠졌으며, 전문가들은 HBM 기술 격차는 2～3년이고 CXMT의 양산성은 미지수라면서도 낸드는 턱밑까지 추격당했다고 평가했다. 하나증권은 이날 3분기 매출 99조2,000억원, 영업이익 77조9,000억원(+29% QoQ)을 전망하며 DRAM 가격 가정을 21%로 올렸고, SK증권은 영업이익 79조원과 목표주가 400만원을 유지했다. 이달 하순 3분기 실적 발표가 '피크아웃' 논란을 가를 첫 시험대다. [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: SK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261012_SK_196606.pdf) · [리포트: SK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261012_SK_1137317.pdf)

**2. 삼성전자 (005930) 234,000원 · 1,368조 292억원 · −6.59% — 중국발 메모리 우려에 하락, 장 마감 뒤 이재용 회장 2.6조원 증여·AMD 협력 공개**

야스는 19.41% 올랐지만 거래대금은 97억원으로 크지 않았고, 최근 96시간 관련 보도는 없었다. 지난달 LG디스플레이가 차세대 '플립(FLiPP)' 기술용 증착기 공급사로 야스와 선익시스템을 논의 중이라는 보도가 있었고, 이날 상승도 OLED 장비 수주 기대가 재부각된 것으로 해석된다. 최대주주 지분이 7월 반대매매로 42.58%에서 18%대로 줄어 경영권 방어 우려가 남아 있다. 최신 커버 리포트(KIRS, 9월)는 8세대 이상 증착기·증착원 양산 경험과 중국향 수주를 투자 키워드로 꼽았다. [리포트: KIRS 2026-09-30](https://woooty69.github.io/hw-pdf-arch-022/%EC%95%BC%EC%8A%A4%EF%BC%BB255440%EF%BC%BD_20260930_KIRS_196371.pdf) · [리포트: Stunning Value Research 2026-09-14](https://woooty69.github.io/hw-pdf-arch-019/%EC%95%BC%EC%8A%A4%EF%BC%BB255440%EF%BC%BD_20260914_Stunning%2BValue%2BResearch_1130926.pdf)

**43. HLB바이오스텝 (278650) 5,950원 · 1,037억원 · +12.05% — 50억원 규모 AI 기반 동물대체시험 국책과제 참여**
HLB바이오스텝은 12.05% 올라 거래대금 390억원을 기록했다. 산업통상부가 추진하고 한국산업기술기획평가원(KEIT)이 전문기관으로 참여하는 바이오산업기술개발사업의 AI 기반 동물대체시험법(NAMs) 국책과제에 참여한다고 13일 밝혔으며 과제 규모는 총 50억원이다. 비임상 CRO 사업에 AI·대체시험 역량을 더하는 계기로 평가됐다. 시가총액은 1,037억원으로 ★ 기준을 간신히 넘겼다. 증권사 커버 리포트 없음.

**44. 네오티스 (085910) 21,700원 · 2,993억원 · +11.40% — 현대차증권 목표가 3.1만원으로 24% 상향, 마이크로비트 쇼티지 수혜**
네오티스는 11.40% 올라 거래대금 103억원을 기록했다. 현대차증권은 PCB용 마이크로비트 공급 부족과 고부가 기판 비중 확대에 따른 수혜가 이어질 것이라며 투자의견 매수를 유지하고 목표주가를 기존 대비 24% 높은 3만1,000원으로 제시했다. 지난 9월 리포트에서는 글로벌 피어가 12개월 선행 PER 40～50배를 적용받는다며 쇼티지가 향후 몇 년간 지속될 것으로 봤다. 권상훈 대표가 9월 자사주를 추가 매입하는 등 책임경영 행보도 이어졌다. [리포트: Hyundai Motor 2026-09-02](https://woooty69.github.io/hw-pdf-arch-017/%EB%84%A4%EC%98%A4%ED%8B%B0%EC%8A%A4%EF%BC%BB085910%EF%BC%BD_20260902_Hyundai%2BMotor_1128300.pdf) · [리포트: MERITZ 2026-08-27](https://woooty69.github.io/hw-pdf-arch-016/%EB%84%A4%EC%98%A4%ED%8B%B0%EC%8A%A4%EF%BC%BB085910%EF%BC%BD_20260827_MERITZ_1126766.pdf) · [리포트: Hanyang 2026-08-12](https://woooty69.github.io/hw-pdf-arch-015/%EB%84%A4%EC%98%A4%ED%8B%B0%EC%8A%A4%EF%BC%BB085910%EF%BC%BD_20260812_Hanyang_1122681.pdf)

**45. 에스티아이 (039440) 27,450원 · 4,257억원 · +10.24% — 급락장 속 반도체 인프라 장비 강세, CCSS 수주 모멘텀 기대**
에스티아이는 10.24% 올라 거래대금 128억원을 기록했다. 반도체 공정용 케미컬 공급 장치(CCSS)가 매출의 약 90%를 차지하며, 삼성전자·SK하이닉스·마이크론 등의 팹 인프라 투자 확대 수혜주로 꼽힌다. 외국인이 코스닥 소부장을 사들인 데다 호남 반도체 클러스터 등 신규 팹 착공 기대가 클린룸 선행 장비인 CCSS에 우호적으로 작용했다. 최신 커버 리포트(삼성증권, 4월)는 하반기로 갈수록 수주 모멘텀이 강화되면 리레이팅이 가능하다고 평가했다. [리포트: Samsung 2026-04-20](https://woooty69.github.io/hw-pdf-arch-004/%EC%97%90%EC%8A%A4%ED%8B%B0%EC%95%84%EC%9D%B4%EF%BC%BB039440%EF%BC%BD_20260420_Samsung_1089463.pdf)

**46. 세미티에스 (0017J0) 3,695원 · 1,114억원 · +10.46% — 뉴스 없이 급등, 반도체 Fab 물류·질소퍼지 장비주 소부장 반등 동참**
최근 96시간 관련 기사가 확인되지 않은 가운데 시총 1,114억원 규모의 소형주가 10.46% 올라 ★ 필수 편입 종목에 들었다. 회사는 반도체 전공정 Fab에서 웨이퍼 이송 박스(FOUP) 물류를 최적화하는 클린컨베이어시스템과 FOUP 내부에 질소를 주입해 산화를 막고 수율을 높이는 질소퍼지시스템을 공급한다. DS투자증권은 9월 리포트에서 클린컨베이어를 OHT와 병행하면 병목이 사라져 반송량이 3배 높아지고, 기존 Fab에도 설치할 수 있어 고객사가 빠르게 늘 수 있다고 분석했다. 이날 외국인이 코스닥 반도체 소부장을 사들이며 주성엔지니어링(+4.35%)·피에스케이홀딩스(+9.18%) 등 장비주가 반등한 흐름에 동참했지만, 거래대금은 64억원으로 크지 않아 변동성에 유의할 필요가 있다. [리포트: DS 2026-09-11](https://woooty69.github.io/hw-pdf-arch-019/%EC%84%B8%EB%AF%B8%ED%8B%B0%EC%97%90%EC%8A%A4%EF%BC%BB0017J0%EF%BC%BD_20260911_DS_1130534.pdf)

## 4. 일정·관전 포인트

**오늘(10/14, 수) 국내 일정**
- 반도체대전(SEDEX 2026) 개막(14일), 한국전자전(KES 2026) 진행(～16일, 코엑스)
- 포스코 노사 임금 본교섭 재개(14일 오후, 포항 본사), 정의선 현대차그룹 회장 취임 6년(14일)
- 국정감사 진행 — 방사청(LIG D&A 제재·KAI 민영화), 원안위(SMR 제조허가) 등 후속 발언 주목
- IPO: 크리에이츠 기관 수요예측(10/12～16, 공모가 밴드 15,000～18,000원), 영광·래블업 공모 절차 진행
- 이번 주 국내: 삼성바이오로직스 폴리펩타이드그룹 공개매수 확정 중간결과(16일), 셀트리온 세계알레르기학회 참가(15～18일), 한화머시너리앤서비스홀딩스 공개매수 진행(～10/30) · 27～29일 SK하이닉스 3분기 실적 예정

**해외 일정 (한국시간)**
- 14일 밤 미국 9월 CPI, 중국 9월 CPI/PPI — 연준 금리 경로와 아시아 반도체 수요 심리 확인
- 14～15일 ASML·TSMC 3분기 실적, 15일 미국 9월 PPI·소매판매·베이지북, 16일 워시 연준의장 연설 · 그 밖의 연준 인사 발언 일정은 확인 불가

### 🇰🇷 오늘 개장 관전 포인트
1. 밤사이 SOX가 −0.23%로 낙폭을 줄인 만큼 삼성전자·SK하이닉스의 시초가 반등과 외국인 매도 강도 둔화 여부가 첫 관문이다.
2. **외국인 매도 7일째 이어질까** — 외국인은 10/13에 4조5,789억원을 팔아 6거래일 연속 순매도했고 올해 누적 순매도가 200조원을 넘었다. 오늘 밤 미국 CPI와 ASML·TSMC 실적 전까지는 관망 속 변동성이 클 수 있다.
3. **'중국 추격' 공포 vs 사상 최대 실적** — 삼성전자 3분기 영업이익 107조4,000억원, SK하이닉스 3분기 77조9,000억～79조원 추정에도 두 회사 P/E는 4배 이하로 떨어졌다. SEDEX 2026에서 나오는 차세대 D램·HBM 로드맵 메시지가 심리를 되돌릴지 주목된다.
4. **3분기 프리뷰 하향 종목의 변동성** — 에이피알(−18.89%)처럼 컨센서스 하회 전망이 나오면 주가가 크게 흔들리고 있다. 현대차·기아는 파업·환율 탓에 목표가가 줄줄이 내려갔고, OCI홀딩스도 컨센서스 하회 전망이 나왔다.
5. **지배구조·M&A·테마 종목** — 이재용 회장의 삼성전자 지분 증여(약 2조6,000억원), 신한금융의 롯데손보 인수(6,933억원), 삼성바이오의 폴리펩타이드 공개매수 등 장 마감 뒤 나온 이벤트가 관련 종목 시가에 반영될 전망이다. 호남 반도체 테마(서산·금호전기)는 이상 과열 경고가 나와 급등락에 유의해야 한다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
