## 🗓 시장 요약

**① 나스닥 26,008.86(−2.60%)·S&P500 7,663.43(−1.21%)·다우 52,867.98(+0.02%) — AI 지출 경계 재점화, 기술주 급락·경기방어주 버팀목**
나스닥은 **26,008.86(−694.00, −2.60%)**, S&P500은 **7,663.43(−93.74, −1.21%)**로 3거래일 연속 상승을 멈췄고, 다우는 **52,867.98(+11.89, +0.02%)**로 간신히 플러스를 지켰다. 나스닥100이 28,958.69(−2.90%)로 가장 약했고 러셀2000은 2,784.03(+0.38%)로 오히려 올랐다. VIX는 18.97(+9.59%)로 뛰었다. 메타가 분기 설비투자로 영업현금흐름보다 많은 \$349.1억을 쓰고 장기 임차·계약 약정이 \$8,100억으로 불어난 사실이 드러나며 'AI 지출이 통제를 벗어났다'는 걱정이 되살아났고, 램리서치의 공급 제약 경고가 반도체 장비주 급락으로 번졌다. 장중 집계 기준 나스닥100에서 사라진 시가총액의 93%가 AI·반도체 26개 종목에서 나왔다. 반면 P&G·록히드마틴 등 실적이 좋은 경기방어·방산주와 애플(+1.23%)이 다우를 받쳤다.

**② 2년물 4.65%(−16.0bp)·10년물 4.96%(−17.0bp)·30년물 5.29%(−13.0bp) — 10년물 한 달 만에 5% 아래로, 2년여 만의 최대 낙폭권**
미 재무부 기준 2년물은 **4.65%(−16.0bp)**, 10년물은 **4.96%(−17.0bp)**, 30년물은 **5.29%(−13.0bp)**로 일제히 크게 내렸다. 10년물은 장중 5.115%에서 4.939%까지 밀리며 2년여 만에 가장 큰 하루 낙폭권에 들었고 약 한 달 만에 5%를 밑돌았다. AI 인프라 투자 둔화 우려가 유가발 물가 걱정을 압도하면서 주식에서 채권으로 자금이 옮겨 갔다. 지난주 신규 실업수당 청구 건수는 19.4만 건으로 3개월 만에 가장 적어 고용은 여전히 탄탄했고, 이날 5년물 물가연동국채(TIPS) 입찰도 치러졌다.

**③ WTI \$99.28(+2.19%)·브렌트 \$113.02(+3.86%) — 미·이스라엘의 이란 재공격 계획 보도·사우디 공항·유전 피격에 5월 이후 최고**
브렌트 12월물은 장중 \$113.50까지 오른 뒤 **\$113.02(+3.86%)**로 마감해 5월 이후 최고 수준을 기록했고, WTI 12월물은 장중 \$100.17까지 올랐다가 **\$99.28(+2.19%)**로 끝났다. 뉴욕타임스가 미국과 이스라엘이 11월 3일 중간선거 뒤 이란 재공격 계획을 세웠다고 보도했고, 사우디아라비아가 담맘 공항과 아람코 유전이 공격받았다고 밝힌 것이 유가를 밀어 올렸다. 브렌트는 2월 말 이란 전쟁 시작 이후 50% 넘게 올랐다. 위험회피에도 금은 \$4,043.70(−2.56%)로 내렸고 비트코인은 3.8% 내린 \$81,000대였다.

**④ AI·반도체 — SOX 10,731.98(−6.72%)·램리서치 −11.76%·SK하이닉스 ADR −8.07%… 장비·메모리 동반 급락**
반도체지수는 장중 11,140.33에서 10,666.41까지 밀린 뒤 **10,731.98(−6.72%)**로 마감해 전날 상승분(+1.97%)을 모두 반납하고도 더 내렸다. 공급 제약을 경고한 램리서치(LRCX)가 \$230.15(−11.76%)로 가장 크게 내렸고 KLA(KLAC) \$147.83(−9.55%)·어플라이드머티리얼즈(AMAT) \$375.58(−8.16%) 등 장비주가 동반 급락했다. 메모리주도 샌디스크(SNDK) \$1,260.93(−8.51%), 마이크론(MU) \$856.49(−6.26%), SK하이닉스 ADR(SKHY) \$131.69(−8.07%)로 약했다. AMD(AMD)는 \$507.93(−8.10%), 인텔(INTC)은 \$85.49(−8.04%), 엔비디아(NVDA)는 \$212.21(−4.40%), 브로드컴(AVGO)은 \$323.24(−4.31%)였다. 부채 의존도가 높은 네오클라우드 코어위브(CRWV)는 자본 조달 비용 우려에 \$55.60(−10.06%)로 밀렸다.

**⑤ 실적·이슈 — 메타 −6.98%·테슬라 −3.08%·스페이스X −9.14%, 스포티파이 +11.10%·블랙스톤 +8.38%·록히드마틴 +6.96%·P&G +5.59%**
메타(META)는 매출 26% 증가에도 설비투자 부담에 **\$648.85(−6.98%)**로 급락했고, 테슬라(TSLA)는 올해 설비투자 계획을 \$250억 이상에서 \$200억 이상으로 낮추면서도 2027~2028년 옵티머스·사이버캡 투자 확대를 예고해 **\$374.58(−3.08%)**로 내렸다. 스페이스X(SPCX)는 보호예수 해제일에 **\$144.75(−9.14%)**로 전날 급등분의 절반 이상을 반납했다. 모더나(MRNA)는 흑색종 백신 임상 결과가 학회 발표 전 소셜미디어에 유출돼 기대에 못 미친다는 평가 속에 **\$202.63(−17.57%)**로 폭락했다. 반면 3분기 매출이 16% 늘고 매출총이익률이 33.0%로 오른 스포티파이(SPOT)는 **\$583.66(+11.10%)**, 4분기 성과보수 회수 전망을 밝힌 블랙스톤(BX)은 **\$118.75(+8.38%)**, 연간 가이던스를 두 분기 연속 올린 록히드마틴(LMT)은 **\$589.91(+6.96%)**, 매출·이익이 예상을 넘은 P&G(PG)는 **\$165.60(+5.59%)**로 올랐다.

**⑥ 🇰🇷 SK하이닉스 ADR \$131.69(−8.07%)·SOX −6.72%·코스피200 야간선물 834.60(−2.61%) — 미국 반도체 급락에 국내 반도체 대형주 부담**

해석하면 금요일 국내 증시는 SOX 급락과 SK하이닉스 ADR −8.07%를 반영해 반도체 대형주 중심의 약세 출발이 불가피해 보인다. 다만 미국채 10년물이 5% 아래로 내려온 점은 성장주 밸류에이션 부담을 덜어 주는 요인이고, 유가 \$113선 브렌트는 정유·방산에는 우호적이지만 항공·화학에는 원가 부담이다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 메타 (META) −6.98% — 3분기 설비투자 \$349.1억이 영업현금 \$327.9억 초과, 장기 약정 \$6,280억→\$8,100억 급증**
메타는 시가 \$675.79에서 저가 \$639.69(−8.29%)까지 밀린 뒤 \$648.85(−\$48.67, −6.98%)로 마감했다. 전날 발표한 3분기 광고 매출은 26% 늘었지만 같은 날 낸 분기보고서(10-Q)에서 데이터센터·장비에 \$349.1억을 써 영업으로 번 현금 \$327.9억을 넘어선 사실이 드러났다. 9월 말 기준 앞으로 지급할 임차·계약 약정도 6월 말 약 \$6,280억에서 약 \$8,100억으로 불었다. 2대1 주식 분할 발표도 주가를 받치지 못했고, 장중 집계에서 메타·마이크로소프트·아마존·알파벳 4개사 시가총액이 약 \$3,670억 줄었다.

**2. 테슬라 (TSLA) −3.08% — 2026년 설비투자 \$250억 이상→\$200억 이상으로 하향, 2027~2028년 옵티머스·사이버캡·테라팹 투자 확대 예고**
테슬라는 시가 \$374.03에서 고가 \$388.86(+0.62%)까지 올랐다가 \$374.58(−\$11.89, −3.08%)로 마감했다. 3분기 분기보고서에서 올해 설비투자 전망을 7월의 '\$250억 이상'에서 '\$200억 이상'으로 낮췄지만, 2027~2028년에는 옵티머스·사이버캡·테라팹 투자로 지출이 다시 늘어난다고 밝혀 AI·로봇 투자 부담이 부각됐다. 3분기 매출은 \$280.5억으로 컨센서스 \$281.3억에 부합했고 연구개발비가 \$11.3억 늘어 영업이익 \$7.2억을 웃돌았다. 전날 머스크의 스페이스X 합병 발언으로 오른 상승분(+3.41%)을 대부분 반납했다.

**3. 스페이스X (SPCX) −9.14% — 최대 13억 주 보호예수 해제일, 전날 실적 급등분 절반 이상 반납**
스페이스X는 시가 \$154.21에서 저가 \$143.21(−10.11%)까지 밀린 뒤 \$144.75(−\$14.56, −9.14%)로 마감했다. 이날은 상장 이후 최대 13억 주의 보호예수가 풀린 날이라 물량 부담이 컸고, 기술주 전반의 급락까지 겹쳤다. 전날에는 3분기 매출 \$145.8억(+161%)과 AI 컴퓨팅 매출 \$75.6억 발표로 +7.79% 올랐는데 그 절반 이상을 하루 만에 반납했다. 머스크가 언급한 테슬라와의 합병은 양사 사외이사 특별위원회가 논의 중이며 조건은 정해지지 않았다.

**4. 램리서치 (LRCX) −11.76% — 9월 분기 사상 최대 매출 \$82.2억에도 "공급 제약 없었다면 12월 분기 전망이 더 높았을 것", 중국 비중 급감 예고**
램리서치는 시가 \$234.62에서 저가 \$227.68(−12.70%)까지 밀린 뒤 \$230.15(−\$30.66, −11.76%)로 마감해 나스닥100에서 가장 크게 내렸다. 9월 분기 매출은 \$82.2억으로 전 분기 대비 22%, 전년 대비 54% 늘었고 비GAAP EPS는 \$2.20, 영업이익률은 처음으로 40%를 넘은 40.2%였다. 12월 분기 매출 가이던스는 \$86억(±\$4억), EPS \$2.33(±\$0.15)였지만, 더그 베팅어 CFO는 부품 부족과 클린룸 제약이 없었다면 전망이 "조금 더 높았을 것"이라고 밝혔다. 9월 분기 매출의 35%였던 중국 비중이 12월 분기에 크게 줄 것이라는 전망도 부담이 됐고, 회사는 2027년 전 세계 반도체 장비 투자가 \$2,000억을 넘을 것으로 봤다.

**5. 모더나 (MRNA) −17.57% — 흑색종 암백신 임상 결과 학회 전 유출, 고위험군 전이 위험 38% 감소에 '기대 미달' 평가**
모더나는 시가 \$240.06에서 저가 \$180.80(−26.45%)까지 폭락한 뒤 \$202.63(−\$43.18, −17.57%)로 마감했다. 토요일(24일) 유럽종양학회(ESMO) 발표를 앞두고 흑색종 암백신 임상 결과가 소셜미디어에 먼저 유출됐는데, 투자자 기대만큼 높지 않았다는 평가가 나왔다. TD코웬의 타일러 밴 뷰런 애널리스트는 백신이 고위험 흑색종 환자의 암 전이 위험을 표준 치료 대비 38% 줄였다고 정리했다. 주가는 첫 발표 뒤 100% 넘게 급등했던 터라 차익 실현 압력이 컸고, 장중 낙폭은 2018년 12월 상장 이후 최대 수준이었다.

**6. 스포티파이 (SPOT) +11.10% — 3분기 매출 €49.7억(+16%)·매출총이익률 33.0%, 4분기 영업이익 가이던스 €8.2억**
스포티파이는 시가 \$561.29에서 고가 \$588.88(+11.94%)까지 오른 뒤 \$583.66(+\$58.32, +11.10%)로 마감했다. 3분기 매출은 €49.69억으로 16%(환율 제외 14%) 늘었고 매출총이익률은 전년 대비 1.36%p 오른 33.0%로 회사 가이던스 32.9%를 넘었다. 월간 활성 이용자(MAU)는 7억 8,800만 명(+11%), 유료 구독자는 3억 600만 명(+9%)으로 구독자 가이던스를 100만 명 웃돌았고 영업이익은 €6.72억(+15%)이었다. 4분기에는 MAU 8억 1,800만 명, 매출 €52억, 매출총이익률 33.8%, 영업이익 €8.2억을 제시했다.

**7. 블랙스톤 (BX) +8.38% — 3분기 순실현이익 34% 감소에도 "4분기 성과보수 회수가 3분기 전체 순실현을 넘을 것", 2027년 기본보수 두 자릿수 성장 재확인**
블랙스톤은 시가 \$107.32에서 고가 \$118.93까지 오른 뒤 \$118.75(+\$9.18, +8.38%)로 마감했다. 3분기 순실현이익은 전년 대비 34%, 배당 가능 이익은 9% 줄어 숫자 자체는 약했다. 그러나 마이클 체이 CFO가 4분기 마감 예정 거래에서 나올 성과보수 회수액이 3분기 전체 순실현이익을 넘어설 것이라고 밝히고 2027년 기본 운용보수의 두 자릿수 성장을 재확인하자 매수세가 몰렸다. 스티븐 슈워츠먼 CEO는 변동성이 큰 외부 환경 속에서도 강한 분기였다고 평가했다.

**8. 록히드마틴 (LMT) +6.96% — 3분기 매출 \$207억(+11%)·EPS \$7.97, 수주잔고 사상 최대 \$2,920억·연간 가이던스 2분기 연속 상향**
록히드마틴은 시가 \$579.51에서 고가 \$607.99까지 오른 뒤 \$589.91(+\$38.40, +6.96%)로 마감했다. 3분기 매출은 \$207.1억으로 11% 늘었고 모든 사업부가 성장했으며, 순이익은 \$18.5억(+14%), 희석 EPS는 \$7.97(전년 \$6.95)였다. 수주잔고는 PAC-3 MSE 수주 \$525억을 포함해 사상 최대인 \$2,920억으로 2분기 말보다 27% 늘었다. 연간 가이던스는 매출 \$800억~820억, EPS \$30.35~30.75, 잉여현금흐름 \$78억~80억으로 두 분기 연속 올렸다. 다만 F-35 로트 20 선행 조달 비용이 승인 한도를 넘어선 점은 위험 요인으로 남았다.

**9. P&G (PG) +5.59% — 회계 1분기 매출 \$232.8억(+4%)·핵심 EPS \$2.00로 예상 상회, 유기적 매출 4% 성장**
P&G는 시가 \$162.14에서 고가 \$166.85까지 오른 뒤 \$165.60(+\$8.76, +5.59%)로 마감해 다우 상승을 이끌었다. 회계 1분기 매출은 \$232.8억으로 4% 늘어 예상 \$228.2억을 넘었고, 핵심 EPS는 \$2.00로 컨센서스 \$1.89를 웃돌았다. 유기적 매출은 시장 예상 약 2%를 넘는 4% 늘었고 판매량도 2% 증가했다. 회사는 연간 유기적 매출 성장률 1~3% 목표를 유지했지만 원자재 비용 부담 전망은 약 \$10억에서 약 \$14억으로 높였다. 샤일레시 제주리카르 CEO는 실행력을 높인 결과라고 설명했다.

**10. IBM (IBM) +0.26% — 3분기 매출 \$171억(+5%)·소프트웨어 +8%, 연간 잉여현금흐름 전망 상향**
IBM은 시가 \$241.24(−4.06%)로 약세 출발했다가 고가 \$256.27까지 반등한 뒤 \$252.11(+\$0.65, +0.26%)로 마감했다. 전날 발표한 3분기 매출은 \$171.0억으로 5%(환율 제외 6%) 늘었고 소프트웨어 매출은 \$78.0억으로 8% 늘었으며 레드햇은 11% 성장했다. 영업 EPS는 \$2.95로 11% 늘었고 3분기 잉여현금흐름은 \$30.3억이었다. 회사는 연간 매출 성장률 전망(환율 제외 4~5%)을 유지하고 잉여현금흐름이 전년보다 \$10억 이상 늘 것으로 전망을 높였지만, 메인프레임(IBM Z) 매출이 20% 줄어 장 초반 주가가 흔들렸다.
