**1. SK하이닉스 (000660) 1,190,000원 · 869조 2,859억원 · −6.81% — 거래대금 4.2조원 1위, 이틀 반등 뒤 6.8% 급락**
SK하이닉스는 1,190,000원(−6.81%)으로 마감해 120만원선을 내줬고 거래대금은 4조 2,312억원으로 시장 전체 1위였다. 프랑스 재정 불안과 미국 10년물 5.14% 재상승, AI 인프라 기업 자금조달 우려가 겹치며 외국인·기관이 반도체 대형주를 팔았다. 노무라가 목표가 470만원을 제시했다는 보도가 나왔지만, 기업거버넌스포럼은 솔리다임 미국 상장이 SK하이닉스 주주에게 손해라며 중단을 요구했고 한화투자증권은 솔리다임 상장이 성장과 주주가치 사이의 균형 문제라고 짚었다. 21일 아침에는 국민연금이 최근 3개월 반도체·조선 지분을 줄이고 석화·건설을 늘렸다는 분석과 SK하이닉스가 팹 건설 프로젝트 경력 인재 확보에 나섰다는 소식이 나왔다. [리포트: Hanwha 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261020_Hanwha_2653114.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf)

**2. 삼성전자 (005930) 209,000원 · 1,221조 8,722억원 · −4.13% — 21만원선 붕괴, KB "2027년 물량 80% 장기계약 확보"**
삼성전자는 209,000원(−4.13%)으로 21만원선 아래로 밀렸고 거래대금은 3조 3,687억원이었다. 다만 저녁판 집계에서 프로그램 매매로는 3,261억원 순매수가 들어와 SK하이닉스와 엇갈렸다. KB증권은 2027년 메모리 생산 예정 물량의 약 80%를 장기공급계약으로 이미 확보했고 HBM ASP가 100～150% 오를 것이라며 목표가 60만원을 제시했다. 신한투자증권은 9/23 이후 주가가 23.6% 빠졌지만 12개월 선행 EPS는 1.8% 올라 선행 PER이 3.4배까지 낮아졌다고 분석했다. [리포트: KB 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261020_KB_4010450923.pdf) · [리포트: KB 2026-10-15](https://woooty69.github.io/hw-pdf-arch-026/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261015_KB_1138464.pdf) · [리포트: KB 2026-10-13](https://woooty69.github.io/hw-pdf-arch-027/%5B%EA%B8%89%EB%9D%BD%20%EC%BD%94%EB%A9%98%ED%8A%B8%5D%20W%EC%9E%90%20%EB%B0%98%EB%93%B1%EC%9D%98%20%EB%91%90%20%EB%B2%88%EC%A7%B8%20%EB%B0%94%EB%8B%A5%20%ED%83%90%EC%83%89%EF%BC%BB005930%EF%BC%BD_20261013_KB_4010240010.pdf)

**4. 삼성SDI (006400) 555,000원 · 44조 7,250억원 · −6.25% — 전날 11% 급등 뒤 차익 매물, 대신 '2027 Top Pick'**
삼성SDI는 555,000원(−6.25%)으로 전날(+11.51%) 급등분 일부를 되돌렸고 거래대금은 4,037억원이었다. '중국 ESS 업체 미국 철수' 기대가 이어졌지만 지수 급락 속 2차전지 차익 매물이 나왔다. 대신증권은 2027년 연간전망에서 ESS 수주가 손익 개선으로 이어지는 턴어라운드를 예상하며 삼성SDI를 기아·한온시스템과 함께 Top Picks로 꼽았다. 21일 조선일보는 전력기기·ESS가 11월 3일 미국 중간선거의 수혜주가 될 수 있다고 보도했다. [리포트: Shinhan 2026-10-14](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1SDI%EF%BC%BB006400%EF%BC%BD_20261014_Shinhan_196693.pdf) · [리포트: Shinhan 2026-10-14](https://woooty69.github.io/hw-pdf-arch-026/%EC%82%BC%EC%84%B1SDI%EF%BC%BB006400%EF%BC%BD_20261014_Shinhan_1138104.pdf) · [리포트: Sangsangin 2026-10-13](https://woooty69.github.io/hw-pdf-arch-030/%EC%82%BC%EC%84%B1SDI%EF%BC%BB006400%EF%BC%BD_20261013_Sangsangin_4180794608.pdf)

**5. SK스퀘어 (402340) 724,000원 · 95조 5,130억원 · −7.18% — 솔리다임 상장 논란 확산, 얼라인 "하이닉스 지분가치 대비 저평가"**
SK스퀘어는 724,000원(−7.18%)으로 급락했고 거래대금은 3,419억원이었다. 기업거버넌스포럼이 SK하이닉스 자회사 솔리다임의 미국 상장 중단을 요구하는 등 '주주보호'가 핵심 쟁점으로 떠올랐다. 21일 새벽 한국경제TV는 행동주의 펀드 얼라인파트너스가 SK그룹 지주사의 시가총액이 보유한 하이닉스 지분 가치의 절반에도 못 미친다며 저평가 해소를 겨냥했다고 단독 보도했다. 중앙일보는 주가 하락에 증권사 목표가 하향 보고서가 상향의 4배에 이른다고 전했다. [리포트: SK 2026-09-30](https://woooty69.github.io/hw-pdf-arch-021/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260930_SK_1134363.pdf) · [리포트: Daishin 2026-07-13](https://woooty69.github.io/hw-pdf-arch-011/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260713_Daishin_1112316.pdf) · [리포트: BNK 2026-07-10](https://woooty69.github.io/hw-pdf-arch-011/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260710_BNK_1112101.pdf)

**6. 주성엔지니어링 (036930) 192,200원 · 8조 9,337억원 · −8.26% — 코스닥 거래대금 1위, 반도체 장비주 동반 급락**

**7. 한화에어로스페이스 (012450) 792,000원 · 40조 8,382억원 · −12.49% — KAI 인수설 국감 쟁점화·3Q 인도 이연 우려에 12% 급락**
한화에어로스페이스는 792,000원(−12.49%)으로 80만원선이 무너졌고 거래대금은 2,024억원이었다. 국정감사에서 KAI 최대주주인 수출입은행장이 'KAI 매각 계획은 없다'고 밝히고 KAI 사장도 한화의 경영 참여를 견제하면서 인수설이 쟁점으로 떠올랐다. DS투자증권은 루마니아·폴란드 K9 인도 이연과 환율 하락으로 3Q26 영업이익이 9,805억원으로 컨센서스(1.18조원)를 밑돌 것이라면서도 4분기 정상화를 기대하며 목표가 165만원을 제시했다. 21일 국민일보는 AI 무인함정 시대를 맞아 K방산이 미국 시장 선점에 나섰다고 보도했다. [리포트: DS 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%ED%95%9C%ED%99%94%EC%97%90%EC%96%B4%EB%A1%9C%EC%8A%A4%ED%8E%98%EC%9D%B4%EC%8A%A4%EF%BC%BB012450%EF%BC%BD_20261020_DS_4140023752.pdf) · [리포트: Korea Investment 2026-10-16](https://woooty69.github.io/hw-pdf-arch-028/%ED%95%9C%ED%99%94%EC%97%90%EC%96%B4%EB%A1%9C%EC%8A%A4%ED%8E%98%EC%9D%B4%EC%8A%A4%EF%BC%BB012450%EF%BC%BD_20261016_Korea%2BInvestment_4072041610.pdf) · [리포트: Samsung 2026-10-08](https://woooty69.github.io/hw-pdf-arch-024/%ED%95%9C%ED%99%94%EC%97%90%EC%96%B4%EB%A1%9C%EC%8A%A4%ED%8E%98%EC%9D%B4%EC%8A%A4%EF%BC%BB012450%EF%BC%BD_20261008_Samsung_1136803.pdf)

**8. LG에너지솔루션 (373220) 411,500원 · 96조 2,910억원 · −4.75% — 전날 반등 뒤 되밀려, 엘앤에프 LFP 계약 기대는 유효**

  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
