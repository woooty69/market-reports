## 🗓 주말 요약

**① 한 주의 결론은 '선거 랠리는 하루, 반도체 투매가 한 주를 지배했다'**
주간으로 나스닥 **−3.37%**, S&P 500 **−2.68%**, 다우 **−0.94%**, 러셀 2000 **−2.05%**로 모두 내렸고, SOX는 **−12.15%**, SK하이닉스 ADR은 **−14.66%(\$127.34)**로 지수보다 훨씬 크게 빠졌다. 경로는 극단적이었다. 수요일(11/4)에는 민주당의 상·하원 장악으로 분점 정부가 확정되자 다우가 **+3.03%(53,356.12)** 뛰었지만, 바로 다음 날 목요일(11/5)에 나스닥 **−5.52%**, S&P 500 **−4.36%**, SOX **−12.25%**의 투매가 나오며 선거 랠리를 하루 만에 지웠다. 금요일 SOX **+4.21%** 되돌림은 장 후반 상승폭이 줄어 끝났고, VIX는 **25.64**로 선거 직후 16.77에서 크게 올라선 채 한 주를 마쳤다.

**② 반도체 붕괴의 방아쇠는 '메모리 가격발 수요 둔화'와 '연말 수익 확정'**
퀄컴이 메모리 부족으로 스마트폰 수요가 꺾였다며 약한 가이던스를 내놓은 것이 목요일 매도의 직접 계기였다. AMD **−17.43%**, 마이크론 **−17.30%**, 브로드컴 **−10.64%**, 엔비디아 **−9.19%**가 하루에 빠졌고 나스닥과 엔비디아는 200일 이동평균선 아래로 내려갔다. 노무라의 찰리 매켈리것은 헤지펀드가 연말 전에 주도주부터 던지는 "장군 사냥"이라며 펀더멘털 악화가 아니라고 봤다. 직전 주 말 인텔이 던진 '메모리 가격 상승 → PC 수요 둔화' 논리까지 겹치며, 메모리 강세가 오히려 고객사 수요를 깎는다는 역설이 시장의 새 걱정거리가 됐다.

**③ 유가는 주간 −12%대 — 종전 기대가 기뢰 사고보다 컸다**
WTI는 10/30 **\$103.01**에서 금요일 **\$90.52**로 주간 **−12.13%** 내렸다. 월요일(11/2) 이란·카타르 협상과 트럼프 대통령의 외교 해결 의지에 **−7.79%**, 수요일(11/4) 선거 결과에 따른 종전 기대로 **−7.89%** 급락했고, 브렌트도 수주 만에 \$100 아래로 내려왔다. 금요일에는 호르무즈 유조선 기뢰 사고 주장에도 보합에 그쳤다. 유가 하락은 인플레이션 부담을 덜었지만, 금요일 고용 서프라이즈가 그 효과를 상당 부분 상쇄했다.

**④ 고용 16만5,000명 — 12월 인상 시나리오가 살아남았다**
10월 비농업 고용은 **16만5,000명**으로 예상(6만 명 안팎)을 크게 웃돌았고 실업률은 **4.1%**로 낮아졌다. 2년물은 금요일 **4.51%(+5.0bp)**로 올랐지만 주간으로는 목요일 안전자산 쏠림(−12.0bp) 덕에 **−0.05%p**, 10년물은 **4.86%**로 주간 **−0.08%p**였다. 벨웨더 웰스의 클라크 벨린은 여전히 12월 금리 인상을 예상했다. 다음 주 10월 CPI가 이 시나리오의 첫 시험대다.

**⑤ 실적 장세는 '가이던스'가 갈랐다**
AMD는 3분기 매출 **\$134억(+45%)**과 "2027년 매출 80% 이상 성장" 전망에도 목요일 −17.43%를 맞은 뒤 금요일 **+11.04%(\$449.04)**로 되돌렸다. 에어비앤비는 매출 **\$48억7,000만(+19%)**·대규모 자사주 매입으로 **+11.67%**, 아이렌은 분기 AI 클라우드 매출 **\$2억**으로 **+20.02%**, 클라우드플레어는 가이던스 상향으로 **+9.86%** 올랐다. 반면 드래프트킹스 **−21.30%**, 액손 **−18.18%**, 아틀라시안 **−16.15%**처럼 전망을 낮춘 종목은 실적 숫자와 무관하게 크게 맞았다. 앞서 수요일에는 데이터센터 설비 시공 업체 컴포트시스템즈가 **−15.08%**, 코어위브가 **−9.90%**로 민주당 의회의 AI 규제 우려를 가장 먼저 반영했다.

**⑥ 한국은 '수출 +93.7%'로 시작해 '코스피 −6.0%'로 끝났다**
주 초 발표된 10월 수출은 **1,152억8,000만달러(+93.7%)**, 반도체 수출은 **+259%**였지만, 주가는 메모리 수요 둔화 논리를 먼저 반영했다. 미국 목요일 투매가 반영된 금요일(11/6) 코스피는 **−6.0%**, 5일 누적 **−11.7%**였고, 상승 365·하락 2,068종목으로 거의 전 종목이 빠졌다. 외국인은 코스피 현물을 하루 **2조6,892억원**, 5일 **10조4,093억원** 순매도했지만 코스피200 선물은 5일 **+12,326계약** 순매수해 현물과 선물이 엇갈렸다. 금요일 밤 미국 반도체 반등(SOX +4.21%)이 월요일 첫 반영분이다.

## 📰 섹션 1. 한 주간(11/2~11/6) 주요 뉴스 5선

**1. 민주당 상·하원 장악 — 분점 정부 랠리 하루, 그다음은 AI 규제 우려**
11/3 중간선거에서 민주당이 하원과 상원을 모두 가져가며 분점 정부가 확정됐다. 수요일 다우는 **+3.03%(53,356.12)**, S&P 500은 **+1.58%**, VIX는 **16.77(−19.49%)**로 정책 불확실성 해소에 반응했다. 그러나 같은 날 SOX는 **−3.13%**, 코어위브 **−9.90%**, 컴포트시스템즈 **−15.08%**로 AI 인프라주가 먼저 빠졌다. 출구조사에서 응답자의 절반 이상이 데이터센터를 투표의 '핵심 또는 주요 요인'으로 꼽았다는 집계가 나왔고, 전기요금·용수 사용이 쟁점이었다. 골드만삭스는 미국 내 계획된 데이터센터 용량의 약 **45%**가 규제 가능성에 노출돼 있다고 추산했다.
**투자자 함의:** 법안 하나로 건설을 멈추기는 어렵다는 것이 다수 의견이지만, 청문회·조사·주 단위 규제가 늘면 AI 인프라 투자의 요구 수익률이 오른다. 수혜와 피해가 갈렸다 — 태양광·재생에너지는 선거 직후 올랐고, 데이터센터 리츠·AI 클라우드·전력 시공은 할인율 부담을 받는다. 국내로는 전력기기·데이터센터 냉각·기판주가 미국 규제 뉴스에 같은 방향으로 흔들릴 수 있다.

**2. 목요일 AI 투매 — SOX −12.25%, VIX +70.62%**
11/5 나스닥은 **−5.52%(24,315.00)**, S&P 500은 **−4.36%**로 2025년 4월 관세 충격 이후 최악의 하루를 보냈다. SOX는 **−12.25%(9,011.14)**, VIX는 **28.34(+70.62%)**로 2년여 만의 최대 하루 상승폭이었다. 퀄컴의 약한 가이던스(메모리 부족 → 스마트폰 수요 둔화)가 계기였고, 반다 리서치는 개인 투자자가 오후 3시 전까지 개별 주식을 **\$3억5,800만** 순매도해 2020년 3월 이후 최대 순매도일을 향한다고 집계했다. 엔비디아는 −9.19%로 2025년 1월 딥시크 충격 이후 최악의 하루였다.
**투자자 함의:** 노무라는 포지션 정리, 반다는 개인의 항복으로 봤다 — 둘 다 '수급발 급락'이라는 점에서는 같다. 금요일 반등에서 마이크론·샌디스크·엔비디아가 시가보다 낮게 끝난 것은 메모리 쪽 매물이 아직 남았다는 신호다. 야데니 리서치는 급락을 "매수 기회"로 보고 연말 S&P 500 목표 **7,900**을 유지했다.

**3. 유가 \$103 → \$90 — 이란 협상과 선거가 끌어내렸다**
이란 아락치 외무장관은 10/31(토) 호르무즈를 **이틀 안에** 다시 여는 수정안을 냈고, 카타르 중재 협상이 도하에서 이어졌다. WTI는 11/2 **−7.79%(\$96.01)**, 11/4 **−7.89%(\$88.51)**로 두 차례 급락했고 브렌트는 \$95.04로 수주 만에 \$100 아래로 내려왔다. 11/5에는 종전 협상 불확실성에 +2.73% 되올랐고 금요일은 **\$90.52** 보합으로 마감했다.
**투자자 함의:** 유가가 \$100 위에서 \$90으로 내려오면서 인플레이션 기대와 장기 금리의 상방 압력이 줄었다. 국내에서는 정유·조선 같은 유가 수혜주에 역풍, 항공·화학·운송에 숨통이 트이는 구간이다. 다만 주말 사이 미국의 케심섬 공습이 확인돼(섹션 2) 월요일 유가는 다시 위험 프리미엄을 붙일 수 있다.

**4. 10월 고용 16만5,000명·실업률 4.1% — 금리는 다시 올랐다**
10월 비농업 고용은 예상(6만 명 안팎)의 두 배를 훌쩍 넘는 **16만5,000명**, 직전 3개월 평균은 **13만7,000명**이었고 실업률은 **4.1%**(예상 4.2%)였다. 미 재무부 기준 2년물은 금요일 **4.51%(+5.0bp)**, 10년물 **4.86%(+2.0bp)**, 30년물 **5.26%(+1.0bp)**로 올랐다. 케빈 해싯 국가경제위원회 위원장은 "노동 수요가 치솟고 있다"고 했다. 주 중 ISM 제조업지수는 **55.5**, 9월 JOLTS 구인은 **750만 건**으로 경기 지표가 고르게 강했다.
**투자자 함의:** 강한 고용은 침체 우려를 덜지만 12월 인상 가능성을 살려 둔다. 주 초 76%대였던 12월 인상 확률이 다시 높아질 경우, 달러 강세와 신흥국 자금 이탈이 반도체 투매 뒤의 한국 수급을 더 누를 수 있다. 다음 주 CPI와 PPI가 같은 방향이면 2년물 4.6%대 복귀가 시장의 기본 시나리오가 된다.

**5. 메모리 역설 — 인텔·퀄컴이 같은 말을 했다**
직전 주 말 인텔이 메모리 가격 상승에 따른 PC 수요 둔화를 경고했고, 목요일 퀄컴이 메모리 부족으로 스마트폰 수요가 꺾였다며 약한 가이던스를 내놨다. 마이크론은 목요일 **−17.30%** 뒤 금요일 반등에도 **\$690.00**에 머물렀고, SK하이닉스 ADR은 **\$127.34(주간 −14.66%)**로 한 주를 마쳤다. 반면 한국 10월 반도체 수출은 **+259%**로 공급자 쪽 숫자는 사상 최강이다. AMD는 3분기 매출 **\$134억**으로 AI 수요가 꺾이지 않았음을 보여 줬다.
**투자자 함의:** 시장은 '메모리 가격이 너무 올라 완제품 수요를 죽인다'는 2차 효과를 가격에 넣기 시작했다. 공급자(메모리)의 이익 정점 논쟁이 다시 붙었다는 뜻이고, 국내 메모리 대형주는 수출 숫자보다 고객사 가이던스에 더 민감해진 국면이다. 다음 주 확인할 것은 PC·스마트폰 업체들의 추가 코멘트와 메모리 현물가 흐름이다.

## 🌙 섹션 2. 휴장·주말 신규 뉴스 5선

**1. 트럼프, 이란 케심섬 '소규모 공습' 확인 — "그들은 합의를 원한다"**
트럼프 대통령은 미군이 호르무즈 해협의 이란 케심섬 방공 체계에 "소규모 공습"을 했다고 확인했다. 공습은 현지 시각 11/6 늦게 이뤄졌고, 이란 언론은 수자 지역에 미사일 2발이 떨어졌다고 보도했다. 이란은 미군 무인기를 격추했다고 주장했다. 트럼프는 "지금 그들과 협상 중이고 그들은 합의를 원한다", "이란과 많은 진전을 이뤘다"고 말했지만 구체 내용은 밝히지 않았다. 미 중부사령부는 상황이 "비교적 평온하다"고만 했다.
**관전 포인트:** 공습과 협상 발언이 동시에 나오는 '압박 속 협상' 구도가 이어졌다. 공습 규모가 제한적이라 월요일 유가 반응도 제한적일 가능성이 크지만, 금요일 기뢰 사고 주장과 겹쳐 WTI \$90 아래로의 추가 하락은 막는 재료다. 협상 진전 발표가 나오면 유가 하락, 공습 확대면 반등이라는 비대칭이 국내 정유·항공주를 흔든다.

**2. 카타르 "협상 결렬 보도는 거짓" — 이란은 해협 재개 7개 조건 제시**
카타르 외무부 마제드 알안사리 대변인은 토요일 협상이 결렬됐다는 보도가 사실이 아니며 "전쟁을 길게 끌려는 이들에게만 도움이 된다"고 밝혔다. 반면 이란 군 대변인 모하마드 아크라미니아 준장은 11/6 해협 재개 전에 미국이 제재 해제·동결 자산 해제·배상 등 **7개 조건**을 받아들여야 한다고 했고, 혁명수비대 해군은 해협이 닫혀 있다고 밝혔다. 영국 해사무역기구는 11/4까지 7일간 선박 공격 **11건**을 집계했다.
**관전 포인트:** 중재국은 협상 지속을, 이란 군부는 강경 조건을 말하는 엇갈림이다. 주 초 '이틀 안 재개안'에서 '7개 조건'으로 이란의 요구가 늘어난 점은 조기 타결 기대를 낮춘다. 해상 공격이 주 11건 수준으로 이어지는 한 해운 보험료와 운임은 높게 유지된다.

**3. 혁명수비대 "미사일 사거리 2,000km 제한 해제" — 미국은 육로·카스피해 차단 태스크포스 출범**
혁명수비대 호세인 모헤비 대변인은 11/7 이란이 스스로 두었던 미사일 사거리 **2,000km** 제한을 풀었다고 밝혔다. 미 중부사령부는 육로와 카스피해를 통한 무기 이동을 끊기 위한 '아이언 게이트' 태스크포스를 발표했고, 브래드 쿠퍼 사령관은 봉쇄로 최근 수개월간 이란이 **\$250억** 이상의 원유를 수출하지 못했다고 했다. 미 국무부는 이란 핵 프로그램 정보에 **\$2,000만** 포상금을 걸었고, 재무부는 캐나다 소재 기업 **8곳**을 제재했다.
**관전 포인트:** 사거리 제한 해제는 유럽 일부까지 사정권에 넣는 상징적 위협이다. 봉쇄가 해상에서 육로·카스피해로 넓어지면서 미국의 압박도 한 단계 올라갔다. 양측이 동시에 강도를 높인 주말이라 월요일 아시아 장에서는 방산주와 유가 민감주의 변동성이 커질 수 있다.

**4. 선거 뒤 데이터센터 정치 — '규제 비용'이 AI 인프라 할인율에 들어간다**
선거 직후 분석들은 데이터센터 반대 여론이 민주당 압승의 한 요인이었다고 짚었다. 출구조사에서 절반 넘는 응답자가 데이터센터를 투표의 핵심·주요 요인으로 꼽았고, 전력 수요·용수·전기요금이 쟁점이었다. 퀼터의 킷 리스 투자전략가는 규제가 성장에 "브레이크"를 걸 수 있다고 경고했고, 인베스코의 폴 잭슨은 높은 유가·가스 가격이 청정에너지에 유인을 준다고 봤다. 선거 다음 날 프리마켓에서 코어사이언티픽 −3.5%, 아이렌 −3.6%, 코어위브 −3.8%였던 반면 퍼스트솔라 +7%, 선런 +6.1%였다.
**관전 포인트:** 다만 법안만으로 건설을 의미 있게 멈추기는 어렵다는 것이 다수 분석가의 시각이다. 주말 사이 새 법안은 나오지 않았고, 다음 주 새 의회 구성 일정과 주 정부 단위 모라토리엄 논의가 재료가 된다. 국내 전력기기·변압기주는 '미국 데이터센터 투자 지연' 우려와 '전력망 투자 지속' 기대 사이에서 방향을 찾게 된다.

**5. 다음 주 10월 CPI — 전년비 수치 없이 전월비만 나온다**
미국 10월 CPI는 11/10(화) 08:30(한국시간 22:30) 발표된다. 직전 9월 CPI는 전월비 **+0.6%**·전년비 **3.7%**, 근원 전월비 **+0.3%**였고 휘발유가 전월비 **+9.1%** 뛰었다. 2025년 정부 셧다운으로 2025년 10월 자료가 없어 이번 발표에서는 전년비 수치가 나오지 않는다. 11/13(금)에는 10월 PPI가 나오며, 9월 PPI는 전월비 **+1.3%**·전년비 **6.3%**로 2022년 3월 이후 최대 월간 상승이었다.
**관전 포인트:** 10월 유가가 \$100 안팎에 머물렀던 만큼 헤드라인은 높게 나올 수 있고, 시장은 근원 전월비가 0.3%를 넘는지에 집중할 것이다. 강한 고용 뒤 근원 물가까지 웃돌면 12월 인상이 기본 시나리오로 굳고 2년물이 다시 오른다. 반대로 근원이 둔화되면 반도체 투매 뒤 기술적 반등에 금리 하락이 힘을 보탤 수 있다.

## 🔭 섹션 3. 다음 개장일(11/9 월) 섹터별 전망

미국은 **11월 9일(월)** 정상 개장한다. 한국이 먼저 열리므로 국내는 금요일 밤 미국 반도체 반등과 주말 케심섬 공습·이란 강경 발언을 **미국 장 확인 없이** 소화한다.

**⬆️ 우호적 재료가 있는 섹터**

**반도체 대형주(기술적 반등)** — SOX는 금요일 **+4.21%**, AMD **+11.04%**, 인텔 **+7.71%**, 마이크론 **+5.12%**, SK하이닉스 ADR **+2.78%**로 되올랐다. 한국 금요일 장은 이 반등을 반영하지 못했으므로 월요일 첫 반영분이 있다. 다만 메모리주가 장중 상승폭을 대부분 반납한 채 끝나 반등 강도는 AMD·인텔 같은 비메모리보다 약할 수 있다.

**AI 전력·광통신** — 아이렌 **+20.02%**, 코히어런트 **+13.58%**, 비스트라 **+10.55%**로 금요일 가장 강했던 축이다. 국내 광통신 부품·전력기기의 상대 강도를 볼 만하다.

**여행·소비 서비스** — 에어비앤비 **+11.67%**, 유가 주간 −12.13%는 항공·여행 수요 쪽에 우호적이다.

**⬇️ 부담이 큰 섹터**

**정유·에너지** — WTI가 주간 **−12.13%(\$90.52)**로 내려와 정제마진 기대가 꺾였다. 주말 케심섬 공습이 하단을 받치겠지만, 협상 진전 소식 하나에 다시 밀릴 수 있다.

**성장 소프트웨어** — 아틀라시안 **−16.15%**, 액손 **−18.18%**처럼 가이던스가 약하면 실적과 무관하게 크게 맞는 장이다. 10년물 4.86%·VIX 25.64는 고밸류 성장주에 여전히 불리하다.

**⚠️ 방향이 갈리는 곳**

**메모리** — 공급 측 숫자(한국 반도체 수출 +259%)와 수요 측 경고(인텔·퀄컴)가 정면으로 부딪친다. SK하이닉스 ADR 주간 **−14.66%**는 국내 본주 낙폭과 견줘 볼 기준점이다.

### 🇰🇷 한국 관전 포인트

- **반도체 — SOX +4.21%·SK하이닉스 ADR \$127.34(+2.78%), 주간으로는 −14.66%.** 금요일 코스피 −6.0%는 미국 목요일 투매를 반영한 값이고, 금요일 밤 미국 반등은 아직 반영되지 않았다. 다만 ADR이 장중 \$133.45(+7.71%)에서 상승폭을 대부분 반납해 국내 메모리 대형주의 갭 상승은 제한적일 수 있다.
- **지수 — 직전 야간선물은 11/6 세션 795.50(+1.60%)으로 마감했다.** 장중 810.70까지 올랐다가 밀린 값이라 월요일 개장 초 상승 출발 뒤 매물 소화 여부가 관건이다. 주말 케심섬 공습과 이란의 사거리 제한 해제는 위험 회피 재료로 추가된다.
- **수급 — 외국인 현물 5일 −10조4,093억원 vs 선물 5일 +12,326계약.** 현물 매도가 감속하는지, 선물 순매수가 현물로 옮겨 오는지가 바닥 확인의 첫 조건이다.
- **금리·환율 — 고용 16만5,000명 뒤 2년물 4.51%.** 화요일 밤 CPI 전까지는 12월 인상 우려가 달러 강세 쪽으로 작용해 외국인 수급에 부담이다.
- **역행 업종 — 유가 주간 −12.13%.** 항공·화학·운송은 유가 하락 수혜, 정유는 역풍이다. 주말 공습이 유가를 얼마나 되돌리는지가 변수다.
