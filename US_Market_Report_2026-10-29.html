## 🗓 시장 요약

**① 나스닥 26,549.85(+0.27%)·S&P500 7,743.98(+0.28%)·다우 52,475.10(+0.19%) — FOMC 동결 소화하며 소폭 상승, 오라클·버티브가 AI 인프라 랠리 주도**
나스닥은 **26,549.85(+72.04, +0.27%)**, S&P500은 **7,743.98(+21.38, +0.28%)**, 다우는 **52,475.10(+97.53, +0.19%)**로 마감해 S&P500과 다우가 사흘 연속 올랐다. 나스닥100은 29,813.16(+0.55%), 러셀2000은 2,830.51(+0.41%)였고 VIX는 16.78(−4.22%)로 이틀째 내려갔다. 연준 결정을 앞두고 지수는 좁은 범위에서 움직였지만, 2030 회계연도 매출 \$2,250억 이상을 제시한 오라클과 3분기 매출이 61% 늘어난 버티브가 AI 인프라 투자 기대를 다시 끌어올렸다. 반면 F5·엔페이즈·로지텍처럼 가이던스가 약한 종목은 두 자릿수로 급락해 실적 시즌의 종목별 차별화가 이어졌다.

**③ WTI \$101.60(+1.70%)·브렌트 \$114.00(+0.11%) — 사우디 정유시설 공격 여파로 WTI \$100선 회복**

오라클은 시가 \$131.32에서 출발해 장중 \$148.48(+13.75%)까지 치솟은 뒤 \$144.34(+\$13.81, +10.58%)로 마감했다. 회사는 투자자 행사에서 2030 회계연도 매출 목표를 최소 \$2,250억으로 제시했는데, 이는 2026 회계연도 대비 연평균 35% 넘는 성장에 해당한다. 설비투자는 2027~2028 회계연도에 정점을 찍고 2029년부터 줄어들며, 잉여현금흐름은 2028 회계연도 하반기에 흑자로 돌아서 2029 회계연도에는 \$300억을 넘길 것이라고 밝혔다. 그간 오라클 주가를 눌러 온 'AI 투자로 현금이 마른다'는 우려에 회수 일정표를 내놓은 셈이어서 하루 상승률이 두 자릿수에 이르렀다.

**2. 버티브 (VRT) +16.48% — 3분기 매출 61% 증가·수주 두 배 이상, 연간 매출 전망 \$6.5억 상향**
데이터센터 전력·냉각 장비 업체 버티브는 시가 \$243.00으로 급등 출발해 고가 \$245.31(+17.62%)까지 오른 뒤 \$242.94(+\$34.38, +16.48%)로 마감했다. 3분기 매출은 61% 늘었고 인수 효과를 뺀 수주는 두 배 넘게 증가했으며, 회사는 연간 매출 전망을 \$6.5억 올렸다. 조르다노 알베르타치 CEO는 업계가 "사상 최대 규모의 인프라 구축 한가운데에 있다"고 말했다. 이날 상승으로 시가총액은 약 \$139억 불어났고, 플렉스(FLEX)도 클라우드·전력 인프라 부문 매출이 이번 회계연도에 75~85% 늘 것이라며 \$93.03(+11.61%)로 동반 급등했다.

**3. SK하이닉스 ADR (SKHY) +13.30% — 3분기 매출 사상 첫 100조원 돌파, 영업이익 전년 대비 632% 증가**
SK하이닉스 ADR은 시가 \$157.62에서 고가 \$166.06(+14.24%)까지 오른 뒤 \$164.70(+\$19.34, +13.30%)로 마감했다. 회사의 3분기 매출은 분기 기준 처음으로 100조원을 넘었고, 영업이익은 1년 전보다 632% 늘어 매출의 약 80%에 이르렀다. AI 서버용 고대역폭메모리(HBM)와 범용 D램 가격이 함께 오른 결과로, 메모리 업황이 정점을 지났다는 우려를 숫자로 반박했다는 평가가 나왔다. 같은 날 마이크론(MU)도 \$983.23(+5.86%)로 올라 메모리주 전반이 강세였다.

**4. 알파벳 (GOOGL) +1.34% — 3분기 매출 \$1,276억·구글 클라우드 103% 성장, 잉여현금흐름 −\$91억에 시간외 6%대 하락**
알파벳은 정규장에서 \$324.89(+\$4.31, +1.34%)로 마감한 뒤 장 마감 후 3분기 실적을 발표했다. 총매출은 \$1,276억으로 25% 늘었고, 구글 클라우드 매출은 \$307.1억으로 103% 증가해 LSEG 집계 예상치 \$295.7억을 웃돌았다. 그러나 잉여현금흐름이 −\$90.7억으로 예상(−\$0.36억)보다 훨씬 나빴고, 분기 설비투자 \$514억과 유럽연합 과징금 \$52억이 겹치며 주가는 시간외에서 6% 넘게 내렸다. 순다르 피차이 CEO는 "연간 매출 기준 5,000억 달러 궤도에 올랐다"며 검색 질의 증가율이 5년 만의 최고라고 강조했다.

**5. 엔페이즈에너지 (ENPH) −16.03% — 3분기 매출 \$2.93억, 4분기 가이던스 \$2.25억~\$2.55억으로 부진**
엔페이즈에너지는 시가 \$23.85로 급락 출발해 저가 \$23.83(−19.93%)까지 밀린 뒤 \$24.99(−\$4.77, −16.03%)로 마감했다. 3분기 매출은 \$2.933억이었고, 미국 매출은 주택용 태양광 수요 부진 탓에 예상보다 덜 늘었다. 회사는 4분기 매출 가이던스를 \$2.25억~\$2.55억으로 제시해 시장 기대에 크게 못 미쳤고, 높은 금리를 수요의 걸림돌로 꼽았다. 같은 업종의 솔라엣지도 장중 9%가량 밀리며 태양광 업종 전반이 약세였다.

**6. 웬디스 (WEN) +15.15% — 트라이언 컨소시엄 주당 \$7.35 현금 인수 제안, 전일 종가 대비 약 20% 프리미엄**
웬디스는 시가 \$7.01로 급등 출발해 고가 \$7.20(+17.26%)까지 오른 뒤 \$7.07(+\$0.93, +15.15%)로 마감했다. 넬슨 펠츠의 트라이언 파트너스가 플린 그룹·블루파이브 캐피털·식스스스트리트와 함께 주당 \$7.35의 현금 인수를 제안했는데, 이는 화요일 종가보다 약 20% 높은 값이다. 웬디스는 오후 2시 44분 제안 접수를 확인하고 독립 이사로 구성된 위원회가 검토하겠다고 밝혔다. 제안이 구속력 없는 단계여서 주가는 제안가보다 약 4% 낮은 수준에서 멈췄다.

**7. F5 (FFIV) −20.43% — 2027 회계연도 매출 성장률 전망 8~9%로 직전 연도 11%보다 둔화**
F5는 시가 \$421.30에서 출발해 저가 \$361.78(−21.24%)까지 밀린 뒤 \$365.53(−\$93.83, −20.43%)로 마감했다. 회사는 실적 발표에서 2027 회계연도 매출 증가율을 8~9%로 제시했는데, 이는 직전 회계연도 성장률 11%보다 낮다. 성장 둔화 신호에 실망 매물이 한꺼번에 쏟아졌고, 장 초반부터 시가가 전일 종가보다 8% 넘게 낮게 형성됐다. 하루 만에 시가총액의 5분의 1이 사라졌다.

**8. 로빈후드 (HOOD) −3.31% — 3분기 총매출 사상 최대에도 암호화폐 매출 55% 감소, 이익 예상 하회**
로빈후드는 저가 \$89.15(−5.72%)까지 밀렸다가 \$91.43(−\$3.13, −3.31%)로 낙폭을 줄였다. 3분기 총매출은 사상 최대를 기록했지만 암호화폐 거래 매출이 1년 전보다 55% 줄었고, 이익도 시장 예상에 못 미쳐 프리마켓에서는 8% 가까이 내렸다. 회사는 분기 보고서(10-Q)에서 AI 거래 에이전트가 의도하지 않은 거래를 실행할 수 있다는 위험 요인을 새로 적었다. 비트코인이 \$80,000선 위로 돌아왔는데도 개인 투자자의 코인 거래가 줄어든 점이 부담으로 작용했다.

**9. 보스턴사이언티픽 (BSX) −5.84% — 4분기 매출 전년 대비 1~3% 감소 전망, CEO "힘든 한 해"**
보스턴사이언티픽은 시가 \$41.95로 급락 출발해 저가 \$39.57(−12.18%)까지 밀린 뒤 \$42.43(−\$2.63, −5.84%)로 낙폭을 절반가량 줄였다. 회사는 4분기 매출이 전년 같은 기간보다 1~3% 줄어들 것이라고 전망해 성장주로 평가받던 의료기기 대형주로서는 이례적인 역성장 가이던스를 내놨다. 회사 CEO는 올해를 "힘든 한 해"라고 표현했다. 장중 저가 이후 저가 매수가 들어왔지만 의료기기 업종 전반의 투자 심리를 눌렀다.

**10. 로지텍 (LOGI) −12.12% — 연말 분기 매출 −4~+1% 전망, 칩 공급사 공장 가동 중단 영향 \$7,000만~\$8,000만**
로지텍은 시가 \$100.40에서 저가 \$97.63(−12.69%)까지 밀린 뒤 \$98.27(−\$13.55, −12.12%)로 마감했다. 회사는 연말 쇼핑 시즌이 낀 분기 매출이 전년 대비 4% 감소에서 1% 증가 사이가 될 것이라고 전망했다. 여기에는 칩 공급사 공장의 가동 중단에 따른 \$7,000만~\$8,000만의 매출 차질이 반영됐으며, 해당 공장은 9월에 재가동됐다고 밝혔다. 성수기 수요 둔화와 부품 공급 차질이 겹치며 PC 주변기기 업종에 부담을 줬다.
