## 🗓 시장 요약

**① 나스닥 24,129.50(+2.31%)·S&P500 7,297.49(+1.60%)·다우 50,774.94(+1.18%) — 단축 세션에서 AI주 반등, 주간 5~6%대 급등**
나스닥은 **24,129.50(+543.70, +2.31%)**, S&P500은 **7,297.49(+114.71, +1.60%)**, 다우는 **50,774.94(+591.99, +1.18%)**로 마감했다. 개장 직후 상승폭을 일부 반납했다가 장 후반 다시 고점 부근으로 올라섰고, S&P500 장중 고가는 7,304.10이었다. 나스닥100은 **26,726.39(+679.49, +2.61%)**, 러셀2000은 **2,750.30(+46.24, +1.71%)**, VIX는 **23.81(−2.99, −11.16%)**로 수요일 장중 30을 넘었던 공포 지수가 20대 초반으로 내려왔다. 주간 기준 S&P500 **+5.60%**는 2025년 4월 이후 최대이며, 나스닥은 **+6.68%**, 다우는 **+5.46%**였다. 모든 업종이 올랐고 에너지·경기소비재가 헬스케어·필수소비재보다 강했다.

**② 반도체 SOX +4.69% — 30개 구성 종목 전부 상승, 메모리주가 선두**
SOX는 **9,186.71(+411.84, +4.69%)**로 구성 종목 30개가 모두 올랐다. 샌디스크(SNDK) **\$85.36(+15.96%)**, 시게이트(STX) **\$509.66(+7.90%)**, 마이크론(MU) **\$646.95(+7.60%)**, SK하이닉스 ADR(SKHY) **\$119.50(+7.52%)**로 메모리·저장장치주가 가장 강했다. 골드만삭스는 2027년 글로벌 D램 공급 부족률을 5.1%로 제시하며 15년여 만에 가장 심한 부족이 될 수 있다고 봤다. AMD는 **\$424.54(+4.56%)**, 엔비디아(NVDA)는 장중 −2.62%까지 밀렸다가 **\$150.49(+0.80%)**로 상승 전환했다.

**③ 앤스로픽 +10.98%·델 +6.70% — AI 인프라 효율화와 데이터센터 투자 재료**
앤스로픽(ANT)은 **\$91.88(+\$9.09, +10.98%)**으로 19일 상장 이후 부진을 털고 AI 테마를 주도했다. 백엔드 개편으로 Claude Code 요청 대기 시간을 약 20% 줄였다는 발표와 일본 최대 발전사 JERA의 도쿄권 데이터센터 협상 보도가 겹쳤다. 델(DELL)은 **\$316.96(+6.70%)**, 테슬라(TSLA)는 **\$400.00(+5.22%)**, 스페이스X(SPCX)는 **\$133.59(+4.83%)**로 올랐다. 반면 버텍스 파마슈티컬스는 FDA가 신장 질환 신약 심사 결정을 미루면서 약 5% 내렸다.

**④ 미국채 — 2년물 4.69%(+8bp)·10년물 4.94%(+9bp)·30년물 5.33%(+9bp), 위험 선호 회복에 채권 매도**
미 재무부 고시 기준 2년물은 **4.69%(+8.0bp)**, 10년물은 **4.94%(+9.0bp)**, 30년물은 **5.33%(+9.0bp)**로 수요일 대비 올랐다. 10년물은 장중 4.942%까지 높아졌다. 기술주 매도 때 국채로 피신했던 자금이 다시 주식으로 돌아오며 금리가 반등했다. 3분기 GDP가 연율 4.3%로 기존 3.4%에서 상향 수정된 점도 12월 FOMC 인상 전망을 받쳤다. 채권시장은 현지 오후 2시에 일찍 닫았다.

**⑤ WTI \$83.33(−0.42%)·브렌트 \$95.27(−1.35%) — 호르무즈 긴장 속 재고 증가, 금은 반등**
WTI 1월물은 **\$83.33(−\$0.35, −0.42%)**, 브렌트 1월물은 **\$95.27(−\$1.30, −1.35%)**로 마감했다. 장중 WTI는 \$86.60까지 올랐다가 \$82.57까지 밀리는 등 변동성이 컸다. 이란의 호르무즈 해협 선박 공격과 후티 반군의 사우디 에너지 시설 공격이 상단을 열었지만, 미국 원유 재고가 3주 연속 늘어난 점이 상승분을 지웠다. OPEC+는 **11/29(일)** 회의를 연다. 금 선물은 온스당 \$3,626.60(+1.66%)으로 올랐고 은 현물은 장중 \$44를 넘었으며, 비트코인은 \$59,900대(−1.0%)로 약했다.

**⑥ 🇰🇷 SK하이닉스 ADR \$119.50(+7.52%)·코스피200 야간선물 760.05(+0.38%, 11/27 세션 06:00 확정)**

SK하이닉스 ADR은 **\$119.50(+\$8.36, +7.52%)**로 장중 고가 \$119.96 부근에서 마감했다. 코스피200 야간선물은 06:00 확정 종가 760.05로 주간 종가 757.15 대비 +2.90포인트(+0.38%) 올랐다. 시가는 758.10, 장중 고가 765.35·저가 742.85로 22.50포인트 범위에서 움직였다. 주간 선물이 이미 11/26 종가 726.75에서 757.15로 크게 오른 뒤라 야간 상승폭은 제한됐다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) +0.80% — 동남아 4개국 서버 출하 중단 요청 보도, 12/3 상원 청문회 앞두고 상승 전환**
엔비디아는 \$150.49(+\$1.19, +0.80%)로 마감했다. 장 초반 약 2% 올랐다가 장중 \$145.39(−2.62%)까지 밀린 뒤 장 후반 상승 전환했다. 새 미국 수출 허가 규정 이후 엔비디아가 제조 파트너들에게 말레이시아·싱가포르·태국·인도네시아 4개국으로의 서버 출하를 멈춰 달라고 요청했다는 보도가 나왔고, 델과 슈퍼마이크로는 현지 고객에게 해당 주문을 당분간 이행할 수 없다고 알렸다. 젠슨 황 CEO는 12/1 하원 위원회 비공개 면담에 이어 12/3 상원 은행위원회 공개 청문회에 단독 증인으로 출석해 AI 칩 수출 통제에 대해 증언한다.

**2. 앤스로픽 (ANT) +10.98% — 백엔드 개편으로 CPU 사용 70%·요청당 메모리 80% 이상 절감 발표**
앤스로픽은 \$91.88(+\$9.09, +10.98%)으로 급등해 11/19 상장 이후 이어진 부진을 털었다. 회사는 백엔드 개편으로 Claude Code 요청의 대기 시간 중앙값을 약 20%, CPU 사용량을 약 70%, 요청당 메모리를 80% 넘게 줄였다고 밝혔고, 요청량은 2024년 초 대비 약 1,800배로 늘었다고 했다. 일본 최대 발전사 JERA가 앤스로픽·메타 등과 도쿄권 데이터센터를 협의 중이며 첫 사업으로 지바현에 \$150억 규모 하이퍼스케일 데이터센터를 계획한다는 보도도 더해졌다. 장중 고가는 \$93.22(+12.60%)였다.

**3. 샌디스크 (SNDK) +15.96% — 골드만삭스, 2027년 낸드 공급 부족률 2.2% 전망**
샌디스크는 \$85.36(+\$11.75, +15.96%)로 SOX 구성 종목 중 가장 크게 올랐다. 골드만삭스는 2027년 낸드 공급 부족률을 2.2%, 2028년 0.3%로 제시하며 메모리 공급 부족이 내후년까지 이어진다고 봤다. 수요일 −5.57%로 밀렸던 낙폭을 하루 만에 모두 되찾았고, 장중 고가는 \$85.44(+16.07%)였다. AI 투자 우려로 많이 빠졌던 낙폭 과대 메모리주에 저가 매수가 집중됐다.

**4. 마이크론 (MU) +7.60% — 골드만삭스 "2027년 D램 부족, 15년여 만에 가장 심각" 전망**
마이크론은 \$646.95(+\$45.70, +7.60%)로 마감해 수요일 하락분(−4.53%)을 넘어서는 반등을 보였다. 골드만삭스는 2027년 글로벌 D램 공급 부족률을 5.1%, 2028년 1.2%로 추정하며 2027년 부족이 15년여 만에 가장 심한 수준이 될 것이라고 분석했다. 다만 트렌드포스는 4분기 D램 구매 속도가 다소 느려졌고 범용 D램 계약 가격 상승폭이 2027년 좁혀진 뒤 2028년 하락 전환할 수 있다고 봐 시각이 엇갈린다. 장중 고가는 \$654.44(+8.85%)였다.

**5. SK하이닉스 ADR (SKHY) +7.52% — D램 공급 부족 전망·메모리 동반 급등**
SK하이닉스 ADR은 \$119.50(+\$8.36, +7.52%)로 올라 휴장 전 수요일 하락(−0.75%)을 크게 만회했다. 골드만삭스가 2027년 D램 공급 부족률 5.1%를 제시한 데다 마이크론 +7.60%, 샌디스크 +15.96% 등 메모리 업종 전체가 강세를 보이며 동반 상승했다. 장중 저가 \$112.68(+1.39%)에서 고가 \$119.96(+7.94%)까지 올라 거의 고점에서 마감했다. 미국 휴장 사이 국내 증시가 11/27 먼저 반등한 만큼, 30일(월) 국내 개장에서 ADR 상승분이 추가로 반영될지가 관심이다.

**6. 델 테크놀로지스 (DELL) +6.70% — AI 수주 잔고 \$1,323억 재조명, 동남아 출하 차질은 부담**
델은 \$316.96(+\$19.90, +6.70%)로 이틀 연속 올랐다. 수요일 발표한 3분기 조정 주당순이익 \$9.45와 매출 \$549억4,000만이 예상을 크게 웃돌았고, 분기 말 AI 수주 잔고가 \$1,323억에 달했다는 점이 AI 서버 수요 논리를 다시 지지했다. 엔비디아의 동남아 4개국 서버 출하 중단 요청으로 델이 현지 고객에게 일부 주문을 이행할 수 없다고 통보했다는 보도가 나왔지만 주가에는 제한적인 영향만 미쳤다. 장중 고가는 \$317.48(+6.87%)였다.

**7. 아마존 (AMZN) +3.96% — 블랙프라이데이 수요 호조, NRF "연말 매출 처음으로 1조 달러 돌파"**
아마존은 \$254.12(+\$9.69, +3.96%)로 올랐다. 블랙프라이데이 수요가 강했다는 초기 집계가 나오며 유통·전자상거래주에 매수세가 유입됐다. 전미소매협회(NRF)는 올해 연말 쇼핑 시즌 매출이 처음으로 1조 달러를 넘어 4.2% 증가할 것으로 예상했고, 마스터카드는 11/1~12/24 미국 소매 판매가 5.5% 늘 것으로 전망했다. 타깃의 3분기 동일점 매출 +5.6%, 매장 방문객 +5%도 소비 체력을 확인시켰다.

**8. 테슬라 (TSLA) +5.22% — 12/3 주주총회 앞두고 스페이스X 합병 논의 보도, 합산 가치 약 3조3,000억 달러**
테슬라는 \$400.00(+\$19.86, +5.22%)로 마감했다. 12/3(현지) 연례 주주총회를 앞두고 스페이스X와의 합병 논의가 보도됐는데, 두 회사의 합산 가치는 약 \$3조3,000억으로 거론되고 거래는 12월 발표되거나 2027년 초로 미뤄질 수 있다고 전해졌다. 다만 공식 안건에 합병 표결은 올라 있지 않다. 장중 저가 \$384.66(+1.19%)에서 고가 \$401.18(+5.53%)까지 오르며 \$400선을 회복했다.

**9. 스페이스X (SPCX) +4.83% — 머스크 "미국 모든 아동에게 매년 1주씩 추가 지급" 발표**
스페이스X는 \$133.59(+\$6.15, +4.83%)로 올라 이번 주 기부 계획 발표 이후 상승세를 이어갔다. 일론 머스크 CEO는 앞서 발표한 활성 트럼프 계좌당 클래스 A 주식 1주 지급에 더해 미국의 모든 아동에게 매년 1주씩 추가로 주겠다고 밝혔다. 트럼프 계좌는 2025년 세법으로 만들어진 아동용 비과세 투자계좌로 2025~2028년 출생 아동에게 정부가 \$1,000를 한 차례 넣어준다. 테슬라와의 합병 논의 보도도 주가에 힘을 보탰고, 장중 고가는 \$134.44(+5.49%)였다.

**10. 애플 (AAPL) +0.83% — 카운터포인트 "3분기 미국 스마트폰 출하 9% 감소 속 점유율 57%로 상승"**
애플은 \$358.54(+\$2.96, +0.83%)로 마감해 시가총액이 약 \$5조2,100억으로 늘었다. 카운터포인트리서치에 따르면 3분기 미국 스마트폰 출하량은 전년 대비 9% 줄었지만 애플 점유율은 50%에서 57%로 높아졌다. 애플은 11/30까지 미국 블랙프라이데이 행사를 열어 최대 \$300 상당의 기프트카드를 제공한다. 장중 저가 \$355.64(+0.02%)로 하루 종일 상승권을 지켰다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **골드만삭스 — 2027년 D램 공급 부족 15년여 만에 최악.** 2027년 D램 부족률 5.1%·2028년 1.2%, 낸드 부족률 2.2%·0.3%로 2028년에는 수급이 크게 완화될 것으로 봤다. 마이크론 \$646.95(+7.60%), 샌디스크 \$85.36(+15.96%).
- **트렌드포스 — 범용 D램 계약 가격 상승폭 2027년 축소.** 4분기 구매 속도가 다소 둔화했고 2028년에는 가격이 하락 전환할 수 있으며, 비관 시나리오에서는 2027년 4분기부터 내릴 수 있다고 봤다.
- **골드만삭스 트레이딩 데스크 — 시스템 전략 추가 매도 가능.** 지난 한 주 약 \$700억의 글로벌 주식을 판 시스템 전략 자금이 다음 주 약 \$1,000억을 더 팔 수 있지만, 기본 시나리오는 12월 초 소폭 순매수 전환이다.

**구루·시장 코멘트**
- **제이미 콕스(해리스 파이낸셜 그룹 매니징 파트너)** — 시장이 과도하게 팔린 상태였기 때문에 반등은 불가피했다.
- **앤드루 슬리먼(모건스탠리 인베스트먼트 매니지먼트 선임 포트폴리오 매니저)** — 기술주에서 빠져나갔던 단기 자금이 다시 들어오고 있어 다음 주에도 반등이 이어질 수 있다.
- **댄 아이브스(요크빌 파트너)** — 투자자들에게 트라우마 같은 상황이었다. 어느 쪽이 위인지 알 수 없는 만큼 변동성은 계속될 것이다.
- **크리스티안 카시코프(씨티 FX 퀀트 투자자 솔루션 책임자)** — 월요일 달러 강세는 해외 투자자들이 주식 환헤지 비율을 조정한 결과일 수 있다.
