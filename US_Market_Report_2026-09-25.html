## 🗓 시장 요약

**① 3대 지수 보합권 마감·나스닥 +0.01% — 장중 −0.6%대 하락을 '호르무즈 단계적 합의' 보도가 되돌렸고, 오라클 −3.47%·MGM −10.99%를 메타 +4.50%·인텔 +3.91%가 상쇄했다**
연준 인상 이후 일곱째 거래일, 지수는 금리와 유가에 눌려 출발했다가 장 후반 낙폭을 대부분 회복했다. 나스닥은 **26,939.37(+3.34, +0.01%)**로 사흘 만에 소폭 반등했고 S&P500은 **7,704.13(−1.90, −0.02%)**, 다우는 **51,349.98(−161.61, −0.31%)**, 러셀2000은 2,835.58(−0.11%)이었다. 개장 직후에는 나스닥 −0.58%·S&P500 −0.34%·다우 −0.37%로 밀렸고 오라클이 프로젝트 주피터 데이터센터 '불가항력' 통지 보도에 장중 −7.66%까지 급락하며 AI 인프라 전반을 흔들었지만, 오후 들어 미국과 이란이 호르무즈 해협 재개방과 해상봉쇄 해제를 맞바꾸는 단계적 합의를 논의 중이라는 보도가 나오면서 지수가 돌아섰다. 주간 실업수당 청구 19만7,000건(예상 20만1,000건)·8월 신규주택판매 68만4,000채(+6.4%, 예상 62만 채)로 실물 지표는 여전히 강했고, 이 강함이 금리를 밀어 올리는 구조는 그대로였다. 캐피털닷컴의 다니엘라 해손은 "실질금리가 실질적으로 올랐다는 증거가 쌓이고 있다"며 5년 만의 최강 PMI 뒤의 채권 매도를 짚었고, 블랙록의 릭 리더는 이번 금리 급등을 "위기는 아니지만 경종"이라고 표현하며 주식에 'B−' 학점을 주되 메모리·컴퓨트 관련주는 선별적으로 선호한다고 했다. 해석하면 전날의 '금리가 모두를 누르는' 장에서 이날은 '금리는 더 올랐지만 지정학 완화 기대가 하단을 받친' 장으로 바뀌었고, 지수는 멈췄어도 종목 간 편차(오라클·MGM·TD시넥스 급락 vs 메타·그레일·에버퓨어 급등)는 최근 가장 컸다.

**② 10년물 5.19%·30년물 5.48%(2004년 이후 최고)·5년물 5.05% — 실업수당 19만7,000건·신규주택판매 급증에 10월 인상 확률 70%대, 30년 모기지 7.37%**
미국채 10년물 금리는 **5.19%(약 +6bp)**로 2007년 이후 최고를 하루 더 높였고, 30년물은 **5.48%(약 +7bp)**로 2004년 6월 이후 22년 만의 최고, 5년물은 5.05%로 전날 5% 돌파 뒤 안착했으며 2년물은 **4.92%(약 −1bp)**로 장중 4.95%대를 찍은 뒤 되돌렸다. 30년 고정 모기지 금리는 7.37%(+11bp)로 2024년 5월 이후 최고다. 촉매는 지표였다 — 주간 신규 실업수당 청구는 19만7,000건으로 전주보다 1,000건 줄어 예상(20만1,000건)을 밑돌았고 계속 청구도 171만9,000건으로 예상(174만5,000건)보다 적었으며, 8월 신규주택판매는 전월 대비 +6.4%의 연율 68만4,000채로 예상(62만 채)을 크게 넘어 올해 최고였다. 필라델피아 연은의 애나 폴슨 총재는 인플레이션이 이어지면 "완만한 추가 긴축이 정당화될 수 있다"고 했고, 선물시장의 10월 추가 인상 확률은 70% 안팎까지 높아졌다. 달러는 강세로 엔/달러 158.72(+0.43), 유로/달러 1.1377이었고 금은 \$4,298.00(−0.47%)로 이틀째 밀렸다. 개인투자자 심리는 약세 48.1%(전주 53.3%)·강세 32.7%(전주 28.8%)로 극단에서 조금 물러났고 공포·탐욕지수는 35(공포)다. 해석하면 단기물은 멈추고 장기물만 오르는 '베어 스티프닝'이 이틀째 이어진 것이며, 이는 인상 자체보다 인플레이션·재정 프리미엄이 장기 금리를 밀고 있다는 뜻이다 — 금요일 밤 8월 PCE가 이 프리미엄을 확인할지, 되돌릴지를 정한다.

**③ WTI \$94.61(+2.66%)·브렌트 \$106.60(+3.41%) 이틀째 급등 — 호르무즈 상선 피격·후티의 사우디 공격에 오르다 '단계적 합의' 보도로 상승폭 축소, 천연가스 +9%**
WTI 11월물은 **\$94.61(+\$2.45, +2.66%)**, 브렌트는 **\$106.60(+\$3.52, +3.41%)**로 이틀째 올랐고 장중에는 WTI \$95, 브렌트 \$107을 넘기도 했다. 호르무즈 해협에서 상선 한 척이 피격돼 선원 1명이 숨졌고 후티 반군이 사우디 군 시설을 공격했으며 이란 최고지도자 고문은 홍해 에너지 수송을 겨냥한 "새로운 전선"을 경고했다. 그러나 오후에 미국과 이란 협상단이 1단계로 이란이 호르무즈를 재개방하고 미국이 경제 봉쇄를 푸는 단계적 합의를 논의하고 있다는 보도가 나오면서 유가는 고점에서 밀렸고 주식은 반등했다 — 이란 고위 관계자는 "위기를 단계별로 풀어 가는 것이 한 방법이며 첫 단계는 봉쇄 종료와 호르무즈 재개방"이라고 했고, 전 미국 협상가 데니스 로스는 "봉쇄가 이란을 진짜 옥죄고 있다"고 했다. 미국 천연가스 선물은 +9.3%의 \$3.305로 급등했다. 해석하면 이날 유가는 '공급 차질 현실화'와 '외교적 출구' 두 재료가 맞붙은 장이었고, 합의 보도가 사실이라면 9월 내내 지수를 눌러 온 유가·금리 조합의 한 축이 풀릴 수 있다는 점에서 주식 시장이 먼저 반응했다.

**④ 반도체 −0.33% 저가 매수 — 인텔 +3.91%·AMD +2.38%·마이크론 +0.81% vs 엔비디아 −0.41%·샌디스크 −3.47%·SKHY −1.54%, 오라클 '불가항력'에 블룸에너지 −3.10%, 네비우스 +7.44%·코어위브 +3.72%**
필라델피아 반도체지수는 장중 12,258까지 −2.2% 밀렸다가 **12,492.54(−0.33%)**로 낙폭을 대부분 회복했다. 인텔(INTC) **\$127.39(+3.91%)**, AMD(AMD) **\$629.26(+2.38%)**이 강했고 마이크론(MU) \$1,080.53(+0.81%)은 전날 웰스파고 목표가 하향 뒤 반등했지만 엔비디아(NVDA) \$224.58(−0.41%), 샌디스크(SNDK) \$1,753.62(−3.47%), SK하이닉스 ADR(SKHY) **\$186.37(−1.54%)**는 밀려 메모리 안에서도 갈렸다. AI 인프라에서는 오라클(ORCL)이 뉴멕시코 \$1,650억 규모 프로젝트 주피터 데이터센터의 개발사 블루아울에 불가항력 통지를 보냈다는 보도에 장중 −7.66%까지 급락한 뒤 **\$139.54(−3.47%)**로 마감했고, 연료전지 공급사 블룸에너지(BE)는 \$266.65(−3.10%)로 동반 하락했다. 반면 네비우스(NBIS)는 BNP파리바의 아웃퍼폼 상향(목표가 \$399)에 **\$243.48(+7.44%)**, 코어위브(CRWV)는 JP모건의 비중확대 상향(목표가 \$125)에 \$90.13(+3.72%)로 올라 '오라클의 병목이 경쟁 클라우드의 기회'라는 해석이 붙었다. 대형 기술주에서는 메타(META) **\$777.59(+4.50%)**, 알파벳(GOOGL) \$342.36(+1.34%, 제미나이 4 출시 임박 보도)이 올랐고 마이크로소프트(MSFT) \$497.93(−0.53%), 애플(AAPL) \$335.92(−0.33%), 테슬라(TSLA) \$377.94(−0.57%), 아마존(AMZN) \$249.38(+0.04%)은 보합권이었다. 해석하면 반도체는 '재료 없는 조정'을 이틀 만에 멈췄고, 트럼프·시진핑 회담에서 H200 수출 승인 같은 반도체 합의가 발표되지 않았는데도 인텔·AMD가 오른 것은 금리 급등 국면에서 상대적으로 싼 종목으로 자금이 옮겨 갔다는 뜻이다.

**⑤ 회사 고유 재료 — 메타 +4.50%(뮤즈 음성·영상·소매 파트너십, JP모건 목표가 \$920), MGM −10.99%(딜러의 \$48.30 인수 제안 철회), 그레일 +15.38%(FDA 자문위 찬성), TD시넥스 −9.87%(잉여현금흐름 −\$9.8억), 에버퓨어 +11.15%(2028 회계연도 매출 \$70~73억 전망)**
메타(META)는 커넥트 둘째 날 뮤즈의 음성·실시간 영상 기능과 월마트·베스트바이·세포라 등 소매 파트너십을 공개하고 JP모건이 목표가를 \$920으로 올리자 **\$777.59(+4.50%)**로 2월 이후 최고를 다시 썼다. MGM리조트(MGM)는 배리 딜러의 피플이 주당 \$48.30·총 \$180억 인수 제안을 철회하자 **\$33.69(−10.99%)**로 급락했고 BofA는 중립으로 내렸다. 그레일(GRAL)은 FDA 자문위가 다중암 조기검진 '갤러리'의 안전성 10-0·유익성 7-2로 찬성하자 거래 재개 첫날 **\$125.21(+15.38%)**로 52주 신고가를 썼고, TD시넥스(SNX)는 3분기 매출 \$215.6억(+38%)·EPS \$5.68의 기록적 실적에도 잉여현금흐름 −\$9.76억과 매출총이익률 하락에 **\$259.47(−9.87%)**로 급락했다. 에버퓨어(P)는 2028 회계연도 매출 \$70~73억(컨센서스 \$63.7억) 전망에 **\$121.88(+11.15%)**, 다든(DRI)은 동일점포매출 +3.1%(예상 +3.3%)에 \$207.24(−3.02%), 스타벅스(SBUX)는 북미 매장 약 1%(250곳) 폐점 발표에 \$93.65(−0.52%)였다. 바이킹(VKTX)은 785만 주 \$35 유상증자·\$2.25억 전환사채에 \$36.75(−11.76%), 아카디아(ACAD)는 알츠하이머 정신증 2상 통계적 유의성 미달에 \$22.18(−12.78%), 스티치픽스(SFIX)는 1분기 매출 가이던스 \$3.23~3.28억(컨센서스 \$3.607억)에 \$2.21(−21.63%)였다. 고대디(GDDY)는 젠디지털의 인수 타진 보도에 장중 +14%에서 \$100.81(+4.60%), 달러제너럴(DG)은 HSBC의 매수 상향(목표가 \$160)에 \$122.53(+1.60%), 퀀타서비스(PWR)는 번스타인의 아웃퍼폼 상향(목표가 \$775)에 \$643.50(+1.35%), 일라이릴리(LLY)는 \$1,181.89(+2.68%)로 헬스케어 강세를 이끌었고 드롭박스(DBX)는 씨티의 매도 하향에 \$32.66(−4.56%)였다.

**⑥ 🇰🇷 국내 증시 추석 연휴 휴장(9/24~26) — SKHY \$186.37(−1.54%), 괴리율 약 +38.1% → 약 +36.0%(9/23 원주 1,862,000원·환율 1,358.4원 기준), 트럼프·시진핑 회담은 '휴전 2개월 연장·AI 대화 채널'로 반도체 합의 없이 끝나**
국내 정규장과 파생상품 야간시장은 추석 연휴로 9/24~26 사흘간 열리지 않으며, 직전 9/23 코스피는 7,080.92(+0.90%), 삼성전자 285,500원(+3.25%), SK하이닉스 1,862,000원(+1.20%), 원/달러 1,358.4원이 출발선이다. 미국에서는 SK하이닉스 ADR(SKHY)이 시가 \$185.51·고가 \$188.89·저가 \$184.74를 거쳐 **\$186.37(−1.54%, −\$2.91)**로 이틀째 내렸고, 괴리율은 ADR 10주 = 원주 1주 기준 9/23 원주 종가와 환율로 계산하면 약 +38.1%에서 **약 +36.0%**로 더 좁혀졌다 — 연휴 중 ADR이 미리 조정받아 9/28 개장 갭의 부담을 줄이고 있는 셈이다. 워싱턴에서 열린 트럼프·시진핑 정상회담은 베선트 재무장관이 발표한 미중 무역 휴전 2개월 연장(2027년 1월 10일까지)과 AI 안전 사고 상호 통보·AI 대화 채널 논의로 정리됐고, 트럼프는 "우리의 가드레일은 법무부"라며 AI 규제 공조에 선을 그었으며 시진핑은 "AI 발전은 인간 통제 아래 있어야 한다"고 했다. 시장이 기대했던 H200 대중 수출 승인이나 반도체 관세 합의는 발표되지 않았지만 엔비디아(NVDA)는 −0.41%로 실망 매물이 크지 않았다. 해석하면 연휴 첫날 미국 변수 세 가지(회담·그레일·오라클) 가운데 국내 반도체에 직접 닿는 것은 없었고, 남은 이틀의 PCE와 마이크론 실적 전 메모리 주가 흐름이 9/28 갭을 정한다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 오라클 (ORCL) −3.47% — \$139.54, 뉴멕시코 \$1,650억 '프로젝트 주피터' 데이터센터 개발사에 불가항력 통지 보도, 장중 −7.66% 급락 뒤 "계획대로 진행" 해명에 낙폭 축소**
오라클은 시가 \$137.32에서 장중 \$133.48(−7.66%)까지 밀린 뒤 \$139.54(−\$5.02, −3.47%)로 마감했다. 오픈AI·소프트뱅크와의 스타게이트 일환인 뉴멕시코 프로젝트 주피터(총 \$1,650억·2.45GW·2028년 완공 목표)의 개발사 블루아울에 에너지 자원 관련 핵심 허가 거부를 이유로 불가항력 조항을 통지했다는 보도가 나오자 AI 인프라 전반이 흔들렸고, 회사는 "프로젝트는 계획대로 진행 중이며 통지는 재무 약정의 변경을 뜻하지 않는다", "2027 회계연도 매출·이익 가이던스에 영향이 없다"고 밝혀 낙폭을 줄였다. 2026 회계연도 잉여현금흐름이 −\$237억으로 돌아선 가운데 잔여 수행의무(RPO) \$6,640억과 1분기 \$300억 이상의 신규 AI 계약이 버팀목이지만, 회사채가 액면가의 90센트 아래에서 거래되는 상태라 시장은 이번 통지를 자금·전력 병목의 신호로 읽었다. 연료전지 공급사 블룸에너지(BE)는 \$266.65(−3.10%)로 동반 하락했고, 반대로 네비우스(NBIS) +7.44%·코어위브(CRWV) +3.72%는 경쟁 클라우드의 반사이익으로 올랐다. 주가는 1년 전보다 55% 낮은 수준이다.

**2. 메타 플랫폼스 (META) +4.50% — \$777.59, 커넥트 둘째 날 뮤즈 음성·실시간 영상 기능과 월마트·베스트바이·세포라 소매 파트너십 공개, JP모건 목표가 \$920으로 상향**
메타는 시가 \$744.35에서 장중 \$779.82까지 올라 \$777.59(+\$33.49, +4.50%)로 마감해 2월 이후 최고를 다시 썼고 9/8 뮤즈 출시 이후 상승률은 약 22%다. 커넥트 둘째 날 저커버그는 "뮤즈에 음성과 실시간 영상이 더해져 긴 대화를 나누면 뮤즈가 뒤에서 일을 처리해 준다"며 손을 쓰지 않는 작업 완료 기능을 시연했고, \$1,299 VR 글라스(2027년 봄 출시)와 2인치 터치스크린·5G 휴대기기 '메타 참'(연말 출하), 유니티와의 VR 글라스 첫날 지원 파트너십을 발표했으며, 월마트·베스트바이·세포라·웨이페어·딕스·갭이 뮤즈 쇼핑 파트너로 이름을 올렸다(아마존 제외). JP모건은 소매 파트너십에서 광고 외에 수수료·테이크레이트 기반 거래 매출이 가능하다며 목표가를 \$820에서 \$920으로 올리고 뮤즈의 잠재력을 챗GPT에 비유했고, 키뱅크 \$900(종전 \$780), 시티즌스 \$885(\$770), 캔터 \$860(\$680)도 뒤따랐으며 모건스탠리는 비중확대·\$775, 미즈호는 아웃퍼폼·\$750을 유지했다. 지수가 보합인 날 대형 기술주 중 가장 강했고, 주간 상승률은 두 자릿수다.

**3. MGM 리조트 (MGM) −10.99% — \$33.69, 배리 딜러의 피플이 주당 \$48.30·총 \$180억 인수 제안 철회 "구성 요소가 기대대로 맞춰지지 않았다", BofA 중립 하향**
MGM리조트는 시가 \$33.87에서 장중 \$33.43까지 밀린 뒤 \$33.69(−\$4.16, −10.99%)로 마감해 S&P500 종목 중 최대 낙폭이었다. MGM 지분 약 27%를 보유한 배리 딜러의 피플이 주당 \$48.30, 총 \$180억 규모의 인수 제안을 철회하면서 "거래의 구성 요소들이 기대만큼 맞춰지지 않았다"고 밝혔고, 이는 완전 인수가 아니라 과반 지분 확보 제안이었다는 정정도 함께 나왔다. 제안가 대비 30% 넘는 할인으로 되돌아간 주가에 BofA는 투자의견을 매수에서 중립으로 내렸고, 라스베이거스 방문객 감소와 금리 5%대의 차입 부담이 겹친 카지노 업종은 인수 프리미엄이 사라지자 실적 자체로 평가받게 됐다. 피플이 27% 지분을 그대로 들고 있어 향후 재시도 가능성은 남지만, 시장은 이날 그 가능성에 값을 매기지 않았다.

**4. 그레일 (GRAL) +15.38% — \$125.21, FDA 자문위 다중암 조기검진 '갤러리' 안전성 10-0·유익성 7-2·유효성 6-4 찬성, 거래 재개 첫날 52주 신고가·베어드 목표가 \$118**
그레일은 시가 \$105.50에서 장중 \$101.98까지 밀렸다가 \$126.81까지 치솟은 뒤 \$125.21(+\$16.69, +15.38%)로 마감해 52주 신고가를 썼다. 전날 거래 정지 속에 열린 FDA 자문위원회는 혈액 기반 다중암 조기검진 갤러리에 대해 안전성 10-0, 유익성-위험 균형 7-2(기권 1), 유효성 6-4로 찬성했고, 위원들은 갤러리가 기존 암 검진 가이드라인을 "대체가 아니라 보완해야 한다"고 단서를 달았다. 유효성 표결이 6-4로 좁았던 만큼 FDA 최종 승인과 보험 급여 여부는 남은 변수이며, 베어드는 목표가를 \$118로 올렸지만 캐너코드는 매수·목표가 \$80을 유지해 시각이 갈렸다. 회사는 직전 분기 매출 \$4,470만(예상 \$4,320만)·주당 순손실 \$2.56을 냈고 6월 말 현금 \$5,565만 대비 부채 \$9,131만으로 재무는 여전히 얇다. 주가는 최근 1개월 34%·6개월 112% 올랐고, 승인 시 헬스케어 업종에서 가장 큰 '규제 이정표 종목'으로 꼽힌다.

**5. TD 시넥스 (SNX) −9.87% — \$259.47, 3분기 매출 \$215.6억(+38%)·EPS \$5.68 기록 실적과 4분기 가이던스 상향에도 잉여현금흐름 −\$9.76억·매출총이익률 −61bp에 급락**
TD시넥스는 시가 \$262.12에서 장중 \$243.03(−15.58%)까지 밀린 뒤 \$259.47(−\$28.42, −9.87%)로 마감했다. 회계연도 3분기 매출은 \$215.6억(+38%)으로 예상 \$189억을 크게 넘었고 조정 EPS \$5.68(+59%)은 컨센서스 \$4.64~4.70을 웃돌았으며, 총청구액은 \$318.3억(+40%), AI 서버 조립 부문 하이브는 총청구액 \$70억(+117%)·영업이익 \$2.53억(+56%)이었다. 4분기 가이던스도 매출 약 \$222억(예상 \$193.6억)·EPS \$5.90±0.25(예상 \$4.87)로 예상을 넘었다. 그러나 잉여현금흐름이 −\$9.76억, 영업현금흐름이 −\$9.17억으로 하이브 확장에 약 \$10억의 운전자본이 묶였고 매출총이익률은 6.61%(−61bp), 하이브 영업이익률은 5.04%에서 3.61%로 낮아져 시장은 "매출보다 마진 압박과 현금 소진"에 반응했다. 회사는 "데이터센터 수요 약화 조짐은 없고 가용 용량이 고객 수요에 미치지 못한다"고 했지만, 금리 5%대에서 운전자본을 빚으로 채우는 유통 모델의 취약성이 부각됐다.

**6. 다든 레스토랑 (DRI) −3.02% — \$207.24, 1분기 EPS \$2.05 예상 부합·매출 \$32억(+5%)에도 혼합 동일점포매출 +3.1%(예상 +3.3%) 미달, 올리브가든 +1.1%에 그쳐**
다든은 시가 \$208.88에서 장중 \$206.22까지 밀린 뒤 \$207.24(−\$6.45, −3.02%)로 마감했다. 회계연도 1분기 조정 EPS는 \$2.05로 예상과 같았고 매출은 \$32억(+5%)이었지만, 혼합 동일점포매출이 +3.1%로 예상 +3.3%를 밑돌았고 브랜드별로는 롱혼스테이크하우스 +6.2%가 이끈 반면 최대 브랜드 올리브가든은 +1.1%에 그쳐 외식 수요 둔화 우려를 키웠다. 전날 맥도날드 투자자의 날의 '업계 트래픽 정체' 전제, 이날 스타벅스의 북미 매장 250곳 폐점 발표, 아거스의 얌브랜즈 하향과 겹치면서 외식 업종 전반이 약세였고, 금리 5%대에 소비자의 외식 빈도가 줄고 있다는 해석이 붙었다. 회사는 연간 가이던스를 유지했지만 시장은 이미 '실적 부합'을 '가이던스 하단 위험'으로 읽었다.

**7. 에버퓨어 (P) +11.15% — \$121.88, 애널리스트 데이에서 2028 회계연도 매출 \$70~73억(컨센서스 \$63.7억)·비GAAP 영업이익 \$17~19억 예비 전망, 장중 +20%**
에버퓨어는 시가 \$113.95에서 장중 \$131.40(+19.84%)까지 치솟은 뒤 \$121.88(+\$12.23, +11.15%)로 마감했다. 전략 발표에서 회사는 2028 회계연도 매출을 \$70~73억으로 제시해 컨센서스 \$63.7억을 크게 넘겼고 이는 39~45%의 성장 가속을 뜻하며, 비GAAP 영업이익 \$17~19억 목표도 함께 내놨다. AI 인프라 확장기에 주요 고객사의 수요가 이어질 것이라는 성장 경로가 구체적 숫자로 제시되자 금리 급등 국면에서도 성장주에 자금이 몰렸고, 이날 S&P500 안에서 가장 큰 상승 종목이었다. 다만 장중 고가 대비 7% 반납은 2028년 목표의 실행 위험과 밸류에이션 부담을 시장이 동시에 계산했다는 뜻이다.

**8. 네비우스 (NBIS) +7.44% — \$243.48, BNP파리바 아웃퍼폼 상향·목표가 \$260 → \$399, BofA 2027~2028 회계연도 매출 전망 \$127억·\$273억으로 컨센서스 상회 조정**
네비우스는 시가 \$232.03에서 장중 \$249.19까지 올라 \$243.48(+\$16.87, +7.44%)로 마감했다. BNP파리바가 투자의견을 아웃퍼폼으로 올리고 목표가를 \$260에서 \$399로 53% 높였고, BofA는 2027 회계연도 매출 전망을 \$127억(컨센서스 \$122억), 2028 회계연도를 \$273억(컨센서스 \$249억)으로 올려 잡았다. 같은 날 JP모건이 코어위브(CRWV)를 비중확대·목표가 \$125로 상향하며 "강한 수요 배경 속에 프리미엄 가격의 단기 계약에 기대고 있다"고 평가해 코어위브도 \$90.13(+3.72%)로 올랐고, 오라클의 프로젝트 주피터 불가항력 통지가 나온 날이라 '전력·부지를 확보한 네오클라우드가 반사이익을 얻는다'는 해석이 붙었다. AI 인프라 안에서도 데이터센터 건설 리스크가 있는 쪽과 가동 중 용량을 파는 쪽이 갈린 하루였다.

**9. 스타벅스 (SBUX) −0.52% — \$93.65, 브라이언 니콜 CEO 턴어라운드의 일환으로 북미 매장 약 1%(250곳) 폐점 발표, 외식 업종 약세 속 소폭 하락**
스타벅스는 시가 \$93.96·고가 \$94.49·저가 \$92.76을 거쳐 \$93.65(−\$0.49, −0.52%)로 마감했다. 회사는 브라이언 니콜 CEO의 '백 투 스타벅스' 턴어라운드 계획의 일환으로 북미 매장의 약 1%인 250곳을 폐점한다고 발표했고, 실적이 부진하거나 매장 경험을 개선하기 어려운 점포를 정리해 남은 매장의 투자 여력을 높이겠다는 설명을 붙였다. 지난해 대규모 폐점과 인력 감축에 이은 두 번째 구조조정으로, 시장은 이를 비용 절감으로 받아들이면서도 다든의 동일점포매출 미달·맥도날드의 트래픽 정체 전제와 함께 외식 수요 둔화의 신호로 읽어 낙폭은 제한적이었다. 다음 달 4분기 실적에서 폐점 관련 비용과 동일점포매출 회복 여부가 확인된다.

**10. 인텔 (INTC) +3.91% — \$127.39, 반도체 저가 매수 속 최대 상승·AMD +2.38%, 트럼프·시진핑 회담은 '무역 휴전 2027년 1월 10일까지 연장'으로 반도체 합의 없이 종료**
인텔은 시가 \$120.61에서 장중 \$127.43까지 올라 고가 부근인 \$127.39(+\$4.79, +3.91%)로 마감해 필라델피아 반도체지수 구성 종목 중 가장 강했고, AMD(AMD)도 \$629.26(+2.38%)로 반등했다. 워싱턴 정상회담에서 베선트 재무장관은 미중 무역 휴전을 2개월 연장해 2027년 1월 10일까지 이어 간다고 발표했고, 양국은 국가 안보에 영향을 미치는 주요 AI 사고를 상호 통보하는 안전 장치와 공식 AI 대화 채널을 논의했으며 트럼프는 AI 규제 공조에 대해 "우리의 가드레일은 법무부"라고 선을 그었다. 키뱅크가 전날 추정한 H200 150만 개·\$300억 규모의 대중 수출 승인은 발표되지 않았지만 엔비디아(NVDA)는 \$224.58(−0.41%)로 실망 매물이 크지 않았고, 대신 미국 내 파운드리·PC CPU 비중이 커 대중 수출 변수에서 상대적으로 자유로운 인텔에 자금이 몰렸다. 반도체지수는 장중 −2.2%에서 −0.33%로 낙폭을 줄였고, 9/30 마이크론 실적이 다음 재료다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **JP모건 — 메타(META) 목표가 \$820 → \$920 상향.** 소매 파트너십에서 광고 외 수수료·거래 매출 가능, 뮤즈의 잠재력을 챗GPT에 비유. 키뱅크 \$900·시티즌스 \$885·캔터 \$860도 동반 상향.
- **BNP파리바 — 네비우스(NBIS) 아웃퍼폼 상향, 목표가 \$260 → \$399.** BofA는 2027~2028 회계연도 매출을 \$127억·\$273억으로 컨센서스 위로 조정.
- **JP모건 — 코어위브(CRWV) 비중확대 상향, 목표가 \$125.** "강한 수요 배경 속에 프리미엄 가격의 단기 계약에 기대고 있다."
- **JP모건 — 리츠 재편.** 웰타워(WELL)·이스트그룹(EGP)·메이스리치(MAC)·리젠시(REG) 비중확대 상향, 알렉산드리아(ARE)·세이프홀드(SAFE) 비중축소 하향, GLPI·콜드(COLD)·탱거(SKT) 중립 하향. 세이프홀드는 "더 높게 더 오래" 금리가 근거.
- **HSBC — 달러제너럴(DG) 매수 상향, 목표가 \$125 → \$160.** "회복이 약속에서 실행으로 옮겨 가고 있다."
- **번스타인 — 퀀타서비스(PWR) 아웃퍼폼 상향, 목표가 \$775.** "\$1,700억 송전 프로젝트 파이프라인, 2025년 대비 25% 증가."
- **씨티 — 드롭박스(DBX) 매도 하향.** AI 스토리지 전환의 "지나친 성공"이 밸류에이션에 반영됐다는 논리. 파이퍼는 롤린스(ROL) 중립 하향(목표가 \$33), 아거스는 얌브랜즈(YUM) 보유 하향, BofA는 MGM리조트(MGM) 중립 하향.
- **베어드 — 그레일(GRAL) 목표가 \$118 상향.** 캐너코드는 매수·\$80 유지로 시각이 갈림. 파이퍼는 아레스(ARES)·칼라일(CG) 비중확대 신규 커버("너무 싸서 무시할 수 없다"). 오펜하이머는 다이나트레이스(DT) 목표가 \$60 → \$71.

**구루·시장 코멘트**
- **릭 리더(블랙록)** — 이번 금리 급등은 "위기는 아니지만 경종". 주식에 'B−' 학점, 메모리·컴퓨트 관련주는 선별적으로 선호.
- **다니엘라 해손(캐피털닷컴)** — "실질금리가 실질적으로 올랐다는 증거가 쌓이고 있다." 5년여 만의 최강 PMI가 채권 매도의 배경.
- **애나 폴슨(필라델피아 연은 총재)** — 인플레이션이 이어지면 "완만한 추가 긴축이 정당화될 수 있다."
- **데니스 로스(전 미국 협상가)** — "봉쇄가 이란을 진짜 옥죄고 있다. 숨통을 조이고 있다."
- **이란 고위 관계자** — "위기를 단계별로 풀어 가는 것이 한 방법이다. 첫 단계는 봉쇄 종료와 호르무즈 재개방." 다른 관계자는 "우리 손가락은 방아쇠에 있다."
- **스콧 베선트(미 재무장관)** — 미중 무역 휴전 2개월 연장(2027년 1월 10일까지), AI 대화 채널·안전 사고 통보 체계 논의.
- **도널드 트럼프** — "초지능 분야의 결정이 앞으로 수십 년의 평화와 번영을 좌우한다", AI 규제 공조에는 "우리의 가드레일은 법무부."
- **시진핑** — "AI 발전은 인간의 통제 아래 있어야 하며 국민 복지에 기여해야 한다."
- **오라클** — "프로젝트는 계획대로 진행 중이며, 통지는 재무 약정의 변경을 뜻하지 않는다."

### 🇰🇷 한국 개장 관전 포인트
- **연휴 둘째 날 — 국내 정규장·야간선물 모두 휴장(9/24~26), 9/28(월) 재개.** 코스피200 야간선물은 연휴 기간 파생상품 야간시장이 열리지 않아 이날도 시세가 없다(직전 9/22 밤 세션 종가 1,140.70). 연휴 첫날 미국은 지수 보합(나스닥 +0.01%·S&P500 −0.02%)으로 끝나 9/28 갭의 방향은 아직 정해지지 않았고, 남은 두 거래일의 PCE·호르무즈 협상이 결정 변수다.
- **메모리 이틀째 조정 — SKHY −1.54%(\$186.37)·샌디스크 −3.47% vs 마이크론 +0.81% 반등.** 괴리율은 9/23 원주 1,862,000원·환율 1,358.4원 기준 약 +38.1%에서 약 +36.0%로 좁혀졌다. 연휴 전 삼성전자 +3.25%·SK하이닉스 +1.20%로 국내가 앞서 오른 상태라 9/28 개장에는 ADR 이틀 조정분이 먼저 반영될 가능성이 있고, 9/30 마이크론 실적 전 미국 메모리가 반등하면 갭은 좁아진다.
- **트럼프·시진핑 회담 — 반도체 합의 없이 '휴전 2개월 연장(2027년 1월 10일까지)·AI 대화 채널'.** H200 대중 수출 승인과 반도체 관세는 발표되지 않았고 후속 실무 발표가 25~26일에 나올 수 있다. 국내 반도체에는 직접 재료가 없는 결과이지만, 미중 충돌 리스크가 두 달 미뤄졌다는 점은 외국인 수급에 중립 이상이다.
- **오라클 '불가항력'과 AI 인프라 병목.** \$1,650억 프로젝트 주피터의 에너지 허가 거부는 데이터센터 전력 병목이 실제 일정 지연으로 이어지는 첫 사례로, 전력기기·변압기·냉각 등 국내 AI 인프라 수혜주에는 '수요는 강하나 실행이 늦어진다'는 양면 재료다. 같은 날 네비우스·코어위브 상향은 가동 중 용량의 희소성을 뜻해 HBM 수요 자체에는 부정적이지 않다.
- **금리 — 10년물 5.19%·30년물 5.48%(22년 최고), 모기지 7.37%.** 단기물은 멈추고 장기물만 오르는 베어 스티프닝이 이틀째로, 국내 장기 국채와 성장주 밸류에이션에 부담이다. 금요일 밤 PCE가 예상을 넘으면 원/달러(9/23 1,358.4원)와 외국인 수급이 연휴 뒤 흔들릴 수 있고, 반대로 호르무즈 합의가 진전되면 유가 하락이 금리 부담을 일부 상쇄한다.
- **외식·소비 둔화 신호.** 다든 동일점포매출 미달, 스타벅스 250곳 폐점, 맥도날드의 트래픽 정체 전제가 사흘 연속 나왔다. 미국 소비의 둔화는 국내 소비재·면세·화장품의 미국향 수요보다 금리 인상 사이클의 끝을 앞당기는 변수로 읽는 것이 맞다.
