# 미국→한국 선점 2026-10-28 (미국 2026-10-27 마감 반영)

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 12개:** 조선·LNG선·함정 MRO(격차 +16.9%p), 방산(격차 +14.4%p), 정유·LNG·가스(격차 +13.8%p), 화장품·K뷰티(격차 +11.8%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 반도체 소재·부품, OLED·디스플레이, Marine Transportation, 보험 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 사이버보안(-12.9%p), 유전체·유전자치료(-10.4%p), 클라우드·데이터센터 운영(-7.3%p)
