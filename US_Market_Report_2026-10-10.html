## 🗓 시장 요약

**① S&P500 7,811.54(+0.59%)·나스닥 27,366.17(+0.64%)·다우 51,654.95(+0.83%) — 반도체 진정 속 헬스케어·부동산 주도로 사흘 만에 반등, 다우·S&P500 주간 상승**
금요일 미국 지수는 전날 반도체 급락을 딛고 일제히 올랐다. S&P500은 **7,811.54(+46.18, +0.59%)**, 나스닥은 **27,366.17(+172.83, +0.64%)**, 다우는 **51,654.95(+423.31, +0.83%)**로 마감했고 나스닥100은 30,883.15(+0.51%), 러셀2000은 2,806.98(+0.46%)였다. 업종별로는 부동산(+1.85%)과 헬스케어(+1.48%)가 앞섰고 통신서비스(−1.62%)가 가장 약했다. VIX는 **14.84(−3.70%)**로 내려 불안 심리가 누그러졌다. 다우와 S&P500은 주간으로도 올랐고 러셀2000만 주간 하락(−0.91%)이었다. 캐피털닷컴의 다니엘라 하손은 "강한 실적과 완화되는 물가의 조합이 증시에 가장 우호적인 배경"이라고 말했다. 해석하면 전날 '기술주만의 조정' 이후 매수가 방어·실적 업종으로 넓게 들어온 하루였다.

**② 10년물 5.24%·2년물 4.80%·30년물 5.60% — 단기물 중심 금리 상승, 미시간대 소비심리 46.3으로 예상 하회**
채권시장에서는 단기물 금리가 더 많이 올랐다. 미 재무부 기준 2년물은 **4.80%(+5.0bp)**, 10년물은 **5.24%(+2.0bp)**, 30년물은 **5.60%(보합)**로 마감해 장단기 금리차가 좁혀졌다. 10월 미시간대 소비자심리지수 예비치는 **46.3**으로 9월 48.1과 예상치 47.6을 모두 밑돌았고, 조앤 수 미시간대 소비자조사 책임자는 생활비에 대한 불만이 계속 커지고 있다고 밝혔다. 다음 주 수요일 9월 CPI는 9월 인상 이후 연준이 동결할 수 있을지를 가를 지표로 꼽힌다. 월요일 10/12는 콜럼버스 데이로 주식시장은 열리지만 채권시장은 휴장한다.

**③ WTI \$91.69·브렌트 \$104.44 — 트럼프 "중간선거 전 이란 공격 없다", 허리케인으로 멕시코만 생산 63% 중단**
유가는 강보합이었다. WTI는 **\$91.69(+0.22%)**, 브렌트는 **\$104.44(+0.15%)**로 정산했고 장중 브렌트는 \$102.39까지 밀렸다. 트럼프 대통령이 11월 3일 중간선거 전에는 이란을 공격하지 않겠다고 밝히고, 이란이 호르무즈 해협을 7일 안에 다시 여는 방안에 대한 미국 측 답변을 검토 중이라는 소식이 상단을 눌렀다. 반면 3등급 허리케인 이사이아스로 멕시코만 원유 생산의 약 63%(하루 약 128만 배럴)가 중단되고 플랫폼 121곳에서 인력이 철수해 하단을 받쳤다. 금은 장 초반 \$4,209.60(+1.27%)이었다. 해석하면 중동 군사 위험은 다소 누그러졌지만 공급 차질이 유가를 \$90대에 묶어 두고 있다.

**④ AI·반도체 — SOX −0.41%로 진정, 엔비디아 −0.52%·마이크론 −0.66%·SK하이닉스 ADR −0.86%, 광통신은 루멘텀 +5.22%·AAOI +3.53% 반등**
필라델피아 반도체지수는 **12,572.42(−0.41%)**로 장중 고가 12,826.67까지 올랐다가 상승분을 반납했다. 엔비디아(NVDA)는 \$229.28(−0.52%), 마이크론(MU)은 \$1,029.00(−0.66%)로 소폭 내렸다. 오픈AI의 9월 연환산 매출이 약 \$500억으로 9월 말 거론된 수치보다 약 \$200억 적다는 파이낸셜타임스 보도가 AI 인프라 반등을 제한했다. 반면 루멘텀(LITE)은 마이클 헐스턴 CEO가 광부품 생산능력이 2029년 초까지 "완전히 매진"됐다고 밝히며 **\$1,103.36(+5.22%)**, 어플라이드 옵토일렉트로닉스(AAOI)도 \$109.64(+3.53%)로 반등했다. 아이폰 18 프로 부품 주문이 15~20% 줄었다는 닛케이아시아 보도에 애플(AAPL)은 \$336.64(−1.11%), 스카이웍스(SWKS)는 \$76.35(−5.45%)로 내렸다.

**⑤ 회사 고유 재료 — 스페이스X 주파수 인수에 통신 3사 급락·크라운캐슬 급등, 휴매나 +11.56%(별점 4개 회복), 모더나 +14.21%(나스닥100 재편입), 델타 보합(가이던스 하향)**
스페이스X(SPCX)가 그레인 매니지먼트로부터 약 \$80억 규모의 800MHz 저대역 주파수를 사들이기로 하면서 위성 직접통신이 기존 이동통신사를 위협할 수 있다는 우려에 티모바일(TMUS) **\$148.58(−13.27%)**, AT&T(T) \$22.18(−9.81%), 버라이즌(VZ) \$41.65(−8.75%)가 급락했다. 같은 소식에 통신탑 업체 크라운캐슬(CCI)은 **\$79.64(+15.60%)**로 뛰었다. 휴매나(HUM)는 대표 메디케어 어드밴티지 계약의 별점이 4개로 회복돼 \$431.87(+11.56%)로 올랐고, 모더나(MRNA)는 나스닥100 재편입 발효일에 \$225.00(+14.21%)로 급등했다. 델타항공(DAL)은 2년 만에 처음 이익 예상치를 밑돌고 연간 가이던스를 내렸지만 \$82.17(+0.04%)로 낙폭을 모두 회복했다.

**⑥ 🇰🇷 SK하이닉스 ADR \$169.03(−0.86%)·SOX −0.41%·야간선물 1,028.95(−1.84%, 10/8 세션) — 10/12(월) 사흘 만의 개장**
SK하이닉스 ADR(SKHY)은 고가 \$173.30(+1.64%)까지 올랐다가 **\$169.03(−\$1.47, −0.86%)**로 내려 엿새째 약세였다. 코스피200 야간선물은 10/9 한글날 휴장으로 새 세션이 없었고 직전 10/8 세션은 **1,028.95(−19.30, −1.84%)**로 마감했다. 해석하면 금요일 미국 반도체가 추가 급락을 피하면서 월요일 갭 하락 부담은 목요일 밤보다 줄었다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 스페이스X (SPCX) +1.25% — 그레인의 800MHz 주파수 약 \$80억에 인수, 바클레이스 '매수'·목표주가 \$254로 커버리지 개시**
스페이스X는 시가 \$165.34에서 고가 \$166.38(+3.62%)까지 오른 뒤 \$162.57(+\$2.00, +1.25%)로 마감했다. 회사는 그레인 매니지먼트로부터 전국 단위 800MHz 저대역 주파수를 약 \$80억에 인수하기로 합의해 위성-휴대폰 직접통신 사업을 크게 넓히게 됐다. 바클레이스의 앤서니 발렌티니는 투자의견 '매수'와 목표주가 \$254로 커버리지를 시작했다. 전날 \$400억 차입 계획 보도로 −4.19% 밀렸던 주가는 하루 만에 반등했다.

**2. 티모바일 (TMUS) −13.27% — 스페이스X의 \$80억 주파수 인수 계약 발표로 위성 직접통신 경쟁 우려, 장중 −13.67%**
티모바일은 시가 \$155.51에서 저가 \$147.90(−13.67%)까지 밀린 뒤 \$148.58(−\$22.73, −13.27%)로 마감했다. 스페이스X가 그레인 매니지먼트와 약 \$80억 규모 800MHz 저대역 주파수 인수 계약을 맺었다고 발표하면서 스타링크 위성 직접통신이 기존 이동통신사의 가입자를 잠식할 수 있다는 우려가 커졌다. 프리마켓 −7.49%로 출발한 낙폭은 정규장에서 오히려 커졌고 장중 고가도 \$156.89(−8.42%)에 그쳤다.

**3. 크라운캐슬 (CCI) +15.60% — 스페이스X의 주파수 인수 수혜 기대, 통신탑 임대 수요 확대 전망**
크라운캐슬은 시가 \$74.32에서 고가 \$79.79(+15.82%)까지 오른 뒤 \$79.64(+\$10.75, +15.60%)로 거의 고가에 마감했다. 스페이스X가 그레인 매니지먼트로부터 약 \$80억 규모 저대역 주파수를 인수하기로 하면서 새 주파수 운용을 위한 지상 기지국·통신탑 임대 수요가 늘어날 것이라는 기대가 붙었다. 프리마켓 +7.60%로 시작한 상승 폭이 정규장에서 두 배로 커졌고 부동산 업종(+1.85%) 상승을 이끌었다.

**4. AT&T (T) −9.81% — 스페이스X 주파수 인수 충격에 통신주 동반 급락, 장중 −11.70%**
AT&T는 시가 \$22.38에서 저가 \$21.96(−11.70%)까지 밀린 뒤 \$22.18(−\$2.41, −9.81%)로 마감했다. 스페이스X가 약 \$80억에 800MHz 주파수를 확보해 위성 기반 이동통신 사업을 본격화할 수 있게 되자 기존 통신사의 가입자 기반과 요금 결정력이 흔들릴 수 있다는 우려가 번졌다. 통신서비스 업종은 −1.62%로 11개 업종 중 가장 크게 내렸다.

**5. 버라이즌 (VZ) −8.75% — 스페이스X발 경쟁 우려에 통신 3사 동반 약세, 장중 −11.95%**
버라이즌은 시가 \$42.83에서 저가 \$40.81(−11.95%)까지 밀린 뒤 \$41.65(−\$3.99, −8.75%)로 마감했다. 스페이스X가 그레인 매니지먼트의 800MHz 저대역 주파수를 약 \$80억에 인수하기로 하면서 위성-휴대폰 직접통신이 기존 무선 사업의 경쟁자로 부상할 수 있다는 평가가 나왔다. 프리마켓 −5.58%로 출발해 오후 들어 낙폭이 다소 줄었다.

**6. 휴매나 (HUM) +11.56% — CMS가 대표 메디케어 어드밴티지 계약(H5216) 별점을 3.5개에서 4개로 회복, 장중 +17.92%**
휴매나는 시가 \$450.49에서 고가 \$456.50(+17.92%)까지 오른 뒤 \$431.87(+\$44.75, +11.56%)로 마감했다. 미 메디케어·메디케이드서비스센터(CMS)가 가입자 200만 명 이상인 대표 메디케어 어드밴티지 계약(H5216)의 별점을 3.5개에서 4개로 되돌려 2027년 품질 보너스 지급 기대가 살아났다. 프리마켓 +14.45%로 출발했고 헬스케어 업종(+1.48%) 강세를 이끌었다.

**7. 모더나 (MRNA) +14.21% — 나스닥 발표에 따른 나스닥100 지수 재편입 발효, 바이오 업종 강세 속 고가 마감**
모더나는 시가 \$199.10에서 출발해 \$225.00(+\$28.00, +14.21%)로 장중 고가에 마감했다. 나스닥이 앞서 발표한 지수 정기 변경에 따라 이날 개장 전 나스닥100 재편입이 발효되면서 지수 추종 자금의 매수 수요가 붙었다. 노바백스 등 바이오주도 함께 오르며 업종 전반의 강세가 이어졌고 장중 저가 \$197.17도 전일 종가를 웃돌았다.

**8. 델타항공 (DAL) +0.04% — 2년 만에 첫 이익 예상치 하회, 연간 조정 EPS 가이던스 \$5.10~\$5.60으로 하향**
델타항공은 저가 \$79.16(−3.63%)까지 밀렸다가 \$82.17(+\$0.03, +0.04%)로 낙폭을 모두 회복했다. 3분기 이익이 2년 만에 처음 예상치를 밑돌았고 2026년 조정 주당순이익 전망을 기존 \$6.50~\$7.50에서 \$5.10~\$5.60으로, 잉여현금흐름 전망을 최대 \$40억에서 \$25억으로 낮췄다. 에드 배스천 CEO가 "소비자 반응은 여전히 매우 강하다"고 밝히면서 수요 우려가 진정됐다.

**9. HP (HPQ) −6.91% — 규제 공시에서 2027년 글로벌 PC 출하 '한 자릿수 중반' 감소 전망**
HP는 시가 \$31.95에서 저가 \$29.89(−7.86%)까지 밀린 뒤 \$30.20(−\$2.24, −6.91%)로 마감했다. 회사는 규제 공시에서 2027년 글로벌 PC 출하량이 한 자릿수 중반 비율로 줄어들 것으로 내다봤다. 메모리 칩 부족과 AI 데이터센터 수요 쏠림이 PC·스마트폰 가격과 수요를 압박하고 있다는 분석이 나왔고, 장중 고가 \$31.94도 전일 종가를 밑돌았다.

**10. 스카이웍스 (SWKS) −5.45% — 애플의 아이폰 18 프로 10월 부품 주문 15~20% 감축 보도**
스카이웍스는 시가 \$79.35에서 저가 \$73.93(−8.44%)까지 밀린 뒤 \$76.35(−\$4.40, −5.45%)로 마감했다. 애플이 아이폰 18 프로 모델의 10월 부품 주문을 15~20% 줄였다는 닛케이아시아 보도가 나오며 매출의 상당 부분을 애플에 의존하는 RF 칩 업체에 매도가 몰렸다. 애플(AAPL)도 \$336.64(−1.11%)로 내렸고, 스카이웍스는 전날 −3.21%에 이어 이틀째 약세였다.
