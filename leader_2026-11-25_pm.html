# 미국→한국 선점 2026-11-25 (미국 2026-11-24 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 79개 · 연결 종목 888개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** Advertising(격차 +16.2%p), 스마트폰·애플 부품(격차 +14.2%p), 바이오텍·기술수출(격차 +12.1%p), 통신·5G(격차 +10.6%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 비만치료제, 게임, 건설·인프라·재건, 해운 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 사이버보안(-35.8%p), 항공·여행·카지노·면세(-23.5%p), 중국 소비·관광 회복(-21.9%p)
- **이제 막 힘 붙는 조기 테마:** 유통·이커머스(조기 74), 유전체·유전자치료(조기 72), 중국 소비·관광 회복(조기 68) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 녹십자(바이오텍·기술수출, 점수 100), LG유플러스(통신·5G, 점수 85), HMM(해운, 점수 75)
