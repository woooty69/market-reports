## 🗓 시장 요약

**① 5,000선 붕괴 뒤 반등, 기관·ETF 자금이 받쳤다** — 코스피는 미국 기술주 반등에도 장 초반 4,990선까지 밀렸지만 기관 순매수 7,547억원과 ETF·기타법인 매수에 힘입어 오전 중 5,150선을 회복했다. 고저 범위는 약 182포인트로 변동성이 여전히 크다. 외국인은 코스피 −6,009억원·코스닥 −1,104억원으로 매도를 이어 갔다.

**② 반도체 대형주 반등, 소부장으로 확산** — SK하이닉스는 1,174,000원(+3.71%), 삼성전자는 194,200원(+2.91%)으로 거래대금 1·2위(2조 7,119억원·2조 748억원)를 차지했다. 코스닥에서는 주성엔지니어링(+12.42%)·심텍(+10.48%)·테크윙(+12.74%)·티씨케이(+10.48%) 등 장비·기판·부품주가 10% 넘게 올라 반도체 업종이 152개 상승·15개 하락으로 고르게 올랐다.

**③ 항공·통신장비 강세, 2차전지·바이오 약세** — 한진칼(+10.40%)이 경영권 분쟁 기대로 신고가를 쓰고 한진칼우·대한항공우·아시아나IDT가 상한가에 올라 항공 업종이 +6.32%다. 반면 삼성SDI(−7.26%)·LG에너지솔루션(−2.96%)·에코프로(−4.08%) 등 2차전지와 알테오젠(−13.57%) 중심의 생물공학(−3.64%), 실적 쇼크의 LIG D&A(−8.74%)가 약하다.

**④ 원화 강세·일본 급반등, 미 선물 상승** — 원/달러는 1,355.0원으로 8.5원 내렸다. 닛케이225가 +3.44% 급반등했고 S&P500·나스닥100 선물도 0.6% 안팎 오르며 지난주 블루웨이브발 AI 투자 위축 충격이 일부 진정되는 모습이다. 미국 10월 고용(비농업 +16.5만 명, 실업률 4.1%)이 예상보다 좋아 금리 인상 경계가 남아 있다는 점은 부담이다.

## 1. 업종별 흐름

**상승 업종** — 통신장비(+6.99%, 41개 상승)는 RFHIC(+16.13%)·엑스게이트(+12.48%)가 이끌었고, 항공(+6.32%)은 한진칼 경영권 분쟁과 계열 LCC 재편 기대로 에어부산(+11.10%)까지 올랐다. 반도체와반도체장비(+3.37%)는 대형주와 소부장이 함께 올랐고, 소프트웨어(+3.75%)·IT서비스(+2.98%)는 LG씨엔에스(+6.61%)·래블업(+14.12%)이 강했다. 생명보험(+3.13%)은 삼성생명(+3.20%)이 이끌었다.

**하락 업종** — 전기제품(−3.65%)은 삼성SDI(−7.26%)·LG에너지솔루션(−2.96%) 등 2차전지가 눌렀고, 생물공학(−3.64%)은 알테오젠(−13.57%) 급락 영향이 컸다. 해운(−3.20%)은 HMM(−4.08%), 조선(−1.55%)은 삼성중공업(−3.83%)·HD현대중공업(−2.29%)이 약했고 화장품(−1.92%)·증권(−1.91%)도 밀렸다.

**시장의 시선** — 오후장은 외국인 매도가 줄어드는지와 반도체 대형주 반등이 종가까지 이어지는지가 관건이다. 코스닥 소부장의 10%대 급등은 지난주 급락에 따른 되돌림 성격이 있어 차익 실현 매물을 주의할 필요가 있다. 2차전지·방산은 실적 쇼크와 미국 정책 불확실성으로 반등에서 소외돼 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 50종목

*① 오전장 새로 편입된 급등주(시총 1,000억원 이상 · +10% 이상) 32종목(1～32번, 시총 큰 순) → ② 오전장 언론 최다 보도 18선(33～50번).*

**1. 티씨케이 (064760) 151,800원 · 1조 6,970억원 · +10.48% — SiC 포커스링 증설·고단화 기대에 소부장 반등 동참**
반도체 소부장 반등 속에 거래대금 72억원을 넘기며 10%대 올랐다. 오전 중 개별 뉴스는 확인되지 않았지만, 11/5 한국IR협의회 리포트는 SiC 포커스링 글로벌 1위 업체로서 증설과 낸드 고단화, 신규 적용처 확대를 성장 요인으로 꼽았다. 지난주 반도체 급락분을 되돌리는 흐름이라 업종 수급 영향이 크다. [리포트: KIRS 2026-11-05](https://woooty69.github.io/hw-pdf-arch-037/%ED%8B%B0%EC%94%A8%EC%BC%80%EC%9D%B4%EF%BC%BB064760%EF%BC%BD_20261105_KIRS_197635.pdf) · [리포트: Korea Investment 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/%ED%8B%B0%EC%94%A8%EC%BC%80%EC%9D%B4%EF%BC%BB064760%EF%BC%BD_20261102_Korea%2BInvestment_4074955293.pdf) · [리포트: KB 2026-10-30](https://woooty69.github.io/hw-pdf-arch-035/%ED%8B%B0%EC%94%A8%EC%BC%80%EC%9D%B4%EF%BC%BB064760%EF%BC%BD_20261030_KB_4015627843.pdf)

**2. SFA반도체 (036540) 7,250원 · 1조 1,923억원 · +20.23% — 패키징 실적 턴어라운드 기대, 거래대금 243억원**
상승률 1위권으로 거래대금 243억원이 몰렸다. 개별 뉴스는 확인되지 않았으나 한국투자증권(10/2)은 3분기 매출 1,471억원(+52.5% YoY)으로 외형이 커지고 있고 적자는 3분기가 마지막이라며 목표가를 14,000원으로 올린 바 있다. 메모리 후공정 가동률 회복 기대가 소부장 반등과 맞물렸다. [리포트: Korea Investment 2026-10-02](https://woooty69.github.io/hw-pdf-arch-028/SFA%EB%B0%98%EB%8F%84%EC%B2%B4%EF%BC%BB036540%EF%BC%BD_20261002_Korea%2BInvestment_4070007368.pdf) · [리포트: iM 2026-09-21](https://woooty69.github.io/hw-pdf-arch-029/SFA%EB%B0%98%EB%8F%84%EC%B2%B4%EF%BC%BB036540%EF%BC%BD_20260921_iM_4098114928.pdf) · [리포트: Korea Investment 2026-09-14](https://woooty69.github.io/hw-pdf-arch-029/SFA%EB%B0%98%EB%8F%84%EC%B2%B4%EF%BC%BB036540%EF%BC%BD_20260914_Korea%2BInvestment_4074135957.pdf)

**3. 테크윙 (089030) 31,850원 · 1조 1,802억원 · +12.74% — 메모리 테스트 핸들러, 반도체 장비 반등 주도주**
반도체 장비주 동반 급등 속에 거래대금 116억원으로 12%대 올랐다. 오전 개별 뉴스는 확인되지 않았고, SK하이닉스(+3.71%)·삼성전자(+2.91%) 반등과 함께 HBM·고성능 메모리 테스트 장비 수요 기대가 다시 반영되는 것으로 보인다. 지난주 블루웨이브발 급락의 되돌림 성격도 크다. [리포트: Shinhan 2026-04-28](https://woooty69.github.io/hw-pdf-arch-005/%ED%85%8C%ED%81%AC%EC%9C%99%EF%BC%BB089030%EF%BC%BD_20260428_Shinhan_1091870.pdf) · [리포트: Shinhan 2026-03-06](https://woooty69.github.io/hw-pdf-arch-002/%ED%85%8C%ED%81%AC%EC%9C%99%EF%BC%BB089030%EF%BC%BD_20260306_Shinhan_1077813.pdf) · [리포트: Shinhan 2026-01-22](https://woooty69.github.io/hw-pdf-arch-004/%ED%85%8C%ED%81%AC%EC%9C%99%EF%BC%BB089030%EF%BC%BD_20260122_Shinhan_1065606.pdf)

**4. RFHIC (218410) 43,200원 · 1조 1,482억원 · +16.13% — 통신장비 업종 +6.99% 선봉, 증권가 목표가 7만～8만원대**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
