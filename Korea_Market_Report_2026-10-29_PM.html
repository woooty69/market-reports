# 📊 한국증시 데일리 리포트 (저녁판)
### 2026년 10월 29일(목) 18시 작성 · 기준일: 10월 29일(목) 정규장 (저녁판)

> 10월 29일 정규장 마감과 장 마감 후 18시대까지 나온 뉴스·공시·증권사 리포트를 정리했습니다. 삼성전자가 3분기 매출 195.3조원·영업이익 107.4조원으로 사상 첫 분기 100조원 이익을 내고 3분기 현금배당 30조원·연간 최대 110조원 환원을 내놨지만, 자사주 매입·소각 일정 등 구체안이 내년 1월로 미뤄지자 4.34% 떨어졌고 코스피는 장중 6,100.11까지 올랐다가 74.78포인트(−1.24%) 내린 5,937.66으로 마감해 하루 만에 6,000선을 내줬습니다. 기관이 4,276억원을 팔았고 외국인은 962억원을 샀습니다. 한수원이 대우건설·두산에너빌리티 컨소시엄과의 체코 두코바니 원전 시공계약 협상을 종료하면서 대우건설(−20.11%)·두산에너빌리티(−7.98%)·한전기술(−7.59%)이 급락했고, LG화학의 2.5조원 지분 처분에 LG에너지솔루션이 8.47% 내렸습니다. 반면 한화비전(+21.27%)은 3분기 영업이익 1,026억원(+183%), SK스퀘어(+4.02%)는 골드만삭스와의 티맵모빌리티 매각 협상, 금융지주는 역대 최대 실적에 올랐습니다. 장 마감 후에는 대원제약의 P-CAB 신약 3상 성공, SK의 주식교환 결정, KB금융 3분기 순이익 1.9조원이 나왔습니다.

## 🗓 시장 요약

**① 코스피 5,937.66(−1.24%), 하루 만에 6,000선 반납… 기관 4,276억원 순매도, 장중 고저 차 282포인트**
삼성전자가 사상 최대 실적을 내놨지만 시장이 기대한 자사주 매입·소각 일정이 빠지면서 지수는 장중 6,100선에서 5,817선까지 282포인트를 오르내렸다. 기관은 금융투자(−2,606억원)·투신(−1,442억원)·연기금(−1,281억원)이 고르게 팔았고, 외국인은 KRX 기준 962억원을 샀지만 NXT를 포함한 통합 기준으로는 3,021억원 순매도였다. 개인은 정규장 마감(15:35) 기준 343억원 순매수였으나 장후 시간외 거래를 포함한 최종치는 49억원 순매도로 바뀌었다. 하락 종목이 크게 많았고 LS 테마 기준 로봇(−5.05%, 76종목 중 7종목 상승)·전선(−4.88%, 8종목 전부 하락)·원전 관련주가 무너졌다.

**② 반도체: 삼성전자 −4.34%·SK하이닉스 +2.62%… '107조 삼전' 떨어지고 '83조 하닉' 올랐다**
삼성전자는 3분기 매출 195.3조원·영업이익 107.4조원(반도체 106.5조원)으로 사상 첫 분기 100조원 이익을 냈고, HBM4 매출이 전분기 대비 3배 이상 늘고 내년 HBM 물량은 이미 완판됐으며 대형 고객 10곳과 장기공급계약(추가 10곳 협상 중)을 맺었다고 밝혔다. 3분기 현금배당 30조원과 연간 최대 110조원 환원을 제시했지만 잔여 재원 55조～75조원의 구체안은 내년 1월 이사회로 미뤄져 장중 24만 9천원에서 23만 1,500원까지 밀렸고 프로그램 매도가 2,893억원에 달했다. 올해 시설투자는 반도체 76.8조원을 포함한 84.4조원으로 역대 최대다. SK하이닉스는 전날 발표한 100조원 환원 효과가 이어지며 거래대금 6조 7,912억원으로 시장 1위였고 프로그램 매수 3,992억원이 들어왔다.

**③ 강세 업종: 금융지주·보험·증권, 실적 서프라이즈 개별주**
KB금융이 3분기 순이익 1.9조원(누적 5.8조원)으로 금융지주 첫 '6조 클럽'을 눈앞에 뒀고 5대 금융의 3분기 누적 이자이익이 40조원을 넘었다는 집계가 나오며 하나금융지주(+4.16%)·우리금융지주(+4.01%)·KB금융(+1.95%)·신한지주(+1.71%)가 올랐다. LS 테마 기준 은행은 +1.78%(11종목 중 8종목 상승), 손해보험 +1.31%였고 메리츠금융지주(+6.40%)·삼성화재(+2.67%)·한국금융지주(+3.90%)도 강했다. 개별주로는 3분기 영업이익 1,026억원(+183%)을 낸 한화비전이 21.27% 급등했고, 희토류 없는 백색 LED 개발에 서울반도체·서울바이오시스가 상한가, 마이크로 LED 테마가 +2.44%로 테마 1위였다.

**④ 약세 업종: 원전·건설·2차전지·방산·로봇**
한수원이 15개월간 이어온 체코 두코바니 5·6호기(약 27조원) 시공계약 협상을 종료하고 내년 7월까지 새 시공사를 뽑겠다고 밝히자 대우건설(−20.11%)·두산에너빌리티(−7.98%)·한전기술(−7.59%)·현대건설(−4.92%)이 급락했고 건설 업종이 −4.58%였다. LG에너지솔루션(−8.47%)은 LG화학이 약 2.5조원 규모 지분을 처분하며 지분율이 76.59%로 낮아졌고, 한화솔루션(−11.61%)·SKC(−11.22%)·에코프로비엠(−6.05%)도 약했다. 한화에어로스페이스(−6.23%)는 3분기 영업이익 4,520억원(−46%)의 어닝쇼크, SK이노베이션(−6.59%)은 역대 최대 이익(3조 7,043억원)에도 차익실현이 나왔다. 피지컬 AI/휴머노이드 테마는 −4.53%(46종목 중 4종목 상승)였다.

**⑤ 환율·금리·외부 변수: FOMC 동결 소화, 오늘 밤 미국 GDP·PCE와 아마존 실적**

**하락 업종** — 에너지장비및서비스(−6.73%, 상승 4·하락 27)가 가장 약했고 체코 원전 협상 결렬로 두산에너빌리티(−7.98%)·한전기술(−7.59%)이 급락했다. 소프트웨어(−5.62%, 상승 16·하락 46)는 전날 급등한 보안주가 되밀렸고, 기계(−5.58%)·전기제품(−5.18%)·전기장비(−4.62%)는 로봇·전선·2차전지주가 약했다(LS 테마 로봇 −5.05%·전선 −4.88%·2차전지(나트륨이온) −4.99%). 우주항공과국방(−4.85%)은 한화에어로스페이스(−6.23%) 어닝쇼크, 건설(−4.58%)은 대우건설(−20.11%)·현대건설(−4.92%), 조선(−4.37%, 상승 1·하락 27)은 HD현대중공업(−4.90%)·삼성중공업(−4.78%)·HD현대마린엔진(−10.20%)이 끌어내렸다.

**시장의 시선** — 삼성전자가 '역대 최대 실적+110조원 환원'에도 하락하면서 시장은 숫자보다 자사주 소각 일정 같은 실행 계획을 요구하고 있음을 보여줬다. 반도체 양강의 엇갈린 흐름 속에 오늘 밤 미국 3분기 GDP 속보치·9월 PCE와 아마존·인텔 실적이 AI 투자 사이클에 대한 시각을 다시 흔들 수 있다. 체코 원전은 사업 자체가 아니라 시공사만 바뀌는 사안이라 증권가에서는 대우건설을 뺀 원전주 낙폭이 과도하다는 평가가 나왔고, 금융지주는 3분기 호실적과 기말 배당 기대가 다음 주 저PBR 명단 공개(11월 2일)까지 이어질지가 관건이다.

### 🇰🇷 내일 개장 관전 포인트
1. **미국 GDP·PCE와 아마존 실적**: 연준이 3.75～4.00%로 동결하며 12월 인상 여지를 남긴 상황이라 오늘 밤 PCE 물가가 예상(+0.5%)을 웃돌면 금리 부담이 커질 수 있다. 아마존 AWS 성장률과 인텔 가이던스는 AI 투자 사이클에 대한 시각을 좌우한다. 코스피200 야간선물은 932.70(−0.25%, 18:24 현재)이다.
2. **삼성전자 '실적 후 하락' 이후 수급**: 영업이익 107.4조원·HBM 완판에도 환원 구체안 부재로 4.34% 빠졌고 프로그램 순매도가 2,893억원이었다. 내년 1월 이사회 전까지 자사주 매입 공시가 나올지, SK하이닉스(+2.62%)로의 쏠림이 이어질지가 지수 방향을 가른다.
3. **원전·건설주 낙폭 되돌림 여부**: 체코 원전은 사업이 아니라 시공사만 바뀌는 사안이라 증권가에서는 대우건설을 뺀 원전주 낙폭이 과도하다는 의견(KB·NH)이 나왔다. 두산에너빌리티의 뉴스케일 SMR 원자로 수주와 3분기 영업이익 2,612억원(+91%)이 반등 재료가 될 수 있다.
4. **금융주 강세 지속성**: KB금융 3분기 순이익 1.9조원(누적 5.8조원)과 5대 금융 역대 최대 실적으로 은행(+2.40%)·증권(+2.85%)이 강했다. 다음 주 저PBR 명단 공개를 앞두고 ROE·주주환원 상위 금융주로의 순환매가 이어질지 주목된다.
5. **수급 지표**: 외국인은 KRX 기준 962억원을 샀지만 NXT 포함 통합으로는 3,021억원 순매도였고, 주간 선물은 521계약 순매수였다. 원/달러 1,337원대 안정 속에 외국인 현·선물 동반 매수로 돌아설지가 관건이다.

    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
