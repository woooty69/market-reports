## 🗓 시장 요약

**① 다우 52,215.16(−1.23%)·S&P500 7,623.68(−0.52%)·나스닥 25,955.34(−0.21%) — 이란 긴장·유가 급등에 경기민감주 약세, S&P500·나스닥 2주 연속 주간 하락**
다우는 **52,215.16(−652.82, −1.23%)**, S&P500은 **7,623.68(−39.75, −0.52%)**, 나스닥은 **25,955.34(−53.52, −0.21%)**로 일제히 내렸다. 전날 AI·반도체에 집중됐던 매도가 이날은 금융·항공·산업재 등 경기민감주로 번졌고, 아메리칸익스프레스(−3.73%)가 다우에서 가장 크게 내렸다. 나스닥100은 28,957.53(−0.00%)로 보합을 지켰고 러셀2000은 2,775.90(−0.29%), VIX는 19.71(+3.57%)였다. S&P500과 나스닥은 2주 연속 주간 하락했고 다우만 주간 기준 상승을 지켰다. 트럼프 대통령이 이틀 연속 이란에 대해 "끝장을 낼지" 고민한다고 언급하며 긴장을 키웠고, 이란은 재공격 시 걸프 지역 석유·에너지 시설을 치겠다고 경고했다.

**② 2년물 4.69%(+4.0bp)·10년물 5.00%(+4.0bp)·30년물 5.33%(+4.0bp) — 하루 만에 다시 5%선, 미시간대 기대인플레이션 4.7%로 상승**
미 재무부 기준 2년물은 **4.69%(+4.0bp)**, 10년물은 **5.00%(+4.0bp)**, 30년물은 **5.33%(+4.0bp)**로 전날 급락분 일부를 되돌렸다. 10년물은 장중 4.945%~5.005% 사이를 오간 끝에 다시 5%선에 올라섰다. 미시간대 10월 소비자심리지수 확정치는 48.0으로 예비치 46.3보다 높았지만 9월(48.1)보다 낮아 집계 이래 두 번째로 낮은 수준이었고, 1년 기대인플레이션은 4.7%(전월 4.6%), 5년 기대인플레이션은 3.5%(전월 3.4%)로 올랐다. 다음 주 수요일(28일, 현지) FOMC에서는 동결이 유력하며, 10월 인상 확률은 연방기금금리 선물 기준 약 5%로 9월 말 37%에서 크게 낮아졌다.

**③ WTI \$103.44(+3.99%)·브렌트 \$116.88(+3.28%) — 4월 이후 최고, 브렌트 3주 연속 주간 상승**
브렌트 12월물은 장중 \$117.45까지 오른 뒤 **\$116.88(+3.28%)**로 마감해 4월 이후 최고치를 기록했고 3주 연속 주간 상승했다. WTI 12월물은 장중 \$103.92까지 올랐다가 **\$103.44(+3.99%)**로 끝나 \$100선을 확실히 넘어섰다. 미국·이스라엘이 11월 초 중간선거 뒤 이란 추가 공격을 검토한다는 보도와 홍해 인근 공격에 따른 공급 차질 우려가 겹쳤다. 연료비 부담에 유나이티드항공(UAL) \$97.93(−3.99%)·델타항공(DAL) \$76.78(−3.13%) 등 항공주가 약했다. 금은 \$4,010.50(−1.23%)로 내렸고 비트코인은 \$81,000대에서 보합권이었다.

**④ AI·반도체 — SOX 10,779.46(+0.44%)·SK하이닉스 ADR +4.05%·마이크론 +2.46%… 전날 급락 뒤 숨 고르기**
반도체지수는 장중 10,667.92까지 밀렸다가 10,923.18까지 반등한 뒤 **10,779.46(+0.44%)**로 마감해 전날 −6.72% 급락 뒤 소폭 반등했다. 메모리주가 상대적으로 강해 마이크론(MU)은 \$877.55(+2.46%), SK하이닉스 ADR(SKHY)은 \$137.02(+4.05%)였고, AMD(AMD) \$516.79(+1.74%)·인텔(INTC) \$86.96(+1.72%)도 올랐다. 반면 엔비디아(NVDA)는 \$210.96(−0.59%)로 약보합이었고, 자본 조달 비용 우려가 남은 코어위브(CRWV)는 \$54.24(−2.46%)로 이틀째 밀렸다. 마이크로소프트(MSFT)는 자체 AI 칩 '마이아'를 추론용으로 배치할 계획이 알려지며 \$524.51(+0.66%)로 올랐다. 캐피털닷컴의 카일 로다 선임 애널리스트는 AI 걱정의 초점이 '지출 과다'에서 '지출 부족·성장 둔화'로 뒤집혔다고 짚었다.

**⑤ 실적·이슈 — 로버트하프 +21.74%·크라운캐슬 +9.06%·팔로알토 +7.22%, 블룸에너지 −11.24%·SLM −10.78%·아메리칸익스프레스 −3.73%**
로버트하프(RHI)는 인력 솔루션 매출이 2022년 이후 처음으로 조정 기준 증가세로 돌아섰다는 발표에 **\$45.87(+21.74%)**로 급등했다. 스페이스X가 미국 기지국 최대 8만 곳 임차를 논의 중이라는 보도에 크라운캐슬(CCI)은 **\$85.97(+9.06%)**, SBA커뮤니케이션즈(SBAC)는 **\$184.75(+3.57%)**로 올랐고, 사이버보안주 팔로알토네트웍스(PANW)는 **\$380.55(+7.22%)**, 클라우드플레어(NET)는 **\$325.97(+7.36%)**였다. 반면 3분기 매출이 138% 늘었지만 영업현금흐름이 적자로 돌아선 블룸에너지(BE)는 **\$193.30(−11.24%)**, 연간 EPS 가이던스를 크게 낮춘 SLM(SLM)은 **\$19.42(−10.78%)**, 컴포트시스템즈(FIX)는 **\$1,160.86(−9.26%)**로 밀렸다. 아메리칸익스프레스(AXP)는 실적 호조에도 인력 약 5% 감축 계획과 함께 **\$313.03(−3.73%)**로 내렸다.

**⑥ 🇰🇷 SK하이닉스 ADR \$137.02(+4.05%)·SOX +0.44%·코스피200 야간선물 861.70(−0.19%) — 반도체 기술적 반등, 유가·금리는 부담**

해석하면 국내 증시는 주말 휴장 뒤 월요일(26일) 개장에서 전날 급락분을 일부 만회한 SK하이닉스 ADR(+4.05%)과 마이크론(+2.46%) 반등을 반영할 여지가 있다. 다만 브렌트 \$116.88·미국채 10년물 5.00% 재돌파는 성장주 밸류에이션과 항공·화학 원가에 부담이고, 다음 주 미국 빅테크 실적과 FOMC를 앞두고 관망 심리가 강할 수 있다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 아메리칸익스프레스 (AXP) −3.73% — 3분기 매출 \$200.6억(+9%)·조정 EPS \$4.68(+13%), 연간 가이던스 상향에도 인력 약 5% 감축·구조조정 비용 \$3.36억**
아메리칸익스프레스는 시가 \$315.00에서 고가 \$321.20까지 올랐다가 \$313.03(−\$12.14, −3.73%)로 마감해 다우 30종목 가운데 가장 크게 내렸다. 3분기 매출(이자비용 차감)은 \$200.6억으로 9% 늘었고, GAAP EPS는 지분 매각 이익을 포함해 \$5.42(+31%), 조정 EPS는 \$4.68(+13%)로 예상을 넘었다. 결제액(빌드 비즈니스)은 \$4,540억으로 8% 늘었고 순상각률은 1.8%로 전년(1.9%)보다 낮아졌다. 회사는 연간 GAAP EPS 가이던스를 \$18.30~18.60으로 올렸지만, 효율화와 AI 대비를 이유로 전체 인력의 약 5%를 줄이고 세전 \$3.36억의 구조조정 비용을 반영한다고 밝혀 차익 실현 매물이 나왔다. 스티븐 스퀘리 CEO는 "더 민첩하고 효율적인 조직이 될 필요가 있었다"고 설명했다.

**2. 스페이스X (SPCX) +1.89% — 4분기 설비투자 \$350억~400억 제시(3분기 \$196억), 기지국 임차 논의 보도에 반등**
스페이스X는 시가 \$147.93에서 저가 \$144.09까지 밀렸다가 고가 \$149.75까지 오른 뒤 \$147.49(+\$2.74, +1.89%)로 마감해 보호예수 해제일 급락(−9.14%) 뒤 반등했다. 3분기 스타링크 중심의 통신 매출은 \$52억으로 69% 늘었고 가입자는 160만 명 순증해 1,400만 명에 육박했으며 분기 이익은 \$44억이었다. 브렛 존슨 CFO는 4분기 설비투자를 3분기 \$196억의 약 두 배인 \$350억~400억으로 제시했다. JP모건의 더그 앤머스 애널리스트는 회사가 유상증자를 검토하지 않고 있다고 전했다. 미국 내 기지국 최대 8만 곳을 임차해 지상 통신망을 구축하는 방안을 논의 중이라는 보도도 나와 통신 사업 확장 기대를 키웠다.

**3. 크라운캐슬 (CCI) +9.06% — 스페이스X가 미국 기지국 최대 8만 곳 임차 논의 보도, 장중 +16% 급등**
크라운캐슬은 시가 \$91.02로 급등 출발해 고가 \$91.45(+16.01%)까지 오른 뒤 상승 폭을 줄여 \$85.97(+\$7.14, +9.06%)로 마감했다. 스페이스X가 지상 이동통신망 구축을 위해 미국 내 기지국 최대 8만 곳의 접근권 임차를 논의하고 있다는 보도가 나오면서 새로운 대형 임차인 기대가 커졌다. 크라운캐슬은 올해 초 광섬유·스몰셀 사업을 매각해 순수 타워 회사로 바뀌었고, 이달 9일 스페이스X의 800MHz 주파수 인수 발표 때도 장중 14% 넘게 올랐다. 같은 소식에 SBA커뮤니케이션즈(SBAC)도 장중 +10.34%까지 올랐다가 \$184.75(+3.57%)로 마감했다. 반면 기존 이동통신 3사(AT&T·버라이즌·T모바일)는 경쟁 심화 우려로 장 초반 약세를 보였다.

블룸에너지는 시가 \$203.01에서 저가 \$189.00(−13.21%)까지 밀린 뒤 \$193.30(−\$24.47, −11.24%)로 마감했다. 3분기 매출은 \$12.36억으로 전년 대비 138% 늘었고 비GAAP 매출총이익률은 34.5%, 비GAAP 희석 EPS는 \$0.94로 예상을 넘었다. 연간 가이던스도 올해 세 번째로 올려 매출 \$44억~46억, 비GAAP 영업이익 \$9.6억~10.3억, 비GAAP EPS \$3.10~3.40을 제시했다. 그러나 영업현금흐름이 2분기 +\$2.26억에서 3분기 −\$2,710만으로 돌아섰고 설비투자 \$1.53억을 더하면 잉여현금흐름은 약 −\$1.8억이었다. AI 데이터센터 전력 수요 기대로 많이 오른 주가에 현금흐름 악화가 차익 실현의 빌미가 됐다.

**5. 로버트하프 (RHI) +21.74% — 3분기 EPS \$0.49(+14%), 인력 솔루션 매출 2022년 이후 첫 증가 전환**
로버트하프는 시가 \$41.94에서 고가 \$47.14(+25.11%)까지 치솟은 뒤 \$45.87(+\$8.19, +21.74%)로 마감했다. 3분기 매출은 \$13.59억으로 0.4% 늘어 조정 기준으로는 보합이었지만, 순이익은 \$4,990만으로 약 16% 늘었고 희석 EPS는 \$0.49로 전년 \$0.43을 웃돌며 예상을 넘었다. 인력 솔루션 매출은 \$8.76억으로 조정 기준 2% 늘어 2022년 이후 처음으로 증가세로 돌아섰고, 정규직 채용 수수료는 \$1.17억으로 6.2% 늘었다. 컨설팅 자회사 프로티비티 매출은 \$4.84억으로 2.9% 줄었다. 키스 워델 CEO는 전사 매출이 조정 기준으로 지난해와 거의 같았다고 밝혔고, 시장은 채용 경기 바닥 신호로 받아들였다.

**6. SK하이닉스 ADR (SKHY) +4.05% — 솔리다임 미국 상장 계획 보류 보도, 최대 \$1,500억 가치·\$100억~150억 조달 구상 철회로 지분 희석 우려 완화**
SK하이닉스 ADR은 시가 \$136.61에서 고가 \$138.51(+5.18%)까지 오른 뒤 \$137.02(+\$5.33, +4.05%)로 마감해 전날 −8.07% 급락분의 절반가량을 되찾았다. SK하이닉스가 낸드·SSD 자회사 솔리다임의 미국 상장 계획을 보류했다는 보도가 나왔는데, 당초 기업가치 최대 \$1,500억에 \$100억~150억을 조달하는 방안이 거론됐다. 솔리다임 상장설은 9월 말 처음 보도됐을 때 모회사 주가를 하루 5% 끌어내리고 국내 지배구조 단체의 반대를 부를 만큼 자회사 신주 발행에 따른 지분 가치 희석 우려가 컸던 사안이다. ADR은 7월 상장 때 주당 \$149에 \$265억을 조달했고, 9월 9일 고점 \$198.63 대비로는 아직 약 31% 낮다.
