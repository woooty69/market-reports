## 🗓 시장 요약

**① 재무부 개입 효과가 하루 만에 끝났다 — 금리 재상승에 다우 700p 급락**
전날 국채 발작을 진화했던 재무부의 장기물 바이백 효과가 **단 하루** 만에 소멸했다. 10년물이 **+6.7bp(4.708%)**, 30년물이 **+1.08%(5.250%)**, 2년물도 +3.0bp로 되올랐다. 인베스팅닷컴은 **"장기물 매도가 아시아·유럽의 랠리를 압도하며 미 금리가 상승세를 재개했다"**고 전했다. 다우가 **−700.75p(−1.31%)**로 무너졌고 S&P −0.86%, 나스닥 −1.00%. VIX는 **+7.52%(16.01)**로 튀었다. 바이백은 유동성 공급일 뿐 **국채 공급 물량 자체를 줄이지 못한다**는 사실이 하루 만에 확인된 셈이다.

**② 트럼프의 '대이란 경제전쟁' 경고 — 유가 한 달 만에 최고**
트럼프 대통령이 이란을 경제적으로 압박하겠다고 공언하면서 유가가 급등했다. WTI 9월물은 **배럴당 \$87.83(+2.33%)**, 브렌트 10월물은 **\$93.78(+2.36%)**로 마감해 **두 유종 모두 한 달 만에 최고치**를 기록했다. 8월 들어 WTI는 \$78 → \$88로 12% 넘게 올랐다. **유가가 금리를 밀어올리고 금리가 주식을 누르는 연쇄**가 이번 주 내내 반복되고 있으며, 9월 FOMC 인상 확률도 35.3%에서 내려오지 못하고 있다.

**③ 월마트가 지수를 끌어내렸다 — 실적은 이겼는데 주가는 −9.15%**
2분기 매출 **\$1,879억(+5.9%)**, 조정 EPS **\$0.81**로 컨센서스(\$1,867.5억·\$0.74)를 모두 웃돌았고 연간 가이던스까지 올렸다. 그런데 주가는 **−9.15%**로 무너졌다. 이유는 **미국 동일점포 매출 +2.6%** — 예상 3.7%를 크게 밑돌았고 **2020년 4분기 이후 최저 증가율**이다. 약가 상한제가 헬스·웰니스를 통해 0.8%p를 잠식했고, 3분기 EPS 가이던스(\$0.62~0.64)도 예상 \$0.68에 못 미쳤다. **소비 둔화 우려가 지표에서 개별 기업 실적으로 옮겨붙은 사건**으로, 다우 −700p의 최대 기여자였다.

**④ 모더나는 하루 만에 −23.55% — 열광의 유효기간은 24시간이었다**
전날 **+176.97%** 폭등했던 모더나가 **−23.55%(\$133.32)**로 급반락했다. 거래량 9,667만 주. JP모건 제시카 파이는 **"뉴스 직전 시가총액 250억 달러 수준에서 보조요법 흑색종 성공은 이미 가격에 반영됐다고 본다"**며 **"다른 적응증으로의 확장 가능성이 결정적"**이라고 지적했다. 회사는 2분기 **순손실 7억 8,200만 달러**에 영업현금흐름도 여전히 마이너스다. **임상 성공이 곧 실적은 아니라는 냉정한 재평가**가 하루 만에 이뤄졌다.

**⑤ 그런데 반도체만 올랐다 — SOX +0.53%, 3일 만의 반등**
3대 지수가 모두 1% 안팎 밀린 날에 SOX는 **+0.53%(11,800.00)**로 홀로 올랐다. 마이크론 **+3.97%(\$974.33)**, 마벨 **+5.79%**, 샌디스크 +2.02%. 이틀간 −7.0%를 기록했던 반도체가 방향을 틀었다. 다만 엔비디아는 −0.33%로 제자리였고 SOX의 장중 고가(11,863.7)에서 소폭 밀려 마감했다. **지수와 반도체가 정반대로 움직이는 구도가 이번 주 내내 반복**되고 있다 — 8/19엔 지수가 오르고 반도체가 빠졌고, 8/20엔 그 반대가 됐다.

**⑥ 한국은 폭발했다 — SK하이닉스 +12.73%, 괴리율 +34.2%로 급축소**
40조원 자사주 매입·소각 발표가 하루 늦게 국내에서 터졌다. SK하이닉스(000660)가 **+12.73%(1,691,000원)** 급등하며 시가총액 **1,235조원**을 회복했고, 코스피200 선물은 **+6.49%(1,082.25)**로 마감했다. **외국인이 +31만 2,973주 순매수로 재전환**(전일 −119.9만 주)한 것이 결정적이었다. 원/달러도 1,411.93원 → **1,391.03원**으로 급락(원화 강세)해 수급에 힘을 보탰다. ADR은 +4.43%에 그쳐 **괴리율이 +47.0% → +34.2%로 12.8%p 축소**됐다 — 이번엔 국내가 ADR을 따라잡는 방식이었다. 다만 야간선물은 **−0.26%(1,079.45)**로 소폭 되밀렸다.

> *어제 판정 복기 — **방향은 맞고 강도는 크게 빗나갔다.** '자사주 매입에 힘입은 반등 시도를 우선 보되, **상승폭은 야간선물(+2.37%)에 못 미칠 가능성**'으로 봤다. 실제로는 코스피200 선물 **+6.49%**, SK하이닉스(000660) **+12.73%**로 야간선물이 시사한 폭을 **세 배 가까이 넘어섰다.** 무효화 조건으로 걸었던 '외국인 순매도 지속'은 회피됐다(+31.3만 주 순매수 전환). **40조원 소각이라는 재료의 크기를 야간선물 등락률로 가늠하려 한 것이 오판**이었다 — 야간 세션은 발표 직후 거래량이 얇아 재료를 온전히 반영하지 못한다.*

## 🏭 섹션 1. 업종별 흐름

**상승 ①  반도체·메모리 (3일 만에 반등)**
마이크론 **+3.97%(\$974.33)**, 마벨 **+5.79%(\$251.01)**, 샌디스크 +2.02%, SK하이닉스 ADR +4.43%. 이틀간 −7.0% 밀렸던 SOX가 **+0.53%**로 방향을 틀었다. 다만 엔비디아는 −0.33%로 제자리.

> 🇰🇷 [전달] 미국 메모리 반등 + 원/달러 1,391원(원화 강세) 조합은 국내 반도체에 우호적. 다만 SK하이닉스(000660)는 이미 +12.73% 급등해 **재료 선반영 구간**에 들어섰다.

**상승 ②  농기계·산업재**
디어가 **+6.94%(\$620.94)**로 급등했고 노드슨 **+8.00%**, 인그리디언 등 산업재가 강했다. 디어의 **"2026년이 농기계 사이클의 바닥"**이라는 발언이 경기민감 산업재 전반의 투자심리를 끌어올렸다.

**상승 ③  귀금속·비료**
은이 **+3.50%(\$68.13)**로 급등했고 금도 +0.66%. CF인더스트리스 **+5.61%**, 모자이크 **+5.04%**로 비료주가 동반 상승했다. 유가·천연가스 급등이 질소비료 가격 전가 기대로 연결됐다.

**하락 ①  소비·유통 (이날 최약)**
월마트가 **−9.15%**로 무너지며 다우 낙폭의 대부분을 만들었다. 미국 동일점포 +2.6%가 **2020년 4분기 이후 최저**라는 사실이 소비 둔화 우려를 증폭시켰다.

> 🇰🇷 [전달] 미국 소비 둔화는 국내 수출 소비재·유통에 부담. 다만 **유가 상승과 겹치면 항공·해운에 이중 압박**이 된다.

**하락 ②  바이오·의료기기**
모더나 **−23.55%**, 알닐람 −5.49%, 인튜이티브서지컬 **−5.84%**, 보스턴사이언티픽 −5.08%. 전날 모더나발 랠리로 급등했던 헬스케어가 통째로 되돌려졌다.

**하락 ③  고밸류 소프트웨어**
크라우드스트라이크 **−5.60%(\$190.34)**. 8/26 실적을 앞두고 선행 P/E 166배라는 밸류에이션 부담에 디리스킹 매도가 나왔다. 금리 상승이 방아쇠였다.

**[판정]** **혼조 출발, 상단은 제한적으로 본다.** 신호가 엇갈린다.
**상방 근거**: ①**SOX +0.53%로 3일 만에 반등**(마이크론 +3.97%, 마벨 +5.79%), ②SKHY **+4.43%**, ③원/달러 **1,391원**으로 원화 강세 전환, ④외국인 순매수 재전환(+31.3만 주), ⑤괴리율 +34.2%로 정상 범위 접근.
**하방 근거**: ①미 3대 지수 급락(다우 −1.31%), ②**금리 재상승**(10년물 4.708%, 30년물 5.250%), ③**유가 \$87.83로 한 달 최고**, ④**야간선물 −0.26%**로 소폭 하락, ⑤SK하이닉스(000660)가 전날 **+12.73%** 급등해 단기 과열.
**판정: 갭다운 출발 후 낙폭 축소 시도**를 기본으로 보되, **어제 강도를 과소평가한 실수를 반복하지 않기 위해 폭은 단정하지 않는다.** SK하이닉스는 자사주 소각이라는 구조적 재료가 살아 있어 지수 대비 방어가 예상되나, 하루 +12.73% 뒤라 **차익 실현 물량이 개장 초반 나올 가능성**이 높다. (무효화: 외국인 순매도 재전환, 또는 오늘 밤 유가 \$90 돌파 시)

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 월마트 (WMT) −9.15% — \$103.84, 실적은 이겼는데 동일점포가 6년 최저**
2분기 매출 **\$1,879억(+5.9%)**로 컨센서스 \$1,867.5억을, 조정 EPS **\$0.81**로 예상 \$0.74를 각각 웃돌았다. 연간 순매출 성장률 전망도 3.5~4.5% → **4~5%**로, 조정 EPS 가이던스도 \$2.75~2.85 → **\$2.80~2.87**로 올렸다.
그럼에도 주가는 9% 넘게 빠졌다. **미국 동일점포 매출이 +2.6%로 예상 3.7%를 크게 밑돌았기** 때문이다. 이는 **2020년 4분기 이후 가장 느린 증가율**이다. 약가 상한제가 헬스·웰니스 부문을 통해 **0.8%p를 잠식**했고, 3분기 조정 EPS 가이던스 **\$0.62~0.64**도 예상 \$0.68에 못 미쳤다.
밝은 구석도 있었다 — **이커머스 +23%, 광고 +38%**로 고마진 사업은 여전히 빠르게 크고 있다. 거래량 **8,275만 주**. 회사는 고객이 높은 연료비 탓에 **"트레이드오프"**를 하고 있다고 설명했고, 이 표현이 소비 둔화 우려를 증폭시켰다.

**2. 모더나 (MRNA) −23.55% — \$133.32, 하루 만에 열광이 식었다**
전날 암 백신 3상 성공으로 **+176.97%** 폭등했던 주가가 하루 만에 23% 넘게 빠졌다. 거래량 **9,667만 주**로 이날 시장 최다 수준이었다.
JP모건 제시카 파이 애널리스트는 **"뉴스 직전 시가총액 250억 달러 수준에서 보조요법 흑색종에서의 성공은 이미 가격에 반영된 것으로 본다"**며 **"다른 적응증으로의 확장 가능성(read-across)이 결정적"**이라고 평가했다.
재무 상태도 발목을 잡았다. 회사는 2026년 2분기 **순손실 7억 8,200만 달러**를 기록했고 **영업현금흐름은 여전히 마이너스**다. 임상 성공과 상업화 성공 사이의 거리를 시장이 하루 만에 재계산한 셈으로, **바이오텍 이벤트 트레이딩의 전형적 패턴**이다.

**3. SK하이닉스 ADR (SKHY) +4.43% — \$163.08 (괴리율: +34.2%), 자사주 효과가 서울에서 폭발**
8/19 발표한 **40조원 자사주 매입·전량 소각**의 효과가 하루 늦게 국내에서 터졌다. SK하이닉스(000660)가 **+12.73%(1,691,000원)** 급등하며 시가총액 **1,235조원**을 회복했다.
수급이 결정적이었다. 외국인이 **+31만 2,973주 순매수로 재전환**했다 — 전날 −119만 9,222주 순매도에서 하루 만에 방향을 바꾼 것이다. 기관은 −1만 3,214주로 사실상 중립, 개인은 −92만 2,172주 순매도였다. 거래대금은 **15.7조원**.
ADR은 +4.43%에 그쳐 **괴리율이 +47.0% → +34.2%로 12.8%p 축소**됐다. 이번엔 **국내가 ADR을 따라잡는 방식**이라 8/19(ADR 급락에 따른 축소)과 성격이 다르다. 원/달러가 **1,391.03원**으로 급락(원화 강세)한 것도 괴리 축소에 기여했다.

**4. 디어 (DE) +6.94% — \$620.94, "2026년이 농기계 사이클의 바닥"**
3분기 매출 **\$126.1억**으로 컨센서스를 **17.5%** 웃돌았고 EPS는 **\$5.10**으로 예상 \$4.69를 상회했다. **FY2026 순이익 가이던스를 \$47.5억~50억으로 상향**하고 장비부문 영업현금흐름은 \$50~55억을 제시했다.
가장 중요한 건 회사가 **"2026년이 농기계 사이클의 바닥"**이라고 명시한 대목이다. **농기계 수요 하락이 멈췄다는 첫 공식 신호**로, 몇 분기째 이어진 농업 장비 다운사이클의 전환점 가능성을 시사한다.
분기를 견인한 건 농업이 아니라 **건설·임업**이었다 — 영업이익률이 **7.7% → 12.1%**로 확대됐다. 거래량 310만 주. 경기민감 산업재 전반의 투자심리를 끌어올린 이날의 몇 안 되는 상승 재료였다.

**5. 크라우드스트라이크 (CRWD) −5.60% — \$190.34, 실적 앞두고 밸류에이션 디리스킹**
8월 26일 2분기 실적 발표를 앞두고 6% 가까이 밀렸다. 트루이스트가 목표주가를 **\$245로 상향**했음에도 하락했다는 점이 특징이다. 거래량 852만 주.
문제는 밸류에이션이다. **선행 P/E 166배, 선행 P/S 35배**에서 실적을 맞이하는 구조로, 매출이나 **신규 순증 ARR(Net New ARR) 가속이 컨센서스를 넘지 못하면 하방 위험이 크다**는 분석이 확산됐다.
금리 상승(10년물 +6.7bp)이 방아쇠 역할을 했다. **고성장 소프트웨어가 금리에 가장 먼저 반응하는 패턴**이 이번 주에만 세 번째 반복됐다.

**6. 마이크론 (MU) +3.97% — \$974.33, 메모리가 지수를 거슬러 올랐다**
3대 지수가 1% 안팎 밀린 날에 4% 가까이 올라 **\$1,000선을 다시 눈앞에 뒀다.** 거래량 2,341만 주로 이날 최다 거래 종목이었다.
직접적 촉매는 **SK하이닉스의 40조원 자사주 소각**이었다. 메모리 업계 2위 사업자가 자기 주식을 대규모로 사들일 만큼 현금흐름에 자신을 보였다는 점이 **업계 전반의 이익 사이클에 대한 신뢰**로 번졌다.
8/18 \$937 저점에서 이틀 만에 +3.9% 회복했다. 다만 8/17 기록한 **\$1,012 고점**은 아직 넘지 못했다 — **메모리 랠리가 재개된 것인지 반등에 그칠지**는 다음 주 마벨·엔비디아 실적이 가른다.

**7. 마벨 (MRVL) +5.79% — \$251.01, 8/27 실적 앞두고 기대 선반영**
8월 27일 예정된 **2027 회계연도 2분기 실적** 발표를 앞두고 6% 가까이 올랐다. 거래량 2,532만 주.
마벨은 **커스텀 실리콘(ASIC)과 데이터센터 연결**이 주력이라 AI 인프라 투자의 실체를 가늠하는 지표로 쓰인다. 8/18 −7.81% → 8/19 +9.85% → 8/20 +5.79%로 **사흘간 등락폭이 20%를 넘는** 고변동 구간이다.
반도체 안에서도 **메모리(마이크론)와 커스텀 실리콘(마벨)이 함께 오른 것**은, 이날 반등이 특정 테마가 아니라 섹터 전반의 저가 매수였음을 시사한다.

**8. 인튜이티브서지컬 (ISRG) −5.84% — \$374.48, 연초 대비 −30%의 무게**
수술 로봇 대표주가 6% 가까이 밀렸다. 2분기에 **시술 건수 +16%, 매출 +19%**로 두 자릿수 성장을 유지했음에도 주가는 연초 대비 **약 30% 하락**한 상태다. 거래량 348만 주.
원인은 **경쟁사 진입**이다. 다빈치 시스템의 독점적 지위가 흔들린다는 인식이 밸류에이션을 계속 압박하고 있다. 회사는 심장 수술 적응증 확대로 다빈치 5의 활용 범위를 넓히는 중이다.
이날 하락은 모더나발 헬스케어 되돌림과 겹친 결과이기도 하다. **성장률이 훼손되지 않았는데도 멀티플이 계속 줄어드는 전형적 디레이팅**이 진행 중이다.

**9. 노드슨 (NDSN) +8.00% — \$334.70, 3분기 실적으로 이날 상승률 1위**
접착·분사 장비 기업이 8% 급등해 이날 S&P 500 상승률 1위에 올랐다. **3분기 실적을 8/19 장 마감 후 발표**하고 8/20 오전 8시 30분(ET) 콘퍼런스콜을 진행했다.
시장 컨센서스는 애널리스트 7인 기준 **EPS \$3.09, 매출 \$7억 7,940만**이었고, 실적이 이를 상회한 것으로 시장이 반응했다. 거래량 107만 주.
산업용 정밀 장비는 **반도체 후공정·전자 조립 라인의 설비투자**와 직결된다. 디어와 함께 이날 산업재가 지수를 거슬러 오른 배경이며, **AI 인프라 투자가 장비 발주로 이어지는지**를 가늠하는 보조 지표로도 읽힌다.

**10. CF인더스트리스 (CF) +5.61% — \$125.70, 유가 급등이 질소비료로 전이**
질소비료 대표주가 5% 넘게 올랐고 모자이크도 **+5.04%**로 동반 상승했다. 거래량 274만 주.
질소비료는 **천연가스를 원료로 쓰기 때문에 에너지 가격 상승이 곧 판가 인상 명분**이 된다. 이날 WTI가 **+2.33%(\$87.83)**, 브렌트가 \$93.78로 한 달 최고를 기록하면서 전가 기대가 붙었다.
CF는 앞선 분기 실적에서 **순이익률 27.1%, 매출총이익률 42.5%**를 기록해 인베스팅닷컴이 **"화학 기업이라기보다 기술 기업처럼 움직인다"**고 평가한 종목이다. 유가가 오를 때 원가 부담을 지는 항공·해운과 정반대로 움직이는 **에너지 상승의 수혜 축**이다.

## 💬 섹션 3. 구루·기관 코멘트

- **제시카 파이(JP모건) — "흑색종에서의 성공은 이미 반영됐다."** 뉴스 직전 시가총액 250억 달러 수준을 근거로 모더나의 급등이 과했다고 평가하며, **"다른 적응증으로의 확장 가능성이 결정적"**이라고 짚었다. 이 코멘트가 −23.55% 급락의 논리적 근거가 됐다.
- **인베스팅닷컴 — "장기물 매도가 아시아·유럽 랠리를 압도하며 미 금리가 상승세를 재개했다."** 재무부 바이백의 효과가 하루짜리였음을 확인한 분석이다.
- **디어 경영진 — "2026년이 농기계 사이클의 바닥."** 몇 분기째 이어진 농업 장비 다운사이클의 전환점을 회사가 공식 언급한 첫 사례다.
- **연준 금리선물(9/16 FOMC) — 인상 35.3% vs 동결 64.7%.** 전 거래일과 동일. 금리·유가가 함께 올랐음에도 확률이 움직이지 않은 것은, 시장이 **이번 상승을 물가가 아닌 수급(국채 공급) 요인**으로 보고 있음을 시사한다.
- **트루이스트 — 크라우드스트라이크 목표주가 \$245로 상향.** 그럼에도 주가는 −5.60%였다. **목표가 상향이 밸류에이션 부담을 이기지 못한 사례**다.
- **SKHY 컨센서스 — 애널리스트 14인 Strong Buy, 목표주가 \$245.21.** 현재가 대비 상승 여력 약 +50%. 자사주 소각 발표 이후에도 목표가는 조정되지 않았다.

## 📅 섹션 4. 일정 및 관전 포인트

- **🇰🇷 오늘 국내 개장 — 과열 소화가 관건:** SK하이닉스(000660)가 하루 +12.73% 급등한 뒤다. **자사주 소각이라는 구조적 재료는 유효**하지만 단기 과열 구간이라, 개장 초반 차익 실현 물량과 외국인 수급의 방향이 갈림길이다. 야간선물이 −0.26%로 소폭 밀린 점도 감안해야 한다.
- **🛢 유가 \$87.83 — \$90선이 분기점:** 트럼프의 대이란 경제 압박으로 두 유종 모두 한 달 최고다. **\$90 돌파 시** 물가 기대가 재점화되며 9월 동결 시나리오(64.7%)에 균열이 생길 수 있다. 국내에선 항공·화학·해운의 원가 부담이 본격화된다.
- **⚠️ 국채 금리 — 바이백으로 못 막는다는 게 확인됐다:** 30년물 5.250%, 10년물 4.708%. 재무부 개입이 하루짜리였다는 사실이 드러나면서 **구조적 공급 부담**이 다시 부각됐다. 고밸류 성장주·AI 인프라가 계속 취약하다.
- **📊 다음 주 실적:** **크라우드스트라이크(8/26)**, **마벨(8/27)**. 마벨은 커스텀 실리콘 수요로 AI 투자 사이클의 실체를, 크라우드스트라이크는 고밸류 소프트웨어의 밸류에이션 정당성을 시험한다.
- **💱 원/달러 1,391원:** 1,411원에서 하루 만에 20원 넘게 떨어졌다(원화 강세). **외국인 수급에 우호적**이며, 수출주 채산성에는 부담이지만 수입 물가·항공 원가에는 완충 작용을 한다.
- **🇰🇷 괴리율 +34.2%:** 12.8%p 축소되며 정상 범위(20~30%대)에 근접했다. 다만 **괴리율 자체가 방향을 예측하지 못한다**는 점은 8/19에 확인했으므로 참고 지표로만 본다.
