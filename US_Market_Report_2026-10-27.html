## 🗓 시장 요약

**① 나스닥 26,169.38(+0.83%)·S&P500 7,676.77(+0.70%)·다우 52,361.58(+0.28%) — 앤트로픽 S-1 공개에 AI 매수 복귀, 실적·FOMC 앞두고 반등**
나스닥은 **26,169.38(+214.04, +0.83%)**, S&P500은 **7,676.77(+53.09, +0.70%)**, 다우는 **52,361.58(+146.42, +0.28%)**로 일제히 올라 2주 연속 주간 하락 뒤 한 주를 반등으로 시작했다. 나스닥은 장중 26,306.82까지 오르며 한때 1% 넘게 뛰었다가 상승 폭을 줄였고, 다우는 금요일 낙폭(−652.82)의 약 3분의 1만 되찾았다. 나스닥100은 29,273.41(+1.09%), 러셀2000은 2,786.42(+0.38%), VIX는 18.48(−4.99%)였다. 앤트로픽은 상반기 매출 \$163억(2025년 연간 \$46억)과 상반기 AI 인프라 지출 \$90억을 공개했고, 반도체·광통신 등 AI 공급망이 상승을 이끌었다. 다만 상승 종목 수(2,736)와 하락 종목 수(2,680)가 비슷해 시장 전반의 온기는 제한적이었다.

**② 2년물 4.68%(−1.0bp)·10년물 5.00%(보합)·30년물 5.31%(−2.0bp) — FOMC 앞두고 숨 고르기, '매파적 동결' 전망**
미 재무부 기준 2년물은 **4.68%(−1.0bp)**, 10년물은 **5.00%(보합)**, 30년물은 **5.31%(−2.0bp)**로 마감했다. 10년물은 장중 4.961%~5.011% 사이에서 움직이며 5%선 언저리를 지켰다. 27~28일(현지) FOMC에서는 동결이 유력하며, 시장이 반영한 이번 회의 인상 확률은 약 10%다. 케빈 워시 의장 체제의 연준이 예상보다 높은 물가를 이유로 '매파적 동결'에 나설 것이라는 관측이 많고, 앨런 블라인더 전 연준 부의장도 다음 회의 인상 가능성을 시사해야 한다고 봤다. 9월 시카고연은 국가활동지수 3개월 평균은 +0.03으로 올라섰고, 10월 댈러스연은 제조업 생산지수는 15.8로 14포인트 내렸다.

**③ WTI \$101.63(−1.59%)·브렌트 \$115.48(−1.06%) — 카타르 중재단 테헤란행에 긴장 완화 기대**
WTI 12월물은 장중 \$100.33까지 밀렸다가 **\$101.63(−\$1.64, −1.59%)**로, 브렌트 12월물은 **\$115.48(−\$1.24, −1.06%)**로 마감해 4월 이후 최고 수준에서 한발 물러섰다. 카타르 중재단이 일요일 테헤란을 찾았다는 소식에 미국·이란 긴장 완화 기대가 생겼지만, 미군이 대통령 명령 뒤 96시간 안에 대규모 공습을 할 수 있다는 보도와 후티 반군의 사우디 공격이 하단을 받쳤다. PVM오일어소시에이츠의 존 에번스는 브렌트가 지난주 저점까지 밀리면 매수세가 들어올 것이라고 봤다. 금은 \$4,026.50(+0.46%)로 올랐고 비트코인은 \$79,802(−0.73%)로 \$80,000선을 내줬다.

**④ AI·반도체 — SOX 11,083.47(+2.82%)·마이크론 +2.98%·AMD +2.80%·엔비디아 +2.39%… 광통신주 급등**
반도체지수는 장중 10,823.85에서 11,182.46까지 오른 뒤 **11,083.47(+2.82%)**로 마감해 이틀 연속 올랐다. 마이크론(MU)은 \$903.70(+2.98%)로 \$900선을 회복했고 AMD(AMD) \$531.28(+2.80%)·엔비디아(NVDA) \$216.00(+2.39%)·브로드컴(AVGO) \$329.17(+2.33%)·SK하이닉스 ADR(SKHY) \$142.62(+4.09%)도 강했다. 광통신 부품주가 가장 뜨거워 루멘텀(LITE)은 \$818.10(+8.19%), 어플라이드옵토일렉트로닉스(AAOI)는 \$71.94(+6.56%), 코히런트(COHR)는 \$221.50(+5.83%)였다. 마이크로소프트(MSFT)는 약 6만 명 대상 자발적 퇴직 제안 소식에 \$532.60(+1.54%)로 올랐다. 반면 일론 머스크가 200곳 넘는 특화 클라우드 업체가 신용 경색에 무너질 수 있다고 경고하면서 네비우스(NBIS)는 \$153.27(−3.45%)로 내렸고, 코어위브(CRWV)는 장중 −5.52%까지 밀렸다가 \$55.19(+1.76%)로 반등했다.

**⑤ 실적·이슈 — 레인지리소시스 +17.68%·컴포트시스템즈 +7.18%·테슬라 +5.21%, XP −48.36%·페어아이작 −13.15%·버라이즌 −3.49%**
EQT가 전액 주식 교환 방식으로 인수한다고 발표한 레인지리소시스(RRC)는 **\$53.57(+17.68%)**로 급등했고 EQT(EQT)는 \$54.84(−1.42%)였다. 금요일 실적 발표 뒤 −9.26% 밀렸던 컴포트시스템즈(FIX)는 **\$1,244.19(+7.18%)**, 블룸에너지(BE)는 **\$203.92(+5.49%)**로 반등했다. 바클레이즈가 투자의견을 올린 테슬라(TSLA)는 **\$391.62(+5.21%)**였다. 반면 브라질 대선에서 룰라 대통령이 4선에 성공하자 브라질 증권사 XP(XP)는 **\$15.71(−48.36%)**, 누홀딩스(NU)는 **\$12.59(−16.95%)**로 폭락했다. 투자의견 하향이 잇따른 페어아이작(FICO)은 **\$708.07(−13.15%)**로 S&P500에서 가장 크게 내렸고, 버라이즌(VZ)은 **\$43.10(−3.49%)**, 실적을 앞둔 레딧(RDDT)은 **\$138.48(−4.00%)**였다.

**⑥ 🇰🇷 SOX +2.82%·SK하이닉스 ADR \$142.62(+4.09%)·코스피200 야간선물 871.60(+2.54%) — 반도체 이틀째 반등, 유가 하락도 우호적**

해석하면 국내 증시는 SOX(+2.82%)와 마이크론(+2.98%)·SK하이닉스 ADR(+4.09%) 동반 강세, 코스피200 야간선물의 주간 종가 대비 +2.54% 상승을 반영해 반도체 중심으로 강하게 출발할 여지가 크다. 브렌트가 \$115선으로 내린 것은 항공·화학에 숨통이지만, 이번 주 FOMC(29일 새벽)와 마이크로소프트·알파벳 실적을 앞둔 경계 심리가 장중 탄력을 제한할 수 있다.

**1. 엔비디아 (NVDA) +2.39% — 앤트로픽 S-1 공개(상반기 매출 \$163억·AI 인프라 지출 \$90억), 스페이스X \$400억 GPU 구매 자금 조달**
엔비디아는 시가 \$213.12에서 고가 \$217.75(+3.22%)까지 오른 뒤 \$216.00(+\$5.04, +2.39%)로 마감했다. 앤트로픽이 나스닥 상장(티커 ANT)을 위한 증권신고서를 공개하며 올해 상반기 매출 \$163억(2025년 연간 \$46억), 상반기 AI 인프라 지출 \$90억(2025년 연간 \$73억)을 밝혀 AI 연산 수요가 여전히 가파르게 늘고 있음을 보여 줬다. 앤트로픽은 스페이스X 컴퓨팅 용량에 2029년까지 최대 \$1,205억(용량 인도 완료 뒤 월 약 \$31억)을 쓰기로 했다고도 공개했다. 스페이스X는 엔비디아 GPU 구매를 위해 \$400억 규모의 투자등급 채권 자금을 확보했다고 밝혔고 첫 물량 인도는 2027년 상반기로 예정돼 있다. 엔비디아는 AMD·브로드컴과 함께 메타 신주 최대 \$50억어치 인수도 검토 중인 것으로 전해졌다.

**2. 메타 (META) −1.88% — AI 인프라 자금 \$950억 주식 발행 계획(인수 공모 \$350억+시장가 발행 \$600억)**
메타는 시가 \$638.35에서 고가 \$647.69까지 올랐다가 저가 \$627.82(−2.30%)까지 밀린 뒤 \$630.56(−\$12.06, −1.88%)로 마감했다. 회사는 AI 인프라와 '초지능' 개발 자금을 위해 최대 \$950억의 신주를 발행할 계획이며, 먼저 \$350억을 인수단 공모로 조달한 뒤 \$600억은 시장가 분할 발행(ATM)으로 채운다는 구조다. 엔비디아·AMD·브로드컴은 이 가운데 최대 \$50억어치 매입을 검토하는 것으로 알려졌다. 사상 최대급 주식 발행에 따른 지분 희석 우려가 주가를 눌렀고, 빅테크가 차입을 넘어 자기자본까지 동원해 AI 투자를 이어 간다는 점이 시장의 경계 대상이 됐다.

**3. 테슬라 (TSLA) +5.21% — 바클레이즈 '비중 확대' 상향·목표주가 \$370→\$450, 스페이스X 합병 프리미엄 거론**
테슬라는 시가 \$383.97에서 고가 \$397.27(+6.73%)까지 오른 뒤 \$391.62(+\$19.40, +5.21%)로 마감해 실적 발표 뒤 이어진 이틀 연속 하락을 끊었다. 바클레이즈의 댄 레비 애널리스트는 투자의견을 '비중 유지'에서 '비중 확대'로 올리고 목표주가를 \$370에서 \$450으로 높였다. 그는 핵심 자동차 사업의 안정, 로보택시 진척, 그리고 스페이스X(SPCX)와의 합병 가능성에 따른 프리미엄을 상향 근거로 들었다. 목표주가 \$450은 이날 종가 대비 약 15% 위다.

**4. 레인지리소시스 (RRC) +17.68% — EQT가 전액 주식 교환으로 인수, 교환비율 0.987주·통합 기업가치 \$500억 이상**
레인지리소시스는 시가 \$50.81로 급등 출발해 고가 \$53.65까지 오른 뒤 \$53.57(+\$8.05, +17.68%)로 마감했다. EQT는 레인지 1주당 EQT 0.987주를 주는 전액 주식 교환 방식으로 레인지를 인수한다고 발표했고, 합병 뒤 EQT 주주가 약 73%, 레인지 주주가 약 27%를 갖는다. 통합 회사의 기업가치는 \$500억을 넘고, 2년 안에 연 \$3.25억, 장기적으로 \$6억 이상의 시너지를 낸다는 계획이며 거래 종결은 2027년 1분기 예정이다. EQT의 토비 라이스 CEO는 업계 최저 비용의 천연가스 생산자가 된다고 강조했다. 인수자인 EQT(EQT)는 장중 −6.00%까지 밀렸다가 \$54.84(−1.42%)로 낙폭을 줄였다.

**5. XP (XP) −48.36% — 브라질 대선 결선에서 룰라 4선 성공, 개혁 기대 무너지며 브라질 ADR 폭락**
브라질 증권·자산관리사 XP는 시가 \$14.53에서 저가 \$13.78(−54.69%)까지 폭락한 뒤 \$15.71(−\$14.71, −48.36%)로 마감해 하루 만에 시가총액이 절반 가까이 사라졌다. 주말 결선 투표 결과 발표에서 룰라 다 시우바 대통령이 플라비우 보우소나루 상원의원을 꺾고 4선에 성공했는데, 1차 투표 선두였던 보우소나루 측은 패배를 인정하지 않았다. 시장은 보우소나루 승리에 따른 재정·연금 개혁과 금융 규제 완화를 상당 부분 가격에 반영해 왔기 때문에 정책 불확실성 재부각의 충격이 컸고, 아이셰어즈 MSCI 브라질 ETF(EWZ)는 개장 전 −26%로 2000년 이후 최대 일간 하락을 위협했다. 같은 이유로 누홀딩스(NU)도 \$12.59(−16.95%)로 급락했고, 개장 전 페트로브라스는 약 −22%, 메르카도리브레는 −10.9%였다.

**6. 페어아이작 (FICO) −13.15% — 웰스파고 '비중 유지'로 하향·목표주가 \$800→\$735, UBS 목표 \$1,100→\$942**
페어아이작은 시가 \$749.65에서 저가 \$671.19(−17.68%)까지 밀린 뒤 \$708.07(−\$107.24, −13.15%)로 마감해 S&P500 종목 가운데 가장 크게 내렸다. 웰스파고는 단기 이익 가시성이 낮아졌다며 투자의견을 '비중 확대'에서 '비중 유지'로 낮추고 목표주가를 \$800에서 \$735로 내렸고, UBS는 '중립'을 유지하며 목표주가를 \$1,100에서 \$942로 낮췄다. BMO캐피털은 '시장수익률 상회'를 유지했지만 2027 회계연도 EPS 추정치를 \$44.87로 낮췄다. 회사가 모기지 대출기관에 기존 FICO 점수와 FICO 10T를 묶어 \$10 도매가에 제공하는 '프리퍼드 프로그램'을 내놓은 데다, 연방주택금융청이 패니메이·프레디맥 대출에 밴티지스코어 4.0 사용을 허용한 것이 가격 결정력 약화 우려를 키웠다.

**7. 버라이즌 (VZ) −3.49% — 3분기 후불 휴대폰 순증 40.6만 명·연간 가이던스 상향에도 매출 \$343억으로 예상 하회**
버라이즌은 시가 \$43.49에서 저가 \$42.47(−4.90%)까지 밀린 뒤 \$43.10(−\$1.56, −3.49%)로 마감했다. 3분기 매출은 \$343억으로 1.5% 늘었지만 LSEG 집계 예상치 \$347.4억에 못 미쳤고, 조정 EPS는 \$1.31로 8.3% 늘었다. 후불 휴대폰 순증은 40.6만 명으로 전년 4.4만 명에서 크게 늘어 예상치(약 20.9만 명)의 두 배에 가까웠고, 잉여현금흐름은 \$78억으로 12.1% 늘었다. 회사는 연간 후불 휴대폰 순증 가이던스를 110만~120만 명으로, 조정 EPS를 \$5.04~5.06으로 올렸지만, 매출 부진과 스페이스X의 지상 통신망 진출 등 경쟁 심화 우려가 더 크게 반영됐다. 댄 슐먼 CEO는 또 한 번 기록적인 분기였다고 밝혔다.

**8. 스페이스X (SPCX) −0.40% — 엔비디아 GPU 구매용 \$400억 채권 자금 확보, 번스타인 목표주가 \$248→\$268**
스페이스X는 시가 \$146.84에서 고가 \$150.24(+1.86%)까지 올랐다가 \$146.90(−\$0.59, −0.40%)로 약보합 마감했다. 일론 머스크 CEO는 일요일 늦게 GPU 구매를 위한 \$400억 규모의 부채 조달을 확보했다고 밝혔으며, 이 자금은 2027년 1·2분기 GPU 인도 일정에 맞춰 구조화됐다. 번스타인 소시에테제네랄은 '시장수익률 상회'를 유지하며 목표주가를 \$248에서 \$268로 올렸고, 2027년 말 지상 컴퓨팅 용량을 기존 추정보다 5GW 많은 13GW로 내다봤다. 앤트로픽 S-1에서 스페이스X 컴퓨팅에 2029년까지 최대 \$1,205억을 쓰기로 한 계약도 확인됐지만, 머스크가 200곳 넘는 특화 클라우드 업체의 부실 위험을 경고한 점은 AI 인프라 업종 전반에 부담을 줬다.

**9. 루멘텀 (LITE) +8.19% — 스톤엑스 '매수' 신규 커버리지·목표주가 \$1,200, AI 광통신 수요 기대**
루멘텀은 시가 \$766.32에서 고가 \$840.47(+11.15%)까지 치솟은 뒤 \$818.10(+\$61.93, +8.19%)로 마감했다. 스톤엑스는 투자의견 '매수', 목표주가 \$1,200으로 커버리지를 새로 시작했으며, 이는 이날 종가 대비 약 47% 위다. 앤트로픽의 상반기 AI 인프라 지출 \$90억 공개로 데이터센터 광 트랜시버 수요 기대가 커지면서 어플라이드옵토일렉트로닉스(AAOI) \$71.94(+6.56%)·코히런트(COHR) \$221.50(+5.83%) 등 광통신주가 함께 올랐다.

**10. 모더나 (MRNA) −0.62% — 흑색종 암백신 3상 ESMO 정식 발표, 재발·사망 위험 42% 감소(2b상 49%에 못 미쳐)**
모더나는 시가 \$186.90에서 저가 \$181.65(−9.22%)까지 밀렸다가 고가 \$203.81(+1.85%)까지 반등한 뒤 \$198.85(−\$1.25, −0.62%)로 마감했다. 머크와 공동 개발한 맞춤형 mRNA 암백신 인티스메란 오토젠의 3상(INTerpath-001) 결과가 마드리드 ESMO 2026에서 정식 발표됐는데, 키트루다와 병용 시 흑색종 재발·사망 위험을 42% 낮췄다. 이는 앞선 2b상의 49% 감소에 못 미쳐 '뉴스에 팔자' 매물이 나왔고, 학회 전 결과 유출 때 −17.57% 폭락한 데 이어 개장 전에도 약 −9% 밀렸다. 다만 장중 저가 대비 약 9% 반등하며 낙폭을 대부분 되찾아, 3상 성공 자체는 긍정적으로 재평가되는 흐름도 나타났다.
