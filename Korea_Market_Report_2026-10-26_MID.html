## 🗓 시장 요약

**① 반짝 상승 전환 후 외국인 매도에 5,400선 후반으로 후퇴.** 코스피는 5,499.05로 출발해 장중 5,565.67(+0.28%)까지 올랐다가 11시 56분 현재 5,475.00(−75.30p)으로 밀렸다. 외국인은 4,678억원을 팔아 매도를 이어 갔고, 개인 2,191억원·기관 2,200억원이 받아냈다. 코스피200 선물도 851.60(−1.36%)으로 현물과 같은 폭으로 약하다.

**② SK하이닉스 특별배당설에 보합, 삼성전자는 1%대 약세.** SK하이닉스는 1,277,000원 보합으로 거래대금 1조 7,516억원 1위다. 솔리다임 지분 차익 약 16조원을 재원으로 한 특별배당 추진설이 돌았고 회사는 "확정된 것 없다"고 밝혔다. 삼성전자는 212,250원(−1.51%)이며 이재용 회장 취임 4주년(27일)을 앞두고 삼성기술전에서 HBM5를 전시했다. 주성엔지니어링(−7.12%)·원익IPS(−5.65%)·HPSP(−5.14%) 등 장비주 낙폭이 크다.

**③ 방산·조선·건설 급락, AI 헬스케어·로봇주만 강세.** LIG디펜스앤에어로스페이스가 방산업체 지정 취소 우려로 −12.41%, 한화에어로스페이스 −6.38%, 한화시스템 −4.37%로 방산주가 동반 급락했다. 삼성E&A는 지난주 급등 후 −1.67%로 쉬고 있다. 반면 루닛(+30.00%)·뷰노(+22.17%)·씨어스(+15.82%) 등 AI 의료기기와 로보티즈(+8.89%)·빅웨이브로보틱스(+15.92%) 등 피지컬 AI 로봇주가 급락장 속 강세다.

**④ 원/달러 1,322원으로 하락, 아시아는 약보합·미국 선물은 소폭 약세.** 원/달러는 1,322.00원(−4.00원)이다. 미국 10년물 금리가 5% 아래로 내려오며 3년 7개월 만의 큰 주간 낙폭을 기록했지만 중동발 유가 급등이 부담이다. 닛케이225는 62,214.66(−0.76%)으로 오전장을 마쳤고 항셍은 23,078.24(−0.07%)로 보합권이다. 나스닥100 선물은 −0.33%다.

## 1. 업종별 흐름

**상승 업종** — 건강관리기술(+15.84%, 상승 10/하락 2)이 루닛(+30.00%)·뷰노(+22.17%)·씨어스(+15.82%)의 AI 의료 강세로 압도적 1위다. 생명보험(+0.72%)은 삼성생명(+0.61%), 컴퓨터와주변기기(+0.65%)·소프트웨어(+0.59%)는 보안주 샌즈랩(+10.51%)·엑스게이트(+6.09%)가 받쳤다. 다만 소프트웨어도 상승 20/하락 40으로 오르는 종목은 소수다.

**하락 업종** — 우주항공과국방(−6.36%, 상승 5/하락 30)은 LIG디펜스앤에어로스페이스(−12.41%)·한화에어로스페이스(−6.38%)가, 에너지장비및서비스(−4.91%)·조선(−3.29%)은 HD현대중공업(−4.10%)이 끌어내렸다. 핸드셋(−3.03%)·건설(−2.96%)·자동차(−2.69%)도 약하고, 자동차는 상승 종목이 하나도 없다.

**시장의 시선** — 오후장은 외국인 매도 확대 여부와 코스피 5,450선 지지가 관건이다. 이번 주는 10월 FOMC, 미국 9월 PCE, M7 실적과 삼성전자·SK하이닉스 3분기 실적이 몰린 '슈퍼위크'라 실적 발표 전 관망 심리가 강하다. 유가와 중동 정세, 방산 개별 악재의 확산 여부도 함께 봐야 한다.

## 4. 일정·관전 포인트

- **오늘 오후 국내**: 3분기 실적 시즌 진행(이번 주 삼성전자·SK하이닉스·현대차·한화오션·셀트리온 등 발표 예정), 우리·하나금융 3분기 실적 이후 금융주 반응, 투자자별 매매 최종치(15:30 이후), 롯데렌탈 임시주총(30일) 대기.
- **오늘 밤 해외**: 중동 정세(후티 반군의 사우디 공격 이후)와 국제유가(WTI 100달러대), 이번 주 미국 빅테크(아마존·알파벳·MS) 실적과 10월 FOMC·9월 PCE를 앞둔 미국 금리 흐름, 브라질 룰라 4선 이후 신흥국 금융시장.
- **이번 주**: 10월 FOMC(동결 전망), 미국 9월 PCE, M7 실적, 국내 반도체 투톱 실적 — 증권가가 꼽은 '슈퍼위크'.

### 🇰🇷 오후장 관전 포인트

1. **외국인 매도 속도** — 오전에만 코스피에서 4,678억원을 팔았다. 매도가 확대되며 저가 5,455선을 내주는지, 개인·기관(+4,391억원)이 계속 받아내는지가 관건이다.
2. **SK하이닉스 특별배당설의 향방** — 회사는 "확정된 것 없다"고 했다. 추가 해명이나 공시가 나오면 SK하이닉스·SK스퀘어·SK의 오후 흐름이 크게 달라질 수 있다.
3. **방산 악재 확산 여부** — LIG디펜스앤에어로스페이스(−12.41%)발 매도가 한화에어로스페이스·한화시스템 등으로 번진 상태다. 낙폭 과대 인식에 따른 저가 매수가 들어오는지 본다.
4. **AI 헬스케어·로봇 테마 지속력** — 루닛 상한가, 뷰노·씨어스·로보티즈 급등이 오후에도 유지되는지, 차익실현이 나오는지 확인한다.
5. **유가·미국 선물** — 나스닥100 선물(−0.33%)과 유가가 더 흔들리면 에너지장비·화학·항공 등 유가 민감 업종 변동성이 커질 수 있다.

> 본 리포트는 공개 데이터·보도·증권사 리포트를 정리한 참고 자료이며 투자 권유가 아닙니다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
