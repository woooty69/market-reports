## 🗓 시장 요약

**① 코스피 −3.31% 4,708.54…장중 5%대 급락·매도 사이드카, 4,700선 턱걸이 마감**
코스피는 4,734.90으로 갭하락 출발한 뒤 오전 중 낙폭이 5%를 넘어서며 2거래일 연속 매도 사이드카가 발동됐고 저점은 4,586.80이었다. 오후 들어 대만 증시가 시장안정조치로 2%대 반등하고 중국도 강보합을 지키자 낙폭을 3%대로 줄였다. 수급은 KRX 일 최종 기준 개인 −3,768억원·외국인 −2,315억원·기관 +1,811억원이었고 기관 안에서는 금융투자(+4,747억원)·보험(+568억원)이 사고 연기금(−1,577억원)·사모(−1,053억원)·투신(−534억원)이 팔았다. 정규장 마감(15:35) 수치와 장후 최종 수치의 차이는 200억원 안팎이었다. 프로그램은 차익 −193억원·비차익 +2,326억원으로 2,133억원 순매수였다. 고객예탁금은 11월 19일 기준 81.6조원으로 하루 새 2.6조원 줄었고 신용잔고는 26.1조원이며, 10조원 규모 증권시장안정펀드 가동 기대가 커졌지만 아직 집행 발표는 없었다.

**② 반도체: 삼성전자 −3.06%·SK하이닉스 −2.52%…SOX −10.73% 충격 속 프로그램은 순매수, 기판주는 강보합**
금요일 필라델피아 반도체지수가 10.73% 폭락한 데 비하면 국내 반도체 대형주 낙폭은 작았다. 삼성전자는 235일 만에 '17만전자'(177,500원)로, SK하이닉스는 110만원선 아래(1,085,000원)로 내려갔지만 프로그램은 SK하이닉스 2,490억원·삼성전자 912억원 순매수였다. 장 마감 뒤에는 골드만삭스가 HBM 시장 전망을 높이면서도 두 회사 목표가를 내렸다는 보도와, 반도체 가격이 10% 내리면 한국 수출이 4.3% 줄어든다는 블룸버그 경고가 나왔다. 반면 11월 1～20일 수출은 774억달러로 전년 대비 101.5% 늘어 역대 최대였다. 삼성전기(+0.52%)·심텍(+2.41%)·이수페타시스(+2.30%) 등 기판주와 테스(+4.86%)·피에스케이홀딩스(+4.37%) 등 일부 장비주는 올라 LS 테마 '반도체 기판'은 +0.31%(14종목 중 9종목 상승)였다.

**③ 강세 업종: 화장품·로봇·전자장비 — 에이피알 +9.13%, 휴림로봇·코스모로보틱스 상한가**
한중 FTA 서비스·투자 후속협상 타결로 한한령 해제 기대가 커지면서 에이피알이 9.13% 올랐고 화장품 업종은 +0.83%(44종목 중 17종목 상승)였다. 11월 1～20일 화장품 수출이 8.3억달러로 61.7% 늘었다는 데이터도 힘을 보탰다. 로봇은 LS 테마 기준 +1.44%(77종목 중 41종목 상승)로 하락장에서 가장 강했는데, 휴림로봇이 한화로보틱스·삼성전기향 로봇 공급 소식에 상한가, 코스모로보틱스도 상한가였고 빅웨이브로보틱스(+20.28%)·로보티즈(+5.35%)도 올랐다. 큐로셀은 국산 1호 CAR-T '림카토'의 12월 건강보험 적용에 상한가를 기록했다.

**④ 약세 업종: IT서비스·인터넷·건설·항공 — 트럼프 '해외 데이터센터 과세' 발언 직격탄**
IT서비스 업종이 8.34%(117종목 중 92종목 하락) 떨어져 하락 1위였고 양방향미디어(−6.79%)·건설(−6.63%, 68종목 중 60종목 하락)·항공화물(−6.42%)·항공사(−5.71%, 9종목 모두 하락)·게임(−5.07%, 31종목 모두 하락)이 뒤를 이었다. 미국 빅테크의 해외 데이터센터 투자가 줄 수 있다는 우려에 LS 테마 '데이터센터'는 28종목이 모두 내려 −6.04%였고 '건설 대표주'도 −6.67%(6종목 모두 하락)였다. 삼성에스디에스(−15.42%)·LG씨엔에스(−13.93%)·NHN(−18.30%)·GS건설(−12.57%)·삼성E&A(−7.96%)·NAVER(−7.18%)·SK텔레콤(−7.32%)이 크게 내렸다.

**⑤ 환율·해외·파생: 원/달러 1,345.9원(+9.7원), 외국인 선물 1,681계약 순매수, 야간선물 +1.49%**
원/달러는 15:30 기준 1,345.9원으로 9.7원 올랐다. 금요일 뉴욕은 S&P500 −3.70%·나스닥 −5.28%·다우 −1.93%로 마감해 S&P500과 나스닥이 고점 대비 각각 11%대·18%대 내려간 조정 국면에 들어섰지만, 17:55 기준 S&P500 선물은 +2.15%, 나스닥100 선물은 +2.67%로 반등 중이다. 상해종합은 +0.15%, 항셍은 −0.12%였고 일본은 공휴일로 휴장했다. 주간 코스피200 선물은 726.65(−3.47%)로 현물보다 4.18포인트 낮은 백워데이션이었고 미결제약정은 173,394계약으로 4,698계약 늘었으며 외국인은 1,681계약을 순매수했다(기관 −1,516계약). 월물 옵션 미결제는 콜 750(1,430계약)·780(1,145계약), 풋 750(4,567계약)·700(3,788계약)에 쌓였고 PCR은 1.14다. 야간선물은 18시 22분 현재 737.50으로 주간 종가보다 10.85포인트(+1.49%) 높다.

**⑥ 코스닥·장 마감 후: 코스닥 −1.58% 635.45…큐로셀 CB 전환가 하향, 두산 5,000억 조달 추진, 카카오 1.5조 중재**
코스닥은 장중 618.74까지 밀려 2년 만의 최저 수준을 찍은 뒤 낙폭을 줄여 635.45로 마감했다. 개인(−1,729억원)·외국인(−346억원)이 팔고 기관이 1,956억원(금융투자 +1,491억원)을 샀으며, 프로그램은 190억원 순매수였지만 레인보우로보틱스(−202억원)·주성엔지니어링(−150억원)에는 매도가 나왔다. 장 마감 후에는 큐로셀이 제2회 CB 전환가액을 25,950원으로 내렸고, 두산은 국민성장펀드에서 5,000억원을 조달해 AI 소재 생산을 늘리는 방안을 추진한다고 알려졌다. 카카오는 카카오모빌리티 미국 상장 무산을 두고 TPG로부터 1.5조원 규모 국제중재를 신청당했고, LG화학은 순차입금 26조원 부담 속 신용등급이 AA로 강등됐다. 네이버는 물류 자회사 '네이버로직스'를 세우고 김범준 COO를 대표로 내정했다.

## 1. 업종별 흐름

에이치브이엠은 16.51% 오른 48,700원으로 마감했고 장중 외국인·기관 동시 순매수가 포착됐다. 개별 기사는 없었지만 IBK투자증권은 11월 18일 3분기 매출이 263억원으로 96.1% 늘었고 우주 소재 매출이 164억원(+77.5%), 수주잔고가 594억원(+67%대)이라며 매수 의견을 유지했다. 다만 과거 고환율로 산 원재료 탓에 영업손실 8억원을 냈고 목표가는 49,000원으로 낮췄는데, 오늘 종가가 이미 목표가에 바짝 다가섰다. 장 마감 후 시간외 단일가는 48,350원(+15.67%)이었다. [리포트: IBK 2026-11-18](https://woooty69.github.io/hw-pdf-arch-043/%EC%97%90%EC%9D%B4%EC%B9%98%EB%B8%8C%EC%9D%B4%EC%97%A0%EF%BC%BB295310%EF%BC%BD_20261118_IBK_198319.pdf) · [리포트: Korea Investment 2026-10-05](https://woooty69.github.io/hw-pdf-arch-028/%EC%97%90%EC%9D%B4%EC%B9%98%EB%B8%8C%EC%9D%B4%EC%97%A0%EF%BC%BB295310%EF%BC%BD_20261005_Korea%2BInvestment_4073428147.pdf) · [리포트: Hana 2026-06-12](https://woooty69.github.io/hw-pdf-arch-008/%EC%97%90%EC%9D%B4%EC%B9%98%EB%B8%8C%EC%9D%B4%EC%97%A0%EF%BC%BB295310%EF%BC%BD_20260612_Hana_1105163.pdf)

빅웨이브로보틱스는 20.28% 오른 21,650원으로 마감했고 거래대금이 1,361억원으로 코스닥 상위권이었다. 개별 공시·뉴스는 확인되지 않았고, 하락장에서 LS 로봇 테마가 +1.44%(77종목 중 41종목 상승)로 가장 강했던 흐름과 '50조원 휴머노이드 펀드가 3～6개월 안에 로봇 대도약을 예상한다'는 기사가 매수를 자극한 것으로 보인다. 9월 상장한 이 회사는 공모자금 약 227억원 중 165억원을 미국 디트로이트 거점의 글로벌 진출과 RaaS 장비 확보에, 42억원을 휴머노이드 연동 R&D에 쓸 계획이다. 시간외 단일가는 21,600원(+20.00%)이었다. [리포트: Mint Investment Advisors 2026-09-07](https://woooty69.github.io/hw-pdf-arch-018/%EB%B9%85%EC%9B%A8%EC%9D%B4%EB%B8%8C%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB0035S0%EF%BC%BD_20260907_Mint%2BInvestment%2BAdvisors_1129495.pdf) · [리포트: NH 2026-06-17](https://woooty69.github.io/hw-pdf-arch-008/%EB%B9%85%EC%9B%A8%EC%9D%B4%EB%B8%8C%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB0035S0%EF%BC%BD_20260617_NH_1106229.pdf) · [리포트: dyneasset 2026-06-11](https://woooty69.github.io/hw-pdf-arch-007/%EB%B9%85%EC%9B%A8%EC%9D%B4%EB%B8%8C%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB0035S0%EF%BC%BD_20260611_dyneasset_1104954.pdf)

아이엠바이오로직스는 14.09% 오른 14,410원으로 마감했다. 아침에 하나증권이 2027년 전망 리포트(Not Rated)를 냈고, 고름·통증을 동반한 염증성 질환 등 자가면역질환을 겨냥한 이중항체 'IMB-101'이 글로벌 2상에 들어가 있다는 기사가 나왔다. IV리서치는 주력 파이프라인 IMB-101·IMB-102 임상을 파트너사 Navigator Medicines가 진행해 회사의 재무 부담이 낮고 2027년 파이프라인 가치가 퀀텀점프할 수 있다고 평가했다. 거래대금은 20.7억원으로 적어 변동성에 유의해야 한다. [리포트: IV Research 2026-07-20](https://woooty69.github.io/hw-pdf-arch-012/%EC%95%84%EC%9D%B4%EC%97%A0%EB%B0%94%EC%9D%B4%EC%98%A4%EB%A1%9C%EC%A7%81%EC%8A%A4%EF%BC%BB493280%EF%BC%BD_20260720_IV%2BResearch_1114310.pdf) · [리포트: Growth Research 2026-07-06](https://woooty69.github.io/hw-pdf-arch-010/%EC%95%84%EC%9D%B4%EC%97%A0%EB%B0%94%EC%9D%B4%EC%98%A4%EB%A1%9C%EC%A7%81%EC%8A%A4%EF%BC%BB493280%EF%BC%BD_20260706_Growth%2BResearch_1110389.pdf) · [리포트: Growth Research 2026-06-11](https://woooty69.github.io/hw-pdf-arch-008/%EC%95%84%EC%9D%B4%EC%97%A0%EB%B0%94%EC%9D%B4%EC%98%A4%EB%A1%9C%EC%A7%81%EC%8A%A4%EF%BC%BB493280%EF%BC%BD_20260611_Growth%2BResearch_1104854.pdf)

**5. 코스모로보틱스 (439960) 4,640원 · 1,506억원 · +29.97% — '검은 월요일' 속 개장 직후 상한가, 기사 22건(평소 44배)**
코스모로보틱스는 개장하자마자 상한가(+29.97%)로 직행해 4,640원으로 마감했고 거래대금은 322억원이었다. 오늘 기사는 22건으로 평소의 44배였지만 20건이 로봇·시황 나열 기사였고 공시·수주 같은 개별 재료는 확인되지 않아 '재료 없는 관심 급증'에 가깝다. 이 회사는 이동형 하지 외골격 재활로봇 업체로 42개국 인증과 미국 FDA 510(k) 이력을 갖고 있으며 유아용 '밤비니키즈'로 미국 시장을 공략하고 있다. 과거 사례상 사건 없이 기사만 급증한 종목은 이후 5일 −4.1%·20일 −8.5% 초과수익을 냈다. [리포트: dyneasset 2026-04-16](https://woooty69.github.io/hw-pdf-arch-004/%EC%BD%94%EC%8A%A4%EB%AA%A8%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB439960%EF%BC%BD_20260416_dyneasset_1088538.pdf) · [리포트: Samsung 2026-04-13](https://woooty69.github.io/hw-pdf-arch-001/%EC%BD%94%EC%8A%A4%EB%AA%A8%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB439960%EF%BC%BD_20260413_Samsung_1087442.pdf)

**6. SK하이닉스 (000660) 1,085,000원(비정규 NXT 1,095,000원) · 766조 8,770억원 · −2.52% — 110만원선 붕괴에도 프로그램 2,490억원 순매수, 윤풍영 사장 자사주 16억원 매입**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
