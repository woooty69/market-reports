# 미국→한국 선점 2026-11-12 (미국 2026-11-11 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 76개 · 연결 종목 881개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 7개:** Advertising(격차 +19.3%p), 방산(격차 +17.6%p), 조선·LNG선·함정 MRO(격차 +16.3%p), 드론·UAM(격차 +9.7%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 게임, 반도체 소재·부품, 항공기 부품, 해운 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** CDMO·바이오시밀러(-9.4%p), Biotechnology: Laboratory Analytical Instruments(-6.8%p), 비만치료제(-5.2%p)
- **이제 막 힘 붙는 조기 테마:** 우라늄·핵연료(조기 70), 후공정·패키징·테스트(조기 70), 원전·SMR 기자재(조기 68) — 다음 주 선점 후보군.
