## 🗓 시장 요약

**① 워시 의장의 잭슨홀 데뷔 — "해야 할 일이 더 있다"**
케빈 워시 연준 의장이 취임 후 첫 잭슨홀 기조연설에서 **"인플레이션이 연준의 목표치인 2%를 향해 분명하고 충분히 빠른 속도로 가고 있다는 확신이 없다면 중앙은행에는 해야 할 일이 더 있다"**고 말했다. 시장은 이를 **금리 인상 시사**로 읽었다. CME 페드워치에서 9월 FOMC의 **0.25%p 인상 확률은 전날 35.4%에서 57.5%로 하루 만에 20%p 넘게 급등**했다. 현행 기준금리 **3.50~3.75%**가 **3.75~4.00%**로 올라갈 가능성을 시장이 동결(42.5%)보다 높게 보기 시작한 것이다. 8월 한 달 내내 이어진 연준 인사들의 매파 정렬이 의장 본인의 입으로 확정된 하루였다.

**② 그런데 지수는 거의 안 빠졌다 — 다우 −0.02%, S&P −0.25%**
금리 인상 확률이 22%p 뛰었는데 다우는 **9.45포인트(−0.02%)** 내리는 데 그쳤고 S&P 500도 **−0.25%**였다. 나스닥만 **−0.52%**. 지수 표면만 보면 워시 충격은 없었던 것처럼 보인다. **충격은 지수가 아니라 섹터 안에서 터졌다.**

**③ 진짜 사건은 반도체였다 — SOX −3.47%, 엔비디아 −4.58%, 마벨 −10.30%**
필라델피아 반도체지수가 **3.47% 급락**했다. 전날 **+8.74%** 폭등했던 엔비디아가 **−4.58%**로 되밀렸고, 마벨테크놀로지는 **−10.30%** 급락했다. 마벨은 **2027년 매출 전망치를 상향했는데도** 알파벳(구글)과 맺은 AI 칩 계약에서 **매출이 실제로 발생하는 시점**을 둘러싼 의구심에 두 자릿수로 맞았다. **가이던스 상향이 더 이상 자동 방어막이 아니라는 신호**다.

**④ 빅테크는 오히려 올랐다 — 아마존 +4.00%, 알파벳 +1.70%, MS +1.68%**
같은 날 아마존이 **4.00%**, 알파벳이 **1.70%**, 마이크로소프트가 **1.68%**, 애플이 **1.60%**, 메타가 **1.20%** 올랐다. 알파벳은 S&P500 커뮤니케이션서비스 업종 상승을 가장 크게 뒷받침했다. **"AI = 반도체"라는 등식이 하루 만에 "AI = 플랫폼"으로 갈라진 구도**다. 반도체는 관세·금리·설비투자 회수 시점이라는 3중 리스크에 노출된 반면, 현금흐름이 두꺼운 플랫폼은 금리 상승 국면에서 오히려 방어 자산 취급을 받았다.

**⑤ 채권·달러는 정직하게 반응했다 — 2년물 4.348%(+11.8bp)**
정책 기대에 민감한 **2년물이 11.8bp 급등한 4.348%**, 10년물은 5.0bp 오른 **4.720%**, 30년물은 1.6bp 오른 **5.20%**를 기록했다. **단기물이 훨씬 크게 오르는 전형적인 베어 플래트닝**이다. 달러인덱스는 **99.70(+0.55%)**으로 올랐고, 금 선물은 **\$4,529.90(−2.87%, −134.10달러)**로 급락했다. 금이 3% 가까이 빠진 것이 이날 시장의 해석을 가장 압축적으로 보여준다 — **실질금리 상승 = 무이자 자산 이탈**.

**⑥ 유가는 두 개의 악재를 동시에 맞았다 — 주간 −4%대**
WTI는 배럴당 **\$83.40**으로 마감했다. 워시의 매파 발언(수요 둔화)과 **호르무즈 해협 통항 재개 합의 가능성 소문**(공급 회복)이 겹쳤다. 미 중부사령부는 같은 날 **"호르무즈 기뢰 제거를 성공적으로 완료했다"**고 발표했다. 브렌트유는 **\$89.31(−0.43%)**. 주간으로는 **WTI가 4% 이상, 브렌트가 5% 이상** 떨어져 8월 내내 이어진 중동 프리미엄이 되돌려졌다.

**⑦ 한국은 미국보다 먼저, 더 크게 맞았다 — 코스피 −1.79%**
워시 연설(한국 시간 금요일 밤) 이전에 이미 국내 증시가 무너졌다. **미국이 반도체에 전면적 고율 관세 부과를 검토하고 있다**는 보도가 나오면서 **삼성전자 −3.38%**, **SK하이닉스 −4.45%(1,653,000원)**로 투톱이 동반 급락했다. 코스피는 **−123.49p(−1.79%, 6,788.88)**로 4거래일 만에 하락 전환했고 6,800선을 내줬다. **외국인이 1조 7,600억원을 순매도**했고 기관까지 합치면 2조원대 매도다. SK하이닉스에서만 외국인 **−19만 235주**, 기관 **−79만 6,000주**가 나왔다. 반면 코스닥은 **+0.09%(838.41)**로 강보합을 지켰다. 원/달러는 주간거래 종가 **1,372.5원(−8.4원)**으로 원화 강세가 이어졌다.

> *어제 판정 복기 — **틀렸다.** '보합~소폭 상승 출발 후 상단 제한'으로 봤는데 실제는 **코스피 −1.79%**였다. 방향 자체가 반대다. 원인은 두 가지다. 첫째, **야간선물 −0.73%를 '상단 제한' 수준으로만 해석**했다 — 저가 1,066.75(−2.12%)까지 밀린 궤적을 확인하고도 그 저가 쪽 시나리오에 무게를 싣지 않았다. 둘째, 그때 **"하락 전환의 구체적 트리거는 확인되지 않았다"고 적었던 그 트리거가 결국 '미 반도체 전면 관세 검토' 보도**였다. 트리거를 못 찾았으면 그 자체를 **경계 신호**로 취급했어야 했는데, 오히려 "재료 없음 = 되돌림"으로 완화 해석했다. **트리거 미확인은 안심 근거가 아니라 위험 근거다.***

**주간 총평 — 지수는 반등했고, 반도체는 또 졌다.** 3대 지수는 3주 만에 상승 전환했다(+0.49%~+0.85%). 그런데 **SOX는 −2.35%로 2주 연속 하락**이다. 엔비디아가 주중에 **+8.74% → −4.58%**로 롤러코스터를 탔고, 결국 주간 기준으로는 반도체가 지수를 따라가지 못했다. **이번 주의 구조는 명확하다 — AI 내러티브는 살아 있지만, 그 수혜가 칩에서 소프트웨어·플랫폼으로 이동했다.** 주중 세일즈포스 +22.60%, 옥타 +23.30%, 크라우드스트라이크 +20.50%가 그 증거다.

두 번째 축은 **금리**다. 한국은행이 8/27 기준금리를 3.00%로 **2회 연속 인상**했고, 8/28 워시 의장이 미국의 인상 가능성을 열었다. **한미 동시 긴축 전환 가능성**이 한 주의 마지막에 놓였다. WTI −4.20%가 그나마 물가 쪽 완충재다.

세 번째 축은 **관세**다. 미국의 반도체 전면 관세 검토 보도가 금요일 국내 증시를 혼자 무너뜨렸다(코스피 −1.79%, 미국 −0.25%). **한국 시장이 미국 시장보다 미국 정책 리스크에 더 크게 노출돼 있다**는 구조가 다시 확인됐다. 원/달러 −14.0원(원화 강세)에도 외국인이 1.76조원을 팔았다는 점이 이번 주 수급의 결론이다.

## 🏭 섹션 1. 업종별 흐름

**하락 ①  반도체 (이날 최약)**
SOX **−3.47%**, 엔비디아 **−4.58%**, 마벨테크놀로지 **−10.30%**. 전날 SOX가 **+2.33%** 올랐던 것을 하루 만에 되돌리고도 더 빠졌다. 금리 인상 기대(설비투자 할인율 상승)와 **미국의 반도체 전면 관세 검토** 보도가 동시에 작용했다.

**하락 ②  결제·핀테크**
페이팔이 **−12.70%** 급락했다. 사모펀드 어드벤트와 결제업체 스트라이프로 구성된 컨소시엄이 **페이팔 인수 추진을 포기**하기로 했다는 블룸버그 보도가 원인이다. 인수 프리미엄 기대가 통째로 사라졌다.

**하락 ③  귀금속·원자재**
금 선물이 **−2.87%(\$4,529.90)**로 급락했다. 달러인덱스 **99.70(+0.55%)** 상승과 실질금리 상승이 겹쳤다. WTI **\$83.40**, 브렌트 **\$89.31(−0.43%)**도 하락했다.

**상승 ①  빅테크·플랫폼**
아마존 **+4.00%**, 알파벳 **+1.70%**, 마이크로소프트 **+1.68%**, 애플 **+1.60%**, 메타 **+1.20%**. 알파벳이 S&P500 커뮤니케이션서비스 업종 상승을 견인했다. **반도체에서 빠진 자금이 플랫폼으로 이동한 하루**다.

**상승 ②  소프트웨어 (반전 지속)**
전날 **+22.60%** 폭등했던 세일즈포스가 이날도 **+1.60%** 올라 오름세를 이어갔다. 이번 주 소프트웨어 반전이 일회성 반등이 아니었음을 확인한 셈이다.

**상승 ③  의류·유통 (개별 재료)**
갭이 **+13.00%** 급등했다. 전체 매출의 약 60%를 차지하는 **올드네이비의 새 CEO로 업계 베테랑 마이클 프랜시스를 임명**하고 **연간 이익 전망치를 상향**했다.

> 🇰🇷 [전달] **코스피200 야간선물은 −0.36%(1,064.20)로 소폭 하락 마감**했다. 다만 장중 궤적이 훨씬 중요하다 — 정규장 종가(1,068.00)에서 출발해 **고가 1,086.30(+1.71%)까지 올랐다가 저가 1,061.70(−0.59%)까지 밀린 뒤 1,064.20으로 마감**했다. 즉 **국내 급락(−1.79%)에 대한 되돌림 시도가 장 초반에 분명히 있었고, 워시 연설 이후 되반납**된 흐름이다. 거래량 **23,973계약**, 미결제약정 **155,518계약(▲320)**으로 전일 대비 거래는 늘고 미결제는 소폭 증가했다.

**[판정]** **하락 출발 후 낙폭 축소 시도, 그러나 반도체 개별 종목은 추가 약세로 본다.**
**상방 근거**: ①**야간선물 장중 고가 1,086.30(+1.71%)** — 전일 급락에 대한 되돌림 수요가 실재함, ②**미 3대 지수 낙폭이 −0.02~−0.52%로 매우 제한적**, ③빅테크 동반 상승(아마존 +4.00%, 알파벳 +1.70%, MS +1.68%), ④**WTI 주간 −4.20%**로 물가 압력 완화, ⑤원/달러 **1,372.5원**까지 하락한 원화 강세, ⑥코스닥이 전일 **+0.09%**로 이미 방어에 성공.
**하방 근거**: ①**SOX −3.47%·엔비디아 −4.58%·마벨 −10.30%**로 반도체가 이날 최약 섹터, ②**9월 금리 인상 확률 57.5%**로 한미 동시 긴축 우려, ③**2년물 4.348%(+11.8bp)** 급등, ④**미 반도체 전면 관세 검토**라는 재료가 아직 해소되지 않음, ⑤전일 **외국인 1.76조원 순매도**의 연속성, ⑥달러인덱스 **99.70(+0.55%)** 반등.
**판정: 지수는 낙폭 축소, 반도체 투톱은 약세 지속**으로 본다. **미 지수 하락폭이 미미했던 반면 SOX만 −3.47%로 무너진 비대칭**이 핵심이다. 국내 지수는 전일 −1.79%로 이미 관세 우려를 상당 부분 반영했으므로 추가 하락 여력은 제한적이지만, **SOX −3.47%를 아직 반영하지 못한 삼성전자·SK하이닉스는 별도 압력**을 받는다. 야간선물이 고가 1,086.30까지 갔다가 되반납한 것은 **되돌림 시도가 워시 연설에 막혔다**는 뜻으로 해석한다. (무효화: 주말 사이 관세 검토가 공식 부인되거나 범위가 축소될 경우 반도체 투톱 급반등 가능. 반대로 관세율이 구체적으로 특정될 경우 지수 하방 재확대)

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 엔비디아 (NVDA) −4.58% — 하루 만의 반납, 실적은 이미 소진된 재료다**
전날 **+8.74%** 급등했던 주가가 이날 **4.58% 하락**했다. 실적과 가이던스라는 재료가 하루 만에 소진됐고, 그 자리를 **금리와 관세**가 채웠다. 9월 금리 인상 확률이 **35.4%에서 57.5%로** 뛰면서 장기 성장주의 할인율 부담이 커졌다.
구조적으로도 부담이 쌓였다. 회사가 실적 발표에서 직접 경고했던 **메모리 부품 부족**은 원가 상승 요인이고, 여기에 **미국의 반도체 전면 관세 검토** 보도가 겹쳤다. 관세는 엔비디아 자신보다 **고객사의 데이터센터 구축 단가**를 올려 수요 시점을 늦춘다는 점에서 더 위험하다.
이틀간 궤적을 보면 **+8.74% → −4.58%**로 순증은 여전히 플러스다. 다만 SOX가 같은 이틀 **+2.33% → −3.47%**로 순감이라는 점이 더 중요하다. **개별 실적으로는 방어됐지만 섹터 전체로는 방어되지 않았다**는 뜻이다.

**2. 마벨테크놀로지 (MRVL) −10.30% — 전망을 올렸는데 10% 빠졌다**
맞춤형 AI 칩 설계 기업이 **10.30% 급락**하며 이날 반도체 최대 낙폭을 기록했다. 회사는 **2027년 매출 전망치를 상향 조정**했다. 그런데도 두 자릿수로 맞았다.
이유는 **시점**이다. 알파벳(구글)과 체결한 AI 칩 계약에서 **매출이 실제로 발생하는 시점**을 둘러싼 의구심이 제기됐다. 계약 규모가 아니라 **인식 시기**가 문제가 된 것이다.
이 사례가 이번 주 시장 성격을 가장 잘 보여준다. 8/27에는 세일즈포스가 가이던스 상향으로 **+22.60%** 폭등했는데, 하루 뒤 마벨은 같은 가이던스 상향으로 **−10.30%**를 맞았다. **금리 인상 기대가 커지면 '먼 미래의 매출'에 붙는 할인율이 급격히 올라간다** — 상향 자체보다 **언제 들어오는 돈인가**가 주가를 갈랐다.

**3. SK하이닉스 ADR (SKHY) −0.35% — \$161.04 (괴리율: +33.7%), ADR은 버텼고 본주는 무너졌다**
SOX가 **−3.47%** 무너지는 와중에 SKHY는 **−0.35%(\$161.04)**로 거의 버텼다. 시간외에서도 **\$160.40(−0.40%)**로 추가 낙폭이 제한적이었다. 메모리는 관세 논의에서 상대적으로 대체재가 없다는 인식이 작용한 것으로 보인다.
문제는 국내다. **SK하이닉스(000660)는 −4.45%(1,653,000원)** 급락했다. **미국의 반도체 전면 관세 검토** 보도에 외국인이 **−19만 235주**, 기관이 **−79만 6,000주**를 팔았고 개인만 **+33만 9,503주** 받았다. 거래대금 **7조 6,683억원**, 시가총액 **1,207조원**으로 하루 만에 55조원이 증발했다.
그 결과 **괴리율이 +29.0% → +33.7%로 4.7%p 급확대**됐다. 원/달러가 **1,372.5원(−8.4원)**으로 오히려 내렸는데도 괴리가 벌어졌다는 것은 **순수하게 본주만 더 빠졌다**는 뜻이다. 컨센서스 PER **4.73배**, 2026년 예상 ROE **101.70%** 대비로 보면 밸류에이션 훼손이 아니라 **정책 리스크 프리미엄**이 붙은 국면이다.

**4. 갭 (GPS) +13.00% — 올드네이비 새 CEO와 이익 전망 상향, 이날 최대 상승**
의류 유통업체가 **13.00% 급등**하며 이날 상승률 1위에 올랐다. 재료는 두 가지다. 전체 매출의 약 **60%**를 차지하는 핵심 브랜드 **올드네이비의 새 최고경영자(CEO)로 업계 베테랑 마이클 프랜시스를 임명**했고, 동시에 **연간 이익 전망치를 상향**했다.
이번 주 소비주 흐름과 대조적이다. 8/27 배스앤바디웍스 **−23.00%**, 호멜푸즈 **−9.10%**로 소비 관련주가 줄줄이 무너졌다. 같은 업종에서 갭만 **+13.00%**로 튄 것은 **소비 사이클이 아니라 개별 실행력이 재평가된 결과**다.
경영진 교체가 이 정도 주가 반응을 만든 것은 **시장이 유통업에서 브랜드 리더십을 실적 변수로 인식하고 있다**는 신호다. 다만 실제 실적 개선은 다음 분기 이후에나 확인 가능하다.

**5. 페이팔 (PYPL) −12.70% — 인수 추진 포기, 프리미엄이 사라졌다**
결제 대표주가 **12.70% 급락**했다. 블룸버그통신이 전날 **사모펀드 어드벤트와 결제업체 스트라이프로 구성된 컨소시엄이 페이팔 인수 추진을 포기하기로 했다**고 보도한 영향이다.
인수설이 돌 때 붙었던 프리미엄이 통째로 빠졌다. 이날 **S&P 500이 −0.25%**, 다우가 **−0.02%** 내리는 데 그친 것과 비교하면 **페이팔 혼자 −12.70%**를 맞은 셈이다. **본업 실적과 무관하게 M&A 기대만으로 형성됐던 가격이 얼마나 취약한지**를 보여준다.
결제 업종 전반의 구조적 문제도 남는다. 애플페이·구글페이 등 플랫폼 내장 결제와 스트라이프 같은 비상장 경쟁자 사이에서 페이팔의 포지션이 좁아지고 있다는 지적이 이어져 왔다. **인수라는 출구가 닫혔다는 것은 그 문제를 자력으로 풀어야 한다는 뜻**이다.

**6. 알파벳 (GOOGL) +1.70% — 이날 S&P500 커뮤니케이션서비스 최대 기여**
구글 모회사가 **1.70% 상승**해 S&P500 커뮤니케이션서비스 업종의 상승을 가장 크게 뒷받침했다. 지수 전체가 **−0.25%** 내린 날의 상승이라 상대 강도가 두드러졌다.
아이러니한 구도가 있다. 같은 날 마벨은 **알파벳과의 AI 칩 계약 매출 인식 시점** 문제로 **−10.30%** 급락했다. **같은 계약에서 발주처는 오르고 수주처는 빠진 것**이다. 시장이 AI 자본지출의 부담을 칩 공급망 쪽에 더 크게 매기고 있다는 뜻이다.
금리 상승 국면에서 빅테크가 방어 자산 취급을 받는 흐름도 확인됐다. 알파벳과 함께 애플 **+1.60%**, 마이크로소프트 **+1.68%**, 메타 **+1.20%**가 모두 올랐다.

**7. 아마존 (AMZN) +4.00% — 빅테크 중 최대 상승, 금리 상승일에 4% 올랐다**
아마존이 **4.00% 상승**해 이날 빅테크 중 가장 크게 올랐다. **2년물 금리가 11.8bp 급등한 날에 대형 성장주가 4% 오른 것**은 흔한 조합이 아니다.
해석은 두 갈래다. 하나는 **AI 수혜의 무게중심이 칩에서 클라우드로 이동**했다는 것이다. 같은 날 **미국의 반도체 전면 관세 검토** 보도가 나왔지만 AWS는 관세에 직접 노출되지 않으면서 AI 수요의 최종 수취인이다. 다른 하나는 **소비 지표 악화 국면에서 오히려 저가·물류 경쟁력이 부각**됐다는 시각이다.
이번 주 발표된 소비 관련 지표와 실적을 보면 후자도 근거가 있다. 8/25 발표된 CB 소비자신뢰지수는 **89.4**로 예상(**90.2**)을 밑돌았고, 8/27 배스앤바디웍스는 매출·이익 동반 감소로 **−23.00%**, 호멜푸즈는 **연간 매출 전망 하향**에 **−9.10%** 급락했다. **소비가 위축될수록 아마존으로 지출이 집중되는 구조**가 반복 확인되고 있다.

**8. 애플 (AAPL) +1.60% — 폴더블 아이폰 공개를 2주 앞두고 상승**
애플이 **1.60% 올랐다.** 반도체가 무너진 날 하드웨어 대표주가 오른 것은 **애플의 실적 구조가 이미 서비스 중심으로 이동**했기 때문이라는 해석이 나온다.
가까운 촉매도 있다. 애플은 **9월 9일 신형 아이폰을 공개**할 예정이며, 이 자리에서 **첫 폴더블폰**이 나올 것으로 알려졌다. 신제품 사이클 기대가 금리 부담을 상쇄했다.
다만 폴더블 아이폰은 **한국 부품사에 양날의 검**이다. 디스플레이·힌지 수혜가 기대되는 반면, 메모리 가격이 **15% 이상 인상**된 상황에서 애플의 원가 압박이 부품 단가 협상으로 이어질 수 있다.

**9. 마이크로소프트 (MSFT) +1.68% — AI 인프라 부담론에서 한 발 비켜섰다**
마이크로소프트가 **1.68% 상승**했다. SOX가 **−3.47%** 무너진 날의 상승이라는 점이 핵심이다. **AI 자본지출의 부담은 칩 공급망이 지고, 과실은 클라우드가 가져간다**는 구도가 이날 가격에 그대로 찍혔다.
이번 주 소프트웨어 반전과도 맞물린다. 8/27 세일즈포스 **+22.60%**, 옥타 **+23.30%**, 크라우드스트라이크 **+20.50%**로 "AI가 기존 SaaS를 대체한다"는 공포가 실적으로 반박됐고, 그 온기가 이날까지 이어졌다.
금리 측면에서도 방어력이 있다. 9월 인상 확률이 **57.5%**까지 올라간 국면에서 **현금흐름이 두껍고 이익 가시성이 높은 기업**이 상대적으로 선호된다. 마이크로소프트는 그 조건을 가장 잘 충족하는 종목으로 분류된다.

**10. 세일즈포스 (CRM) +1.60% — 이틀째 상승, 반전이 일회성이 아니었다**
전날 **22.60%** 폭등했던 CRM 대표주가 이날도 **1.60% 올랐다.** 급등 다음 날 차익실현이 나오지 않았다는 점이 중요하다.
전날 재료는 명확했다. 2분기 조정 EPS **5.90달러**로 LSEG 컨센서스 **3.27달러**를 압도했고, **연간 매출·이익 전망을 동시에 상향**했으며, **앤스로픽의 클로드와 연동되는 신규 기능**을 공개했다.
이틀 연속 상승은 **AI가 SaaS를 대체한다는 서사가 실제로 뒤집혔다**는 시장 판단을 뒷받침한다. 같은 날 마벨이 가이던스를 올리고도 **−10.30%** 빠진 것과 대비하면 결론은 하나다 — **시장은 지금 '이미 들어온 실적'에 프리미엄을, '앞으로 들어올 매출'에 디스카운트를 매기고 있다.**

## 💬 섹션 3. 구루·기관 코멘트

- **케빈 워시 (연준 의장, 잭슨홀 기조연설):** *"인플레이션이 연준의 목표치인 2%를 향해 분명하고 충분히 빠른 속도로 가고 있다는 확신이 없다면 중앙은행에는 해야 할 일이 더 있다."* — 취임 후 첫 잭슨홀 연설. 시장은 9월 인상 확률을 **35.4% → 57.5%**로 재조정했다.
- **CME 페드워치:** 9월 FOMC에서 기준금리가 현행 **3.50~3.75%**에서 **3.75~4.00%**로 0.25%p 인상될 확률 **57.5%**, 동결 **42.5%**.
- **모간스탠리(전일, 참고):** 엔비디아의 다음 회계연도 **매출 70% 성장** 전망이 자사 추정치 **52%**와 시장 평균 **40%**를 크게 웃돈다고 평가 — 이날 −4.58% 하락으로 해당 프리미엄이 부분 반납됐다.
- **국내 시각(주간증시전망, 아주경제):** 엔비디아 호실적에도 **미국의 반도체 전면 관세 검토**가 국내 반도체주를 눌렀으며, **SK하이닉스·삼성전자의 자사주 매입 등 주주환원이 지수 하단을 지지**했다는 평가.

## 📅 섹션 4. 일정 및 관전 포인트

- **🏛 9월 FOMC(9/15~16) — 인상 확률 57.5%:** 워시 의장의 첫 정책회의다. 인상이 현실화되면 **한미 동시 긴축**이 된다(한은은 8/27 이미 3.00%로 2회 연속 인상). 다음 주 발표될 **8월 고용지표·물가지표**가 확률을 다시 흔들 변수다.
- **🔧 반도체 관세 — 가장 큰 미해결 변수:** 미국이 반도체에 **전면적 고율 관세** 부과를 검토 중이라는 보도가 금요일 국내 증시를 혼자 무너뜨렸다(코스피 −1.79% vs S&P500 −0.25%). **관세율·적용 범위·시행 시점**이 구체화되기 전까지 삼성전자·SK하이닉스는 할인 상태가 유지될 가능성이 높다. 주말 사이 공식 부인·범위 축소가 나오면 급반등 재료다.
- **📱 애플 신형 아이폰 공개(9/9) — 첫 폴더블:** 국내 디스플레이·부품주에 직접 재료다. 다만 **메모리 가격 15% 이상 인상** 국면이라 세트 업체의 원가 압박이 부품 단가 협상으로 전가될 여지도 함께 본다.
- **🛢 유가 — 주간 WTI −4.20%, 브렌트 −5%대:** **호르무즈 기뢰 제거 완료** 발표와 통항 재개 합의 가능성이 8월 내내 붙어 있던 중동 프리미엄을 되돌렸다. 물가 측면에서는 완화 재료이나, 워시의 매파 기조가 이미 반영된 만큼 금리 경로를 되돌릴 만큼의 힘은 아직 아니다.
- **💱 원/달러 1,372.5원 — 주간 −14.0원:** 원화 강세가 이어지는데도 외국인이 **1.76조원**을 순매도했다. **환율 유인보다 관세 리스크가 컸다**는 뜻이며, 이 구도가 깨지는지가 다음 주 수급의 관전 포인트다.
- **📉 SOX −3.47% 미반영분:** 국내 증시는 금요일에 관세 재료로 먼저 빠졌고, **미 반도체지수의 −3.47%는 아직 반영하지 못했다.** 다음 거래일 삼성전자·SK하이닉스의 갭 처리 방식이 이번 조정의 성격(단기 충격 vs 추세 전환)을 가른다.
