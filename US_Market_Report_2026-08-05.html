## 🗓 시장 요약

**사상 최고 랠리가 하루 더 이어졌다.** **다우가 사상 처음 54,000을 돌파**(+1.71%, +907p)하며 이틀 연속 신고가를 썼고, S&P 500(+1.79%·7,736.52)과 나스닥(+2.59%·26,584.99)도 신고가를 경신했다. **팔란티어가 실적 서프라이즈로 +29.45% 폭등**(2024년 2월 이후 최고일)하며 AI 소프트웨어·반도체 전반의 랠리를 촉발했다.

**반도체가 폭발했다.** 필라델피아 반도체 지수(SOX)가 **+6.55%** 치솟았고, ARM(+17.39%)·마벨(+12.81%)·아스테라랩스(+12.62%)·마이크론(+7.59%)·AMD(+7.00%)가 급등했다. 특히 **SK하이닉스 ADR은 +8.17%($154.38) 폭등**했다. BofA·캔터·로젠블랫 등 **6곳 이상의 증권사가 일제히 매수 의견으로 커버리지를 개시**했고(캔터는 목표가 $300·100% 상승여력), SK하이닉스가 샌디스크와 함께 **HBF(고대역폭 플래시) 메모리 표준을 발표**하며 AI 메모리 슈퍼사이클 낙관론에 불을 붙였다.

여기에 **유가가 −6.15%($75.14) 추가 급락**(이란 협상 기대)하며 금리도 하락(10년물 4.615%)해 위험선호를 뒷받침했다. 다만 아마존(−2.36%)은 전날 급등의 되돌림에, 치폴레(−9.72%)·앱티브(−16.62%)는 실적 실망에 하락했다. AMD·스페이스X가 장 마감 후 실적을 발표했다.

## 📰 시장 헤드라인 3선

**1. 다우 첫 54,000 돌파·팔란티어 +29% — 3대 지수 신고가 랠리**
다우가 사상 처음 54,000을 넘어 이틀 연속 신고가를 경신했다. 팔란티어가 실적 서프라이즈로 +29% 폭등하며 AI 소프트웨어·반도체 랠리를 이끌어, S&P·나스닥도 신고가를 썼다.

**2. 반도체 폭발 SOX +6.55% — SK하이닉스 ADR +8%, 증권사 매수 러시**
ARM·마벨·마이크론·AMD가 두 자릿수~한 자릿수 급등하며 SOX가 +6.55% 치솟았다. SK하이닉스 ADR은 6곳 이상 증권사의 매수 개시(캔터 목표가 $300)와 HBF 메모리 표준 발표에 +8.17% 폭등했다.

**3. 유가 −6% 추가 급락·금리 하락 — 이란 협상 기대**
이란 협상 기대에 유가가 −6.15%($75.14) 추가 급락하며 인플레·금리 부담이 완화됐다. 10년물이 4.615%로 하락해 위험자산 랠리를 뒷받침했다.

## 📊 섹션 1 · 업종별 흐름

### 🔺 상승 업종

**1. 반도체 (폭발적 랠리)**
ARM +17.39%, 마벨(MRVL) +12.81%, 아스테라랩스(ALAB) +12.62%, 샌디스크(SNDK) +10.97%, 마이크론(MU) +7.59%, AMD +7.00%, SK하이닉스 ADR +8.17%. AI 메모리·인프라 반도체 전반이 폭등하며 SOX가 +6.55% 치솟았다.
> 🇰🇷 [전달] 8/4 미국장 SOX +6.55%·SKHY +8.17%($154.38, 증권사 6곳 매수 개시+HBF 표준). 코스피200 야간선물은 +4.91%(1,049.10)로 급등. [판정] 미 반도체 폭등·SKHY +8%·증권사 러시 매수·야간선물 +4.91%를 감안하면 8/5(수) 코스피·SK하이닉스(000660)의 강한 반등 출발이 유력하다. 특히 8/4 서울이 미 랠리를 못 따라간 '지연'을 수요일에 만회할 여지가 크다. 다만 SKHY 시간외 −1.77%는 단기 과열 경계 신호이며, 외국인 순매수 전환 여부가 관건. (무효화: 외국인 매도 재개 또는 CXMT 등 중국 메모리 추가 악재 시)

**2. AI 소프트웨어 · 데이터**
팔란티어(PLTR) +29.45%, 가트너(IT) +22.61%, 지브라테크(ZBRA) +26.47%. 실적 서프라이즈에 AI 소프트웨어·데이터 기업이 폭등하며 랠리를 촉발했다.
> 🇰🇷 [전달] AI SW 실적 서프라이즈는 국내 SW·데이터·AI 관련주 심리에 우호적.

**3. 대형 기술주**
엔비디아(NVDA) +2.56%, 애플(AAPL) +1.93%, 테슬라(TSLA) +1.65%. 금리 하락과 위험선호 회복에 메가캡이 지수 신고가를 뒷받침했다.
> 🇰🇷 [전달] 메가캡 강세·금리 하락은 국내 성장주 심리에 우호적.

### 🔻 하락 업종

**1. 소비 · 외식**
치폴레(CMG) −9.72%. 실적·전망 실망에 급락하며 외식·소비주가 소외됐다.
> 🇰🇷 [전달] 미 외식주 실적 실망은 국내 소비주에 제한적 영향.

**2. 자동차 부품 · 유틸리티**
앱티브(APTV) −16.62%, NRG에너지(NRG) −15.48%, 비스트라(VST) −8.15%. 실적 실망과 금리 민감 유틸리티 약세가 겹쳤다.
> 🇰🇷 [전달] 미 부품·유틸리티 급락은 개별 실적 이슈로 국내 영향 제한적.

**3. 에너지 (유가 급락)**
유가 −6.15% 급락으로 에너지 생산주가 약세를 보였다. 다만 유가 하락은 인플레·금리 부담을 덜어 지수 전체엔 우호적이었다.
> 🇰🇷 [전달] 유가 급락은 국내 정유·조선엔 부담, 항공·화학엔 원가 완화 호재.

**시장의 시선:** 강한 실적(팔란티어)과 지정학 완화(이란)·유가 급락·금리 하락이 겹치며 '골디락스' 랠리가 이틀째 이어졌다. 특히 반도체는 SK하이닉스에 대한 증권사 러시 매수와 HBF 표준 발표로 'AI 메모리 슈퍼사이클' 서사가 강화됐다. 관건은 이 낙관론이 실적으로 계속 뒷받침되는지다.

## 🏢 섹션 2 · 이슈 종목 10선

*그날 언론에 가장 많이 언급된 이슈 종목의 구체적 기사 내용 중심.*

**1. 팔란티어 (PLTR) +29.45% ($162.66)**
AI 소프트웨어 기업으로 실적 서프라이즈에 +29% 폭등, 2024년 2월 이후 최고의 하루를 기록했다. 정부·상업 부문 AI 수요가 강력하다는 실적이 확인되며 AI 소프트웨어 전반의 랠리를 촉발했다. 거래량 1억6,791만 주로 시장을 견인했다.

**2. SK하이닉스 ADR (SKHY) +8.17% ($154.38)**
6곳 이상 증권사가 일제히 매수 커버리지를 개시하며 +8.17% 폭등했다. BofA(Buy $250, 'HBM 지배력'), 캔터피츠제럴드(Overweight $300, 100% 상승여력), 로젠블랫($320), 스티펠($240) 등이 목표가를 제시했고, 샌디스크와 HBF(고대역폭 플래시) 메모리 표준을 OCP 통해 발표했다. 시간외 −1.77%($151.64)로 차익실현.

**3. 샌디스크 (SNDK) +10.97% ($1,429.28)**
낸드·스토리지 기업으로 SK하이닉스와의 HBF 메모리 표준 발표에 +11% 급등했다. 'HBM 공급 위기를 해결할 수 있는 기술'이라는 기대가 부각됐다. 4분기 실적 발표를 앞두고 있다.

**4. ARM (ARM) +17.39% ($280.63)**
반도체 설계(IP) 기업으로 +17% 급등했다. AI 반도체 수요 확대와 실적 기대가 겹치며 반도체 랠리의 선두에 섰다.

**5. 마벨 (MRVL) +12.81% ($218.59)**
데이터센터·AI 반도체 기업으로 +12.8% 급등했다. 아스테라랩스(+12.62%)와 함께 AI 인프라 반도체 강세를 주도했다.

**6. 마이크론 (MU) +7.59% ($892.45)**
메모리 대장주로 +7.6% 급등했다. AI 메모리 슈퍼사이클 낙관론이 재점화되며 SK하이닉스와 동반 강세를 보였다. 거래량 3,152만 주.

**7. AMD (AMD) +7.00% ($518.58)**
AI 가속기 기업으로 장 마감 후 실적을 앞두고 +7% 급등했다. 반도체 랠리와 실적 기대가 겹쳤다.

**8. 가트너 (IT) +22.61% ($185.79)**
IT 리서치·컨설팅 기업으로 실적 서프라이즈에 +22.6% 폭등했다. 지브라테크(+26.47%)와 함께 실적주 강세를 대표했다.

**9. 아마존 (AMZN) −2.36% ($277.31)**
전날 실적 발표 후 +4.6% 급등했던 데 따른 차익실현으로 −2.4% 하락했다. 랠리 속에서 되돌림이 나온 몇 안 되는 메가캡이었다.

**10. 치폴레 (CMG) −9.72% ($33.82)**
