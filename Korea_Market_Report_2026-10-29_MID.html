## 🗓 시장 요약

**① 삼성전자 '셀 더 뉴스'에 코스피 6,100 찍고 5,800대로 후퇴** — 코스피는 장 초반 6,100.11까지 올랐다가 삼성전자의 확정 실적·주주환원 발표 이후 하락 전환해 장중 5,817.92까지 밀렸다. 하락 종목이 상승 종목의 7배에 이를 만큼 매도가 광범위했고, 기관이 7,213억원 순매도로 하락을 주도했다. 코스피200 선물은 −2.78%로 현물보다 낙폭이 크다.

**② 반도체는 '하이닉스 강세·삼성 급락'으로 갈렸다** — 삼성전자는 3분기 영업이익 107조원 신기록과 시설투자 84.4조원, 우선주 중심 잔여 자사주 소각 계획을 내놨지만 환원 규모가 시장 기대에 못 미친다는 평가에 22만 9,500원(−5.17%)까지 밀렸다. 반면 SK하이닉스는 151만 6,000원(+1.95%)으로 거래대금 4조 5,445억원 1위를 지켰고, 증권가는 목표가 320만～400만원을 잇달아 유지했다.

**③ 체코 원전 협상 결렬에 원전·건설주 동반 급락** — 한국수력원자력과 대우건설 컨소시엄의 체코 두코바니 원전 시공계약 협상이 공사비·책임 분담 이견으로 결렬되면서 대우건설(−20.11%)·두산에너빌리티(−11.40%)·두산(−9.67%)·한전기술(−9.36%)·현대건설(−8.80%)이 급락했다. LG에너지솔루션은 최대주주 LG화학의 2.5조원 지분 매각 결정에 −9.11%다.

**④ 원화 강세 전환, 미국 선물은 약세** — 원/달러는 1,333.60원으로 9.90원 내려 원화가 강해졌다. 미국 FOMC가 기준금리를 3.75～4.00%로 동결했지만 12월 추가 인상 가능성이 남아 있고, 알파벳 실적 실망 여파로 나스닥100 선물이 −0.69%다. 닛케이225는 +0.28%로 오전장을 마쳤고 항셍은 보합(−0.06%)이다.

## 1. 업종별 흐름

**상승 업종** — 통신장비(+1.85%, 15종목 상승/36 하락)·담배(+1.54%)·디스플레이장비및부품(+1.48%)·은행(+0.66%, 6/4)·손해보험(+0.60%, 8/3)·증권(+0.52%) 등 방어·금융 업종만 소폭 올랐다. 종목별로는 KB금융(+1.04%)·하나금융지주(+1.65%)·메리츠금융지주(+3.89%)와 삼성SDI(+0.94%), 비만약 처방을 시작한 한미약품(+3.65%)이 강했다.

**하락 업종** — 기계(−6.90%, 11/88)·건설(−5.47%, 11/55)·전자제품(−5.33%)·IT서비스(−5.00%, 16/100)·전기제품(−4.99%)·전기장비(−4.97%)·소프트웨어(−4.90%)·조선(−4.51%, 0/28)·우주항공과국방(−4.26%)이 크게 밀렸다. 체코 원전 결렬로 두산에너빌리티·대우건설이, 실적 후 차익 매물로 삼성에스디에스(−9.44%)·LG이노텍(−6.93%)·HD현대중공업(−4.38%)이 약세다.

**시장의 시선** — 오후장은 5,800선 지지와 기관 매도 강도가 관건이다. 삼성전자 컨퍼런스콜 이후 우선주 중심 소각의 규모·일정이 구체화되는지, 체코 원전 재협상 가능성에 대한 정부·한수원 입장이 나오는지가 원전·건설주 반등의 열쇠다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 40종목

**1. 삼성전자 (005930) 229,500원 · 1,341조 7,209억원 · −5.17% — 3Q 영업익 107조 확정에도 주주환원 실망, 5% 급락**
삼성전자는 3분기 영업이익 107조원의 분기 신기록을 확정하고 HBM4 확대와 우선주 중심 잔여 자사주 소각 계획을 내놨지만 환원 규모가 기대에 못 미친다는 평가에 22만 9,500원(−5.17%)까지 밀렸다. 오전 거래대금은 3조 8,059억원으로 시장 2위이며, 올해 시설투자는 84.4조원으로 제시됐다. MX(모바일) 부문은 적자를 줄였지만 4분기에도 원가 부담이 이어질 것이라는 분석이 나왔다. [리포트: KB 2026-10-28](https://woooty69.github.io/hw-pdf-arch-034/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261028_KB_4015528463.pdf) · [리포트: KB 2026-10-26](https://woooty69.github.io/hw-pdf-arch-033/%EB%AF%B8%EB%9E%98%20%EC%9D%B4%EC%9D%B5%20%EC%84%B1%EC%9E%A5%EC%97%90%20%EC%A3%BC%EB%AA%A9%ED%95%A0%20%EC%8B%9C%EC%A0%90%EF%BC%BB005930%EF%BC%BD_20261026_KB_4013818567.pdf) · [리포트: KB 2026-10-22](https://woooty69.github.io/hw-pdf-arch-033/%EC%9A%B0%EB%A0%A4%EC%9D%98%20%EC%A0%95%EC%A0%90%20%ED%86%B5%EA%B3%BC%2C%20W%EC%9E%90%20%EB%B0%98%EB%93%B1%EC%97%90%20%EC%A3%BC%EB%AA%A9%EF%BC%BB005930%EF%BC%BD_20261022_KB_4015227430.pdf)

**2. SK하이닉스 (000660) 1,516,000원 · 1,107조 4,264억원 · +1.95% — 사상 최대 실적 후 증권가 목표가 320만～400만원 유지**

**3. 삼성전기 (009150) 1,250,000원 · 93조 3,671억원 · −4.29% — 3Q 영업익 6,910억 서프라이즈에도 차익 매물**

## 4. 일정·관전 포인트

**오늘 오후 국내** — 3분기 실적 시즌 지속(삼성전자 컨퍼런스콜 후속 보도, 삼성SDI·SK이노베이션·삼성에스디에스 실적 이후 증권가 추정치 조정), 체코 원전 시공 재협상 여부에 대한 한수원·정부 입장, 금융위원장 주재 은행권 해킹 대응 간담회, LG화학의 LG에너지솔루션 지분 처분 관련 후속 공시, 15:30 정규장 마감.

**오늘 밤 해외** — 미국 경제지표 발표와 빅테크 실적 시즌 지속(알파벳은 실적 미스로 시간외 약 10% 하락, 마이크로소프트는 무난), FOMC 동결(3.75～4.00%) 이후 연준 인사 발언과 12월 추가 인상 가능성, 다음 달 3일 미국 중간선거 여론 동향, 앤트로픽 IPO 후속 보도.

### 🇰🇷 오후장 관전 포인트

1. **5,800선 지지 여부** — 오전 저점 5,817.92에서 반등을 시도 중이다. 기관 순매도(−7,213억원)가 오후에도 이어지면 5,800선이 시험대에 오르고, 외국인(+3,481억원) 매수가 늘어나면 낙폭을 줄일 수 있다.
2. **삼성전자 환원 실망의 확산 범위** — 삼성전자(−5.17%)·삼성전기(−4.29%)의 낙폭이 삼성그룹주 전반으로 번질지, 우선주 중심 소각 규모가 구체화되며 진정될지 확인할 필요가 있다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
