## 🗓 시장 요약

**① 엔비디아 악재에도 갭 상승 → 오전 내내 상승폭 반납**
젠슨 황 엔비디아 CEO 퇴진 보도로 밤사이 글로벌 AI 투자 불확실성이 커졌지만 코스피는 "리스크 선반영" 인식 속에 +2.05%로 출발해 장중 5,504.44까지 올랐다. 그러나 오전 내내 매물이 이어지며 11:56 현재 +0.85%로 상승폭이 크게 줄었다. 외국인은 장 초반 순매수에서 −566억원 순매도로 돌아섰고, 개인도 −3,382억원을 팔아 기관(+1,279억원)만 버티는 모습이다.

**② 반도체 대형주는 강보합, 기판·후공정·칩 설계 중소형주로 매기 이동**
삼성전자는 210,250원(+1.08%), SK하이닉스는 1,256,000원(+0.16%)으로 오름폭이 작고 SK스퀘어는 −2.65%로 약세다. 과기정통부가 젠슨 황 퇴진에 따른 긴급 점검회의를 열고 한국향 GPU 26만장 공급 차질 여부를 점검한다는 소식도 나왔다. 반면 이수페타시스(+7.49%) 등 AI 기판주, 인텍플러스(+14.35%)·프로텍(+14.26%) 등 후공정 장비주, 가온칩스(+28.57%)·오픈엣지테크놀로지(+29.87%) 등 디자인하우스·IP주가 급등했다.

**③ 금융·건설·자동차 강세, 전기유틸리티·식품·방산 약세**
은행(+3.38%)·증권(+3.32%)이 강해 KB금융 +4.28%, 신한지주 +4.71%, 메리츠금융지주 +5.51%를 기록 중이다. 건설은 금호건설이 3분기 영업이익 44% 증가와 수주 목표 조기 달성으로 상한가에 오르며 +3.06%, 자동차부품도 +2.71%다. 한국전력은 3분기 영업이익 1조 6,442억원(−71% YoY)으로 컨센서스를 30% 넘게 밑돌아 −10.11% 급락했다.

**④ 원화 강세·일본 강세, 중화권은 약세**
원/달러는 1,332.40원(−4.10원)으로 내렸다. 닛케이225는 61,816.72(+1.64%)로 오전장을 마쳤고, 미국 지수 선물도 S&P500 +0.18%·나스닥100 +0.27%로 소폭 오름세다. 항셍은 −0.59%로 약하며, 상해종합은 LS 시세 미갱신으로 확인되지 않았다.

## 1. 업종별 흐름

**상승 업종** — 건강관리기술 +5.30%(루닛 +12.39% 실적 발표), 창업투자 +4.58%(DSC인베스트먼트 상한가, 43종목 상승), 해운사 +3.73%(HMM +4.59%), 무선통신서비스 +3.65%(SK텔레콤 +3.93%), 은행 +3.38%(11종목 전부 상승), 증권 +3.32%(36종목 상승·3종목 하락), 건설 +3.06%(금호건설 상한가, 삼성E&A +4.39%, GS건설 +4.47%), 자동차부품 +2.71%(현대모비스 +3.69%).

**하락 업종** — 전기유틸리티 −7.93%(한국전력 −10.11%, 3분기 어닝 쇼크·목표가 줄하향), 게임엔터테인먼트 −1.78%(펄어비스 목표가 하향), 생명과학도구및서비스 −1.36%(삼성바이오로직스 −2.21%), 식품 −1.20%(삼양식품 −4.11%), 우주항공과국방 −0.87%(한화에어로스페이스 −0.61%, LIG디펜스앤에어로스페이스 −1.23%).

**시장의 시선** — 오전 고점(5,504) 대비 110포인트 넘게 밀린 코스피가 오후에 5,380선(장중 저점 5,382) 지지 여부를 지켜봐야 한다. 외국인이 순매도로 돌아선 만큼 오후 외국인 현·선물 수급 방향과 삼성전자·SK하이닉스의 상승 유지 여부가 핵심이다. 코스닥은 반도체 장비·칩 설계·로봇주의 급등폭(+10～30%)이 커 오후 차익 실현에 따른 변동성에 유의할 구간이다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 50종목

*① 오늘 새로 편입된 급등 대형주(시총 1,000억원 이상 · +10% 이상) 27종목(1～27번, 시총 큰 순) → ② 오전장 언론 최다 보도 23선(28～50번).*

**1. 레인보우로보틱스 (277810) 386,000원 · 7조 4,883억원 · +11.72% — 피지컬 AI·코스닥 개혁 기대 속 로봇 대장주 급반등**
오전 거래대금 424억원으로 코스닥 로봇주 상승을 이끌며 시가총액 7조원대를 회복했다. 젠슨 황 퇴진 보도에도 코스닥이 장중 4%대 급등하는 과정에서 '피지컬 AI'와 코스닥 시장 개혁 기대가 겹치며 로봇주로 매수세가 몰렸고, 로보티즈(+3.54%)도 동반 상승했다. 최신 커버 리포트(핀릿, 6월)는 삼성전자 지배기업 편입 이후 1분기 삼성전자향 매출이 24억원에 그쳤지만 휴머노이드·AMR 실증이 양산 주문으로 이어지면 밸류에이션 근거가 '기대'에서 '숫자'로 바뀔 것이라고 봤다. 협동로봇 RB5 연 2,500대 생산능력도 강점으로 꼽혔다. [리포트: Finlit 2026-06-15](https://woooty69.github.io/hw-pdf-arch-008/%EB%A0%88%EC%9D%B8%EB%B3%B4%EC%9A%B0%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB277810%EF%BC%BD_20260615_Finlit_1105604.pdf)

**2. 루닛 (328130) 15,420원 · 1조 1,481억원 · +12.39% — 3분기 영업적자 축소에 장 초반 11%대 강세**
전날 발표한 3분기 실적에서 영업적자를 줄인 점이 부각되며 오전 거래대금 462억원으로 의료 AI주 강세를 이끌었고, 건강관리기술 업종도 +5.30%로 업종 1위다. 다만 금융손익 악화로 순손실은 확대됐다는 점은 부담이다. 최근 카타르·UAE에 이어 사우디 보건의료국에 AI 영상분석 솔루션을 공급하며 중동 매출처를 넓혔다. 최신 커버 리포트(키움, 5월)는 1분기 매출 240억원(+24.7% YoY)으로 해외 성장세가 커지고 미국 구독형 SaaS 물량이 늘고 있다고 평가했다. [리포트: Kiwoom 2026-05-14](https://woooty69.github.io/hw-pdf-arch-005/%EB%A3%A8%EB%8B%9B%EF%BC%BB328130%EF%BC%BD_20260514_Kiwoom_1097387.pdf) · [리포트: Kiwoom 2026-02-09](https://woooty69.github.io/hw-pdf-arch-003/%EB%A3%A8%EB%8B%9B%EF%BC%BB328130%EF%BC%BD_20260209_Kiwoom_1071159.pdf)

**3. 하나머티리얼즈 (166090) 48,450원 · 9,582억원 · +11.00% — 반도체 소부장 동반 급등, 실리콘 파츠 실적 기대**

      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
