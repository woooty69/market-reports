## 🗓 시장 요약

**① 나스닥 26,184.72(−1.38%)·S&P500 7,720.39(−0.30%)·다우 52,342.56(−0.25%) — 알파벳 −12.64% 충격에 기술주 약세, 러셀2000은 +1.01%**
나스닥은 **26,184.72(−365.13, −1.38%)**, S&P500은 **7,720.39(−23.59, −0.30%)**, 다우는 **52,342.56(−132.54, −0.25%)**로 마감해 사흘 연속 오름세를 끝냈다. 나스닥100은 29,402.51(−1.38%)로 대형 기술주 약세가 두드러진 반면 러셀2000은 2,859.22(+1.01%)로 올랐고, VIX는 17.18(+1.60%)로 소폭 올랐다. 알파벳이 분기 설비투자 \$514억과 두 분기 연속 마이너스 잉여현금흐름에 상장 이후 최악 수준의 하루 낙폭을 기록하며 'AI 투자 회수' 우려를 다시 키웠다. 서비스나우·포티넷 같은 소프트웨어주도 가이던스 실망으로 20% 넘게 급락한 반면, 투자자들은 헬스케어·금융·부동산으로 옮겨 가며 지수 낙폭을 줄였다.

3분기 GDP 속보치는 연율 **3.4%**로 예상(약 3.1%)을 웃돌았고, 2분기 2.2%보다 성장 속도가 빨라졌다. 개인소비가 3.8%, AI 설비 구축에 힘입은 기업투자가 12.7% 늘어난 반면 수출은 줄었다. 9월 개인소비지출(PCE) 물가는 전년 대비 **3.6%**, 근원 PCE는 **3.1%**로 각각 예상에 부합했지만 전월(3.4%·3.0%)보다 높아져 연말 금리 인상 전망을 그대로 유지시켰다. 그럼에도 기술주 매도에 따른 안전자산 수요로 미 재무부 기준 2년물은 **4.61%(−6.0bp)**, 10년물은 **4.98%(−7.0bp)**, 30년물은 **5.32%(−5.0bp)**로 내렸고, 10년물은 하루 만에 다시 5%선 아래로 내려왔다.

**⑤ 실적·이슈 — ADT +33.20%·크록스 +25.54%·카바나 +15.66%·일라이릴리 +6.57%, 서비스나우 −26.95%·스프라우츠 −22.58%·포티넷 −20.09%·캐터필러 −9.25%**
인수 제안과 실적 가이던스가 종목별 명암을 갈랐다. 오픈AI가 지원하는 스라이브 홀딩스가 주당 \$10.00 현금 인수에 합의한 ADT(ADT)는 **\$9.87(+33.20%)**, 휴듀드 매출이 6분기 만에 늘어난 크록스(CROX)는 **\$150.26(+25.54%)**, 3분기 소매 판매 대수가 39% 늘어난 카바나(CVNA)는 **\$68.30(+15.66%)**로 올랐다. 3분기 매출이 39% 늘고 연간 매출 전망을 \$910억~\$920억으로 올린 일라이릴리(LLY)는 **\$1,373.00(+6.57%)**로 헬스케어 업종 강세를 이끌었다. 반대로 연간 매출 전망이 시장 예상에 못 미친 서비스나우(NOW)는 **\$109.67(−26.95%)**, 4분기 동일점포 매출 2~4% 감소를 예고한 스프라우츠파머스마켓(SFM)은 **\$48.00(−22.58%)**, 서비스 매출 전망을 처음 낮춘 포티넷(FTNT)은 **\$139.10(−20.09%)**로 급락했다. 캐터필러(CAT)도 시장 예상을 웃돈 실적에도 연간 성장 전망을 유지하는 데 그쳐 **\$647.39(−9.25%)**로 내렸다. 장 마감 뒤 아마존(AMZN)은 AWS 성장률이 빨라졌지만 매출·이익이 예상에 못 미쳤다는 평가 속에 정규장 \$243.79(−4.25%)에서 시간외 추가 하락했다.

**⑥ 🇰🇷 SOX −1.42%·SK하이닉스 ADR \$162.09(−1.58%)·코스피200 야간선물 915.10(−2.13%) — 빅테크 투자 부담과 인텔 시간외 급락은 반도체 심리에 부담**

알파벳 급락과 인텔의 시간외 20%대 하락이 겹치며 AI 투자 사이클의 '비용' 쪽이 다시 부각돼, 전날 SK하이닉스 실적 효과로 크게 오른 국내 반도체주에는 차익실현 압력이 될 수 있다. 다만 10년물 금리가 5% 아래로 내려온 점은 성장주 밸류에이션에 숨통을 틔워 준다.

알파벳은 시가 \$286.77로 급락 출발해 저가 \$280.36(−13.71%)까지 밀린 뒤 \$283.82(−\$41.07, −12.64%)로 마감했다. 3분기 구글 클라우드 매출은 \$307억으로 103% 늘었지만, 검색 매출 증가율은 직전 분기 17%에서 12%로 둔화됐고 주당순이익은 \$2.12로 예상치 \$3.03에 크게 못 미쳤다. 분기 설비투자 \$514억에 잉여현금흐름이 자체 기준 −\$91억으로 두 분기 연속 마이너스를 기록하면서 AI 투자 비용이 회수되지 않는다는 우려가 한꺼번에 터졌다. 하루 만에 시가총액 약 \$5,000억이 사라졌고, 대형 기술주 전반의 투자 심리를 끌어내렸다.

일라이릴리는 장중 \$1,408.38(+9.32%)까지 오른 뒤 \$1,373.00(+\$84.70, +6.57%)로 마감했다. 3분기 매출은 \$244억으로 1년 전보다 39% 늘었고, 비만·당뇨 치료제 마운자로 매출이 \$107.2억(+65%), 젭바운드 매출이 \$53.5억(+49%)으로 성장을 이끌었다. 회사는 2026년 매출 전망을 기존 \$850억~\$870억에서 \$910억~\$920억으로 올렸다. 데이비드 릭스 CEO는 "기존 기대를 넘어선 분기였다"고 말했고, 릴리의 강세에 헬스케어 업종 지수는 사상 최고치로 올라섰다.

**4. 포티넷 (FTNT) −20.09% — 2026년 서비스 매출 전망 처음 하향, BofA 투자의견 '중립'으로 강등**

스프라우츠파머스마켓은 시가 \$47.66으로 급락 출발해 저가 \$47.35(−23.63%)까지 밀린 뒤 \$48.00(−\$14.00, −22.58%)로 마감했다. 3분기 동일점포 매출은 0.9% 줄었고, 회사는 4분기 동일점포 매출이 2~4% 감소하고 주당순이익은 \$0.47~\$0.51에 그칠 것이라고 전망해 시장 예상(\$1.21)의 절반에도 못 미쳤다. CEO는 "어려운 소비 환경과 사이클로스포라 감염 사태"를 원인으로 꼽았고, JP모건의 토머스 파머는 비중확대 의견을 유지하면서도 "순탄한 길은 기대하지 않는다"고 말했다. 니컬러스 코낫 최고운영책임자가 내년 1월 초 잭 싱클레어 CEO의 뒤를 잇는다.
