# 미국→한국 선점 2026-10-28 (미국 2026-10-28 마감 반영)

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 12개:** 조선·LNG선·함정 MRO(격차 +16.3%p), 방산(격차 +14.8%p), 정유·LNG·가스(격차 +14.7%p), Oil & Gas Production(격차 +13.9%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 반도체 소재·부품, 바이오텍·기술수출, 의류 OEM·패션, CDMO·바이오시밀러 — 눌림 시 매수 관점.

- **오늘 우선순위 종목:** 한국가스공사(정유·LNG·가스, 점수 100), S-Oil(정유·LNG·가스, 점수 97), 한국콜마(화장품·K뷰티, 점수 83)
