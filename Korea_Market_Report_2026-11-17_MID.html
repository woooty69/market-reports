## 🗓 시장 요약

**① 장중 5,000선 붕괴 후 반등 — 외국인 8천억원대 매도, 기관이 방어**
코스피는 전날 5,100.50에서 −1.8% 낮은 5,008.09로 출발해 개장 직후 4,984.83까지 내려갔다. 이후 기관 매수(+4,139억원)가 들어오며 5,084.06까지 회복했으나 외국인 순매도가 −8,140억원으로 커지며 −0.9% 안팎에서 공방 중이다. 코스피200 선물(−1.74%)이 현물(−1.00%)보다 약해 선물 쪽 매도 압력도 남아 있다.

**② 반도체 대형주 엇갈림 — 하이닉스·SK스퀘어 반등, 삼성전자 사흘째 약세**
SK하이닉스는 1,135,000원(+1.34%)으로 거래대금 1위(1조 9,038억원)를 기록하며 반등했고, 앤스로픽 IPO 지분가치 기대 기사도 나왔다. 반면 삼성전자는 192,600원(−2.13%)으로 사흘째 밀렸고 일부 증권사가 메모리 가격 하락·공급 경쟁을 이유로 '삼전닉스' 목표가를 낮췄다. AI 기판주 이수페타시스(+4.66%)·코리아써키트(+3.49%)·심텍(+1.67%)은 반등했다.

**③ 제약·바이오·소비재 강세, 전력기기·보험·방산 약세**
한미약품(+2.91%)·알테오젠(+2.62%)·파마리서치(+5.80%)·루닛(+9.73%) 등 바이오와 백화점·의류가 강하다. 반면 HD현대일렉트릭(−4.86%)·효성중공업(−4.70%)·LS ELECTRIC(−3.46%)·산일전기(−7.37%) 등 전력기기, 한국전력(−4.85%), 삼성생명(−3.75%)·삼성화재(−3.14%) 등 보험, 한화에어로스페이스(−4.01%) 등 방산이 밀렸다.

**④ 원/달러 1,339원대 — 미국 선물 보합, 닛케이·항셍 1%대 하락**
원/달러는 1,339.60원(+3.10원)으로 달러 강세 속 소폭 올랐다. S&P500 선물은 보합(0.00%), 나스닥100 선물은 +0.33%로 전날 급락 뒤 숨 고르기 중이다. 닛케이225(−1.18%)·항셍(−1.17%)은 AI 하드웨어주 매도로 약하고, 엔비디아 실적 발표와 앤트로픽 상장을 앞둔 경계감이 이어진다.

## 1. 업종별 흐름

**상승 업종** — 건강관리기술(+3.38%)·백화점과일반상점(+2.31%)·생물공학(+1.37%)·제약(+1.16%)·섬유의류(+1.14%)·항공사(+0.98%)가 올랐다. 한미약품(+2.91%)은 항암신약 2종 1상 항종양 활성 발표가, 루닛(+9.73%)은 북미영상의학회(RSNA) 연구 17편 발표 기대가 재료다. 대한항공(+1.42%)은 국제유가 하락에 따른 연료비 부담 완화 기대가 작용했다.

**하락 업종** — 전기유틸리티(−4.20%)·손해보험(−3.57%)·생명보험(−3.49%)·가구(−3.34%)·전기장비(−3.22%)·핸드셋(−2.96%)·디스플레이장비(−2.94%)·우주항공과국방(−2.69%)이 약하다. 미국 AI 데이터센터 투자 둔화 우려가 전력기기로 번졌고, 손보사는 미래 이익(CSM) 감소 경고가 부담이다.

**시장의 시선** — 오후에는 외국인 매도가 1조원을 넘기는지와 5,000선 지지 여부가 관건이다. 반도체는 하이닉스 반등이 삼성전자로 번지는지, 전력기기는 낙폭 확대 여부를 본다. 팹리스·의료AI·남북경협 등 테마주 순환이 빠르므로 장 후반 되돌림에 유의한다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 32종목

*① 오늘 새로 편입된 급등 종목 8종목(1～8번, ★ 시총 1,000억원 이상 · +10% 이상) → ② 오전장 언론 최다 보도 24선(9～32번).*

**1. ★ 옵토닉스 (493260) 30,550원 · 2,922억원 · +154.58% — 코스닥 상장 첫날 공모가 대비 2.5배**
방산용 광학 부품 업체 옵토닉스가 오늘 코스닥에 상장해 공모가 대비 +154.58% 오른 30,550원에 거래되고 있다. 거래대금은 3,949억원으로 SK하이닉스·삼성전자에 이어 시장 3위이며 시가총액은 2,922억원이다. 증권신고서 기준 매출의 약 89%가 한화에어로스페이스 한 곳에서 나와 고객 집중도가 높고, 공모 자금은 증설에 쓴다. 상장 첫날 유통 물량이 적어 변동성이 매우 큰 구간이다. 증권사 커버 리포트 없음

**2. ★ 계양전기 (012200) 2,935원 · 1,040억원 · +29.87% — 현대차 부품 공급업체 선정에 상한가**
계양전기가 현대차 부품 공급업체로 선정됐다는 소식에 상한가(2,935원)까지 올랐다. 시가총액은 1,040억원, 거래대금 110억원으로 우선주 계양전기우(+29.79%)도 동반 상한가다. 전동공구·자동차 전장용 모터가 주력인 회사로, 공급 규모와 매출 반영 시점은 아직 구체적으로 확인되지 않아 추가 공시를 볼 필요가 있다. 증권사 커버 리포트 없음

**3. ★ 나노팀 (417010) 6,570원 · 1,325억원 · +29.84% — 2차전지 소재주 동반 강세 속 상한가**
전기차 배터리용 방열·차폐 소재 업체 나노팀이 상한가 6,570원(시총 1,325억원)을 기록했다. 오전 시황 기사에서 2차전지·의료AI주가 약세장 속 강세 업종으로 꼽혔으나 회사 개별 공시나 뉴스는 확인되지 않는다. 거래대금이 26.6억원으로 작아 수급에 따라 등락이 커질 수 있다. 증권사 커버 리포트 없음

**4. ★ 세미파이브 (490470) 13,950원 · 4,747억원 · +22.48% — HBM 없이 AI 칩 만드는 3D-IC 기술 공개**
세미파이브가 HBM 없이도 AI 반도체를 구현하는 차세대 3D-IC 기술을 공개하며 13,950원(시총 4,747억원)까지 올랐고 거래대금은 502억원이다. 지난주 발표한 3분기 신규 수주는 1,784억원으로 분기 최대, 전년 대비 +437%였다. 키움증권(11/9)은 매수·목표가 20,000원으로 확대된 수주잔고의 매출 전환과 2027년 흑자전환을 전망했다. [리포트: Kiwoom 2026-11-09](https://woooty69.github.io/hw-pdf-arch-038/%EC%84%B8%EB%AF%B8%ED%8C%8C%EC%9D%B4%EB%B8%8C%EF%BC%BB490470%EF%BC%BD_20261109_Kiwoom_197851.pdf) · [리포트: Shinhan 2026-08-27](https://woooty69.github.io/hw-pdf-arch-016/%EC%84%B8%EB%AF%B8%ED%8C%8C%EC%9D%B4%EB%B8%8C%EF%BC%BB490470%EF%BC%BD_20260827_Shinhan_1126812.pdf)

**5. ★ 가온칩스 (399720) 39,550원 · 4,690억원 · +14.14% — 8,000억원 'K-AI 반도체' 정책 기대 이틀째**
