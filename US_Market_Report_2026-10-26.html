## 🗓 주말 요약

**① 주말 사이 공습은 없었다 — 트럼프는 "마무리할지, 합의할지 결정해야 한다"**
일요일판 이후 가장 큰 변수였던 '주말 공격'은 현지 25일(일)까지 실행되지 않았다. 트럼프 대통령은 24일(토) 플로리다에서 사전투표를 마친 뒤 기자들에게 "생각하고 있다, 어쩌면 내일"이라고 말하면서도 "그들은 합의를 원한다, 문제는 그 합의를 지키느냐"라고 했다. 25일에는 폭스뉴스에 "끝내 버릴지(매우 쉬운 일이다), 아니면 합의할지 결정해야 한다"고 말한 뒤 백악관 기자들에게 "오늘 공격은 없다"고 밝혔다. 더힐은 중부사령부(CENTCOM)가 백악관 승인만 있으면 실행할 공습 계획을 마련해 두었고 초점은 11월 3일 중간선거 이후라고 보도했다. 결국 **주말 리스크는 해소가 아니라 '선거 뒤로 이월'**됐다.

**② 호르무즈 긴장은 오히려 커졌다 — 이란 "10월 선박 공격 120건 이상", 미국은 세 번째 항모 투입**
이란 측은 이번 주에만 유조선 7척이 화재·피해를 입었고 10월 호르무즈 선박 공격이 120건을 넘어 개전 이후 최악이라고 주장했다. 이란군은 25일 반다르아바스 상공에서 미국산 루카스(LUCAS) 드론을 격추했다고 밝혔고, 이슬람혁명수비대(IRGC) 호세인 모헤비 대변인은 '공세 교리'로의 전환을 언급했다. 로이터는 이란이 걸프 해저 통신케이블 공격을 계획하고 있다고 전했다. 미국은 세 번째 항모 시어도어 루스벨트와 병력 약 1만 명을 11월 말까지 배치하고, 브래드 쿠퍼 중부사령관이 25일 호르무즈를 찾아 걸프 동맹국의 원유 수출 15억 배럴 이상을 지원했다고 밝혔다. 마수드 페제시키안 이란 대통령은 "협상 중이었는데 미국이 모든 것을 망쳤다"면서도 협상 지속 의사는 유지했다.

**③ 이번 주는 FOMC·빅테크·삼전닉스 실적이 사흘 안에 몰린 '슈퍼위크'**
CME 페드워치 기준 28일(현지) FOMC 동결 확률은 약 **90%**로, 기준금리 **3.75~4.00%**가 유지될 가능성이 높다. 이번 회의는 점도표가 없는 회의라 시장은 12월 인상 여지에 대한 케빈 워시 의장의 표현을 볼 것이다. 야데니리서치는 "위원회는 수요일에 인상해야 하지만 중간선거가 너무 가까워 하지 않을 것"이라고 했다. 같은 날 밤 마이크로소프트·알파벳, 29일 아마존·인텔·샌디스크가 실적을 내며, 국내에서는 **SK하이닉스 3분기 실적이 28일(수), 삼성전자 확정실적이 29일(목)**이다.

**④ 국내는 '5,550선 W자 바닥론'과 '외국인 이탈'이 맞서 있다**
코스피는 10/23 **5,550.30**으로 주간 **−117.75포인트(−2.08%)**였고, 19일 +1.76% → 20일 −3.73% → 21일 +3.29% → 22일 −3.52% → 23일 +0.30%로 하루 3%대 등락이 반복됐다. 23일 개인은 1조 1,021억원, 외국인은 7,199억원을 순매도하고 기관이 4,190억원을 순매수했으며, 외국인은 SK하이닉스를 8,637억원 팔고 삼성전자를 7,838억원 샀다. 고객예탁금은 21일 89조 6,344억원으로 한 주 새 10조원 넘게 줄었다. 삼성전자에 이어 SK하이닉스도 40조원 자사주 매입 목표를 채우고 21일 종료해, 하단을 받치던 매수 주체 하나가 빠졌다.

## 🎯 이번 주 관전 포인트

**1. 이란 — '선거 전 공격 없음'이 지켜지는지, 유가가 그 사이 얼마나 쌓이는지**
주말 사이 공습은 없었지만 트럼프 대통령은 "공격 여부를 미리 말해 줄 것 같으냐"며 시점을 열어 뒀고, 중부사령부의 작전 계획과 세 번째 항모 배치는 선거 이후를 겨냥하고 있다. 브렌트 12월물은 금요일 \$116.72로 4월 이후 최고권, WTI 12월물은 \$103.27로 \$100선 위에 있다. 이란이 주장한 10월 선박 공격 120건 이상과 해저 케이블 위협은 공습이 없어도 위험 프리미엄을 줄이기 어렵게 만든다. 27일 이스라엘 총선에서 네타냐후 총리의 입지가 약해지면 강경론의 동력이 바뀔 수 있다. 월요일 아시아 장 원유 선물이 주말 '공습 없음'을 되돌림으로 받는지가 첫 신호다.

**2. FOMC — 동결은 기본값, 시장이 보는 것은 12월**
9월 25bp 인상으로 기준금리는 3.75~4.00%이고, 이번 회의 동결 확률은 약 90%다. 야데니리서치 집계로 12월 인상 확률은 84%, 금리선물은 향후 12개월 약 2.7회 인상을 반영하고 있다. 8월 근원 PCE는 3.0%였고 클리블랜드 연은 모델은 9월 근원 PCE를 3.1%로 본다. 10년물 5.00%·30년물 5.33%에서 워시 의장이 12월 인상을 사실상 예고하면 10년물이 다시 5.1%대를 시험하고, 여지를 좁히면 기술주에 숨통이 트인다. 회견 다음 날 밤 GDP·PCE가 연달아 나와 금리 변동성이 한 주 내내 이어질 수 있다.

**3. 빅테크 설비투자 — '지출 부족'이라는 새 걱정에 답할 차례**
지난주 메타의 3분기 설비투자 \$349.1억이 영업현금을 넘고, 테슬라가 설비투자 전망을 \$50억 낮추자 반도체는 목요일 하루 SOX −6.72%로 무너졌다. 마이크로소프트는 7월에 이번 분기 매출 \$898.5억~909.5억과 애저 성장률 약 45%(고정환율)를 제시했고, 아마존은 3분기 순매출 \$1,970억~2,020억, 영업이익 \$225억~265억을 가이던스로 냈다. 세 회사가 설비투자를 유지·상향하면 메모리·장비·전력 체인이 반등의 근거를 얻고, 하향하면 지난주 목요일이 반복될 위험이 있다. 이번 주 S&P500 기업의 36%가 실적을 내며 3분기 영업 EPS 증가율 컨센서스는 24.1%다.

**4. 메모리 — SK하이닉스·샌디스크·삼성전자가 연달아 숫자를 낸다**
SKHY는 금요일 \$137.02(+4.05%)로 목요일 −8.07%의 절반가량을 되찾았지만 9월 고점 \$198.63 대비 약 31% 낮다. 마이크론은 \$877.55(+2.46%)로 반등했다. SK하이닉스는 낸드 자회사 솔리다임의 나스닥 상장 검토 중단을 밝혀 중복상장 희석 우려를 덜었고, NH투자증권은 SK하이닉스의 추가 주주환원 재원을 30조원 이상으로 추정했다. 28일 SK하이닉스 실적에서 HBM 가격·물량 가이던스와 새 주주환원책이 나오면 자사주 매입 종료로 생긴 수급 공백을 메울 수 있다.

### 🇰🇷 한국 관전 포인트

코스피200 야간선물은 조회 스크립트가 새 세션 값을 주지 않아(최종 10/24 06:00) 표에서 뺐다. 직전 10/23(금) 야간 세션은 10/24 리포트에 06:00 확정치 861.70(−0.19%, 정규장 종가 863.30 대비)으로 기재돼 있어, 금요일 미국 반도체 반등(SOX +0.44%, SKHY +4.05%)은 현물에 아직 반영되지 않았다. 반면 다우 −1.23%와 항공·소비자 신용주 약세, 브렌트 4월 이후 최고는 경기민감주에 부담이다.

월요일 국내 장은 '주말 공습 없음'이라는 안도와 '선거 뒤로 미뤄진 위험'을 동시에 소화한다. 정유·방산·조선은 유가 \$100대 유지의 수혜, 항공·화학·운송은 원가 부담 쪽이다. 반도체는 28일 SK하이닉스, 29일 삼성전자 실적과 같은 날 새벽 마이크로소프트·알파벳 설비투자 가이던스가 연달아 나오므로, 실적 전 관망과 외국인 매도 지속 여부가 주 초반 방향을 정한다. 27일 한국 3분기 GDP 속보치도 내수·건설 업종의 재료다.

## 💬 증권가 코멘트

- **KB증권 김동원 리서치본부장 — "W자 바닥 확인."** 코스피가 7월 29일(5,262)과 10월 15일(5,450) 두 차례 저점을 만들며 W자 바닥을 확인한 것으로 판단했다. 미국 10년물 금리는 5%대 중반에서 단기 고점을 형성할 가능성이 있다고 봤다.
- **NH투자증권 나정환 연구원 — 추가 주주환원 재원 30조원 이상.** SK하이닉스의 추가 주주환원 여력을 30조원 이상으로 추정하고, 자사주 매입이 확정되면 외국인 매도 물량 일부를 흡수할 것으로 전망했다. 다만 중간선거 이후 이란 군사작전 확대 여부를 유가와 지정학의 핵심 변수로 꼽았다.
- **대신증권 이경민 연구원 — "밸류에이션 정상화 여지가 충분하다."** 코스피 12개월 선행 PER이 4.23배, 12개월 선행 EPS가 1,308.2포인트로 이익 대비 지수가 크게 낮다고 평가했다.
- **야데니리서치 — "위원회는 수요일에 인상해야 하지만 중간선거가 너무 가까워 하지 않을 것이다."** 12월 인상 확률 84%, 금리선물 기준 향후 12개월 약 2.7회 인상 반영. 애틀랜타 연은 GDPNow는 3분기 성장률 3.5%, 기업 설비투자 +17.8%를 가리킨다.

## 📰 주말 체크한 기타 뉴스

- **미국, 세 번째 항모전단 중동 투입.** 시어도어 루스벨트 항모와 병력 약 1만 명, 제13해병원정대가 11월 말까지 배치된다. 사우디 주재 미국 대사관은 정부 직원의 공항 이용에 별도 허가를 받도록 했다.
- **네타냐후 총리, 27일 총선 앞두고 "이란 정권 교체가 1차 목표".** 지지율이 하락하는 가운데 미국에 공습 재개를 압박하고 있다는 분석이 나왔다. 선거 결과는 이스라엘의 대이란 강경 노선 지속 여부를 가늠하는 잣대다.
- **트럼프 "호르무즈 원유 선적이 전쟁 전보다 많다".** 구체적 수치는 제시하지 않았고, 이란은 반대로 10월 선박 공격이 개전 이후 최다라고 주장해 양측 설명이 엇갈린다.
- **캐나다·뉴질랜드 중앙은행 28일 동시 인상 전망.** 각각 25bp 인상 확률이 85%·88%로, 미국 외 주요국도 물가 대응 긴축을 이어 가고 있다. ECB는 2.50% 동결, 일본은행은 1.25% 동결이 예상되나 둘 다 12월 인상 확률이 75% 안팎이다.
- **국내 고객예탁금 89조 6,344억원 — 한 주 새 10조원 넘게 감소.** 21일에는 코스피 매수 사이드카가 발동될 만큼 하루 등락이 컸고, 개인 자금이 증시를 빠져나가는 흐름이 확인됐다.
