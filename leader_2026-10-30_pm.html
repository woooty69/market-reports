# 미국→한국 선점 2026-10-30 (미국 2026-10-29 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 76개 · 연결 종목 889개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 5개:** 방산(격차 +20.5%p), 조선·LNG선·함정 MRO(격차 +19.1%p), 정유·LNG·가스(격차 +10.3%p), 석유화학(격차 +9.2%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 반도체 소재·부품, 철강·강관, 탱커·가스선, 유전체·유전자치료 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 클라우드·데이터센터 운영(-11.7%p), CDMO·바이오시밀러(-7.5%p)
- **이제 막 힘 붙는 조기 테마:** Electrical Products(조기 73), 반도체 기판·유리기판·MLB(조기 73), 전공정 장비(조기 72) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** S-Oil(정유·LNG·가스, 점수 100), 티씨케이(반도체 소재·부품, 점수 89), DB하이텍(전력반도체, 점수 89)
