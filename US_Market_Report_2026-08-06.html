## 🗓 시장 요약

**지수가 갈라섰다.** 다우는 +0.49%(54,349.00) 올라 **사흘 연속 사상 최고**를 경신했지만, **S&P 500(−0.17%)과 나스닥(−0.83%)은 4일 연속 랠리를 마감**했다. 갈림의 원인은 명확했다 — 장 마감 후 실적을 낸 **AMD(−7.04%)와 스페이스X(−13.61%)가 'AI 지출 청구서'를 다시 들이밀었기** 때문이다.

**AMD는 실적을 이겼는데 주가는 졌다.** 2분기 매출 $11.54B(+50%), 데이터센터 매출 $6.7B(+107%)로 컨센서스를 상회했지만 −7% 급락했다. 퓨처럼의 셰이 볼루어는 "**블로우아웃에 가까운 결과로 가격이 매겨져 있었는데, 이건 예외적인 결과가 아니었다**"고 평가했다. 상장 후 첫 분기 실적을 낸 스페이스X는 AI 투자 부담 우려에 −13.61% 폭락(거래량 1억9,929만 주)했다.

**반면 엔비디아는 +3.44%($219.23) 홀로 올랐다.** 머스크가 실적 콜에서 엔비디아 물량 확약을 밝힌 영향이다. 리사 수 AMD CEO는 이를 애써 무시했지만 시장은 갈랐다. SOX는 −1.40% 조정됐고, 알파벳(−4.04%)·아스테라랩스(−11.96%)도 밀렸다.

**안전자산은 뛰었다.** 금이 **+3.74%($4,307.95)** 급등하고 은도 +3.32% 올랐다. 유가는 이틀간 −13% 급락한 뒤 $75선에서 숨을 골랐고(−0.08%), 금리는 사실상 보합(10년물 4.615%)이었다. 9월 FOMC 인상 확률은 57.7%에서 **52.4%로 더 낮아졌다.**

## 📰 시장 헤드라인 3선

**1. AMD 실적 상회에도 −7% — "블로우아웃 기대에 못 미쳤다"**
AMD가 2분기 매출 $11.54B(+50%), 데이터센터 $6.7B(+107%)로 시장 예상을 웃돌았지만 주가는 −7.04% 급락했다. 기대치가 이미 완벽한 실적에 맞춰져 있었다는 게 시장의 평가다. AI 반도체의 눈높이가 얼마나 높아졌는지를 보여준 사례다.

**2. 스페이스X 상장 후 첫 실적에 −13.6% — AI 지출 우려 재점화**
스페이스X가 상장 기업으로서 첫 분기 실적을 발표했으나 AI 관련 투자 확대 우려에 −13.61% 폭락했다. 거래량 1억9,929만 주로 이날 최대 거래 종목이었다. 다만 머스크는 콜에서 메모리 수요에 대해 강세 발언을 내놓아 메모리 업종엔 우호적으로 작용했다.

**3. 다우만 3일 연속 사상 최고 — S&P·나스닥은 4일 랠리 마감, 금 +3.7% 급등**
다우가 +0.49%(54,349.00)로 사흘 연속 최고치를 새로 썼지만 S&P(−0.17%)·나스닥(−0.83%)은 하락 전환했다. AI 실적 부담이 기술주에 집중된 가운데 금이 +3.74%($4,307.95) 급등하며 안전자산 선호가 살아났다.

### 🔻 하락 업종

**1. AI 반도체 (실적 눈높이 부담)**
AMD −7.04%($482.05), 아스테라랩스(ALAB) −11.96%, 샌디스크(SNDK) −5.31%, 마이크론(MU) 0.00% 보합. AMD의 '기대 이하 서프라이즈'가 AI 반도체 전반의 밸류에이션 부담을 자극하며 SOX가 −1.40% 조정됐다. 다만 엔비디아(+3.44%)는 머스크의 물량 확약에 홀로 상승했다.
> 🇰🇷 [전달] 8/5 미국장 SOX −1.40%·SKHY −2.17%($151.03, **괴리율 +29.4%**). 반면 서울은 8/5 SK하이닉스가 **+5.77%(1,668,000원)** 급등하고 **외국인이 38.98만 주 순매수로 전환**(전일 −41.9만 주), 삼성전자도 4%대 오르며 어제 지적한 격차를 크게 해소했다. 그 결과 **괴리율은 +40.0% → +29.4%로 10.6%p 축소**됐다(국내 상승 +5.77%, ADR 하락 −2.17%의 양방향 수렴). [판정] 8/6(목) 코스피·SK하이닉스는 **조정·숨고르기 출발이 우세**하다. 근거는 ①야간선물 −1.63%(1,025.10) ②SKHY −2.17%에 시간외 −1.27% 추가 약세 ③AMD發 AI 반도체 눈높이 부담. 다만 하방은 제한적일 수 있다 — 괴리율이 여전히 +29.4%로 국내 저평가 여지가 남아 있고, 외국인 순매수 전환·자사주 매입 기대·머스크의 메모리 강세 발언·8/13 실적이 지지선이다. (무효화: 외국인 재차 순매도 전환 또는 중국 메모리 증설 이슈 재부각 시)

**2. 대형 기술주 (차익실현)**
알파벳(GOOGL) −4.04%($362.38), 마이크로소프트(MSFT) −1.09%, 아마존(AMZN) −1.72%, 테슬라(TSLA) −1.80%. 4일 랠리 뒤 메가캡 전반에 차익실현이 나왔다.
> 🇰🇷 [전달] 메가캡 차익실현은 국내 성장주에도 단기 조정 압력으로 작용 가능.

**3. 의료기기 · 서비스 (개별 실적)**
인슐렛(PODD) −20.15%, 다비타(DVA) −17.24%, 톰슨로이터(TRI) −9.66%, CDW −9.03%. 실적·가이던스 실망 종목이 두 자릿수 급락했다.

**시장의 시선:** AMD는 매출이 50% 늘고 데이터센터가 두 배가 됐는데도 7% 빠졌다. 이는 **AI 종목의 문제가 실적이 아니라 '기대의 높이'**에 있음을 보여준다. 시장은 이제 좋은 실적이 아니라 '상상 이상의 실적'을 요구한다. 다우만 오르고 나스닥이 밀린 이날의 갈림, 그리고 금 +3.7% 급등은 그 부담을 자금이 어떻게 회피하는지 보여준다.

## 🏢 섹션 2 · 이슈 종목 10선

*그날 언론에 가장 많이 언급된 이슈 종목의 구체적 기사 내용 중심.*

**1. AMD (AMD) −7.04% ($482.05)**
전날 장 마감 후 발표한 2분기 실적에서 매출 $11.54B으로 전년 $7.69B 대비 +50% 성장해 월가 예상을 웃돌았고, 데이터센터 매출도 CPU·GPU 판매 호조로 $6.7B(+107%)을 기록했다. 그럼에도 주가는 −7.04% 급락했다. 퓨처럼 셰이 볼루어 수석전략가는 "블로우아웃에 훨씬 가까운 결과로 가격이 매겨져 있었다. 예외적인 결과를 기대했는데 이건 예외적이지 않았다"고 평했다. 리사 수 CEO는 머스크의 엔비디아 물량 확약 발언을 대수롭지 않게 넘겼으나 주가 방어에는 실패했다. 거래량 4,744만 주.

**2. 스페이스X (SPCX) −13.61% ($108.27)**

**9. 인슐렛 (PODD) −20.15% ($133.21)**
인슐린 펌프 의료기기 기업으로 실적·전망 실망에 −20.15% 폭락, 이날 최대 낙폭을 기록했다. 다비타(−17.24%)와 함께 헬스케어 내에서도 실적 부진 종목은 가차없이 이탈당하는 흐름을 보여줬다.

스페이스X 실적 콜에서 AI 인프라에 필요한 메모리 수요에 대해 강세 발언. 정작 자사 주가는 −13.6% 급락했으나 마이크론·SK하이닉스 등 메모리주에는 우호적 재료로 작용.

**로이터 — 삼성·SK하이닉스, 중국산 장비 시험 도입 검토**
양사가 중국 AMEC(Advanced Micro-Fabrication Equipment)의 반도체 장비를 중국 공장 사용 목적으로 평가 중이라고 보도. 미국발 규제 리스크에 대한 헤지 성격.

**Investing.com — "유가 하락이 인플레 불안을 덜며 국채는 혼조"**
유가 안정이 인플레 기대를 낮추면서 국채금리가 방향성을 잃었고, 시장의 시선이 주 후반 고용지표로 이동했다고 분석.
