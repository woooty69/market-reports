## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 12개:** 유통·이커머스(격차 +21.6%p), Plastic Products(격차 +19.6%p), Finance: Consumer Services(격차 +18.0%p), AI 소프트웨어·에이전트(격차 +17.9%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 석유화학, 게임, 의료기기·미용기기, 유전체·유전자치료 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 의료AI·디지털헬스(-15.7%p)
- **이제 막 힘 붙는 조기 테마:** 의류 OEM·패션(조기 78), 의료기기·미용기기(조기 74), 중국 소비·관광 회복(조기 71) — 다음 주 선점 후보군.
