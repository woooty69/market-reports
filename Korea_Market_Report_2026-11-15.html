## 🗓 시장 요약

**① 국내 정책: "유통주식 10% 미만 상장사 퇴출 검토"·자사주 세제 개편·금융지주 '75%룰'**
13일 자본시장 간담회 뒤 이재명 대통령이 유통주식 10% 미만 상장사 퇴출과 적대적 M&A 활성화를 검토하라며 국회·금융당국·거래소·민간이 참여하는 자본시장 개혁 고위급 TF 신설을 지시했다는 내용이 주말 내내 확산됐다. 자사주를 팔아 남긴 이익에 법인세를 물리지 않는 대신 손실의 비용처리도 없애는 방향의 세제 개편이 보도됐고, 금융지주 회장 연임에 '75%룰'을 언제부터 적용할지도 관심사로 떠올랐다. 3분기 확정기여(DC)형 퇴직연금의 원금비보장 상품 수익률이 직전 분기의 4분의 1로 떨어졌다는 집계도 나와 개인 자금 심리의 약세를 보여준다.

**② 글로벌: 금요일 뉴욕 S&P500 −0.40%·나스닥 −0.91%…연준 콜린스 "점진적 인상이 최선"**
13일(현지) 뉴욕은 엔비디아 약세와 긴축 경계로 S&P500이 0.40%, 나스닥이 0.91% 내렸고 다우만 0.10% 올랐다. VIX는 19.30으로 3.21% 높아졌다. 14일에는 수전 콜린스 보스턴 연은 총재가 "경제 위험 관리에는 점진적 금리 인상이 최선"이라고 말해, 10월 소비자물가 전월 대비 +0.4%·핵심물가 3개월 연속 +0.3% 이후 커진 12월 인상 경계를 이어갔다. 달러인덱스는 19개월 만의 최고 수준으로 올라섰고 엔/달러는 한때 160엔에 닿아 일본 당국 개입 경계가 커졌다.

**③ 반도체: 엔비디아 '젠슨 황 복귀론'·머스크 경고…HBM 장기계약은 유지 전망**
엔비디아 주요 투자자들이 이사회에 젠슨 황의 복귀 가능성을 검토하라고 요구했고, 일론 머스크는 "젠슨 없는 엔비디아는 공급망 핵심 계약을 잃을 것"이라며 상당수 거래가 서면이 아닌 구두 합의였다고 말했다. 엔비디아는 콜레트 크레스 임시 CEO 체제에서 18일 전사 회의를 열 예정이다. 국내 업계는 삼성전자 2027년 HBM 완판, SK하이닉스 2029년까지 생산물량 사실상 소진으로 기존 장기계약 영향은 제한적이라고 보지만, 추가 발주·후속 제품 협상에는 변수가 생겼다는 평가다. 미국 연구소가 중국 딥시크·키미가 제재에도 엔비디아 최첨단 칩으로 모델을 훈련했다고 밝혀 대중 수출통제 강화 가능성도 다시 거론됐다.

**④ 호재 흐름: K뷰티 ODM·K라면 증설·도시정비 수주**
코스맥스는 3분기 매출 8,758억원(+49.5%), 영업이익 833억원(+94.9%)으로 비수기에도 최대 실적을 냈고 증권가 목표가 상향이 이어졌다. 삼양식품은 베트남에 2,186억원을 들여 최대 8개 라인 공장을 짓기로 했고 농심도 녹산 신공장 가동을 시작해 K라면 생산기지 투자가 빨라지고 있다. 현대건설·삼성물산의 도시정비 수주가 사상 최대로 거론되고 두산건설도 시공사 선정 기준 약 4조원을 확보하는 등 건설 일감 뉴스가 이어졌다. AI 회로박 전환으로 배터리용 전지박 공급이 줄어 내년 가공비가 20～30% 오를 수 있다는 전망도 나왔다.

**⑤ 악재 흐름: 증권사 순이익 85%↓·미래에셋 해킹 점검 위반·한전 영업이익 71%↓**
10대 증권사의 3분기 순이익이 거래 위축과 국고채 담합 과징금 탓에 85% 줄었고, 미래에셋증권은 해킹 점검에서 일부 위반이 확인돼 금융당국이 다음 주 전 업권 보안 간담회를 연다. KRX 증권지수 11개 종목이 모두 PBR 1배 아래다. 한국전력은 전기요금 동결 속 3분기 영업이익이 71% 급감한 배경이 재조명됐고, 이마트는 본업 최대 실적에도 연결 영업이익이 70% 줄었다. 14일 미국 항공교통 통신장애로 미 전역 이륙이 4시간여 중단돼 대한항공·아시아나의 미국 노선 일부가 결항·지연됐다.

**⑥ 다음 거래일(16일·월) 변수: 엔비디아 실적·미중 정상 외교·IPO**
이번 주에는 엔비디아 3분기 실적(현지 17일 예정)과 앤트로픽 상장 일정, FOMC 의사록, 선전 APEC 정상회의가 몰려 있다. 크렘린은 트럼프·시진핑·푸틴 3자 회동이 19일 중국에서 열릴 예정이라고 밝혔고, 미중 무역위원회는 첫 회의에서 관세·농산물을 논의했다. 국내에서는 에스에프씨·유캐스트 공모 청약과 영광와이케이엠씨·옵토닉스 등 4개사 코스닥 상장이 예정돼 있다. 월요일 개장은 금요일 필라델피아 반도체 −3.43%와 야간선물 −0.72%를 먼저 반영할 가능성이 크다.

## 1. 업종별 흐름

**상승 업종** — 휴장 중 뉴스 기준으로 호재가 나온 업종은 화장품 ODM·음식료 수출·건설·항공우주다. 코스맥스 (192820) 280,500원(비정규 NXT 279,000원) · 3조 1,835억원는 3분기 영업이익이 94.9% 늘어 실적 발표 뒤 사흘간 18.3% 올랐고, 삼양식품 (003230) 1,210,000원(비정규 시간외 1,215,000원) · 9조 1,149억원은 해외 매출 비중이 83.4%에 이르는 가운데 베트남 2공장(2,186억원)을 발표했다. 건설은 현대건설 (000720) 83,800원(비정규 NXT 84,300원) · 9조 3,316억원·삼성물산 (028260) 285,000원(비정규 시간외 286,500원) · 46조 2,177억원의 도시정비 수주 신기록 기대와 두산건설 4조원 수주가 겹쳤고, 한국항공우주 (047810) 104,200원(비정규 시간외 104,500원) · 10조 1,569억원는 3분기 영업이익 794억원(+31.9%)으로 방산 4사 중 유일하게 이익이 늘었다. 동박은 AI 회로박 전환으로 전지박 공급이 빠듯해져 롯데에너지머티리얼즈 (020150) 37,650원(비정규 NXT 37,750원) · 1조 9,716억원·SKC (011790) 73,700원(비정규 NXT 74,200원) · 3조 6,554억원의 판가 인상 기대가 나왔다.

**하락 업종** — 휴장 중 악재가 나온 곳은 반도체 대형주·증권·인터넷·전력·로봇이다. 금요일 필라델피아 반도체지수 −3.43%와 엔비디아 경영 공백 장기화 우려가 SK하이닉스 (000660) 1,216,000원(비정규 NXT 1,233,000원) · 888조 2,787억원·삼성전자 (005930) 206,000원(비정규 시간외 209,000원) · 1,204조 3,334억원에 부담이고, 증권은 10대사 3분기 순이익 85% 감소·해킹 점검 위반·과징금이 겹쳤다. NAVER (035420) 172,500원(비정규 NXT 173,600원) · 26조 2,419억원는 이틀 새 11.4% 빠져 시총이 26조원대로 줄었고, 한국전력 (015760) 27,650원(비정규 NXT 27,600원) · 17조 7,503억원은 13일 −9.79% 급락 뒤 요금 동결의 구조적 부담이 재조명됐다. 로봇은 뉴로메카 (348340) 14,820원(비정규 시간외 15,010원) · 3,470억원의 3분기 영업손실이 70억원으로 2.2배 커졌다.

**시장의 시선** — 16일(월)에는 반도체가 금요일 미국 반도체 급락을 얼마나 반영할지가 첫 관심이다. 다만 국내 대형 반도체는 13일 이미 SK하이닉스 −3.03%·삼성전자 −0.96%로 일부를 반영했고, 엔비디아 실적이 이번 주 후반 방향을 가를 변수다. 금융지주는 13일 은행 업종 +3.58%로 강했지만 '75%룰'·사외이사 구성 논란이 나왔고, 건설은 도시정비·데이터센터 일감과 대형사 보증 부담이 맞서 있어 종목별 차이가 클 수 있다.

## 🧭 흐름 전환

*섹터 12개의 수치 점검표(하락 7·상승 5, 매일)와 Claude 주간 논지(리포트·뉴스·정책·유튜브). 점검표는 미리 정한 약속이지 매매 지시가 아니다 — 하락 점검 2개 = ⅓ 축소 검토, 3개 = 절반 검토, 가격 규칙은 논지보다 우선.*

① **바뀐 섹터** — **반도체 소부장**이 '하락'에서 '바닥 모색'으로 올라섰다. 바구니가 200일선 위(+7.7%)로 회복하고 상승 점검 2/5가 켜졌지만, 하락 점검(가격 규칙·호재 무반응) 2/7도 여전해 코스피 대비 우위는 단정하기 어렵다. 가장 강한 반론은 외국인이 팔고 개인이 받는 구조에서 유튜브의 강한 낙관(176대 13)이 이미 가격에 반영됐을 수 있다는 점이다. **건설**도 '하락'에서 '진행'으로 바뀌었다. 하락 점검 1/7·20일 코스피 대비 +8.0%로 주택 이익 개선과 데이터센터·정비사업 일감이 받치지만, 3개월 수익률 +0.4%로 제자리이고 대형사 보증·대위변제 공시가 반론이다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
