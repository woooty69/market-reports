## 🗓 시장 요약

**① 코스피 3.59% 급락, 5,100선 턱걸이…외국인 1.33조원·기관 4,562억원 동반 매도**
코스피는 강보합 출발 뒤 오전 10시대부터 외국인 매도가 커져 장중 5,069.83(−4.17%)까지 밀렸고 5,100.50으로 마감해 12일부터 3거래일 연속 내렸다. 외국인은 1조 3,287억원을 순매도해 이틀 연속 팔았고, 기관도 4,562억원을 팔았으며 그 안에서 연기금이 5,000억원 넘게 판 것으로 집계됐다. 개인은 1조 2,904억원을 순매수했다. 업종별로는 172개 반도체 종목 가운데 156개가 내렸고, 거래대금은 SK하이닉스(4조 7,980억원)·삼성전자(3조 2,197억원)에 몰렸다.

**② 반도체: SK하이닉스 −7.89%·삼성전자 −4.47%…밤사이 필라델피아 반도체 −5.28%로 부담 확대**
SK하이닉스는 1,120,000원, 삼성전자는 196,800원으로 마감했다. 젠슨 황 퇴진 뒤 엔비디아 임시 경영진이 AI 업계 자금 지원을 줄일 수 있다는 보도, 외국계 증권사의 낸드 현물가격 하락(10월 이후 20% 가까이) 지적, 미국 법원의 D램 담합 집단소송 기각 신청 배척이 겹쳤다. 장 마감 후 분기보고서에서 삼성전자는 1～9월 매출 500조원을 처음 넘겼고 SK하이닉스는 누적 매출 236조원 중 미국 매출이 147조원, 설비투자가 31조원으로 역대 최대였다. 그러나 밤사이 미국에서 필라델피아 반도체지수가 5.28% 급락했고, 미국 정부가 첨단 AI 칩에 대한 중국의 원격 접속을 막는 규정을 내놓은 데다 엔비디아 이사회가 젠슨 황 복귀를 검토하지 않는다고 밝혀 오늘도 반도체 투자심리 회복은 쉽지 않아 보인다.

**③ 강세 업종: 항공·담배·손해보험·식품·금융지주 — 방어주와 실적주로 피신**
항공사(+4.03%)는 LCC 통합 시너지(연 260억원)를 내건 한진칼(+5.90%)이, 담배(+3.35%)는 '4년간 5조원+α' 주주환원의 KT&G(+2.78%)가 이끌었다. 손해보험(+2.92%)은 LH 보험 입찰담합 사건 무죄 확정에 삼성화재(+2.46%)가 오르고 DB손해보험(+4.46%)·현대해상(+4.42%)이 강했다. 삼양식품(+6.20%)은 장 마감 후 3분기 매출 7,918억원·영업이익 1,962억원으로 분기 최대 실적을 냈고, KB금융(+1.64%)·하나금융지주(+1.77%)·우리금융지주(+1.54%) 등 금융지주도 '하락장 방어주'로 올랐다.

**④ 약세 업종: 전자장비·반도체·에너지장비·디스플레이 장비 — AI 투자 사슬 전반 매도**
전자장비와기기(−8.22%, 21종목 상승·78종목 하락)는 삼성전기(−8.19%)·이수페타시스(−7.91%)·대덕전자(−9.53%) 등 기판·부품주가, 에너지장비및서비스(−6.64%, 31종목 모두 하락)와 디스플레이장비및부품(−5.42%)은 AI 데이터센터·장비 투자 둔화 우려가 끌어내렸다. 반도체 장비에서는 한미반도체(−6.60%)·주성엔지니어링(−11.88%)·피에스케이홀딩스(−12.95%)·유진테크(−15.38%)가 급락했다. 전기장비(−3.67%)에서는 LS ELECTRIC(−3.81%)이 미국 빅테크 1,300억원 수주를 알렸는데도 내렸고, 두산에너빌리티(−4.16%)·한화솔루션(−6.34%)·SK(−5.65%)도 약했다.

**⑤ 환율·금리·해외: 원/달러 1,337원, 미 증시 급락·VIX 23.7…연준 매파 발언 이어져**
원/달러는 하나은행 고시 기준 1,337.00원으로 1.0원 내려 환율 부담은 크지 않았다. 밤사이 S&P500은 1.92%, 나스닥은 2.49%, 다우는 1.41% 내렸고 VIX는 22.8% 뛴 23.70이었다. 엔비디아 실적(현지 17일 장 마감 후)과 앤트로픽 상장(19일)을 앞두고 AI 거래 전반이 약했고 국제유가도 내렸다. 해맥 클리블랜드 연은 총재가 '점진적이고 꾸준한 금리 인상'의 필요성을 다시 강조했고, 미 10년물 국채금리가 5.2%에 육박해 있어 성장주 밸류에이션 부담이 이어지고 있다.

**⑥ 코스닥: 4.86%↓ 665.65, 장비·후공정주 두 자릿수 급락…'AI 커닝' 테마 상한가**
코스닥은 705.88로 출발했다가 665.65(−4.86%)로 마감했고, 외국인(−2,005억원)·기관(−1,535억원)이 팔고 개인이 3,674억원을 샀다. 주성엔지니어링(−11.88%)·심텍(−13.38%)·이오테크닉스(−9.79%)·원익IPS(−9.78%)·하나마이크론(−15.72%)·오킨스전자(−27.90%) 등 반도체 장비·후공정주가 급락했다. 반면 수능을 앞둔 'AI 안경 커닝' 논란에 나무가·지슨·세코닉스·카티스·LK삼양 등 카메라·보안주가 상한가로 마감했고(코스닥 상한가 8종목), 미국 3상에서 1차 평가지표를 충족하지 못한 HLB테라퓨틱스는 하한가였다. 장 마감 후에는 SK스퀘어(3분기 영업이익 7조 9,406억원·최소 4.3조원 주주환원), 삼성SDI(美 주피터파워 16GWh LFP 공급계약), 아이크래프트(네이버클라우드와 2,091억원 공급계약) 공시가 나왔다.

## 🧭 흐름 전환

*섹터 12개의 수치 점검표(하락 7·상승 5, 매일)와 Claude 주간 논지(리포트·뉴스·정책·유튜브). 점검표는 미리 정한 약속이지 매매 지시가 아니다 — 하락 점검 2개 = ⅓ 축소 검토, 3개 = 절반 검토, 가격 규칙은 논지보다 우선.*

**건설**은 규칙 단계가 '진행'에서 '하락'으로 내려왔다. 가격 규칙과 호재 무반응이 켜져 하락 점검이 2/7로 '⅓ 축소 검토' 선에 들어왔고, 20일 기준으로는 아직 코스피보다 8.5% 앞서 있다. 논지는 주택 이익 체질 개선과 국내 데이터센터·정비사업 일감이지만, 가장 강한 반론은 그 개선이 아직 전망일 뿐인데 GS건설 대위변제·현대건설 5,400억원 보증 같은 재무 부담 공시가 먼저 나오고 있다는 점이다. **항공**은 '초입·확산'에서 '진행'으로 바뀌었다. 하락 점검은 1/7(호재 무반응)에 그치지만 20일 초과수익이 +21.5%로 이미 커서, 통합·국제선 성장 같은 알려진 재료 이상의 이익 상향이 필요하다는 반론이 따른다. **로봇**은 단계는 '하락' 그대로지만 하락 점검이 2/7에서 4/7(가격 규칙·호재 무반응·추정치 악화·하락 서사 급증)로 늘었다.

**4. SK하이닉스 (000660) 1,120,000원(비정규 NXT 1,118,000원) · 818조 1,515억원 · −7.89% — 엔비디아 자금 축소설·낸드 하락·D램 담합 소송에 프로그램 5,198억원 매도**
SK하이닉스는 7.89% 내린 1,120,000원으로 마감했고 거래대금은 4조 7,049억원으로 시장 1위였다. 프로그램으로만 5,198억원이 빠져 코스피 프로그램 순매도(6,325억원)의 대부분을 차지했는데, 크레스 임시 CEO 체제의 엔비디아가 AI 투자·자금 지원을 줄일 수 있다는 보도와 낸드 현물가격 하락 분석, 미국 법원의 D램 담합 집단소송 기각 신청 배척이 겹쳤다. 장 마감 후 분기보고서에서는 1～9월 누적 매출 236조 5,105억원 가운데 미국 매출이 147조 7,392억원(+227%)이었고, 최대 고객(엔비디아 추정) 매출이 34조 9,778억원으로 1년 새 두 배가 됐으며 설비투자도 31조 2,163억원으로 지난해 연간(30조 1,730억원)을 이미 넘었다. 3분기 D램 평균판매가격은 전 분기보다 20% 후반, 낸드는 20% 중반 올랐고 생산시설 가동률은 100%를 유지했다. 밤사이 미국에서는 필라델피아 반도체지수가 5.28% 급락했고 미 상무부가 AI 칩 원격 접속 차단 규정을 내놔, 코스피200 야간선물(−1.76%)과 함께 오늘 추가 하락 압력이 남아 있다. [리포트: iM 2026-11-04](https://woooty69.github.io/hw-pdf-arch-037/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261104_iM_4098115044.pdf) · [리포트: Korea Investment 2026-11-02](https://woooty69.github.io/hw-pdf-arch-037/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261102_Korea%2BInvestment_4070007563.pdf) · [리포트: KB 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261102_KB_4014651393.pdf)
