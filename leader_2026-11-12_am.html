## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** Advertising(격차 +21.2%p), 방산(격차 +16.7%p), 조선·LNG선·함정 MRO(격차 +14.5%p), 드론·UAM(격차 +9.2%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 게임, 항공기 부품, 통신·5G, 해운 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** Biotechnology: Laboratory Analytical Instruments(-10.0%p), CDMO·바이오시밀러(-8.7%p), 비만치료제(-6.1%p)
