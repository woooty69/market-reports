# 📊 한국증시 데일리 리포트 (저녁판)
### 2026년 10월 15일(목) 18시 작성 · 기준일: 10월 15일(목) 정규장 (저녁판)

> 10월 15일 정규장 마감과 장 마감 후 18시대까지 나온 뉴스·공시·증권사 리포트를 정리했습니다. 미국 9월 CPI가 예상을 웃돌고 코어위브발 'AI 빚잔치' 우려가 번지며 코스피는 5,554.22(−7.57%), 코스닥은 760.82(−7.65%)로 폭락했습니다. 양 시장에 매도 사이드카와 1단계 서킷브레이커가 잇따라 발동된 '검은 목요일'이었고, 코스피는 7거래일 연속 하락했습니다.

*코스피는 전날보다 5.59% 낮은 5,673.01로 출발해 장 초반 5,751.45까지 반등을 시도했지만, 9시 7분 매도 사이드카에 이어 12시 38분 1단계 서킷브레이커(20분 매매 정지)가 발동되며 장중 5,450.81까지 밀렸고 5,554.22(−7.57%)로 마감했다. 외국인이 3조 7,719억원을 팔아 8거래일 연속 순매도했고 개인(+1조 4,553억원)과 기관(+1조 6,720억원)이 받아냈다. SK하이닉스(−11.35%)·삼성전자(−9.27%)·삼성전기(−15.79%)·SK스퀘어(−10.92%)가 낙폭을 주도했고, 업종별로는 전자장비와기기(−14.17%)·전기장비(−13.01%)·반도체와반도체장비(−10.36%)가 가장 약했다. 오른 업종은 상업서비스(+5.23%)·담배(+4.24%)·통신(+1.80%) 정도였고 코스피 상승 종목은 112개, 하락 종목은 790개였다. 코스닥도 12시 23분 서킷브레이커가 발동되며 760.82(−7.65%)로 마감했다.*

## 🗓 시장 요약

**① 코스피 5,554.22(−7.57%), 사이드카·서킷브레이커 겹친 '검은 목요일'**
코스피는 454.59포인트 내린 5,554.22로 마감해 7거래일 연속 하락했고, 이 기간 낙폭은 20%에 이른다. 오전 9시 7분(코스피)·9시 12분(코스닥) 매도 사이드카에 이어 낮 12시 23분 코스닥, 12시 38분 코스피에서 1단계 서킷브레이커가 발동됐는데, 양 시장 동시 서킷브레이커는 올해 다섯 번째이자 7월 29일 이후 두 달 반 만이다. 하루 만에 양 시장 시가총액 약 410조원이 증발했고, 코스피 거래대금은 26조 8,660억원으로 불어났다. VKOSPI는 장중 55선을 넘었다.

**② 반도체: 하이닉스 −11.35%·삼성전자 −9.27%, 소부장·기판 동반 투매**
간밤 필라델피아 반도체지수가 4.30% 급락하고 코어위브(−15.46%)·오라클(−8.8%)이 AI 데이터센터 투자비 회수와 차입 부담 우려로 폭락한 여파가 그대로 들어왔다. SK하이닉스는 1,258,000원, 삼성전자는 210,500원으로 '21만전자·126만닉스'가 됐고 두 종목 거래대금만 14조원을 넘었다. 가트너가 2026～2030년 AI 인프라 누적 투자 약 7조달러 대비 데이터센터 AI 매출을 3.6조달러 이하로 추산한 점이 'AI 수익성 쇼크'로 회자됐다. 원익IPS(−16.71%)·주성엔지니어링(−16.01%)·테스(−17.10%)·유진테크(−17.97%) 등 장비주와 삼성전기(−15.79%)·대덕전자(−12.83%)·코리아써키트(−16.49%) 등 기판주도 급락했다.

**③ 버틴 업종: 자사주 매입·고배당·방어주**
상업서비스(+5.23%)는 4,500억원 자사주 공개매수와 기존 자사주 전량 소각을 결정한 에스원(+15.05%)이 이끌었고, 담배(+4.24%)는 사상 최대 실적 기대의 KT&G(+4.07%)가 신고가 근처에서 버텼다. 삼성바이오로직스(+3.89%)는 시총 상위 10종목 중 유일하게 올랐고 유한양행(+3.99%)·셀트리온(+0.78%) 등 제약(+0.14%)이 강보합이었다. 하나금융지주(+1.32%)·우리금융지주(+0.32%)·KB금융(−1.19%) 등 은행(+0.04%)과 KT(+1.60%)도 피난처 역할을 했다.

**④ 약세 업종: 전자장비·전기장비·반도체·통신장비·기계**
전자장비와기기(−14.17%, 하락 86종목)와 전기장비(−13.01%, 상승 0·하락 32)가 가장 약했다. 효성중공업(−14.80%)·HD현대일렉트릭(−11.60%)·LS ELECTRIC(−13.49%)·산일전기(−17.55%) 등 AI 전력기기주가 일제히 밀렸고, 에너지장비(−9.93%)·기계(−8.83%)·생명보험(−8.12%)·복합기업(−7.53%)도 크게 빠졌다. 삼성생명(−8.72%)은 보유한 삼성전자 지분 가치 급감이, SK(−11.61%)와 두산(−13.72%)은 자회사 지분 가치 하락이 부담이 됐다.

**⑤ 환율·금리·외부 변수**
미국 9월 CPI는 전년 대비 3.7%로 예상치(3.6%)를 웃돌았고 근원물가도 2개월 연속 예상을 넘어 연준의 추가 긴축 가능성이 부각됐다. 원/달러 고시 환율은 장중 1,350원대까지 올랐다가 1,344.60원(+1.60원)으로 마감 시간대를 맞았다. 아시아 증시도 동반 급락해 닛케이225는 4.90%, 상해종합은 1.59%, 항셍은 1.03% 내렸다. 작성 시점 S&P500 선물은 −0.17%, 나스닥100 선물은 −0.89%로 약세가 이어지고 있다.

**⑥ 코스닥 760.82(−7.65%), 하락 1,591종목 속 신규상장·테마 급등**
코스닥은 784.45로 출발해 745.43까지 밀린 뒤 760.82로 마감했고 상승 110종목, 하락 1,591종목으로 거의 전 종목이 내렸다. 외국인은 2,207억원 순매수했지만 기관(−1,663억원)이 팔았다. 원익IPS·주성엔지니어링·HPSP(−14.54%)·피에스케이(−16.21%)·리노공업(−12.24%) 등 시총 상위 장비·부품주가 급락한 반면, 이날 상장한 멜콘(+36.50%, 공모가 대비)과 라온시큐어(+14.01%)·듀켐바이오(+30.00%) 등 개별 재료주가 급등했다.

## 1. 업종별 흐름

**상승 업종** — 상업서비스와공급품(+5.23%)·담배(+4.24%)·다각화된통신서비스(+1.80%)·카드(+0.71%)·가정용기기와용품(+0.24%)·컴퓨터와주변기기(+0.21%)·제약(+0.14%)·은행(+0.04%)만 플러스였다. 상업서비스는 에스원(+15.05%)이 4,500억원 규모 자사주 454만주 공개매수와 기존 자사주 전량 소각을 결정하며 끌어올렸고, 담배는 KT&G(+4.07%)가 '실적 좋고 배당 많은' 방어주로 자금을 모았다. 통신은 KT(+1.60%), 제약은 유한양행(+3.99%)·삼성바이오로직스(+3.89%)가 앞장섰고, 은행은 금융지주 올해 주주환원이 10조원을 넘을 것이라는 분석 속에 하나금융지주(+1.32%)가 올랐다.

**하락 업종** — 전자장비와기기(−14.17%)·전기장비(−13.01%)·반도체와반도체장비(−10.36%)·통신장비(−10.35%)·에너지장비및서비스(−9.93%)·기계(−8.83%)·생명보험(−8.12%)·핸드셋(−8.12%)·전기제품(−7.83%)·건강관리기술(−7.66%)·복합기업(−7.53%)·디스플레이장비(−7.47%)가 크게 빠졌다. 전자장비는 삼성전기(−15.79%)·LG이노텍(−10.53%)·삼화콘덴서(−15.44%), 전기장비는 LS ELECTRIC(−13.49%)·HD현대에너지솔루션(−16.36%)·효성중공업(−14.80%), 반도체는 SK하이닉스(−11.35%)·한미반도체(−11.95%)·테크윙(−18.57%)이 급락을 이끌었다. 전기제품은 삼성SDI(−9.14%)·LG에너지솔루션(−5.92%)이, 복합기업은 SK(−11.61%)·삼성물산(−8.75%)이 끌어내렸다.

**시장의 시선** — 7거래일 동안 20% 빠지며 7월 말 저점(5,500선)을 시험하는 구간에 들어섰다. 증권가는 삼성전자·SK하이닉스 목표주가가 현 주가의 두 배 수준이라며 이익 대비 과도한 할인을 강조하지만, 외국인은 올해 코스피에서 200조원 넘게 팔았고 34조원 규모 신용융자 잔고에서 반대매매가 2개월여 만에 최고로 늘어나는 등 수급 부담이 크다. DS투자증권은 이번 매도가 금리보다 실적·미국 중간선거를 앞둔 포지션 정리 성격이라며 27～28일 FOMC와 중간선거를 지나 AI B2B 수요가 확인되면 진정될 것으로 봤다. 야간선물은 개장 직후 865.40(+0.48%)로 출발했다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 43종목

*저녁판: 1～40번은 뉴스 후보 풀(최근 14시간 보도 건수) 순을 기본으로 거래대금·급등락·장 마감 후 공시를 고려해 골랐고(27·35번은 ★), 41～43번은 ★ 필수 편입(시총 1,000억원 이상 · +10% 이상 상승) 중 1～40번에 없는 종목이다. 등락률은 10/15 종가 기준.*

**1. SK하이닉스 (000660) 1,258,000원 · 918조 9,594억원 · −11.35% — '126만닉스' 추락, 거래대금 7.3조원으로 시장 1위**
SK하이닉스는 11.35% 내린 1,258,000원으로 마감했고 거래대금은 7조 2,994억원으로 시장 전체 1위였다. 간밤 필라델피아 반도체지수(−4.30%)와 마이크론·코어위브 급락에 AI 투자 수익성 의구심이 겹치며 외국인 매도가 집중됐다. 최태원 회장이 최근 49억원어치를 매수했다가 손실을 보고 있다는 보도와 함께, 개인은 '매수 타이밍'이라며 삼성전자·SK하이닉스를 대거 사들였다. 증권가 목표주가는 여전히 현 주가의 두 배 수준으로, 하나증권은 3분기 영업이익 77조9,000억원(+29% QoQ)을 전망했다. [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf) · [리포트: SK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261012_SK_196606.pdf)

**2. 삼성전자 (005930) 210,500원 · 1,230조 6,416억원 · −9.27% — '21만전자'로 후퇴, 거래대금 6.8조원**

### 🇰🇷 내일 개장 관전 포인트
1. **서킷브레이커 다음 날의 반발 강도** — 코스피는 7거래일 동안 20% 빠졌고 장중 저점 5,450.81까지 밀렸다. 야간선물이 개장 직후 865.40(+0.48%)로 출발한 만큼, 오늘 밤 미국 PPI·소매판매와 나스닥 선물(작성 시점 −0.89%)의 방향이 첫 신호다. 7월 말 저점대(5,500선)를 지키는지가 기술적 분기점이다.
2. **외국인 매도의 질** — 외국인은 8거래일 연속 순매도하며 이날만 3조 7,719억원을 팔았다. 반도체 대형주에서 매도가 줄고 프로그램 매수가 이어지는지, 개인의 '삼전닉스 줍줍'과 34조원 신용융자 반대매매 물량이 얼마나 나오는지를 함께 봐야 한다.
3. **AI 신용위험 vs 실적** — 코어위브 회사채 금리와 TSMC 실적·가이던스가 'AI 수익성 쇼크'를 진정시킬 수 있을지가 관건이다. 삼성전자·SK하이닉스 3분기 실적 기대가 여전히 높아 증권가 목표가는 현 주가의 두 배 수준이지만, 장비·기판·전력기기처럼 밸류에이션이 높았던 종목의 변동성은 이어질 수 있다.
4. **방어주·주주환원 종목의 지속성** — 에스원(+15.05%)·KT&G(+4.07%)·하나금융지주(+1.32%)·삼성바이오로직스(+3.89%)가 버팀목이었다. 금융지주 주주환원 10조원 기대와 고배당주로의 순환이 하루짜리인지 확인이 필요하다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
