# 미국→한국 선점 2026-11-13 (미국 2026-11-13 마감 반영)

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 10개:** Advertising(격차 +23.8%p), 방산(격차 +15.3%p), 조선·LNG선·함정 MRO(격차 +14.1%p), 석유화학(격차 +11.5%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** Biotechnology: Laboratory Analytical Instruments, 비만치료제, Marine Transportation, 반도체 소재·부품 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** OLED·디스플레이(-6.1%p)
- **이제 막 힘 붙는 조기 테마:** 메모리·HBM(조기 72), Plastic Products(조기 72), 반도체 소재·부품(조기 71) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 라온시큐어(Computer Software: Prepackaged Software, 점수 100), 코스맥스(화장품·K뷰티, 점수 77), 한국가스공사(정유·LNG·가스, 점수 71)
