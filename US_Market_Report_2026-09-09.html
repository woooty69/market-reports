## 🗓 시장 요약

**① 3거래일 만에 열린 장이 유가에 눌렸다**
노동절 연휴로 9월 4일 이후 문을 닫았던 뉴욕 증시가 화요일 다시 열렸다. 투자자들이 마주한 것은 **100달러에 다가선 유가**였다. 브렌트유가 장중 **배럴당 99달러 부근**까지 올랐고, WTI는 **6거래일 연속** 상승해 **\$93.03**로 마감했다. 다우가 **628.18포인트(−1.18%)** 내린 **52,786.07**로 낙폭이 가장 컸고, S&P 500은 **−0.58%(7,673.52)**, 나스닥은 **−0.32%(26,421.41)**로 상대적으로 선방했다.

**② 유가가 곧바로 물가와 금리로 연결됐다**
두 달 전 브렌트유는 배럴당 72달러 선이었다. 미국과 이란의 상호 공격이 이어지고 **사우디 에너지 시설이 피격**되면서 공급 차질 우려가 유가를 밀어올렸다. 유가 상승은 휘발유·운송·제조 원가로 확산되고, 결국 기업이 흡수하거나 소비자에게 전가된다. 지난 금요일 확인된 **8월 비농업 신규고용 16만 2,000명**의 강세와 겹치면서, 9월 FOMC 인상 확률은 **약 58~60%** 구간으로 올라섰다.

**③ 이란은 걸프 전역의 에너지 인프라를 겨냥했다**
모하마드 바게르 갈리바프 이란 국회의장은 **"이곳의 석유·가스 생산 사슬은 광범위하게 뻗어 있고 접근 가능하며 노출돼 있다. 이 해역과 시설에 있는 미국 석유·가스 기업들도 그 노출을 공유한다"**며 **"우리 자산을 치면 당신들도 맞는다. 우리는 이미 그것을 증명했다"**고 말했다. 이란은 걸프 해역에 **새로운 통제 구역과 대체 항로**를 설정하겠다고 밝혀 호르무즈 해협 통항 지연 우려가 커졌다. 다만 이란이 **오만과의 호르무즈 관련 합의가 임박했다**고 언급한 점은 완충 요인이다.

**④ 10년물 4.8%가 주식의 경쟁 상대가 됐다**
미국채 10년물이 **4.792%(+0.9bp)**로 다년래 고점 부근에 머물렀고, 정책금리에 민감한 2년물은 **4.400%(+2.1bp)**로 올랐다. 안전한 국채에서 5%에 가까운 수익을 얻을 수 있으면 투자자는 주식 가격에 더 까다로워진다. 특히 이익이 먼 미래에 몰려 있는 기술주에 불리한 구도다. 그런데도 **나스닥이 다우보다 잘 버틴 것**이 이날의 특징이었다.

**⑤ AI가 기술 섹터 안에서 승자와 패자를 갈랐다**
서비스나우가 **−4.99%(\$134.21)**, 세일즈포스와 인튜이트가 각각 **약 −4%** 내렸다. **오픈AI의 최신 모델이 전문 소프트웨어가 제공하던 기능을 대체할 수 있다는 우려**가 재점화된 결과다. 반대편에서는 인텔이 **+9.05%**, 퀄컴이 **+3.17%** 올랐다. 그동안 AI는 기술 섹터 전체의 순풍으로 여겨졌지만, 이제 시장은 **칩·데이터센터·인프라와 전통 소프트웨어를 다른 가격으로 매기기 시작했다**.

**⑥ 퀄컴이 아마존과 맞춤형 AI 칩을 만든다**
퀄컴이 AWS 데이터센터용 **맞춤형 실리콘과 고속 광통신 링크**를 여러 세대에 걸쳐 공동 개발하는 다년 계약을 발표했다. 개장 직후 **10% 급등해 \$184.98**까지 올랐다가 상승분 대부분을 반납하고 **+3.17%(\$174.09)**로 마감했다. 퀄컴은 골드만삭스 커뮤나코피아 콘퍼런스에서 **12월 분기부터 아마존 관련 매출이 발생**하며 **FY27 데이터센터 매출 50억 달러 목표에 높은 확신**이 있다고 밝혔다. 규제 공시에 따르면 **9월 3일자로 아마존에 최대 2,500만 주 신주인수권(워런트)을 부여**했다.

**⑦ 인텔은 가격을 올리겠다는 신호로 9% 뛰었다**
공급망발 보도로 **인텔이 10월 초부터 PC용 프로세서 가격을 약 10% 인상**할 것이라는 내용이 전해졌다. 노스랜드증권은 같은 날 인텔을 **'마켓퍼폼 → 아웃퍼폼'으로 상향하고 목표주가 120달러**를 제시하면서 턴어라운드 진척, 서버용 프로세서 부족, 머스크의 테라팹 프로젝트를 근거로 들었다. 시장은 가격 인상을 **물량 대신 칩당 이익을 지키겠다는 선택**으로 읽었다. 미국 정부가 보유한 **지분 9.9%의 평가이익은 약 360억 달러**로 불어났다.

**⑧ 젠슨 황이 "AGI가 도래했다"고 선언했지만 엔비디아는 내렸다**
젠슨 황 엔비디아 CEO는 9월 7일 X에 **"AGI가 도래했다"**고 적으며 GPT-6 아스트라의 학습에 **그레이스 블랙웰 NVLink72 GPU 10만 개 이상**이 투입됐고 **40만 개가 추가로 가동될 예정**이라고 밝혔다. 그러나 이 발언에 처음 반응할 수 있었던 이날 정규장에서 엔비디아는 **−2.01%(\$225.73)** 내렸다. 시장은 **40만 개가 신규 증분 수요인지, 이미 가이던스에 반영된 물량인지** 확인되지 않았다는 점을 문제 삼았다.

**⑨ 캐나다의 보복관세가 발효됐다**
캐나다가 미국산 제품 **약 200억 달러 규모에 15~50%의 보복관세**를 이날부터 부과했다. 철강·가구·전자제품 등 정치적으로 민감한 미국 산업이 표적이다. 협상 결렬 후 미국이 캐나다산 **약 200억 달러 물품에 50% 관세**를 매긴 데 대한 대응이다. 다만 캐나다달러는 유가 강세 덕에 오히려 **3주 만의 최고치인 72.5미국센트** 부근까지 올랐다.

**⑩ 한국은 장중 7,171까지 올랐다가 반락했다**
전일 코스피는 장중 **7,171.52**까지 치솟아 사상 최고 영역을 넓혔으나 **6,954.52(−40.87p, −0.58%)**로 되밀렸다. '칠천피' 종가 안착에는 실패한 전강후약이었다. 코스닥은 **811.88(−1.25%)**, 원/달러는 **1,345.6원(+5.1원)**으로 되돌림이 나왔다. SK하이닉스는 **1,793,000원(+0.56%)**에 마감했고 **외국인이 +9만 7,545주** 순매수한 반면 개인이 **−72만 1,126주** 순매도했다. 거래대금 **13조 4,523억원**, 시가총액 **1,309조 7,728억원**.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  반도체 — 지수가 내린 날 SOX만 올랐다**
필라델피아 반도체지수가 **+1.30%(11,887.87, +152.61)** 올라 3대 지수와 정반대로 움직였다. 인텔 **+9.05%**, AMD **+5.90%**, SK하이닉스 ADR **+4.83%**, 램리서치 **+4.15%**, 퀄컴 **+3.17%**. 유가·금리라는 매크로 역풍보다 **AI 인프라 투자와 메모리 가격이라는 산업 재료**가 더 크게 작동한 하루였다.

**상승 ②  메모리·스토리지 — 가격 인상 사이클이 재료**
7월 DRAM 평균판매가격이 6월 대비 **6%**, NAND는 **9%** 올랐고, 이번 분기 DRAM 계약가는 **50% 이상**, NAND는 **60%** 상승할 것으로 전망된다. 최선단 메모리 제품의 **연말까지 물량이 모두 소진**됐다는 업계 보도가 이어지면서 선두 업체의 가격 협상력이 부각됐다. 마이크론의 **9월 30일 실적 발표**가 다음 확인 지점이다.

**상승 ③  에너지 — 유가가 6거래일 연속 올랐다**
WTI가 **\$93.03(+1.70%)**로 8월 31일 이후 6거래일 연속 상승했다. 이는 3월의 7거래일 연속 이후 가장 긴 연속 상승이다. 브렌트 11월물은 **\$97.92(+0.9%)**로 마감했으나 장중 **99달러**를 찍었다.

**하락 ①  소프트웨어 (이날 최약)**
서비스나우 **−4.99%**, 세일즈포스·인튜이트 각각 **약 −4%**. **오픈AI 신규 모델이 전문 소프트웨어의 영역을 침범할 수 있다는 우려**가 촉매였다. 서비스나우는 거래량 **1,377만 9,312주**에 저가 **\$132.48**까지 밀렸다. 같은 날 BTIG는 목표주가를 **150달러 → 170달러**로 올려 매수를 유지해, 애널리스트 시각과 당일 주가가 정반대로 갈렸다.

**하락 ②  헬스케어·경기소비 — 다우를 끌어내린 축**
다우가 **−1.18%**로 S&P·나스닥보다 두 배 이상 내린 것은 **기술주가 아니라 헬스케어와 경기민감 업종**이 지수를 눌렀기 때문이다. 나스닥이 상대적으로 버틴 것은 반도체 강세가 소프트웨어 약세를 상쇄했기 때문이다.

**하락 ③  안전자산 — 금이 밀렸다**
금 12월물이 **\$4,400.00(−1.71%)**로 내렸다. 중동 리스크가 커진 날 금이 하락한 것은 **국채금리 상승이 무이자 자산인 금의 기회비용을 키웠기 때문**으로 읽힌다. VIX는 **15.72(+2.75%)**로 올랐으나 절대 수준은 여전히 낮다.

> 🇰🇷 [전달] **코스피200 야간선물은 1,105.00(+6.60, +0.60%)**로 마감했다. 시가 **1,096.00**으로 정규장 선물 종가(**1,098.40**) 아래에서 출발해 저가 **1,093.00**까지 밀렸다가 고가 **1,120.50(+2.01%)**까지 올랐고, 상단에서 밀려 마감했다. 미 3대 지수가 모두 내린 날 야간선물이 오른 것은 **SOX +1.30%·SKHY +4.83%**가 KOSPI200의 반도체 비중에 그대로 반영된 결과다. 거래량 **22,189계약**, 미결제약정은 **99,244계약(▼1,368)**으로 직전 134,734계약에서 크게 줄었는데, **9월 10일 선물·옵션 만기를 앞둔 롤오버**의 영향으로 보인다.

> [수급] 전일 국내는 코스피 **6,954.52(−0.58%)**, 코스닥 **811.88(−1.25%)**로 동반 하락했다. 장중 **7,171.52**까지 올랐다가 되밀린 전강후약이었다. SK하이닉스는 **1,793,000원(+0.56%)**으로 **외국인 +9만 7,545주** 순매수, **기관 −1만 4,560주·개인 −72만 1,126주** 순매도였다. 거래대금 **13조 4,523억원**, 시가총액 **1,309조 7,728억원**. 원/달러는 **1,345.6원(+5.1원)**으로 되돌림. 괴리율은 **+33.1% → +39.3%**로 6.2%p 확대됐다 — 국내(**+0.56%**)보다 ADR(**+4.83%**)이 훨씬 크게 올랐고, 원/달러 상승(**+5.1원**)까지 같은 방향으로 작용했기 때문이다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📈 8월 PPI(9/10 목) → CPI(9/11 금) — 이번 주의 본게임:** 브렌트유 99달러와 캐나다 보복관세가 겹친 상태에서 나오는 물가지표다. **90달러대 유가에도 물가가 식고 있다면** 연준은 기다릴 여지가 있고, **뜨겁게 나오면** 강한 고용지표 때문에 인상을 미룰 명분이 줄어든다.
- **🏛 9월 FOMC(9/15~16) — 인상 확률 58.1%:** 워시 의장의 첫 정책회의다. 선물 시장은 3.75~4.00% 구간에 **58.1%**, 동결에 **41.9%**를 매기고 있다. CPI 발표 후 이 확률이 어디로 수렴하는지가 관건이다.
- **🛢 유가 — 6거래일 연속 상승, 무대는 걸프 전역:** WTI **\$93.03**, 브렌트 **\$97.92**(장중 99달러). 이란이 **걸프 해역 통제 구역과 대체 항로** 설정을 예고했고, 사우디 에너지 시설 피격이 겹쳤다. 반대로 **이란-오만 호르무즈 합의 임박** 언급은 완화 요인이다. 두 경로 모두 물가로 연결된다.
- **💾 오라클 실적 — AI 자본지출의 가늠자:** 클라우드 성장률, 데이터센터 수요, 그리고 **AI 워크로드 지원에 얼마를 쓸 계획인지**가 관전 포인트다. 10년물이 4.8%인 환경에서는 **인프라를 어떻게 조달할 것인가**가 성장률만큼 중요해졌다.
- **🇰🇷 9월 10일 KOSPI200 선물·옵션 만기:** 야간선물 미결제약정이 **134,734 → 99,244계약(▼1,368)**으로 급감했다. 만기를 앞둔 롤오버 국면이라 **당일 수급 왜곡**을 감안해야 한다.
- **🔧 SKHY 괴리율 +39.3% — 다시 확대:** 한국 급등으로 **+33.1%**까지 좁혀졌던 괴리가 하루 만에 **6.2%p** 벌어졌다. ADR **+4.83%** vs 국내 **+0.56%**, 여기에 원/달러 **+5.1원**이 같은 방향으로 작용했다.
- **📱 애플 신제품 공개(9/9):** 국내 디스플레이·부품주에 직접 재료다. 다만 직전 주 테슬라 사례처럼 **공개 이후 기대치가 하향 조정되는 패턴**도 있어 이벤트 자체를 호재로 단정하기 어렵다.
- **💽 마이크론 실적(9/30):** DRAM 계약가 **+50% 이상**, NAND **+60%** 전망이 실제 마진으로 확인되는지가 메모리 사이클 논쟁의 분기점이다.
