# 미국→한국 선점 2026-10-23 (미국 2026-10-23 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 75개 · 연결 종목 889개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 14개:** 정유·LNG·가스(격차 +12.8%p), 화장품·K뷰티(격차 +12.7%p), 유통·이커머스(격차 +12.7%p), AI 소프트웨어·에이전트(격차 +12.4%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 사이버보안, 물·환경, 철강·강관, 바이오텍·기술수출 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 의료AI·디지털헬스(-16.2%p), CDMO·바이오시밀러(-9.0%p), 유전체·유전자치료(-5.4%p)
- **이제 막 힘 붙는 조기 테마:** 우주·위성(조기 67), 은행·밸류업(조기 52), Marine Transportation(조기 49) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 한국가스공사(정유·LNG·가스, 점수 100), 한국콜마(화장품·K뷰티, 점수 91), S-Oil(정유·LNG·가스, 점수 91)
