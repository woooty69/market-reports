## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 5개:** Advertising(격차 +13.9%p), 태양광(격차 +9.3%p), 화장품·K뷰티(격차 +7.7%p), 스마트폰·애플 부품(격차 +7.1%p) — 이번 리포트의 핵심 선점 영역.
