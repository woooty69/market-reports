## 🗓 시장 요약

**① 증안펀드 기대에 코스피 +4.34%·코스닥 +8.13%…외국인 1조 1,584억원 순매수**
코스피는 0.37% 오른 4,728.80으로 출발해 장중 4,682.43까지 밀렸다가 증안펀드 증액·추가 출자 기대가 퍼지면서 오름폭을 키워 4,915.68에 마감했다. 외국인이 1조 1,584억원을 사들여 전날 순매도에서 돌아섰고, 개인은 1조 8,011억원을 팔았다. 기관은 연기금 2,883억원·투신 2,537억원·사모 1,798억원 순매수, 금융투자 5,491억원 순매도로 합계 2,333억원 매수 우위였다. 코스피 프로그램은 비차익 1조 1,100억원 순매수로 전체 1조 576억원, 코스닥 프로그램도 4,497억원 매수 우위였다.

**② 반도체 대형주 동반 급등…SK하이닉스·삼성전자 프로그램 6,000억원대 유입**
SK하이닉스는 5.41% 올라 거래대금 3조 2,001억원으로 1위였고 프로그램으로만 3,271억원이 들어왔다. 삼성전자는 역대 최대인 30조원 규모 배당금 지급일에 4.55% 올라 179,100원으로 마감했으며 프로그램 순매수는 3,105억원이었다. 한미반도체 +9.14%·주성엔지니어링 +14.36%·피에스케이홀딩스 +14.25%·리노공업 +12.09% 등 장비·부품주도 일제히 뛰었고, LS증권 집계 HBM 테마는 35종목 모두 올라 평균 +8.98%였다.

**③ 로봇·바이오·증권이 주도…삼성 휴머노이드 기대에 로봇주 상한가 속출**
삼성전자가 반도체 공장에 로봇 투입을 늘리고 휴머노이드를 공개할 것이라는 기대에 코스모로보틱스·제닉스로보틱스·앤로보틱스가 상한가, 클로봇 +29.87%·레인보우로보틱스 +13.70%였고 LS 로봇 테마는 82종목 중 78종목이 올라 평균 +9.00%였다. 바이오도 에이비엘바이오 +26.52%·리가켐바이오 +21.52%·올릭스 +17.79%로 불이 붙어 면역항암제 테마가 +11.60%로 1위였다. 증안펀드 추가 출자가 증권사 자기자본투자로 이뤄질 수 있다는 보도에 미래에셋증권 +15.87%·키움증권 +14.22%·한국금융지주 +13.49%가 급등했다.

**④ 은행·화장품·통신은 소외…금융지주 약세, 코스맥스 −6.39%**
증권주와 달리 금융지주는 증안펀드 출자 부담 우려 속에 KB금융 −0.21%·신한지주 −0.94%·하나금융지주 −0.84%·우리금융지주 −0.32%로 내렸다. 화장품은 에이피알이 닥터멜락신 운영사 브랜드501을 3,900억원에 인수한다고 발표한 다음 날 에이피알 자신은 +0.34%에 그쳤고 코스맥스 −6.39%·코스메카코리아 −5.63%·아모레퍼시픽 −2.46%가 밀렸다. KT −2.72%·신세계 −4.01%·KT&G −1.84%·DB손해보험 −2.55% 등 방어주도 약했다. 업종으로는 다각화된통신 −2.52%·백화점 −1.86%·담배 −1.73%가 하위였다.

**⑤ 환율 1,334원대로 하락…외국인 선물은 순매도, 야간선물 강보합**
원/달러 환율은 15시 30분 기준 4.8원 내린 1,337.9원으로 마감했고 18시 고시 환율은 1,334.10원(−9.90원)이다. 주간 코스피200 선물은 757.15(+4.18%)로 현물 대비 베이시스 −1.36이며, 외국인은 선물을 5,168계약 순매도하고 기관이 5,793계약 순매수했다. 미결제약정은 178,683계약으로 220계약 줄었고 월물 옵션 미결제는 콜 800(5,126계약)·풋 750(4,466계약)에 몰려 PCR 1.09다. 고객예탁금은 11/25 기준 83조 5,107억원으로 하루 1조 4,610억원 늘었고 신용잔고는 25조 4,123억원이다. 야간선물은 759.90(+0.36%, 18시 24분 현재)이고, 미국 지수 선물(S&P500 +1.42%·나스닥100 +2.32%)과 닛케이 +2.11%·상해종합 +3.73%·항셍 +2.11%로 아시아 증시가 동반 강세였다.

**⑥ 코스닥 +8.13% 사이드카…장 마감 후 공시도 줄이어**
코스닥은 장중 5%대 급등으로 10시 22분 매수 사이드카가 발동됐지만 오후에도 오름폭을 키워 8.13% 오른 708.99로 마쳤고, 기관이 5,875억원(금융투자 4,177억원)·외국인이 3,019억원을 순매수했다. 에코프로 +13.91%·에코프로비엠 +13.44%·삼천당제약 +14.12%·알테오젠 +9.40% 등 대형주가 동반 급등했다. 장 마감 뒤에는 금호건설의 LH 2,234억원 공급계약, 엑시콘의 샘씨엔에스 지분 744억원 양도, 현대엘리베이터의 현대무벡스 지분 블록딜 등이 공시됐고, GS건설의 에너지머티리얼즈 1,700억원 손실·파산 수순 보도도 나왔다. 미국에서는 트럼프 대통령이 실효관세율을 다시 높이고 중국 부품을 쓴 자동차 수입을 제한하는 방안이 보도돼 미중 갈등 재점화 우려가 남았다.

## 1. 업종별 흐름

### 🇰🇷 내일 개장 관전 포인트

*내일(11/28)은 토요일이라 다음 개장은 11월 30일(월)이다.*

1. **증안펀드 ‘기대’가 ‘확정’으로 바뀌는지** — 오늘 코스닥 +8.13%·증권주 급등은 증안펀드 증액 기대가 이끌었다. 29일 투자관리위원회에서 규모·가동 시점이 기대에 못 미치면 증권·코스닥 소형주부터 되돌림이 나올 수 있고, 반대로 확정되면 외국인·기관 매수가 이어질 수 있다.
2. **외국인 현물 매수 지속 여부** — 외국인은 코스피 현물을 1조 1,584억원 사고 프로그램 비차익으로 1조 1,100억원이 들어왔지만, 주간 선물은 5,168계약 순매도해 현·선물 방향이 엇갈렸다. 미국 블랙프라이데이 장에서 반도체주가 선물 상승(나스닥100 +2.32%)만큼 오르는지가 월요일 SK하이닉스·삼성전자 수급을 가를 것이다.
3. **옵션 매물대와 지수 레벨** — 월물 옵션 미결제가 콜 800(5,126계약)·풋 750(4,466계약)에 몰려 있어 코스피200 750～800 구간이 단기 범위로 의식될 수 있다. 오늘 종가 758.51은 하단 750 바로 위다.
4. **로봇·바이오 급등주 되돌림 위험** — 시총 1,000억원 이상·+10% 이상 종목이 187개, 상한가가 12개에 달할 만큼 쏠림이 컸다. 로봇은 흐름 전환 점검표상 하락 점검 3/7의 ‘하락’ 단계이고, 재료 없이 기사만 급증한 종목은 이후 약세 경향이 있다는 검증 결과가 있어 추격 매수는 위험하다.
5. **방어주·화장품의 반등 여부** — 은행·통신·담배·화장품은 급등장에서 소외됐다. 시장 반등이 이어질 때 이들 업종이 따라오는지, 아니면 위험자산 쪽으로 자금 이동이 계속되는지가 순환매 방향을 알려 준다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
