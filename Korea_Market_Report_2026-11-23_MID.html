## 🗓 시장 요약

**① 코스피 4,600선 붕괴·2거래일 연속 매도 사이드카 — 개인도 손 놓고 기관만 순매수**
코스피는 −2.8% 갭하락 출발 뒤 반등 시도가 4,759선에서 막혔고, 11시 30분대 4,600선을 내주며 매도 사이드카가 이틀 연속 발동됐다. 9월 23일 고점 대비 30% 넘게 내려온 상황에서 정부가 증안펀드 가동을 준비하고 있다는 보도에도 "약발이 안 먹혔다"는 평가가 나온다. 외국인 −2,247억원, 개인 −364억원 매도를 기관(+585억원)이 받는 구도이고, 코스피200 선물(713.70)은 현물(713.17)과 거의 같은 수준이다.

**② 반도체 — 미국 반도체 10%대 폭락 여파로 삼성전자 17만원대·SK하이닉스 104만원대**
삼성전자는 172,000원(−6.06%), SK하이닉스는 1,048,000원(−5.84%)으로 두 종목 거래대금이 합쳐 4조원을 넘었다. 엔비디아 SEC 회계 조사 보도와 AMD 공매도 리포트로 AI 밸류체인 전반에 투매가 번진 탓이다. 다만 장비·기판주는 주성엔지니어링(−5.03%) 정도를 빼면 심텍(−1.10%)·원익IPS(−1.52%)·이수페타시스(−2.16%)·삼성전기(−2.71%)로 지난 금요일 급락 뒤 낙폭이 줄었다.

**③ 주도·약세 업종 — IT서비스·건설 급락, 화장품·로봇·엔터만 버텨**
미국 전력망 비용 부담 우려로 AI 데이터센터 관련주가 한꺼번에 무너져 삼성에스디에스(−16.99%)·LG씨엔에스(−15.18%)·NHN(−19.93%)이 급락했고, 데이터센터 시공 기대가 컸던 GS건설(−15.88%)·삼성E&A(−11.77%)·현대건설(−10.73%)도 두 자릿수로 밀렸다. 반면 한중 FTA 후속협상에 따른 한한령 완화 기대로 에이피알(+8.07%)·스튜디오드래곤(+7.18%)이, 휴머노이드 테마로 휴림로봇(+30.00%)·빅웨이브로보틱스(+13.33%)·로보티즈(+3.43%)가 올랐다.

**④ 환율·해외 변수 — 원/달러 1,348원, 미국 지수 선물은 1%대 반등**
원/달러는 1,348.00원(+3.00원)으로 위험회피 속에서도 상승 폭이 크지 않다. 미국 지수 선물은 S&P500 +1.40%, 나스닥100 +1.51%로 금요일 급락분 일부를 되돌리고 있지만, 항셍(−1.81%)은 약세이고 일본은 휴장이다. 26일 한국은행 금통위에서 기준금리 25bp 인상(3.25%)이 유력하다는 채권 리포트가 잇따르는 점도 부담이다.

## 1. 업종별 흐름

**상승 업종** — 오전장에 오른 업종은 화장품(+0.41%, 상승 10/하락 53) 하나뿐이고, 담배(−0.06%)·다각화된소비자서비스(−0.31%)·인터넷과카탈로그소매(−0.70%)·도로와철도운송(−1.15%)이 상대적으로 덜 빠졌다. 종목으로는 에이피알(+8.07%)과 KT&G(−0.06%)가 방어했고, 로봇주(휴림로봇 +30.00%, 에이엘로봇 +14.97%)와 바이오 일부(큐로셀 +29.95%)에 개별 매수가 몰렸다.

**하락 업종** — IT서비스(−10.12%, 하락 111종목)·양방향미디어와서비스(−8.99%)·건설(−8.99%)·생명보험(−8.08%)·무선통신서비스(−6.78%)·전자제품(−6.77%)·석유와가스(−6.33%)가 가장 약하다. 삼성에스디에스(−16.99%)·NAVER(−9.84%)·카카오(−8.39%)·삼성생명(−8.37%)·SK텔레콤(−8.46%)·S-Oil(−6.27%)이 대표적이다.

**시장의 시선** — 오후장에는 ① 정부의 증안펀드 집행 시점과 추가 대책 발표 여부, ② 미국 지수 선물 반등이 이어질지, ③ 사이드카 뒤 개인 매수가 다시 들어오는지를 봐야 한다. 증권사 전략 리포트는 "금융위기급 가격대"(대신), "평균 회귀"(유진)처럼 분할 매수론과, AI 투자 지속성 재평가가 끝나야 반등한다는 신중론(메리츠·KB)이 맞서고 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 30종목

*① 오늘 새로 편입된 급등 대형주 6종목(1～6번) → ② 오전장 언론 최다 보도 24선(7～30번).*

**1. 휴림로봇 (090710) 5,720원 · 6,861억원 · +30.00% — 하락장 속 로봇주 강세에 상한가 직행**
코스피가 5% 넘게 빠진 가운데 휴머노이드·로봇 테마에 매수가 몰리며 장중 상한가(5,720원)에 올랐고 거래대금은 549억원으로 코스닥 상위권이다. 지난주 코스닥이 7%대 급락한 날에도 레인보우로보틱스가 12% 오르는 등 CES 2027 기대로 로봇주가 '피난처' 역할을 하고 있다. 같은 그룹 휴림에이텍(+29.81%)도 상한가이며, 회사 고유의 실적·수주 공시는 확인되지 않아 테마성 수급이라는 점은 유의해야 한다. 증권사 커버 리포트 없음

**2. 큐로셀 (372320) 27,550원 · 4,196억원 · +29.95% — 국산 1호 CAR-T '림카토' 12월 건강보험 적용에 상한가**
