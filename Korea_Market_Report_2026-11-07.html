## 🗓 시장 요약

**① '검은 금요일' 코스피 6.02% 폭락…서킷브레이커 뒤 5,000선 턱걸이**
코스피는 2.24% 내린 5,263.26으로 출발해 개장 직후 낙폭이 8%를 넘자 서킷브레이커가 발동됐고, 장중 4,911.28까지 밀려 5,000선을 잠시 내줬다. 금융투자를 중심으로 기관이 1조 7,092억원을 사들이며 낙폭을 줄였지만 324.11포인트(−6.02%) 내린 5,059.69로 마감했고, 외국인은 2조 6,892억원을 팔아 이틀 순매도가 6조원을 넘었다. 상승 종목은 365개에 그친 반면 하락 종목은 2,068개였다. 정부는 반대매매 연쇄를 막기 위해 신용융자 담보비율 유지 의무를 3개월 면제했고 증권사들도 담보비율을 낮추고 반대매매를 유예하기로 했다.

**② 반도체: SK하이닉스 −10.44%·삼성전자 −6.35%, 밤사이 SOX는 4.21% 반등**
SK하이닉스는 10.44% 내린 1,132,000원으로 이틀간 약 19% 빠졌고, 거래대금 8조 9,613억원으로 시장 1위였다. 삼성전자도 6.35% 내린 188,700원으로 '20만 전자'를 내줬지만 장 마감 후 노태문 사장이 주당 21만원에 3,000주를 사들였다. 장비·부품주에서는 피에스케이홀딩스(−13.11%)·ISC(−14.12%)·유진테크(−14.02%)·대덕전자(−10.78%)가 급락했다. 다만 밤사이 미국에서 필라델피아 반도체지수가 4.21%, 나스닥100이 1.35% 반등했고, 장 마감 뒤 NXT·시간외에서 SK하이닉스는 1,176,000원(−6.96%), 삼성전자는 193,500원(−3.97%)까지 낙폭을 줄였다.

**③ 강세 종목: 인터넷·IT서비스·통신·렌털, 'AI 규제 반사이익'과 개별 재료**
업종 상위는 도로와철도운송(+5.73%)·레저용장비와제품(+2.40%)·전문소매(+2.05%)·다각화된통신서비스(+1.38%)·IT서비스(+1.11%)·양방향미디어와서비스(+1.11%)였다. NAVER는 엔비디아의 1조 3,400억원 납입 완료로 3대 주주 등극 소식에 2.87% 올랐고, 미국 데이터센터 규제로 국내 데이터센터가 반사이익을 볼 것이라는 기대에 NHN(+15.62%)·삼성에스디에스(+6.34%)·LG씨엔에스(+2.07%)가 강했다. 통신주 LG유플러스(+5.21%)·KT(+2.90%)는 방어주로, 롯데렌탈(+10.40%)은 TPG로의 최대주주 변경과 목표가 상향으로 올랐다.

**④ 약세 업종: 전력기기·화학·증권·방산, 실적 충격까지**
전기장비(−7.29%, 33종목 중 28종목 하락)에서 효성중공업(−11.95%)·LS ELECTRIC(−10.25%)·두산에너빌리티(−9.33%)가 이틀째 급락했다. 증권(−5.15%)은 39종목 중 38종목이 내렸고 3분기 '어닝쇼크'를 낸 한국금융지주가 17.34% 폭락했다. 화학(−5.23%)은 엘앤에프(−12.60%) 적자 전환에 이어 장 마감 후 롯데케미칼(영업손실 2,814억원)·금호석유화학(영업손실 208억원)이 부진한 실적을 냈고, 우주항공과국방(−4.56%)은 LIG디펜스앤에어로스페이스의 영업이익 25% 감소 실적이 부담이다.

**⑤ 환율·해외 변수: 미국 고용 '깜짝 증가'·금리 인상 경계, 원/달러 1,363원**
미국 10월 비농업 고용은 16만 5천명 늘어 예상을 웃돌았고 실업률은 4.1%로 내려가 12월 금리 인상 가능성이 거론됐으며, 데일리 샌프란시스코 연은 총재는 추가 인상이 필요하다고 말했다. 그럼에도 금요일 뉴욕 증시는 S&P500 +0.31%·나스닥 +1.09%로 반등했고 VIX는 25.30으로 10.22% 내렸지만 다우는 0.46% 하락했다. 원/달러 환율은 15:30 기준 1,356.6원에서 하나은행 05:45 고시 1,363.0원으로 올라 외국인 수급 부담이 남았다. 트럼프 대통령은 백악관 비서실장을 스티븐 밀러로 교체했다.

**⑥ 코스닥: 5.03% 급락, 장비·의료기기 투매 속 AI·데이터센터 개별주 강세**
코스닥은 장 초반 매도 사이드카가 발동된 끝에 5.03% 내린 644.27로 마감했고, 외국인(−896억원)·개인(−1,222억원)이 팔고 기관(+2,069억원)이 샀다. 씨어스(−29.95%, 3분기 적자 전환)·인바디(−26.61%)·피노(−19.04%, 1,830억원 유상증자)가 급락한 반면 엘리스(+18.91%)·지엔씨에너지(+13.32%)·강원에너지(+9.95%)는 올랐다. 장 마감 후에는 파두의 203억원 SSD 컨트롤러 계약, 영화테크의 현대차향 815억원 컨버터 수주 등 개별 공시가 나왔다.

## 1. 업종별 흐름

**상승 업종** — 도로와철도운송(+5.73%, 롯데렌탈 +10.40%)·레저용장비와제품(+2.40%)·전문소매(+2.05%)·다각화된통신서비스(+1.38%, KT +2.90%·LG유플러스 +5.21%)·IT서비스(+1.11%, NHN +15.62%·삼성에스디에스 +6.34%)·양방향미디어와서비스(+1.11%, NAVER +2.87%·카카오 +0.31%)·무선통신서비스(+0.91%)·카드(+0.72%)가 올랐다. 다만 IT서비스도 116종목 중 33종목만 올라 업종 전체보다는 '규제 반사이익·방어·개별 재료' 종목으로만 매수가 몰린 장이었다.

**하락 업종** — 전기장비(−7.29%, 효성중공업 −11.95%·LS ELECTRIC −10.25%)·생명과학도구및서비스(−6.13%)·손해보험(−5.58%, 삼성화재 −7.36%)·화학(−5.23%, 엘앤에프 −12.60%)·반도체와반도체장비(−5.22%, 168종목 중 153종목 하락)·증권(−5.15%, 한국금융지주 −17.34%)·전자장비와기기(−5.09%)·우주항공과국방(−4.56%, 35종목 중 34종목 하락)·기계(−4.46%)가 크게 밀렸다. AI 데이터센터 투자 둔화 우려가 반도체·전력기기·기판·전선으로 번졌고 3분기 실적 부진주가 겹쳤다.

**시장의 시선** — 시장은 미국 민주당이 양원을 장악한 뒤 AI 데이터센터 신설 규제가 실제 법안으로 이어질지, 그리고 빅테크 투자 계획이 바뀔지를 가장 크게 보고 있다. 금요일 필라델피아 반도체지수가 4.21% 반등하고 야간선물이 1.60% 오른 만큼 다음 거래일엔 낙폭 과대 반도체·전력기기의 반등 시도가 예상되지만, 미국 고용 호조에 따른 금리 인상 경계와 외국인 순매도(이틀 6조원 이상)가 이어질지가 관건이다. 증권사들은 메모리 펀더멘털(장기공급계약·HBM 완판)은 견고하다며 '역사적 저평가 구간'을 강조하고 있고, 국내 데이터센터·AI 소프트웨어·통신은 규제 반사이익 테마로 묶여 움직이고 있다.

## 🧭 흐름 전환

*섹터 12개의 수치 점검표(하락 7·상승 5, 매일)와 Claude 주간 논지(리포트·뉴스·정책·유튜브). 점검표는 미리 정한 약속이지 매매 지시가 아니다 — 하락 점검 2개 = ⅓ 축소 검토, 3개 = 절반 검토, 가격 규칙은 논지보다 우선.*

1. **반도체 반등 강도**: 금요일 밤 필라델피아 반도체지수가 4.21%, 나스닥100이 1.35% 반등했고 코스피200 야간선물은 795.50(+1.60%)으로 마감했다. 월요일 SK하이닉스(NXT 1,176,000원)·삼성전자(시간외 193,500원)가 장후 가격대를 지키는지, 프로그램 매도(금요일 SK하이닉스 1조 4,650억원)가 멈추는지가 첫 시험대다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
