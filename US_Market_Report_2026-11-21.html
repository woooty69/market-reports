## 🗓 시장 요약

**① 나스닥 22,617.73(−5.28%)·S&P500 6,910.39(−3.70%)·다우 48,147.33(−1.93%) — 나스닥 연간 상승분 소멸, S&P500·다우 조정 진입**

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) −14.10% — 7거래일 연속 하락, 젠슨 황 사임·3분기 매출 \$1,158억에도 매수세 실종**
엔비디아는 \$125.40(−\$20.59, −14.10%)로 마감하며 7거래일 연속 내렸다. 시가 \$143.57에서 출발해 장중 저가 \$124.50까지 밀렸고, 실적 발표일인 11월 17일 이후 낙폭은 10%를 훌쩍 넘었다. 3분기 매출 \$1,158억(+103%)과 4분기 가이던스 \$1,300억은 시장 예상을 웃돌았지만, 11월 12일 젠슨 황의 CEO 사임 이후 콜레트 크레스 임시 CEO 체제와 10-Q 제출 지연, 중국 출하 중단 우려가 계속 주가를 눌렀다. D.A. 데이비드슨은 앞서 목표주가를 \$300에서 \$200으로 내리면서도 매수 의견은 유지했다.

**2. 앤트로픽 (ANT) −8.57% — 상장 2일차 장중 \$83.05, 공모가 \$83 방어선 시험**
앤트로픽은 \$88.85(−\$8.33, −8.57%)로 마감했다. 첫날 공모가 \$83에 9억8,000만 주를 팔아 \$813억을 조달하며 역대 최대 IPO를 기록했지만, 이틀째 프리마켓에서 6% 넘게 밀린 뒤 장중 저가 \$83.05로 공모가에 바짝 붙었다. 상장 첫날 시가 \$111.50과 비교하면 20% 넘게 내려온 셈이다. 회사가 공개한 9월까지 9개월 매출은 \$330억을 넘었지만, 시장은 AI 밸류에이션 부담에 더 무게를 뒀다. 옵션 거래는 11월 23일(월) 시작된다.

**3. AMD (AMD) −14.00% — 헌터브룩 공매도 보고서 후폭풍, 펌웨어 보안·중국 블랙리스트 우회 의혹 확산**
AMD는 \$420.72(−\$68.47, −14.00%)로 이틀 연속 급락했다. 전날 헌터브룩 캐피털이 공매도 리포트를 발표하며 AMD 칩이 수출 규제에도 중개상을 거쳐 미국 블랙리스트에 오른 중국 서버업체로 흘러갔을 가능성을 제기한 데 이어, 이날은 펌웨어 보안 문제까지 거론되면서 규제 리스크에 대한 매도가 커졌다. 장중 저가는 \$418.76이었고, 이틀 전 종가 \$530.14와 비교하면 20% 넘게 빠졌다.

**4. 마이크론 (MU) −14.17% — '메모리 부족 2028년까지' 전망에도 5거래일 20%대 하락**
마이크론은 \$592.59(−\$97.85, −14.17%)로 마감해 \$600선을 내줬다. 회사는 이번 주 메모리 공급 부족이 2028년까지 이어질 것이라고 밝혔고 엔비디아의 데이터센터 매출 \$1,076억(+110%)도 HBM 수요를 뒷받침했지만, 반도체 밸류에이션 우려와 메모리 수요 정점 논쟁이 이를 덮었다. 시가 \$665.62에서 장중 \$585.25까지 밀렸고, 최근 5거래일 하락률은 20%를 넘었다. SK하이닉스 ADR도 \$102.55(−13.97%)로 같은 흐름을 보였다.

**5. 인튜이트 (INTU) −12.95% — 1분기 실적 예상 상회에도 2027 회계연도 매출 가이던스 \$230억8,000만~233억7,000만으로 하향**
인튜이트는 \$269.86(−\$40.16, −12.95%)로 마감했다. 1분기 실적은 시장 예상을 웃돌았지만 회사는 2027 회계연도 매출 가이던스를 \$230억8,000만~233억7,000만으로 낮췄고, 2분기 매출과 조정 주당순이익(EPS) 전망도 컨센서스를 밑돌았다. 소비자 수요 둔화와 크레딧 카르마 성장 약화가 원인으로 꼽혔다. 장중 고가 \$300.44에서 저가 \$269.33까지 10% 넘게 미끄러졌다.

갭은 \$20.94(+\$2.15, +11.44%)로 마감해 올해 들어 가장 큰 상승률을 기록했고, 장중에는 \$22.16(+17.91%)까지 올랐다. 3분기 조정 EPS와 올드네이비·갭 브랜드의 동일점 매출이 예상을 넘었다. 애슬레타와 바나나 리퍼블릭은 부진했고 연간 조정 EPS 전망은 낮췄으며 순매출은 보합을 예상했지만, 핵심 브랜드 회복이 더 크게 반영됐다. 리처드 딕슨 CEO는 소비자가 견조하지만 까다롭게 고른다고 말했다.

코어위브는 \$39.39(−\$5.53, −12.30%)로 마감하며 기존 52주 저점 \$40.58을 밑돌았다. 3분기 매출은 \$36억6,000만(+168%)으로 예상을 넘었지만 순손실이 \$7억900만으로 커졌고, 4분기 이자비용 전망 \$10억5,000만~11억5,000만과 연간 설비투자 \$370억~390억 계획이 부채 부담 우려를 키우고 있다. 이틀 동안 낙폭은 17%를 넘었고, 같은 네오클라우드인 어플라이드 디지털(−18.49%)·아이렌도 동반 급락했다.

유나이티드헬스는 \$339.85(+\$9.37, +2.84%)로 사흘 연속 하락을 끊었다. CMS가 메디케어 어드밴티지 위험조정 감사에서 표본 오류를 전체 계약으로 외삽해 2027~2036년 약 \$902억을 환수할 수 있다는 규정안을 내놓은 뒤 이번 주 −10.21%, −5.55%로 급락했던 데 따른 반발 매수가 들어왔다. 장중 고가는 \$347.45(+5.13%)였고, 같은 규정안으로 밀렸던 휴매나도 \$389.91(+2.61%)로 올랐다. 기술주에서 빠진 자금이 방어 업종으로 이동한 흐름도 더해졌다.
