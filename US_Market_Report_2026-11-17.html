인텔은 \$56.68에서 출발해 저가 \$54.90(−7.98%)까지 밀린 뒤 \$55.47(−\$4.19, −7.02%)로 마감했다. 지난 금요일 경영진이 PC 판매 둔화와 과잉 재고, 데이터센터 공급 상황을 제대로 알리지 않았다며 주주 집단소송이 제기됐다. 인텔은 10월 29일 실적 발표에서 4분기 매출 가이던스를 시장 예상보다 낮은 \$150억~160억으로 제시해 이튿날 약 29% 급락한 바 있다. 팁랭크스 집계로 애널리스트 의견은 매수 7·보유 25·매도 1이며 평균 목표주가는 \$90.93이다.

**4. 마이크론 (MU) −7.62% — 상무부 원격 접근 규제 강화에 메모리주 동반 급락, 샌디스크 −8.58%**
마이크론은 \$735.06에서 출발해 고가 \$739.12(−5.04%)에 그친 뒤 저가 \$716.38 부근인 \$719.02(−\$59.29, −7.62%)로 마감했다. 상무부가 해외 데이터센터를 통한 첨단 반도체 원격 접근과 동남아 5개국 우회 수출을 조이는 규정을 발표하자, AI 서버용 고대역폭메모리(HBM) 수요 둔화 우려가 메모리주로 번졌다. 같은 날 샌디스크(SNDK)는 \$809.11(−8.58%), SK하이닉스 ADR(SKHY)은 \$122.18(−7.29%)로 함께 밀렸다. 마이크론은 지난 금요일에도 −2.52%로 내려 이틀간 약 10% 빠졌다.

**5. 타이슨 푸드 (TSN) +8.72% — 4분기 조정 EPS \$0.61(−47%)·2027회계연도 매출 3.5~5.5% 감소 전망**
타이슨 푸드는 \$60.90에서 출발해 고가 \$65.34(+11.08%)까지 오른 뒤 \$63.95(+\$5.13, +8.72%)로 마감했다. 2026회계연도 4분기 조정 주당순이익(EPS)은 \$0.61로 1년 전보다 47% 줄었고, 회사는 2027회계연도 매출이 3.5~5.5% 줄어들 것으로 전망했다. 이익 감소 폭이 컸지만 이미 낮아진 기대를 크게 벗어나지 않았다는 안도감에 매수세가 몰렸다. 경기방어 성격의 필수소비재로 기술주 매도 자금이 일부 옮겨온 점도 보탬이 됐다.

CG 온콜로지는 \$92.00에서 출발해 고가 \$93.95(+26.28%)까지 오른 뒤 \$84.78(+\$10.38, +13.95%)로 상승 폭을 줄여 마감했다. 초기 방광암 환자 367명을 대상으로 한 크레토스티모진 3상(PIVOT-006)에서 경과 관찰군 대비 재발 위험을 68% 낮춰 1차 평가 목표를 달성했다. 회사는 2027년 2분기 허가 신청을 계획하고 있다. 장중 고가 대비로는 10%가량 밀려 차익 실현 매물도 만만치 않았다.

**7. 레세오 테라퓨틱스 (LXEO) +12.54% — PKP2 심근병증 유전자치료 초기 데이터, 고용량군 빈맥 80% 감소**
레세오는 \$3.55에서 출발해 고가 \$4.30(+49.83%)까지 치솟은 뒤 \$3.23(+\$0.36, +12.54%)으로 마감했다. PKP2 변이 부정맥 유발성 심근병증 환자 10명의 초기 데이터에서 고용량 투여 7명의 짧은 빈맥 발작이 평균 80% 줄었다. 회사는 미 식품의약국(FDA)이 이 지표를 본임상의 주요 평가 변수로 쓰는 데 열려 있다고 밝혔다. 다만 표본이 작은 초기 결과라 장중 상승분의 상당 부분을 반납했다.

**8. 텔러스 (TU) +12.19% — 퀘베코르의 비구속적 인수 제안 접수, 독립위원회 검토**
텔러스는 \$9.60에서 출발해 고가 \$9.73(+14.07%)까지 오른 뒤 \$9.57(+\$1.04, +12.19%)로 마감했다. 캐나다 통신사인 텔러스 이사회는 퀘베코르로부터 회사를 인수하겠다는 요청하지 않은 비구속적 제안을 받았다고 밝혔고, 독립위원회가 내용을 검토하고 있다. 제안 가격 등 세부 조건은 공개되지 않았다. 장중 저가도 \$9.10(+6.68%)으로 하루 종일 강세를 유지했다.

서밋 테라퓨틱스는 \$12.70에서 출발해 저가 \$11.52(−18.55%)까지 밀린 뒤 \$11.82(−\$2.33, −16.47%)로 마감했다. FDA는 이보네시맙과 항암화학요법 병용의 폐암 적응증 신청에 대해 보완요구서한(CRL)을 보냈는데, 생존 기간 개선이 통계적으로 유의하지 않았다는 점이 문제가 됐다. 이보네시맙은 회사의 핵심 파이프라인이라 허가 일정 지연이 곧바로 기업가치에 반영됐다. 시가총액 \$100억 이상 대형주 가운데 이날 낙폭이 가장 큰 종목 중 하나였다.

샤오펑은 \$9.90에서 출발해 고가 \$10.08(+7.58%)까지 오른 뒤 \$9.68(+\$0.31, +3.31%)로 마감했다. 3분기 매출은 242억8,000만 위안(약 \$36억2,000만)으로 1년 전보다 19.1% 늘었다. 4분기 인도량 가이던스는 16만9,000~17만4,000대로 제시했지만, 3분기 순손실은 1년 전보다 커졌다. 기술주 급락 속에서도 상승 마감해 장중 고가 대비로는 상승 폭을 절반 이상 반납했다.
