## 🗓 시장 요약

**① 이틀 만에 5,000선 재붕괴 — 외국인·기관 1조 4천억원 동반 매도, 개인만 1.2조 순매수**
코스피는 4,928.51로 4% 넘게 갭하락 출발한 뒤 반등 시도가 4,971선에서 막히며 11:56 현재 4,892.27(−4.78%)까지 밀렸다. 외국인 −8,962억원과 기관 −5,407억원을 합친 1조 4천억원대 매도를 개인이 +1조 1,959억원으로 받아내는 구도다. 코스피200 선물(755.85)도 현물(758.39)보다 낮아 베이시스가 마이너스이고, 닛케이225(−4.49%)·항셍(−2.03%)까지 아시아 증시 전반이 위험회피에 휩쓸렸다.

**② 반도체 — 삼성전자·SK하이닉스 6%대, 기판·장비주 두 자릿수 급락**
삼성전자는 184,500원(−6.30%), SK하이닉스는 1,109,000원(−6.26%)으로 두 종목 거래대금이 각각 1조 4천억원대다. 세미애널리시스가 2028년 HBM 출하 전망을 30% 낮췄다는 소식과 AMD발 대중국 기술수출 논란, 미 상무부의 AI 칩 '원격 접근' 허가제가 투자심리를 눌렀다. 기판주는 이수페타시스(−15.54%)·대덕전자(−10.97%)·삼성전기(−10.85%)가, 장비·부품주는 리노공업(−12.36%)·이오테크닉스(−11.79%)·원익IPS(−11.34%)·한미반도체(−9.34%)가 급락했다.

**③ 주도·약세 업종 — 항공·은행·엔터 강세, 통신·전기장비·기계 급락**
한중 FTA 서비스·투자 후속협상 타결에 따른 한한령 완화 기대가 이틀째 이어져 한진칼(+10.65%)·아시아나IDT(+13.56%)·마녀공장(+14.65%)·에스엠(+5.05%)이 올랐고, 하락장 속 방어주로 KB금융(+1.31%)·신한지주(+1.87%)·한국전력(+3.76%)에 매수가 몰렸다. 반면 앤트로픽 상장 이후 재료 소멸 우려가 커진 SK텔레콤(−10.97%)과 두산(−11.93%)·HD건설기계(−13.58%)·LS ELECTRIC(−7.95%)·두산에너빌리티(−6.39%) 등 전력·기계주가 크게 밀렸다.

**④ 환율·해외 변수 — 원/달러 1,339원대, 미국 선물은 소폭 약세에 그쳐**
원/달러는 1,339.10원(+3.60원)으로 안전자산 수요에 소폭 올랐다. 미국 10월 생산자물가가 전년 대비 +6.5%로 4년 만의 최고를 기록하고 월러 연준 이사 등의 매파 발언이 이어지며 추가 금리 인상 우려가 커진 상태다. 다만 S&P500 선물(−0.15%)·나스닥100 선물(−0.47%)은 소폭 약세에 그쳐 오늘 밤 옵션만기·연준 인사 발언이 추가 변동성의 분수령이다.

## 1. 업종별 흐름

**상승 업종** — 항공사(+5.04%, 6종목 상승)가 가장 강하다. 한진칼(+10.65%)이 호반그룹과의 경영권 경쟁 속에 한한령 수혜 기대까지 겹치며 거래대금 908억원으로 뛰었고 한진칼우는 상한가다. 기타금융(+4.93%)·전기유틸리티(+2.28%, 한국전력 +3.76%)·은행(+1.23%, 우리금융지주 +2.05%·신한지주 +1.87%) 등 방어주가 뒤를 이었고, 방송과엔터테인먼트(+0.60%)도 에스엠(+5.05%)·스튜디오드래곤(+4.87%)이 끌어올렸다.

**하락 업종** — 전자장비와기기(−9.80%, 101종목 중 92종목 하락)와 반도체와반도체장비(−6.53%, 171종목 중 167종목 하락)가 가장 약하다. 무선통신서비스(−7.94%)는 SK텔레콤(−10.97%)이, 전기장비(−6.50%)는 LS ELECTRIC(−7.95%)이, 기계(−5.73%)는 HD건설기계(−13.58%)·두산에너빌리티(−6.39%)가 끌어내렸다. 비철금속(−4.93%)·석유와가스(−4.72%)·건설(−4.45%)도 4%대 하락이다.

**시장의 시선** — 오후장은 개인 매수가 외국인·기관의 1조 4천억원대 매도를 계속 받아낼 수 있는지가 관건이다. 코스피 4,888선(오전 저점)이 깨지면 낙폭이 5%를 넘길 수 있어, 반도체 대형주의 저가 매수 유입 여부와 외국인 선물 매매를 함께 볼 필요가 있다. 한한령 수혜(항공·엔터·화장품)와 금융·유틸리티 방어주의 강세가 오후에도 유지되는지도 확인할 대목이다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 27종목

*① 12시 현재 시총 1,000억원 이상 · +10% 이상 급등 ★ 5종목(1～5번) → ② 오전장 언론 최다 보도 22종목(6～27번).*

**1. 한진칼 (180640) 239,000원 · 15조 9,562억원 · +10.65% — ★ 호반과 0.1%p 지분 경쟁 속 한한령 완화·통합 대한항공 기대**
한진칼은 239,000원으로 10% 넘게 오르며 거래대금 908억원을 기록했고 우선주인 한진칼우는 상한가(+29.99%)다. 최근 호반그룹이 최대주주에 오르며 조원태 회장 측과 지분 차이가 0.1%p에 불과한 경영권 경쟁 구도가 부각됐고, 연말 표 대결 가능성이 지분 확보 수요 기대로 이어지고 있다. 한중 FTA 후속협상 타결로 항공 수요 확대 기대가 커진 데다 통합 대한항공 출범을 한 달 앞두고 지주사 브랜드 수입이 39% 늘었다는 점도 거론된다. 증권사 커버 리포트 없음

**2. 마녀공장 (439090) 16,590원 · 2,720억원 · +14.65% — ★ 한중 관계 개선 기대에 화장품주 급등**
마녀공장은 16,590원으로 14.65% 올라 코스닥 상승률 상위에 올랐고 거래대금은 260억원이다. 전날 한중 정상회담에서 FTA 서비스·투자 후속협상이 실질 타결되며 한한령 완화 기대가 커지자 화장품주가 이틀째 강세를 보이고 있고, 전날 한국화장품이 상한가를 기록한 데 이어 오늘은 삐아(+29.95%)도 상한가다. 중국 소비 회복과 수출 채널 확대 기대가 반영됐지만 실적으로 확인되기까지는 시간이 필요하다는 신중론도 함께 나온다. 증권사 커버 리포트 없음

**3. 바이오니아 (064550) 7,300원 · 1,884억원 · +12.83% — ★ 유럽서 '세미 RNA' 기술 경쟁력 부각**
바이오니아는 7,300원으로 12.83% 올랐다. 유럽 학회 등에서 자체 RNA 간섭 플랫폼인 '세미 RNA'가 전신 부작용을 최소화하는 기술로 주목받았다는 보도가 나오며 기술수출 기대가 커졌다. 코로나 이후 진단 매출 공백을 메우는 과정에서 3분기 실적이 엇갈렸다는 분석도 있어 시가총액 1,884억원 규모의 소형주 특성상 변동성에 유의할 필요가 있다. 증권사 커버 리포트 없음
