## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 5개:** Advertising(격차 +19.4%p), 방산(격차 +14.4%p), 조선·LNG선·함정 MRO(격차 +13.6%p), Computer Software: Prepackaged Software(격차 +7.9%p) — 이번 리포트의 핵심 선점 영역.

- **한국이 미국보다 앞서간 테마(과열 점검):** Biotechnology: Laboratory Analytical Instruments(-7.5%p), 비만치료제(-7.3%p)
