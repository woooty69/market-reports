## 🗓 시장 요약

**① S&P500 7,801.77(−0.22%)·나스닥 27,538.69(−0.22%)·다우 51,179.87(−0.66%) — 사상 최고 다음 날 금리 부담에 숨 고르기, 러셀2000 −1.31%로 하락 종목이 상승의 2배 이상**
수요일 미국 지수는 전날 S&P500과 나스닥이 함께 사상 최고 종가를 쓴 뒤 장기 금리가 다시 오르자 일제히 내렸다. S&P500은 **7,801.77(−17.16, −0.22%)**, 나스닥은 **27,538.69(−61.20, −0.22%)**, 다우는 **51,179.87(−341.41, −0.66%)**였고 나스닥100은 **31,160.08(−64.61, −0.21%)**였다. 장중 S&P500은 저가 7,763.34까지 밀렸다가 낙폭을 줄였고, 다우는 저가 50,917.42로 51,000선을 잠시 내줬다. 러셀2000은 **2,793.20(−1.31%)**로 대형주보다 더 크게 내렸고, 장 막판 하락 종목 비중이 약 68%로 상승 종목의 두 배를 넘었다. VIX는 15.08(+0.47%)로 소폭 올랐다. 캐피털닷컴의 다니엘라 하손은 3분기 S&P500 이익 증가율 기대가 30%에 가깝다면서도 금리가 오르는 가운데 "초대형 기술주 밖의 밸류에이션 부담이 높다"고 지적했다. 해석하면 지수 낙폭은 작았지만 소형주와 경기민감 업종이 더 크게 밀려, 고금리 부담이 좁은 랠리의 약한 고리부터 건드린 하루였다.

**② 10년물 장중 5.35%로 2002년 이후 최고, 5.29%(+1.9bp)·30년물 5.671%(+3.0bp)·2년물 4.777%(−1.4bp) — 9월 FOMC 의사록 "연내 추가 인상 예상"**
채권시장은 다시 장기물 중심으로 약세였다. 10년물은 장중 **5.35%**까지 올라 2002년 이후 최고를 찍었고 오후 2시 기준 **5.29%(+1.9bp)**로 52주 최고권에 머물렀다. 30년물은 장중 5.724%를 거쳐 **5.671%(+3.0bp)**, 2년물은 **4.777%(−1.4bp)**로 장단기 금리차가 약 51bp로 벌어졌다. 오후 2시 공개된 9월 FOMC 의사록은 위원들이 끈질긴 인플레이션에 대응해 연내 한 차례 더 금리를 올릴 것으로 예상하고 있음을 보여 줬다. 다만 다음 인상이 10월 28일 회의일지 12월 9일 회의일지는 정해지지 않았고, 위원들은 "열린 마음으로 각 회의에 임한다"며 데이터 의존을 강조했다. 케빈 워시 의장은 9월 인상을 물가가 2% 목표를 웃도는 상황에서 "완화의 일부를 걷어 내는" 조치로 설명했다. 시장은 이달 25bp 인상 확률을 약 20%로 반영하고 있다. 해석하면 의사록은 매파 기조를 재확인했지만 10월 인상 확률이 낮아 단기물은 안정됐고, 장기물은 공급·물가 우려로 계속 밀리는 '베어 스티프닝'이 이어졌다.

**③ WTI \$90.12·브렌트 \$102(장 초반 집계) — 멕시코만 폭풍과 사우디 공항 피격 등 중동 긴장에 브렌트 하루 만에 \$100 재돌파, 금 \$4,147.70(−0.94%)**
유가는 사흘 하락을 끝내고 반등했다. 장 초반 WTI는 **\$90.12(+0.76%)**, 브렌트는 **\$102(+1.40%)**로 브렌트가 하루 만에 다시 \$100 위로 올라섰다. 멕시코만에서 발달한 폭풍이 원유 생산 차질을 부를 수 있다는 우려와 사우디 공항 피격 등 중동 긴장이 겹쳤다. 콕스 오토모티브의 제러미 롭 수석 이코노미스트는 중동 분쟁과 "사상 최고 수준의 경유 가격, 빠르게 오르는 금리"가 중고차 도매가격을 압박하고 있다고 했다. 귀금속은 금 \$4,147.70(−0.94%), 은 \$60.40(−1.94%)로 금리 상승에 밀렸다. 해석하면 G7 비축유 방출 합의 이후에도 공급 차질 변수가 남아 있어 유가가 장기 금리의 하단을 받치는 구도가 이어지고 있다.

**④ AI·반도체 — SOX −1.15%, TSMC −2.09%·엔비디아 −0.74%·AMD −0.55%·마벨 −0.81%, 반면 마이크론 +4.06%·샌디스크 +1.92%로 메모리 일부 반등, SK하이닉스 ADR −2.36%**
필라델피아 반도체지수는 **13,066.15(−151.67, −1.15%)**로 저가 12,864.94에서 낙폭을 줄였다. 전날 사상 최고를 썼던 AI 연산 칩은 숨을 골라 엔비디아(NVDA)가 **\$237.47(−0.74%)**, AMD(AMD)가 \$645.86(−0.55%), 마벨(MRVL)이 \$284.68(−0.81%)였고 브로드컴(AVGO)은 \$376.51(+0.19%)로 강보합이었다. TSMC(TSM)는 \$472.20(−2.09%)로 내렸다. 스페이스X가 엔비디아 칩 구매를 위해 약 \$400억 규모의 자금 조달을 추진한다는 보도가 나왔지만 반도체 전반의 금리 부담을 넘지 못했다. 반면 메모리·저장장치는 사흘 급락 뒤 일부 반등해 마이크론(MU)이 저가 \$1,011.42에서 **\$1,088.00(+4.06%)**로 마감했고 샌디스크(SNDK)는 \$1,692.42(+1.92%), 시게이트(STX)는 \$807.57(+0.24%)였다. 웨스턴디지털(WDC)은 \$405.42(−1.37%), SK하이닉스 ADR(SKHY)은 \$178.25(−2.36%)로 약세가 이어졌다. 마이크론 반등의 개별 재료는 확인하지 못했다. 해석하면 금리 상승에 고밸류 반도체가 쉬어 가는 가운데 낙폭이 컸던 미국 메모리주에는 저가 매수가 들어왔지만 SK하이닉스 ADR로는 번지지 않았다.

**⑤ 회사 고유 재료 — 스카이댄스 −6.72%(워너브러더스 인수 마무리 이틀째), 컴포트 시스템즈 −4.21%(투자의견 하향), 스카이웍스 +0.77%(코보 \$220억 합병 마무리 단계), 암젠 +2.60%·길리어드 +1.82%, 맥도날드 −0.68%(AI 가격 책정 반독점 소송)**
파라마운트-스카이댄스 합병으로 출범한 스카이댄스(SKYD)는 전날 워너브러더스 디스커버리 인수를 마무리한 뒤 거래 이틀째 **\$8.89(−6.72%)**로 밀렸다. 데이터센터 냉난방·전기 설비 업체 컴포트 시스템즈(FIX)는 잭스 리서치가 투자의견을 '강력 매수'에서 '보유'로 내리자 \$1,741.36(−4.21%)로 하락했고, 출입 보안 업체 알레기온(ALLE)은 산업재 위험 회피 속에 \$147.91(−4.70%)로 내렸다. 스카이웍스(SWKS)는 코보와의 \$220억 합병이 마무리 단계에 들어서며 장중 +3.70%까지 올랐다가 \$83.43(+0.77%)로 마감했다. 바이오에서는 암젠(AMGN)이 \$413.08(+2.60%), 길리어드(GILD)가 \$146.85(+1.82%), 일라이 릴리(LLY)가 \$1,188.72(+2.70%)로 방어주 성격의 강세를 보였다. 맥도날드(MCD)는 AI 기반 가격 책정 도구를 겨냥한 연방 반독점 소송에 \$230.88(−0.68%)로 내렸다. 스포티파이(SPOT)는 \$512.92(+5.08%)로 올랐지만 개별 재료는 확인하지 못했다.

**⑥ 🇰🇷 SK하이닉스 ADR \$178.25(−2.36%)·SOX −1.15% — 오늘 10/8(목) 삼성전자 3분기 잠정실적, 10/9 한글날 휴장으로 이번 주 마지막 거래일**
미국에서는 SK하이닉스 ADR(SKHY)이 시가 \$178.27에서 저가 \$176.70까지 밀려 **\$178.25(−\$4.31, −2.36%)**로 마감해 나흘째 약세였다. 미국 메모리주 중 마이크론은 +4.06%로 반등했지만 SKHY와 TSMC(−2.09%)는 내렸다. 오늘 10/8(목)은 삼성전자 3분기 잠정실적(영업이익 컨센서스 약 108조원)이 나오는 날이며, 10/9(금) 한글날 휴장으로 이번 주 국내 증시의 마지막 거래일이다. 해석하면 미국 장기 금리가 2002년 이후 최고권에 머문 부담 속에 삼성전자 실적이 메모리 업황 우려를 덜어 줄 수 있느냐가 오늘 국내 반도체 방향을 가를 것이다.
