# 미국→한국 선점 2026-11-02 (미국 2026-10-30 마감 반영)

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** 방산(격차 +18.8%p), 석유화학(격차 +16.1%p), 조선·LNG선·함정 MRO(격차 +14.7%p), 바이오텍·기술수출(격차 +13.0%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** CDMO·바이오시밀러, 비만치료제, 의류 OEM·패션, 반도체 소재·부품 — 눌림 시 매수 관점.
