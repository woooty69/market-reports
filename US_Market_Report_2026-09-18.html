## 🗓 시장 요약

**① '인상 다음 날'의 안도 랠리 — 나스닥 +1.69%·S&P500 +1.14%·다우 +0.61%, 사흘 연속 하락을 끊었다**
연준이 3년 2개월 만에 기준금리를 3.75~4.00%로 올린 다음 날, 3대 지수는 일제히 반등했다. 다우는 **51,778.04(+316.14, +0.61%)**, S&P500은 **7,637.76(+85.95, +1.14%)**, 나스닥은 **26,418.30(+439.87, +1.69%)**로 마감했고 VIX는 15.44(−12.82%)로 급락했다(뉴스핌·아시아경제). 전날 워시 의장 회견 중 무너졌던 지수가 하루 만에 낙폭을 모두 되찾은 것으로, S&P500 편입 503종목 중 장중 259종목이 상승했다(TheStreet). 웰스얼라이언스의 로버트 콘조 CEO는 "시장이 연준의 인플레이션 대응에 '안도'한 것으로 보인다"면서도 고유가가 이어지면 소비자 가격 상승으로 인플레이션 억제가 어려워질 수 있다고 했다(아시아경제·블록미디어). 해석하면 전날 시장이 판 것은 '종착점을 말해주지 않은 워시'였고, 이날 산 것은 '금리와 유가가 동시에 내려간 하루'다 — 인상 경로에 대한 답이 나온 것이 아니라 가격 변수가 우호적으로 돌아선 것이므로, TheStreet Pro의 제임스 디포어가 "목요일 아침의 회복이 여기서부터 시장이 곧장 오른다는 뜻은 아니다"라고 한 경계는 유효하다.

**② 10년물 5% 아래로 — 8거래일 연속 상승 중단, 2년물도 밀렸지만 10월 인상 확률은 53.1%로 더 올랐다**
미국채 10년물 금리는 전날 5.018%에서 **4.93%**로 내려와 8거래일 연속 상승을 멈췄고(트레이딩이코노믹스·아시아경제는 전일 대비 7bp 하락으로 보도), 2년물은 **4.68%**, 30년물은 5.29%로 전 구간이 하락했다. 인베스팅닷컴은 "10년물이 9거래일 만에, 2년물이 8거래일 만에 처음 내렸다"고 정리했고, 주 초 기록한 2007년 이후 고점 5.04%에서 한 발 물러난 모양이다. 다만 금리 하락이 인상 기대의 후퇴는 아니다 — CME 페드워치의 **10월 25bp 인상 확률은 53.1%**로 전날 50.9%, 전주 27.2%에서 오히려 올랐다(뉴스핌). 이날 나온 주간 신규 실업수당 청구는 **1969년 이후 최저 수준에 근접**해 고용이 여전히 단단함을 보여줬고, 단독주택 착공과 주택 매매 계약도 증가했다(뉴스핌). 해석하면 채권시장은 '인상 시작'을 가격에 넣은 뒤 과매도를 되돌린 것이고, 단기물보다 장기물이 더 많이 내린 것은 유가 하락이 기대 인플레이션을 눌렀기 때문이다. 금요일 일본은행 결정(1.00→1.25% 인상 확률 80~90%)이 글로벌 금리의 다음 변수다.

**③ 유가는 이틀째 하락 — 사우디 "송유관 절반은 며칠 내, 전체는 6주 내 복구", WTI \$101.91·브렌트 \$104.82**
WTI는 **\$101.91(−0.51%, −\$0.52)**, 브렌트는 **\$104.82(−0.95%, −\$1.01)**로 이틀 연속 내렸다. 브렌트는 장중 한때 \$3 넘게 밀려 9월 10일 이후 최저를 찍은 뒤 낙폭을 줄였다(뉴스핌). 사우디가 손상된 동서 송유관 용량의 약 절반을 며칠 내, 전체를 6주 내 복구할 수 있다고 시사했고, 얀부 터미널 차질의 대안으로 오만 인근 해상 환적(ship-to-ship)을 통해 아시아 정유사에 추가 물량을 제안한 것이 이유다(트레이딩이코노믹스). 엑스니스의 크리스토퍼 타히르는 "중동 공급 차질 우려가 어느 정도 완화되면서 유가가 전날의 하락세를 이어갔다"고 했고, 트럼프 대통령은 7개월째인 이란 전쟁이 "바라건대" 끝에 가까워지고 있다고 말했다(TheStreet). 금 12월물은 \$4,399.70(+0.3%)로 반등했는데 하이리지 퓨처스의 데이비드 메거는 "에너지 가격이 상당히 큰 폭으로 내리면서 금 시장을 누르던 압력이 일부 걷혔다"고 설명했다. 다만 호르무즈 해협은 여전히 분쟁 항로이고 WTI는 한 달 새 +20%·1년 새 +60%라, 이틀의 하락은 '최악 시나리오의 후퇴'이지 \$100 아래 복귀가 아니다.

**④ 반도체가 반등을 이끌었다 — SOX +3.14%, 인텔 +7.67%(\$108.80), 젠슨 황 "내년 칩 판매량 2배"**
필라델피아 반도체지수는 **+3.14%**로 사흘 연속 올랐고 상승폭은 이번 주 최대였다(뉴스핌). 인텔(INTC)은 **\$108.80(+7.67%, +\$7.75)**에 거래량 1억 4,720만 주(20일 평균의 약 1.6배)로 미국 증시 거래대금 2위였다 — 타이그리스 파이낸셜이 목표가를 \$118에서 **\$145**로 올렸고(매수 유지), 노스랜드는 '시장수익률 상회'로 상향하며 \$120을 제시했으며, 멜리우스는 \$165 경로를 거론했다. SK하이닉스와의 제조 협력 보도와 국채금리 하락도 겹쳤다(ts2). 엔비디아(NVDA)는 젠슨 황 CEO가 스코틀랜드 AI 서밋에서 **"내년 칩 판매량이 두 배가 될 것"**이라고 말한 데 힘입어 +2.54%, 아마존(AMZN) +2.13%, 퀄컴(QCOM) +2.09%, 마이크로소프트(MSFT) +1.52%였다(아시아경제·CNBC·블룸버그). 반대편에서는 코어위브(CRWV)가 **30억 달러 전환사채 발행**을 발표해 −4.16%로 밀렸다. 해석하면 전날 '금리와 무관하게 공급이 모자란 것'으로 좁혀졌던 자금이, 금리가 내려오자 반도체 전반으로 다시 넓어진 하루다 — 다만 인텔의 목표가 상향들은 서로 다른 전제를 요구하며, \$145 이상은 외부 파운드리 고객(2분기 외부 매출 \$2.93억, 부문 매출의 5%)이 있어야 성립한다는 지적이 붙는다.

**⑤ 회사 고유 재료 — 제너락 +21.09%(아마존 \$24억 공급 계약), 플루언스 −16.85%(가이던스 하향), SEC 토큰화 주식 면제에 코인베이스·로빈후드 +5%대**
제너락(GNRC)은 아마존 데이터센터용 백업 발전기를 다년간 공급하는 **\$24억 계약**을 발표하고 **\$212.04(+21.09%)**로 마감했다(stockanalysis). 아마존은 계약의 일부로 제너락 주식 워런트를 받았고(CNBC는 최대 \$3.4억 규모 매입 권리로 보도), 캐너코드 제뉴이티는 총 주문이 최대 \$80억에 이를 수 있다고 봤다. 247월스트리트는 캐터필러(CAT) +2%·커민스(CMI) 보합을 들어 "동종 업체가 움직이지 않은 것이 단일 기업 이벤트라는 가장 분명한 신호"라고 썼다. SEC는 특정 거래 플랫폼에서 토큰화된 미국 주식 거래를 허용하는 **'혁신 면제'**를 5년 일몰 조건으로 즉시 발효했고, 서클(CRCL) +5.77%, 코인베이스(COIN) +5.75%, 로빈후드(HOOD) +5.16%가 반응했다(뉴스핌·TheStreet). 제너럴모터스(GM)는 록히드마틴 패트리엇 미사일 부품 납품 소식에 +2.76%, 유나이티드렌탈(URI)은 UBS의 최고확신 종목 편입에 장중 +9.53%였다. 하락 쪽은 플루언스에너지(FLNC)가 연간 가이던스 하향으로 장중 −16.85%, 코파트(CPRT)가 HSBC의 '보유' 하향에 −2.99%, 센티넬원(S) −3.49%(투자의견 하향)였다(TheStreet, 장중 기준).

**⑥ 🇰🇷 SKHY +4.64%(\$182.99)로 미국이 끌고, 국내는 SK하이닉스 −0.80%·외국인 7거래일째 −2.3조원 — 괴리율 +36.2% → +45.1%로 6회 만에 확대 반전**
SK하이닉스 ADR(SKHY)은 시가 \$181.98, 고가 \$185.33, 저가 \$181.26을 거쳐 **\$182.99(+4.64%, +\$8.12)**로 마감했고 거래량은 1,654만 주, 시간외는 \$183.41(+0.23%)이었다(stockanalysis). 인텔 +7.67%·SOX +3.14%·젠슨 황의 '판매량 2배' 발언이 같은 방향으로 실렸다. 반면 국내는 먼저 밀렸다 — 9/17 코스피는 **6,715.41(−0.04%, −2.56)**로 약보합, 코스닥은 822.18(+0.76%)이었고, 외국인은 코스피에서 **약 −2조 2,800억~−2조 4,600억원**(서울경제·뉴스핌 집계 차이)으로 7거래일 연속 순매도했다. 기타법인 +1조 7,045억원(삼성전자·SK하이닉스 자사주 약 6,800억원 매입 포함)이 매물을 받았고 기관·개인도 소폭 순매수였다. 삼성전자(005930) −0.39%, SK하이닉스(000660) **−0.80%(약 1,743,000원)**, 삼성전기(009150) −3.69%, SK스퀘어(402340) −1.18%가 내렸고 KB금융(105560) +1.41%, 현대차(005380) +0.28%가 올랐다. 원/달러는 **1,382.2원(+13.6원)**으로 급등했다(뉴스핌). SKHY 괴리율은 +36.2%에서 **+45.1%**로 8.9%p 확대됐다 — ADR +4.64%, 국내 −0.80%, 원화 약세 +1.0%가 모두 같은 방향으로 작용한 결과로, 5회 연속 축소 뒤 첫 확대이며 9/4의 +45.1% 수준으로 되돌아갔다. 코스피200 야간선물은 작성 시점에 시세 소스가 갱신되지 않아 확인하지 못했다.

- **가상자산·핀테크** — 서클(CRCL) +5.77%, 코인베이스(COIN) +5.75%, 로빈후드(HOOD) +5.16%. SEC의 토큰화 주식 '혁신 면제'(5년 일몰) 즉시 발효가 촉매이며, 전날 은행·핀테크 급락의 되돌림 성격도 있다.

**하락 업종·종목**
- **AI 클라우드 자금조달** — 코어위브(CRWV) −4.16%(30억 달러 전환사채). 전날 닷새 하락을 끊었던 네오클라우드가 다시 희석 부담으로 밀렸다.
- **에너지 저장·보안 소프트웨어** — 플루언스에너지(FLNC) 장중 −16.85%(연간 가이던스 하향), 센티넬원(S) 장중 −3.49%(투자의견 하향), 파이브나인(FIVN) 장중 −3.54%(차익실현).
- **에너지** — WTI −0.51%·브렌트 −0.95%로 이틀째 하락. 전날 −3% 급락 뒤라 낙폭은 제한적이었으나 업종별 종가 등락률은 이번 회차에 확인하지 못했다.

**🇰🇷 [전달]** 전날과 방향이 뒤집힌 회차다. 9/17 국내 정규장은 '매파 FOMC' 경계로 반도체가 먼저 밀렸고(SK하이닉스(000660) −0.80%·삼성전자(005930) −0.39%·삼성전기(009150) −3.69%), 그 뒤 미국은 SOX +3.14%·SKHY +4.64%·인텔 +7.67%로 반대 방향의 답을 냈다. 따라서 반도체의 전달 잔여분은 양(+)이다 — SKHY 괴리율이 +36.2%에서 +45.1%로 벌어진 것 자체가 '미국이 먼저 올랐고 국내가 아직 반영하지 않았다'는 뜻이며, 원/달러 +13.6원(1,382.2원)이 그 괴리의 약 1%p를 설명한다. 전날 국내에 새로 전달될 것으로 본 은행·운송·에너지 약세는 하루 만에 완화됐다(미국 금리·유가 동반 하락, 국내 KB금융(105560) +1.41%). 금리 경로에서는 10년물 4.93%·VIX 15.44가 위험선호 회복 쪽이지만, 달러 강세와 원화 급락은 외국인 현물 매도(7거래일 연속)를 멈추게 하는 조건이 아직 아니다. 코스피200 야간선물은 이번 회차에 수치를 확인하지 못해 개장 방향의 직접 근거로 쓰지 않는다.

**🇰🇷 [수급]** 외국인은 코스피에서 약 −2.3조~−2.5조원으로 7거래일 연속 순매도했고, 강도는 전날 −1조 6,809억원보다 커졌다 — 누적은 약 14조원대다. 기타법인 +1조 7,045억원(자사주)이 이틀째 최대 매수 주체였고 기관·개인은 수천억원대 순매수에 그쳤다(서울경제·뉴스핌). SK하이닉스(000660)는 장중 고가 1,785,000원·저가 1,735,000원, 거래량 약 371만 주, 외국인 지분율 50.20%였다(톱스타뉴스). 전날 제시한 '매도 클라이맥스 통과'의 확정 조건(FOMC 이후 첫 거래일 외국인 순매수 전환)은 **충족되지 않았다** — 외국인 매도가 오히려 확대됐기 때문이다. 다음 확인 지점은 미국 반도체 급반등을 받은 9/18 외국인 부호이며, 원/달러 1,380원대 안착 여부가 함께 본다.

**시장의 시선** — 하루 만에 질문이 "25bp가 충분한가"에서 "최악은 지나갔는가"로 바뀌었다. 금리(10년물 4.93%)와 유가(WTI \$101.91)가 같은 날 내려오자 전날 팔렸던 것들이 되돌려졌고, 반도체는 그 위에 회사 고유 재료(인텔 목표가 상향·엔비디아 판매량 2배·SK하이닉스 미국 생산 협의)가 얹혔다. 그러나 페드워치의 10월 인상 확률은 53.1%로 더 올랐고 실업수당 청구는 1969년 이후 최저 부근이다 — 경기가 강해서 금리가 오르는 구도는 그대로다. 앱터스 캐피털의 데이비드 와그너는 "지금 투자자의 가장 큰 위험은 충분히 위험을 지지 않는 것"이라고 했고, 디포어는 공급 측 인플레이션(유가·지정학)은 금리 인상으로 풀리지 않는다고 했다. 한국 시장에는 '미국 반도체 급반등'과 '원화 1,382원·외국인 7일 연속 매도'가 동시에 도착한다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 인텔 (INTC) +7.67% — \$108.80, 타이그리스 목표가 \$118→\$145·노스랜드 '아웃퍼폼' 상향(\$120) — 거래량 1억 4,720만 주로 미 증시 2위**
인텔은 \$108.80(+\$7.75, +7.67%)로 마감했고 거래량 1억 4,720만 주는 20일 평균의 약 1.6배였다(ts2). 타이그리스 파이낸셜이 매수 의견을 유지하며 목표가를 \$118에서 \$145로 올렸고, 노스랜드는 투자의견을 아웃퍼폼으로 상향하며 \$120을, 멜리우스는 \$165에 이르는 경로를 제시했다. 새로운 실적 발표는 없었으며 전날 로이터가 보도한 SK하이닉스와의 오하이오 팹 임차·합작법인 협의, 반도체 업종 전반의 강세, 국채금리 하락이 함께 작용했다. ts2는 \$120은 프로세서 사업만으로 가능하지만 그 이상은 "투자자들이 인텔 파운드리에 실질 가치를 부여해야" 한다고 짚었다 — 2분기 파운드리 부문 매출 \$57.7억 중 외부 매출은 \$2.93억(약 5%)에 그쳤고 영업손실은 \$20.9억(전년 \$31.7억에서 축소)이었다. 이틀간 상승률은 약 12%다.

**2. 제너락 (GNRC) +21.09% — \$212.04, 아마존 데이터센터 백업 발전기 \$24억 다년 공급 계약 + 아마존의 워런트 취득**
제너락은 아마존 데이터센터에 백업 발전기를 다년간 공급하는 \$24억 규모 계약을 발표했다. 아마존은 계약의 일부로 제너락 지분 워런트를 받았고 CNBC는 이를 최대 \$3.4억어치 주식 매입 권리로 보도했다. 주가는 전날 시간외에서 40% 넘게 뛰었다가 프리마켓 +30.1%, 장중 +16~21%를 거쳐 \$212.04(+21.09%)로 마감했다(stockanalysis·TheStreet). 캐너코드 제뉴이티는 총 주문이 최대 \$80억에 이를 수 있다고 봤고, CNBC는 "월가는 이 발전기 주식이 더 갈 수 있다고 본다"고 전했다. 247월스트리트는 캐터필러(CAT) 약 +2%·커민스(CMI) 보합, 산업재 ETF(XLI) 보합을 근거로 업종 재평가가 아닌 단일 기업 이벤트로 규정하면서 "고객이 공급사의 지분을 가지면 향후 가격 협상의 계산이 달라진다"는 워런트 희석·협상력 리스크를 지적했다.

**3. 엔비디아 (NVDA) +2.54% — 젠슨 황 "내년에 칩을 두 배로 팔 것", 스코틀랜드 AI 서밋 발언**
젠슨 황 CEO는 스코틀랜드에서 열린 AI 서밋에서 엔비디아가 내년에 올해의 두 배에 해당하는 칩을 판매할 것으로 예상한다고 말했고, AI 안전성 테스트의 필요성도 함께 언급했다(CNBC·블룸버그·폭스비즈니스). 주가는 발언 직후 약 +2%에서 +2.54%로 마감했다(아시아경제). 이번 주 초 'AI 투자 속도조절' 논쟁으로 눌렸던 AI 반도체 심리를 공급자 본인이 정면으로 반박한 셈이며, 아마존(AMZN) +2.13%, 마이크로소프트(MSFT) +1.52% 등 하이퍼스케일러가 동반 상승했다. 메모리 관점에서는 GPU 출하 두 배가 HBM 수요 두 배에 가까운 의미라 SKHY +4.64%의 직접 배경이 됐다.

**4. SK하이닉스 ADR (SKHY) +4.64% — \$182.99 (괴리율: +45.1%), 국내 원주 −0.80%와 엇갈리며 괴리율 8.9%p 확대**
SKHY는 시가 \$181.98·고가 \$185.33·저가 \$181.26에서 \$182.99(+\$8.12, +4.64%)로 마감했고 거래량은 16,543,926주, 시간외 \$183.41(+0.23%)이었다(stockanalysis). 애널리스트 15명 평균 목표주가는 \$248.43(현재가 대비 +35.8%)이다. 같은 날 국내 SK하이닉스(000660)는 외국인 매도 속에 −0.80%(약 1,743,000원)로 밀렸고, 서울경제는 "인텔과 미국 반도체 동맹 기대에 주식 초고수들이 SK하이닉스를 담고 삼성전자를 팔았다"고 전했다. 괴리율은 +36.2% → **+45.1%**로 5회 연속 축소 흐름이 끊겼다 — ADR 상승(+4.64%)이 확대의 절반 이상을, 원화 약세(+1.0%)와 국내 하락(−0.80%)이 나머지를 만들었다.

**5. 코어위브 (CRWV) −4.16% — 30억 달러 전환사채 발행 발표**
코어위브는 \$30억 규모 전환사채 발행 계획을 발표해 장중 −4.69%, 종가 −4.16%로 밀렸다(TheStreet·뉴스핌). 전날 네비우스와 함께 닷새 하락을 끊고 +4% 반등한 지 하루 만이며, 금리 인상 국면에서 네오클라우드의 자금조달 비용과 주식 희석이 다시 쟁점이 됐다. 같은 날 엔비디아·인텔·델 체인이 오른 것과 대비되어 'AI 수요'와 'AI 자금조달'이 다른 거래임을 보여줬다.

**6. 코인베이스 (COIN) +5.75% — SEC, 토큰화 미국 주식 거래 '혁신 면제' 즉시 발효(5년 일몰)**
SEC는 특정 거래 플랫폼에서 토큰화된 미국 주식을 거래할 수 있는 규제 경로를 여는 혁신 면제(Innovation Exemption)를 즉시 발효했고 5년 일몰 조항을 뒀다(TheStreet). 서클(CRCL) +5.77%, 코인베이스 +5.75%, 로빈후드(HOOD) +5.16%가 올랐다(뉴스핌). 전날 코인베이스 −4.42%·로빈후드 −5.46%의 급락분을 하루 만에 되돌린 폭이다.

**7. 플루언스에너지 (FLNC) 장중 −16.85% — 연간 가이던스 하향**
에너지 저장장치 업체 플루언스는 연간 가이던스를 낮춰 프리마켓 −22.22%, 장중 −16.85%를 기록했다(TheStreet, 종가는 확인하지 못함). 같은 'AI 전력' 테마에서 제너락이 +21%로 오른 날이라 수주 가시성의 차이가 그대로 주가 차이가 됐다.

**8. 유나이티드렌탈 (URI) 장중 +9.53% — UBS 최고확신 종목 리스트 편입**
UBS가 유나이티드렌탈을 최고확신(high-conviction) 리스트에 추가하면서 장중 +9.53%까지 올랐다(TheStreet, 종가는 확인하지 못함). 전날에도 +1.73%로 산업재 내 강세 종목이었고, 데이터센터·인프라 건설 장비 임대 수요가 논거다.

**9. 제너럴모터스 (GM) +2.76% — 록히드마틴 패트리엇 미사일 부품 납품**
GM은 록히드마틴의 패트리엇 미사일용 부품을 납품한다는 소식에 +2.76%로 마감했다(뉴스핌). 7개월째 이어지는 중동 전쟁으로 방공 미사일 증산이 과제가 된 가운데 자동차 업체의 방산 공급망 편입 사례로 보도됐다.

**10. 모더나 (MRNA) 장중 +9.39% — 머크와 공동 개발한 mRNA 암 백신 3상(INTerpath-001) 1·2차 평가지표 충족**
머크·모더나는 개인맞춤형 mRNA 암 백신 인티스메란(intismeran autogene, V940/mRNA-4157)과 키트루다 병용요법이 절제된 IIB~IV기 흑색종 환자 1,137명 대상 3상에서 무재발생존(RFS)과 무원격전이생존(DMFS) 평가지표를 충족했다고 발표했다(머크·바이오스페이스). RBC는 "연말 판독을 예상했던 만큼 놀랍도록 긍정적"이라고 했고, 두 회사는 이 데이터로 FDA와 허가 신청을 논의한다. 이날 장중 등락률은 +9.39%였으며(TheStreet), 발표 직후의 프리마켓 급등 폭은 매체마다 달라 종가 기준 수치는 확인하지 못했다.
