## 🗓 시장 요약

**① 지수는 반등했는데 반도체만 또 빠졌다 — 이번 주 SOX −5.45%**
다우가 **+514.71p(+0.98%, 53,277.01)**, S&P 500이 +0.43%, 나스닥이 +0.43%로 3대 지수가 하루 만에 모두 반등했다. 그런데 **필라델피아 반도체지수는 −0.51%(11,739.82)**로 홀로 밀렸다. 엔비디아가 **−0.98%로 6거래일 연속 하락**했고 인텔 **−2.24%**, 마이크론 **−0.77%(\$966.78)**, 웨스턴디지털은 2% 넘게 빠졌다. 지수 반등의 실체는 강세 전환이 아니라 **낙폭 과대에 따른 기술적 매수**였고, 8/26 엔비디아 실적을 앞둔 경계심이 반도체에만 집중됐다. 주간으로 보면 SOX는 **−5.45%**로 3대 지수(−0.85%~−2.05%)보다 훨씬 크게 무너졌다.

**② 반등의 연료는 '너무 강한' 미국 경기지표였다**
S&P글로벌 8월 미국 **서비스업 PMI가 20개월 만에 최고 속도**로 성장했고, 전체 기업활동 증가세도 **4년여 만에 가장 강했다**. 제조업은 재고 축적 둔화와 이란 전쟁발 공급 차질로 약해졌지만 서비스업이 이를 상쇄했다. 통상 강한 지표는 금리를 밀어올려 주식에 부담이지만, 이날은 **"미국 경제가 아직 버틴다"**는 해석이 우세했다. 크리스 자카렐리 노스라이트애셋 CIO는 **"시장이 잠시 숨을 돌리고 있다"**며 **"이번 주는 국채금리 상승과 베선트 재무장관의 개입을 둘러싸고 오르내린 시소 같은 한 주"**였다고 평가했다.

**③ 재무부 바이백의 유효기간은 정확히 하루였다**
8/19 재무부가 장기물 바이백을 최소 두 배 확대하겠다고 발표한 뒤 금리가 급락하고 증시가 올랐지만, 8/20에 금리가 되오르며 증시가 밀렸고 이날도 **10년물 4.734%(+2.6bp)**, **30년물 5.273%**로 재상승했다. 2년물도 **4.240%(+4.8bp)**로 올랐다. 패트릭 암스트롱 플루리미웰스 CIO는 **"30년물 금리를 통제하려 할 때는 무제한 대차대조표를 가진 연준이 아닌 이상 결국 시장이 이기게 돼 있다"**고 못 박았다. 시장이 보는 원인은 바이백이 손댈 수 없는 것들 — **인플레이션 불확실성, 재정적자, 국채 공급, 기간 프리미엄**이다.

**④ 브로드컴이 최대 1,000억 달러를 빌린다 — AI 부채 사이클의 분기점**
블룸버그는 브로드컴이 앤스로픽 등에 공급할 AI 칩 자금을 위해 **600억 달러 이상**의 신규 부채를 협의 중이며, 모든 조각을 합치면 **최대 1,000억 달러**에 이를 수 있다고 보도했다. 선순위 약 **450억 달러**, 후순위 약 **350억 달러** 구조로 블랙스톤과 아폴로가 참여를 논의 중이다. 성사되면 **AI 붐과 연결된 기업 금융 중 역대 최대급**이다. 브로드컴 주가는 **+1.21%**로 올랐지만, 같은 날 브로드컴 CDS(신용부도스와프) 프리미엄이 급등했다 — **AI 설비투자가 자기자본에서 부채로 넘어가는 국면**임을 신용시장이 먼저 반응한 것이다.

**⑤ 유가 6거래일 연속 상승 — 주간 WTI +5.66%, 브렌트 +6.39%**
트럼프 대통령이 이란과 거래하는 국가에 경제 제재를 경고하면서 공급 차질 우려가 커졌다. 브렌트유는 **6거래일 연속 올라 배럴당 94달러대**, WTI는 87달러대를 기록했다. 주간 상승률은 브렌트 **+6.39%**, WTI **+5.66%**다. 유가가 인플레이션을 다시 자극하면 연준의 인하 여력이 줄고 장기금리에는 추가 상승 압력이 된다. **금리·유가·주식의 삼각 압박**이 이번 주 내내 반복된 구조이며, 다음 주에도 해소될 재료가 보이지 않는다.

**⑥ 한국은 이틀 연속 폭발했다 — 삼성 110조 주주환원, 그런데 야간선물은 −2.29%**
SK하이닉스의 40조원 자사주 소각에 이어 **삼성전자가 2026년 최대 110조원(약 800억 달러) 주주환원**을 발표했다. 현금배당만 **30조원**이다. 한국 양대 메모리의 주주환원 공식화 규모가 **최소 130조원**에 달한다. SK하이닉스(000660)는 **+2.31%(1,730,000원)**로 이틀 연속 올라 시가총액 **1,263조원**을 회복했고, 코스피는 **+0.88%(6,912.95)**로 6,900선을 되찾았다. 그러나 코스닥은 **−4.63%(801.94)**로 매도 사이드카가 발동됐고, **코스피200 야간선물은 −2.29%(1,074.55)**로 금요일 정규장 종가(1,099.70)를 크게 되밀었다. 원/달러는 **1,386.5원(−6.1원)**으로 11개월 최저권이다.

> *어제 판정 복기 — **방향은 맞았고 이번엔 폭도 크게 틀리지 않았다.** '갭다운 출발 후 낙폭 축소 시도'를 기본으로 보되 폭은 단정하지 않겠다고 했다. 실제 코스피는 장초반 6,820선까지 밀렸다가 **+0.88%(6,912.95)** 상승 마감했고, SK하이닉스는 **+2.31%**로 예고한 '지수 대비 방어'에 부합했다. 다만 **코스닥 −4.63%와 매도 사이드카는 전혀 예상하지 못했다** — 반도체 대형주로의 쏠림이 중소형주에서 자금을 빨아들이는 구조를 시야에 넣지 않았다. 지수 판정을 코스피 하나로만 하는 습관을 고쳐야 한다.*

## 🏭 섹션 1. 업종별 흐름

**상승 ①  암호화폐 관련주 (이날 최강)**
비트코인이 장중 **+9.4%까지 치솟아 7만 9,000달러를 넘어섰고** 종가 기준 **\$77,065(+6.06%)**를 기록했다. 주간 상승률 20%대로 **2년여 만의 최대 주간 상승**이다. 로빈후드 **+13.70%**, 코인베이스 **+8%**, 스트래티지 **+6.1%**. 번스타인은 **"비트코인의 강한 상승 촉매는 재무부의 장기물 바이백"**이라며 유동성 확대 기대를 지목했다.

**상승 ②  자동차·모빌리티**
테슬라가 **+5.14%(\$362.86)**로 급등했다. 네바다 교통당국이 **클라크 카운티(라스베이거스)에 사이버캡 최대 5,000대** 배치를 허용하는 상업용 로보택시 인가를 만장일치로 승인했고, 스웨덴 물류기업 아인라이드로부터 **클래스8 세미 트럭 500대** 수주를 발표했다.

**상승 ③  헬스케어·바이오**
모더나가 **+17%**대로 재급등했다. 8/19 흑색종 3상 성공 이후 8/20 −23.55%로 되밀렸던 주가가 다시 올랐다. O-I글래스는 씨티 투자의견 상향으로 **+11%**, 소비재에서는 BJ's홀세일이 실적 호조로 **+4%**대 상승했다.

> 🇰🇷 [전달] 미국 헬스케어·소비재 강세는 국내 파급이 제한적이다. 다만 **모더나의 mRNA 항암 백신 3상 성공은 국내 바이오 CDMO·mRNA 밸류체인에 중장기 재료**로 남는다.

**하락 ①  반도체 (이번 주 최약)**
SOX **−0.51%**, 엔비디아 **−0.98%(6거래일 연속 하락)**, 인텔 **−2.24%**, 마이크론 **−0.77%**, SMH ETF −0.40%. 반면 브로드컴 **+1.21%**, AMD **+0.81%**, TSMC **+0.7%**로 종목별 차별화가 나타났다. 주간 −5.45%.

> 🇰🇷 [전달] 미 반도체 약세에도 국내는 주주환원 재료로 버텼다. 그러나 **8/26 엔비디아 실적이 국내 메모리주의 다음 방향을 가른다** — 주주환원은 밸류에이션 하단을 받칠 뿐 상단을 만들지 못한다.

**하락 ②  메모리·스토리지**
마이크론 **−0.77%(\$966.78)**, 샌디스크 −0.28%, 웨스턴디지털 −2%대. SK하이닉스 ADR만 **+0.20%**로 강보합을 지켰다. 엔비디아 실적 경계감이 HBM·AI 메모리 전반의 변동성을 키웠다.

**하락 ③  보안·전자시스템**
OSI시스템즈가 **−7%**대로 급락했다. 회계 4분기 매출 **\$4억 8,410만**이 컨센서스 \$5억 2,970만을 크게 밑돌았고, FY2027 매출 가이던스도 시장 기대에 미달했다.

**[판정]** **강보합 출발, 종목별 양극화가 계속된다.**

## 💬 섹션 3. 구루·기관 코멘트

- **패트릭 암스트롱(플루리미웰스 CIO) — "결국 시장이 이긴다."** 베선트 재무장관의 바이백 전략에 대해 **"아마 역효과가 났고 오히려 추가 조치를 해야 하는 상황으로 몰았을 것"**이라며, **"30년물 금리를 통제하려 할 때는 무제한 대차대조표를 가진 연준이 아닌 이상 결국 시장이 이기게 돼 있다"**고 지적했다.
- **레오 켈리(버던스캐피털 CEO) — "10년물 6~7%면 문제가 된다."** 시장이 10년물 4~5%에는 적응했지만 **"어떤 사건으로 이 범위를 돌파해 6~7%로 간다면 시장은 좋지 않게 반응할 것"**이라며, 장기금리 상승과 중동 긴장이 지속되면 **가을께 증시가 조정 영역에 진입**할 가능성을 경고했다.
- **마크 말렉(뮤리엘시버트 CIO) — "투자자는 여전히 근본 원인을 본다."** 바이백 발표 후 하루 만의 반전에 대해 **"재무부 바이백이라는 시장 운영 방식보다 높은 금리의 근본적인 원인에 여전히 집중하고 있다"**고 평가하며, 그 원인으로 **인플레이션 불확실성·재정적자·국채 공급·기간 프리미엄**을 꼽았다.
- **크리스 자카렐리(노스라이트애셋 CIO) — "시장이 잠시 숨을 돌리고 있다."** 이번 주를 **"국채금리 상승과 베선트 재무장관의 개입을 둘러싸고 오르내린 시소 같은 한 주"**로 요약했다.
- **번스타인 — "바이백이 비트코인의 촉매였다."** **"비트코인의 강한 상승 촉매는 재무부가 수익률곡선 장기 구간의 국채를 바이백하기로 한 조치"**이며 **"비트코인은 역사적으로 유동성 확대에 긍정적으로 반응해왔다"**고 분석했다.
- **UBS글로벌웰스매니지먼트 — S&P 500 연말 목표치 8,100으로 상향.** 기업 실적 전망과 견조한 이익 증가를 근거로 제시했으며, 현 지수(7,674.37) 대비 약 **+5.5%** 수준이다.
- **뱅크오브아메리카 — 모더나 목표주가 \$40 → \$170.** 흑색종 3상 판독을 **"모더나를 감염병 너머로 확장시키는 분수령"**으로 평가했다. 윌리엄블레어도 투자의견을 Outperform으로 상향했다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📊 8/26 엔비디아 실적 — 이번 주의 전부:** AI 투자 과열론이 제기된 상태에서 나오는 실적이다. 엔비디아가 **6거래일 연속 하락**했다는 사실 자체가 시장의 불안을 보여준다. 결과에 따라 SK하이닉스·마이크론 등 HBM 밸류체인 전체의 다음 방향이 갈린다.
- **⚠️ 8/24 베선트 추가 설명 · 8/28 워시 의장 잭슨홀 연설:** 베선트 장관이 24일 재무부의 국채시장 대응 계획을 추가로 설명하고, 28일에는 케빈 워시 연준 의장이 잭슨홀에서 연설한다. **바이백만으로 장기금리를 붙잡을 수 있는지**가 다음 주 월가의 핵심 질문이다.
- **🇰🇷 월요일 국내 개장 — 야간선물 −2.29%의 해석이 관건:** 금요일 정규장이 급등한 뒤의 되돌림이지만 폭이 작지 않다. **코스닥 −4.63%와 매도 사이드카**가 발동된 직후여서, 대형주 강보합 / 중소형주 약세의 양극화가 이어질 가능성이 높다.
- **🛢 유가 — 6거래일 연속 상승, 주간 +5.66%:** 브렌트 94달러대, WTI 87달러대. 트럼프의 대이란 제재 경고가 이어지는 한 하방이 막혀 있다. **국내 항공·화학·해운의 원가 부담**이 본격화되는 구간이다.
- **💱 원/달러 1,386.5원 — 11개월 최저권:** 주간 31.8원 하락(원화 강세)했다. 외국인 수급에는 우호적이지만 수출주 채산성에는 부담이다. 삼전·하닉의 130조 주주환원이 **원화 강세를 연장시킬 수 있다**는 분석도 나온다.
- **🇰🇷 괴리율 +31.0%:** 3거래일 연속 축소되며 정상 범위(20~30%대)에 진입했다. 원/달러 하락과 국내 주가 상승이 동시에 작용한 결과다.
