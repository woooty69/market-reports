## 🗓 주말 요약

**① 한 주의 결론은 '반도체 반등 +8%, 그러나 금요일에 금리와 엔비디아가 발목'**
주간으로 나스닥 **+2.27%**, S&P 500 **+2.51%**, 다우 **+2.07%**, 러셀 2000 **+1.32%**로 직전 주 투매를 일부 되돌렸고, SOX는 **+8.05%**, SK하이닉스 ADR은 **+3.49%(\$131.79)**였다. 반등의 대부분은 월요일(11/9) SOX **+6.86%**와 수요일(11/11) **+5.66%** 두 날에 나왔다. 반면 목요일 젠슨 황 엔비디아 CEO 사임과 금요일 10년물 5.15% 돌파가 겹친 뒤 SOX는 이틀 동안 4% 가까이 밀렸다. VIX는 **19.30**으로 직전 주 25.64에서 크게 내려왔다.

**② 물가가 금리를 끌어올렸다 — 2년물 주간 +0.37%p**
화요일 10월 CPI는 전월 대비 **+0.4%**(예상 +0.3%), 근원 **+0.3%**(예상 +0.2%)로 예상을 웃돌았고, 금요일 10월 PPI는 전년 대비 **6.5%**로 2022년 11월 이후 가장 높았다. 미 재무부 기준 2년물은 **4.51% → 4.88%**, 10년물은 **4.86% → 5.15%**, 30년물은 **5.26% → 5.47%**로 올랐다. 12월 25bp 인상 확률은 약 **90%**로 굳어졌고, 미셸 보먼 이사·메리 데일리 총재 등 연준 인사들의 매파 발언이 이어졌다.

**③ 엔비디아 경영 공백 — 실적 발표 나흘 앞두고 CEO가 물러났다**
젠슨 황 CEO는 11/12(목) 즉시 사임했고, 콜레트 크레스 CFO가 임시 CEO를 맡았다. 엔비디아는 이번 주 월·화 이틀 동안 −4.27%, −5.47%로 밀린 뒤 수요일 **\$173.73(+2.87%)**로 반등했지만, 사임 당일 **\$166.19(−4.34%)**, 금요일 **\$162.85(−2.01%)**로 내려왔다. 3분기 실적은 예정대로 현지 11/17(화) 장 마감 후 발표된다.

**④ 유가는 주간 −1.97% — '추가 공습 보류'와 '합의 필요 없다' 사이**
WTI는 11/6 **\$90.52**에서 금요일 **\$88.74**로 주간 **−1.97%** 내렸다. 월요일 트럼프 대통령이 "협상이 진행되는 동안 추가 공습 가능성은 낮다"고 말하자 **\$86.96(−4.26%)**까지 내려갔고, 화요일에는 8월 말 이후 최저권인 **\$86.34**였다. 목요일 "이란과 합의가 필요 없다"는 발언에 **+2.84%** 반등했다. 브렌트 1월물은 **\$95.84**다.

**⑤ 실적은 '숫자는 좋은데 주가는 금리 따라' 장세**
시스코는 1분기 매출 **\$185억(+24%)**과 연간 전망 상향에도 금요일 **−6.24%**, 어플라이드 머티리얼즈는 4분기 매출 **\$104억1,000만(+53%)**과 예상 상회 가이던스에도 **−2.74%**였다. 반면 세레브라스는 3분기 핵심 매출 **\$2억3,100만(+70%)**으로 **+11.22%**, 모딘은 삼성전자 인수 협상 보도에 **+27.86%** 뛰었다. 로스차일드 레드번은 브로드컴 목표주가를 **\$595 → \$398**로 내리며 AI 고객사의 자금 조달 문제를 새 쟁점으로 올렸다.

**⑥ 한국은 반등 주간이었지만 금요일 밤 미국이 다시 흔들었다**
금요일(11/13) 코스피는 −1.0%였지만 5일 누적 **+4.6%**로 직전 주 −11.7% 낙폭 일부를 되찾았고, 외국인은 코스피 현물을 5일 **+4,608억원** 순매수로 돌아섰다. 다만 금요일 밤 SOX **−3.43%**, SK하이닉스 ADR **−4.30%**, 코스피200 야간선물 **816.45(−0.72%, 11/13 세션)**가 월요일(11/16) 첫 반영분이다.

## 📰 섹션 1. 한 주간(11/9~11/13) 주요 뉴스 5선

**1. 젠슨 황 엔비디아 CEO 사임 — 콜레트 크레스 임시 CEO, 실적은 예정대로 11/17**
젠슨 황은 11/12(목) 대표이사·이사직에서 즉시 물러났고, 크레스 CFO가 CFO 직을 유지한 채 임시 CEO를 맡았다. 이사회는 하비 존스를 첫 이사회 의장으로 세우고 정식 후임 물색에 착수했으며, Arm의 르네 하스 CEO에게 의사를 타진했다는 보도가 나왔다. 사임 당일 엔비디아는 장중 약 13% 밀렸다가 **\$166.19(−4.34%)**로 마감했고, 금요일에는 **\$162.85(−2.01%)**였다. 번스타인은 시장수익률 의견과 목표주가 **\$200**을 유지하며 단기 사업 영향은 크지 않다고 봤고, 웨드부시의 댄 아이브스는 목표주가를 **\$300 → \$225**로 내렸다.
**투자자 함의:** 사업이 아니라 지배구조 충격이라는 점에서 실적 자체보다 크레스 임시 CEO가 기존 약속(투자·보증 약정)을 그대로 이어 가는지가 관건이다. 이번 주 미국 개인 매수의 61%가 엔비디아에 몰렸다는 점은 실적 실망 시 변동성을 키울 수 있다.

**2. CPI·PPI 연타 — 12월 인상 확률 90%, 10년물 5.15%**
10월 CPI는 전월 대비 **+0.4%**, 근원 **+0.3%**로 모두 예상을 0.1%p씩 웃돌았다. 금요일 10월 PPI는 전월 대비 **+0.3%**로 예상(+0.4%)을 밑돌았지만 전년 대비 **6.5%**로 2022년 11월 이후 최고였다. 2년물은 CPI 당일 **+17bp**, 목요일 **+13bp** 뛰어 주간 **+0.37%p(4.88%)**, 10년물은 주간 **+0.29%p(5.15%)**로 장중 5.174%까지 올랐다. 미셸 보먼 이사는 물가 압력이 확산 조짐을 보인다고 했고, 메리 데일리 총재도 추가 긴축 필요성을 말했다.
**투자자 함의:** 9월 인상으로 기준금리 상단이 4%인 상황에서 12월 추가 인상이 기본 시나리오가 됐다. 10년물 5%대 안착은 고밸류 기술주 할인율을 끌어올리고 달러 강세를 통해 신흥국 자금 흐름을 압박한다.

**3. 반도체 롤러코스터 — 월·수 급반등, 목·금 되밀림**
SOX는 월요일 **+6.86%(10,033.93)**로 직전 주 투매에서 반등했고, 수요일에는 코어위브 실적을 계기로 **+5.66%(10,564.11)**, 마이크론 **\$811.30(+11.89%)**, 샌디스크 **+13.69%**가 뛰었다. 그러나 목요일 엔비디아 CEO 사임과 금리 급등, 금요일 브로드컴 의견 하향이 겹치며 SOX는 금요일 **10,146.32(−3.43%)**로 밀렸다. 주간으로는 **+8.05%**다. 금요일에는 AMD **−8.75%**, 델 **−7.24%**, 브로드컴 **−4.76%**, Arm **−4.63%**로 매도가 업종 전반으로 번졌다.
**투자자 함의:** 메모리는 수요일 급반등에서 보듯 저가 매수세가 강하지만, 금리·엔비디아 이벤트에 하루 3~5%씩 흔들리는 고변동 구간이다. 다음 주 엔비디아 실적과 데이터센터 가이던스가 반도체 방향을 정할 분수령이다.

**4. 유가 \$86~89 박스 — 트럼프 '공습 보류'와 '합의 불필요'**
트럼프 대통령은 월요일 협상이 진행되는 동안 이란 추가 공습 가능성이 낮다고 했고, WTI는 **\$86.96(−4.26%)**로 급락한 뒤 화요일 **\$86.34**로 8월 말 이후 최저권까지 내려갔다. 수요일 호르무즈 해협 유조선 기뢰 피격 보도에 소폭 반등했고, 목요일 "이란과 합의가 필요 없다"는 발언에 **\$88.99(+2.84%)**로 뛰었다. 주간으로는 **−1.97%(\$88.74)**다.
**투자자 함의:** 유가가 \$90 아래에 머물며 직전 주 \$103대에서 크게 내려왔지만, 협상 동력이 약해지면서 추가 하락 여력도 제한됐다. 국내 항공·화학에는 부담 완화, 정유에는 정제마진 부담이 이어지는 구간이다.

**5. 실적 시즌 후반 — 가이던스와 금리가 주가를 갈랐다**
시스코는 1분기 매출 **\$185억(+24%)**, 조정 EPS **\$1.40**으로 예상을 넘고 하이퍼스케일러 AI 인프라 매출 목표를 **\$90억**으로 올렸지만, 2분기 가이던스 \$180억~182억이 실망을 불러 **−6.24%**였다. 어플라이드 머티리얼즈는 다음 분기 매출 가이던스 **\$111억**과 2027년 웨이퍼 장비 투자 **30% 이상** 증가 전망에도 **−2.74%**였다. 반면 세레브라스는 4분기 핵심 매출 가이던스 **\$3억1,000만~3억3,000만**으로 **+11.22%**, 모딘은 삼성전자 인수 협상 보도에 **+27.86%(\$135.66)** 급등했다.
**투자자 함의:** 실적이 좋아도 금리 상승기에는 '기대 이상의 가이던스'가 아니면 차익 실현이 먼저 나온다. 어플라이드의 한국 매출 \$18억(+49%)과 2027년 장비 투자 전망은 국내 장비·소재주에 중장기 근거가 된다.

## 🌙 섹션 2. 휴장·주말 신규 뉴스 5선

**1. "새 전쟁도, 협상도, 지속적 평화도 없다" — 트럼프 행정부의 이란 '현상 유지' 노선**
워싱턴포스트는 미국 관리를 인용해 행정부가 이란과 관련해 "새 전쟁 없음, 협상 없음, 지속적 평화 없음"이라는 중간 노선으로 정리했다고 14일 보도했다. 이 관리는 중간선거 뒤 여러 차례 정보 브리핑을 거치며 "트럼프가 당분간 전쟁으로 돌아가길 원하지 않는다는 점이 분명해졌다"고 말했다. 트럼프 대통령은 이란과의 합의 시도를 끝냈다며 JD 밴스 부통령에게 다른 현안에 집중하라고 했다고 밝혔고, 카타르 총리와 만난 뒤에는 "현상 유지"라고 말했다. 2월 28일 시작된 전쟁은 8개월째이며, 6월 양해각서는 해협 통항 문제로 무너졌다.
**관전 포인트:** 대규모 공습 재개 가능성이 낮아진 것은 유가 급등 위험을 줄이지만, 협상도 멈춘 만큼 호르무즈 해협 재개라는 유가 하락 재료도 멀어졌다. WTI가 \$86~90 박스에 머물 가능성이 커진 구도다.

**2. 루비오 "경제 압박이 잘 작동 중" — 이란 요구는 "터무니없다"**
마코 루비오 국무장관은 파리 G7 회의에서 교착 상태라는 해석을 반박하며, 경제적 압박이 "아주 잘 작동하고 있어" 대통령이 대규모 전투를 할 필요가 없다고 말했다. 이란의 해협 재개 조건에 대해서는 "터무니없다"고 일축했다. 13일 연설에서는 "승리란 이란이 어떤 식으로든 핵무기를 갖지 못하는 것"이라고 했다. 해상 봉쇄와 제재 중심의 압박이 길어진다는 신호다.
**관전 포인트:** 봉쇄 장기화는 원유 공급 측면에서 브렌트 \$95.84 수준의 위험 프리미엄을 유지시키는 요인이다. 해운 운임과 보험료가 높게 유지되는 한 국내 해운·조선에는 우호, 항공·화학에는 원가 부담이 이어진다.

**3. 트럼프·시진핑·푸틴 3자 회담 11/19 선전 — 의제는 이란과 핵군축**
백악관은 13일 세 정상이 11월 19일 중국 선전에서 열리는 APEC 정상회의를 계기로 만난다고 확인했다. 의제는 이란과 핵무기 통제이며, 우크라이나는 별도 트랙으로 빠졌고 트럼프·푸틴 양자 회담은 계획되지 않았다. 미국 고위 관리는 "어떤 합의에 이를 것으로 기대하지 않는다"고 했다. 신전략무기감축협정(뉴스타트)은 2월에 만료됐고, 미 국방부는 중국 핵탄두를 **600기** 이상, 미국·러시아는 각각 **5,000기** 이상으로 추산한다. 트럼프는 마닐라 아세안 정상회의를 거쳐 선전으로 간다.
**관전 포인트:** 합의 기대는 낮지만 미·중 정상이 만난다는 사실만으로 관세·수출 통제 관련 헤드라인이 나올 수 있다. 엔비디아 대중 수출 통제와 이란 원유 수입 문제가 어떻게 언급되는지가 반도체·유가에 직결된다.

**4. 엔비디아 후속 일정 — 의회 브리핑 12월 1일로 연기, 11/18 사내 회의**
젠슨 황 사임 이후 의회 위원회 브리핑이 11월 18일에서 **12월 1일**로 미뤄졌고, 위원회는 협조하지 않으면 소환장을 발부하겠다고 경고했다. 직원 청원에는 **1,600건** 넘는 의견이 달려 황의 복귀를 요구하는 목소리가 컸고, 11월 18일 전사 회의가 예정돼 있다. 야후 파이낸스는 엔비디아가 고객사·파트너에 제공한 투자·보증 약정을 약 **\$5,300억**으로 집계했고, 크레스 임시 CEO가 다수 계약에 서명한 당사자라는 점에서 실적 발표에서 이 약정을 유지할지가 관심사다.
**관전 포인트:** 실적 발표(현지 11/17)와 사내 회의(11/18), 3자 정상회의(11/19)가 사흘에 몰려 있다. 엔비디아가 기존 약정과 데이터센터 가이던스를 그대로 확인하면 AI 인프라 전반의 자금 조달 우려가 누그러질 수 있다.

**5. 앤트로픽 상장 임박·비트코인 \$70,000 하회 — 위험 선호의 두 시험대**
다음 주 목요일(11/19) 전후로 거론되는 앤트로픽 상장은 최대 **\$904억** 조달, 기업가치 약 **\$1조4,000억** 규모로 AI 투자 심리의 시험대다. 한편 비트코인은 금요일 연준 인상 기대와 현물 ETF 자금 유출, 레버리지 청산이 겹치며 거의 3개월 만에 **\$70,000** 아래로 내려가 한때 \$68,000대까지 밀렸고, 11월 들어서만 10% 넘게 빠졌다.
**관전 포인트:** 초대형 공모가 흥행하면 AI 밸류에이션에 대한 시장 신뢰를 확인하는 계기가 되지만, 공모 자금 수요가 기존 AI 대형주 매도로 이어질 수도 있다. 비트코인 약세는 금리 상승기 투기 자산 디레버리징 신호여서 성장주 심리에 부담이다.
