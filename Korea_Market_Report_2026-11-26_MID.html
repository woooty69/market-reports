## 🗓 시장 요약

**① 코스피 장 초반 +2.6% 반등했다가 금리 인상 뒤 상승폭 대부분 반납 — 외국인·기관 동반 순매수**
코스피는 전날 폭락에 따른 저가 매수로 4,817.77까지 반등했지만, 한국은행 금융통화위원회가 기준금리를 올리고 향후 추가 인상 가능성(점도표 상단 3.75%)까지 열어 두자 오름폭이 +0.4% 안팎으로 줄었다. 외국인이 +1,197억원, 기관이 +3,247억원을 순매수해 전날(외국인 −1.3조원 매도)과 흐름이 바뀌었고, 개인은 −6,371억원을 팔았다. 코스피200 선물(733.40, +1.19%)은 현물보다 강하다.

**② 반도체·대형주 — SK하이닉스 105만원대·삼성전기 5% 강세, 삼성전자는 보합권**
SK하이닉스는 1,054,000원(+2.33%)으로 거래대금 2조 1,322억원을 기록해 시장 1위였고, 삼성전자는 171,800원(+0.64%)으로 오름폭이 작다. AI발 MLCC 가격 상승 기대에 삼성전기(+5.03%, 거래대금 4,058억원)가 장 초반 7%까지 올랐고 주성엔지니어링(+4.90%)·대덕전자(+2.94%)·심텍(+2.26%)도 반등했다. 다만 미국이 '호남 반도체' 문제를 제기했다는 보도로 반도체 업종에 긴장감이 남아 있다.

**③ 주도·약세 업종 — 우주·벤처캐피탈·보안 강세, 자동차·항공·통신 약세**
스페이스X의 '우주 데이터센터' 위성 100만기 배치 승인 소식에 창업투자(+7.32%)가 업종 1위였고, 미래에셋벤처투자(+21.31%)·아주IB투자(+8.83%)·스피어(+15.28%)·에이치브이엠(+11.18%)·나노팀(상한가)이 급등했다. 미국 정보기관 해킹 이후 보안주가 이틀째 강했고(안랩 +5.76%), 화장품주도 블랙프라이데이·한중 관계 개선 기대로 연일 올랐다. 반면 현대차그룹 정기 인사 날 자동차(−2.79%)·자동차부품(−2.70%)이, 통합 LCC 본사 문제로 항공사(−3.56%)가 약했다.

**④ 환율·해외 변수 — 원/달러 1,341원대 하락, 아시아 증시 동반 반등**
원/달러는 1,341.10원(−4.40원)으로 내렸다. 닛케이225가 오전장 +1.54%, 항셍이 +2.34%로 아시아 증시가 동반 반등했다. 미국 지수 선물도 S&P500 +0.67%, 나스닥100 +1.14%로 강하지만, 미국 10월 근원 PCE 물가가 3.3%로 예상(3.2%)을 웃돌아 연준의 12월 인상 가능성이 높게 반영돼 있고, 오늘 밤 미국 현물 시장은 추수감사절로 쉰다.

## 1. 업종별 흐름

**상승 업종** — 창업투자(+7.32%, 46종목 상승·16종목 하락)가 스페이스X 지분 보유 기대에 1위였고, 기타금융(+4.82%)·생명과학도구및서비스(+4.63%)·통신장비(+4.24%)·전자장비와기기(+3.86%)·방송과엔터테인먼트(+3.51%)가 뒤를 이었다. 통신장비는 RFHIC(+11.94%)·LIG아큐버(+11.27%)가, 전자장비는 삼성전기(+5.03%)·대주전자재료(+11.32%)가 이끌었고, 엔터는 하이브(+4.75%)가 중국 시장 재개방 기대를 탔다.

**하락 업종** — 항공화물운송과물류(−3.62%)·항공사(−3.56%, 9종목 중 8종목 하락)·무선통신서비스(−3.47%)·자동차(−2.79%)·자동차부품(−2.70%, 140종목 중 94종목 하락)이 약했다. 대한항공(−6.95%)·현대모비스(−5.01%)·SK텔레콤(−4.06%)·현대차(−3.90%)가 업종 하락을 키웠고, 금리 인상 날 은행(−1.12%)·부동산(−1.85%)·건설(−1.47%)도 밀렸다.

**시장의 시선** — 오후장에서는 금리 인상 이후 4,720선 아래로 밀린 코스피가 오전 저점을 지키는지, 외국인·기관 동반 매수가 이어지는지가 관건이다. 미국 증시가 휴장해 오늘 밤 외부 변수는 적지만, 우주·VC·상한가 종목은 하루 10～30% 오른 곳이 많아 오후 차익 매물에 변동성이 커질 수 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 41종목

*① 12시 현재 시총 1,000억원 이상·+10% 이상 ★ 필수 편입 21종목(1～21번, 시총 큰 순) → ② 오전장 언론 최다 보도 20종목(22～41번).*

**1. ★ 보로노이 (310210) 130,100원 · 2조 4,220억원 · +11.01% — 바이오 반등 속 국가신약개발사업 3건 선정 재부각, 거래대금 139억원**
보로노이는 코스닥이 +1.43% 반등하는 가운데 +11.01% 올라 시총 2조 4,000억원대를 회복했다. 이번 주 VRN10·VRN11 등 3개 과제가 국가신약개발사업에 선정돼 임상 가속 기대가 붙었지만, 앞서 주가 급락으로 대표의 주식담보대출 400억원 차환 부담이 부각된 바 있어 변동성이 크다. 최신 커버 리포트는 4세대 EGFR 표적 파이프라인이 C797S 변이 양성 2차 치료에서 가속승인을 노릴 수 있다고 봤고, 앞선 리포트들은 목표주가 230,000원·450,000원을 제시했다. [리포트: 현대차 2026-09-28](https://woooty69.github.io/hw-pdf-arch-030/%EB%B3%B4%EB%A1%9C%EB%85%B8%EC%9D%B4%EF%BC%BB310210%EF%BC%BD_20260928_Hyundai%2BMotor_196315.pdf) · [리포트: 현대차 2026-09-18](https://woooty69.github.io/hw-pdf-arch-020/%EB%B3%B4%EB%A1%9C%EB%85%B8%EC%9D%B4%EF%BC%BB310210%EF%BC%BD_20260918_Hyundai%2BMotor_1132342.pdf) · [리포트: 유안타 2026-09-17](https://woooty69.github.io/hw-pdf-arch-020/%EB%B3%B4%EB%A1%9C%EB%85%B8%EC%9D%B4%EF%BC%BB310210%EF%BC%BD_20260917_Yuanta_1131924.pdf)

**2. ★ 올릭스 (226950) 90,700원 · 2조 747억원 · +12.39% — 릴리 도입 신약 연내 임상 결과 기대, 대표 국무총리 표창**
올릭스는 거래대금 212억원으로 9만원대에 올라섰다. 이동기 대표가 일라이 릴리에 기술이전한 신약의 임상 결과가 연내 나올 것이라고 밝힌 데 이어, 보건의료기술진흥 유공으로 국무총리 표창을 받았다. 위고비·마운자로의 '실명 경고' 논란 이후 RNA 간섭 기반 'K-비만약' 후보로 관심이 커진 점도 매수 요인이다. 최신 커버 리포트는 오버행 우려 속에서도 4분기에 임상 결과가 잇따라 나올 것이라고 짚었다. [리포트: 신한 2026-09-17](https://woooty69.github.io/hw-pdf-arch-020/%EC%98%AC%EB%A6%AD%EC%8A%A4%EF%BC%BB226950%EF%BC%BD_20260917_Shinhan_1131979.pdf) · [리포트: 교보 2026-09-17](https://woooty69.github.io/hw-pdf-arch-030/%EC%98%AC%EB%A6%AD%EC%8A%A4%EF%BC%BB226950%EF%BC%BD_20260917_Kyobo_196214.pdf) · [리포트: IV리서치 2026-08-14](https://woooty69.github.io/hw-pdf-arch-015/%EC%98%AC%EB%A6%AD%EC%8A%A4%EF%BC%BB226950%EF%BC%BD_20260814_IV%2BResearch_1123438.pdf)

**오늘 오후 국내** — 금통위 결정 이후 추가 인상 속도와 점도표(상단 3.75%)에 대한 해석 기사가 이어질 것으로 보여 은행·보험·건설 등 금리 민감 업종과 원/달러 흐름을 함께 본다. 아리바이오 직상장 추진 관련 후속 공시, 현대차그룹·삼성 계열 임원 인사 후속 발표, 장 마감 후 공급계약·자사주 공시도 확인할 부분이다.

**오늘 밤 해외** — 미국 증시는 추수감사절로 휴장하고 27일(금)은 조기 폐장한다. 미 지수 선물(나스닥100 +1.14%)은 거래되지만 유동성이 얇다. 트럼프 정부의 16개 경제권 301조 추가 관세 추진 관련 세부 내용, 엔비디아 신용등급·SEC 회계 검토 관련 후속 보도, 연준 12월 인상 가능성을 키운 근원 PCE(3.3%) 이후 연준 인사 발언이 변수다.

    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
