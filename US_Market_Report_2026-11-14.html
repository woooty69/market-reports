## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**3. 어플라이드 머티리얼즈 (AMAT) −2.74% — 4분기 매출 \$104억1,000만(+53%), 1분기 가이던스 \$111억으로 예상 상회**
어플라이드 머티리얼즈는 \$376.01에서 출발해 저가 \$352.23(−7.54%)까지 밀린 뒤 \$370.50(−\$10.45, −2.74%)로 낙폭을 줄여 마감했다. 2026회계연도 4분기 매출은 \$104억1,000만으로 1년 전보다 53% 늘었고, 조정 EPS는 \$4.16으로 예상치 \$4.06을 넘었다. 다음 분기 매출 가이던스는 \$111억(±\$5억)으로 시장 예상 \$108억을 웃돌았고, 회사는 2027년 웨이퍼 장비 투자가 30% 넘게 늘 것으로 내다봤다. 게리 디커슨 CEO는 AI가 반도체 수요의 다년간 확장을 이끌고 있다고 말했지만, 반도체 업종 매도를 피하지 못했다.

**4. 브로드컴 (AVGO) −4.76% — 로스차일드 레드번, 투자의견 '매수'→'중립' 하향·목표주가 \$595→\$398**
브로드컴은 \$356.54에서 출발해 저가 \$337.67(−7.33%)까지 밀린 뒤 \$347.01(−\$17.35, −4.76%)로 마감했다. 로스차일드 앤드 코 레드번은 투자의견을 매수에서 중립으로 낮추고 목표주가를 \$595에서 \$398로 3분의 1가량 내렸다. 브로드컴의 AI 성장은 앤트로픽·오픈AI가 빠르게 스스로 자금을 조달할 수 있어야 하는데, 이는 단기간에 이뤄지기 어렵다는 판단이다. 브로드컴은 앤트로픽 임차 계약에 최대 약 \$290억을 보증하고 최대 \$420억을 빌려줄 수 있는 구조로 알려져 있다.

**5. 모딘 매뉴팩처링 (MOD) +27.86% — 삼성전자가 인수 협상 중이라는 보도, 데이터센터 매출 +95%**
모딘은 \$142.00에서 출발해 고가 \$146.50(+38.08%)까지 오른 뒤 \$135.66(+\$29.56, +27.86%)으로 마감했다. AI 데이터센터 냉각 장비 업체인 이 회사를 삼성전자가 인수하는 방안을 논의 중이라는 블룸버그 보도가 나왔다. 모딘의 시가총액은 보도 전 약 \$56억이었고, 최근 분기 데이터센터 매출은 1년 전보다 95% 늘며 수주도 사상 최대였다. 삼성은 2025년 유럽 공조 업체 플랙트그룹을 약 15억 유로에 인수한 바 있다.

**6. 세레브라스 (CBRS) +11.22% — 3분기 핵심 매출 \$2억3,100만(+70%), 4분기 가이던스 \$3억1,000만~3억3,000만**
세레브라스는 \$108.70에서 출발해 고가 \$120.44(+23.21%)까지 오른 뒤 \$108.72(+\$10.97, +11.22%)로 마감했다. AI 추론 칩 업체인 이 회사의 3분기 핵심 매출은 \$2억3,100만으로 1년 전보다 70% 늘었고, 클라우드 서비스 매출은 \$1억4,500만으로 272% 급증했다. 4분기 핵심 매출 가이던스는 \$3억1,000만~3억3,000만이며, 잔여 수행 의무(RPO)는 대부분 오픈AI 750MW 계약에서 나온 \$261억이다. 마이크로소프트와의 클라우드 컴퓨팅 계약 매출은 2027년 1분기부터 반영된다.

**7. Arm (ARM) −4.63% — 엔비디아 이사회가 르네 하스 CEO에 후임 의사 타진 보도**
Arm은 \$196.48에서 출발해 저가 \$180.50(−9.65%)까지 밀린 뒤 \$190.53(−\$9.25, −4.63%)로 마감했다. 엔비디아 이사회가 젠슨 황 후임을 찾는 과정에서 Arm의 르네 하스 CEO에게 연락했다는 보도가 나오며 경영 공백 우려가 Arm으로 옮겨붙었다. 하스는 2022년 엔비디아의 Arm 인수(\$400억 규모)가 무산된 직후 Arm CEO에 올랐고, 그 전에는 엔비디아에서 일한 경력이 있다. 반도체 업종 전반이 SOX −3.43%로 약했던 것도 부담이었다.

**8. 누 홀딩스 (NU) +11.75% — 3분기 순이익 \$11억 사상 최대(+31%), ROE 32%**
누 홀딩스는 \$12.36에서 출발해 고가 \$13.25(+12.00%) 부근인 \$13.22(+\$1.39, +11.75%)로 마감했다. 브라질 디지털 은행 누뱅크를 운영하는 이 회사의 3분기 순이익은 \$11억으로 1년 전보다 31% 늘어 사상 최대였고, 총수익은 \$63억으로 37% 늘었다. 고객 수는 1억4,260만 명, 자기자본이익률(ROE)은 32%였다. 연간 효율성 비율 전망도 약 20%에서 19~19.5%로 개선했지만, 90일 이상 연체율은 12.1%로 2분기(11.6%)보다 높아졌다.

**9. 뉴스맥스 (NMAX) +31.41% — 3분기 매출 \$6,900만(+52.5%)·순이익 \$1,520만 흑자 전환, 제휴 수수료 +77%**
뉴스맥스는 \$9.25에서 출발해 고가 \$9.99(+37.04%)까지 오른 뒤 \$9.58(+\$2.29, +31.41%)로 마감했다. 보수 성향 뉴스 방송사인 이 회사의 3분기 매출은 \$6,900만으로 1년 전보다 52.5% 늘었고, 일회성 계약 해지 수수료 \$1,400만을 빼도 \$5,500만으로 21.6% 늘었다. 케이블 사업자에게서 받는 제휴 수수료 매출이 \$1,430만으로 77.4% 급증했고, 순이익은 \$1,520만으로 1년 전 \$410만 적자에서 흑자로 돌아섰다. 부채 없이 현금성 자산 \$1억3,760만을 보유하고 있으며 연간 기초 매출 전망 \$2억1,200만~2억1,600만을 유지했다.

**10. 하트플로 (HTFL) −19.13% — 3분기 매출 \$7,290만(+57%)·연간 전망 상향에도 순손실 \$1,150만에 차익 매물**
