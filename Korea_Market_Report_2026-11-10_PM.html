## 🗓 시장 요약

**① 코스피 4.39% 급반등, 매수 사이드카 속 5,200선 탈환…외국인 8거래일 만에 '사자'**
코스피는 5,247.22로 4.55% 갭 상승 출발해 장 초반 코스피·코스닥 모두 매수 사이드카가 발동됐고, 장중 5,300.92까지 올랐다가 220.28포인트(+4.39%) 오른 5,239.13으로 마감해 4거래일 만에 반등했다. 외국인은 4,145억원을 순매수해 7거래일 연속 매도를 끝냈고, 기관은 투신(+3,285억원)·사모(+1,170억원)·금융투자(+739억원) 중심으로 4,643억원을 샀으며 연기금은 1,101억원을 팔았다. 개인은 1조 3,673억원을 순매도했고 기타법인이 4,885억원을 샀다. 프로그램은 비차익 +5,998억원·차익 −997억원으로 5,001억원 순매수였다. 정규장 마감(15:35) 기준 외국인 순매수는 3,532억원으로 장후 시간외 거래에서 600억원가량 늘었다. 고객예탁금은 11월 6일 기준 90.3조원으로 1.8조원 늘었다.

**② 반도체: 美 SOX 6.86% 폭등에 삼전닉스 반등, 소부장은 10%대 급등 속출**
전날 밤 엔비디아(−4.3%)는 젠슨 황 CEO 스캔들로 내렸지만 AMD(+13.3%)·브로드컴(+8.8%)·마이크론(+6.3%)이 급등하며 필라델피아 반도체지수가 6.86% 올랐다. SK하이닉스는 6.69% 오른 1,212,000원(거래대금 4조 524억원, 프로그램 −549억원), 삼성전자는 4.74% 오른 198,900원으로 마감했고 반도체 업종은 +5.43%(163종목 상승·8종목 하락), HBM 테마는 +6.17%(35종목 중 34종목 상승)였다. 이오테크닉스(+14.48%)·케이씨텍(+12.79%, SK하이닉스 211억원 장비 계약)·SFA반도체(+13.17%)·엑시콘(+13.14%)·넥스틴(+10.67%) 등 소부장이 급등했다. 다만 모건스탠리가 목표가를 최대 38% 낮춘 반면 노무라는 470만원대를 제시하는 등 하이닉스를 둘러싼 시각이 극단으로 갈렸고, 미국의 대중 AI칩 규제 입법 움직임도 남아 있다.

**③ 강세 업종: 항공(유가 급락)·전력기기·2차전지·건설 재건주 동반 급등**
항공사 업종은 +12.63%(8종목 전부 상승)로 1위였고 LCC 테마는 +13.09%(9종목 전부 상승)로 진에어(상한가)·에어부산(+17.19%)·아시아나항공(+11.68%)·대한항공(+11.51%, 프로그램 +648억원)이 뛰었으며, 한진칼(+15.18%)은 지분 경쟁 속 열흘 새 두 배가 됐다. 전기장비(+9.58%, 31종목 상승·1종목 하락)는 효성중공업·HD현대일렉트릭·가온전선(+16.48%)이 이끌었고 전선 테마는 +8.23%(8종목 전부 상승)였다. 2차전지는 BMW가 삼성SDI·LG에너지솔루션을 46파이 배터리 공급사로 정하며 삼성SDI(+9.88%)·엘앤에프(+10.98%)·에코프로(+10.23%)가 전날 급락분을 되돌렸다. 트럼프의 분쟁 종식 발언에 현대건설(+11.97%)·DL이앤씨(+10.47%)·대우건설(+9.21%) 등 재건주와 디케이락(+24.44%)도 급등했다.

**④ 약세 업종: 방어주·바이오 대형주·통신은 소외**
급락장에서 피난처였던 방어주가 차익 실현에 밀렸다. 복합유틸리티(−5.42%)·담배(−3.56%, KT&G −3.67%)·음료(−3.46%)·다각화된통신서비스(−2.59%, KT −2.30%)·손해보험(−1.06%, 삼성화재 −1.16%)이 하락 업종 상위였고, 테마로는 홈쇼핑(−2.81%)·편의점(−1.79%)·주류(−0.74%)가 약했다. 바이오 대형주는 미국 약가 인하가 기술수출 로열티를 흔들 수 있다는 우려에 셀트리온(−3.33%)·삼성바이오로직스(−2.78%)가 내렸고 제약 업종은 −0.74%였다. 기아(−0.93%)·신한지주(−0.35%)·카카오(−0.16%)도 반등장에서 소외됐다.

**⑤ 환율·해외·파생: 원/달러 1,337.5원, 닛케이 +2.87%·오늘 밤 美 10월 CPI**
원/달러는 유가 하락과 위험 선호 회복에 15:30 기준 1,337.5원으로 9.6원 내렸고 하나은행 18:05 고시는 1,338.50원이다. 17:55 기준 S&P500 선물은 +0.11%, 나스닥100 선물은 −0.22%로 숨을 고르고 있고, 아시아에서는 닛케이225가 2.87% 올라 60,000선을 넘었으며 중국은 1～10월 무역흑자가 1조 달러를 넘었다. 주간 코스피200 선물 미결제약정은 162,271계약으로 949계약 줄었고 외국인은 선물을 2,352계약 순매도해 현물 매수와 엇갈렸다. 18시 개장한 야간선물은 812.65(+0.07%, 18:22 현재)이며, 월물 옵션 미결제는 풋 800(5,335계약)·750(4,988계약)과 콜 782.5(4,073계약)·850(3,015계약)에 몰려 있고 미결제 PCR은 0.42다. 오늘 밤 22시 30분 발표되는 미국 10월 CPI가 유가 급락이 만든 반등의 지속 여부를 가를 변수로 꼽힌다.

## 1. 업종별 흐름

**시장의 시선** — '이익은 그대로인데 가격만 무너졌다'는 진단 아래 낙폭 과대 반등이 나왔지만, 반등의 출발점이 유가 급락이었던 만큼 지속 여부는 인플레이션에 달렸다는 시각이 많다. KB증권은 증시 하락의 핵심이 인플레이션 우려였고 유가가 반등을 만들었다고 봤고, 삼성증권은 코스피 낙폭이 2008년 금융위기 수준에 수렴해 바닥 부근이며 반등 때는 낙폭과대 종목군의 수익률이 높았다고 분석했다. 유안타증권은 5,000선에서 '투매보다 보유, 관망보다 매수'를, iM증권은 AI 인프라 우려에 따른 과대낙폭 되돌림을 제시했다. 다만 개인이 1조 3,673억원을 팔고 외국인은 선물을 2,352계약 순매도해 '추세 전환'으로 보기엔 이르며, 오늘 밤 미국 10월 CPI와 이번 주 AI 인프라 기업 실적이 다음 방향을 정할 변수다.

## 🧭 흐름 전환

*섹터 12개의 수치 점검표(하락 7·상승 5, 매일)와 Claude 주간 논지(리포트·뉴스·정책·유튜브). 점검표는 미리 정한 약속이지 매매 지시가 아니다 — 하락 점검 2개 = ⅓ 축소 검토, 3개 = 절반 검토, 가격 규칙은 논지보다 우선.*

## 3. 증권사 리포트 요약

*저녁판: 최근 24시간 증권사 리포트 — 종목 209건 · 산업·전략 258건 · 기업 IR 8건. 순서는 네이버 증권 리서치 조회수 기준 인기순(팩 순서 그대로), 🔥는 강력추천·목표가 상향 신호. 3분기 실적 시즌 한가운데라 리뷰가 몰렸다. 어닝 쇼크를 낸 LIG디펜스앤에어로스페이스(DS 60만원·신한 43만원 등 목표가 일제 하향, 유안타 105만원·iM Top Pick 유지)와 한화에어로스페이스(DS 125만원으로 하향)가 조회 상위였고, 전자BG 사상 최대 실적에도 밸류 기준을 바꾼 두산(교보 120만원·대신 100만원, 목표가 반토막), 원전 정비 지연으로 어닝 쇼크를 낸 한전KPS·한전기술(목표가 일제 하향), 3분기 호실적에 목표가가 오른 NHN(삼성 10만원·한화 9.3만원)·펌텍코리아(한화 11만원)·제주항공(9,000원)이 눈에 띄었다. 알테오젠은 美 약가협상 최종규칙 이후 대신(45만원 유지)·신한(43만원)·IBK(32만원)가 '영향은 2029년 이후로 제한적'이라는 코멘트를 냈고, 한올바이오파마는 난치성 류마티스관절염 임상 성공에 신한이 최선호주를 유지했다. 와이지엔터테인먼트는 실적 부진에 KB·삼성·LS 등이 목표가를 낮췄다. 산업·전략에서는 신한투자증권의 2027년 전망 시리즈와 '투매보다 보유'·'과대낙폭 되돌림' 대응 전략, DS의 2027년 반도체 전망('머슬 메모리'), 한국투자증권의 조선 부유식 데이터센터 매수 콜, 미국 10월 고용 서프라이즈 코멘트가 많았다. 아침판과 겹치는 리포트도 포함했다.*

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
