## 🗓 시장 요약

**① S&P500 +0.19%·나스닥 +0.04%·다우 +0.04% — 10년물 장중 5.344%(2002년 이후 최고)에 밀렸다가 금리 반락에 반등, 액센추어 +15.78%(사상 최대 하루 상승)·시놉시스 +12.78%·마이크론 +3.03% vs 알파벳 −1.70%·브로드컴 −2.15%·파라마운트 스카이댄스 −9.58%**
4분기 첫 거래일인 목요일, 미국 지수는 금리에 눌려 하락 출발했다가 오후 들어 플러스로 돌아섰다. S&P500은 **7,666.45(+14.91, +0.19%)**, 나스닥은 **26,871.60(+10.53, +0.04%)**, 다우는 **50,926.56(+20.51, +0.04%)**, 나스닥100은 30,501.56(+0.31%), 러셀2000은 2,806.62(+0.35%)였다. 장 초반 10년물 금리가 5.344%, 30년물이 5.693%까지 올라 S&P500은 저가 7,616.78, 다우는 저가 50,546.54까지 밀렸지만, 10년물이 5.234%(−5.9bp)로 내려오자 S&P500은 고가 7,684.75까지 반등했다. 종목별로는 액센추어(ACN)가 분기 매출 \$186.8억(예상 \$180.4억)에 **\$212.30(+15.78%)**로 상장 이후 가장 큰 하루 상승을 기록했고, 시놉시스(SNPS) **\$490.54(+12.78%)**·코히런트(COHR) \$319.19(+10.90%)·루멘텀(LITE) \$1,045.78(+7.67%)·바이코(VICR) \$308.59(+6.80%)·케이던스(CDNS) \$350.73(+6.22%)·코그니전트(CTSH) \$60.88(+5.99%)·SK하이닉스 ADR(SKHY) \$193.50(+5.08%)·마이크론(MU) \$1,097.39(+3.03%)가 올랐다. 반면 파라마운트 스카이댄스(PSKY)는 **\$9.34(−9.58%)**, 그라인더(GRND) \$14.17(−8.17%), 브로드컴(AVGO) \$343.64(−2.15%), 씨티그룹(C) \$127.00(−1.92%), 알파벳(GOOGL) \$338.24(−1.70%), 애플(AAPL) \$330.32(−0.81%)로 내렸다. 닐 카시카리 미니애폴리스 연은 총재는 "인플레이션은 여전히 너무 높다"고 했다. 해석하면 지수는 제자리였지만 필라델피아 반도체 +1.59%·IT서비스·EDA·광통신이 급등하고 대형 플랫폼주와 은행이 눌린 '종목 장세'였고, 금리가 장중 고점에서 꺾인 것이 반등의 직접 계기였다.

**② 10년물 5.234%(−5.9bp, 장중 5.344%로 2002년 이후 최고)·30년물 5.603%(−3.6bp, 장중 5.693%)·2년물 4.79% — ISM 제조업 54.5(예상 55)·가격지수 77.9(예상 72.3), 신규 실업수당 19만7,000건, 10월 인상 확률 39% → 26%**
미국채 10년물 금리는 장 초반 **5.344%**로 2002년 이후 최고를 다시 쓴 뒤 **5.234%(−5.9bp)**로 내려 마감했고, 30년물도 장중 5.693%로 24년 만의 최고를 찍고 **5.603%(−3.6bp)**로 반락했다. 2년물은 4.79%로 전 세션 대비 0.12%p 내렸다. 9월 ISM 제조업 지수는 **54.5(예상 55, 8월 54.6)**로 9개월 연속 확장이었지만 가격지수가 **77.9(예상 72.3, 8월 71.1)**로 6.8포인트 뛰어 물가 압력을 다시 확인했고, S&P 글로벌 제조업 PMI는 55.9(8월 53.9)였다. 주간 신규 실업수당 청구는 19만7,000건(예상 20만, 전주 19만8,000건), 4주 평균은 20만 건, 계속 청구는 170만 건이었고, 9월 감원 발표는 4만3,281명으로 전년 대비 20% 줄었다. CME 페드워치의 10월 25bp 인상 확률은 1주 전 69%·전일 39%에서 약 26%로 더 내려갔고 12월 인상 확률은 62%다. 달러인덱스는 101.96으로 연중 최고, 유로/달러는 1.1253(−0.67%)으로 2025년 5월 이후 최저였으며 금은 \$4,208.60(+0.52%), 은은 \$61.55(+1.62%)였다. 캔자스시티 연은 총재는 "인플레이션에 대해 할 일이 남아 있다", 보스턴 연은 총재는 "노동시장은 완전고용에 가깝지만 인플레이션이 너무 높다"고 했다. 해석하면 10년물이 5.3%를 넘자마자 매수세가 들어왔다는 점은 단기 고점 신호로 읽히지만, ISM 가격지수 77.9와 유가 재상승은 금리 하락이 이어지기 어렵다는 뜻이어서 금요일 밤 9월 고용보고서가 방향을 정한다.

**③ WTI \$92.96(+\$2.54, +2.81%)·브렌트 \$100~102대(+3~4%) — 미국이 세 번째 항공모함 전단을 중동에 파견한다는 보도, 중국 정유사들의 10월 연료 수출 중단, 호르무즈 유조선 피격**
WTI는 **\$92.96(+\$2.54, +2.81%)**로 이틀째 올라 화요일 급락분을 모두 되돌렸고, 브렌트는 근월물 교체로 기사별 수치가 \$100.60~\$102.21로 갈리지만 +3~4% 올라 \$100 선을 지켰다. 미국이 세 번째 항공모함 전단을 중동에 보낸다는 보도가 이란에 대한 추가 군사 행동 준비 신호로 해석됐고, 중국 정유사들이 10월 연료 수출을 중단했다는 소식과 호르무즈 해협 유조선 피격, 이란 지원 세력의 정유시설 공격이 겹쳤다. 다만 중동 원유 수송량이 전쟁 이전 수준에 가까워지고 있다는 점이 상승폭을 제한했다. 에너지 업종은 강세로 엑슨모빌(XOM)이 \$163.82(+0.66%)로 올랐고, 유가와 금리 부담에 KBW 은행지수는 −0.7%, 씨티그룹(C)은 \$127.00(−1.92%)·뱅크오브아메리카(BAC)는 \$53.73(−1.29%)로 내렸다. 해석하면 유가는 화요일 \$89 → 수요일 \$90 → 목요일 \$93으로 \$88~95 박스 상단에 다시 붙었고, ISM 가격지수 77.9와 맞물려 '물가 재상승' 우려를 키우는 재료다.

**④ AI·반도체 — 필라델피아 반도체 +1.59%: 마이크론 +3.03%(실적 다음 날 저가 −3.96%에서 반등)·SKHY +5.08%·샌디스크 +2.75%, 시놉시스 +12.78%(AWS \$10억 이상 IP 계약·OpenAI 제휴), 브로드컴 −2.15%(앤스로픽에 최대 \$420억 대출), 알파벳 −1.70%(제미나이 4 아르곤 공개 뒤 반락)**
필라델피아 반도체지수는 저가 12,587.34에서 반등해 **12,829.00(+200.38, +1.59%)**로 마감했다. 마이크론(MU)은 전날 장 마감 뒤 실적(매출 \$542.3억·조정 EPS \$33.42, 1분기 매출 가이던스 \$615억)을 소화하며 시가 \$1,054.34·저가 \$1,022.90(−3.96%)까지 밀렸다가 **\$1,097.39(+\$32.28, +3.03%)**로 장중 고가 부근에서 끝났고, SK하이닉스 ADR(SKHY)은 **\$193.50(+5.08%)**, 샌디스크(SNDK)는 \$1,787.69(+2.75%), 엔비디아(NVDA)는 \$230.86(+1.09%), AMD(AMD)는 \$615.73(+0.65%)였다. BofA의 비벡 아리야는 마이크론을 'AI 최선호주'로 꼽고 목표가 \$1,550을 제시했고, D.A. 데이비드슨의 길 루리아는 메모리 수요는 늘어나는데 공급은 내년 하반기 전까지 늘지 않는다고 평가했다. 시놉시스(SNPS)는 AWS와 \$10억 이상 규모의 다년 반도체 설계자산(IP) 계약, OpenAI와의 수익 공유 제휴, 2027 회계연도 매출 가이던스 \$111억~112억(예상 \$108.1억)을 내놓아 **\$490.54(+12.78%)**로 뛰었고 케이던스(CDNS)도 \$350.73(+6.22%)로 올랐다. 광통신은 미 상원의 중국산 광트랜시버 연방정부 사용 금지 법안 발의에 코히런트(COHR) \$319.19(+10.90%)·루멘텀(LITE) \$1,045.78(+7.67%)로 급등했다. 반면 브로드컴(AVGO)은 앤스로픽에 TPU 임대 자금으로 최대 \$420억을 빌려준다는 공시에 '순환 투자' 논란이 붙어 **\$343.64(−2.15%)**, 알파벳(GOOGL)은 새 AI 모델 제미나이 4 아르곤 공개로 고가 \$353.22(+2.66%)까지 올랐다가 \$338.24(−1.70%)로 되밀렸다. 오라클(ORCL)은 텐센트가 5년 \$70억 규모로 동남아 데이터센터의 AI 칩 약 10만 개를 쓰기로 했다는 보도에 \$138.07(+0.56%), 앤스로픽은 11월 중순까지 기업공개를 검토 중이라는 소식이 나왔다. 해석하면 마이크론이 '시간외 보합'을 하루 만에 +3%로 바꾼 것은 메모리 업황에 대한 판정이 '정점 논쟁'보다 '공급 부족 지속' 쪽으로 기울었다는 뜻이고, 국내 메모리 2사에는 우호적인 흐름이다.

**⑤ 회사 고유 재료 — 액센추어 +15.78%(매출 \$186.8억·EPS \$3.29 상회, 연간 수주 \$845억 사상 최대), 파라마운트 스카이댄스 −9.58%(워너브러더스 인수 승인에도 \$414억 채권 발행 부담), 유나이티드 테라퓨틱스 +5.44%(리퀴디아 특허 침해 판결), 바이코 +6.80%(3분기 성장 가이던스 20% → 30% 초과), 컨스텔레이션 +1.93%(아마존과 20년 원전 전력 계약), 나이키 −0.71%(장 마감 뒤 실적)**

**4. 알파벳 (GOOGL) −1.70% — 새 AI 모델 '제미나이 4 아르곤' 출시 발표: 19개 벤치마크 중 13개에서 OpenAI·앤스로픽 모델 상회, 입력 100만 토큰당 \$2·출력 \$10, 장중 +2.66%에서 반락**

**5. 브로드컴 (AVGO) −2.15% — 앤스로픽에 최대 \$420억 대출(전환사채 형태)로 TPU 임대 자금 지원, 5년 \$1,252억 임대 계약의 약 3분의 1, '순환 투자' 논란**
브로드컴은 시가 \$351.94·고가 \$354.45(+0.93%)에서 저가 \$343.29까지 밀려 \$343.64(−\$7.55, −2.15%)로 마감했다. 공시에 따르면 브로드컴은 앤스로픽이 구글 설계·브로드컴 공동 개발 TPU를 임대하는 데 쓸 자금으로 최대 \$420억을 빌려주기로 했고, 대출은 앤스로픽 주식으로 전환될 수 있는 전환사채 구조이며 5년 \$1,252억 TPU 임대 계약의 약 3분의 1을 덮는다. 앤스로픽은 2027년부터 수 기가와트 규모의 차세대 TPU 용량을 받아 브로드컴의 최대 컴퓨팅 고객이 될 전망이고, 상장 신청서에는 브로드컴이 공급자이자 대출자라는 '잠재적 이해 상충'이 명시됐다. 공급사가 고객에게 돈을 빌려줘 자사 칩을 사게 하는 구조라는 점에서 순환 투자 우려가 부각됐고, 주가는 6월 고점 \$481.57 대비 약 29% 낮은 수준이다.

**6. 코히런트 (COHR) +10.90% — 미 상원 초당파 의원들이 연방정부의 중국산 광트랜시버 사용 금지 법안 발의, 번스타인 시장수익률 상회 개시, 포톤링크 고객 협의 20건 이상**
코히런트는 시가 \$290.00에서 고가 \$323.23(+12.31%)까지 오른 뒤 \$319.19(+\$31.38, +10.90%)로 마감했다. 공화당 존 코닌·데이브 매코믹, 민주당 존 페터먼·루벤 가예고 상원의원이 연방정부의 민감 시스템에 중국산 광트랜시버 사용을 금지하는 법안을 발의했고, 대상으로는 중국 이옵토링크와 중지 이노라이트가 거론됐다. 규제는 현재 AI 데이터센터에 쓰이는 800G·1.6T가 아니라 차세대 3.2T 제품을 겨냥할 가능성이 크다는 분석이지만 미국 업체의 점유율 확대 기대가 매수를 불렀다. 여기에 번스타인이 코히런트·루멘텀·시에나·아리스타를 'AI 인프라의 구조적 승자'로 꼽으며 시장수익률 상회로 개시했고 루멘텀 목표가로 \$1,220을 제시했으며, 코히런트의 통합 광학 플랫폼 포톤링크는 고객 협의가 20건을 넘었다. 루멘텀(LITE)도 \$1,045.78(+7.67%)로 고가 \$1,078.04(+10.99%)를 찍었다.
