## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 12개:** 조선·LNG선·함정 MRO(격차 +18.9%p), 방산(격차 +16.0%p), 정유·LNG·가스(격차 +15.3%p), Oil & Gas Production(격차 +13.3%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 사이버보안, Marine Transportation, 물·환경, 의류 OEM·패션 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** CDMO·바이오시밀러(-8.3%p)
- **이제 막 힘 붙는 조기 테마:** 드론·UAM(조기 66), 증권·거래소(조기 66), 우주·위성(조기 65) — 다음 주 선점 후보군.
