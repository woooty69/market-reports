# 미국→한국 선점 2026-10-29 (미국 2026-10-29 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 76개 · 연결 종목 889개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** 조선·LNG선·함정 MRO(격차 +21.8%p), 방산(격차 +20.4%p), 정유·LNG·가스(격차 +14.4%p), 석유화학(격차 +14.2%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 전력반도체, CDMO·바이오시밀러, 유전체·유전자치료, 바이오텍·기술수출 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 클라우드·데이터센터 운영(-9.8%p), 반도체 소재·부품(-6.4%p)
- **이제 막 힘 붙는 조기 테마:** Electrical Products(조기 73), 반도체 기판·유리기판·MLB(조기 73), 전공정 장비(조기 72) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** S-Oil(정유·LNG·가스, 점수 100), 한국가스공사(정유·LNG·가스, 점수 96), SK이노베이션(정유·LNG·가스, 점수 89)
