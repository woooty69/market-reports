## 🗓 시장 요약

**① 코스피 약보합 출발 뒤 1%대 상승, 코스닥은 4.7% 급등에 이틀째 사이드카**
밤사이 미국 10월 CPI가 전월 대비 +0.4%(근원 +0.3%)로 예상을 웃돌고 월러 연준 이사가 12월 50bp 인상 가능성을 언급하면서 코스피는 5,209.71로 약하게 출발했다. 하지만 미국 지수 선물이 S&P500 +0.30%·나스닥100 +0.74%로 반등하자 저가 매수가 들어와 오전 중 5,326.97까지 올랐다. 코스닥은 부양책 기대와 반도체 장비·2차전지 강세에 700선(고가 701.54)을 잠시 넘어섰다.

**② 반도체: 하이닉스·삼성전자 2～3%대, 상승 탄력은 소부장에 집중**
SK하이닉스 +3.22%(1,251,000원)·삼성전자 +2.44%(203,750원)로 대형주는 전날(+6.91%·+5.00%)보다 오름폭이 줄었다. 대신 주성엔지니어링 +12.87%·원익IPS +10.82%·피에스케이홀딩스 +14.19%·티에스이 +20.25%·테크윙 +20.72% 등 장비·테스트 소부장이 10～20% 급등하며 ★ 급등 대형주 58종목 가운데 절반 이상을 차지했다. 이수페타시스 +19.65%·코리아써키트 +17.15%·대덕전자 +10.50% 등 기판주도 이틀째 강하다.

**③ 주도 업종은 소프트웨어·보안·바이오, 약세는 항공·게임·손보**
금융보안원 해킹 소식에 안랩 +12.20%·지니언스 +10.40%·라온시큐어 +10.98% 등 보안주가 일제히 올라 소프트웨어 업종이 +4.94%다. 셀트리온 +4.93%·한미약품 +5.89% 등 바이오도 강하다. 반면 전날 13%대 급등한 항공 업종은 한진칼 −14.44%·대한항공 −3.08%로 되돌림이 크고, 크래프톤은 3분기 실적 부진에 −12.01%, 삼성화재는 캐노피우스 2.3조원 인수 부담에 −7.35%다.

**④ 원화 강세·해외 증시는 혼조**
원/달러 환율은 1,336.00원으로 8.50원 내려 원화가 강세다. 아시아에서는 닛케이225가 +0.80%(60,942.48)로 오르고 항셍은 −0.62%로 약하며, 상해종합은 LS 기준 아직 오늘 값이 확인되지 않는다. 미국 의회가 젠슨 황 관련 스캔들을 계기로 AI칩 수출을 전면 봉쇄하는 방안을 논의한다는 보도는 오후장 반도체 변수로 남아 있다.

## 1. 업종별 흐름

**상승 업종** — 소프트웨어 +4.94%(55종목 상승·13종목 하락)가 보안주 급등으로 1위권이고, 통신장비 +4.37%, 건강관리업체및서비스 +4.35%, 전자장비와기기 +3.51%, 생물공학 +3.42%, 디스플레이장비및부품 +3.36%가 뒤를 잇는다. 반도체와반도체장비는 +2.86%지만 159종목이 오르고 11종목만 내려 상승 폭이 가장 넓다. 화학(+3.01%)은 에코프로비엠 +10.30%·에코프로 +8.53% 등 2차전지 소재 반등 영향이다.

**하락 업종** — 항공사 −8.26%(2종목 상승·7종목 하락)는 전날 +13.67% 급등의 되돌림으로 한진칼 −14.44%·대한항공 −3.08%가 눌렀다. 게임엔터테인먼트 −6.63%는 크래프톤 −12.01% 영향이 크고, 손해보험 −5.61%는 삼성화재 −7.35%가 주도했다. 조선 −2.11%(HD현대중공업 −3.36%·HD한국조선해양 −2.86%)와 비철금속 −2.66%(고려아연 −4.14%)도 약하다.

**시장의 시선** — 오후장에는 ① 코스닥 700선 안착 여부와 소부장 급등주(★ 58종목)의 차익 실현 강도, ② 외국인이 코스피에서 순매도(−562억원)를 순매수로 돌리는지, ③ 대형 반도체가 미국 AI칩 수출 규제 보도에도 상승을 지키는지가 관건이다. 실적 발표 시즌이어서 크래프톤·삼성화재처럼 실적·M&A 뉴스가 나온 종목별 차별화가 이어질 가능성이 크다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 50종목

*① 오늘 새로 편입된 급등 대형주 32종목(1～32번, 12시 현재 시총 1,000억원 이상 · +10% 이상, 시총 큰 순) → ② 오전장 언론 최다 보도 18선(33～50번). ★ 급등 대형주는 58종목으로, 검증 기준(시총 상위 40종목) 가운데 ②에 든 8종목을 뺀 32종목을 ①에 싣고 시총 4,379억원 이하 18종목은 분량 한도(50종목)로 생략했다.*

**1. 대덕전자 (353200) 88,400원 · 4조 3,685억원 · +10.50% — FC-BGA 라지바디 진입·증설 LTA 기대, 기판주 이틀째 강세**
반도체 기판주가 이수페타시스·코리아써키트와 함께 이틀째 급등하는 가운데 대덕전자도 10.50% 올라 거래대금 964억원으로 코스피 상위권이다. 이번 주 나온 NDR 후기 리포트는 대규모 증설에 따른 장기공급계약(LTA)·선수금 확보 규모와 FC-BGA 라지바디 시장 진입, 고객사 확대 가능성을 투자자 관심사로 꼽으며 회사의 자신감이 높아졌다고 전했다. 개별 공시는 없고 AI 서버용 기판 수요 기대가 다시 반영되는 흐름이다. [리포트: MERITZ 2026-11-09](https://woooty69.github.io/hw-pdf-arch-038/%EB%8C%80%EB%8D%95%EC%A0%84%EC%9E%90%EF%BC%BB353200%EF%BC%BD_20261109_MERITZ_2653902.pdf) · [리포트: iM 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/%EB%8C%80%EB%8D%95%EC%A0%84%EC%9E%90%EF%BC%BB353200%EF%BC%BD_20261102_iM_4098115028.pdf) · [리포트: Shinhan 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/%EB%8C%80%EB%8D%95%EC%A0%84%EC%9E%90%EF%BC%BB353200%EF%BC%BD_20261102_Shinhan_4030354659.pdf)

**2. ISC (095340) 148,200원 · 3조 1,414억원 · +11.51% — 테스트 소켓 대규모 수주 기대, 3분기 영업익 218억원**

## 4. 일정·관전 포인트

**오늘 오후 국내** — 3분기 실적 발표 시즌 막바지로 장중·장 마감 후 잠정실적 공시가 이어진다(오전에 에이팩트 3분기 영업익 51억원·+155%, 예스티 사상 최대 분기 영업익 공시). 삼성바이오로직스 유상증자 청약 결과(청약률 96.8%) 이후 실권주 처리, 한진칼우 투자경고 등 시장 조치 여부도 확인할 일이다.

**오늘 밤 해외** — 미국은 베테랑스데이로 주식시장은 열리지만 채권시장은 쉰다. 전날 10월 CPI(+0.4%·근원 +0.3%) 이후 연준 인사 발언이 12월 50bp 인상 논쟁의 방향을 가를 변수이며, 엔비디아 CEO 스캔들과 미국 의회의 AI칩 수출 봉쇄 논의 진행 상황도 반도체 투자심리에 영향을 줄 수 있다.

### 🇰🇷 오후장 관전 포인트

1. **코스닥 700선 안착 여부** — 고가 701.54까지 오른 뒤 699선에 머물러 있어, 이틀 연속 사이드카 이후 소부장 급등주(★ 58종목)의 차익 실현이 지수를 얼마나 끌어내릴지가 관건이다.
2. **외국인 방향** — 코스피 외국인은 오전 −562억원으로 다시 매도 우위다. 전날 8거래일 만의 순매수(+1,794억원)가 하루로 끝나는지 확인해야 한다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
