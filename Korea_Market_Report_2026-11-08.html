## 🗓 시장 요약

**① 휴장 중 국내: '빚투' 반대매매 경계와 증시 법안 논란**
코스피가 이틀 동안 10.98% 빠지면서 주말에는 삼성전자·SK하이닉스 주가는 급락했는데 신용융자 잔고는 그대로라 반대매매발 수급 압박이 올 수 있다는 지적이 이어졌다. 정부는 금요일에 신용융자 담보비율 유지 의무를 3개월 면제했고 증권사들도 담보비율 인하·반대매매 유예에 나선 상태다. 정치권에서는 증시 관련 법안을 두고 여당 안에서 이견이 나오고, 세제정책이 잇달아 번복되며 추가 변경 우려가 커졌다는 보도가 나왔다. 반도체 호황으로 기업의 10억원 넘는 고액 예금이 1천조원에 육박했다는 통계도 나왔다.

**② 글로벌: 블루웨이브 충격 뒤 첫 주말, 미국은 '저가 매수' 반등 마감**
금요일 뉴욕 증시는 S&P500 +0.31%·나스닥 +1.09%·나스닥100 +1.35%로 반등했고 VIX는 25.64로 9.01% 내렸지만 다우는 0.46% 떨어졌다. 닛케이는 '블루웨이브 쇼크'로 세계 증시 시가총액 약 4,800조원이 하루 새 증발했다고 집계했다. 오픈AI 최고재무책임자는 중간선거 결과에도 AI 데이터센터 투자를 계속하겠다고 밝혔다. 트럼프 대통령은 주말 동안 내각 추가 개편은 거의 없을 것이라 했고, 민주당의 탄핵·형사처벌 위협 주장에 대해 법무부에 조사를 지시해 정치 갈등이 이어졌다.

**③ 반도체: 마이크론 대만 HBM 공장 제동·EUV 장비 부족**
마이크론이 대만 타오위안 신규 메모리 공장 '팹 11E' 건설을 사실상 중단했다는 보도가 나왔다. 타오위안 노조가 영업이익 15% 배분과 현금 성과급을 요구하며 30억～45억달러 투자가 발목을 잡힌 것으로, 경쟁사의 HBM 증설이 늦어지면 삼성전자·SK하이닉스에는 공급 측면에서 유리할 수 있다. 동시에 ASML EUV 장비 공급이 모자라 두 회사가 장비 확보 경쟁을 벌이고 있다는 분석도 나왔다. 다만 미국 데이터센터 규제가 실제 법안으로 이어지면 영향은 2028년부터 커질 수 있다는 진단도 함께 나왔다.

**④ 강세 기대 업종: 통신·데이터센터·재생에너지·음식료**
KB증권은 AI 데이터센터 완판과 5G 요금 개편으로 통신 3사의 2027년 합산 영업이익이 5조 2,876억원으로 사상 최대가 될 것으로 봤다. 신한투자증권은 통신서비스를 '데이터센터 가치가 숨어있는 방어주'로, 하나증권은 국내 데이터센터를 '정상영업 중'이라며 비중확대를 냈다. 미국 민주당의 친환경 정책 복귀 기대에 태양광·풍력(한화솔루션·씨에스윈드)도 거론되고, 음식료는 전주 코스피를 12.8%p 앞섰으며 삼양식품이 분기 최대 실적을 냈다.

**⑤ 약세 우려: 전력기기·방산·화학·증권 보안 사고**
미국 데이터센터 규제 변수로 전력기기 호황에 '먹구름'이 꼈다는 분석이 이어졌고, K방산은 실적·주가 동반 부진과 입찰 제한 속에 시험대에 섰다는 평가가 나왔다. 화학은 KCC·LX하우시스가 원가 상승으로 3분기 나란히 부진했고, LG화학은 중국 지린OLED로부터 OLED 재료 특허 무효심판을 청구당했다. 증권업은 미래에셋증권이 해킹으로 고객 3,800여명 계좌번호와 임직원 3만 5,255명 정보가 유출됐다고 신고했다.

**⑥ 다음 거래일(11/9 월) 변수: 반등 출발 vs 환율·외국인**
월요일은 금요일 밤 필라델피아 반도체 +4.21%와 야간선물 795.50(+1.60%)이 출발점이다. 다만 원/달러가 1,364원으로 올라 있고 외국인 순매도가 이틀 6조원을 넘었다는 점, 다음 주 미국 10월 CPI·PPI 결과에 따라 금리 인상 경계가 다시 커질 수 있다는 점이 부담이다. 코어위브·시스코 실적은 AI 인프라 투자 지속성을 가늠할 첫 시험대이며, 이번 주 공모주 청약에는 하나에어로다이내믹스·엠비디 등 4개사가 나온다.

## 1. 업종별 흐름

**상승 업종** — 휴장 중 뉴스 기준 호재 업종은 통신·데이터센터·항공·음식료·재생에너지다. 통신은 KB증권이 3사 2027년 영업이익 5조 2,876억원(사상 최대)을 전망했고 직전 거래일 LG유플러스 +5.21%·KT +2.90%로 이미 강했다. 항공은 제주항공이 3분기 영업이익 549억원(컨센서스의 5배 이상)으로 증권사 6곳 모두 '매수'를 냈고, 대한항공의 차세대 항공기 103대 도입이 연료비 절감 기대를 키웠다. 음식료는 삼양식품 3분기 영업이익 1,962억원(+49.9%)으로 해외 성장이 재확인됐고, 재생에너지는 씨에스윈드(+3.48%)에 대해 다음 주 미국 에너지 인허가 개혁안 표결이 첫 분기점이라는 분석이 나왔다.

**하락 업종** — 휴장 중 뉴스 기준 악재 업종은 전력기기·방산·화학·증권이다. 전력기기는 직전 거래일 전기장비 −7.29%(효성중공업 −11.95%·LS ELECTRIC −10.25%)에 이어 미국 데이터센터 규제가 수주 경로를 흔들 수 있다는 우려가 계속됐다. 방산은 LIG디펜스앤에어로스페이스 목표가가 KB증권에서 110만원→55만원으로 반토막 났고, 화학은 KCC·LX하우시스·롯데케미칼 등 3분기 부진과 LG화학 특허 분쟁이 겹쳤다. 증권은 미래에셋증권 해킹이 금융권 보안 우려를 키웠다.

**시장의 시선** — 다음 거래일에는 낙폭이 컸던 반도체(전 거래일 168종목 중 153종목 하락)가 금요일 밤 SOX 반등과 마이크론 증설 차질 소식에 얼마나 되돌리는지가 첫 관심사다. 통신·IT서비스·데이터센터는 '미국 규제 반사이익'으로, 항공·음식료는 실적으로, 태양광·풍력은 미국 친환경 정책 기대로 묶여 움직일 가능성이 크다. 반대로 전력기기·방산은 실적 대비 주가가 크게 빠졌지만 추정치 하향이 이어지고 있어 반등 강도는 상대적으로 약할 수 있다.

## 🧭 흐름 전환

*섹터 12개의 수치 점검표(하락 7·상승 5, 매일)와 Claude 주간 논지(리포트·뉴스·정책·유튜브). 점검표는 미리 정한 약속이지 매매 지시가 아니다 — 하락 점검 2개 = ⅓ 축소 검토, 3개 = 절반 검토, 가격 규칙은 논지보다 우선.*

① **바뀐 섹터** — **우주**는 규칙 단계가 '하락'에서 **'바닥 모색'**으로 바뀌었다. 하락 점검은 3/7(가격 규칙·호재 무반응·하락 서사 급증)로 그대로지만 상승 점검이 2/5로 늘었고, 바구니는 고점 대비 −63%·200일선 대비 −45.6%까지 빠져 나쁜 소식이 상당 부분 반영됐을 수 있다는 논지다. 가장 강한 반론은 상승 뉴스가 쏟아져도 추정치와 목표가가 오르지 않아 시장이 아직 그 뉴스를 돈으로 인정하지 않는다는 점이다. **조선**도 '하락'에서 **'바닥 모색'**으로 바뀌었다(하락 점검 2/7·상승 점검 2/5, 20일 코스피 대비 −2.6%). 고점 대비 −59%로 싸졌지만 미국 LNG 발주가 2027년으로 밀리고 추정치 수정이 −0.14로 아직 내려가는 중이라 싸다는 것만으로는 바닥 확인이 안 된다는 반론이 맞선다.

## 🏛 새로운 정책

*한국·미국·중국·EU·일본 정부 정책 중 업종에 영향을 줄 새 사안·단계 변화(미 연방관보·EU 관보·각국 부처·국회·입법예고·중국 상무부/국무원·일본 경제산업성 등 + 뉴스, Claude 분류).*

- **[미국] 상무부 국제무역청 — 중국산 고무약품(CBS) 반덤핑 예비 긍정 판정** (단계: 예비판정, 🆕 최초)
  타이어용 가황촉진제인 N-사이클로헥실벤조티아졸-2-설펜아마이드(CBS)가 중국에서 정상가격보다 싸게 수입됐다는 예비판정이 11/6 연방관보에 실렸다. 중국산이 밀려나면 비중국 고무약품·화학 업체에 우호적이고(▲화학), 타이어 업체에는 원가 부담 요인이 될 수 있다. 최종판정 전이라 세율·대상은 바뀔 수 있고, 한국 직접 수혜 종목은 팩에서 특정되지 않았다.
- **[미국] 상무부 산업안보국 — 폴리실리콘 관련 비축 제한 면제 신청 정보수집 공고** (단계: 시행 절차, 🆕 최초)
  폴리실리콘 관련 규제의 면제 신청 서식을 예산관리국(OMB) 심사에 올리는 정보수집 공고로, 규제 운영이 구체화되는 단계다. 미국 내 태양광 공급망 규제가 촘촘해진다는 뜻이라 태양광(▼) 쪽에는 절차 부담이지만, 비중국 폴리실리콘을 쓰는 업체에는 상대적으로 유리할 수 있다. 공고 자체는 행정 절차라 단기 주가 영향은 제한적일 수 있다.
- **[한국] 정부 — 신약 연구개발(R&D) 예산 2년째 감소** (단계: 시행, 🔄 진전)
  신약 개발 경쟁이 거세지는 가운데 정부 신약 R&D 투자가 2년 연속 줄었다(2024년 5,433억원 기준에서 감소)는 보도가 나왔다. 제약·바이오(▼)의 정부 과제 의존 중소형사에 부담이며, 이미 알려진 예산 흐름의 연장선이라 새 충격의 크기는 크지 않다.
- **[한국] 국회·여당 — 증시 관련 법안 두고 여당 내 이견** (단계: 법안, 🆕 최초)
  코스피 급락으로 개인 투자자 불만이 커지자 증시 관련 법안을 두고 여당 안에서 의견이 갈리고 있다. 세제정책이 잇달아 번복되며 추가 변경 우려도 함께 나왔다. 증권·지주사 등 정책 민감 업종의 변동성 요인이며, 아직 구체적 수정안이 나온 단계는 아니다.

      if (isBack && ++tries < 25) { setTimeout(go, 150); return }

      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
