## 🗓 오늘의 요약

**① 미국이 쉬는 동안 한국이 4.6% 뛰었다**
9/7(월) 코스피가 **+308.18p(+4.61%, 6,995.39)** 급등해 **약 6주 만의 최고치**를 기록했다. 7,000선 재진입까지 **4.61포인트**를 남기고 멈췄다. 미국 증시가 노동절로 닫혀 있어 **아시아가 먼저 반응한 하루**였고, 어제 리포트에서 "금요일 미국 반도체 랠리가 국내 현물에 아직 반영되지 않았다"고 짚은 미반영분이 하루 만에 해소됐다.

**② 촉매는 오픈AI의 'GPT-6 아스트라'였다**
9월 4일 출시된 오픈AI의 최신 모델 **GPT-6 아스트라**를 두고 젠슨 황 엔비디아 CEO가 9/7 **"범용인공지능(AGI)이 도래했다"**고 선언했다. 아스트라는 **엔비디아 GPU 10만 개 이상**을 동원해 훈련한 오픈AI 사상 최대 규모 학습 모델이다. 황 CEO는 여기에 **"다음엔 GPU 40만 개가 가동될 것"**이라고 덧붙였다. AI 인프라 투자 기대에 다시 불이 붙었다.

**③ 성능 지표가 실제로 계단을 하나 올랐다**
새로운 문제 해결 능력을 측정하는 **ARC-AGI-3 평가에서 99.9%**를 기록했다. **전작은 7.9%**였다. 기업용 서비스 47개를 다루는 능력(오토메이션벤치)은 **41.4%**로 전작 GPT-5.6 솔(**18.1%**) 대비 **2.3배**, 경쟁 모델 앤트로픽 클로드 페이블 5.1(**31.4%**) 대비 1.3배다. 그레그 브록먼 오픈AI 사장은 **"화면을 보고 키보드와 마우스를 움직여 API가 없는 낡은 소프트웨어까지 다룰 수 있다"**고 설명했다.

**④ 'AI 피크아웃' 논쟁이 뒤집혔다 — 토큰 가격이 근거였다**
직전까지 AI 하드웨어 약세론의 핵심 근거는 **토큰 가격 하락**이었다. 실리콘데이터의 LLM 토큰 가격지수는 지난달 말 **사상 처음 100만 토큰당 1달러 밑으로** 떨어져 **5월 대비 반 토막**이 났고, 이는 금리 상승·순환 금융 논란과 함께 **AI 투자 수익성에 대한 의심**을 키웠다. 아스트라가 이 구도를 뒤집었다 — **가격 하락과 성능 개선이 동시에 일어나면 수요 곡선 자체가 위로 올라가 더 많은 인프라 투자가 정당화된다**는 논리다.

**⑤ 수급이 완전히 뒤바뀌었다 — 외국인·기관이 5조원 이상 샀다**
9/7 유가증권시장에서 **외국인이 2조 5,869억원, 기관이 2조 6,327억원**을 순매수했다. 합계 **5조 2,196억원**이다. 반대로 **개인은 6조 8,212억원을 순매도**했고, 이 물량이 7,000선 재진입을 막았다. SK하이닉스만 봐도 외국인 **+77만 2,036주**, 기관 **+36만 5,719주**로 8월 내내 이어지던 외국인 매도 기조가 확실히 꺾였다.

**⑥ 괴리율이 12%p 좁혀졌다 — 어제 짚은 첫 확인 지점이 나왔다**
SKHY 가격은 미 휴장으로 **\$177.00에 고정**돼 있는데 국내 SK하이닉스가 **+8.26%(1,783,000원)** 오르면서, 괴리율이 **+45.1% → +33.1%**로 **12.0%p 축소**됐다. 어제 리포트에서 "오늘 국내 주가가 ADR을 따라 올라 괴리가 좁혀지는지가 첫 확인 지점"이라고 적은 부분이 확인된 셈이다. 다만 **여전히 +33%대**로 절대 수준은 높다.

**⑦ 야간선물은 상승했지만 거래가 얕았다**
코스피200 야간선물이 **1,123.30(+1.22%, +13.55)**으로 올랐다. 다만 거래량이 **12,377계약**으로 직전 세션(32,666계약) 대비 **62% 급감**했다. **미국 정규장이 열리지 않아 참여자가 적었다**는 뜻이며, 이 세션의 가격 신호는 평소보다 신뢰도가 낮다. 정규장 선물 종가(1,109.75) 위에서 마감했다는 방향성만 참고할 사안이다.

## 📰 섹션 1. GPT-6 아스트라 — 무엇이 달랐나

**출시와 반응**
오픈AI가 **9월 4일 일반에 출시**한 최신 모델이다. 시연 영상에서는 사용자가 말로 **"노란 원을 하나 그려줘"**라고 지시하자, 그 원이 그림판의 원 → 로켓 그림의 창문 → 3차원 입체 로켓 모형 설계도 → 로켓이 소행성을 피하는 게임의 주인공으로 이어지며 변환됐다. **AI가 여러 소프트웨어를 스스로 오가며** 만들어낸 결과물이다.

**핵심은 '행동지능'이다**
범용 벤치마크 점수보다 **컴퓨터 응용프로그램을 스스로 끝까지 다루는 능력**에서 차이가 컸다. 브록먼 사장은 **"오히려 사람이 세운 규칙이 방해가 될 정도로 자율성과 능동성이 높아졌다"**고 했고, **"훗날 사람들은 아스트라를 AGI 초기 단계로 볼 것"**이라고 평가했다. 이영진 삼성증권 연구원은 **"AGI에 관해 보편적으로 합의된 정의는 없지만, 엔터프라이즈 업무를 하기 위한 범용 지능이라는 단어를 가장 잘 표현하는 모델"**이라고 진단했다.

**하드웨어 쪽 함의 — 스케일링 법칙의 재확인**
아스트라는 미국 텍사스 **스타게이트 데이터센터**에서 엔비디아 GPU **10만 개 이상**을 돌려 훈련했다. **연산 자원을 더 투입하면 성능이 향상된다는 '스케일링 법칙'에 다시 힘이 실렸다**는 것이 시장의 해석이다. 젠슨 황 CEO가 **"다음엔 GPU 40만 개"**를 언급한 것도 같은 맥락이며, 이 문장 하나가 국내 반도체·전력·기판주를 동시에 밀어올렸다.

**투자자 함의**
AI 사이클의 지속성에 대한 논쟁이 **토큰 가격(수익성)에서 모델 성능(수요)으로 축을 옮겼다.** 다만 검증이 필요한 대목이 남는다 — 성능 도약이 실제 **기업 도입과 결제로 이어지는 속도**는 아직 데이터가 없고, GPU 40만 개는 **자본지출 부담이 그만큼 커진다**는 뜻이기도 하다. 9/4 브로드컴이 AI 매출 **+221%**를 내고도 주가가 **+0.2%**에 그친 사례가 있으므로, **실적이 아니라 서사가 주가를 밀어올린 국면**이라는 점은 구분해서 볼 필요가 있다.

**🇰🇷 [전달] 오늘(9/8) 국내 증시가 마주하는 조건**
코스피200 야간선물은 **1,123.30(+1.22%)**으로 정규장 선물 종가(1,109.75) 위에서 마감했다. 다만 거래량이 **12,377계약**으로 직전 세션 대비 **62% 급감**해 신호의 신뢰도가 낮다. **미국이 오늘 밤 재개하면서 3일간 쌓인 재료(예멘 확전·OPEC+ 동결·아스트라)를 한꺼번에 소화**하므로, 국내는 오늘 낮 동안 그 결과를 미리 알 수 없는 상태로 움직인다.

**🇰🇷 [괴리율] +33.1% — 축소됐지만 여전히 높다**
SKHY \$177.00(9/4 고정) × 10 × 1,340.5원 ÷ 1,783,000원 − 1 = **+33.1%**. 직전 **+45.1%**에서 **12.0%p 축소**됐다. 축소 요인은 **국내 주가 급등(+8.26%)**이며, 원/달러 하락(−9.9원)도 같은 방향으로 작용했다. 다만 오늘 밤 미국 재개에서 **SKHY가 국내 상승분을 추가로 반영하면 괴리가 다시 벌어질 수 있다.**

## 💬 섹션 4. 기관·증권가 코멘트

- **젠슨 황 (엔비디아 CEO):** GPT-6 아스트라를 두고 **"범용인공지능(AGI)이 도래했다"**고 선언했고, **"다음엔 GPU 40만 개가 가동될 것"**이라며 AI 인프라 투자 확대를 시사했다.
