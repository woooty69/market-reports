## 🗓 시장 요약

**① WTI까지 100달러를 넘겼고, 10년물은 5%의 문턱에서 마감했다 — 나흘 연속 하락**
뉴욕 증시 3대 지수가 나흘째 내렸다. 다우가 **316.56포인트(−0.60%)** 내린 **52,064.10**, S&P 500이 **−0.58%(7,591.70)**, 나스닥이 **−0.65%(26,081.72)**로 마감했고 러셀 2000은 **−1.04%**로 사흘 연속 주요 지수 중 최약이었다. 개장 직후 S&P 500이 **−0.59%**, 나스닥이 **−0.97%**로 출발한 뒤 오전에는 낙폭을 −0.3%대로 줄였지만, 오후 들어 국채금리가 재차 튀면서 되돌림이 무산됐다(TheStreet). 장중 미국 전체 상장종목의 **60% 이상**이 하락했고 상승 종목은 **32.5%**에 그쳤다. 사흘 전 "유가와 금리 중 하나만 감당할 수 있다"던 시장이 이날은 **둘 다 최악의 조합**을 받았다 — WTI 10월물이 **\$102.48(+6.69%)**로 8거래일 연속 올라 5월 19일 이후 최고, 10년물은 장중 **4.97%**를 찍고 **4.952%**로 마감해 2023년 10월 이후 최고다. 슈왑의 조 마졸라는 S&P 500의 **7,600~7,620**을 "모래 위에 그은 선"이라 했는데, 종가 7,591.70은 그 선 아래다.

**② 후티가 홍해 항구를 잡았고, 사우디는 1990년 이후 최저 생산을 보고했다 — 유가 6% 급등의 두 축**
이날 유가 급등에는 두 개의 새 재료가 겹쳤다. 첫째, 예멘 후티 반군이 홍해 연안의 요충지 **모카(Mocha)**를 장악해 **바브엘만데브 해협 통제권 확보를 눈앞에 뒀다**는 로이터 보도다(서울경제). 호르무즈에 이어 홍해 남단까지 위협받으면 우회 항로 자체가 막힌다. 둘째, 사우디아라비아가 OPEC에 **8월 산유량이 하루 623만 8,000배럴로 1990년 이후 최저**라고 보고했다는 블룸버그 보도로, 전월 보고 대비 **190만 배럴** 더 줄었다(야후파이낸스). 브렌트 11월물은 장중 **\$108.77**까지 올랐다가 **\$107.63(+6.34%)**로 마감했고, 미국 휘발유 전국 평균은 갤런당 **\$4.27**, 디젤은 **\$5.97**이다. 트럼프 대통령이 전날 "유가는 **11월 중간선거 이후에나** 내려갈 것"이라고 말한 것도 시장에 '단기 해결 없음'으로 읽혔고, WSJ는 백악관 참모들이 **전쟁이 2029년까지 이어질 가능성**을 내부 검토 중이라고 보도했다. PVM의 존 에번스는 "한 달 전보다도, 여름 초보다도 훨씬 오래 갈 분쟁이라는 것이 시장의 전제가 됐다"고 말했다.

**③ 재무부 바이백은 51.9억 달러에 그쳤고, 2년물은 3월 이후 최대폭으로 뛰었다 — 인상 확률 71%**
8월 PPI는 전월 대비 **+0.4%**로 컨센서스에 부합했지만 전년 대비 **+5.4%**(예상 5.3%, 7월 4.8%)로 가속했고, 근원 PPI도 전년 대비 **+4.6%**였다. 디젤 가격이 전월 대비 **+24.1%** 급등하는 등 에너지가 헤드라인을 밀어올렸다(연합뉴스). 여기에 전날 "최대 60억 달러"로 예고됐던 재무부 장기채 바이백이 실제로는 **51억 9,000만 달러**만 집행돼 시장에 실망을 안겼고, 트럼프의 **'성인 1인당 5,000달러 배당'(추정 비용 1조 3,500억 달러, 로이터)** 공약이 재정 우려를 키웠다. 결과는 곡선 전 구간의 52주 신고가다 — 2년물 **4.567%(+12.5bp)**로 3월 이후 최대 상승폭, 10년물 **4.952%(+11.4bp)**, 30년물 **5.360%(+7.5bp)**로 2004년 6월 29일 이후 최고 종가. 30년 고정 모기지 금리는 **7.07%**로 1년여 만에 7%를 넘었고(모기지뉴스데일리), 8월 기존주택 판매는 연율 **398만 채(−2.0%)**로 2025년 6월 이후 최저다. CME 페드워치의 9월 인상 확률은 전날 61.2%에서 **71.1%**로 올랐다. 피프스서드의 빌 애덤스는 "9월 에너지 가격 급등이 다음 주 연준 회의의 저울추를 인상 쪽으로 기울게 할 가능성이 크다"고 썼다.

**④ 반도체가 지수의 4배로 빠졌다 — 메모리 '바닥 통과' 하루 만에 역방향**
SOX가 **−2.66%(11,614.20)**로 3대 지수 낙폭의 4배 이상 내렸다. 전날 골드만삭스의 '메모리 최악은 지났다' 노트로 급등했던 종목이 그대로 되돌렸다 — SK하이닉스 ADR(SKHY) **−5.20%(\$188.30)**, 마이크론(MU) **−4.90%(\$977.41)**, 샌디스크(SNDK) **−4.06%**, 웨스턴디지털(WDC) **−4.43%**. 장비도 램리서치(LRCX) **−5.65%**, 어플라이드머티어리얼즈(AMAT) **−3.17%**, KLA(KLAC) **−3.13%**로 약했고, 인텔(INTC) **−5.57%**, AMD(AMD) **−3.36%**, 마벨테크놀로지(MRVL) **−3.43%**, 엔비디아(NVDA) **−2.37%**였다. 인베즈는 유가 100달러·10년물 4.9%가 **고베타 기술주의 할인율을 직격**한 것을 첫 원인으로 꼽았고, 키옥시아 CEO의 "가격은 충분히 올랐다" 발언이 프리마켓부터 차익실현의 명분이 됐다(팁랭크스). 다만 펀더멘털 쪽 재료는 반대다 — 서스쿼해나의 메흐디 호세이니는 이번 분기 DRAM 평균가가 전분기 대비 **+50%**, NAND가 **+60%** 오를 것으로 봤고, TSMC의 8월 매출은 전년 대비 **+53%**로 사상 최대였다. 하이퍼스케일러 중에서는 알파벳(GOOGL) **+0.59%**, 마이크로소프트(MSFT) **+0.16%**가 버텼고 애플(AAPL)은 **+3.56%(\$326.57)**로 대형주 중 가장 강했다.

**⑤ 구리와 유전서비스도 무너졌다 — '관세 기대'와 '인수 마진'이라는 각자의 이유**
소재에서는 프리포트맥모란(FCX) **−6.59%**, 서던코퍼(SCCO) **−6.9%**, 텍리소시스(TECK) **−6.6%**, 글로벌X 구리광산 ETF(COPX) **−7%**가 나왔다. 백악관이 **정련 구리 관세 부과 여부를 아직 결정하지 못했다**는 로이터 보도로 LME 3개월물 구리가 장중 사상 최고 **톤당 \$14,875**에서 **\$14,312(−3.1%)**로 꺾인 탓이다(24/7월스트리트). 은은 **−6.64%**, 금도 **−2.27%(\$4,359.40)**로 귀금속 전반이 달러·실질금리 상승에 밀렸다. 에너지 안에서도 유가 수혜는 고르지 않았다 — 엑슨모빌(XOM) **+0.61%**, 데본에너지(DVN) **+2.12%**는 올랐지만 베이커휴즈(BKR) **−6.66%**, 할리버튼(HAL) **−2.86%**, 코테라에너지(CTRA) **−8.62%**는 내렸다. 베이커휴즈는 바클레이즈 콘퍼런스에서 **136억 달러 차트인더스트리 인수의 초기 마진이 약 17%**에 그치고 2026년 잉여현금흐름 전환율 목표를 **40~45%**로 낮췄다고 밝힌 것이 직접 재료다.

**⑥ 오라클은 정규장 −5.4% 뒤 시간외 +7% — AI 인프라 매출이 처음으로 '증명'됐다**
오라클(ORCL)은 실적 발표를 앞두고 정규장에서 **−5.38%(\$152.94)** 내렸다가, 장 마감 후 FY2027 1분기(8월 마감) 실적에서 **매출 193억 5,000만 달러(+30%)**, **클라우드 인프라(OCI) 매출 74억 달러(+121%)**, **RPO 6,640억 달러(전년 대비 +2,090억 달러, 예상 6,306억 달러)**를 내놓자 시간외에서 **+7%** 반등했다. 조정 EPS **\$1.92**는 컨센서스 \$1.74를 웃돌았고, 분기 자본지출은 **285억 달러**(전년 85억 달러), 잉여현금흐름은 **−54억 달러**였다. 회사는 FY2027 매출 가이던스를 **최소 900억 달러**, EPS **\$8.10**으로 올렸다(쿼츠·CNBC). 같은 날 어도비(ADBE)도 3분기 매출 **67억 6,000만 달러**, 조정 EPS **\$6.13**으로 예상을 웃돌고 AI-퍼스트 ARR이 전년 대비 **150% 이상** 늘었다고 밝혔다. 금리·유가가 지수를 누르는 날에도 **AI 수주가 매출로 전환된다는 증거**에는 프리미엄이 붙었다.

**⑦ 한국은 '네 마녀의 날'에 외국인 2조 7천억 매도를 받아내며 7,000선을 지켰다**
전일 코스피는 **7,033.92(−17.72p, −0.25%)**로 마감했다. 장중 외국인 매도가 몰리며 **6,898.45**까지 밀렸다가 오후 개인 매수로 낙폭을 대부분 회복했다. 선물·옵션 동시만기와 KRX 반도체지수 리밸런싱(삼성전자·SK하이닉스 비중 상한 20%, 11일부터 적용)이 겹친 날이었고, 외국인은 코스피에서 **2조 7,140억원**을 순매도, 개인이 **2조 5,420억원** 순매수, 기관이 **1,580억원** 순매수였다(비즈니스코리아). 코스닥은 **836.92(+0.79%)**. SK하이닉스(000660)는 **1,853,000원(−0.16%)**으로 시가 1,879,000원·고가 1,890,000원에서 저가 **1,811,000원**까지 밀린 뒤 회복했고, 수급은 **외국인 −95만 6,724주·기관 +28만 7,228주·개인 +6만 8,853주**로 외국인이 5거래일 만에 순매도로 돌아섰다. 거래대금 **12조 6,370억원**, 시가총액 **1,353조 6,024억원**. 삼성전자(005930)는 **269,000원(−0.19%)**. SKHY 괴리율은 **+43.0% → +37.2%**로 하루 만에 **5.8%p 축소**됐다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  케이블·통신 — 전날 급락의 기술적 반등**
차터커뮤니케이션(CHTR) **+4.98%(\$140.56)**, 컴캐스트(CMCSA) **+2.36%**, AT&T(T) **+1.59%**, 버라이즌(VZ) **+0.46%**. 전날 컴캐스트 CFO의 "경쟁사 광섬유 가격은 비이성적" 발언으로 각각 −8.13%·−6.65% 밀렸던 종목이 되돌렸다. TheStreet는 차터의 반등을 **기술적 반등과 경영진 성장 계획에 대한 재평가**로 설명했다. 금리가 오른 날 방어적 통신주로 자금이 옮겨간 측면도 있다.

**상승 ②  자동차 — 포드·GM의 역행 상승**
포드(F) **+3.20%(\$13.91)**, GM(GM) **+2.82%**, 앱티브(APTV) **+2.65%**. 유가 100달러와 모기지 7%가 겹친 날 소비 경기주가 오른 것은 이례적이다. 이날 두 회사의 신규 공시는 확인되지 않았으며, 전날 트럼프의 **관세 환급·'5,000달러 배당'** 공약이 국산차 수요 기대로 읽혔을 가능성이 거론된다. 테슬라(TSLA)는 **−1.16%**로 방향이 달랐다.

**상승 ③  건강보험 — 엘리번스의 가이던스 재확인**
엘리번스헬스(ELV) **+4.95%(\$416.54)**, 몰리나헬스케어(MOH) **+3.17%**, 센틴(CNC) **+2.09%**, 시그나(CI) **+0.99%**. 엘리번스 CFO 마크 케이가 **3분기 EPS가 종전 전망을 상회하는 궤도**라며 2026년 조정 EPS **최소 \$27** 가이던스를 재확인했다(CNBC). 유나이티드헬스(UNH) **−1.22%**는 옵텀 자산 매각 여파가 이어졌다.

**하락 ①  반도체 (이날 최약) — 메모리·장비 동반 급락**
램리서치(LRCX) **−5.65%(\$298.01)**, 인텔(INTC) **−5.57%(\$100.32)**, 마이크론(MU) **−4.90%(\$977.41)**, 샌디스크(SNDK) **−4.06%**, 테라다인(TER) **−3.52%**, 마벨(MRVL) **−3.43%**, AMD(AMD) **−3.36%**, 어플라이드(AMAT) **−3.17%**, KLA(KLAC) **−3.13%**, 엔비디아(NVDA) **−2.37%**. SOX **−2.66%**. 예외는 RF 반도체 — 스카이웍스(SWKS) **+9.79%**, 코보(QRVO) **+6.77%**로, 두 회사 합병에 대한 **중국 SAMR 심사가 최종 단계에 들어갔다**는 CEO 발언이 재료였다. 인텔은 5거래일 **+20%** 급등 뒤 파이퍼샌들러가 **중립·목표가 \$110**으로 커버리지를 개시하자 차익실현이 나왔다.

**하락 ②  소재·구리 — 관세 결정 지연에 사상 최고가 되돌림**
프리포트맥모란(FCX) **−6.59%(\$71.21)**, 모자이크(MOS) **−3.09%**, 앨버말(ALB) **−3.02%**, 뉴몬트(NEM) **−2.00%**, 서던코퍼(SCCO) **−6.9%**. 백악관의 **정련 구리 관세 미결정** 보도로 LME 구리가 장중 사상 최고(\$14,875)에서 **−3.1%** 반락했고, 중국의 8월 구리 수입이 **6년 만의 최저**를 기록한 것도 겹쳤다(슈왑). 은 **−6.64%**, 금 **−2.27%**로 귀금속도 동반 하락했다.

**하락 ③  AI 서버·하드웨어·유전서비스 — 마진과 공급 제약**
HPE(HPE) **−6.25%**, 델(DELL) **−5.35%**, 루멘텀(LITE) **−5.39%**, 버티브(VRT) **−5.62%**, 슈퍼마이크로(SMCI) **−3.98%**, 코히런트(COHR) **−3.40%**, 플렉스(FLEX) **−4.14%**. HPE는 지난주 실적에서 **메모리·CPU·드라이브 부족으로 수주를 매출로 전환하지 못한다**고 밝힌 뒤 약세가 이어지고 있다. 유전서비스에서는 베이커휴즈(BKR) **−6.66%**, 할리버튼(HAL) **−2.86%**, 슐럼버거(SLB) **−1.82%**가 유가 급등에도 내렸고, 주택건설도 레나(LEN) **−3.54%**, DR호턴(DHI) **−2.42%**, 풀티(PHM) **−2.12%**로 모기지 7% 돌파의 직격을 받았다.

> 🇰🇷 [전달] **코스피200 야간선물은 1,073.00(−39.00, −3.51%)**로 마감했다. 시가 **1,109.45**로 출발해 고가 **1,110.15**를 찍은 뒤 저가 **1,069.00(−3.87%)**까지 밀렸고, 낙폭을 거의 되돌리지 못한 채 끝났다. 방향은 SOX **−2.66%**·SKHY **−5.20%**와 같고, 하락 전환 시점은 미국 정규장에서 WTI 100달러 돌파·10년물 4.95% 터치·반도체 급락이 동시에 진행된 시간대와 겹치나 특정 트리거는 미확인이다. 거래량은 **24,309계약**으로 전일(5,589계약)의 **4.3배**, 미결제약정은 **128,761계약(+1,028)**으로 만기 후 원월물 신규 포지션이 실제로 쌓였다. 국내 정규장 SK하이닉스(000660) −0.16%에는 미국 반도체 급락분이 전혀 반영돼 있지 않으므로, 야간선물 −3.51%는 **SOX −2.66%에 코스피200의 반도체 베타를 곱한 수준의 전달이 이미 완료된 값**이다.
>
> [수급] 전일 국내는 코스피 **7,033.92(−0.25%)**, 코스닥 **836.92(+0.79%)**였고, 장중 저점 **6,898.45(−2.2%)**에서 개인 매수(**+2조 5,420억원**)로 회복했다. 외국인은 코스피 **−2조 7,140억원**으로 만기일 프로그램 매도가 집중됐고, SK하이닉스(000660)는 **외국인 −95만 6,724주·기관 +28만 7,228주·개인 +6만 8,853주**로 외국인이 5거래일 만에 순매도 전환(직전 4일 누적 +122만 주), 기관은 순매수를 유지했다. 괴리율은 **+43.0% → +37.2%**로 **5.8%p 축소** — ADR이 **−5.20%** 내린 반면 국내 원주는 **−0.16%**에 그쳤고, 원/달러가 **1,350.60원(+9.60원)**으로 되돌려 괴리를 넓히는 방향이었음에도 ADR 낙폭이 이를 압도했다. 이틀간 +39.3%→+43.0%→+37.2%로 괴리율의 변동이 ADR 쪽에서 만들어지고 있으며, 국내 원주는 ADR 급등에도 급락에도 반응 폭이 작다.

**[시장의 시선]** 이날의 첫 번째 사실은 **금리가 '재무부의 손'을 벗어났다**는 것이다. 바이백을 60억 달러로 예고하고 51.9억 달러를 집행한 날 2년물이 12.5bp, 10년물이 11.4bp 올랐다. 시장은 바이백 규모가 아니라 **5,000달러 배당 같은 재정 확장 신호**를 가격에 반영하고 있고, 이 구도에서 10년물 5%는 저항이 아니라 통과점이 될 수 있다.

두 번째는 **AI 거래의 분화가 '수주 확인'과 '가격 논쟁' 사이에서 일어났다**는 것이다. 오라클의 RPO 6,640억 달러와 어도비의 AI ARR +150%는 시간외에서 프리미엄을 받았고, 마이크론·SKHY는 키옥시아의 "가격은 충분히 올랐다"와 금리 4.95%에 5% 안팎 밀렸다. 같은 AI 안에서 **계약이 확인된 소프트웨어·인프라**와 **가격 사이클에 노출된 메모리**의 할인율이 달라졌다.

세 번째는 **한국 야간선물 −3.51%가 미국보다 크게 반응했다**는 것이다. S&P 500 −0.58%에 코스피200 야간선물이 여섯 배로 움직인 것은 코스피 시가총액의 절반이 반도체 두 종목이라는 구조의 결과이며, 만기 다음 날 원월물에 신규 포지션이 24,309계약 쌓인 채 만들어진 값이라는 점에서 전일 야간(5,589계약)보다 신뢰도가 높다.

주시할 변수는 세 가지다 — **①오늘 밤 8월 CPI(한국시간 21:30)**: 컨센서스 헤드라인 +0.4%·근원 +0.2%(전년 대비 3.4%·근원 2.4%)이며, 근원이 0.1%p만 높아도 인상 확률 71%가 굳어진다. **②9월 FOMC(9/15~16)**: 워시 의장의 첫 회의이자 30년물 5.36%·모기지 7.07% 환경에서의 결정. **③KRX 반도체지수 리밸런싱 적용(9/11) + 애프터마켓 개장(9/14)**: 삼성전자·SK하이닉스 비중 20% 상한 적용 첫날에 미국 반도체 −2.66%가 겹친다.

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 오라클 (ORCL) −5.38% — \$152.94, 클라우드 인프라 매출 +121%·RPO 6,640억 달러, 시간외 +7%**
오라클은 실적 발표를 앞둔 정규장에서 **8.69달러(5.38%)** 내린 \$152.94로 마감했고 거래량은 **5,290만주**였다. 장 마감 후 발표한 FY2027 1분기(8월 31일 마감) 실적은 **매출 193억 5,000만 달러(+30%, LSEG 예상 191억 4,000만 달러)**, **조정 EPS \$1.92(예상 \$1.74)**, GAAP 순이익 **46억 8,000만 달러(+60%)**였다.
핵심은 **클라우드 인프라(OCI) 매출 74억 달러(+121%)**와 총 클라우드 매출 **116억 달러(+62%)**, 그리고 **RPO 6,640억 달러**(전년 대비 +2,090억 달러, 스트리트어카운트 예상 6,306억 달러)다. 회사는 분기 중 **300억 달러 이상의 신규 AI 클라우드 계약**을 체결했고, **850MW의 데이터센터 용량**을 새로 가동했으며 **GPU 30만 개 이상**을 고객에 인도했다고 밝혔다.
비용도 같은 속도로 늘었다. 분기 자본지출은 **285억 달러**(전년 동기 85억 달러), 영업현금흐름은 사상 최대 **231억 달러(+184%)**였지만 잉여현금흐름은 **−54억 달러**, 총부채는 **1,250억 달러**다. 2분기 가이던스는 조정 EPS **\$1.85~1.93**, 매출 성장률 **30~34%**이고, FY2027 연간 가이던스는 **매출 최소 900억 달러·EPS \$8.10**으로 상향됐다. 주가는 시간외 **+7%**로 반응했다(쿼츠·CNBC).

**2. 마이크론 (MU) −4.90% — \$977.41, 키옥시아 '가격 충분히 올랐다'와 금리 4.95%에 골드만 랠리 반납**
마이크론이 **50.36달러(4.90%)** 내려 1,000달러 아래로 돌아왔다. 거래량은 **2,564만주**. 샌디스크(SNDK) **−4.06%**, 웨스턴디지털(WDC) **−4.43%**, 시게이트(STX) **−2.66%**도 함께 밀렸다. 팁랭크스는 프리마켓 하락의 배경으로 **전날 랠리 후 차익실현**과 키옥시아 오타 히로오 CEO의 "가격은 이미 충분히 올랐다"는 블룸버그 인터뷰를 꼽았고, 인베즈는 WTI 100달러·10년물 4.9%가 **고베타 기술주**를 직격했다고 썼다.
펀더멘털 쪽 재료는 반대 방향이다. 서스쿼해나의 메흐디 호세이니는 이번 분기 **DRAM 평균가 전분기 대비 +50%, 4분기 +20%**, NAND는 **+60%·+25%**를 전망했다. 골드만삭스 프라임브로커리지 데이터로는 미국 롱숏 헤지펀드의 총레버리지가 지난 1년 **27번째 백분위**, 순레버리지는 **4번째 백분위**로 포지션이 가볍고, CBOE 반도체 ETF 변동성지수는 7월 65에서 **36**으로 내려왔다. D.A.데이비슨의 길 루리아는 HBM 수요가 "현재 공급의 두 배를 넘고 여전히 매우 빠르게 증가"해 마이크론이 HBM 생산을 크게 늘려도 부족할 것이라고 말했다.
같은 날 공개된 13F로 스탠리 드러켄밀러가 2분기에 **마이크론과 인텔을 매도**한 사실도 보도됐다(인베즈). **9월 30일 FQ4 실적**의 컨센서스는 매출 **508억 달러**(가이던스 약 500억 달러), 비GAAP EPS **\$31.28**(전년 대비 +932%)이다.

**3. SK하이닉스 ADR (SKHY) −5.20% — \$188.30 (괴리율: +37.2%), 상장 후 최고가 다음 날 5% 반납**
SK하이닉스 ADR이 **10.33달러(5.20%)** 내린 \$188.30으로 마감했다. 시가 **\$189.43**, 저가 **\$187.17**, 고가 **\$193.55**로 장 초반 반등 시도가 있었으나 실패했고 거래량은 **2,164만 5,681주**로 전일(2,970만주)보다 27% 줄었다. 시간외에서는 **+0.34%(\$188.95)**였다. 전날 골드만삭스의 메모리 노트로 **+7.05%** 올라 52주 최고가를 경신한 다음 날, 미국 메모리 전반의 되돌림에 가장 큰 폭으로 반응했다.
국내 원주 SK하이닉스(000660)는 같은 날 **1,853,000원(−0.16%)**으로 마감해 미국 정규장 하락분은 아직 반영되지 않은 상태이며, 괴리율은 **+43.0% → +37.2%**로 5.8%p 좁혀졌다. 수급은 **외국인 −95만 6,724주·기관 +28만 7,228주**로 외국인이 5거래일 만에 순매도로 돌아섰고, 외국인 지분율은 **50.67% → 50.54%**로 낮아졌다.
전일 JP모건은 SKHY 커버리지를 **비중확대·목표가 \$245**로 개시하며 **AI 메모리 상승 사이클이 5년 이상** 이어질 것으로 봤고, 스톡애널리시스 기준 애널리스트 14명의 12개월 목표주가 평균은 **\$247.31(Strong Buy)**이다. 로이터는 삼성전자·SK하이닉스의 대규모 주주환원 계획이 한국 기업개혁의 첫 시험대라며 투자자들이 "더 많은 것을 요구한다"고 전했다.

**4. 애플 (AAPL) +3.56% — \$326.57, 아이폰 듀오 1,999달러 '기대보다 싸다' — 월가의 재평가**
애플이 **11.23달러(3.56%)** 오른 \$326.57로 마감해 대형주 중 가장 강했고 장중 **\$326.74**까지 올랐다. 거래량은 **6,986만주**로 이틀 연속 대형주 최다였다. 전날 행사 당일 −0.28%로 반응했던 시장이 하루 만에 방향을 바꾼 것은 **첫 폴더블 '아이폰 듀오'의 시작가 1,999달러가 다수의 사전 예상보다 낮았다**는 월가의 재해석 때문이다.
모건스탠리는 애플이 **단기 마진 극대화보다 보급 확대에 초점**을 둔 것으로 봤고, JP모건은 가을 제품 라인업이 "대체로 예상에 부합"한다고 평가했다(CNBC·시킹알파). 한 애널리스트는 **FY2027 아이폰 매출에서 듀오가 차지하는 비중 전망을 5%에서 10%로 두 배** 올렸다(스톡트위츠). 39명 애널리스트 컨센서스는 '보통 매수', 평균 목표주가 **\$331.53**이다.
반대편 재료는 마진이다. 슈왑은 일부 애널리스트가 "가격 인상 폭이 예상보다 작아 **마진 우려**가 생겼다"고 지적했다고 전했고, 키옥시아 CEO의 NAND 가격 인상 자제 발언은 애플에게 **부품 원가 측면의 간접 호재**로 해석됐다(WCCF테크). AT&T CEO는 듀오를 "정말 멋진 기기"라고 평가했다.

**5. 프리포트맥모란 (FCX) −6.59% — \$71.21, 백악관 '정련 구리 관세' 미결정 보도에 사상 최고가 구리 −3.1%**
프리포트맥모란이 **5.02달러(6.59%)** 내린 \$71.21로 마감했고 장중 **\$68.85**까지 밀렸다. 거래량은 **2,216만주**. 서던코퍼(SCCO) **−6.9%**, 텍리소시스(TECK) **−6.6%**, 글로벌X 구리광산 ETF(COPX) **−7%**로 구리 관련주가 일제히 내렸다.
촉매는 로이터의 **"백악관이 정련 구리 관세 부과 여부를 아직 결정하지 않았다"**는 보도다. 관세 기대가 미국행 물량을 글로벌 창고에서 끌어내며 만들어낸 희소성 프리미엄이 정책 불확실성 한 줄에 풀렸고, LME 3개월물 구리는 같은 세션 안에서 사상 최고 **톤당 \$14,875**를 찍은 뒤 **\$14,312(−3.1%)**로 반락했다(24/7월스트리트). 슈왑은 **중국의 8월 구리 수입이 6년 만의 최저**였다는 점과 관세 결정 연기를 함께 지목했다.
프리포트는 미국 최대 구리 생산업체로 구리 가격 레버리지가 가장 커 양방향 진폭이 가장 크다. 인도네시아 그라스버그 광산은 2025년 9월 토사 유입 사고 이후 2026년 하반기까지 완전 가동에 못 미치고 있다. 급락 후에도 연초 대비 **+40%**이며, 컨센서스 목표주가는 **\$72.05**, 50일 이동평균은 **\$66.72**다.

**6. 쿠퍼컴퍼니스 (COO) −14.67% — \$54.17, 4분기 EPS 가이던스 \$1.05~1.09 vs 컨센서스 \$1.19 — 쿠퍼서지컬 매각도 철회**
콘택트렌즈·의료기기 업체 쿠퍼컴퍼니스가 **9.31달러(14.67%)** 급락해 S&P 500 최대 낙폭을 기록했고 프리마켓에서는 **−18.1%**까지 밀렸다. 거래량 **1,765만주**. 7월 31일 마감 3분기 조정 EPS는 **\$1.15**로 컨센서스 \$1.12를 웃돌았지만 매출 **10억 7,000만 달러(+1%)**가 예상 11억 달러에 못 미쳤다.
문제는 가이던스다. 4분기 조정 EPS **\$1.05~1.09**(중간값 \$1.07)는 컨센서스 **\$1.19**를 크게 밑돌고, FY2026 연간 조정 EPS **\$4.51~4.55**(중간값 \$4.53)도 컨센서스 **\$4.63**을 하회한다. 여기에 회사는 **쿠퍼서지컬(여성건강 사업부) 전략적 검토를 종료하고 사업을 유지**하기로 했다고 밝혔다 — 접수된 인수 제안이 주주 이익에 부합하지 않았다는 설명이다. 분사·매각 기대로 주가를 지탱하던 명분이 사라졌다.
윌리엄블레어는 이날 투자의견을 **'시장수익률'로 하향**했고, 스티펠은 전략적 검토 결과를 이유로 목표주가를 내렸다(인베스팅닷컴). 실적 상회에도 가이던스 하향과 자산 매각 무산이 겹친 사례라는 점에서 전날 케이시스제너럴스토어(CASY) −14.24%와 같은 구조다.

**7. 스카이웍스 (SWKS) +9.79% — \$84.03, CEO "중국 SAMR 심사 최종 단계, 연말 클로징 목표" — 코보(QRVO) +6.77%**
RF 반도체 스카이웍스가 **7.49달러(9.79%)** 오른 \$84.03으로 마감해 이날 S&P 500 최대 상승 종목이 됐고 장중 **\$85.89**까지 올랐다. 거래량은 **1,132만주**로 평소의 몇 배였다. 합병 상대인 코보(QRVO)도 **+6.77%(\$112.36)**로 52주 최고가를 경신했다.
재료는 스카이웍스 필 브레이스 CEO가 **중국 국가시장감독관리총국(SAMR)의 합병 심사가 최종 단계에 들어갔으며 연말 클로징을 목표로 한다**고 확인한 것이다(야후파이낸스). 2025년 10월 발표된 이 거래는 **코보 1주당 스카이웍스 0.960주 + 현금 \$32.50**을 지급하는 구조로 합산 기업가치 **약 220억 달러**다. 중국 승인이 최대 불확실성이었던 만큼 합병 차익거래 스프레드가 **0.6%**까지 좁혀졌다(TS2).
반도체 전체가 −2.66% 내린 날 RF 두 종목만 급등한 것은 **거래 성사 확률의 재평가**라는 종목 고유 재료가 매크로를 이긴 사례다. 합병 후 회사는 애플 의존도를 낮추고 자동차·데이터센터 RF로 다각화한다는 계획이다.

**8. 인텔 (INTC) −5.57% — \$100.32, 5거래일 +20% 뒤 파이퍼샌들러 '중립·\$110' 개시에 차익실현**
인텔이 **5.92달러(5.57%)** 내린 \$100.32로 마감했고 거래량은 **9,620만주**로 반도체 중 가장 많았다. 직전 5거래일 동안 **20% 이상** 오른 종목이 금리·유가 충격에 가장 먼저 매물이 나왔다(24/7월스트리트).
종목 고유 재료는 **파이퍼샌들러가 투자의견 '중립', 목표주가 \$110으로 커버리지를 개시**한 것이다. 파이퍼는 최근 급등으로 "단기 추가 상승 여지가 줄었다"고 썼다(야후파이낸스). 이틀 전인 9월 8일에는 미즈호의 비제이 라케시가 목표주가를 **\$109에서 \$92로 내리고 '보유'**를 유지하며 "적정 가치" 수준이라고 평가한 바 있다. 라케시는 서버 CPU 공급이 2027년까지 타이트할 수 있고 첨단 패키징 매출이 2029년 **약 35억 달러**에 이를 것으로 보면서도, 18A 외부 고객 확약이 아직 없다는 점을 지적했다.
6월 22일 고점 **\$140.94** 이후 2분기 실적(매출 161억 달러, 파운드리 58억 달러)에도 GAAP 주당손실 \$2.16과 **150억 달러 유상증자**로 조정이 이어져 왔다. 31명 애널리스트 컨센서스는 매수 5·보유 24·매도 2, 평균 목표주가 **\$116.16**이다.

**9. 베이커휴즈 (BKR) −6.66% — \$59.40, 차트인더스트리 인수 초기 마진 17%·FCF 전환율 40~45%로 하향**
유전서비스 베이커휴즈가 유가 **+6.69%** 급등에도 **4.24달러(6.66%)** 내린 \$59.40으로 마감했고 장중 **\$59.04**까지 밀렸다. 거래량 **1,118만주**. 할리버튼(HAL) **−2.86%**, 슐럼버거(SLB) **−1.82%**도 내렸지만 베이커휴즈의 낙폭이 유독 컸다.
재료는 전날 바클레이즈 에너지·전력 콘퍼런스에서 로렌조 시모넬리 CEO가 밝힌 내용이다. **136억 달러에 인수해 최근 종결한 차트인더스트리의 초기 마진이 약 17%**에 그치고 **통합 비용**이 단기 현금흐름과 영업이익을 누를 것이며, 회사는 **2026년 잉여현금흐름 전환율 목표를 40~45%로 낮췄다**(스톡스토리·마켓비트). UBS는 이날 차트 부문 마진을 이유로 목표주가를 **\$70**으로 내렸다(인베스팅닷컴).
유가가 오르는 날 유전서비스가 내린 것은 시장이 **유가 수혜보다 인수 통합 리스크**를 먼저 계산했다는 뜻이며, 에너지 섹터 안에서도 상류 생산업체(데본 +2.12%, 엑슨 +0.61%)와 서비스·장비의 방향이 갈렸다.

**10. 엘리번스헬스 (ELV) +4.95% — \$416.54, CFO "3분기 EPS 종전 전망 상회 궤도" — 2026년 EPS 최소 \$27 재확인**
건강보험사 엘리번스헬스가 **19.64달러(4.95%)** 오른 \$416.54로 마감했고 장중 **\$421.90**까지 올랐다. 몰리나헬스케어(MOH) **+3.17%**, 센틴(CNC) **+2.09%**, 시그나(CI) **+0.99%**로 관리형 의료보험 업종이 동반 상승했다.
마크 케이 CFO는 투자자·애널리스트 미팅에서 **3분기 EPS가 종전 회사 전망을 상회하는 궤도에 있다**고 밝히고, **2026년 조정 EPS 최소 \$27** 가이던스와 급여비용(benefit expense) 전망을 재확인했다(CNBC·TheStreet). 메디케이드·ACA 거래소의 의료비 급증으로 지난해 가이던스를 잇달아 내렸던 업종에서 나온 첫 '상회' 신호라는 점이 반응의 크기를 설명한다.
같은 날 유나이티드헬스(UNH) **−1.22%**, HCA헬스케어(HCA) **−0.15%**와 방향이 갈린 것은 보험사 안에서도 **의료비 추세를 관리하고 있다는 증거**가 있는 종목만 재평가됐다는 뜻이다. 금리 급등으로 성장주가 밀린 날 방어적 헬스케어에 자금이 옮겨간 측면도 있다.

## 💬 섹션 3. 구루·기관 코멘트

**(A) 증권사 리포트 5선**
- **JP모건 — 메타(META) '중립 → 비중확대' 상향:** 전날 출시한 자율형 AI 에이전트 '뮤즈'를 핵심 근거로 들었다. 메타는 이날 **−1.42%(\$644.38)**로 전날 +6.55% 상승분 일부를 반납했다(슈왑).
- **파이퍼샌들러 — 인텔(INTC) '중립'·목표가 \$110 커버리지 개시:** 최근 급등으로 단기 상승 여지가 줄었다는 판단. 미즈호(9/8)는 목표가 **\$109 → \$92, '보유'**로 서버 CPU 공급 타이트·패키징 매출 2029년 35억 달러를 긍정 요인으로, 18A 외부 고객 부재를 부정 요인으로 들었다.
- **윌리엄블레어 — 쿠퍼컴퍼니스(COO) '시장수익률 상회 → 시장수익률' 하향, 스티펠 목표가 하향:** 4분기 EPS 가이던스 \$1.05~1.09(컨센서스 \$1.19)와 쿠퍼서지컬 매각 철회를 이유로 들었다.
- **UBS — 베이커휴즈(BKR) 목표가 \$70으로 하향:** 차트인더스트리 부문 초기 마진(약 17%)과 통합 비용, FCF 전환율 40~45% 하향을 반영했다.
- **서스쿼해나(메흐디 호세이니) — 메모리 가격 전망:** 이번 분기 DRAM 평균가 **전분기 대비 +50%**, 4분기 +20%; NAND **+60%**, 이후 +25%. 골드만삭스는 헤지펀드 총레버리지 27번째 백분위·순레버리지 4번째 백분위를 근거로 메모리 재진입 여지를 유지했다. 모건스탠리는 애플(AAPL)의 듀오 1,999달러 가격을 "마진보다 보급"으로 해석했고, JP모건은 전일 SKHY 커버리지를 **비중확대·\$245**로 개시했다.

**(B) 구루·시장 참여자**
- **빌 애덤스 (피프스서드 수석 이코노미스트):** "9월 에너지 가격 급등이 다음 주 연준 회의에서 **금리 인상 쪽으로 저울추를 기울게 할 가능성이 크다.**"

- **로렌스 윤 (전미부동산중개인협회):** "모기지 금리와 주택 판매는 반대로 움직이므로 고금리에 따른 완만한 둔화는 놀랍지 않다." 8월 재고 162만 채는 **10년 이상 만의 최대(4.9개월치)**.
- **CME 페드워치(9/16 FOMC):** 0.25%p 인상 확률 **71.1%**(전일 61.2%), 폴리마켓 **63%**.

## 📅 섹션 4. 일정 및 관전 포인트

- **📈 8월 CPI(9/11 금, 한국시간 21:30):** 컨센서스 헤드라인 **+0.4% m/m·3.4% y/y**, 근원 **+0.2% m/m·2.4% y/y**(브리핑닷컴). 연준 월러 이사는 근원 0.2%면 동결, 그 이상이면 인상을 지지한다고 밝혔다. 브렌트 108달러 환경의 첫 소비자물가라 헤드라인은 튀더라도 **근원 0.1%p가 인상 확률 71%를 굳히거나 되돌리는 변수**다. 크로거(KR) 실적도 같은 날.
- **🏛 9월 FOMC(9/15~16) — 인상 확률 71.1%:** 워시 의장의 첫 정책회의. 2년물 4.567%·30년물 5.360%·모기지 7.07%가 이미 인상을 가격에 반영한 상태라, 동결 시 단기물 되돌림 폭이 관전 포인트다. 16일 레나(LEN) 실적, 17일 8월 주택착공.
- **🏛 재무부 바이백 후속:** 60억 달러 예고에 51.9억 달러 집행으로 장기물 금리가 오히려 올랐다. 다음 바이백 규모와 '5,000달러 배당' 공약의 재원 논의가 30년물 5.36%의 방향을 정한다.
- **🛢 유가 — WTI 8거래일 연속 상승, 3년 만의 최장:** 사우디 산유량 623만 8,000배럴(1990년 이후 최저), 후티의 모카 장악, 미국의 이란 유조선 5척 파괴. 골드만의 120달러 시나리오가 현실화되는지, 트럼프의 "중간선거 후 종전" 발언이 시장에 반영되는지가 관건.
- **🇰🇷 KRX 반도체지수 리밸런싱 적용(9/11):** 삼성전자·SK하이닉스 비중 상한 **20%** 적용 첫날. 관련 ETF 자산 약 **8조원**의 패시브 자금이 중소형 반도체로 재배분되는 날에 미국 반도체 **−2.66%**·SKHY **−5.20%**·야간선물 **−3.51%**가 겹친다. 전일 외국인 −2조 7,140억원이 만기 청산이었는지 추세 매도인지는 이날 수급으로 확인된다.
- **🔧 SKHY 괴리율 +37.2% — 5.8%p 축소:** ADR **−5.20%** vs 국내 **−0.16%**. 국내 원주가 미국 낙폭을 얼마나 따라가는지에 따라 괴리율이 다시 벌어질 수 있다. 외국인이 5거래일 만에 순매도(−95만 6,724주)로 돌아선 반면 기관은 순매수(+28만 7,228주)를 유지한 점이 확인 포인트다.
- **📌 SK하이닉스 미확정 공시 2건:** 솔리다임 5조 프리IPO(재공시 기한 9/4 경과)와 중국 충칭공장 지분 4조 매각(재공시 기한 9/9 경과). 이날까지 확정 공시는 확인되지 않았다. 확정 시 실제 자산 재편이라 ADR·국내 주가 모두에 촉매다.
- **🇰🇷 한국거래소 애프터마켓 9월 14일 개장:** 저녁 8시까지 거래. 오후 4~6시 단일가 시간외 매매는 폐지되며 ETF·ETN은 제외다. 미국 프리마켓·유럽 정규장과 겹치는 첫 주가 되므로 야간선물·ADR·현물 간 괴리 구조가 달라질 수 있다.
- **💽 마이크론 실적(9/30):** 컨센서스 매출 508억 달러·EPS \$31.28. 서스쿼해나의 DRAM +50%·NAND +60% 전망이 실적으로 확인되는지가 골드만 '바닥 통과' 노트의 시험대다.
- **📱 오라클·어도비 후속:** 오라클 시간외 +7%(RPO 6,640억 달러, FY27 매출 ≥900억 달러), 어도비 AI ARR +150%. 11일 정규장에서 소프트웨어·AI 인프라로의 자금 이동이 반도체 약세와 대비되는지 확인.
