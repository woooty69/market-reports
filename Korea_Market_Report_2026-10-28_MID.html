## 🗓 시장 요약

**① SK하이닉스발 주주환원 쇼크에 코스피 6% 폭등, 장중 6,000 탈환** — SK하이닉스가 3분기 영업이익 83.3조원의 사상 최대 실적과 함께 100조원 규모 주주환원·주당 2만원 현금배당을 내놓자 코스피가 장중 6,003.22까지 치솟았다. 이틀 연속 매수 사이드카가 걸렸고, 외국인 6,172억원·기관 9,019억원 순매수가 개인의 1조 5,134억원 매도를 압도했다.

**② 반도체 대형주와 삼성그룹주 동반 급등** — SK하이닉스 거래대금이 3조 2,482억원, 삼성전자가 2조 1,895억원으로 시장을 장악했다. 내일(29일) 실적을 발표하는 삼성전자도 주주환원 기대가 번지며 삼성전자우(+10.05%)·삼성생명(+9.22%)·삼성물산(+8.64%)이 함께 뛰었고, SK(+10.95%)·SK스퀘어(+9.66%) 등 지주사도 강세다.

**③ 해킹 확산에 보안주 폭등, 실적 부진주는 소외** — 대신증권·미래에셋자산운용·빗썸까지 해킹 피해가 확산되며 지니언스(상한가)·안랩(+27.62%)·엑스게이트(+16.14%) 등 보안주가 일제히 급등했다. 반면 3분기 영업이익이 반토막 난 LG이노텍(−2.80%)과 S-Oil(−4.27%)·HD현대중공업(−1.20%)·한화오션(−1.32%)은 약세다.

**④ 원화는 약세, 해외 선물은 강보합** — 원/달러는 1,337.80원으로 9.80원 올라(원화 약세) 전일 기록한 2년 만의 최저권에서 반등했다. 증시 급등에도 원화가 약해진 점은 오후 외국인 수급의 변수다. S&P500 선물 +0.06%·나스닥100 선물 +0.33%로 강보합이고, 닛케이225는 +1.26%로 오전장을 마쳤으며 항셍은 보합(+0.02%)이다.

## 1. 업종별 흐름

**상승 업종** — 소프트웨어(+10.12%, 45종목 상승/17 하락)가 보안주 폭등에 가장 강했고 반도체와반도체장비(+8.84%, 150/19)·생명보험(+8.75%, 3/0)·전자장비와기기(+7.75%)·복합기업(+6.31%, 22/0)이 뒤를 이었다. SK하이닉스·삼성전자와 원익홀딩스(+22.32%)·엑시콘(+14.83%)·ISC(+11.04%) 등 소부장, 삼성생명·미래에셋생명(+10.97%) 등 보험, 증권(+4.38%, 36/2)이 동반 상승했다.

**하락 업종** — 문구류(−1.36%)·전문소매(−1.30%)·포장재(−1.11%)·판매업체(−0.88%)·건강관리기술(−0.74%) 등 내수·소비 업종이 소폭 약세다. 종목별로는 정유 S-Oil(−4.27%)·SK이노베이션(−1.34%), 실적 부진 LG이노텍(−2.80%), 조선 HD현대중공업·한화오션이 하락했다.

**시장의 시선** — 오후장은 6,000선 안착 여부와 외국인·기관 순매수 지속이 관건이다. 오늘 삼성전기, 내일 삼성전자 실적 발표를 앞두고 주주환원 기대가 삼성그룹으로 번질지, 보안주 급등이 금융권 해킹 대책 발표로 이어질지를 지켜볼 필요가 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 50종목

**1. SK하이닉스 (000660) 1,464,000원 · 1,069조 4,408억원 · +9.17% — 3Q 영업익 83.3조 '사상 최대'·주주환원 100조에 146만원 돌파**

## 4. 일정·관전 포인트

**오늘 오후 국내** — 삼성전기 3분기 실적 발표, 내일(29일) 삼성전자 3분기 실적 발표 대기, 3분기 실적 시즌 지속(금융지주·건설·조선 실적 이후 증권가 추정치 조정), 금융권 해킹 확산에 따른 금융당국 대응(다음 주 금융협회장 회의 예고), 맥쿼리의 가비아·KINX 공개매수 관련 후속 공시.

**오늘 밤 해외** — 미국 FOMC 회의 진행(결과는 한국 시간 목요일 새벽), 빅테크 실적 시즌(메타 유상증자 흥행 이후 AI 투자 계획 점검), 앤트로픽 IPO 후속 보도, 중국 5중전회(26～29일) 진행, 다음 달 3일 미국 중간선거 여론 동향.

### 🇰🇷 오후장 관전 포인트

1. **6,000선 안착 여부** — 오전 고점 6,003.22를 찍은 뒤 5,990선에서 공방 중이다. 외국인(+6,172억원)·기관(+9,019억원) 순매수가 오후에도 이어지면 10거래일 만의 6,000선 종가 회복이 가능하다.
2. **개인 1.5조원 매도의 향방** — 개인은 오전에만 1조 5,134억원을 팔았다. 급등 후 차익 실현이 오후에 더 커지면 상승폭이 줄 수 있어 프로그램·외국인 매수 강도를 확인할 필요가 있다.
3. **삼성전기 실적과 삼성전자 D-1** — 삼성전기 실적에서 MLCC 가격 인상이 확인되면 아모텍 등 부품주로, 삼성전자 환원 기대가 커지면 삼성전자우·삼성생명·삼성물산으로 매수가 이어질 수 있다.
4. **보안주·공개매수주 변동성** — 지니언스·KINX·에스피소프트 상한가와 안랩(+27.62%) 등 급등주는 오후 차익 매물에 출렁일 수 있다. 금융당국의 보안 대책 발표 여부가 지속성을 가른다.
5. **원화 약세와 외국인 수급** — 원/달러가 1,337.80원으로 9.80원 올랐다. 지수 급등에도 원화가 약해지는 흐름이 이어지면 외국인 현물 매수 강도가 둔화될 수 있다.

> 본 리포트는 공개 데이터·보도·증권사 리포트를 정리한 참고 자료이며 투자 권유가 아닙니다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
