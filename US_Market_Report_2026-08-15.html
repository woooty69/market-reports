## 🗓 시장 요약

**기록 경신 다음 날, 시장은 소비에 발목이 잡혔다.** 전날 사상 최고를 쓴 S&P 500이 **−0.17%(7,785.73)**로 소폭 밀렸고 다우 −0.20%, 나스닥 −0.28%로 3대 지수가 나란히 내렸다. 원인은 두 개의 소비 지표다. **7월 소매판매가 시장 예상을 밑돌았고**, 오후에 나온 **미시간대 8월 소비자심리 예비치**가 물가 부담을 이유로 악화되면서 오후 들어 매도가 붙었다.

이상한 조합이 하나 있었다. **소비가 꺾였는데 금리는 올랐다.** 10년물이 **+4.6bp(4.695%)**, 2년물이 +2.4bp로 반등했다. 이번 주 내내 CPI·PPI 호조로 내리막이던 금리가 방향을 튼 건 **유가 때문**이다. 호르무즈 해협에서 유조선이 피격되고 미국이 대이란 추가 제재를 예고하면서 WTI가 **+1.42%(\$82.40)**, 브렌트가 +1.67%로 다시 올랐다. 소비 둔화와 물가 재점화가 동시에 얹히는, 시장이 가장 싫어하는 조합이다.

반도체는 **안에서 갈라졌다.** SOX는 −0.31%(12,417.10)로 소폭 밀렸지만 그 안의 편차가 컸다. **브로드컴 −5.95%, 어플라이드머티리얼즈 −5.12%**가 지수를 눌렀고, 반대로 **AMD +6.46%, 샌디스크 +7.41%, 시게이트 +5.65%**가 버텼다. **스토리지는 사흘 연속 강세**다 — 샌디스크는 이번 주에만 \$1,271 → \$1,641로 **+29%** 올랐다.

한국 쪽에서는 **괴리율이 드디어 좁혀졌다.** SKHY가 +0.40%(\$166.33)에 그친 사이 국내 SK하이닉스(000660)가 **+3.26%(1,645,000원)**로 앞서면서 괴리율이 +47.3% → **+43.4%로 3.9%p 축소**됐다. 6거래일 연속 확대되던 흐름이 처음 꺾였다. 외국인은 **사흘 연속 순매수를 키워(+74.8만 주)** 지분율을 **51.06%**까지 올렸고, 시가총액은 **1,201조원**을 넘었다. 다만 기관은 −33.5만 주로 순매도 전환했다.

> *어제 판정 복기: '상승 우세로 보되 강도는 낮춘다'로 봤고, 실제 8/14 한국장은 코스피200 선물 **+2.35%**, SK하이닉스(000660) **+3.26%**로 상승했으나 전날(+3.71%·+5.92%)보다 폭이 줄어 방향·강도 모두 맞았다.*

**지수는 제자리, 메모리는 폭주한 한 주였다.** S&P가 +0.36%로 3주 연속 상승을 지켰지만 다우는 오히려 −0.56%로 밀렸다. 반면 **SK하이닉스(000660)가 +15.68%, ADR은 +20.61%** 올랐고 **코스피200 야간선물은 +10.89%** 뛰었다. 지수 게임이 아니라 **철저한 종목 장세**였다는 뜻이다.

경로는 이렇다. ①**8/10~11**: 호르무즈 협상 교착으로 유가가 이틀간 6.4% 급등하며 위험선호가 눌렸다. ②**8/12**: CPI가 컨센서스에 부합하고 코어위브·슈퍼마이크로 실적이 'AI 지출 지속성' 의심을 지우면서 **자금이 빅테크에서 AI 인프라 공급망으로 이동**했다. ③**8/13**: PPI 0.0%와 IEA 수요 감소 전망(유가 −2.43%)이 겹치며 S&P가 사상 최고를 썼다. ④**8/14**: 소비 지표 부진과 유가 반등으로 되돌림. 9월 FOMC 인상 확률은 주 초 47.4%에서 **32.3%**까지 내려왔다.

한국 관련해선 **테마섹 투자 추진 보도(8/12)**와 **CNBC의 SK하이닉스 증설 현장 단독 취재(8/13)**가 외국인 수급을 자극했다. 외국인은 8/11 −21.1만 주 순매도에서 8/12 +56.0만, 8/13 +65.0만, **8/14 +74.8만 주**로 사흘 연속 매수 강도를 키웠다.

## 📰 헤드라인 3선

**1. 7월 소매판매 예상 하회 + 미시간대 소비심리 악화 — 기록 경신 다음 날 되돌림**
7월 소매판매가 시장 예상을 밑돌면서 소비 둔화 우려가 부각됐다. 여기에 오후 발표된 **미시간대 8월 소비자심리지수 예비치**가 "물가가 여전히 최대 관심사"라는 응답과 함께 악화되자 투자심리가 위축됐다. 전날 사상 최고(7,798.99)를 쓴 S&P 500이 −0.17%로 되밀렸고, 3대 지수가 나란히 하락했다. 다만 **S&P는 3주 연속 주간 상승**을 지켰다.

**2. 호르무즈 유조선 피격·미국 대이란 제재 예고 — WTI +1.42%, 주간 +5.40%**
호르무즈 해협에서 유조선이 피격되고 미국이 이란에 대한 추가 제재를 예고하면서 국제유가가 다시 올랐다. WTI 9월물은 배럴당 **\$82.40(+1.15달러, +1.42%)**, 브렌트 10월물은 **\$88.52(+1.67%)**로 마감했다. 주간 기준으로는 **브렌트 +5.95%, WTI +5.40%**다. 주중 IEA의 수요 감소 전망으로 잠시 꺾였던 유가가 **지정학 리스크로 재차 방향을 튼 것**으로, 물가 경로의 최대 불확실 요인으로 남았다.

**3. 반도체 내부 분화 — 브로드컴·어플라이드 급락 vs AMD·스토리지 급등**
브로드컴이 **−5.95%(\$392.95)**, 어플라이드머티리얼즈가 **−5.12%(\$507.18)**로 급락하며 SOX를 끌어내렸다. 반면 **AMD가 +6.46%(\$514.21)**, 샌디스크 +7.41%, 시게이트 +5.65%로 반대 방향으로 움직였다. 같은 반도체 안에서도 **장비·통신칩은 팔고 연산·스토리지는 사는** 선별이 뚜렷했다. 데이터 스토리지는 이번 주 내내 가장 강한 섹터였다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  데이터 스토리지 (이번 주 최강)**
샌디스크 **+7.41%(\$1,641.28)**, 시게이트 **+5.65%(\$973.44)**, 마이크론 +2.42%(\$972.78). 샌디스크는 8/12 \$1,271 → 8/14 \$1,641로 **한 주에 +29%** 올랐다. AI 데이터센터의 병목이 연산에서 **저장 계층**으로 이동한다는 인식이 굳어지는 중이다.

> 🇰🇷 [전달] 낸드·SSD 강세는 **삼성전자(005930)**에 상대적으로 유리(낸드 비중). SK하이닉스(000660)는 HBM 축이 여전히 주도하나, 엔터프라이즈 SSD 라인도 수혜 범위에 있다.

**상승 ②  연산 반도체 (AMD 단독 강세)**
AMD가 **+6.46%(\$514.21)**로 거래량 2,356만 주와 함께 급등했다. 반면 엔비디아는 −0.06%로 제자리였다. **AI 연산 시장에서 2위 사업자의 점유율 확대 기대**가 반영된 것으로, 엔비디아 일극 구도가 흔들릴 수 있다는 시각이 붙었다.

**상승 ③  AI 인프라·미디어**
네비우스 **+8.88%(\$277.68)**로 이날 상승률 1위였고, 코파트 +7.55%, 폭스(FOX) +5.70%·(FOXA) +5.48%가 뒤를 이었다.

**하락 ①  반도체 장비·통신칩**
브로드컴 **−5.95%**, 어플라이드머티리얼즈 **−5.12%**. 어플라이드는 이번 주 마지막 대형 실적이었는데 **반도체 장비 수요의 바로미터**로 주목받던 만큼 실망이 컸다. 두 종목의 하락이 SOX 약세의 대부분을 설명한다.

> 🇰🇷 [전달] 장비주 약세는 국내 반도체 소부장(원익IPS·주성엔지니어링 등)에 부담. **메모리 완제품(SK하이닉스·삼성전자)과 장비의 온도차**가 벌어지는 국면이다.

**하락 ②  소프트웨어·클라우드**
고대디 −5.59%(전날 +9.45% 반납), 크라우드스트라이크 −3.82%, 오라클 −3.77%. 금리가 반등하면서 전날 급등했던 소프트웨어가 되돌림을 겪었다.

**하락 ③  대형 플랫폼**
아마존 −0.94%, 메타 −0.88%, 알파벳 −0.12%. 큰 폭은 아니지만 소비 둔화 우려가 광고·이커머스에 직접 닿는 업종이라 방향이 아래였다.

**[판정 — 다음 국내 개장일은 8/18(화)]** **⚠️ 8/17(월)은 광복절 대체공휴일로 국내 증시가 휴장**한다. 따라서 이번 8/14 미국장 결과는 **8/18(화)에야 반영**되며, 그 사이 **8/17(월) 미국장 한 세션이 더 열린다.** 즉 오늘 수치만으로 8/18을 판단할 수 없고, **8/17 미국장 결과가 실질적인 방향타**가 된다.
현재 확인된 신호는 혼조다. 우호 요인은 ①괴리율 +43.4%로 축소되며 국내가 따라잡기 시작한 점, ②외국인 사흘 연속 순매수 확대(지분율 51.06%), ③S&P 3주 연속 주간 상승. 반대로 경계 요인은 ①**야간선물이 −0.36%로 8거래일 만에 하락 전환**, ②유가 재상승(+1.42%)과 금리 반등(10년물 +4.6bp), ③미국 소비 지표 부진, ④브로드컴·어플라이드 급락에 따른 **반도체 장비·소부장 부담**이다.
**판정: 3거래일 휴장 동안 변수가 누적되는 구간이므로 방향 단정을 유보한다.** 다만 국내 SK하이닉스(000660)는 한 주간 +15.68% 오른 뒤라 **차익 실현 압력이 8/18 개장 초반에 나올 가능성**을 우선 본다. (무효화: 8/17 미국장에서 SOX·메모리 재차 급등, 또는 외국인 순매수 지속 확인 시)

## 🔍 섹션 2. 이슈 종목 10선

**1. SK하이닉스 ADR (SKHY) +0.40% — \$166.33, 괴리율 7일 만에 첫 축소(+43.4%)**
시가 **\$169.32**로 갭업 출발해 장중 **\$171.58**까지 올랐지만 **\$166.33**에 마감하며 고점 대비 **3.06%를 반납**했다. 저가는 \$163.76으로 장중 변동폭이 4.8%에 달했다. 거래량은 2,052만 주로 전일(3,183만 주)보다 36% 줄어 **매수 강도가 약해졌다.** 시간외에서도 −0.11%(\$166.15).
국내 SK하이닉스(000660)는 **1,645,000원(+3.26%, +52,000원)**으로 ADR을 크게 앞섰다. 외국인이 **+74만 7,508주**를 순매수해 사흘 연속 매수 강도를 키웠고(8/12 +56.0만 → 8/13 +65.0만 → 8/14 +74.8만), 외국인 지분율은 **51.06%로 51% 선을 넘었다.** 반면 기관은 **−33만 4,859주로 순매도 전환**했고 개인도 −39만 1,964주를 팔았다. 시가총액은 **1,201조원**.
그 결과 **괴리율이 +47.3% → +43.4%로 3.9%p 축소**되며 6거래일 연속 확대 흐름이 처음 꺾였다. **국내가 ADR을 따라잡는 방식의 축소**라는 점이 중요하다 — ADR이 조정받아 좁혀진 것이 아니라 국내가 더 올랐기 때문이다. 다만 기관 순매도 전환은 국내 상승 동력의 한 축이 빠진 신호로 볼 여지가 있다.

**2. 브로드컴 (AVGO) −5.95% — \$392.95, SOX를 끌어내린 주범**
거래량 2,525만 주와 함께 6% 가까이 급락했다. AI 맞춤형 칩(ASIC) 수혜주로 분류돼 강세를 이어왔지만 이날 급반전했다.
같은 날 AMD가 +6.46% 오른 것과 정반대다. **AI 반도체 안에서 '범용 GPU vs 맞춤형 ASIC' 구도의 자금 이동**이 일어난 것으로 해석할 수 있다.
시가총액 비중이 큰 종목이라 이 한 종목의 하락이 SOX −0.31%의 대부분을 설명한다. 나머지 구성종목 다수는 상승했음에도 지수가 밀린 이유다.

**3. 어플라이드머티리얼즈 (AMAT) −5.12% — \$507.18, 장비 수요 실망**
이번 주 마지막 대형 실적이었다. **반도체 장비 수요의 바로미터**로 메모리 증설 사이클의 실체를 확인시켜 줄 것으로 기대됐으나 시장을 만족시키지 못했다. 거래량 1,121만 주.
메모리 업체들이 대규모 증설을 발표하는 국면에서 **장비주가 오히려 빠진 것**은, 증설 발표와 실제 장비 발주 사이의 시차 또는 발주 강도에 대한 의구심을 시사한다.
국내 반도체 소부장에 직접적인 부담 요인으로, **완제품(SK하이닉스·삼성전자)과 장비의 디커플링**을 주시할 필요가 있다.

**4. AMD +6.46% — \$514.21, 엔비디아를 제치고 홀로 급등**
거래량 2,356만 주로 거래대금 상위 6위였다. 같은 날 엔비디아는 −0.06%로 사실상 보합이었다.
AI 연산 시장에서 **2위 사업자의 점유율 확대 기대**가 반영된 것으로 보인다. 엔비디아가 이번 주 내내(−0.03%, −0.03%, +3.03%, +0.54%, −0.06%) 거의 움직이지 않은 것과 대비된다.
**엔비디아 일극 구도가 완화될수록 메모리 공급사의 협상력은 높아진다** — 여러 고객사가 경쟁적으로 HBM을 확보하려 할 것이기 때문이다. 국내 SK하이닉스(000660)에는 중립~우호적 재료다.

**5. 샌디스크 (SNDK) +7.41% — \$1,641.28, 한 주에 +29%**
거래량 1,950만 주로 이날 가장 활발히 거래된 종목이었다. 8/12 \$1,271.05 → 8/13 \$1,528.11 → 8/14 \$1,641.28로 **사흘 연속 급등**했다.
AI 학습·추론 데이터가 폭증하면서 **엔터프라이즈 SSD 수요가 구조적으로 늘어난다**는 논리가 시장을 지배하고 있다. 한 주 상승률 +29%는 이번 주 대형주 중 최고 수준이다.
국내에서는 낸드 비중이 높은 **삼성전자(005930)**와 SSD 컨트롤러·후공정 밸류체인에 파급될 수 있는 재료다.

**6. 시게이트 (STX) +5.65% — \$973.44, HDD까지 번진 스토리지 랠리**
하드디스크 대표주가 5% 넘게 올랐다. 거래량 521만 주.
전날 웨스턴디지털 +7.31%에 이어 시게이트까지 오르며 **SSD와 HDD를 가리지 않고 저장장치 전반이 재평가**되고 있음을 보여줬다. AI 데이터센터는 고속 처리용 SSD와 저비용 대용량 HDD를 동시에 필요로 한다.
스토리지 3인방(SNDK·WDC·STX)이 모두 오른 것은 개별 재료가 아닌 **섹터 차원의 수급 유입**이라는 뜻이다.

**7. 네비우스 (NBIS) +8.88% — \$277.68, 이날 상승률 1위**
AI 클라우드 인프라 기업이 다시 한번 상승률 1위에 올랐다. 8/12 +34.14% 급등 이후에도 상승세를 이어가 이번 주에만 \$193 → \$278로 **+44%** 올랐다. 거래량 2,856만 주.
코어위브 실적이 확인시킨 **네오클라우드 수주 가시성**이 계속 반영되는 중이다.
다만 같은 날 CNBC는 "AI 인프라 붐이 점점 더 레버리지에 의존하고 추적하기 어려워지고 있다"는 분석을 내놨다. **부채로 조달된 성장**이라는 반대 시각도 함께 커지는 국면이다.

**8. 고대디 (GDDY) −5.59% — \$94.88, 전날 +9.45% 하루 만에 반납**
전날 금리 급락에 +9.45% 급등했던 종목이 금리가 반등하자 −5.59%로 되돌렸다. 거래량 203만 주.
크라우드스트라이크 −3.82%, 오라클 −3.77%까지 겹치며 **소프트웨어·클라우드 전반이 금리 방향에 하루 단위로 반응**하고 있다.
이번 주 반복된 패턴 — 급등 다음 날 되돌림(루멘텀·메르카도리브레·액손) — 이 또 나타났다. **추격 매수의 위험**이 계속 확인되는 구간이다.

**9. 마이크로스트래티지 (MSTR) −4.16% · HP (HPQ) −3.80%**
마이크로스트래티지가 \$93.06으로 −4.16% 밀렸다. 비트코인 현물 거래량이 7년 최저를 기록했다는 분석이 나오며 암호자산 연관주가 약했다.
HP는 −3.80%(\$30.11)로 PC 수요 둔화 우려가 재부각됐다. **소매판매 부진이 소비자용 IT 하드웨어에 직접 닿은 사례**다.
같은 날 서버·스토리지가 급등한 것과 대비되며, **기업향 AI 투자와 소비자향 IT 수요의 방향이 갈리고 있음**을 보여준다.

**10. 스페이스X (SPCX) −0.91% · 테슬라 (TSLA) +0.70% — 머스크 관련주 혼조**
스페이스X는 \$140.00으로 −0.91%, 거래량 9,422만 주였다. 8/13 상장 이후 최대 거래량 종목 지위를 유지하고 있으나 IPO가(\$135) 대비 상승폭은 3.7%로 좁혀졌다.
테슬라는 \$342.33으로 +0.70% 올라 거래량 4,300만 주를 기록했다. 소비 둔화 우려에도 상대적으로 버텼다.
두 종목 모두 이번 주 변동성이 컸다(스페이스X는 8/12 −3.88% → 8/13 +9.68% → 8/14 −0.91%). **개인 자금 비중이 높은 종목의 전형적 패턴**으로, 시장 심리의 온도계 역할을 한다.

## 💬 섹션 3. 구루·기관 코멘트

- **연준 금리선물(9/16 FOMC) — 인상 32.3% vs 동결 67.7%.** 주 초 47.4%에서 **15%p 넘게 하락**해 한 주를 마쳤다. CPI·PPI가 연속으로 우호적이었던 결과이며, **동결이 확고한 기본 시나리오**로 자리 잡았다.
- **루이스 나벨리에 — "소매판매는 주춤했지만 소비자는 중요한 곳에는 여전히 쓰고 있다."** 헤드라인 부진에도 소비의 질적 구성은 유지되고 있다는 시각으로, 이날 시장의 비관적 해석에 대한 반론이다.
- **제임스 피서노 — "10년물 기간 프리미엄이 물가 위험과 연준 불확실성으로 상승하고 있다."** 소비 둔화에도 장기 금리가 오른 이날의 역설을 설명하는 관점이다.
- **CNBC — "AI 인프라 붐이 점점 더 레버리지에 의존하고, 추적하기 어려워지고 있다."** 하이퍼스케일러의 채권 발행 증가를 짚으며, 엔비디아의 새 AI 자금조달 계획까지 겹쳐 **AI 붐의 재무적 토대가 부채로 이동**하고 있다고 분석했다. 골드만삭스가 앞서 지적한 "AI 지출은 부채·주식 발행으로 조달된다"는 진단과 같은 맥락이다.
- **SKHY 컨센서스 — 애널리스트 14인 Strong Buy, 목표주가 \$244.92**(현재가 대비 +47.3%). 한 주간 ADR이 +20.6% 올랐음에도 목표가는 유지됐다.
- **⚠️ SK하이닉스 파생상품 거래 손실 39.8조원 공시** — 8/14 공시로 전해졌다. 다만 **당일 주가는 +3.26% 상승**해 시장이 이를 충격으로 받아들이지 않았다. 환헤지 등 상계 항목 여부와 실제 손익 영향은 **공시 원문 확인이 필요**하며, 8/18 개장 전 점검할 사안이다.

## 📅 섹션 4. 일정 및 관전 포인트

- **🇰🇷 8/17(월) 국내 증시 휴장 — 광복절 대체공휴일.** 8/15(토) 광복절이 주말과 겹쳐 8/17이 대체공휴일로 지정됐다. **코스피·코스닥·코넥스 모두 휴장**하며, 다음 개장일은 **8/18(화)**다. 따라서 **8/14 미국장과 8/17 미국장 두 세션이 8/18에 한꺼번에 반영**된다 — 갭 변동성이 평소보다 커질 수 있는 구조다.
- **📊 FOMC 의사록 (다음 주):** 7월 회의 의사록이 공개된다. 시장은 이미 9월 동결을 67.7% 확률로 반영했으므로, **의사록에서 인상 재개 가능성이 얼마나 논의됐는지**가 관건이다.
- **🏢 월마트 실적 (다음 주):** 이번 주 소매판매 부진과 소비심리 악화 직후여서, **미국 소비의 실체를 확인하는 결정적 창구**가 된다.
- **🛢 호르무즈:** 유조선 피격과 미국의 대이란 제재 예고로 유가가 다시 올랐다. **\$85 재돌파 시** 물가 경로가 다시 흔들리며 9월 동결 기대에도 균열이 생길 수 있다.
- **🇰🇷 괴리율 +43.4%:** 7일 만에 처음 축소됐고, **국내가 따라 오르는 방식**이었다는 점이 긍정적이다. 다만 여전히 40%대 상단이라 정상 범위로 보기는 어렵다.
- **🇰🇷 수출물가 28년 만에 최고:** 원/달러가 8월 들어 전월 대비 약 5% 하락(원화 강세)했음에도 수출물가가 28년 만의 최고치를 기록했다. **교역조건 개선**이 반도체 수출 단가 상승과 맞물린 결과로, 3분기 실적에 우호적인 배경이다.
