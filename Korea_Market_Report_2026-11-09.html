## 🗓 시장 요약

**① 휴장 중 국내: 반대매매 숨통, 외국인 '셀코리아' 10조원**
금융당국의 신용융자 담보비율 140% 유지 의무 3개월 면제가 오늘(11/9)부터 적용돼 급락장의 반대매매 연쇄를 줄일 장치가 마련됐다. 다만 외국인은 지난주 닷새 동안 약 10조원(삼성전자·SK하이닉스 7조 6천억원)을 팔아 두 종목 보유율이 최저로 내려왔고, 상장사 844곳(32%)이 연중 최저가를 기록했다. 당정은 소방 필수투자에 2조원 재정 지원을 검토하기로 했고, 정부는 역대 최대 규모 벤처펀드를 추진한다고 밝혔다. 원화는 외국인 순매도 8조 7천억원에도 반도체 수출 달러 덕에 버텼다는 분석이 나왔다.

**② 글로벌: 이란·호르무즈 긴장 완화, 이번 주는 물가와 AI 실적**
트럼프 대통령은 협상이 진전되면 이란 재공격 가능성이 "매우 낮다"고 했고, 이라크 장관은 미국과 호르무즈 해협을 통한 원유 수출 허용에 합의했다고 밝혔다. 미국 평균 휘발유 가격은 갤런당 4달러 아래로 내려왔다. 반면 젠슨 황 엔비디아 CEO는 중간선거 뒤 AI 규제와 스파이 접촉 의혹으로 압박을 받고, 장녀의 방한도 취소됐다. 이번 주 미국 10월 CPI·PPI와 코어위브·시스코 실적, 그리고 그 뒤 엔비디아 실적이 반등의 가늠자로 꼽힌다.

**③ 반도체: 'HBM 완판'과 데이터센터 착공 지연의 줄다리기**
삼성전자는 2027년 HBM 가격 협상을 마쳐 완판했고 대형 고객 10곳과 다년 계약, 10곳과 추가 협상 중이며, SK하이닉스는 14곳과 장기계약(2027～2028년 생산능력의 50% 이상)을 맺어 2029년까지 사실상 다 팔았다고 밝혀 왔다. 그러나 미국 데이터센터 규제로 2028년 증설 계획의 절반가량이 영향권에 들 수 있어 고객사가 인수 시점을 늦추면 납품 일정이 흔들릴 수 있다는 분석이 나왔다. DB증권은 규제 영향 3개 주(텍사스·조지아·오하이오)에 계획 물량 44%가 몰려 있지만 90% 이상이 착공 전이라 '파괴가 아닌 지연'이라고 봤다. 미국 제재·AI 붐으로 글로벌 반도체 장비사의 중국 매출이 줄었다는 보도도 나왔다.

**④ 강세 기대: K푸드·뷰티·가전, 은행, 배터리 수주**
농심은 부산 녹산 수출전문공장(연 5억개)을 가동해 국내 수출 공급능력을 7억개에서 12억개로 늘렸고, 코웨이·한국콜마는 3분기 기준 최대 실적을 냈다. 하나증권은 KOSPI 급락 속 은행주가 크게 선방했고 5대 은행 기업예금이 처음 1천조원을 넘었다고 정리했다. 배터리는 LG에너지솔루션이 연간 신규 수주 가이던스 90GWh를 유지하고 삼성SDI가 120GWh를 새로 제시해 수주가 기대를 웃돌았다는 평가가 나왔다. 미국 상무부의 인도·인도네시아·라오스산 태양광 셀 반덤핑 명령은 한화솔루션에 우호적이다.

**⑤ 약세 우려: 증권 실적 반토막·해킹 제재, LNG선 중국 추격, 파업 손실**
대형 증권사 3곳의 3분기 순이익은 직전 분기보다 평균 52.3% 줄었고(한국투자 −70.23%·키움 −64.95%) 주가는 줄줄이 연저점이다. 금감원은 오늘부터 미래에셋증권 해킹 현장점검에 나서며 책무구조도에 따른 CEO 제재 가능성이 거론된다. 조선은 10월 대형 LNG선 7척 중 중국이 5척을 가져가 한국(2척)을 처음 앞질렀고, 경총은 올해 1～9월 파업 근로손실일수가 45.2% 늘었으며 현대차 생산 차질만 약 5만 5,200대·2조 3천억원이라고 집계했다. 석유화학은 금호석유화학마저 11년 만에 적자를 내 업황 혹한기가 다시 거론됐다.

**⑥ 오늘(11/9 월) 개장 변수: 반도체 반등 강도와 외국인**
출발점은 금요일 밤 필라델피아 반도체 +4.21%·나스닥100 +1.35%와 야간선물 795.50(+1.60%)이다. 원/달러는 1,364원으로 높고 외국인 매도가 멈출지가 관건이며, 담보비율 면제 첫날이라 장 초반 반대매매 물량이 얼마나 줄었는지가 확인된다. 11/10에는 삼성전기를 25% 담는 AI 기판 ETF 등 신규 ETF가 상장하고, 이번 주 동원파츠·바로팜·넥스아이가 코스닥에 데뷔한다.

## 1. 업종별 흐름

**상승 업종** — 휴장 중 뉴스 기준 호재 업종은 음식료·생활가전·화장품 ODM, 은행, 2차전지 셀, 태양광이다. 농심은 녹산 수출공장 가동으로 전체 라면 생산능력을 연 62억개로 늘리며 2030년 매출 7조 3천억원(해외 비중 60% 이상)을 목표로 내걸었고, 코웨이는 3분기 해외법인 매출 5,918억원(+26.2%)으로 해외 비중이 41.5%가 됐다. 은행은 하나증권 집계로 급락장 속 큰 폭 선방했고 기업예금이 1천조원을 넘어 조달 여건이 좋다. 2차전지는 ESS 출하 증가율(전 분기 대비 LG에너지솔루션 +65%·삼성SDI +45%)과 신규 수주가 기대를 웃돌았다는 평가가, 태양광은 미국의 동남아·인도산 셀 반덤핑 명령이 호재로 꼽혔다.

**하락 업종** — 휴장 중 뉴스 기준 악재 업종은 증권, 조선(LNG선), 석유화학, 자동차 부품이다. 증권은 3분기 순이익 급감(대형 3사 평균 −52.3%)과 잇단 해킹에 따른 CEO 제재 가능성이 겹쳤고, 조선은 10월 대형 LNG선 수주에서 중국(5척)이 한국(2척)을 앞질렀으며 미국의 대중 선박 규제가 주춤하자 중국이 세계 선박 수주의 77%를 가져갔다는 보도가 나왔다. 석유화학은 금호석유화학의 11년 만의 적자로 4사 모두 혹한기에 들어섰고, 자동차 부품은 HL만도 노조 부분파업 등 공급망 차질 우려가 커졌다.

**시장의 시선** — 오늘은 낙폭이 컸던 반도체(11/6 전 업종 중 168종목 가운데 153종목 하락)와 반도체 소부장이 금요일 밤 SOX 반등을 얼마나 따라가는지가 첫 관심사다. 실적이 확인된 소비재(농심·코웨이·한국콜마·롯데쇼핑)와 자사주 소각 기업(크래프톤·카카오·KT&G)은 급락장에서 이미 상대 강세를 보였고 이 흐름이 이어지는지 볼 만하다. 증권·조선은 악재가 겹친 데다 증권은 담보비율 면제로 반대매매가 줄면 오히려 반등 재료가 될 수 있어 엇갈린 흐름이 예상된다.

## 🧭 흐름 전환

*섹터 12개의 수치 점검표(하락 7·상승 5, 매일)와 Claude 주간 논지(리포트·뉴스·정책·유튜브). 점검표는 미리 정한 약속이지 매매 지시가 아니다 — 하락 점검 2개 = ⅓ 축소 검토, 3개 = 절반 검토, 가격 규칙은 논지보다 우선.*

① **바뀐 섹터** — 주말이라 새 거래일 수치는 없고, 직전 거래일(11/6) 기준으로 **우주**와 **조선**이 '하락'에서 **'바닥 모색'**으로 바뀐 상태가 그대로다. 우주는 하락 점검 3/7·상승 점검 2/5로, 바구니가 고점 대비 −63%·200일선 대비 −45.6%까지 빠져 나쁜 소식이 상당 부분 반영됐을 수 있다는 논지지만, 상승 뉴스가 쏟아져도 추정치·목표가가 오르지 않는다는 반론이 가장 강하다. 조선은 하락 점검 2/7·상승 점검 2/5로 고점 대비 −59%까지 싸졌지만, 주말 사이 10월 LNG선 수주에서 중국이 한국을 앞질렀다는 소식이 더해져 '싸다는 것만으로 바닥 확인은 아니다'라는 반론에 힘이 실렸다.

아리바이오랩(옛 차백신연구소)은 11/4 아리바이오의 제26회 전환사채 권면 50억원어치를 2배인 100억원에 인수하기로 했는데, 이는 자기자본의 84.32%에 해당하고 전환가액은 주당 1만원이다. 양사 합병 가능성이 거론되며 11/6 거래량이 319만주로 이틀 전의 2배를 넘었고 주가는 4,300원(+11.69%)으로 마감했다. 합병이 공식화되지 않은 기대 단계라는 점은 주의할 부분이다. 증권사 커버 리포트 없음

**46. 케이엠더블유 (032500) 15,700원(비정규 시간외 16,090원) · 6,624억원 · −3.50% — 스페이스X·퀄컴 지상 5G망 구축, 국내 통신장비 수혜주로 거론**
스페이스X가 11/4 퀄컴과 미국 지상 5G 기지국용 반도체·소프트웨어 공급계약을 맺어 기존 철탑을 빌려 지상망을 구축할 것으로 보이며, 유진투자증권은 국내 통신장비 업체에 새 공급망 진입 기회가 열릴 수 있다며 케이엠더블유를 꼽았다. 대형 RAN 벤더를 거치지 않고 스페이스X나 오픈 RAN 업체에 직접 공급할 수 있다는 논리지만, 공급 레퍼런스 부족과 글로벌 경쟁은 넘어야 할 과제다. 직전 거래일 주가는 15,700원(−3.50%)이었다. 증권사 커버 리포트 없음

**47. 쏠리드 (050890) 7,280원(비정규 시간외 7,380원) · 4,423억원 · −5.21% — 스페이스X 지상망 수혜 후보, 미국 통신장비 보안 규제도 기회**
쏠리드도 스페이스X-퀄컴 지상 5G망 구축의 국내 수혜 후보로 케이엠더블유·에치에프알·오이솔루션·RFHIC와 함께 거론됐다. 미국의 중국산 통신장비 보안 규제가 이어지는 점도 국내 업체의 진입 여지를 넓힌다는 분석이다. 다만 실제 수주 여부는 확인이 필요하며, 직전 거래일 주가는 7,280원(−5.21%)이었다. 증권사 커버 리포트 없음

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
