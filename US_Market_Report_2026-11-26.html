## 🗓 시장 요약

**① 나스닥 23,585.80(−0.62%)·S&P500 7,182.78(−0.25%)·다우 50,182.95(+0.33%) — 장중 패닉 뒤 극적 회복, 추수감사절 앞 혼조 마감**
나스닥은 **23,585.80(−147.73, −0.62%)**, S&P500은 **7,182.78(−18.31, −0.25%)**로 내렸고 다우는 **50,182.95(+164.25, +0.33%)**로 올랐다. 오전 11시 30분께 나스닥은 4% 가까이, S&P500은 2.7% 밀리며 7,000선 아래(저가 6,970.11)까지 떨어졌고 다우도 1% 넘게 빠졌다. 그러나 오후 들어 기술주를 뺀 대부분 업종이 상승 전환하며 지수가 낙폭을 거의 지웠다. 나스닥100은 **26,046.90(−167.27, −0.64%)**으로 장중 고점 대비 20% 하락의 약세장 진입 문턱까지 갔다가 물러섰고, 러셀2000은 **2,704.06(+19.12, +0.71%)**, VIX는 **28.29(+1.93, +7.32%)**로 장중 34.95까지 치솟았다.

**② 근원 PCE 3.3%·20% 추가 관세 — 12월 0.25%p 인상 확률 98%**
10월 근원 PCE 물가는 전년 대비 3.3%로 예상치 3.2%를 웃돌았고, 헤드라인 PCE는 3.8%였다. 근원 PCE는 전월 대비로도 3개월 연속 0.3% 올랐다. 같은 날 트럼프 행정부는 중국·EU 등 14개 주요 교역 상대에 기존 관세 위에 20%를 더 얹는 새 관세를 발표했다. 의견 수렴 기간을 거쳐 이르면 1월부터 시행된다. 연준 베이지북도 에너지·운송·보험·관세 관련 비용 압력이 넓게 퍼졌다고 적었고, 선물시장은 12월 FOMC 0.25%포인트 인상 확률을 98%로 반영했다.

**③ 반도체 장중 −6%대에서 −0.65%로 — 엔비디아 −3.91%·마이크론 −4.53%·앰바렐라 −19.77%**
SOX는 장중 8,129.23(−7.96%)까지 밀렸다가 **8,774.86(−57.64, −0.65%)**으로 마감했다. 엔비디아(NVDA)는 장중 −9.15%까지 떨어졌다가 **\$149.30(−3.91%)**로 낙폭을 줄였고, AMD는 장중 −10.37%에서 **\$406.03(−1.75%)**까지 회복했다. 메모리주는 마이크론(MU) **\$601.25(−4.53%)**, 샌디스크(SNDK) **\$73.61(−5.57%)**로 약세가 이어졌다. 앰바렐라(AMBA)는 4분기 매출 전망이 시장 예상의 3분의 2 수준에 그치며 **\$35.68(−19.77%)**로 폭락했다. 반면 델(DELL)은 실적 호조에 장중 −10.25%에서 **\$297.06(+0.60%)**으로 반전했고, 메타(META)도 **\$609.89(+3.40%)**로 올랐다.

**④ 미국채 — 2년물 4.61%(−2bp)·10년물 4.85%(−6bp)·30년물 5.24%(−6bp), 기술주 이탈 자금이 채권으로**
미 재무부 고시 기준 2년물은 **4.61%(−2.0bp)**, 10년물은 **4.85%(−6.0bp)**, 30년물은 **5.24%(−6.0bp)**로 내렸다. 10년물은 장중 4.799%까지 떨어졌다. 물가 지표가 뜨거웠는데도 위험자산을 팔고 국채로 피신하는 수요가 금리를 끌어내렸다. 노무라의 찰리 매켈리곳은 젠슨 황 복귀가 금리 상승, 신용 스프레드 확대, 변동성 상승 같은 금융 여건 긴축을 해결하지 못한다고 짚었다. 프레디맥 기준 30년 고정 모기지 금리도 7.21%로 전주 7.28%에서 내렸다.

**⑤ WTI \$84.20(+2.62%)·브렌트 \$94.76(+3.68%) — 이틀 연속 상승, 금·비트코인은 소폭 반등**

**⑥ 🇰🇷 SK하이닉스 ADR \$111.14(−0.75%)·코스피200 야간선물 727.30(+0.35%, 11/25 세션 06:00 확정)**

SK하이닉스 ADR은 **\$111.14(−\$0.84, −0.75%)**로 장중 −8.99%(\$101.91)까지 밀렸다가 대부분 만회했다. 코스피200 야간선물은 06:00 확정 종가 727.30으로 주간 종가 724.75 대비 +2.55포인트(+0.35%) 올랐다. 장중에는 688.80(−4.96%)까지 급락했으나 미국 기술주 회복과 함께 고가 730.05 부근에서 마감했다. 시가는 722.65였다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) −3.91% — 노무라 "황 CEO 복귀 발표로 바뀐 것 없다", 독립 조사·10-Q 제출 앞두고 경계**

**5. 어반아웃피터스 (URBN) −10.33% — 3분기 리테일 동일점 매출 +4.4%, 예상치 5.3% 하회**

워크데이는 \$180.44(+\$1.21, +0.68%)로 마감했다. 3분기 조정 주당순이익 \$2.82와 매출 \$27억1,000만은 LSEG 예상치 \$2.74와 \$26억9,000만을 넘었지만, 잉여현금흐름 \$6억9,100만이 예상치 \$7억1,200만에 못 미쳤고 4분기 구독 매출 가이던스도 다소 약했다. 장 초반 7% 안팎 밀릴 것으로 보였으나 장중 저가 \$173.00(−3.48%)에서 반등해 소폭 상승으로 끝냈다.

**7. 디어 (DE) +4.44% — 4분기 주당순이익 \$3.89로 예상 하회, 2027년 순이익 전망 \$45억~52억5,000만**
디어는 \$641.02(+\$27.26, +4.44%)로 올랐다. 4분기 주당순이익은 \$3.89로 팩트셋 예상치 \$4.03에 못 미쳤지만 순매출은 \$105억1,000만으로 예상을 넘었다. 2027 회계연도 순이익 전망 \$45억~52억5,000만이 예상치 \$59억1,000만을 밑돌면서 장중 \$580.51(−5.42%)까지 밀렸다. 그러나 회사가 내년 회복을 자신하면서도 눈높이를 보수적으로 낮춰 잡았다는 점이 안도로 받아들여지며 오후 들어 상승 전환했다.

**8. 페이첵스 (PAYX) +2.96% — 웨드부시, 투자의견 '아웃퍼폼'·목표주가 \$134로 커버리지 개시**
페이첵스는 \$118.49(+\$3.41, +2.96%)로 올랐다. 웨드부시는 페이첵스를 투자의견 아웃퍼폼, 목표주가 \$134로 신규 커버리지를 개시했으며, 이는 종가 대비 약 13%의 상승 여력이다. 웨드부시는 페이첵스가 ADP와 같은 투자 논리를 가장 높은 마진과 배당수익률로 누릴 수 있는 종목이라며 마진 확대와 고객 예치금 이자 수익을 강점으로 꼽았다.

**9. 스페이스X (SPCX) +1.30% — 모든 활성 '트럼프 계좌'에 클래스 A 주식 1주씩 지급 발표**
스페이스X는 \$127.44(+\$1.63, +1.30%)로 마감했다. 회사는 활성 상태인 모든 트럼프 계좌에 클래스 A 주식 1주씩을 지급하고 일론 머스크 CEO가 개인적으로 같은 규모를 추가 매칭한다고 발표했다. 트럼프 계좌는 2025년 세법으로 만들어진 아동용 비과세 투자계좌로, 2025~2028년 출생 아동에게 정부가 \$1,000를 한 차례 넣어준다. 주가는 장중 \$113.93(−9.44%)까지 밀렸다가 반등했다.

**10. 앤하이저부시 인베브 (BUD) −0.11% — JP모건, 투자의견 '비중확대'에서 '중립'으로 하향**
앤하이저부시 인베브 ADR은 \$79.98(−\$0.09, −0.11%)로 마감했다. JP모건은 투자의견을 비중확대에서 중립으로 낮추며 2027년 판매량이 −0.5%로 역성장할 것으로 내다봤다. 미국의 높은 비교 기저, 중국 수요 부진, 세제 개편 속 브라질 거시 환경 악화를 근거로 들었다. 다만 2026년까지는 견조한 복리 성장과 방어적 성격을 굳힐 것이라고 평가해 주가는 장중 \$79.00(−1.34%)에서 낙폭을 줄였다.
