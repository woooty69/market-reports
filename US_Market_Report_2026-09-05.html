## 🗓 시장 요약

**① 고용이 예상의 3배로 나왔다 — 그래서 주가가 빠졌다**
미 노동부의 8월 비농업 부문 신규고용이 **16만 2,000명**으로 시장 예상치(다우존스 집계 5만 3,000명)의 약 3배로 나왔다. **5개월 만에 최대 증가폭**이며 6·7월치도 모두 상향 조정됐다. 실업률은 **4.1%**로 유지, 평균 시간당 임금은 **+0.3%**로 예상에 부합했다. 강한 고용은 경제 전체로는 호재지만 이날 증시에서는 **연준이 이달 금리를 올릴 수 있다는 신호**로 읽혔다. 다우 **−0.51%**, S&P 500 **−0.38%**, 나스닥 **−0.29%**로 3대 지수가 모두 내렸다.

**② 인상 확률이 하루 만에 되돌아왔다 — 49.4% → 58.4%**
불과 하루 전 월러 이사의 발언으로 **49.4%**까지 내려갔던 9월 FOMC 인상 확률이 고용지표 발표 후 **58.4%**로 다시 올라갔다. 정책금리에 민감한 **2년물이 4.379%(+3.9bp)**로 **2025년 1월 이후 최고 수준**을 기록했고(장중 +8bp까지 올랐다 축소), 10년물도 **4.783%(+1.1bp)**로 올랐다. 달러인덱스는 **99.17(+0.21%)**로 강세 전환했다.

**③ 그런데 반도체만 홀로 급등했다 — SOX +3.38%**
지수가 모두 내린 날 **필라델피아 반도체지수는 383.13포인트(3.38%) 급등한 11,735.26**을 기록했다. 반도체는 대규모 장비 투자를 수반해 통상 금리에 민감한 업종인데, 이날은 **강한 고용이 곧 미국 경기와 데이터센터 투자 수요의 견조함을 뜻한다**는 해석이 우세했다. **경기 지표를 할인율이 아니라 수요로 읽은 것**이다.

**④ 메모리가 그 안에서도 가장 크게 올랐다**
샌디스크 **+11.90%**, SK하이닉스 ADR **+8.14%**, 마이크론 **+6.10%**로 메모리·스토리지가 반도체 상승을 주도했다. 인텔은 **+4.51%**, 세레브라스시스템즈 **+10.30%**, 아스테라랩스 **+9.80%** 올랐다. 반면 대장주 엔비디아는 **+0.84%**, 브로드컴은 **+0.2%**에 그쳐 **AI 로직보다 메모리·스토리지로 자금이 이동한 하루**였다.

**⑤ 소프트웨어는 정반대로 무너졌다**
가이드와이어소프트웨어가 **−19.90%** 급락한 것을 비롯해 유아이패스 **−16.60%**, 아사나 **−12.70%**, 오토데스크 **−8.30%**, 어도비 **−6.70%**가 크게 내렸다. 마이크 딕슨 호라이즌인베스트먼츠 포트폴리오 운용 총괄은 **"반도체와 소프트웨어 두 업종이 시소 국면에 갇혀 있다"**며 **"거의 매일 반복되는 양상이고 오늘도 예외가 아니었다"**고 평가했다.

**⑥ 테슬라는 사이버캡 발표에도 6% 가까이 빠졌다**
테슬라가 **−5.92%** 급락했다. 전날 공개한 로보택시 **'사이버캡'이 시장의 기대를 충족하지 못한** 데다 **미국 도로교통안전 당국의 안전성 관련 우려**까지 겹쳤다. 애플 **−2.51%**, 마이크로소프트 **−2.04%**, 팔란티어 **−4.49%**, 알파벳 **−1.11%** 등 빅테크도 대체로 약세였다. **다우 낙폭이 가장 컸던 것은 애플·마이크로소프트·세일즈포스 같은 대형 기술주가 지수를 끌어내렸기 때문**이다.

**⑦ 트럼프 대통령이 즉각 연준을 압박했다**
트럼프 대통령은 강한 고용 지표에도 금리 인상 우려로 증시가 하락하자 소셜미디어에 **"일자리 수치가 훌륭하게 나왔으니 시장이 올라야 하는데, 지난 25년간 늘 그랬듯 상황이 좋으면 물가 공포 때문에 그것을 죽여야 한다는 거짓 현실 속에 살고 있어 주가가 내린다"**고 적었다. 기자들과의 문답에서는 **미국의 기준금리가 1% 또는 0.5%여야 한다**고 주장했고, 연준이 금리를 내리지 않으면 **미국이 적자를 보는 국가들과 교역을 끊겠다**고 위협했다.

**⑧ 유가는 5거래일 연속 올랐다 — 이번엔 홍해다**
WTI 10월물이 **배럴당 \$91.48(+0.20%)**로 **8월 31일부터 5거래일 연속** 올랐고 브렌트유는 **\$96.28(+0.80%)**를 기록했다. 불안의 무대가 호르무즈에서 **홍해와 아덴만을 잇는 바브엘만데브 해협**으로 확대됐다. 해협 인근에서 예멘 정부군과 친이란 후티 반군의 충돌로 **하루 만에 최소 129명이 사망**했는데, 수년간 이어진 예멘 내전에서 단일 충돌 기준 최대 인명피해다. 트럼프 대통령이 이란 지하 핵시설로 의심되는 **'곡괭이산' 공격 가능성**을 시사한 것도 유가를 밀어올렸다.

**⑨ 한국은 반도체가 지수를 끌어올렸다 — 코스피 +1.64%**
코스피가 **+107.73p(+1.64%, 6,687.21)** 올랐다. 코스닥도 **+2.95%(813.50)**로 5거래일 만에 반등하며 800선을 회복했다. **외국인·기관·기타법인이 동반 매수**했고, SK하이닉스는 **+3.20%(1,647,000원)**로 **외국인 +30만 8,833주, 기관 +9만 6,776주** 순매수 전환이 나왔다. 원/달러는 **1,350.4원(−8.9원)**으로 **주간거래 종가 기준 작년 6월 30일 이후 14개월여 만의 최저**를 기록했다(장중 1340원대). VKOSPI는 **39.33(−7.28%)**으로 종가 기준 40선 아래로 내려왔다.

## 📊 주간 결산 (8/28 금 → 9/4 금)

| --- | --- | --- | --- |

| 원/달러 | 1,372.50원 | 1,350.40원 | **−1.61%** (원화 강세) |

**주간 총평 — 지수는 제자리였는데 그 안은 요동쳤다.** 3대 지수의 주간 등락은 **−0.27%~+0.40%**로 사실상 보합이다. 그런데 그 사이 **WTI는 +9.69%** 올랐고 **10년물은 장중 4.818%(2023년 11월 이후 최고)**까지 치솟았다가 되돌렸으며, **9월 FOMC 인상 확률은 57.5% → 68.2% → 49.4% → 58.4%**로 네 번 방향을 바꿨다. **한 주 동안 시장을 움직인 것은 실적이 아니라 매크로 이벤트의 연쇄**였다 — 미·이란 교전 재개(9/1) → 글로벌 국채 동반 발작(9/2) → 월러 이사의 동결 시사(9/3) → 고용 서프라이즈(9/4).

**두 번째 축은 반도체 안에서의 로테이션이다.** SOX는 주간 **+2.37%**로 지수를 앞섰는데, 그 상승의 대부분이 **금요일 하루(+3.38%)**에 몰렸다. 특히 **SKHY는 주간 +9.91%**로 압도적이었다. 같은 기간 국내 SK하이닉스는 **−0.36%**로 제자리였다 — **동일 기업의 ADR과 원주가 한 주 동안 10%p 넘게 벌어졌고**, 괴리율은 **+33.7% → +45.1%**로 확대됐다. 원/달러가 **−1.61%(1,350.4원)** 내렸는데도 벌어졌다는 점이 특징이다.

**세 번째 축은 한국 증시의 상대 부진이다.** 미 지수가 보합인 동안 코스피는 **−1.50%**, 코스닥은 **−2.97%** 내렸다. 주중 미 반도체 관세 검토·글로벌 금리 발작이 겹치며 **9월 2일 코스피가 −3.99% 급락**한 것이 결정적이었고, 금요일 **+1.64%** 반등으로도 회복되지 않았다. 다만 마지막 날 **외국인·기관이 동반 매수로 돌아섰다**는 점은 다음 주로 넘기는 변화다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  메모리·스토리지 (이날 최강)**
샌디스크 **+11.90%**, SK하이닉스 ADR **+8.14%**, 마이크론 **+6.10%**. 웨스턴디지털도 함께 올랐다. **강한 고용 → 데이터센터 투자 수요 지속**이라는 해석에 자금이 집중됐고, 메모리 공급 부족과 가격 인상이라는 기존 재료가 다시 부각됐다.

**상승 ②  AI 인프라·파운드리**
세레브라스시스템즈 **+10.30%**, 아스테라랩스 **+9.80%**, 인텔 **+4.51%**. AI 서버용 반도체 수요가 이어질 것이라는 전망이 재료다. 반면 엔비디아는 **+0.84%**, 브로드컴은 **+0.2%**로 상승폭이 작아 **로직보다 메모리·인터커넥트 쪽으로 매기가 이동**했다.

**상승 ③  없음 (그 외 업종은 대체로 하락)**
이날은 사실상 반도체만 올랐다. 세일즈포스 **−1.97%**, 월트디즈니 **−1.73%**, 암젠 **−1.55%**, 맥도널드 **−1.52%**, 트래블러스 **−1.33%**, 머크 **−1.32%**, 셰브론 **−1.29%**, 월마트 **−1.18%**, 아메리칸익스프레스 **−1.11%**, 나이키 **−0.95%**, JP모건체이스 **−0.94%**, 코카콜라 **−0.94%** 등 업종 대표주가 대부분 내렸다.

**하락 ①  소프트웨어 (이날 최약)**
가이드와이어소프트웨어 **−19.90%**, 유아이패스 **−16.60%**, 아사나 **−12.70%**, 오토데스크 **−8.30%**, 어도비 **−6.70%**. 반도체와 정확히 반대로 움직였다. **AI가 기존 소프트웨어 사업모델을 대체할 수 있다는 우려**가 금리 상승 국면에서 증폭됐다.

**하락 ②  전기차·빅테크**
테슬라 **−5.92%**(사이버캡 실망 + 안전 당국 우려), 팔란티어 **−4.49%**, 애플 **−2.51%**, 마이크로소프트 **−2.04%**, 알파벳 **−1.11%**. **다우의 낙폭이 S&P·나스닥보다 컸던 것은 애플·MS·세일즈포스가 지수를 끌어내렸기 때문**이다.

**하락 ③  안전자산·가상자산**
금 12월물이 **\$4,477.90(−1.37%)**로 급락했다. 국채금리와 달러가 함께 오른 영향이다. 비트코인도 반락해 **장중 7만 8,000달러대**까지 밀렸다.

>
> [수급] 전일 국내는 코스피 **+1.64%(6,687.21)**, 코스닥 **+2.95%(813.50, 5거래일 만에 반등)**로 동반 상승했다. **외국인·기관·기타법인이 모두 매수**했고 코스닥에서는 외국인이 3,000억원대를 순매수했다. SK하이닉스는 **+3.20%(1,647,000원)**, **외국인 +30만 8,833주·기관 +9만 6,776주 순매수 전환**(개인 −103만 7,636주). 거래대금 **7조 2,107억원**, 시가총액 **1,203조원**. 괴리율은 **+39.4% → +45.1%**로 5.7%p 확대됐다 — 국내(+3.20%)보다 ADR(**+8.14%**)이 훨씬 크게 올랐기 때문이며, 원/달러 **1,350.4원(−8.9원)**의 하락으로도 상쇄되지 않았다.

**[시장의 시선]** 이날의 핵심은 **같은 지표를 업종별로 정반대로 읽었다**는 점이다. 8월 고용 16만 2,000명은 소프트웨어에는 **할인율 상승**이었고, 반도체에는 **데이터센터 수요 확인**이었다. 마이크 딕슨의 표현대로 두 업종이 **시소**에 올라타 있는 국면이며, 이날 시소는 반도체 쪽으로 크게 기울었다.

정책 쪽에서는 **한 주 사이 인상 확률이 네 번 방향을 바꿨다**는 사실 자체가 중요하다. 워시 의장의 매파 연설, 유가 급등, 월러 이사의 동결 시사, 고용 서프라이즈가 차례로 확률을 밀고 당겼다. **다음 주 CPI·PPI가 이 시소를 끝낼 마지막 지표**이며, 브렛 켄웰 이토로 전략가의 말처럼 **"연준의 눈에는 노동시장이 버티고 있으니 물가가 더 큰 문제"**인 구도다.

한국 쪽에서 확인된 사실은 **ADR과 원주의 괴리 확대**다. SKHY는 주간 **+9.91%**인데 국내 SK하이닉스는 **−0.36%**로, 같은 기업의 두 시장 가격이 한 주 만에 10%p 넘게 벌어졌다. 괴리율 **+45.1%**는 기록 구간이며, 원화가 **−1.61%** 강세를 보였는데도 좁혀지지 않았다.

주시할 변수는 세 가지다 — **①다음 주 8월 CPI·PPI**(월러가 동결의 조건으로 명시한 지표), **②9월 FOMC(9/15~16) 인상 확률 58.4%**, **③원/달러 1,350원선**이 외국인 수급 복귀로 이어지는지. 미 증시는 **9월 7일 노동절로 휴장**한다.

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

행사 자체가 악재로 작용한 구조라는 점이 뼈아프다. 신제품 공개는 통상 기대를 현실화하는 이벤트인데, **공개 이후 오히려 기대치가 하향 조정**되면서 이벤트 프리미엄이 소멸했다.
매크로도 불리했다. 8월 고용 서프라이즈로 9월 인상 확률이 **49.4% → 58.4%**로 되돌아가면서, 회수 기간이 긴 자율주행·에너지 프로젝트를 다수 보유한 이 종목의 할인율 부담이 다시 커졌다.

**10. 팔란티어 (PLTR) −4.49% — 고밸류에이션 AI 소프트웨어의 취약성**
데이터 분석 소프트웨어 기업이 **4.49% 급락**했다. **회사 고유의 신규 공시나 실적 발표는 없었고**, 가이드와이어(**−19.90%**)·유아이패스(**−16.60%**)로 이어진 소프트웨어 업종 전반의 매도에 함께 휩쓸렸다.
이 종목은 **AI 수혜주이면서 동시에 소프트웨어**라는 이중 성격을 갖는다. 이날처럼 **AI 하드웨어는 사고 AI 소프트웨어는 파는** 국면에서는 후자의 성격이 더 크게 작동한다. 마이크 딕슨 호라이즌인베스트먼츠 운용 총괄이 지목한 **"반도체와 소프트웨어의 시소"**가 그대로 반영된 셈이다.
금리 민감도도 높다. 밸류에이션이 이익 대비 크게 형성돼 있어 **할인율 변화에 주가가 크게 반응**하는 구조이며, 9월 인상 확률이 **49.4% → 58.4%**로 하루 만에 되돌아간 것이 낙폭을 키운 배경으로 해석된다.

## 💬 섹션 3. 구루·기관 코멘트

- **브래드포드 스미스 (제이너스 헨더슨 인베스터스 포트폴리오 매니저, CNBC):** **"8월 고용 지표는 압도적"**이라며 **"케빈 워시 의장이 잭슨홀 컨퍼런스에서 이미 매파적인 성향을 보인 터라 인플레이션 지표에 따라 연준이 언제든 금리를 올릴 수 있는 상황"**이라고 평가했다.
- **브렛 켄웰 (이토로 전략가):** **"투자자들이 노동시장을 어떻게 보든 연준은 이를 대체로 완전고용에 부합한다고 판단하고 있으며 이번 보고서가 그 시각을 강화할 것"**이라며 **"연준의 눈에는 노동시장이 버티고 있으니 물가가 더 큰 문제"**라고 진단했다.
- **마이크 딕슨 (호라이즌인베스트먼츠 포트폴리오 운용 총괄):** **"반도체와 소프트웨어 두 업종이 시소 국면에 갇혀 있다"**며 **"거의 매일 반복되는 양상이고 오늘도 예외가 아니었다"**고 평가했다.
- **도널드 트럼프 (미국 대통령):** 소셜미디어에 **"일자리 수치가 훌륭하게 나왔으니 시장이 올라야 하는데, 지난 25년간 늘 그랬듯 상황이 좋으면 물가 공포 때문에 그것을 죽여야 한다는 거짓 현실 속에 살고 있어 주가가 내린다"**고 적었다. 기준금리가 **1% 또는 0.5%**여야 한다고 주장했고, 연준이 금리를 내리지 않으면 **적자를 보는 국가들과 교역을 끊겠다**고 위협했다.
- **CME 페드워치(9/16 FOMC):** 0.25%p 인상 확률 **58.4%**. 고용지표 발표 전 **49.4%**에서 상승했다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📈 8월 CPI·PPI(다음 주) — 이번 사이클의 마지막 관문:** 월러 이사가 동결 지지의 전제로 직접 명시한 지표다. 고용이 강하게 확인된 상황이라 **물가가 판단의 유일한 남은 변수**가 됐다. 브래드포드 스미스의 표현대로 "인플레이션 지표에 따라 언제든 금리를 올릴 수 있는" 국면이다.
- **🏛 9월 FOMC(9/15~16) — 인상 확률 58.4%:** 한 주 사이 확률이 **57.5% → 68.2% → 49.4% → 58.4%**로 네 번 방향을 바꿨다. 워시 의장의 첫 정책회의이며, 물가지표 발표 후 확률이 어디로 수렴하는지가 다음 주의 관전 포인트다.
- **🇺🇸 미 증시 9월 7일(월) 노동절 휴장:** 다음 주 미국 정규장은 화요일부터다. 한국 증시는 정상 개장하므로 **월요일 국내 장은 미국 신호 없이 움직인다**.
- **🛢 유가 — 무대가 홍해로 옮겨갔다:** WTI가 **5거래일 연속** 올라 **\$91.48**, 브렌트는 **\$96.28**이다. 호르무즈에 이어 **바브엘만데브 해협** 인근에서 예멘 정부군과 후티 반군이 충돌해 **하루 129명이 사망**했다. 트럼프 대통령의 이란 **'곡괭이산' 공격 가능성** 시사도 변수다. 유가는 다시 물가 → 금리로 연결되는 경로다.
- **📱 애플 신형 아이폰 공개(9/9) — 첫 폴더블:** 이날 테슬라의 사이버캡 공개가 오히려 **−5.92%**를 만든 사례가 나온 만큼, 신제품 발표가 자동으로 호재가 되지 않는다는 점을 감안할 필요가 있다. 국내 디스플레이·부품주에는 직접 재료다.
- **🔧 SKHY 괴리율 +45.1% — 기록 구간:** ADR과 원주의 주간 등락이 **+9.91% vs −0.36%**로 10%p 넘게 벌어졌다. 원화가 **−1.61%** 강세를 보였는데도 괴리가 확대됐다는 점에서, **국내 수급이 ADR을 따라가는지**가 다음 주 확인 사항이다.
- **📌 SK하이닉스 미확정 공시:** 중국 충칭공장 지분 4조 매각 → **재공시 9/9**. 확정 시 실제 자산 재편이라 주가 촉매로 작용할 수 있다.
