## 🗓 시장 요약

**① 나스닥 25,372.01(+0.83%)·S&P500 7,568.92(+0.36%)·다우 51,786.72(−0.38%) — 반도체 반등에 나스닥 3일 연속 하락 마감, 애플이 다우 끌어내려**
나스닥은 **25,372.01(+207.65, +0.83%)**, S&P500은 **7,568.92(+27.52, +0.36%)**로 올랐지만 다우는 **51,786.72(−197.26, −0.38%)**로 밀렸다. 전날 조정 국면(10월 6일 고점 대비 −10% 이상)에 들어선 나스닥100이 28,180.26(+0.68%)으로 반등했고, 장중 나스닥 상승폭은 한때 1.1%까지 커졌다. 다우는 애플과 소비재·금융주가 끌어내렸다. 러셀2000은 2,812.45(+0.23%), VIX는 20.85(−1.42%)로 소폭 안정됐다. 선거 결과는 현지 화요일 밤부터 나오기 시작해 일부 경합지는 하루 이상 걸릴 수 있다.

**② 2년물 4.61%(+2.0bp)·10년물 4.95%(+4.0bp)·30년물 5.32%(+4.0bp) — 9월 JOLTS 구인 750만 건으로 예상 웃돌아**
9월 JOLTS 구인건수는 750만 건으로 예상(710만 건)을 웃돌았고 8월치도 720만 건으로 상향 수정됐다. 채용률은 3.4%로 8월(3.3%)보다 조금 올라 '적게 뽑고 적게 자르는' 노동시장이 이어졌다. 미 재무부 기준 2년물은 **4.61%(+2.0bp)**, 10년물은 **4.95%(+4.0bp)**, 30년물은 **5.32%(+4.0bp)**로 올랐다. 고금리가 기술주 밸류에이션 부담으로 거론됐고, 지난주 연준 지역 총재 두 명이 금리 추가 인상 필요성을 언급한 점도 금리 상단을 지지했다.

**③ WTI \$96.71(+0.26%)·브렌트 \$104.32(−0.43%) — 케심섬 공습 보도와 협상 기대가 엇갈리며 보합, 금 −1%대**
유가는 장 초반 미군의 이란 케심섬 공습 보도에 브렌트가 \$106.50(+1.66%)까지 올랐다가, 이란과의 협상 기대가 다시 살아나며 상승분을 반납했다. WTI 12월물은 장중 \$93.59~\$98.82를 오간 끝에 **\$96.71(+\$0.25, +0.26%)**, 브렌트 1월물은 **\$104.32(−\$0.45, −0.43%)**로 마감했다. 미국 휘발유 평균가는 갤런당 \$4.14, 경유는 \$6.29로 선거일 기준 사상 최고 수준이었다. 금 선물은 \$3,931.50(−0.96%) 안팎으로 내렸다. 트럼프 대통령은 캐나다와의 무역 합의가 "곧" 이뤄질 것이라고 말했다.

**④ AI·반도체 — SOX 10,600.40(+2.63%)·AMD +3.65%·브로드컴 +3.07%·마이크론 +2.58%·엔비디아 +2.29%**
SOX는 10월 6일 고점 대비 약 22% 하락해 6월 이후 두 번째 약세장에 들어간 직후 **10,600.40(+272.07, +2.63%)**으로 반등했다. 장 마감 뒤 실적을 앞둔 AMD(AMD)는 \$483.90(+3.65%), 브로드컴(AVGO)은 \$332.13(+3.07%), 마이크론(MU)은 \$855.10(+2.58%), 엔비디아(NVDA)는 \$206.69(+2.29%)로 올랐다. AMD는 장 마감 뒤 3분기 매출 \$133.8억(+45%)과 4분기 매출 가이던스 약 \$170억(±3%)을 발표했다. 광모듈 업체 파브리넷(FN)은 분기 매출 +51%의 사상 최대 실적에 \$363.33(+15.45%)로 급등했다.

**⑤ 실적·이슈 — 뉴로크린 +13.42%·피서브 +12.46%·블룸에너지 +9.05%, 다이나트레이스 −14.69%·가트너 −13.19%·쇼피파이 −8.74%**
실적 시즌이 종목별 명암을 크게 갈랐다. 3분기 매출이 41% 늘어난 뉴로크린(NBIX)은 **\$164.85(+13.42%)**, 비용 절감 목표를 올리고 자사주 매입 계획을 밝힌 피서브(FISV)는 **\$58.40(+12.46%)**, 바클레이즈의 투자의견 상향을 받은 블룸에너지(BE)는 **\$214.01(+9.05%)**로 올랐다. 반대로 향후 가이던스가 약했던 다이나트레이스(DT)는 **\$47.03(−14.69%)**, 성장의 질 우려가 커진 가트너(IT)는 **\$204.22(−13.19%)**, 거래액이 예상에 못 미친 쇼피파이(SHOP)는 **\$142.57(−8.74%)**로 밀렸다. 식품 유통업체 시스코(SYY)도 외식 수요 둔화와 연료비 부담으로 \$74.11(−9.33%)까지 떨어졌다. 애플(AAPL)은 **\$331.90(−1.90%)**, 팔란티어(PLTR)는 **\$175.40(−1.65%)**였다.

**⑥ 🇰🇷 SOX +2.63%·SK하이닉스 ADR \$150.79(+2.09%)·코스피200 야간선물 900.20(+1.70%) — 반도체 반등, 선거 결과가 남은 변수**

SK하이닉스 ADR은 장중 \$154.05(+4.29%)까지 올랐다가 \$150.79(+2.09%)로 마감했다. 전날 코스피가 반도체 급락에 −3%대 밀린 만큼 미국 반도체 반등과 AMD의 데이터센터 매출 급증이 국내 메모리주의 저가 매수 근거가 될 수 있다.

**3. AMD (AMD) +3.65% — 장 마감 뒤 3분기 매출 \$133.8억(+45%)·데이터센터 +97%, 4분기 가이던스 약 \$170억**
AMD는 시가 \$479.99에서 출발해 고가 \$497.40(+6.55%)까지 오른 뒤 \$483.90(+\$17.06, +3.65%)로 마감했다. 장 마감 뒤 발표한 3분기 매출은 \$133.77억으로 45% 늘어 가이던스 상단을 넘었고, 비GAAP 주당순이익은 \$2.09(+74%)로 사전 예상치(\$1.95)를 웃돌았다. 데이터센터 매출이 \$85.5억으로 97% 급증했고, 4분기 매출 가이던스는 약 \$170억(±3%), 비GAAP 총이익률은 약 55%로 제시했다. 리사 수 CEO는 "데이터센터 매출이 1년 전보다 거의 두 배로 늘며 사상 최대 분기를 기록했다"고 말했다.

**4. 쇼피파이 (SHOP) −8.74% — 3분기 매출 \$37.4억(+32%)·거래액 \$1,191억 모두 예상 소폭 하회**
쇼피파이는 시가 \$136.43에서 출발해 저가 \$135.65(−13.17%)까지 밀린 뒤 \$142.57(−\$13.65, −8.74%)로 마감했다. 3분기 매출은 \$37.4억으로 32% 늘었지만 시장 예상(\$37.5억)에 조금 못 미쳤고, 총거래액(GMV)도 \$1,191억(+29%)으로 예상(약 \$1,200억)을 밑돌았다. 구독 매출은 \$8.36억으로 예상(\$8.50억)에 못 미쳤으며, 조정 주당순이익 \$0.49는 예상을 소폭 웃돌았다. 높은 기대가 반영된 주가에 성장 둔화 신호가 겹치며 매물이 쏟아졌다.

**5. 다이나트레이스 (DT) −14.69% — 실적은 무난했지만 향후 가이던스 부진·마진 우려**
다이나트레이스는 시가 \$46.00에서 출발해 저가 \$45.52(−17.43%)까지 밀린 뒤 \$47.03(−\$8.10, −14.69%)로 마감했다. 클라우드 관측(옵저버빌리티) 소프트웨어 기업인 다이나트레이스는 분기 실적을 발표했지만 향후 가이던스가 시장 기대에 못 미쳤고 수익성 개선 속도에 대한 우려도 함께 제기됐다. 주가는 장중 고가도 \$49.43(−10.34%)에 그쳐 하루 내내 전일 종가 \$55.13을 크게 밑돌았고, 같은 날 가트너(−13.19%)·쇼피파이(−8.74%) 등 소프트웨어·IT 서비스주 전반이 실적 실망에 동반 약세였다.

**6. 가트너 (IT) −13.19% — 3분기 예상 상회에도 성장의 질 우려, 장중 −21%대 급락**

**7. 블룸에너지 (BE) +9.05% — 바클레이즈 '비중확대' 상향·목표주가 \$289, 캘리포니아 탄소포집 협력**

**8. 뉴로크린 바이오사이언스 (NBIX) +13.42% — 3분기 매출 \$11억(+41%), 2026년 잉그레차 판매 전망 상향**

**9. 파브리넷 (FN) +15.45% — 분기 매출 +51%로 사상 최대, AI 광모듈 수요 확인**
파브리넷은 시가 \$329.99에서 출발해 고가 \$371.63(+18.09%)까지 오른 뒤 \$363.33(+\$48.63, +15.45%)로 마감했다. 광통신 부품 위탁생산 기업인 파브리넷은 분기 매출이 51% 늘어 사상 최대 실적을 발표했다. 전날 마벨의 루멘텀 인수 발표 여파로 광통신주가 급락했지만, 파브리넷의 실적은 AI 데이터센터용 광모듈 수요가 견조하다는 점을 보여주며 업종 투자심리를 되살렸다.

**10. 화이자 (PFE) −2.18% — 3분기 예상 상회, 연간 매출 가이던스 \$620억~\$640억으로 상향**
화이자는 시가 \$30.68에서 출발해 고가 \$31.06(+1.27%)까지 올랐다가 \$30.00(−\$0.67, −2.18%)로 마감했다. 3분기 실적이 예상을 웃돌았고, 연간 매출 가이던스를 기존 \$605억~\$625억에서 \$620억~\$640억으로, 조정 주당순이익 가이던스를 \$2.80~\$3.00에서 \$2.95~\$3.05로 올렸다. 다만 이노벤트와의 라이선스 계약에 따른 \$6.5억(주당 10센트) 일회성 비용이 반영됐고, 세실 게강이 새 최고재무책임자(CFO)로 선임됐다. 장 초반 상승분을 지키지 못하고 약세로 마감했다.
