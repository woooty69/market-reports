## 🗓 주말 요약

**① 트럼프 "협상이 진전되면 추가 공습은 매우 가능성이 낮다" — 동시에 "다리 38개를 한 시간이면 무너뜨린다"**
트럼프 대통령은 일요일 인터뷰에서 이란이 핵 합의와 호르무즈 재개 쪽으로 진전을 보이면 전쟁 재개는 "매우 가능성이 낮다"며 "그들이 아주 강한 합의에 서명하느냐에 달렸다"고 말했다. 그러면서도 항공모함 **3척**이 "완전히 장전돼 있다"고 했고, 이란의 다리 **38개**를 "말 그대로 한 시간 안에" 무너뜨릴 수 있다고 경고했다. 주말 케심섬 '소규모 공습'은 전면전 복귀가 아니라고도 선을 그었다. 다만 행정부 핵심 참모들 사이에서는 공습 재개와 협상 지속을 두고 의견이 갈려 있다는 보도가 나왔다. 일요일판이 다룬 '압박 속 협상' 구도에서 대통령 본인의 무게중심이 협상 쪽으로 한 걸음 옮겨 간 셈이다.

**② 아락치 "이틀 재개안은 유효하다, 아니면 지옥을 보게 될 것" — 중재는 선거 뒤 잠시 멈췄다**
아바스 아락치 이란 외무장관은 일요일 "미국 유권자는 선택을 했다, 이제 백악관이 선택할 차례"라며 "전 전선에서의 종전을 포함한 요구 조건을 받아들이면 결과를 보게 될 것"이라고 했다. 거부하면 이란군이 "지옥을 퍼부을 것"이라는 경고도 붙였다. 아락치는 중간선거 결과로 중재 노력이 **일시적으로 멈췄다**며 중재국이 다시 움직이기를 기다려야 한다고 국영 방송에 말했다. 이란은 목요일 카타르를 통해 핵 관련 제안을 미국에 전달한 것으로 알려졌다. 협상 채널은 살아 있지만 이번 주 안에 타결 발표가 나올 가능성은 낮아졌다는 뜻이다.

**③ 봉쇄는 바다에서 육로로 — 미국, 이라크에 이란 국경 검문소 폐쇄 요구**
미 중부사령부가 7일(현지) 출범시킨 '아이언 게이트' 태스크포스는 약 **20명** 규모로 플로리다 탬파에 자리 잡고, 이란의 육로·카스피해를 통한 무기·제재 물자·불법 자금 이동을 막는다. 트럼프 대통령은 일요일 "역사상 최대의 해상 봉쇄와 결합해 이란에 드나드는 것은 거의 없다"고 했다. 푸아드 후세인 이라크 외무장관은 미 재무부가 이란과의 국경 검문소를 **2곳만 남기고** 모두 닫으라고 요구했다며 "모두 닫으면 우리 경제에 영향이 크다", "현재 협의 중"이라고 밝혔다. 같은 날 예멘 후티 반군은 사우디의 미사일 공격으로 사나주에서 수십 명이 숨졌다고 주장했다. 압박 수단이 늘어난 만큼, 유가에 붙은 위험 프리미엄도 쉽게 빠지기 어렵다.

**④ 국내는 '주간 −11.71%' 뒤 첫 장 — 거래소 집계 외국인 한 주 10조4,427억원 순매도**
한국거래소에 따르면 코스피는 6일 **5,059.69**로 한 주 동안 **−11.71%**, 코스닥은 **−11.06%(644.27)** 내렸다. 6일 장중에는 **4,911.28**까지 밀리며 약 9개월 만에 5,000선을 내줬고 서킷브레이커와 매도 사이드카가 잇달아 발동됐다. 외국인은 한 주 유가증권시장에서 **10조4,427억원**을 팔았고 개인(3조9,710억원)과 기관(4조4,990억원)이 받아냈다. 지난주 코스피·코스닥 상장사 3곳 중 1곳이 연중 최저가를 기록했다. 금요일 밤 미국 반도체 반등(SOX **+4.21%**)과 MSCI 한국 ETF **+4.07%**, 직전 야간선물 **+1.60%**가 월요일 아침의 첫 반영분이다.

## 🎯 이번 주 관전 포인트

**1. CPI — 강한 고용 뒤 첫 물가, 근원 0.3%가 분수령**
10월 비농업 고용 16만5,000명·실업률 4.1%로 12월 인상 시나리오가 살아난 상태에서 10일(현지) CPI가 나온다. 시장 예상은 헤드라인과 근원 모두 전월비 **+0.3%**이고, 2025년 셧다운으로 기준 자료가 비어 전년비 수치는 이번에 나오지 않는다. 근원이 예상을 웃돌면 금요일 4.51%까지 오른 2년물이 다시 4.6%대를 시험하고 달러 강세가 외국인 수급을 더 누른다. 예상에 부합하거나 낮으면 VIX 25.64까지 올라간 변동성을 식히는 첫 재료가 된다.

**2. 코어위브 — AI 인프라 신용위험의 시험대**
코어위브는 10일(현지) 장 마감 뒤 3분기 실적을 낸다. 시장은 매출 **\$35억(전년 대비 +159%)**을 예상하지만, 최근 회사채 금리와 신용부도스와프 프리미엄이 가파르게 오른 만큼 관심은 현금흐름·이자 비용·추가 자금 조달 계획에 쏠려 있다. 지난주 선거 다음 날 코어위브가 −9.90% 빠지며 데이터센터 규제 우려를 가장 먼저 반영했던 만큼, 이번 실적은 '규제 할인'에 '신용 할인'까지 더해질지를 가른다. 숫자가 견조하면 SOX의 기술적 반등이 이어질 근거가 되고, 차입 부담이 부각되면 AI 인프라 전반의 할인율이 다시 오른다.

**3. 이란 — '매우 가능성 낮다'와 '지옥' 사이, 중재 재개 시점**
트럼프 대통령의 공습 가능성 일축과 아락치 장관의 '이틀 재개안 유효' 발언은 양측 모두 협상 판을 깨지 않겠다는 신호다. 다만 아락치 본인이 중재가 선거 뒤 일시적으로 멈췄다고 밝혀 타결 시점은 늦춰졌다. WTI 12월물은 \$90.83, 브렌트 1월물은 \$98.32로 주간 −12%대 급락을 마친 상태라, 협상 재개 소식이면 \$90 아래 추가 하락, 육로 봉쇄 확대나 공습이면 되반등이라는 비대칭이 이어진다.

**4. 반도체 — 금요일 반등이 '되돌림'인지 '바닥'인지**
SOX는 목요일 −12.25% 뒤 금요일 +4.21%로 일부만 되찾았고 주간으로는 −12.15%다. SK하이닉스 ADR은 주간 −14.66%로 \$127.34에 마쳤다. 메모리주가 금요일 장중 상승폭을 상당 부분 반납한 점은 매물이 남아 있다는 신호다. 이번 주에는 CPI발 금리 방향, 코어위브의 투자 계획, 데이터센터 규제가 '건설 금지'가 아니라 '전기요금·용수 부담 완화'에 맞춰지는지가 반등 지속 여부를 정한다.

### 🇰🇷 한국 관전 포인트

국내 증시는 9일(월) 금요일 밤 미국의 **SOX +4.21%·AMD +11.04%·마이크론 +5.12%·SK하이닉스 ADR +2.78%(\$127.34)**와 **MSCI 한국 ETF +4.07%**를 반영하며 출발한다. 코스피200 야간선물은 직전 11/6 세션이 **795.50(+1.60%)**으로 마감해 반등 출발 여건은 갖췄지만, 장중 810.70까지 올랐다가 밀린 값이라 개장 초 매물 소화가 관건이다.

수급은 '외국인 매도 감속'이 첫 조건이다. 외국인은 지난주 현물을 10조4,427억원 팔았지만 코스피200 선물은 순매수를 이어 갔다. 한화투자증권 하장권은 외국인 매도 강도가 정점을 지났다고 보면서도, 본격 복귀에는 원화 강세·달러 약세·실질금리 하락이 함께 나타나야 한다고 짚었다. 화요일 밤 CPI가 그 첫 확인 지점이다.

국내 고유 일정도 많다. 11일 11월 1~10일 수출은 반도체 업황을 다시 확인할 지표이고, 12일에는 코스피200 옵션 만기와 MSCI 정기 변경이 겹쳐 대형주 변동성이 커질 수 있다. 업종으로는 낙폭이 컸던 반도체와 ESS·전력기기가 반등 후보로 거론되고, 유가 주간 −12%대 하락은 항공·화학·운송에 우호적이며 정유에는 역풍이다.
