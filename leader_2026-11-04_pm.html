# 미국→한국 선점 2026-11-04 (미국 2026-11-03 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 78개 · 연결 종목 882개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 7개:** 방산(격차 +23.8%p), 조선·LNG선·함정 MRO(격차 +16.6%p), 바이오텍·기술수출(격차 +14.0%p), 전선·케이블(격차 +9.8%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 비만치료제, 철도, 의류 OEM·패션, 의료기기·미용기기 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 항공·여행·카지노·면세(-15.0%p), 엔터·K콘텐츠·웹툰(-11.6%p), 농업·비료(-10.6%p)
- **이제 막 힘 붙는 조기 테마:** 항공기 부품(조기 73), 통신·5G(조기 72), 중국 소비·관광 회복(조기 70) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 한화시스템(방산, 점수 100), 에이비엘바이오(바이오텍·기술수출, 점수 99), 풍산(방산, 점수 97)
