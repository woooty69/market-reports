## 🗓 시장 요약

**① 코스피 6.16% 급락, 하루 만에 4,700선 붕괴 — 외국인 1.8조원 매도**
코스피는 197.03p(−3.94%) 내린 4,809.00으로 출발해 장 초반 매도 사이드카가 발동됐고 4,697.51로 마감했다. 외국인이 1조 8,193억원을 순매도한 반면 개인은 1조 3,449억원을 순매수했고 기관은 39억원 순매수로 사실상 관망했다. 전날 매수 사이드카, 이날 매도 사이드카가 연달아 걸리며 올해 사이드카 발동이 금융위기 때의 두 배를 넘었다는 집계가 나올 만큼 변동성이 극단적이다.

**② 반도체: 삼전 시총 1,000조원 붕괴, 하이닉스 11% 급락**
삼성전자는 9.87% 내린 170,700원으로 시가총액이 997조원대로 내려왔고 SK하이닉스는 11.05% 떨어진 1,030,000원으로 100만원선에 턱걸이했다. 두 종목 거래대금만 7조 7,890억원이었고 삼성전기(−12.00%)·SK스퀘어(−11.19%)·한미반도체(−9.96%)도 함께 무너졌다. 미국 AI 기술주 약세와 메모리 전망 둔화, 긴축 경계감이 겹쳤다는 분석이며, 장 마감 후 삼성전기가 1.7조원 규모 자사주 전량 소각 계획을 밝혀 오늘 반응이 관심이다.

**③ 주도 업종: 보안·화장품·바이오 '역주행'**
인터넷과카탈로그소매(+9.05%)·소프트웨어(+8.95%)·화장품(+6.56%)·항공사(+4.42%)·제약(+3.44%)이 올랐다. 미국 정보기관 해킹 소식과 국내 잇단 해킹 피해에 안랩·파수AI가 상한가, 지니언스(+18.79%)·라온시큐어(+15.26%)가 급등했다. 화장품은 연말 성수기·블랙프라이데이·한중 관계 개선 기대에 에이피알(+10.82%)·코스맥스(+12.18%)·실리콘투(+12.02%)·코스메카코리아(+13.36%)가 올랐다.

**④ 약세 업종: 반도체·기판·지주·생보**
반도체와반도체장비(−12.14%, 172종목 중 162종목 하락)가 가장 크게 빠졌고 전자장비와기기(−11.39%)에서는 대덕전자(−12.69%)·코리아써키트(−14.97%)·이수페타시스(−11.96%) 등 기판주가 급락했다. 삼성전자 지분가치에 연동된 생명보험(−11.42%, 삼성생명 −10.93%)과 복합기업(−7.49%, 두산 −15.16%·SK −10.45%·삼성물산 −8.29%)도 약했다. 전기장비(−9.51%)·기계(−5.95%) 등 전날 급등한 피지컬 AI 관련 업종도 되밀렸다.

**⑤ 환율·금리·외부 변수: 오늘 금통위, 미 '과잉생산 관세' 예고**
원/달러는 1,345.00원(하나은행 고시)으로 2.50원 올랐다. 한국은행 금융통화위원회가 오늘(11/26) 열리며 기준금리를 3.00%에서 3.25%로 올릴 것이란 전망이 많다. 미국 USTR은 한국 등 14개 경제주체에 '과잉생산 관세'를 예고하면서 한국·일본·EU 등의 관세 15% 상한은 유지한다고 밝혔지만, 반도체·자동차를 겨냥해 인상 여지를 남겼다는 보도가 이어졌다. 미국 10월 PCE 물가는 전년 대비 3.8%로 예상에 부합했고 뉴욕증시는 S&P500 −0.25%, 나스닥 −0.62%, 다우 +0.33%로 혼조 마감했다.

**⑥ 코스닥: 2.29% 하락 — 장비주 급락, 보안·뷰티 상한가**

## 1. 업종별 흐름

**상승 업종** — 인터넷과카탈로그소매가 9.05%(상승 2/하락 4)로 가장 많이 올랐고 소프트웨어(+8.95%)는 안랩(+29.96%)·지니언스(+18.79%)·라온시큐어(+15.26%)·파수AI(+29.95%) 등 보안주가 끌어올렸다. 화장품(+6.56%, 상승 40/하락 20)은 에이피알(+10.82%)·코스맥스(+12.18%)·아모레퍼시픽(+5.72%)·한국콜마(+5.68%)가, 항공사(+4.42%)는 한진칼(+8.61%)이 이끌었다. 제약(+3.44%)은 유한양행(+8.02%)·SK바이오팜(+6.42%)·삼성바이오로직스(+5.66%)·셀트리온(+3.83%)이, 식품(+2.26%)은 삼양식품(+6.94%)이 받쳤다.

**하락 업종** — 반도체와반도체장비가 12.14% 급락했고 생명보험(−11.42%)·전자장비와기기(−11.39%)·전기장비(−9.51%)·복합기업(−7.49%)·통신장비(−6.90%)가 뒤를 이었다. 삼성전자(−9.87%)·SK하이닉스(−11.05%)에 더해 삼성전기(−12.00%)·이수페타시스(−11.96%)·대덕전자(−12.69%) 등 AI 부품주, 두산(−15.16%)·산일전기(−10.35%)·LS ELECTRIC(−6.31%) 등 전력기기주가 약했다. 석유와가스(−6.20%)·기계(−5.95%)도 큰 폭으로 내렸다.

**시장의 시선** — 전날 '젠슨 황 복귀'로 올랐던 반도체·피지컬 AI 업종이 하루 만에 원위치하면서 시장은 방향보다 변동성 자체를 걱정하는 국면이다. 흐름 전환 점검표에서 메모리·소부장은 여전히 하락 점검 2개가 켜진 '하락' 단계이고 메모리 바구니의 20일 코스피 대비 성과는 −8.1%까지 나빠졌다. 증권가에서는 '덜 반영된 환원, 더 반영된 공포 — 바닥은 지났다'(한화)는 낙관과 '금융위기급 낙폭 소화 중'(대신)이라는 경계가 엇갈린다. 오늘은 금통위 금리 결정과 미국 '과잉생산 관세'의 반도체·자동차 적용 범위, 삼성전기 자사주 소각 같은 주주환원 발표가 낙폭 과대 대형주의 되돌림을 이끌 수 있을지, 보안·화장품의 테마 급등이 이어질지를 봐야 한다.

  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
