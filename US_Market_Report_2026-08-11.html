## 🗓 시장 요약

**주말 사이 흔들린 축이 월요일 시장을 그대로 눌렀다.** 이란이 호르무즈 합의에 "미국의 선(先)이행"을 조건으로 걸며 조기 정상화 기대가 후퇴하자, **WTI가 \$82.30으로 +6.77% 급등**했다. 지난 금요일 랠리를 떠받쳤던 '유가 안정 → 인플레 완화' 논리가 정면으로 흔들린 셈이다.

**결과는 금리 상승과 성장주 조정이었다.** 수요일 CPI를 앞두고 국채가 밀리며 **10년물이 4.705%(+0.058%p)**, 2년물이 4.243%(+0.044%p)로 올랐다. 9월 FOMC 인상 확률은 **41.4%에서 50.1%로 되돌아와 동결(49.9%)과 다시 팽팽해졌다.** 금요일 고용 쇼크로 한쪽으로 기울었던 저울이 사흘 만에 제자리로 돌아온 것이다.

**지수는 버텼지만 반도체가 무너졌다.** 다우 −0.11%, S&P −0.06%, 나스닥 −0.32%로 지수 낙폭은 미미했으나 **SOX는 −2.94%** 급락했다. ARM −5.23%, 아스테라랩스 −5.12%, 마벨 −4.65%, 루멘텀 −8.61%로 **AI 인프라·설계 반도체가 집중 타격**을 받았고, 엔비디아도 −2.85% 밀렸다. **인텔은 150억 달러 규모 보통주 발행 계획을 밝히며 −4%** 하락, 희석 우려가 겹쳤다.

**반대편에서는 에너지가 폭발했다.** 아파치 +9.01%, 마라톤페트롤리엄 +7.42%, 다이아몬드백에너지 +5.81%, CF인더스트리스 +6.24%. 금(+1.11%, \$4,448.45)과 은(+3.75%)도 올라 **인플레 헤지 수요**가 되살아났다.

## 📰 시장 헤드라인 3선

**1. 유가 +6.8% 급등(\$82.30) — 호르무즈 조기 타결 기대 후퇴**
이란이 미국의 해군 봉쇄 해제·동결자산 해제를 선결 조건으로 요구하며 합의 지연 우려가 커졌다. 지속 가능한 해결이 어렵다는 회의론이 확산되자 WTI가 하루 만에 +6.77% 치솟았고, 에너지주가 시장에서 가장 강한 섹터가 됐다.

**2. 반도체 −2.94% 급락 — ARM −5%·인텔 150억 달러 증자에 −4%**
지수가 보합권을 지키는 사이 SOX만 −2.94% 무너졌다. ARM(−5.23%)·아스테라랩스(−5.12%)·마벨(−4.65%)·루멘텀(−8.61%) 등 AI 인프라 반도체가 집중 매도됐고, **인텔은 150억 달러 규모 보통주 발행 발표로 −4%** 하락하며 희석 우려를 키웠다.

**3. 9월 인상 확률 41.4%→50.1% 원위치 — 수요일 CPI가 분수령**
유가 급등으로 인플레 우려가 되살아나며 국채금리가 상승(10년물 4.705%)했다. 금요일 고용 쇼크로 41.4%까지 내려갔던 9월 FOMC 인상 확률이 **50.1%로 복귀**해 동결(49.9%)과 팽팽해졌다. 시장의 시선은 8/12 CPI에 집중된다.

### 🔻 하락 업종

**1. AI 인프라 · 설계 반도체 (집중 매도)**
루멘텀(LITE) −8.61%, ARM −5.23%, 아스테라랩스(ALAB) −5.12%, 코닝(GLW) −4.78%, 마벨(MRVL) −4.65%, 엔비디아(NVDA) −2.85%. 금리 상승에 고밸류 반도체가 눌렸고, 인텔의 150억 달러 증자 발표가 업종 전반의 자금조달 부담을 부각시켰다. SOX −2.94%.
> 🇰🇷 [전달] 8/10 미국장 SOX −2.94%·SKHY −1.90%(\$135.29, **괴리율 +34.3%**). 서울은 8/10 SK하이닉스(000660)가 **−0.14%(1,420,000원) 보합**으로 마감해 지난주의 급락세는 멈췄으나, **외국인은 −28.7만 주로 순매도가 다시 확대**됐다(8/7 −5.6만 주). **괴리율은 +38.1% → +34.3%로 3.8%p 축소**됐는데, ADR 하락(−1.90%)에 더해 **원/달러가 1,423.48원 → 1,409.64원으로 원화가 1% 절상**된 영향이 함께 작용했다. [판정] 8/11(화) 한국 증시는 **반도체 중심의 조정 압력**이 우세하다. 근거는 ①미 SOX −2.94%, AI 인프라 반도체 −5%대 동반 급락 ②유가 급등발 금리 상승(10년물 4.705%)이 고밸류 성장주에 역풍 ③외국인 순매도 재확대. 다만 **원화 강세는 외국인 수급에 우호적**이고 괴리율이 여전히 +34.3%로 국내 저평가 여지가 남아 하방은 제한적일 수 있다. **오늘 밤 미국 CPI(8/12 발표)** 결과가 주중 방향을 가르며, **SK하이닉스 8/13 실적·주주환원안**이 개별 촉매다. (무효화: CPI 예상 하회로 금리 급락 시 반등 전환)

**2. 하드웨어 · 메가캡**
애플(AAPL) −1.54%, 마이크론(MU) −1.82%. 금리 상승 국면에서 대형 기술주가 눌렸고, 메모리도 SK하이닉스 증설 여진에 약세를 이어갔다.
> 🇰🇷 [전달] 애플·메모리 동반 약세는 국내 IT부품·메모리 밸류체인에 부담.

**3. 항공 · 데이터 서비스**

**시장의 시선:** 지수만 보면 조용한 하루였지만, 내부는 **완전한 자리바꿈**이었다. 에너지가 9% 오르는 동안 AI 인프라 반도체는 5% 빠졌다. 유가 하나가 금리를 밀어올리고, 금리가 고밸류 성장주를 눌렀으며, 그 자금이 실물·에너지로 옮겨간 것이다. 지난주 시장을 떠받친 두 축(고용 부진·유가 안정) 중 하나가 무너지자 상승 논리도 절반이 사라진 셈이다. **수요일 CPI가 나머지 절반의 운명을 정한다.**
