# 📊 한국증시 데일리 리포트
### 2026년 10월 5일(월) 작성 · 기준일: 10월 2일(금) 정규장

> 10월 5일(월)은 개천절 대체공휴일로 국내 증시가 휴장합니다. 다음 거래일은 10월 6일(화)이며, 10월 9일(금) 한글날에 다시 휴장합니다.

## 주요 지수·자산

| 지표 | 종가 / 레벨 | 등락 |

*코스피는 6,938.27로 약하게 출발해 장중 6,927.88까지 밀렸다가 오후에 기관 매수가 붙으며 7,003.74(+0.46%)로 마감, 5거래일 만에 7,000선을 되찾았다. 기관이 4,155억원을 순매수했고 개인은 1조7,897억원, 외국인은 1,080억원을 순매도했다. 브렌트유 배럴당 102달러 돌파와 중국의 석유제품 수출 중단 소식에 S-Oil(+10.82%)과 SK이노베이션(+8.38%)이 급등했고, 업종별로는 통신장비(+4.06%)·석유와가스(+3.90%)·우주항공과국방(+3.87%)이 상위였다. SK하이닉스는 1,842,000원(+0.49%), 삼성전자는 276,000원(보합)으로 반도체 대형주는 숨을 골랐다. 코스닥은 장중 903.88까지 올랐으나 893.29(−0.11%)로 밀려 마감했다.*

## 🗓 시장 요약

**① 코스피 7,000선 회복, 기관이 받치고 개인·외국인이 판 장**
코스피는 32.39포인트 오른 7,003.74로 마감해 9월 23일 이후 5거래일 만에 7,000선 위로 올라섰다. 기관이 4,155억원을 사들인 반면 개인은 1조7,897억원을 순매도했고, 외국인도 1,080억원 매도 우위였다. 삼성전자·SK하이닉스 자사주 매입이 기타법인 매수로 잡히며 지수 하단을 받쳤다는 해석이 나온다. 연휴(10/3～10/5)를 앞두고 미국 고용지표와 10/8 삼성전자 잠정실적을 기다리는 관망세도 컸다.

**② 반도체 대형주는 보합권, 소부장·기판은 강세**
SK하이닉스는 1,842,000원(+0.49%), 삼성전자는 276,000원(0.00%)으로 거래대금 1·2위(3조7,078억원·3조1,418억원)였지만 등락은 작았다. 삼성전자는 자사주 매입 진척률이 100.96%로 사실상 끝나 수급 공백 우려가 거론됐다. 반면 마이크론 호실적 이후 메모리 업황 기대가 이어지며 심텍(+6.57%)·리노공업(+4.55%)·제주반도체(+5.22%) 등 중소형 반도체주가 강했다. 이오테크닉스(−4.79%)·HPSP(−4.06%)·원익IPS(−2.86%)는 단기 급등 뒤 차익실현이 나왔다.

**③ 정유·방산·광통신이 주도**
10/1 브렌트유 12월물이 배럴당 102.31달러(+4.37%)로 뛰고 중국 정유사들의 10월 석유제품 수출 중단 소식이 전해지자 S-Oil(+10.82%)과 SK이노베이션(+8.38%)이 급등했다. 중동 미군 증파 보도와 누리호 5차 발사(10/7)를 앞두고 한화에어로스페이스(+3.38%) 등 방산·우주항공주도 올랐다. 전날 밤 미국 광통신주(Coherent +10.90%, Ciena +7.77%) 강세를 이어받아 티엠씨(상한가)·우리로(+12.55%)·성호전자(+10.18%)·대한광통신(+5.06%)이 동반 급등했다.

**④ 바이오·화장품·인터넷은 약세**
생물공학(−2.23%)·제약(−1.58%)·화장품(−1.30%)·인터넷과카탈로그소매(−2.24%)가 하위권이었다. 삼성바이오로직스는 유상증자 1차 발행가가 1,174,000원으로 예정가보다 11.2% 낮게 정해진 여파로 −3.67% 밀렸고, 에이프릴바이오는 파트너사 임상 2a상 세부 데이터 공개 후 −20.75% 급락했다. 한국콜마(−6.42%)·코스맥스(−2.87%) 등 화장품 ODM주는 단기 급등 뒤 차익실현이 나왔다.

**⑤ 환율 1,350원대로 하락, 국고채 금리도 하락**
서울 외환시장 원/달러 주간 종가는 1,350.6원으로 7.8원 내렸고, 10/5 아침 하나은행 고시 환율은 1,347.00원(−12.50원)이다. 국고채 3년물은 3.9%대로 9월 10일 이후 처음 4% 아래로 내려왔고 10년물은 4.3%대로 하락했다. 10월 국고채 발행 축소(16조원→12조원)와 9월 소비자물가 2.9% 둔화가 배경이다. 한국은행 기준금리는 3.00%로 7·8월 연속 인상 이후 10/22 금통위가 다음 결정이다.

**⑥ 코스닥, 장중 900 돌파 후 약보합 마감**
코스닥은 장중 903.88로 3개월 만에 900선을 넘었으나 893.29(−0.11%)로 마감했다. 외국인이 1,767억원을 팔았고 개인(+841억원)·기관(+936억원)이 받았다. 상장 2일차 브릴스가 거래대금 4,467억원으로 코스닥 1위를 기록하며 +12.15% 올랐고, 에코프로(+4.70%)·로보티즈(+5.23%)·삼천당제약(+5.32%)이 강세였다. 알테오젠(−2.08%)·ISC(−6.46%)·피에스케이(−6.11%)는 약했다.

## 1. 업종별 흐름

**상승 업종** — 통신장비(+4.06%, 상승 40·하락 9)가 1위였다. 티엠씨(+29.95%)·머큐리(+29.80%)가 상한가에 올랐고 우리로(+12.55%)·오이솔루션(+9.93%)·쏠리드(+6.90%)가 AI 데이터센터 광통신 수요 기대에 동반 급등했다. 석유와가스(+3.90%)는 S-Oil(+10.82%)·SK이노베이션(+8.38%)이, 우주항공과국방(+3.87%)은 한화에어로스페이스(+3.38%)가 이끌었다. 에너지장비및서비스(+2.78%)·전기제품(+2.53%)·화학(+2.42%)도 강했는데, 화학은 미국 폴리실리콘 최저수입가격(MIP) 도입 기대에 OCI홀딩스(+6.79%)·한화솔루션(+5.40%)이 올랐다. 2차전지 소재에서는 롯데에너지머티리얼즈(+18.98%)가 동박 수요 기대에 급등했고 LG에너지솔루션(+2.36%)·삼성SDI(+2.32%)·에코프로(+4.70%)가 함께 올랐다. 해운사(+1.87%)는 장기운송계약을 잇달아 따낸 팬오션(+6.29%)이 주도했다.

**하락 업종** — 인터넷과카탈로그소매(−2.24%)와 생물공학(−2.23%)이 가장 약했다. 삼성바이오로직스(−3.67%)는 유상증자 발행가 하향에 따른 희석 우려가, 에이프릴바이오(−20.75%)·펩트론(−8.35%)은 개별 재료 소멸이 부담이었다. 제약(−1.58%)·생명과학도구및서비스(−1.48%)·화장품(−1.30%)도 하락했고 한국콜마(−6.42%)·실리콘투(−2.87%)가 눈에 띄게 밀렸다. 항공사(−1.03%)는 유가 102달러대 재진입이 부담이었다.

**시장의 시선** — 지수는 7,000선을 되찾았지만 상승은 정유·방산·광통신 같은 테마 순환매 성격이 강했다. 반도체 대형주는 자사주 매입 종료 이후 수급과 10/8 삼성전자 잠정실적(영업이익 컨센서스 약 108조원)을 확인하려는 분위기다. 연휴 중 미국 9월 고용이 +2.9만명으로 부진해 금리 인상 우려가 줄었고 나스닥이 사상 최고치를 경신했으며, 코스피200 야간선물도 1,127.10(+1.25%)으로 마쳐 10/6 출발은 우호적인 환경이다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님)

**1. SK하이닉스 (000660) +0.49% — 자사주 매입 76% 진행, 3분기 영업이익 컨센서스 78조원**
SK하이닉스는 1,842,000원으로 마감했고 거래대금은 3조7,078억원으로 시장 1위였다. 4조원 규모 자사주 2,407만주 매입 계획 중 1,835만주(76.24%)를 사들였으며 10월 중순 매입이 끝날 전망이라 이후 수급 공백 우려도 함께 거론된다. 3분기 영업이익 컨센서스는 78조600억원으로 전 분기 대비 29% 늘어날 것으로 집계됐다. 국민연금이 삼성전자를 약 8,000억원 팔고 SK하이닉스를 1.6조원 사들였다는 분석 기사도 나왔다.

**2. 삼성전자 (005930) 0.00% — 10/8 3분기 잠정실적, 영업이익 컨센서스 108조원**
삼성전자는 장중 등락 끝에 276,000원 보합으로 마감했다. 자사주 매입은 목표 5,328.5만주를 넘긴 5,380만주(진척률 100.96%)로 사실상 마무리됐고, 매입 종료에 따른 수급 공백이 보합의 배경으로 꼽혔다. 10월 8일 발표될 3분기 잠정실적 컨센서스는 매출 약 201.7조원, 영업이익 약 108조원(전년 대비 +788%)이다. 9월 29일에는 삼성 6개사와 함께 미국 AI 인프라 기업 헬릭스에 합계 10억달러(삼성전자 5억달러)를 투자한다고 밝혔다.

**3. 현대차 (005380) −0.57% — 9월 글로벌 판매 16% 감소, 3분기 미국 판매는 분기 최대**
현대차는 347,000원으로 0.57% 내렸다. 9월 글로벌 판매는 307,998대로 16.0% 줄었고 내수(−25.7%)와 해외(−13.9%)가 모두 감소했다. 반면 3분기 미국 판매는 269,541대(+3.5%)로 분기 최대를 기록했고 투싼이 64,075대 팔렸다. 10월 2일 뉴욕에서 5세대 투싼을 공개하며 2030년까지 신차 100종 출시 계획을 내놨다.

**4. KB금융 (105560) +1.45% — 3분기 순이익 1.8조～2.0조원 전망, 주주환원율 50%대 중반**
KB금융은 168,400원으로 1.45% 올랐다. NH투자증권은 3분기 지배순이익을 1조8,175억원(+7.8%)으로 추정하고 목표주가 226,000원을 제시했으며, 올해 주주환원율을 56.6%로 전망했다. iM증권은 3분기 순이익 1조9,822억원(+17.6%)으로 컨센서스를 웃돌 것으로 봤다. 같은 날 국민은행 고객 119명의 정보 유출 사실이 알려졌으나 주가 영향은 제한적이었다.

**5. 신한지주 (055550) +2.02% — 은행주 동반 강세, 신한은행 정보유출 전액 보상 약속**

원익IPS는 139,400원으로 2.86% 하락했고 거래대금은 1,848억원이었다. 10월 1일 장중 5.78% 급등한 뒤 차익실현 매물이 나왔으며 개별 악재는 확인되지 않았다. 최근 1개월 상승률은 약 24%이고 증권사 평균 목표주가는 154,714원으로 상승여력은 약 11%다. 주요 고객사인 삼성전자의 10월 8일 잠정실적과 설비투자 계획이 다음 재료로 꼽힌다.

**27. 한국콜마 (161890) −6.42% — 치약 사업 141억원 양도, 단기 급등 뒤 차익실현**
한국콜마는 137,100원으로 6.42% 급락했고 거래대금은 943억원이었다. 10월 1일 치약 사업을 콜마오랄스에 141억원에 양도한다고 공시했으며, 이날은 기관·외국인 동반 매도로 장중 132,000원까지 밀렸다. 메리츠증권은 10월 1일 목표주가 195,000원을 제시했고, 9월 화장품 수출이 12.13억달러(+26.2%)로 견조해 업황 우려보다는 차익실현 성격으로 해석된다. 9월 30일에는 풍문 또는 보도에 대한 미확정 해명 공시도 있었다.

**28. LG이노텍 (011070) −1.71% — 3분기 영업이익 1,422억원으로 컨센서스 크게 하회 전망**
LG이노텍은 574,000원으로 1.71% 내렸다. 다올투자증권은 3분기 매출 5.71조원, 영업이익 1,422억원으로 컨센서스(2,742억원)를 크게 밑돌 것으로 보고 목표주가를 1,100,000원에서 1,000,000원으로 낮췄다. 원/달러 환율이 1,500원대에서 1,350원 부근으로 내려온 영향이 컸다. 한편 AI 가속기용 100mm 이상 대면적 기판을 고객사와 공급 협의 중이며 2027년 양산을 목표로 한다는 보도가 나왔다.

**29. 현대모비스 (012330) +0.92% — 램프 사업 6,000억원 매각, 증권사 매수 유지**
현대모비스는 385,500원으로 0.92% 올랐다. 9월 30일 램프 사업을 물적분할해 프랑스 OP모빌리티에 6,000억원에 매각한다고 공시했고, 매각 대상 매출은 약 1.0조원으로 전사 매출 61조원의 약 1.7%다. 11월 24일 임시주총이 열리며 주식매수청구가는 408,394원, 청구액이 2,300억원을 넘으면 분할이 철회된다. 삼성증권(목표가 650,000원)·대신증권(580,000원)·KB증권은 매각 대금이 전장·로보틱스 투자와 주주환원 재원이 될 것으로 평가했다.

**30. 한화솔루션 (009830) +5.40% — 미국 태양광 최저수입가격 도입, 4분기 영업이익 2,823억원 전망**
한화솔루션은 36,100원으로 5.40% 올랐고 거래대금은 1,977억원이었다. 미국 무역확장법 232조에 따라 12월 4일부터 태양광 모듈 W당 0.38달러, 폴리실리콘 kg당 21달러의 최저수입가격(MIP)이 시행되며 미국 모듈 가격이 40.7% 오른 효과가 기대된다. 미국 매출 비중이 80%이고 조지아 솔라허브는 MIP와 관세를 피할 수 있다는 점이 부각됐다. 삼성증권은 4분기 영업이익을 2,823억원(+157.7%)으로 전망했고 기관은 6거래일 연속 순매수했다.

**31. OCI홀딩스 (010060) +6.79% — 폴리실리콘 kg당 21달러 최저수입가격 수혜**
OCI홀딩스는 236,000원으로 6.79% 올랐다. 미국 232조 행정명령으로 12월부터 폴리실리콘·웨이퍼에 kg당 21달러의 최저수입가격이 도입되는데, 현재 비중국산 시세가 kg당 16～18달러여서 판가 상승 효과가 기대된다. 삼성증권은 목표주가 340,000원과 3분기 영업이익 742억원을 제시했다. 9월 22일 이후 주가 상승률은 약 25%에 이른다.

**32. 브릴스 (468670) +12.15% — 상장 2일차 거래대금 4,467억원, 휴머노이드 센터 계획**
브릴스는 34,150원으로 12.15% 올라 코스닥 거래대금 1위(4,467억원)를 기록했다. 10월 1일 공모가 19,500원(밴드 상단)으로 상장해 시초가 61,800원(+216.9%)을 찍은 뒤 30,450원으로 첫날을 마쳤고, 이튿날 다시 반등했다. 수요예측 경쟁률 1,187.7대 1, 청약 증거금 4.9조원을 모은 로봇 모듈화 플랫폼 기업으로 2025년 매출 238억원, 영업이익 24억원을 냈다. 2027년 상반기 송도에 휴머노이드 센터를 열 계획이다.

**33. 제주반도체 (080220) +5.22% — 모바일 메모리 팹리스, 거래대금 4,029억원**
제주반도체는 92,800원으로 5.22% 올라 9만원대에 안착했다. 9월 28일 74,100원에서 10월 1일 89,400원(+14.18%)으로 급등한 데 이어 이날도 장중 95,500원까지 올랐고 거래대금은 4,029억원으로 코스닥 2위였다. 마이크론 실적 발표 이후 메모리 업황 기대가 커지면서 모바일용 메모리 팹리스로 매수가 확산됐다. 시가총액은 약 3.2조원으로 불어났다.

**34. 성호전자 (043260) +10.18% — 자회사 CPO 광정렬 장비 1,645만달러 수주**
성호전자는 31,400원으로 10.18% 급등했고 거래대금은 2,945억원이었다. 자회사 ADS테크가 미국 상장사로부터 CPO(광전 통합 패키징)용 액티브 광정렬 장비를 1,645만달러어치 수주한 점이 광통신 랠리와 맞물렸다. 9월 1일부터 10월 1일까지 한 달간 주가는 71% 올랐다. 상반기 매출 1,512억원(+31%), 영업이익 101억원(+246%)으로 실적도 뒷받침됐다.

**35. 대한광통신 (010170) +5.06% — AI 데이터센터용 864코어 케이블, 수주잔고 6년 만에 700억원 돌파**
대한광통신은 17,860원으로 5.06% 올랐고 거래대금은 2,693억원이었다. 전날 밤 미국 광통신주가 Coherent +10.90%, Ciena +7.77% 등 급등한 영향으로 국내 광통신주가 동반 강세였다. 대한광통신은 기존 144코어 대비 밀도가 6배인 864코어 AI 데이터센터용 케이블을 보유했고, 2분기 통신부문 수주잔고는 전 분기 대비 58% 늘어 6년 만에 700억원을 넘었다. 광섬유 가격 급등도 수혜 요인으로 꼽힌다.

**36. 두산 (000150) −3.32% — 전자BG 3분기 영업이익 2,263억원 전망에도 차익실현**
두산은 1,338,000원으로 3.32% 내렸고 거래대금은 2,012억원이었다. 메리츠증권은 10월 1일 전자BG 3분기 매출 7,567억원(+72.0%), 영업이익 2,263억원(+117.8%)으로 역대 최고 분기를 전망하며 적정주가 2,400,000원을 제시했다. 엔비디아 Vera Rubin향 고사양 CCL 출하가 늘고, CCL 라인을 21개에서 56개로 늘리는 9,684억원 투자도 발표했다. 개별 악재 없이 단기 급등 후 기관·외국인 차익실현으로 장중 5.42%까지 밀렸다.

심텍은 170,200원으로 6.57% 올라 52주 신고가(171,000원)에 근접했고 거래대금은 1,837억원이었다. 9월 28일 145,100원에서 5거래일 만에 약 17% 올랐다. 마이크론 호실적으로 메모리 모듈·패키지 기판 수요가 늘 것이라는 기대가 반영됐고, 9월 반도체 수출이 603억달러(+262.8%)로 사상 최대를 기록한 점도 투자심리를 받쳤다. 시가총액은 약 6.5조원이다.

**38. 팬오션 (028670) +6.29% — 포스코플로우 958억원·VLCC 1,482억원 장기운송계약**
팬오션은 6,250원으로 6.29% 올랐다. 10월 1일 포스코플로우와 958억원 규모(매출 대비 1.8%) 철광석·석탄 장기운송계약을 공시했고, 9월 28일에는 Trafigura와 VLCC 1척 장기 용선계약(1,482억원)을 맺었다. 하나증권은 3분기 매출 1조7,850억원(+41%), 영업이익 1,849억원(+48%)을 전망하며 목표주가 9,000원을 유지했다. 고운임 유지와 SK해운에서 인수한 VLCC의 실적 기여가 3분기부터 본격화된다.

티엠씨는 18,440원으로 상한가에 올랐고 거래대금은 998억원이었다. 거래량은 580만주 이상으로 상장주식의 약 24%가 손바뀜했다. 선박·해양플랜트 케이블 업체로 데이터센터용 광케이블 사업을 키우고 있으며, 5월 19일 미국 데이터센터·AI 인프라 업체와 110억원 규모 광케이블 공급계약을 맺은 이력이 부각됐다. 당일 신규 공시는 없어 광통신 테마 순환매 성격이 강했다.

**40. 에이프릴바이오 (397030) −20.75% — 파트너사 2a상 세부 데이터 공개 후 재료 소멸 매도**
에이프릴바이오는 16,880원으로 20.75% 급락해 52주 최저가(16,450원)에 근접했다. 10월 1일(미국 시간) 파트너사 Evommune이 EVO301(APB-R3)의 아토피 2a상 세부 데이터를 공개했는데, 12주차 EASI 감소율이 55%(위약 22%), EASI-75 달성률이 29%(위약 9%)였다. 피하주사 제형 2b상 착수가 2027년 중반으로 제시되면서 실망 매물이 나온 것으로 풀이된다. 7월 3,468억원 유상증자 납입으로 경영권이 TKG휴켐스로 넘어간 상태다.

## 4. 일정·관전 포인트

**국내 일정**
- 10/5(월): 개천절 대체공휴일로 국내 증시 휴장. 10/6(화) 재개, 10/9(금) 한글날 휴장으로 이번 주 거래일은 10/6～10/8 사흘
- 10/6(화): 9월 말 외환보유액 발표 예정, 진코스텍 공모 청약
- 10/7(수): 누리호 5차 발사(12:23～13:23, 고흥, 위성 15기 탑재), 엘리스그룹 청약(10/7～10/8, 밴드 70,400～90,500원), 티앤이코리아·다비오·유캐스트 수요예측 시작(～10/14)
- 10/8(목): 삼성전자 3분기 잠정실적(영업이익 컨센서스 약 105조～110조원), 8월 국제수지, 디티에스 수요예측 마감
- 10/15(목): 멜콘 코스닥 상장(공모가 12,300원, 청약 경쟁률 1,741대 1)
- 10/22(목): 한국은행 금통위(현재 기준금리 3.00%)
- 10/6 이후: SK 최태원 회장 지분 2.26% 매각(11/2 거래 개시)과 HD현대중공업 임단협 재교섭 진행 상황

**해외 일정**
- 10/5(월) 23:00: 미국 9월 ISM 서비스업 지수
- 10/8(목) 03:00: 9월 FOMC 의사록 공개(9월 회의에서 기준금리 3.75～4.00%로 인상)
- 10/8(목) 21:30: 미국 신규 실업수당 청구 건수
- 중국 국경절 연휴로 상하이선물거래소 10/1～10/7 휴장, 10/8 재개
- 10/14(미국시간): 미국 9월 CPI 발표

### 🇰🇷 오늘 개장 관전 포인트
1. **10/6 개장 갭 상승 여부** — 연휴 중 나스닥이 1.19% 오르며 사상 최고치를 경신했고 SOX가 2.40% 상승했다. 코스피200 야간선물도 1,127.10(+1.25%)으로 마쳐 7,000선 안착 시도가 예상된다.
2. **미국 고용 쇼크와 금리** — 9월 비농업 고용이 +2.9만명에 그쳐 추가 인상 우려가 줄었다. 미 10년물 금리가 5.2%대에 머무는 만큼 성장주 반등 강도와 외국인 순매수 전환 여부를 확인할 필요가 있다.
3. **삼성전자 잠정실적(10/8) 앞둔 반도체 수급** — 삼성전자 자사주 매입이 끝났고 SK하이닉스 매입도 10월 중순 마무리된다. 기타법인 매수가 줄어든 자리를 외국인·연기금이 채우는지가 관건이다.
4. **정유주 추가 상승 vs 유가 되돌림** — 10/2 브렌트유가 102.25달러로 보합에 그쳤고 G7이 1억 배럴 공동 방출에 합의했다. 10/2 급등한 S-Oil·SK이노베이션의 차익실현 가능성을 점검해야 한다.
5. **이벤트 종목** — 누리호 5차 발사(10/7)를 앞둔 우주항공주, 아이온2 정식 출시(10/5) 후 NC 트래픽, SK 오버행 이슈가 개별 변수다.
