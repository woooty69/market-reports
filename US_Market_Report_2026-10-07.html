## 🗓 시장 요약

**① S&P500 7,818.93(+0.58%)·나스닥 27,599.79(+0.45%) 나란히 사상 최고 종가, 다우 +0.49% — AMD +2.80%(장중 사상 최고)·마벨 +5.81%·브로드컴 +3.67%, 반면 러셀2000 −0.59%로 대형주 쏠림**
화요일 미국 지수는 장기 금리가 52주 최고에서 한발 물러난 틈을 타 대형 기술주 중심으로 올라 S&P500과 나스닥이 함께 사상 최고 종가를 새로 썼다. S&P500은 **7,818.93(+44.98, +0.58%)**, 나스닥은 **27,599.79(+122.48, +0.45%)**, 다우는 **51,521.28(+253.38, +0.49%)**였고 나스닥100은 **31,224.47(+148.03, +0.48%)**로 사흘 연속 최고 종가를 이어 갔다. 장중 S&P500은 고가 7,844.52·저가 7,805.96, 나스닥은 고가 27,722.75·저가 27,592.56, 다우는 고가 51,672.25·저가 51,422.90 사이에서 움직였다. 반면 러셀2000은 **2,830.30(−0.59%)**로 내렸고 VIX는 15.01(−3.29%)로 낮아졌다. 종목별로는 AMD(AMD)가 장중 \$658.52로 사상 최고를 쓰고 **\$649.42(+2.80%)**, 브로드컴(AVGO)이 \$375.81(+3.67%), 마벨(MRVL)이 인베스터 데이에서 장기 매출 목표를 끌어올리며 **\$287.01(+5.81%)**로 올랐다. 엔비디아(NVDA)는 장중 \$243.37로 사상 최고를 다시 썼지만 상승 폭을 반납해 \$239.24(+0.14%)로 마감했고, 시가총액은 \$6조에 약 \$2,000억 차이로 다가섰다. 캐피털닷컴의 카일 로다는 다가오는 실적 시즌의 이익 증가율 추정치가 "약 30%로 상향 조정됐다"고 했다. 다만 S&P500 구성 종목 중 50일 이동평균 위에 있는 비중은 약 25%에 그쳤고 엔비디아·애플·마이크로소프트 세 종목이 지수의 약 21%를 차지한다. 해석하면 지수 최고치는 소수 초대형주와 AI 반도체가 만든 것이며, 소형주와 중간 종목의 체력은 여전히 약한 '좁은 랠리'다.

**② 10년물 5.275%(−3.6bp)·2년물 4.791%(−4.2bp)·30년물 5.647%(−1.7bp) — 52주 최고에서 숨 고르기, 도이체방크 "주식과 채권이 둘 다 맞을 수는 없다"**
채권시장은 전날의 매도세가 진정됐다. 10년물은 **5.275%(−3.6bp)**, 2년물은 **4.791%(−4.2bp)**, 30년물은 **5.647%(−1.7bp)**로 내려 전날 기록한 52주 최고에서 물러났다. 2년·10년 금리차는 약 48bp로 전날과 비슷했다. 유가가 2% 가까이 내리며 물가 부담이 덜어진 것이 금리 하락의 배경으로 꼽혔다. 도이체방크는 보고서에서 주식·신용 스프레드·VIX는 "관리 가능한 금리와 강한 이익"의 세계를 가격에 반영하고 있지만 채권시장은 "수십 년 만의 고금리와 끈질긴 인플레이션"이라는 구조적으로 다른 세계를 가격에 반영하고 있다며, 둘 중 하나는 결국 틀릴 것이라고 경고했다. 해석하면 금리 하락은 숨 고르기 수준이며, 수요일 9월 FOMC 의사록과 다음 주 9월 CPI가 장기 금리 5%대 고착 여부를 가를 분기점이다.

**③ WTI \$87.77(−1.86%)·브렌트 \$98.67(−1.64%) — G7 비축유 1억 배럴 방출과 공급 우려 완화로 브렌트 \$100 아래로, 금 \$4,186.20(+0.71%)**
WTI는 **\$87.77(−1.86%)**로 사흘 연속 내렸고 브렌트는 **\$98.67(−1.64%)**로 \$100 아래로 내려왔다. G7이 4개월에 걸쳐 최대 1억 배럴의 비축유를 방출하기로 한 합의가 공급 우려를 누그러뜨렸고, 유가 하락이 투자자들의 관심을 금리·물가에서 기업 이익으로 돌려놓았다는 평가가 나왔다. 귀금속은 금 \$4,186.20(+0.71%), 은 \$61.31(+0.16%)로 강보합이었다. WTI는 지난주 \$88~95 박스의 하단을 시험하고 있다. 해석하면 비축유 방출 효과가 국제 유가에도 번지기 시작했으며, 브렌트가 \$100 아래에 자리 잡으면 장기 금리와 인플레이션 기대에도 숨통이 트일 수 있다.

**④ AI·반도체 — AMD +2.80%(장중 사상 최고 \$658.52)·마벨 +5.81%(인베스터 데이)·브로드컴 +3.67%, 엔비디아 +0.14%, 반면 시게이트 −9.18%·웨스턴디지털 −6.93%·SK하이닉스 ADR −6.39%·마이크론 −1.73%, SOX +0.34%**
필라델피아 반도체지수는 **13,217.82(+45.09, +0.34%)**로 고가 13,349.96에서 상승 폭을 줄였다. AMD(AMD)는 리사 수 최고경영자가 "연산 수요가 공급을 계속 앞지르고 있다"고 한 발언이 부각되며 장중 \$658.52(+4.24%)로 사상 최고를 찍고 **\$649.42(+2.80%)**로 마감했다. 마벨(MRVL)은 인베스터 데이에서 장기 매출 목표를 대폭 올리고 AI 인프라 전망을 강하게 제시해 장중 \$301.27(+11.07%)까지 뛰었다가 **\$287.01(+5.81%)**로 마감했고, 브로드컴(AVGO)도 \$375.81(+3.67%)로 따라 올랐다. 엔비디아(NVDA)는 시가 \$242.08·고가 \$243.37로 사상 최고를 다시 썼지만 \$239.24(+0.14%)로 마감했다. 반면 저장장치와 메모리는 약세가 이어졌다. 도시바의 HDD 생산능력 확대 우려가 이어지며 시게이트(STX)는 **\$805.63(−9.18%)**, 웨스턴디지털(WDC)은 **\$411.04(−6.93%)**로 급락했고, SK하이닉스 ADR(SKHY)은 \$182.56(−6.39%), 마이크론(MU)은 \$1,045.56(−1.73%), TSMC(TSM)는 \$482.30(−0.72%)였다. 해석하면 AI 연산·네트워크 칩(AMD·마벨·브로드컴)으로 자금이 이동하고 공급 확대 우려가 걸린 저장장치·메모리에서는 차익 실현이 사흘째 이어졌다.

**⑤ 회사 고유 재료 — 옵션 케어 헬스 +32.65%(맥케슨·CD&R 인수 협상, 부채 포함 \$50억 이상), 컨스텔레이션 에너지 +12.25%(구글과 890MW 신규 원전 20년 계약), 모더나 −7.75%·노바백스 −9.87%(WHO 역병 위험도 '낮음' 하향)**
재택 수액 치료 업체 옵션 케어 헬스(OPCH)는 맥케슨과 사모펀드 클레이턴 듀빌리어 앤 라이스(CD&R)가 부채 포함 \$50억이 넘는 규모의 인수를 마무리하는 단계라는 보도에 **\$31.00(+32.65%)**로 뛰었다. 원전 운영사 컨스텔레이션 에너지(CEG)는 구글과 890MW 규모 신규 원전 용량에 대한 20년 전력 공급 계약을 맺고 \$43억 이상을 증설에 투입하기로 하면서 장중 \$309.80(+15.76%)를 거쳐 **\$300.40(+12.25%)**로 마감했다. 백신주는 세계보건기구(WHO)가 역병 유행 위험도를 '낮음'으로 내리자 모더나(MRNA)가 **\$187.46(−7.75%)**, 노바백스(NVAX)가 \$11.32(−9.87%)로 밀렸다. 모더나는 10월 9일 나스닥100 편입 발효를 앞두고 장중 \$212.19(+4.42%)까지 올랐다가 방향을 틀었다. 미디어에서는 대법원이 거래 중단 요청을 받아들이지 않으면서 파라마운트-스카이댄스의 워너브러더스 디스커버리 합병이 마무리됐다.

**⑥ 🇰🇷 SK하이닉스 ADR \$182.56(−6.39%)·괴리율 약 +38%, 원주 10/6 1,784,000원(−3.15%) — 10/8 삼성전자 3분기 잠정실적, 10/9 한글날 휴장**
국내 증시는 10/6(화) 연휴 뒤 첫 거래일에 SK하이닉스가 1,784,000원(−3.15%)으로 내리는 등 메모리 대형주가 약했다. 미국에서는 SK하이닉스 ADR(SKHY)이 시가 \$191.48·고가 \$191.84에서 저가 \$180.91(−7.24%)까지 밀려 **\$182.56(−\$12.46, −6.39%)**로 마감했고, 괴리율은 ADR 10주 = 원주 1주, 원주 1,784,000원, 환율 약 1,350원으로 계산하면 약 +38%다. 이번 주는 10/9 한글날 휴장으로 10/7~8 이틀만 남았고 10/8(목) 삼성전자 3분기 잠정실적(영업이익 컨센서스 약 108조원)이 최대 변수다. 해석하면 AMD·마벨 강세는 AI 반도체 전반에 우호적이지만 시게이트·웨스턴디지털 급락과 SKHY −6.39%는 메모리·저장장치 공급 우려가 아직 가라앉지 않았음을 보여 준다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) +0.14% — 장중 \$243.37로 사흘 연속 사상 최고, 시가총액 \$6조에 약 \$2,000억 차이, 폭스콘 호실적으로 AI 서버 수요 재확인**
엔비디아는 시가 \$242.08에서 고가 \$243.37(+1.87%)까지 올라 사상 최고를 다시 쓴 뒤 \$239.24(+\$0.34, +0.14%)로 상승 폭을 대부분 반납했다. 시가총액은 약 \$5.8조로 \$6조 고지까지 약 \$2,000억을 남겼고 올해 상승률은 약 28%다. 최근 분기 매출은 \$816억(+85%)이었고, 협력사 폭스콘의 3분기 매출 호조가 글로벌 AI 인프라 수요를 다시 확인시켰다. 도이체방크는 엔비디아 같은 장기 성장주가 10년물 5%대 금리에서 할인율 부담을 받는다고 경고했다.

**2. AMD (AMD) +2.80% — 리사 수 CEO "연산 수요가 공급을 계속 앞지른다", 장중 \$658.52로 사상 최고**
AMD는 시가 \$648.04에서 저가 \$628.00을 거쳐 고가 \$658.52(+4.24%)로 사상 최고를 찍은 뒤 \$649.42(+\$17.67, +2.80%)로 마감했다. 리사 수 최고경영자는 "연산 수요가 공급을 계속 앞지르고 있다"고 말해 AI 가속기 수요가 내년까지 이어질 것이라는 기대를 키웠다. 폭스콘의 3분기 매출 호조도 AI 서버 공급망 전반의 수요 확인 재료로 작용했다. 브로드컴(AVGO)도 \$375.81(+3.67%)로 함께 올랐다.

**3. 마벨 (MRVL) +5.81% — 인베스터 데이에서 장기 매출 목표 대폭 상향, 2028 회계연도 매출 약 \$200억(+67%) 제시, 6월 이후 최고가**
마벨은 시가 \$271.26에서 고가 \$301.27(+11.07%)까지 뛰었다가 \$287.01(+\$15.76, +5.81%)로 마감했다. 회사는 인베스터 데이에서 2028 회계연도 매출 가이던스를 약 \$200억으로 끌어올려 전년 대비 67% 성장을 제시했는데, 이는 지난 5월 1분기 실적 때 제시한 \$165억보다 높은 수준이다. 맞춤형 AI 칩과 데이터센터 광연결 수요가 성장의 축으로 제시됐다. 주가는 6월 이후 최고 수준으로 올라섰다.

**4. 컨스텔레이션 에너지 (CEG) +12.25% — 구글과 890MW 신규 원전 용량 20년 전력 계약, \$43억 이상 증설 투자**
컨스텔레이션 에너지는 시가 \$291.11로 갭 상승해 고가 \$309.80(+15.76%)를 찍은 뒤 \$300.40(+\$32.78, +12.25%)로 마감했다. 회사는 구글과 890MW 규모의 신규 원전 용량에 대해 20년 장기 전력 공급 계약을 맺었고, 증설에 \$43억 이상을 투입하기로 했다. 빅테크의 데이터센터 전력 확보 경쟁이 원전 신규 투자로 이어진 사례로 평가된다. 알파벳(GOOGL)은 \$347.68(+0.35%)였다.

**5. 옵션 케어 헬스 (OPCH) +32.65% — 맥케슨·클레이턴 듀빌리어 앤 라이스(CD&R) 컨소시엄, 부채 포함 \$50억 이상 인수 마무리 단계 보도**
옵션 케어 헬스는 시가 \$31.04로 급등 출발해 \$31.00(+\$7.63, +32.65%)로 마감했으며 장중 고가 \$31.11·저가 \$30.97로 하루 내내 좁은 범위에 머물렀다. 의약품 유통 기업 맥케슨과 사모펀드 CD&R이 부채를 포함해 \$50억이 넘는 규모의 인수 협상을 마무리하는 단계라는 보도가 나왔다. 주당 인수 가격은 아직 공개되지 않았다. 인수 측인 맥케슨(MCK)은 \$921.67(+0.68%)로 소폭 올랐다.

**6. 시게이트 (STX) −9.18% — 도시바 HDD 생산능력 확대 우려 지속, 고점 대비 차익 실현 확대**
시게이트는 시가 \$856.62에서 저가 \$798.64(−9.97%)까지 밀린 뒤 \$805.63(−\$81.46, −9.18%)로 마감했다. 지난주 보도된 도시바의 HDD 생산능력 확대 계획이 AI 데이터센터용 대용량 HDD의 공급 부족과 가격 강세가 약해질 수 있다는 우려로 이어졌다. 올해 저장장치주가 크게 오른 만큼 공급 확대 신호에 차익 실현이 몰렸다. 같은 이유로 웨스턴디지털(WDC)도 \$411.04(−6.93%)로 내렸다.

**7. 웨스턴디지털 (WDC) −6.93% — 도시바 HDD 증설 우려, 장중 \$406.81까지 하락, 메모리·저장장치 동반 약세**
웨스턴디지털은 시가 \$426.95에서 저가 \$406.81(−7.89%)까지 밀린 뒤 \$411.04(−\$30.60, −6.93%)로 마감했다. 도시바의 HDD 생산능력 확대 우려가 HDD 경쟁사 전반으로 번지면서 시게이트(−9.18%)와 함께 급락했다. 메모리에서도 마이크론(MU)이 \$1,045.56(−1.73%), SK하이닉스 ADR(SKHY)이 \$182.56(−6.39%)로 내려 저장장치·메모리 전반에 공급 확대 경계가 번졌다.

**8. 모더나 (MRNA) −7.75% — WHO가 역병 유행 위험도를 '낮음'으로 하향, 나스닥100 재편입 앞두고 장중 +4.42%에서 반락**
모더나는 시가 \$202.13에서 고가 \$212.19(+4.42%)까지 올랐다가 저가 \$186.64를 거쳐 \$187.46(−\$15.75, −7.75%)로 마감했다. 세계보건기구(WHO)가 역병 유행 위험도를 '낮음'으로 내리면서 백신 수요 기대가 꺾였고, 52주 최고 부근에서 차익 실현도 겹쳤다. 모더나는 10월 9일부터 나스닥100에 재편입될 예정이어서 지수 추종 매수 기대가 있었지만 하락을 막지 못했다. 전날에는 \$203.21(+6.95%)로 올랐었다.

**9. 노바백스 (NVAX) −9.87% — WHO 역병 위험도 하향에 백신주 동반 급락, 장중 −13.38%**
노바백스는 시가 \$12.36에서 고가 \$13.33(+6.13%)까지 올랐다가 저가 \$10.88(−13.38%)까지 밀린 뒤 \$11.32(−\$1.24, −9.87%)로 마감했다. 세계보건기구(WHO)가 역병 유행 위험도를 '낮음'으로 하향하자 최근 감염병 우려로 올랐던 백신주에서 매물이 쏟아졌다. 같은 날 모더나(MRNA)도 −7.75%로 내려 백신 업종 전반이 약세였다.

**10. 맥케슨 (MCK) +0.68% — CD&R과 함께 옵션 케어 헬스 인수 협상(부채 포함 \$50억 이상), 재택 수액 치료 사업 확장**
맥케슨은 시가 \$921.00에서 고가 \$928.46(+1.42%)까지 오른 뒤 \$921.67(+\$6.22, +0.68%)로 마감했다. 사모펀드 클레이턴 듀빌리어 앤 라이스(CD&R)와 함께 옵션 케어 헬스를 부채 포함 \$50억 이상에 인수하는 협상을 마무리하는 단계라는 보도가 나왔다. 의약품 유통에서 재택 수액 치료 서비스로 사업을 넓히려는 전략으로 해석되며, 인수 대상인 옵션 케어 헬스는 +32.65% 급등했다.
