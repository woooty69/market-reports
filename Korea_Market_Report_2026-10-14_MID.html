# 📊 한국증시 데일리 리포트 (장중판)
### 2026년 10월 14일(수) 12시 작성 · 기준일: 10월 14일(수) 정규장 오전장(11:56 현재) (장중판)

## 주요 지수·자산

| 지표 | 현재 / 레벨 | 등락 |
|---|---|---|
| 코스피 | 6,136.37 | **+101.02 (+1.67%)** |
| 코스닥 | 840.06 | **+3.03 (+0.36%)** |
| 코스피200 | 960.13 | **+18.06 (+1.92%)** |
| 코스피200 선물 | 959.70 | **+14.90 (+1.58%)** |
| 원/달러(하나은행 고시) | 1,336.90원 | **−6.10원 (−0.45%)** |
| 코스피 순매수(억원, 잠정) | 개인 −2,455 · 외국인 −3,535 · 기관 +2,542 | **기관 홀로 매수** |
| 코스닥 순매수(억원, 잠정) | 개인 +3,708 · 외국인 −2,320 · 기관 −1,457 | **개인 홀로 매수** |

*11:56 현재 장중 잠정치 — 종가 아님*

*전일 5.46% 급락(6,035.35)으로 5거래일 연속 하락했던 코스피는 6,062.08로 출발해 장중 6,190.65까지 올랐다가 상승폭을 줄여 11:56 현재 6,136.37(+1.67%)에서 움직인다. 장 초반 순매수로 출발한 외국인은 오전 중 매도로 돌아서 −3,535억원, 기관이 +2,542억원으로 지수를 받치고 있다. 삼성전자(+2.80%)·SK하이닉스(+2.08%)가 반등을 이끌고 해운(+6.20%)·전기제품(+3.78%)·자동차부품(+3.52%)·철강(+3.48%)이 강하다. 반면 신한지주(−5.12%)의 롯데손해보험 인수 여파로 손해보험(−4.65%)·은행(−2.88%)이 약하고, 코스닥은 반도체 소부장 약세로 +0.36%에 그친다.*

## 🗓 시장 요약

**① 급락 하루 만에 반등, 상승폭은 절반으로 축소** — 코스피는 전일 CXMT발 메모리 우려로 5.46% 급락한 뒤 저가 매수로 2%대 상승 출발했지만, 6,190선에서 매물이 나와 11:56 현재 +1.67%다. 외국인은 7거래일 만에 순매수로 출발했다가 오전 중 −3,535억원 순매도로 돌아섰고 기관이 +2,542억원을 사들이고 있다. 증권가는 12개월 예상 PER 4.9배까지 내려온 밸류에이션 하단을 반등 근거로 꼽는다.

**② 반도체 대형주 반등, 소부장은 여전히 약세** — 삼성전자는 +2.80%(238,500원대), SK하이닉스는 +2.08%로 거래대금 1·2위(각 1조 7,492억원·2조 3,773억원)를 차지했다. 코엑스에서 개막한 반도체대전에 두 회사가 차세대 HBM4E를 나란히 공개한 점도 심리에 보탬이 됐다. 반면 주성엔지니어링(−2.67%)·원익IPS(−3.22%)·HPSP(−4.38%)·하나마이크론(−5.07%) 등 코스닥 장비·후공정주는 하락이 이어진다.

**③ 해운·2차전지·철강 강세, 은행·보험 약세** — 사우디-후티 충돌로 호르무즈 통행 차질과 운임 상승 기대가 커지며 팬오션(+8.70%)·HMM(+6.35%)이 오르고, ESS 기대로 삼성SDI(+5.36%)·엘앤에프(+7.32%)가 강하다. 미 백악관의 알래스카 LNG 투자 재언급에 대한제강(+19.34%) 등 강관·철강주가 급등했다. 신한지주(−5.12%)가 롯데손보 지분 77.04%를 6,933억원에 인수한다고 발표한 뒤 은행·손보주가 동반 약세다.

**④ 원화 강세, 중동 긴장은 변수** — 원/달러는 1,336.90원으로 6.10원 내려 원화 강세가 이어진다. 전일 미국 증시는 연준 인사들의 완화적 발언으로 낙폭을 줄이며 S&P500 −0.15%로 마감했고, 사우디-예멘 후티 갈등에 따른 유가 부담은 남아 있다. 오후에는 외국인 매도 전환 폭과 반도체 소부장 반등 여부가 지수 방향을 가를 전망이다.

## 1. 업종별 흐름

**상승 업종** — 해운사(+6.20%)가 팬오션(+8.70%)·HMM(+6.35%)을 앞세워 1위다. 전기제품(+3.78%)은 삼성SDI(+5.36%)·LG에너지솔루션(+3.54%)·엘앤에프(+7.32%), 자동차부품(+3.52%)은 현대모비스(+5.02%)·한온시스템(+4.73%)이 이끈다. 철강(+3.48%)은 알래스카 LNG 기대로 대한제강(+19.34%)·POSCO홀딩스(+3.85%), 조선(+2.81%)은 삼성중공업(+6.32%)·HD현대중공업(+3.14%)이 강하다.

**하락 업종** — 손해보험(−4.65%)은 삼성화재(−4.58%)가 롯데손보 매각 이후 업계 재편 경쟁 부담에 밀렸고, 은행(−2.88%)은 신한지주(−5.12%)·우리금융지주(−2.81%)·하나금융지주(−2.49%)가 약하다. 생명보험(−1.81%)·백화점(−1.51%)·건강관리기술(−1.10%)도 하락했고, 한미약품(−7.51%)은 3분기 실적 하회 전망에 급락했다.

**시장의 시선** — 오후장에서는 반도체 대형주 반등이 소부장으로 번지는지, 외국인이 다시 순매수로 돌아서는지가 핵심이다. 해운·철강처럼 중동·알래스카 LNG 뉴스에 기댄 업종은 변동성이 크고, 은행·보험은 신한지주 인수 이후 업계 재편 흐름을 지켜볼 필요가 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 37종목

**1. SK하이닉스 (000660) 1,473,000원 · 1,076조 153억원 · +2.08% — 반도체대전서 HBM4E 공개, 급락 하루 만에 반등**
전일 중국 CXMT의 차세대 서버 D램 출시 계획에 9%대 급락했던 SK하이닉스가 오전장 +2.08%로 반등했다. 코엑스에서 개막한 제26회 반도체대전에서 삼성전자와 나란히 차세대 HBM4E를 공개했고, 거래대금은 2조 3,773억원으로 시장 1위다. 하나증권은 3분기 매출 99.2조원(YoY +306%), 영업이익 77.9조원으로 컨센서스 부합을 전망하며 목표주가 360만원을 유지했다. 다만 중국 YMTC의 낸드 출하량이 키옥시아·마이크론을 앞질렀다는 보도는 경쟁 심화 우려로 남아 있다. [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf) · [리포트: SK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261012_SK_196606.pdf)

**2. 삼성전자 (005930) 238,500원 · 1,394조 3,374억원 · +2.80% — HBM4E 공개·행동주의 펀드 주주환원 요구**
삼성전자는 +2.80%로 반등해 거래대금 1조 7,492억원을 기록했다. 반도체대전에서 HBM4E를 공개했고, 행동주의 펀드 팰리서캐피털은 상대적으로 싼 우선주 중심의 자사주 매입·소각을 요구했다. 주가 급락기에 이재용 회장 일가의 증여가 이뤄져 증여세가 약 1.5조원으로 추산된다는 보도도 나왔다. 외국인은 최근 '삼전닉스'를 10조원 넘게 팔고 소부장을 산 것으로 집계됐다. [리포트: NH 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261012_NH_1137232.pdf) · [리포트: Kiwoom 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261012_Kiwoom_196578.pdf) · [리포트: IBK 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261012_IBK_196588.pdf)

**3. 삼성전기 (009150) 1,406,000원 · 105조 193억원 · +3.15% — 반도체 반등에 MLCC·기판 대형주 동반 강세**
삼성전기는 +3.15%로 거래대금 3,768억원을 기록하며 시총 100조원대를 지켰다. 코스피가 닷새 급락 뒤 1%대 반등하는 과정에서 AI 서버용 MLCC·패키지 기판 대표주로 매수세가 몰렸다. 증권가는 3분기 실적과 주주환원이 지수 반등 지속의 관건이라고 진단했다. 다만 장 초반 2%대였던 코스피 상승폭이 1%대로 줄면서 고점 대비로는 밀려 있다. [리포트: Yuanta 2026-10-08](https://woooty69.github.io/hw-pdf-arch-024/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261008_Yuanta_196548.pdf) · [리포트: Mirae Asset 2026-10-07](https://woooty69.github.io/hw-pdf-arch-024/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261007_Mirae%2BAsset_196491.pdf) · [리포트: Mirae Asset 2026-10-07](https://woooty69.github.io/hw-pdf-arch-024/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261007_Mirae%2BAsset_1136246.pdf)

**4. SK스퀘어 (402340) 869,000원 · 114조 6,420억원 · +1.40% — 솔리다임 미국 상장 준비 착수 보도**
SK스퀘어는 +1.40%로 거래대금 2,395억원을 기록했다. SK하이닉스 자회사 솔리다임이 미국 상장을 위해 SEC 보고 전담팀을 꾸리는 등 상장 카운트다운에 들어갔다는 단독 보도가 나왔다. 솔리다임 상장은 SK하이닉스 지분가치 재평가와 함께 SK스퀘어 순자산가치 할인 축소 재료로 거론된다. 하이닉스 반등(+2.08%)과 같은 방향으로 움직이고 있다. [리포트: SK 2026-09-30](https://woooty69.github.io/hw-pdf-arch-021/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260930_SK_1134363.pdf) · [리포트: Daishin 2026-07-13](https://woooty69.github.io/hw-pdf-arch-011/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260713_Daishin_1112316.pdf) · [리포트: BNK 2026-07-10](https://woooty69.github.io/hw-pdf-arch-011/SK%EC%8A%A4%ED%80%98%EC%96%B4%EF%BC%BB402340%EF%BC%BD_20260710_BNK_1112101.pdf)

**5. LG에너지솔루션 (373220) 424,500원 · 99조 3,330억원 · +3.54% — ESS 기대에 2차전지 반등, 배터리 3사 실적 온도차**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
