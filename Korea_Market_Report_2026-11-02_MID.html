## 🗓 시장 요약

**① 인텔 쇼크를 기관이 받아냈다 — 코스피 1% 하락 출발 뒤 상승 전환** 코스피는 미국 반도체 급락 여파에 장 초반 5,616.50까지 밀렸으나 기관 순매수(+7,368억원)가 쏟아지며 1%대 상승으로 돌아섰다. 개인(−5,622억원)과 외국인(−3,810억원)은 팔았고, 코스피200 선물도 911.50(+1.34%)으로 현물보다 강하다. 미국 지수 선물(S&P500 +0.41%, 나스닥100 +0.75%)의 반등이 투자심리를 거들었다.

**② 반도체는 SK하이닉스 반등, 삼성전자는 보합** SK하이닉스는 1,451,000원(+2.33%)으로 거래대금 1조 8,471억원 1위, 삼성전자는 225,500원(+0.22%)에 그쳤다. SK스퀘어(+2.12%)는 하이닉스 배당수입의 70%를 푸는 4.3조원 이상 주주환원 계획이 부각됐고, 한미반도체(+4.82%)·심텍(+5.11%) 등 소부장도 동반 반등했다. 반면 삼성전기(−0.75%)·삼성SDI(−2.21%)는 약세.

**③ 조선·방산·전력기기가 주도, 금융·바이오는 약세** 한화 그룹의 미 해군 함정 첫 수주 소식에 한화오션(+11.00%)·한화엔진(+12.24%)·HD현대마린엔진(+17.16%) 등 조선이 7.53% 올랐고, 효성중공업(+10.12%)·LS ELECTRIC(+7.22%) 등 전기장비도 6.09% 강세다. 저PBR 기업 명단 공개 첫날 현대제철(+10.25%)이 급등했다. 반대로 신한지주(−3.57%)·하나금융지주(−2.82%)·KB금융(−2.25%) 등 은행(−2.48%)과 삼성바이오로직스(−2.42%)는 약세.

**④ 원/달러 1,343.6원으로 상승, 해외는 혼조** 원/달러는 7.80원 오른 1,343.60원으로 원화가 약해졌다. 닛케이225는 오전장을 −0.31%로 마쳤고 항셍은 +0.06% 보합권, 미국 지수 선물은 반등 중이다. 내일(11/3) 미국 중간선거와 오늘 밤 ISM 제조업지수가 오후장 변수다.

## 1. 업종별 흐름

**상승 업종** 조선(+7.53%, 28개 상승/1개 하락)이 한화오션(+11.00%)·삼성중공업(+8.69%)·HD한국조선해양(+8.86%)·HD현대중공업(+5.66%)을 앞세워 1위다. 항공화물운송과물류(+7.41%)는 현대글로비스(+8.49%)가 3Q 서프라이즈로 끌었고, 전기장비(+6.09%)는 효성중공업(+10.12%)·LS ELECTRIC(+7.22%)·HD현대일렉트릭(+4.00%), 우주항공과국방(+4.68%)은 한화에어로스페이스(+6.18%)·한화시스템(+7.60%)이 올렸다. 건설(+4.09%)은 현대건설(+6.94%)의 미국 SMR 기술협력, 철강(+3.85%)은 현대제철(+10.25%)·한국철강(+23.78%)이 주도했다.

**하락 업종** 건강관리업체및서비스(−4.67%)가 가장 약하고 부동산(−2.75%)·은행(−2.48%)·손해보험(−2.11%)·증권(−1.74%) 등 금융주가 고르게 밀렸다. 신한지주(−3.57%)·메리츠금융지주(−3.38%)·하나금융지주(−2.82%)가 약세이며, 은행 해킹 공포와 금리 하락이 부담이다. 방송과엔터테인먼트(−1.70%)는 하이브(−3.76%), 게임엔터테인먼트(−1.13%)도 약세.

**시장의 시선** 기관 매수가 오후에도 이어질지, 외국인이 매도 규모를 줄일지가 1차 관전 포인트다. 조선·방산은 한화의 미 해군 수주로 '마스가' 기대가 재점화됐지만 단기 급등 뒤 차익 실현을 확인해야 하고, 저PBR 명단 공개 종목(현대제철 등)의 추격 매수 강도도 지켜볼 대목이다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 39종목

*① 오늘 새로 편입된 급등 대형주 17종목(1～17번, 12시 현재 시총 1,000억원 이상 · +10% 이상, 시총 큰 순) → ② 오전장 언론 최다 보도 22선(18～39번, 뉴스 건수 순). 한화오션·현대제철·HD현대마린엔진은 ★ 종목이지만 보도량 상위라 ②에 실었다.*

**1. 효성중공업 (298040) 1,992,000원 · 18조 5,745억원 · +10.12% — 3Q 부진은 이연 물량 탓, 4Q 이익 급증·765kV 기대에 반등**
지난주 발표한 3Q 영업이익 2,435억원(+10.8%)이 컨센서스를 20% 넘게 밑돌며 주가가 급락했지만, 오늘은 거래대금 829억원과 함께 10% 넘게 되올랐다. 오늘 나온 리포트들은 미국 원전 발전사업자향 GIS 매출(약 1억 600만달러)이 태풍으로 이연된 일시적 요인이라며 4Q 회복을 전망했다. 유안타는 목표가 420만원, 대신은 300만원(하향)으로 12월 전력망 규제 불확실성 해소를 기대했고, 지멘스와의 디지털 전력·AI 데이터센터 협력도 재료다. [리포트: Yuanta 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/%ED%9A%A8%EC%84%B1%EC%A4%91%EA%B3%B5%EC%97%85%EF%BC%BB298040%EF%BC%BD_20261102_Yuanta_4100208088.pdf) · [리포트: Shinhan 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/%ED%9A%A8%EC%84%B1%EC%A4%91%EA%B3%B5%EC%97%85%EF%BC%BB298040%EF%BC%BD_20261102_Shinhan_4030354657.pdf) · [리포트: Samsung 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/%ED%9A%A8%EC%84%B1%EC%A4%91%EA%B3%B5%EC%97%85%EF%BC%BB298040%EF%BC%BD_20261102_Samsung_4060344480.pdf)

**2. 한화엔진 (082740) 33,000원 · 2조 7,538억원 · +12.24% — 한화 美 해군 함정 첫 수주에 그룹 조선주 동반 급등**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
