## 🗓 시장 요약

**① 젠슨 황 해임설에 흔들린 출발, 외국인 매수로 사흘째 상승**
엔비디아 이사회가 젠슨 황 CEO 거취를 검토한다는 보도가 나오면서 엔비디아가 시간외에서 급락했고, 코스피는 개장 직후 하락 전환해 5,326.30까지 내려갔다. 하지만 외국인이 코스피에서 2,473억원을 순매수하며 반도체 대형주를 사들이자 장중 5,400선을 회복했고 고가는 5,458.84다. 오늘은 옵션 만기일이라 오후 동시호가 전후 프로그램 매매에 따른 변동성에 유의할 필요가 있다.

**② 반도체: 삼성전자 21만원대, 하이닉스는 오름폭 제한**
삼성전자는 +2.67%(거래대금 1조 6,252억원)로 21만원대에 올라섰고, 이재용 회장이 충청권 140조원 투자와 온양 AI 반도체 거점 계획을 밝힌 것도 관심을 모았다. SK하이닉스는 +1.33%(거래대금 2조 29억원)로 미국 ADR 강세보다 오름폭이 작다. 메모리 기판 판가 인상 기대에 이수페타시스 +8.05%·대덕전자 +7.90%·심텍 +4.89%·티엘비 +10.98%가 강하고, DB하이텍은 3분기 영업이익 900억원 발표 뒤 −14.84%로 밀렸다.

**③ 주도 업종은 엔터·전력기기·기판, 약세는 인터넷·손보·증권**
JYP Ent.가 3분기 영업이익 480억원(컨센서스 +14%) 깜짝 실적에 +19.64%, 하이브 +5.82%·YG PLUS +12.11%로 엔터가 업종 1위다. 효성중공업 +5.30%·HD현대일렉트릭 +5.06%·LS ELECTRIC +4.35% 등 전력기기도 강하다. 반면 NAVER(−6.02%)가 인터넷 업종을 끌어내렸고, 메리츠금융지주(3분기 지배순이익 −28%)·삼성화재(−5.12%)의 실적 실망에 손해보험(−4.16%)과 국고채 PD 과징금 부담이 남은 증권(−2.91%)도 약하다.

**④ 환율 1,333원대, 해외는 미국 선물 약세·일본 강세**
원/달러는 1,333.50원으로 4.00원 내렸다. 미국 지수 선물은 S&P500 −0.32%·나스닥100 −0.53%로 젠슨 황 해임설 여파가 이어지고 있다. 닛케이225는 +0.76%(61,714)로 오전장을 마쳤지만 항셍은 −1.29%로 약하다.

## 1. 업종별 흐름

**상승 업종** — 방송과엔터테인먼트가 +5.96%로 1위다(JYP Ent. +19.64%·하이브 +5.82%). 전기장비 +3.73%(효성중공업 +5.30%·LS ELECTRIC +4.35%), 생명보험 +2.76%(삼성생명 +3.43%, 3분기 영업이익 9,377억원 +14.9%), 소프트웨어 +2.14%(지니언스 +16.99%·코난테크놀로지 +29.95%), 반도체와반도체장비 +2.07%(삼성전자 +2.67%), 조선 +1.47%(HD현대중공업 +3.43%)가 뒤를 잇는다.

**하락 업종** — 인터넷과카탈로그소매 −5.11%, 손해보험 −4.16%(삼성화재 −5.12%·메리츠금융지주 −13.82%), 양방향미디어와서비스 −3.70%(NAVER −6.02%), 에너지장비 −3.09%, 증권 −2.91%, 화장품 −2.67%(실리콘투 −6.74%·달바글로벌 −13.46%), 생물공학 −2.25%(한미약품 −9.18%)가 약하다.

**시장의 시선** — 오후장은 옵션 만기 동시호가와 외국인 반도체 매수 지속 여부가 관건이다. 3분기 실적 시즌 막바지라 실적 발표 종목의 주가 반응이 엇갈리고 있다(코스맥스·JYP·삼성생명 강세, 메리츠·DB하이텍·NAVER 약세). 젠슨 황 관련 후속 보도와 미국 지수 선물 방향도 지켜볼 변수다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 35종목

*① 12시 현재 시총 1,000억원 이상 · +10% 이상 급등한 ★ 필수 편입 13종목(1～13번, 시총 큰 순) → ② 오전장 언론 최다 보도 22선(14～35번).*

**1. ★ JYP Ent. (035900) 46,300원 · 1조 6,452억원 · +19.64% — 3분기 매출 2,675억원 역대 최대, 영업이익 컨센서스 14% 상회**
3분기 매출 2,675억원(+15.0% YoY)·영업이익 480억원(+17.6%)으로 컨센서스(421억원)를 14% 웃돌았다. 스트레이키즈 신보의 서구권 출하와 투어 연계 MD 판매가 실적을 끌어올렸고, 2027년 스트레이키즈 월드투어 일정 공개로 실적 공백 우려도 줄었다. 키움증권은 목표주가 60,000원·매수를 유지하며 "역대 최대 실적, 다만 트와이스 재계약·군입대 일정이 과제"라고 짚었다. 거래대금은 1,018억원으로 코스닥 상위권이다. [리포트: Sangsangin 2026-11-12](https://woooty69.github.io/hw-pdf-arch-041/JYP%20Ent%EF%BC%BB035900%EF%BC%BD_20261112_Sangsangin_2654089.pdf) · [리포트: Samsung 2026-11-12](https://woooty69.github.io/hw-pdf-arch-041/JYP%20Ent%EF%BC%BB035900%EF%BC%BD_20261112_Samsung_4060047110.pdf) · [리포트: SK 2026-11-12](https://woooty69.github.io/hw-pdf-arch-041/JYP%20Ent%EF%BC%BB035900%EF%BC%BD_20261112_SK_198067.pdf)

**2. ★ 티엘비 (356860) 42,450원 · 1조 61억원 · +10.98% — SOCAMM 매출 2배, 증권가 목표가 줄상향**
3분기 SOCAMM 매출이 전분기 대비 2배 넘게 늘며 컨센서스에 부합했고, 메모리 기판 쇼티지 속 판가 인상과 수주잔고 증가가 이어지고 있다. IBK투자증권은 4분기 매출 1,210억원(+67% YoY)·영업이익률 20%를 전망하며 목표주가를 62,000원으로, 키움증권은 60,000원으로 올렸다. 키움은 2027년 PER 8.9배로 IT 평균(10배)보다 낮다고 평가했다. 거래대금 703억원. [리포트: Kiwoom 2026-11-12](https://woooty69.github.io/hw-pdf-arch-041/%ED%8B%B0%EC%97%98%EB%B9%84%EF%BC%BB356860%EF%BC%BD_20261112_Kiwoom_198044.pdf) · [리포트: IBK 2026-11-12](https://woooty69.github.io/hw-pdf-arch-041/%ED%8B%B0%EC%97%98%EB%B9%84%EF%BC%BB356860%EF%BC%BD_20261112_IBK_198054.pdf) · [리포트: Daishin 2026-11-10](https://woooty69.github.io/hw-pdf-arch-041/%ED%8B%B0%EC%97%98%EB%B9%84%EF%BC%BB356860%EF%BC%BD_20261110_Daishin_197943.pdf)

**3. ★ 해성디에스 (195870) 47,700원 · 8,109억원 · +11.45% — AI 수요에 리드프레임·메모리 기판 재평가**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
