# 미국→한국 선점 2026-11-24 (미국 2026-11-23 마감 반영)

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** Medical/Dental Instruments(격차 +24.3%p), Advertising(격차 +23.4%p), Industrial Machinery/Components(격차 +19.7%p), 바이오텍·기술수출(격차 +13.9%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** CDMO·바이오시밀러, 해운, 건설·인프라·재건, Biotechnology: Laboratory Analytical Instruments — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 사이버보안(-24.1%p), 항공·여행·카지노·면세(-15.6%p)
- **이제 막 힘 붙는 조기 테마:** 유전체·유전자치료(조기 75), 반도체 기판·유리기판·MLB(조기 68), 중국 소비·관광 회복(조기 67) — 다음 주 선점 후보군.
