# 미국→한국 선점 2026-11-05 (미국 2026-11-04 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 78개 · 연결 종목 882개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** 방산(격차 +16.9%p), 태양광(격차 +13.2%p), 스마트폰·애플 부품(격차 +12.8%p), 조선·LNG선·함정 MRO(격차 +10.1%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 비만치료제, 의류 OEM·패션, 화장품·K뷰티, 철도 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 엔터·K콘텐츠·웹툰(-21.9%p), 항공·여행·카지노·면세(-21.0%p), 음식료·K푸드(-18.4%p)
- **이제 막 힘 붙는 조기 테마:** 항공·여행·카지노·면세(조기 76), 유통·이커머스(조기 74), 통신·5G(조기 70) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 한미약품(비만치료제, 점수 100), HD현대에너지솔루션(태양광, 점수 86), 파마리서치(의료기기·미용기기, 점수 84)
