## 🗓 시장 요약

**① 나스닥 25,366.09(−0.39%)·S&P500 7,592.40(−0.35%)·다우 52,297.09(−0.36%) — 엔비디아 CEO 사임 충격, 낮 반등을 금리 급등이 되돌림**
나스닥은 **25,366.09(−100.10, −0.39%)**, S&P500은 **7,592.40(−26.98, −0.35%)**, 다우는 **52,297.09(−189.40, −0.36%)**로 마감했다. 엔비디아 쇼크로 나스닥은 개장 직후 25,068.28까지 밀렸지만 낮 동안 낙폭을 대부분 되찾았고, S&P500은 장중 7,652.76까지 올라 상승 전환하기도 했다. 그러나 오후 들어 국채 금리가 다시 뛰자 3대 지수 모두 하락으로 돌아섰다. 나스닥100은 28,289.19(−0.30%), 러셀2000은 **2,799.06(−47.20, −1.66%)**로 금리에 민감한 중소형주가 더 크게 밀렸고, VIX는 **18.74(+1.25, +7.15%)**로 올랐다.

**② 연준 매파 발언 이어져 — 메리 데일리 "추가 긴축 필요", 오스턴 굴스비 "위태로운 순간"**
메리 데일리 샌프란시스코 연은 총재는 추가 긴축이 필요할 것이라는 쪽으로 기운다고 말했고, 오스턴 굴스비 시카고 연은 총재는 지금쯤 물가가 식기를 바랐지만 위태로운 순간에 있다고 평가했다. 화요일 10월 CPI가 두 달 연속 예상보다 뜨겁게 나온 뒤 월가에서는 더 잦고 큰 인상을 예상하는 목소리가 늘었다. 주간 신규 실업수당 청구는 20만 건(전주 대비 +9,000건, 예상 19만5,000건)으로 소폭 늘었다. 10월 기존주택 판매는 연율 375만 채로 전월 대비 5.5% 줄어 2010년 8월 이후 가장 적었다. 로런스 윤 전미부동산중개인협회 수석 이코노미스트는 모기지 금리가 2023년의 한 달을 빼면 2000년 이후 가장 높은 수준까지 올랐다고 말했다.

**③ 미국채 — 2년물 4.86%(+13bp)·10년물 5.10%(+12bp)·30년물 5.43%(+8bp)**
휴장을 마치고 다시 열린 채권시장에서 금리가 일제히 뛰었다. 미 재무부 고시 기준 2년물은 **4.86%(+13.0bp)**, 10년물은 **5.10%(+12.0bp)**, 30년물은 **5.43%(+8.0bp)**로 마감했다. 10년물은 장중 5.129%까지 올라 5% 선 위에 자리를 굳혔다. 트럼프 대통령이 이란과의 전쟁을 곧 끝낼 뜻이 없다는 신호를 보내며 물가 압력이 길어질 것이라는 우려가 커진 데다, 연준 인사들의 매파 발언이 겹쳤다.

**④ WTI \$88.99(+2.84%)·브렌트 \$96.15(+3.65%) — "이란과 합의 필요 없다" 트럼프 발언에 일주일 하락 끝내고 반등**
WTI 12월물은 **\$88.99(+\$2.46, +2.84%)**, 브렌트 1월물은 **\$96.15(+\$3.39, +3.65%)**로 마감했다. 아시아 시간대에는 WTI가 \$85대까지 밀렸지만, 트럼프 대통령이 이란과 합의가 필요 없다는 글을 올리자 상승 전환해 장중 \$89.15까지 올랐다. 일주일 가까이 이어진 하락 흐름을 끊었다. 금 선물은 달러 강세와 연준 긴축 기대에 3% 가까이 밀려 \$3,880대로 내려왔고, 비트코인은 4% 넘게 빠져 \$71,000대로 밀렸다.

**⑤ AI·반도체 — SOX 10,506.67(−0.54%), 엔비디아 \$166.19(−4.34%) vs AMD +5.86%·브로드컴 +5.54%**
엔비디아(NVDA)는 개장 직후 \$148.80(−14.35%)까지 빠졌다가 \$166.19(−4.34%)로 낙폭을 크게 줄였다. 경쟁사로 매수세가 옮겨가며 AMD(AMD)는 \$585.30(+5.86%), 브로드컴(AVGO)은 \$364.36(+5.54%)로 올랐다. 반면 전날 급등했던 메모리·AI 클라우드주는 되밀려 마이크론(MU) \$798.44(−1.59%), 샌디스크(SNDK) \$937.46(−4.11%), 코어위브(CRWV) \$56.60(−6.86%), 네비우스(NBIS) \$128.64(−16.84%)였다. SOX는 장중 10,174.12까지 밀렸다가 **10,506.67(−57.44, −0.54%)**로 낙폭을 줄였다.

**⑥ 🇰🇷 SK하이닉스 ADR \$137.71(−3.19%)·코스피200 야간선물 833.95(+0.78%) — 메모리 숨 고르기, 야간선물은 소폭 반등**

SK하이닉스 ADR은 \$134.25에서 출발해 저가 \$134.05까지 밀렸다가 \$137.71(−\$4.54, −3.19%)로 마감해 전날 +9.71% 급등분 일부를 반납했다. 코스피200 야간선물은 06:00 확정 종가 833.95로 주간 종가 827.50 대비 +0.78% 올랐고, 저가 813.90에서 고가 841.00까지 27포인트 넘게 오르내렸다. 엔비디아 경영 공백과 미국 10년물 5.10% 돌파가 부담이지만, AMD·브로드컴 등 엔비디아 경쟁 반도체가 강했던 점은 완충 요인이다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) −4.34% — 젠슨 황 CEO 즉시 사임, 콜레트 크레스 CFO가 임시 CEO 겸임**
엔비디아는 \$151.01에서 출발해 저가 \$148.80(−14.35%)까지 밀린 뒤 \$166.19(−\$7.54, −4.34%)로 낙폭을 크게 줄여 마감했다. 이사회는 개장 전 오전 8시 48분(현지) 젠슨 황이 사장·CEO·이사직에서 즉시 물러났다고 발표했고, 콜레트 크레스 CFO가 CFO를 겸하며 임시 CEO를 맡고 하비 존스가 첫 이사회 의장이 됐다. 이사회는 언론의 사생활 의혹 보도 이후 11월 8일 독립 조사에 착수했으며, 정식 후임은 내부·외부 후보를 모두 놓고 고른다. 3분기 실적 발표는 예정대로 11월 17일(현지)이고, 주가는 10월 6일 사상 최고 종가 \$239.24보다 약 31% 낮다.

**2. 네비우스 (NBIS) −16.84% — 3분기 매출 \$9억8,080만(+571%)에도 연 \$70억 매출 속도 목표를 12월→2월로 연기**
네비우스는 \$119.93에서 출발해 저가 \$118.81(−23.19%)까지 밀린 뒤 \$128.64(−\$26.05, −16.84%)로 마감했다. AI 클라우드 업체인 이 회사의 3분기 매출은 \$9억8,080만으로 1년 전보다 571% 늘었다. 그러나 연환산 매출 \$70억 달성 시점을 올해 12월에서 내년 2월로 미루고 일부 매출이 2027년으로 넘어간다고 밝히자 실망 매물이 쏟아졌다. 전날 코어위브 실적에 +15.44% 급등했던 상승분을 하루 만에 모두 반납했다.

**3. ADI 글로벌 디스트리뷰션 (ADIG) −49.85% — 3분기 순손실 \$6억5,500만(영업권 상각 \$6억5,900만), 2026년 매출 전망 하향**
ADI 글로벌 디스트리뷰션은 \$15.46에서 출발해 저가 \$9.79(−50.00%)까지 밀린 뒤 \$9.82(−\$9.76, −49.85%)로 마감해 주가가 반 토막 났다. 보안·전자 장비 유통 업체인 이 회사는 3분기에 영업권 상각 \$6억5,900만을 반영해 순손실 \$6억5,500만을 냈다. 2026년 매출 전망은 \$49억1,000만~49억3,000만으로 낮췄고, CEO는 3분기 이익이 기대에 못 미쳤다고 인정했다. 하루 종일 반등 없이 저가 부근에서 마감했다.

**4. 코르테바 (CTVA) −24.30% — 브라질 시장 부진에 2026년 전망 하향, 3분기 순매출 \$15억9,000만(−9%)**
코르테바는 \$10.51에서 출발해 저가 \$9.14(−24.71%)까지 밀린 뒤 \$9.19(−\$2.95, −24.30%)로 마감했다. 농업 종자·작물보호 업체인 이 회사의 3분기 순매출은 \$15억9,000만으로 1년 전보다 9% 줄었다. 브라질의 딜러 재고 과잉, 현금이 부족한 농가, 고금리를 이유로 2026년 전망을 낮췄다. MSCI 미국 지수에서 편입 제외된다는 소식도 겹쳤으며, 변경은 11월 30일 종가 기준으로 반영된다.

**5. 에벡스 (AVEX) +13.44% — 3분기 매출 \$1억8,970만(+56.5%), 2026년 매출 전망 \$8억2,000만~8억4,000만으로 상향**
에벡스는 \$13.65에서 출발해 고가 \$15.53(+28.01%)까지 오른 뒤 \$13.76(+\$1.63, +13.44%)로 마감했다. 방산 무인기 업체인 이 회사의 3분기 매출은 \$1억8,970만으로 1년 전보다 56.5% 늘었고, 순손실은 \$1,680만이었다. 2026년 매출 전망은 \$7억~7억2,000만에서 \$8억2,000만~8억4,000만으로 크게 올렸다. 장중 고가 대비로는 상승폭의 절반 넘게 반납했다.

**6. 페르미 (FRMI) +13.81% — 투자등급 클라우드 기업과 '프로젝트 마타도르' 초기 600MW 계약, 선급금 \$2억**
페르미는 \$1.70에서 출발해 고가 \$2.30(+27.07%)까지 오른 뒤 \$2.06(+\$0.25, +13.81%)로 마감했다. 데이터센터 전력 부지 개발 업체인 이 회사는 이름을 밝히지 않은 투자등급 클라우드 기업과 프로젝트 마타도르 부지의 초기 600MW 공급 계약을 맺었고, 여기에는 선급금 \$2억이 포함됐다. 아직 매출은 없고 3분기 순손실은 \$1억4,160만이었다. 첫 고객 확보로 사업 불확실성이 줄었다는 평가에 매수세가 몰렸다.

**7. 모빌리티 글로벌 (MBGL) +16.11% — 3분기 매출 \$4억7,800만(+7.4%), 연간 조정 EBITDA 전망 상향·자사주 \$8억 매입**
모빌리티 글로벌은 \$21.12에서 출발해 고가 \$23.31(+16.99%) 부근인 \$23.13(+\$3.21, +16.11%)으로 마감했다. 차량 이력 조회 서비스 카팩스를 거느린 이 회사의 3분기 매출은 \$4억7,800만으로 1년 전보다 7.4% 늘었다. 2026년 조정 EBITDA 전망 중간값을 올리고 \$8억 규모 자사주 매입도 승인했다. 장 마감까지 꾸준히 올라 거의 고가에서 끝났다.

**8. 스트래티지 (MSTR) −6.49% — MSCI가 미국 지수 2곳에서 편입 제외 결정, "펀드와 닮아간다"**
스트래티지는 \$114.12에서 출발해 저가 \$112.32(−8.20%)까지 밀린 뒤 \$114.41(−\$7.94, −6.49%)로 마감했다. MSCI는 비트코인을 대규모로 보유하는 이 회사의 사업 모델이 점점 펀드와 비슷해지고 있다며 미국 지수 2곳에서 제외한다고 발표했고, 변경은 11월 30일 종가 기준이다. 퐁 레 CEO는 올해 \$210억을 조달했다고 강조했지만, 비트코인이 4% 넘게 빠져 \$71,000대로 밀린 것도 부담이었다. 지수 추종 자금의 기계적 매도 우려가 남아 있다.

**9. 예티 (YETI) −10.49% — 2026년 조정 매출 증가율 전망 약 6%로 하향, 조정 EPS 전망 \$2.90~2.95**
예티는 \$39.79에서 출발해 저가 \$38.14(−10.86%) 부근인 \$38.30(−\$4.49, −10.49%)으로 마감했다. 아웃도어 용품 업체인 이 회사는 3분기 조정 매출이 6%, 조정 순이익이 35% 늘었지만 2026년 조정 매출 증가율 전망을 7~8%에서 약 6%로 낮췄다. 조정 EPS 전망도 \$2.94~3.00에서 \$2.90~2.95로 내렸다. CEO는 소비자들이 조심스러운 태도를 이어가며 4분기 수요를 누를 것으로 예상했다.

**10. 인튜이티브 머신스 (LUNR) +6.98% — 3분기 매출 \$2억6,900만 사상 최대, 수주잔고 \$19억 최대**
인튜이티브 머신스는 \$14.35에서 출발해 고가 \$14.61(+19.99%)까지 오른 뒤 \$13.03(+\$0.85, +6.98%)로 마감했다. 달 탐사·우주 인프라 업체인 이 회사의 3분기 매출은 \$2억6,900만으로 사상 최대였다. 수주잔고도 \$19억으로 최대치를 새로 썼다. 다만 시가가 거의 고점이었고 장중 내내 밀리며 상승폭의 3분의 2가량을 반납했다.

- **로런스 윤(전미부동산중개인협회 수석 이코노미스트)** — 모기지 금리가 2023년의 한 달을 빼면 2000년 이후 가장 높은 수준까지 올랐다.
- **로이드 블랭크페인(전 골드만삭스 CEO)** — 젠슨 황의 퇴진은 안타깝다. 셰익스피어 비극 같다.
- **제러드 블릭리(야후 파이낸스 시장 기자)** — 반도체주 62개 종목이 10월 초 이후 잃은 가치의 3분의 1도 되찾지 못했고, SOX는 저점 대비 약 17% 반등했음에도 200일 이동평균 아래에 있다.
