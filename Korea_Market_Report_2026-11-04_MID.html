## 🗓 시장 요약

**① 장 초반 +3% 반등이 −3%대 급락으로, 외국인 1.4조원 순매도**
코스피는 시가 대비 5.8% 밀리며 하루 안에 상승분을 모두 반납했다. 미국 중간선거 투표가 마감되면서 하원 구도 변화가 AI 데이터센터·국방예산 정책에 미칠 영향을 둘러싼 경계감이 커졌다. 외국인 순매도는 1조 3,842억원으로 오전에만 1조원을 넘겼고, 코스피200 선물도 858.30(−3.03%)까지 내려왔다.

**② SK하이닉스 −5.58%·삼성전자 −3.87%, 반도체 업종 −4.33%**
SK하이닉스는 거래대금 3조 3,267억원으로 시장 1위이며 미국 투자 관련 규제 우려 보도까지 겹쳤다. 삼성전자(거래대금 2조 942억원)·삼성전기 −3.39%·SK스퀘어 −4.12%도 동반 약세다. 다만 3분기 영업이익이 1,018억원(+722% YoY)으로 컨센서스를 20% 웃돈 심텍은 +8.28%, 코리아써키트 +8.99%로 기판주는 강하다.

**③ 바이오·소프트웨어·화장품 급락, 통신·항공·게임은 강세**
건강관리장비 −6.75%, 생물공학 −6.65%, 소프트웨어 −6.22%, 화장품 −4.55%가 하위권이다. 리보세라닙 FDA 심사가 내년으로 밀린 HLB −20.27%, 어닝쇼크의 LG생활건강 −12.40%, 순익이 급감한 하이브 −10.46%가 업종 하락을 키웠다. 반면 3분기 영업이익 5,523억원을 낸 SK텔레콤 +2.02% 덕에 무선통신 +3.65%, 한진칼 지분 경쟁의 항공 +3.48%, 크래프톤의 게임 +3.12%가 상위권이다.

**④ 원/달러 1,338원대 하락, 아시아 증시 동반 약세**
원/달러는 7.50원 내린 1,338.50원으로 원화는 강세다. 해외는 S&P500 선물 −1.30%, 나스닥100 선물 −2.38%로 미국 선물이 크게 밀렸고, 닛케이225는 −3.56%(60,835)로 아시아에서 낙폭이 가장 크다. 항셍은 −0.27%로 상대적으로 선방하고 있으며, 상해종합은 아직 오늘 값이 갱신되지 않았다.

## 1. 업종별 흐름

**상승 업종** — 무선통신서비스 +3.65%(SK텔레콤 +2.02%, 3분기 영업이익 전년 대비 11배), 항공사 +3.48%(한진칼 +6.68%), 게임엔터테인먼트 +3.12%(크래프톤 +11.60%), 전기유틸리티 +1.88%(한국전력 +3.27%)가 상위다. 태양광 관련 한화솔루션 +5.72%·OCI홀딩스 +2.59%, 방산 한국항공우주 +7.30%도 강하다.

**하락 업종** — 건강관리장비와용품 −6.75%(상승 5·하락 81), 생물공학 −6.65%(HLB −20.27%, 알테오젠 −9.13%), 소프트웨어 −6.22%(안랩 −12.59%, 지니언스 −15.36%), 화장품 −4.55%(LG생활건강 −12.40%), 조선 −4.38%(한화오션 −5.39%), 반도체 −4.33%가 약하다.

**시장의 시선** — 오후장은 미국 중간선거 개표 윤곽이 관건이다. 외국인 순매도가 2조원대로 커지는지, 개인·기관 매수가 5,450선을 지키는지를 봐야 한다. 실적 발표 종목(심텍·한국항공우주·LG생활건강·하이브)의 차별화와 크래프톤 같은 주주환원 종목의 방어력도 관심이다.

## 섹션 2. 이슈 종목 — ★ 신규 편입 9 · 오전장 언론 최다 보도 순 · 오늘 31종목

*① 12시 현재 급등 대형주(시총 1,000억원 이상 · +10% 이상) 9종목(1～9번) → ② 오전장 언론 최다 보도 22선(10～31번).*

**1. 크래프톤 (259960) 203,000원 · 9조 2,330억원 · +11.60% — 3,000억원 자사주 매입 후 전량 소각 결정**
크래프톤이 3,000억원 규모 자사주를 취득해 전량 소각하기로 하면서 장 초반 12%대 급등했다. 이번 결정으로 올해 주주환원 규모는 9,172억원까지 늘었다. 시장 전체가 −3%대로 밀리는 가운데 거래대금 235억원을 모으며 게임 업종(+3.12%)을 홀로 끌어올리고 있다. 최근 삼성증권은 콜라보 일정 조정으로 3분기 영업이익이 16% 줄겠지만 4분기 반등과 밸류에이션 매력을 근거로 매수·목표가 280,000원을 제시했다. [리포트: Samsung 2026-10-30](https://woooty69.github.io/hw-pdf-arch-035/%ED%81%AC%EB%9E%98%ED%94%84%ED%86%A4%EF%BC%BB259960%EF%BC%BD_20261030_Samsung_4062649640.pdf) · [리포트: Mirae Asset 2026-10-22](https://woooty69.github.io/hw-pdf-arch-033/%ED%81%AC%EB%9E%98%ED%94%84%ED%86%A4%EF%BC%BB259960%EF%BC%BD_20261022_Mirae%2BAsset_196948.pdf) · [리포트: Bookook 2026-10-19](https://woooty69.github.io/hw-pdf-arch-027/%ED%81%AC%EB%9E%98%ED%94%84%ED%86%A4%EF%BC%BB259960%EF%BC%BD_20261019_Bookook_4170002535.pdf)

**2. TYM (002900) 6,210원 · 2,571억원 · +12.91% — 3분기 영업이익 358억원, 전년 대비 124.7% 증가**
TYM은 3분기 영업이익이 358억원으로 전년 대비 124.7% 늘었다고 발표했다. 같은 날 대동이 현대차그룹과 로봇 팜 팩토리 사업화를 논의한다는 소식에 농기계·로봇 부품주가 함께 강세다. 거래대금은 92억원이며 시가총액 2,571억원 규모의 중소형주로 실적과 테마가 겹쳤다. [리포트: Kiwoom 2026-08-04](https://woooty69.github.io/hw-pdf-arch-013/TYM%EF%BC%BB002900%EF%BC%BD_20260804_Kiwoom_1119419.pdf)

**3. 대명에너지 (389260) 13,290원 · 2,381억원 · +25.61% — 재생에너지주 동반 강세 속 급등, 개별 뉴스 확인되지 않음**
대명에너지는 12시 현재 +25.61%로 코스닥 상승률 최상위권이며 거래대금은 306억원이다. 최근 96시간 개별 뉴스·공시는 확인되지 않았다. 같은 시간 한화솔루션 +5.72%, HD현대에너지솔루션 +3.18%, 한국전력 +3.27% 등 전력·재생에너지 종목이 하락장에서 오르고 있어 테마성 수급이 몰린 것으로 보인다. [리포트: Shinyoung 2026-07-20](https://woooty69.github.io/hw-pdf-arch-012/%EB%8C%80%EB%AA%85%EC%97%90%EB%84%88%EC%A7%80%EF%BC%BB389260%EF%BC%BD_20260720_Shinyoung_1114155.pdf) · [리포트: Kiwoom 2026-07-02](https://woooty69.github.io/hw-pdf-arch-010/%EB%8C%80%EB%AA%85%EC%97%90%EB%84%88%EC%A7%80%EF%BC%BB389260%EF%BC%BD_20260702_Kiwoom_1109561.pdf)

**4. 대동 (000490) 7,220원 · 2,081억원 · +10.40% — 현대차그룹과 '로봇 팜 팩토리' 사업화 논의**
대동은 현대차그룹과 로봇 기반 스마트팜 공장 사업화를 논의 중이라는 보도에 10%대 급등했다. 계열사 대동기어가 1.9조원 수주잔고와 로봇 액추에이터 사업을 내세우며 상한가 부근까지 오르는 등 대동그룹 3개 상장사가 동반 강세다. 대동 거래대금은 431억원으로 시가총액(2,081억원)의 20%를 넘는다. [리포트: KIRS 2026-09-09](https://woooty69.github.io/hw-pdf-arch-031/%EB%8C%80%EB%8F%99%EF%BC%BB000490%EF%BC%BD_20260909_KIRS_196047.pdf)

      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
