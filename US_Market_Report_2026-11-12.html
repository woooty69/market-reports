## 🗓 시장 요약

**① 나스닥 25,466.19(+1.60%)·S&P500 7,619.38(+1.31%)·다우 52,486.49(+0.49%) — 코어위브발 AI 반등, CPI 충격 하루 만에 만회**
나스닥은 **25,466.19(+400.31, +1.60%)**, S&P500은 **7,619.38(+98.45, +1.31%)**, 다우는 **52,486.49(+254.60, +0.49%)**로 마감해 전날 CPI 충격으로 내준 낙폭을 모두 되찾았다. 기술주 중심으로 강하게 출발한 S&P500은 정오 무렵 +1.5% 안팎으로 고점을 찍은 뒤 상승폭을 소폭 줄였고, 다우는 장 초반 약보합에서 오후 들어 상승 전환했다. 나스닥100은 28,374.25(+2.28%), 러셀2000은 2,846.26(+24.88, +0.88%), VIX는 **17.51(−1.95, −10.02%)**로 내려왔다.

**② 금리 인상 기대는 그대로 — 12월 25bp 인상 확률 약 90%, 미셸 보먼 "물가 2%까지 아직 할 일 남아"**
CME 페드워치 기준 12월 25bp 인상 확률은 약 90%, 50bp 인상 확률은 약 11%로 전날과 비슷했다. 미셸 보먼 연준 감독 부의장은 물가 압력이 넓게 퍼지고 있다며 인플레이션을 2% 가까이 낮추려면 아직 할 일이 남았다고 말했다. 골드만삭스는 12월에 이어 내년 3월 추가 인상을 예상했다. 10월 소매판매 모니터(전미소매협회 집계)는 전월 대비 +0.2%(전년 대비 +3.6%)로 2025년 11월 이후 가장 느렸다. 다음 연방공개시장위원회는 12월 8~9일이다.

**③ 미국채 — 재향군인의 날 휴장, 2년물 4.73%·10년물 4.98%·30년물 5.35% 유지**
채권시장은 재향군인의 날로 휴장해 미 재무부 고시가 없었다. 표에는 직전 고시치(2년물 4.73%, 10년물 4.98%, 30년물 5.35%)를 그대로 두었다. 야후 호가 기준 10년물은 4.998%, 30년물은 5.356%로 5% 선 부근에 머물렀다. 전날 2년물은 하루 17bp 뛰어 19개월 만에 가장 큰 폭으로 올랐다.

**④ WTI \$86.35(+0.36%)·브렌트 \$92.50(+1.10%) — 호르무즈 해협 유조선 기뢰 피격 보도에 소폭 반등**
WTI 12월물은 장중 \$88.74까지 오른 뒤 **\$86.35(+\$0.31, +0.36%)**, 브렌트 1월물은 **\$92.50(+\$1.01, +1.10%)**로 마감했다. 이란군이 호르무즈 해협에서 유조선이 기뢰에 맞아 불이 났다고 밝히며 장 초반 유가가 올랐지만, 중간선거 이후 이어진 하락 흐름을 뒤집지는 못했다. 금 선물은 \$4,000 아래로 1% 가까이 밀렸고, 비트코인은 \$74,000대로 1% 남짓 올랐다.

**⑤ AI·반도체 — SOX 10,564.11(+5.66%), 마이크론 \$811.30(+11.89%)·샌디스크 +13.69%, 엔비디아 \$173.73(+2.87%)**

**⑥ 🇰🇷 SK하이닉스 ADR \$142.25(+9.71%)·코스피200 야간선물 852.95(+1.96%) — 메모리 급반등**

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 코어위브 (CRWV) +24.71% — 3분기 매출 \$36억6,000만, 2026년 매출 전망 \$130억~133억으로 상향**
코어위브는 \$55.97에서 출발해 고가 \$62.03(+27.28%)까지 오른 뒤 \$60.77(+\$12.04, +24.71%)로 마감했다. 3분기 매출은 \$36억6,000만으로 1년 전 \$13억7,000만에서 두 배 넘게 늘었고, 순손실은 \$7억900만(주당 \$1.27)으로 커졌다. 2026년 매출 전망은 \$124억~132억에서 \$130억~133억으로 올려 LSEG 컨센서스(\$128억6,000만)를 넘었고, 조정 영업이익 전망 \$12억7,500만~13억7,500만도 예상(\$10억7,000만)을 웃돌았다. 앞으로 석 달간 고객 선수금·예치금 약 \$90억을 받고 2027년까지 고금리 차입을 더 하지 않겠다고 밝혔다. 직전 한 달 새 40% 넘게 빠졌던 터라 반등 폭이 컸다.

**2. 엔비디아 (NVDA) +2.87% — 사흘 만에 반등했지만 베어드 '중립' 하향·모건스탠리 최선호주 제외**
