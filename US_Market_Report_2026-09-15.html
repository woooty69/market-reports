## 🗓 시장 요약

**① "AI 속도를 늦추자"는 3사 CEO의 합창이 월요일 첫 거래에서 반도체 5.9% 급락으로 가격이 매겨졌다 — 지수는 버텼고, 칩은 무너졌다**
다리오 아모데이 앤트로픽 CEO가 9/12 올린 에세이 「We Must Pace the Frontier」에 샘 올트먼과 일론 머스크가 동의를 표하고, 올트먼이 월요일 새벽 X에 "우리는 통제를 잃을 수 있다"고 다시 쓴 것이 이날 장의 출발점이었다. 필라델피아 반도체지수(SOX)는 **11,131.30(−5.86%)**으로 마감해 하루 낙폭이 8/18(−4.98%) 이후 최대였고, 엔비디아(NVDA) −3.36%, 브로드컴(AVGO) −4.77%, AMD(AMD) −4.40%, 인텔(INTC) −5.59%, 마이크론(MU) −5.25%, 램리서치(LRCX) −8.29%, 어플라이드머티리얼즈(AMAT) −7.07%, 테라다인(TER) −13.30%였다. 반면 나스닥 −0.56%, S&P500 −0.48%, 다우 −0.29%로 지수 낙폭은 제한됐는데, S&P500 구성종목 중 상승 종목이 하락 종목보다 많았고 서비스나우(NOW) +7.41%, 오토데스크(ADSK) +7.78%, 어도비(ADBE) +5.30%, 세일즈포스(CRM) +4.73%, 알파벳(GOOGL) +3.22%, 메타(META) +2.71%, 마이크로소프트(MSFT) +1.97%가 받쳤기 때문이다(CNBC·포천·TheStreet). 포천은 이를 "AI 종말론 트레이드"라 불렀다 — 데이터센터 자본지출의 수혜자(칩·장비·광통신·전력기기)를 팔고, 그 지출이 줄어도 손해가 적은 소프트웨어·하이퍼스케일러를 사는 순환이다. 해석하면 시장은 'AI 투자 중단'이 아니라 'AI 투자의 승자 재선별'로 받아들였고, 트럼프 대통령이 트루스소셜에서 "AI에 필요한 유일한 가드레일은 강하고 똑똑한 대통령"이라며 아모데이를 이름으로 공격하고 "데이터센터에 대한 역겨운 음모"라고 한 것도 반도체 반등에는 도움이 되지 않았다(로이터·UPI). 뱅크오브아메리카는 "AI 캐펙스가 10년 말까지 3배인 3조 달러 이상으로 늘어나는 구조적 시장 앞에서 이번 논란은 노이즈"라고 썼다.

**② 10년물이 장중 5.014%로 2023년 10월 이후 첫 5% 터치 — 인상은 89%로 가격에 들어갔고, 문제는 인상 '이후'다**
미 10년물 금리는 장중 **5.014%**까지 올라 2023년 10월 이후 처음으로 5%를 넘겼다가 4.987%(+1.8bp)로 마감했고, 2년물은 4.658%(+2.8bp)로 2024년 7월 이후 최고 부근에 머물렀다. 30년물은 5.33%로 소폭 내렸다(CNBC·UPI). 촉매는 유가였다 — 사우디 동서 송유관 폐쇄와 후티의 바브엘만데브 페림섬 장악으로 브렌트가 장중 \$108을 넘었고, 이는 8월 근원 CPI 3.4%와 겹쳐 9/16(현지) FOMC 0.25%p 인상 확률을 CME 기준 **89%**까지 밀어 올렸다. 다만 트럼프가 러시아·우크라이나의 에너지 시설 공격 중단을 시사하자 휘발유·경유 도매가가 내리면서 금리가 5% 아래로 되돌아왔고, 이것이 주가 낙폭 축소의 직접 원인이었다(CNBC). 프리덤캐피털의 제이 우즈는 "데이터와 시장 기대를 보면 인상이 더 깔끔한 결정이고, 시장은 이미 이를 반영해 인상에 오히려 반등할 수 있다. 동결은 연준이 뒤처졌다는 신호로 읽혀 부정적 반응을 부를 수 있다"고 했다. 씨티는 반대로 "인상은 주식시장에 충격을 줄 수 있다"고 경고했다(TheStreet). 한지영 키움증권 연구원은 "장 초반 낙폭을 상당 부분 만회했다는 점에서 연준의 연속 인상 가능성에 대한 우려가 제한적이라는 것이 확인됐다"고 해석했다.

**③ 유가 — 사우디의 우회로가 막히고 후티가 홍해 입구를 잡았다**
WTI 10월물은 **\$101.39(+1.34%)**, 브렌트 11월물은 \$105.68(+1.02%)로 마감했다(연합·뉴스핌·이투데이). 장중에는 WTI \$102.30·브렌트 \$107.30까지 올랐다가 상승폭을 반납했다. 배경은 세 가지다. ①사우디가 이라크발 드론 공격을 이유로 하루 400만~500만 배럴을 실어 나르던 동서 송유관(1,200km, 호르무즈 우회의 핵심)을 예방 차원에서 닫았고(알자지라·NBC), ②후티가 바브엘만데브 해협 입구의 페림(마윤)섬과 하니시 제도를 장악해 홍해 출구까지 위협하게 됐으며(로이터·AP), ③9/14 오만 살랄라에서 열릴 예정이던 이란·걸프국 호르무즈 통항 회의가 전날 밤 연기됐다. 후티는 사우디 카미스무샤이트의 킹칼리드 공군기지에 탄도미사일·드론 공격을 했다고 주장했다. 캐피털닷컴의 다니엘라 해손은 "유가는 다시 가장 큰 지정학 이야기가 됐고, 유가 충격이 금리 이야기로 직결되고 있다"고 했다. 트럼프는 갤런당 6달러를 넘은 미국 경유가격을 두고 "중동이 아니라 러시아·우크라이나 전쟁 때문"이라며 우크라이나에 러시아 정유시설 공격 중단을 요구했다(중앙일보). 에너지주는 갈렸다 — 슐럼버제(SLB) −4.89%, 베이커휴즈(BKR) −3.86% 등 유전서비스는 밀렸고 EOG(EOG) +0.80%, 옥시덴탈(OXY) +0.52%는 올랐다.

**④ 은행이 조용히 무너졌다 — 모이니핸의 "IB 수수료 10% 이상 감소"가 골드만·모건스탠리까지 끌어내렸다**
브라이언 모이니핸 뱅크오브아메리카 CEO가 바클레이즈 금융 컨퍼런스에서 3분기 투자은행 수수료가 전년 대비 **10% 이상 감소해 16억~18억 달러**(컨센서스 약 20억 달러)가 될 것이며 트레이딩 수익은 "대체로 보합"이라고 밝히자 뱅크오브아메리카(BAC)는 **−5.14%(\$59.47)**로 급락했다(CNBC·블룸버그). 2분기에 트레이딩 +33%, IB 수수료 +50%를 기록했던 것과 대비된다. 모이니핸은 "회사 문제가 아니라 IB 시장 전체가 10% 정도 줄었다"고 했지만 시장은 이를 업계 전체로 읽어 골드만삭스(GS) −3.96%, 모건스탠리(MS) −3.64%, 노던트러스트(NTRS) −3.95%, 스테이트스트리트(STT) −2.71%, JP모건(JPM) −1.71%, 씨티(C) −1.90%가 동반 하락했다. 베선트 재무장관이 예고한 '대이란 조력 대형 은행 제재'는 이날 발표되지 않았고, 은행주 낙폭은 제재 우려보다 수수료 가이던스로 설명된다. 해석은 두 갈래다 — 10년물 5%가 딜과 IPO 시장을 식히기 시작했다는 신호이거나, 2분기의 SpaceX IPO 특수가 빠진 기저효과이거나. 어느 쪽이든 '금리 상승 = 은행 수혜'라는 단순 도식이 이날은 작동하지 않았다.

**⑤ 반대편에서는 사이버보안이 'AI 위험 헤지'로 폭등했고, 코닝의 20억 달러 증자가 광통신 체인을 끌어내렸다**
크라우드스트라이크(CRWD) **+13.85%**, 팔로알토네트웍스(PANW) **+13.09%**, 포티넷(FTNT) +9.04%, 지스케일러·센티넬원·옥타도 두 자릿수 강세였다. 조지 커츠 크라우드스트라이크 CEO가 주말에 아모데이에게 "프런티어 랩은 어차피 개발을 멈추지 않는다, 보안 산업의 역할은 그 개발을 더 안전하게 만드는 것"이라 답한 것이 트리거였고, 짐 크레이머가 "반드시 보유해야 할 종목"이라 부르며 불을 붙였다(포브스·모틀리풀). 팔로알토는 여기에 회계연도 4분기 실적(조정 EPS \$1.02 vs 예상 \$0.98, 매출 \$34.1억 vs \$33.5억, 차세대보안 ARR \$91억·+63%)이 겹쳤다. 반대로 코닝(GLW)은 골드만삭스와 최대 **20억 달러** ATM(시장가 분할매각) 증자 계약을 공시해 **−13.70%**로 S&P500 최하위였고, 광통신 동료인 코히런트(COHR) −12.73%, 루멘텀(LITE) −9.92%, 시에나(CIEN) −8.55%가 함께 밀렸다(시킹알파·24/7월스트리트). AI 전력 체인도 마찬가지로 GE버노바(GEV) −8.62%(GLJ리서치 매도·목표가 \$470 개시), 이튼(ETN) −7.57%, 버티브(VRT) −7.65%, 컴포트시스템즈(FIX) −6.39%, 콘스텔레이션에너지(CEG) −7.09%, 비스트라(VST) −5.16%였다. 즉 이날 팔린 것은 '칩'만이 아니라 광섬유·전력·냉각·데이터센터 리츠(디지털리얼티 DLR −5.01%, 에퀴닉스 EQIX −3.76%)까지 AI 캐펙스에 매출이 묶인 모든 것이었다.

**⑥ 🇰🇷 한국은 미국보다 먼저, 더 크게 팔았다 — 코스피 −3.26%, 외국인 3.3조 순매도, SK하이닉스 ADR 괴리율은 +41.2%→+39.4%**
같은 재료를 한국 정규장이 하루 먼저 소화했다. 코스피는 **6,684.37(−3.26%)**, 코스닥 806.79(−1.69%)로 마감했고 외국인 **−3조 2,875억원**, 기관 −1조 1,715억원, 개인 +2조 9,722억원이었다(한국거래소·EBN). 삼성전자(005930) 249,000원(−4.05%), SK하이닉스(000660) **1,697,000원(−6.35%)**, SK스퀘어(402340) −8.17%였고, 넥스트레이드 오후 8시 연장거래(이날 첫 시행) 통합가로는 SK하이닉스가 1,683,000원(−7.12%)까지 밀렸다. 그 뒤 미국에서 SKHY가 **\$175.63(−7.60%)**로 떨어져 괴리율은 9/11 +41.2%에서 **+39.4%**로 1.8%p 축소됐는데, 축소 원인은 국내 하락(−6.35%)보다 ADR 하락(−7.60%)이 컸기 때문이다. 코스피200 야간선물은 1,043.00(−0.52%)으로 정규장 선물 종가(1,048.40)보다 5.40포인트 아래, 고가 1,045.20·저가 1,038.30의 좁은 폭에서 끝나 미국 SOX −5.86%를 야간이 추가 반영하지 않았다 — 국내 정규장이 이미 그만큼 선반영했다는 뜻이다. 아주경제에 따르면 9/15 08:21 넥스트레이드 프리마켓에서 삼성전자 −0.40%, SK하이닉스 −0.53%로 낙폭이 제한적이었다. 한지영 키움증권 연구원은 "오늘 국내 증시는 전일 선반영 인식과 미국 증시의 장중 낙폭 축소에 힘입어 전일 급락분을 만회해 나갈 것"이라며 "AI 개발 중단이 아니고 AI 투자 축소나 메모리 수요 둔화 신호도 아직 없다 — 추격 매도의 실익은 크지 않다"고 했다. 한편 로이터는 삼성전자·SK하이닉스가 한국전력의 반도체 클러스터 전력공급용 25조원(187억 달러) 선납 제안을 거부했다고 보도했고, BofA는 SKHY 목표주가를 \$250→**\$268**로 올렸다.

## 1. 업종별 흐름

**상승 업종 3**

**🇰🇷 [전달]** 이번 회차는 '미국→한국' 전달이 아니라 '한국→미국' 순서였다. 코스피가 9/14 정규장에서 −3.26%(외국인 −3조 2,875억원)로 먼저 떨어졌고, 미국 SOX −5.86%·SKHY −7.60%는 그 뒤에 나왔다. 코스피200 야간선물 1,043.00(−0.52%)이 정규장 종가 대비 0.5%만 추가로 내린 것, 9/15 08:21 넥스트레이드 프리마켓에서 삼성전자 −0.40%·SK하이닉스 −0.53%에 그친 것이 '선반영' 판단의 근거다. SKHY 괴리율은 +41.2%→**+39.4%**로 축소됐고 원인은 ADR 하락폭(−7.60%)이 국내 하락폭(−6.35%)보다 컸기 때문이다 — 프리미엄 축소는 국내가 오른 결과가 아니라 ADR이 더 빠진 결과라 국내 반등 여지를 넓히지는 않는다. 업종 매핑으로는 램리서치·어플라이드 −7~8%가 국내 장비주(원익IPS(240810)·주성엔지니어링(036930)·유진테크(084370)·피에스케이홀딩스(031980) — SOX 갭베타 1.0~1.35)에 가장 직접적이고, 코닝·코히런트 −13%는 광통신(이수페타시스(007660)·대덕전자(353200) 기판 포함)에, 이튼·GE버노바 −8%는 전력기기(HD현대일렉트릭(267260)·LS일렉트릭(010120)·효성중공업(298040))에 부담이다. 반대로 미국 소프트웨어·보안 강세는 국내에 직접 대응 종목이 적다. 원/달러 1,347.3원(+1.4원)은 변화가 작다.

**🇰🇷 [수급]** SK하이닉스(000660) 외국인은 9/10 −956,724주 → 9/11 −606,502주 → 9/14 **−1,215,512주**로 매도가 다시 가속했고, 기관도 9/11 −274,533주 → 9/14 −266,205주로 이틀 연속 순매도, 개인이 +906,398주를 받았다. 외국인 지분율은 50.47%→**50.30%**. 거래대금 10조 2,977억원(넥스트레이드 통합)은 평소의 2~3배다. 코스피 전체로도 외국인 −3조 2,875억원은 9/10(−2조 7,140억)·9/11(−2조 2,915억)보다 큰 사흘 연속 최대치이고, 프로그램 비차익 −2조 7,096억원이 이를 주도했다 — 개별 종목 판단이 아니라 바스켓 매도였다는 뜻이다. 매도 감속 신호(f_decel 0 근접)는 아직 없고, 기관 전환도 없다. 확인할 것은 9/15 외국인이 나흘째 매도인지, 그리고 프로그램 매도가 멈추는지다. 9/15~16 SK하이닉스 임단협 재투표 결과도 같은 이틀에 겹친다.

**시장의 시선** — 이날의 핵심 질문은 "AI 속도 조절이 실제 캐펙스를 줄이는가"인데, 시장은 아직 답을 모른 채 '캐펙스 수혜 밀도'가 높은 순서로 팔았다. 지수는 소프트웨어·방어주가 받쳐 −0.5%에 그쳤지만, 러셀2000 −0.25%·상승 종목 우위라는 겉모습과 달리 SOX −5.9%·은행 −4~5%·AI 전력 −8%는 성장 축 세 개가 동시에 흔들린 하루였다. 9/17 03:00 FOMC 결과와 점도표, 그리고 케빈 워시 의장 회견이 나오기 전까지 반도체 저가매수의 근거는 '재고 10일 미만'이라는 펀더멘털뿐이고, 그 펀더멘털이 통하려면 10년물이 5% 아래에 머물러야 한다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) −3.36% — \$210.94, 아모데이·올트먼·머스크 "속도 늦추자"에 AI 칩 선두주가 하루 1,000억 달러 넘게 시총 증발**
다리오 아모데이 앤트로픽 CEO의 9/12 에세이 「We Must Pace the Frontier」는 프런티어 모델의 성능 향상 속도를 의도적으로 늦추고, 외부 감시자에게 개발 중 모델 접근권을 주며, 산업 전체·국제 규제를 도입하자는 3단계 계획을 담았다. 샘 올트먼이 "동의한다"고 답한 데 이어 월요일 새벽 X에 "우리는 통제를 잃을 수 있다… 정렬·안전 기법이 성능 진보보다 앞서야 한다"고 썼고, 머스크는 "다리오가 옳다"고 했다(CNBC·포천). 엔비디아는 프리마켓 −3%에서 시작해 장중 낙폭을 줄였으나 거래량 1억 940만 주로 마감했고, 브로드컴 −4.77%·AMD −4.40%가 동반 하락했다. 트럼프 대통령은 트루스소셜에 "AI에 필요한 가드레일은 강하고 똑똑한(높은 IQ!) 대통령뿐"이라며 "데이터센터에 대한 역겨운 음모가 진행 중이고 이를 반기는 것은 중국뿐"이라고 썼다. BofA의 비벡 아리아는 "AI 캐펙스가 10년 말까지 3배인 3조 달러 이상으로 가는 구조 앞에서 이번 사건은 노이즈"라며 반도체 강세 의견을 유지했고, 짐 크레이머는 "속도를 늦추면 엔비디아 수요가 줄어드는가"라며 선언문의 실효성에 의문을 제기했다(Quartz).

**2. SK하이닉스 ADR (SKHY) −7.60% — \$175.63 (괴리율: +39.4%), BofA 목표주가 \$268 상향과 한전 25조 선납 거부 보도 속 메모리 3사 급락 선두**
SK하이닉스 ADR은 시가 \$174.93·저가 \$174.59·고가 \$179.90을 오간 뒤 \$175.63로 마감해 마이크론(MU) −5.25%(\$924.03)·샌디스크(SNDK) −4.98%(\$1,551.99)보다 낙폭이 컸고, 거래량 2,070만 주로 상장 이후 상위권이었다(stockanalysis·TipRanks). 인베즈는 "가속기 배치가 예상보다 오래 둔화되면 HBM 수요가 실질적으로 줄고 가격 인상이 멈출 수 있다"는 것이 약세 논리이지만 "KB증권 추정 삼성전자·SK하이닉스 완제품 재고 10일 미만이라는 현실과 충돌한다"고 짚었다. 같은 날 BofA 사이먼 우는 목표주가를 \$250에서 **\$268**로 올리고 매수를 유지하며 3분기부터 연환산 300조원 이상의 영업이익 런레이트를 전망했다. 로이터는 삼성전자와 SK하이닉스가 한국전력의 반도체 클러스터 전력 인프라용 **25조원(187억 달러) 선납** 제안을 거부했다고 문서를 인용해 보도했다. 시간외에서는 \$176.50(+0.50%)으로 소폭 반등했다.

**3. 크라우드스트라이크 (CRWD) +13.85% — \$235.38, 커츠 CEO "AI 개발은 멈추지 않는다, 보안이 그것을 안전하게 만든다"에 사이버보안 전 종목 폭등**
조지 커츠 CEO는 주말 아모데이의 에세이에 답해 "프런티어 랩들은 개별 회사의 결정과 무관하게 개발을 계속할 것이고, 사이버보안 산업의 역할은 그 개발을 더 안전하게 만드는 것"이라며 AI가 가능케 할 '기계 속도(machine-speed)' 사이버 공격이 보안 지출을 구조적으로 늘릴 것이라고 전망했다. 프리마켓 +5.35%로 시작한 주가는 짐 크레이머가 CNBC에서 "반드시 보유해야 할 종목"이라 부른 뒤 장중 +10.45%를 거쳐 +13.85%로 마감했고, 거래량 2,466만 주였다(포브스·모틀리풀·TheStreet). 지스케일러(ZS)·센티넬원(S)·옥타(OKTA)·체크포인트(CHKP)·퀄리스(QLYS)가 동반 두 자릿수 강세를 보여 사이버보안이 이날 'AI 위험 헤지' 자산으로 재평가됐다. TheStreet는 "컴퓨트가 가라앉는 동안 소프트웨어와 사이버보안이 오른다"며 핀비즈 테마맵에서 보안이 가장 짙은 녹색이었다고 전했다.

**4. 뱅크오브아메리카 (BAC) −5.14% — \$59.47, 모이니핸 "3분기 IB 수수료 10% 이상 감소·트레이딩 보합"에 대형 은행 동반 급락**
브라이언 모이니핸 CEO는 바클레이즈 글로벌 금융서비스 컨퍼런스에서 3분기 투자은행 수수료가 전년 대비 10% 이상 줄어 **16억~18억 달러**가 될 것이라고 밝혔고, 이는 애널리스트 예상치 약 20억 달러를 크게 밑돈다. 트레이딩 수익은 "대체로 보합"이라 했는데, 2분기에는 트레이딩 +33%·IB 수수료 +50%였다(CNBC·블룸버그·마켓스크리너). 그는 "우리만의 문제가 아니라 IB 시장 전체가 10% 정도 줄었다"고 했고, 시장은 이를 그대로 받아들여 골드만삭스(GS) −3.96%, 모건스탠리(MS) −3.64%, 씨티(C) −1.90%, 웰스파고(WFC) −1.75%, JP모건(JPM) −1.71%가 함께 밀렸다(모틀리풀·벤징가). 베선트 재무장관이 예고했던 '대이란 조력 대형 은행 제재'는 이날 발표되지 않아 은행주 낙폭은 제재보다 가이던스로 설명된다.

**5. 팔로알토 네트웍스 (PANW) +13.09% — \$373.94, 회계연도 4분기 EPS \$1.02(예상 \$0.98)·NGS ARR \$91억(+63%)에 보안 순환매가 겹쳐 실적 발표 후 낙폭을 하루에 회복**
팔로알토는 회계연도 4분기 조정 EPS **\$1.02**(컨센서스 \$0.98), 매출 **\$34.1억**(컨센서스 \$33.5억, +1.8% 상회), 차세대보안(NGS) ARR \$91억(전년 대비 +63%), 잔여이행의무(RPO) \$212억으로 처음 200억 달러를 넘겼다. 회계연도 2027년 가이던스는 매출 \$141억~\$142억, NGS ARR \$110.75억~\$111.75억이다(회사 보도자료·인베스팅닷컴). 실적 발표 직후에는 마진과 비용 우려로 정규장 −5.25%·시간외 −1.78%까지 밀렸으나, 이날 크라우드스트라이크발 '보안이 AI 위험 헤지'라는 서사에 실적 서프라이즈가 재조명되며 거래량 1,141만 주로 +13.09%를 기록했다(트레이딩키·24/7월스트리트). 포티넷(FTNT) +9.04%, 젠디지털(GEN) +3.80%도 함께 올랐다.

**6. 코닝 (GLW) −13.70% — \$143.60, 최대 20억 달러 ATM 증자 공시에 S&P500 최하위, 광통신 체인 코히런트·루멘텀·시에나 동반 급락**
코닝은 9/11 금요일 공시로 골드만삭스와 최대 **20억 달러** 규모의 ATM(at-the-market) 주식 분할매각 계약을 체결했다고 밝혔다. 정해진 가격·주식 수 없이 경영진이 시점을 정하는 유연한 구조가 오히려 희석 우려를 키웠고, 올해 91% 오른 주가에 AI 투자 둔화 논쟁까지 겹쳐 프리마켓 −9.16%에서 시작해 장 마감 **−13.70%**, 거래량 1,632만 주로 S&P500 최하위였다(시킹알파·야후파이낸스·24/7월스트리트). 광연결 동료인 코히런트(COHR) −12.73%, 루멘텀(LITE) −9.92%, 시에나(CIEN) −8.55%, 패브리넷 −6%대가 함께 밀렸다. 씨티의 아시야 머천트는 9/8 발표된 버라이즌과의 수십억 달러 광섬유 공급 계약을 근거로 매수·목표주가 \$220을 유지하고 있다.

**7. GE 버노바 (GEV) −8.62% — \$874.85, GLJ리서치 '매도·목표가 \$470' 커버리지 개시 — "경기순환적 터빈 제조사를 구조적 성장주로 오인"**
GLJ리서치의 고든 존슨은 GE버노바 커버리지를 **매도**, 목표주가 **\$470**(현 주가 대비 약 47% 하방)으로 개시하며 "선행 EV/EBITDA 배수가 경기순환적 가스터빈 제조사를 구조적 성장 복리 기업으로 잘못 가격하고 있다"고 썼다(24/7월스트리트·야후파이낸스). AI 데이터센터 전력 수요의 대표 수혜주였던 만큼 아모데이의 속도조절론과 맞물려 낙폭이 커졌고, 모틀리풀은 "규제·감시 강화가 실제 AI 개발 둔화로 이어지면 가장 크게 맞을 종목"이라고 했다. 이튼(ETN) −7.57%, 버티브(VRT) −7.65%, 퀀타서비스(PWR) −4.39%, 컴포트시스템즈(FIX) −6.39%, 제너락(GNRC) −5.35% 등 전력·냉각 체인이 동반 하락했고 콘스텔레이션에너지(CEG) −7.09%, 비스트라(VST) −5.16%, NRG(NRG) −4.40% 등 원전·독립발전사도 밀렸다.

**8. 휴렛팩커드 엔터프라이즈 (HPE) −10.77% — \$55.41, 에버코어 ISI '아웃퍼폼→인라인' 하향 — "6개월 184% 상승, 회계연도 2027 PER 13배로 적정가치 도달"**
에버코어 ISI는 HPE 투자의견을 아웃퍼폼에서 **인라인**으로 낮추고 목표주가 **\$65**는 유지했다. 근거는 최근 5거래일 +15%, 6개월 +184%, 연초 대비 +158.5%(S&P500 +11.9%)의 급등 뒤 회계연도 2027년 예상이익 기준 PER 13배가 5년 평균 8배를 크게 웃돌아 "현 수준에서 적정가치"라는 것이며, 사업 자체의 문제를 지적한 것은 아니다(시킹알파·마켓비트·모틀리풀). 주가는 9/11 종가 \$62.08에서 \$6.68 내린 \$55.41로 마감했고 거래량 2,798만 주였다. 델(DELL) −5.82%, 슈퍼마이크로(SMCI) −8.38%, 넷앱(NTAP) −5.52% 등 AI 서버·스토리지주가 동반 하락했다.

**9. 코인베이스 (COIN) +9.24% — \$191.45, 컴퍼스포인트 '매도→중립' 상향과 9/15 상원 CLARITY법 절차투표 앞두고 크립토주 랠리**
컴퍼스포인트의 에드 엥겔은 상원의 가상자산 시장구조법(CLARITY Act) 본회의 표결을 앞두고 코인베이스를 **매도에서 중립**으로 상향했고, 주가는 오전 +6%(\$185.34)에서 마감 +9.24%까지 올랐다(야후파이낸스·24/7월스트리트). 상원은 공화당 최종 수정안을 공개하고 9/15 오후 2시 15분(현지) 토론종결(cloture) 표결을 잡았는데, 엥겔 본인은 법안이 부결될 가능성을 높게 본다며 "이번 표결이 코인베이스의 이진(binary) 촉매"라고 했다(UPI·코인센트럴). 스트래티지(MSTR)는 +3%대였고 마라(MARA)는 약세였다. 비트코인은 \$78,000대에서 +1.8% 반등했다.

**10. 알파벳 (GOOGL) +3.22% — \$349.39, '캐펙스 수혜자 매도·하이퍼스케일러 매수' 순환의 대표 수혜 — 메타 +2.71%·마이크로소프트 +1.97%와 함께 반도체 낙폭을 상쇄**
포천은 이날의 매매를 "월가의 AI 종말론 트레이드"라 불렀다 — 데이터센터·칩 자본지출로 돈을 버는 기업은 팔리고, 그 지출이 계속되지 않아도 손실이 적은 기업이 매수됐으며 알파벳·마이크로소프트·메타가 후자에 있었다(포천·24/7월스트리트). 검색 광고·클라우드에서 매출을 내는 알파벳은 거래량 3,254만 주로 +3.22%, 메타(META)는 \$665.60(+2.71%), 마이크로소프트(MSFT)는 \$505.41(+1.97%)로 마감했고, 이 세 종목의 상승이 나스닥 낙폭을 −0.56%로 제한한 직접 원인이었다. 반면 오라클(ORCL)은 −3.65%(\$144.79)로 하이퍼스케일러 중 유일하게 밀렸는데, 클라우드 인프라 투자 부담이 큰 쪽으로 분류된 결과다. 애플(AAPL)은 +0.24%로 중립, 아마존(AMZN)은 −1.26%였다. 넷플릭스(NFLX) +3.77%, 폭스(FOX) +4.60%, 트레이드데스크(TTD) +4.39% 등 미디어·광고주도 강세였다.

### 🇰🇷 한국 개장 관전 포인트
- **선반영의 검증.** 코스피 −3.26%(9/14)가 미국 SOX −5.86%를 미리 소화한 것이라면, 야간선물 −0.52%·프리마켓 삼성전자 −0.40%·SK하이닉스 −0.53%처럼 낙폭이 제한되고 장중 만회가 나와야 한다. 반대로 개장 직후 외국인 프로그램 매도가 다시 2조원대로 나오면 '선반영'이 아니라 '추가 하락의 첫 단계'였던 것이다. 6,600선(9/14 장중 저가 6,654.82) 지지 여부가 첫 관문이다.
- **반도체 내부 차별화.** 미국에서 장비주(램리서치·어플라이드 −7~8%)가 설계·메모리주(엔비디아 −3.4%·마이크론 −5.3%)보다 더 빠졌다. 국내에서도 원익IPS(240810)·주성엔지니어링(036930)·유진테크(084370) 등 장비주가 삼성전자·SK하이닉스보다 낙폭이 커지는지, 반대로 KB증권이 지적한 '재고 10일 미만'을 근거로 메모리 본주에 저가매수가 들어오는지가 갈림길이다.
- **SKHY 괴리율 +39.4%.** 9/4 +45.1% → 9/11 +41.2% → 9/14 +39.4%로 3회 연속 축소됐지만 이번 축소는 ADR이 더 빠진 결과다. 국내가 오늘 반등하면 괴리는 다시 넓어지고, 국내가 추가 하락하면 좁아진다 — 괴리율 축소 자체를 '국내 저평가 해소'로 읽지 말 것.
- **은행·보험·지주.** 키움증권이 분산 대안으로 꼽은 주주환원 업종은 9/14에도 KB금융(105560) +2.08%, 신한지주(055550) +1.51%, 한화에어로스페이스(012450) +4.90%로 역행했다. 다만 미국 은행이 BofA 가이던스로 −4~5% 밀린 것이 국내 은행 심리에 어떻게 전이되는지 확인 필요 — 국내 은행의 논리는 IB 수수료가 아니라 배당·자사주라 직접 연동은 약하다.
- **유가·환율.** WTI \$101.39·브렌트 \$105.68에 사우디 송유관 폐쇄·후티 홍해 장악이 겹쳐 정유·항공·화학의 비용 변수는 그대로다. 원/달러 1,347.3원은 변화가 작아 외국인 환차익 동기는 유지된다.
- **SK하이닉스 임단협 재투표(9/15~16).** 1차 부결이 25표 차였고, 수정안은 성과급의 현금 50%·주식 50%(주식 비중 최대 100% 선택)다. 회사 보유 자사주가 임직원에게 넘어가는 구조라 결과에 따라 유통주식 증가 해석이 붙을 수 있다.
