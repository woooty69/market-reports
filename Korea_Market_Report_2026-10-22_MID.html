*전날 3.29% 반등해 5,735.66으로 마친 코스피는 5,670.11(−1.14%)로 약세 출발한 뒤 장중 5,740.28까지 올라 보합권을 회복했으나, 한국은행의 '매파적 동결' 소식 이후 반도체 대형주가 되밀리며 5,591.01까지 낙폭을 넓혔다. 11시 56분 현재 5,605.51(−2.27%)로 5,600선을 간신히 지키고 있다. 외국인은 +463억원으로 매수 규모를 크게 줄였고 기관이 2,220억원을 팔았다. 삼성전자(−3.24%)·SK하이닉스(−3.63%)·SK스퀘어(−2.82%)가 지수를 끌어내렸고, 3분기 깜짝 실적과 7,800억원 자사주 매입을 발표한 삼성E&A(+17.19%)가 건설 업종(+5.67%)을 홀로 끌어올렸다. 석유와가스(−4.05%)·전기제품(−3.57%)·반도체와반도체장비(−3.29%, 상승 24/하락 145)·화학(−3.25%)이 약하다. 코스닥은 777.18(−1.97%)로 외국인이 2,020억원을 순매도했다.*

## 🗓 시장 요약

**① 하루 만에 다시 2%대 하락, 한은 '매파적 동결'에 낙폭 확대.** 전날 4% 가까이 급반등했던 코스피가 차익실현에 5,670.11로 출발했고, 장중 5,740.28까지 회복했다가 한국은행이 기준금리를 동결하면서도 추가 인상 가능성을 열어 둔 '매파적 동결'로 해석되자 5,591.01까지 밀렸다. 11시 56분 현재 5,605.51(−130.15p)이며, 외국인 순매수가 +463억원으로 줄고 기관이 2,220억원을 팔고 있다. 코스피200 선물도 870.80(−2.49%)으로 현물과 비슷하게 약하다.

**② 삼성전자·SK하이닉스 3%대 되돌림, 솔리다임 규제 발언도 부담.** 삼성전자는 216,250원(−3.24%)으로 거래대금 1조 1,753억원, SK하이닉스는 1,247,000원(−3.63%)으로 거래대금 1조 3,849억원이다. 국정감사에서 이억원 금융위원장이 솔리다임 상장을 "중복상장 규제 대상"이라고 밝히면서 SK하이닉스·SK스퀘어(−2.82%)·SK(−2.39%)에 부담이 됐다. 램리서치가 가이던스 실망으로 시간외 −7%를 기록한 여파로 주성엔지니어링(−7.71%)·원익IPS(−4.68%) 등 장비주 낙폭이 더 크다.

**③ 삼성E&A 17% 급등에 건설 질주, 2차전지·정유는 급락.** 삼성E&A는 3분기 영업이익 5,006억원(+184%)과 6,900억원 자사주 소각·배당 재개를 발표하며 55,900원(+17.19%)으로 뛰었고 현대건설(+2.27%)도 동반 강세다. 반면 CATL 급락 여파로 에코프로비엠(−7.82%)·포스코퓨처엠(−4.98%)·삼성SDI(−4.51%)가 약하고, SK이노베이션(−6.55%)·S-Oil(−5.00%) 등 정유주도 크게 밀렸다.

**④ 원/달러 1,324원대 하락, 아시아 증시·미국 선물 동반 약세.** 원/달러는 1,324.30원(−3.20원)으로 원화가 소폭 강세다. 닛케이225는 63,917.43(−1.09%)으로 오전장을 마쳤고 항셍은 23,037.01(−2.60%)로 낙폭이 크며, 나스닥100 선물도 −1.16%로 밀려 아시아 전반에 위험 회피 심리가 퍼졌다.

## 1. 업종별 흐름

**상승 업종** — 건설(+5.67%, 상승 39/하락 26)이 삼성E&A(+17.19%)의 3분기 깜짝 실적과 주주환원 확대에 힘입어 가장 강하고, 현대건설(+2.27%)·삼성물산(+0.86%)이 뒤를 받친다. IT서비스(+1.99%)는 삼성에스디에스(+4.47%)와 금융권 해킹 이후 보안 투자 기대가 붙은 라온시큐어(+2.85%)가, 손해보험(+1.31%)은 삼성화재(+1.50%)가 이끌었다. 우주항공과국방(+0.36%)도 한화에어로스페이스(+1.11%)·한화시스템(+2.02%) 강세로 소폭 오르고 있다.

**하락 업종** — 석유와가스(−4.05%)는 SK이노베이션(−6.55%)·S-Oil(−5.00%)이, 전기제품(−3.57%, 상승 9/하락 55)은 삼성SDI(−4.51%)·LG에너지솔루션(−2.92%) 등 2차전지가 끌어내렸다. 반도체와반도체장비(−3.29%)는 하락 종목이 145개로 상승(24개)의 6배이며, 화학(−3.25%)·철강(−2.44%)·생물공학(−2.25%)도 약하다.

**시장의 시선** — 오후장은 코스피 5,600선 지지와 외국인 매수 지속 여부가 관건이다. 한은 총재 기자간담회의 추가 인상 시사 강도, 솔리다임 중복상장 규제 논의, 오늘 밤 미국 빅테크 실적 발표가 다음 변수이며, 3분기 실적을 낸 종목 간 차별화가 이어질 가능성이 크다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 37종목

**1. SK하이닉스 (000660) 1,247,000원 · 910조 9,240억원 · −3.63% — 솔리다임 '중복상장 규제 대상' 발언에 3%대 되돌림**
전날 6% 넘게 반등했던 SK하이닉스가 하루 만에 3.63% 밀렸고 거래대금은 1조 3,849억원으로 시장 1위다. 이억원 금융위원장이 국정감사에서 솔리다임 상장을 "중복상장 규제 대상"이라고 밝히고 SK스퀘어·SK하이닉스에 주주충실 의무를 언급하면서 국회 특위·정무위의 규제 입법 움직임도 부각됐다. 한편 8월에 빠져나갔던 반도체 큰손 자금이 3조원 규모로 돌아왔다는 분석과 함께, 회사는 '반도체의 날'에 동탑산업훈장 등 5관왕에 올랐다. [리포트: Hanwha 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261020_Hanwha_2653114.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf)

**2. 삼성전자 (005930) 216,250원 · 1,264조 2,577억원 · −3.24% — 한은 매파적 동결에 반도체 차익실현**
삼성전자는 216,250원대에서 3.24% 하락하며 거래대금 1조 1,753억원을 기록하고 있다. 한국은행의 '매파적 동결' 이후 외국인 매수 강도가 줄면서 전날 6.86% 급등분 일부를 반납했다. 한화투자증권은 2027년 코스피 목표 8,500pt를 제시하며 "6천 아래에서는 무조건 사라"고 했고, 대신증권은 스페이스X·슈퍼마이크로 실적으로 AI 수요가 확인돼 반도체 투자심리가 개선됐다고 짚었다. 우선주 삼성전자우도 −1.57%다. [리포트: KB 2026-10-22](https://woooty69.github.io/hw-pdf-arch-033/%EC%9A%B0%EB%A0%A4%EC%9D%98%20%EC%A0%95%EC%A0%90%20%ED%86%B5%EA%B3%BC%2C%20W%EC%9E%90%20%EB%B0%98%EB%93%B1%EC%97%90%20%EC%A3%BC%EB%AA%A9%EF%BC%BB005930%EF%BC%BD_20261022_KB_4015227430.pdf) · [리포트: KB 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261020_KB_4010450923.pdf) · [리포트: KB 2026-10-15](https://woooty69.github.io/hw-pdf-arch-026/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261015_KB_1138464.pdf)

**3. 삼성전기 (009150) 1,168,000원 · 87조 2,422억원 · +0.00% — AI 기판 협력 기대에 거래대금 3위, 약세장 속 보합**
반도체 대형주가 3%대 하락하는 가운데 삼성전기는 보합을 지키며 거래대금 5,939억원으로 시장 3위에 올랐다. 장 초반 AI 기판 협력 소식이 전해지며 관련 기판주(코리아써키트 +3.61%·대덕전자)까지 들썩였고, 회사는 온실가스 34만톤 감축으로 친환경·ESG 경영 대통령 표창을 받았다. 전날 3,605억원 규모 패키지기판 공급계약 이후 BT기판 쇼티지 리포트가 잇따른 점도 하방을 받치고 있다. [리포트: iM 2026-10-22](https://woooty69.github.io/hw-pdf-arch-033/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261022_iM_4098114982.pdf) · [리포트: iM 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261020_iM_196857.pdf) · [리포트: Mirae Asset 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261020_Mirae%2BAsset_4042147914.pdf)

**4. SK스퀘어 (402340) 757,000원 · 99조 8,665억원 · −2.82% — 솔리다임 상장 규제 논의의 직접 영향권**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀

//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀

;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }

      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }

  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }

  document.addEventListener("click", function (e) {

  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })

  var first = true

  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
