# 🌍 이란·우크라이나 지정학 일간
### 2026년 10월 3일(토) 15:30 작성(지연 발행) · 수집 구간: 직전 24～30시간

## 핵심 3줄
- 러, 키이우 드니프로 교량 사흘째 타격…북부교 차로 폐쇄, 남부교는 전면 통제 [A]
- 호르무즈서 유조선 또 피격…이란 PGSA "비준수 목록 선박", 책임은 언급 안 해 [B]
- G7 비축유 1억 배럴 4개월 방출 합의, 브렌트 102달러대 보합 [A]

## 1. 우크라이나·러시아 전황

### 전선
- ISW(10/2 평가): 10월 2일 양측 모두 확인된 영토 변화 없음. 푸틴이 주장한 9월 전과는 "현실과 동떨어진 수준"이라고 평가 **[C]** (서방 분석기관 판단).
- 리만 방향: 우크라이나의 '비발디 작전'(9월 반격)으로 러시아군의 슬로뱐스크 동쪽 공략이 지연되고 있다는 러시아 밀블로거 우려를 ISW가 인용 **[B]** (우크라·러 양측 출처에서 확인).
- 하르키우 북부 보우찬스크: 러시아 '북부' 전투단 대변인은 "포위망을 조이는 중이며 우크라군이 24시간 동안 최대 35명 손실"이라 주장, RIA는 "보우찬스크 솥(포위망) 돌파 시도 저지" 보도 **[D]** — 우크라이나는 9월 포위설을 공식 부인한 바 있다.
- 왜 다르게 말하나: 러시아는 동계 협상 지렛대로 '진격 지속' 서사가 필요하고, 우크라이나는 서방 지원 유지를 위해 반격 성과를 강조한다.

### 러시아의 장거리 타격 (키이우 교량·에너지)
- 10/3 새벽 키이우에 탄도미사일·드론 복합 공격, 1명 사망·2명 부상, 스뱌토신·오볼론·홀로시우 구에 화재 **[A]** (클리치코 시장 발표, RIA도 "키이우 폭발" 보도).
- 같은 날 아침 제트 추진 드론이 키이우 북부교(Pivnichnyi)를 타격, 노면·트롤리버스 가선 손상으로 서행 방향 차로 폐쇄 **[A]** — 러시아 국방부도 "드니프로 북부교 타격" 발표.
- 10/1-2 남부교 반복 타격으로 남부교 전면 폐쇄, 파톤교·메트로교 통행 제한(키이우시) **[B]**. TASS 인용 러시아 전문가는 "소련 시기 교량이라 파괴보다 무력화가 목적"이라고 해석 **[C]**.
- 러시아 국방부: 하룻밤 우크라 드론 218대 격추 주장 **[C]**. 우크라 측 집계와 합치지 않는다.
- NYT는 러시아 국방부 문서라며 "3개 대도시 전력·난방 90% 차단" 계획을 입수했다고 보도 **[C]** (우크라 당국 제공 문서, 러시아 반응 없음).
- 하르키우 10/2 유도폭탄 공격 2명 사망·32명 부상(우크라 당국) **[C]**, 드니프로·키이우주 호스토멜·제약 창고 피격.
- 우크라 공군 미라주 2000이 기관포로 러시아 소형 순항미사일 격추 주장 **[C]**.

### 우크라이나의 대러 타격
- 러시아 칼루가주 드론 공격으로 아파트 손상·경상자, 툴라주 드론 9대 격추, 벨고로드주 1명 사망(러시아 측 발표) **[C]**.
- 러시아 보로네시주 상공 Mi-8 헬기가 아군 오인 사격에 격추됐다는 보도 **[C]** (우크라 매체, 러시아 확인 없음).
- 러시아 독립매체 Vlast: 우크라의 정유소·창고 타격이 2027년 국방예산 증액 결정에 영향 **[C]**. Kyiv Post는 2027 예산안 국방비를 사상 최대(약 2,000억 달러)로, 보건·교육은 삭감으로 정리 **[B]**.

## 2. 이란·중동

### 이란 — 전쟁 8개월째, 봉쇄 대 해협 통제
- 배경: 2026년 2월 시작된 미·이스라엘-이란 전쟁이 8개월째. 6월 이슬라마바드 잠정 합의는 수주 만에 붕괴, 미국은 이란 항만 해상봉쇄, 이란은 PGSA(페르시아만해협청)를 통해 호르무즈 통항을 통제 중 **[B]**.
- 트럼프 대통령은 10/2 앨라배마 유세에서 전쟁이 "선거 직후 또는 그 전에" 끝날 것이며 이란이 "너무 강하게 나왔다"고 발언 **[A]** (본인 발언).
- IRGC: "대가 없는 위협의 시대는 끝났다…모든 공격에 고통스러운 대응", IRGC 부사령관 "새 기술적 기습" 예고 **[C]** (이란 정부 측 수사).
- 국가안보최고회의(SNSC) 레자이 서기: "트럼프는 매일 승리를 주장하지만 현실은 이란이 만든다" **[C]**.
- 내부 경제: 리알 급락 속 달러·금 신고가, 증시도 사상 최고(인플레 회피 수요) — 정부는 외부 압력·심리 탓, 강경파는 정부 책임론 **[C]** (Iran International, 반정부 매체).
- 치안: 자헤단 인근 도로변 폭탄 공격으로 최소 5명 사망(Iran International), IRGC는 소속 대원 1명 사망 확인 **[B]**. IRGC 지상군은 시스탄·발루치스탄에서 "테러 조직" 해체·2명 사살 발표 **[C]**.
- 핵: IAEA 사찰은 6월 잠정 합의 때 재개가 거론됐으나 이란은 "최종 합의 후"를 고수해 왔다. 이번 수집 구간에 IAEA 신규 발표는 확인되지 않음.

### 호르무즈·해상
- 10/2 호르무즈 진입 유조선이 '미상 발사체'에 피격, 화재 발생 후 진화(UKMTO) **[A]** — 이란 Mehr도 영국 Ambrey를 인용해 "또 한 척 피격" 보도.
- 이란 PGSA: 최근 피격된 UAE 관련 유조선 3척(Al Ruwais·Sinbad·Mersin Prosperity)은 "비준수 목록"에 올라 있었고 지난 두 달간 무단 통항을 반복했다고 발표. 공격 주체는 언급 안 함 **[D]** (서방은 공격 주체 미상, 이란은 '규정 위반' 프레임).
- PGSA는 비준수 선박에 벌금·억류·몰수, 보험사·선급에도 서비스 중단을 경고 **[C]**.
- 이란은 카스피해 우회로를 모색하지만 원유 수출 대체는 어렵다는 분석 **[C]**.

### 이스라엘·가자·서안
- flydubai 1073편(9/30, 두바이→텔아비브): 부기장이 기체를 고의 강하시킨 혐의, 사우디 타부크에 비상착륙. 미국 보도는 부기장을 오만 국적으로 지목 **[B]**.
- 배후 논쟁 **[D]**: 트럼프는 이란 연루 가능성을 시사하며 위협(Fox), 이스라엘 보안당국은 "단독 범행 가능성, 이란 연루 미확인", UAE 고문은 "위험한 테러 행위"로 규정. 이란은 무대응. flydubai는 이스라엘 노선 무기한 중단.
- 네타냐후는 "배후 세력이 있으면 매우 큰 대가" 경고 — 10월 27일 총선을 앞두고 안보 성과 경쟁 성격(Haaretz 분석) **[C]**.
- 가자시티 레말 지구 아파트 공습으로 최소 5명 사망(Al Jazeera) **[C]**, WHO는 의료물자 반입 지연 경고. 팔레스타인 20년 만의 총선 준비.
- 서안 코바르 인근 정착민 총격으로 19세 팔레스타인인 사망 **[B]** (Haaretz 보안 소식통·PressTV). 미국이 정착민 폭력 관련 대이스라엘 제재(일부 IDF 부대·미제 무기 사용 제한)를 검토한다는 보도 **[C]**.
- 시리아 쿠네이트라에 이스라엘 포격(TASS 인용 현지 TV) **[C]**.

### 레바논·이라크·예멘·걸프
- 레바논: 루비오 국무장관이 요르단 국왕과 헤즈볼라 무장해제 논의 **[C]**. 남부 접경 마을 철거 지속 보도 **[C]**.
- 이라크: 미군이 9/30 이라크 기지에서 최종 철수 **[A]**. 이란 쿠드스군 카아니 사령관은 "굴욕적 패배·축출"이라 주장 **[C]**, 이라크 정부는 시리아발 테러 위협을 경고(Fox). 이라크 총리실은 마한항공을 제외한 이란 항공사의 나자프 노선 하루 40편을 승인 **[A]** (Reuters·IRNA 모두 보도).
- 예멘: 7월 재점화된 내전에서 후티가 바브엘만데브를 포함한 홍해 연안 전체를 장악 **[B]**. 사우디는 바브엘만데브 집중 공세 또는 다전선(바이다·마리브·타이즈·자우프) 공세를 준비 중이며 미국은 정보·표적 지원 **[B]** (Reuters, 이란 매체는 사우디 공습 강화로 보도).
- 예멘 정부군 "24시간 474회 공격으로 후티 1,540명 사상" 주장 **[C]**. 사우디 연합군은 남부로 향한 탄도미사일 3발 요격, 후티의 메디나 변전소 타격을 주장 **[C]**.
- 걸프: 네타냐후의 UAE 방문 뒤 이란의 대UAE 비난 수위 상승 **[C]**. 파키스탄 외무장관: 메카 협약국이 후티와의 정치적 접촉(이란 제안)을 긴급 논의 **[C]**.
- 영국 경찰은 욤키푸르 맨체스터 유대인 공동체 테러 모의 혐의로 이란인 2명 기소 **[A]** (경찰 공식 발표).

## 4. 정권·외교·제재

### 미국-이란
- 이란의 7개항 제안(봉쇄 해제·동결자산 120억 달러·석유 제재 해제·레바논 포함 적대행위 중단 → 7일 내 호르무즈 재개)을 트럼프가 "충분치 않다"며 거부, 카타르가 미국 측 응답을 전달 **[B]**. 쟁점은 순서: 이란은 해협·봉쇄 먼저, 미국은 검증 가능한 핵 양보 먼저 **[B]**.
- 이란 언론 내 온건파는 "외교는 살아 있으나 좁아지는 중", 강경파는 해상 차단 확대를 주장 **[C]**.
- 미국은 시어도어 루스벨트 항모전단·마킨아일랜드 상륙전단(약 9,000명)을 중동에 추가 파견, 10월 말 도착 시 역내 약 2만 명 **[B]** (CBS·Fox·NHK 인용 WSJ). 사우디·카타르 석유시설 방어용 패트리엇 2개 포대 추가 배치 보도 **[C]** (Axios).
- 밴스 부통령 주재로 캠프데이비드에서 이란·예멘 비밀 안보회의, 트럼프가 대이란 군사행동 재개와 사우디의 대후티 공세 참여를 저울질한다는 보도 **[C]**.
- 이란 외무부: "이란·러시아·중국은 미국의 무법에 맞서 단결할 수밖에 없다" **[C]**. 이란 제1부통령은 유라시아경제연합(EAEU)과 장기 협력 의사 **[C]**.

### 러시아-우크라이나-서방
- 젤렌스키: "푸틴의 목표는 돈바스가 아니라 우크라이나 전체" **[C]**. 핀란드 스투브 대통령·몰도바 산두 대통령도 러시아 위협 지속을 경고.
- 푸틴은 칼리닌그라드 관련 NATO에 "모든 무기" 사용 가능성을 경고했다고 PressTV·Fox가 보도 **[B]** (세부 발언 원문 미확인).
- 우크라 정보당국: 러시아가 유럽 내 '하이브리드 전쟁' 확대 계획 **[C]**. 텔레그래프는 라이프치히 공항 사보타주 조직책으로 GRU 연계 러시아인을 지목 **[C]**.
- FT: EU는 개혁 이행 전 2027년 예산분 조기 지원(약 340억 유로) 요청을 거부 **[C]**. 폴란드는 계엄 전 단계의 '전쟁 전 준비' 법안을 마련 중 **[C]**.
- 미·우크라 재건투자기금(URIF) 첫 핵심광물 투자(3,000만 달러) 체결, 포트폴리오 약 7,000만 달러 **[B]**.
- 일본, 푸틴의 쿠릴 방문 이후 첫 대러 추가 제재로 '그림자 선단' 겨냥 **[A]** (일본 정부 발표).
- 가디언의 "대사관 키이우 철수 검토" 보도를 우크라 외무부가 부인 **[D]**.
- 러시아: 레즈니코프·페도로프 전 국방장관을 국제 수배 **[A]**. 억만장자들이 푸틴과 비공개 회동 뒤 '자발적' 예산 기여(Reuters) **[C]**. 넴초바·나발니팀 SNS를 '외국 대리인' 지정 **[A]**.
- PressTV는 젤렌스키의 북한군 포로 이송 공개에 한국 정부가 사과를 요구했다고 보도 **[C]** (한국 정부 원문 확인 필요).

- 흐리브냐 약세(5일 +3.2%)는 키이우 공습 강화와 EU 자금 조기집행 거부 보도가 겹친 영향으로 보인다(판단).

**한국 시장 영향:**
- 정유: 고유가는 재고평가에 우호적이나 G7의 디젤 집중 방출은 정제마진 하락 경로 — S-Oil·SK이노베이션 등은 마진과 유가 방향이 엇갈리는 구간.
- 해운: 호르무즈 위험 프리미엄으로 탱커 운임 강세 지속 시 탱커 비중이 큰 국내 해운사에 우호적, 반면 컨테이너선은 홍해(바브엘만데브) 차질로 우회 비용 증가.
- 항공: 제트유 강세는 대한항공 등 연료비 부담이나, 원화 강세(달러/원 1일 -1.3%)가 일부 상쇄.
- 방산: 우크라 전쟁 장기화·폴란드 '전쟁 전 준비'법·북한 탄도미사일 발사(10/3, 약 700km 비행)로 유럽·국내 수요 논리는 유지되나, 미 방산 ETF는 20일 -8%로 단기 차익 실현 국면.
