## 🗓 시장 요약

**S&P 500이 사상 최고를 새로 썼다.** 종가 **7,798.99(+0.69%)**로 기존 기록을 넘어섰고, 장중에는 **7,816.70**까지 올라 7,800선을 처음 밟았다. 나스닥도 +0.88%(26,803.03)로 따라붙었다. 이틀 연속 물가 지표가 우호적으로 나온 것이 동력이다.

7월 **생산자물가(PPI)가 전월비 0.0%**로 시장 예상(+0.2%)을 밑돌았다. 전날 CPI가 컨센서스에 부합한 데 이어 **물가 압력이 두 번 연속 확인 사살된 셈**이다. 여기에 유가까지 무너졌다 — IEA가 2026년 세계 석유 수요가 **하루 160만 배럴 감소**할 것으로 전망하면서 WTI가 **−2.43%(\$81.25)**로 급락했다. 물가와 유가가 동시에 내려가자 금리가 크게 밀렸다: 2년물 **−5.2bp(4.149%)**, 10년물 **−3.9bp(4.649%)**. 9월 FOMC 인상 확률은 37.4% → **33.0%**로 또 내려갔다.

그런데 **반도체는 축포를 끝까지 지키지 못했다.** SOX는 장중 **12,704.4(+2.46%)**까지 치솟았다가 **12,456.00(+0.46%)**으로 마감해 고점 대비 **1.95%를 반납**했다. 엔비디아가 +0.54%에 그친 것이 컸다. 대신 돈은 **스토리지**로 몰렸다 — 샌디스크 **+13.67%**, 웨스턴디지털 **+7.31%**, 마이크론 +4.23%. AI 데이터센터의 병목이 연산에서 **저장**으로 옮겨가고 있다는 해석이다.

한국 관점의 핵심은 둘이다. 첫째, **SKHY가 +7.29%(\$165.67)**로 이틀 연속 급등했다(장중 \$168.50). 국내 SK하이닉스(000660)도 **+5.92%(1,593,000원)**로 함께 올랐지만 ADR이 더 뛰어 **괴리율은 +45.1% → +47.3%로 6거래일 연속 확대**됐다. 둘째, **외국인이 이틀 연속 대량 순매수**(+64.98만 주, 전일 +55.99만 주)로 지분율을 50.83% → **50.92%**까지 끌어올렸다. 시가총액은 **1,163조원**을 넘어섰다. 야간선물도 **+2.02%(1,095.40)**로 마감해, 상승 흐름은 아직 꺾이지 않았다.

> *어제 판정 복기: '갭업 출발을 강하게 본다'로 봤고 실제 8/13 한국장은 코스피200 선물 **+3.71%**, SK하이닉스(000660) **+5.92%**로 마감해 방향과 강도 모두 맞았다.*

## 📰 헤드라인 3선

**1. 7월 PPI 전월비 0.0% — 예상(+0.2%) 하회, 물가 이틀 연속 우호적**
미 노동통계국이 발표한 7월 생산자물가지수는 계절조정 기준 **변동 없음(0.0%)**으로, 다우존스 컨센서스 +0.2%를 밑돌았다. 6월 −0.1%, 5월 +0.5%에 이은 흐름이며 12개월 누적은 +4.7%다. 전날 CPI(전월비 +0.1%, 전년비 3.4%)에 이어 **물가 둔화가 두 번 연속 확인**되면서, 9월 FOMC 동결 확률이 67.0%까지 올라섰다.

**2. IEA "2026년 세계 석유 수요 하루 160만 배럴 감소" — WTI −2.43%**
국제에너지기구가 높은 연료 가격과 호르무즈 해협 봉쇄에 따른 제품 부족으로 **올해 세계 석유 수요가 하루 160만 배럴 줄어들 것**이라고 전망했다. 미국 재고 급증까지 겹치며 WTI가 배럴당 **\$81.25(−2.43%)**, 브렌트유가 **\$87.07(−2.15%)**로 동반 급락했다. 4거래일 연속 오르며 주간 6%를 넘겼던 유가가 방향을 튼 것으로, **물가 경로의 최대 위험 요인이 완화**됐다는 의미가 크다.

**3. CNBC, SK하이닉스 메모리 증설 현장 단독 취재 — "2034년까지 생산능력 3배"**
CNBC가 SK하이닉스의 용인 팹 건설 현장을 언론 최초로 카메라 취재하고 **최태원 SK그룹 회장 인터뷰**를 함께 내보냈다. CNBC는 이를 **"7,200억 달러 규모의 베팅"**으로 표현하며, 메모리 산업 특유의 호황·불황 사이클에도 불구하고 **2034년까지 생산능력을 3배로 늘리는 세계 최대 규모의 메모리 팹 증설**이라고 전했다. 한편 같은 날 로이터는 **SK하이닉스 국내 직원들이 통합 노조를 출범**시켰으며 임금 협상이 교착 상태라고 보도했다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  스토리지·낸드 (이날 최강)**
샌디스크 **+13.67%(\$1,528.11)**, 웨스턴디지털 **+7.31%(\$487.28)**, 마이크론 +4.23%. AI 데이터센터 확장이 연산뿐 아니라 **대용량 저장장치 수요**를 끌어올린다는 인식이 강해졌다. 샌디스크는 거래량 2,148만 주로 거래대금 상위 2위였다.

> 🇰🇷 [전달] 낸드 가격 반등은 **삼성전자(005930)**에 상대적으로 더 유리한 조합(낸드 비중). SK하이닉스(000660)는 HBM·D램 축이 여전히 주도.

**상승 ②  엔터프라이즈 소프트웨어**
워크데이 **+17.78%(\$206.45)**로 이날 상승률 1위였고, 고대디 +9.45%, 코스타그룹 +8.36%, 파이서브 +7.64%, 글로벌페이먼츠 +7.11%가 뒤를 이었다. 금리 급락이 **장기 현금흐름 할인율을 낮추며** 소프트웨어·핀테크 밸류에이션을 밀어올렸다.

**상승 ③  대형 기술주 되돌림**
넷플릭스 **+5.42%(\$78.23)**, 테슬라 **+3.80%**, 메타 **+2.74%**, 애플 +1.00%, 알파벳 +0.82%. 전날 급락했던 메타(−3.38%)가 반등하며 **하루 만에 방향이 뒤집혔다.** 다만 아마존은 −0.80%로 홀로 약했다.

> 🇰🇷 [전달] 금리 하락 + 빅테크 반등 조합은 국내 성장주·플랫폼에도 우호적. 다만 전날과 정반대 흐름이라 **추세보다 순환**으로 읽는 편이 안전하다.

**하락 ①  네트워크 장비 (실적 실망)**
시스코가 **−8.38%(\$113.50)**로 급락했다. 거래량 5,620만 주. 코닝(GLW)도 −5.32%로 동반 약세였고, 전날 +13.63% 급등했던 루멘텀은 **−5.58%로 상승분을 절반 가까이 반납**했다.

**하락 ②  소비재·명품**
태피스트리가 **−16.49%(\$128.39)**로 이날 최대 낙폭을 기록했다. 4분기 실적은 시장 예상을 웃돌았지만 **가이던스가 실망스러웠다.** 핀둬둬도 −5.46%로 밀렸다.

**하락 ③  아날로그·전력반도체**
모놀리식파워 −4.35%, 아멘텀 −3.80%. SOX가 소폭 상승에 그친 배경에는 **반도체 내부의 온도차**가 있었다.

**[판정]** **상승 우세로 보되 강도는 어제보다 낮춘다.** 우호 요인은 넷이다. ①PPI 0.0%로 물가 이틀 연속 통과, ②유가 −2.43%로 원가·물가 부담 완화, ③금리 급락(2년물 −5.2bp), ④**야간선물 +2.02%**와 **SKHY +7.29%**, 그리고 **외국인 이틀 연속 대량 순매수**(+64.98만 주).
다만 경계 요인이 셋이다. 첫째, **SOX가 장중 +2.46%에서 +0.46%로 되밀렸고 SKHY도 \$168.50 고가에서 \$165.67로 마감**해 미국에서 이미 차익실현이 나왔다. 둘째, 코스피200 선물은 정규장 +3.71%에 야간 +2.02%가 더해진 **3거래일 누적 급등**(989.80 → 1,095.40, +10.7%) 구간이다. 셋째, **괴리율 +47.3%는 6거래일 연속 확대**로 역사적 상단 영역이다. (무효화: 외국인 순매도 전환, SOX 재차 음전, 또는 원/달러 1,430원 재돌파 시)

## 🔍 섹션 2. 이슈 종목 10선

**1. SK하이닉스 ADR (SKHY) +7.29% — \$165.67, 괴리율 +47.3%로 6일 연속 확대**
장중 **\$168.50**까지 올랐다가 \$165.67에 마감했다. 시가는 \$154.13으로 전일 종가(\$154.41) 부근에서 출발했으니, **장중에만 9.3%를 올렸다가 1.7%를 반납한 셈**이다. 거래량은 **3,183만 주**로 전일(2,533만 주)보다 26% 늘었고, 시간외에서도 +0.14%(\$165.91)로 강세를 유지했다. 시가총액은 **8,189억 달러**.
국내 SK하이닉스(000660)는 **1,593,000원(+5.92%, +89,000원)**에 마감했다. 외국인이 **+64만 9,842주**를 순매수해 이틀 연속 대량 매수를 이어갔고(전일 +55만 9,854주), 기관도 +15만 9,109주를 담았다. 개인은 −78만 7,333주를 팔았다. 외국인 지분율은 50.83% → **50.92%**, 시가총액은 **1,163조원**을 넘었다. 거래대금은 12조원.
그럼에도 **괴리율은 +45.1% → +47.3%로 2.2%p 더 벌어져 6거래일 연속 확대**됐다. 원/달러가 1,412.87원 → 1,416.77원으로 원화가 약해진 것도 확대에 기여했다. **ADR과 국내 주가의 격차가 구조적으로 고착되는 국면**인지, 국내가 따라잡을 여지인지가 앞으로의 관전 포인트다.

**2. 샌디스크 (SNDK) +13.67% — \$1,528.11, 스토리지가 주인공이 됐다**
낸드 플래시·SSD 대표주가 13% 넘게 급등하며 거래량 **2,148만 주**로 시장 전체 거래대금 2위에 올랐다. 전날에도 +5.76% 올랐으니 이틀 누적 **+20.2%**다.
AI 데이터센터 투자가 GPU·HBM을 넘어 **엔터프라이즈 SSD와 대용량 저장 계층**으로 확산되고 있다는 인식이 반영됐다. 학습 데이터와 추론 캐시가 늘수록 스토리지 수요는 비선형적으로 증가한다.
같은 날 SOX가 +0.46%에 그친 것과 대비된다. **반도체 안에서도 자금이 로직 → 메모리 → 스토리지로 이동**하는 흐름이 뚜렷하다.

**3. 워크데이 (WDAY) +17.78% — \$206.45, 이날 상승률 1위**
인사·재무 SaaS 기업이 17% 넘게 급등하며 시장 상승률 1위를 차지했다. 거래량 1,540만 주.
2년물 금리가 −5.2bp 내리며 **장기 현금흐름의 할인율이 낮아진 것**이 밸류에이션에 직접 반영됐다. 금리 민감도가 높은 고성장 SaaS가 가장 크게 반응한 전형적 패턴이다.
고대디 +9.45%, 코스타그룹 +8.36%, 파이서브 +7.64%, 글로벌페이먼츠 +7.11%까지 **소프트웨어·핀테크 전반이 동반 상승**해 개별 재료가 아닌 매크로 재평가였음을 보여준다.

**4. 웨스턴디지털 (WDC) +7.31% — \$487.28, HDD도 함께 뛰었다**
하드디스크 중심의 스토리지 업체가 7% 넘게 올랐다. 거래량 830만 주.
AI 데이터센터는 고속 SSD뿐 아니라 **콜드 데이터 저장용 대용량 HDD**도 대량으로 필요로 한다. 샌디스크와 함께 오른 것은 시장이 **스토리지 전체 계층**을 다시 보고 있다는 신호다.
국내에서는 SSD 컨트롤러·낸드 후공정 관련주에 파급될 수 있는 재료다.

**5. 마이크론 (MU) +4.23% — \$949.83, 거래대금 1위 유지**
거래량 **3,558만 주**로 이날도 가장 활발히 거래된 종목이었다. 종가 \$949.83으로 \$1,000선을 눈앞에 뒀다.
이틀 누적 +9.4%로 메모리 랠리에 계속 동참하고 있다. 다만 **SKHY +7.29%에는 이날도 못 미쳤다** — 이틀 연속 SK하이닉스가 마이크론을 앞선 것으로, HBM 비중 차이가 계속 프리미엄으로 반영되는 중이다.
국내 SK하이닉스(000660)·삼성전자(005930)의 상대 강세를 뒷받침하는 흐름이다.

**6. 인텔 (INTC) +3.58% — \$104.56, \$100선 안착**
거래량 **1억 1,250만 주**로 시장 최다 수준이었다. 종가 \$104.56으로 \$100선 위에 자리 잡았다.
파운드리 전환과 정부 지원 기대가 이어지는 가운데, 반도체 전반의 자금 유입에서 소외되지 않았다. 다만 상승률 자체는 스토리지 종목들에 못 미쳤다.
거래량이 압도적으로 많다는 점은 **여전히 논쟁적인 종목**임을 보여준다.

**7. 시스코 (CSCO) −8.38% — \$113.50, 실적 실망에 급락**
네트워크 장비 대표주가 8% 넘게 밀렸다. 거래량 **5,620만 주**로 평소를 크게 웃돌았다.
AI 데이터센터 수요의 수혜주로 분류돼 왔지만, 실적이 그 기대를 채우지 못했다. **"AI 관련주"라는 라벨만으로는 더 이상 주가가 지지되지 않는다**는 점을 보여준 사례다.
같은 날 코닝(GLW) −5.32%까지 겹치며 **네트워킹·광통신 인프라가 이날 가장 약한 하위 업종**을 형성했다.

**8. 태피스트리 (TPR) −16.49% — \$128.39, 실적 호조에도 가이던스가 발목**
코치·케이트스페이드를 보유한 명품 그룹이 이날 최대 낙폭인 −16.49%를 기록했다. 거래량 848만 주.
4분기 실적 자체는 **월가 예상을 웃돌았다.** 그럼에도 급락한 이유는 **향후 가이던스가 실망스러웠기 때문**이다. 장 시작 전 −8.8%였던 낙폭이 정규장에서 두 배로 확대됐다.
'실적 서프라이즈 + 가이던스 하향 = 급락'은 이번 주 반복된 패턴(허니웰·앱러빈)으로, **시장이 과거 실적보다 미래 전망에 압도적 가중치**를 두고 있음을 재확인시켰다.

**9. 루멘텀 (LITE) −5.58% — \$880.41, 전날 급등분 절반 반납**
전날 +13.63%로 폭등했던 광통신 부품주가 하루 만에 −5.58%로 되돌렸다. 거래량 439만 주.
시스코·코닝의 약세와 함께 움직인 것으로, **네트워킹 계층에 대한 기대가 하루 만에 식은** 모습이다.
전날 AI 인프라 랠리에서 두 자릿수로 급등했던 종목들의 지속성을 시험하는 국면으로, 이번 주 급등주 추격 매수의 위험을 보여준다.

**10. 넷플릭스 (NFLX) +5.42% · 테슬라 (TSLA) +3.80% — 빅테크 하루 만의 반전**
넷플릭스가 \$78.23으로 +5.42%, 테슬라가 \$339.96으로 +3.80% 올랐다. 메타도 +2.74%(\$594.73)로 전날 −3.38%를 대부분 만회했다.
전날 **'AI에 돈 쓰는 쪽 하락, 받는 쪽 폭등'**이었던 구도가 하루 만에 뒤집혔다. 금리 급락이 대형 성장주 전반의 할인율을 낮춘 것이 직접적 원인이다.
반면 스페이스X는 −3.41%(\$141.16), 아마존은 −0.80%로 약했다. **이틀 연속 방향이 뒤집히는 구간**이라, 개별 테마보다 매크로(금리·유가)가 주도권을 쥐고 있다고 보는 편이 타당하다.

## 💬 섹션 3. 구루·기관 코멘트

- **뱅크오브아메리카 증권(스티븐 주노) — "7월 CPI는 인플레이션 냉각 궤적을 가리킨다."** 다만 단서를 달았다: **"AI 투자는 물가를 계속 밀어올리는 요인"**이며, 근원 상품이 전월비 +0.20%로 상방 서프라이즈를 냈고 **IT 상품이 +1.4% 급등해 근원 상품 물가에 12bp를 기여**했다는 것이다. 컴퓨터·소프트웨어·스마트폰 가격 상승이 **기업 AI 수요가 소비자에게 전가된 결과**라는 분석이다.
- **연준 금리선물(9/16 FOMC) — 인상 33.0% vs 동결 67.0%.** 8/11 47.4% → 8/12 37.4% → 8/13 **33.0%**로 사흘 연속 내려왔다. **동결이 확고한 기본 시나리오**가 됐다.
- **골드만삭스 — "AI 지출은 부채와 주식 발행으로 조달되고 있다."** AI 투자 재원의 성격을 짚은 분석으로, 자본지출 확대가 **재무구조 부담**으로 연결될 수 있다는 관점이다.
- **마켓워치 — "칩주가 강세장 진입을 앞뒀지만 일부 애널리스트는 불안해한다."** AI 인프라 기업들의 수주잔고 증가에 시장이 환호하고 있으나, **그 주문이 모두 이행된다는 보장은 없다**는 경계론을 전했다. 코어위브의 1,040억 달러 수주잔고에 대한 반대 시각으로 참고할 만하다.
- **SKHY 컨센서스 — 애널리스트 14인 Strong Buy, 목표주가 \$244.92**(현재가 대비 +47.8%). 상승 여력은 이틀 전 +58.6%에서 주가 급등으로 축소됐다.
- **로이터 — SK하이닉스 통합 노조 출범, 임금 협상 교착.** 직군·사업장을 아우르는 새 노조가 8/13 출범했다. 실적 호조 국면에서 **인건비 협상이 새 변수**로 부상할 수 있다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📊 7월 소매판매 (오늘, 8/14 08:30 ET):** 이번 주 마지막 매크로 지표. CPI·PPI가 모두 우호적으로 나온 뒤라, **소비 체력까지 확인되면 '물가 둔화 + 성장 유지'라는 최상의 조합**이 완성된다. 반대로 소비가 크게 꺾이면 경기 둔화 우려로 해석이 뒤집힐 수 있다.
- **🇰🇷 괴리율 +47.3%의 지속 가능성:** 6거래일 연속 확대돼 역사적 상단이다. **국내가 따라 오르며 좁혀지는 경로**와 **ADR이 조정받아 좁혀지는 경로** 중 어느 쪽인지가 국내 투자자에게 결정적이다. 전환 한도 규제로 차익거래가 제약돼 괴리가 오래 유지될 수 있다는 점도 감안해야 한다.
- **🇰🇷 외국인 수급:** 이틀 연속 대량 순매수(+55.99만 → +64.98만 주)로 지분율이 50.92%까지 올라왔다. **테마섹 투자 보도**와 방향이 일치하는 만큼, 순매수 지속 여부가 상승 연장의 핵심 조건이다.
- **🛢 유가:** IEA 수요 감소 전망으로 방향이 꺾였다. **\$80 하향 이탈 시** 국내 항공·화학·해운에 뚜렷한 원가 개선 재료가 된다. 반대로 호르무즈 긴장 재고조 시 되돌림 위험.
- **🏢 실적:** 어플라이드머티리얼즈가 남았다. **반도체 장비 수요의 바로미터**로, 증설 사이클의 실체를 확인하는 마지막 관문이다.
- **⚠️ SK하이닉스 노조 변수:** 통합 노조 출범과 임금 협상 교착은 **중장기 비용 구조**에 영향을 줄 수 있는 사안이다.
