## 🗓 시장 요약

**① 나스닥 25,437.00(−2.86%)·S&P500 7,580.07(−1.82%)·다우 51,770.31(−1.09%) — 인텔·아마존·레딧 실적 충격에 10월 마지막 거래일 급락**
나스닥은 **25,437.00(−747.73, −2.86%)**, S&P500은 **7,580.07(−140.32, −1.82%)**, 다우는 **51,770.31(−572.25, −1.09%)**로 마감해 이틀 연속 내렸다. 나스닥100은 28,384.85(−3.46%)로 더 크게 빠졌고 러셀2000도 2,811.84(−1.66%)로 전날 상승분을 반납했으며, VIX는 장중 23.93까지 치솟았다가 19.77(+14.94%)로 마감했다. 전날 알파벳에 이어 아마존의 대규모 현금 유출과 인텔의 4분기 가이던스 부진이 겹치면서 'AI 투자가 현금흐름을 갉아먹는다'는 우려가 기술주 전반으로 번졌다. 나스닥은 2025년 3월 이후 가장 나쁜 한 달로 10월을 마쳤다.

**② 2년물 4.56%(−5.0bp)·10년물 4.94%(−4.0bp)·30년물 5.31%(−1.0bp) — 연준 인사들 '추가 인상' 발언에도 위험회피로 금리 하락**
세인트루이스 연은의 알베르토 무살렘 총재는 인플레이션이 "너무 높고 광범위하다"며 연준이 "곧" 움직여야 한다고 말했고, 리치먼드 연은의 톰 바킨 총재도 금리를 더 올려야 하며 "문제는 얼마나 올리느냐"라고 밝혀 12월 인상 전망을 굳혔다. 3분기 고용비용지수는 전 분기 대비 0.8% 올라 예상에 부합했다. 그럼에도 주식 급락에 따른 안전자산 수요로 미 재무부 기준 2년물은 **4.56%(−5.0bp)**, 10년물은 **4.94%(−4.0bp)**, 30년물은 **5.31%(−1.0bp)**로 내렸다.

**③ WTI \$103.01(+0.99%)·브렌트 \$117.55(+2.32%) — 호르무즈 기뢰 피격 소식에 상승, 금 −3%대·비트코인 \$7.7만선**
WTI 12월물은 장중 \$104.99까지 오른 뒤 **\$103.01(+\$1.01, +0.99%)**로 마감했고, 10월 30일 만기인 브렌트 12월물은 **\$117.55(+\$2.67, +2.32%)**였다. 트럼프 대통령은 이란과의 전쟁이 "곧 끝날 것"이라고 말했지만, 이란은 남쪽 항로에서 상선 6척이 기뢰에 부딪혔다고 밝혔고 후티 반군의 사우디 미사일 공격 주장까지 나오며 공급 불안이 이어졌다. 금은 \$3,886.70(−3.59%) 안팎으로 밀렸고, 바이낸스 해킹 여파 속에 비트코인은 \$76,845(−2.40%) 안팎에서 거래됐다.

**④ AI·반도체 — SOX 10,688.80(−7.20%)·인텔 −28.58%·샌디스크 −13.47%·AMD −10.88%·마벨 −10.05%·Arm −9.97%**
반도체지수는 장중 10,439.01까지 밀린 끝에 **10,688.80(−829.40, −7.20%)**로 마감했다. 인텔(INTC)이 4분기 매출 가이던스 \$150억~\$160억과 조정 총마진 38.0%를 제시하고 "PC 둔화가 적어도 내년 상반기까지 이어질 것"이라고 밝히자 \$65.76(−28.58%)로 폭락했다. 립부 탄 CEO가 메모리 가격과 공급 문제를 PC 둔화의 배경으로 꼽으면서 메모리주도 함께 밀려 샌디스크(SNDK)는 \$1,150.89(−13.47%), 마이크론(MU)은 \$884.74(−5.30%), SK하이닉스 ADR(SKHY)은 \$149.21(−7.95%)였다. AMD(AMD) \$504.80(−10.88%), 마벨(MRVL) \$196.40(−10.05%), Arm(ARM) \$205.97(−9.97%), 루멘텀(LITE) \$840.70(−8.57%), 브로드컴(AVGO) \$326.08(−5.48%), 엔비디아(NVDA) \$204.64(−4.22%)도 일제히 내렸다.

**⑤ 실적·이슈 — 리제네론 +13.33%·엑슨모빌 +2.16%, 레딧 −29.29%·로블록스 −18.07%·트윌리오 −15.24%·코인베이스 −10.62%**
실적과 가이던스가 종목별 명암을 크게 갈랐다. 3분기 매출이 36% 늘어난 리제네론(REGN)은 **\$927.89(+13.33%)**, 정제 마진 호조로 시장 예상을 웃돈 엑슨모빌(XOM)은 **\$187.25(+2.16%)**, 셰브론(CVX)은 **\$235.52(+1.75%)**로 올랐다. 반대로 4분기 이용자 감소를 경고한 레딧(RDDT)은 **\$91.64(−29.29%)**, 4분기 부킹 감소를 예고한 로블록스(RBLX)는 **\$42.98(−18.07%)**, 4분기 성장 둔화 전망을 낸 트윌리오(TWLO)는 **\$205.03(−15.24%)**로 급락했다. 사상 최대 규모인 \$63억 바이낸스 해킹 소식에 코인베이스(COIN)는 **\$143.54(−10.62%)**로 밀렸다. 아마존(AMZN)은 장 초반 −5.92%까지 빠졌다가 **\$240.35(−1.41%)**로 낙폭을 줄였고, 알파벳(GOOGL)은 \$279.84(−1.40%)로 이틀째 약세였다.

**⑥ 🇰🇷 SOX −7.20%·SK하이닉스 ADR \$149.21(−7.95%)·코스피200 야간선물 875.90(−2.62%) — 인텔발 PC 둔화 경고는 메모리 업황 심리에 직접 부담**

인텔이 메모리 가격 상승을 PC 수요 둔화의 원인으로 지목하면서, 메모리 가격 강세가 오히려 최종 수요를 깎는다는 논리가 부각됐다. 다음 거래일인 11월 2일(월) 국내 반도체주에는 SOX −7%대 하락이 한꺼번에 반영될 수 있다. 다만 10년물 금리가 4.94%로 이틀 연속 내린 점은 성장주 밸류에이션 부담을 덜어 준다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 인텔 (INTC) −28.58% — 4분기 매출 가이던스 \$150억~\$160억·조정 총마진 38.0%, "PC 둔화 내년 상반기까지"**
인텔은 시가 \$68.36으로 폭락 출발해 저가 \$63.20(−31.36%)까지 밀린 뒤 \$65.76(−\$26.31, −28.58%)로 마감했다. 3분기 매출 \$165억과 조정 주당순이익 \$0.52는 예상을 웃돌았지만, 4분기 매출 가이던스 \$150억~\$160억과 조정 주당순이익 \$0.25는 LSEG 집계 예상치(\$171억·\$0.43)에 크게 못 미쳤고 조정 총마진도 44.1%에서 38.0%로 떨어질 것이라고 밝혔다. 데이비드 진스너 CFO는 "PC 둔화가 적어도 내년 상반기까지 이어질 것으로 본다"고 했고, 립부 탄 CEO는 고객사들이 메모리 가격과 공급 문제로 PC 둔화 신호를 보내기 시작했다고 설명했다. 3분기 PC 부문 매출은 \$81억으로 5% 줄었으며, 이스라엘 공장 사고와 생산 차질로 올해 현금 유출이 불가피하다는 경고도 나왔다.

**2. 아마존 (AMZN) −1.41% — 3분기 매출 \$2,019억(+12%)·AWS +39%, 최근 12개월 잉여현금흐름 −\$424억**
아마존은 시가 \$232.53으로 약세 출발해 저가 \$229.36(−5.92%)까지 밀렸다가 \$240.35(−\$3.44, −1.41%)로 낙폭을 크게 줄였다. 3분기 매출은 \$2,019억으로 12% 늘었고 AWS 성장률은 39%로 약 5년 만에 가장 빨랐지만, 주당순이익 \$1.89는 LSEG 예상치 \$1.96에 못 미쳤다. 분기 설비투자가 약 \$770억으로 1년 전(\$350억)의 두 배를 넘으면서 최근 12개월 잉여현금흐름은 사상 최대인 −\$424억 유출을 기록했고, 회사는 내년에도 설비투자를 더 늘리겠다는 신호를 줬다. 앤디 재시 CEO는 프라임 비디오가 "수백억 달러"를 벌어들이는 궤도에 있다고 강조했다.

**3. 레딧 (RDDT) −29.29% — 3분기 실적 예상 상회에도 4분기 매출 전망 부진, 일간 방문자 두 자릿수 감소 경고**
레딧은 시가 \$100.25로 급락 출발해 저가 \$89.28(−31.11%)까지 밀린 뒤 \$91.64(−\$37.96, −29.29%)로 마감했다. 3분기 주당순이익과 매출은 시장 예상을 웃돌았지만 4분기 매출 전망이 예상에 못 미쳤고, 3분기 일간 활성 이용자도 기대보다 약했다. 스티브 허프먼 CEO는 4분기 전체 일간 순방문자가 10%대 초반 비율로 줄어들 수 있다고 경고했다. 회사는 4분기에 일부 해외 시장에서 로그인 계정이 있어야 게시판을 볼 수 있도록 하는 시험을 시작한다고 밝혔다.

**4. 코인베이스 (COIN) −10.62% — 바이낸스 사상 최대 \$63억 해킹, 비트코인 \$7.7만선 후퇴**
코인베이스는 저가 \$136.90(−14.75%)까지 밀린 뒤 \$143.54(−\$17.05, −10.62%)로 마감했다. 세계 최대 가상자산 거래소 바이낸스가 목요일 밤 \$63억 규모의 해킹을 당했다고 발표했으며, 이는 기록상 최대 규모의 가상자산 탈취 사건이다. 테더·서클의 도움으로 약 \$30억이 온체인에서 동결됐고, 리처드 텅 공동 CEO는 "해킹 손실은 모두 회사 자금으로 보전하겠다. 여러분의 자산은 안전하다"고 밝혔다. 비트코인은 장중 5% 넘게 밀렸다가 \$76,845(−2.40%) 안팎으로 마감했고, 서클·로빈후드·스트래티지 등 가상자산 관련주도 장 초반 6% 넘게 내렸다.

**5. 로블록스 (RBLX) −18.07% — 4분기 부킹 10~15% 감소 전망, 일간 이용자 1억3,800만 명(−9%)**
로블록스는 시가 \$45.73에서 출발해 저가 \$41.36(−21.16%)까지 밀린 뒤 \$42.98(−\$9.48, −18.07%)로 마감했다. 회사는 4분기 부킹이 1년 전보다 10~15% 줄어들 것이라는 전망을 내놓았다. 3분기 일간 활성 이용자는 1억3,800만 명으로 9% 감소해 이용자 감소 추세가 이어졌다. 이용자 유지율은 2021년 이후 가장 좋았다는 설명에도 성장 둔화 우려가 더 크게 부각됐다.

**6. 트윌리오 (TWLO) −15.24% — 3분기 매출 \$15.6억(+20%) 사상 최대·연간 전망 상향에도 4분기 성장 둔화 전망**
트윌리오는 시가 \$186.59로 급락 출발해 저가 \$180.00(−25.59%)까지 밀렸다가 \$205.03(−\$36.87, −15.24%)로 낙폭을 일부 줄였다. 3분기 매출은 사상 최대인 \$15.6억으로 20% 늘었고 이익도 시장 예상을 웃돌아 회사는 연간 전망을 올렸다. 그러나 4분기 유기적 매출 성장률이 3분기보다 낮아질 것이라는 가이던스를 내놓으면서 최대 사업인 메시징 부문의 성장 둔화 우려가 부각됐다. 장중 한때 25% 넘게 빠졌던 주가는 오후 들어 저가 매수세가 유입되며 10%포인트 가량 회복했다.

**7. 리제네론 (REGN) +13.33% — 3분기 매출 \$51억(+36%)·조정 EPS \$20.07, 예상(\$16.25) 크게 상회**
리제네론은 시가 \$869.43에서 출발해 고가 \$935.35(+14.24%)까지 오른 뒤 \$927.89(+\$109.12, +13.33%)로 마감했다. 3분기 매출은 \$51억으로 36% 늘어 시장 예상(\$45.6억)을 웃돌았고, 조정 주당순이익은 \$20.07로 70% 늘어 예상치 \$16.25를 크게 넘었다. 사노피와 함께 파는 아토피 치료제 듀피젠트 매출이 \$65억(+35%)으로 늘면서 사노피 협력 매출이 \$27.2억으로 1년 전보다 \$11억 증가해 매출 증가분의 약 5분의 4를 차지했다. 크리스토퍼 페니모어 CFO는 이번 개선으로 회사가 "가장 강한 해 가운데 하나"를 보낼 위치에 섰다고 말했고, 사노피는 4개 신규 항체에 대한 선급금 \$10억을 4분기에 지급한다.

**8. AMD (AMD) −10.88% — 인텔 4분기 가이던스 쇼크와 PC 둔화 경고에 동반 급락**
AMD는 시가 \$508.51에서 출발해 저가 \$492.24(−13.10%)까지 밀린 뒤 \$504.80(−\$61.62, −10.88%)로 마감했다. 인텔이 4분기 매출 가이던스를 \$150억~\$160억으로 낮춰 잡고 PC 부문 매출이 \$81억(−5%)으로 줄었다고 발표하면서, PC용 CPU 비중이 큰 AMD에도 수요 둔화 우려가 그대로 옮겨 붙었다. 인텔 경영진이 메모리 가격 상승을 PC 둔화의 원인으로 꼽은 점도 반도체 업종 전반의 실적 눈높이를 끌어내렸다. 장 초반 프리마켓에서 이미 8%대 하락했던 주가는 정규장에서 낙폭을 더 키웠다.

**9. 엑슨모빌 (XOM) +2.16% — 3분기 정제 마진 호조로 예상 상회, 정제 이익이 처음으로 상류 부문 추월**
엑슨모빌은 고가 \$188.50(+2.84%)까지 오른 뒤 \$187.25(+\$3.96, +2.16%)로 마감했다. 3분기 실적은 정제 마진 급등에 힘입어 시장 예상을 웃돌았고, 실적 발표 전 회사가 제시한 정제 부문 이익 개선 효과는 약 \$45억이었다. 엑슨이 원유 생산(상류)보다 정제에서 더 많은 이익을 낸 것은 적어도 6년 만에 처음이다. 같은 날 셰브론(CVX)도 시장 예상을 웃돈 실적에 \$235.52(+1.75%)로 올라 에너지 업종이 하락장 속 버팀목이 됐다.

**10. 핀터레스트 (PINS) −2.79% — 3분기 매출 \$11.7억·조정 EPS \$0.46, 모두 예상 하회**
핀터레스트는 시가 \$18.75로 약세 출발해 저가 \$18.15(−8.89%)까지 밀렸다가 \$19.37(−\$0.56, −2.79%)로 낙폭을 줄였다. 3분기 매출은 \$11.7억으로 시장 예상(\$12.1억)에 못 미쳤고, 조정 주당순이익도 \$0.46으로 예상(\$0.49)을 밑돌았다. 레딧·로블록스와 함께 이용자·광고 기반 인터넷주의 실적 부진이 이어지면서 업종 전반의 투자 심리가 약해졌다. 다만 주가가 이미 \$20 아래로 내려와 있던 탓에 장중 저점 이후 저가 매수가 들어왔다.
