# 📊 한국증시 데일리 리포트 (장중판)
### 2026년 10월 21일(수) 12시 작성 · 기준일: 10월 21일(수) 정규장 오전장(11:56 현재) (장중판)

*11:56 현재 장중 잠정치 — 종가 아님*

*전날 3.73% 급락해 5,552.74로 마친 코스피는 5,666.34(+2.04%)로 출발한 뒤 장중 5,630.14까지 밀렸다가 반도체 대형주가 급반등하며 5,816.43(+4.75%)까지 올랐고, 매수 사이드카가 두 달 만에 발동됐다. 11시 56분 현재 5,766.07(+3.84%)로 5,800선 아래에서 숨을 고르는 중이다. 외국인(+3,591억원)과 기관(+662억원)이 순매수로 돌아섰고 개인은 9,611억원을 차익실현했다. 삼성전자(+6.86%)·SK하이닉스(+6.21%)·SK스퀘어(+6.34%)가 지수를 끌어올렸고, 얼라인파트너스의 지분 보유 공개에 SK(+13.67%)가 급등했다. 업종별로는 반도체와반도체장비(+6.23%, 상승 149/하락 21)·석유와가스(+6.10%)·전기장비(+3.71%)·건설(+3.47%)이 강하고, 무역회사와판매업체(−2.27%)·통신서비스(−2.26%)·도로와철도운송(−1.48%)이 약하다. 코스닥은 796.58(+1.87%)로 장중 803.68까지 올라 800선을 한때 회복했다.*

## 🗓 시장 요약

**① 코스피 하루 만에 4% 급반등, 두 달 만의 매수 사이드카.** 전날 −3.73% 급락의 낙폭 과대 인식과 코어위브발 AI 신용 우려 완화로 코스피가 5,666.34에 출발한 뒤 장중 5,816.43(+4.75%)까지 치솟으며 매수 사이드카가 발동됐다. 11시 56분 현재 5,766.07(+213.33p)로, 외국인 3,591억원·기관 662억원 순매수 전환이 반등을 이끌었다. 코스피200 선물도 899.05(+4.41%)로 현물보다 조금 더 올라 선물 쪽 매수세가 붙었다.

**② 삼성전자·SK하이닉스 6%대 반등, 반도체 장비주도 동반 강세.** 삼성전자는 226,000원(+6.86%)으로 거래대금 2조 199억원, SK하이닉스는 1,299,000원(+6.21%)으로 거래대금 2조 9,955억원을 기록하며 시장 1·2위다. 증권가가 "너무 싸다"며 목표가를 오히려 올리는 가운데, 대신증권은 두 종목 밸류에이션이 최근 5년 하위 5% 수준(P/E 3.3배·2.8배)이라고 짚었다. 주성엔지니어링(+3.99%)·케이씨텍(+12.53%)·예스티(+13.27%)·뉴파워프라즈마(+13.74%) 등 소부장주도 함께 올랐다.

**③ SK 지주사 급등, 전력기기·정유·건설 강세 vs 방산 LIG D&A 급락.** 행동주의 펀드 얼라인파트너스가 SK㈜ 지분 1.5% 보유를 공개하자 SK가 486,500원(+13.67%)으로 급등했다. LS ELECTRIC(+5.15%)은 3분기 사상 최대 실적과 100분기 연속 흑자를 발표했고, 석유와가스(+6.10%)·건설(+3.47%)도 강세다. 반면 LIG디펜스앤에어로스페이스는 방위사업청의 24개월 입찰참가 제한 의결로 477,000원(−12.96%)까지 밀렸고, 현대차(−0.48%)·기아(−1.96%) 등 자동차와 은행주는 약보합이다.

**④ 원/달러 1,329원대 보합, 일본 강세·중화권 약세.** 원/달러는 1,329.30원(+2.30원)으로 큰 변화가 없다. 닛케이225는 64,823.55(+1.17%)로 오전장을 마쳤고 항셍은 23,818.80(−0.21%)으로 약보합, 상해종합은 아직 오늘 값이 갱신되지 않았다. 미국 지수 선물은 S&P500 −0.04%·나스닥100 +0.27%로 혼조여서 국내 반등은 전날 과매도 해소 성격이 강하다.

## 1. 업종별 흐름

**상승 업종** — 반도체와반도체장비(+6.23%, 상승 149/하락 21)가 삼성전자(+6.86%)·SK하이닉스(+6.21%)와 케이씨텍(+12.53%)·예스티(+13.27%)·두산테스나(+9.96%)를 앞세워 가장 강하다. 석유와가스(+6.10%)는 OCI홀딩스(+7.71%)의 미국 탈중국 공급망 수혜 기대가, 전기장비(+3.71%, 상승 29/하락 3)는 LS ELECTRIC(+5.15%) 3분기 최대 실적과 가온전선(+4.96%)이 이끌었다. 건설(+3.47%)은 삼성E&A(+9.06%)·삼성물산(+6.36%)이 끌어올렸다.

**하락 업종** — 무역회사와판매업체(−2.27%)·다각화된통신서비스(−2.26%)·포장재(−1.67%)·도로와철도운송(−1.48%)·무선통신서비스(−1.14%) 등 방어 업종이 반도체 쏠림 속에 소외됐다. 방송과엔터테인먼트(−1.07%, 상승 19/하락 29)도 약하고, 개별로는 LIG디펜스앤에어로스페이스(−12.96%)·서진시스템(−6.42%)·기아(−1.96%)가 하락률 상위다.

**시장의 시선** — 오후장은 코스피 5,800선 안착 여부와 외국인 순매수 지속이 관건이다. 개인이 1조원 가까이 차익실현에 나선 만큼 장 후반 매물 소화가 필요하고, LIG D&A의 집행정지 가처분 대응, 오늘 밤 미국 실적(넷플릭스 시간외 −6% 등)과 국내 3분기 실적 시즌 본격화가 다음 변수다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 46종목

**1. SK하이닉스 (000660) 1,299,000원 · 948조 9,096억원 · +6.21% — 하루 만에 6% 급반등, 외국인 순매수 상위**
전날 솔리다임 중복상장 논란에 120만원선이 무너졌던 SK하이닉스가 AI 신용 우려 완화와 낙폭 과대 인식에 6% 넘게 반등했다. 거래대금은 2조 9,955억원으로 시장 1위이며, 전날 팔았던 외국인이 오늘은 삼성전기와 함께 순매수 1·2위로 사들였다. 대신증권은 SK하이닉스 P/E가 2.8배·P/B 1.35배로 최근 5년 하위 5% 수준이라고 분석했고, SK증권은 메모리 수요의 구조적 강세와 장기공급계약(LTA)을 근거로 "매수의 적기"라고 밝혔다. [리포트: Hanwha 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261020_Hanwha_2653114.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf)

**2. 삼성전자 (005930) 226,000원 · 1,321조 2,590억원 · +6.86% — '삼전닉스' 불기둥, 매수 사이드카 견인**
삼성전자가 장중 7% 가까이 오르며 코스피 매수 사이드카 발동을 이끌었고, 거래대금은 2조 199억원이다. 증권가에서는 "너무 싸다"며 반도체 대형주 목표주가를 오히려 올리는 움직임이 나왔고, 대신증권은 P/E 3.3배·P/B 1.34배로 5년 하위 5% 밸류에이션이라고 짚었다. KB증권은 전날 리포트에서 투자의견 Buy·목표주가 600,000원을 제시했다. 우선주 삼성전자우도 +4.16%로 동반 강세다. [리포트: KB 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261020_KB_4010450923.pdf) · [리포트: KB 2026-10-15](https://woooty69.github.io/hw-pdf-arch-026/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261015_KB_1138464.pdf) · [리포트: KB 2026-10-13](https://woooty69.github.io/hw-pdf-arch-027/%5B%EA%B8%89%EB%9D%BD%20%EC%BD%94%EB%A9%98%ED%8A%B8%5D%20W%EC%9E%90%20%EB%B0%98%EB%93%B1%EC%9D%98%20%EB%91%90%20%EB%B2%88%EC%A7%B8%20%EB%B0%94%EB%8B%A5%20%ED%83%90%EC%83%89%EF%BC%BB005930%EF%BC%BD_20261013_KB_4010240010.pdf)

**3. 삼성전기 (009150) 1,189,000원 · 88조 8,108억원 · +2.94% — 외국인 순매수 1위, BT기판 쇼티지 리포트 잇따라**
전날 공시한 3,605억원 규모 패키지기판 공급계약 효과가 이어지며 외국인 순매수 1위에 올랐고 거래대금은 4,147억원으로 시장 3위다. 키움증권은 "공시의 의미: BT기판 쇼티지 시대 개막" 자료를 냈고, iM증권은 MLCC 공급 리드타임이 범용 20주·고용량 23주로 연초보다 7주 길어졌다며 고용량 MLCC의 '레벨업'을 강조했다. IBK투자증권은 3분기 영업이익 6,668억원을 예상하며 목표주가 1,750,000원을 유지했다. [리포트: iM 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261020_iM_196857.pdf) · [리포트: Mirae Asset 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261020_Mirae%2BAsset_4042147914.pdf) · [리포트: MERITZ 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EA%B8%B0%EF%BC%BB009150%EF%BC%BD_20261020_MERITZ_2653111.pdf)

**4. SK스퀘어 (402340) 788,000원 · 103조 9,561억원 · +6.34% — 하이닉스 반등·SK㈜ 행동주의 이슈에 동반 급등**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
