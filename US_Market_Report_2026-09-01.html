### 2026년 9월 1일(화) 작성 · 미국 정규장: 8월 31일(월) 마감

## 🗓 시장 요약

**① 미·이란 교전이 재개됐다 — 8월의 마지막 거래일을 지배한 사건**
미군이 전날 **호르무즈 해협 내 이란 라라크섬의 로켓 발사대 2곳을 공습**했다. 미국이 이란 내 군사시설 공격을 공개적으로 인정한 것은 **7월 말 이후 처음**이다. 이란은 즉각 **요르단과 아랍에미리트(UAE) 내 미군 기지를 미사일·드론으로 반격**했다. 트럼프 대통령은 이에 대해 **"강력 타격할 것"**이라며 추가 보복을 예고했다고 폭스뉴스가 전했다. 불과 사흘 전 미 중부사령부가 **"호르무즈 기뢰 제거를 성공적으로 완료했다"**고 발표하며 진정 국면으로 읽혔던 흐름이 하루아침에 뒤집혔다.

**② 유가가 먼저 반응했다 — WTI +2.83%, 브렌트 90달러 돌파**
WTI는 배럴당 **\$85.76(+2.83%)**, 브렌트유는 **\$90.49(+2.7%)**로 마감했다. 브렌트가 90달러를 넘은 것이 상징적이다. **지난주 WTI가 −4.20%, 브렌트가 −5%대로 빠지며 되돌렸던 중동 프리미엄이 하루 만에 절반 이상 복원**됐다. 공급 차질 우려의 핵심은 호르무즈 해협이며, 이 통로가 다시 위험 변수로 돌아왔다는 점이 유가의 하방을 막는다.

**③ 유가 상승은 곧바로 금리 인상 기대로 번졌다 — 9월 인상 확률 64.4%**
CME 페드워치 기준 9월 FOMC에서 기준금리가 **3.50~3.75%에서 3.75~4.00%로 0.25%p 인상**될 확률은 **64.4%**(동결 35.6%)까지 올랐다. 장중에는 **65.9%**를 찍었다. 불과 사흘 전 워시 의장의 잭슨홀 연설 직후가 **57.5%**였으니, 유가 하나로 7%p가 더 붙은 셈이다. 10년물 금리는 **4.752%(+3.0bp)**로 올라 **2025년 1월 이후 최고 수준**에 근접했고, 30년물도 **5.244%(+3.6bp)**를 기록했다.

**④ 그런데 2년물은 오히려 내렸다 — 베어 스티프닝**
정책 금리에 가장 민감한 **2년물은 4.344%로 0.4bp 하락**했다. 10년물이 3bp 오르는 동안 단기물은 제자리였다는 뜻이며, **10-2년 스프레드가 31.3bp로 4.2bp 확대**됐다. 8/28 워시 연설 당일 2년물이 11.8bp 급등하며 나타났던 **플래트닝이 이날 정확히 반대로 돌아섰다.** 시장이 이번 금리 상승을 '정책금리 경로'가 아니라 **'유가발 인플레이션 프리미엄'**으로 읽었다는 신호다.

**⑤ 지수는 다우만 크게 빠졌다 — 나스닥은 −0.12%로 방어**
다우존스가 **−374.09p(−0.70%)**로 가장 크게 밀렸고, S&P 500은 **−0.33%**, 나스닥은 **−0.12%**에 그쳤다. 다우 하락은 **알파벳 −2.13%**와 골드만삭스 등 금융주 약세가 주도했다. 반면 **필라델피아 반도체지수는 +0.57%로 홀로 올랐다.** 엔비디아 **+1.48%**, 마이크론 **+2.77%**, SK하이닉스 ADR **+2.20%**로 메모리·AI 반도체가 지정학 리스크를 밀어냈다. 여기에 **테슬라가 +5.51% 급등**해 나스닥 낙폭을 지웠다.

**⑥ 8월 성적표는 좋았다 — 다우 5개월 연속 상승**
하루 하락에도 **8월 월간으로는 3대 지수가 모두 올랐다.** 다우 **+1.34%**, S&P 500 **+2.62%**, 나스닥 **+3.93%**. 다우는 **5개월 연속 월간 상승**이자 **최근 16개월 중 15개월 상승**이다. 다만 다음 달이 문제다. 블룸버그 집계로 **최근 30년간 S&P 500의 9월 평균 등락률은 −0.8%로 12개월 중 최악**이며, 나머지 11개월 평균 **+0.9%**와 대비된다.

**⑦ 한국은 3.55% 급락을 되돌렸다 — 자사주가 지수를 살렸다**
코스피는 장중 **−3.55%까지 급락**했다가 **+0.46%(6,820.02)**로 상승 반전 마감했다. 반전의 주체는 **기타법인 1조 5,773억원 순매수** — 삼성전자와 SK하이닉스의 **자사주 매입 물량**이다. 개인(−1,462억), 외국인(−6,404억), 기관(−7,922억)이 **셋 다 순매도**한 날에 자사주 하나가 지수를 뒤집었다. **SK하이닉스는 외국인 순매도 1위**였는데도 **+1.27%(1,674,000원)** 올랐다. 코스닥은 **−0.49%(834.29)**. 원/달러는 **1,368.6원(−3.9원)**으로 **13개월 만의 최저**(작년 7월 24일 이후)를 기록했다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  전기차·우주 (이날 최강)**
테슬라가 **+5.51%(\$367.95)** 급등했다. 주말 사이 일론 머스크 CEO가 **테슬라와 스페이스X가 각각 연간 100기가와트(GW) 규모의 태양광 생산 능력을 확보 중**이라고 밝힌 것이 방아쇠였다. 같은 날 텍사스 오스틴에서 예정된 **'사이버캡' 출시**와 FSD 개선 기대도 겹쳤다. 스페이스X는 **+1.55%**.

**상승 ②  메모리·AI 반도체**
SOX **+0.57%**, 마이크론 **+2.77%**, SK하이닉스 ADR **+2.20%**, 엔비디아 **+1.48%**. 지수가 일제히 빠진 날 반도체만 오른 것은 **지난주 SOX −2.35%(주간)의 과매도 되돌림**과 **SK하이닉스의 인텔 파운드리 검토 보도**가 함께 작용한 결과다. 반면 대만 TSMC는 **−0.53%**로 갈렸다.

**상승 ③  에너지·원자재 관련**
WTI **+2.83%(\$85.76)**, 브렌트 **+2.7%(\$90.49)**. 호르무즈 공급 차질 우려가 직접 재료다. 반대로 금은 **−0.72%(\$4,497.45)**로 하락해, 이날 상승은 **안전자산 수요가 아니라 공급 리스크**였음을 보여준다.

**하락 ①  빅테크·플랫폼 (다우·S&P 하락 주도)**
알파벳 **−2.13%**, 아마존 **−2.50%**, 마이크로소프트 **−1.22%**, 메타 **−0.98%**, 애플 **−0.89%**. **불과 사흘 전(8/28) 워시 연설 날 빅테크가 일제히 올랐던 것과 정확히 반대**다. 금리 상승 국면에서 빅테크가 방어 자산이 됐다가 하루 만에 매도 대상이 됐다.

**하락 ②  금융**
골드만삭스 등 금융주 약세가 다우 하락을 부추겼다. 10-2년 스프레드가 **31.3bp로 확대**됐는데도 은행주가 밀린 것은, 지정학 리스크에 따른 **위험자산 전반의 디리스킹**이 예대마진 개선 기대보다 컸다는 뜻이다.

**하락 ③  귀금속**
금 선물이 **−0.72%(\$4,497.45)**, 은이 **−0.84%**로 내렸다. 달러인덱스가 **99.37(−0.29%)**로 오히려 약해졌는데도 금이 빠졌다. **실질금리 상승(10년물 4.752%)**이 무이자 자산에 계속 부담으로 작용하고 있다.

> 🇰🇷 [전달] **코스피200 야간선물은 −0.31%(1,064.50)로 소폭 하락 마감**했다. 장중 궤적은 정규장 선물 종가(1,067.85) 아래 **1,067.00에서 출발해 고가 1,072.45(+0.43%)까지 올랐다가 저가 1,053.80(−1.32%)까지 밀린 뒤 회복**한 흐름이다. **미 지수 하락과 반도체 상승이라는 상반된 신호가 그대로 반영된 진폭**으로 읽힌다. 거래량 **22,349계약**, 미결제약정 **156,205계약(▼564)**으로 전 세션(23,973계약 / 155,518계약) 대비 거래는 줄고 미결제는 소폭 감소했다.
>
> [수급] 전일 국내는 **외국인 −6,404억, 기관 −7,922억, 개인 −1,462억**으로 3주체가 모두 순매도했고, **기타법인만 +1조 5,773억(자사주 매입)** 순매수했다. SK하이닉스는 **외국인 순매도 1위**(−21만 1,935주)였고 기관도 **−31만 4,294주**를 팔았지만 종가는 **+1.27%(1,674,000원)**였다. 거래대금 **9조 1,828억원**, 시가총액 **1,222조원**. 괴리율은 **+33.7% → +34.6%**로 확대됐는데, 원/달러가 **1,368.6원**으로 내렸는데도 벌어진 것은 **ADR(+2.20%)이 국내(+1.27%)보다 더 올랐기 때문**이다.

**[시장의 시선]** 이날 시장은 **하나의 사건에 두 방향으로 반응**했다. 미·이란 교전은 유가·금리에는 상방, 지수에는 하방이었는데 **반도체만 그 흐름에서 이탈해 +0.57%** 올랐다. 8/28과 비교하면 대칭이 선명하다 — 그날은 지수가 버티고 반도체(−3.47%)가 무너졌는데, 이날은 지수가 빠지고 반도체가 올랐다.

금리 구조도 뒤집혔다. 8/28은 2년물 +11.8bp의 **플래트닝**(정책금리 경로 재평가), 8/31은 2년물 −0.4bp / 10년물 +3.0bp의 **스티프닝**(인플레이션 프리미엄). **같은 방향의 금리 상승이라도 원인이 다르면 주식의 업종별 반응이 정반대로 나온다**는 점이 이틀에 걸쳐 확인됐다.

국내에서 확인된 사실은 **자사주의 위력**이다. 3주체가 모두 판 날 **기타법인 1조 5,773억원**이 −3.55%를 +0.46%로 되돌렸다. 다만 이것은 **수급이지 펀더멘털이 아니다** — 매입 프로그램이 이어지는 동안만 유효한 하단이다.

주시할 변수는 세 가지다 — **①미·이란 교전의 확전 여부와 호르무즈 통항**, **②9월 FOMC 인상 확률 64.4%**(9/16), **③9월 계절성**(최근 30년 S&P 500 9월 평균 −0.8%).

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 테슬라 (TSLA) +5.51% — \$367.95, 머스크의 '연 100GW 태양광' 발언이 만든 급등**
전기차 대표주가 **5.51% 급등(\$367.95, +\$19.20)**해 이날 상승률 1위에 올랐다. 촉발 재료는 주말 사이 나온 일론 머스크 CEO의 발언이다. 그는 **테슬라와 스페이스X가 각각 연간 100기가와트(GW) 규모의 태양광 생산 능력을 빠르게 확보 중**이라고 밝혔다.
숫자의 의미가 크다. 100GW는 대형 원전 수십 기에 해당하는 규모로, **AI 데이터센터 전력난이 최대 병목으로 지목되는 국면에서 '전력 공급자'라는 새로운 서사**를 만든다. 같은 날 스페이스X도 **+1.55%** 올랐다.
가까운 촉매도 겹쳤다. 이날 미국 텍사스주 오스틴에서 예정된 **'사이버캡' 출시**와 완전자율주행(FSD) 기술 개선에 대한 기대가 반영됐다. 3대 지수가 모두 하락한 날 5% 넘게 오른 것은 **개별 서사가 매크로를 이길 수 있다**는 사례다.

**2. 엔비디아 (NVDA) +1.48% — \$220.78, 지정학 리스크에도 반도체가 반등을 이끌었다**
AI 반도체 대장주가 **1.48% 상승(\$220.78, +\$3.23)**했다. 미·이란 교전 재개로 3대 지수가 모두 하락한 날의 상승이라 상대 강도가 두드러졌다.
직전 흐름과 대조하면 의미가 분명하다. 8/26 실적 발표에서 **다음 회계연도 매출 약 70% 증가**라는 가이던스를 내놓으며 8/27 **+8.74%** 급등했고, 8/28 **−4.58%** 반락한 뒤 이날 **+1.48%**로 되돌렸다. 8/28 하락의 원인이었던 **금리 인상 기대**는 이날 오히려 더 커졌는데(9월 인상 확률 57.5% → **64.4%**) 주가는 올랐다.
같은 실적 발표에서 회사가 남긴 경고도 여전히 유효하다. **메모리 부품 부족이 업계 성장 속도를 제약할 수 있다**는 내용인데, 이 경고가 이날 마이크론(**+2.77%**)·SK하이닉스 ADR(**+2.20%**)의 상승 재료로 뒤집혀 작동했다.
아직 해소되지 않은 사안은 **미국의 반도체 전면 관세 검토** 보도다. 필라델피아 반도체지수가 8/28 **−3.47%** 무너진 뒤 이날 **+0.57%**로 되돌린 폭이 낙폭의 6분의 1에 그친 것이 그 부담을 보여준다.

**3. 마이크론 (MU) +2.77% — 메모리가 이날 반도체 중 최강, 공급 부족 서사가 유지됐다**
미국 메모리 대표주가 **2.77% 올라** 주요 반도체주 가운데 가장 큰 폭으로 상승했다. 엔비디아(**+1.48%**), SOX(**+0.57%**)를 모두 웃돌았다.
배경에는 **메모리 공급 부족**이 있다. 엔비디아가 8/26 실적 발표에서 직접 **메모리 부품 부족이 업계 성장 속도를 제약할 수 있다**고 경고했고, 이 경고는 메모리 제조사에게는 **가격 협상력**으로 전환된다. 메모리 가격은 최근 **15% 이상 인상**됐다.
경쟁 구도에서는 부담도 있다. 중국 YMTC가 **2027년까지 세계 최대 낸드 생산업체**를 목표로 내걸었고, 배런스는 마이크론과 SK하이닉스 중 어느 쪽이 중국 경쟁에 더 취약한지를 분석 대상으로 삼았다. **단기 공급 부족과 중기 경쟁 심화가 동시에 작동**하는 국면이다.

**4. 알파벳 (GOOGL) −2.13% — \$339.20, 이날 다우·S&P 하락을 가장 크게 끌어내렸다**
구글 모회사가 **2.13% 하락(\$339.20, −\$7.39)**하며 지수 하락의 주된 원인이 됐다. 골드만삭스 등 금융주와 함께 다우존스 **−374.09p(−0.70%)** 낙폭을 만들었다.
사흘 전과 정반대다. 8/28 워시 의장의 잭슨홀 연설 당일 알파벳은 **+1.70%**로 S&P500 커뮤니케이션서비스 업종 상승을 가장 크게 뒷받침했다. **같은 종목이 사흘 만에 방어 자산에서 매도 대상으로 바뀐 것**이다.
AI 칩 조달 구도에서도 잡음이 남아 있다. 8/28 마벨테크놀로지는 **알파벳(구글)과 체결한 AI 칩 계약에서 매출이 발생하는 시점**을 둘러싼 의구심에 **−10.30%** 급락했다. 발주처인 알파벳 입장에서는 **자체 TPU 물량 확대라는 호재**이지만, 동시에 **AI 자본지출 회수 시점에 대한 시장의 의심이 공급망 전체로 번지고 있다**는 신호이기도 하다.
차이는 금리 상승의 성격에 있다. 8/28은 **2년물 +11.8bp**의 정책금리 재평가였고, 이날은 **10년물 +3.0bp·2년물 −0.4bp**의 유가발 장기금리 상승이었다. **장기 현금흐름 할인율에 직접 걸리는 것은 후자**이며, 그만큼 대형 성장주에 불리하게 작용했다.

**5. SK하이닉스 ADR (SKHY) +2.20% — \$164.58 (괴리율: +34.6%), 인텔 파운드리 카드가 나왔다**
ADR이 **2.20% 상승(\$164.58, +\$3.54)**했다. 장중 저가 **\$160.50**에서 고가 **\$165.07**까지 회복했고 거래량은 **1,202만 9,252주**였다. 시간외에서는 **\$164.20(−0.23%)**.
재료가 두 건 겹쳤다. 첫째, **SK하이닉스가 HBM 베이스 다이 공급처로 인텔 파운드리를 검토 중**이라는 보도가 나왔다(인텔 주가는 개장 전 1.5% 상승). 베이스 다이는 HBM 적층의 최하단 로직 칩으로, 지금까지 TSMC가 사실상 독점해 온 영역이다. 둘째, **일본에 추가 메모리 공장 건설을 검토** 중이라는 보도도 있었다. 8/27 인디애나 **40억 달러** 패키징 공장 기공식에 이어 **생산 거점 다변화가 연속 재료화**되고 있다.
국내 주가는 **+1.27%(1,674,000원)**로 올랐다. 다만 **외국인 순매도 1위(−21만 1,935주)**, 기관 **−31만 6,000주** 규모 매도가 나왔고 개인도 팔았다 — 상승을 만든 것은 **자사주 매입 물량**이다. 그 결과 괴리율은 **+33.7% → +34.6%**로 벌어졌다. 컨센서스 PER **4.79배**, 12개월 목표주가 **\$247.31**(애널리스트 14명, Strong Buy).

**6. 아마존 (AMZN) −2.50% — \$259.76, 빅테크 중 최대 낙폭**
아마존이 **2.50% 하락(\$259.76, −\$6.67)**해 주요 빅테크 가운데 가장 크게 밀렸다. 8/28에 **+4.00%**로 빅테크 최대 상승폭을 기록했던 종목이 사흘 만에 최대 낙폭으로 돌아섰다.
직접적 재료는 확인되지 않는다. 다만 이날 급등한 **유가(WTI +2.83%)**는 아마존에게 물류·배송 원가 상승 요인이다. 매출의 상당 부분이 물류 집약적 리테일에서 나오는 구조상, **유가 스파이크에 마진이 직접 노출**된다.
같은 날 **10년물이 4.752%**로 올라 밸류에이션 부담도 겹쳤다. **AWS라는 성장 서사와 리테일이라는 원가 구조가 반대 방향으로 당겨진 하루**로 해석된다.

**7. 애플 (AAPL) −0.89% — \$316.85, 아이폰 공개 8일 앞두고 조정**
애플이 **0.89% 하락(\$316.85, −\$2.85)**했다. 빅테크 중에서는 낙폭이 작은 편이었다.
가까운 이벤트가 있다. 애플은 **9월 9일 신형 아이폰을 공개**할 예정이며, 이 자리에서 **첫 폴더블폰**이 나올 것으로 알려졌다. 신제품 공개를 앞둔 구간에서는 통상 기대와 차익실현이 함께 나오는데, 이날은 후자가 소폭 우세했다.
공급망 측면의 변수도 있다. 메모리 가격이 **15% 이상** 오른 상황에서 폴더블 신제품의 부품 원가 부담이 커지며, 이는 **국내 메모리·디스플레이 업체와의 단가 협상**으로 이어질 수 있는 사안이다.

**8. 마이크로소프트 (MSFT) −1.22% — 장기금리 상승에 AI 자본지출 부담이 다시 부각**
마이크로소프트가 **1.22% 하락**했다. 8/28 **+1.68%**로 올랐던 것을 되돌렸다.
이날 반도체(SOX **+0.57%**)는 오르고 클라우드는 내렸다. **8/28과 정확히 뒤바뀐 구도**다. 그날은 "AI 자본지출의 부담은 칩이 지고 과실은 클라우드가 가져간다"는 해석이 가격에 찍혔는데, 이날은 그 반대였다.
차이를 만든 것은 **10년물 4.752%**라는 장기금리다. AI 인프라 투자는 회수 기간이 긴 자본지출이므로, **장기 할인율이 오르면 투자 주체(클라우드)의 밸류에이션이 먼저 압박**받는다. 반면 그 투자로 지금 매출을 인식하는 반도체는 상대적으로 방어됐다.

**9. 메타 (META) −0.98% — \$572.34, 광고 경기와 금리 사이에서 소폭 하락**
메타가 **0.98% 하락(\$572.34, −\$5.68)**했다. 알파벳(**−2.13%**)보다는 낙폭이 작았지만 같은 방향이었다.
광고 매출 비중이 높은 구조상 **유가 상승에 따른 소비 위축 우려**가 직접 리스크다. 이날 WTI가 **+2.83%** 오르며 인플레이션 재점화 경로가 다시 열렸고, 이는 광고주 예산 축소로 이어질 수 있는 경로다.
8/28에는 **+1.20%**로 올랐던 종목이다. 이틀 사이 빅테크 전반이 방어 자산 취급에서 위험 자산 취급으로 이동했고, 메타는 그 흐름을 평균적으로 따라갔다.

**10. TSMC (TSM) −0.53% — 반도체가 오른 날 홀로 내렸다**
대만 파운드리 대표주가 **0.53% 하락**했다. SOX가 **+0.57%** 오르고 엔비디아(**+1.48%**)·마이크론(**+2.77%**)·SK하이닉스 ADR(**+2.20%**)이 모두 상승한 날의 하락이라 방향이 갈렸다.
이유로 지목되는 것은 이날 나온 **SK하이닉스의 인텔 파운드리 검토 보도**다. HBM **베이스 다이**는 그동안 TSMC가 사실상 독점해 온 영역이며, SK하이닉스가 인텔로 물량 일부를 옮기는 시나리오는 **TSMC의 HBM 관련 매출에 직접 영향**을 준다.
규모 자체는 아직 검토 단계이고 확정된 계약이 아니다. 다만 **파운드리 독점 구조에 균열 가능성이 언급된 것만으로 주가가 반응**했다는 점이, 현재 시장이 AI 공급망의 집중도를 얼마나 민감하게 보고 있는지를 보여준다.

## 💬 섹션 3. 구루·기관 코멘트

- **CME 페드워치(9/16 FOMC):** 기준금리 **3.75~4.00% 인상 확률 64.4%**, 동결(3.50~3.75%) **35.6%**. 장중 한때 **65.9%**까지 반영. 8/28 워시 연설 직후(**57.5%**)에서 추가 상승했으며, 이번 상승분의 촉매는 연준 발언이 아니라 **유가**였다.
- **트럼프 대통령:** 이날 **"미국 금리가 너무 높다"**고 발언해 워시 의장 취임 후 처음으로 금리 인하를 간접 압박했다. **시장이 반영하는 인상 확률 64.4%와 정면으로 배치**되는 메시지다.
- **블룸버그(계절성 집계):** 최근 30년간 **S&P 500의 9월 평균 등락률은 −0.8%**로 12개월 중 가장 나쁘다. 나머지 11개월 평균은 **+0.9%**. 다만 최근 2년은 이 패턴을 거슬렀다.
- **채권시장 신호:** **10-2년 스프레드 31.3bp(+4.2bp)**. 8/28의 플래트닝이 하루 만에 스티프닝으로 전환됐다 — 시장이 이번 금리 상승을 **정책 경로가 아닌 인플레이션 프리미엄**으로 가격에 반영하고 있다는 해석이 가능하다.

## 📅 섹션 4. 일정 및 관전 포인트

- **⚔️ 미·이란 교전 — 최우선 변수:** 미군의 라라크섬 공습 → 이란의 요르단·UAE 미군기지 반격 → 트럼프의 **"강력 타격"** 예고로 확전 경로가 열려 있다. **호르무즈 해협 통항 여부**가 유가의 방향을 결정하며, 유가는 다시 금리와 연준 경로로 연결된다. 사흘 전 "기뢰 제거 완료" 발표로 진정 국면이 읽혔다가 뒤집힌 만큼, **뉴스 하나에 방향이 바뀌는 구간**이다.
- **🏛 9월 FOMC(9/15~16) — 인상 확률 64.4%:** 워시 의장의 첫 정책회의다. 확률이 이미 3분의 2에 근접했으므로, **인상 자체보다 점도표·성명 문구**가 변수가 된다. 이번 주 발표되는 **8월 고용지표**가 확률을 다시 흔들 1차 관문이다.
- **🇰🇷 자사주 매입의 지속성:** 전일 코스피 반전을 만든 것은 **기타법인 1조 5,773억원**이다. SK하이닉스는 **약 2,407만 주(발행주식의 3.3%) 전량 소각**을 포함한 매입 프로그램을, 삼성전자는 **최대 110조원 규모**의 주주환원을 예고했다. **프로그램이 진행되는 동안은 지수 하단이 지지되지만, 이는 펀더멘털이 아닌 수급**이라는 점을 구분해서 볼 필요가 있다.
- **💱 원/달러 1,368.6원 — 13개월 최저:** 작년 7월 24일 이후 처음으로 1360원대에 진입했다. 원화 강세는 외국인 수급에 우호적이지만, 전일에도 외국인은 **6,404억원**을 순매도했다. **환율 유인보다 관세·지정학 리스크가 우위**인 구도가 이어지는지가 관전 포인트다.
- **🔧 SK하이닉스 인텔 파운드리 검토:** HBM **베이스 다이**를 TSMC 외 공급처로 넓히는 시나리오다. 확정 시 **원가 구조와 공급 안정성 양쪽에 영향**을 주는 사안이며, 인텔·TSMC 주가가 이미 반대 방향으로 반응했다. 검토 단계라는 점을 감안해 후속 보도를 확인할 필요가 있다.
- **📌 SK하이닉스 미확정 공시 2건:** ①솔리다임 5조 프리IPO → **재공시 9/4**, ②중국 충칭공장 지분 4조 매각 → **재공시 9/9**. 이번 주와 다음 주에 걸쳐 연속으로 예정돼 있다.
