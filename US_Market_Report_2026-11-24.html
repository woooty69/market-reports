## 🗓 시장 요약

**① 나스닥 24,089.56(+6.51%)·S&P500 7,237.17(+4.73%)·다우 49,595.31(+3.01%) — 2025년 4월 이후 최고의 하루, 7거래일 연속 하락 종료**
나스닥은 **24,089.56(+1,471.83, +6.51%)**, S&P500은 **7,237.17(+326.78, +4.73%)**, 다우는 **49,595.31(+1,447.98, +3.01%)**로 마감했다. 세 지수 모두 2025년 4월 이후 가장 큰 하루 상승률이다. S&P500은 팬데믹 급락 이후 가장 길었던 7거래일 연속 하락을 끊었다. 장 시작부터 분위기가 달랐다. 인베스코 QQQ는 8% 가까이 오른 채 출발해 1999년 상장 이후 가장 큰 시가 상승을 기록했고, SPDR S&P500 ETF(SPY)의 5% 안팎 갭 상승은 1993년 이후 월요일 기준으로 2008년 10월 13일 다음 가는 수준이었다. 나스닥100은 **26,746.10(+1,717.11, +6.86%)**, 러셀2000은 **2,669.66(+87.86, +3.40%)**, VIX는 **26.71(−9.18, −25.58%)**로 공포가 빠르게 식었다.

**② 젠슨 황 복귀 — 엔비디아 \$165.05(+31.48%), 2003년 5월 이후 최대 상승·SOX 9,588.05(+14.03%)**
엔비디아 이사회는 젠슨 황을 사장 겸 CEO로 복귀시킨다고 발표했다. 이사회는 미국 정부 고위층의 의견을 들었고 그 결과 황의 복귀가 국가안보 위험이 없다고 확신한다고 밝혔으며, 국가안보·수출통제위원회를 새로 만들고 황과 메가스피드 임원의 관계에 대한 독립 조사는 끝까지 진행하기로 했다. 엔비디아(NVDA)는 **\$165.05(+\$39.52, +31.48%)**로 마감해 2003년 5월 이후 가장 큰 하루 상승률을 냈고, 장중에는 \$171.50(+36.62%)까지 올랐다. SOX는 **9,588.05(+1,179.46, +14.03%)**로 지난주 낙폭(−10.73%)을 하루에 되찾았다. 마이크론(MU) **\$707.70(+19.04%)**, AMD **\$453.46(+6.85%)**, 브로드컴(AVGO) **\$313.55(+3.00%)**가 뒤따랐다. 노무라의 찰리 매켈리곳은 숏커버와 옵션 딜러의 헤지 청산이 만든 '기계적 반등'이라며 아무것도 보장하지 않는다고 경계했다.

**③ 미국채 — 2년물 4.63%(보합)·10년물 4.92%(보합)·30년물 5.29%(−2bp)**
미 재무부 고시 기준 2년물은 **4.63%(+0.0bp)**, 10년물은 **4.92%(+0.0bp)**, 30년물은 **5.29%(−2.0bp)**로 마감했다. 주식이 급반등했지만 채권 금리는 금요일 급락 수준에서 거의 움직이지 않았다. 10년물은 장중 4.908~4.984% 사이에서 오갔다. 시장은 여전히 12월 9일 FOMC의 금리 인상을 기본값으로 보지만, 폴리마켓의 인상 확률은 91% 안팎으로 11월 12일의 98%보다 낮아졌다. 이번 주에는 수요일(현지) PCE 물가가 인상 폭을 가늠할 변수다.

**④ WTI \$80.21(−3.84%)·브렌트 \$90.71(−2.01%) — 3주 연속 하락 흐름 연장**
WTI 1월물은 **\$80.21(−\$3.20, −3.84%)**, 브렌트 1월물은 **\$90.71(−\$1.86, −2.01%)**로 내렸다. WTI는 장중 \$79.87까지 밀리며 \$80선을 시험했다. 금요일 주식 투매가 원자재로 번진 흐름이 이어졌고, 3주 연속 하락 흐름도 연장됐다. 예멘 후티 반군이 일요일 사우디 정유시설 공격을 주장하는 등 걸프 해역 선박 공격이 계속돼 낙폭은 제한됐다. 비트코인은 토요일 \$55,149까지 밀린 뒤 월요일 \$63,000 위로 되돌아왔지만 11월 하락률은 여전히 18%를 넘는다.

**⑤ 크라우드스트라이크, 지스케일러 \$439억 인수 — CRWD \$208.97(−8.92%)·ZS \$229.24(+17.67%)**
사이버보안 업계에서는 대형 인수가 나왔다. 크라우드스트라이크(CRWD)가 지스케일러(ZS)를 \$439억에 인수하기로 하자 인수 측 주가는 **\$208.97(−\$20.47, −8.92%)**로 밀렸고 피인수 측 지스케일러는 **\$229.24(+\$34.42, +17.67%)**로 뛰었다. 제이 차우드리 지스케일러 CEO는 회사를 계속 이끌고 크라우드스트라이크 이사회에 합류한다.

**⑥ 🇰🇷 SK하이닉스 ADR \$124.28(+20.00%)·코스피200 야간선물 777.95(+7.06%, 11/23 세션 06:00 확정)**

SK하이닉스 ADR은 **\$124.28(+\$20.71, +20.00%)**로 마감해 지난주 이틀 낙폭을 거의 되찾았다. 마이크론 +19.04%와 같은 폭으로 HBM 관련주가 동반 급등했다. 코스피200 야간선물은 06:00 확정 종가 777.95로 주간 종가 726.65 대비 +51.30포인트(+7.06%) 올랐고, 장중 고가는 784.75였다. 국내 주간 선물은 월요일 726.65로 금요일 야간 종가 700.00보다는 높게 끝났다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) +31.48% — 젠슨 황 CEO 복귀, 2003년 5월 이후 최대 상승률**
엔비디아는 \$165.05(+\$39.52, +31.48%)로 마감하며 7거래일 연속 하락을 끝냈다. 이사회는 젠슨 황을 사장 겸 CEO로 복귀시키면서 미국 정부 고위층의 의견을 근거로 국가안보 위험이 없다고 확신한다고 발표했고, 국가안보·수출통제위원회를 새로 설치했다. 황은 깊은 겸손과 새로운 각오로 이 책임을 맡겠다고 밝혔고, 트럼프 대통령은 트루스소셜에 '정말 훌륭한 결정'이라고 썼다. 장중 고가 \$171.50(+36.62%) 기준으로는 비스포크 집계 시가총액이 1조 달러 넘게 늘었다. 황과 메가스피드 임원의 관계에 대한 독립 조사는 계속 진행된다.

**2. 마이크론 (MU) +19.04% — 메모리 부족 2028년까지 전망 재조명, \$700선 회복**
마이크론은 \$707.70(+\$113.19, +19.04%)로 마감해 금요일 내준 \$600선을 넘어 \$700선까지 되찾았다. 시가 \$690.72에서 출발해 장중 \$720.69(+21.22%)까지 올랐다. 회사가 지난주 밝힌 메모리 공급 부족 2028년까지 지속 전망과 엔비디아의 데이터센터 매출 \$1,076억(+110%)이 다시 HBM 수요의 근거로 부각됐다. 엔비디아 리더십 불확실성이 걷히자 가장 많이 빠졌던 메모리주로 매수가 몰렸고, SK하이닉스 ADR도 \$124.28(+20.00%)로 같은 흐름을 보였다.

**3. 코어위브 (CRWV) +22.32% — 최대 공급사·투자자 엔비디아 리더십 복원에 52주 저점서 급반등**
코어위브는 \$48.33(+\$8.82, +22.32%)로 마감했다. 금요일 52주 저점(\$39.39)을 새로 쓴 뒤 하루 만에 장중 \$51.90(+31.36%)까지 반등했다. 엔비디아는 코어위브의 핵심 GPU 공급사이자 주요 주주여서 젠슨 황 복귀 발표의 수혜가 직접적으로 반영됐다. 3분기 매출 \$36억6,000만(+168%)에도 4분기 이자비용 \$10억5,000만~11억5,000만 전망이 부채 우려를 키웠던 만큼, 연초 대비로는 여전히 30% 안팎 하락한 상태다.

**4. 크라우드스트라이크 (CRWD) −8.92% — 지스케일러 \$439억 인수 발표, 인수 부담에 하락**
크라우드스트라이크는 \$208.97(−\$20.47, −8.92%)로 반등장에서 역행했다. 회사는 클라우드 보안 업체 지스케일러를 \$439억에 인수한다고 발표했고, 사이버보안 업계 최대급 거래에 따른 희석과 통합 부담이 주가를 눌렀다. 장중 저가는 \$200.53(−12.60%)까지 밀렸다. 제이 차우드리 지스케일러 CEO는 계속 지스케일러를 이끌며 크라우드스트라이크 이사회에 합류한다.

**5. 지스케일러 (ZS) +17.67% — 크라우드스트라이크의 \$439억 인수 대상, 장중 +27%**
지스케일러는 \$229.24(+\$34.42, +17.67%)로 마감했다. 크라우드스트라이크가 \$439억에 회사를 인수하기로 하면서 인수 프리미엄이 반영됐고, 장중에는 \$247.90(+27.25%)까지 치솟았다. 종가는 고점보다 낮아 거래 성사 가능성과 규제 심사 기간에 대한 할인이 일부 남았다. 창업자 제이 차우드리는 인수 뒤에도 지스케일러를 이끌고 크라우드스트라이크 이사회에 들어간다.

**6. 오틀리 (OTLY) +109.08% — 벨린베스트 지분 42.6%로 확대, 주당 \$4.13 공개매수 제안**
오틀리는 \$14.50(+\$7.57, +109.08%)로 하루 만에 두 배 넘게 뛰었다. 회사는 최대주주 벨린베스트가 차이나리소시스 보유 지분을 인수해 지분율을 약 42.6%로 높였다고 발표했고, 스웨덴 규정에 따라 ADS당 \$4.13의 공개매수 제안도 나왔다. 이사회는 주주들에게 응하지 말라고 권고했지만, 지배구조 변화 기대에 매수가 몰리며 장중 \$14.80(+113.41%)까지 올랐다. 오틀리는 2021년 5월 상장 이후 98% 가까이 떨어졌던 종목이다.

**7. ARM (ARM) +16.08% — 르네 하스 CEO 2033년까지 계약 연장**
ARM은 \$176.67(+\$24.47, +16.08%)로 마감했다. 회사는 르네 하스 CEO의 계약을 2033년까지 연장했다고 밝혔다. 하스는 젠슨 황 사임 이후 엔비디아 후임 후보로 거론되던 인물이어서 리더십 불확실성이 두 회사 모두에서 해소된 셈이다. 장중에는 \$183.57(+20.61%)까지 올랐고, 반도체 지수 +14.03% 반등에도 함께 올라탔다.

**8. 네비우스 (NBIS) +20.28% — 엔비디아 리더십 복원에 네오클라우드 동반 급반등**
네비우스는 \$97.80(+\$16.49, +20.28%)로 마감했다. 시가 \$110.00에서 출발해 장중 \$110.03(+35.32%)까지 올랐다가 상승폭을 일부 반납했다. 엔비디아의 젠슨 황 복귀 발표로 GPU 공급 일정과 AI 인프라 투자가 흔들릴 것이란 우려가 줄면서 코어위브(+22.32%)·어플라이드 디지털(+20.28%)과 함께 올랐다. 이달 제3자 데이터센터 증설 지연으로 2026년 매출 전망을 낮춘 부담은 남아 있다.

**9. 스페이스X (SPCX) +4.35% — 제프리스 커버리지 개시 '매수'·목표주가 \$210**
스페이스X는 \$133.35(+\$5.56, +4.35%)로 마감했다. 제프리스가 매수 의견과 목표주가 \$210로 커버리지를 시작하며 약 50%의 상승 여력을 제시했다. 스페이스X를 다루는 40개 은행 가운데 32곳이 매수 이상 의견이다. 시가 \$140.04에서 장중 \$141.86(+11.01%)까지 올랐지만 오후 들어 상승폭이 줄었다.

**10. 앤트로픽 (ANT) −1.43% — 반등장 속 약세, 20년간 \$9,000억 컴퓨팅 투자 약속에 부채 부담 의식**
앤트로픽은 \$87.64(−\$1.27, −1.43%)로 AI 종목 급반등 속에서도 내렸다. 시가 \$93.64(+5.32%)에서 출발했지만 장중 \$84.61까지 밀려 공모가 \$83과의 거리가 다시 좁혀졌다. 회사는 향후 20년 동안 약 \$9,000억 규모의 컴퓨팅·인프라 지출을 약속했고, 투자자들은 회사채가 투기등급으로 평가될 가능성을 염두에 두고 있다. 상장 첫날 시가 \$111.50과 비교하면 20% 넘게 낮다.
