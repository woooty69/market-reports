## 🗓 시장 요약

**① 코스피 1.39% 오른 5,137.89…장중 5,000선 붕괴 뒤 고가 마감, 외국인은 닷새째 매도**
코스피는 0.45% 오른 5,090.04로 출발했으나 오전 외국인·연기금 매도로 4,963.61까지 밀린 뒤 오후 반등해 고가인 5,137.89로 장을 마쳤다. 하루 고저 차는 174포인트였다. 외국인은 4,086억원, 개인은 560억원을 팔았고 기관은 120억원 순매수에 그쳐 자사주 매입 등 기타법인 매수가 하방을 받친 하루였다. 한국 수출이 연간 1조달러를 처음 넘어 세계 4번째로 '1조달러 클럽'에 들었다는 소식도 투자심리에 보탬이 됐다.

**② 반도체: SK하이닉스 +2.27%·삼성전기 +7.53%…밤사이 FT '삼성·TSMC 중국 출하 중단' 보도는 부담**
SK하이닉스는 2027년 생산물량을 고객사가 선점하며 공급 부족이 길어진다는 분석과 HBM용 하이브리드 본더를 베시(BESI)에 일괄 발주한다는 보도 속에 1,170,000원으로 올랐다. 삼성전기는 엔비디아가 기판 계약을 늘리고 생산능력 확대를 지원한다는 기대가 이어지며 7.53% 올라 871,000원, 거래대금 8,063억원을 기록했다. 삼성전자는 194,500원(−0.10%)으로 보합이었으나, 장 마감 뒤 영국 FT가 "삼성전자·TSMC가 중국 고객사에 반도체 출하 중단을 통보했다"고 보도했고 밤사이 필라델피아 반도체지수가 2.42% 내려 오늘 반도체주에는 부담이다.

**③ 강세 업종: 엔터·여행·카지노·화장품 — '한한령' 완화 기대 이틀째**
한중 FTA 서비스·투자 분야 후속협상 타결과 한중 문화교류 확대 합의 보도가 이어지며 방송과엔터테인먼트(+10.18%, 43종목 상승·5종목 하락)·호텔,레스토랑,레저(+5.86%)·화장품(+4.45%)·백화점과일반상점(+3.72%)이 올랐다. CJ ENM(+26.69%)·스튜디오드래곤(+29.96%, 상한가)·하이브(+12.73%)·에스엠(+7.28%)이 엔터를, 하나투어(+18.05%)·제주항공(+11.60%)·파라다이스(+10.60%)·GKL(+11.02%)이 여행·카지노를, 한국화장품(+29.98%)·달바글로벌(+12.27%)·아모레퍼시픽(+7.96%)이 화장품을 이끌었다. 시총 1,000억원 이상·+10% 이상 급등 종목이 34개에 달했다.

**④ 약세 업종: 통신·IT서비스·정유·보험 — SK텔레콤 −4.24%, 삼성에스디에스 −6.71%**
다각화된통신서비스(−3.57%)는 앤트로픽 상장으로 지분가치(약 4.3조원)가 부각됐던 SK텔레콤이 오히려 4.24% 내리며 '재료 소멸' 매도가 나왔고 KT(−4.34%)도 약했다. IT서비스(−1.80%)는 삼성에스디에스(−6.71%, 거래대금 1,132억원)·LG씨엔에스(−2.34%)가 끌어내렸다. 국제유가가 3% 내리며 석유와가스(−1.09%)에서 SK이노베이션(−5.00%)·S-Oil(−3.99%)이 하락했고, 손해보험(−1.78%)은 삼성화재(−3.51%)가 미래 손해율 가정을 낮춘 보험사 제재 보도 속에 내렸다. 현대모비스(−4.35%)·NHN(−10.12%)도 약세였다.

**⑤ 환율·해외: 원/달러 1,334원, 밤사이 미국 3대 지수 2%대 급락·VIX 28**
원/달러는 서울 외환시장에서 3.0원 내린 1,330.0원에 마감했고 하나은행 고시 기준 1,334.20원으로 안정적이었다. 밤사이 미국은 앤트로픽 상장 첫날임에도 다우가 1,101.11포인트(−2.19%), S&P500이 2.02%, 나스닥이 2.25% 내렸고 필라델피아 반도체지수도 2.42% 빠졌다. AMD가 중국과의 연계로 미국 당국 조사 대상이 될 수 있다는 보도에 하락했고, VIX가 14.05% 뛴 28.01을 기록해 변동성 경계가 커졌다. 트럼프 대통령과 시진핑 주석의 양자회담(호르무즈 석유 수송 공감대 등)은 국내 장중 재료였다.

**⑥ 코스닥: 3.32%↑ 684.81…기관 2,257억원 순매수, 콘텐츠·반도체 장비 강세**
코스닥은 장중 650.39까지 밀렸다가 기관 매수로 684.81에 마감했다. 스튜디오드래곤·위메이드맥스·에이스토리·노랑풍선 등 콘텐츠·여행주가 상한가를 기록했고, 대신증권이 신규 수주 강세를 짚은 HPSP(+7.66%)와 테스(+7.46%)·GST(+13.05%)·하나머티리얼즈(+10.70%) 등 반도체 장비·소재주도 올랐다. 자바 취약점 '자바포셸'(위험도 9.2) 이슈로 안랩이 12.12% 급등했다. 반면 미래에셋벤처투자(−8.80%)·네오셈(−6.53%)·엘리스(−5.86%)는 약했다.

## 1. 업종별 흐름

> 본 리포트는 공개 데이터·보도·증권사 리포트를 정리한 참고 자료이며 투자 권유가 아닙니다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
