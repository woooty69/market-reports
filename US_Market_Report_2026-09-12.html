## 🗓 시장 요약

**① 닷새 만의 반등 — 근원 CPI가 예상을 웃돌았는데도 증시는 '방향이 정해졌다'며 안도했다**
뉴욕 3대 지수가 4거래일 연속 하락을 끊고 반등했다. 다우가 **509.19포인트(+0.98%)** 오른 **52,573.29**, S&P 500이 **+0.86%(7,656.98)**, 나스닥이 **+0.96%(26,333.04)**로 마감했고 러셀 2000은 **+0.45%(2,903)**로 이날도 주요 지수 중 가장 약했다. 개장 직후 S&P 500 **+0.96%**, 다우 **+1.15%**로 출발한 뒤 장중 내내 상승권을 지켰다(TheStreet). 8월 CPI는 전월 대비 **+0.4%**, 전년 대비 **+3.4%**로 컨센서스에 부합했지만 근원 CPI가 전월 대비 **+0.3%**(예상 0.2%)로 웃돌았고, CME 페드워치의 9월 인상 확률은 발표 직후 **91.6%**까지 치솟았다가 **86.5%**로 마감했다(전날 72%, 이데일리). 그럼에도 주가가 오른 것은 시장이 9월 인상을 이미 가격에 넣었고, 유가가 100달러 선으로 후퇴하면서 '인플레 공포'가 한 단계 식었기 때문이다. 다만 주간으로는 S&P 500 **−0.8%**, 다우 **−1.6%**, 나스닥 **−0.7%**로 하락 마감했다(해머스톤). 미시간대 9월 소비자심리 예비치는 **47.8**(예상 51.0)로 급락했고 1년 기대인플레이션은 **4.6%**(8월 4.0%)로 뛰었다 — 반등의 재료가 '경기 확신'이 아니라 '불확실성 해소'였다는 뜻이다.

**② WTI 9거래일 만의 하락 — 호르무즈 협상 기대와 IEA의 수요 전망 하향이 겹쳤다**
WTI 10월물은 **\$100.05(−2.37%, −\$2.43)**로 9거래일 만에 하락 전환했고, 브렌트 11월물은 **\$104.61(−2.81%)**로 6거래일 만에 내렸다(연합뉴스·이투데이). 밤사이 브렌트가 **110달러**에 육박했던 것을 감안하면 하루 낙폭보다 '고점 되돌림' 성격이 강하다. 걸프 국가들이 이란과 호르무즈 해협 문제를 논의할 가능성이 제기됐고, 국제에너지기구(IEA)는 올해 세계 석유 공급이 하루 **570만 배럴(약 6%)** 줄어들 것으로 보면서 소비자가 공급 부족에 맞춰 수요를 더 줄여야 한다고 전망했다(해머스톤·글로벌이코노믹). 다만 유가 불안은 진행형이다 — 사우디가 여러 차례 공격받은 동서(East-West) 송유관을 예방적으로 폐쇄했고, 미국 디젤 소매가는 갤런당 **6달러**를 처음 넘었으며, 정유주 발레로(VLO)·필립스66(PSX)·마라톤페트롤리엄(MPC)은 52주 신고가를 찍었다. 주간으로 WTI는 **약 10%**, 브렌트는 **약 9%** 올랐다. 베선트 재무장관은 이란 자금줄과 연관된 **'대형 은행'을 월요일에 제재**하겠다고 예고해 지정학 변수는 주말에도 살아 있다(CNBC).

**③ 채권은 주식만큼 안도하지 않았다 — 2년물 4.63%로 2024년 7월 이후 최고, 10년물은 장중 5% 재시도**
통화정책에 민감한 2년물은 **4.630%(+6.3bp)**로 2024년 7월 이후 최고치를 경신했고, 10년물은 장중 **4.978%**까지 오른 뒤 **4.969%(+1.7bp)**로 마감했다(초이스뉴스·이데일리). 30년물은 전날 2004년 이후 최고(5.360%)에서 소폭 내린 **5.34%대**였다. 즉 CPI 이후 커브는 **단기물 상승·장기물 보합의 베어 플래트닝**이었고, 10-2년 스프레드는 30bp대로 좁혀졌다. 블룸버그에 따르면 시장은 연말까지 **두 차례 인상**을 완전히 반영했다. 프린시펄의 시마 샤는 "논쟁이 '올리느냐'에서 '몇 번 올리느냐'로 옮겨갔다"고 했고, 레이먼드제임스의 래리 애덤은 1970년 이후 10년물이 6개월 이상 연속 오른 사례가 다섯 번뿐이며 투기적 순매도 포지션이 사상 최고에 가까워 "움직임이 갈수록 과도해 보인다"고 반론했다. 글로벌 동조도 뚜렷하다 — 독일 10년물 **3.51%**(2009년 이후 최고), 일본 10년물 **2.985%**(1996년 이후 최고), 호주 10년물은 2011년 이후 최고다. LSEG 리퍼 집계로 미국 주식펀드는 한 주간 **322억 7,000만 달러** 순유출, 대형주 펀드는 **404억 4,000만 달러**로 사상 최대 주간 순유출을 기록했다(해머스톤).

**④ AI 인프라가 다시 달렸다 — 오라클의 '수주→매출 증명'이 델·HPE·네트워킹으로 번졌다**
오라클(ORCL)이 전날 장 마감 후 내놓은 FY2027 1분기 실적(매출 **193억 5,000만 달러, +30%**, OCI 매출 **74억 달러, +121%**, RPO **6,640억 달러**)이 이날 AI 하드웨어 전반의 촉매가 됐다. 델테크놀로지스(DELL) **+11.98%(\$567.29)**, 휴렛팩커드엔터프라이즈(HPE) **+12.44%(\$62.09)**, 넷앱(NTAP) **+8.54%**, CDW(CDW) **+7.85%**, 슈퍼마이크로(SMCI) **+7.28%**, 아리스타네트웍스(ANET) **+5.61%**, 시스코(CSCO) **+4.37%**, 시에나(CIEN) **+4.48%**가 일제히 뛰었다. 델은 RBC의 신규 커버리지 개시(Outperform)와 9월 21일 S&P 100 편입이, HPE는 오라클 AI 데이터센터에 주니퍼 네트워킹을 공급하는 협업(9/2 발표)이 각각 직접 재료였다. SOX는 **+1.81%(11,824.00)**로 지수를 앞섰지만 내용은 갈렸다 — 온세미컨덕터(ON) **+8.51%**, 스카이웍스(SWKS) **+5.14%**, 아나로그디바이스(ADI) **+4.85%**, NXP(NXPI) **+4.48%**, 마벨테크놀로지(MRVL) **+4.03%**, 텍사스인스트루먼트(TXN) **+3.82%** 등 아날로그·통신칩이 이끌었고, 엔비디아(NVDA) **−0.03%(\$218.29)**, 마이크론(MU) **−0.22%(\$975.26)**, 램리서치(LRCX) **+0.07%**는 제자리였다. 메모리는 오라클 효과로 프리마켓에 올랐다가 오라클이 고점을 반납하자 함께 식었다(해머스톤). 정작 오라클 본주는 **−1.74%(\$150.28)**로 마감했는데, 이는 실적 자체보다 **잉여현금흐름 −54억 달러·분기 자본지출 285억 달러**라는 부담이 재확인된 결과다. 인베스팅닷컴 편집진은 오라클이 "OpenAI 의존 우려를 일부 덜어냈다"고 평했다(배런스).

**⑤ 역행한 곳은 헬스케어·유틸리티·스토리지 — 각자의 이유가 있었다**
S&P 11개 섹터 중 9개가 올랐고 헬스케어(XLV)와 유틸리티(XLU)만 내렸다. 유나이티드헬스(UNH) **−2.73%(\$377.68)**는 플로리다 옵텀헬스(웰메드) 지분을 TPG에 매각한 구조조정이 '옵텀 마진 2%대'라는 약점을 재조명하면서 다우 최약 종목이 됐고, 에드워즈라이프사이언스(EW) **−2.77%(\$84.37)**는 TAVR 시술에 대한 메디케어 커버리지 결정을 소화했다. 스트라이커(SYK)·레스메드(RMD)는 9거래일 연속 하락으로 메드텍 약세가 길어지고 있다. 스토리지에서는 시게이트(STX) **−3.73%(\$830.17)**, 샌디스크(SNDK) **−3.50%(\$1,633.35)**, 웨스턴디지털(WDC) **−2.98%**가 밀렸는데 회사 고유의 재료는 확인되지 않았고 24/7월스트리트는 '올해 급등에 따른 종목별 차익실현'으로 정리했다. 원전 소형모듈(SMR) 진영은 UBS가 뉴스케일파워(SMR)를 매도(목표가 \$10→\$6)로 내리고 오클로(OKLO)가 **10억 달러** 규모 주식 매출(ATM) 계약을 새로 맺으면서 동반 급락했다. 소재는 알베말(ALB) **−3.76%**(배당락·리튬 경계), 다우(DOW) **−2.06%**가 약했고, 금은 **\$4,408.90(+0.04%)**로 사흘 만에 낙폭을 멈췄다.

**⑥ 한국은 유가·금리 충격에 7,000을 반납했고, 야간선물은 미국 반등을 +0.97%로 받아냈다**
전일 코스피는 **6,909.91(−124.01p, −1.76%)**로 7,000선 탈환 이틀 만에 다시 내줬다. 외국인이 **2조 2,915억원**, 기관이 **1조 2,257억원**을 순매도했고 개인이 **1조 8,679억원**을 순매수했다(라이센스뉴스·EBN). 코스닥은 **820.64(−1.95%)**. 삼성전자(005930)는 **259,500원(−3.53%)**, SK하이닉스(000660)는 **1,812,000원(−2.21%)**으로, 외국인은 SK하이닉스를 **60만 6,502주** 순매도(이틀 누적 156만 주), 기관도 **27만 4,533주** 순매도로 돌아섰으며 개인만 **27만 7,145주** 순매수였다. 원·달러 환율은 **1,345.9원(+6.7원)**에 주간 거래를 마쳤다(서울파이낸스). 그날 밤 코스피200 야간선물은 시가 **1,094.55**로 정규장 종가(1,088.30) 위에서 출발해 고가 **1,107.50**, 저가 **1,085.45**를 오간 뒤 **1,098.85(+0.97%, +10.55)**로 마감했다(거래량 30,217계약·미결제약정 128,867). 미국 반등을 초반부터 반영했고, 저가가 정규장 종가를 밑돈 구간은 짧았다. SKHY는 **\$188.57 (괴리율: +40.1%)**로 보합권이었는데 국내 주가가 −2.21% 밀린 탓에 괴리율은 **+37.2% → +40.1%**로 **2.9%p 확대**됐다 — 확대 원인이 'ADR 상승'이 아니라 '국내 하락'이라는 점이 중요하다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  IT 하드웨어·네트워킹 — 오라클발 AI 인프라 랠리**
휴렛팩커드엔터프라이즈(HPE) **+12.44%(\$62.09)**, 델테크놀로지스(DELL) **+11.98%(\$567.29)**, 넷앱(NTAP) **+8.54%**, HP(HPQ) **+8.40%**, CDW(CDW) **+7.85%**, 슈퍼마이크로(SMCI) **+7.28%**, 플렉스(FLEX) **+7.19%**, 아리스타네트웍스(ANET) **+5.61%**, 자빌(JBL) **+5.05%**, 암페놀(APH) **+4.57%**, 시스코(CSCO) **+4.37%**. 오라클의 OCI 매출 +121%와 RPO 6,640억 달러가 '서버·네트워킹·스토리지 발주가 실제로 나온다'는 증거로 읽혔다. 델은 RBC의 Outperform 개시와 S&P 100 편입(9/21)이, HP는 RBC의 Sector Perform 개시(목표가 \$33)가 각각 붙었다(TheStreet).

**상승 ②  아날로그·통신 반도체 — 되돌림의 주역은 메모리가 아니라 아날로그였다**
온세미컨덕터(ON) **+8.51%(\$76.14)**, 스카이웍스(SWKS) **+5.14%**, 아나로그디바이스(ADI) **+4.85%**, NXP(NXPI) **+4.48%**, 마벨테크놀로지(MRVL) **+4.03%**, 모놀리식파워(MPWR) **+4.08%**, 텍사스인스트루먼트(TXN) **+3.82%**, 마이크로칩(MCHP) **+3.66%**. 시킹알파는 온세미의 급등을 '최근 12% 넘는 조정 뒤 반등'으로 설명했고 개별 재료는 확인되지 않았다. 자동차·산업용 아날로그는 유가·금리 부담에 가장 먼저 눌렸던 만큼 유가 하락일에 가장 크게 튀었다.

이날 주당 **\$0.41** 현금배당의 배당락일이었고, 여기에 글로벌 리튬 시장에 대한 경계가 이어지며 S&P 500 낙폭 상위에 올랐다(TheStreet). 같은 소재 섹터의 다우(DOW) **−2.06%**, CF인더스트리(CF) **−1.51%**, 모자이크(MOS) **−0.83%**도 약해 금리 상승일의 소재 전반 부진과 맞물렸다. 회사가 이날 별도로 낸 공시나 실적 재료는 확인되지 않았다. 참고로 같은 날 원전 소형모듈 진영에서는 UBS가 뉴스케일파워(SMR)를 **매도**로 하향(목표가 **\$10→\$6**, 2026~28년 누적 현금소진 약 **7억 달러** 추정)하고 오클로(OKLO)가 **10억 달러** 한도 ATM 증자 계약을 새로 맺어 두 종목이 장중 낙폭 상위에 올랐다(해머스톤).

## 🧭 섹션 3. 마켓 구루·기관 코멘트

**증권사·기관 리포트 5선**
1. **RBC캐피털 — 델테크놀로지스 커버리지 개시 'Outperform'**: 강한 잉여현금흐름과 AI 인프라 배치의 경쟁 우위를 근거로 글로벌 IT 지출의 1차 수혜자로 지목. 같은 날 HP(HPQ)는 Sector Perform·목표가 \$33으로 개시.
2. **UBS — 뉴스케일파워 '매도' 하향, 목표가 \$10→\$6**: 5년 이상의 건설 기간, 확정 고객 부재, 2026~28년 누적 현금소진 약 7억 달러 추정.
3. **바클레이즈 — 항공주 목표가 일괄 하향**: 에너지 가격이 다시 추정치를 끌어내린다며 델타항공(DAL) \$105→\$95, 유나이티드항공(UAL) \$175→\$160, 아메리칸항공(AAL) \$19→\$14, 사우스웨스트(LUV) \$65→\$58 등 8개사 하향. 다만 "전쟁 전 에너지 가격으로 돌아가면 구조적으로 높은 마진"이라고 부연.
4. **웨드부시 — 사이버보안 섹터 커버리지 재개**: AI 네이티브 플랫폼에 긍정, 단독 취약점관리 벤더에 부정. "AI 위협이 예산을 키우는 게 아니라 예산이 재분배된다"며 팔로알토(PANW)·루브릭(RBRK)을 베스트 아이디어에 추가, 바로니스(VRNS) 하향.
5. **BofA — 인터내셔널페이퍼(IP) 매수 상향, 목표가 \$34→\$46**: 컨테이너보드 가격 전망 상향을 반영. 배링턴은 코파트를 Outperform(목표가 \$40)으로 올렸고 베어드는 목표가를 \$42→\$38로 내려 인수 발표에 대한 시각이 갈렸다.

**구루·전략가 코멘트**
- **시마 샤(프린시펄애셋매니지먼트)**: "논쟁은 연준이 올릴지에서 이번 사이클에 궁극적으로 몇 번의 인상이 필요할지로 옮겨갔다. 한 번 올리고 끝낼 것으로 보지 않는다."
- **래리 애덤(레이먼드제임스 CIO)**: 1970년 이후 10년물이 6개월 이상 연속 상승한 사례는 다섯 번뿐이며 투기적 순매도 포지션이 사상 최고 부근이라 "움직임이 갈수록 과도해 보인다."
- **오성권(웰스파고)**: "9월 인상이 사실상 결정된 상황에서 시장은 그다음을 생각한다. 이날은 CPI보다 유가가 더 중요한 변수였다."
- **애덤 크리사풀리(바이털놀리지)**: 근원 CPI가 다소 강했지만 "인플레이션이 너무 높고 연준이 다음 주 올리는 것이 정당화된다는 큰 그림은 바뀌지 않는다." 한두 차례로 끝나는 미니 긴축이라면 오히려 증시에 도움이 될 수 있다.
- **스카일러 와이낸드(리건캐피털 CIO)**: "연준의 손은 묶였다. 다음 주 인상은 사실상 확정이며, 시장이 반영한 금리 수준에 단기금리를 맞추기 위해 몇 달간 여러 차례 인상이 나올 수 있다."
- **제프리 로치(LPL파이낸셜)**: 25bp 인상의 영향은 제한적일 것 — 경제활동 중 금리에 덜 민감한 비중이 커졌고 AI 투자와 고소득층 소비가 버텨 명목성장률이 향후 몇 분기 6%를 웃돌 것.
- **카일 로다(캐피털닷컴)**: 유가 흐름이 "미-이란 전쟁 초기의 변동성과 불편할 만큼 닮아가고 있다."
