## 🗓 시장 요약

**③ WTI \$90.53(+2.73%)·브렌트 \$98.41(+4.01%) — 이란 종전 협상 불확실성에 하루 만에 반등**

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. AMD (AMD) −17.43% — 리사 수 CEO "시장은 때로 근시안적", 사흘 전 호실적에도 한 달 하락률 20%대**

**4. 퀄컴 (QCOM) −9.31% — 회계 4분기 매출 \$103억2,000만으로 예상 상회, 그러나 1분기 주당순이익 가이던스 \$2.15~2.35로 예상 하회**
