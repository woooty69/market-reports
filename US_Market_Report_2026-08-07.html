## 🗓 시장 요약

**사흘 만에 다우가 꺾였다.** 다우가 −0.85%(−463.84p) 밀리며 사상 최고 행진을 멈췄고, S&P 500(−0.17%)·나스닥(−0.06%)도 소폭 하락했다. 직접적 방아쇠는 **유가 반등(+4.20%, $78.23)**이었다. 이란과의 호르무즈 협상이 진행 중이지만 실질 타결이 지연되며 이틀간 −13% 빠졌던 유가가 하루 만에 +4% 되돌렸고, 인플레 부담이 되살아나며 **금리가 동반 상승**했다(2년물 +0.063%p·4.248%, 10년물 +0.061%p·4.676%).

여기에 **고용지표가 강했다.** 8/1 주간 신규 실업수당 청구가 **19만9,000건**으로 컨센서스(20만4,000건)를 밑돌아, 노동시장 견조 → 연준 완화 지연이라는 해석이 금리 상승을 부추겼다. 다우는 세일즈포스가 경영진 교체 발표로 −3% 밀린 것도 부담이었다.

**흥미로운 건 지수 안의 균열이다.** 지수는 내렸는데 **SOX는 오히려 +0.33% 올랐다.** AMD가 전날 −7% 급락을 딛고 +1.50% 반등하고 마이크로소프트가 +2.55%($499.87) 오른 덕이다. 반면 **메모리·스토리지는 무너졌다** — 웨스턴디지털 −13.03%, 샌디스크 −6.74%, 마이크론 −1.31%, **SK하이닉스 ADR −4.97%**. AI 반도체 안에서도 '연산'과 '저장'의 운명이 갈린 하루였다.

개별 종목의 낙폭은 컸다. 하니웰 에어로스페이스(−23.16%)·앱러빈(−19.63%)·데이터독(−19.05%)·액손(−14.28%)이 실적 실망에 폭락했다. 반대로 페이컴(+23.70%)·모토로라솔루션(+8.20%)은 급등했고, 전날 −13.6% 폭락했던 스페이스X는 +6.10% 반등(거래량 2억4,492만 주)했다.

## 📰 시장 헤드라인 3선

**1. 유가 +4.2% 반등·금리 상승에 다우 −464p, 기록 행진 마감**
호르무즈 협상 타결이 지연되며 유가가 하루 만에 +4.20%($78.23) 되돌렸고 국채금리가 동반 상승(10년물 4.676%)했다. 다우는 −0.85% 밀리며 사흘간 이어진 사상 최고 행진을 멈췄고, 세일즈포스의 경영진 교체 발표에 따른 −3% 하락도 지수를 눌렀다.

**2. 실업수당 청구 19.9만건 '예상 하회' — 견조한 노동시장이 금리를 밀어올렸다**
8월 1일 주간 신규 실업수당 청구가 19만9,000건으로 시장 예상(20만4,000건)을 밑돌았다. 노동시장이 여전히 탄탄하다는 신호가 연준의 완화 기대를 늦추며 2년물이 +0.063%p 올랐다. 시장의 시선은 금요일 고용보고서로 이동했다.

**3. 연산은 오르고 저장은 무너졌다 — SOX +0.33%인데 WDC −13%·SKHY −5%**
AMD(+1.50%)·마이크로소프트(+2.55%) 반등에 SOX는 소폭 올랐지만, 메모리·스토리지는 급락했다. 웨스턴디지털 −13.03%, 샌디스크 −6.74%, SK하이닉스 ADR −4.97%. 한국에서는 SK하이닉스가 −10.37% 폭락하며 코스피가 −4.5% 밀렸다.

전날 실적 발표 후 −7.04% 급락했던 데서 +1.50% 반등했다. 매출 +50%·데이터센터 +107%라는 실적 자체는 견조했다는 재평가가 유입됐고, SOX가 플러스로 마감하는 데 기여했다. 거래량 2,228만 주.

## 🧭 섹션 3 · 구루 · 기관 코멘트

**소시에테제네랄(SocGen) — "한국 셰이크아웃은 거의 끝났다"**
SK하이닉스가 서울 프리마켓에서 −30% 플래시크래시를 겪은 날, 한국 시장의 조정(shakeout)이 막바지에 이르렀다고 진단. 과매도 국면의 마무리 가능성을 제기했다.

**JP모건 — "기술주 매도가 AI 투자 사이클을 훼손하지는 않았다"**
아시아 기술주 급락에도 AI 투자 사이클 자체는 유효하다며, 이번 변동성을 사이클의 훼손이 아닌 밸류에이션 조정으로 해석.

**모틀리풀 — "세계 HBM 절반 이상 공급, 그런데 내년 PER 4배 미만"**
SK하이닉스의 2분기 매출이 전년비 +257%, 영업이익률 76%, 1분기 HBM 점유율 58%임에도 내년 예상실적 기준 PER이 4배를 밑돈다고 지적하며 밸류에이션 매력을 부각.

**로이터 — 삼성·SK하이닉스 주주들, "AI 현금더미에서 배당·자사주를 더 내놓아라"**
양사가 기록적 실적을 내고도 주주환원 계획을 구체화하지 않자 배당·자사주 매입 확대 요구가 커지고 있다고 보도. 최근 주가 변동성의 배경 중 하나로 지목.

**제임스 피서노 — "트럼프의 워시 압박이 연준 경로에 정치 변수를 더한다"**
트럼프 대통령의 워시 의장 접촉이 통화정책 경로에 정치적 교차류를 만들고 있다며, 9월 FOMC를 둘러싼 불확실성이 커졌다고 분석.

## 📅 섹션 4 · 다음 일정 (8/7~)

- **📊 최대 이벤트 — 8월 고용보고서(금):** 주간 실업수당이 19.9만건으로 예상을 밑돈 만큼 고용보고서도 강하게 나올 경우 금리가 추가 상승할 수 있다. 9월 FOMC 인상 확률은 현재 55.1%로 다시 올라왔다.
- **🛢 유가·호르무즈:** 이란 협상 타결이 지연되며 유가가 +4.2% 되돌린 만큼, 실질 합의 여부가 인플레·금리 경로의 핵심 스윙 팩터다.
- **🏢 실적:** AI 소프트웨어(앱러빈·데이터독)의 20% 가까운 급락이 보여주듯, 실적 시즌 후반부는 '기대 대비 폭'이 주가를 좌우한다.
- **🇰🇷 한국 개장 관전 포인트(금요일 8/7):** 8/6 코스피 −4.5%, SK하이닉스 −10.37%(프리마켓 −30% 플래시크래시)로 이번 주 변동성이 극단에 달했다. 오늘은 **반등 시도가 우세**하다 — **야간선물 +1.45%(995.40)**로 방향이 돌아섰고, SKHY 시간외도 **+0.82%** 반등했다. **괴리율 +36.7%**는 국내 과매도를 시사하며, SocGen("조정 거의 끝")·JP모건("AI 사이클 유효")의 시각도 우호적이다. 다만 미국 메모리·스토리지 급락(WDC −13%)과 외국인 순매도 재전환(110.2만 주)은 반등 폭을 제한할 수 있고, **오늘 밤 미 고용보고서**가 주말 방향을 좌우한다. SK하이닉스는 **8/13 실적**과 주주환원 발표 여부가 다음 촉매다.
