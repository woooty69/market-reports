## 🗓 시장 요약

**① 월러 이사가 '동결'을 말했다 — 하루를 만든 한 문장**
크리스토퍼 월러 연준 이사가 로이터 주최 행사에서 **"2% 물가 목표를 향한 진전이 계속된다면 현재 수준에서 정책금리를 유지하는 것을 지지할 의향이 있다"**고 밝혔다. 다만 조건도 달았다 — **"인플레이션이 뜨겁게 나온다면 금리 인상을 고려할 것"**이라며 다음 주 발표될 8월 물가지표가 중요하다고 강조했다. 3대 지수는 나스닥 **+1.40%**, 다우 **+1.18%**, S&P 500 **+1.06%**로 일제히 올랐고, **다우는 8월 4일 이후 최대 상승폭**을 기록했다.

**② 인상 확률이 절반으로 내려왔다 — 70% → 50.4%**
연방기금금리 선물시장의 9월 0.25%p 인상 확률은 전날 **63.2%에서 50.4%**로 떨어졌다. **이번 주 초만 해도 약 70%가 반영돼 있었다.** 채권시장도 즉각 반응해 **2년물이 4.340%(−3.1bp)**, 10년물이 **4.772%(−1.0bp)**로 내렸다. **단기물이 더 크게 내리는 불 스티프닝**으로, 시장이 이번 되돌림을 정확히 **정책금리 경로의 변화**로 읽었다는 뜻이다.

**③ 엔비디아가 허깅페이스를 129억 달러에 인수한다**
엔비디아가 **오픈소스 AI 개발 플랫폼 허깅페이스를 129억 달러(약 18조원)에 인수**한다고 발표했다. 허깅페이스는 전 세계 AI 개발자들이 모델을 공유·배포하는 사실상의 표준 허브다. **엔비디아가 칩(하드웨어)에서 개발자 생태계(소프트웨어)로 지배력을 확장**하는 거래이며, 주가는 **+1.80%(\$228.45)** 올랐다.

**④ 브로드컴은 반대로 밀렸다 — −2.70%**
브로드컴이 **4분기 매출 전망이 시장의 AI 기대를 충족하지 못하면서 2.70% 하락**했다. 전날 실적 발표 직후 시간외에서 5% 급락했던 흐름이 정규장에서 일부 회복된 결과다. **AI 반도체 안에서도 실적 가이던스에 따라 종목이 갈리는 국면**임을 보여줬다.

**⑤ 위험선호가 전면적으로 돌아왔다 — 금·은·비트코인 동반 급등**
금 선물이 **\$4,520.30(+2.39%)**, 은이 **+3.24%**, 구리가 **+1.18%** 올랐다. **비트코인은 8만 달러를 돌파**했고, 암호화폐 거래 비중이 높은 **로빈후드가 16.57% 급등**했다. VIX는 **14.31(−5.86%)**로 내렸고 달러인덱스도 **98.98(−0.58%)** 하락했다. **금리 인상 우려가 걷히자 위험자산과 무이자 자산이 함께 오르는** 전형적인 완화 기대 국면이다.

**⑥ 유가는 혼조였다 — WTI 나흘 연속 상승, 브렌트는 하락**
WTI 10월물은 **배럴당 \$91.30(+0.32%)**로 **8월 31일부터 나흘 연속** 올랐다. 반면 브렌트유 11월물은 장중 **97달러를 돌파**했다가 상승분을 모두 반납해 **\$95.52(−0.12%)**로 내렸다. **이란이 미국의 공습에 대응해 쿠웨이트를 공격**하면서 긴장이 이어졌지만, **푸틴 러시아 대통령이 평화협상에 열린 입장**을 내비치면서 상승폭이 제한됐다. 밴스 부통령은 **"상선 공격을 멈출 때까지 이란과 대화는 없다"**고 밝혔다.

**⑦ 한국 반도체 수출이 기록을 갈아치웠다 — 8월 466.5억 달러, 전년비 +209%**
CNBC에 따르면 **한국의 8월 반도체 수출이 전년 대비 209% 급증한 466억 5,000만 달러로 사상 최대**를 기록했다. 이는 그달 전체 수출 **982억 5,000만 달러의 47.5%**에 해당한다. 수출의 절반 가까이가 반도체 한 품목에서 나오는 구조가 된 것이며, 이 집중도 자체를 위험 요인으로 보는 시각도 함께 제기됐다.

**⑧ 국내 증시는 지수와 종목이 갈렸다**
코스피는 장중 **2% 넘게 급락해 6,400선까지 밀렸다가** 반등해 **+0.26%(6,579.48)**로 마감했다. 반면 코스닥은 **−1.71%(790.21)**로 4거래일 연속 하락하며 **800선을 내줬다**. **SK하이닉스는 −1.05%(1,596,000원)**였고 **외국인·기관·개인 3주체가 모두 순매도**했다. 원/달러는 **1,359.3원(−9.4원)**으로 **1년 2개월 만에 1350원대**에 진입했다(장중 1,355.9원). 수출업체 네고 물량과 엔화 강세가 겹친 결과다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  금융·암호화폐 관련 (이날 최강)**
로빈후드가 **+16.57%** 급등했다. **비트코인이 8만 달러를 돌파**하면서 암호화폐 거래 비중이 높은 플랫폼에 매수세가 집중됐고, 월가에서 성장성을 긍정적으로 평가한 점도 겹쳤다. 금리 인상 우려 완화가 위험자산 전반의 촉매로 작용했다.

**상승 ②  우주·전기차**
스페이스X가 **+6.42%**, 테슬라가 **+5.42%(\$376.37)** 올랐다. 금리 부담 완화 국면에서 회수 기간이 긴 장기 프로젝트를 보유한 기업의 밸류에이션이 가장 크게 되살아났다.

**상승 ③  빅테크·플랫폼**
메타 **+3.01%(\$610.68)**, 알파벳 **+1.59%(\$342.48)**, 아마존 **+1.54%(\$258.90)**, 애플 **+1.00%(\$328.21)**. 매그니피센트7 종목의 강세가 나스닥 **+1.40%** 상승을 견인했다.

**상승 ④  귀금속·원자재**
금 선물 **+2.39%(\$4,520.30)**, 은 **+3.24%**, 구리 **+1.18%**. 금리 인상 기대가 후퇴하면서 무이자 자산의 기회비용이 낮아졌고, 달러인덱스 **−0.58%**도 우호적으로 작용했다.

**하락 ①  AI 반도체 일부**
브로드컴이 **−2.70%** 하락했다. **4분기 매출 전망이 시장의 AI 기대를 충족하지 못한 것**이 원인이다. AMD **−0.20%**, 씨게이트 **−1.23%**도 내렸다. SOX가 **+0.17%**에 그친 것은 이 종목들의 부진 때문이다.

**하락 ②  메모리**
SK하이닉스 ADR이 **−0.79%(\$163.68)**로 내렸다. 마이크론은 **+0.22%**로 강보합에 그쳤다. 시장 전반이 1% 넘게 오른 날 메모리만 제자리였다.

**하락 ③  일부 미디어**
넷플릭스가 **−0.07%(\$82.67)**로 약보합에 머물러 상승 대열에서 벗어났다.

> 🇰🇷 [전달] **코스피200 야간선물이 +1.85%(1,049.05, +19.05)로 이틀 연속 반등**했다. 장중 궤적은 정규장 선물 종가(1,030.00) 근처 **1,030.95로 출발해 저가 1,020.75(−0.90%)까지 밀렸다가 고가 1,052.45(+2.18%)까지 올라** 상단 부근에서 마감한 흐름이다. **저점을 찍고 상단에서 끝난 형태**로, 월러 발언 이후 미 증시 상승을 그대로 따라간 궤적이다. 거래량 **26,252계약**(전 세션 22,676계약 대비 증가), 미결제약정은 **149,439계약(▲743)**으로 3거래일 만에 늘었다.
>
> [수급] 전일 국내는 코스피 **+0.26%(6,579.48)**, 코스닥 **−1.71%(790.21)**로 갈렸다. 코스피는 장중 **6,400선까지 2% 넘게 밀렸다가** 반등에 성공했고, 코스닥은 4거래일 연속 하락하며 800선을 내줬다. SK하이닉스는 **−1.05%(1,596,000원)**, **외국인 −23만 4,626주·기관 −18만 7,288주·개인 −22만 315주로 3주체 모두 순매도**였다. 거래대금 **6조 7,253억원**, 시가총액 **1,165조원**. 괴리율은 **+40.0% → +39.4%**로 소폭 축소됐다 — 국내(−1.05%)와 ADR(−0.79%)이 같은 방향으로 움직인 데다 원/달러가 **1,359.3원(−9.4원)**으로 크게 내린 영향이다.

**[시장의 시선]** 이날 시장을 움직인 것은 지표가 아니라 **한 사람의 발언**이었다. 월러 이사의 "동결 지지" 한마디에 인상 확률이 **주초 70% → 50.4%**로 내려왔고, 그 되돌림이 주식·채권·금·암호화폐에 동시에 반영됐다. **최근 국면의 지배 변수가 유가도 지정학도 아닌 '정책금리 경로'라는 점**이 다시 확인됐다.

다만 월러 본인이 조건을 명시했다는 점을 함께 볼 필요가 있다 — **"인플레이션이 뜨겁게 나온다면 금리 인상을 고려할 것"**이다. 에버코어의 크리슈나 구하도 **"결정은 매우 박빙이며 결국 다음 물가지표에 달려 있다"**고 평가했다. 인상 확률 50.4%는 **방향이 정해졌다는 뜻이 아니라 완전히 반반이 됐다는 뜻**이다.

한국 쪽에서는 **8월 반도체 수출 466.5억 달러(전년비 +209%)**라는 기록이 나왔다. 전체 수출의 **47.5%**가 한 품목에서 나온다는 것은 실적의 근거이자 동시에 **한 사이클에 경제 전체가 묶여 있다**는 뜻이기도 하다. 같은 날 SK하이닉스가 2분기 **글로벌 HBM 점유율 1위**를 지켰지만 **삼성전자가 33%까지 추격**했다는 집계도 함께 나왔다.

주시할 변수는 세 가지다 — **①오늘 밤 8월 고용보고서**(블룸버그 전망 비농업 +5만 5,000명, 실업률 4.1%), **②다음 주 CPI·PPI**(월러가 직접 조건으로 건 지표), **③원/달러 1350원대 진입**이 외국인 수급에 미칠 영향.

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 엔비디아 (NVDA) +1.80% — \$228.45, 허깅페이스를 129억 달러에 인수한다**
AI 반도체 대장주가 **1.80% 상승(\$228.45, +\$4.04)**했다. 이날 나온 재료는 규모와 성격 모두 이례적이다. 엔비디아는 **오픈소스 AI 개발 플랫폼 허깅페이스를 129억 달러에 인수**한다고 발표했다.
허깅페이스는 전 세계 AI 개발자들이 모델과 데이터셋을 공유·배포하는 사실상의 표준 저장소다. **엔비디아가 GPU라는 하드웨어를 넘어 개발자 생태계 자체를 확보하려는 거래**이며, CUDA로 구축한 소프트웨어 해자를 모델 유통 단계까지 확장하는 구조다.
동시에 규제 관점의 부담도 커진다. AI 학습 인프라의 사실상 독점 사업자가 **모델 배포 채널까지 보유**하게 되는 그림이라, 반독점 심사 과정이 변수로 남는다. 이날 필라델피아 반도체지수가 **+0.17%**에 그친 것과 비교하면 개별 상승폭은 컸다.

**2. 브로드컴 (AVGO) −2.70% — 4분기 매출 전망이 AI 기대에 못 미쳤다**
AI 맞춤형 칩 대표주가 **2.70% 하락**했다. 원인은 **4분기 매출 전망이 시장의 AI 기대를 충족하지 못한 것**이다. 실적 자체는 예상을 웃돌았으나 가이던스가 발목을 잡았다.
직전 세션 마감 후 시간외에서 **5% 급락**했던 것을 감안하면 정규장에서는 낙폭을 일부 만회한 셈이다. 다만 3대 지수가 모두 1% 넘게 오른 날의 하락이라 상대 약세가 두드러졌다.
시사점은 **AI 반도체 안에서의 분화**다. 같은 날 엔비디아는 **129억 달러 인수**로 생태계 확장을 발표하며 올랐고, 브로드컴은 수주 가시성에 대한 의문으로 내렸다. **AI 수요 자체가 아니라 그 수요를 누가 얼마나 확정적으로 잡고 있는가**가 주가를 가르고 있다.

**3. 로빈후드 (HOOD) +16.57% — 비트코인 8만 달러 돌파에 이날 최대 상승**
온라인 증권·암호화폐 거래 플랫폼이 **16.57% 급등**해 이날 상승률 1위를 기록했다. 직접적인 촉매는 **비트코인의 8만 달러 돌파**다.
연결 고리는 금리다. **월러 연준 이사의 금리 동결 시사 발언**으로 인상 우려가 완화되자 위험자산 선호가 되살아났고, 암호화폐가 가장 민감하게 반응했다. 로빈후드는 매출에서 암호화폐 거래 수수료 비중이 높아 **코인 거래량 증가가 곧바로 실적으로 연결**되는 구조다.
여기에 **월가에서 로빈후드의 성장성을 긍정적으로 평가**한 점도 겹쳤다. 다만 이 구조는 양방향이라, 다음 주 물가지표가 강하게 나와 금리 인상 우려가 되살아나면 낙폭도 그만큼 커질 수 있는 종목이다.

**4. 테슬라 (TSLA) +5.42% — \$376.37, 금리 완화 기대의 최대 수혜**
전기차 대표주가 **5.42% 급등(\$376.37, +\$19.36)**했다. **회사 고유의 신규 공시나 실적 발표는 없었고**, 금리 인상 확률이 **50.4%**까지 내려온 것이 밸류에이션에 직접 반영됐다.
같은 날 **스페이스X도 +6.42%** 올랐다. 두 회사 모두 일론 머스크 CEO가 밝힌 **연간 100기가와트(GW) 규모 태양광 생산 능력 확보** 계획을 공유하고 있으며, 이는 회수 기간이 매우 긴 자본지출이다.
**장기 프로젝트를 많이 보유한 기업일수록 할인율 변화에 주가가 크게 반응한다.** 이날 상승률 상위에 테슬라·스페이스X·로빈후드가 나란히 오른 것이 그 구조를 보여준다.

**5. 메타 (META) +3.01% — \$610.68, 빅테크 중 최대 상승**
메타가 **3.01% 상승(\$610.68, +\$17.83)**해 주요 빅테크 가운데 가장 크게 올랐다. **회사 고유의 신규 재료는 확인되지 않았으며**, 매그니피센트7 전반의 강세에 함께 올라탔다.
광고 매출 구조상 금리·유가 완화의 수혜가 이중으로 걸린다. 금리 인상 우려 후퇴는 밸류에이션에, 유가 상승 둔화(WTI **+0.32%**)는 소비 여력에 각각 긍정적으로 작용한다.
다음 주 CPI·PPI는 이 논리가 유지될지를 가르는 관문이다. 월러 이사가 **"인플레이션이 뜨겁게 나온다면 금리 인상을 고려할 것"**이라고 조건을 명시한 만큼, 물가지표가 강하게 나오면 이날 상승분의 근거가 흔들릴 수 있다.

**6. SK하이닉스 ADR (SKHY) −0.79% — \$163.68 (괴리율: +39.4%), HBM 1위는 지켰지만 추격이 붙었다**
ADR이 **0.79% 하락(\$163.68, −\$1.30)**했다. 시가 **\$160.82**에서 저가 **\$157.73**까지 밀렸다가 고가 **\$164.63**까지 회복했고, 거래량은 **1,462만 1,625주**로 크게 늘었다. 시간외는 **\$162.81(−0.53%)**.
경쟁 구도에 관한 집계가 나왔다. **2분기 글로벌 HBM 시장에서 SK하이닉스가 점유율 1위를 유지했지만 삼성전자가 33%까지 추격**한 것으로 나타났다. HBM은 이 회사 이익의 핵심 축이라 점유율 변화가 직접 실적 추정에 반영되는 사안이다.
매크로 쪽 재료는 우호적이다. **한국의 8월 반도체 수출이 전년 대비 209% 급증한 466억 5,000만 달러로 사상 최대**를 기록했다. 국내 주가는 **−1.05%(1,596,000원)**였고 **외국인·기관·개인 3주체 모두 순매도**했다. 괴리율은 원화 강세(**1,359.3원**, −9.4원)에 힘입어 **+40.0% → +39.4%**로 소폭 좁혀졌다.

**7. 인텔 (INTC) +1.80% — 파운드리 수주 서사가 이어지고 있다**
인텔이 **1.80% 올랐다.** 엔비디아와 같은 상승률로, 이날 반도체 업종 안에서 상위권이었다.
배경에는 **파운드리 고객 확보** 흐름이 있다. **SK하이닉스가 HBM4E 베이스 다이 공급처로 인텔 파운드리를 검토** 중이라는 보도가 이어지고 있으며, 베이스 다이는 그동안 TSMC가 사실상 독점해 온 영역이다.
다만 재무 구조는 여전히 부담이다. 회사는 최근 12개월 기준 **순손실 112억 9,000만 달러**를 기록 중이고 **파운드리 손익분기 목표는 2027년 말~2028년**으로 제시돼 있다. 애널리스트 48명의 평균 투자의견은 **'Hold'**다.

**8. 알파벳 (GOOGL) +1.59% — \$342.48, 금리 완화에 성장주 전반과 함께 올랐다**
알파벳이 **1.59% 상승(\$342.48, +\$5.36)**했다. **회사 고유의 신규 공시는 확인되지 않았고**, 월러 발언 이후의 성장주 반등 흐름을 따랐다.
AI 경쟁 구도에서는 이날 엔비디아의 움직임이 변수다. **엔비디아가 허깅페이스를 129억 달러에 인수**하면서 오픈소스 모델 유통 채널을 확보했는데, 이는 자체 모델(제미나이)과 자체 칩(TPU)으로 수직계열화를 추진해 온 알파벳과 **일부 영역에서 경쟁 범위가 겹치는** 사안이다.
광고 사업 쪽은 매크로 완화의 수혜다. 금리 인상 확률이 **50.4%**로 내려오고 유가 상승세가 둔화되면서, 소비 위축에 따른 광고 예산 축소 우려가 한 단계 낮아졌다.

**9. 아마존 (AMZN) +1.54% — \$258.90, 유가·금리 압력이 동시에 완화됐다**
아마존이 **1.54% 상승(\$258.90, +\$3.92)**했다. **개별 촉매는 확인되지 않았으나**, 이 회사에 걸려 있던 두 가지 압력이 동시에 풀린 날이었다.
하나는 **유가**다. WTI 상승폭이 **+0.32%**로 줄고 브렌트유가 **−0.12%**로 돌아서면서 물류·배송 원가 부담이 완화됐다. 다른 하나는 **금리**로, 10년물이 **4.772%**로 내려 AWS라는 장기 성장 사업의 할인율이 낮아졌다.
**성장 부문과 원가 부문이 서로 다른 이유로 동시에 압박받던 구도가 반대로 풀린 것**이 이날 상승의 배경으로 해석된다.
AI 인프라 경쟁 구도에도 변화가 생겼다. 같은 날 **엔비디아가 오픈소스 AI 플랫폼 허깅페이스를 129억 달러에 인수**한다고 발표했는데, 개발자들이 모델을 배포·실행하는 채널이 GPU 공급사 쪽으로 넘어가는 거래여서 **자체 칩(트레이니엄·인퍼런시아)과 AWS로 AI 인프라를 파는 아마존에는 경쟁 변수**가 된다.

**10. 애플 (AAPL) +1.00% — \$328.21, 아이폰 공개를 엿새 앞두고 상승**
애플이 **1.00% 상승(\$328.21, +\$3.25)**했다. 빅테크 중에서는 상승폭이 작은 편이었다.
가장 가까운 이벤트는 **9월 9일 신형 아이폰 공개**다. 이 자리에서 **애플의 첫 폴더블폰**이 공개될 것으로 알려져 있어, 발표를 엿새 앞두고 기대가 형성되는 구간이다.
공급망 쪽 변수는 여전하다. 메모리 가격이 **15% 이상** 인상된 상황이라 폴더블 신제품의 부품 원가 부담이 커지며, 이는 국내 메모리·디스플레이 업체와의 **단가 협상**으로 이어질 수 있는 사안이다. 한국의 **8월 반도체 수출이 전년비 209% 급증**한 배경에도 이 가격 효과가 포함돼 있다.

- **크리슈나 구하 (에버코어):** **"월러 이사는 9월 회의를 앞두고 최근 인플레이션 흐름에 대해 낙관적인 평가를 내놨다"**며 **"Fed가 9월에 금리를 인상하기보다는 동결할 가능성이 더 높다는 기존 전망을 유지한다"**고 밝혔다. 다만 **"결정은 매우 박빙이며 결국 다음 물가지표에 달려 있다"**고 덧붙였다.
- **톰 에세이 (세븐스리포트 대표):** **"경기와 고용이 지나치게 강하지도 약하지도 않은 '골디락스' 고용지표가 나온다면 금리 인상 우려가 줄고 국채 금리도 하락할 것"**이라며, 반대로 **"지표가 지나치게 강하면 추가 금리 인상 우려를 더욱 키울 것"**이라고 분석했다.
- **CME 페드워치(9/16 FOMC):** 0.25%p 인상 확률 **50.4%**, 동결 **약 49.6%**. 전날 63.2%, 주초 약 70%에서 내려왔다.
- **블룸버그 컨센서스(8월 고용보고서, 9/4 발표):** 비농업 신규고용 **+5만 5,000명**(7월의 예상 밖 감소에서 반등 예상), 실업률 **4.1% 유지**.

## 📅 섹션 4. 일정 및 관전 포인트

- **📊 8월 고용보고서(오늘 밤) — 이번 주 최대 지표:** 블룸버그 전망은 비농업 **+5만 5,000명**, 실업률 **4.1%**다. ADP가 이미 **+3만 8,000명**으로 둔화 신호를 냈다. 톰 에세이의 표현대로 **'골디락스' 구간에서 벗어나는 방향**(너무 강하거나 너무 약한)이 나올 경우 변동성이 커질 수 있다.
- **📈 8월 CPI·PPI(다음 주) — 월러가 직접 건 조건:** 월러 이사가 동결 지지의 전제로 명시한 지표다. 물가가 예상보다 뜨겁게 나오면 이날 되돌린 인상 확률(50.4%)이 다시 올라갈 수 있다.
- **🏛 9월 FOMC(9/15~16) — 인상 확률 50.4%:** 확률이 정확히 반반이 됐다. **인상 여부 자체가 아직 결정되지 않은 국면**이며, 고용·물가 두 지표가 남은 열흘간 방향을 정한다.
- **⚔️ 미·이란 교전 — 쿠웨이트로 확대:** **이란이 미국의 공습에 대응해 쿠웨이트를 공격**했고, 밴스 부통령은 **"상선 공격을 멈출 때까지 이란과 대화는 없다"**고 밝혔다. 다만 **푸틴 러시아 대통령이 평화협상에 열린 입장**을 내비치면서 유가 상승폭은 제한됐다. 브렌트유가 장중 97달러를 찍고 반납한 것이 그 균형을 보여준다.
- **🇰🇷 반도체 수출 집중도 — 8월 47.5%:** 한국의 8월 반도체 수출이 **466억 5,000만 달러(+209%)**로 사상 최대를 기록하며 전체 수출의 **47.5%**를 차지했다. 실적의 근거인 동시에 **한 사이클에 대한 의존도**가 커졌다는 뜻이기도 하다.
