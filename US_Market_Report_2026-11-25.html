## 🗓 시장 요약

**① 나스닥 23,733.54(−1.48%)·S&P500 7,201.09(−0.50%)·다우 50,018.70(+0.85%) — 기술주 차익실현, 경기방어·소비로 순환**
나스닥은 **23,733.54(−356.02, −1.48%)**, S&P500은 **7,201.09(−36.08, −0.50%)**로 내렸지만 다우는 **50,018.70(+423.39, +0.85%)**로 올라 5만선 위에서 마감했다. 장 초반에는 다우까지 0.6% 내리며 세 지수가 모두 밀렸으나, 오후 들어 헬스케어와 소매주로 매수가 옮겨가며 S&P500은 장중 저점 7,138.93에서 낙폭을 크게 줄였다. 전날 2025년 4월 이후 최고의 하루를 보낸 AI 종목에 대해 밸류에이션과 인프라 투자 지속성을 다시 따지는 분위기였다. 나스닥100은 **26,214.17(−531.93, −1.99%)**, 러셀2000은 **2,684.94(+15.28, +0.57%)**, VIX는 **26.32(−0.30, −1.13%)**로 장중 32.38까지 튀었다가 진정됐다.

**② 반도체 급반락 — SOX 8,832.50(−7.88%)·아날로그디바이스 −17.37%·마이크론 −11.01%·엔비디아 −5.86%**
SOX는 **8,832.50(−755.55, −7.88%)**로 전날 상승분(+14.03%)의 절반 넘게 반납했다. 아날로그디바이스(ADI)는 4분기 매출 \$43억7,000만(+42%)에도 이번 분기 전망 \$44억(±\$1억5,000만)이 기대에 못 미치며 **\$312.95(−17.37%)**로 폭락해 아날로그 반도체로 매도를 번지게 했다. 메모리주는 마이크론(MU) **\$629.79(−11.01%)**, SK하이닉스 ADR **\$111.98(−9.90%)**로 전날 급등분 상당 부분을 토해냈다. 엔비디아(NVDA)는 **\$155.38(−5.86%)**, AMD는 **\$413.27(−8.86%)**, 인텔(INTC)은 **\$54.80(−8.15%)**, 브로드컴(AVGO)은 **\$301.08(−3.98%)**였다. HPE도 마진 하락 전망에 **\$40.18(−16.33%)**로 밀려 AI 서버주 전반이 약했다.

**③ 소매 실적 랠리·사노피의 인스메드 \$410억 인수 — 다우 5만선 회복의 동력**
소매 업체들이 연말 쇼핑 시즌을 앞두고 일제히 실적 전망을 올렸다. 애버크롬비앤피치(ANF)는 3분기 사상 최대 매출 \$14억(+11%)을 내고 연간 주당순이익 전망을 \$13.70~13.90으로 높여 **\$168.09(+19.68%)**로 뛰었고, 콜스(KSS) **\$25.34(+19.53%)**, 딕스스포팅굿즈(DKS) **\$153.17(+14.59%)**, 달러트리(DLTR) **\$154.65(+11.18%)**, 베스트바이(BBY) **\$99.62(+2.70%)**가 뒤따랐다. 헬스케어에서는 사노피가 인스메드(INSM)를 주당 \$175 현금, 총 약 \$410억에 인수하기로 하면서 인스메드가 **\$170.15(+14.13%)**, 사노피 ADR(SNY)이 **\$51.90(+10.97%)**로 함께 올랐다.

**④ 미국채 — 2년물 4.63%(보합)·10년물 4.91%(−1bp)·30년물 5.30%(+1bp), 12월 0.25%p 인상 확률 95%**
미 재무부 고시 기준 2년물은 **4.63%(+0.0bp)**, 10년물은 **4.91%(−1.0bp)**, 30년물은 **5.30%(+1.0bp)**로 마감했다. 10년물은 장중 4.878~4.95% 사이에서 움직였다. 전날 반등이 적어도 두 차례 추가 인상 베팅을 되살린 가운데, 선물시장은 12월 FOMC에서 0.25%포인트 인상 확률을 95%, 0.5%포인트 인상 확률을 5%로 반영했다. 에버코어ISI의 크리슈나 구하는 케빈 워시 의장이 침묵을 지키면서 시장이 그를 강경 매파로 볼지 시장 친화적 매파로 볼지 갈피를 못 잡고 있다고 짚었다. 수요일(현지) 아침 PCE 물가와 GDP 수정치가 인상 폭을 가늠할 변수다.

**⑤ WTI \$81.49(+1.65%)·브렌트 \$90.92(+1.73%) — 3거래일 만에 반등, 금·비트코인은 약세**
WTI 1월물은 **\$81.49(+\$1.32, +1.65%)**, 브렌트 1월물은 **\$90.92(+\$1.55, +1.73%)**로 올랐다. WTI는 장중 \$79.07까지 밀렸다가 반등했다. 미국과 이란의 외교 접촉이 이어진다는 소식에 장 초반 약세였지만, 호르무즈 해협 불안이 다시 부각되며 상승 전환했다. 금은 온스당 \$3,555 안팎으로 2% 넘게 내렸고, 비트코인도 \$59,400대로 3% 가까이 떨어졌다. FDIC는 3분기 은행 보유 증권의 미실현 손실이 50% 늘어난 \$4,860억이라고 발표해 고금리 부담을 다시 확인시켰다.

**⑥ 🇰🇷 SK하이닉스 ADR \$111.98(−9.90%)·코스피200 야간선물 742.60(−4.56%, 11/24 세션 06:00 확정)**

SK하이닉스 ADR은 **\$111.98(−\$12.30, −9.90%)**로 전날 상승분(+20.00%)의 절반가량을 반납했다. 마이크론 −11.01%와 함께 HBM 관련주가 동반 급락했다. 코스피200 야간선물은 06:00 확정 종가 742.60으로 주간 종가 778.10 대비 −35.50포인트(−4.56%) 내렸고, 장중 저가는 731.35였다. 시가 769.90이 사실상 고점이었고 미국 반도체 급락과 함께 밤새 밀렸다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 엔비디아 (NVDA) −5.86% — 젠슨 황 복귀 랠리 하루 만에 차익실현, 10-Q 제출 앞두고 경계**
엔비디아는 \$155.38(−\$9.67, −5.86%)로 마감해 전날 상승폭(+31.48%)의 약 3분의 1을 반납했다. 시가 \$159.10에서 출발해 장중 \$150.50(−8.82%)까지 밀렸다. 이사회가 젠슨 황을 CEO로 복귀시키며 발표한 국가안보·수출통제위원회 설치에도, 황과 메가스피드 임원의 관계에 대한 독립 조사는 계속 진행 중이다. 시장은 이번 주 제출 예정인 10-Q에서 지연 사유와 조사 경과가 어떻게 공개될지를 지켜보고 있고, 12월 인상 확률 95%가 고평가 AI주의 부담을 키웠다.

**2. 아날로그디바이스 (ADI) −17.37% — 4분기 매출 \$43억7,000만(+42%)에도 다음 분기 전망 실망**
아날로그디바이스는 \$312.95(−\$65.80, −17.37%)로 폭락했다. 회사는 회계 4분기 매출이 42% 늘어난 \$43억7,000만이라고 발표했지만, 이번 분기 매출 전망을 \$44억(±\$1억5,000만)으로 제시해 높아진 기대에 못 미쳤다. 장중에는 \$304.23(−19.68%)까지 떨어졌다. 산업·자동차용 아날로그 칩 회복을 기대하던 투자자들이 성장 둔화 신호로 받아들이면서 반도체 업종 전체 매도를 키웠다.

**3. HPE (HPE) −16.33% — 매출 \$145억(+50%)·수주 +88%에도 마진 하락 전망에 급락**
HPE는 \$40.18(−\$7.84, −16.33%)로 마감해 전날 상승분(+17.38%)을 거의 모두 반납했다. 회계 4분기 매출은 50% 늘어난 \$145억, 수주는 88% 급증했고 2027 회계연도 매출 전망도 \$594억~631억으로 올렸다. 그러나 조정 매출총이익률이 2.2%포인트 떨어졌고, 클라우드·AI 부문 영업이익률이 18.4%에서 2027년 약 14%로 낮아질 것이라는 전망이 투자자를 실망시켰다. 안토니오 네리 CEO는 엄청난 모멘텀을 안고 2027년에 들어선다고 강조했다.

**4. 마이크론 (MU) −11.01% — 전날 +19.04% 급등 뒤 메모리주 차익실현**
마이크론은 \$629.79(−\$77.91, −11.01%)로 내려 전날 상승분의 대부분을 반납했다. 시가 \$669.39에서 출발해 장중 \$622.22(−12.08%)까지 밀렸다. 회사가 이달 밝힌 메모리 공급 부족 2028년까지 지속 전망은 유효하지만, 아날로그디바이스와 HPE의 실적 발표 후 AI 하드웨어 수익성에 대한 의구심이 번지며 메모리주가 함께 밀렸다. 샌디스크·시게이트·웨스턴디지털도 5% 이상 떨어졌고 SK하이닉스 ADR은 \$111.98(−9.90%)이었다.

**5. 인스메드 (INSM) +14.13% — 사노피, 주당 \$175 현금·총 \$410억에 인수 합의**
인스메드는 \$170.15(+\$21.06, +14.13%)로 마감했다. 사노피는 인스메드를 주당 \$175 현금, 총 약 \$410억에 인수한다고 발표했으며, 이는 인수설 보도 전인 11월 18일 종가 대비 약 46%의 프리미엄이다. 인스메드의 주력 약 브린수프리는 2025년 8월부터 2026년 9월 말까지 미국에서 \$10억9,000만의 매출을 올렸다. 거래는 주주총회와 규제 승인을 거쳐 2027년 상반기 마무리될 예정이며, 사노피는 2028년 말까지 주당순이익 증대 효과를 예상했다.

**6. 딕스스포팅굿즈 (DKS) +14.59% — 연간 주당순이익 전망 \$11.40~12.25로 상향**
딕스스포팅굿즈는 \$153.17(+\$19.50, +14.59%)로 뛰었다. 회사는 연간 주당순이익 전망을 기존 \$10.94~11.94에서 \$11.40~12.25로 올렸다. 장중에는 \$157.89(+18.12%)까지 올랐다. 인수한 풋락커의 부진 매장을 추가로 닫고 나머지 매장에 재투자하겠다는 계획도 함께 내놓아 수익성 개선 기대를 키웠다.

**7. 애버크롬비앤피치 (ANF) +19.68% — 3분기 사상 최대 매출 \$14억, 연간 전망 상향**
애버크롬비앤피치는 \$168.09(+\$27.64, +19.68%)로 급등했다. 3분기 순매출은 11% 늘어난 \$14억으로 분기 기준 사상 최대였고, 연간 주당순이익 전망을 \$13.70~13.90으로 높였다. 장중에는 \$178.38(+27.01%)까지 치솟았다. 연말 쇼핑 시즌을 앞두고 의류 소비가 견조하다는 신호로 받아들여지며 콜스 등 다른 소매주 강세를 이끌었다.

**8. 콜스 (KSS) +19.53% — 3분기 매출 \$35억(+1.3%)·연간 전망 상향**
콜스는 \$25.34(+\$4.14, +19.53%)로 마감했다. 3분기 순매출은 1.3% 늘어난 \$35억이었고, 주당순이익 \$2.15에는 \$1.16의 세금 혜택이 포함됐다. 회사가 연간 실적 전망을 올리자 시가 \$22.17에서 출발한 주가가 장중 \$25.44(+19.98%)까지 올랐다. 수년간 매출 감소에 시달린 백화점 체인이 성장으로 돌아섰다는 점이 숏커버를 불렀다.

**9. 베스트바이 (BBY) +2.70% — 3분기 동일점 매출 +6.1%로 5년 만에 최고, 연간 전망 상향**
베스트바이는 \$99.62(+\$2.62, +2.70%)로 마감했다. 3분기 매출은 5% 늘어난 \$102억으로 예상치 \$99억을 넘었고, 조정 주당순이익도 \$1.62로 예상치 \$1.49를 웃돌았다. 동일점 매출은 6.1% 늘어 5년 만에 가장 좋은 성장률을 기록했으며, 회사는 2027 회계연도 조정 주당순이익 전망을 \$6.90~7.05로 올렸다. 제이슨 본피그 CEO의 첫 분기 실적이었지만 장중 \$101.77(+4.92%)까지 올랐던 주가는 기술주 약세 속에 상승폭을 줄였다.

**10. 앤트로픽 (ANT) −6.54% — 종가 기준 공모가 \$83 하회, 니덤 자본 수요·내부자 매도 부담 지적**
앤트로픽은 \$81.91(−\$5.74, −6.54%)로 마감해 종가 기준으로 공모가 \$83 아래로 내려갔다. 장중에는 \$75.61(−13.73%)까지 밀렸다. 니덤 애널리스트들은 막대한 자본 수요, 공개되지 않은 신용등급, 내부자 매도 가능성에 따른 물량 부담, 상장 후 차익실현을 약세 요인으로 꼽았다. 회사는 향후 20년간 약 \$9,000억의 컴퓨팅·인프라 지출을 약속한 상태다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **니덤 — 앤트로픽 약세 요인 네 가지.** 막대한 자본 수요, 공개되지 않은 신용등급, 내부자 매도 물량 부담, 상장 후 차익실현. 앤트로픽 \$81.91(−6.54%), 공모가 \$83 하회.
- **프랭클린템플턴 — 2027년 전망, 빅테크 너머로 시야 확대.** AI 대형주가 S&P500의 절반가량을 차지하는 만큼 헬스케어·제조업으로 눈을 돌리고, 채권도 매력적인 이자 수익을 준다고 봤다.
- **UBS 글로벌 웰스매니지먼트 — AI 구조적 투자 스토리는 유효.** 기술주 변동성을 AI 투자 사이클의 붕괴 신호로 보지 않으며, 실제로 돈을 버는 기업과 투기적 성장에 기대는 기업 간 차별화가 커질 것으로 전망했다.

**구루·시장 코멘트**
- **스티븐 도버(프랭클린템플턴 수석 시장전략가)** — 자본은 더 이상 유난히 싸지 않다. 자금 조달 결정이 더 중요해졌고, 밸류에이션 규율이 필수가 된다.
- **마크 헤펠레(UBS 글로벌 웰스매니지먼트 CIO)** — 기술주 흔들림은 구조적 AI 투자 이야기가 깨졌다는 신호가 아니다. 눈에 보이게 돈을 버는 기업과 투기적 성장에 기대는 기업 사이의 차별화가 커질 것이다.
- **크리슈나 구하(에버코어ISI)** — 워시 의장에게 심각한 시험대다. 그가 강경 매파인지 시장 친화적 매파인지 시장은 아직 모른다.
- **안토니오 네리(HPE CEO)** — 엄청난 모멘텀을 안고 2027년에 들어서고 있다.
