## 🗓 시장 요약

**① 알파벳 쇼크에 코스피 5% 급락, 매도 사이드카 발동** — 밤사이 알파벳이 3분기 매출 1,276억달러·영업이익 406억달러로 컨센서스를 밑돈 데다 설비투자가 514억달러(전년 대비 +114%)로 불어나 잉여현금흐름이 −91억달러로 돌아서자 'AI 투자 회수' 우려가 미국 기술주 전반으로 번졌다. 코스피는 개장 직후 3%대 하락에서 낙폭을 5%대로 넓혔고 코스피200 선물 급락으로 매도 사이드카가 발동됐다. 외국인 9,577억원·기관 2,424억원 순매도를 개인이 1조원 넘게 받아내고 있다.

**② 반도체 투톱·AI 부품주가 하락 주도** — SK하이닉스는 −8.52%(거래대금 2조 4,886억원), 삼성전자는 −6.03%(2조 148억원)로 두 종목 거래대금만 4조 5,000억원을 넘었다. 삼성전자는 전날 3분기 영업이익 107조원의 호실적에도 구체적 주주환원책이 빠졌다는 실망이 겹쳤다. 삼성전기(−10.29%)·대덕전자(−15.77%)·이수페타시스(−10.04%) 등 AI 기판·부품주가 더 크게 빠졌고 코스닥 장비주(원익IPS −8.55%, 리노공업 −9.72%)도 동반 약세다.

**③ 방산·전력기기 약세, 해운·제약·보안주 강세** — 한화에어로스페이스가 3분기 영업이익 4,520억원 어닝 쇼크와 폴란드 수출 지연으로 −11.71%, 우주항공과국방 업종이 −7.65%다. 체코 원전 시공계약 협상 결렬로 두산에너빌리티(−4.76%)·대우건설(−5.68%)이 약세다. 반면 금융권 연쇄 해킹 여파로 라온시큐어(+16.88%)·지니언스(+10.20%)·안랩(+10.09%) 등 보안주가 급등했고, 한미약품(+4.63%, 6,347억원 기술수출)·삼성바이오로직스(+4.32%) 등 제약·바이오가 방어주 역할을 하고 있다.

**④ 환율 안정, 해외 증시는 일본 약세·홍콩 강세** — 원/달러는 1,339.10원(−1.40원)으로 증시 급락에도 오히려 소폭 내렸다. 미국 지수 선물은 S&P500 −0.45%, 나스닥100 −1.09%로 추가 하락 중이고 닛케이225도 −2.54%로 반도체 매도가 아시아 전반에 퍼졌다. 항셍은 +1.08%로 홀로 강세다. 전날 FOMC가 금리를 동결하면서도 12월 인상 가능성을 열어 둔 매파적 기조도 위험자산 부담 요인이다.

## 1. 업종별 흐름

**상승 업종** — 해운사 +2.71%(HMM +3.14%), 카드 +2.44%, 소프트웨어 +1.61%(보안주 강세: 라온시큐어 +16.88%, 지니언스 +10.20%, 안랩 +10.09%), 제약 +1.13%(한미약품 +4.63%, 대원제약 +13.12%)가 오른다. 다만 소프트웨어는 16종목 상승·48종목 하락, 제약도 19종목 상승·140종목 하락으로 소수 종목 장세다.

**하락 업종** — 전자장비와기기 −9.32%(삼성전기 −10.29%, 대덕전자 −15.77%), 우주항공과국방 −7.65%(한화에어로스페이스 −11.71%), 반도체와반도체장비 −7.19%(SK하이닉스 −8.52%), 인터넷과카탈로그소매 −6.34%, 전기장비 −5.85%(LS ELECTRIC −6.31%), 복합기업 −5.84%(SK −8.32%, 두산 −9.57%)가 크게 밀렸다.

**시장의 시선** — 오후장은 ①매도 사이드카 해제 뒤 외국인 현물·선물 매도가 진정되는지 ②개인 매수(1조원 이상)가 5,600선을 지지하는지 ③나스닥100 선물(−1.09%) 흐름이 관건이다. 증권가는 삼성전자(키움 업종 Top Pick 유지)·SK하이닉스(4분기 영업이익 118조원 추정) 실적 전망을 유지하고 있어 펀더멘털보다 수급·심리 충격이라는 해석이 많다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 28종목

*① 12시 현재 새로 편입된 급등 대형주 6종목(1～6번) → ② 오전장 언론 최다 보도 22선(7～28번).*

**1. 서울반도체 (046890) 12,570원 · 7,329억원 · +12.23% — 세계 첫 '희토류 없는 백색 LED' 개발에 이틀째 강세**
서울반도체가 희토류 형광체 없이 백색광을 내는 LED를 세계 처음으로 개발했다고 밝히면서 지수 급락 속에도 +12.23% 올랐다. 회사 측은 원가를 절반 수준으로 줄일 수 있다고 설명했고, 전날에는 자회사 서울바이오시스가 같은 재료로 상한가를 기록했다. 중국의 희토류 수출통제가 이어지는 가운데 '탈희토류' 공급망 대안이라는 점이 부각되며 거래대금이 407억원으로 불었다. 최근 대신증권 리포트의 목표가는 9,500원으로 현재 주가를 밑돌아, 추가 상승에는 실제 고객 채택과 실적 반영 확인이 필요하다. [리포트: Daishin 2026-08-12](https://woooty69.github.io/hw-pdf-arch-015/%EC%84%9C%EC%9A%B8%EB%B0%98%EB%8F%84%EC%B2%B4%EF%BC%BB046890%EF%BC%BD_20260812_Daishin_1122480.pdf) · [리포트: Daishin 2026-02-13](https://woooty69.github.io/hw-pdf-arch-003/%EC%84%9C%EC%9A%B8%EB%B0%98%EB%8F%84%EC%B2%B4%EF%BC%BB046890%EF%BC%BD_20260213_Daishin_1073192.pdf)

**2. 지니언스 (263860) 27,550원 · 2,501억원 · +10.20% — 금융권 연쇄 해킹에 보안주 동반 급등**
은행에서 증권·가상자산 거래소까지 해킹 사고가 잇따르면서 네트워크 접근제어(NAC)·제로트러스트 보안 업체인 지니언스가 +10.20% 올랐다. 최근 96시간 관련 뉴스가 16건으로 보안주 가운데 가장 많았고 거래대금도 855억원으로 평소의 수 배다. 다음 달 12일 금융권 정보보호 전시회 'FISCON 2026'에서 AI 보안·제로트러스트 기술이 집중 소개될 예정이라 금융권 보안 투자 확대 기대가 붙었다. 다만 해킹 이슈 테마는 단기 급등 뒤 되돌림이 잦았다는 점에 유의할 필요가 있다. [리포트: Korea Investment 2026-10-27](https://woooty69.github.io/hw-pdf-arch-034/%EC%A7%80%EB%8B%88%EC%96%B8%EC%8A%A4%EF%BC%BB263860%EF%BC%BD_20261027_Korea%2BInvestment_4074731847.pdf) · [리포트: Shinyoung 2026-09-09](https://woooty69.github.io/hw-pdf-arch-018/%EC%A7%80%EB%8B%88%EC%96%B8%EC%8A%A4%EF%BC%BB263860%EF%BC%BD_20260909_Shinyoung_1130079.pdf) · [리포트: Eugene 2026-08-05](https://woooty69.github.io/hw-pdf-arch-013/%EC%A7%80%EB%8B%88%EC%96%B8%EC%8A%A4%EF%BC%BB263860%EF%BC%BD_20260805_Eugene_1119980.pdf)

**3. 인텔리빅스 (420610) 19,460원 · 2,206억원 · +116.22% — 코스닥 상장 첫날 공모가 2배 넘게 상승**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
