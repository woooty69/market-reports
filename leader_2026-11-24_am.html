# 미국→한국 선점 2026-11-23 (미국 2026-11-23 마감 반영)
*아침(미국 마감 반영) · 2호기 자동 생성 · 테마 79개 · 연결 종목 888개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 7개:** Advertising(격차 +18.4%p), Industrial Machinery/Components(격차 +14.8%p), 바이오텍·기술수출(격차 +11.0%p), 전선·케이블(격차 +11.0%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** Medical/Dental Instruments, OLED·디스플레이, 건설·인프라·재건, 해운 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 사이버보안(-30.9%p), 항공·여행·카지노·면세(-19.7%p), Finance: Consumer Services(-8.8%p)
- **이제 막 힘 붙는 조기 테마:** 유전체·유전자치료(조기 75), 반도체 기판·유리기판·MLB(조기 68), 중국 소비·관광 회복(조기 67) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 리가켐바이오(바이오텍·기술수출, 점수 100), LS ELECTRIC(전력기기, 점수 100), 에이비엘바이오(바이오텍·기술수출, 점수 99)
