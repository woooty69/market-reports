## 🗓 주말 요약

**① 이란 혁명수비대 "바레인 미군 레이더에 드론 6대" — 사흘 새 두 번째 주장**
이란 혁명수비대는 일요일(현지 15일) 바레인 리파 공군기지의 미군 방공 레이더를 겨냥해 드론 **6대**를 쐈다고 주장했다. 13일(금) 조기경보 레이더를 파괴했다는 주장에 이어 사흘 새 두 번째다. 바레인 국방군은 방공망이 여러 차례 공격을 막아냈다고 밝혔고, 미 중부사령부는 피해를 확인하지 않았다. 걸프협력회의 자셈 알부다이위 사무총장은 "역내 평화 노력에 대한 노골적 도전"이라고 했고, 카타르는 "위험한 확전"이라고 비판했다. 같은 날 사우디 주도 연합군은 리야드를 향한 탄도미사일 **2발**과 후티 드론 **3대**를 요격했다. 일요일판이 짚은 '현상 유지' 구도가 주말 사이 국지 충돌 쪽으로 기울었다는 점이 새 변수다.

**② 호르무즈 기뢰 피격 잇따라 — 이란 해군 "제한 구역 유조선은 불태우겠다"**
이란 해군은 14일(토) 유조선 **2척**이 기뢰에 닿아 불이 났고, 해협 동쪽에서 **1척**이 추가로 피격됐다고 밝혔다. 15일에는 혁명수비대 해군이 유조선 1척이 침몰하고 1척이 파손됐다고 주장했으며, 24시간 동안 유조선 사고가 **7건**이었다는 집계도 나왔다. 이란 해군은 제한 구역에 들어오는 유조선은 "불태워질 것"이라고 경고했다. 혁명수비대는 케심섬 상공에서 미군 MQ-1 무인기를 격추했다고도 주장했다. 금요일 장중 브렌트는 약 \$96.67까지 올랐지만 주간으로는 두 주 연속 약 2% 하락으로 마쳤던 만큼, 주말 해협 사고가 월요일 유가에 얼마나 반영될지가 첫 관심이다.

**③ 트럼프 "도발이 없으면 공격 보류" — 루비오 "추가 군사행동 불필요"**
로이터는 소식통 세 명을 인용해 트럼프 대통령이 이란과 후티가 다시 미국을 도발하지 않으면 공격을 보류할 수 있다고 참모들에게 말했다고 보도했다. 백악관 관계자는 결정권자는 대통령 한 사람이라고 덧붙였다. 마코 루비오 국무장관은 이란 경제가 이미 약해졌다며 추가 군사행동이 필요 없다는 입장을 되풀이했다. 이란 측 갈리바프 의회 의장은 워싱턴이 이란의 "논리적인 조건"을 받아들이면 종전의 길이 열려 있다고 했다. 미국은 '봉쇄 유지·공습 보류', 이란은 '해협 위협'으로 맞서는 비대칭 대치가 이번 주에도 이어질 가능성이 크다.

**④ 국내 증권가 "이번 주 코스피 5,200~6,000" — 키는 엔비디아**
코스피는 13일 **5,290.53**으로 한 주 동안 **+4.56%(+230.84포인트)** 올라 직전 주 급락분 일부를 되찾았고, 코스닥은 **+8.60%** 뛰었다. 9일 장중 5,018.85까지 밀린 뒤 10일 +4.39%, 11일 +2.60%로 반등했지만 12·13일에는 이틀 연속 내렸다. NH투자증권은 이번 주 코스피 밴드를 **5,200~6,000**으로 제시했다. 금요일 밤 SOX **−3.43%**, SK하이닉스 ADR **−4.30%**, 직전 야간선물 **816.45(−0.72%, 11/13 세션)**가 월요일 아침의 첫 반영분이다.

## 🎯 이번 주 관전 포인트

**1. 엔비디아 — 경영진 교체 후 첫 실적, 숫자보다 '약속 유지'**
엔비디아는 현지 17일 장 마감 뒤 3분기 실적을 낸다. 매출 컨센서스는 약 **\$1,088억(전년 대비 +91%)**으로 회사 가이던스 \$1,080억(±2%)과 비슷하고, 총이익률 가이던스는 **74%(±0.5%p)**다. 시가총액은 10월 고점 \$5조7,700억에서 11월 10일 \$4조700억까지 줄었고, 옵션 시장은 실적 뒤 주가가 **±10.6%** 움직일 것으로 반영해 10년 평균(±7.8%)보다 크다. 숫자 자체보다 콜레트 크레스 임시 CEO가 약 \$5,300억 규모의 투자·보증 약정과 데이터센터 가이던스를 그대로 유지하는지가 반도체 전반의 방향을 정한다. 결과는 한국시간 18일(수) 아침에 반영된다.

**2. 금리 — 10년물 5.15%에서 소매판매·의사록이 다음 걸음을 정한다**
CPI·PPI 연타로 2년물은 주간 +0.37%p 오른 4.88%, 10년물은 5.15%에서 한 주를 마쳤고 12월 25bp 인상 확률은 약 90%다. 17일 10월 소매판매(예상 전월비 +0.1%)가 예상보다 강하면 인상 폭 논의가 커지고, 약하면 금리 상단을 누르는 재료가 된다. 20일 새벽 공개되는 10월 FOMC 의사록과 윌리엄스·해맥 연설에서 '추가 인상 지속' 문구가 얼마나 강한지도 확인해야 한다. 10년물 5%대 안착은 고밸류 성장주와 신흥국 통화에 모두 부담이다.

**3. 호르무즈 — '공습 보류'와 '기뢰 위협' 사이의 유가**
WTI 12월물은 \$88.56, 브렌트 1월물은 \$95.84로 두 주 연속 내렸지만, 주말 사이 기뢰 피격과 바레인 공격 주장이 이어졌다. 트럼프 대통령이 도발이 없으면 공격을 보류한다는 입장이어서 대규모 확전 가능성은 낮지만, 해협 사고가 늘면 운임·보험료를 통해 위험 프리미엄이 다시 붙는다. 19일 선전 3자 회담에서 이란 원유와 해협 문제가 어떻게 언급되는지가 주 후반 변수다.

**4. 앤트로픽 상장 — AI 밸류에이션의 시험대이자 수급 변수**
앤트로픽은 19일 나스닥 상장이 예정돼 있고, 희망가격 상단 기준 기본 공모 규모는 약 **\$643억5,000만**으로 거론된다. 흥행하면 AI 투자 심리를 확인하는 계기가 되지만, 공모 자금 마련을 위한 기존 AI 대형주 매도가 나올 수 있다는 점은 부담이다. 비트코인이 금요일 \$70,000 아래로 내려간 것처럼 금리 상승기 위험자산 디레버리징이 진행 중이라는 점도 함께 봐야 한다.

### 🇰🇷 한국 관전 포인트

국내 증시는 16일(월) 금요일 밤 미국의 **SOX −3.43%·SK하이닉스 ADR −4.30%(\$131.79)·나스닥 −0.91%**를 반영하며 출발한다. 코스피200 야간선물은 직전 11/13 세션이 **816.45(−0.72%)**로 마감했고, 주말 신규 재료는 호르무즈 기뢰 사고 등 지정학 쪽이어서 개장 초 반도체 대형주에 매도 압력이 우선 나타날 수 있다.

이번 주 국내의 최대 변수는 수요일 아침 반영되는 엔비디아 실적이다. NH투자증권 나정환은 실적 자체는 양호할 것으로 보면서도 관심이 경영진 거취와 중국 리스크에 쏠릴 것이라고 했고, 이벤트 확인 뒤 반도체 등 낙폭 과대 업종 중심의 반등을 예상했다. 국내 HBM·기판·전력기기 밸류체인이 직접 영향권이다.

수급은 '외국인 순매수 지속'이 관건이다. 외국인은 코스피 현물을 5일 기준 **+4,608억원** 순매수로 돌아섰지만 13일에는 4거래일 만에 순매도로 바뀌었다. 미국 10년물 5.15%와 달러 강세가 이어지면 외국인 복귀 속도는 느려질 수 있다. 업종으로는 유가 하락 흐름이 항공·화학에 우호적이지만 해협 사고가 늘면 되돌려질 수 있고, 20일 국내 10월 생산자물가지수로 유가 하락의 물가 반영 정도를 확인한다.

- **NH투자증권 — 이번 주 코스피 밴드 5,200~6,000.** 나정환은 엔비디아 실적은 양호할 것으로 보지만 시장 관심은 경영진 거취와 중국 리스크에 쏠릴 것이라며, 주요 이벤트 확인 뒤 반도체 등 낙폭 과대 업종 중심으로 반등할 것으로 판단했다.

- **유안타증권 이재원 — 엔비디아 관전 포인트는 AI 반도체 수요, 새 경영진의 사업계획, 중국 수출 통제 세 가지.**
- **LS증권 황산해 — "단기 반등 참여와 추세적 비중확대를 구분하는 접근을 유지할 필요가 있다."**
- **신한투자증권 강진혁·키움증권 김유미** — 강진혁은 앤트로픽 상장 전후 수급발 변동성에 유의하라고 했고, 김유미는 소매판매·FOMC 의사록·연준 위원 발언으로 미국 경기와 통화정책 방향을 확인하는 주라고 짚었다.
