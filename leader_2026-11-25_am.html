- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 12개:** Advertising(격차 +24.8%p), Medical/Dental Instruments(격차 +23.4%p), 바이오텍·기술수출(격차 +19.6%p), Industrial Machinery/Components(격차 +18.8%p) — 이번 리포트의 핵심 선점 영역.
