## 🗓 시장 요약

**① 나스닥 +0.45% 이틀째 사상 최고·다우 −0.36% — '뮤즈 승자'와 '뮤즈 피해주'가 같은 날 갈렸다**
연준 인상 이후 다섯째 거래일, 지수는 방향이 갈렸다. 나스닥은 **27,244.28(+122.18, +0.45%)**로 이틀 연속 사상 최고치를 새로 썼고 러셀2000도 2,891.13(+0.55%)로 올랐지만, S&P500은 **7,764.64(−0.06, −0.00%)**로 제자리였고 다우는 **51,863.69(−185.14, −0.36%)**로 밀렸다. 메타의 개인 AI 에이전트 '뮤즈'가 출시 12일 만에 280만 다운로드로 챗GPT 초기 속도를 넘어섰다는 집계가 나오면서 메모리·반도체·소프트웨어는 올랐지만, 뮤즈가 예금 이동·구독 해지·보험 갈아타기를 대신 해준다는 서사가 은행·보험·통신·여행·구독주를 한꺼번에 눌렀다 — S&P500 금융 업종 −2.4%, 찰스슈왑 −6.11%, JP모건 −3.42%, 올스테이트 −5.50%, 플래닛피트니스 −9.46%. 캐피털닷컴의 카일 로다는 "메타의 AI 출시가 가장 의미 있는 촉매로 보이며, 유가 하락과 건설적인 미중 무역 발언이 더해졌다"고 했다. 해석하면 전날의 '유가 하락 + AI' 랠리가 하루 만에 'AI 안에서의 승자·패자 선별'로 바뀌었고, 지수가 보합인 날에도 업종 간 회전은 매우 컸다.

**② WTI \$94.59(−1.24%) 닷새째 하락 — 브렌트 \$99.25, 미국-이란 외교 기대에 2주 최저**
WTI는 **\$94.59(−\$1.19, −1.24%)**, 브렌트는 **\$99.25(−\$1.09)**로 닷새 연속 내려 2주 만의 최저였다. 사우디 수출 회복에 이어 이란 페제시키안 대통령의 유엔총회 참석과 미국-이란 접촉 기대가 이어졌고, 목요일 트럼프·시진핑 정상회담을 앞두고 무역·AI 협력에 대한 건설적 발언이 위험선호를 지탱했다. 금 12월물은 \$4,376.40(−0.17%)로 소폭 밀렸고 은은 \$66.53(+0.17%)였다. 해석하면 유가는 \$95를 내주며 인플레이션 기대를 더 낮췄지만, 금리가 오히려 오른 날이어서 '유가 하락 = 금리 하락' 공식이 이날은 작동하지 않았다.

**③ 2년물 4.76%(장중 4.79%, 2년여 만의 고점)·10년물 4.98% — 바킨 "공급 충격은 일회성이 아니다", 추가 인상 문 열어둬**
2년물 금리는 **4.762%(+0.9bp)**로 장중 4.7879%까지 올라 2년여 만의 고점을 다시 썼고 10년물은 **4.976%(+1.3bp)**로 5%에 다시 다가섰다. 리치먼드 연은 바킨 총재는 "지나가는 충격이라던 것들이 단기·일회성으로 끝나지 않고 있다"며 관세·중동 분쟁·AI 공급망 스트레스가 해소되는 데 시간이 걸린다고 했고, "인플레이션이 목표보다 1%p 이상 높은 것은 문제"라며 "추가 인상이 필요할지, 몇 번일지는 두고 보자"고 말했다. 그는 PCE 구성 항목의 60% 이상이 연 3% 넘게 오르고 있고 기업의 내년 가격 인상 기대가 4.1%로 팬데믹 전의 두 배라고 덧붙였다. 리치먼드 연은 9월 제조업지수는 −2로 예상(−1)을 밑돌았고 출하지수는 +11에서 −5로 급락했다. 달러인덱스는 100.60(+0.17%), 엔/달러 157.47이었다. 해석하면 유가가 내려도 연준 인사들의 톤은 '인상 지속' 쪽에 있고, 2년물 4.79%는 12월 추가 인상 확률(CME 88%)을 그대로 반영한다 — 주 후반 PCE가 이 톤을 바꿀 수 있는 첫 데이터다.

**④ 메모리로 돌아온 반도체 — 마이크론 +5.00%·샌디스크 +6.82%(로젠블랫 목표가 \$2,400 신규 매수)·SKHY +3.45%, CPU 3인방은 숨 고르기**
필라델피아 반도체지수는 약 12,400(약 +1.6%)으로 100일 이동평균 위에 안착했지만 고점 대비 15% 아래에 있다. 전날 CPU(Arm·인텔·AMD)로 쏠렸던 자금이 이날은 메모리로 돌아왔다 — 마이크론(MU) **\$1,096.16(+5.00%)**, 샌디스크(SNDK) **\$1,887.04(+6.82%)**, SK하이닉스 ADR(SKHY) **\$195.37(+3.45%)**. 로젠블랫은 샌디스크를 목표가 \$2,400의 매수로 신규 커버하며 "낸드는 원가 중심의 범용재가 아니라 AI 인프라의 전략 부품"이라고 했고, 스티펠은 마이크론 목표가 \$1,500 매수를 유지하며 회계연도 4분기·1분기 실적이 컨센서스를 웃돌 것이라고 했다. 마이크론은 2027년 DRAM 공급 부족을 해소하려면 비트 성장 40~50% 이상이 필요하고 HBM4 비트당 가격이 2027년 협상에서 두 배가 될 수 있다는 분석이 붙었다. AMD(AMD) \$623.77(+1.34%), 인텔(INTC) \$123.86(+1.71%), Arm(ARM) \$333.20(+3.19%), 엔비디아(NVDA) \$228.87(+0.66%)로 전날 급등주는 상승 폭이 줄었다. 해석하면 AI 반도체 안에서 주도주가 하루 단위로 회전하는 흐름이 사흘째이며, 주 후반 마이크론 실적이 메모리 쪽에 다음 재료를 준다.

**⑤ 회사 고유 재료 — 바이킹 +35.67%(VK2735 유지요법 데이터), 레나 +6.38%(버크셔 \$2.1억 매수), 오토존 +3.26%(EPS \$56.05 서프라이즈), 암젠 +4.34%(쇼그렌 3상 성공), 슈왑 −6.11%·플래닛피트니스 −9.46%(뮤즈 피해주)**
바이킹테라퓨틱스(VKTX)는 GLP-1/GIP 후보 VK2735의 유지요법 연구에서 33주 위약 조정 체중 감소 21.7%와 격주·월 1회 투여 시 감량의 97%·90% 유지를 확인해 **\$40.85(+35.67%)**로 폭등했고, 레나(LEN)는 3분기 신규 주문 −9%·마진 15.8%의 부진에도 버크셔해서웨이가 9/17~21 \$2.124억어치를 사들여 지분 10%를 넘겼다는 공시에 **\$83.06(+6.38%)**로 올랐다. 오토존(AZO)은 4분기 EPS \$56.05로 예상 \$53.98을 넘고 동일점포매출 +2.7%·매출총이익률 53.3%(관세 환급 145bp 기여)를 내놓아 **\$2,894.73(+3.26%)**, 암젠(AMGN)은 전신성 쇼그렌병 후보 다조달리벱의 3상 OASIZ 301 주평가지표 충족에 **\$410.24(+4.34%)**였다. 반대로 찰스슈왑(SCHW) **\$100.35(−6.11%)**, 올스테이트(ALL) \$229.50(−5.50%), 웰스파고(WFC) \$83.15(−3.92%), JP모건(JPM) \$340.00(−3.42%), 버라이즌(VZ) \$46.45(−2.58%), 부킹홀딩스(BKNG) \$164.22(−2.55%), 플래닛피트니스(PLNT) **\$42.60(−9.46%)**가 '뮤즈가 고객 관성을 없앤다'는 골드만삭스 트레이딩 데스크의 경고에 동반 급락했다. 메타(META) 자신은 장중 \$757.27까지 올랐다가 **\$736.60(−0.63%)**로 되돌렸고, 게임스톱(GME)은 라이언 코언 CEO의 110만 주(\$2,600만) 장내 매수에 \$24.03(+5.58%), 모더나(MRNA)는 \$182.56(+5.56%)였다.

**⑥ 🇰🇷 코스피 +0.15%(7,017.91) — 장중 7,171 찍고 상승분 반납, 개인 −1.6조 매도, 삼성전자 +0.91%·SK하이닉스 −1.50%·SKHY +3.45% — 괴리율 약 +40.2% → 약 +44.2%**
9/22 코스피는 나스닥 사상 최고를 받아 **7,161.61(+2.20%)**로 출발해 장중 7,171.44까지 올랐지만 상승분을 거의 다 반납하고 **7,017.91(+10.19, +0.15%)**로 마감했고 코스닥은 834.38(−0.23%)였다. 외국인은 코스피에서 **+762억원**으로 사흘째 순매수였지만 규모가 줄었고 기관은 −1,218억원, 개인은 **−1조6,068억원**으로 대규모 차익을 실현했다. 삼성전자(005930)는 **276,500원(+0.91%)**로 이틀째 올랐고 SK하이닉스(000660)는 **1,840,000원(−1.50%)**로 밀렸으며 삼성전기(009150)는 +3.99%로 PCB·기판 강세를 이끌었다. 원/달러는 **1,358.2원(−22.8원)**으로 급락해 원화가 크게 강해졌다. 미국에서는 SKHY가 시가 \$187.05·고가 \$196.48·저가 \$186.37을 거쳐 **\$195.37(+3.45%, +\$6.51)**로 마감해 국내 원주(−1.50%)와 반대로 움직였고, 괴리율은 원화 강세(환율 −22.8원)와 ADR 상승이 겹쳐 약 +40.2%에서 **약 +44.2%**로 다시 벌어졌다. 코스피200 야간선물은 **1,140.70(+28.70, +2.58%)**로 마감했다 — 시가 1,110.20에서 저가 1,110.20을 지키며 고가 1,143.75까지 오른 뒤 고가 부근에서 끝나 정규장 선물 종가 1,112.00 대비 큰 폭 위이며, 정규장에서 반납한 상승분을 야간이 되찾은 모양이다.

- **통신·여행·구독** — 버라이즌(VZ) −2.58%(\$46.45), T모바일 −2.09%, AT&T −1.63%, 부킹홀딩스(BKNG) −2.55%(\$164.22), 익스피디아(EXPE)는 장중 −6.35%(\$263.18)까지 밀렸다가 −0.11%(\$280.70)로 회복, 플래닛피트니스(PLNT) −9.46%(\$42.60). 같은 '뮤즈 피해주' 묶음이며 다우 −0.36%의 주된 원인이었다.
- **대형 기술 일부·에너지** — 메타(META) −0.63%(\$736.60, 장중 \$757.27에서 반락), 마이크로소프트(MSFT) −0.72%(\$498.00), 노보노디스크(NVO) −1.01%(\$39.40). WTI 닷새째 하락(\$94.59)에 정유·시추주도 약세를 이어갔다.

**시장의 시선** — 전날 "AI 추론과 유가 하락"이었던 답이 화요일에는 "AI가 누구의 매출을 빼앗는가"로 바뀌었다. 나스닥이 이틀째 최고치를 쓰는 동안 다우가 밀린 것은 뮤즈 280만 다운로드가 은행·보험·통신·구독의 '고객 관성 프리미엄'을 위협한다는 골드만삭스 데스크와 블룸버그 인텔리전스의 경고 때문이었고, 메타 자신도 −0.63%로 쉬어 '기대 → 검증' 구간에 들어섰다. 금리는 유가 하락에도 올랐고 2년물 4.79%는 바킨의 "추가 인상 필요 여부는 두고 보자"는 말을 그대로 반영한다. 목요일 트럼프·시진핑 정상회담, 수요일 그레일 자문위·메타 커넥트, 주 후반 PCE·마이크론 실적이 남아 있다. 한국 시장에는 '야간선물 +2.58% + 메모리 반등(SKHY +3.45%) + 원/달러 1,358원'이라는 우호적 조합이 도착하지만, 전날 정규장이 +2.2% 갭 출발 후 상승분을 다 반납했다는 점과 추석 연휴 전 마지막 거래일이라는 점이 갭을 지키기 어렵게 만드는 요인이다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 메타 플랫폼스 (META) −0.63% — \$736.60, 뮤즈 12일 만에 280만 다운로드로 챗GPT 초기 속도 추월·페이팔 결제 제휴, 장중 \$757.27에서 반락**
메타는 시가 \$731.47에서 장중 \$757.27까지 올라 사상 최고권을 다시 시험했지만 \$736.60(−\$4.65, −0.63%)로 마감해 전날 +11.43%의 급등을 소화했다. 개인 AI 에이전트 '뮤즈'는 출시 12일 만에 280만 다운로드로 챗GPT의 같은 기간 130만을 넘었고 애플 앱스토어 무료 앱 1위를 나흘째 지켰으며, 페이팔(PYPL)이 뮤즈 안의 AI 쇼핑 결제 파트너로 발표돼 페이팔은 +0.51%(\$52.89)로 올랐다. 에버코어 ISI의 마크 마하니는 "메타가 뮤즈로 히트작을 손에 넣었다"고 했고, 뮤즈 출시 이후 메타 시가총액은 약 \$2,000억 늘었다. 9/23 개막하는 메타 커넥트에서 뮤즈 후속 기능과 웨어러블이 발표될 예정이며, 뮤즈가 은행·보험·구독 산업을 흔든다는 서사가 이날 금융 업종 −2.4%의 배경이 됐다는 점에서 메타는 '수혜주'이자 '논쟁의 진원지'였다.

**2. 바이킹 테라퓨틱스 (VKTX) +35.67% — \$40.85, GLP-1/GIP 후보 VK2735 유지요법 연구에서 33주 체중 감소 21.7%·격주 투여로 감량 97% 유지**
바이킹은 시가 \$37.08에서 장중 \$41.73까지 올라 \$40.85(+\$10.74, +35.67%)로 마감해 하루 상승률로 올해 최대였다. 회사가 발표한 비만 성인 약 180명 대상 VK2735 피하주사 임상 연구에서 21주 유도기 동안 주 1회 투여군은 16~19%(위약 0%)를 감량했고, 33주 시점 위약 조정 감량은 21.7%로 정체 없이 이어졌으며 12주 유지기에 격주 투여는 감량의 약 97%, 월 1회 투여는 약 90%를 유지했다. 21주 시점 5% 이상 감량 98%·10% 이상 90%·15% 이상 65%·20% 이상 32%였고, 유지기 위장관 부작용은 위약과 비슷했으며 중단율은 낮았다. 회사는 경구 유지요법을 검증하는 2부를 예고했고, 노보노디스크(NVO)가 전날 성장 전략 실망으로 −7.96% 급락한 직후여서 '월 1회 유지요법'이라는 차별점이 부각됐다 — 일라이릴리(LLY) +0.45%, 노보 −1.01%.

**3. 찰스 슈왑 (SCHW) −6.11% — \$100.35, 메타 뮤즈가 '고금리 예금 이동·구독 해지'를 대행한다는 서사에 금융 업종 −2.4% 동반 급락**
찰스슈왑은 시가 \$106.50에서 장중 \$99.30까지 밀린 뒤 \$100.35(−\$6.53, −6.11%)로 마감해 S&P500 금융주 중 가장 큰 폭으로 내렸다. 골드만삭스 트레이딩 데스크는 이날 리포트에서 뮤즈가 저금리 예금을 고금리 계좌로 옮기고 쓰지 않는 멤버십을 해지하며 보험을 갈아타는 작업을 자동으로 해주기 때문에 "반복 청구·부가 서비스·고객의 무관심에 의존하는 산업이 심각한 교란에 직면한다"고 경고했고, 블룸버그 인텔리전스의 만딥 싱은 개인 AI 비서가 기존 디지털 창구의 고객 트래픽을 빼앗는 '통행료 징수자'가 될 수 있다고 했다. JP모건(JPM) −3.42%(\$340.00), 웰스파고(WFC) −3.92%(\$83.15), 모건스탠리 −2.62%, 올스테이트(ALL) −5.50%(\$229.50), 프로그레시브 −2.54%가 같은 논리로 팔렸고 금융 업종 지수는 −2.4%였다. 슈왑처럼 무이자 예금(캐시 스윕) 마진 비중이 큰 회사가 가장 민감하다는 점이 낙폭의 차이를 만들었으며, 10월 중순 3분기 실적에서 예금 이동 데이터와 순이자마진 전망이 확인되기 전까지는 서사가 주가를 움직이는 구간이다.

**4. 레나 (LEN) +6.38% — \$83.06, 3분기 신규 주문 −9%·마진 15.8% 부진에도 버크셔해서웨이 \$2.124억 추가 매수로 지분 10% 돌파**
레나는 시가 \$81.00에서 장중 \$83.37까지 올라 \$83.06(+\$4.98, +6.38%)로 마감했다. 3분기 실적은 신규 주문 20,879채(−9%), 인도 20,840채(−3%), 매출총이익률 15.8%(전년 17.5%)로 부진했고 2026년 인도 가이던스도 82,000~83,000채에서 80,000~81,000채로 낮췄지만, 버크셔해서웨이가 9/17~21 클래스A 267만 주·클래스B 75,021주 등 약 \$2.124억어치를 사들여 보유 지분이 10%를 넘겼다는 SEC 공시가 주가를 끌어올렸다. 버크셔의 보유는 클래스A 2,372만 주·클래스B 528,217주가 됐다. 레이먼드제임스는 언더퍼폼을, KBW는 목표가 \$75 하향, 트루이스트는 보유·\$75를 유지하며 모기지 금리와 토지 뱅킹에 따른 마진 압박을 지적했고, 52주 고가 \$133.76 대비 여전히 40% 가까이 낮은 수준이어서 '버크셔 매수 = 바닥 신호' 해석과 '실적 악화 지속' 해석이 맞서고 있다.

**5. 샌디스크 (SNDK) +6.82% — \$1,887.04, 로젠블랫 목표가 \$2,400 매수 신규 커버 "낸드는 AI 인프라의 전략 부품", 메모리 3사 동반 상승**
샌디스크는 시가 \$1,757.51에서 장중 \$1,909.48까지 올라 \$1,887.04(+\$120.40, +6.82%)로 마감했다. 로젠블랫은 샌디스크를 목표가 \$2,400(전일 종가 대비 35% 상승 여지)의 매수로 신규 커버하며 낸드 플래시가 원가 경쟁 중심의 범용재가 아니라 AI 인프라에서 전략적으로 중요한 부품이 되고 있다고 했고, AI 추론 워크로드가 늘수록 고용량 스토리지 수요가 구조적으로 늘어난다는 논리를 폈다. 같은 날 스티펠은 마이크론(MU)의 목표가 \$1,500 매수를 유지하며 회계연도 4분기·1분기 실적이 컨센서스를 웃돌 것이라고 했고, 마이크론 +5.00%(\$1,096.16), SK하이닉스 ADR(SKHY) +3.45%(\$195.37), 시게이트 소폭 상승으로 메모리·스토리지가 동반 강세였다. 메타 뮤즈 인기가 AI 거래 전반에 활기를 되돌린 것도 배경이며, 주 후반 마이크론 실적이 낸드 가격 가이던스를 확인해 줄 다음 촉매다.

**6. 오토존 (AZO) +3.26% — \$2,894.73, 4분기 EPS \$56.05로 예상 \$53.98 상회·동일점포매출 +2.7%·관세 환급으로 매출총이익률 53.3%**
오토존은 시가 \$2,894.25에서 장중 \$2,998.00까지 올랐다가 \$2,894.73(+\$91.48, +3.26%)로 마감했다. 회계연도 4분기 EPS는 \$56.05로 컨센서스 \$53.98을 넘었고 매출은 \$65.95억으로 예상 \$66.81억에 소폭 못 미쳤지만, 총 동일점포매출 +2.7%(국내 +1.6%·해외 +10.7%)와 관세 환급 145bp가 기여한 매출총이익률 53.3%(+182bp)가 이익을 끌어올렸다. 연간 매출은 \$203억이었고 분기 중 175개 매장을 새로 열었다. 필 다니엘 CEO는 "어려운 출발 뒤 분기 마지막 8주에 매출이 개선됐다"며 시장 점유율 확대가 이어지고 있고 2027 회계연도에 성장이 가속될 것으로 본다고 했다. 관세 환급이라는 일회성 요인이 이익 서프라이즈의 상당 부분을 만들었다는 점은 장중 고가에서 되돌린 이유로 지목된다.

**7. 암젠 (AMGN) +4.34% — \$410.24, 전신성 쇼그렌병 후보 다조달리벱 3상 OASIZ 301 주평가지표 충족, 승인 치료제 없는 영역의 계열 최초 후보**
암젠은 시가 \$403.50에서 장중 \$412.99까지 올라 \$410.24(+\$17.08, +4.34%)로 마감했다. 회사는 전신성 쇼그렌병을 겨냥한 다조달리벱의 3상 OASIZ 301 연구가 48주 시점 전신 질환 활성도에서 통계적으로 유의하고 임상적으로 의미 있는 개선을 보여 주평가지표를 충족했다고 발표했고, 효과는 이르면 4주 차부터 관찰됐다. 쇼그렌병은 현재 FDA 승인을 받은 질환 조절 치료제가 없는 영역이어서 다조달리벱은 계열 최초 신약 후보가 될 수 있다. 시티와 바클레이즈는 보유 의견을 유지했지만 다른 애널리스트는 탄탄한 펀더멘털과 후기 파이프라인을 근거로 매수를 유지했고, 52주 고가 \$447.03 대비 8% 아래여서 헬스케어 업종 강세 속 방어주로도 자금이 들어왔다.

**8. 플래닛 피트니스 (PLNT) −9.46% — \$42.60, '뮤즈가 안 쓰는 멤버십을 해지해 준다'는 구독 경제 교란 우려에 급락**
플래닛피트니스는 시가 \$48.23에서 장중 \$41.79까지 밀린 뒤 \$42.60(−\$4.45, −9.46%)로 마감해 이날 S&P 구성 종목 중 최대 낙폭권이었다. 메타 뮤즈가 이용자의 결제 내역을 읽고 쓰지 않는 구독·멤버십을 자동으로 해지해 준다는 기능이 알려지면서, 회원의 상당수가 '가입만 하고 안 나오는' 구조에 수익성을 의존하는 저가 피트니스 모델이 직접 타깃이 될 수 있다는 분석이 나왔다. 골드만삭스 트레이딩 데스크는 반복 청구와 고객 무관심에 기대는 산업의 교란을 경고했고, 같은 논리로 통신(버라이즌 −2.58%·T모바일 −2.09%·AT&T −1.63%)과 보험(올스테이트 −5.50%·프로그레시브 −2.54%)이 함께 팔렸다. 실제 해지율 변화는 다음 분기 실적에서야 확인되기 때문에 당분간은 뮤즈 이용자 수와 기능 확장 발표가 주가 변수다.

마이크론은 시가 \$1,033.28에서 장중 \$1,097.25까지 올라 고가 부근인 \$1,096.16(+\$52.20, +5.00%)로 마감했다. 스티펠은 목표가 \$1,500의 매수를 유지하며 회계연도 4분기와 1분기 실적이 컨센서스를 웃돌 것으로 봤고, 2027년 DRAM 공급 부족을 해소하려면 비트 성장이 40~50% 이상 필요하며 2027년 공급 협상이 마무리되면서 HBM4 비트당 가격이 두 배가 될 수 있다는 분석이 마진 기대를 키웠다. 로젠블랫의 샌디스크(SNDK) 매수 신규 커버(목표가 \$2,400)로 낸드까지 재평가되면서 샌디스크 +6.82%, SK하이닉스 ADR(SKHY) +3.45%와 메모리 3사가 동반 상승했고, 전날 CPU 3인방(Arm·인텔·AMD)에 밀렸던 메모리가 하루 만에 주도권을 되찾았다. 오픈AI·앤스로픽의 AI 인프라 투자가 이어진다는 보도도 수요 우려를 눌렀으며, 주 후반 실적에서 HBM 가이던스와 낸드 가격 전망이 확인되면 \$1,100 안착 여부가 정해진다.

**10. SK하이닉스 ADR (SKHY) +3.45% — \$195.37 (괴리율: 약 +44.2%), 메모리 3사 동반 상승에 장중 \$196.48·원화 강세로 괴리율 확대**
SKHY는 시가 \$187.05·고가 \$196.48·저가 \$186.37에서 \$195.37(+\$6.51, +3.45%)로 마감해 마이크론(MU) +5.00%·샌디스크(SNDK) +6.82%와 함께 메모리 3사 동반 상승에 올라탔다. 로젠블랫의 샌디스크 매수 신규 커버와 스티펠의 마이크론 매수 유지가 낸드·DRAM을 동시에 재평가했고, 2027년 HBM4 비트당 가격이 두 배가 될 수 있다는 분석은 HBM 1위인 SK하이닉스에 가장 직접적인 재료였다. 그러나 국내 원주 SK하이닉스(000660)는 같은 날 1,840,000원(−1.50%)으로 내렸고 원/달러가 1,358.2원(−22.8원)으로 급락하면서, 괴리율은 ADR 10주 = 원주 1주 기준 약 +40.2%에서 **약 +44.2%**로 다시 벌어졌다 — 지난주 +45.1%까지 갔다가 +39.8%로 좁혀진 뒤 사흘 만의 확대다. 애널리스트 평균 목표주가 \$248.43 대비 상승 여지는 27% 안팎으로 줄었고, 주 후반 마이크론 실적과 추석 연휴(9/24~26) 중 국내 원주가 쉬는 사흘이 괴리율의 다음 변수다.

### 🇰🇷 한국 개장 관전 포인트
- **야간선물이 +2.58%(1,140.70)로 정규장에서 반납한 상승분을 되찾았다.** 시가 1,110.20에서 저가를 시가에 두고 고가 1,143.75까지 오른 뒤 고가 부근에서 마감해 정규장 선물 종가 1,112.00 대비 +28.70포인트다. 다만 전날 코스피는 +2.20% 갭 출발 후 +0.15%로 끝났고 개인이 1.6조원을 팔았다 — 오늘도 갭 상승 출발 뒤 개장 30분 안에 갭을 지키는지가 첫 관문이다.
- **메모리가 돌아왔다 — SKHY +3.45%(\$195.37)·마이크론 +5.00%·샌디스크 +6.82%.** 국내 원주 SK하이닉스는 전날 −1.50%(1,840,000원)로 미국과 반대로 움직여 괴리율이 약 +44.2%로 벌어졌다. 로젠블랫·스티펠의 낸드·DRAM 재평가와 HBM4 가격 두 배 분석은 SK하이닉스·삼성전자 모두에 우호적이며, 전날 강했던 삼성전기 등 PCB·기판주에도 이어질 재료다.
- **원/달러 1,358.2원(−22.8원) 급락.** 원화 강세는 외국인 순매수(사흘째, +762억원)에 우호적이지만 규모가 줄고 있다. 달러인덱스 100.60(+0.17%)·엔/달러 157.47로 달러가 강한 날에도 원화만 강해진 것은 연휴 전 수출 네고와 외국인 선물 매수의 영향일 가능성이 크며, 연휴 뒤 되돌림 여부를 봐야 한다.
- **추석 연휴 전 마지막 거래일.** 연휴 첫날이 트럼프·시진핑 정상회담이고 연휴 중 그레일 자문위 결과·메타 커넥트·PCE·마이크론 실적이 몰려 있다. 사흘간 미국 변동을 못 받는 만큼 오후로 갈수록 현물·선물 포지션 축소가 수급에 나타날 수 있고, 야간선물의 갭이 오후까지 유지되기 어려운 구조다.
- **'뮤즈 피해주' 논리의 국내 이식 여부.** 미국에서는 은행·보험·통신·구독주가 −2.4~−9.5% 밀렸다. 국내 금융·통신주에 같은 서사가 붙을지는 미지수지만, 반대로 네이버·카카오 등 자체 AI 에이전트를 가진 플랫폼과 결제(페이팔 +0.51%)에는 '통행료 징수자' 서사가 긍정적으로 붙을 수 있다.
- **금리·유가의 엇갈림.** WTI \$94.59로 닷새째 내렸지만 2년물은 4.79%로 2년여 고점을 다시 썼고 바킨은 추가 인상 문을 열어뒀다. 유가 하락은 항공·화학·운송에, 금리 상승은 성장주에 반대 방향 재료이며, 12월 인상 확률 88%는 그대로다.
