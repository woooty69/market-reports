# 🌍 이란·우크라이나 전쟁보고서 (일간)
### 2026년 10월 25일(일) 05:10 · 수집 구간: 직전 24～30시간

## 핵심 3줄
- WSJ "트럼프, 이란 공격 재개 쪽으로 기울어"… 트럼프 "또 한 번 작은 Epic Fury" [B]
- 브렌트 116.72달러 정산(+3.1%) 4월 말 이후 최고… 후티 "사우디 7개 작전" [B]
- 올레시키 휴전 "양측 이행 중"… 미 당국자 "2주 내 아부다비·스위스 3자 협상" [B]

## 1. 이란·중동

### 미국-이란 — 트럼프 "또 한 번 Epic Fury", WSJ "재개 쪽으로 기울어·결정은 아직"
- 트럼프는 10/23 플로리다 포트마이어스 유세에서 "또 한 번 작은 Epic Fury(이번 전쟁의 미군 작전명)를 할 수도 있다"고 했다 **[A]** (로이터, 발언 자체). 같은 날 오전엔 "빨리 끝낼지, 시들게 둘지" 고민한다고 했고, 10/8 '중간선거(11/3) 전 공격 없음' 약속은 거두지 않았다.
- WSJ는 미 당국자들을 인용해 트럼프가 대이란 군사행동 재개 쪽으로 기울었지만 최종 결정은 없다고 보도했다. 선택지는 핵·기반시설(교량 등) 타격부터 이란이 장악한 섬 작전까지라고 했다 **[C]** (WSJ, Ynet·Eastern Herald 재인용). 일부 당국자는 에너지 가격 상승을 이유로 반대한다고 전했다. 백악관은 10/22 '선거 전 공격 없음, 모든 선택지 유지'를 반복했다 **[B]** (ABC).
- 블룸버그는 미국이 3번째 항모전단과 수병·해병 약 1만 명을 걸프로 보내며 공습 재개에 대비하고 있고 시점은 불확실하다고 보도했다 **[C]** (블룸버그, 재인용 기사 기준). 같은 보도는 이란이 선거 전후 폭격에 대비해 이스라엘·UAE 보복을 준비 중이라는 소식통 발언을 실었다 **[C]**.
- 미 국가정보장실(DNI) 제이 클레이턴은 10/23 루비오 국무장관에게 보낸 메모에서 이란이 미국 인원 겨냥 시도를 "크게 늘렸고", 중동과 일부 국가에서 미국 시민 대상 살해 음모가 "진전된 단계"라고 썼다 **[B]** (악시오스 최초 보도, 로이터·Fox 확인). CNN은 미국이 레바논·UAE·카타르·요르단에서 일부 외교관과 가족을 조용히 빼고 있다고 보도했고, 국무부는 '운영 제한'일 뿐 공식 상태 변경은 없다고 했다 **[B]** (CNN, 국무부 답변). 국무부는 사우디·UAE·카타르·오만 등 약 12개국 여행경보를 갱신하면서 "후티의 새 능력을 뜻하진 않는다"고 했다 **[A]** (로이터).
- 이란 측: 압둘라히 총참모장은 "어떤 상황에서도, 언제든 미 군함의 페르시아만 진입을 허용하지 않겠다"고 했다 **[A]** (국영TV·타스님, CBS·Al Jazeera). 모하자라니 정부 대변인은 "자위에 어떤 강대국의 허락도 필요 없다"고 했고 **[A]** (Mehr), IRGC 모헤비 대변인은 미·이스라엘 공격의 파장이 이란 국경을 넘을 것이라고 경고했다 **[A]** (IRNA·Mehr). 이라크 이슬람저항세력은 전쟁 재개 시 이란 편에 서겠다고 했다 **[A]** (Mehr·PressTV).
- 페제시키안 대통령은 국영TV에서 "협상 중이었는데 겁쟁이들(미국)이 다 망쳤다… 그래도 가서 마무리해야 한다고 본다"며 잠정 합의 재시도를 주장했다 **[A]** (로이터, 발언 자체). 그는 '전쟁도 평화도 아닌 상태'를 끝내야 예측 가능한 국정 운영이 가능하다고도 했다 **[A]** (Tehran Times·AFP). 모즈타바 하메네이 최고지도자는 사법부에 미·이스라엘 상대 배상 청구를 지시했다 **[A]** (IRNA).
- 핵: 이란·러시아·중국·파키스탄 등 12개국은 유엔총회 제1위원회에서 IAEA 안전조치 대상 핵시설 공격 금지 공동성명을 냈다 **[A]** (IRNA·Tehran Times). 다르지 유엔대사는 "안전조치 의무를 포기도 중단도 하지 않았다"고 했다 **[A]**. 주이란 러시아대사관은 부셰르 원전 인력 철수 보도를 부인했다 **[A]** (러시아대사관 성명, IRNA).
- 이란 내부: Iran International은 시스탄-발루치스탄 무장세력 공격이 10/10까지 18일간 18건으로 어느 한 달보다 많았다고 집계했다 **[C]** (반정부 매체 집계). 정보부·IRGC는 케르만샤에서 외국 정보기관 연계 2명을 체포했다고 밝혔다 **[C]** (Mehr). Fox·Iran International은 선박 자료상 이란 '그림자 유조선단'의 해상 재고가 바닥났다고 보도했다 **[C]**.
- 왜 다르게 말하나: 트럼프는 유세장에서 'Epic Fury' 재개를 띄워 지지층을 결집하면서도 '선거 전 공격 없음'은 유지해 유가 부담을 피한다. 이란 대통령의 '잠정 합의 재시도'와 군 지휘부의 '걸프 진입 불허'가 동시에 나온 것은 협상 문을 열어 두되 공격 비용을 키워 보이려는 이중 신호다(판단).

### 호르무즈·걸프 해상 — IRGC '이틀 새 9척' 주장 vs 미국 '거짓', UAE 기름 유출 확산
- IRGC는 10/22～23 밤 유조선 7척이 피격되거나 기뢰에 걸렸고, 10/23에는 초대형 유조선 2척이 기뢰에 맞았다고 주장했다 **[D]** (IRGC, Al Jazeera 인용). 트럼프는 이를 "유가를 올리려는 거짓말"이라고 했다 **[A]** (발언, CBS). 로이터 인용 업계 분석은 UKMTO가 이번 주 확인한 공격을 2건으로 봤다 **[B]** (FinanceFeeds·로이터). 선박명·기국이 공개된 사례는 여전히 없다.
- 이란 국영TV는 '규정 위반 선박'의 통항이 멈췄다고 했고 **[C]**, 리포 오일 앤드루 리포는 호르무즈 통과량이 늘었지만 "언제든 바뀔 수 있다"고 했다 **[B]** (로이터 인용). 물량 자체는 진영 주장이 엇갈린다.
- UAE 라스알카이마는 10/24 모든 해변을 "추후 공지 시까지" 닫았다 **[A]** (라스알카이마 당국, 로이터). 전날 움알쿠와인·샤르자 알함리야 해변도 폐쇄됐고, UAE 환경부는 익명 유조선에서 새는 기름을 차단 중이라며 건강 위험은 없다고 했다 **[A]**. 해양정보업체 오비털리스크는 10/9 피격된 'GEM NO.2'를 지목했다 **[B]** (CBS).
- 이라크 알자이디 총리는 "이라크에 미군이 한 명도, 군사고문조차 남아 있지 않다"고 했다 **[C]** (PressTV 보도, 미국 확인 없음). 이란대사관은 이라크 총리 보좌관의 알시브 국경 침범 주장을 부인했다 **[A]** (IRNA).

### 사우디-예멘 — 후티 "얀부·라비그·동서 송유관 등 7개 작전", 사우디 "타이프·얀부 미사일 요격"
- 후티 사리 대변인은 탄도미사일·드론으로 7개 작전을 벌여 아람코 얀부, 라비그 정유소, 동서 송유관, 리야드·담맘·나즈란 공항, 카미스무샤이트 인근 공군기지를 쳤고 담맘 공항 운항이 멈췄다고 주장했다 **[C]** (후티, TASS·Times of Israel). 연합군의 "공습 100회"에 대한 대응이라고 했다.
- 사우디군은 타이프·얀부를 향한 후티 미사일 2발을 요격했고, 타이프·얀부·메카 민방위 경보는 몇 분 만에 해제됐다 **[B]** (AFP, CBS). 사우디 당국은 메카·메디나 일대에 떨어진 요격 잔해에 대응 중이라고 했고, 후티는 메카·메디나를 겨냥하지 않았다고 주장했다 **[D]** (Times of Israel 인용 양측 발표). 리야드 겨냥 탄도미사일도 요격됐다 **[B]** (연합군, 알아라비야).
- 후티는 연합군의 사나 공습으로 11명이 숨졌다고 주장했고 **[C]** (후티, Times of Israel), 아덴의 해군기지·군 캠프 공격을 주장했다 **[C]**. 사나 측 외무부는 사우디의 '학살'을 규탄했다 **[C]** (IRNA).
- 사우디 정부·아람코는 얀부·라비그·동서 송유관 피해를 확인하지 않았다. 지표 13번(우회 수출 거점의 확인된 피해)은 여전히 미충족이다. 미국의 연합군 지원은 정보·공중급유로 제한된다고 로이터는 전했다 **[B]**.
- Iran International은 파키스탄이 이란-미국 중재를 하면서 동시에 사우디 방어에 병력을 보내 '중재자이자 군사 파트너'라는 상충된 역할을 한다고 분석했다 **[C]**.
- 왜 다르게 말하나: 후티는 홍해 쪽 우회 수출 거점(얀부·라비그·송유관)을 표적으로 내세워 '호르무즈 대안도 안전하지 않다'는 메시지를 키우고, 사우디는 요격과 잔해 대응만 발표해 피해를 축소한다. 메카·메디나 경보는 종교 상징성 때문에 양측 모두 책임 공방을 피하려 한다(판단).

### 이스라엘·서안·레바논 — 헤브론 대규모 작전, 총선 사흘 전 반정부 집회
- IDF는 10/23 검문소 총격(군인 2명 사망) 뒤 헤브론 알잘라다·에인데이르바하에서 수일간 작전에 들어가 무장세력 수색과 건물 철거를 벌였다 **[A]** (IDF·팔레스타인 측 모두 확인). 서안 전면 봉쇄도 시작됐다 **[B]** (Al Jazeera).
- 이재민 수는 출처마다 다르다: 팔레스타인 관리 약 1,200명(로이터), 헤브론시 250가구, Times of Israel 약 1,500명, Al Jazeera 2,000명 이상 **[D]**. 헤브론 시장은 1,300명이 추가로 집을 잃을 수 있다며 총선과 연결했고, PA는 '집단처벌'이라 비판했다 **[C]**. 네타냐후는 PA에 "큰 깜짝 선물"을 예고했다 **[B]** (Times of Israel).
- 네타냐후는 "이란이 이스라엘 파괴를 준비 중"이라고 했고 **[A]** (Ynet), 이스라엘은행은 그의 암호화폐 제재 우회 구상에 "제재 회피 수단이 될 수 없다"고 반박했다 **[A]** (Times of Israel). 10/24 텔아비브 등지에서 수천 명이 반정부·10·7 국가조사위 요구 집회를 열었다 **[A]** (Al-Monitor·하레츠·RIA).
- 하레츠는 이란 연계 해커 '한달라'가 IDF 고위 지휘관 가족 사진·일정·군 문서를 유출했고 IDF가 조사 중이라고 보도했다 **[B]** (하레츠, IDF 조사 확인). 가자에서는 이스라엘 드론·포격으로 팔레스타인인 2명이 숨졌다는 보도가 나왔다 **[C]** (PressTV).
- 왜 다르게 말하나: 네타냐후는 총선(10/27) 직전 서안 작전과 이란 위협을 앞세워 안보 의제를 키우고, 야권·아랍계 정당은 반정부 연대로 맞선다. 이란 매체는 헤브론 공격을 '이스라엘 공세의 한계'로 선전한다(판단).

## 2. 우크라이나·러시아 전황

### 러시아 타격 — 하루 4명 사망·78명 부상, 키이우 주거지 드론 피격
- 우크라 공군은 10/23～24 밤 러시아가 드론 126기(제트 추진 61기)를 띄웠고 101기(제트 50기)를 제압했다고 밝혔다 **[C]** (우크라 공군, Kyiv Independent). 키이우 오볼론 구 주거용 건물이 드론에 맞아 2명이 다치고 불이 났다 **[B]** (키이우시 군정).
- Kyiv Independent는 지역 당국 집계를 합쳐 하루 동안 4명 사망·78명 부상이라고 전했다 **[B]**: 체르니히우(10/23 낮) 1명 사망·25명 이상 부상, 크라마토르스크 1명 사망·6명 부상(어린이 3명), 슬로뱐스크 1명 사망·4명 부상, 드니프로 1명 사망·8명 부상, 하르키우주 7명 부상, 수미주 25개 마을 40회 공격·5명 부상.
- 10/24 낮에도 공격이 이어졌다. 하르키우주 로조바 상업 창고가 미사일에 맞아 1명 사망·2명 부상 **[B]** (시녜후보우 주지사), 수미주 코노토프 축산농장 드론 공격으로 1명 사망·4명 부상 **[B]** (Kyiv Post·UP), 드니프로페트로우스크주 도시 주거 건물 화재로 3명 사망·8명 부상 **[B]** (UP), 니코폴 지역 식료품점 피격으로 4명 부상 **[B]**. RIA는 10/25 새벽 키이우에서 다시 폭발음이 났다고 전했다 **[C]**.
- 젤렌스키는 러시아가 10/22 저녁 키이우로 탄도미사일 30발을 쐈고, 미국에서 석 달간 받은 패트리엇 요격탄은 24발로 월 350발가량인 소요에 크게 못 미친다고 했다 **[C]** (ABC 인터뷰, Kyiv Post). 국경수비대는 러시아가 몰도바·루마니아·폴란드 접경 서부 검문소를 의도적으로 공격한다고 했다 **[C]** (우크라 측).
- 라트비아 알룩스네 지역에서 정체불명 드론 잔해가 발견돼 군·경찰이 조사에 들어갔다 **[A]** (라트비아 당국, UP). 메르츠 독일 총리는 러시아가 "매일" 독일을 흔들려 한다고 했다 **[A]**.

### 우크라 장거리 타격 — 톨리야티·옴스크 합성고무 공장, 오룔 사망 3명 확인
- 우크라 총참모부는 사마라주 톨리야티의 '톨리야티카우추크' 공장(고체 로켓연료용 합성고무 생산)과 크라스노다르주 예이스크 비행장의 항공기를 타격했다고 밝혔다 **[C]** (우크라 총참모부, Kyiv Independent "독립 검증 불가"). 현지 텔레그램은 여러 공장 화재와 아브토바즈 대피를 전했다 **[C]**.
- 국경에서 약 2,500km 떨어진 옴스크의 합성고무 공장 '옴스키 카우추크'에 드론이 떨어져 큰 불이 났다고 OSINT 채널이 전했고 **[C]** (UP), 호첸코 옴스크 주지사는 북부 산업단지가 드론 공격을 받아 비상 인력이 투입됐다고 확인했다 **[B]** (TASS). 양측이 같은 장소 피격을 인정한 셈이지만 피해 규모는 공개되지 않았다.
- 클리치코프 오룔 주지사는 10/23 미사일 피격 시설(소베츠키 구) 잔해에서 시신 3구를 찾았다고 밝혔다 **[A]** (TASS, 우크라 총참모부도 '오룔 전자부품 공장' 타격 확인). 그는 "나토산 미사일을 쓴 테러"라고 했다 **[C]** (러시아 측 규정).
- 러시아 국방부는 10/23 20시～10/24 08시(모스크바) 22개 지역과 아조우·흑해 상공에서 드론 616기를, 24시간 동안 1,297기를 격추했다고 주장했다 **[C]** (러시아 국방부, TASS). 브랸스크주 클리모보 쇼핑몰이 드론에 맞아 1명 사망·4명 부상 **[B]** (러시아 주 당국, TASS·RIA), 벨고로드주 셰베키노에서 3명 부상 **[C]**. 점령지 크림반도 곳곳에 대규모 정전이 보고됐다 **[B]** (Kyiv Independent).
- 전선: ISW 10/23 평가는 수집 단계에서 원문 접근이 막혀 세부 전선 변화를 확인하지 못했다. 수집 구간에 양측이 새 거점 함락을 발표한 사례는 없다.
- 왜 다르게 말하나: 러시아는 올레시키 휴전 합의 직후에도 전국 민간시설 타격(하루 사상자 80명대)을 이어 협상 지렛대를 유지하고, 우크라는 미사일 연료(합성고무)·전자부품 공장을 연달아 쳐 '군수 공급망 타격'을 강조한다. 러시아의 '1,297기 격추' 같은 수치는 검증 수단이 없다(판단).

## 4. 정권·외교·제재

### 러·우 — 미 당국자 "2주 내 아부다비 또는 스위스", 젤렌스키 "즉시 동결 합의 가능"
- 미 당국자는 스카이뉴스에 미·우·러 3자 협상이 "2주 안에 아부다비나 스위스"에서 열릴 수 있고, "결국 정상급 회담으로 가는 것이 목표지만 할 일이 많다"고 했다 **[C]** (익명 미 당국자, Kyiv Post 인용). 젤렌스키는 앞서 11월 초～중순 아부다비를 제시했고, 크렘린도 아부다비 검토를 확인한 바 있다 **[B]**.
- 젤렌스키는 ABC 인터뷰에서 가능하면 즉시 평화 합의를 맺고 전선을 동결할 준비가 됐지만 현재 점령(19.3%) 이상은 내줄 수 없다고 했고, 미국 지원에 대해 "이건 지원이 아니다, 배신감은 아니다"라고 했다 **[A]** (발언, Kyiv Post).
- 푸틴은 러시아 국영TV 자루빈 기자에게 '휴전에 따른 일시 정지가 아니라 최종 형태로' 3자 접촉 재개에 동의한다며 "(돈바스는) 그들 영토가 아니라 역사적 러시아 영토"라고 했다 **[A]** (Meduza 인용). 이코노미스트는 우크라 관리들을 인용해 새 미국안이 돈바스 비무장지대, 우크라의 나토 가입 포기 대신 투자·EU 가입, 대러 제재 완화를 담았다고 보도했다 **[C]** (윤곽 수준). 키이우 소식통은 "영토 포기 불가"가 합의된 입장이라고 했다.
- 올레시키: 러시아 란트라토바 인권옴부즈맨은 우크라 루비네츠 옴부즈맨과 인도적 임무 세부를 조율했고 "양측이 약속을 이행 중"이라고 했다 **[A]** (TASS, 우크라 측 협의 상대 확인). 젤렌스키는 고립 주민 약 1,700명, 러시아의 진입로 지뢰 매설을 들며 "상황이 심각하지만 이행이 곧 이뤄질 것"이라고 했다 **[A]** (Kyiv Post·UP). 사격 중지 시점은 러시아 10/27 04시, 백악관 10/29로 여전히 다르다 **[D]**. 이를 촉구하며 단식하던 유럽의회 피치에르노 부의장은 단식을 끝냈다 **[A]**.
- 스타링크: 젤렌스키와 흐마라 국방장관은 스타링크·스타실드 속도가 제한 이전 수준으로 복구됐다고 확인했다 **[A]** (우크라 정부, Al Jazeera·Kyiv Post). 미 상원의원들은 초당적으로 지명자 인준 보류를 경고했었다 **[B]**. 머스크는 "스타링크를 끊으면 우크라 전선은 무너진다"면서 우크라군이 사용 규칙을 어겼다고 주장했다 **[C]** (RIA). 로이터는 바이든·트럼프 행정부가 수년간 우크라·중동·이란에서 스타링크 켜기·끄기를 요청해 왔다고 단독 보도했다 **[B]** (로이터, Al-Monitor·하레츠).
- 정보 공유: Kyiv Post는 CIA가 미사일 조기경보 등 정보 제공을 계속하고 있다고 전했고 **[C]**, 디애틀랜틱은 트럼프가 중단을 결정하면 랫클리프 CIA 국장이 말리지 않을 것이라고 보도했다 **[C]** (UP 인용).
- 제재·국방: 젤렌스키는 러시아 탄도미사일·드론 공급망 개인 83명 등에 대한 제재를 발효했다 **[A]** (대통령령, Kyiv Post). 독일은 우크라 제트 드론 구매를 협의 중이다 **[B]** (Kyiv Independent). 스비리덴코 전 총리가 미·우 재건투자기금 대표로 임명됐다 **[A]**. 유럽은 대러 협상 대표 후보로 멜로니·스투브·파벨·프레데릭센·스퇴레를 검토 중이라고 텔레그래프가 전했다 **[C]**.

### 이란 외교 — 페제시키안 방러 의제 공개, 프랑스 "확전에 승자 없다"
- 잘랄리 주러 이란대사는 페제시키안 대통령이 모스크바에서 푸틴과 경제·무역 협력을 논의한다며 방문 일정을 설명했다 **[B]** (Mehr·PressTV, 크렘린 일정 공식 발표는 미확인). 이란 석유부 차관은 가스수출국포럼(GECF)에서 '투자 안보'를 강조했다 **[A]**.
- 바로 프랑스 외무장관은 미·이란 추가 확전엔 "승자가 없다"고 했고 **[A]** (Tehran Times 인용), 밀리밴드 영국 외무장관은 이스탄불에서 "이 분쟁은 너무 오래 끌었다"고 했다 **[A]** (Iran International). 이란 법원장 모흐세니-에제이는 "전쟁 중인데 전시가 아닌 듯 행동할 수 없다"고 했다 **[A]** (Mehr).
- 유엔 이란 인권 특별보고관 마이 사토는 "전쟁은 탄압 강도를 줄이지 못했고 오히려 키웠다"고 했다 **[A]** (X 게시, Iran International).
- 왜 다르게 말하나: 미국이 선거 뒤 공습 준비를 공개적으로 키우는 가운데 이란 대통령은 '합의 재시도'로 국내 경제난 출구를, 군·사법부는 '전시 체제'로 결속을 강조한다. 러·이란 정상회담은 이란이 미국 공격 전에 러시아의 외교적 엄호를 확보하려는 움직임이다(판단).

- 오늘 표는 주말 수집이라 '장중' 표기 없이 10/23(금) 확정치다(KST 04시 장중가 아님). 로이터 집계로 브렌트 근월물은 116.72달러(+3.55달러, +3.14%)에 정산해 4/29 이후 최고, 주간 약 +6%였다 **[B]** (FinanceFeeds·Rio Times, 로이터 인용). WTI 정산가 103.27달러(+3.8%)는 표와 같지만 표의 브렌트 111.70달러(-1.3%)는 이 정산가와 방향이 반대라 다른 월물 시계열일 가능성이 크다(판단). 그래서 브렌트는 116.72달러를 기준으로 해석하고 표의 브렌트 1일 변동률은 해석하지 않는다.
- 상승 요인은 후티의 사우디 연쇄 공격(에너지 시설 포함), 아람코 다란 본사 대피, IRGC '7척 피격' 주장, 수주 내 미국 공습 기대였다 **[B]** (로이터 인용). LPL 턴퀴스트는 "공급 차질 우려가 상승을 이끌었다"고 했다. OVX 60.02(+7.9%)는 60선에서 높은 변동성 경계를 이어 갔다. 반면 RBOB 3.13달러(-1.5%)·디젤 4.79달러(-2.9%)는 내려 원유-제품가 차이가 더 좁아졌다(정제마진 압박, 판단).
- TTF 93.85유로(+4.2%, 20일 +30%)는 겨울 가스 부담이 커지는 흐름이고, 유조선주 FRO +3.4%는 해상 위험 프리미엄을 반영한다. 금 4,007.90달러(-1.3%, 5일 -4.1%)는 주식 매도·유가 급등 속에 4,000달러 선 공방을 벌였다 **[C]** (Archyde). 미 증시는 다우가 600포인트 떨어지며 변동성 큰 한 주를 마감했다 **[C]** (Yahoo Finance 라이브).
- 달러지수 101.75(+0.1%)·달러/원 1,325.40원(보합)은 안정적이다. 셰켈 3.10(+0.4%)은 총선을 앞두고 소폭 약세, 흐리브냐 45.20(NBU, 10/26 고시)도 안정적이다. 달러/루블 80.44는 1일 -2.0%로 점검 한도를 넘었고 WebSearch로 같은 날 환율 수준을 교차확인하지 못했다 — 교차확인 불가로 해석하지 않는다.

## 6. 유가·금리 경로와 한국 시장
- **구간 판정:** 브렌트 정산 116.72달러(10/23, 로이터 집계) → **100～120달러 구간 ◀** (구간 유지, 상단 120달러까지 약 3.3달러).
- **전달 경로:** 후티의 사우디 수출 거점 공격 주장·미국 공습 재개 신호 → 브렌트 4월 말 이후 최고 정산 → 미 물가: 9월 CPI 전년비 3.7%·근원 2.6% **[A]** (BLS, 10월 CPI는 11/10). 휘발유·디젤은 내려 즉시 전가는 제한(판단) → 연준: 10/27～28 FOMC는 예측시장 집계상 동결 우세(10/23 기준 동결 86%·인상 13%) **[C]** → 미 10년물 4.988%(+3bp, 5% 턱밑) → 달러지수 101.75 → 달러/원 1,325.40원(보합) → 한국: 코스피 5,550.30(10/23, +0.3%), 주말 휴장으로 유가 급등분은 10/26 개장에 반영된다.
- 경험칙 점검: 원유 1달러 상승 ≈ 휘발유 2.4센트이므로 10/23 브렌트 +3.55달러는 휘발유 약 +8.5센트 요인(추정)인데 실제 RBOB는 -5센트가량 내렸다. 유가 10% 상승 ≈ 단기 PCE +0.1%p(BofA) 기준으로 20일간 약 +7%(표 기준)는 PCE +0.07%p 안팎 요인(추정)이다. 제품가가 원유를 따라오지 않아 물가 전가보다 정유 마진 압박이 먼저 나타나는 국면이다(판단).

- 중동: 전일까지 M2 근거는 NYT 계획 보도·배럭 특사 발언 등 대리인 발언이었는데, 오늘은 트럼프 본인이 유세장에서 'Epic Fury' 재개를 직접 언급했고 WSJ가 '재개 쪽으로 기울었다'고, 블룸버그가 3번째 항모전단·1만 명 증파를 보도했다. 미 정보당국의 이란 음모 메모와 걸프·레바논 외교관 일부 철수도 같은 방향이라 M2 +5. 다만 '결정 없음'·'선거 전 공격 없음' 약속이 유지되고 WSJ·블룸버그는 재인용 기사로만 확인돼 +5로 제한한다. 공격 재개 준비가 구체화하면서 저강도 현상 유지(M1)는 -5. 브렌트 116.72달러 정산은 M4 쪽 가격 신호지만 전일 장중 117달러 때 이미 검토했고, 후티의 얀부·라비그·동서 송유관 공격은 주장뿐이라 지표 13번 미충족으로 M4 유지. 페제시키안의 '잠정 합의 재시도'는 새 제안·응답 교환이 아니어서 M3 유지.
- 우크라: 올레시키 휴전 이행 조율(양측 옴부즈맨)과 미 당국자의 '2주 내 아부다비·스위스' 발언은 전일 U2 상향(+5) 때 반영한 흐름의 연장이고 날짜·장소가 확정되지 않았다. 러시아의 전국 타격과 우크라의 후방 군수공장 타격이 이어져 전부 유지한다.
