## 🗓 시장 요약

**① 다우 53,356.12(+3.03%)·S&P500 7,688.62(+1.58%)·나스닥 25,736.51(+1.44%) — 민주당 상·하원 장악, 중간선거 다음 날 기준 44년 만의 최대 상승 노려**
다우는 **53,356.12(+1,569.40, +3.03%)**로 장 막판 3% 넘게 올랐고, S&P500은 **7,688.62(+119.70, +1.58%)**, 나스닥은 **25,736.51(+364.50, +1.44%)**로 마감했다. 민주당이 하원과 상원을 모두 장악하면서 대통령과 의회가 갈리는 분점 정부가 확정돼 정책 불확실성이 줄었다는 해석이 우세했다. 다우 30종목 가운데 하락 종목은 장중 4개에 불과했고 마이크로소프트·아마존·애플이 상승을 이끌었다. 러셀2000은 2,856.95(+1.58%), VIX는 16.77(−4.06, −19.49%)로 공포 지표가 크게 내려갔다. 트럼프 대통령은 "민주당에 축하를 보내며 나라를 위해 함께 일하기를 기대한다"고 말했다.

**② 2년물 4.58%(−3.0bp)·10년물 4.90%(−5.0bp)·30년물 5.28%(−4.0bp) — 유가 폭락에 인플레이션 부담 완화**
미 재무부 기준 2년물은 **4.58%(−3.0bp)**, 10년물은 **4.90%(−5.0bp)**, 30년물은 **5.28%(−4.0bp)**로 일제히 내렸다. 선거 직후 아시아 장에서 위험회피 심리로 국채와 귀금속으로 자금이 몰렸고, 이후 유가가 8% 가까이 폭락하면서 물가 상승 압력이 줄어들 것이라는 기대가 금리를 끌어내렸다. 10월 ISM 서비스업 지수는 전월보다 식었지만 12개월 평균은 10개월 연속 올랐다. 시장은 금요일 10월 고용보고서로 연준의 12월 결정 방향을 가늠할 전망이다.

**③ WTI \$88.51(−7.89%)·브렌트 \$95.04(−8.26%) — 선거 결과에 이란 전쟁 종식 기대, 브렌트 수주 만에 \$100 아래로**
WTI 12월물은 장중 \$97.15에서 \$87.13까지 밀린 끝에 **\$88.51(−\$7.58, −7.89%)**, 브렌트 1월물은 **\$95.04(−\$8.56, −8.26%)**로 마감해 수주 만에 \$100 아래로 내려갔다. 투자자들은 민주당 승리로 이란 전쟁이 끝날 가능성에 베팅했고, 트럼프 대통령도 이란에 대한 추가 군사 공격 가능성을 낮게 언급했다. 다만 호르무즈 해협에서 유조선 4척이 기뢰에 부딪혀 불이 났다는 이란 혁명수비대 발표와, 이란 협상 대표 갈리바프의 경고성 발언은 변수로 남았다. 금 선물은 장 초반 \$4,052.90(+2.86%), 은 선물은 \$52.21(+4.94%)까지 올랐다.

**④ AI·반도체 — SOX 10,268.65(−3.13%)·마이크론 −7.00%·인텔 −3.77%·엔비디아 −3.17%, AMD는 +6%대에서 +1.01%로 상승폭 반납**
빅테크가 급등한 것과 반대로 SOX는 **10,268.65(−331.74, −3.13%)**로 밀렸다. 민주당 의회가 AI 투자·데이터센터 확장·기술 업종 전반을 더 깐깐하게 들여다볼 수 있다는 우려가 반도체와 AI 인프라주를 눌렀다. 마이크론(MU)은 \$795.23(−7.00%), 인텔(INTC)은 \$58.27(−3.77%), 엔비디아(NVDA)는 \$200.13(−3.17%), 브로드컴(AVGO)은 \$325.48(−2.00%), 슈퍼마이크로(SMCI)는 \$29.60(−5.70%)로 내렸다. AMD(AMD)는 3분기 호실적과 "2027년 매출 80% 이상 성장" 전망에 장중 \$514.61(+6.35%)까지 올랐지만 \$488.78(+1.01%)로 상승폭 대부분을 내줬다. AI 클라우드 코어위브(CRWV)는 \$48.42(−9.90%), 데이터센터 설비 시공 업체 컴포트시스템즈(FIX)는 \$1,091.31(−15.08%)로 급락했다.

**⑤ 실적·이슈 — 듀오링고 +25.99%·블록 +15.29%·맥도날드 +6.53%, 앰독스 −30.07%·FIS −23.67%·CVS −12.53%**
실적 시즌 종목별 명암이 극단적으로 갈렸다. 3분기 호실적과 연간 가이던스 상향을 발표한 듀오링고(DUOL)는 **\$161.27(+25.99%)**, 실적을 내놓은 블록(XYZ)은 **\$87.62(+15.29%)**, 미국 동일점포 매출 감소폭이 예상보다 작았던 맥도날드(MCD)는 **\$280.22(+6.53%)**, 우버(UBER)는 **\$69.87(+4.91%)**로 올랐다. 반면 T모바일과의 법적 분쟁을 이유로 2027 회계연도 전망을 크게 낮춘 앰독스(DOX)는 **\$43.66(−30.07%)**, 연간 가이던스를 깎고 CFO 사임을 발표한 FIS(FIS)는 **\$29.76(−23.67%)**, 회사 분할 계획을 밝힌 CVS헬스(CVS)는 **\$79.96(−12.53%)**로 밀렸다. 일론 머스크가 중간선거에 사상 최대인 \$4억7,400만을 쓴 가운데 테슬라(TSLA)는 **\$385.19(−3.34%)**였다.

**⑥ 🇰🇷 SOX −3.13%·SK하이닉스 ADR \$143.07(−5.12%)·코스피200 야간선물 898.15(+0.93%) — 빅테크 랠리와 반도체 약세의 엇갈림**

AMD는 시가 \$485.25에서 출발해 고가 \$514.61(+6.35%)까지 올랐지만 반도체 약세에 밀려 \$488.78(+\$4.88, +1.01%)로 마감했다. 3분기 매출은 \$134억으로 45% 늘어 시장 예상(\$131억)을 넘었고, 주당순이익은 \$2.09로 예상(\$1.94)을 웃돌았으며 데이터센터 매출은 \$85억으로 97% 급증했다. 리사 수 CEO는 2027년 매출이 80% 이상 성장할 것이라고 밝혔다. 증권가에서는 스티펠이 목표주가를 \$700에서 \$725로, JP모건이 \$550에서 \$575로 올렸지만 BofA(\$720→\$650)와 미즈호(\$705→\$610)는 업종 밸류에이션 하락을 이유로 낮췄다.

**2. FIS (FIS) −23.67% — 연간 가이던스 대폭 하향·CFO 사임, JP모건 투자의견 하향**
금융 IT 서비스 기업 FIS는 시가 \$30.58에서 출발해 저가 \$29.15(−25.24%)까지 밀린 뒤 \$29.76(−\$9.23, −23.67%)로 마감했다. 회사는 연간 실적 가이던스를 크게 낮췄고, 제임스 키호 최고재무책임자(CFO)가 11월 5일자로 물러나며 알렉산드라 브룩스가 임시 CFO를 맡는다고 발표했다. 여기에 JP모건이 투자의견을 하향하면서 매도세가 하루 종일 이어졌다. 장중 고가도 \$32.40(−16.90%)에 그쳐 반등 시도조차 약했다.

**3. 앰독스 (DOX) −30.07% — T모바일과 법적 분쟁, 2027 회계연도 전망 대폭 하향**
통신 소프트웨어 기업 앰독스는 시가 \$42.93에서 출발해 저가 \$41.44(−33.62%)까지 폭락한 뒤 \$43.66(−\$18.77, −30.07%)로 마감했다. 회사는 주요 고객인 T모바일(TMUS)과의 법적 분쟁을 이유로 2027 회계연도 전망을 시장 예상보다 크게 낮게 제시했다. 핵심 고객 매출의 불확실성이 한꺼번에 반영되면서 하루 만에 시가총액의 30%가 사라졌다. 장중 고가 \$46.39도 전일 종가 \$62.43보다 25.70% 낮았다.

**4. 맥도날드 (MCD) +6.53% — 3분기 조정 주당순이익 \$3.57로 예상(\$3.38) 상회, 미국 동일점포 매출 −0.2%로 선방**
맥도날드는 시가 \$268.79에서 출발해 고가 \$281.14(+6.88%)까지 오른 뒤 \$280.22(+\$17.18, +6.53%)로 마감했다. 3분기 조정 주당순이익은 \$3.57로 예상(\$3.38)을 웃돌았고 순이익은 \$24.9억으로 9% 늘었지만, 매출은 \$71.6억(+1%)으로 예상(\$72.8억)에 못 미쳤다. 미국 동일점포 매출은 −0.2%로 2025년 초 이후 첫 감소였으나 예상(−0.5%)보다는 나았고, 글로벌 동일점포 매출은 +1.3%였다. 크리스 켐친스키 CEO는 생활비 부담이 쉽게 사라지지 않을 것이라고 경고해 왔다.

**5. 우버 (UBER) +4.91% — 3분기 예상 상회, 4분기 조정 주당순이익 가이던스 95~99센트는 예상 하회**
우버는 시가 \$68.28에서 출발해 고가 \$72.50(+8.86%)까지 오른 뒤 \$69.87(+\$3.27, +4.91%)로 마감했다. 3분기 실적은 시장 예상을 웃돌았지만 4분기 조정 주당순이익 가이던스는 95~99센트로 LSEG 컨센서스(\$1.06)를 밑돌았다. 회사는 운전자 부족과 연료비 상승, 중동 분쟁을 부담 요인으로 꼽았다. 다라 코스로샤히 CEO는 "올해는 승객 인센티브를 줄이고 그 돈으로 운전자 인센티브를 늘리고 있다"고 말했다.

**6. CVS헬스 (CVS) −12.53% — 2028년 상반기까지 두 개 상장사로 분할 계획 발표**
CVS헬스는 시가 \$85.30에서 출발해 저가 \$77.33(−15.40%)까지 밀린 뒤 \$79.96(−\$11.45, −12.53%)로 마감했다. 회사는 2028년 상반기까지 헬스케어 솔루션 회사와 약국 회사(CVS 파머시)로 나눠 각각 상장하겠다는 분할 계획을 발표했다. 헬스케어 솔루션 회사는 데이비드 조이너가, CVS 파머시는 프렘 샤가 CEO를 맡는다. 분할 계획 발표 뒤 매도가 쏟아지며 전일 종가 \$91.41에서 크게 미끄러졌다.

**7. 듀오링고 (DUOL) +25.99% — 3분기 예상 상회, 연간 가이던스 상향**
듀오링고는 시가 \$159.99에서 출발해 고가 \$175.56(+37.16%)까지 치솟은 뒤 \$161.27(+\$33.27, +25.99%)로 마감했다. 언어 학습 앱 듀오링고는 3분기 실적이 시장 예상을 웃돌았다고 발표하고 연간 가이던스를 올렸다. 프리마켓에서 이미 +19.38% 오르며 출발했고, 장중 저가 \$157.00도 전일 종가 \$128.00보다 22.66% 높아 하루 내내 강한 매수세가 이어졌다. 정규장 상승률은 프리마켓보다 6%포인트 이상 커지며 이날 미국 주요 종목 가운데 최상위권에 올랐다.

**8. 애플 (AAPL) +5.31% — 회계 4분기 매출 \$1,144.8억·주당순이익 \$2.10 소화, 선거 뒤 빅테크 랠리 동참**
애플은 시가 \$341.57에서 출발해 고가 \$354.47(+6.80%)까지 오른 뒤 \$349.51(+\$17.61, +5.31%)로 마감했다. 전날 연말 분기 총이익률 전망 실망에 −1.90% 밀렸지만 하루 만에 반등했으며, 앞서 발표한 회계 4분기 매출은 \$1,144.8억, 주당순이익은 \$2.10이었다. 마이크로소프트(+6.68%)·아마존(+6.12%)과 함께 다우 급등을 이끈 3대 종목이었다. 컨티뉴이티 그룹의 저스틴 뷰엘은 분점 정부가 정책 변화 위험을 낮춰 주식 투자자에게 반가운 소식이라고 평가했다.

**9. 컴포트시스템즈 (FIX) −15.08% — AI 데이터센터 설비투자 우려, 프리마켓부터 −13%대 급락**
데이터센터 냉난방·전기 설비 시공 업체 컴포트시스템즈는 시가 \$1,115.00에서 출발해 저가 \$1,055.00(−17.91%)까지 밀린 뒤 \$1,091.31(−\$193.82, −15.08%)로 마감했다. 프리마켓에서 −13.67% 하락하며 출발했고, AI 데이터센터 설비투자가 줄어들 수 있다는 불안이 매도 이유로 거론됐다. 선거 결과 발표 뒤 민주당 의회가 데이터센터 확장과 AI 투자에 대한 규제·감시를 강화할 수 있다는 분석까지 겹쳤다. 같은 날 코어위브(−9.90%)·슈퍼마이크로(−5.70%) 등 AI 인프라주가 동반 급락했다.

**10. 테슬라 (TSLA) −3.34% — 머스크 중간선거에 사상 최대 \$4억7,400만 지출, 공화당 패배에 약세**
테슬라는 시가 \$379.80에서 출발해 저가 \$375.50(−5.77%)까지 밀린 뒤 \$385.19(−\$13.31, −3.34%)로 마감했다. 일론 머스크는 2026년 중간선거에 사상 최대인 \$4억7,400만을 지출한 것으로 보도됐지만, 선거 결과 발표로 민주당이 상·하원을 모두 가져갔고, 언론은 테슬라와 스페이스X의 약세를 이 결과와 직접 연결했다. 프리마켓에서도 −4.91%(\$378.93) 하락했고, 머스크 관련주인 스페이스X(SPCX)도 장 초반 −5%대 약세였다. 트럼프 미디어(DJT)도 장 초반 −11% 급락하는 등 트럼프·머스크 관련주가 선거 결과에 약세를 보였다.
