## 🗓 시장 요약

**① 국내 정책·수급: 마통 잔액 4년 3개월 만의 최대·신용융자 7조원…물가·에너지요금 논의**
주말 사이 개인의 마이너스통장 잔액이 4년 3개월 만에 최대로 늘었고, 신용융자 잔고는 삼성전자·SK하이닉스 두 종목에만 7조원 가까이 쌓였다는 집계가 나왔다. 급락장에서 저가 매수에 나선 개인이 많다는 뜻이지만, 변동성이 큰 장에서는 반대매매 위험도 함께 커진다. 이형일 부총리는 경제현안간담회에서 물가 관리를 논의하며 에너지요금 조정 문제를 다뤘고, 김정관 산업부 장관은 석유 최고가격제 연장이 불가피하다며 이 제도가 물가상승률을 월평균 0.6%포인트 낮췄다고 밝혔다. 정기예금 금리가 연 3% 후반～4%대로 올라 '예테크'가 돌아왔다는 보도도 이어졌다.

**② 글로벌: 미국 주말 휴장…"젠슨 황 복귀 논의" vs "외부 영입", 미 의회 관세 되돌리기 관측**
미국 증시는 13일(금) S&P500 −0.40%, 나스닥 −0.91%로 마친 뒤 쉬었다. 15일(현지) 파이낸셜타임스는 젠슨 황이 엔비디아 CEO 복귀를 측근들과 논의하고 있다고 보도했고, 미 재무장관은 엔비디아가 CEO를 외부에서 영입해야 한다는 의견을 냈다. 커트 캠벨 전 국무부 부장관은 미 의회가 트럼프 행정부의 관세를 뒤집으려 시도할 것이라고 내다봤다. 이번 주 트럼프·시진핑·푸틴 회동(19일 예정)과 FOMC 의사록이 대외 변수로 남아 있다.

**③ 반도체: SK하이닉스 MSCI 패시브 최대 8,600억원 유입 전망·삼성 오스틴 스페이스X 칩**
MSCI 11월 정기 리뷰에서 SK하이닉스는 7월 ADR 발행 신주가 반영돼 지수 산정 주식 수가 7억 1,300만주에서 7억 3,000만주로 늘었고, 신흥국 지수 비중이 0.11～0.12%포인트 높아져 패시브 순매수 5,800억～8,600억원이 추정된다(30일 장 마감 기준 반영). 삼성전자는 19억달러(약 2조 7,000억원)를 들여 증설 중인 텍사스 오스틴 공장에서 스페이스X 스타링크 위성용 18나노 FD-SOI MCU를 생산할 계획으로 전해졌다. 반도체 소부장 ETF는 한 주 새 32% 올랐고, 엔비디아 실적(현지 17일 예정)이 이번 주 메모리 대형주의 방향을 가를 첫 시험대로 꼽힌다.

**④ 호재 흐름: 기판·해운·금융 수수료·미국 방산 진출**
LG이노텍의 반도체 기판 사업은 3분기 누적 영업이익 1,357억원으로 이미 지난해 연간(1,289억원)을 넘었고 가동률이 94.4%까지 올랐다. HMM은 3분기 영업이익률 33.8%의 원가 경쟁력을 근거로 미래에셋증권이 목표주가를 28,000원으로 7.7% 올렸다. KB금융은 1～3분기 순수수료이익이 4조 878억원(+38.5%)으로 지난해 연간의 99.7%를 9개월 만에 채웠다. HD현대·안두릴의 600톤급 무인수상함 진수, 한화의 K9 자주포 미국 진출, LIG의 '비궁' 미 해양방산 공략 등 미국 방산 시장 진출 뉴스도 잇따랐다.

**⑤ 악재 흐름: 철강 노사·하청 '동투', 증권사 과징금 1.4조원, 보안 사고**
포스코 노사의 잠정합의안이 부결된 뒤 파업 긴장이 높아졌고 효성중공업·한화오션 하청까지 겨울 노사 갈등이 길어질 조짐이다. 미국의 50% 철강 관세로 한국 철강은 부담이 크고 일본 철강은 반사이익을 본다는 비교 분석도 나왔다. 공정위의 국고채 입찰 담합 과징금 1.6조원대 가운데 증권사 몫이 1.4조원에 이르러 증권업이 '사면초가'라는 평가가 이어졌고, NHN두레이 보안 사고로 고객사 업무자료가 유출되는 등 금융·공공 부문의 개인정보 유출 우려도 커졌다. 헝가리 새 정부가 규제를 강화하면서 현지에 10조원 넘게 투자한 국내 배터리 업계도 긴장하고 있다.

**⑥ 다음 거래일(16일·월) 변수: 반도체 급락 반영·엔비디아 실적 주간·공모주**
월요일 개장은 금요일 필라델피아 반도체 −3.43%와 야간선물 −0.72%를 먼저 반영할 가능성이 크지만, SK하이닉스 −3.03% 등 국내 반도체가 13일 이미 일부를 반영한 만큼 낙폭은 엔비디아 경영진 뉴스에 좌우될 수 있다. 이번 주에는 에스에프씨·유캐스트 공모 청약과 코스닥 신규 상장 4곳이 예정돼 있고, 17일 국내 신규 ETF 2종(만기매칭 회사채·미국 초대형주 TOP10)이 상장한다. 원/달러는 1,340원으로 주말을 넘겼고 내년 1,320원대로 원화가 강세 전환할 것이라는 전망도 나왔다.

## 1. 업종별 흐름

**상승 업종** — 휴장 중 뉴스 기준으로 호재가 나온 업종은 반도체 기판·해운·은행·방산·비철금속이다. LG이노텍 (011070) 287,000원(비정규 NXT 291,500원) · 6조 7,917억원은 패키지솔루션사업부 3분기 누적 영업이익이 1,357억원(+69%)으로 지난해 연간을 넘었고, 8개 증권사의 내년 이 사업부 영업이익 전망 평균은 3,313억원이다. HMM (011200) 21,450원(비정규 NXT 21,300원) · 20조 2,325억원은 3분기 영업이익 1조 3,946억원(컨센서스 대비 +59%)과 2030년까지 순이익 30% 이상 주주환원 방침에 목표가 상향이 나왔다. 은행은 KB금융 (105560) 159,000원(비정규 시간외 158,000원) · 56조 3,954억원의 수수료이익 38.5% 증가와 하나증권의 '금리 급등기 방어주' 평가가, 방산은 HD현대중공업 (329180) 271,000원(비정규 시간외 272,000원) · 28조 4,445억원·한화에어로스페이스 (012450) 641,000원 · 33조 521억원·LIG디펜스앤에어로스페이스 (079550) 351,000원(비정규 NXT 357,500원) · 7조 7,220억원의 미국 시장 진출 소식이 받쳤다. 고려아연 (010130) 866,000원(비정규 NXT 876,000원) · 18조 760억원은 74억달러 규모 미국 테네시 통합제련소의 전력 사용 승인을 받았다.

**하락 업종** — 휴장 중 악재가 나온 곳은 철강·증권·전력·배터리다. POSCO홀딩스 (005490) 275,000원 · 21조 7,914억원는 포스코 노사 잠정합의안 부결 뒤 파업 긴장과 미국 50% 관세 부담이 겹쳤고, 미래에셋증권 (006800) 21,350원(비정규 시간외 21,500원) · 11조 5,935억원·NH투자증권 (005940) 22,900원 · 8조 4,548억원 등 증권은 국고채 담합 과징금 1.4조원과 거래 위축으로 실적 회복이 더디다는 평가를 받았다. 한국전력 (015760) 27,650원(비정규 NXT 27,600원) · 17조 7,503억원은 13일 −9.79% 급락 뒤 전쟁·AI 전력 수요·사채 한도가 겹친 요금 인상 압박이 조명됐고, 72조원을 들여도 송전망 건설에 10년이 걸린다는 분석이 나왔다. 삼성SDI (006400) 478,000원(비정규 NXT 480,000원) · 38조 5,199억원·LG에너지솔루션 (373220) 324,500원 · 75조 9,330억원은 미국 RE+ 2026에서 신제품을 공개했지만 헝가리 새 정부의 규제 강화와 소재사의 3분기 이익 부진이 부담이다.

**시장의 시선** — 16일(월)에는 금요일 미국 반도체 급락을 반도체 대형주가 얼마나 반영할지와, 엔비디아 실적 주간에 SK하이닉스 (000660) 1,216,000원(비정규 NXT 1,233,000원) · 888조 2,787억원의 MSCI 패시브 매수 기대가 하방을 받칠지가 첫 관심이다. 하나증권은 2차전지에서 셀 메이커 비중 확대 속 롯데에너지머티리얼즈 (020150) 37,650원(비정규 NXT 37,750원) · 1조 9,716억원·엘앤에프 (066970) 78,900원(비정규 NXT 79,600원) · 3조 2,102억원처럼 매출이 꺾이지 않는 소재사를 조정 때 매수 후보로 봤다. 은행은 13일 업종 +3.58%로 이미 강했던 만큼 추가 상승보다 배당·자사주 등 주주환원 일정이 관전 포인트다.

## 🧭 흐름 전환

*섹터 12개의 수치 점검표(하락 7·상승 5, 매일)와 Claude 주간 논지(리포트·뉴스·정책·유튜브). 점검표는 미리 정한 약속이지 매매 지시가 아니다 — 하락 점검 2개 = ⅓ 축소 검토, 3개 = 절반 검토, 가격 규칙은 논지보다 우선.*

## 🏛 새로운 정책

*한국·미국·중국·EU·일본 정부 정책 중 업종에 영향을 줄 새 사안·단계 변화(미 연방관보·EU 관보·각국 부처·국회·입법예고·중국 상무부/국무원·일본 경제산업성 등 + 뉴스, Claude 분류).*

- **[한국] 정부 — 수도권 데이터센터 전력계통 영향평가 통과 점수 상향** (단계: 최종, 🆕 최초) — 수도권에 데이터센터를 지으려면 전력계통 영향평가에서 더 높은 점수를 받아야 하도록 기준이 강화됐다. 클라우드·데이터센터 운영 업종에는 부지·전력 확보 비용이 늘어나는 악재(▼)이고, 비수도권 입지와 분산형 전원·송배전 설비 수요에는 상대적으로 유리하다. 한국전력 (015760) 27,650원(비정규 NXT 27,600원) · 17조 7,503억원·LS ELECTRIC (010120) 123,300원(비정규 NXT 124,900원) · 18조 4,950억원 같은 전력망 쪽은 경로가 간접적이며, 이미 진행 중인 사업에 소급 적용되는지는 확인이 필요하다.
- **[한국] 한국무역보험공사 — 슬로바키아 수출입은행과 원전 유럽 진출 지원 MOU** (단계: 시행, 🆕 최초) — 무보가 슬로바키아 수출입은행과 손잡고 한국 원전 기업의 유럽 진출에 금융을 지원하기로 했다. 원전 주기기를 공급하는 두산에너빌리티 (034020) 46,850원(비정규 NXT 47,150원) · 30조 103억원가 직접 수혜 후보(▲)지만, 체코 두코바니 원전은 시공사 협상 결렬 뒤 교체 논란이 청문회로 번질 조짐이어서 유럽 사업 전반의 일정 불확실성은 남아 있다. MOU 단계라 구체적 수주로 이어지기까지 시간이 걸린다.
- **[미국] 상무부 — 러트닉 장관, 반도체 수출규제 완화 추진 보도** (단계: 제안, 🆕 최초) — 러트닉 상무장관이 가족 회사와 연관된 반도체 수출규제 완화를 추진한다는 보도가 나왔다. 규제가 풀리면 전기전자·AI 반도체 설계(팹리스·디자인하우스) 업종에 우호적(▲)이지만, 이해충돌 논란이 붙은 보도 단계이고 미 의회의 대중 칩 규제 강화 법안과 방향이 엇갈려 실제 시행 가능성은 낮게 봐야 한다. 13일 가온칩스 (399720) 38,650원 · 4,583억원 · +29.92%, 에이디테크놀로지 (200710) 20,350원(비정규 NXT 20,150원) · 2,740억원 · +20.92% 등 디자인하우스가 이미 급등한 점도 감안할 부분이다.
- **[해외] 우주 당국 — 달 화물 운송 관련 규제 완화** (단계: 최종, 🆕 최초) — 달 화물 운송 사업에 대한 규제가 풀리면서 해외 우주 ETF가 20%대 올랐다는 보도가 나왔다. 우주·위성 업종에는 호재(▲)이나 한국 기업과의 직접 경로는 아직 뚜렷하지 않고, 우주 섹터는 하락 점검 3/7의 바닥 모색 단계다. 13일 위성 지상국 업체 컨텍 (451760) 11,320원(비정규 시간외 11,490원) · 1,869억원은 −8.49%로 오히려 약했다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
