## 🗓 오늘의 요약

**① 미국이 쉬는 동안 한국은 강보합 — 코스피 4,711.21(+0.29%), 고점 4,817.77에서 밀려**
11/26(목) 코스피는 **4,711.21(+13.70p, +0.29%)**로 마감했다. 전날 **−6.16%(−308.52p)** 폭락 뒤 반발 매수로 장중 **4,817.77(+2.56%)**까지 올랐지만 오후 3시 이후 상승폭을 대부분 반납했다. 코스닥은 **655.71(+5.07p, +0.78%)**였다. 유가증권시장 거래대금은 **12조 2,284억원**으로 전날보다 약 33% 줄어, 미국 신호가 없는 날의 얇은 장세가 그대로 드러났다.

**② 상승폭을 지운 건 한국은행 금리 인상 — 3.00% → 3.25%**
한국은행 금융통화위원회가 기준금리를 **연 3.00%에서 3.25%로 0.25%p 인상**했다. 미국 근원 PCE **3.3%**와 12월 FOMC 인상 확률 **98%**에 이어 국내에서도 긴축이 이어지자, 오전에 **2,305억원 순매수**였던 외국인이 장 마감 무렵 순매도로 돌아섰다. 기관이 약 **7,500억원**을 사들여 지수를 떠받쳤고 개인은 약 **1조 400억원**을 팔았다.

**③ 반도체 대형주가 상대적으로 버텼다 — SK하이닉스 +2.23%, 장중 +5%대**
SK하이닉스는 **1,053,000원(+2.23%)**으로 장중 한때 5% 넘게 올랐고, 삼성전자는 장 초반 약 3% 상승에서 **171,300원(+0.35%)**으로 밀렸다. 삼성전기 **+3.84%**, SK스퀘어 **+2.68%**도 강했다. 반면 현대차 **−3.90%(259,000원)**, LG에너지솔루션 **−2.11%(302,000원)**, 삼성바이오로직스 **−1.91%**, KB금융 **−1.89%**로 자동차·2차전지·금융은 약했다. 11/25 발표된 14개 교역국 대상 **20% 추가 관세**가 수출 자동차에 부담으로 남았다.

**④ SKHY 괴리율 +41.7% — 국내가 오르며 소폭 좁혀졌다**
SKHY는 휴장으로 **\$111.14에 고정**돼 있다. \$111.14 × 10 × 1,342.7원 ÷ 1,053,000원 − 1 = **+41.7%**다. 국내 SK하이닉스가 2.23% 오른 만큼 괴리가 줄었다. 오늘 밤 단축 세션에서 SKHY가 국내 반등분을 반영할지가 확인 지점이다.

**⑤ 야간선물은 728.00(+0.17%) — 미국 휴장 속 방향성 약해**
코스피200 야간선물은 **728.00(+1.25, +0.17%)**으로 주간 종가 **726.75** 위에서 마감했다. 고가 **730.20**·저가 **723.00**으로 변동폭이 **7.20포인트**에 그쳐, 전날 세션(저가 688.80~고가 730.05)과 비교해 크게 잦아들었다. 미국 현물 시장이 닫혀 있어 참여가 적었던 만큼 가격 신호의 신뢰도는 평소보다 낮다.

**⑥ 엔비디아 10-Q, 마감 기한은 12/4 — 휴장 중에도 제출되지 않았다**
엔비디아는 11/17 3분기 실적(10/25 마감 분기)을 발표하면서 10-Q를 함께 내지 않았다. 직전 9차례 연속 실적 발표일에 10-Q·10-K를 동시에 제출했던 관행과 다르다. 대형 상장사의 제출 기한은 분기 말 40일 뒤인 **12/4**로, 그 전에 내면 지연 공시는 아니다. UBS 티모시 아르쿠리는 경영진이 제출 시점을 진행 중인 조사, 위험 요인 추가 필요성과 연결했다고 전하며 투자의견 매수는 유지하고 목표주가를 **\$240에서 \$220**으로 낮췄다.

## 📰 섹션 1. 휴장 중 쌓인 재료

**지수선물은 소강 — 단축 세션 앞두고 관망**
CME 주가지수·금리 선물은 11/26 현지 오후 1시에 멈췄다가 오후 6시에 재개하는 단축 일정으로 움직였다. 목요일 오전 기준 S&P500 선물은 약 **7,246**, 나스닥100 선물은 약 **26,300** 부근에 머물렀고, 10년물 금리는 **4.848%**, VIX는 **27** 안팎으로 수요일 장중 30을 넘었던 공포가 다소 진정됐다. 이번 주 업종 ETF 흐름은 기술(XLK) **−3.05%**, 소재(XLB) **+3.62%**, 헬스케어(XLV) **+3.51%**, 필수소비재(XLP) **+2.72%**로 방어·경기민감 업종으로의 순환이 뚜렷했다.

**오늘 밤 블랙프라이데이 단축 세션 — 얇은 거래 속 변동성 주의**
주식은 현지 오전 9시 30분~오후 1시, 개별 주식 옵션은 오후 1시 15분까지, 채권은 오후 2시까지만 거래된다. 거래량이 평소보다 적은 날이라 수요일 장중 −4%대 급락과 회복을 겪은 기술주가 작은 주문에도 크게 움직일 수 있다. 블랙프라이데이 소비 신호는 연말 소비주의 방향을 가늠하는 첫 자료다.

**유가 — 정산가 \$83.68, 호르무즈 인근 유조선 피격 보도와 OPEC+ 회의**
WTI 1월물은 11/25 정산가 **\$83.68(+1.99%)**, 브렌트 1월물은 **\$94.61(+3.51%)**로 이틀 연속 올랐다. 휴장일인 목요일 WTI는 **\$84.50** 안팎에서 거래됐다. 이란 혁명수비대는 오만 카삽 인근에서 유조선 **2척**이 기뢰에 부딪혔다고 밝혔고, OPEC+는 **11/29(일)** 2027년 생산 쿼터를 논의한다. 공급 불안이 유가 하단을 받치는 가운데 물가 부담을 다시 키울 수 있는 변수다.

**관세 — 14개국 20% 추가 관세, 의견 수렴 뒤 이르면 1월 시행**
트럼프 행정부가 11/25 중국·EU 등 **14개** 주요 교역 상대에 기존 관세 위에 **20%**를 더 얹는 방안을 발표했다. 휴장일 사이 추가 세부 내용은 나오지 않았다. 근원 PCE **3.3%**와 겹쳐 내년 물가 경로를 다시 밀어 올릴 수 있다는 점이 12월 FOMC 인상 확률 **98%**의 배경이다.
