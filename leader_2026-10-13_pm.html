# 미국→한국 선점 2026-10-13 (미국 2026-10-12 마감 반영)

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 17개:** Plastic Products(격차 +28.4%p), AI 소프트웨어·에이전트(격차 +23.4%p), 탱커·가스선(격차 +22.4%p), 유통·이커머스(격차 +21.9%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** Oil & Gas Production — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 사이버보안(-8.1%p)
- **이제 막 힘 붙는 조기 테마:** 중국 소비·관광 회복(조기 86), 음식료·K푸드(조기 77), 게임(조기 72) — 다음 주 선점 후보군.
