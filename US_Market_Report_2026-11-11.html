힘스앤허스는 \$22.12에서 출발해 저가 \$18.40(−19.79%)까지 밀린 뒤 \$19.13(−\$3.81, −16.61%)로 마감했다. 3분기 매출은 \$8억9,040만으로 1년 전보다 49% 늘어 예상에 대체로 부합했지만, 총이익률이 74%에서 57%로 크게 낮아졌다. 구독자 증가가 예상에 못 미쳤고 4분기 매출 전망도 시장 기대보다 약했다. 전날 −11.77%에 이어 이틀 동안 25% 넘게 빠졌다.

**3. 테이크투 인터랙티브 (TTWO) +8.31% — GTA6 사전 주문 700만 건·\$7억5,000만 추정, "초기 기대를 크게 웃돌아"**
테이크투는 \$218.25에서 출발해 고가 \$229.46(+10.64%)까지 오른 뒤 \$224.64(+\$17.24, +8.31%)로 마감했다. 스트라우스 젤닉 CEO는 GTA6 사전 주문이 초기 기대를 훨씬 웃돌고 있다고 밝혔고, 센서타워는 사전 주문을 700만 건 이상, 매출을 약 \$7억5,000만으로 추정했다. 2분기 매출은 1년 전보다 약 15% 줄었고 회계연도 2027년 가이던스도 시장 예상에 못 미쳤지만, 시장은 대작 출시 기대에 더 무게를 뒀다.

**4. 로켓랩 (RKLB) +6.54% — 3분기 매출 \$2억6,780만 사상 최대·수주잔고 약 \$36억, 장전 −8%에서 반전**
로켓랩은 \$54.99에서 출발해 저가 \$54.96(−6.63%)까지 밀렸다가 고가 \$62.90(+6.86%) 부근인 \$62.71(+\$3.85, +6.54%)로 마감했다. 3분기 매출은 \$2억6,780만으로 사상 최대였고 수주잔고는 약 \$36억, 분기 중 발사 계약은 약 \$10억어치를 따냈다. 4분기 매출 전망도 시장 예상을 웃돌았지만 조정 손실이 예상보다 컸고, 신형 로켓 뉴트론의 첫 발사는 2027년 이후로 밀렸다. 개장 전 −8%대 약세에서 정규장 중 매수세가 들어오며 전날 +10.91%에 이어 이틀째 올랐다.

**5. 에이온 (AAON) +19.31% — 3분기 매출 \$7억740만(+84.1%) 사상 최대, 2026년 성장률 전망 72~75%로 상향**
에이온은 \$71.64에서 출발해 고가 \$80.10(+27.41%)까지 치솟은 뒤 \$75.01(+\$12.14, +19.31%)로 마감했다. 냉난방 공조 장비 업체인 이 회사의 3분기 매출은 \$7억740만으로 1년 전보다 84.1% 늘어 사상 최대였고, 주당순이익도 예상을 넘었다. 회사는 2026년 매출 증가율 전망을 72~75%로 올렸다. 상반기 회계 오류를 발견해 실적을 정정했는데, 정정 결과 상반기 매출은 \$1,070만 늘었다.

**6. 산미나 (SANM) +3.87% — 회계 4분기 매출 \$38억6,000만, 2027 회계연도 매출 \$175억~195억 제시**
산미나는 \$166.40에서 출발해 고가 \$167.96(+12.25%)까지 올랐다가 \$155.43(+\$5.79, +3.87%)로 상승폭을 크게 줄였다. 전자제품 위탁생산 업체인 이 회사의 회계 4분기 매출은 \$38억6,000만으로 시장 예상을 크게 웃돌았다. 2027 회계연도 매출 가이던스는 \$175억~195억으로 중간값 기준 약 27% 성장이며, 이 가운데 클라우드·AI 시스템이 \$75억~90억을 차지한다. 다음 분기 매출과 주당순이익 전망도 컨센서스를 넘었지만 장중 차익 실현이 컸다.

**7. GFL인바이런멘털 (GFL) −7.56% — 이사회, 블랙스톤·KKR 컨소시엄의 \$220억 비공개 전환 제안 거절**
GFL인바이런멘털은 \$40.89에서 출발해 저가 \$40.74(−11.20%)까지 밀린 뒤 \$42.41(−\$3.47, −7.56%)로 마감했다. 이사회는 블랙스톤·KKR·에너지 캐피털 파트너스 컨소시엄의 약 \$220억 규모 비공개 전환(상장폐지) 제안을 만장일치로 거절했다. 4개월에 걸친 전략 검토를 끝내고 상장사로 남기로 하면서 인수 프리미엄 기대가 빠졌다. 개장 전에는 −13%대까지 밀렸다가 낙폭을 일부 줄였다.

**8. GE버노바 (GEV) −3.89% — 소프트뱅크, AI 데이터센터용 발전설비 계약 수정·\$37억 손실 반영**

펩젠은 \$5.55에서 출발해 고가 \$6.44(+169.45%)까지 폭등한 뒤 \$4.61(+\$2.22, +92.89%)로 마감했다. 회사는 근긴장성 이영양증 1형 치료 후보물질 PGN-EDODM1의 임상 2상 FREEDOM2-DM1에서 월 1회씩 4회 투여 후 평균 스플라이싱 교정률 46.5%를 확인했다고 발표했다. 회사는 이 질환의 반복 투여 임상에서 보고된 수치 가운데 가장 높다고 설명했고, 심각한 부작용은 보고되지 않았다. 장중 고가 대비로는 상승폭의 절반가량을 반납했다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **골드만삭스(제임스 슈나이더) — 반도체주 "명백한 과매도", 엔비디아·브로드컴·AMD 최선호.** 엔비디아와 브로드컴은 '무성장' 가정의 2028년 이익 기준 각각 12배·13배로 매력적이라는 판단. 엔비디아 \$168.89(−5.47%), 브로드컴 \$331.98(+3.91%).
- **웨드부시 — 젠슨 황 CEO 교체는 "최악의 결과".** 교체되지 않더라도 이번 사안이 미 정부를 상대로 한 황 CEO의 AI·엔비디아 옹호 신뢰도를 떨어뜨렸다고 봤다.

**구루·시장 코멘트**
- **크리스토퍼 월러(연준 이사)** — 12월 25bp 인상을 지지하는 쪽으로 기울어 있으며, 근원 물가가 0.3% 이상이면 50bp 인상을 검토해야 한다.
- **마이클 캐스퍼(HB웰스 수석 시장전략가)** — 뜨거운 CPI가 12월 인상을 굳혔지만, 최근 시장 변동성과 유가 하락을 감안하면 25bp가 될 것이다.
- **크리스 자카렐리(노스라이트 자산운용 CIO)** — 헤드라인·근원 모두 연준에는 여전히 너무 높다. 관건은 1월이나 2027년 중 추가 인상 여부다.
- **스카일러 와이낸드(리건 캐피털 CIO)** — 강한 10월 고용이 연준에 인상의 명분을 줬다. 이란 분쟁이 쉽게 끝나지 않아 유가와 물가가 높게 유지될 것이며, AI주에서 헬스케어 같은 방어 업종으로의 순환이 크다.
- **루이스 황(비트겟 애널리스트)** — 비트코인이 200일선 지지를 깨면 더 깊은 조정 위험이 커진다.
