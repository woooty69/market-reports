## 🗓 시장 요약

**CPI는 통과했고, 돈은 AI 인프라로 몰렸다.** 7월 소비자물가는 전월비 **+0.1%**, 전년비 **3.4%**로 컨센서스에 정확히 부합했다. 시장이 두려워한 '중동발 에너지가격 서프라이즈'는 없었다. 그 결과 9월 FOMC 인상 확률이 **47.4% → 37.4%로 하루 만에 10%p 급락**하고 동결 확률이 62.6%로 올라섰다. VIX는 14.55로 −4.78% 내려앉았다.

그런데 지수 상승폭은 초라했다 — 다우 **+0.03%**, S&P **+0.22%**. 물가가 잘 나왔는데도 지수가 못 오른 이유는 **돈이 지수 안에서 이동했기 때문**이다. 메타 −3.38%, 마이크로소프트 −2.26%, 아마존 −1.83%가 빠지는 동안 **코어위브 +19.29%, 슈퍼마이크로 +19.02%, 네비우스 +34.14%**가 폭등했다. AI에 **돈을 쓰는 쪽**에서 **돈을 받는 쪽**으로 자금이 옮겨간 하루였다.

방아쇠는 **전날 장 마감 후 나온 코어위브·슈퍼마이크로 실적**이었다. 코어위브는 매출 26억 달러(+112%)에 **수주잔고 1,040억 달러**를 공개했고, 슈퍼마이크로는 EPS \$1.70으로 예상(\$0.96)을 **77.5% 상회**하며 연매출 가이던스를 650~720억 달러(예상 525억)로 올렸다. 지난주 알파벳 자본지출 쇼크로 흔들렸던 'AI 지출은 지속 가능한가'라는 의심에 **숫자로 답한 셈**이다.

이 흐름의 최대 수혜가 **메모리**다. SOX가 **+2.49%(12,399.40)**로 급등했고 마이크론 +4.93%, 샌디스크 +5.76%, 인텔 +3.32%가 따랐다. 그리고 그 정점에 **SK하이닉스 ADR +9.02%(\$154.43)**가 있었다. 국내 SK하이닉스(000660)도 같은 날 **+5.54%(1,504,000원)**로 함께 뛰었지만 ADR이 더 크게 올라 **괴리율은 +40.9% → +45.1%로 또 확대**됐다. 여기에 코스피200 야간선물이 **+3.29%(1,069.35)**로 마감하며, 8/13 SK하이닉스 실적을 앞둔 한국 시장에 강한 순풍이 불고 있다.

## 📰 헤드라인 3선

**1. 7월 CPI 전년비 3.4% — 컨센서스 부합, 9월 인상 확률 37.4%로 급락**
7월 소비자물가는 전월비 **+0.1%**, 전년비 **3.4%**(6월 2.5%)로 다우존스 컨센서스에 정확히 부합했다. 헤드라인 전년비가 크게 뛴 것은 중동 확전에 따른 에너지가격이 처음 반영된 결과지만, **시장이 우려했던 '예상 상회'는 없었다.** 9월 FOMC 인상 확률은 전일 47.4%에서 **37.4%**로 내려갔고 동결 확률이 62.6%로 올라섰다. 다만 일부 이코노미스트는 세부 항목을 들어 "숫자만큼 좋지는 않다"는 신중론도 제기했다.

**2. 코어위브·슈퍼마이크로 실적이 'AI 지출 의심'을 지웠다 — 인프라주 일제 폭등**
코어위브는 2분기 매출 **26억 달러(+112%)**와 **수주잔고 1,040억 달러**(3분기 추가 확정분 250억 달러)를 발표했고, 슈퍼마이크로는 EPS \$1.70으로 예상을 **77.5% 상회**하며 연매출 가이던스를 **650~720억 달러**(컨센서스 525억)로 대폭 상향했다. 두 종목이 각각 +19.29%·+19.02% 급등했고, **네비우스 +34.14%, 루멘텀 +13.63%, 델 +9.89%, HPE +8.12%**로 AI 하드웨어·네오클라우드 전반이 동반 급등했다.

**3. 테마섹, 삼성전자·SK하이닉스 투자 추진 보도 — 코스피 3거래일 연속 상승**
싱가포르 국부펀드 **테마섹이 삼성전자와 SK하이닉스에 대한 투자를 계획 중**이라는 보도가 나오면서 8/12 한국 증시가 급등했다. 삼성전자가 **+6.68%**, SK하이닉스(000660)가 **+5.54%** 오르며 코스피가 3거래일 연속 상승했고, 코스피200 선물 정규장은 **+4.60%(1,035.30)**로 마감했다. 두 회사가 **사상 최대 규모의 주주환원**을 준비 중이라는 관측도 함께 부각됐다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  AI 인프라·네오클라우드 (이날 최강)**
코어위브 +19.29%, 슈퍼마이크로 +19.02%, 네비우스 +34.14%, 루멘텀 +13.63%, 델 +9.89%, HPE +8.12%. 실적으로 확인된 **AI 자본지출의 수취인**들이 일제히 두 자릿수로 뛰었다.

> 🇰🇷 [전달] AI 서버·전력·냉각 밸류체인(HD현대일렉트릭·LS일렉트릭·두산에너빌리티 등)에 직접 온기. 다만 국내는 이미 상당폭 선반영된 구간이라 **추격보다 순환 강도 확인**이 필요하다.

**상승 ②  반도체·메모리 (SOX +2.49%)**
SOX가 12,399.40으로 +2.49% 급등했다. 마이크론 +4.93%(\$911.30), 샌디스크 +5.76%, 인텔 +3.32%, 엔비디아 +3.03%. 그중 **SK하이닉스 ADR이 +9.02%로 압도적 1위**였다. 다만 SOX는 시가 12,518.9·고가 12,531.8에서 **12,399.40으로 되밀려 마감**해, 장중 고점 대비 1.06% 반납했다.

> 🇰🇷 [전달] SOX +2.49% + SKHY +9.02% + 야간선물 +3.29%의 삼중 신호. **다만 SOX가 장중 고점에서 되밀린 점**은 국내도 갭업 후 상단이 눌릴 수 있음을 시사한다.

**상승 ③  귀금속·안전자산**
금이 \$4,469.20(+0.63%), 은이 +0.93%로 올랐다. CPI 통과로 금리 인상 부담이 줄자 무이자 자산의 상대 매력이 회복됐다.

**하락 ①  대형 플랫폼(빅테크)**
메타 −3.38%(\$578.85), 마이크로소프트 −2.26%(\$492.43), 아마존 −1.83%, 테슬라 −1.61%, 애플 −0.87%. **AI에 돈을 쓰는 쪽**이 일제히 밀리며 다우와 S&P의 상승폭을 잠식했다.

> 🇰🇷 [전달] '자본지출 부담 → 플랫폼 디레이팅, 공급망 리레이팅' 구도가 선명해졌다. 국내에선 **소비·플랫폼(네이버·카카오)보다 반도체·전력기기**가 유리한 배치.

**하락 ②  헬스케어 유통·소비재**
아메리소스버겐(COR) −5.91%, 태피스트리(TPR) −4.24%. 경기민감 소비와 방어주가 동시에 자금 유출을 겪었다.

**하락 ③  전날 급등주 되돌림**
메르카도리브레 −5.76%, 액손 −5.74%가 전 거래일 급등분(각 +6.36%·+6.69%)을 대부분 반납했다. 퍼스트솔라 −5.89%, 앱러빈은 이틀째 −4.67%.

**[판정]** **갭업 출발을 강하게 본다.** 근거는 넷이다. ①야간선물 **+3.29%**(정규장 종가 1,035.30 → 1,069.35), ②SOX **+2.49%**, ③SKHY **+9.02%**, ④CPI 통과로 9월 인상 확률 37.4%까지 하락. 여기에 **외국인이 SK하이닉스(000660)를 +55.9만 주 순매수로 전환**(전일 −21.1만 주)한 수급 변화가 겹친다.
다만 셋을 경계한다. 첫째, **SOX가 장중 고점 대비 1.06% 되밀려 마감**해 미국에서도 차익실현이 나왔다. 둘째, 코스피200 선물이 이미 정규장에서 **+4.60%** 오른 뒤 야간에 +3.29%가 추가된 **이틀 누적 과열**이다. 셋째, **오늘 SK하이닉스 실적·주주환원안 발표**가 재료 소멸로 작용할 위험이 있다. (무효화: 실적 발표 후 차익실현 대량 출회, 외국인 순매도 재전환, 또는 유가 \$85 재돌파 시)

## 🔍 섹션 2. 이슈 종목 10선

**1. SK하이닉스 ADR (SKHY) +9.02% — \$154.43, 괴리율 +45.1%로 재확대**
장중 고가 \$155.16까지 오른 뒤 \$154.43에 마감했다. 시가가 \$150.79로 이미 갭업 출발이었고, 시간외에서도 +0.36%(\$154.99)로 강세를 이어갔다. 거래량은 **2,533만 주**로 상장 이후 최상위권이었다.
같은 날 국내 SK하이닉스(000660)는 **1,504,000원(+5.54%, +79,000원)**에 마감했다. 결정적인 변화는 수급이다 — 외국인이 **+55만 9,854주 순매수로 전환**(전일 −21만 592주)했고 기관도 +19만 3,626주를 담았다. 반면 개인은 −75만 5,159주를 팔았다. 외국인 지분율은 50.74% → **50.82%**로 올라섰다.
그럼에도 **괴리율은 +40.9% → +45.1%로 4.2%p 더 벌어졌다.** ADR이 +9.02% 오르는 동안 국내는 +5.54%에 그쳤기 때문이다. 환율이 1,417.00원 → 1,412.87원으로 원화가 강해져 괴리를 좁히는 방향으로 작용했는데도 확대됐다는 점이 중요하다. **오늘 실적과 주주환원안**이 이 격차의 분기점이다.

**2. 네비우스 (NBIS) +34.14% — \$259.20, 이날 최대 상승률**
AI 클라우드 인프라 기업이 하루 만에 34% 급등하며 시장 전체 상승률 1위에 올랐다. 거래량 **6,058만 주**로 평소를 크게 웃돌았다.
코어위브·슈퍼마이크로 실적이 확인해 준 **AI 컴퓨팅 수요가 개별 네오클라우드 사업자의 실적 가시성으로 직결**된다는 논리가 작동했다. 시장은 이제 GPU를 사는 기업이 아니라 **GPU를 빌려주는 기업**의 수주잔고를 보고 있다.
거래대금 상위(가장 활발히 거래된 종목 4위)에도 동시 등재돼, 기관 자금이 실제로 유입됐음을 보여준다.

**3. 코어위브 (CRWV) +19.29% — \$107.74, 수주잔고 1,040억 달러**
2분기 매출 **26억 달러**로 전년 동기 12억 달러 대비 **112% 증가**했고, 주당 손실 폭도 축소됐다. 핵심은 실적이 아니라 **수주잔고 1,040억 달러**와 3분기에 이미 확정된 **추가 250억 달러**였다.
이 숫자는 "AI 인프라 투자가 2027년 이후에도 이어지는가"라는 질문에 대한 계약 기반의 답이다. 알파벳의 자본지출 급증이 **비용**으로 읽혔다면, 코어위브의 수주잔고는 같은 돈이 **누군가의 매출**로 확정돼 있음을 보여준다.
거래량 8,292만 주로 폭발적이었다. 이 한 종목의 실적이 이날 AI 인프라 섹터 전체를 끌어올린 출발점이었다.

**4. 슈퍼마이크로 (SMCI) +19.02% — \$37.61, EPS 77.5% 서프라이즈**
분기 EPS가 **\$1.70**으로 컨센서스 \$0.96을 **77.5% 상회**했다. 회계 이슈로 신뢰를 잃었던 종목이 실적으로 반등의 명분을 만든 셈이다.
더 강력했던 건 가이던스다. 연간 매출 전망을 **650~720억 달러**로 제시해 애널리스트 평균 추정치 **525억 달러**를 크게 웃돌았다. AI 서버 조립·랙 통합 수요가 예상보다 훨씬 강하다는 뜻이다.
거래량 **1억 6,038만 주**로 이날 시장 최다 수준이었다. AI 서버 밸류체인의 국내 연결고리(전력·냉각·기판)에도 심리적 온기를 줄 재료다.

**5. 루멘텀 (LITE) +13.63% — \$932.47, 광통신이 AI 병목으로**
광통신 부품 기업이 13% 넘게 급등했다. 데이터센터 규모가 커질수록 **랙 간·건물 간 광트랜시버 수요**가 비선형적으로 늘어난다는 인식이 확산됐다.
거래량 1,162만 주. AI 투자 테마가 GPU·서버를 넘어 **네트워킹 계층으로 확산**되는 단계임을 보여준다.
국내에서는 광모듈·커넥터 관련주에 파급될 수 있는 재료로, 반도체 일변도였던 AI 수혜 범위가 넓어지는 신호다.

**6. 델 (DELL) +9.89% · HPE +8.12% — 전통 서버 업체의 재평가**
델이 \$484.56로 +9.89%, HPE가 \$58.80로 +8.12% 올랐다. 슈퍼마이크로의 가이던스 상향이 **AI 서버 시장 전체 파이가 커진다**는 신호로 읽히면서 동종 업체가 함께 재평가됐다.
델 거래량 557만 주, HPE 1,949만 주. 저성장 하드웨어로 분류되던 종목들이 AI 사이클에서 다시 성장주 취급을 받는 국면이다.
이들은 모두 **HBM·서버 D램의 대형 수요처**라는 점에서 SK하이닉스(000660)·삼성전자(005930)의 수주 가시성과 직결된다.

**7. 마이크론 (MU) +4.93% · 샌디스크 (SNDK) +5.76% — 메모리 동반 강세**
마이크론이 **\$911.30(+4.93%)**로 거래량 3,246만 주를 기록하며 이날 가장 활발히 거래된 종목에 올랐다. 샌디스크는 **\$1,344.32(+5.76%)**로 상승폭이 더 컸다.
AI 서버 증설은 곧 **HBM·서버 D램·엔터프라이즈 SSD 수요**다. 코어위브·슈퍼마이크로의 수주 규모가 메모리 수요의 하방을 지지한다는 계산이 즉각 반영됐다.
다만 **SKHY +9.02%가 마이크론 +4.93%를 크게 앞섰다.** 시장이 메모리 안에서도 **HBM 비중이 높은 쪽**에 프리미엄을 주고 있다는 뜻으로, 국내 SK하이닉스(000660)에 유리한 상대 평가다.

**8. 엔비디아 (NVDA) +3.03% — \$224.09, 사흘 만에 움직였다**
이틀 연속 보합(−0.03%, −0.03%)에 머물렀던 엔비디아가 +3.03%로 반등했다. 거래량 **1억 316만 주**.
코어위브·슈퍼마이크로의 수주가 결국 **엔비디아 GPU 수요**로 환원된다는 단순한 논리가 작동했다. 다만 상승률은 인프라 종목들(+19~34%)에 크게 못 미쳤다.
**엔비디아보다 그 아래 공급망이 더 오르는 구도**는, 시장이 AI 사이클의 이익 배분이 넓어지고 있다고 보기 시작했음을 시사한다.

**9. 메타 (META) −3.38% · 마이크로소프트 (MSFT) −2.26% — 돈 쓰는 쪽의 하락**
메타가 \$578.85로 −3.38%, 마이크로소프트가 \$492.43으로 −2.26% 밀렸다. 아마존 −1.83%, 테슬라 −1.61%, 애플 −0.87%도 약세였다.
지난주 알파벳의 자본지출 상향(\$1,950억~2,050억)과 잉여현금흐름 마이너스 전환이 만든 **'AI 지출 = 주주가치 훼손'** 프레임이 다른 하이퍼스케일러로 번진 결과다.
같은 날 AI 인프라 공급업체들이 20~34% 폭등한 것과 정확히 대칭을 이룬다. **다우가 +0.03%에 그친 이유**가 여기에 있다.

**10. 퍼스트솔라 (FSLR) −5.89% · 메르카도리브레 (MELI) −5.76% · 액손 (AXON) −5.74%**
전 거래일 급등했던 메르카도리브레(+6.36%)와 액손(+6.69%)이 상승분을 거의 전부 반납했다. 퍼스트솔라는 −5.89%로 태양광이 별도로 약했다.
AI 인프라로 자금이 집중되면서 **비(非)AI 테마에서 자금이 빠져나가는 전형적인 로테이션**이 나타났다. 앱러빈도 이틀째 −4.67%로 밀렸다.
지수가 거의 오르지 않았는데도 개별 종목의 등락폭이 ±5~34%로 벌어진 점은, 이날 시장이 **지수 게임이 아니라 종목 선별 게임**이었음을 보여준다.

## 💬 섹션 3. 구루·기관 코멘트

- **연준 금리선물(9/16 FOMC) — 인상 37.4% vs 동결 62.6%.** 전일 47.4%/52.6%에서 하루 만에 10%p 이동했다. CPI가 컨센서스에 부합하자 **동결이 사실상 기본 시나리오**로 굳어지는 국면이다.
- **ING(제임스 나이틀리) — "물가 둔화는 연준의 관망을 뒷받침한다."** 인상 압력이 줄어든 만큼 정책 경로의 불확실성이 낮아졌다는 평가.
- **미시 셰드록 — "7월 CPI는 첫인상만큼 좋지 않다."** 헤드라인 부합에도 세부 항목에 경계 요인이 남아 있다는 반론. 시장 컨센서스와 대립하는 시각이므로 참고할 가치가 있다.
- **UBS 글로벌자산운용(수레시 탄티아) — 메모리보다 장비·파운드리 선호.** 중국의 경쟁 심화를 이유로 **한국 메모리주의 밸류에이션 상승 여력이 제한적**이라고 봤다. SKHY +9.02%와는 정면으로 배치되는 견해다.
- **SKHY 컨센서스 — 애널리스트 14인 Strong Buy, 목표주가 \$244.92**(현재가 대비 +58.6%). 다만 괴리율 +45.1%를 감안하면 이 목표가를 국내 주가에 그대로 대입할 수 없다.
- **테마섹 — 삼성전자·SK하이닉스 투자 추진 보도.** 사실이라면 국내 반도체에 대한 **장기 외국인 수급의 구조적 유입**을 의미한다. 8/12 외국인 순매수 전환(+55.9만 주)과 방향이 일치한다.
