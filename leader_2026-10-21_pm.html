- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 18개:** 유통·이커머스(격차 +17.9%p), 화장품·K뷰티(격차 +15.1%p), AI 소프트웨어·에이전트(격차 +14.0%p), Finance: Consumer Services(격차 +13.2%p) — 이번 리포트의 핵심 선점 영역.
