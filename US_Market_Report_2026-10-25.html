## 🗓 주말 요약

**① 한 주의 결론은 '반도체는 목요일 하루에 무너졌고, 유가는 주 내내 올랐다'**
나스닥은 주간 **−0.71%**, S&P500은 **−0.47%**로 2주 연속 내렸고 다우만 **+0.41%**로 올랐다. 월요일 나스닥 +1.11%, 수요일 +1.05%로 두 번 반등했지만 목요일 −2.60% 한 번에 그 상승분을 모두 내줬다. 반도체지수(SOX)는 목요일 **−6.72%**로 10,731.98까지 밀린 뒤 금요일 **10,779.46(+0.44%)**로 숨을 골라 주간 **−3.21%**였다. 같은 주에 WTI는 **\$101.41 → \$103.44(+2.00%)**, 브렌트는 **\$116.88**로 4월 이후 최고까지 올랐다. 다우가 버틴 것은 P&G·록히드마틴·3M·RTX 같은 실적주와 경기방어주 덕분이다.

**② 10년물은 5.15% → 4.96% → 5.00%로 한 주 안에 5%선을 두 번 넘나들었다**
10년물은 월요일 **5.15%**로 고점권을 찍은 뒤 목요일 기술주 급락 속 안전자산 수요로 **4.96%(−17.0bp)**까지 내려 한 달 만에 5% 아래로 갔다가, 금요일 유가 급등에 **5.00%(+4.0bp)**로 돌아왔다. 주간으로는 **−0.09%p**, 2년물은 **4.69%(주간 −0.05%p)**다. 미시간대 10월 소비자심리 확정치는 **48.0**으로 집계 이래 두 번째로 낮았고 1년 기대인플레이션은 **4.7%**, 5년 기대인플레이션은 **3.5%**로 올랐다. 28일(현지) FOMC는 동결이 유력하며, 연방기금금리 선물 기준 10월 인상 확률은 약 **5%**로 9월 말 37%에서 크게 낮아졌다.

**③ 'AI 지출 과다'에서 'AI 지출 부족'으로 — 걱정의 방향이 뒤집힌 주**
메타(META)는 3분기 설비투자 **\$349.1억**이 영업현금 **\$327.9억**을 넘었고 장기 약정이 **\$6,280억 → \$8,100억**으로 급증해 목요일 **−6.98%**였다. 같은 날 테슬라(TSLA)는 올해 설비투자 전망을 **'\$250억 이상' → '\$200억 이상'**으로 낮췄고, 램리서치(LRCX)는 사상 최대 분기 매출 **\$82.2억**에도 중국 비중 급감 예고에 **−11.76%**였다. 캐피털닷컴의 카일 로다 선임 애널리스트는 걱정의 초점이 '지출 과다'에서 '지출 부족·성장 둔화'로 뒤집혔다고 짚었다. 넷플릭스(NFLX)는 연간 광고 매출 전망을 **\$30억 → \$27억**으로 낮춰 수요일 **−5.31%**로 2024년 8월 이후 최저 종가를 썼다.

**④ 유가는 이란 재공격 보도·사우디 피격·홍해 공격이 겹쳐 3주 연속 올랐다**
월요일 후티의 사우디 공격, 수요일 사우디 아람코 유전 피격, 목요일 미국·이스라엘이 11월 초 중간선거 뒤 이란 추가 공격을 검토한다는 보도가 차례로 나왔다. 브렌트는 **\$109.38(월) → \$108.95(화) → \$109.90(수) → \$113.02(목) → \$116.88(금)**으로 올랐고, WTI 12월물은 금요일 장중 \$103.92까지 오른 뒤 **\$103.44**로 마쳤다. 금요일 유나이티드항공(UAL) **−3.99%**, 델타항공(DAL) **−3.13%**로 항공주가 원가 부담을 그대로 받았고, 록히드마틴(LMT)은 목요일 수주잔고 사상 최대 **\$2,920억**에 **+6.96%**였다.

**⑤ SK하이닉스 ADR은 다섯 거래일 동안 +4.67% → −2.16% → +2.48% → −8.07% → +4.05%**
SKHY는 \$136.49에서 **\$137.02**로 주간 **+0.39%**에 그쳤지만 그 사이 진폭은 컸다. 목요일 램리서치·메타 충격에 **−8.07%(\$131.69)**로 급락한 뒤, 금요일 낸드·SSD 자회사 솔리다임의 미국 상장 계획 보류 보도로 지분 희석 우려가 덜어지며 **+4.05%**로 절반가량 되찾았다. 당초 거론된 상장안은 기업가치 최대 **\$1,500억**, 조달 규모 **\$100억~150억**이었다. 마이크론(MU)도 금요일 **\$877.55(+2.46%)**로 반등했다. ADR은 9월 9일 고점 \$198.63 대비 아직 약 31% 낮다.

**⑥ 주말 사이 미국 쪽에서는 '이번 주말 공격 가능성' 발언이 나왔고, 실적·FOMC 슈퍼위크가 기다린다**
금요일 트럼프 대통령은 플로리다 유세에서 "또 한 번의 작은 '에픽 퓨리'를 할 수도 있고, 아니면 그들이 합의할 것"이라고 했고, 톰 배럭 주튀르키예 대사는 "이번 주말 공격이 있을 수 있느냐? 물론이다"라고 말했다. 다음 주에는 시가총액 20억 달러 이상 기업 **542곳**이 실적을 내고, 28일(현지) FOMC 결정 몇 시간 뒤 마이크로소프트·알파벳, 29일 아마존이 실적을 발표한다.

## 📰 섹션 1. 한 주간(10/19~10/23) 주요 뉴스 5선

**1. 목요일 SOX −6.72% — 메타 설비투자가 영업현금 넘어서고, 램리서치는 사상 최대 매출에도 −11.76%**
10/22(현지) 장 마감 후 나온 메타 실적에서 3분기 설비투자 \$349.1억이 영업현금 \$327.9억을 넘었고, 장기 약정은 \$6,280억에서 \$8,100억으로 늘었다. 이튿날 메타는 −6.98%, 램리서치는 "공급 제약이 없었다면 12월 분기 전망이 더 높았을 것"이라는 설명과 중국 비중 급감 예고에 −11.76%, SK하이닉스 ADR은 −8.07%였고 SOX는 하루 773.58포인트 빠졌다. 테슬라가 올해 설비투자 전망을 약 \$50억 낮춘 것도 같은 날 'AI 지출 둔화' 해석에 힘을 보탰다.
**투자자 함의:** 이번 주 반도체 매도는 수요 붕괴가 아니라 **'투자 주체의 현금흐름이 버티느냐'**는 질문에서 나왔다. 28~29일(현지) 마이크로소프트·알파벳·아마존의 설비투자 가이던스가 이 질문에 대한 첫 답이 되며, 상향이면 메모리·장비주가, 동결·하향이면 전력·서버 체인까지 다시 시험받는다.

**2. 브렌트 \$116.88 — 4월 이후 최고, 미·이스라엘 이란 재공격 검토 보도와 걸프 에너지 시설 피격**
수요일 사우디 아람코 유전 피격, 목요일 미국·이스라엘이 이란 핵시설·에너지 인프라·미사일 전력을 겨냥한 '짧지만 강도 높은 작전' 계획을 갖고 있다는 보도가 이어졌다. 이란은 재공격 시 걸프 지역 석유·에너지 시설과 미군 기지를 치겠다고 경고했다. 브렌트 12월물은 금요일 장중 \$117.45까지 올랐다가 \$116.88(+3.28%)로 마감해 3주 연속 주간 상승했고, WTI 12월물은 \$103.44(+3.99%)로 \$100선을 확실히 넘었다.
**투자자 함의:** 백악관은 22일(현지) 중간선거 전에는 공격을 재개하지 않겠다고 했지만, 시장은 **11월 3일 이후의 공급 리스크**를 미리 가격에 넣기 시작했다. 국내에서는 정유·방산이 우호적이고 항공·화학·해운 원가에는 부담이다.

**3. 10년물 5% 공방 — 기대인플레이션 4.7%, 그러나 10월 FOMC 인상 확률은 5%로 하락**
10년물은 5.15%(월) → 5.12%(화) → 5.13%(수) → 4.96%(목) → 5.00%(금)로 움직였고, 30년물은 5.48%에서 5.33%로 내렸다. 미시간대 10월 소비자심리 확정치 48.0, 1년 기대인플레이션 4.7%(전월 4.6%), 5년 기대인플레이션 3.5%(전월 3.4%)로 물가 기대는 오히려 높아졌다. BMO의 더글러스 포터 수석 이코노미스트는 생산자 물가가 따뜻한 편이라며 연준이 12월과 3월에 금리를 올릴 것으로 내다봤다.
**투자자 함의:** 이번 FOMC는 동결이 기본값이고 시장이 볼 것은 **12월 인상 여지에 대한 성명·회견 문구**다. 유가가 \$100 위에 머무는 한 기대인플레이션이 내려오기 어려워, 10년물의 하단은 4.9%대에서 막혀 있다.

**4. 스페이스X 첫 실적 — 매출 \$146억(+161%)·AI 컴퓨팅 매출 \$76억, 그러나 보호예수 해제에 −9.14%**
스페이스X(SPCX)는 3분기 매출 \$146억(+161%), 조정 EPS \$0.35로 예상의 두 배를 냈고 수요일 +7.79% 올랐다. 그러나 목요일 최대 13억 주 보호예수가 풀리며 −9.14%로 급등분을 반납했고, 금요일에는 4분기 설비투자 \$350억~400억(3분기 \$196억) 제시와 미국 기지국 최대 8만 곳 임차 논의 보도 속 \$147.49(+1.89%)로 반등했다. 이 보도에 크라운캐슬(CCI)은 +9.06%, SBA커뮤니케이션즈(SBAC)는 +3.57% 올랐고, 앞서 AT&T(T)는 후불 가입자 순증 부진과 스페이스X 이동통신 진출 우려에 수요일 −6.45%였다.
**투자자 함의:** 스페이스X는 위성통신에서 **지상 이동통신망 사업자**로 영역을 넓히는 중이다. 기존 통신 3사에는 경쟁 부담, 타워 리츠와 통신장비에는 새 임차·발주 수요라는 상반된 재료다.

**5. SK하이닉스 — 솔리다임 미국 상장 계획 보류 보도, 지분 희석 우려 완화**
금요일 SK하이닉스가 낸드·SSD 자회사 솔리다임의 미국 상장 계획을 보류했다는 보도가 나왔다. 당초 기업가치 최대 \$1,500억에 \$100억~150억을 조달하는 방안이 거론됐고, 9월 말 상장설이 처음 보도됐을 때는 모회사 주가가 하루 5% 내리고 국내 지배구조 단체의 반대가 나올 만큼 자회사 신주 발행에 따른 희석 우려가 컸다. SKHY는 이 소식에 금요일 \$137.02(+4.05%)로 목요일 −8.07%의 절반가량을 되찾았다.
**투자자 함의:** 중복상장 할인 요인 하나가 당분간 사라졌다는 점에서 국내 SK하이닉스(000660)에는 우호적이다. 다만 회사의 공식 확인은 아직 보도 기준이며, 주가를 결정할 더 큰 변수는 다음 주 빅테크 설비투자와 29일(현지) 샌디스크·인텔 실적이다.

## 🌙 섹션 2. 휴장·주말 신규 뉴스 5선

**1. 트럼프 "또 한 번의 작은 '에픽 퓨리'를 할 수도" — 배럭 대사는 "이번 주말 공격? 물론 가능" (10/23 현지)**
트럼프 대통령은 금요일 플로리다 유세에서 "또 한 번의 작은 '에픽 퓨리'를 할 수도 있고, 아니면 그들이 합의할 것"이라며 "똑똑하다면 '협상하자'고 하겠지만 그럴 것 같지는 않다"고 말했다. '에픽 퓨리'는 2월 미국·이스라엘의 대이란 공습 작전명이다. 같은 날 톰 배럭 주튀르키예 대사는 인터뷰에서 "이번 주말 공격이 있을 수 있느냐? 물론이다"라고 말하면서도 트럼프 대통령이 합의에 열려 있으며 목표는 정권 교체가 아니라고 했고, 호르무즈·우라늄 농축·동결 자산·제재 완화를 남은 쟁점으로 꼽았다. 트럼프 대통령은 이 발언에 대해 "그게 내 대사였나? 그렇다면 나는 아는 게 없다"고 답했다.
**관전 포인트:** 현지 24일까지 보도 기준으로 실제 공격은 확인되지 않았다. 월요일 아시아 장 초반 유가 선물의 방향이 주말 사이 군사 행동 여부를 가장 먼저 반영하며, 공격이 없으면 금요일 \$116선 브렌트의 일부 되돌림, 있으면 \$120 시험이 기본 시나리오다.

**2. 월스트리트저널 "트럼프, 이란 공격 재개 쪽으로 기울어 — 최종 결정은 아직" (10/24 현지)**
월스트리트저널은 미 당국자들을 인용해 트럼프 대통령이 이란에 대한 군사 행동 재개 쪽으로 기울고 있으나 최종 결정은 내리지 않았다고 보도했다. 검토 대상은 핵·기반시설(교량 등) 타격부터 이란이 점유한 섬에 대한 작전까지 다양하며, 일부 당국자는 에너지 가격 상승을 이유로 반대하고 있다. 트럼프 대통령은 8일 "생산적인 논의"를 이유로 중간선거(11월 3일) 전에는 공격하지 않겠다고 했고, 백악관은 22일에도 같은 입장을 되풀이하면서 "모든 선택지를 테이블 위에 두고 있다"고 했다. 이란은 추가 공격에 대비하고 있다며 미군 기지와 걸프 에너지 시설을 겨냥한 광범위한 대응을 예고했다.
**관전 포인트:** '중간선거 전 공격 없음'이 유지되면 남은 9일은 유가에 **위험 프리미엄만 쌓이는 구간**이다. 이스라엘 총선(27일)과 마수드 페제시키안 이란 대통령의 다음 주 모스크바 방문(푸틴 대통령과 회담)도 같은 주에 겹친다.

**3. 모더나·머크 흑색종 암백신 ESMO 정식 발표 — 재발·사망 위험 42% 감소, 원격 전이 38% 감소 (10/24 현지)**
마드리드에서 열린 유럽종양학회(ESMO)에서 공개된 3상 INTerpath-001 결과, 개인 맞춤형 mRNA 백신 인티스메란과 키트루다 병용은 키트루다 단독 대비 재발·사망 위험을 42%(추적 중앙값 24.6개월), 원격 전이 위험을 38% 낮췄다. 월가 기대치는 40~50%, 모더나가 임상적으로 의미 있다고 제시한 기준은 35%였다. 이상반응으로 인한 투약 중단은 병용군 약 7%, 대조군 5%였고 발열·주사 부위 통증이 더 잦았다. 데이터가 학회 전 유출되며 모더나는 22일(현지) −17.57%, 23일 −1.25%(\$200.10)로 이미 크게 내렸다.
**관전 포인트:** 윌리엄블레어의 마일스 민터는 "뉴스에 파는 반응"이라고 했고, TD코웬의 타일러 밴 뷰런은 "진료 지침을 바꿀 만한 기준을 충분히 넘었다"고 평가했다. RBC의 트렁 후인은 "승인 가능성은 높지만 상업적 성공은 훨씬 불확실하다"고 했다. 정식 발표가 유출 수치와 같았던 만큼 월요일 추가 충격보다는 **신장·폐·방광암 후속 임상** 일정으로 관심이 옮겨 갈 전망이다.

**4. 다음 주 실적 홍수 — 시총 20억 달러 이상 542곳, 수·목에 시가총액 73% 집중**
나스닥 실적 일정 기준 다음 주(10/26~10/30, 현지)에는 시총 20억 달러 이상 기업 542곳이 실적을 내며, 이들의 시가총액 합계는 \$31.9조다. 목요일이 202곳으로 가장 많고 수·목 이틀에 시가총액의 73%가 몰렸다. 컨센서스 EPS는 마이크로소프트 \$4.71(전년 \$4.13), 알파벳 \$2.94(전년 \$2.87), 아마존 \$2.01(전년 \$1.95)이며, 샌디스크는 \$45.22로 전년 \$0.90 대비 격차가 가장 크다. 마이크로소프트는 7월에 이번 분기 매출 \$898.5억~909.5억, 애저 성장률 약 45%(고정환율)를 제시했다.
**관전 포인트:** 이번 주 메타·테슬라가 남긴 질문은 **'설비투자를 누가, 무슨 현금으로 감당하느냐'**다. 마이크로소프트·알파벳은 FOMC 결정 몇 시간 뒤(28일 현지) 발표하므로 금리와 AI 투자 회수 여부가 같은 밤에 함께 평가된다.

**5. 로버트하프·블룸에너지가 보여 준 '실적 시즌의 양극단' — 주말 동안 이어질 업종 재평가**
금요일 로버트하프(RHI)는 인력 솔루션 매출이 2022년 이후 처음 증가로 돌아섰다는 발표에 +21.74%(\$45.87) 급등한 반면, 블룸에너지(BE)는 3분기 매출 \$12.36억(+138%)과 연간 가이던스 상향에도 영업현금흐름이 −\$2,710만으로 적자 전환해 −11.24%(\$193.30)였다. 컴포트시스템즈(FIX)도 −9.26%로 AI 전력·설비주가 함께 밀렸고, 팔로알토네트웍스(PANW) +7.22%·클라우드플레어(NET) +7.36%로 사이버보안에는 자금이 들어왔다.
**관전 포인트:** 매출 성장보다 **현금흐름**이 주가를 가르는 국면이다. 다음 주 GE버노바·버티브(28일 현지)와 퀀타서비스(29일 현지) 실적이 AI 전력 설비주의 과열 경계를 이어 갈지 되돌릴지 정한다.

## 🔭 섹션 3. 다음 개장일(10/26 월) 섹터별 전망

미국은 **10월 26일(월)** 정상 개장한다. 한국이 먼저 열리므로 국내는 주말 사이 이란 관련 군사 행동 여부와 월요일 아시아 장 유가 선물을 **미국 가이드 없이 장중에 소화**한다.

**⬆️ 우호적 재료가 있는 섹터**

**정유·에너지·방산** — 브렌트 \$116.88·WTI \$103.44에서 출발하고, 트럼프 대통령과 배럭 대사의 발언으로 주말 리스크는 열려 있다. 록히드마틴은 수주잔고 사상 최대 \$2,920억으로 목요일 +6.96%였다. 엑슨모빌·셰브런 실적은 30일(현지)이다.

**사이버보안·소프트웨어 보안** — 에버코어ISI 채널 조사에서 영업 파이프라인 견조가 확인되며 팔로알토 +7.22%, 클라우드플레어 +7.36%였다. 반도체에서 빠진 자금이 옮겨 가는 흐름이다.

**통신 인프라(타워·장비)** — 스페이스X의 기지국 최대 8만 곳 임차 논의는 크라운캐슬 +9.06%로 이어졌다. 기지국·안테나 장비 수요 기대가 생기는 쪽이다.

**⬇️ 부담이 큰 섹터**

**항공·화학·운송** — 브렌트 4월 이후 최고, 유나이티드항공 −3.99%·델타 −3.13%. 27일(현지) UPS 실적이 연료비 전가 여부를 보여 준다.

**AI 전력·설비** — 블룸에너지 −11.24%, 컴포트시스템즈 −9.26%. 현금흐름 적자 전환이 확인되면서 고밸류 설비주에 대한 경계가 커졌다.

**금융(소비자 신용)** — SLM이 대손충당금 부담에 연간 EPS 가이던스를 \$3.10~3.20에서 \$1.95~2.05로 낮춰 −10.78%, 아메리칸익스프레스는 인력 약 5% 감축 발표와 함께 −3.73%였다. 기대인플레이션 4.7%와 소비심리 48.0은 소비자 신용에 부담이다.

**⚠️ 방향이 갈리는 곳**

**메모리 반도체** — 금요일 SKHY +4.05%·마이크론 +2.46%로 반등했지만 SOX는 목요일 낙폭(−6.72%)의 일부만 되찾았다. 솔리다임 상장 보류는 우호적 재료이고, 다음 주 마이크로소프트·알파벳·아마존 설비투자와 샌디스크·인텔 실적이 방향을 정한다.

### 🇰🇷 한국 관전 포인트

국내 증시는 26일(월) 개장에서 금요일 미국장의 **'반도체 소폭 반등·경기민감주 약세'**를 함께 반영한다. 코스피200 야간선물은 일요일이라 조회 스크립트가 새 세션 값을 주지 않았다. 직전 10/23(금) 야간 세션은 전일 리포트에 06:00 확정치 861.70(−0.19%, 정규장 종가 863.30 대비)으로 기재돼 있어, 미국 반도체 반등이 야간선물에는 거의 반영되지 않은 채 끝났다.

SK하이닉스 ADR은 금요일 \$137.02(+4.05%)로 목요일 −8.07%의 절반가량을 되찾았고 솔리다임 미국 상장 보류 보도가 더해졌다. 국내 SK하이닉스(000660)에는 중복상장 희석 우려 완화라는 회사 고유 재료가 있지만, SOX 주간 −3.21%와 다음 주 빅테크 설비투자 발표를 앞둔 관망이 상단을 누를 수 있다.

유가와 금리는 국내에 엇갈린 신호다. 브렌트 \$116.88은 정유·조선·방산에는 우호적이지만 항공·화학과 원가 전가력이 낮은 소비재에는 부담이고, 10년물 5.00% 재돌파는 성장주 밸류에이션을 누른다. 스페이스X의 지상 통신망 진출 논의는 국내 통신장비주 관심을 키울 수 있는 반면, 블룸에너지 급락은 AI 전력기기 쪽 차익 실현 압력으로 번질 수 있다.
