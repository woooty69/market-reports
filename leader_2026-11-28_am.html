- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 8개:** Advertising(격차 +20.4%p), Industrial Machinery/Components(격차 +16.5%p), 철도(격차 +12.2%p), 통신·5G(격차 +11.5%p) — 이번 리포트의 핵심 선점 영역.
