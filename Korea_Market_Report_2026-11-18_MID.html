## 🗓 시장 요약

**① 엔비디아 호실적에 5,100선 회복했다가 반납 — 장중 저점권 4,945**
코스피는 5,098.82로 2.6% 갭상승 출발해 장 초반 5,133.14까지 올랐으나 10시 이후 매도가 늘며 하락 전환해 5,000선을 다시 내줬다. 11:55 현재 4,945.24(−0.47%)로 오전 저점 4,943.17과 거의 같은 수준이다. 개인이 −2,707억원, 외국인이 −355억원을 순매도했고 기관만 +866억원 순매수했다. 코스피200 선물(11:35, 775.25)은 현물 코스피200(767.70)보다 높은 수준에 머물러 베이시스는 플러스다.

**② 반도체 — 하이닉스 플러스 유지, 삼성전자 약보합, 기판주 엇갈림**
SK하이닉스는 1,110,000원(+1.09%)으로 거래대금 2조 171억원 1위다. 장 초반 6%대까지 올랐다는 보도가 나왔으나 상승폭이 크게 줄었다. 삼성전자(−0.71%, 거래대금 1조 8,583억원)는 약보합으로 돌아섰고 우선주에 매수가 몰렸다는 보도가 있다. 엔비디아가 실적 발표에서 삼성전기와의 기판 공급계약 확대를 밝혔다는 KB증권 분석이 나왔지만 삼성전기는 −0.66%로 밀렸고, 코리아써키트(+2.00%)는 메리츠의 목표가 상향(11만원)에 플러스를 지킨 반면 이수페타시스(−6.09%)·심텍(−4.65%)·대덕전자(−3.35%)는 약하다.

**③ 로봇·엔터·보안 강세, 건설·2차전지·화학·조선 약세**
레인보우로보틱스(+13.27%)·로보티즈(+7.57%)·빅웨이브로보틱스(+22.43%) 등 로봇주와 에스엠(+11.31%) 등 엔터주가 강하다. 잇단 해킹 사고에 지니언스(+8.20%)·안랩(+3.53%) 등 보안주도 올랐다. 반면 건설 업종(−4.05%)에서 삼성E&A(−9.20%)가 급락했고, 삼성SDI(−3.71%)·LG화학(−5.59%)·포스코퓨처엠(−2.90%) 등 2차전지·화학과 한화오션(−3.68%)·삼성중공업(−3.56%) 등 조선이 약하다.

**④ 원화 강세·아시아 증시 약세, 미국 선물은 보합**
원/달러는 1,329.40원으로 6.10원 내려 원화가 강해졌다. S&P500 선물(+0.00%)·나스닥100 선물(−0.01%)은 보합이고 닛케이225(−0.28%)·항셍(−0.76%)은 약하다. IMF가 한국의 올해 성장률 전망을 3.3%에서 3.9%로 올렸다는 분석이 나왔지만, 앤트로픽 IPO를 앞둔 소프트웨어 매도와 AI 투자 우려가 이어지고 있다.

## 1. 업종별 흐름

**상승 업종** — 방송과엔터테인먼트(+4.35%, 상승 20/하락 27)는 에스엠(+11.31%)이 이끌었다. 키움증권이 공연 대형화와 외국인 관광객 증가로 내년 엔터·레저 산업이 좋아질 것으로 본 영향이다. 게임엔터테인먼트(+2.03%)·소프트웨어(+1.60%)·생명보험(+1.39%)·해운사(+1.24%)·기계(+1.15%)가 뒤를 이었다. 기계 업종에서는 로봇주 레인보우로보틱스(+13.27%)·로보티즈(+7.57%)가 강했다.

**하락 업종** — 건설(−4.05%, 상승 10/하락 57)은 삼성E&A(−9.20%)가 끌어내렸다. 비철금속(−2.61%)·조선(−2.47%, 상승 1/하락 27)·화학(−2.27%, 하락 94종목)·제약(−2.15%, 하락 134종목)·전기제품(−2.05%)·자동차(−1.95%)가 약하다. 제약은 삼천당제약(−17.30%) 급락이, 화학은 LG화학(−5.59%)이 부담이었다.

**시장의 시선** — 엔비디아 호실적에도 상승분을 지키지 못한 만큼 오후장에는 코스피가 장중 저점 4,943 부근을 지키는지, 개인 매도가 줄어드는지가 관건이다. 외국인이 반도체 대형주를 다시 사는지, 로봇·보안 등 테마 강세가 오후까지 이어지는지도 볼 만하다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 33종목

*① 12시 현재 시총 1,000억원 이상·+10% 이상 급등 ★ 9종목(1～9번) → ② 오전장 언론 최다 보도 24종목(10～33번).*

**1. 레인보우로보틱스 (277810) 384,000원 · 7조 4,495억원 · +13.27% — 로봇주 동반 강세 속 코스닥 시총 4위권**
레인보우로보틱스는 384,000원으로 13.27% 올라 거래대금 484억원을 기록했다. 오늘 이 종목을 직접 다룬 개별 공시는 확인되지 않았고, 뉴스 20건은 대부분 엔비디아 실적과 코스피 등락을 다룬 시황 기사다. 같은 시간 로보티즈(+7.57%)·빅웨이브로보틱스(+22.43%)도 올라 로봇 업종 전반에 매수가 몰렸다. 최신 커버 리포트(Finlit, 6월)는 삼성전자가 최대주주인 휴머노이드 관절 내재화 로봇 기업으로 소개했다. [리포트: Finlit 2026-06-15](https://woooty69.github.io/hw-pdf-arch-008/%EB%A0%88%EC%9D%B8%EB%B3%B4%EC%9A%B0%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB277810%EF%BC%BD_20260615_Finlit_1105604.pdf)

**2. 빅웨이브로보틱스 (0035S0) 16,100원 · 1,655억원 · +22.43% — 로봇 테마 강세에 동반 급등**
빅웨이브로보틱스는 16,100원으로 22.43% 올라 거래대금 382억원을 기록했다. 최근 96시간 개별 뉴스는 확인되지 않았고, 레인보우로보틱스(+13.27%)·로보티즈(+7.57%) 등 로봇주 강세와 함께 움직였다. 9월 상장 당시 리포트는 공모 자금을 글로벌 진출·RaaS(로봇 구독) 운영 대수 확보·휴머노이드 연구개발에 쓰겠다고 밝혔고, 시총은 1,655억원이다. [리포트: Mint Investment Advisors 2026-09-07](https://woooty69.github.io/hw-pdf-arch-018/%EB%B9%85%EC%9B%A8%EC%9D%B4%EB%B8%8C%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB0035S0%EF%BC%BD_20260907_Mint%2BInvestment%2BAdvisors_1129495.pdf) · [리포트: NH 2026-06-17](https://woooty69.github.io/hw-pdf-arch-008/%EB%B9%85%EC%9B%A8%EC%9D%B4%EB%B8%8C%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB0035S0%EF%BC%BD_20260617_NH_1106229.pdf) · [리포트: dyneasset 2026-06-11](https://woooty69.github.io/hw-pdf-arch-007/%EB%B9%85%EC%9B%A8%EC%9D%B4%EB%B8%8C%EB%A1%9C%EB%B3%B4%ED%8B%B1%EC%8A%A4%EF%BC%BB0035S0%EF%BC%BD_20260611_dyneasset_1104954.pdf)

**3. 아리바이오랩 (261780) 5,170원 · 1,497억원 · +27.03% — 삼진제약 "AR1001 임상 3상 성공 판단"**
아리바이오랩은 5,170원으로 27.03% 급등했고 거래대금은 605억원이다. 전날에는 아리바이오의 먹는 치매약 AR1001 임상 3상이 1차 목표를 달성했다는 발표에도 효능 해석이 엇갈리며 관련주가 급락했다. 오늘은 판권 파트너 삼진제약이 3상 성공으로 판단하고 상업화에 속도를 내겠다고 밝혔고, 미국 FDA 허가 추진 소식까지 겹쳐 재평가 매수가 들어왔다. 증권사 커버 리포트 없음.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
