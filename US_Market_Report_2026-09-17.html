## 🗓 시장 요약

**① FOMC, 2023년 7월 이후 첫 인상(3.75~4.00%, 만장일치 12-0) — 점도표는 "연내 한 번 더", 워시는 "여름 인플레이션 지표는 개선을 말해주지 않는다". 다우 −631p, 2년물 +7.3bp**
연준은 9/17 새벽(KST) 기준금리를 25bp 올린 **3.75~4.00%**로 결정했다. 2023년 7월 이후 3년 2개월 만의 첫 인상이며, 직전 회의들과 달리 반대표 없는 **만장일치(12-0)**였다(CNBC·폭스비즈니스·야후파이낸스). 점도표는 18명 중 12명이 연내 25bp 추가 인상(중간값 4.125%)을, 4명은 50bp 추가를, 2명만 동결을 그렸다. 성명서는 중동발 "높은 불확실성" 문구를 삭제하고 "생산성 증가가 강하고 자본투자가 왕성하다"를 추가했다. 워시 의장은 회견에서 "기저 인플레이션이 목표를 향해 분명히, 충분한 속도로 움직인다는 확신이 있어야 하는데 **그 기준이 충족되지 않았다**", "인플레이션은 너무 높은 상태가 너무 오래 지속됐다", "올여름 지표들은 기저 흐름이 유의미하게 개선됐다고 말해주지 않는다"며 2%로의 "더 시의적절한(timelier) 복귀"를 공언했다. 지수는 발표 직후 상승(나스닥 한때 +0.7%, 10년물 −4bp)했다가 회견이 진행되며 방향을 바꿔 다우가 장중 −900p(저가 51,186.67)까지 밀린 뒤 **−631.21p(−1.21%)**로 마감했고, S&P500 −0.45%, 나스닥은 −0.01%로 보합이었다. 채권은 아침 8월 소매판매 서프라이즈(+1.2%, 예상 +0.9%·컨트롤그룹 +1.4%)부터 짧은 쪽이 밀려 2년물이 **4.736%(+7.3bp)**로 뛰었고, 10년물은 **5.020%(+2.4bp)로 2007년 이후 처음 5% 위에서 마감**, 30년물은 5.361%로 보합이었다 — 긴축 재료가 커브 앞쪽에 얹히는 베어 플래트닝이다. CME 페드워치의 연내 2차 인상 확률은 **약 85%**로 올랐다(야후파이낸스). 해석하면 어제의 질문("워시가 '한 번'이라 말할 수 있는가")의 답은 '아니오'였고, 단기금리가 그 답을 가격에 반영했다. 다만 30년물이 움직이지 않은 것은 시장이 이 매파성을 '인플레 방치'가 아니라 '기대 안착'으로 읽었다는 뜻이기도 하다.

**② 유가 급반락 — 사우디의 오만 경유 수출 확대에 WTI \$102.02(−3.60%), 전일 유일한 상승 업종이던 에너지가 하루 만에 최대 낙폭 업종으로**
WTI 10월물은 **\$102.02(−3.60%, −\$3.81)**, 브렌트 11월물은 \$105.60(−2.90%)으로 4개월 최고에서 하루 만에 반락했다. 사우디가 폐쇄된 동서 송유관·얀부 터미널을 우회해 **오만 경유 수출을 늘리고 있다**는 보도가 공급 차질 프리미엄을 일부 걷어냈다(TheStreet). 전일 S&P500 유일한 상승 업종(+2.26%)이던 에너지는 이날 최대 낙폭 업종으로 뒤집혀 다이아몬드백(FANG) −8.03%, 옥시덴탈(OXY) −6.55%, 코노코필립스(COP) −6.15%, EOG −5.73%, 데본(DVN) −5.63%, APA −5.53%, 엑슨모빌(XOM) −3.54%, 셰브론(CVX) −2.86%로 전일 상승분을 그대로 반납했고, 이 되돌림이 다우 낙폭의 한 축이 됐다. 다만 유가·금리 상관계수 0.96(BMO)의 구조에서 유가 −3.6%에도 10년물이 5% 위에서 마감한 것은, 이날 금리를 민 것이 유가가 아니라 소매판매와 점도표였다는 뜻이다. 유가 100달러대가 유지되는 한 '유가발 인플레이션 → 연속 인상' 경로 자체는 닫히지 않았다.

**③ 반도체·광통신은 이틀째 반등 — SOX +0.63%, 그리고 로이터發 "SK하이닉스, 인텔 오하이오 부지에서 미국 메모리 생산 협상"에 인텔 +4.03%**
필라델피아 반도체지수는 **11,246.11(+0.63%)**로 이틀 연속 올랐다. 로이터는 SK하이닉스가 **인텔 오하이오 반도체 단지 부지 일부를 임대해 메모리를 생산하는 방안**을 협의 중이며, 인텔·주요 클라우드 기업과의 합작법인(JV)까지 검토된다고 보도했다 — 탐색 단계로 확정 사항은 없고 성사돼도 완공은 2030년 이후이며, SK하이닉스는 "다양한 방안을 검토 중이나 확정된 바 없다"고 밝혔다(아시아경제·글로벌이코노믹). 인텔(INTC)은 \$101.05(+4.03%)로 뛰었고, 전날 −6~13% 급락했던 광통신이 낙폭과대 반등을 이어가 루멘텀(LITE) **+9.59%(\$919.40)**, 코히런트(COHR) +6.92%로 상승률 상위를 쓸었다(24/7월스트리트). 마벨(MRVL) +3.61%, 델(DELL) +3.64%, 슈퍼마이크로(SMCI) +3.40%, 테라다인(TER) +2.49%, 아리스타(ANET) +2.44%, 엔비디아(NVDA) +0.82%(\$213.90), AMD +1.65%(\$512.50)가 올랐고 마이크론(MU) −0.11%, 브로드컴(AVGO) +0.07%는 쉬었다. 예외는 온세미(ON) **−9.02%(\$66.60)**로, 회사 고유 재료가 확인되지 않은 채 연초 대비 +96.8% 급등 뒤 차익실현과 매파 재프라이싱이 겹친 포지션 청산으로 해석됐고 시간외에서 +1.48% 반등했다(야후파이낸스). 금리 인상 당일에 SOX가 오르고 나스닥이 보합을 지킨 것은, AI 하드웨어 자금이 '금리'보다 '수주·합종연횡' 재료에 반응하고 있다는 신호다.

**④ 실적 경고 2연타 — J.B.헌트, 연료·인건비 급등에 "3분기 이익 감소" 경고로 −13.30%, 헌팅턴은 2026~27년 가이던스 하향에 지역은행 동반 급락**
운송사 J.B.헌트(JBHT)는 유가 급등에 따른 연료비와 기사 인건비 상승으로 **3분기 이익이 전년 대비 감소할 것**이라 경고해 \$236.73(**−13.30%**)로 폭락, S&P500 최하위였다(CNBC·야후파이낸스). 바클레이즈는 "비용 압박은 맞지만 화물 수요는 변곡점"이라며 과매도로 진단했다. 헌팅턴뱅크셰어스(HBAN)는 **2026~2027년 이익 전망을 하향**해 −5.55%였고, 시티즌스(CFG) −4.84%, 키코프(KEY) −4.52%, IBM −4.38%(재료 미확인) 등 지역은행·금융이 동반 급락하며 다우·러셀을 눌렀다(인베스팅닷컴). 베어드는 급락 후 키코프를 상향했다. 10년물 5%대에서 조달비용·예금경쟁이 은행 마진을 깎는 경로가 실제 가이던스로 확인된 첫 사례라는 점에서, 이날 지역은행 급락은 '금리 5% 시대'의 실적 비용을 보여준 장면이다. 반대편에서는 전일 전환사채 발행 공시로 −9.8% 급락했던 액슨(AXON)이 +5.96%로 되돌렸고, GE버노바(GEV) +4.79%, 에드워즈라이프사이언스(EW) +4.13%, 레비티(RVTY) +3.95%, 메틀러톨레도(MTD) +3.63% 등 전력·헬스케어 툴 강세가 이어졌다. 스페이스X(SPCX)는 스타십 첫 궤도비행 날짜 확정에 +5.15%였다(24/7월스트리트).

**⑤ 장 마감 후 레나 실적 미스 — EPS \$1.19·총마진 15.8%, 연간 인도 가이던스 8만~8.1만 채로 하향, 시간외 −3.1%. "모기지 6.8%"가 실물의 답안지**
레나(LEN)는 장 마감 후 회계 3분기 EPS **\$1.19**(조정 \$1.23, 예상 \$1.30), 매출 80억 달러, 인도 20,840채(−3%), 신규 수주 20,879채(**−9%**), 주택 총마진 15.8%(전년 17.5%)를 발표하고 연간 인도 가이던스를 8.2만~8.3만 채에서 **8.0만~8.1만 채로 하향**했다(PR뉴스와이어). 스튜어트 밀러 CEO는 "분기 중 모기지금리가 약 **6.8%**까지 올라 도전적인 환경이었고 실적이 기대에 못 미쳤다"고 했다. 주가는 정규장 −2.14%(\$78.36)에 이어 시간외 −3.14%(\$75.90)로 밀렸다. 크립토는 CLARITY법 부결 이튿날에도 코인베이스(COIN) −4.42%(\$164.51), 로빈후드(HOOD) −5.46%, 스트래티지(MSTR) −2.64%로 반등하지 못했고 비트코인은 \$76,000대에 머물렀다. 소매판매 +1.2%(강한 소비)와 레나 가이던스 하향(약한 주택)·J.B.헌트 경고(운송 비용)의 조합은, 금리 5%가 실물에 불균등하게 스며드는 초기 국면의 전형이다.

**⑥ 🇰🇷 한국은 5거래일 만에 반등 — 코스피 +1.37%(6,717.97), 기관 1.21조가 외국인 1.68조 매도를 받아냈고, SK하이닉스는 임단협 가결(찬성 57.08%)·인텔 협상 보도에 +4.08%**
코스피는 **6,717.97(+1.37%, +90.71)**로 5거래일 만에 반등해 6,700선을 회복했고, 코스닥은 815.98(+0.44%)이었다(한국거래소·머니투데이). 수급 주체가 바뀌었다 — 외국인은 **−1조 6,800억원으로 6거래일 연속 순매도**(9/15 −1조 5,697억원에서 오히려 확대)했고 개인도 −1조 1,900억원으로 돌아섰지만, **기관이 +1조 2,100억원**을 받아내며 지수를 밀어올렸다(EBN·인베스팅닷컴). 상승 종목 304개 vs 하락 578개로 반등은 대형주에 집중됐다. 주인공은 반도체다: SK하이닉스(000660)는 임단협 수정안 재투표 **가결(찬성 57.08%**, 성과급 현금 50%·주식 50%로 조정, 조인식은 추석 전)과 로이터의 인텔 협상 보도가 겹치며 **1,759,000원(+4.08%)**, 삼성전자(005930)는 253,500원(+2.01%), 원익IPS(240810)는 +10.15%로 뛰었다(서울신문·아시아경제). 국고채는 FOMC 전 저가매수에 3년물 4.053%(−3.8bp)·10년물 4.547%(−5.3bp)로 연중 최고에서 되돌렸으나(스페셜타임스), 원/달러는 **1,368.6원(+9.2원)**으로 이틀째 급등했다. 그 뒤 미국에서 SKHY는 시가 \$180.34(+3.2%)로 출발해 FOMC를 거치며 상승분을 반납, **\$174.87(+0.02%)**로 마감했고 시간외 +0.98%(\$176.59)였다. 괴리율은 국내 +4.08% 급등이 ADR 보합을 앞지르며 +38.8%에서 **+36.1%**로 크게 좁혀져 5회 연속 축소됐다. 코스피200 야간선물은 FOMC를 통째로 소화하며 시가 1,058.70 → 고가 **1,069.30** → 저가 **1,036.00**(진폭 33.3p)을 오간 끝에 **1,050.55(−1.00%, 정규장 선물 1,061.15 대비 −10.60p)**로 마감했다 — 발표 직후 상승과 회견 후 급락이라는 미국장의 궤적을 그대로 복사한 흐름이다.

## 1. 업종별 흐름

**상승 업종 3**

- **에너지(E&P·정유·통합)** — 다이아몬드백(FANG) −8.03%, 옥시덴탈(OXY) −6.55%, 텍사스퍼시픽랜드(TPL) −6.21%, 코노코필립스(COP) −6.15%, EOG −5.73%, 데본(DVN) −5.63%, APA −5.53%, EQT −5.10%, 엑슨모빌(XOM) −3.54%, 셰브론(CVX) −2.86%. 사우디의 오만 우회 수출 확대에 WTI −3.60%로 밀리자 전일 유일한 상승 업종이 최대 낙폭 업종으로 뒤집혔다.

- **운송·소비 방어** — J.B.헌트(JBHT) −13.30%(3분기 이익 감소 경고), 차터(CHTR) −4.39%, 아마존(AMZN) −0.99%, 마이크로소프트(MSFT) −1.37%, 구글(GOOGL) −0.61%. 연료·인건비 인플레이션이 운송 실적을 직격했고, 대형 소프트웨어·플랫폼은 이틀째 조정이 이어졌다.

**🇰🇷 [전달]** 이번 회차에 미국이 한국에 새로 전달하는 것은 세 가지다. ①**FOMC의 매파 확정** — 인상 자체(94.5~95%)는 국내 정규장이 이미 반영했지만, '점도표 연내 1회 추가 + 2차 인상 확률 85%'는 어제 09:00 이후 재료다. 야간선물 −1.00%(고 1,069.30→저 1,036.00)가 그 1차 반영치이며, 어제 +1.37% 반등분의 일부 반납을 시사한다. ②**단기금리 충격의 방향** — 미 2년물 +7.3bp·10년물 5.02%는 어제 국고채 되돌림(3년 4.053%·10년 4.547%)과 정반대 방향이라, 국내 금리 재상승 시 전일 살아난 중후장대·성장주에 재차 부담이 갈 수 있다. 반면 WTI −3.60%는 정유·항공·화학의 비용 부담을 덜어주는 반대 방향 재료다. ③**인텔-SK하이닉스 협상** — 미국에서 인텔 +4.03%로 반긴 이 재료는 국내에서는 양면적이다: 대미투자·관세 리스크 완화(긍정) vs HBM·최신 D램의 국가핵심기술 해외 이전 심의와 국내 클러스터 투자 분산(부담). 원익IPS +10.15% 등 장비주가 '미국 신공장 = 장비 발주' 기대를 먼저 반영한 만큼, 후속 보도의 톤이 갭 유지 여부를 정한다. SOX 갭베타 0.99~1.35의 국내 장비주(원익IPS(240810)·유진테크(084370)·주성엔지니어링(036930))에는 SOX +0.63% 이틀 연속 반등이 지지 요인이다.

**🇰🇷 [수급]** 외국인 매도 클라이맥스 판정은 이번 회차에서 **기각됐다** — 9/15 −1조 5,697억원에서 9/16 **−1조 6,800억원으로 6거래일 연속이자 재가속**됐고, 어제 제시한 확정 조건(FOMC 이후 첫 거래일 순매수 전환)은 오늘 9/17 정규장으로 넘어갔다. 대신 기관이 +1조 2,100억원으로 9월 들어 최대 규모 매수에 나섰고 외국인은 선물을 사며(현물 매도·선물 매수) 헤지 성격을 보였다(EBN·연합). 개인 −1조 1,900억원 전환은 나흘 연속 매수 뒤 차익실현이다. 상승 304 vs 하락 578의 편중은 기관 매수가 반도체 대형주에 집중됐음을 뜻하며, 지수 반등에도 시장 폭은 여전히 약세다 — 외국인 전환 없이 기관 단독으로 6,700을 지키는 구조는 지속성이 약하다.

**시장의 시선** — 이날 확인된 것은 '워시 연준'의 반응함수다. 점도표(연내 1회 추가)보다 회견("기준이 충족되지 않았다")이 더 매파적이었고, 시장은 2년물 +7.3bp로 응답하되 30년물은 움직이지 않았다 — 단기 긴축은 세게, 장기 인플레 기대는 안착. 이 조합은 주식에 '밸류에이션 압박은 앞쪽 금리에서, 실적 압박은 유가·임금에서'라는 이중 청구서를 내밀지만, 동시에 연준 신뢰가 유지된다면 조정의 하한도 정해준다. 나스닥 보합·SOX +0.63%가 보여주듯 AI 하드웨어는 금리보다 재료에 반응하는 국면이고, 다우 −1.21%는 은행·운송·에너지라는 '구경제 실적'의 문제였다. 다음 시험대는 10년물이 5% 위에 머무는 기간과, 12월 2차 인상 확률 85%가 소매판매·PCE로 강화되는지다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 인텔 (INTC) +4.03% — \$101.05, 로이터 "SK하이닉스, 인텔 오하이오 부지 임대해 미국 메모리 생산 협상 중" — JV까지 검토, SK "확정된 바 없다"**
로이터는 SK하이닉스가 인텔의 오하이오 반도체 단지 부지 일부를 임대해 메모리 칩을 생산하는 방안을 협의 중이며, 인텔 및 주요 클라우드 기업과의 합작법인(JV) 설립안까지 검토되고 있다고 보도했다. 협상은 탐색 단계로 확정 사항이 없고, 성사되더라도 공장 완공은 2030년 이후다. 인텔로서는 오하이오 단지의 재정 부담을 덜고, 트럼프 행정부로서는 대미 반도체 투자 실적을 쌓는 구도라는 해석이 붙었다(아시아경제·파이낸셜뉴스·글로벌이코노믹). SK하이닉스는 "경쟁력 강화를 위해 다양한 방안을 검토하고 있으나 확정된 사항은 없다"고 밝혔고, HBM·최신 D램이 국가핵심기술로 분류될 수 있어 기술 해외 이전은 정부 심의 관문을 거쳐야 한다는 지적도 나왔다. 인텔은 +4.03%로 정부 지분 투자(8월) 이후 재차 '미국 반도체 정책 수혜'의 중심에 섰고, 국내에서는 SK하이닉스 +4.08%·원익IPS +10.15%가 먼저 반응했다.

**2. J.B.헌트 (JBHT) −13.30% — \$236.73, "연료·기사 인건비 급등에 3분기 이익 감소" 경고 — S&P500 최하위, 운송 전반 동반 약세**
인터모달 운송사 J.B.헌트는 투자자 행사에서 유가 급등에 따른 연료비와 기사 인건비 상승으로 3분기 이익이 전년 대비 감소할 것이라 밝혀 \$236.73(−13.30%)로 폭락했다(CNBC·야후파이낸스). 유가가 한 달 새 20% 넘게 오르며 연료 서차지 전가가 시차를 두고 이뤄지는 운송업의 비용 구조가 직격탄을 맞았고, 이는 소매판매 +1.2%가 보여준 '강한 수요'의 반대편에서 '비용 인플레이션'이 실적을 깎는 경로를 처음으로 수치화한 경고였다. 바클레이즈는 "비용 상승은 맞지만 화물 수요는 변곡점에 있다"며 낙폭 과대를 지적했다(스톡트윗츠). 철도·트럭 등 운송 전반이 동반 약세를 보이며 다우 운송지수를 눌렀고, 이날 다우존스30 −1.21%의 심리적 배경이 됐다.

**3. 헌팅턴뱅크셰어스 (HBAN) −5.55% — \$15.82, 2026~2027년 이익 가이던스 하향 — 지역은행 '금리 5%'의 첫 실적 청구서**
헌팅턴은 2026~2027년 이익 전망을 하향해 −5.55%로 급락했고, 시티즌스파이낸셜(CFG) −4.84%, 키코프(KEY) −4.52% 등 지역은행이 동반 급락했다(인베스팅닷컴·인텔렉티아). 10년물 5%·2년물 4.7%대 환경에서 예금비용 상승과 대출수요 둔화가 순이자마진을 압박하는 경로가 개별 은행의 가이던스로 확인된 첫 사례다. 베어드는 급락 직후 키코프를 상향하며 "지역은행 밸류에이션이 과도하게 눌렸다"고 했다(핀비즈). 금융주는 이날 S&P500에서 에너지 다음으로 약한 업종이었고, 전날 CLARITY법 부결로 급락한 크립토·핀테크(COIN −4.42%·HOOD −5.46%)와 함께 '규제·금리의 이중 압박' 구간에 들어섰다.

**4. 레나 (LEN) −2.14%·시간외 −3.14% — \$78.36, 회계 3분기 EPS \$1.19 미스·총마진 15.8%, 연간 인도 가이던스 하향 — "모기지 6.8%"**
레나는 장 마감 후 3분기(6~8월) EPS \$1.19(조정 \$1.23, 컨센서스 \$1.30), 매출 80억 달러, 인도 20,840채(−3% YoY), 신규 수주 20,879채(−9%), 주택 총마진 15.8%(전년 17.5%), 평균 판매가 \$372,000(−3%)를 발표했다(PR뉴스와이어). 연간 인도 가이던스는 8.2만~8.3만 채에서 8.0만~8.1만 채로 내렸고, 4분기 총마진 가이던스도 15.5~16.0%에 그쳤다. 스튜어트 밀러 CEO는 "모기지금리가 분기 중 약 6.8%까지 오르는 도전적 환경에서 실적이 기대에 못 미쳤다"며 인센티브 확대로 물량을 지키는 전략을 유지했다. BofA는 실적 전 목표가를 내렸다. 10년물 5%가 모기지를 통해 주택 실물에 전달되는 속도를 보여준 지표적 실적으로, 주택건설주 전반의 약세 재료다.

**5. 루멘텀 (LITE) +9.59% — \$919.40, 광통신 낙폭과대 반등 이틀째 — 코히런트 +6.92%, "AI 광모듈 수요는 훼손되지 않았다"**
루멘텀은 +9.59%로 S&P500 상승률 1위, 코히런트는 +6.92%로 그 뒤를 이었다(24/7월스트리트). 9/14 AI 캐펙스 속도조절 우려에 −6~13% 급락했던 광통신 체인이 '주문 취소나 수요 둔화의 실체가 없다'는 확인 속에 이틀 연속 반등했고, 어플라이드옵토(AAOI)도 +3%대였다. 마벨(MRVL) +3.61%, 아리스타(ANET) +2.44%, 델(DELL) +3.64%, 슈퍼마이크로(SMCI) +3.40% 등 AI 인프라 체인이 동반 강세를 보이며 나스닥을 보합으로 방어했다. 금리 인상 당일의 이 반등은 AI 하드웨어 수급이 매크로보다 펀더멘털 뉴스플로(수주·합병·파트너십)에 좌우되는 국면임을 재확인시켰다 — 국내 광통신·부품(이수페타시스 등) 및 서버 체인에 직접 매핑되는 재료다.

**6. 온세미 (ON) −9.02% — \$66.60, 회사 고유 재료 미확인 급락 — 연초 대비 +96.8% 랠리 뒤 포지션 청산, 시간외 +1.48% 반등**
온세미는 뚜렷한 공시·다운그레이드 없이 −9.02%로 급락해 반도체 중 최대 낙폭이었다. 야후파이낸스는 연초 이후 +96.8% 급등에 따른 차익실현에, 워시 연준의 매파 재프라이싱(연내 2차 인상 확률 약 85%)과 레버리지 축소가 겹친 '포지셔닝 청산'으로 해석했고, 셈텍(SMTC)도 동반 하락했다. 시간외 +1.48% 반등이 이를 뒷받침한다. 전일 스카이웍스 +13.6% 랠리를 되돌린 SWKS −4.90%·QRVO −3.46%와 함께, 이날 반도체 내부는 'AI 데이터센터 체인은 매수, 아날로그·RF·차량용은 차익실현'으로 명확히 갈렸다 — 국내에서는 DB하이텍·아날로그 팹리스보다 HBM·서버 체인 우위가 이어질 수 있음을 시사한다.

**7. 다이아몬드백 에너지 (FANG) −8.03% — \$194.54, 사우디 오만 우회 수출 확대에 WTI −3.60% — 에너지, 하루 만에 최대 낙폭 업종으로**
다이아몬드백은 −8.03%로 에너지 최대 낙폭이었고 옥시덴탈 −6.55%, 코노코필립스 −6.15%, EOG −5.73%, APA −5.53%가 뒤를 이었다(CNBC 미드데이 무버·핀비즈). 사우디가 동서 송유관·얀부 폐쇄를 오만 경유 수출로 우회하기 시작했다는 보도에 WTI가 \$102.02(−3.60%)로 밀리며, 전일 '유일한 상승 업종'이던 에너지가 상승분을 하루 만에 반납했다. 다만 WTI는 여전히 \$100 위이고 골드만의 '브렌트 \$120 시나리오'도 철회되지 않아, 이날 하락은 추세 전환이 아니라 공급 차질 프리미엄의 변동성으로 읽힌다. 국내 정유(S-Oil·SK이노베이션)에는 원가 부담 완화, 조선(VLCC 발주 서사)에는 중립 재료다.

**8. 스페이스X (SPCX) +5.15% — \$150.88, 스타십 첫 궤도비행 발사 날짜 확정 — 우주주 차별화**
스페이스X는 스타십의 첫 궤도 비행 시도 날짜가 확정됐다는 소식에 +5.15%로 올랐고, 로켓랩·AST스페이스모바일은 보합권에 머물러 재료 보유 종목만 오르는 차별화가 나타났다(24/7월스트리트). 금리 5% 환경에서 우주·성장주 전반의 멀티플 압박이 지속되는 가운데, 실행 이벤트(발사 일정)가 있는 종목으로만 자금이 몰리는 전형적 후기 사이클 패턴이다. 전일 −9.8% 급락했던 액슨(AXON)도 +5.96%로 되돌리며, 고밸류에이션 종목의 낙폭과대 반등이 선별적으로 진행됐다.

**9. GE버노바 (GEV) +4.79% — \$925.09, AI 전력 수요 서사 지속 — 전력기기, 금리 인상 당일에도 상승 업종**
GE버노바는 +4.79%로 이틀 연속 강세였다. 가스터빈·그리드 수주 잔고와 AI 데이터센터 전력 수요 서사가 유지되는 가운데, 미국 전력기기는 10년물 5%에도 '실적으로 검증된 AI 인프라'로 취급받았다. 이는 9/15 국내 전력기기(HD현대일렉트릭 −5.28%·효성중공업 −4.07%)가 금리 충격을 초과 반영했던 것과 대비되며, 국내 전력기기 낙폭 되돌림의 근거가 되는 크로스체크 포인트다. 에드워즈(EW) +4.13%, 레비티(RVTY) +3.95%, 메틀러톨레도(MTD) +3.63% 등 전일 시작된 헬스케어 툴 강세도 이틀째 이어져, '금리와 무관한 성장'으로의 로테이션이 하루짜리가 아님을 보여줬다.

**10. SK하이닉스 ADR (SKHY) +0.02% — \$174.87 (괴리율: +36.1%), 인텔 협상·임단협 가결로 시가 +3.2% 출발 후 FOMC에 반납 — 시간외 +0.98%**
SK하이닉스 ADR은 인텔 협상 보도와 임단협 타결을 안고 시가 \$180.34(+3.2%)로 출발, 고가 \$180.66을 찍은 뒤 FOMC 매파 확인과 함께 상승분을 반납해 \$174.87(+0.02%)로 마감했고(저가 \$172.79, 거래량 1,540만 주) 시간외에서는 \$176.59(+0.98%)로 반등했다(CNBC 쿼트). 국내 정규장에서 원주가 +4.08%(1,759,000원) 급등한 날 ADR이 보합에 그치며 괴리율은 +38.8%에서 **+36.1%**로 2.7%p 좁혀졌다 — 9/4 +45.1% 이후 5회 연속 축소이며, 이번에는 축소 폭의 대부분을 국내 상승이 만들었다. 임단협은 찬성 57.08%로 가결돼(성과급 현금 50%·주식 50%, 조인식 추석 전) 자사주 매입 개시 요건이 갖춰졌고, 인텔 협상은 성사 시 2030년 이후 가동이라 단기 실적 재료가 아니라 '관세·대미투자 리스크의 헤지' 성격이다. 오늘 국내 개장의 관건은 외국인이 6일 연속 매도를 끊는지다.

## 3. 구루·기관 코멘트

**증권사 리포트 5선**
- **바클레이즈 — J.B.헌트, 비용 압박 속 수요 변곡점.** "연료·인건비 상승이 단기 이익을 깎는 것은 맞지만 화물 수요는 변곡점에 있다. 서차지 전가가 따라붙으면 마진은 복원된다" — 급락을 과매도로 진단.
- **베어드 — 키코프 상향(지역은행 급락 후).** 헌팅턴발 가이던스 쇼크로 눌린 지역은행 중 밸류에이션 매력이 커진 종목으로 키코프를 지목.
- **BofA — 레나 목표가 하향(실적 발표 전).** 모기지 6.8% 환경의 마진 압박을 선반영 — 실제 실적이 이를 확인했다.
- **에버코어 ISI — 델 \$650 목표가의 관성.** 전일 상향 보고서가 재차 회자되며 델 +3.64%, AI 서버 체인 반등의 근거로 소비됐다.
- **야후파이낸스 마켓 노트 — "인상 이후가 더 중요하다".** 역사적으로 연준의 첫 인상 직후 증시는 눌리지만 6~12개월 뒤 방향은 실적이 결정 — 1994·2004·2015년 사이클 비교가 재조명됐다.

**국내 증권사·미디어**
- **EBN 시장 정리** — "외국인 매도 폭탄을 기관이 받아냈다. 지수는 6,700을 회복했지만 상승 304 vs 하락 578로 시장 폭은 약세 — 대형 반도체에 집중된 반등이며, FOMC 결과에 따라 외국인 수급 전환 여부가 판가름난다."
- **머니투데이 마감** — "국채금리·유가 부담 속에서도 기관 매수에 양대지수가 웃었다. SK하이닉스는 인텔과의 미국 생산 협상 소식에 상승폭을 키웠고, 전문가들은 FOMC 인상이 단행돼도 단기 충격은 제한적일 것으로 봤다."
- **스페셜타임스(채권)** — "FOMC를 하루 앞두고 국고채에 저가매수가 유입돼 3년물 4.053%(−3.8bp)·10년물 4.547%(−5.3bp)로 되돌렸다. 외국인은 3년 선물 9,538계약 순매수, 10년 선물 4,935계약 순매도로 단기물 선호."

**구루·시장 코멘트**
- **케빈 워시(연준 의장)** — "기저 인플레이션이 목표를 향해 분명히, 충분한 속도로 움직인다는 확신이 서야 한다. FOMC는 그 기준이 충족되지 않았다고 판단했다." "인플레이션은 너무 높은 상태가 너무 오래 지속됐다." 금리 상승의 배경으로는 경제 강세·자본 경쟁(캐펙스 급증)·지정학 세 가지를 꼽으며 2%로의 "더 시의적절한 복귀"를 공언.
- **점도표의 숫자** — 18명 중 12명이 연내 25bp 추가 인상(중간값 4.125%), 4명은 50bp, 2명은 동결. CME 페드워치 연내 2차 인상 확률 약 85%로 상승.
- **스튜어트 밀러(레나 CEO)** — "모기지금리가 분기 중 6.8%까지 오르는 도전적 환경이었다. 물량과 회전을 지키기 위해 인센티브를 계속 쓰겠다."
- **8월 소매판매의 함의** — 헤드라인 +1.2%(예상 +0.9%), 컨트롤그룹 +1.4%로 7월 부진(−0.6%)을 반전. '강한 소비 + 유가발 물가'의 조합은 연속 인상 명분을 강화하는 쪽으로 소화됐다(AP·트레이더스에이전시).

### 🇰🇷 한국 개장 관전 포인트
- **야간선물 −1.00%의 되돌림 폭.** 시가 1,058.70 → 고가 1,069.30 → 저가 1,036.00 → 종가 1,050.55는 'FOMC 발표 직후 안도 → 워시 회견 후 급락 → 낙폭 축소'의 궤적이다. 정규장 선물 1,061.15 대비 −10.60p 갭은 코스피 −0.6~−1.0% 출발권이며, 어제 반등(+1.37%)의 절반을 지키는 6,650~6,670이 1차 지지다.
- **외국인 전환 여부 — 오늘이 판정일.** 6거래일 연속 −1.68조까지 재가속된 외국인 매도가 'FOMC 불확실성 해소' 이후에도 이어지는지가 클라이맥스 통과 판정의 확정 조건이다. 기관 +1.21조의 단독 방어는 지속성이 약해, 외국인이 돌아서지 않으면 6,700 안착은 어렵다.
- **반도체 — 재료는 겹겹, 가격은 이미 +4%.** SKHY 시간외 +0.98%·SOX +0.63%는 지지 요인이지만 인텔 협상 재료는 어제 국내가 먼저 반영했다(SK하이닉스 +4.08%·원익IPS +10.15%). 오늘은 임단협 가결에 따른 자사주 매입 개시와 외국인 수급이 가격을 정하며, 괴리율 +36.1%(5회 연속 축소)는 ADR 조정이 마무리 국면임을 시사한다. 인텔 협상의 국가핵심기술 심의 관련 후속 보도는 변동성 재료.
- **금리·환율의 역방향 조합.** 미 2년물 +7.3bp·10년물 5.02%는 어제 국고채 강세(3년 4.053%)를 되돌릴 수 있는 재료이고, 원/달러 1,368.6원 + 달러인덱스 100 돌파는 1,370원대 진입 압력이다. 환율이 1,370원을 넘으면 외국인 현물 매도의 환차손 회피 성격이 강화되는 악순환에 유의.
- **유가 하락의 수혜 vs 금리의 부담.** WTI −3.60%는 정유·항공·화학의 비용 완화 재료이나, 지역은행발 '금리 5%의 실적 청구서'(HBAN 가이던스 하향)는 국내 은행·보험의 마진 서사에도 참고 지표다. 미국 전력기기(GEV +4.79%) 강세는 9/15 급락한 국내 전력기기(HD현대일렉트릭·효성중공업·LS일렉트릭)의 되돌림 근거.
- **레나 쇼크의 매핑.** 모기지 6.8%發 주택 가이던스 하향은 국내 건설·가구·건자재에 직접 대응 종목이 적지만, '금리 5% → 실물 둔화'의 첫 데이터라는 점에서 경기민감주 전반의 상단을 제한하는 재료다.
