## 🗓 시장 요약

**① 나스닥 26,477.81(+1.18%)·S&P500 7,722.60(+0.60%)·다우 52,377.57(+0.03%) — 브로드컴·앤트로픽 \$630억 금융 구조에 반도체 랠리, 보잉이 다우 발목**
나스닥은 **26,477.81(+308.43, +1.18%)**, S&P500은 **7,722.60(+45.83, +0.60%)**로 이틀 연속 올랐고, 다우는 **52,377.57(+15.99, +0.03%)**로 장중 약세를 겨우 만회했다. 나스닥100은 29,651.44(+1.29%), 러셀2000은 2,818.87(+1.16%)로 중소형주도 강했고 VIX는 17.53(−4.68%)로 내려갔다. 전날 앤트로픽 상장 신고서가 AI 수요를 숫자로 보여 준 데 이어, 브로드컴이 앤트로픽의 AI 칩 구매 자금을 금융사들이 대는 \$630억 규모 구조를 공개하자 'AI 투자 자금이 어디서 나오느냐'는 우려가 한결 누그러졌다. 코카콜라·UPS·보잉·힐튼·제트블루 등 실적이 쏟아진 가운데 FOMC는 이틀 일정에 들어갔다.

**② 2년물 4.70%(+2.0bp)·10년물 4.99%(−1.0bp)·30년물 5.30%(−1.0bp) — 10월 소비자신뢰 91.7로 반등, FOMC 결과 대기**
미 재무부 기준 2년물은 **4.70%(+2.0bp)**, 10년물은 **4.99%(−1.0bp)**, 30년물은 **5.30%(−1.0bp)**로 마감해 10년물이 5%선 아래로 소폭 내려왔다. 컨퍼런스보드 10월 소비자신뢰지수는 **91.7**로 9월보다 7.5포인트 올라 예상치(80.5)를 크게 웃돌았고, 9월 신규 주택 판매와 내구재 주문도 예상보다 좋았다. 다만 컨퍼런스보드의 퍼거스 매코믹은 소비자신뢰가 여전히 장기 하락 추세 안에 있다고 짚었고, 향후 6개월 서비스·내구재 지출 계획은 줄었다. CME 페드워치 기준 이번 회의 인상 확률은 약 10%로, 시장은 동결과 함께 추가 인상 여지를 남기는 '매파적 동결'을 예상한다.

**③ WTI \$100.03(−1.70%)·브렌트 \$114.04(−1.53%) — 사우디·튀르키예·파키스탄·이란 회담에 긴장 완화 기대, 정유주 급락**
WTI 12월물은 장중 \$99.44까지 밀려 \$100선을 잠시 내준 뒤 **\$100.03(−\$1.73, −1.70%)**로, 브렌트 12월물은 **\$114.04(−\$1.77, −1.53%)**로 마감해 이틀 연속 내렸다. 월요일 사우디아라비아·튀르키예·파키스탄·이란이 회담을 연 것이 중동 긴장 완화 기대를 키웠지만, 후티 반군이 사우디 라스타누라 정유시설을 미사일로 공격했다고 주장하면서 낙폭은 제한됐다. 유가와 정제마진 하락 우려에 발레로(VLO)는 **\$387.34(−9.24%)**로 급락했고 필립스66·마라톤페트롤리엄도 S&P500 하락 상위에 올랐다. 금은 \$4,073.80(+0.88%)로 올랐고 비트코인은 \$80,669(+1.19%)로 \$80,000선을 되찾았다.

**④ AI·반도체 — SOX 11,482.51(+3.60%)·AMD +5.45%·브로드컴 +4.00%·인텔 +3.61%·마이크론 +2.77%**
반도체지수는 장중 11,217.67에서 11,527.33까지 오른 뒤 **11,482.51(+3.60%)**로 마감해 이틀간 6% 넘게 올랐다. 브로드컴(AVGO)은 \$342.33(+4.00%)로 S&P500 상승 상위에 올랐고, 그 여파로 AMD(AMD) \$560.26(+5.45%)·인텔(INTC) \$93.74(+3.61%)·마이크론(MU) \$928.76(+2.77%)·SK하이닉스 ADR(SKHY) \$145.36(+1.92%)이 함께 올랐다. 엔비디아(NVDA)는 메타 지분 \$30억 투자와 협력 확대 소식 속에 \$217.94(+0.90%)로 상대적으로 덜 올랐다. 오라클(ORCL)은 구글 TPU와 세레브라스·삼바노바 칩을 자사 클라우드에 들이는 계약으로 엔비디아 의존도를 낮춘다며 \$130.53(+3.55%), 루멘텀(LITE)은 \$866.18(+5.88%)로 강세를 이어갔다. 반면 마이크로소프트(MSFT)는 수요일 실적을 앞두고 \$531.33(−0.24%)로 약보합, 메타(META)는 \$950억 신주 발행 부담에 \$620.19(−1.64%)로 이틀째 내렸다.

**⑤ 실적·이슈 — 제트블루 +18.99%·소파이 +13.42%·펜테어 +12.80%·UPS +5.80%·GM +5.54%, 자일럼 −14.21%·보잉 −10.69%·유니퍼스트 −10.46%**
3분기 실적이 엇갈리며 종목별 등락 폭이 컸다. 4분기 단위 좌석 마일당 매출(RASM)이 최대 22% 늘 것이라고 밝힌 제트블루(JBLU)는 **\$2.82(+18.99%)**로 2025년 4월 이후 최고의 하루를 보냈고, 3분기 실적이 예상을 웃돌고 장기 성장 전망을 내놓은 소파이(SOFI)는 **\$16.40(+13.42%)**, 펜테어(PNR)는 **\$62.29(+12.80%)**로 급등했다. 연간 매출 전망을 올린 UPS(UPS)는 **\$106.14(+5.80%)**, 블룸에너지(BE)는 **\$218.50(+7.15%)**, 로열캐리비안(RCL)은 **\$295.95(+5.47%)**, 상장 시장을 나스닥으로 옮기기로 한 GM(GM)은 **\$80.54(+5.54%)**였다. 반대로 3분기 주당순이익이 예상에 못 미치고 연간 가이던스를 낮춘 자일럼(XYL)은 **\$92.86(−14.21%)**, 737 MAX 증산 지연을 밝힌 보잉(BA)은 **\$168.18(−10.69%)**로 급락했다. 연방거래위원회(FTC)가 \$55억 인수를 막을 것이라는 보도에 유니퍼스트(UNF)는 **\$250.40(−10.46%)**, 시타스(CTAS)는 **\$214.80(−4.93%)**로 내렸고, 유로넷(EEFT)은 **\$59.01(−7.72%)**였다.

**⑥ 🇰🇷 SOX +3.60%·SK하이닉스 ADR \$145.36(+1.92%)·코스피200 야간선물 899.65(+1.95%) — 반도체 사흘째 강세 기대, 900선 시험**

해석하면 국내 증시는 SOX(+3.60%)와 AMD(+5.45%)·마이크론(+2.77%) 강세, 코스피200 야간선물의 주간 종가(882.45) 대비 +1.95% 상승을 반영해 반도체 중심으로 강하게 출발할 여지가 크다. 다만 SK하이닉스 ADR 상승 폭(+1.92%)은 SOX보다 작았고, 내일(29일) 새벽 3시 FOMC 결과와 마이크로소프트·알파벳 실적을 앞둔 경계 심리가 장중 추격 매수를 제한할 수 있다.

브로드컴은 시가 \$339.87에서 고가 \$345.67(+5.01%)까지 오른 뒤 \$342.33(+\$13.16, +4.00%)로 마감해 S&P500 상승 상위권에 들었다. 회사는 월요일 장 마감 뒤 앤트로픽이 브로드컴의 AI 칩·인프라를 살 수 있도록 하는 \$630억 규모의 금융 구조를 발표했다. 뱅크오브아메리카·블랙록·씨티그룹·모건스탠리 4곳이 특수목적법인을 통해 하드웨어를 사들인 뒤 앤트로픽에 임대하는 방식이며, 브로드컴은 현금을 직접 투자하지 않고 선순위 대출 금액까지 잔존가치를 보증한다. 오펜하이머의 릭 섀퍼는 '시장수익률 상회'를 유지하며 이번 발표가 AI 투자 자금 조달에 대한 투자자 우려를 덜어 줄 것이라고 평가했다. 참여 금융사 주가도 모건스탠리 +1.9%·씨티 +1.4% 등으로 올랐다.

**2. 보잉 (BA) −10.69% — 3분기 조정 주당손실 34센트로 예상(21센트) 하회, 737 MAX 증산은 내년 하반기로 지연**
보잉은 시가 \$183.50에서 저가 \$167.41(−11.10%)까지 밀린 뒤 \$168.18(−\$20.13, −10.69%)로 마감해 다우 30종목 가운데 가장 크게 내렸고 수년 만의 최악의 하루를 기록했다. 3분기 매출은 \$241.9억으로 4% 늘어 예상치 \$238.4억을 웃돌았지만, 일회성 항목을 뺀 주당손실은 34센트로 시장 예상(21센트 손실)보다 컸다. 순손실은 \$1.16억(주당 26센트)으로 1년 전 \$53.4억 손실에서 크게 줄었다. 그러나 날개 생산 속도가 느려 737 MAX 증산은 내년 하반기 이전에는 어렵다고 밝힌 것이 실망을 키웠고, 켈리 오트버그 CEO는 "아직 끝나지 않았다"며 회복 의지를 강조했다. 미 연방항공청은 지난 20일 737 MAX 10의 형식 인증을 내준 바 있다.

**3. 메타 (META) −1.64% — AI 인프라용 최대 \$950억 조달 첫 단계로 보통주·우선주 약 \$350억 발행, 엔비디아 \$30억 지분 투자**
메타는 시가 \$627.03에서 저가 \$619.21(−1.80%)까지 밀린 뒤 \$620.19(−\$10.37, −1.64%)로 마감해 이틀 연속 내렸다. 회사는 AI 인프라 확충을 위해 최대 \$950억을 조달할 계획이며, 첫 단계로 약 \$350억 규모의 보통주·우선주를 발행한다. 엔비디아는 메타 지분에 \$30억을 투자하고 '뮤즈' 모델 계열에서 협력을 넓히기로 했으며, AMD·브로드컴·엔비디아는 합쳐서 최대 \$50억어치 신주 매입에 관심을 보인 것으로 전해졌다. 대규모 지분 희석 부담이 이어지면서 메타는 빅테크 가운데 드물게 이틀째 약세를 보였다.

**4. 코카콜라 (KO) −1.64% — 3분기 조정 EPS 91센트로 예상(88센트) 상회·매출 \$134억(+7%), 북미 수요 둔화에 하락**
코카콜라는 시가 \$90.82에서 고가 \$92.94(+0.26%)까지 올랐다가 \$91.18(−\$1.52, −1.64%)로 마감했다. 3분기 조정 주당순이익은 91센트로 예상치 88센트를 웃돌았고, 순매출은 7% 늘어난 \$134억으로 예상치 \$129.2억을 넘었으며 순이익은 \$40.1억(주당 93센트)이었다. 회사는 이익 전망도 올렸지만 북미 수요 둔화가 드러나면서 10월 내내 이어진 필수소비재 강세의 차익 실현 매물이 나왔다. 존 머피 CFO는 기저 성장 흐름이 "여전히 상당히 강하다"고 말했다.

**5. 제트블루 (JBLU) +18.99% — 4분기 단위 좌석 마일당 매출 최대 22% 증가 전망, 2025년 4월 이후 최고의 하루**
제트블루는 시가 \$2.78에서 고가 \$2.97(+25.32%)까지 치솟은 뒤 \$2.82(+\$0.45, +18.99%)로 마감했다. 3분기 손실은 예상보다 컸고 매출도 추정치에 조금 못 미쳤으며, 연간 조정 영업이익률 가이던스는 −2~−5%에서 −4.5~−6.5%로 낮췄다. 그러나 4분기 단위 좌석 마일당 매출(RASM)이 최대 22% 늘 것이라는 전망이 시장의 관심을 끌었고, 조애나 제러티 CEO는 견조한 수요와 높은 운임이 매출을 초기 예상보다 크게 끌어올렸다고 밝혔다. UBS의 아툴 마헤스와리는 높은 연료비가 부담이지만 운영 흐름이 강하고 단기적으로 버틸 유동성이 충분하다고 평가했다.

**6. UPS (UPS) +5.80% — 3분기 예상 상회, 연간 매출 전망 \$912억→\$926억 상향**
UPS는 시가 \$101.54에서 저가 \$99.61(−0.71%)까지 밀렸다가 고가 \$106.58(+6.25%)까지 오른 뒤 \$106.14(+\$5.82, +5.80%)로 마감했다. 3분기 실적이 예상을 웃돌았고, 회사는 연간 매출 전망을 \$912억에서 \$926억으로 올렸다. 캐럴 토메 CEO는 소비자가 여전히 견조하고 연말 성수기 수요도 강해 보인다고 밝혀, 물류 경기 둔화 우려를 덜었다. 이날 상승으로 UPS는 \$100선 위로 확실히 올라섰다.

**7. 힐튼 (HLT) −1.96% — 3분기 조정 EPS \$2.45로 예상 상회·연간 RevPAR 전망 4~4.5%로 상향, 매출은 \$33.3억으로 미달**
힐튼은 시가 \$340.62에서 저가 \$335.23(−4.73%)까지 밀렸다가 \$344.98(−\$6.91, −1.96%)로 낙폭을 줄였다. 3분기 조정 주당순이익은 \$2.45로 LSEG 집계 예상치 \$2.36을 웃돌았지만, 총매출은 6.6% 늘어난 \$33.3억으로 예상치 \$33.7억에 못 미쳤다. 회사는 연간 객실당 매출(RevPAR) 증가율 전망을 3~3.5%에서 4~4.5%로 올렸지만, 미국 중간선거와 중동 분쟁이 4분기에 부담이 될 수 있다고 경고했다. 지역별로는 미국 RevPAR가 7% 늘었고 중동·아프리카는 5.6% 줄었다.

**8. 시타스 (CTAS) −4.93% — FTC가 유니퍼스트 \$55억 인수 저지 소송 방침 보도, 유니퍼스트 −10.46%**
시타스는 시가 \$225.23에서 저가 \$209.00(−7.49%)까지 밀린 뒤 \$214.80(−\$11.13, −4.93%)로 마감했다. 미 연방거래위원회(FTC)가 시타스의 유니퍼스트 \$55억 인수를 막기 위해 소송을 낼 계획이라는 보도가 나오면서, 인수 대상인 유니퍼스트(UNF)는 장중 −16.91%까지 폭락한 뒤 \$250.40(−10.46%)로 마감했다. 업무용 유니폼 대여 업체끼리의 결합이라 경쟁 제한 심사가 쟁점이었고, 거래가 무산되면 유니퍼스트 주가에 반영된 인수 프리미엄이 사라질 수 있다는 우려가 컸다.

**9. GM (GM) +5.54% — 상장 시장을 뉴욕증권거래소에서 나스닥으로 이전, 전통 완성차 업체로는 처음**
GM은 시가 \$78.37에서 고가 \$81.59(+6.92%)까지 오른 뒤 \$80.54(+\$4.23, +5.54%)로 마감했다. 회사는 보통주 상장 시장을 뉴욕증권거래소에서 나스닥으로 옮긴다고 발표했으며, 전통 완성차 업체가 나스닥에 상장하는 것은 처음이다. 최근 월마트·힐튼·팔란티어도 나스닥으로 옮겼고, 폴 제이컵슨 CFO는 회사가 성장하는 만큼 나스닥이 자연스러운 터전이라고 말했다. 기술·성장 기업 이미지를 강화하려는 행보로 해석됐고, 테슬라(TSLA)도 \$407.46(+4.04%)로 이틀째 강했다.

**10. 펜테어 (PNR) +12.80% — 3분기 매출 \$9.76억·조정 EPS \$1.18로 예상 상회, 4분기 매출 성장 전망 상향**
펜테어는 시가 \$61.01로 급등 출발해 고가 \$62.65(+13.46%)까지 오른 뒤 \$62.29(+\$7.07, +12.80%)로 마감해 S&P500 상승 상위에 올랐다. 수처리·수영장 장비 업체인 이 회사는 3분기 매출 \$9.76억, 조정 주당순이익 \$1.18로 시장 예상을 웃돌았다. 회사는 연간 조정 EPS 전망을 유지하면서 4분기 매출 증가율 전망을 올려 영업 회복 신호를 줬다. 같은 수처리 업종의 자일럼(XYL)이 3분기 EPS 미달과 가이던스 하향으로 \$92.86(−14.21%) 급락한 것과 대조적이었다.

- **바클레이즈(댄 레비) — 전날 테슬라 '비중 확대' 상향·목표주가 \$450 효과 이틀째.** 테슬라(TSLA) \$407.46(+4.04%).

**구루·시장 코멘트**
- **카일 로다(캐피털닷컴 선임 애널리스트)** — 앤트로픽 상장 신고서가 기술주 주도 반등을 이끌었지만 움직임 자체는 "사소하고 대체로 기술적"이다. 시장은 실적·중앙은행·미국 정치·지정학이 몰린 열흘이 2026년 연말 흐름을 가를 것으로 보고 포지션을 짜고 있다.
- **다니엘라 해손(시장 애널리스트)** — 연준 결정이 가장 큰 단기 변수이며, 높은 에너지 가격과 끈질긴 물가가 긴축을 더 길게 끌 수 있다. 설비투자만 늘고 이익 가이던스가 받쳐 주지 않으면 나스닥은 매도에 취약하다.
- **조던 리주토(감마로드 캐피털 파트너스 CIO)** — 소비자신뢰 반등이 의미 있는 순풍이 되려면 앞으로 몇 달 더 개선이 확인돼야 한다.
- **퍼거스 매코믹(컨퍼런스보드 선임 이코노미스트)** — 10월 반등은 현재·기대 경기 인식 개선 덕분이지만 소비자신뢰는 여전히 장기 하락 추세 안에 있다.
