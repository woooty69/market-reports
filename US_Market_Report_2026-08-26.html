### 2026년 8월 26일(수) 작성 · 미국 정규장: 8월 25일(화) 마감

---

## 🗓 시장 요약

**① 금리가 내리자 반도체가 돌아왔다 — SOX +1.50%, 엔비디아 8거래일 만에 반등**
전날 무너졌던 반도체가 하루 만에 되돌아왔다. **SOX가 +1.50%(11,594.10)**, 엔비디아가 **+2.19%(\$213.05)**로 **8거래일 만에 상승 전환**했다. AMD **+4.91%**, 마이크론 **+2.48%**, SK하이닉스 ADR **+2.68%**, TSMC **+1.78%**. 3대 지수도 일제히 올라 다우가 **3거래일 연속 상승(53,577.40)**했다. 동력은 하나다 — **미 장기 국채금리가 이틀 연속 내렸다.** 10년물이 **4.640%(−6.4bp)**, 30년물이 **5.17%대**로 지난주 5.3% 돌파 이후 확실히 물러섰다.

**② 금리를 끌어내린 것은 TGA + 부진한 지표 + 유가 급락, 세 가지다**
첫째, 재무부가 **1조 달러에 육박하는 TGA(재무부 일반계정)**를 장기 국채 바이백 재원으로 쓸 수 있다는 보도가 이틀째 장기물을 눌렀다. 둘째, 이날 나온 지표가 부진했다 — **CB 8월 소비자신뢰지수 89.4**(전월 −0.8p, 예상 90.2 하회), **신규주택 판매 −10%**. 향후 일자리·소득 전망이 나빠지며 미래 경기에 대한 우려가 커졌다. 셋째, 유가가 무너졌다. **WTI 10월물 \$82.36(−3.12%)**, 브렌트 **\$88.58(−3.89%)**로 이틀 연속 급락했다. **지표 부진이 채권 매수로, 유가 하락이 인플레 기대 완화로 이어지는 조합**이 반도체 밸류에이션에 숨통을 틔웠다.

**③ 그런데 소비주는 처참했다 — 딕스스포팅굿즈 −30.68%**
스포츠용품 유통업체 딕스스포팅굿즈가 **−30.68%** 폭락하며 **사상 최악 수준의 하루 낙폭**을 기록했다. 실적이 시장 기대에 못 미쳤고 전망까지 낮췄다. 타깃 **−3.83%**, 월마트 **−1.04%**도 약세였다. 지난주 월마트의 **미국 동일점포 +2.6%(6년 최저)**에서 시작된 소비 둔화 신호가 **개별 기업 실적으로 계속 확인되고 있다.** 브렛 켄웰 이토로 미국 투자분석가는 **기업 실적에서는 아직 소비 회복력이 확인된다면서도, 실제 소비가 감소하기 시작하면 증시가 이를 외면하기 어려울 것**이라고 지적했다. **금리 하락의 원인이 '경기 둔화'라면 그 자체가 다음 리스크**라는 뜻이다.

**④ 캐나다가 맞받았다 — 200억 달러 '달러 대 달러' 보복관세**
캐나다 정부가 미국의 **캐나다산 제품 50% 관세**에 맞서 **약 200억 달러 규모의 미국산 제품에 보복관세**를 부과한다고 발표했다. **'달러 대 달러'** 대응 방침이다. 미 중간선거를 겨냥한 '정밀 보복' 성격이라는 해석이 나온다. 전날 캐나다달러가 −0.61% 급락한 데 이어 무역 갈등이 실제 조치로 전환된 것으로, **관세 리스크가 협상 카드에서 실행 국면으로 넘어갔다.**

**⑤ 빅테크는 오히려 빠졌다 — 자금이 반도체로 회전했다**
반도체가 오른 날에 빅테크는 대부분 밀렸다. 알파벳 **−0.36%**, 아마존 **−0.39%**, 애플 **−0.14%**. 마이크로소프트만 **+0.9%** 올랐다. 테슬라는 **+0.37%**, 스페이스X는 **+2.2%** 상승했다. **지수 상승의 실체가 광범위한 매수가 아니라 전날 낙폭이 컸던 반도체로의 자금 회전**이었음을 보여준다. 오늘 밤(현지 8/26) 엔비디아 실적 전까지는 이 구도가 유지될 가능성이 높다.

**⑥ 한국은 4% 급락을 딛고 반전했다 — 코스피 +0.68%, 코스닥 +1.70%**
코스피가 장중 **4% 넘게 급락**했다가 **+0.68%(6,742.74)**로 상승 반전했다. 코스닥도 **+1.70%(827.15)**로 이틀 연속 올랐다. **전약후강**의 전형이다. SK하이닉스(000660)는 **+0.42%(1,678,000원)**로 강보합에 그쳤지만, 외국인은 **−123만 4,309주**로 **이틀 연속 대량 순매도**했다 — 기관(+19만 7,025주)과 개인(+38만 6,856주)이 받아냈다. 거래대금 **10.9조원**. 원/달러는 **1,386.1원(+3.7원)**으로 7거래일 만에 반등했다. 미국에서 SKHY가 **+2.68%** 오른 반면 국내는 +0.42%에 그쳐 **괴리율이 +28.5% → +31.8%로 3.3%p 다시 벌어졌다.**

> *어제 판정 복기 — **방향은 맞고 폭은 과했다.** '반도체 대형주 중심의 갭다운'을 기본으로 보되 '애플-중국 이슈는 과잉 반응 소지가 있어 장중 낙폭 축소 가능성을 열어둔다'고 단서를 달았다. 실제로 코스피는 **장중 −4%까지 밀렸다가 +0.68%로 반전**했다 — 갭다운도 맞았고 낙폭 축소 단서도 맞았다. 다만 **반전의 폭까지는 예상하지 못했다.** 이틀 연속 방향을 정확히 잡지 못한 뒤 폭을 단정하지 않은 것이 결과적으로 유효했다. 한편 **외국인이 이틀 연속 100만 주 안팎을 순매도하는데도 주가가 버틴 구조**는 주의해야 한다 — 기관·개인이 받아내는 형태는 오래 가기 어렵다.*

## 🏭 섹션 1. 업종별 흐름

**상승 ①  반도체 (이날 최강)**
SOX **+1.50%**, AMD **+4.91%**, SK하이닉스 ADR **+2.68%**, 마이크론 **+2.48%**, 엔비디아 **+2.19%**, TSMC **+1.78%**, 인텔 **+0.25%**. 전날 애플-중국 메모리 보도로 무너진 낙폭을 되돌렸다.

> 🇰🇷 [전달] 미 반도체 반등 + 야간선물 **+1.20%** 조합은 국내에 우호적. 다만 **오늘 밤 엔비디아 실적 전까지는 되돌림 성격**으로 보는 것이 안전하다. 외국인 이틀 연속 대량 순매도는 아직 해소되지 않았다.

**상승 ②  우주·항공**
스페이스X가 **+2.2%** 올랐다. 루이지애나에 차세대 우주발사 기지를 세워 **하루 30회 이상 발사**를 목표로 한다는 계획이 전해졌다.

**하락 ①  소비·유통 (이날 최약)**
딕스스포팅굿즈 **−30.68%**(사상 최악 하루 낙폭), 타깃 **−3.83%**, 월마트 **−1.04%**. CB 소비자신뢰지수 **89.4**로 예상(90.2)을 밑돌며 체감경기 악화가 확인됐다.

> 🇰🇷 [전달] 미국 소비 둔화는 국내 수출 소비재·유통에 부담. 다만 **유가 급락(WTI −3.12%)**은 항공·해운·화학의 원가 완화 요인이라 방향이 엇갈린다.

**하락 ②  빅테크**
알파벳 **−0.36%**, 아마존 **−0.39%**, 애플 **−0.14%**. 마이크로소프트만 +0.9%. 자금이 반도체로 이동한 결과다.

**하락 ③  에너지**
WTI **−3.12%(\$82.36)**, 브렌트 **−3.89%(\$88.58)**. 대이란 제재가 즉각적 공급 차질로 이어지지 않는다는 평가가 굳어지며 이틀 연속 급락했다.

**[판정]** **강보합 출발, 다만 오늘 밤 엔비디아 실적 전까지는 관망이 우세할 것으로 본다.**
**상방 근거**: ①**야간선물 +1.20%(1,076.40)**, ②SOX **+1.50%**·엔비디아 8거래일 만에 반등, ③**10년물 4.640%·30년물 5.17%대**로 금리 부담 완화, ④**WTI −3.12%**로 이틀 연속 급락, ⑤전일 코스피 전약후강 반전으로 심리 개선.
**하방 근거**: ①**외국인 이틀 연속 대량 순매도**(−91.3만 주 → −123.4만 주), ②괴리율 **+31.8%**로 다시 확대, ③원/달러 **1,386.1원**으로 7거래일 만에 반등(원화 약세 전환), ④미 소비 지표 부진(소비자신뢰 89.4, 신규주택 −10%), ⑤**오늘 밤 엔비디아 실적 + 7월 PCE** 대기.
**판정: 갭업 출발 후 상승폭 축소**를 기본으로 본다. 야간선물이 +1.20%로 우호적이지만 **한국시간 내일 새벽 엔비디아 실적이 나오기 전까지 적극적 매수가 붙기 어려운 구간**이다. 특히 **외국인이 이틀 연속 100만 주 안팎을 팔고 있다는 점**은 반등의 지속성을 제한한다. (무효화: 엔비디아 실적·가이던스 서프라이즈, 또는 외국인 순매수 전환)

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 엔비디아 (NVDA) +2.19% — \$213.05, 8거래일 만의 반등 그리고 오늘 밤 실적**
7거래일 연속 하락(2022년 이후 최장)을 끊고 **8거래일 만에 상승 전환**했다. 미 장기 국채금리가 이틀 연속 내리면서 고밸류 성장주 전반의 할인율 부담이 줄어든 것이 직접적 배경이다. 10년물은 **4.640%**, 30년물은 **5.17%대**까지 내려왔다.
관건은 **오늘(현지 8/26) 장 마감 후 발표되는 FY2027 2분기 실적**이다. 시장의 초점은 매출 서프라이즈가 아니라 **매출총이익률**에 있다. 블랙웰에서 차세대 루빈으로 넘어가는 초기 구간이라 원가가 상승하는데, 여기에 메모리 업체들이 **AI용 메모리 가격을 15% 이상 인상**할 수 있다고 통보한 사실까지 겹쳤다.
최근 AI 관련주의 고평가 논란이 확산된 만큼, 실적과 향후 전망은 **AI 투자 지속 여부와 기술주 전반의 향방을 가늠할 분수령**이 된다. 같은 날 발표되는 **7월 개인소비지출(PCE) 물가지수**까지 겹쳐 이번 주 변동성의 정점이 될 전망이다.

**2. 딕스스포팅굿즈 (DKS) −30.68% — 사상 최악의 하루, 실적과 전망을 동시에 놓쳤다**
스포츠용품 유통업체가 **30% 넘게 폭락**하며 **사상 최악 수준의 하루 낙폭**을 기록했다. 분기 실적이 시장 기대에 못 미쳤고 **연간 전망까지 하향**한 것이 원인이다. 지수가 일제히 오른 날에 나온 −30.68%라 충격이 더 컸다.
이 종목만의 문제가 아니다. 같은 날 타깃이 **−3.83%**, 월마트가 **−1.04%** 하락했다. 지난주 월마트가 **미국 동일점포 매출 +2.6%(2020년 4분기 이후 최저)**를 발표하며 **−9.15%** 폭락한 흐름의 연장선이다.
**CB 8월 소비자신뢰지수가 89.4**로 전월 대비 0.8포인트 내리며 시장 예상 **90.2**를 밑돈 것도 같은 방향을 가리킨다. 향후 일자리와 소득 전망이 악화되면서 미래 경기에 대한 소비자 우려가 커졌다. **소비 관련주는 이번 실적 시즌 내내 가장 취약한 축**이다.

**3. SK하이닉스 ADR (SKHY) +2.68% — \$159.53 (괴리율: +31.8%), 목표주가 상향과 노조 부결이 엇갈렸다**
전날 애플-중국 메모리 보도로 −4.92% 급락했던 ADR이 하루 만에 2.68% 반등했다. 니덤(Needham)의 톱 애널리스트가 **목표주가를 \$220으로 상향**했다는 소식이 힘을 보탰다.
반면 국내에서는 악재가 하나 나왔다. 로이터에 따르면 **SK하이닉스 노조원들이 임금 협약안을 투표에서 부결**시켰다. 앞서 회사는 성과급의 **60%를 자사주로 지급**하는 잠정 합의안을 마련했으나 조합원 동의를 얻지 못했다. 국내 주가는 **+0.42%(1,678,000원)** 강보합에 그쳤다.
수급은 여전히 불안하다. 외국인이 **−123만 4,309주**로 이틀 연속 대량 순매도했고, 기관(**+19만 7,025주**)과 개인(**+38만 6,856주**)이 받아냈다. 거래대금 **10.9조원**, 시가총액 **1,225조원**. ADR이 국내보다 크게 오르면서 괴리율은 **+28.5% → +31.8%로 3.3%p 재확대**됐다.

**4. 에이엠디 (AMD) +4.91% — 반도체 반등의 선두, 낙폭 과대 되돌림**
전날 −3.49%로 밀렸던 AMD가 이날 **4.91%** 급등하며 주요 반도체주 중 상승률 1위에 올랐다. 전날 하락이 개별 악재가 아니라 **섹터 일괄 디리스킹** 때문이었던 만큼, 금리가 내리자 가장 빠르게 되돌아왔다.
AMD는 메모리를 직접 생산하지 않아 애플-중국 메모리 이슈의 직접 대상이 아니다. 그럼에도 전날 3% 넘게 빠졌다가 이날 5% 가까이 오른 것은 **최근 반도체 매매가 펀더멘털이 아니라 포지션 조절에 좌우되고 있음**을 보여준다.
다만 **메모리 가격 15% 인상**이 현실화되면 AMD 같은 로직 설계 기업은 원가를 부담하는 쪽이다. 오늘 밤 엔비디아 실적에서 **메모리 원가가 마진에 어떻게 반영되는지**가 확인되면 AMD에도 직접 영향이 온다.

**5. 마이크론 (MU) +2.48% — 애플-중국 공포가 하루 만에 식었다**
전날 **−5.83%** 급락했던 미 최대 메모리 기업이 2.48% 반등했다. 전날 하락의 근거였던 **애플의 CXMT·YMTC 조달 허용 보도**에 대해 **과잉 반응이라는 반론**이 힘을 얻은 결과다.
근거는 두 가지다. 첫째, **CXMT는 저물량 Mac 1개 제품에만 인증**됐고 **LPDDR5X 수율이 낮아** 애플 물량을 의미 있게 대체하기 어렵다. 둘째, **하워드 러트닉 상무장관이 "트럼프 행정부는 애플의 중국산 메모리 사용에 찬성하지 않는다"**고 밝힌 바 있어 정책 신호가 정면으로 엇갈린다.
다만 근본 구도는 남아 있다. 9월 시진핑 주석의 방미가 예정돼 있고, 미중 긴장 완화 카드로 **중국산 메모리 허용이 다시 거론될 여지**가 있다. **하루짜리 되돌림인지 추세 복귀인지는 오늘 밤 엔비디아 실적이 가른다.**

**6. 타깃 (TGT) −3.83% — 소비 둔화가 유통 전반으로 번졌다**
대형 할인점 체인이 4% 가까이 하락했다. 같은 업종의 딕스스포팅굿즈가 **분기 실적을 놓치고 연간 전망까지 하향**하며 **−30.68%** 폭락한 것이 직접적 도화선이었고, CB 소비자신뢰지수 부진(**89.4**, 예상 90.2 하회)이 유통주 전반의 투자심리를 눌렀다.
타깃은 필수소비재 비중이 월마트보다 낮고 **재량소비 비중이 높아** 경기 둔화 국면에서 낙폭이 더 커지는 구조다. 이날 월마트(−1.04%)보다 3배 넘게 빠진 것이 그 차이를 보여준다.
신규주택 판매가 **−10%** 감소한 것도 내구재·홈퍼니싱 수요 둔화 우려로 이어졌다. **금리가 내리는데도 소비주가 빠지는 구도**는, 시장이 금리 하락의 원인을 '완화'가 아니라 '경기 둔화'로 읽고 있음을 시사한다.

**7. 월마트 (WMT) −1.04% — 6년 최저 동일점포의 여진**
지난주 2분기 **미국 동일점포 매출 +2.6%**(2020년 4분기 이후 최저)를 발표하며 **−9.15%** 폭락했던 월마트가 이날도 1% 넘게 밀렸다. 저가 매수가 붙지 않고 있다는 뜻이다.
회사는 고객이 높은 연료비 때문에 **"트레이드오프"**를 하고 있다고 설명했는데, 이날 유가가 **−3.12%(\$82.36)**로 급락한 것은 오히려 완화 요인이다. 그럼에도 주가가 반응하지 않은 것은 **소비 둔화가 유가만의 문제가 아니라는 인식**이 자리 잡았음을 보여준다.
이커머스 **+23%**, 광고 **+38%** 등 고마진 사업의 성장은 유지되고 있다. **오프라인 트래픽 둔화와 온라인 성장의 괴리**가 이 종목의 향후 밸류에이션을 결정할 변수다.

**8. 스페이스X (SPCX) +2.20% — 루이지애나에 하루 30회 발사 기지**
우주 발사 기업이 2.2% 상승했다. **루이지애나에 차세대 우주발사 기지를 건설**해 **하루 30회 이상 발사**를 목표로 한다는 계획이 전해진 것이 재료다. 현재 업계 최고 수준의 발사 빈도를 크게 웃도는 목표치다.
발사 빈도는 위성 인터넷·통신 사업의 확장 속도와 직결된다. 발사 단가를 낮추고 회전율을 높이는 것이 이 사업 모델의 핵심이라, **인프라 증설 계획 자체가 실적 가시성으로 읽히는 구조**다.
빅테크가 대부분 약세였던 날에 2% 넘게 오른 것은 **개별 재료가 섹터 흐름을 이겼다는 의미**다. 다만 이 종목은 상장 이후 공모가를 밑도는 구간을 겪었을 만큼 변동성이 크다.

**9. TSMC (TSM) +1.78% — 파운드리도 반도체 반등에 동참**
세계 최대 파운드리가 1.78% 올랐다. AMD(+4.91%), 마이크론(+2.48%), 엔비디아(+2.19%)에 비하면 상승폭이 작다. **파운드리는 메모리·로직보다 정책 헤드라인에 덜 민감한 구조**여서 전날 낙폭도 작았고 이날 반등폭도 제한적이었다.
TSMC는 엔비디아 블랙웰·루빈의 실질적 생산 주체다. 오늘 밤 엔비디아가 **루빈 출하 일정과 생산 확대 계획**을 어떻게 제시하느냐가 TSMC의 향후 가동률 전망으로 직결된다.
애플-중국 메모리 이슈는 TSMC에 직접 영향이 없다. 오히려 **애플이 중국 메모리를 쓰더라도 로직 칩은 TSMC가 만든다**는 점에서, 이 종목은 메모리 정책 리스크의 회피처 성격을 갖는다.

**10. 알파벳 (GOOGL) −0.36% — 빅테크에서 반도체로 자금이 옮겨갔다**
알파벳이 소폭 하락했다. 아마존 **−0.39%**, 애플 **−0.14%**도 함께 밀렸고 마이크로소프트만 **+0.9%** 올랐다. 개별 악재는 없었다.
원인은 자금 회전이다. 전날 낙폭이 컸던 반도체(SOX **+1.50%**)로 매수가 집중되면서 상대적으로 안정적이던 빅테크에서 자금이 빠져나갔다. **지수 상승의 폭이 넓지 않았다는 증거**다.
알파벳은 자체 TPU를 통해 AI 인프라 투자의 공급자이자 수요자 양쪽에 걸쳐 있다. 오늘 밤 엔비디아 실적에서 **하이퍼스케일러의 설비투자 계획**이 언급되면 알파벳을 포함한 빅테크 전반의 자본지출 부담 논의가 다시 불붙을 수 있다.

## 💬 섹션 3. 구루·기관 코멘트

- **브렛 켄웰(이토로 미국 투자분석가) — "실제 소비가 줄기 시작하면 증시가 외면하기 어렵다."** 기업 실적 발표에서는 아직 소비 회복력이 확인되고 있다면서도, 소비심리 악화 자체보다 **실제 소비지출이 둔화하는지가 더 중요**하다고 지적했다.
- **니덤(Needham) — SK하이닉스 ADR 목표주가 \$220으로 상향.** 톱 애널리스트가 목표가를 올리며 전날 −4.92% 급락에 대한 반론을 제시했다. 앞서 바클레이스도 **\$300 목표가**를 유지한 바 있다.
- **CNBC — "재무부는 1조 달러 TGA로 장기 국채금리에 영향을 줄 수 있다."** 이 보도 이후 장기물 금리에 이틀 연속 하방 압력이 이어졌다. 다만 바이백 확대가 장기금리를 **지속적으로** 낮출 수 있을지에 대해서는 시장에 여전히 의문이 남아 있다.
- **컨퍼런스보드 — 8월 소비자신뢰지수 89.4.** 전월보다 0.8포인트 하락, 시장 예상 90.2를 밑돌았다. **향후 일자리와 소득에 대한 전망 악화**가 지수 하락을 이끌었다.
- **캐나다 정부 — "달러 대 달러로 대응한다."** 미국의 캐나다산 제품 50% 관세에 맞서 **약 200억 달러 규모**의 미국산 제품에 보복관세를 부과한다고 발표했다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📊 오늘 밤(현지 8/26) 엔비디아 실적 + 7월 PCE — 이번 주의 정점:** 두 이벤트가 같은 날 겹친다. 엔비디아는 **매출총이익률**이, PCE는 **유가 상승분 반영 전 물가 수준**이 관건이다. 결과는 한국시간 8/27(목) 새벽에 확인된다.
- **⚠️ 금리 하락의 원인을 구분해야 한다:** 10년물 4.640%, 30년물 5.17%대. 하락 요인이 **TGA 바이백(수급)**이면 주식에 우호적이지만, **소비자신뢰 89.4·신규주택 −10%(경기 둔화)**가 원인이라면 다음 국면은 실적 하향이다. 이번 주 소비주 급락은 후자 쪽 신호다.
- **🇰🇷 오늘 국내 개장 — 외국인 수급이 관건:** 야간선물이 **+1.20%**로 우호적이지만, SK하이닉스에서 외국인이 **이틀 연속 100만 주 안팎을 순매도**했다. 기관·개인이 받아내는 구조는 지속되기 어렵다. **외국인 순매수 전환 여부**가 반등의 지속성을 가른다.
- **🛢 유가 이틀 연속 급락 — \$82선:** WTI **\$82.36(−3.12%)**, 브렌트 **\$88.58(−3.89%)**. 대이란 제재가 즉각적 공급 차질을 만들지 못한다는 평가가 굳어졌다. 국내 항공·해운·화학에는 원가 완화 요인이다.
- **🇰🇷 괴리율 +31.8% — 다시 확대:** 4거래일 연속 축소되던 흐름이 끊겼다. ADR이 +2.68% 오르는 동안 국내는 +0.42%에 그친 결과다. **미국이 먼저 반응하고 국내가 따라가는 패턴**이면 오늘 국내 반등폭이 커질 수 있다.
- **⚡ SK하이닉스 노조 임금협약 부결:** 성과급의 **60%를 자사주로 지급**하는 잠정 합의안이 조합원 투표에서 부결됐다. 재협상 과정에서 **인건비 부담 증가 가능성**이 실적 추정에 반영될 수 있다.
