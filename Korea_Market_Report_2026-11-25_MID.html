## 🗓 시장 요약

**① 코스피 6% 가까이 급락·4,700선 위태 — 외국인 1.3조원 매도, 개인 1.2조원 매수로 하루 만에 수급 역전**
코스피는 −3.9% 갭하락으로 출발해 개장 8분 만에 매도 사이드카가 발동됐고, 오전 내내 낙폭을 키워 4,709.05로 오전 저점 부근이다. 전날 8거래일 만에 순매수로 돌아섰던 외국인이 −13,106억원 순매도로 다시 돌아섰고 기관도 −1,526억원을 팔았다. 개인은 +12,169억원을 사들여 전날과 정반대 모습이다. 코스피200 선물(727.55, −6.50%)도 현물과 함께 밀렸다.

**② 반도체·대형주 — 삼성전자 17만원대·SK하이닉스 105만원 선, 전날 상승분 모두 반납**
삼성전자는 171,700원(−9.35%), SK하이닉스는 1,049,000원(−9.41%)으로 두 종목 거래대금이 3조 3,700억원을 넘었다. 전날 각각 +8%대 올랐던 폭을 하루 만에 지웠다. SK스퀘어(−11.05%)·삼성전기(−10.26%)·대덕전자(−12.56%)·코리아써키트(−14.10%) 등 기판·부품주와 주성엔지니어링(−10.41%)·원익IPS(−10.20%) 등 장비주도 동반 급락했다. 증권가는 엔비디아 SEC 회계 검토와 수출통제 불확실성이 남아 있어 신뢰 회복을 확인할 시간이 더 필요하다고 본다.

**③ 주도·약세 업종 — 화장품·보안·바이오가 '피난처', 반도체·전기장비·생명보험 급락**
화장품(+6.66%, 41종목 상승)은 블랙프라이데이 등 연말 성수기와 한중 관계 개선 기대에 에이피알·실리콘투·코스맥스·코스메카코리아가 10%대 급등했다. 국내외 잇단 해킹 사고에 안랩(+15.47%)·지니언스(+8.47%)가 뛰었고, 제약(+3.75%)·생물공학(+3.17%)도 알테오젠(+6.14%)·삼성바이오로직스(+3.80%)가 받쳤다. 반면 전날 급등했던 로봇·'깐부주'는 두산(−14.03%)이 급락했고, 삼성생명(−11.34%)·삼성물산(−9.23%) 등 삼성전자 지분가치에 연동된 종목도 크게 밀렸다.

**④ 환율·해외 변수 — 원/달러 1,343원대 보합, 닛케이 −3.30%·나스닥 선물 −1.25%**
원/달러는 1,343.70원(+1.20원)으로 외국인 대량 매도에도 거의 움직이지 않았다. 일본 닛케이225가 오전장 −3.30%로 밀렸고 소프트뱅크가 14% 폭락하는 등 아시아 반도체주 전반이 약하다. 항셍은 +0.98%로 버티고 있다. 미국 지수 선물은 S&P500 −0.60%, 나스닥100 −1.25%로 오늘 밤 미국장도 약세 출발을 예고하고 있다.

## 1. 업종별 흐름

**상승 업종** — 인터넷과카탈로그소매(+11.68%)가 1위였고, 화장품(+6.66%, 41종목 상승·19종목 하락)이 에이피알(+11.20%)·아모레퍼시픽(+5.72%)·코스맥스(+10.12%) 효과로 뒤를 이었다. 게임엔터테인먼트(+4.00%)·항공사(+3.89%, 9종목 모두 상승)·제약(+3.75%)·생물공학(+3.17%)·소프트웨어(+3.15%)는 반도체에서 빠져나온 자금이 옮겨 간 내수·방어 업종이다. 한진칼(+6.62%)과 LIG디펜스앤에어로스페이스(+6.42%)도 하락장에서 올랐다.

**하락 업종** — 생명보험(−10.40%)이 삼성생명(−11.34%) 탓에 가장 약했고, 반도체와반도체장비(−9.41%, 171종목 중 165종목 하락)·전자장비와기기(−8.81%)·전기장비(−6.98%)·복합기업(−6.47%)·석유와가스(−6.10%)가 뒤를 이었다. 효성중공업(−8.56%)·LS ELECTRIC(−6.23%) 등 AI 전력 인프라주와 기계(−4.61%) 업종의 로봇주도 전날 급등분을 되돌렸다.

**시장의 시선** — 오후장에서는 외국인 매도(−13,106억원)가 2조원 안팎으로 불어나는지, 개인 매수가 4,700선을 지켜내는지가 관건이다. 나스닥100 선물이 −1.25%로 약해 장 막판 반등 여력은 크지 않아 보인다. 화장품·보안주는 하루 10～20% 오른 종목이 많아 오후 차익 매물에 변동성이 커질 수 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 37종목

*① 12시 현재 시총 1,000억원 이상·+10% 이상 ★ 필수 편입 15종목(1～15번, 시총 큰 순) → ② 오전장 언론 최다 보도 22종목(16～37번).*

**1. ★ 에이피알 (278470) 293,000원 · 10조 9,694억원 · +11.20% — 블랙프라이데이 매출 기대에 목표가 50만원 상향, 거래대금 1,427억원**
에이피알은 오전 거래대금 1,427억원으로 코스피 상위권에 오르며 화장품주 랠리를 이끌었다. 오늘 아침 한 증권사가 미국 블랙프라이데이 매출 기대와 4분기 호실적 전망을 근거로 목표주가를 50만원으로 올리며 "주가 90% 상승 여력"을 제시했다. 12월 1일 병·의원용 집속초음파 리프팅 장비 '맥스트리' 출시도 예정돼 있고, 기존 커버 증권사는 목표주가 45만원·매수를 유지하고 있다. [리포트: 한국투자 2026-11-09](https://woooty69.github.io/hw-pdf-arch-041/%EC%97%90%EC%9D%B4%ED%94%BC%EC%95%8C%EF%BC%BB278470%EF%BC%BD_20261109_Korea%2BInvestment_4070007973.pdf) · [리포트: IBK 2026-11-04](https://woooty69.github.io/hw-pdf-arch-037/%EC%97%90%EC%9D%B4%ED%94%BC%EC%95%8C%EF%BC%BB278470%EF%BC%BD_20261104_IBK_197560.pdf) · [리포트: 유안타 2026-11-02](https://woooty69.github.io/hw-pdf-arch-036/%EC%97%90%EC%9D%B4%ED%94%BC%EC%95%8C%EF%BC%BB278470%EF%BC%BD_20261102_Yuanta_4100208091.pdf)

## 4. 일정·관전 포인트

**오늘 오후 국내** — 한국은행 11월 금융통화위원회를 앞두고 있다(SK증권은 기준금리 만장일치 25bp 인상·최종금리 3.50%를 전망). 정부가 22일 긴급 시장상황점검회의에서 착수한 증권시장안정펀드 가동 준비와 관련한 후속 발표가 나올지 주목한다. 다올투자증권 지분 매각 관련 공시·해명, 삼성 계열사 임원 인사 후속 발표도 오후에 나올 수 있다.

**오늘 밤 해외** — 미국은 26일(목) 추수감사절 휴장을 앞두고 있다. HPE 마진 경고 이후 AI 서버·반도체주가 추가로 밀리는지, 트럼프 정부의 16개국 관세 부과 관련 세부 내용이 나오는지가 변수다. 엔비디아 SEC 회계 검토 관련 후속 보도와 12월 1일 일정도 확인할 부분이다.

### 🇰🇷 오후장 관전 포인트

1. **외국인 매도 규모** — 오전 코스피 외국인 −13,106억원은 전날 순매수(+7,085억원 잠정)를 하루 만에 뒤집은 것이다. 오후 2조원 안팎으로 늘어나는지, 개인 매수(+12,169억원)가 4,700선을 지켜내는지가 관건이다.
2. **미국 지수 선물** — 나스닥100 선물 −1.25%, S&P500 선물 −0.60%로 약하다. 선물 낙폭이 더 커지면 장 막판 반도체 추가 하락 가능성이 있다.
3. **반도체 저가 매수 유입 여부** — 삼성전자 17만원·SK하이닉스 105만원 선에서 개인·연기금 매수가 들어오는지 본다. 증권가에서는 P/B·P/E가 5년 하위 5% 수준이라는 저평가 분석이 나왔다.
4. **화장품·보안주 과열** — 한국화장품(+19.50%)·안랩(+15.47%)·실리콘투(+14.92%) 등 하루 10～20% 오른 종목은 오후 차익 매물에 변동성이 커질 수 있다.
5. **금통위 경계** — 다가오는 11월 금통위에서 금리 인상이 예상되는 만큼 은행·보험 등 금리 민감 업종과 원/달러 흐름을 함께 본다.

      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
