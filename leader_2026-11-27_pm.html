# 미국→한국 선점 2026-11-27 (미국 2026-11-25 마감 반영)
*오후(한국 마감 반영) · 2호기 자동 생성 · 테마 79개 · 연결 종목 888개 분석*

## 오늘의 결론
- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 10개:** Advertising(격차 +19.8%p), Industrial Machinery/Components(격차 +16.1%p), 보험(격차 +12.9%p), Hospital/Nursing Management(격차 +11.8%p) — 이번 리포트의 핵심 선점 영역.
- **미국·한국 동반 강세(추세 추종):** 비만치료제, 게임, 건설·인프라·재건, 바이오텍·기술수출 — 눌림 시 매수 관점.
- **한국이 미국보다 앞서간 테마(과열 점검):** 중국 소비·관광 회복(-15.0%p), CDMO·바이오시밀러(-7.7%p), 탱커·가스선(-6.1%p)
- **이제 막 힘 붙는 조기 테마:** 에너지저장장치(조기 68), 중국 소비·관광 회복(조기 68), 유전체·유전자치료(조기 64) — 다음 주 선점 후보군.
- **오늘 우선순위 종목:** 녹십자(바이오텍·기술수출, 점수 100), 디앤디파마텍(비만치료제, 점수 98), 크래프톤(게임, 점수 95)
