*11:55 현재 장중 잠정치 — 종가 아님*

*전날 3.52% 급락해 5,533.77로 마친 코스피는 밤사이 메타(−7%)발 'AI 투자 회의론'에 나스닥이 2.60% 빠진 충격으로 5,403.17(−2.36%)에 갭하락 출발했고, 장 초반 5,305.98(−4.12%)까지 밀렸다. 솔리다임 미국 상장 철회 소식에 SK하이닉스가 한때 상승 전환하며 낙폭을 줄여 11시 55분 현재 5,426.22(−1.94%)다. 외국인이 8,521억원을 순매도했고 개인(+3,149억원)·기관(+5,215억원)이 받아냈다. SK하이닉스(+0.33%)는 보합권을 지켰지만 삼성전자(−2.21%)·삼성전기(−4.54%)·현대차(−4.64%)는 약하다. 3분기 깜짝 실적의 삼성E&A(+9.75%)와 실적 가이던스를 올린 삼성바이오로직스(+8.16%)가 버팀목이고, 제약(+2.50%)·건설(+1.32%)만 오른다. 전기장비(−6.14%)·전자장비와기기(−4.86%)·비철금속(−4.70%)·우주항공과국방(−4.57%)이 가장 약하다. 코스닥은 738.99(−3.29%)로 낙폭이 더 크다.*

## 🗓 시장 요약

**① 메타 쇼크에 4% 급락 출발, 솔리다임 상장 철회로 낙폭 절반 회복.** 코스피는 5,403.17로 출발해 장 초반 5,305.98(−4.12%)까지 밀렸다가 11시 55분 현재 5,426.22(−107.55p)로 낙폭을 1%대로 줄였다. 외국인은 8,521억원을 팔아 이틀 연속 대량 매도 중이고, 기관이 5,215억원·개인이 3,149억원을 사들였다. 코스피200 선물은 844.70(−1.44%)으로 현물보다 덜 빠져 저가 매수가 들어오는 모습이다.

**② SK하이닉스 상승 전환 시도, 삼성전자·기판주는 약세.** SK하이닉스는 1,227,000원(+0.33%)으로 거래대금 2조 3,146억원이며, 22일 밤 솔리다임 미국 상장 검토를 중단하면서 중복상장·지분 희석 우려가 걷혔다는 평가가 나왔다. 삼성전자는 209,750원(−2.21%), 거래대금 1조 7,348억원이다. 밤사이 램리서치(−10.8%)·마이크론(−6.3%)·엔비디아(−4.4%) 급락 여파로 주성엔지니어링(−5.73%)·리노공업(−6.23%)·심텍(−7.87%)·대덕전자(−6.00%) 등 장비·기판주 낙폭이 크다.

**③ 삼성E&A·삼성바이오 실적주만 강세, 전력기기·방산·조선 급락.** 삼성E&A는 3분기 영업이익 5,006억원(+183.6%)에 증권사 7곳이 목표가를 올리며 +9.75%, 삼성바이오로직스는 3분기 매출 1조 4,903억원(+19%)과 연간 가이던스 상향에 +8.16%다. 반면 AI 설비투자 축소 우려에 LS ELECTRIC(−6.63%)·HD현대일렉트릭(−6.84%)·산일전기(−8.68%) 등 전력기기가, 한화시스템(−7.98%)·한화오션(−5.77%) 등 방산·조선이 크게 빠졌다.

**④ 원/달러 1,324원대 안정, 아시아는 혼조·미국 선물은 반등.** 원/달러는 1,324.60원(−1.90원)으로 안정적이다. 미국 10년물 금리가 16.7bp 내린 4.955%로 안전자산 선호가 강했고, 닛케이225는 61,825.26(−1.72%)으로 오전장을 마쳤다. 항셍은 22,989.40(+0.24%)으로 보합권이며 나스닥100 선물이 +0.34%로 소폭 반등해 오후장 추가 급락 압력은 다소 줄었다.

## 1. 업종별 흐름

**상승 업종** — 제약(+2.50%)이 삼성바이오로직스(+8.16%)의 3분기 실적·가이던스 상향과 지투지바이오(+10.19%)의 빅파마 계약 기대에 힘입어 가장 강하지만, 상승 26·하락 130으로 대형주 쏠림이 뚜렷하다. 건설(+1.32%)은 삼성E&A(+9.75%) 효과가 컸고 GS건설(−0.17%)·대우건설(−0.48%)은 보합권이다. 부동산(−0.26%)·식품(−0.46%)·음료(−0.48%) 등 내수 방어 업종은 낙폭이 작다.

**하락 업종** — 전기장비(−6.14%, 상승 1/하락 31)는 LS ELECTRIC(−6.63%)·효성중공업(−5.15%)·HD현대일렉트릭(−6.84%)이, 전자장비와기기(−4.86%)는 삼성전기(−4.54%)·LG이노텍(−5.82%)·대덕전자(−6.00%)가 끌어내렸다. 비철금속(−4.70%)·우주항공과국방(−4.57%)·기계(−4.51%)·석유와가스(−4.38%)·조선(−4.28%)·화학(−4.25%)·은행(−3.90%)도 4% 안팎 급락했다.

**시장의 시선** — 오후장은 외국인 매도 속도와 코스피 5,400선 지지가 관건이다. SK하이닉스가 상승 전환을 지켜 반도체 투톱 동반 반등으로 이어지는지, 나스닥 선물 반등이 이어지는지가 낙폭 축소의 조건이다. 다음 주 한국·미국 3분기 GDP와 10월 FOMC, 국내 대형주 실적 발표를 앞두고 실적주 중심의 차별화가 이어질 가능성이 크다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 36종목

**1. SK하이닉스 (000660) 1,227,000원 · 896조 3,141억원 · +0.33% — 솔리다임 미국 상장 철회, 급락장 속 한때 상승 전환**
SK하이닉스는 22일 밤 자회사 솔리다임의 미국 상장 검토를 전격 중단했고, 중복상장 할인·지분 희석 우려가 완화됐다는 평가에 4% 급락 출발한 시장에서 한때 상승 전환했다. 11시 55분 현재 1,227,000원(+0.33%)으로 거래대금 2조 3,146억원으로 시장 1위다. 한국기업거버넌스포럼은 상장 중단을 환영했고, DS투자증권은 7월 나스닥에 상장한 ADR과 본주의 괴리율이 46.8%까지 벌어져 방치하기 어렵다고 지적했다. 회사는 솔리다임 성장을 위한 별도 투자재원 확보 방안을 다시 짜야 한다. [리포트: Hanwha 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261020_Hanwha_2653114.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_196671.pdf) · [리포트: Hana 2026-10-13](https://woooty69.github.io/hw-pdf-arch-025/SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4%EF%BC%BB000660%EF%BC%BD_20261013_Hana_1137565.pdf)

**2. 삼성전자 (005930) 209,750원 · 1,226조 2,569억원 · −2.21% — 메타발 AI 투자 회의론에 2%대 하락, 테일러 2나노 후속 투자**
삼성전자는 209,750원(−2.21%)으로 거래대금 1조 7,348억원이다. 밤사이 메타가 잉여현금흐름 적자 전환과 내년 설비투자 가이던스 미제시로 7% 급락하고 마이크론(−6.3%)·엔비디아(−4.4%)가 동반 하락한 여파로 외국인 매도가 이어졌다. 회사는 미국 테일러 1공장에 후속 설비투자를 진행해 2나노 생산거점을 완성하는 수순에 들어갔고, 오늘은 고 이건희 선대회장 6주기다. 우선주 삼성전자우도 −2.63%다. [리포트: KB 2026-10-22](https://woooty69.github.io/hw-pdf-arch-033/%EC%9A%B0%EB%A0%A4%EC%9D%98%20%EC%A0%95%EC%A0%90%20%ED%86%B5%EA%B3%BC%2C%20W%EC%9E%90%20%EB%B0%98%EB%93%B1%EC%97%90%20%EC%A3%BC%EB%AA%A9%EF%BC%BB005930%EF%BC%BD_20261022_KB_4015227430.pdf) · [리포트: KB 2026-10-20](https://woooty69.github.io/hw-pdf-arch-027/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261020_KB_4010450923.pdf) · [리포트: KB 2026-10-15](https://woooty69.github.io/hw-pdf-arch-026/%EC%82%BC%EC%84%B1%EC%A0%84%EC%9E%90%EF%BC%BB005930%EF%BC%BD_20261015_KB_1138464.pdf)

**3. 삼성E&A (028050) 60,800원 · 11조 9,168억원 · +9.75% — 3분기 영업이익 5,006억원 어닝 서프라이즈, 목표가 줄상향**
삼성E&A는 3분기 매출 2조 9,105억원(+45.8%), 영업이익 5,006억원(+183.6%)으로 컨센서스(약 2,520억원)를 98% 웃돌았고, 6,900억원 규모 자사주 소각도 발표했다. 사우디 얀부 발전 프로젝트 충당금 환입(약 1,000억원)과 정산이익이 반영됐으며, 오늘 한화(84,000원)·유진(82,000원)·LS(76,000원)·키움(75,000원)·대신(75,000원)·교보(71,000원) 등이 목표가를 올렸다. 급락장 속 60,800원(+9.75%)으로 거래대금 5,335억원을 기록하며 건설 업종을 홀로 끌어올리고 있다. [리포트: iM 2026-10-23](https://woooty69.github.io/hw-pdf-arch-033/%EC%82%BC%EC%84%B1E%26A%EF%BC%BB028050%EF%BC%BD_20261023_iM_4098114991.pdf) · [리포트: Yuanta 2026-10-23](https://woooty69.github.io/hw-pdf-arch-033/%EC%82%BC%EC%84%B1E%26A%EF%BC%BB028050%EF%BC%BD_20261023_Yuanta_4100207934.pdf) · [리포트: Shinhan 2026-10-23](https://woooty69.github.io/hw-pdf-arch-033/%EC%82%BC%EC%84%B1E%26A%EF%BC%BB028050%EF%BC%BD_20261023_Shinhan_4030354454.pdf)

**4. 삼성전기 (009150) 1,093,000원 · 81조 6,402억원 · −4.54% — AI 투자 우려에 기판·부품주 동반 급락**

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
