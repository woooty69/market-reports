# 📊 한국증시 데일리 리포트 (저녁판)
### 2026년 10월 13일(화) 18시 작성 · 기준일: 10월 13일(화) 정규장 (저녁판)

> 10월 13일 정규장 마감과 장 마감 후 18시대까지 나온 뉴스·공시·증권사 리포트를 정리했습니다. 중국 CXMT의 차세대 D램 출시 예고와 외국인 4조5,768억원 순매도가 겹친 '검은 화요일'로, 매도 사이드카가 35거래일 만에 발동됐습니다.

## 주요 지수·자산

|---|---|---|
| 코스피 | 6,035.35 | **−348.89 (−5.46%)** |

*간밤 필라델피아 반도체 지수가 2.67% 내린 데 이어 중국 CXMT가 '4F² 구조' 차세대 D램 출시를 예고했다는 소식이 겹치며 코스피는 6,186.08(−3.10%)로 출발해 장중 5,911.11까지 밀렸고 6,035.35(−5.46%)로 마감했다. 외국인이 4조5,768억원을 순매도해 6거래일 연속 매도했고, 개인(+2조2,913억원)과 기관(+1조6,867억원)이 받아냈다. SK하이닉스(−8.16%)·삼성전자(−5.39%)·SK스퀘어(−10.77%)·삼성전기(−6.59%)가 지수를 끌어내리며 코스피200(−6.25%) 낙폭이 지수보다 컸고, 업종에서는 화장품(−6.69%)·반도체(−6.34%)·생명과학도구(−5.39%)가 가장 약했다. 반면 LG에너지솔루션(+3.02%)은 ESS 실적 기대로, 주성엔지니어링(+4.35%)·피에스케이홀딩스(+8.44%)·두산테스나(+8.97%) 등 코스닥 소부장은 외국인 매수로 버텼다. 코스닥은 802.91까지 밀렸다가 837.03(−1.43%)으로 낙폭을 줄였고, 원/달러는 1,341.60원으로 5.60원 올랐다. 야간선물은 개장 직후 955.00(+1.08%)로 반등 출발했다.*

## 🗓 시장 요약

**① 코스피 6,035 '검은 화요일'… 외국인 4.6조원 투매, 매도 사이드카**
코스피는 348.89포인트(−5.46%) 내린 6,035.35로 마감해 7,000선 부근에서 5거래일 만에 약 1,000포인트가 빠졌다. 장중 코스피200 선물 급락으로 35거래일 만에 매도 사이드카가 발동됐고 지수는 한때 5,911.11까지 밀렸다. 외국인은 하루 4조5,768억원을 팔아 올해 누적 순매도가 200조원을 넘었다는 집계가 나왔고, 개인이 2조2,913억원을 사들였다. 코스피200(−6.25%)이 지수보다 더 빠져 대형주 중심의 매도였다.

**② 반도체: CXMT '4F² D램' 쇼크에 하이닉스 −8%·삼성 −5%**
SK하이닉스(−8.16%)는 거래대금 7조8,366억원, 삼성전자(−5.39%)는 5조8,154억원으로 시장 1·2위였다. 중국 창신메모리(CXMT)가 삼성·하이닉스가 개발 중인 차세대 4F² 구조 D램을 먼저 제품화하겠다고 밝히자 '중국 추격' 우려가 커졌고, 간밤 미국 반도체주 약세(SOX −2.67%)도 겹쳤다. 전문가들은 HBM 격차는 2～3년이고 양산성은 미지수라고 평가했지만, 증권가가 SK하이닉스 3분기 영업이익을 77조9,000억～79조원으로 추정하는 실적 기대도 수급을 막지 못했다. 장 마감 뒤 삼성전자는 AMD와 AI 메모리 용량 확장 기술을 공개했고, 이재용 회장이 홍라희 관장으로부터 삼성전자 주식 2조6,000억원어치를 증여받는다고 공시했다.

**③ 버틴 업종: 2차전지·엔터·금융·코스닥 소부장**
LG에너지솔루션(+3.02%)은 3분기 영업이익 7,560억원 서프라이즈와 엘앤에프(+2.81%)와의 조단위 LFP 양극재 계약 보도에 올랐고, SK이노베이션(+2.03%)은 SK어스온의 베트남 원유 생산 개시가 더해졌다. 방송·엔터(+1.63%)는 하이브(+3.51%), 기타금융·카드(+1.4～1.6%)는 메리츠금융지주(+1.31%)가 강했다. 코스닥 반도체 소부장은 외국인이 코스피에서 판 돈 일부로 담으며 주성엔지니어링(+4.35%)·피에스케이홀딩스(+8.44%)·두산테스나(+8.97%)·티에스이(+7.14%)가 올랐다. 신한금융의 인수 소식이 전해진 롯데손해보험(+7.30%), 호남 반도체 테마 서산(+29.88%)·AI 보안주 안랩(+10.13%)도 급등했다.

**④ 약세 업종: 화장품·반도체·바이오·지주**
화장품(−6.69%)은 에이피알(−18.32%)이 원화 강세·물류비 부담으로 3분기 영업이익이 기대치를 밑돌 것이라는 리포트와 목표가 줄하향에 상장 후 최대 낙폭을 보이며 한국콜마(−6.97%)·달바글로벌(−7.63%)까지 끌어내렸다. 반도체(−6.34%)는 대형주와 한미반도체(−6.24%)가, 생명과학도구(−5.39%)·생물공학(−3.91%)은 올릭스(−13.94%)·파마리서치(−8.08%)·펩트론(−6.70%)이 약했다. 복합기업(−3.62%)은 SK(−6.67%)·삼성물산(−4.29%), 생명보험(−4.44%)은 삼성생명(−4.67%)이 삼성전자 지분가치 하락에 동반 약세였다.

**⑤ 환율·금리·외부 변수**
원/달러 고시 환율은 1,341.60원으로 5.60원 올라 외국인 대규모 매도에도 상승 폭은 제한적이었다. 원화 강세가 이어진 3분기 실적 시즌에서 현대차(−2.50%)·에이피알처럼 환율 탓에 이익 추정치가 내려가는 수출주가 늘고 있다. 예멘 후티의 사우디 본토 공격이 사흘째 이어지는 등 중동 긴장도 외국인 이탈 요인으로 거론됐다. 이번 주 미국 9월 CPI(14일)와 ASML·TSMC 실적(14～15일)이 반도체 투자심리의 분기점이다.

**⑥ 코스닥 837.03(−1.43%), 장중 802.91에서 낙폭 축소**
코스닥은 823.69로 출발해 한때 802.91까지 밀렸지만 외국인(+1,374억원)·기관(+438억원) 순매수로 837.03까지 회복했다. 주성엔지니어링(+4.35%)·원익IPS(+0.61%)·리노공업(+3.20%)·HPSP(+3.11%)·피에스케이(+6.50%) 등 장비·부품주가 반등을 주도한 반면 알테오젠(−3.67%)·에코프로비엠(−2.60%)·올릭스(−13.94%)는 약했다. 시총 미달 기업 상장폐지 유예 소식에 형지I&C·뉴인텍·예선테크 등 초소형주 상한가가 이어졌다.

## 1. 업종별 흐름

**상승 업종** — 무역회사와판매업체(+1.74%)·방송과엔터테인먼트(+1.63%)·기타금융(+1.59%)·건강관리기술(+1.48%)·전기제품(+1.43%)·카드(+1.43%)·소프트웨어(+0.87%)·해운사(+0.51%)·전기유틸리티(+0.46%)만 올랐다. 전기제품은 LG에너지솔루션(+3.02%)이 3분기 영업이익 7,560억원(컨센서스 3,640억원)으로 ESS 수익성을 확인시키며 이끌었고, 엘앤에프(+2.81%)는 LG엔솔과의 첫 LFP 양극재 계약 보도가 더해졌다. 방송·엔터는 하이브(+3.51%), 소프트웨어는 AI 해킹 우려 속 보안 ETF가 한 달 22.61% 오른 가운데 안랩(+10.13%)이 상승을 주도했다. 금융은 신한금융의 롯데손보 인수(6,933억원) 소식에 롯데손해보험(+7.30%), 메리츠금융지주(+1.31%)가 강했다.

**하락 업종** — 화장품(−6.69%)·반도체와반도체장비(−6.34%)·생명과학도구(−5.39%)·인터넷과카탈로그소매(−5.14%)·전자장비와기기(−4.72%)·생명보험(−4.44%)·생물공학(−3.91%)·복합기업(−3.62%)·도로와철도운송(−3.20%)·에너지장비(−2.89%)·통신장비(−2.87%)·전자제품(−2.85%)이 약했다. 화장품은 에이피알(−18.32%)·한국콜마(−6.97%)·달바글로벌(−7.63%)·실리콘투(−6.30%), 반도체는 SK하이닉스(−8.16%)·삼성전자(−5.39%)·한미반도체(−6.24%)가 낙폭을 키웠다. 전자장비는 삼성전기(−6.59%)·LG이노텍(−4.69%)·이수페타시스(−2.48%), 복합기업은 SK(−6.67%)·SK스퀘어(−10.77%)·삼성물산(−4.29%) 등 반도체 지분가치 연동 지주사가 약했다. 바이오는 올릭스(−13.94%)가 뉴질랜드 임상 2a상 반려에 급락했다.

**시장의 시선** — 반도체 대형주 실적은 사상 최대인데도 '중국 추격'과 'AI 투자 과열' 논란에 외국인이 6거래일 연속 매도하며 지수는 7월 폭락장 수준으로 되돌아갔다. 외국인이 코스피 대형주를 팔면서도 코스닥 소부장과 ETF는 사들인 점은 메모리 수요 자체보다 밸류에이션·쏠림을 문제 삼는 매도라는 해석을 낳는다. 2차전지는 ESS 실적·LFP 국산화로 주도 업종 교체 기대가 나오고, 화장품은 환율·물류비에 따른 3분기 눈높이 하향이 이어질 수 있다. 야간선물은 개장 직후 955.00(+1.08%)로 반등 출발했다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 45종목

야스는 18.62% 올랐지만 거래대금은 93억원으로 크지 않았고, 최근 96시간 관련 보도는 없었다. 지난달 LG디스플레이가 차세대 '플립(FLiPP)' 기술용 증착기 공급사로 야스와 선익시스템을 논의 중이라는 보도가 있었고, 이날 상승도 OLED 장비 수주 기대가 재부각된 것으로 해석된다. 최대주주 지분이 7월 반대매매로 42.58%에서 18%대로 줄어 경영권 방어 우려가 남아 있다. 최신 커버 리포트(KIRS, 9월)는 8세대 이상 증착기·증착원 양산 경험과 중국향 수주를 투자 키워드로 꼽았다. [리포트: KIRS 2026-09-30](https://woooty69.github.io/hw-pdf-arch-022/%EC%95%BC%EC%8A%A4%EF%BC%BB255440%EF%BC%BD_20260930_KIRS_196371.pdf) · [리포트: Stunning Value Research 2026-09-14](https://woooty69.github.io/hw-pdf-arch-019/%EC%95%BC%EC%8A%A4%EF%BC%BB255440%EF%BC%BD_20260914_Stunning%2BValue%2BResearch_1130926.pdf)

**43. HLB바이오스텝 (278650) 5,950원 · 1,037억원 · +12.05% — 50억원 규모 AI 기반 동물대체시험 국책과제 참여**
HLB바이오스텝은 12.05% 올라 거래대금 390억원을 기록했다. 산업통상부가 추진하고 한국산업기술기획평가원(KEIT)이 전문기관으로 참여하는 바이오산업기술개발사업의 AI 기반 동물대체시험법(NAMs) 국책과제에 참여한다고 13일 밝혔으며 과제 규모는 총 50억원이다. 비임상 CRO 사업에 AI·대체시험 역량을 더하는 계기로 평가됐다. 시가총액은 1,037억원으로 ★ 기준을 간신히 넘겼다. 증권사 커버 리포트 없음.

**44. 네오티스 (085910) 21,700원 · 2,993억원 · +11.40% — 현대차증권 목표가 3.1만원으로 24% 상향, 마이크로비트 쇼티지 수혜**
네오티스는 11.40% 올라 거래대금 103억원을 기록했다. 현대차증권은 PCB용 마이크로비트 공급 부족과 고부가 기판 비중 확대에 따른 수혜가 이어질 것이라며 투자의견 매수를 유지하고 목표주가를 기존 대비 24% 높은 3만1,000원으로 제시했다. 지난 9월 리포트에서는 글로벌 피어가 12개월 선행 PER 40～50배를 적용받는다며 쇼티지가 향후 몇 년간 지속될 것으로 봤다. 권상훈 대표가 9월 자사주를 추가 매입하는 등 책임경영 행보도 이어졌다. [리포트: Hyundai Motor 2026-09-02](https://woooty69.github.io/hw-pdf-arch-017/%EB%84%A4%EC%98%A4%ED%8B%B0%EC%8A%A4%EF%BC%BB085910%EF%BC%BD_20260902_Hyundai%2BMotor_1128300.pdf) · [리포트: MERITZ 2026-08-27](https://woooty69.github.io/hw-pdf-arch-016/%EB%84%A4%EC%98%A4%ED%8B%B0%EC%8A%A4%EF%BC%BB085910%EF%BC%BD_20260827_MERITZ_1126766.pdf) · [리포트: Hanyang 2026-08-12](https://woooty69.github.io/hw-pdf-arch-015/%EB%84%A4%EC%98%A4%ED%8B%B0%EC%8A%A4%EF%BC%BB085910%EF%BC%BD_20260812_Hanyang_1122681.pdf)

**45. 에스티아이 (039440) 27,500원 · 4,264억원 · +10.44% — 급락장 속 반도체 인프라 장비 강세, CCSS 수주 모멘텀 기대**
에스티아이는 10.44% 올라 거래대금 122억원을 기록했다. 반도체 공정용 케미컬 공급 장치(CCSS)가 매출의 약 90%를 차지하며, 삼성전자·SK하이닉스·마이크론 등의 팹 인프라 투자 확대 수혜주로 꼽힌다. 외국인이 코스닥 소부장을 사들인 데다 호남 반도체 클러스터 등 신규 팹 착공 기대가 클린룸 선행 장비인 CCSS에 우호적으로 작용했다. 최신 커버 리포트(삼성증권, 4월)는 하반기로 갈수록 수주 모멘텀이 강화되면 리레이팅이 가능하다고 평가했다. [리포트: Samsung 2026-04-20](https://woooty69.github.io/hw-pdf-arch-004/%EC%97%90%EC%8A%A4%ED%8B%B0%EC%95%84%EC%9D%B4%EF%BC%BB039440%EF%BC%BD_20260420_Samsung_1089463.pdf)

### 🇰🇷 내일 개장 관전 포인트
1. **외국인 매도 7일째 이어질까** — 외국인은 이날 4조5,768억원을 팔아 6거래일 연속 순매도했고 매도 사이드카까지 발동됐다. 야간선물이 개장 직후 955.00(+1.08%)로 반등 출발한 만큼 기술적 반등이 나올지, 오늘 밤 미국 반도체주가 CXMT 쇼크를 얼마나 흡수하는지가 첫 신호다.
2. **'중국 추격' 공포 vs 사상 최대 실적** — 삼성전자 3분기 영업이익 107조4,000억원, SK하이닉스 3분기 77조9,000억～79조원 추정에도 시장은 CXMT의 4F² D램 양산 가능성과 AI 투자 지속성을 의심하고 있다. 14일 미국 CPI와 14～15일 ASML·TSMC 실적이 분기점이다.
3. **코스닥 소부장·2차전지로의 순환매** — 외국인은 코스피 대형주를 팔면서 코스닥(+1,374억원) 소부장은 샀고, LG에너지솔루션(+3.02%)·엘앤에프(+2.81%)는 ESS·LFP 재료로 역주행했다. 이 흐름이 반도체 대형주 반등 시에도 이어질지 지켜볼 구간이다.
4. **3분기 프리뷰 하향 종목의 변동성** — 에이피알(−18.32%)처럼 컨센서스 하회 전망 리포트가 나오면 주가가 크게 흔들리고 있다. 원화 강세로 현대차·화장품·IT부품의 추가 하향이 나오는지 주목된다.
5. **지배구조·M&A 이벤트** — 이재용 회장의 삼성전자 지분 증여(2조6,000억원), 신한금융의 롯데손보 인수(6,933억원), 삼성바이오의 폴리펩타이드 공개매수 등 장 마감 뒤 나온 이벤트가 관련 종목 시가에 반영될 전망이다. 호남 반도체 테마(서산·금호전기)는 이상 과열 경고가 나와 급등락에 유의해야 한다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
