## 🗓 시장 요약

**① 나스닥 25,164.32(−1.07%)·S&P500 7,541.40(−0.51%)·다우 51,983.98(+0.41%) — 유가 급락에 장 초반 반등했다가 기술주 매도로 되밀려**
나스닥은 **25,164.32(−272.68, −1.07%)**, S&P500은 **7,541.40(−38.67, −0.51%)**로 사흘 연속 내렸고, 다우만 **51,983.98(+213.67, +0.41%)**로 올랐다. 장 초반에는 유가 급락과 아마존 반등에 나스닥이 1.3%까지 올랐지만, 오후 들어 하드웨어·반도체 중심으로 기술 업종(XLK)이 2% 넘게 밀리며 상승분을 모두 반납했다. 나스닥100은 27,989.82(−1.39%)로 10월 6일 고점 대비 약 10% 아래로 내려왔고, VIX는 21.25(+9.42%)로 올라섰다. 러셀2000은 2,805.88(−0.21%)로 보합권이었다.

**② 2년물 4.59%(+3.0bp)·10년물 4.91%(−3.0bp)·30년물 5.28%(−3.0bp) — ISM 제조업 55.5로 호조, 12월 인상 확률 76%**
10월 ISM 제조업지수는 55.5로 9월(54.5)보다 1포인트 올라 예상(54.5)을 웃돌았고 10개월 연속 확장 국면을 이어갔다. 생산지수는 59.0으로 2021년 11월 이후 가장 높았지만, 지불가격지수는 75.2로 9월(77.9)보다 내려왔다. 반면 9월 건설지출은 −1.9%로 예상(+0.4%)을 크게 밑돌았다. CME 페드워치 기준 12월 25bp 인상 확률은 76%로, 미 재무부 기준 2년물은 **4.59%(+3.0bp)**로 오른 반면 유가 급락에 기대인플레이션이 꺾이며 10년물은 **4.91%(−3.0bp)**, 30년물은 **5.28%(−3.0bp)**로 내렸다.

**③ WTI \$96.01(−7.79%)·브렌트 \$104.12(−8.21%) — 이란·카타르 협상과 트럼프 '외교 해결' 의지에 급락, 금 +1%대**
WTI 12월물은 장중 \$95.15까지 밀린 끝에 **\$96.01(−\$8.11, −7.79%)**로 마감했고, 브렌트 1월물도 **\$104.12(−\$9.31, −8.21%)**로 떨어졌다. 이란과 카타르 당국자가 미국·이스라엘과의 분쟁을 끝내기 위한 제안을 논의했다는 보도에 이어, 마코 루비오 국무장관이 트럼프 대통령이 분쟁을 "외교적으로" 해결하길 원한다고 밝혔다. 이란 최고지도자가 정부에 평화협상 권한을 일부 부여했다는 보도도 낙폭을 키웠다. 금은 \$3,955.70(+1.46%) 안팎으로 올랐고, 비트코인은 \$76,772(−1.29%) 안팎이었다.

**④ AI·반도체 — SOX 10,328.33(−3.37%)·루멘텀 −18.59%·마벨 −12.72%·오라클 −8.85%·인텔 −8.80%**

인수합병과 실적이 종목별 명암을 갈랐다. 인도 애드테크 기업 아플(Affle)에 주당 \$11.70에 팔리기로 한 페리온(PERI)은 **\$11.41(+31.15%)**, 3분기 매출이 10% 늘고 연간 전망을 올린 아이덱스(IDXX)는 **\$671.64(+21.85%)**, 매출 23% 성장의 템퍼스AI(TEM)는 **\$78.48(+8.67%)**로 올랐다. 유가 급락 수혜로 유나이티드항공(UAL)은 **\$109.24(+4.80%)**, 객실당 매출 전망을 올린 메리어트(MAR)는 **\$416.30(+4.26%)**였다. 반대로 매출이 1% 줄어든 체크포인트(CHKP)는 **\$141.50(−6.98%)**, 엑슨모빌(XOM)은 **\$179.67(−4.05%)**, 옥시덴털(OXY)은 **\$60.72(−5.13%)**로 내렸다. 아마존(AMZN)은 **\$245.63(+2.20%)**로 반등했다. 장 마감 뒤에는 팔란티어가 3분기 매출 \$23.1억(+96%)과 연간 가이던스 상향을 발표했고, 애플도 장 마감 뒤 회계 4분기 실적 발표 일정이 잡혀 있었다.

**⑥ 🇰🇷 SOX −3.37%·SK하이닉스 ADR \$147.71(−1.01%)·코스피200 야간선물 883.40(−3.84%) — 광통신·AI 인프라주 충격, 유가 급락은 완충재**

루멘텀은 시가 \$802.55에서 출발해 저가 \$679.00(−19.23%)까지 밀린 뒤 \$684.40(−\$156.30, −18.59%)로 마감했다. 마벨이 루멘텀 1주당 마벨 4.5주를 주는 전액 주식교환 방식으로 기업가치 \$1,150억에 인수하기로 했으며, 10월 28일 주가 기준으로는 주당 약 \$1,132(프리미엄 23.9%)였다. 그러나 인수 대금이 마벨 주식이라 마벨 주가가 떨어지면서 제안 가치가 주당 약 \$771 수준으로 줄었고, 거래 종결 시점도 2028년 상반기로 멀어 주가가 제안 가치보다 크게 낮게 형성됐다. 루멘텀의 회계 1분기 매출은 \$12.6억이었다.

마벨은 시가 \$191.55에서 출발해 저가 \$168.52(−14.20%)까지 밀린 뒤 \$171.41(−\$24.99, −12.72%)로 마감했다. 회사는 AI 데이터센터 연결이 구리에서 광으로 넘어가는 흐름에 대응하기 위해 루멘텀을 기업가치 \$1,150억에 인수한다고 발표했지만, 합병 뒤 기존 마벨 주주의 지분은 약 67%로 줄어든다. 거래는 양사 주주총회와 규제 승인을 거쳐 2028년 상반기에 끝날 예정이어서 장기간의 불확실성도 부담으로 작용했다. 마벨 주가는 10월 28일 종가 \$251.65에서 사흘 만에 30% 넘게 떨어졌다.

**3. 오라클 (ORCL) −8.85% — AI 인프라 자금 위해 보통주 \$100억·회사채 \$100억 발행 계획 공시**
오라클은 시가 \$125.88에서 출발해 저가 \$118.43(−9.37%)까지 밀린 뒤 \$119.10(−\$11.57, −8.85%)로 마감했다. 회사는 AI 인프라 구축 자금을 마련하기 위해 보통주 \$100억과 회사채 \$100억, 모두 \$200억을 조달하겠다는 계획을 공시했다. 지난주 발표한 설비투자 확대 계획의 후속 조치로, AI 데이터센터 투자 부담이 결국 주주 희석과 부채 증가로 이어진다는 우려를 키웠다. 대형 기술주의 대규모 증자는 AI 투자 사이클의 자금 조달 여력에 대한 의문을 다시 불러일으켰다.

**4. 아마존 (AMZN) +2.20% — 3분기 AWS 성장률 39% 재평가, 저가 매수 유입**
아마존은 시가 \$243.09에서 출발해 고가 \$253.81(+5.60%)까지 올랐다가 \$245.63(+\$5.28, +2.20%)로 상승폭을 줄였다. 지난주 3분기 주당순이익 \$1.89가 예상(\$1.96)에 못 미치고 최근 12개월 잉여현금흐름이 −\$424억을 기록해 급락했지만, 약 5년 만에 가장 빠른 AWS 성장률 39%를 다시 평가하는 매수세가 들어왔다. 모건스탠리 등에서 저가 매수 의견이 나온 것도 반등을 도왔다. 다만 오후 들어 기술주 전반이 밀리면서 장중 상승분의 절반 이상을 반납했다.

**5. 아이덱스 래버러토리스 (IDXX) +21.85% — 3분기 매출 \$12.1억(+10%), 2026년 매출·EPS 전망 상향**
아이덱스는 시가 \$625.00에서 출발해 고가 \$673.19(+22.13%)까지 오른 뒤 \$671.64(+\$120.43, +21.85%)로 마감했다. 동물 진단 전문 기업인 아이덱스는 3분기 매출이 \$12.1억으로 10% 늘었다고 발표했다. 회사는 2026년 연간 매출과 주당순이익 전망을 모두 올렸고, 반려동물 병원 방문 둔화 우려 속에서도 진단 장비·소모품 수요가 견조하다는 점을 확인시켰다. 이날 상승률은 S&P500 종목 가운데 최상위권이었다.

**6. 템퍼스AI (TEM) +8.67% — 3분기 매출 \$4.12억(+23%), 2026년 매출 전망 상향**
템퍼스AI는 시가 \$74.43에서 출발해 고가 \$83.42(+15.51%)까지 올랐다가 \$78.48(+\$6.26, +8.67%)로 마감했다. AI 기반 정밀의료 기업인 템퍼스는 3분기 매출이 \$4.115억으로 23% 늘었다고 발표했다. 회사는 2026년 연간 매출 전망도 올려 유전체 검사와 데이터 사업의 성장세가 이어지고 있음을 보여줬다. 장중 한때 −2.66%까지 밀리는 등 변동성이 컸지만 실적 기대가 우위를 점했다.

**7. 유나이티드항공 (UAL) +4.80% — WTI \$96.01(−7.79%) 급락에 연료비 부담 완화 기대**
유나이티드항공은 시가 \$108.96에서 출발해 고가 \$112.01(+7.45%)까지 오른 뒤 \$109.24(+\$5.00, +4.80%)로 마감했다. 이란 평화협상 기대에 WTI가 \$96.01로 7.79% 급락하며 \$100선 아래로 내려오자, 비용의 큰 부분을 차지하는 항공유 부담이 줄어들 것이라는 기대가 커졌다. 앞서 발표한 3분기 실적과 긍정적인 향후 가이던스도 매수세를 뒷받침했다. 아메리칸항공과 델타항공도 장중 4% 안팎 올랐다.

**8. 메리어트 (MAR) +4.26% — 3분기 조정 EPS \$3.02·매출 \$70.05억 예상 상회, 연간 RevPAR 성장 전망 4.5~5%로 상향**
메리어트는 시가 \$425.00에서 출발해 고가 \$433.30(+8.51%)까지 올랐다가 \$416.30(+\$17.00, +4.26%)로 마감했다. 3분기 조정 주당순이익은 \$3.02로 예상(\$2.84)을 웃돌았고, 매출도 \$70.05억으로 8% 늘어 예상(\$69.3억)을 넘었으며 전 세계 객실당 매출(RevPAR)은 6.5% 증가했다. 회사는 2026년 전 세계 RevPAR 성장 전망을 기존 3~3.5%에서 4.5~5%로 올렸다. 앤서니 카푸아노 CEO는 "3분기의 뛰어난 실적은 사업 전반의 지속적인 모멘텀을 반영한다"고 말했다.

**9. 페리온 네트워크 (PERI) +31.15% — 아플(Affle)이 주당 \$11.70 현금 인수, 프리미엄 34.5%**
페리온은 시가 \$11.42로 급등 출발한 뒤 \$11.41(+\$2.71, +31.15%)로 마감했다. 인도 애드테크 기업 아플(Affle)이 페리온을 주당 \$11.70 현금으로 인수하기로 합의했으며, 이는 직전 금요일 종가 대비 34.5% 프리미엄으로 지분 가치는 약 \$4.2억이다. 페리온은 12월 11일까지 더 나은 인수 제안을 찾는 '고숍' 기간을 두며, 거래는 2027년 초 마무리될 예정이다. 주가는 인수가보다 약 2.5% 낮은 수준에서 거래돼 거래 종결 가능성을 높게 보는 분위기였다.

**10. 체크포인트 소프트웨어 (CHKP) −6.98% — 3분기 매출 \$6.7억(−1%), CEO "회복이 예상보다 오래 걸린다"**
체크포인트는 시가 \$148.10에서 출발해 저가 \$140.86(−7.40%)까지 밀린 뒤 \$141.50(−\$10.61, −6.98%)로 마감했다. 3분기 매출은 \$6.7억으로 1년 전보다 1% 줄었다. 나다브 자프리르 CEO는 "회복이 예상보다 오래 걸리고 있다"고 말해 성장 재개 시점에 대한 기대를 낮췄다. 주가는 이날 저점 부근에서 마감해 실적 실망 매물이 장 막판까지 이어졌다.
