## 🗓 시장 요약

**① 정부, 증안펀드 18년 만에 가동 채비·자사주 매수 한도 3개월 완화 — '블랙먼데이' 차단 나섰다**
코스피가 금요일 5% 넘게 빠지며 4,800선대로 내려가자 정부는 주말 사이 증안펀드 가동 준비에 착수하고, 상장사가 자사주를 더 많이 사들일 수 있도록 매수 한도를 3개월간 완화하기로 했다. 불법 공매도에 대해서는 3개월간 특별 감시와 엄정 대응을 예고했다. 대만이 공매도 제한을 강화한 것과 비교되며 한국도 공매도 금지까지 꺼낼지 관심이 쏠렸지만, 이번 대책은 감시 강화에 머물렀다. 증권가 일부는 "코스피 4,800이 깨지면 4,300까지 열어 둬야 한다"며 추가 하락 가능성을 경고했다.

**② 엔비디아 리스크가 정책 문제로: 베선트 "중국향 칩 판매 해명하라" — 미중 반도체 갈등 재점화 우려**
스콧 베선트 미 재무장관은 엔비디아의 중국향 칩 판매와 밀수 의혹에 대해 내부 규정 준수 여부가 핵심이라며 해명을 요구했고, 이는 젠슨 황 전 CEO 개인사와는 별개라고 선을 그었다. 엔비디아 회계 처리 논란과 AMD의 중국 판매 의혹까지 겹치며 금요일 미국 증시는 'AI 악재에만 반응하는' 장세였다. 시장에서는 엔비디아 사태가 반도체·희토류를 둘러싼 미중 무역 갈등을 다시 키울 수 있다고 본다.

**③ 반도체: 손정의 'SK하이닉스 1조달러 인수 검토' 보도 vs 3분기 배당성향 급등**
손정의 회장이 SK하이닉스를 1조달러에 인수하는 방안을 검토했다가 멈췄다는 보도가 이어졌고, SK 측은 "아는 바 없다"고 했다. 실현 가능성과 별개로 해외 대형 자본이 한국 메모리의 가치를 어떻게 보는지 보여 주는 사례로 회자됐다. 주주환원 쪽에서는 삼성전자의 3분기 말 연결 현금배당성향이 18.0%로 상반기(4.1%)의 약 4.4배, SK하이닉스는 8.4%로 상반기(0.4%)의 21배가 됐다는 집계가 나왔다. 삼성전자는 3분기에 총 30조원(주당 4,601원), SK하이닉스는 주당 2만원(약 14조원) 배당을 결의했다.

**④ 주도 업종 관련: 은행·배당주 '피난처' 부각, K라면·한한령 소비주 이어 K콘텐츠 ETF 강세**
은행주는 금요일 급락장에서도 신한지주(+0.70%)·하나금융지주(0.00%)가 버텼고, 주말에는 "연 8% 수익 배당주로 증시 피난처"라는 기사가 이어졌다. 하나은행의 외국환거래가 처음으로 1조달러를 넘었고 5대 은행은 올해 부실채권 5.8조원을 정리했다. K라면 수출은 10개월 만에 지난해 연간 실적을 넘어 연 20억달러를 바라보고, 한한령 해제 기대 속 K콘텐츠 ETF가 수익률 상위권을 차지했다.

**⑤ 금리·환율: 한은 이번 주 금리 인상 유력, 미 PCE·PMI 대기**
경제 전문가 80%가 내년에도 3% 넘는 성장을 예상한 가운데, 한국은행이 이번 달 기준금리를 올리고 내년에 추가 인상해 최종 3.5%에 이를 것이라는 전망과 내년 상반기 3.75%까지 열어 둬야 한다는 의견이 나왔다. 정부가 국고채 발행을 10조원 줄여도 장기 금리는 4% 안팎에 머물 것이라는 분석도 있다. 미국은 이번 주 10월 PCE 물가와 11월 잠정 PMI가 나오고, 26일 추수감사절 휴장·27일 조기 폐장이 이어진다. 원/달러는 금요일 아침 고시 기준 1,346.5원이다.

**⑥ 코스닥·오늘 변수: 소부장 투매 뒤 첫 거래일, 오버행·CB 부담 종목 주의**
코스닥은 금요일 반도체 소부장이 두 자릿수로 밀리며 5.71% 내렸다. 주말 동안 현대엘리베이터가 현대무벡스 지분 5.8%(650만주)를 약 1,026억원에 팔기로 하면서 오버행 우려가 나왔고, 주가가 반토막 난 에코프로비엠은 기존 재무적투자자(FI)의 풋옵션에 대응해 전환사채(CB)로 돌려막기에 나섰다는 보도가 나왔다. 시가총액 300억원 미달 기업 퇴출 기준을 둘러싼 논란도 이어졌다.

## 1. 업종별 흐름

**상승 업종** — 휴장 중 뉴스 기준 호재 업종은 은행·증권과 음식료·소비재다. 정부의 증안펀드 가동 준비와 자사주 매수 한도 완화는 수급 측면에서 증권·지주사에 우호적이고, 은행은 마지막 거래일 업종 등락률 +0.19%로 하락장에서 버틴 데다 하나은행 외국환거래 1조달러 돌파, 기업은행의 6억달러 차입 조기상환 등 체력 관련 기사가 이어졌다. K라면 수출은 10개월 만에 지난해 연간 실적을 넘어 연 20억달러를 넘볼 기세이고, 한미약품의 비만약 '에페'는 초도 물량 100억원어치가 다 팔리며 건강보험 적용 논의까지 나왔다. 배터리는 하나증권이 LG에너지솔루션의 2028년 생산능력 가이던스 40% 상향과 10월 미국 순수전기차 판매 19% 증가를 근거로 '저가 매수 기회'라고 봤다.

**하락 업종** — 휴장 중 뉴스 기준 악재 업종은 반도체·기판·장비와 통신·유틸리티다. 금요일 밤 필라델피아 반도체 지수 −10.73%에 이어 미국 재무장관의 엔비디아 해명 요구로 미중 반도체 갈등 재점화 우려가 커졌고, 메모리에 이어 부품 원자재 가격까지 올라 삼성·LG 계열 부품사의 원가 부담이 커졌다는 분석이 나왔다. 한국전력은 고객 등 152만명의 주민·계좌·카드번호가 유출된 사실이 드러났고, 정유 4사는 첫 손실보전액을 정부에 제출하며 이의신청·소송 가능성이 거론됐다. 자동차는 중국산 테슬라 등 전기차 수입이 늘며 대중 자동차 무역적자가 6조원에 육박해 사상 최대라는 집계가 부담이다.

**시장의 시선** — 오늘 주목할 업종은 ① 반도체 대형주·소부장(야간선물 −7% 반영 정도와 증안펀드 기대의 힘겨루기), ② 증권·은행·배당주(정부 대책의 직접 수혜와 '피난처' 수요), ③ 바이오·음식료 등 AI와 무관한 업종이다. 정책 쪽에서는 산업부가 수출지원 기여금에서 상선·원전을 빼야 한다고 주장한 점이 HMM·두산에너빌리티에 우호적이다. 반대로 EU의 빅테크 디지털세 제안에 트럼프 대통령이 100% 관세를 경고한 일과 미국의 카드 금리 상한 10% 추진은 플랫폼·금융 업종의 해외 변수로 남는다.

*한국·미국·중국·EU·일본 정부 정책 중 업종에 영향을 줄 새 사안·단계 변화(미 연방관보·EU 관보·각국 부처·국회·입법예고·중국 상무부/국무원·일본 경제산업성 등 + 뉴스, Claude 분류).*

- **[한국] 정부 — 증안펀드 가동 준비 착수·자사주 매수 한도 3개월 완화** (단계: 시행, 🆕 최초)

불법 공매도에 대해 3개월간 집중 감시하고 위법 행위에 엄정 대응한다. 공매도 금지가 아니라 감시 강화라는 점에서 수급 효과는 제한적일 수 있으며, 대만처럼 공매도 제한을 강화하라는 요구가 남아 있다. 공매도 잔고가 많은 반도체 소부장·이차전지 종목의 숏커버링 기대가 붙을 수 있지만 확인된 사실은 아니다.
- **[한국] 산업부 — 수출지원 기여금에서 상선·원전 제외 주장** (단계: 제안, 🆕 최초)
수출지원 기여금 부과 대상에서 상선과 원전을 빼야 한다는 입장을 밝혔다. 받아들여지면 HMM (011200) 22,150원(비정규 시간외 21,900원) · 20조 8,927억원과 두산에너빌리티 (034020) 40,750원(비정규 NXT 40,250원) · 26조 1,029억원 등 해운·원전 기자재 업종의 부담이 줄어든다. 아직 부처 입장 단계로 최종 결정은 아니다.
- **[미국] 원자력규제위원회(NRC) — 에너지부(DOE) 승인 원자로 설계의 심사 경로 지침** (단계: 시행, 🆕 최초)
DOE가 이미 승인한 원자로 설계에 대해 NRC 인허가 신청 경로를 정리한 임시 지침을 관보에 냈다. 소형모듈원전(SMR) 인허가 기간 단축 기대로 원전·SMR 기자재 업종에 우호적이다. 국내 수혜 경로는 두산에너빌리티 (034020) 40,750원(비정규 NXT 40,250원) · 26조 1,029억원 등 기자재 공급망이지만, 개별 프로젝트 일정에 바로 연결되는 조치는 아니다.
- **[EU] 집행위 — 빅테크 디지털세 제안, 트럼프 "관세 100%" 경고** (단계: 제안, 🆕 최초)
EU가 빅테크 대상 디지털세를 제안하자 트럼프 대통령이 100% 관세로 보복하겠다고 경고했다. 인터넷 플랫폼·광고 업종에 부정적이고, 미-EU 무역 갈등이 커지면 글로벌 위험 회피 심리를 키울 수 있다. 법안 확정 전 단계라 철회·수정 가능성이 크다.
- **[미국] 의회 — 신용카드 금리 상한 22%→10% 초당적 추진** (단계: 제안, 🆕 최초)
트럼프 대통령과 민주당이 카드 금리 상한을 연 10%로 낮추는 방안에 손을 잡았다는 보도다. 미국 카드·소비자금융사 수익성에 직접 악재로, 국내 금융주에는 직접 영향보다 글로벌 금융주 투자 심리 경로로 작용한다. 입법 통과까지는 거리가 있다.

그동안 대동 관련 보도는 북미 딜러대회·로봇 부품 합작 등 사업 확장 위주였고(지난 30일 기사 66건, 같은 종류 사건 60일 0건), 재무 부담이 구체적 수치로 다뤄진 것은 처음이다. 3분기 영업손실은 394억원으로 전년 동기 5억원 손실에서 크게 늘었고, 3분기 누적 이자비용 437억원 대비 영업이익은 79억원에 그쳐 이자보상배율이 1.19배에서 0.18배로 떨어졌다. 채무보증 잔액은 2,442억원으로 연결자기자본의 37.8%이며, 60억원 사모 CB에는 1년 안에 제주대동 지분 80% 이상을 팔아 대금을 차입금 상환에 쓰지 못하면 만기상환율이 113.8%에서 126.0%로 오르는 특약이 붙었다. 방향은 악재이며, 매각 가격과 시기에 따라 재무 개선 폭이 달라진다는 점이 핵심 변수다.

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
