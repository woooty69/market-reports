## 🗓 시장 요약

**반도체가 무너졌다.** SOX가 **−4.98%(11,992.50)**로 급락하며 12,000선을 내줬다. 5거래일 연속 오르며 12,621까지 갔던 지수가 하루에 628.50포인트를 반납한 것이다. 나스닥도 **−1.33%(26,289.71)**로 밀렸고, 낙폭의 대부분이 반도체에서 나왔다. 다만 다우는 −0.22%로 상대적으로 선방했다 — **지수 하락이라기보다 특정 섹터의 붕괴**에 가까웠다.

직접적 방아쇠는 **글로벌 국채금리 급등**이었다. 일본 10년물이 **+0.99%(2.952%)**, 독일 10년물이 **+1.34%(3.2610%)**로 뛰면서 위험자산 전반의 할인율 부담이 커졌다. 미국 30년물도 장중 급등했다(마감은 −0.47%). 여기에 중동 정세 불안이 겹쳤다 — 트럼프 대통령은 호르무즈 해협이 개방돼 있다고 주장했지만 WTI는 **+0.52%(\$84.94)**, 브렌트는 **\$91.02**로 91달러대를 유지했다.

**그러나 진짜 원인은 과열이었다고 보는 편이 타당하다.** 직전 5거래일 동안 마이크론이 \$911 → \$1,012(+11.1%), 샌디스크가 \$1,271 → \$1,787(+40.6%)까지 올랐다. 이날 되돌림은 정확히 그 종목들에서 가장 컸다 — 샌디스크 **−9.01%**, 시게이트 **−9.19%**, 테라다인 **−8.77%**, 마벨 **−7.81%**, 마이크론 **−6.94%**, 인텔 **−6.58%**. AI 인프라도 예외가 아니어서 **코어위브가 −12.10%**로 이날 최대 낙폭을 기록했다.

**금과 은도 함께 빠졌다** — 금 −1.88%, 은 **−4.24%**, 구리 −2.43%. 주식·귀금속·산업금속이 동시에 하락한 것은 **개별 자산의 악재라기보다 레버리지 청산 성격의 유동성 이벤트**를 시사한다. VIX는 +4.28%(15.84)로 올랐지만 공포 수준은 아니었다.

한국 쪽은 타격이 직접적이다. **SKHY가 −9.20%(\$155.62)**로 폭락했고 **코스피200 야간선물도 −4.29%(1,031.95)**로 무너졌다. 야간 거래량은 **48,501계약**으로 평소(약 29,000)의 1.6배였다 — 실질적인 매도가 나왔다는 뜻이다. 다만 국내 SK하이닉스(000660)가 8/18 정규장에서 **+1.03%(1,662,000원)**로 버틴 덕에 **괴리율은 +47.4% → +32.4%로 15%p 급축소**됐다.

> *어제 판정 복기 — **절반만 맞았다.** '상방 우세, 갭업 출발'로 봤고 실제 코스피200 선물은 시가 1,119.80(+1.9%)으로 갭업해 장중 **1,144.90(+4.2%)**까지 올랐다. 그러나 **종가는 1,078.25(−1.88%)로 반전**했다. 갭업 방향은 맞혔으나 **장중 반전을 예상하지 못했다.** 당시 경계 요인으로 적었던 '유가·금리 부담'과 '한 주 +15.68% 뒤 차익 실현 여지'가 하루 만에 현실화된 셈이다. SK하이닉스(000660)가 +1.03%로 버틴 것은 판정과 부합했다.*

## 📰 헤드라인 3선

**1. SOX −4.98%, 12,000선 붕괴 — 5거래일 랠리가 하루에 되돌려졌다**
필라델피아 반도체지수가 **628.50포인트(−4.98%)** 급락한 **11,992.50**에 마감했다. 시가 12,166.1로 갭다운 출발해 장중 11,828.5까지 밀렸다. 직전 5거래일 상승분(12,417 → 12,621)을 훌쩍 넘어 되돌린 것으로, **8/11 수준(11,993.90)으로 원위치**했다. 나스닥 낙폭 −1.33% 중 상당 부분이 이 섹터에서 나왔다.

**2. 글로벌 국채금리 급등 — 일본 10년물 2.952%, 독일 3.261%**
일본 10년물이 **+0.99%(2.952%)**, 독일 10년물이 **+1.34%(3.2610%)**로 뛰며 글로벌 금리가 동반 상승했다. 미국 30년물도 장중 급등했다. 각국 재정 부담과 중동발 인플레 우려가 겹친 결과로, **고밸류 성장주의 할인율 부담**이 커지며 반도체·AI 인프라 매도를 촉발했다. 다만 미 2년물(4.173%)·10년물(4.705%)은 마감 기준 소폭 하락해 미국 내 금리는 상대적으로 안정적이었다.

**3. 코어위브 −12.10% — AI 인프라도 무너졌다**
불과 6거래일 전 실적 호조로 +19.29% 급등했던 코어위브가 **−12.10%(\$93.17)**로 이날 최대 낙폭을 기록했다. 거래량 3,659만 주. 루멘텀 −9.91%, 자빌 −8.45%까지 겹치며 **AI 인프라·광통신 밸류체인 전반이 동반 붕괴**했다. 지난주 CNBC가 지적한 **"AI 붐이 점점 더 레버리지에 의존하고 있다"**는 경고가 현실화되는 국면으로 읽힌다.

## 🏭 섹션 1. 업종별 흐름

**하락 ①  메모리·스토리지 (최대 낙폭)**
샌디스크 **−9.01%(\$1,625.78)**, 시게이트 **−9.19%(\$903.39)**, 마이크론 **−6.94%(\$941.51)**. 마이크론은 전날 돌파했던 **\$1,000선을 하루 만에 내줬다.** 직전 5거래일 급등폭이 가장 컸던 종목들이 정확히 가장 크게 빠졌다.

> 🇰🇷 [전달] **오늘 국내 개장에 가장 직접적인 악재**다. SKHY −9.20%, 야간선물 −4.29%. SK하이닉스(000660)·삼성전자(005930)의 갭다운 출발이 불가피하다.

**하락 ②  AI 인프라·네트워킹**
코어위브 **−12.10%**, 루멘텀 −9.91%, 자빌 −8.45%. 수주잔고와 실적으로 재평가받던 종목들이 일제히 무너졌다. **부채 기반 성장에 대한 의구심**이 금리 급등과 맞물린 결과다.

**하락 ③  반도체 장비·설계**
테라다인 **−8.77%(\$404.29)**, 마벨 **−7.81%(\$216.03)**, 인텔 **−6.58%(\$96.68)**. 인텔은 전날 회복했던 \$100선을 다시 내줬고 거래량은 9,998만 주에 달했다. 전날 +5.54% 반등했던 어플라이드머티리얼즈도 되밀렸다.

> 🇰🇷 [전달] 국내 반도체 소부장(원익IPS·주성엔지니어링 등)에 이틀 만에 다시 부담. **장비주는 이번 주 내내 하루 단위로 방향이 뒤집히는 중**이라 추세 판단을 유보할 국면이다.

**상승 ①  에너지 인프라**
타가리소시스(TRGP)가 **+7.13%(\$297.77)**로 이날 상승률 1위였다. 유가가 브렌트 91달러대를 유지하면서 중류(미드스트림) 인프라가 강세를 보였다.

> 🇰🇷 [전달] 유가 고착은 국내 정유(S-Oil·GS)엔 마진 재료, 항공·화학·해운엔 원가 부담. **원/달러 1,414원대 강세**는 부담을 일부 상쇄한다.

**상승 ②  방어주·소비재**
인슐렛 +5.96%, 얼타뷰티 +4.71%, 몬스터베버리지 +4.13%. **애플이 +1.45%(\$310.03)**로 대형주 중 홀로 올라 다우 낙폭을 −0.22%로 막았다.

**상승 ③  소프트웨어 일부**
인튜이트 +4.41%, 매치그룹 +3.95%, 고대디 +3.71%. 반도체에서 빠져나온 자금이 일부 소프트웨어로 이동한 흔적이다.

**[판정]** **급락 출발이 불가피하다.** ①SOX **−4.98%**, ②SKHY **−9.20%**, ③야간선물 **−4.29%**(거래량 평소의 1.6배로 실매도 확인), ④코어위브 −12.10% 등 AI 인프라 동반 붕괴. 이 조합에서 국내 반도체가 버틸 근거는 약하다.
다만 **낙폭이 미국만큼 크지 않을 가능성**을 함께 본다. 근거는 셋이다. 첫째, **괴리율이 +47.4% → +32.4%로 15%p 축소**됐다 — ADR이 국내보다 훨씬 많이 빠졌다는 뜻이므로 국내 조정 여력은 그만큼 작다. 둘째, 8/18 국내장은 이미 **선물 기준 고점 대비 −5.8%(1,144.90 → 1,078.25)를 소화**했다. 셋째, **외국인이 4거래일 연속 순매수**(8/18 +44.1만 주)를 유지하며 지분율을 51.13%까지 올렸다.
**판정: 갭다운 후 낙폭 축소 시도**를 기본 시나리오로 본다. 관건은 개장 초 외국인 수급이 순매도로 전환하는지다. (무효화: 외국인 순매도 대량 전환, 또는 오늘 밤 미국 반도체 추가 급락 시)

## 🔍 섹션 2. 이슈 종목 10선

**1. SK하이닉스 ADR (SKHY) −9.20% — \$155.62, 괴리율 +32.4%로 15%p 급축소**
시가 **\$161.78**로 갭다운 출발해 장중 **\$154.53**까지 밀렸다가 \$155.62에 마감했다. 고가는 \$163.88로, **하루 종일 반등다운 반등이 없었다.** 거래량 2,232만 주, 시간외에서도 −0.01%(\$155.60)로 추가 하락 압력은 없었다.
이 낙폭은 **8/13(+7.29%)·8/17(+3.04%) 상승분을 모두 반납**하고 8/12 수준(\$154.43)으로 되돌아간 것이다. 상승 랠리 6거래일 중 마지막 이틀은 계속 장중 고점에서 밀린 마감이었는데(8/17 \$178.43 → \$171.38), 그 경고가 하루 만에 현실화됐다.
국내 SK하이닉스(000660)는 8/18 정규장에서 **+1.03%(1,662,000원)**로 오히려 올랐다. 외국인이 **+44만 1,470주**를 순매수해 4거래일 연속 매수를 이어갔고(지분율 51.07% → **51.13%**), 기관은 −7만 3,791주, 개인은 −35만 5,906주 순매도였다. 거래대금은 **15.2조원**으로 급증했다.
그 결과 **괴리율이 +47.4% → +32.4%로 15%p 급축소**됐다. **ADR이 일방적으로 빠져 좁혀진 형태**이므로, 오늘 국내 조정이 나오더라도 그 폭은 ADR보다 작을 개연성이 높다.

**2. 코어위브 (CRWV) −12.10% — \$93.17, 이날 최대 낙폭**
불과 6거래일 전(8/12) 실적 호조로 +19.29% 급등하며 \$107.74까지 올랐던 종목이 **\$93.17로 무너졌다.** 거래량 3,659만 주.
수주잔고 1,040억 달러라는 숫자는 변하지 않았지만, **그 수주를 이행할 자금이 부채로 조달된다**는 점이 부각됐다. 지난주 CNBC가 "AI 인프라 붐이 점점 더 레버리지에 의존하고 추적하기 어려워진다"고 지적한 대로다.
글로벌 금리가 급등한 날 가장 크게 빠졌다는 사실이 그 논리를 뒷받침한다. **AI 인프라는 금리 민감 자산**이라는 인식이 자리 잡는 국면이다.

**3. 샌디스크 (SNDK) −9.01% — \$1,625.78, 4일 랠리의 종료**
8/11 \$1,271 → 8/17 \$1,787로 **4거래일 만에 +40.6%** 올랐던 종목이 하루에 −9.01% 빠졌다. 거래량 1,787만 주로 거래대금 상위 2위.
장기 마진 80% 전망이라는 재료 자체가 부정된 것은 아니다. 다만 **4거래일 +40%라는 속도가 정당화되기 어렵다**는 판단이 우세해졌다.
그럼에도 8/11 대비로는 여전히 **+27.9%** 높은 수준이다. 랠리가 끝났다기보다 **속도 조절 국면**으로 보는 편이 타당하다.

**4. 시게이트 (STX) −9.19% — \$903.39, HDD도 함께 무너졌다**
전 거래일 +5.65%로 \$973.44까지 올랐던 종목이 9% 넘게 빠지며 **\$900선을 위협**했다. 거래량 449만 주.
샌디스크·웨스턴디지털과 함께 스토리지 3인방이 동반 급락했다. **섹터 차원의 수급 유입이 섹터 차원의 유출로 뒤집힌 전형적 패턴**이다.
AI 데이터센터의 저장 수요라는 구조적 논리는 유지되지만, **단기 포지션이 한쪽으로 쏠려 있었다는 사실**이 이날 확인됐다.

**5. 마이크론 (MU) −6.94% — \$941.51, \$1,000선 하루 만에 반납**
전날 사상 처음 \$1,000을 넘었던(\$1,012.03) 종목이 하루 만에 **\$941.51로 되밀렸다.** 거래량 3,220만 주로 이날 최다.
'\$1,000 돌파'라는 상징적 이벤트 직후 차익 실현이 집중되는 전형적 흐름이다. 트럼프 행정부의 중국산 메모리 배제 압박이라는 정책 재료는 유효하지만, **정책 재료는 이미 가격에 반영됐다**는 판단이 앞섰다.
그럼에도 8/11(\$911) 대비로는 +3.3% 높다. **랠리 이전 수준까지는 되돌리지 않았다.**

**6. 인텔 (INTC) −6.58% — \$96.68, \$100선 재이탈**
거래량 **9,998만 주**로 시장 최다 수준이었다. 전날 +3.58%로 \$104.56까지 올라 \$100선에 안착하는 듯했으나 하루 만에 무너졌다.
반도체 전반의 매도 국면에서 **개인 비중이 높은 종목이 더 크게 흔들리는** 패턴이 나타났다.
이번 주 등락(+3.58% → −6.58%)이 보여주듯 **방향성 없는 고변동 구간**에 들어가 있다.

**7. 테라다인 (TER) −8.77% · 마벨 (MRVL) −7.81%**
테라다인이 \$404.29로 −8.77%, 마벨이 \$216.03으로 −7.81% 급락했다. 두 종목 모두 **전날 각각 +5.81%·+5.55% 올랐던 것을 완전히 반납하고도 더 빠졌다.**
검사장비와 커스텀 실리콘은 메모리 사이클에 후행하는 특성이 있어, 메모리가 흔들리면 증폭돼 반응한다.
**이틀 연속 방향이 정반대로 뒤집힌 것**은 시장이 반도체 사이클의 지속성에 대해 확신을 잃었음을 보여준다.

**8. 메타 (META) −4.45% — \$543.67, 빅테크 최대 낙폭**
\$543.67로 −4.45% 밀리며 거래량 2,552만 주를 기록했다. 8/17 −3.54%에 이어 **이틀 연속 큰 폭 하락**으로, 이번 주에만 −7.8%다.
AI 자본지출 부담 논쟁이 알파벳에서 시작해 메타로 완전히 옮겨온 모습이다. 금리 급등이 여기에 기름을 부었다.
반면 알파벳은 +0.06%로 보합이었다. **같은 논쟁의 진앙이었던 종목은 이미 조정을 소화**했고, 뒤늦게 편입된 종목이 더 크게 흔들리는 구도다.

**9. 애플 (AAPL) +1.45% — \$310.03, 대형주 중 홀로 상승**
거래량 4,661만 주와 함께 대형 기술주 중 유일하게 의미 있게 올랐다. **다우가 −0.22%로 선방한 결정적 이유**다.
반도체·AI 인프라에서 빠져나온 자금이 **AI 자본지출 부담이 상대적으로 작은 하드웨어 기업**으로 이동한 것으로 읽힌다. 애플은 자체 데이터센터 투자 규모가 하이퍼스케일러 대비 작다.
넷플릭스도 +2.30%(\$77.77)로 올라, **'AI에 돈을 덜 쓰는 기업'이 반사이익을 얻는 구도**가 확인됐다.

**10. 타가리소시스 (TRGP) +7.13% · 인튜이트 (INTU) +4.41%**
타가리소시스가 \$297.77로 +7.13% 급등해 이날 상승률 1위에 올랐다. 브렌트유 91달러대 고착으로 **미드스트림 에너지 인프라**가 재평가됐다. 거래량 218만 주.
인튜이트는 \$350.41로 +4.41% 올랐다. 매치그룹 +3.95%, 고대디 +3.71%까지 겹치며 **AI 테마와 거리가 있는 소프트웨어**가 상대적으로 강했다.
지수가 내린 날에도 **에너지와 비(非)AI 소프트웨어로는 자금이 유입**됐다는 점은, 시장 전체가 위험 회피로 돌아선 것은 아님을 시사한다.

## 💬 섹션 3. 구루·기관 코멘트

- **로이터 — "이란 우려와 광범위한 매도세 속에 미 국채 금리 상승."** 지정학 리스크가 금리를 밀어올리고 그것이 다시 주식을 누르는 **연쇄 구조**를 짚었다.
- **연준 금리선물(9/16 FOMC) — 인상 35.3% vs 동결 64.7%.** 전 거래일 36.3%에서 소폭 내렸다. 지난주 32.3%까지 갔다가 유가 급등으로 되올랐던 확률이 **35% 안팎에서 안정**되는 모습이다.
- **이양(Lee Yang) — "주식시장은 유가 교란을 얼마나 무시할 수 있는가."** 브렌트 91달러가 고착되는 국면에서 **주식시장의 내성이 어디까지인지**를 묻는 분석으로, 이날 조정의 배경을 설명한다.
- **CNBC(지난주) — "AI 인프라 붐이 점점 더 레버리지에 의존하고 추적하기 어려워지고 있다."** 코어위브 −12.10%로 **경고가 현실화**된 하루였다. 골드만삭스의 "AI 지출은 부채·주식 발행으로 조달된다"는 진단과 함께 다시 읽을 필요가 있다.
- **모틀리풀 — "SK하이닉스가 내년 실적 기준 PER 5배에 거래되는 것은 경기민감 기업의 사이클 정점 신호일 수 있다."** 8/16 분석이 이날 급락으로 시험대에 올랐다. **HBM이 사이클을 완화했을 뿐 없애지는 않았다**는 지적이다.
- **SKHY 컨센서스 — 애널리스트 14인 Strong Buy, 목표주가 \$245.21 유지.** 주가 급락으로 상승 여력은 +43.1% → **+57.6%**로 확대됐다. 목표가 자체는 조정되지 않았다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📊 FOMC 의사록 (오늘 밤):** 7월 회의 의사록이 공개된다. 시장은 9월 동결을 64.7%로 반영 중이라, **인상 재개 논의의 강도**가 확인되면 금리·달러가 다시 움직일 수 있다. 반도체가 이미 금리에 민감해진 상태라 파급이 클 수 있는 이벤트다.
- **🇰🇷 오늘 국내 개장 — 외국인 수급이 유일한 관전 포인트:** 갭다운은 기정사실이다. 관건은 **4거래일 연속 순매수(누적 +240만 주)를 이어온 외국인이 순매도로 돌아서는지**다. 매수가 유지되면 낙폭 축소, 전환되면 추가 하락이다.
- **🇰🇷 괴리율 +32.4%:** 15%p 급축소됐다. **7월 말 이후 가장 낮은 수준**으로, 정상 범위(20~30%대)에 근접했다. 이 정도면 ADR 프리미엄을 근거로 한 국내 저평가 논리가 약해진다는 점도 함께 봐야 한다.
- **🛢 브렌트 91달러 고착:** 트럼프가 호르무즈 개방을 주장했음에도 유가는 내려오지 않았다. **시장이 정치적 발언보다 실제 통항량을 보고 있다**는 뜻이다. \$95 접근 시 물가·금리 부담이 재점화된다.
- **⚠️ 글로벌 금리:** 일본 10년물 2.952%, 독일 10년물 3.2610%. **미국이 아닌 곳에서 금리가 오르는 국면**이라 엔 캐리 청산 등 파급 경로를 주시할 필요가 있다.
- **⚠️ SK하이닉스 파생상품 거래 손실 39.8조원 공시:** 8/14 공시 건으로 여전히 원문 미확인 상태다. 급락 국면에서 재부각될 수 있어 **확인이 필요**하다.
