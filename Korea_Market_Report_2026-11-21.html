## 🗓 시장 요약

**① 코스피 5.21% 급락해 4,869.96…사이드카 두 번, 10개월 만에 최저·시총 4,000조원 붕괴**
코스피는 4.08% 갭하락한 4,928.51로 출발해 오전 중 매도 사이드카가 발동됐고, 13시 28분에는 코스닥에서도 사이드카가 나왔다. 장중 저점은 4,831.69, 고점은 4,971.31이었고 결국 267.93포인트(−5.21%) 내린 4,869.96에 마감해 코스피 시가총액이 4,000조원 아래로 내려갔다. 수급은 개인 +15,381억원, 외국인 −10,956억원, 기관 −9,330억원으로 외국인·기관이 합쳐 2조원 넘게 팔았고, 외국인은 이달에만 16조원어치를 순매도했다는 집계가 나왔다. 개인은 삼성전자·SK하이닉스 두 종목만 1.5조원어치를 사들이며 '나홀로 방어'에 나섰다.

**② 밤사이 미국: 엔비디아 −14.01%, 필라델피아 반도체 −10.73%…나스닥 −5.28%로 올해 상승분 반납**
뉴욕증시는 다우 −1.93%(48,147.33)·S&P500 −3.70%(6,910.39)·나스닥 −5.28%(22,617.73)·나스닥100 −5.61%로 마감했다. 상장 둘째 날 앤트로픽이 8～9% 밀리며 AI 기업 가치와 인프라 투자 수익성에 대한 의문이 커졌고, 젠슨 황 사임 이후 엔비디아의 리더십 공백과 대중 규제 우려가 겹쳐 엔비디아는 14.01% 내린 125.53달러로 마감해 주간 기준 7주 연속 하락, 금융위기 이후 최장 하락 기록을 세웠다. AMD(−13.25%)·마이크론(−13%)·브로드컴(−11%)·마벨(−10.7%)·어플라이드머티어리얼즈(−9.7%)·TSMC ADR(−9%)이 함께 밀렸고, 트럼프 대통령은 장 마감 뒤 해외에 데이터센터를 짓는 미국 기업에 막대한 세금을 물리겠다며 중국에는 구형 칩만 팔아야 한다고 말했다. 안전자산 선호로 미 10년물 금리는 13bp 내린 4.92%였지만 12월 연준 금리 인상 확률은 여전히 90%대로 반영돼 있다.

**③ 반도체: 삼성전자 −7.01%·SK하이닉스 −5.92%·삼성전기 −12.54%…기판·장비까지 전 밸류체인 급락, 밤사이 충격 추가**
반도체와반도체장비 업종은 167종목이 내리고 2종목만 올라 8.01% 떨어졌다. 이수페타시스(−16.14%)·피에스케이(−15.18%)·티에스이(−15.11%)·리노공업(−15.07%)·원익IPS(−14.47%)·이오테크닉스(−14.03%)·대덕전자(−12.85%)·심텍(−11.61%)·한미반도체(−10.79%)가 두 자릿수로 밀렸다. 장 마감 뒤에는 SK하이닉스가 키옥시아 전환사채를 주식으로 바꿔 지분 14.1%를 확보했고, 삼성전자는 메모리사업부장에 황상준 부사장, MX사업부장에 최원준 사장을 앉히는 인사를 냈다. KB증권은 2027년 D램 평균판매가격이 40% 오를 것이라며 펀더멘털은 견조하다고 봤지만, 밤사이 SOX가 10% 넘게 빠지고 미국 상장 SK하이닉스 관련 주식도 장중 12% 급락해 다음 거래일 추가 하락 압력이 크다.

**④ 강세 업종: 기타금융·항공·은행·전력 — 한진칼 +9.26%, 한미약품 +6.52%, 금융지주 보합권 방어**
기타금융(+4.40%)·항공사(+3.48%)·은행(+0.19%)만 올랐다. 한진칼은 경찰이 '자사주 출연' 배임 의혹으로 조원태 회장 휴대전화를 압수했다는 소식에도 지분 경쟁 기대가 부각되며 9.26% 올랐고 한진칼우는 상한가였다. 한미약품은 국산 비만약 '에페'가 출시 2주 만에 약 100억원어치 공급됐다는 소식에 6.52% 올랐다. 신한지주(+0.70%)·메리츠금융지주(+0.56%)·하나금융지주(0.00%)·KB금융(−0.33%)과 한국전력(+1.19%)이 방어주로 버텼고, 한중 관계 개선 기대에 크래프톤(+2.74%)·에스엠(+2.52%)·제주항공(+2.51%)·마녀공장(+18.66%)도 올랐다.

**⑤ 약세 업종: 전자장비·통신·전기장비·기계·건설 — SK텔레콤 −13.09%, 두산 −13.89%, HD건설기계 −12.81%**
전자장비와기기(−11.77%, 86종목 하락)가 하락 1위였고, SK텔레콤이 앤트로픽 상장 '재료 소멸'과 차익실현에 13.09% 급락하면서 무선통신서비스가 9.92% 내렸다. 전기장비(−8.20%, 33종목 모두 하락)·기계(−7.28%)·건설(−6.92%)·에너지장비(−6.90%)·생명보험(−6.88%)·통신장비(−6.73%)·소프트웨어(−6.34%)·석유와가스(−6.08%)도 약했다. 대형주에서는 두산(−13.89%)·HD건설기계(−12.81%)·SK스퀘어(−8.39%)·두산에너빌리티(−6.96%)·삼성생명(−6.46%)·SK(−6.38%)·삼성SDI(−6.07%)가 크게 내렸다.

**⑥ 코스닥·환율·파생: 코스닥 −5.71% 645.68, 원/달러 1,347원…야간선물 700.00(−7.01%) 확정**
코스닥은 660.98로 출발해 642.13까지 밀린 뒤 39.13포인트(−5.71%) 내린 645.68로 마감했고, 외국인(−1,615억원)·기관(−1,065억원)이 팔고 개인이 2,803억원을 샀다. 원/달러는 아침 하나은행 고시 기준 1,347.0원으로 전일보다 11.5원 올라 위험회피 흐름을 반영했다. 주간 코스피200 선물은 752.75(−5.43%)였는데 야간 세션에서 미국 급락을 따라 52.75포인트(−7.01%) 내린 700.00으로 06:00에 확정됐다. 야간선물 낙폭을 코스피에 그대로 대입하면 4,500선 초반이 거론되는 수준이어서, 월요일 개장 때 다시 사이드카·서킷브레이커 같은 변동성 장치가 작동할 가능성도 열어 둬야 한다.

## 1. 업종별 흐름

**상승 업종** — 오른 업종은 기타금융(+4.40%, 한진칼 +9.26%)·항공사(+3.48%)·은행(+0.19%, 신한지주 +0.70%) 정도였고, 전기유틸리티(−0.10%, 한국전력 +1.19%)·식품과기본식료품소매(−0.30%)·판매업체(−0.35%)·운송인프라(−0.37%)·게임엔터테인먼트(−0.40%, 크래프톤 +2.74%)·항공화물운송과물류(−0.66%, 현대글로비스 +0.49%)가 낙폭이 작았다. 개별로는 한미약품(+6.52%)·에스엠(+2.52%)·제주항공(+2.51%)·스튜디오드래곤(+1.79%)·알테오젠(+0.98%)·삼천당제약(+0.84%)이 시장과 반대로 올랐고, 코스닥에서는 바이오니아(+20.09%)·마녀공장(+18.66%)·HLB생명과학(+15.97%)·글로벌텍스프리(+13.79%)가 시총 1,000억원 이상·+10% 이상 상승 종목이었다.

**시장의 시선** — 금요일 하락은 국내 악재보다 미국발 AI·반도체 심리 악화와 아시아 동반 급락이 겹친 결과였는데, 밤사이 엔비디아(−14.01%)와 SOX(−10.73%)가 2008년 이후 볼 수 없던 폭으로 무너지면서 충격이 한 단계 더 커졌다. 증권가는 오더컷 없는 메모리 업황, 장기공급계약(LTA), HBM 완판을 근거로 펀더멘털은 그대로라고 보지만, 젠슨 황 사임 이후 리더십 공백, 트럼프 대통령의 해외 데이터센터 과세 발언, 대중 칩 규제, AI 인프라 투자수익률 논란이 한꺼번에 얹혀 멀티플이 쉽게 회복되기 어렵다는 시각이 우세해졌다. 월요일에는 반도체·기판·장비주의 추가 하락 폭과 함께, 금요일 버틴 금융지주·한국전력·항공·한한령 수혜주가 계속 피난처 역할을 하는지가 관건이다. 다음 주에는 25일 미국 10월 PCE, 26일 한국은행 금통위(3.25%로 인상 전망)와 미국 추수감사절 휴장이 이어진다.

- **메모리 반도체 — 하락 점검 2/7 → 3/7 (단계는 '하락' 유지)**: 가격 규칙·호재 무반응에 '하락 서사 급증'이 새로 켜졌다. 20일 코스피 대비 −1.5%, 바구니는 고점 대비 −50.7%이고 D램 현물 상승률이 +10.6%에서 +0.3%로 꺾였다. 논지는 오더컷 없음·LTA 장기화·HBM 완판으로 펀더멘털이 견고하다는 것이지만, 가장 강한 반론은 시장이 공급 부족의 '수준'이 아니라 가격 상승률의 '둔화'를 이미 가격에 넣고 있다는 점이다. 점검표상 절반 축소 검토 구간에 들어섰고, 밤사이 SOX −10.73%는 아직 반영 전이다.

## 3. 증권사 리포트 요약

*직전 아침판 이후 나온 증권사 리포트 — 종목 73건 · 산업·전략 152건 · 기업 IR 0건. 순서는 네이버 증권 리서치 조회수 기준 인기순(팩 순서 그대로), 🔥는 강력추천·목표가 상향 신호. 저녁판과 겹치는 리포트도 포함했다.*

PGR = 현재 PER ÷ 2년 영업이익 연평균 증가율(%) · 1 미만이면 성장 대비 저평가

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
