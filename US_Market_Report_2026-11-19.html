유나이티드헬스는 \$349.91(−\$39.77, −10.21%)로 이틀째 급락했다. 미 메디케어·메디케이드서비스센터(CMS)가 부정 청구 단속을 위한 'CRUSH' 규정안을 내놓고, 메디케어 어드밴티지 위험조정 감사에서 표본 오류를 전체 계약에 외삽해 환수하는 방안을 제시했다. CMS는 이 규정으로 2027~2036년 약 \$902억을 환수할 수 있을 것으로 추산했다. 메디케어 어드밴티지 비중이 큰 대형 보험사의 수익성 전망이 한꺼번에 낮아지며 다우 하락분의 상당 부분을 이 종목이 차지했다.

**3. 휴매나 (HUM) −13.07% — 메디케어 어드밴티지 비중 최대, CMS 감사 강화안 직격탄**
휴매나는 \$385.40(−\$57.94, −13.07%)로 마감하며 건강보험주 가운데 낙폭이 가장 컸다. CMS의 감사 외삽 규정안은 2027~2036년 약 \$902억 환수를 목표로 하며, 매출 대부분이 메디케어 어드밴티지에서 나오는 휴매나가 가장 큰 타격을 받을 업체로 꼽혔다. 같은 날 엘리번스 헬스(ELV)도 \$400.84(−7.63%), 센틴(CNC)도 7%대 하락하며 업종 전반이 이틀째 매도됐다. 규정안은 의견 수렴 절차를 거쳐 확정될 예정이어서 업계 로비 결과가 다음 변수다.

**4. 타깃 (TGT) +3.97% — 3분기 매출 \$271억(+7.1%)·동일점 매출 +5.6%, 연간 EPS 전망 \$10.65~11.40로 상향**
타깃은 \$165.86(+\$6.33, +3.97%)로 마감했다. 3분기 순매출은 \$271억으로 1년 전보다 7.1% 늘어 예상치(\$265억)를 넘었고, 동일점 매출은 5.6% 증가했다. 주당순이익은 관세 환급 효과 \$0.50을 포함해 \$2.65로 예상치(\$2.08)를 크게 웃돌았다. 회사는 연간 매출 증가율 전망을 약 6%로 1%포인트 올리고 조정 EPS 전망을 기존 \$9.90~10.90에서 \$10.65~11.40으로 높였다.

**5. TJX (TJX) +8.05% — 3분기 매출 \$159억5,000만(예상 \$158억2,000만)·동일점 +4%, 연간 EPS 가이던스 상향**
TJX는 \$140.30(+\$10.45, +8.05%)로 마감했다. 3분기 매출은 \$159억5,000만으로 1년 전보다 5.5% 늘어 예상치(\$158억2,000만)를 넘었고, 동일점 매출은 4% 늘어 회사 계획을 웃돌았다. 주당순이익은 \$1.39(관세 환급 제외 \$1.34), 순이익은 \$15억4,000만으로 1년 전 \$14억4,000만보다 늘었다. 회사는 연간 조정 EPS 가이던스를 \$5.15~5.20에서 \$5.17~5.20으로 올렸다.

**6. 테이크투 인터랙티브 (TTWO) +6.22% — GTA 6 전 세계 출시 시작, 웰스파고 판매 전망 6,500만 장으로 상향**
테이크투는 \$216.61(+\$12.68, +6.22%)로 마감하며 전날 −4.47% 하락을 만회했다. GTA 6가 전 세계 순차 출시에 들어가면서 첫 판매 반응에 대한 기대가 커졌다. 웰스파고는 이번 회계연도 GTA 6 판매량 전망을 기존 3,500만 장에서 약 6,500만 장으로 올렸고, 회사도 연간 예약매출(bookings) 전망을 19% 높였다. 연간 실적의 대부분이 이 한 작품에 걸려 있어 초기 판매 집계가 주가 방향을 좌우할 전망이다.

**7. 팰로앨토 네트웍스 (PANW) +9.90% — 회계 1분기 매출 \$34억4,000만(+39%), 연간 매출 가이던스 \$145억2,000만~145억7,000만으로 상향**
팰로앨토 네트웍스는 \$339.92(+\$30.63, +9.90%)로 마감했다. 회계 2027년 1분기 매출은 \$34억4,000만으로 1년 전보다 39% 늘었고, 회사는 연간 매출 가이던스를 \$145억2,000만~145억7,000만으로 높였다. 또 어플라이드 컴퓨트를 \$45억 규모 주식 교환 방식으로 인수하기로 했다. 정규장 마감 뒤 시간외에서도 6%대 추가 상승했다.

**8. 벨링 브랜즈 (BRBR) +24.07% — 회계 4분기 순매출 \$6억9,200만(+7%), 2027회계연도 매출 전망 \$23억2,000만~24억2,000만**
벨링 브랜즈는 \$13.66(+\$2.65, +24.07%)로 하루 만에 4분의 1가량 올랐다. 회계 4분기 순매출은 \$6억9,200만으로 1년 전보다 7% 늘었다. 회사가 내놓은 2027회계연도 순매출 전망은 \$23억2,000만~24억2,000만으로 제시됐다. 실적과 새 회계연도 전망이 나온 뒤 매수가 몰리며 이날 미국 상장 종목 가운데 상승률 최상위권에 올랐다.

**9. 주미아 (JMIA) −40.82% — 3분기 매출 \$6,070만(+33%)에도 연간 전망 하향, 블랙프라이데이 초기 매출 부진**
아프리카 전자상거래 업체 주미아는 \$2.74(−\$1.89, −40.82%)로 마감하며 시가총액의 40% 이상이 사라졌다. 3분기 매출은 \$6,070만으로 1년 전보다 33% 늘었지만, 회사는 연간 실적 전망을 낮췄다. 특히 연중 최대 행사인 블랙프라이데이의 초기 매출 증가율이 기대에 크게 못 미쳤다고 밝혀 4분기 성장 둔화 우려가 커졌다. 매출 증가율 33%라는 숫자보다 연간 전망 하향이 더 크게 반영됐다.

**10. 코닛 디지털 (KRNT) −22.89% — 3분기 매출 \$5,830만(+10%), 4분기 가이던스 \$6,000만~6,500만 실망**
