## 🗓 시장 요약

**① 만기일의 혼조 — 나스닥 +0.40%·S&P500 +0.17%·다우 −0.18%, 반도체가 이틀째 지수를 받쳤고 주간으로는 인상 충격을 거의 되돌렸다**
연준 인상(3.75~4.00%) 이후 세 번째 거래일, 3대 지수는 방향을 정하지 못했다. 다우는 **51,682.64(−95.40, −0.18%)**로 소폭 밀렸고 S&P500은 **7,650.50(+12.74, +0.17%)**, 나스닥은 **26,522.55(+104.25, +0.40%)**로 올랐다. 나스닥100은 +0.67%, 필라델피아 반도체지수는 **+2.78%**로 이틀 연속 급등했으며 VIX는 14.83(−3.96%)까지 내려왔다. 이날은 주식·지수 선물·옵션이 함께 만기되는 트리플 위칭이었고, 거래량과 변동이 마감 한 시간에 몰렸다. TheStreet Pro의 제임스 디포어는 "이번 주 내내 질문은 10년물이 5%를 확실히 뚫느냐 안정되느냐였고 목요일에 안정됐다"면서도 만기일 움직임은 "기계적인 것이며 펀더멘털 시각의 변화로 혼동해서는 안 된다"고 했다. 해석하면 목요일의 '안도 랠리'가 금요일에 확산되지는 않았지만 무너지지도 않았다 — 지수는 반도체와 가상자산 관련주가 끌고 자동차·스트리밍·소형주가 눌렀으며, 방향보다 종목별 재료가 승부를 갈랐다.

**② 10년물 다시 5% 문턱 — 종가 4.99%, 2년물 4.74%로 되올랐고 다이먼 "인플레이션을 잡았는지 분명치 않다"**
전날 4.93%로 내려왔던 10년물 금리는 장중 5%를 재돌파했다가 **4.99%** 부근으로 마감했고, 2년물은 **4.74%**, 30년물은 5.33%로 전 구간이 다시 올랐다. 주간으로 2년물은 약 10bp 상승, 30년물은 약 3bp 하락으로 커브는 평탄화 쪽이다. JP모건체이스의 제이미 다이먼 CEO는 "우리가 인플레이션을 잡았는지 내게는 분명하지 않다"고 말했고, 서튜이티의 스콧 웰치 CIO는 인상이 불확실성을 일부 걷어냈지만 "10월 또는 선거 이후" 추가 인상이 가능하고 내년까지 한두 차례 더 이어질 수 있다고 봤다. 골드만삭스의 데이비드 메리클 수석 이코노미스트는 점도표에서 18명 중 16명이 연내 추가 인상을 예상한 점을 들어 "10월에 두 번째 25bp 인상이 이뤄질 가능성이 높다"고 했다. 시장이 보는 10월 인상 확률은 출처에 따라 52~55%로 전날(53.1%)과 큰 차이가 없다. 해석하면 목요일의 금리 하락은 과매도 되돌림이었고, 채권시장은 '10월 인상 반반'이라는 가격을 그대로 유지한 채 5%를 축으로 흔들리고 있다.

**③ 유가 사흘째 하락 — WTI \$100.30·브렌트 \$103.87, 사우디 송유관 복구 기대에 \$100 선이 시험대**
WTI는 **\$100.30(−1.58%, −\$1.61)**, 브렌트는 **\$103.87(−0.91%, −\$0.95)**로 사흘 연속 내렸다. 전날 사우디가 손상된 동서 송유관 용량의 절반을 며칠 내, 전체를 6주 내 복구할 수 있다고 시사한 데 이어 이날도 공급 차질 완화 기대가 이어졌고, 트럼프 대통령이 이란 전쟁이 끝에 가까워지고 있다고 말한 것도 배경이다. 금 12월물은 \$4,424.90(+0.57%)로 이틀째 올랐고 장중 \$4,439.80으로 주간 고점을 찍었다 — 유가 하락으로 기대 인플레이션 부담이 줄면서 실질금리 관점의 압력이 걷혔다는 해석이다. 해석하면 WTI는 사흘 만에 \$3 넘게 내려 \$100 선까지 왔지만 한 달 수익률은 여전히 두 자릿수이고 호르무즈는 분쟁 항로 그대로다 — \$100 붕괴 여부가 다음 주 채권시장의 기대 인플레이션을 좌우한다.

**④ 반도체·메모리가 이틀째 주도 — SOX +2.78%, 샌디스크 +10.99%(S&P100 편입), 마이크론 +3.92%(미국 증설), 엔비디아 +1.34%**
필라델피아 반도체지수는 **+2.78%(11,921.69)**로 이틀간 6% 가까이 올랐다. 샌디스크(SNDK)는 나이키를 대신해 델·팔로알토·아리스타와 함께 **S&P100에 편입**된다는 발표에 **\$1,791.82(+10.99%, +\$177.43)**로 급등했고, 마이크론(MU)은 보이시(아이다호)·클레이(뉴욕) 신규 팹 등 미국 증설 계획과 메모리 공급 부족 서사에 **\$1,015.80(+3.92%)**로 사상 고점권에 올랐다. 엔비디아(NVDA)는 전날 젠슨 황의 '내년 칩 판매량 2배' 발언 여진에 \$222.27(+1.34%), SK하이닉스 ADR(SKHY)은 **\$187.50(+2.46%)**로 장중 \$192.01까지 올랐다. 반면 전날 +7.67%였던 인텔(INTC)은 \$108.60(−0.18%)로 상승분을 지키는 데 그쳤고, 오라클(ORCL)은 AI 인프라 자금조달·이자비용 우려에 −1.98%로 밀렸다. 해석하면 자금은 '수요가 확인된 메모리'로 더 좁혀졌다 — GPU 판매 2배 발언 이튿날 HBM·NAND 체인이 반응했고 인덱스 편입 이벤트가 그 위에 얹혔다.

**⑤ 회사 고유 재료 — 코인베이스 +11.66%·로빈후드 +9.12%(SEC 토큰화 주식 면제 이틀째), 넷플릭스 −4.67%(웰스파고 비중축소·목표가 \$57), 제넌 −30.69%(3상 등록 중단), GM −5.10%**
SEC가 전날 발효한 토큰화 미국 주식 거래 '혁신 면제'(5년 일몰)에 코인베이스(COIN)는 **\$194.25(+11.66%)**, 로빈후드(HOOD)는 **\$119.82(+9.12%)**로 이틀 연속 급등했고 비트코인이 \$80,000선을 다시 시험한 것도 힘을 보탰다. 넷플릭스(NFLX)는 웰스파고가 시청 참여도 둔화를 이유로 투자의견을 **비중축소**로 내리고 목표가를 **\$57**로 낮추자 **\$71.79(−4.67%)**로 나흘째 하락했다. 제넌 파마슈티컬스(XENE)는 우울증·양극성 우울증 3상에서 신경정신 이상반응 우려로 신규 환자 등록을 자발적으로 중단해 **\$39.75(−30.69%)**, 11월 이후 최저로 추락했다. 제너럴모터스(GM)는 회사 발표 없이 전날의 방산 납품 강세를 반납하며 **\$82.20(−5.10%)**로 2025년 7월 이후 최악의 하루를 보냈고 포드(F) −2.96%·스텔란티스(STLA) −4.36%가 동반 하락했다. 나이키(NKE)는 약 18년 만의 S&P100 제외에 \$35.51(−2.34%)로 12년래 최저권을 이어갔다.

**⑥ 🇰🇷 코스피 +2.66%(6,894.23)·외국인 8거래일 만에 순매수 전환, SK하이닉스 +6.42%·SKHY +2.46% — 괴리율 +45.1% → 약 +39.8%로 축소**
9/18 코스피는 **6,894.23(+178.82, +2.66%)**로 급등해 6,900선에 근접했고 코스닥은 827.12(+0.60%)였다. 외국인은 코스피에서 **+4,362억원** 순매수로 7거래일 연속 매도를 끊었고 기관이 +1조 5,025억원을 더했으며 개인은 −3조 5,872억원으로 차익을 실현했다. SK하이닉스(000660)는 **+6.42%**, 삼성전자(005930)는 **+3.37%**로 전날 미국 SOX +3.14%·인텔 +7.67%를 그대로 받았고 원/달러는 **1,383.3원(+1.1원)**으로 보합권이었다. 미국에서는 SKHY가 시가 \$184.91, 고가 \$192.01, 저가 \$182.80을 거쳐 **\$187.50(+2.46%, +\$4.51)**로 마감했고 거래량은 7,026만 주로 전날의 4배가 넘었으며 시간외는 \$187.55(+0.03%)였다. 괴리율은 국내 원주가 ADR보다 더 크게 오르면서 +45.1%에서 **약 +39.8%**로 5%p 넘게 좁혀졌다 — 전날 '미국이 끌고 국내가 못 따라온' 구도가 하루 만에 뒤집힌 셈이다. 코스피200 야간선물은 **1,094.80(+2.35, +0.22%)**로 마감했다 — 시가 1,091.00에서 저가 1,075.50까지 밀렸다가 고가 1,094.80으로 끝나 정규장 선물 종가 1,092.45 대비 소폭 위이며, 미국 만기일 혼조를 야간이 크게 반영하지 않았다.

## 1. 업종별 흐름

**상승 업종 3**
- **반도체·메모리** — 샌디스크(SNDK) +10.99%(\$1,791.82), 마이크론(MU) +3.92%(\$1,015.80), SK하이닉스 ADR(SKHY) +2.46%(\$187.50), 엔비디아(NVDA) +1.34%, SOX +2.78%. S&P100 편입, 미국 팹 증설, '칩 판매량 2배' 발언의 여진이 겹쳤고 인텔(INTC)은 −0.18%로 쉬어갔다.

- **스트리밍·소비재·바이오** — 넷플릭스(NFLX) −4.67%(웰스파고 비중축소), 나이키(NKE) −2.34%(S&P100 제외), 제넌 파마슈티컬스(XENE) −30.69%(3상 등록 중단).
- **양자컴퓨팅·AI 클라우드·소형주** — 아이온큐(IONQ) −3.00%, 리게티(RGTI) −1.44%, 오라클(ORCL) −1.98%, 러셀2000 약 −0.5%. 금리 재상승에 투기적 성장주와 자금조달 부담이 큰 AI 인프라주가 밀렸고, 러셀 편입 1,944종목 중 상승은 551종목에 그쳤다.

**시장의 시선** — 목요일 "최악은 지나갔는가"였던 질문이 금요일에는 "그래서 어디를 사는가"로 좁혀졌다. 10년물이 5%를 다시 건드리고 유가가 \$100선까지 내려온 날, 지수는 제자리였지만 반도체·메모리(SOX +2.78%)와 가상자산 플랫폼(COIN +11.66%)은 이틀째 강했고 자동차·스트리밍·양자컴퓨팅은 팔렸다. 디포어의 말대로 만기일 움직임을 펀더멘털로 읽을 필요는 없지만, 주간으로 보면 인상 다음 날의 급락은 거의 메워졌고 그 복원의 대부분은 반도체가 만들었다. 다이먼의 "인플레이션을 잡았는지 분명치 않다"와 메리클의 "10월 두 번째 인상"이 같은 날 나온 것은 채권시장이 아직 종착점을 모른다는 뜻이다. 한국 시장에는 '외국인 순매수 전환 + 미국 반도체 이틀째 강세'라는 우호적 조합과 '10년물 5%·트럼프-시진핑 정상회담 직전 주말 협상'이라는 변수가 함께 도착한다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 코인베이스 (COIN) +11.66% — \$194.25, SEC 토큰화 주식 '혁신 면제' 이틀째 급등·비트코인 \$80,000 재시험**
코인베이스는 시가 \$178.15에서 장중 \$196.21까지 올라 \$194.25(+\$20.28, +11.66%)로 마감했고 전날 +5.75%에 이어 이틀간 약 18% 뛰었다. SEC가 특정 플랫폼에서 토큰화된 미국 주식을 기존 거래소 등록 없이 거래할 수 있게 한 5년 한시 '혁신 면제'에서 코인베이스와 로빈후드가 대상 플랫폼으로 지목됐고, 비트코인이 약 2% 올라 \$80,000선을 다시 시험한 것이 매수를 자극했다. CFTC도 같은 날 가상자산 규제안을 제안해 규제 명확성 기대가 겹쳤으며, 스트래티지(MSTR)도 동반 상승했다. 전날 은행·핀테크 급락의 되돌림을 넘어 새 수익원(토큰화 주식 거래) 기대가 가격에 들어가기 시작한 하루다.

**2. 로빈후드 (HOOD) +9.12% — \$119.82, 토큰화 주식 거래 허용 플랫폼으로 지목되며 장중 \$120.57**
로빈후드는 시가 \$113.52, 고가 \$120.57을 거쳐 \$119.82(+\$10.01, +9.12%)로 마감해 전날 +5.16%에 이어 이틀 연속 급등했다. SEC 혁신 면제가 로빈후드를 토큰화 미국 주식 거래가 가능한 플랫폼으로 명시하면서 이미 유럽에서 운영 중인 토큰화 주식 서비스를 미국에서도 확장할 길이 열렸다는 해석이 나왔다. 코인베이스(COIN) +11.66%와 함께 가상자산 플랫폼 두 곳이 나란히 두 자릿수에 근접한 상승률을 기록했고, 비트코인 \$80,000선 회복이 거래 수수료 수익 기대를 키웠다. 규제 완화가 실제 매출로 이어지는 시점은 아직 정해지지 않았다는 점이 남은 숙제다.

**3. 샌디스크 (SNDK) +10.99% — \$1,791.82, 나이키 대신 S&P100 편입 발표·메모리 공급 부족 서사**
샌디스크는 시가 \$1,624.06에서 장중 \$1,797.00까지 올라 \$1,791.82(+\$177.43, +10.99%)로 마감했다. S&P다우존스지수는 나이키를 S&P100에서 제외하고 그 자리에 샌디스크·델·팔로알토네트웍스·아리스타네트웍스를 편입한다고 발표했으며, 지수 추종 자금의 매수 수요가 급등의 직접 배경이다. 2025년 웨스턴디지털에서 분사한 이 회사는 AI 서버용 NAND 가격 급등으로 52주 범위가 \$93.54~\$2,354.39에 이를 만큼 변동이 컸고, 마이크론(MU) +3.92%와 함께 메모리 공급 부족 서사가 이틀째 이어졌다. 편입 이벤트가 끝난 뒤에도 NAND 계약가격 추이가 주가를 결정한다.

**4. 마이크론 (MU) +3.92% — \$1,015.80, 보이시·클레이 미국 팹 증설 발표에 사상 고점권**
마이크론은 시가 \$981.71에서 장중 \$1,016.44까지 올라 \$1,015.80(+\$38.30, +3.92%)로 마감했다. 회사는 엔비디아·AMD의 AI 수요에 대응해 아이다호 보이시 신규 팹과 뉴욕 클레이 시설 등 미국 내 생산능력 확대 계획을 밝혔고, 대만 노동협상 시한이 메모리 공급 차질 우려를 키우면서 가격 협상력이 더 커졌다는 분석이 붙었다. 전날 젠슨 황의 "내년 칩 판매량 2배" 발언은 HBM 수요 2배로 읽혔고, SK하이닉스 ADR(SKHY) +2.46%·샌디스크(SNDK) +10.99%가 동반 상승했다. 9월 말 예정된 회계연도 실적 발표에서 HBM 매출과 가이던스가 확인되면 메모리 사이클의 다음 국면이 정해진다.

**5. 넷플릭스 (NFLX) −4.67% — \$71.79, 웰스파고 '비중축소' 하향·목표가 \$57 제시로 나흘째 하락**
넷플릭스는 \$71.79(−\$3.52, −4.67%)로 마감해 나흘 연속 내렸고 장중 \$70.11까지 밀렸다. 웰스파고는 시청 참여도 지표가 "우려스럽다"며 투자의견을 비중축소로 낮추고 목표가 \$57을 제시했는데 이는 종가 대비 약 20% 아래다. 하향 논거는 하반기 콘텐츠 라인업 약화와 광고 요금제 성장 둔화로, 같은 날 디즈니(DIS)는 거의 움직이지 않아 업종이 아닌 회사 고유 재료로 분류됐다. 나스닥이 오른 날 대형 성장주 중 가장 큰 낙폭이었고, 스트리밍 가입자 성장의 상단이 어디인지에 대한 논쟁이 다시 열렸다.

**6. 제넌 파마슈티컬스 (XENE) −30.69% — \$39.75, 우울증·양극성 우울증 3상 신규 등록 자발적 중단**
제넌은 \$39.75(−\$17.60, −30.69%)로 폭락해 지난해 11월 이후 최저로 내려왔고 장중 저가는 \$39.08이었다. 회사는 칼륨 채널 개방제 아제투칼너(XEN1101)의 주요우울장애·양극성 우울증 3상에서 신경정신 이상반응 안전성 신호를 이유로 신규 환자 등록을 예방적으로 중단한다고 발표했으며, 별도로 진행 중인 뇌전증 프로그램과 신약허가신청(NDA)에는 영향이 없다고 밝혔다. 그럼에도 시장은 같은 약물의 안전성 우려가 뇌전증 적응증 심사에 번질 가능성을 가격에 반영했고, 시가총액의 약 3분의 1이 하루에 사라졌다. 등록 재개 여부와 독립 데이터모니터링위원회의 판단이 다음 촉매다.

**7. 제너럴모터스 (GM) −5.10% — \$82.20, 회사 발표 없이 순환매 되돌림·2025년 7월 이후 최악의 하루**
GM은 시가 \$86.16에서 장중 \$81.39까지 밀린 뒤 \$82.20(−\$4.42, −5.10%)로 마감했다. 전날 록히드마틴 패트리엇 미사일 부품 납품 소식에 +2.76% 올랐던 상승분을 하루 만에 반납하고도 더 내렸으며, 포드(F) −2.96%(\$13.21)·스텔란티스(STLA) −4.36%(\$4.83)가 함께 밀려 자동차 업종 전반의 순환매 청산으로 보도됐다. 회사 차원의 새 발표는 없었고, 2025년 7월 이후 최대 낙폭이라는 점에서 금리 재상승(10년물 4.99%)과 만기일 포지션 정리가 경기민감 대형주에 집중됐다는 해석이 붙었다. 다음 주 정상회담을 앞둔 관세 변수가 자동차주의 추가 변수다.

**8. 나이키 (NKE) −2.34% — \$35.51, 약 18년 만의 S&P100 제외에 12년래 최저권**
나이키는 \$35.51(−\$0.85, −2.34%)로 마감해 연초 이후 약 39% 하락한 12년래 최저권을 이어갔다. S&P다우존스지수가 나이키를 S&P100에서 제외하고 샌디스크·델·팔로알토·아리스타를 편입한다고 발표했으며, 이는 나이키가 약 18년간 유지해온 초대형주 지수 지위를 잃는 것이다. 증권사의 목표가 하향이 이어지는 가운데 지수 추종 자금의 매도 수요까지 겹쳐 턴어라운드 압력이 커졌고, 편입 종목 샌디스크(SNDK)가 +10.99% 오른 것과 정반대의 움직임이었다. 다음 실적에서 재고와 중국 매출이 확인되기 전까지는 지수 이벤트가 수급을 지배한다.

**9. 오라클 (ORCL) −1.98% — \$147.61, AI 인프라 자금조달·이자비용 우려에 클라우드 경쟁사와 엇갈림**
오라클은 시가 \$150.47에서 장중 \$144.40까지 밀린 뒤 \$147.61(−\$2.98, −1.98%)로 마감했다. 같은 날 마이크로소프트(MSFT)가 약 −0.7%, 아마존(AMZN)이 약 +0.8%였던 것과 달리 오라클만 두드러지게 내렸고, 보도는 수요 우려가 아니라 AI 데이터센터 건설을 위한 대규모 자본지출과 차입 확대로 이자비용이 불어나는 재무 구조를 이유로 들었다. 10년물 금리가 다시 5%에 근접한 날이라 부채 의존적 AI 인프라 투자의 조달 비용이 재조명됐으며, 전날 코어위브(CRWV)의 \$30억 전환사채 발행에 이어 'AI 수요'와 'AI 자금조달'이 별개로 거래되는 흐름이 확인됐다.

**10. SK하이닉스 ADR (SKHY) +2.46% — \$187.50 (괴리율: 약 +39.8%), 거래량 7,026만 주로 급증·장중 \$192.01**
SKHY는 시가 \$184.91·고가 \$192.01·저가 \$182.80에서 \$187.50(+\$4.51, +2.46%)로 마감했고 거래량은 70,259,357주로 전날 1,654만 주의 4배가 넘었으며 시간외는 \$187.55(+0.03%)였다. 전날 인텔과의 미국 내 메모리 생산 협의 보도와 마이크론(MU) +3.92%·샌디스크(SNDK) +10.99%의 메모리 강세가 이어졌고, 국내 원주 SK하이닉스(000660)가 같은 날 +6.42%로 더 크게 오르면서 괴리율은 +45.1%에서 약 +39.8%로 축소됐다. 장중 고가 기준 +4.92%에서 오름폭이 절반으로 줄어든 것은 만기일 마감 매물의 영향이며, 애널리스트 평균 목표주가 \$248.43 대비로는 여전히 30% 이상의 상승 여지가 남아 있다.

## 3. 구루·기관 코멘트

**증권사 리포트**
- **웰스파고 — 넷플릭스(NFLX) '비중축소' 하향, 목표가 \$57.** 시청 참여도 지표 둔화와 하반기 콘텐츠 라인업 약화가 논거이며, 종가 대비 약 20% 하락 여지를 제시했다.
- **골드만삭스(데이비드 메리클 수석 이코노미스트) — "10월 두 번째 25bp 인상 가능성이 높다."** 점도표에서 18명 중 16명이 연내 추가 인상을 예상한 점을 근거로 들었다.
- **S&P다우존스지수 — S&P100 정기 변경.** 나이키(NKE) 제외, 샌디스크(SNDK)·델(DELL)·팔로알토네트웍스(PANW)·아리스타네트웍스(ANET) 편입.

**국내 증권사·시장**
- **전자신문** — "코스피, 2% 올라 6,890선 회복…외국인 8거래일 만에 순매수 전환." 외국인 +4,362억원, 기관 +1조 5,025억원.
- **디지털데일리** — "반도체 불붙자 코스피 6,900선 돌파…SK하이닉스 6.4% 급등." 전날 미국 SOX +3.14%가 국내 반도체 대형주로 전달됐다.

**구루·시장 코멘트**
- **제이미 다이먼(JP모건체이스 CEO)** — "우리가 인플레이션을 잡았는지 내게는 분명하지 않다."
- **제임스 '레브 샤크' 디포어(TheStreet Pro)** — "이번 주 내내 질문은 금리가 5%를 확실히 뚫느냐 안정되느냐였고, 목요일에 안정됐다." 트리플 위칭은 "마감 한 시간에 거래량과 급등락을 만들지만 기계적인 움직임이며 펀더멘털 시각의 변화로 혼동해서는 안 된다."
- **스콧 웰치(서튜이티 CIO)** — 연준 인상이 시장의 불확실성을 일부 걷어냈지만 "10월 또는 선거 이후" 추가 인상이 가능하고, 한두 차례 더 인상이 내년까지 이어질 수 있다.
- **일본은행(우에다 총재)** — 정책금리를 1.25%로 25bp 인상(31년 만의 최고, 반대표 포함 분열 표결). 회견 톤이 인상 자체보다 덜 매파적으로 읽히며 엔화는 결정 뒤 오히려 약세였다.
- **트럼프 대통령** — 이란 전쟁이 끝에 가까워지고 있다는 발언을 이어갔고, 9/24 시진핑 주석 국빈 방문·정상회담 의제는 AI·무역으로 압축됐다.

### 🇰🇷 한국 개장 관전 포인트
- **월요일은 미국 이틀치가 아니라 금요일 하루치를 받는다.** 9/18 코스피 +2.66%는 목요일 미국(SOX +3.14%)을 이미 반영했고, 금요일 미국은 지수 혼조·SOX +2.78%·SKHY +2.46%였다. 야간선물 +0.22%(1,094.80)가 말하듯 갭은 크지 않고, 반도체(SK하이닉스 +6.42% 뒤 추가 상승 여력)와 그 외 업종의 온도차가 관전 대상이다.
- **외국인 순매수 전환의 지속 여부.** 8거래일 만의 +4,362억원은 규모가 크지 않다. 원/달러 1,383.3원(+1.1원)이 보합에 머문 채 외국인이 이틀째 사면 '환율 요인 매도'가 끝났다는 신호이고, 다시 팔면 하루짜리 되돌림이다.
- **메모리 체인의 재료 순서.** 미국은 샌디스크 +10.99%(S&P100 편입)·마이크론 +3.92%(미국 증설)로 NAND·DRAM이 모두 올랐다. SK하이닉스 괴리율은 약 +39.8%로 좁혀졌으나 여전히 높고, 삼성전자(005930) +3.37%는 NAND 가격 상승의 수혜 논리가 붙는다. 주 후반 마이크론 실적이 확인 지점이다.
- **추석 연휴(9/24~26) 공백 리스크.** 연휴 첫날이 트럼프·시진핑 정상회담이고 연휴 중 미 PCE·GDP가 나온다. 사흘간 미국 변동을 못 받는 만큼 연휴 전 현물·선물 포지션 축소가 수급에 나타날 수 있다.
- **금리 5%·유가 \$100의 교차.** 10년물 4.99%는 성장주에, WTI \$100.30(사흘째 하락)은 항공·화학·운송에 각각 반대 방향의 재료다. 일본은행 1.25% 인상에도 엔화가 약세였던 점은 원화에 우호적이지 않다.
- **야간선물은 정규장 위에서 끝났다.** 코스피200 야간선물은 시가 1,091.00 → 저가 1,075.50 → 고가 1,094.80(종가)으로, 정규장 선물 종가 1,092.45 대비 +2.35포인트다. 미국 만기일 혼조를 야간이 크게 반영하지 않았고, 개장 후에는 외국인 현물 부호와 반도체 외 업종의 순환 여부가 관문이다.
