## 🗓 시장 요약

**① S&P500 +0.73%·나스닥 +1.19%·다우 +0.49%, 나스닥100 30,807.93(+1.00%) 사상 최고 종가 — 9월 고용 2만9,000명(예상 8만4,000명) 쇼크에 10월 인상 기대 후퇴, 테슬라 +4.65%·엔비디아 +1.34%(장중 사상 최고 \$237.87)·브로드컴 +3.35% vs 씨게이트 −10.21%·웨스턴디지털 −10.22%·나이키 −3.64%**
금요일 미국 지수는 약한 고용보고서를 '10월 금리 인상이 물 건너갔다'는 신호로 받아들이며 성장주 중심으로 올랐다. S&P500은 **7,722.72(+56.27, +0.73%)**, 나스닥은 **27,190.86(+319.27, +1.19%)**, 다우는 **51,176.96(+250.40, +0.49%)**였고, 나스닥100은 **30,807.93(+306.37, +1.00%)**으로 종가 기준 사상 최고를 새로 썼으며 러셀2000은 2,832.89(+0.94%), VIX는 15.31(−6.59%)이었다. 장중 S&P500은 고가 7,754.67·저가 7,700.51, 나스닥은 고가 27,353.68·저가 27,112.24, 다우는 고가 51,382.88·저가 50,950.61로, 장 초반 고점을 찍은 뒤 국채 금리가 되오르자 상승폭을 일부 반납했다. 업종은 헬스케어를 뺀 전 업종이 올랐다. 종목별로는 테슬라(TSLA)가 3분기 인도량 48만6,532대(예상 약 46만2,000대)에 **\$370.59(+4.65%)**, 엔비디아(NVDA)가 장중 \$237.87로 사상 최고를 찍고 **\$233.95(+1.34%)**, 브로드컴(AVGO)이 \$355.14(+3.35%), 시냅틱스(SYNA) \$121.10(+14.08%)·테라다인(TER) \$449.04(+8.00%)·휴렛팩커드 엔터프라이즈(HPE) \$69.33(+7.36%)·스페이스X(SPCX) \$158.96(+7.35%)·온세미(ON) \$84.89(+6.01%)·오라클(ORCL) \$142.30(+3.06%)·AMD(AMD) \$633.91(+2.95%)가 올랐다. 반면 씨게이트(STX)는 **\$848.99(−10.21%)**, 웨스턴디지털(WDC)은 **\$415.29(−10.22%)**, 액센추어(ACN) \$198.90(−6.31%), 앱러빈(APP) \$268.22(−4.65%), 샌디스크(SNDK) \$1,719.99(−3.79%), 나이키(NKE) \$33.87(−3.64%), 마이크론(MU) \$1,074.89(−2.05%)로 내렸다. 해리스 파이낸셜 그룹의 제이미 콕스는 "이제 10월 인상 가능성은 제로"라고 했다. 해석하면 '나쁜 고용이 주식에는 좋은 뉴스'로 작동한 하루였지만, 장기 금리가 다시 오른 채 끝났다는 점에서 랠리의 근거는 금리 하락이 아니라 '인상 지연' 기대와 반도체·대형 기술주 수급이었다.

**② 9월 비농업 고용 +2만9,000명(예상 8만4,000명)·실업률 4.2%(예상 4.1%)·시간당 임금 +0.1%(예상 +0.3%), 7~8월 6만 명 하향 — 10년물 5.17% 부근까지 내렸다가 5.294%(+6.0bp)로 반등, 2년물 4.841%(+5.4bp)·30년물 5.645%(+4.2bp), 10월 인상 확률 26% → 약 18%**
9월 비농업 고용은 **2만9,000명** 증가로 예상치 8만4,000~9만 명을 크게 밑돌았고, 민간 고용은 4만6,000명(예상 8만5,000명), 실업률은 **4.2%**(예상·전월 4.1%)로 올랐다. 8월 수치는 16만2,000명에서 13만3,000명으로, 7월은 +2만1,000명에서 −1만 명으로 고쳐져 두 달 합계 6만 명이 깎였고, 최근 12개월 평균 증가폭은 월 4만5,000명이다. 시간당 평균 임금은 전월 대비 +0.1%(\$37.81, 예상 +0.3%)·전년 대비 +3.0%(예상 3.2%, 전월 3.1%)로 둔화했고 경제활동참가율은 61.8%, 실업자는 710만 명이었다. 업종별로는 헬스케어 +1만7,000명·건설 +1만1,000명·제조업 +9,000명이 늘고 금융은 7,000명 줄었다. 금리 선물이 반영하는 10월 27~28일 FOMC의 25bp 인상 확률은 전일 26%에서 약 18%(동결 약 81%)로 내려갔고 1주 전에는 60%대였다. 그러나 채권시장의 반응은 오래가지 않았다. 10년물은 발표 직후 5.17% 부근까지 내렸다가 매수세가 사그라지며 **5.294%(+6.0bp)**로, 2년물은 **4.841%(+5.4bp)**, 30년물은 5.645%(+4.2bp)로 오히려 올라 마감했다. 오스틴 굴스비 시카고 연은 총재는 노동시장은 안정적이지만 인플레이션이 연준 책무 가운데 "더 시급한 쪽"이라고 했다. 금은 \$4,162.30(−0.95%), 은은 \$60.42(−1.24%)로 내렸고 달러는 약세로 유로/달러 1.1257, 달러/엔 157.82였으며 8월 공장 주문은 +0.1%로 예상과 같았다. 해석하면 고용 둔화는 '10월 인상'을 지웠지만 '물가가 높다'는 문제는 그대로여서 장기 금리는 내려가지 못했고, 다음 판단 근거는 9월 CPI다.

**③ WTI \$91.11(−\$1.76, −1.90%)·브렌트 \$102.25(−\$0.06) — G7이 4개월간 원유·디젤 최대 1억 배럴 방출 합의, 장중 \$88대 한 달 최저 뒤 낙폭 축소, 미국 디젤 갤런당 \$6.37**
WTI는 **\$91.11(−\$1.76, −1.90%)**로 사흘 만에 내렸고 브렌트는 \$102.25(−\$0.06)로 보합권이었다. 주요 7개국(G7)이 치솟은 연료 가격을 잡기 위해 앞으로 4개월 동안 원유와 디젤 비축분 최대 1억 배럴을 즉시 풀기 시작하기로 합의했다는 소식에 WTI는 장중 \$88대까지 밀려 한 달 최저를 찍었지만, 미국의 세 번째 항공모함 전단 중동 파견과 호르무즈 해협 유조선 피격, 미·이란 협상 불확실성이 남아 있어 \$91대로 낙폭을 줄였다. 미국 디젤 가격은 갤런당 \$6.37로 9월 22일 기록한 사상 최고 \$6.52에서 크게 내려오지 못한 상태다. 에너지주는 유가 하락에도 버텨 엑슨모빌(XOM)은 \$164.01(+0.12%), 셰브론(CVX)은 \$206.69(−0.20%)였고, 은행주는 씨티그룹(C) \$128.50(+1.18%)·뱅크오브아메리카(BAC) \$53.75(+0.04%)·JP모건(JPM) \$332.38(−0.24%)로 엇갈렸다. 해석하면 유가는 화요일 \$89 → 목요일 \$93 → 금요일 \$91로 \$88~95 박스 안에서 움직이고 있고, 비축유 방출은 가격 상단을 누르는 재료지만 중동 긴장이 하단을 받치는 구도가 이어진다.

**④ AI·반도체 — 필라델피아 반도체 +2.40%: 엔비디아 +1.34%(장중 사상 최고 \$237.87·시가총액 약 \$5.7조, 모건스탠리 '최선호주' 재지정)·브로드컴 +3.35%(\$600억 규모 AI 칩 금융 조달)·AMD +2.95%·테라다인 +8.00%·온세미 +6.01%, 반면 씨게이트 −10.21%·웨스턴디지털 −10.22%(도시바 HDD 생산 두 배 계획)·마이크론 −2.05%·샌디스크 −3.79%**
필라델피아 반도체지수는 **13,136.68(+307.68, +2.40%)**로 이틀 연속 3대 지수를 크게 앞섰고 장중 고가는 13,269.33이었다. 엔비디아(NVDA)는 장중 \$237.87(+3.04%)로 사상 최고를 새로 쓰며 시가총액이 약 \$5.7조에 이르렀고 **\$233.95(+\$3.09, +1.34%)**로 마감했으며, 모건스탠리는 엔비디아를 비중확대 의견과 함께 '최선호주'로 다시 지정했다. 브로드컴(AVGO)은 월가 은행단이 앤스로픽 등 AI 고객을 위한 약 \$600억 규모의 신규 AI 칩 금융을 모으기 시작했다는 소식에 **\$355.14(+\$11.50, +3.35%)**로 전일 하락분(−2.15%)을 모두 되돌렸고, AMD(AMD)는 \$633.91(+2.95%), 오라클(ORCL)은 \$142.30(+3.06%)였다. 테라다인(TER)은 AI 데이터센터용 메모리 테스트 장비 '매그넘 E2' 등 신제품 발표에 \$449.04(+8.00%), 온세미(ON)는 시냅틱스 인수 조건을 주당 \$123 전액 현금(약 \$57억, 종전 약 \$70억)으로 낮춰 \$84.89(+6.01%), 시냅틱스(SYNA)는 \$121.10(+14.08%)로 뛰었다. 휴렛팩커드 엔터프라이즈(HPE)는 씨티의 목표가 상향(\$76 → \$92)에 \$69.33(+7.36%), 광통신은 코히런트(COHR) \$337.04(+5.59%)·루멘텀(LITE) \$1,085.42(+3.79%)·어플라이드 옵토일렉트로닉스(AAOI) \$115.59(+7.71%)로 이틀째 올랐다. 반면 저장장치는 급락했다. 일본 도시바가 AI 데이터센터용 하드디스크(HDD) 생산능력을 2027 회계연도까지 두 배로 늘린다는 닛케이 보도에 씨게이트(STX)는 **\$848.99(−10.21%)**, 웨스턴디지털(WDC)은 **\$415.29(−10.22%)**로 밀렸고, 메모리도 마이크론(MU) \$1,074.89(−2.05%)·샌디스크(SNDK) \$1,719.99(−3.79%)로 약했으며 SK하이닉스 ADR(SKHY)은 \$195.13(+0.84%), 인텔(INTC)은 고가 \$126.00(+5.00%)에서 밀려 \$119.33(−0.56%)였다. 해석하면 반도체 안에서도 'AI 연산·테스트·광통신'은 사고 '저장장치·메모리'는 파는 차별화가 뚜렷했고, 공급 부족이 주가의 근거였던 HDD에서 '증설' 뉴스가 나온 것은 메모리에도 경계 신호다.

**⑤ 회사 고유 재료 — 테슬라 +4.65%(3분기 인도 48만6,532대, 예상 약 46만2,000대), 나이키 −3.64%(1분기 매출 \$112.1억 미달·연간 매출 한 자릿수 후반 감소 전망·\$25억 비용 절감과 감원, 장중 −9.05%), 액센추어 −6.31%(전일 +15.78% 급등분 일부 반납), 스페이스X +7.35%, 리비안 −3.12%, 페어 아이작 −0.08%(장중 −7.95%)**

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 테슬라 (TSLA) +4.65% — 3분기 인도량 48만6,532대로 예상(약 46만2,000대) 상회, 생산 46만4,391대, 에너지 저장장치 13.7GWh(예상 15.9GWh)**
테슬라는 시가 \$360.08에서 고가 \$374.60(+5.79%)까지 오른 뒤 \$370.59(+\$16.48, +4.65%)로 마감했다. 회사가 발표한 3분기 인도량은 48만6,532대로 전년 동기 49만7,099대보다 2.1% 줄었지만 시장 예상 46만1,974대를 2만4,558대 웃돌았고, 개별 애널리스트 추정치 범위(42만1,758~48만2,000대)의 상단도 넘어섰다. 모델 3·Y가 47만8,237대, 사이버트럭·세미 등 기타 모델이 8,295대였고 생산은 46만4,391대로 인도가 생산보다 2만2,141대 많아 재고가 줄었으며, 1~3분기 누적 인도는 132만4,681대로 전년 대비 8.8% 늘었다. 다만 에너지 저장장치 설치는 13.7GWh로 전년(12.5GWh)보다 9.6% 늘었지만 예상 15.9GWh에는 못 미쳤다. 2분기(48만126대) 대비로는 1.3% 증가여서 '인도량 바닥 통과' 기대가 주가를 끌어올렸다.

**2. 나이키 (NKE) −3.64% — 회계연도 1분기 매출 \$112.1억(예상 \$113.3억) 미달, 2027 회계연도 매출 한 자릿수 후반 감소 전망, 5년간 \$25억 비용 절감과 감원 계획, BofA 목표가 \$30 → \$24**
나이키는 시가 \$32.55·저가 \$31.97(−9.05%)까지 밀렸다가 낙폭을 줄여 \$33.87(−\$1.28, −3.64%)로 마감했고, 주가는 10년여 만의 최저 수준이다. 전날 장 마감 뒤 발표한 회계연도 1분기 매출은 \$112.1억으로 전년 대비 4% 줄어 예상 \$113.3억에 못 미쳤고 EPS는 \$0.48(전년 \$0.49)이었다. 회사는 2027 회계연도 매출이 한 자릿수 후반 감소할 것이라는 가이던스를 내놓았는데 이는 시장 예상 −2.4%보다 훨씬 나쁜 수치이고, 5년간 \$25억을 아끼는 구조조정 계획도 함께 발표했다. 엘리엇 힐 최고경영자는 "이 작업은 나이키 전반에서 더 적은 수의 직무로 이어질 것"이라며 감원을 예고했다. BofA는 시장수익률 하회 의견을 유지하며 목표가를 \$30에서 \$24로 낮췄고, CFRA의 잭 워링은 "새 CEO 취임 서너 분기째에 나올 실적이지 2년째에 나올 실적은 아니다"라고 평가했다.

**3. 엔비디아 (NVDA) +1.34% — 장중 \$237.87로 사상 최고·시가총액 약 \$5.7조, 모건스탠리가 비중확대 의견으로 '최선호주' 재지정, 나스닥100 사상 최고 종가 견인**
엔비디아는 시가 \$236.05에서 고가 \$237.87(+3.04%)까지 올라 장중 사상 최고를 새로 쓴 뒤 \$233.95(+\$3.09, +1.34%)로 마감했고, 시가총액은 약 \$5.7조로 불어났다. 모건스탠리는 투자의견 비중확대와 함께 엔비디아를 '최선호주'로 다시 지정한다고 발표했고, 9월 고용이 2만9,000명 증가에 그치며 10월 금리 인상 확률이 약 18%로 내려간 것이 성장주 전반의 매수를 불렀다. 엔비디아의 강세로 나스닥100은 30,807.93(+1.00%)으로 종가 기준 사상 최고를 기록했고 필라델피아 반도체지수는 13,136.68(+2.40%)로 올랐다. 다만 장 후반 10년물 금리가 5.294%로 되오르면서 종가는 저가 \$233.60 부근이었고, AMD(AMD)는 \$633.91(+2.95%)로 더 크게 올랐다.

**4. 씨게이트 테크놀로지 (STX) −10.21% — 도시바가 AI 데이터센터용 HDD 생산능력을 2027 회계연도까지 두 배로 늘린다는 닛케이 보도, 점유율 30% 목표, 웨스턴디지털 −10.22% 동반 급락**
씨게이트는 시가 \$820.87·저가 \$791.75(−16.27%)까지 밀렸다가 \$848.99(−\$96.58, −10.21%)로 마감했고 웨스턴디지털(WDC)도 저가 \$396.57(−14.27%)을 거쳐 \$415.29(−\$47.27, −10.22%)로 급락했다. 닛케이는 일본 도시바가 필리핀 공장을 중심으로 AI 데이터센터용 하드디스크 생산능력을 2027 회계연도까지 두 배로 늘리고 저장 용량 기준 점유율 30%를 목표로 한다고 보도했다. 두 회사는 연초 대비 씨게이트 200% 이상·웨스턴디지털 140% 이상 올랐는데, 상승 근거가 '공급이 빠듯해 가격 결정력이 커진다'는 것이었던 만큼 경쟁사 증설 발표가 직접적인 매도 재료가 됐다. 씨게이트의 데이브 모슬리 최고경영자는 앞서 "전체 출하 대수는 사실상 늘지 않고 있다"고 했고, 회사의 니어라인 생산분은 2027년까지 거의 배정이 끝난 상태다.

**5. 온세미 (ON) +6.01% — 시냅틱스 인수 조건을 주당 \$123 전액 현금으로 수정, 총액 약 \$70억 → 약 \$57억으로 축소, 모건스탠리의 확약 부채 금융**
온세미는 시가 \$84.75에서 고가 \$86.45(+7.95%)까지 오른 뒤 \$84.89(+\$4.81, +6.01%)로 마감했다. 회사는 시냅틱스 인수 계약을 수정해 대가를 주당 \$123 전액 현금으로 바꿨고, 총 지분 가치는 종전 약 \$70억에서 약 \$57억으로 줄었다. 자금은 보유 현금과 모건스탠리가 확약한 부채 금융으로 마련하며 수정 계약에는 자금 조달을 조건으로 하는 종결 조항이 없고, 거래는 미 연방거래위원회(FTC) 승인을 이미 받아 2027년 중반 종결이 목표다. 인수 총액이 약 \$13억 줄어든 조건 변경이 온세미 주주에게 유리한 것으로 받아들여진 것으로 풀이된다.

**6. 시냅틱스 (SYNA) +14.08% — 온세미의 수정 인수 제안: 주당 \$123 전액 현금, FTC 승인 완료, 2027년 중반 종결 예정, 종가는 인수가 대비 약 1.5% 낮은 \$121.10**
시냅틱스는 시가 \$121.66·고가 \$121.98(+14.91%)로 갭 상승한 뒤 \$121.10(+\$14.95, +14.08%)로 마감해 인수가 \$123과의 차이를 약 1.5%로 좁혔다. 온세미와 맺은 수정 합병 계약에 따라 인수 대가는 주식이 섞인 종전 구조에서 주당 \$123 전액 현금으로 바뀌었고, 회사는 이번 조건이 "현재 가치 대비 의미 있는 프리미엄으로 가치의 확실성을 제공한다"고 발표했다. 총액은 약 \$57억으로 종전 약 \$70억보다 줄었지만, 시냅틱스 주주에게는 전일 종가 \$106.15 대비 약 16% 높은 현금 대가가 확정된 셈이다. 회사는 주주총회 위임장 자료를 증권거래위원회에 제출할 예정이며 FTC 외 다른 규제 당국의 심사가 남아 있다.

**7. 브로드컴 (AVGO) +3.35% — 월가 은행단이 앤스로픽 등 AI 고객을 위한 약 \$600억 규모 AI 칩 금융 조달에 착수, 전일 '\$420억 대출' 하락분(−2.15%) 회복**
브로드컴은 시가 \$349.86·저가 \$347.42에서 고가 \$357.35(+3.99%)까지 오른 뒤 \$355.14(+\$11.50, +3.35%)로 마감했다. 브로드컴과 월가 은행단이 앤스로픽을 비롯한 AI 고객의 칩 구매·임대를 뒷받침할 약 \$600억 규모의 신규 금융을 모으기 시작했다는 보도가 나왔다. 전일에는 앤스로픽에 최대 \$420억을 빌려준다는 공시로 '순환 투자' 논란이 불거졌는데, 이날은 대규모 금융 조달이 AI 칩 수요를 뒷받침한다는 쪽으로 해석이 기운 것으로 풀이된다. 전일 주가는 이 대출 공시에 \$343.64(−2.15%)로 내렸는데 하루 만에 하락분을 모두 되돌렸고, 시가총액은 약 \$1조6,400억이다. 9월 고용 부진으로 10월 금리 인상 확률이 약 18%로 내려가 대형 AI 반도체 전반에 매수가 들어온 것도 힘을 보탰다.

**8. 테라다인 (TER) +8.00% — AI 데이터센터·고성능 컴퓨팅용 메모리 테스트 장비 '매그넘 E2'와 광·마이크로LED 테스트 장비 '아이리스 100' 발표, GS 마이크로일렉트로닉스와 다년 계약**
테라다인은 시가 \$428.49에서 고가 \$451.77(+8.65%)까지 오른 뒤 \$449.04(+\$33.25, +8.00%)로 마감했다. 회사는 AI 데이터센터와 고성능 컴퓨팅용 메모리를 겨냥한 테스트 장비 매그넘 E2, 광학·마이크로LED 테스트로 영역을 넓힌 아이리스 100, AI 대응 협동로봇 유니버설 로봇 7세대를 잇따라 발표했다. 여기에 GS 마이크로일렉트로닉스와 새 반도체 테스트 센터에 장비를 공급하는 다년 계약을 맺었고 인도 벵갈루루에 사무소를 열어 현지 반도체 육성 사업에 참여한다. 2분기 매출은 \$13.3억, 총마진은 약 59%였고, 고대역폭메모리(HBM) 등 AI 메모리의 테스트 수요가 늘어난다는 기대가 필라델피아 반도체지수 +2.40%와 맞물려 매수를 불렀다.

스페이스X는 시가 \$149.55·저가 \$149.34에서 출발해 고가 \$159.84(+7.95%)까지 오른 뒤 \$158.96(+\$10.89, +7.35%)로 장중 고가 부근에서 마감했다. 회사는 13시간이 채 안 되는 사이에 세 차례 발사를 모두 성공시켰다고 발표했고, 발사 빈도가 높아질수록 위성 인터넷과 발사 서비스 매출이 함께 늘어나는 구조라는 점이 다시 부각됐다. 같은 날 9월 고용이 2만9,000명 증가에 그쳐 10월 금리 인상 확률이 약 18%로 내려가면서 고평가 성장주 전반에 매수가 들어온 것도 상승폭을 키웠다. 테슬라(TSLA)도 인도량 호조로 \$370.59(+4.65%)로 올라 일론 머스크 관련 종목이 동반 강세였다.

- **환율·유가 — 원/달러 1,350.6원(−7.8원), 달러 약세(유로/달러 1.1257), WTI \$91.11(−1.90%).** 달러 약세와 유가 하락은 외국인 수급과 항공·화학에 우호적이고, 금요일 급등한 정유주(SK이노베이션 +10.32%·S-Oil +11.69%)에는 차익 실현 빌미가 될 수 있다. G7의 최대 1억 배럴 방출이 유가 상단을 누르는지 지켜볼 필요가 있다.
- **전기차·2차전지 — 테슬라 +4.65%(3분기 인도 48만6,532대, 예상 상회).** 인도량이 2분기 대비 1.3% 늘며 예상치를 2만4,000대 넘게 웃돌았지만 에너지 저장장치 설치는 13.7GWh로 예상 15.9GWh에 못 미쳐, 국내 2차전지주에는 전기차 쪽은 우호적·ESS 쪽은 중립적인 재료다.
- **소비 — 나이키 −3.64%(연간 매출 한 자릿수 후반 감소 전망·감원).** 미국 고용 둔화와 맞물려 소비 둔화 우려가 커질 수 있어 국내 의류 OEM 업체에는 부담 요인이다.
