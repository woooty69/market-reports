## 🗓 시장 요약

**① 재무부가 금리를 잡으려다 오히려 밀어올렸다**
스콧 베선트 재무장관이 시장의 '열기'를 식히겠다며 내놓은 카드가 역효과를 냈다. 재무부는 **10~20년 만기 국채 60억 달러 규모 환매(buyback)**를 발표했다. 직전 장기물 환매의 **3배** 규모였지만, 월가 일부가 **70억~80억 달러**의 더 공격적인 환매를 기대하고 있었던 탓에 **기대에 못 미친다**는 평가가 나왔다. 채권이 급락(금리 급등)했고 주식도 함께 밀렸다.

**② 10년물이 2023년 11월 이후 최고를 찍었다**
10년물 금리가 장중 **4.85%**까지 올라 **2023년 11월 이후 최고 수준**을 기록하고 **4.845%(+5.3bp)**로 마감했다. 20년물과 30년물은 장중 **5.3%**를 찍었고 각각 5.296%, 5.295%로 끝났다. 정책금리에 민감한 2년물도 **4.436%(+3.6bp)**로 올랐다. **곡선 전 구간이 위로 평행 이동**한 하루였다.

**③ 유가는 100달러 선을 되찾았다**
브렌트 11월물이 **배럴당 \$101을 넘어 5월 이후 처음으로 세 자릿수**로 올라섰고, WTI는 **\$96.69(+3.93%)**로 마감해 **7거래일 연속** 상승했다. 미국과 이란의 군사 충돌이 격화된 것이 직접 원인이다. 금리와 유가가 같은 방향으로 움직이면 **물가와 할인율이 동시에 나빠진다** — 이날 주식이 버틸 재료가 없었던 구조다.

**④ 3대 지수가 사흘 연속 내렸다**
다우가 **405.41포인트(−0.77%)** 내린 **52,380.66**으로 낙폭이 가장 컸고, 나스닥 **−0.64%(26,253.34)**, S&P 500 **−0.48%(7,636.49)** 순이었다. VIX는 **16.46(+4.71%)**으로 올랐다. 여기에 **미국-캐나다 무역 분쟁 격화**가 겹치며 위험자산 전반의 선호가 약해졌다.

**⑤ 메타가 개인용 AI 에이전트 '뮤즈'를 내놨다 — +6.55%**
메타가 화요일 밤 블로그를 통해 **"모두를 위해 만든 세계 최초의 개인 AI 에이전트"**라는 **뮤즈(Muse)**를 공개했다. 단순 챗봇을 넘어 더 복잡한 과업을 수행하며, **월 20달러와 100달러의 유료 구독 등급**이 함께 붙었다. 주가는 장중 **+7.2%**까지 올랐다가 **+6.55%(\$653.69)**로 마감했다. 시장이 반응한 지점은 기술이 아니라 **AI 대규모 지출에 대응하는 첫 소비자 직접 과금 경로**가 제시됐다는 사실이다.

**⑥ 반대편에서 알파벳이 2.28% 빠졌다**
뮤즈가 겨냥한 영역이 **구글이 제미나이로 구축해 온 소비자 에이전트 표면**과 정면으로 겹친다. 애널리스트들은 뮤즈가 **쇼핑·여행·일정 같은 일상 의도(daily consumer intent)**를 선점하면 검색 사업에 위협이 될 수 있다고 지적했다. 알파벳은 **2분기 자본지출 449억 2,000만 달러**, **잉여현금흐름 −59억 달러**, **자사주 매입 중단**이라는 재무 상황도 함께 부담으로 거론됐다.

**⑦ 애플은 접히는 아이폰을 공개했지만 주가는 −0.28%**
애플이 **'서프라이즈 앤 샤인(Surprise and shine)'** 키노트에서 첫 폴더블 **아이폰 듀오(iPhone Duo)**를 공개했다. 시작가 **\$1,999(256GB)**, 최대 2TB, 펼치면 **7.6인치** 화면이며 여권 크기·모서리가 둥근 형태다. **예약 10월 16일, 출시 10월 23일**. 아이폰 18 프로·프로맥스, 에어팟 5, 애플워치 시리즈 12·울트라 4도 함께 나왔다. 이번 행사는 이달 팀 쿡에게서 자리를 넘겨받은 **존 터너스(John Ternus) 신임 CEO의 첫 키노트**였다. 그럼에도 주가는 **−0.28%**에 그쳐, 신제품이 자동으로 주가 재료가 되지는 않았다.

**⑧ 그런데 반도체는 또 홀로 올랐다 — SOX +0.37%**
3대 지수가 모두 내린 날 필라델피아 반도체지수는 **+0.37%(11,931.32)**로 올랐다. AMD **+3.04%**, 마이크론 **+2.75%**, 인텔 **+1.69%**, 퀄컴 **+1.33%**, 샌디스크 **+1.51%**가 지수를 끌었다. 반면 엔비디아 **−0.91%**, 브로드컴 **−1.13%**은 내려 **로직 대장주보다 메모리·CPU 쪽에 매기가 쏠린** 구도가 이어졌다.

**⑨ 에너지주가 지수 방어의 유일한 축이었다**
엑슨모빌 **+2.22%(\$164.23)**, 셰브론 **+1.91%(\$213.81)**로 정유·에너지가 올랐다. 유가 100달러가 지수에는 악재지만 에너지 섹터에는 그대로 실적 재료다. **같은 사건이 섹터별로 정반대 부호를 갖는** 국면이 유가·금리 양쪽에서 반복되고 있다.

**⑩ 한국은 마침내 칠천피에 안착했다**
코스피가 **+97.12p(+1.40%) 오른 7,051.64**로 마감해 **종가 기준 7,000선을 넘어섰다**. 전일 장중 7,171까지 올랐다가 되밀렸던 것을 하루 만에 되돌린 것이다. 코스닥도 **830.37(+2.28%)**로 강세였다. SK하이닉스는 **1,856,000원(+63,000원, +3.51%)**에 마감했고 **외국인 +4만 1,716주·기관 +7만 4,984주**가 동반 순매수, 개인은 **−75만 2,453주** 순매도였다. 거래대금 **10조 8,474억원**, 시가총액 **1,355조 7,938억원**. 원/달러는 **1,341.0원(−0.5원)**으로 소폭 내렸다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  에너지 — 브렌트 100달러 돌파의 직접 수혜**
엑슨모빌 **+2.22%**, 셰브론 **+1.91%**. 브렌트 11월물이 **\$101**을 넘어 **5월 이후 처음으로 세 자릿수**에 올라섰고 WTI는 **\$96.69(+3.93%)**로 **7거래일 연속** 상승했다. 미국-이란 군사 충돌 격화가 공급 차질 우려를 키웠다.

**상승 ②  반도체 — 지수와 반대로 움직인 사흘째**
SOX **+0.37%(11,931.32)**. AMD **+3.04%**, 마이크론 **+2.75%**, 샌디스크 **+1.51%**, 인텔 **+1.69%**, 퀄컴 **+1.33%**, SK하이닉스 ADR **+7.05%**. 금리 급등이라는 역풍에도 **AI 메모리 수요와 가격 인상**이라는 산업 재료가 더 크게 작동했다.

**상승 ③  소셜·플랫폼 — 메타 단독**
메타 **+6.55%(\$653.69)**. **개인 AI 에이전트 '뮤즈' 공개와 월 20달러·100달러 유료 구독 등급 도입**이 재료였다. 다만 이 상승은 섹터 전반이 아니라 **메타 한 종목의 개별 재료**였다 — 같은 날 알파벳은 **−2.28%**, 아마존은 **−1.78%**로 내렸다.

**하락 ①  채권 대체 성격의 대형주 — 금리가 눌렀다**
10년물이 **4.845%(장중 4.85%)**로 2023년 11월 이후 최고에 닿으면서 이익이 먼 미래에 몰린 종목이 눌렸다. 알파벳 **−2.28%**, 세일즈포스 **−1.99%**, 아마존 **−1.78%**, 브로드컴 **−1.13%**, 넷플릭스 **−0.96%**, 엔비디아 **−0.91%**, 마이크로소프트 **−0.47%**.

**하락 ②  소프트웨어 — 이틀째 약세**
세일즈포스 **−1.99%(\$244.16)**, 마이크로소프트 **−0.47%**. 전날 오픈AI 신모델 우려로 무너진 데 이어, 이날은 **메타 뮤즈까지 소비자·업무 에이전트 시장에 진입**하면서 구독 소프트웨어의 해자에 대한 질문이 다시 제기됐다.

**하락 ③  지수 전반 — 사흘 연속**
다우 **−0.77%**, 나스닥 **−0.64%**, S&P 500 **−0.48%**로 3대 지수가 모두 사흘째 내렸다. VIX는 **16.46(+4.71%)**으로 올랐지만 절대 수준은 여전히 낮아, **패닉이 아니라 할인율 재조정**의 성격이 짙다.

> 🇰🇷 [전달] **코스피200 야간선물은 1,113.95(−5.05, −0.45%)**로 마감했다. 시가 **1,118.70**으로 출발해 고가 **1,128.55**까지 올랐다가 저가 **1,102.00**까지 밀린 뒤 하단 부근에서 끝났다. 역산한 당일 정규장 선물 종가는 **1,119.00**이다. 미 3대 지수가 모두 내린 날 야간선물도 함께 밀렸으나, **SOX +0.37%·SKHY +7.05%** 덕에 낙폭은 −0.45%로 제한됐다. 거래량 **5,589계약**, 미결제약정 **110,070계약(+144)**. ⚠️ 직전 회차 종가(1,105.00) 대비 이 세션의 `prevClose`는 **1,108.85**로 3.85p 차이가 나는데, **9월 10일 선물·옵션 만기에 따른 최근월물 교체** 구간이어서 기준 계약이 달라진 영향으로 보인다.
>
> [수급] 전일 국내는 코스피 **7,051.64(+1.40%)**로 **종가 기준 7,000선 첫 안착**, 코스닥 **830.37(+2.28%)**로 동반 강세였다. SK하이닉스는 **1,856,000원(+3.51%)**, **외국인 +4만 1,716주·기관 +7만 4,984주 동반 순매수**(개인 −75만 2,453주). 거래대금 **10조 8,474억원**, 시가총액 **1,355조 7,938억원**, 외국인 보유율 **50.67%**. 원/달러 **1,341.0원(−0.5원)**. 괴리율은 **+39.3% → +43.5%**로 4.2%p 확대됐다 — 국내(**+3.51%**)도 크게 올랐지만 ADR(**+7.05%**)이 그 두 배로 올랐기 때문이며, 원화 강세(−0.5원)로도 상쇄되지 않았다.

**[시장의 시선]** 이날의 핵심은 **정책 당국의 개입이 반대로 작동했다**는 점이다. 재무부의 60억 달러 환매는 직전 대비 3배였는데도 **시장이 기대한 70억~80억보다 작았다는 이유로 금리를 올렸다**. 개입의 절대 규모가 아니라 **기대 대비 크기**가 가격을 결정한 사례다.

두 번째는 **AI 경쟁의 무게중심이 인프라에서 소비자 과금으로 옮겨간 정황**이다. 메타 뮤즈는 모델 성능이 아니라 **월 20달러·100달러라는 가격표**로 평가받았고, 같은 재료가 알파벳에는 **−2.28%**로 반영됐다. 그동안 'AI 지출'은 비용 항목이었는데 이제 **누가 그 비용을 소비자에게 청구할 수 있느냐**가 종목을 가른다.

세 번째는 **애플 사례**다. 20년 아이폰 역사상 가장 큰 변화라는 폴더블을 공개하고 신임 CEO의 첫 키노트였는데도 주가는 **−0.28%**였다. 지난주 테슬라 사이버캡에 이어 **대형 신제품 공개가 주가 재료로 작동하지 않는 패턴**이 두 번 연속 확인됐다.

주시할 변수는 세 가지다 — **①오늘(9/10) 발표되는 8월 PPI와 내일(9/11) CPI**, **②9월 FOMC 인상 확률 60.1%**, **③괴리율 +43.5%**가 어디까지 벌어지는지. 오늘은 **KOSPI200 선물·옵션 만기일**이기도 하다.

다음 확인 지점은 **9월 30일 실적 발표**다. 가격 인상이 실제 마진으로 확인되는지가 메모리 슈퍼사이클 고점 논쟁의 분기점이 된다.

- **📉 국채 환매 — 규모가 아니라 기대 대비가 중요하다:** 재무부의 **60억 달러** 환매는 직전 대비 3배였는데도 시장 기대(**70억~80억**)에 미달해 **금리를 올렸다**. 다음 환매 발표에서도 **절대 규모가 아니라 서프라이즈 여부**를 봐야 한다.
