## 🗓 시장 요약

**① 증안펀드 기대에 코스피 4,800선 회복·코스닥 +5.8% 매수 사이드카 — 외국인 양 시장 순매수**
정부가 증안펀드 투입 준비에 착수하고 일일 자사주 매입 한도를 완화하는 등 시장 안정 조치를 내놓은 뒤, 오늘 오전 투입 기대가 커지며 코스닥이 장중 6% 가까이 뛰어 매수 사이드카가 걸렸다. 코스피는 장 초반 4,682선까지 밀렸지만 고점 4,852.14까지 반등해 하루 상승폭이 130포인트를 넘었다. 외국인은 코스피 +4,686억원, 코스닥 +1,796억원을 순매수했고 기관도 코스닥에서 +2,557억원을 샀다.

**② 반도체·대형주 — 삼성전자 17만 6천원대 +3.2%, SK하이닉스 거래대금 1위**
SK하이닉스는 1,079,000원(+2.47%)으로 거래대금 1조 4,533억원을 기록해 시장 1위였고, 삼성전자는 176,800원(+3.21%)·우선주 +4.01%로 올랐다. 삼성전자는 3분기 배당금(1주당 4,601원)을 지급했고 외국인 배당금이 15조원으로 역대 최대라는 보도에 재투자 수급 기대도 나왔다. 반도체 장비는 주성엔지니어링(+11.22%)·피에스케이홀딩스(+11.69%)·케이씨텍(+10.40%)이 급등했지만 삼성전기(+1.91%)·심텍(+0.39%)은 상대적으로 약했다.

**③ 주도·약세 업종 — 바이오·로봇·통신장비·증권·방산 강세, 통신·백화점·화장품·은행 약세**
생명과학도구(+9.42%)·생물공학(+7.49%)·통신장비(+7.40%)·증권(+6.44%)·우주항공과국방(+6.32%)이 업종 상위였다. 삼성전자의 휴머노이드 공개 기대와 '2040년 휴머노이드 수요 800만대' 전망이 겹쳐 로봇주 82개 중 78개가 올랐고, 사우디 정유시설 공습 소식에 방산주가 강했다. 반면 다각화된통신(−2.80%)·백화점(−2.46%)·화장품(−1.20%)·은행(−0.54%)은 약세였고 코스맥스(−6.39%)가 하락률 상위였다.

**④ 환율·해외 변수 — 원/달러 1,342원, 미국 지수 선물·아시아 증시 동반 강세**
원/달러는 1,342.00원(−2.00원)으로 소폭 내렸다. 나스닥100 선물이 +1.77%, S&P500 선물이 +0.86%로 강하고 닛케이225(+1.17%)·항셍(+0.87%)도 올랐다. 미국 증시는 추수감사절 휴장 뒤 오늘 밤 단축 거래로 열리며, 전날 한국은행이 기준금리를 3.25%로 올린 뒤 남은 긴축 부담과 다음 주 젠슨 황 청문회·미국 고용지표가 변수다.

## 1. 업종별 흐름

**상승 업종** — 생명과학도구및서비스(+9.42%, 32종목 상승·4종목 하락)와 생물공학(+7.49%, 51종목 상승·3종목 하락)이 1·2위였다. 에이비엘바이오(+21.11%)·리가켐바이오(+17.64%)·올릭스(+14.74%)·디앤디파마텍(+13.58%)이 이끌었다. 통신장비(+7.40%)는 케이엠더블유(+15.40%)·LIG아큐버(+14.09%)가, 증권(+6.44%)은 키움증권(+12.25%)·한국금융지주(+11.51%)·미래에셋증권(+9.61%)이, 우주항공과국방(+6.32%)은 한화시스템(+11.93%)·LIG디펜스앤에어로스페이스(+8.97%)가 끌어올렸다. 전기장비(+6.05%)는 32종목이 모두 올랐다.

**하락 업종** — 다각화된통신서비스(−2.80%)·백화점과일반상점(−2.46%)·화장품(−1.20%, 39종목 상승·23종목 하락)·담배(−1.17%)·은행(−0.54%)이 약했다. 코스맥스(−6.39%)·KT&G(−1.17%)·신한지주(−1.42%)·하나금융지주(−0.67%)가 하락했고, 에이피알은 브랜드501 인수 발표에도 +0.17%로 보합권이었다.

**시장의 시선** — 오후장에서는 증안펀드 투입이 실제로 결정·발표되는지, 코스닥이 700선을 넘어 마감할 수 있는지가 관건이다. 오전 상승은 기대에 기댄 소외주 반등 성격이 강해 로봇·바이오 상한가·급등주에는 오후 차익 매물이 나올 수 있고, 외국인 순매수가 대형 반도체로 이어지는지도 볼 필요가 있다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 50종목

*① 12시 현재 시총 1,000억원 이상·+10% 이상 ★ 필수 편입 40종목(1～40번, 시총 큰 순 — 해당 78종목 중 시총 상위 40) → ② 오전장 언론 최다 보도 10종목(41～50번).*

**1. ★ 한화시스템 (272210) 54,900원 · 10조 3,717억원 · +11.93% — 사우디 정유시설 공습에 중동 긴장, 방산주 장 초반 10% 급등**

## 4. 일정·관전 포인트

**오늘 오후 국내** — 정부의 증안펀드 투입 결정·발표 여부(오전 상승의 핵심 재료), 금요일 장 마감 뒤 기업 공시(공급계약·유상증자·자사주 등). 코스닥은 오전에 매수 사이드카가 이미 발동돼 오후 변동성이 클 수 있다.

**오늘 밤 해외** — 미국 증시는 추수감사절 다음 날로 단축 거래(뉴욕 13:00 마감, 한국 시간 28일 03:00). 블랙프라이데이 소비 동향과 유럽 증시 흐름. **다음 주** 한국 11월 수출(12/1), 젠슨 황 청문회, 미국 11월 고용지표가 예정돼 있다.

### 🇰🇷 오후장 관전 포인트

1. **증안펀드 '기대 → 확정' 여부** — 오전 코스닥 +5.84%·코스피 +2.86%는 투입 기대에 기댄 움직임이다. 오후에 구체적인 규모·시기가 나오지 않으면 상승폭 일부를 되돌릴 수 있다.
2. **코스닥 700선 안착** — 694.00으로 고점(695.74) 부근이다. 외국인(+1,796억원)·기관(+2,557억원) 동반 매수가 오후까지 이어지는지가 관건이다.
3. **로봇·바이오 급등주의 차익 매물** — 시총 1,000억원 이상·+10% 이상 종목이 78개, 상한가가 8개다. 재료가 '기대'인 종목(로봇 휴머노이드, 개별 뉴스 없는 바이오)은 오후 변동성에 유의할 만하다.
4. **반도체 대형주로 수급 확산 여부** — 삼성전자(+3.21%)·SK하이닉스(+2.47%)는 지수 상승률보다 약하다. 외국인 순매수가 대형 반도체로 옮겨가야 코스피 4,850선 위 마감이 가능하다.
5. **방산·증권 강세 지속** — 중동 긴장(한화시스템 +11.93%)과 증안펀드 기대(키움증권 +12.25%)가 오후에도 이어질지, 미국 지수 선물(나스닥100 +1.77%) 강세가 유지되는지 함께 본다.

  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
