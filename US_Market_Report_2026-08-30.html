## 🗓 주말 요약

**① 지난주의 결론은 하나다 — 지수는 올랐고, 반도체만 졌다**
3대 지수는 3주 만에 상승 전환했다(**+0.49%~+0.85%**). 그런데 **SOX는 −2.35%로 2주 연속 하락**했다. 같은 주에 엔비디아가 **+8.74% → −4.58%** 롤러코스터를 탔고, 세일즈포스 **+22.60%**·옥타 **+23.30%**·크라우드스트라이크 **+20.50%**가 나왔다. **AI 내러티브는 살아 있는데 수혜가 칩에서 소프트웨어·플랫폼으로 이동한 한 주**였다. 반도체가 진 이유는 실적이 아니라 **금리와 관세** 두 가지다.

**② 주말을 지배한 뉴스는 증시가 아니라 석유였다 — 트럼프의 베네수엘라 빅딜**
트럼프 대통령이 8/28(현지시간) 트루스소셜에 **"미국은 방금 베네수엘라와 세계 역사상 최대 규모의 석유 거래에 관한 합의를 이뤘다"**고 올렸다. 내용은 **확인 매장량 650억 배럴 이상에 대한 미국의 과반 통제권 확보**이며, 그는 이것이 **"미국의 석유 매장량을 2배 이상으로 늘릴 역사적 거래"**라고 했다. 여기에 **베네수엘라의 OPEC 탈퇴 검토**(1960년 창설 멤버)와 **핵심 유전 100년 임대** 협상이 함께 진행 중이라고 블룸버그가 전했다. **이란 전쟁 6개월째에도 종전 기미가 없는 상황에서 트럼프가 찾은 우회로**이며, 8월 내내 유가에 붙어 있던 중동 프리미엄을 구조적으로 깎아내리는 재료다.

**③ 잭슨홀은 워시 한 사람이 아니라 합창이었다 — 9월 인상 확률 59.7%**
케빈 워시 의장의 **"물가 둔화 확신이 없다면 중앙은행에는 해야 할 일이 더 있다"** 발언만 부각됐지만, 실제로는 **제프리 슈미드 캔자스시티 연은 총재가 "물가 상승이 여전히 완고하다"**고 진단했고 **베스 해맥 클리블랜드 연은 총재는 "지금이 행동에 나설 때"**라고 못박았다. 근거는 **8/26 발표된 7월 PCE 3.7%**(시장 전망치 3.6% 상회, 6월과 동일)와 **근원 PCE 3.3%**다. CME 페드워치의 9월 인상 확률은 연설 전 **35.4%**에서 **57~59.7%**로 뛰었고, **10월 71%·12월 87%**까지 밀려 올라갔다. **단발 이벤트가 아니라 연말까지의 경로 전체가 재조정된 것**이 핵심이다.

**④ 그런데 재무부는 반대 방향으로 움직였다 — 베선트 바이백 2배 확대**
스콧 베선트 재무장관은 같은 국면에서 **장기 국채 바이백 규모를 회당 20억 달러에서 최소 40억 달러로 두 배 확대**하겠다고 발표했다. 높은 시장금리를 긍정적으로 평가한 워시 의장과 **정면으로 엇갈린 신호**다. 결과는 표에 그대로 찍혔다 — 정책 기대에 민감한 **2년물이 주간 +10.8bp(4.348%)** 오르는 동안 **10년물은 −1.4bp(4.720%)로 오히려 내렸다.** 통화정책은 조이고 재정당국은 장기물을 사주는 구도이며, **커브가 눌리는 베어 플래트닝**이 그 흔적이다. 다만 지난주 경험상 바이백의 효과는 **하루짜리**였다.

**⑤ 국내는 지수와 체감이 정반대로 갈렸다 — 코스피 −1.79%, 코스닥 +4.55%**
한 주 동안 **코스피는 1.79% 내렸는데 코스닥은 4.55% 올랐다.** 지난주 초까지의 구도(대형주 강세·중소형주 붕괴)가 **한 주 만에 완전히 뒤집힌 것**이다. 코스피를 누른 것은 금요일 하루의 **반도체 2차 관세 검토 보도**였고, 삼성전자 **−3.38%**·SK하이닉스(000660) **−4.45%**로 투톱이 동반 급락하며 외국인이 **1조 7,600억원**을 팔았다. 반면 한국은행은 8/27 기준금리를 **3.00%로 2회 연속 인상**하면서 올해 성장률 전망을 **2.6% → 3.3%로 대폭 상향**했다. **긴축인데 경기 전망은 좋아진**, 해석이 갈리는 조합이다. 원/달러는 **1,372.5원**으로 13개월 최저까지 내려왔다.

## 📰 섹션 1. 한 주간(8/24~8/28) 주요 뉴스 5선

**1. 엔비디아 FY27 2분기 — 매출 전년비 +106%, 그런데 이틀 만에 반납했다**
8/26 장 마감 후 발표된 실적에서 **매출이 전년 동기 대비 106% 증가**했다. 다음 날 주가는 **+8.74%** 폭등했고, 그 다음 날 **−4.58%**로 되밀렸다. 회사가 실적 발표에서 직접 경고한 **메모리 부품 부족**은 원가 상승 요인이고, 여기에 관세 보도가 겹쳤다.
**투자자 함의:** 실적은 더 이상 방어막이 아니다. AI 사이클의 **지속성**은 확인됐지만 **수익성과 정책 리스크**가 새 변수로 올라섰다. 국내 HBM 밸류체인 입장에서는 "엔비디아 물량은 늘어나는데 그 물량의 원가와 관세는 누가 부담하는가"가 다음 분기의 질문이 된다.

**2. 워시 의장의 첫 잭슨홀 — 금리 경로가 통째로 위로 밀렸다**
9월 인상 확률이 하루 만에 **35.4% → 57~59.7%**로 뛰었다. 근거는 **7월 PCE 3.7%(예상 3.6% 상회)**와 **근원 PCE 3.3%**다. 현행 기준금리 **3.50~3.75%**가 **3.75~4.00%**로 올라갈 가능성을 시장이 동결(42.5%)보다 높게 보기 시작했다.
**투자자 함의:** 한국은행이 8/27 이미 3.00%로 올린 상태라 **한미 동시 긴축** 시나리오가 처음으로 실체를 갖췄다. 할인율이 올라가면 **"먼 미래의 매출"에 붙는 프리미엄이 먼저 깎인다** — 마벨이 가이던스를 올리고도 −10.30% 맞은 것이 그 표본이다.

**3. 미국의 반도체 2차 관세 검토 — 완제품까지 확대 사정권**
폴리티코·로이터 보도에 따르면 트럼프 행정부가 관세 대상을 **노트북·게임 콘솔·데이터센터용 서버 등 반도체가 들어가는 완제품까지 확대**하는 방안을 검토 중이다. 지난 1월 서명한 **재수출 반도체 25% 관세** 포고문의 예외 조항이 유지되지 않을 수 있다는 관측도 나왔다. 백악관은 **"공식 발표 전 관세 관련 보도는 추측으로 봐야 한다"**는 입장이다.
**투자자 함의:** 이 보도 하나가 금요일 **코스피만 −1.79%** 빠뜨렸다(S&P500 −0.25%). **한국 시장이 미국 시장보다 미국 정책 리스크에 더 크게 노출돼 있다**는 구조가 재확인됐다. 관세율·범위·시점이 구체화되기 전까지 삼성전자·SK하이닉스에는 **정책 리스크 프리미엄**이 붙는다.

**4. 한국은행 3.00% 인상 — 그런데 성장률 전망은 2.6%에서 3.3%로 올렸다**
금통위가 8/27 기준금리를 **2.75% → 3.00%**로 두 달 연속 인상했다. 동시에 올해 성장률 전망치를 **2.6%에서 3.3%로 대폭 상향**했다. 반도체 경기 호조에 따른 수출·투자 증가와 내수 회복을 근거로 들면서, 물가가 상당 기간 목표를 웃돌 것으로 보고 선제 대응에 나섰다.
**투자자 함의:** 통방문의 문구가 **'금리 인상 기조를 이어 나갈 필요'에서 '추가 인상의 시기와 속도 등을 결정해 나갈 것'**으로 바뀌었다. 시장은 이를 **속도 조절 신호**로 읽었다. 성장률 상향은 이익 전망에 우호적이지만, 연속 인상은 밸류에이션 할인율을 올린다 — **EPS는 좋아지고 PER은 눌리는** 조합이다.

**5. 소프트웨어의 대반전 — "AI가 SaaS를 죽인다"는 서사가 실적으로 뒤집혔다**
8/27 세일즈포스가 **+22.60%**, 옥타 **+23.30%**, 크라우드스트라이크 **+20.50%** 폭등했다. 세일즈포스는 2분기 조정 EPS **5.90달러**로 LSEG 컨센서스 **3.27달러**를 압도했고 연간 매출·이익 전망을 동시에 상향했다. 다음 날에도 **+1.60%**로 상승이 이어져 일회성 반등이 아님을 확인했다.
**투자자 함의:** 자금이 **"AI를 만드는 쪽"에서 "AI를 파는 쪽"**으로 이동했다. 같은 주에 아마존 +4.00%, 알파벳 +1.70%, MS +1.68%가 함께 올랐다. AI 자본지출의 **부담은 칩 공급망이 지고 과실은 클라우드·소프트웨어가 가져간다**는 구도가 가격에 찍혔다.

## 🔍 섹션 2. 휴장·주말 신규 뉴스 5선

**1. 트럼프-베네수엘라 석유 빅딜 — 확인 매장량 650억 배럴, 미국이 과반 통제**
트럼프 대통령이 8/28(현지시간) 트루스소셜에 합의 사실을 직접 올렸다. 루비오 국무장관·헤그세스 전쟁부 장관이 **델시 로드리게스 임시 대통령**과 협의했고, **민간 기업과의 파트너십을 통해 미국 납세자 부담 없이** 과반 통제권을 확보했다는 설명이다. 올해 1월 마두로 전 대통령 축출 작전 이후 약 9개월 만이다. 별도로 블룸버그는 **베네수엘라가 OPEC을 탈퇴하는 대신 핵심 유전을 미국에 100년 임대**하는 방안을 협상 중이라고 보도했다.
**→ 다음 개장일 관전 포인트:** **유가의 방향이 바뀔 수 있는 구조적 재료**다. OPEC 쿼터에서 벗어나면 베네수엘라는 생산량을 최대한 끌어올릴 수 있다. 이란 전쟁 프리미엄과 정면으로 맞서는 힘이므로, WTI가 **\$83선 아래로 추가 이탈**하는지가 첫 확인 지점이다. 국내에서는 **정유·화학의 재고평가 부담** vs **항공·해운·전력의 원가 개선**으로 방향이 갈린다. 물가 경로가 낮아지면 금리 부담도 함께 완화된다.

**2. 잭슨홀의 매파 합창 — 슈미드 "물가 완고", 해맥 "지금이 행동할 때"**
워시 의장 개인의 발언으로만 소비됐던 잭슨홀이 실제로는 **연준 인사 다수의 정렬된 매파 메시지**였다는 사실이 주말 보도로 정리됐다. 인상 확률 경로는 **9월 57~59.7% → 10월 71% → 12월 87%**다. 다만 워시 의장 본인은 **특정 회의의 정책 결정을 사전에 약속하지 않았고**, 향후 지표에 따라 판단하겠다는 기존 입장을 유지했다.
**→ 다음 개장일 관전 포인트:** 확률이 이미 60% 가까이 반영됐다는 것은 **이번 주 지표가 확률을 되돌릴 여지도 그만큼 크다**는 뜻이다. **9/4 미국 8월 고용보고서**가 최대 분수령이며, 고용 둔화가 확인되면 금리 부담이 낮아진다.

**3. 베선트, 장기 국채 바이백 2배 확대 — 재무부와 연준의 엇박자**
재무장관이 **회당 20억 달러였던 장기 국채 재매입 규모를 최소 40억 달러로 두 배 확대**하겠다고 발표했다. 높은 시장금리를 긍정적으로 평가한 워시 의장과 방향이 정반대다.
**→ 다음 개장일 관전 포인트:** 지난주 한 차례 바이백 확대는 **하루 만에 효력을 잃었다.** 바이백으로 못 건드리는 것들 — **재정적자·국채 공급·기간 프리미엄** — 이 그대로이기 때문이다. **30년물 5.20%**가 다시 5.3%를 넘으면 반도체·고밸류 성장주가 지난주와 같은 압박을 받는다.

**4. 반도체 2차 관세 — 백악관은 "부인"이 아니라 "추측"이라고 했다**
백악관의 공식 반응은 **"공식 발표 전 관세 관련 보도는 추측으로 봐야 한다"**였다. 쿠시 데사이 대변인은 별도로 **반도체 제조업의 리쇼어링이 "트럼프 대통령의 최우선 과제"**라는 입장을 분명히 했다. 즉 **내용을 부인한 것이 아니라 시점만 유보한 것**에 가깝다.
**→ 다음 개장일 관전 포인트:** 주말 사이 **공식 부인이나 범위 축소는 나오지 않았다.** 금요일 국내 증시는 이 재료로 이미 −1.79% 반영했지만, **미 반도체지수의 −3.47%는 아직 반영하지 못한 상태**다. 월요일 삼성전자·SK하이닉스의 갭 처리 방식이 이번 조정의 성격(단기 충격 vs 추세 전환)을 가른다.

**5. 국내 — 삼성바이오로직스 3조 유상증자, 그리고 증권가 눈높이의 반전**
삼성바이오로직스(207940)가 8/28 **227만 주 신주 발행 증권신고서**를 제출했다. 예정 발행가액 **132만 2,000원** 기준 모집 총액 **3조 9억원**이며, 대부분이 스위스 **폴리펩타이드그룹**(펩타이드 CDMO) 인수 자금, 나머지 **2,948억원**이 송도 제2바이오캠퍼스 증설 시설자금이다. 유동비율 179.7%·부채비율 51.3%의 우량 재무에서 회사채가 아닌 유증을 택한 데 대한 반발로 주가는 **−6.78%(148만 6,000원)** 급락했다.
한편 에프앤가이드 집계로 **최근 1주일 증권사 목표주가 상향 47건이 하향 42건을 앞질러 흐름이 역전**됐다. 8월 전체로는 상향 355건·하향 562건으로 여전히 하향 우위지만, **하향 827건이 상향 411건의 두 배였던 7월**과 비교하면 확연히 진정됐다.
**→ 다음 개장일 관전 포인트:** 바이오는 **자금조달 방식에 대한 주주 반발**이라는 개별 이슈이지만, 금감원 심사 과정에서 변동성이 이어질 수 있다. 목표가 상향 역전은 **이익 전망이 실제로 올라오고 있다**는 신호이며, 코스피 12개월 선행 EPS가 지난달 말 대비 **약 6% 증가**한 반면 선행 PER은 오히려 낮아졌다는 점이 이를 뒷받침한다.

## 🎯 섹션 3. 다음 개장일(8/31 월) 섹터별 전망

**⚠️ 반도체 — 미반영분 −3.47%를 어떻게 처리하느냐가 전부다**
금요일 국내 증시는 **관세 재료로 먼저 빠졌고**(코스피 −1.79%, 삼성전자 −3.38%, SK하이닉스 −4.45%), 그 뒤 미국에서 SOX가 **−3.47%** 무너졌다. 즉 **관세는 반영됐고 미 반도체 급락은 반영되지 않은 상태**로 주말에 들어갔다. 야간선물이 장중 고가 **1,086.30(+1.71%)**까지 되돌렸다가 **1,064.20(−0.36%)**으로 되반납한 궤적이 두 힘의 충돌을 그대로 보여준다. 주말 사이 관세 관련 **공식 부인은 나오지 않았다.**
장비·소재 중소형주는 SOX 변동에 대형주보다 큰 폭으로 반응해 온 종목군이다 — 유진테크(084370)·피에스케이홀딩스(031980)·주성엔지니어링(036930)·심텍(222800)·이수페타시스(007660) 등은 SOX 대비 베타가 1을 넘어 **지수보다 진폭이 크게 나타나는 구간**에 있다.

**🛢 에너지·정유화학 — 주말 재료가 가장 직접적으로 꽂히는 곳**
베네수엘라 빅딜과 OPEC 탈퇴 검토는 **공급 확대 방향**이다. WTI는 이미 주간 **−4.20%**, 브렌트는 5%대 하락으로 중동 프리미엄을 되돌린 상태다. **정유·화학은 재고평가손 부담**, **항공·해운·전력·화학 다운스트림은 원가 개선**으로 방향이 갈린다. 다만 이란 전쟁이 진행 중이고 호르무즈 변수가 살아 있어 **양방향 변동성**은 여전하다.

**💻 소프트웨어·플랫폼 — 지난주 유일하게 이긴 섹터**
세일즈포스·옥타·크라우드스트라이크의 급등이 이틀째 유지됐고 빅테크가 동반 상승했다. **금리 상승 국면에서 현금흐름이 두껍고 이익 가시성이 높은 기업**이 선호되는 구도가 이어질 수 있다. 국내에서는 AI 플랫폼·서비스, SI, 데이터센터 인프라가 대응 축이다.

**🏦 금융·고배당 — 한미 동시 긴축의 유일한 순수혜**
한국은행 3.00%, 미국 9월 인상 확률 60% 근접이라는 조합에서 **순이자마진 개선 기대**가 붙는 유일한 업종이다. 다만 성장률 전망 상향(2.6% → 3.3%)이 함께 나왔다는 점에서 **경기 민감 대출자산의 건전성**은 오히려 우호적이다.

**🔋 2차전지 — 확산 후보로 거론되기 시작했다**
NH투자증권은 **"반도체를 코어 업종으로 유지하는 가운데 업종 확산의 고려 대상으로 2차전지와 AI 플랫폼·서비스를 추천"**했다. 반도체 쏠림이 정책 리스크로 흔들릴 때 자금이 옮겨갈 후보군이라는 논리다. 다만 이는 **금리가 안정된다는 전제**에 붙은 조건부 시나리오다.

> 🇰🇷 **[전달]** 코스피200 야간선물은 **−0.36%(1,064.20)**로 소폭 하락 마감했으나, 장중에는 정규장 종가(1,068.00)에서 출발해 **고가 1,086.30(+1.71%)까지 올랐다가 저가 1,061.70(−0.59%)까지 밀린 뒤** 되돌아온 궤적이다. **국내 급락(−1.79%)에 대한 되돌림 시도가 장 초반에 분명히 있었고, 워시 연설 이후 되반납**된 흐름이다. 즉 야간시장은 관세 충격을 **과도한 것으로 한 번 판정했다가 금리 재료에 다시 물러섰다.** 거래량 23,973계약, 미결제약정 155,518계약(▲320). 주말 사이 관세 관련 공식 부인이 없었으므로 **되돌림의 근거는 아직 보강되지 않은 상태**다.
> **[수급]** 금요일 코스피에서 외국인이 **1조 7,600억원** 순매도, 기관까지 합치면 2조원대다. SK하이닉스(000660)에서만 외국인 **−19만 235주**, 기관 **−79만 6,000주**가 나왔고 개인이 **+33만 9,503주**를 받았다. **원/달러가 1,372.5원(−8.4원)으로 13개월 최저까지 내려온 환율 우호 국면에서 외국인이 1.76조원을 팔았다**는 점이 이번 수급의 핵심이다 — 환차익 유인보다 **정책 리스크 회피가 우선했다**는 뜻이다. 반면 주주환원(삼성전자·SK하이닉스 자사주 매입)에 따른 **기타법인 수급이 외국인 매도 물량을 일부 흡수**하며 지수 하단을 받쳤다. SKHY 괴리율은 **+29.0% → +33.7%로 4.7%p 확대**됐는데, 환율이 내렸는데도 괴리가 벌어진 것은 **순수하게 국내 본주만 더 빠졌다**는 의미다.

## 💬 섹션 5. 증권가 코멘트

- **신얼(상상인증권):** **"다음주 증시는 고금리 부담감을 AI발 이익이 상쇄할 수 있는지를 확인하는 과정이 될 것"**이라며 **"AI의 이익 모멘텀이 유지되는 가운데 미 국채 장기물 금리의 안정화가 된다면 위험자산의 추가 상승 여지가 열리지만, 금리 재상승 시에는 AI 내부의 옥석 가리기가 한층 빨라질 것"**이라고 말했다.
- **나정환(NH투자증권):** **"AI 인프라 투자발 실적 성장세가 이어지는 가운데 금리 상방 우려까지 해소된다면 추가 안도랠리가 가능하다"**며 **"반도체를 코어 업종으로 유지하는 가운데 업종 확산의 고려 대상으로 2차전지와 AI 플랫폼·서비스를 추천한다"**고 밝혔다. 지수보다 **업종·종목 중심의 대응**을 권했다.
- **밸류에이션 시각:** 코스피 12개월 선행 EPS가 지난달 말 대비 **약 6% 증가**한 반면 선행 PER은 오히려 낮아져 **역사적으로 낮은 수준**이라는 분석이 나온다. 코스피200 변동성지수(VKOSPI)도 **4월 중순 수준**까지 내려와 지난달 급락 당시의 변동성이 진정됐다. 코스피는 7월 23일 **7,096.89**를 마지막으로 종가 기준 7,000선을 회복하지 못하고 있다.
- **주주환원 효과:** SK하이닉스·삼성전자의 자사주 매입으로 **기타법인 수급이 유입돼 외국인 매도 물량을 일부 흡수**했다는 것이 지난주 지수 하단 방어의 실체다. 다만 **주주환원은 밸류에이션의 하단을 받칠 뿐 상단을 만들지는 못한다.**
- **경계 시각:** 국내 증권가는 AI 공급망 전체가 동반 상승한 것이 아니라는 점을 지적하며, **메모리 가격 상승에 따른 하드웨어 기업 수익성 부담·추가 반도체 관세·높은 국채금리**를 3대 경계 요인으로 꼽고 있다.
