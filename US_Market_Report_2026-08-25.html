## 🗓 시장 요약

**① 지수는 혼조인데 반도체만 무너졌다 — 방아쇠는 '애플-중국 메모리' 보도**
다우가 **+140.15p(+0.26%, 53,417.16)**로 올랐지만 S&P 500은 **−0.28%**, 나스닥은 **−200.26p(−0.77%)**로 밀렸다. 격차를 만든 것은 반도체다. 트럼프 행정부가 **애플의 중국산 메모리 조달을 허용할 수 있다**는 보도가 나오면서 메모리주가 일제히 무너졌다. 애플이 **CXMT(창신메모리)로부터 DRAM을, YMTC(양쯔메모리)로부터 NAND**를 조달할 수 있다는 내용으로, 9월 시진핑 주석의 방미 이후 미중 긴장 완화 카드의 일부라는 해석이 붙었다. 마이크론 **−5.83%**, SK하이닉스 ADR **−4.92%**, 샌디스크 **−6.45%**, 씨게이트 **−6.51%**.

**② 그런데 국채금리는 오히려 내렸다 — 재무부 'TGA 1조 달러' 카드**
CNBC는 미 재무부가 약 **1조 달러에 달하는 재무부 일반계정(TGA)**을 장기 국채 바이백 재원으로 활용할 수 있다고 보도했다. 이 소식에 **10년물이 4.704%(−3bp)**, 지난주 5.3%를 넘어 약 20년 만의 최고 수준까지 올랐던 **30년물이 5.234%(−4bp)**로 내려왔다. 금리가 내렸는데도 나스닥이 빠졌다는 사실이 이날의 핵심이다 — **이번 하락은 금리가 아니라 산업 이슈**였다. 다만 피터 부크바 원포인트 BFG CIO는 **"단기물을 더 발행해 장기금리를 억제하려는 시도는 미국 정부의 이자 비용을 연준의 기준금리 움직임에 더욱 밀접하게 연동시킬 것"**이라며 새로운 위험을 지적했다.

**③ 엔비디아 7거래일 연속 하락 — 2022년 이후 최장**
엔비디아가 **−2.91%**로 7거래일 연속 내리며 **2022년 이후 최장 하락**을 기록했다. 블룸버그는 메모리 업체들이 일부 주요 고객사에 **AI용 메모리 가격을 15% 이상 인상**할 수 있다고 통보했다는 소식을 전했고, 이것이 **AI 하드웨어 전반의 원가 압박 우려**로 번졌다. 메모리 가격 인상은 공급사에는 호재지만 이날은 메모리주도 함께 빠졌다 — 애플-중국 이슈가 그 호재를 덮어버린 셈이다. 8/26(현지) 실적 발표를 앞둔 디리스킹 매도까지 겹쳤다.

**④ 트럼프, 캐나다에 50% 관세 — 달러만 홀로 강해졌다**
트럼프 대통령이 **2027년 1월 1일부터 캐나다산 자동차·트럭·자동차부품·철강에 대한 관세를 50%로 인상**하겠다고 발표했다. 포드가 **−3.30%**, GM이 **−1.10%** 밀렸다. 캐나다달러는 미 달러 대비 **−0.61%(1.385캐나다달러)**로 급락해 **6월 17일 이후 최대 하루 낙폭**을 기록했고, 달러인덱스는 **98.99(+0.17%)**로 올랐다. 이란 제재 확대와 겹치며 **달러가 유일한 안전판** 역할을 했다.

**⑤ 이란 '경제적 디데이' — 그런데 유가는 오히려 −2.35%**
베선트 재무장관은 **"날이 밝으면 경제적 디데이가 시작된다"**며 대이란 제재를 상세 공개했고, **"이란을 위해 자금세탁을 하면 달러 시스템에서 제외될 것"**, 중국 포함 여부를 묻자 **"누구도 제재를 벗어나지 못한다"**고 답했다. 그런데 유가는 내렸다. WTI 10월물이 **배럴당 \$85.01(−2.35%)**, 브렌트 10월물이 **\$92.17(−2.35%)**로 6거래일 연속 상승을 끊었다. 시장은 **이란산 원유 공급에 즉각적인 추가 차질을 줄 정도의 조치는 아니라고 평가**했고, 6일간 오른 데 따른 차익 실현이 나왔다. 다만 이란은 **장금상선 등 호르무즈 통항 선박 45척을 블랙리스트에 올렸다** — 국내 해운에 직접 걸리는 사안이다.

**⑥ 한국은 정반대로 갈렸다 — 코스피 −3.12%, 코스닥 +1.42%**
삼성전자가 **−8.70%** 폭락하며 코스피를 **−3.12%(6,696.96)**로 끌어내렸다. 삼성생명 **−13.09%**, 삼성물산 **−7.84%** 등 삼성그룹주가 통째로 무너졌다. 원인은 주주환원 발표 자체가 아니라 **내용의 구조**다 — 90~110조원 규모는 컸지만 **즉각적인 자사주 매입·소각 약속이 빠졌고**, 금산분리 규제에 막혀 소각이 지연될 수 있다는 해석이 붙었다. JP모건은 **즉각적 바이백 부재와 환원 프레임워크 불변**을 실망 요인으로 지목했다. 외국인은 **3.9조원 순매도**. SK하이닉스도 **−3.41%(1,671,000원)**로 밀렸고 외국인이 **−91만 3,265주** 순매도했다. 반면 **코스닥은 +1.42%(813.33)** — 삼성전자에서 이탈한 자금이 2차전지·소부장으로 옮겨간 결과다. 원/달러는 **1,382.4원**으로 13개월 최저다.

> *어제 판정 복기 — **완전히 틀렸다.** '월요일은 대형주 강보합 / 중소형주 약세의 양극화'로 봤는데, 실제로는 **정확히 반대**가 나왔다. 코스피 −3.12%(대형주 폭락) / 코스닥 +1.42%(중소형주 강세). 근거로 삼았던 '삼성전자 110조 주주환원'이 오히려 **−8.70%의 원인**이 됐다. 오판의 뿌리는 **금액의 크기만 보고 구조를 보지 않은 것**이다 — 즉각적 자사주 소각이 없는 환원 계획은 시장이 '기대에 못 미친 것'으로 읽는다는 점을 놓쳤다. 8/20 SK하이닉스 때는 재료의 크기를 과소평가했고 이번엔 과대평가했다. **발표 금액이 아니라 실행 시점과 방식을 먼저 확인하는 절차**를 넣어야 한다.*

## 🏭 섹션 1. 업종별 흐름

**하락 ①  메모리·스토리지 (이날 최약)**
마이크론 **−5.83%**, SK하이닉스 ADR **−4.92%**, 샌디스크 **−6.45%**, 씨게이트 **−6.51%**, 웨스턴디지털 약 −7%. 애플의 중국산 메모리 조달 허용 보도가 직격탄이었다.

> 🇰🇷 [전달] 국내 메모리 투톱에 직접 걸린다. 다만 **CXMT는 저물량 Mac 1개 제품에만 인증**됐고 **LPDDR5X 수율이 낮아** 애플 물량을 의미 있게 대체하기 어렵다는 반론이 있다. 과잉 반응 여부를 8/26 엔비디아 실적으로 확인해야 한다.

**하락 ②  AI 반도체·광통신**
엔비디아 **−2.91%(7거래일 연속)**, AMD **−3.49%**, 브로드컴 **−2.63%**, 인텔 약세. 코히런트 **−4.85%**, 루멘텀 **−4.22%**로 광통신 부품도 동반 하락했다. 실적 발표 전 포지션 축소가 섹터 전반에 걸쳐 나타났다.

**하락 ③  자동차**
포드 **−3.30%**, GM **−1.10%**. 캐나다산 자동차·부품 50% 관세 발표가 원가 부담으로 직결됐다.

**상승 ①  금융**
JP모건 **+1.40%**, 비자 **+3%**. 금리 하락과 경기 방어 성격이 맞물리며 다우를 홀로 끌어올렸다.

**상승 ②  철강**
뉴코, 스틸다이내믹스, 클리블랜드클리프스가 상승했다. **미-캐나다 무역협상 결렬**로 캐나다산 철강에 50% 관세가 걸리면서 미국 내 생산자의 가격 결정력이 커진다는 기대가 반영됐다.

**[판정]** **갭다운 출발, 낙폭은 코스피보다 코스닥이 작을 것으로 본다.**
**상방 근거**: ①**미 장기금리 하락**(10년물 4.704%, 30년물 5.234%), ②**유가 −2.35%**로 6일 연속 상승 중단, ③원/달러 **1,382.4원** 원화 강세 지속, ④SKHY 괴리율 **+28.5%**로 4거래일 연속 축소, ⑤코스닥 자금 순환 흐름 유지.
**하방 근거**: ①**애플-중국 메모리 보도**가 국내 투톱에 직접 걸림, ②SKHY **−4.92%**, ③**KOSPI200 선물 정규장 −4.37%**, ④엔비디아 7거래일 연속 하락, ⑤전일 외국인 **3.9조원 순매도**.
**판정: 반도체 대형주 중심의 갭다운**을 기본으로 본다. 다만 **어제 방향을 정반대로 틀린 직후**이므로 폭은 단정하지 않는다. 애플-중국 이슈는 **수율·인증 범위를 보면 과잉 반응 소지**가 있어 장중 낙폭 축소 가능성을 열어둔다. (무효화: 8/26 엔비디아 실적 서프라이즈, 또는 러트닉 상무장관의 중국 메모리 반대 발언 재확인)

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. SK하이닉스 ADR (SKHY) −4.92% — \$155.37 (괴리율: +28.5%), 애플-중국과 삼성 실망이 겹쳤다**
두 개의 악재가 같은 날 겹쳤다. 첫째, 트럼프 행정부가 **애플의 중국 CXMT·YMTC 메모리 조달을 허용할 수 있다**는 보도가 나왔다. 둘째, 삼성전자가 **90조~110조원 규모 주주환원**을 발표했지만 즉각적인 자사주 매입 약속이 빠지면서 한국 증시에서 **−8.70%** 폭락했고, 이것이 메모리 섹터 전반의 차익 실현 명분이 됐다.
국내 주가도 함께 밀렸다. SK하이닉스(000660)는 **−3.41%(1,671,000원)**로 마감해 시가총액 **1,220조원**으로 내려왔다. 수급이 극적으로 반전됐다 — 외국인이 **−91만 3,265주**, 기관이 **−17만 3,328주** 순매도했고 개인만 **+44만 367주** 순매수했다. 전 거래일 외국인 +6,014주 순매수에서 하루 만에 방향이 바뀐 것이다. 거래대금 **11.1조원**.
원/달러가 **1,382.4원**까지 내려오면서 괴리율은 **+31.0% → +28.5%로 2.5%p 추가 축소**됐다. 4거래일 연속 축소이며 **정상 범위(20~30%대)에 들어왔다.**

**2. 마이크론 (MU) −5.83% — CXMT의 애플 DRAM 공급 허용 보도가 직격탄**
미 최대 메모리 기업이 장중 **7%** 가까이 빠졌다가 **−5.83%**로 마감했다. Wccftech는 **9월 시진핑 주석의 방미 이후 트럼프 행정부가 애플의 CXMT·YMTC 메모리 조달을 허용할 수 있다**고 보도했고, 이것이 **애플 관련 매출 상실 우려**로 직결됐다. 마이크론은 애플 메모리 공급망과 가장 밀접하게 엮인 기업이다.
그러나 반론이 만만치 않다. 린크스에쿼티리서치의 KC 라지쿠마르는 **CXMT가 저물량 Mac 제품 1종에만 인증**됐고 **LPDDR5X 수율이 낮아** 대규모 공급이 어렵다며, **"CXMT 공급은 애플이 겪는 DRAM 부족을 메우지 못하고, 마이크론 같은 기존 공급사에 대한 애플의 협상력을 개선하지도 못한다"**고 평가했다.
정책 신호도 엇갈린다. 하워드 러트닉 상무장관은 지난주 WSJ 인터뷰에서 **"트럼프 행정부는 애플이 중국산 메모리를 쓰는 것에 찬성하지 않는다"**고 말했다. 마이크론은 그동안 워싱턴을 상대로 **중국산 메모리 수입이 미국 반도체 제조 기반을 훼손한다**며 로비해왔다.

**3. 엔비디아 (NVDA) −2.91% — 7거래일 연속 하락, 2022년 이후 최장 기록**
AI 대장주가 3% 가까이 밀리며 **7거래일 연속 하락**했다. 이는 **2022년 이후 최장 연속 하락**이다. 블룸버그는 메모리 업체들이 일부 주요 고객사에 **AI용 메모리 가격을 15% 이상 인상**할 수 있다고 통보했다고 전했고, 이것이 업계 전반의 **원가 압박 우려**를 키웠다.
8월 26일(현지) 장 마감 후 FY2027 2분기 실적을 발표한다. 시장의 초점은 매출 서프라이즈가 아니라 **매출총이익률**이다. 블랙웰에서 차세대 루빈으로 넘어가는 초기 구간이라 원가 부담이 커지는데, 여기에 메모리 가격 인상까지 겹치면 마진 방어가 어려워진다.
데이터센터를 둘러싼 **정치권의 규제 움직임**에 대한 경계감도 더해졌다. JP모건은 이날 별도 리포트에서 **경기 하강 가능성을 경고하며 그 원인으로 AI 관련 주식을 지목**했다.

**4. 샌디스크 (SNDK) −6.45% — YMTC의 NAND 공급 가능성에 최대 낙폭**
낸드플래시 전문 기업이 이날 반도체 종목 중 가장 크게 빠졌다. 애플이 **YMTC(양쯔메모리)로부터 NAND를 조달**할 수 있다는 보도가 직접 원인이다. 장중에는 **9~10%까지** 낙폭을 확대하기도 했다.
다만 시장의 반응이 과도하다는 분석이 나온다. **YMTC가 애플이나 주요 고객사를 확보할 만큼 신뢰할 수 있는 대량 NAND 공급 능력을 단기간에 갖추기는 어렵다**는 것이 근거다. 근본적인 NAND 수요 배경이 훼손된 것은 아니라는 지적이다.
같은 계열인 **씨게이트 −6.51%, 웨스턴디지털 약 −7%**도 동반 급락했다. **스토리지 3사가 나란히 6~7% 빠진 것**은 개별 실적이 아니라 정책 헤드라인 하나에 섹터 전체가 반응했음을 보여준다.

**5. 씨게이트 (STX) −6.51% — 스토리지 3사 동반 급락의 한 축**
HDD·스토리지 대표주가 6% 넘게 급락했다. 애플-중국 메모리 보도가 낸드·스토리지 전반의 투자심리를 무너뜨렸고, 실적이나 가이던스 변경 같은 **기업 고유 재료 없이** 정책 헤드라인만으로 6%대 하락이 나왔다.
스토리지는 **AI 데이터센터 증설의 후행 수혜 업종**으로 분류돼 최근까지 강세를 이어왔다. 그만큼 차익 실현 물량이 쌓여 있었고, 엔비디아 실적을 앞둔 디리스킹 국면에서 매도 압력이 집중됐다.
코히런트 **−4.85%**, 루멘텀 **−4.22%** 등 광통신 부품주도 함께 밀렸다. **AI 인프라 밸류체인 전반이 실적 발표 전 포지션을 줄이는 흐름**이 확인된다.

**6. 포드 (F) −3.30% — 캐나다산 자동차 50% 관세 직격**
트럼프 대통령이 **2027년 1월 1일부터 캐나다산 자동차·트럭·자동차부품·철강에 대한 관세를 50%로 인상**하겠다고 발표하면서 3% 넘게 밀렸다. GM도 **−1.10%** 하락했다.
포드의 낙폭이 GM의 3배에 달한 것은 **캐나다 생산 비중 차이** 때문으로 해석된다. 미국 완성차 업계는 북미자유무역 체계 아래 캐나다·멕시코 공장을 하나의 생산망으로 운영해왔고, 50% 관세는 이 구조 자체를 흔든다.
외환시장에서도 즉각 반응이 나왔다. 캐나다달러는 미 달러 대비 **−0.61%(달러당 1.385캐나다달러)**로 급락해 **6월 17일 이후 최대 하루 낙폭**을 기록했다. 발효까지 4개월 이상 남아 있어 **협상 카드**라는 해석도 병존한다.

**7. 브로드컴 (AVGO) −2.63% — 1,000억 달러 부채 딜의 후폭풍**
지난주 **최대 1,000억 달러 규모 부채 조달**을 협의 중이라는 보도가 나온 뒤 이날도 2.6% 하락했다. 앤스로픽 등에 공급할 AI 칩 금융을 위한 자금으로, 선순위 약 **450억 달러**·후순위 약 **350억 달러** 구조가 거론된다.
문제는 조달 환경이다. 이날 장기금리가 내리긴 했지만 **30년물이 여전히 5.234%**로 20년래 최고 수준 부근이다. 이 금리에서 오프밸런스시트 레버리지를 대규모로 일으키는 것이 **신용 위험 재평가**로 이어질 수 있다는 우려가 남아 있다.
반도체 전반의 디리스킹과 겹치면서 낙폭이 커졌다. AMD **−3.49%**, 인텔도 약세였다. **AI 설비투자의 재원이 부채로 이동하는 구조**가 이번 주 실적 시즌의 숨은 쟁점이다.

**8. 에이엠디 (AMD) −3.49% — 실적 앞둔 반도체 디리스킹의 일부**
개별 악재 없이 3.5% 하락했다. 엔비디아 실적을 앞두고 반도체 섹터 전반에서 포지션을 줄이는 흐름에 휩쓸렸다. iShares 반도체 ETF(SOXX)가 **−2.7%**, SMH도 약세였다.
AMD는 메모리를 직접 만들지 않기 때문에 애플-중국 이슈의 직접 대상이 아니다. 그럼에도 3% 넘게 빠졌다는 사실이 이날 매도가 **개별 종목 선별이 아니라 섹터 일괄 축소** 성격이었음을 보여준다.
반대로 **메모리 가격 15% 인상**이 현실화되면 AMD 같은 로직 설계 기업은 원가 부담을 지는 쪽이다. 8/26 엔비디아 실적에서 **메모리 원가가 마진에 어떻게 반영되는지**가 AMD 주가의 다음 변수가 된다.

**9. 코히런트 (COHR) −4.85% — 광통신도 AI 인프라 조정에 휩쓸렸다**
데이터센터용 광통신 부품 기업이 5% 가까이 급락했다. 루멘텀도 **−4.22%**로 동반 하락했다. 두 기업 모두 **AI 데이터센터의 광트랜시버·레이저 공급망**에 속해 있어 AI 설비투자 기대와 주가가 강하게 연동돼 있다.
이날 하락에 기업 고유의 뉴스는 없었다. 엔비디아 실적을 앞둔 **AI 인프라 밸류체인 전반의 포지션 축소**가 원인이다. 반도체·메모리·스토리지·광통신이 **같은 날 같은 방향으로 4~7%씩 빠졌다.**
광통신은 데이터센터 증설의 **가장 후행하는 구간**이라 실적 가시성이 늦게 확인된다. 그만큼 실적 시즌 전후 변동성이 커지는 구조적 특성이 있다.

**10. JP모건 (JPM) +1.40% — 금융주가 다우를 홀로 끌어올렸다**
반도체가 무너진 날에 금융주는 올랐다. JP모건이 **+1.40%**, 비자가 **+3%** 상승하며 다우지수를 **+140.15p(+0.26%)** 끌어올렸다. **장기금리 하락(10년물 4.704%, 30년물 5.234%)**이 금융주 밸류에이션에 우호적으로 작용했다.
아이러니한 것은 같은 날 **JP모건이 경기 하강 가능성을 경고**했다는 점이다. 리포트는 **AI 관련 주식이 그 원인이 될 수 있다**고 지목했다. 자사 주가는 오르고 자사 리서치는 경고를 낸 구도다.
JP모건은 삼성전자 주주환원 발표에 대해서도 **즉각적인 자사주 매입 부재와 환원 프레임워크 불변**을 실망 요인으로 지목했다. 이날 한국·미국 양쪽에서 **JP모건의 코멘트가 메모리주 하락 논리의 근거**로 인용됐다.

- **하워드 러트닉(미 상무장관) — "트럼프 행정부는 찬성하지 않는다."** 지난주 휴스턴 애플 공장 방문 후 WSJ 인터뷰에서 애플의 중국산 메모리 사용에 대해 부정적 입장을 밝혔다. **이날 보도와 정면으로 충돌**하는 신호다.

## 📅 섹션 4. 일정 및 관전 포인트

- **📊 8/26(현지) 엔비디아 FY27 2분기 실적 — 이번 주의 전부:** 매출이 아니라 **매출총이익률**이 관건이다. 블랙웰→루빈 전환 원가에 **메모리 가격 15% 인상**까지 겹친 구간이다. 7거래일 연속 하락한 상태로 실적을 맞는다.
- **⚠️ 애플-중국 메모리 — 정책 신호가 엇갈린다:** 이날 보도(허용 가능성)와 러트닉 상무장관 발언(반대)이 정면 충돌한다. **어느 쪽이 공식화되느냐가 국내 메모리 투톱의 중기 밸류에이션을 좌우**한다. 수율·인증 범위를 보면 단기 실질 영향은 제한적이라는 반론도 유효하다.
- **🇰🇷 오늘 국내 개장 — 삼성전자 낙폭 소화가 관건:** 전일 **−8.70%** 뒤다. 주주환원 실망이 하루로 끝날지, **금산분리 규제로 소각이 지연될 수 있다는 구조적 우려**로 번질지가 갈림길이다. 코스닥으로의 자금 순환이 이어지는지도 함께 봐야 한다.
- **🛢 유가 6일 만에 하락 — \$85 방어 여부:** WTI **\$85.01(−2.35%)**. 제재가 즉각적 공급 차질로 이어지지 않는다는 평가가 우세하지만, 이란이 **호르무즈 통항 선박 45척(장금상선 포함)을 블랙리스트**에 올린 것은 별개 변수다. 국내 해운·조선에 직접 걸린다.
