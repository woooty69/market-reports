## 🗓 주말 요약

**① 정부, 일요일 F4 회의서 증안펀드 가동 준비 착수 — 투입 시점은 미정**
정부는 22일(일) 거시경제·금융현안 간담회(F4)를 열고 증권시장안정펀드 가동 준비에 들어갔다. 다만 실제 투입 시점은 정하지 않았다. 코스피는 20일(금) **4,869.96(−5.21%)**으로 마감해 한 주 동안 **−7.95%(−420.57포인트)** 밀렸고, 1월 20일(4,885.75) 이후 10개월 만의 최저치다. 금요일에는 매도 사이드카까지 발동됐다. 정책 대응 신호는 월요일 개장 초 투매 심리를 다소 누그러뜨릴 수 있지만, 실제 자금 투입 전까지는 '하단 방어 의지 확인' 이상의 효과를 기대하기 어렵다.

**② 해외 추정가 삼성전자 17만2,469원·SK하이닉스 103만2,608원 — '블랙먼데이' 경계**
주말 온라인에 공유된 해외 영구선물 기반 원화 환산 참고가격은 삼성전자 **17만2,469원**(20일 국내 종가 대비 −5.81%), SK하이닉스 **103만2,608원**(−7.22%)이었다. 이 값은 실제 시초가 예측치가 아니라 참고가격이지만, 금요일 밤 SOX **−10.73%**·SK하이닉스 ADR **−13.97%(\$102.55)**와 방향이 같다. 직전 코스피200 야간선물은 **700.00(−7.01%, 11/20 세션)**이었고, 이 하락률을 금요일 코스피 종가에 단순 적용하면 4,530선 안팎이다. 증권가는 4,500~4,700선을 주요 지지 구간으로 꼽는다.

**③ 앤트로픽, 주관사에 '오픈AI·커서·딥시크 6개월 업무 금지' 요구 — 수수료는 5억달러 넘어**
로이터는 일요일 앤트로픽이 IPO 주관사들에 딜팀 인력이 6개월 동안 오픈AI·커서·딥시크·허깅페이스 업무를 하지 못하도록 요구했고, 딜팀도 시니어 뱅커 **4명**으로 제한했다고 보도했다. 주관사들은 19일 상장으로 **5억달러가 넘는** 수수료를 받았다. 제이 리터 플로리다대 명예교수는 이들 기업이 주관사에 "평소와 같은 방식은 아니다"라고 말할 시장 지배력이 있었다고 평가했다. 앤트로픽은 금요일 **\$88.85(−8.57%)**로 공모가 \$83에 바짝 다가섰고, 23일(현지)부터 옵션과 레버리지 ETF 거래가 시작된다.

**④ 텍사스·조지아 차기 주지사 '데이터센터 신규 건설 중단' 공약 — AI 인프라 정책 리스크 추가**
텍사스와 조지아의 민주당 차기 주지사 당선인들이 신규 데이터센터 건설을 멈추겠다고 공약한 사실이 주말 사이 부각됐다. 두 주는 미국 데이터센터 투자가 몰리는 지역이다. 연준이 다음 달 단기금리를 올릴 것으로 예상되는 가운데 기업들이 채권을 찍어 데이터센터 자금을 대고 있다는 점이 금요일 투매의 배경으로 꼽혔다. 조달 비용 상승에 이어 입지 규제까지 겹치면 전력기기·서버·네오클라우드 투자 계획의 속도가 늦춰질 수 있다.

## 🎯 이번 주 관전 포인트

**1. 앤트로픽 공모가 \$83 — AI 심리의 '심리적 바닥선'**
앤트로픽은 금요일 **\$88.85**, 장중 저가 **\$83.05**로 공모가 \$83과 5센트 차이까지 밀렸다. 23일(현지)부터 옵션과 2배·−2배 레버리지 ETF 4종이 거래를 시작하면 하방 헤지 수요가 한꺼번에 몰릴 수 있다. 상장 후 이틀 동안 공모 물량의 약 **111.6%**가 손바뀜해 단기 차익 물량은 상당 부분 소화됐다는 해석도 가능하다. 공모가를 지키면 AI 대형주 투매가 진정되는 신호로, 깨지면 '유동성 블랙홀' 논리가 다시 힘을 얻는 신호로 읽힐 것이다.

**2. 델 실적 — '엔비디아 다음'의 AI 서버 수요 확인**
델은 현지 24일 장 마감 뒤 3분기 실적을 낸다. 매출 컨센서스는 약 **\$492억(전년 대비 +82%)**, 조정 EPS는 **\$6.48~6.59**로 회사 가이던스(매출 \$490억·EPS \$6.50)와 비슷하다. 회사는 9월에 AI 서버 매출 전망을 **\$600억 → \$740억**으로 올린 바 있어, 이 숫자가 유지되는지가 서버·전력기기 수요의 체온계다. 엔비디아가 '좋은 숫자로도 반등하지 못한' 만큼, 델 역시 숫자보다 수주 잔고와 고객 조달 여건에 대한 코멘트가 주가를 가를 가능성이 크다. 결과는 한국시간 25일(수) 아침에 반영된다.

**3. PCE·GDP 동시 발표 — 12월 인상 폭(25bp vs 50bp)의 마지막 큰 재료**
현지 25일 오전 8시 30분 10월 PCE와 3분기 GDP 수정치가 함께 나온다. 근원 PCE는 전월 대비 **+0.3%**, GDP는 **3.5%**가 예상치이고, NH투자증권은 10월 PCE 전년 대비 상승률을 헤드라인 **3.8%**, 근원 **3.2%**로 내다봤다. 금요일 늦게 CME 페드워치 기준 12월 25bp 인상 확률은 약 92%, 50bp는 약 10%였다. 10년물이 **4.92%**로 5%선 아래로 내려온 만큼 예상보다 높은 물가는 금리 반등과 성장주 재압박으로 바로 이어질 수 있다.

**4. 얇은 연휴 장 — 추수감사절 휴장·블랙프라이데이 단축 거래**
미국은 26일(목) 휴장하고 27일(금)은 오후 1시에 일찍 끝난다. VIX가 **35.89**로 2025년 4월 이후 가장 높은 상태에서 거래가 얇아지면 작은 물량에도 지수 변동이 커질 수 있다. 엔비디아 관련 SEC 회계 검토 보도와 12월 1일 하원 출석, 12월 4일 10-Q 제출 시한이 다음 주로 이어져 있어 연휴 중 반등이 나와도 추세 전환으로 단정하기는 이르다.

### 🇰🇷 한국 관전 포인트

국내 증시는 23일(월) 금요일 밤 미국의 **SOX −10.73%·SK하이닉스 ADR −13.97%(\$102.55)·나스닥 −5.28%**를 한꺼번에 반영하며 출발한다. 직전 코스피200 야간선물은 **700.00(−7.01%, 11/20 세션)**으로 마감했고, 해외 참고가격도 삼성전자 −5.81%, SK하이닉스 −7.22%를 가리킨다. 금요일 이미 −5.21% 빠졌지만 미국 투매가 그 뒤에 나온 만큼 개장 초 사이드카·서킷브레이커 경계가 필요하고, 정부의 증안펀드 준비가 하단을 얼마나 받쳐 주는지가 첫 관심이다.

이번 주 국내 고유 변수는 26일(목) 한국은행 금통위다. NH투자증권은 기준금리를 **3.00% → 3.25%**로 올릴 것으로 내다봤다. 주가 급락 속 인상이 현실화되면 성장주에 부담이지만, 원화 약세를 누그러뜨려 외국인 매도 속도를 늦추는 재료가 될 수도 있다. 23일 발표되는 11월 1~20일 수출은 반도체 수출 증가세가 이어지는지 확인하는 데이터다.

수급은 '외국인 현물 매도 진정'이 관건이다. 외국인은 코스피 현물을 5일 기준 **−4조5,175억원** 순매도했지만 코스피200 선물은 5일 **+3,004계약** 순매수를 유지했다. 선물 쪽 포지션이 현물 매도를 따라 돌아서는지가 바닥 판단의 단서이며, 25일 아침 델 실적은 국내 서버·전력기기·기판 밸류체인에 직접 영향을 준다.

## 💬 증권가 코멘트

- **LS증권 — 이번 주 코스피 예상 범위 4,800~5,400.** 증권가는 4,500~4,700선을 주요 지지 구간으로 보고 있다.
- **대신증권 이경민 — 코스피 5,000선 전후는 '언더슈팅 구간', 비중확대 의견 유지.** 12개월 선행 PER 기준 역사적 저평가 영역이라고 봤다. 다만 미국 10월 PCE가 예상치를 웃돌면 금리 상승 압력으로 반등 탄력이 제한될 수 있다고 덧붙였다.
- **NH투자증권 나정환 — "외국인 거래 감소로 수급이 얇아져 적은 물량에도 변동성이 커질 수 있다."** NH투자증권은 실적 전망치가 계속 올라가는 만큼 주가 하락이 장기간 이어지기는 어렵다고 분석했다.
- **증권가 기존 코스피 밴드 5,000~6,100 — 하단 재점검 필요.** 지난주 4,900선 아래에서 마감해 AI 투자 수익화 속도·자금조달 부담·고평가 논란이 이번 주에도 최대 변수로 꼽혔다.

## 📰 주말 체크한 기타 뉴스

- **유가 재조회 — WTI 1월물 \$83.41로 정정.** 일요일판은 1월물을 \$82.44로 실었지만 월요일 재조회에서 CNBC와 야후 개별 계약(CLF27) 값이 \$83.41로 일치했다. 12월물 마지막 기재치 \$84.09 대비 **−0.81%**이며, 브렌트 1월물은 **\$92.57**로 같다. 호르무즈 물동량 회복으로 3주 연속 내린 흐름은 그대로다.
- **이번 주 시총 20억달러 이상 실적 기업 38곳, 화요일에 23곳 몰려.** 화요일 발표 기업의 시가총액만 약 **\$7,860억**으로 이번 주 전체(약 \$1조1,700억)의 3분의 2다. 디어는 회사 자료에서 2026년을 농기계 사이클의 바닥으로 본다고 밝혔고, 트립닷컴은 발표일을 12월 1일로 미뤘다.
- **10월 소매판매 통제그룹 +0.6% — 소비는 견조.** 예상치(+0.3%)의 두 배로, 금요일 월마트·갭 강세와 함께 블랙프라이데이를 앞둔 소비 체력을 뒷받침한다. 다만 강한 소비는 연준의 추가 인상 논리를 강화하는 양날의 재료다.
- **지난주 국내 수급 — 외국인 순매도, 개인 2조6,500억원대 순매수.** 지난주 기관은 약 **4,725억원** 순매도했고 개인이 약 **2조6,500억원** 받아냈다. 코스닥은 20일 **645.68(−5.71%)**로 마감했다.
