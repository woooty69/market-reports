## 🗓 주말 핵심 요약

주말의 초점은 **호르무즈**였다. 이란이 오만과의 해협 관리 합의에 근접했다고 밝혔지만, 동시에 **"미국이 먼저 약속을 이행해야 한다"며 조건을 걸었다.** 이란은 해군 봉쇄 해제와 동결 자산 해제를 선결 조건으로 요구했고, 앞서 공개한 초안은 선박 통항에 오히려 **더 제한적인 조건**을 담고 있었다. JD 밴스 부통령은 "해협을 통과하는 석유·가스를 최대화하는 것이 목표"라고 밝혔지만, **'조기 정상화'라는 기대는 주말 사이 한 발 물러섰다.**

이는 지난주 시장이 기댔던 두 축 중 하나가 흔들린다는 뜻이다. 8/7 금요일 랠리는 **①고용 부진(7월 −2.3만 명) → 연준 인상 부담 소멸**과 **②호르무즈 타결 기대 → 유가 안정**이라는 조합 위에 섰다. 이 중 ②가 지연되면 유가가 되밀리며 **이번 주 CPI 해석을 복잡하게 만들 수 있다.**

한국 쪽 주말 재료는 **SK하이닉스의 54.3조원(약 383억 달러) 증설**이 계속 소화되는 국면이다. 금요일 발표 직후 시장은 '공급 확대 = 가격 하락'으로 읽어 SK하이닉스(000660)가 −4.88% 밀렸지만, **골드만삭스·JP모건은 매수 의견을 유지**하며 "선행 PER 3.5~3.6배는 펀더멘털과 괴리된 수준"이라고 지적했다. 영업이익률 76%에 2026년 주문이 사실상 소진된 기업이 PER 5배 미만에 거래되는 상황이라는 것이다.

## 📰 주말 뉴스 3선

**1. 이란, 호르무즈 합의 근접했지만 "미국이 먼저" — 조기 정상화 기대는 후퇴**
이란과 오만이 해협 관리 방안에 곧 합의할 것이라는 낙관론이 나왔으나, 이란은 **해군 봉쇄 해제·동결자산 해제 등 미국의 선(先)이행**을 요구하며 통항 정상화에 선을 그었다. 이란이 공개한 초안은 선박 통항에 더 제한적인 조건을 담아 유가 하방을 제약했다.

**2. SK하이닉스 54.3조원 증설의 두 얼굴 — 공급과잉 우려 vs "PER 3.5배는 비정상"**
금요일 이사회가 승인한 용인 Y2 2단계(35.2조원)·청주 M17 신규 팹은 생산능력을 사실상 두 배로 늘린다. 단기적으로는 메모리 공급과잉 우려로 읽혔지만, **골드만삭스·JP모건은 선행 PER 3.5~3.6배가 펀더멘털과 동떨어져 있다며 매수 의견을 유지**했다. 회사는 3분기 중 추가 주주환원안을 발표할 예정이다.

**3. 이번 주 최대 이벤트는 CPI(8/12) — 헤드라인 3.4%·근원 2.5% 컨센서스**
시장의 관심이 고용에서 물가로 이동한다. 컨센서스는 헤드라인 전년비 **3.4%**, 근원 **2.5%**로 둔화를 예상한다. 다만 직전 6월 CPI는 미·이란 휴전 붕괴와 중동 확전 이전 수치여서, **에너지가격 상승분이 이번에 처음 본격 반영**될 수 있다는 점이 변수다.

## 📊 지난주 요약 (8/3~8/7)

극단적 변동성 속에 강한 한 주였다 — **S&P +3.58%, 나스닥 +5.19%, 다우 +2.96%.** 주 초반 이란 외교와 ISM 4년 최고(55.6)로 다우가 사흘 연속 사상 최고를 썼고, 화요일엔 팔란티어 +29%에 다우가 처음 54,000을 넘었다. 그러나 수요일 AMD가 매출 +50%에도 "기대만큼은 아니었다"며 −7% 급락하자 **AI 종목의 문제가 실적이 아니라 '기대의 높이'**임이 드러났다. 목요일엔 유가 반등·금리 상승에 다우가 −464p 밀렸고, 금요일 고용 쇼크(−2.3만 명)가 역설적으로 **S&P 사상 최고**를 만들며 마무리됐다.

한국은 더 험했다. 코스피는 화요일 −5%, 목요일 −4.5%(사이드카 발동), SK하이닉스는 목요일 −10.37%에 **서울 프리마켓 −30% 플래시크래시**까지 겪었다. 수요일엔 반대로 +5.77% 급반등하며 **일주일 내내 롤러코스터**를 탔다.

## 📅 이번 주 관전 포인트 (8/10~14)

- **📊 7월 CPI (수, 8/12 08:30 ET):** 이번 주 최대 이벤트. 헤드라인 3.4%·근원 2.5% 예상. 9월 FOMC 인상 확률이 41.4%까지 내려온 상태라 **물가가 예상을 웃돌면 되돌림 폭이 클 수 있다.** 중동발 에너지가격 반영 여부가 관건.
- **📊 7월 PPI (목, 8/13) · 소매판매 (금, 8/14):** CPI에 이어 물가·소비 확인. 세 지표가 국채금리·달러·주식의 다음 방향을 정한다.
- **🏢 실적:** **코어위브·시스코·어플라이드머티리얼즈**가 이번 주 발표. AI 지출이 여전히 강한지를 가늠하는 잣대로, 특히 어플라이드머티리얼즈는 반도체 장비 수요의 바로미터다.
- **🛢 호르무즈:** 이란-오만 합의의 실질 타결 여부. 지연될수록 유가가 되밀려 CPI·금리 부담이 커진다.
- **🇰🇷 한국:** **SK하이닉스 8/13 실적**(+3분기 주주환원안), **8월 한국은행 금통위**(추가 25bp 인상 리스크)가 대기.

## 🇰🇷 한국 개장 관전 포인트 (오늘 8/10 월)

**반등 우세로 본다.** 근거는 다섯 가지다.

① **미국 반도체 급등** — 금요일 SOX +2.56%(12,356.80), 엔비디아 +2.27%로 반도체 전반의 투자심리가 회복됐다.
② **매크로 전환** — 9월 FOMC 인상 확률이 **55.1% → 41.4%로 급락**하고 동결 확률(58.6%)이 역전됐다. 금리 부담 완화는 고밸류 성장주와 반도체에 우호적이다.
③ **코스피200 야간선물 +0.89%(987.45)** — 금요일 미국장을 반영한 야간 세션이 상승 마감했다.
④ **외국인 순매도 급감** — SK하이닉스(000660) 기준 8/6 −110.2만 주에서 8/7 **−5.6만 주로 사실상 중립화**됐다. 지난주 급락을 이끈 외국인 매도 압력이 소진 국면에 들어섰을 가능성.
⑤ **괴리율 +38.1%** — ADR이 국내 대비 38% 비싸게 거래되는 상태로, 국내 주가의 저평가 여지를 시사한다.

**다만 세 가지 제약이 있다.** 첫째, **SK하이닉스 개별로는 54.3조원 증설이 공급과잉 논쟁을 촉발**해 지수 대비 부진할 수 있다 — 이 경우 삼성전자·반도체 소부장이 상대적 대안이 된다. 둘째, **호르무즈 합의 지연**으로 유가가 되밀리면 위험선호가 약해질 수 있다. 셋째, **수요일 미국 CPI**를 앞둔 관망세가 주 초반 상단을 제한할 수 있다.

**[판정]** 갭업 출발 후 CPI 대기 국면의 등락을 예상한다. **8/13 SK하이닉스 실적과 주주환원안**이 주중 최대 분기점이며, 골드만·JP모건이 지적한 'PER 3.5배' 밸류 논거가 하방을 지지할 전망이다. (무효화: 호르무즈 협상 결렬 보도, 메모리 현물가 하락 확인, 또는 외국인 대량 순매도 재개 시)
