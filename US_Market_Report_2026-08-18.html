## 🗓 시장 요약

**유가가 다시 시장을 흔들었다.** 트럼프 대통령이 이란과의 **'60일 잠정합의(종전 MOU)' 연장을 거부**하고 이란도 군사작전 확대 가능성을 시사하면서 지정학 리스크가 재점화됐다. WTI가 **+2.55%(\$84.50)**, 브렌트는 **+2.65%(\$90.87)**로 **90달러 선을 넘어섰다.** 유가 급등이 국채금리를 밀어올렸고(10년물 +3.1bp, 4.726%), 3대 지수는 나란히 내렸다 — 다우 **−272.63p(−0.51%)**, S&P −0.52%, 나스닥 −0.32%. VIX는 **+6.60%(15.19)**로 튀었다.

**그런데 반도체만 정반대로 움직였다.** SOX가 **+1.64%(12,621.00)**로 급등하며 지수 하락을 완전히 무시했다. 그중에서도 메모리·스토리지가 독주했다 — **마이크론이 \$1,012.03(+4.15%)으로 사상 처음 \$1,000선을 넘었고**, 샌디스크는 **+8.88%(\$1,786.85)**로 4거래일 연속 급등했다. 웨스턴디지털 +5.35%, SK하이닉스 ADR +3.04%가 뒤를 이었다.

메모리 급등의 이유는 세 갈래다. 첫째, **트럼프 행정부가 애플에 중국산(CXMT) 메모리 조달을 자제하도록 압박**하고 있다는 소식이다 — 마이크론·샌디스크·SK하이닉스의 직접적 반사이익이다. 둘째, **일론 머스크가 X에서 "에이전틱 AI에서 메모리와 스토리지가 얼마나 중요한지 아는 사람이 거의 없다"**고 언급했다. 셋째, **샌디스크가 제시한 장기 마진 80% 전망**이 메모리 업계 전반의 밸류에이션 재평가를 촉발했다.

반대편에서는 **빅테크가 무너졌다.** 메타 **−3.54%(\$568.97)**, 마이크로소프트 **−3.04%(\$480.35)**, 넷플릭스 −2.74%. 서비스나우도 −5.08%로 밀렸다. **자금이 소프트웨어·플랫폼에서 빠져나와 메모리 하드웨어로 이동하는 구도**가 지난주보다 더 선명해졌다.

한국 쪽에서는 **괴리율이 다시 벌어졌다.** 8/17 국내 증시가 광복절 대체공휴일로 휴장한 사이 ADR만 +3.04% 오르면서, 8/14 국내 종가(1,645,000원) 기준 괴리율이 +43.4% → **+47.4%로 4.0%p 재확대**됐다. 국내가 따라잡을 기회 자체가 없었던 셈이다.

## 📰 헤드라인 3선

**1. 트럼프, 이란 '60일 잠정합의' 연장 거부 — 브렌트유 90달러 돌파**
트럼프 대통령이 이란과의 종전 양해각서(MOU) 연장을 거부하자 이란도 군사작전을 확대할 수 있다고 맞받았다. 지정학 긴장이 다시 고조되면서 WTI 9월물은 **배럴당 \$84.50(+2.10달러, +2.55%)**, 브렌트 10월물은 **\$90.87(+2.65%)**로 마감해 **브렌트가 90달러 선을 넘었다.** 두 유종은 지난주에도 5% 넘게 올랐던 터라 **2주 연속 상승**이다. 유가가 국채금리를 밀어올리며 주식시장 전반의 발목을 잡았다.

**2. 마이크론 \$1,000 돌파 · 샌디스크 +8.88% — 지수 하락 속 메모리 독주**
마이크론이 **\$1,012.03(+4.15%)**으로 사상 처음 \$1,000선을 넘었고, 샌디스크는 **+8.88%(\$1,786.85)**로 4거래일 연속 급등했다. 8/11 \$1,271에서 \$1,787까지 **불과 4거래일 만에 +40.6%** 오른 것이다. SOX는 **+1.64%**로 3대 지수가 모두 하락한 날에 홀로 상승했다. 웨스턴디지털 +5.35%, 어플라이드머티리얼즈 +5.54%(전날 −5.12% 되돌림), 테라다인 +5.81%까지 반도체 전반이 강했다.

**3. 트럼프 행정부, 애플에 "중국산 메모리 쓰지 말라" 압박 — 한국·미국 메모리 수혜**
트럼프 행정부가 애플을 비롯한 미국 기업들에 **중국 CXMT의 메모리 조달을 자제**하도록 유도하고 있다는 소식이 전해졌다. 마이크론·샌디스크가 대체 공급처로 지목됐고, **SK하이닉스도 같은 논리의 수혜 대상**이다. 여기에 일론 머스크의 "에이전틱 AI에는 메모리와 스토리지가 결정적"이라는 X 게시글과 샌디스크의 **장기 마진 80% 전망**이 겹치며 메모리 전반의 리프라이싱이 진행됐다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  메모리·스토리지 (지수 역행)**
샌디스크 **+8.88%(\$1,786.85)**, 웨스턴디지털 **+5.35%(\$536.01)**, 마이크론 **+4.15%(\$1,012.03)**, SK하이닉스 ADR +3.04%. 3대 지수가 모두 내린 날에 이 업종만 5~9% 급등했다. **중국산 메모리 배제 압박 + 머스크 발언 + 샌디스크 마진 전망**이라는 세 재료가 동시에 붙었다.

> 🇰🇷 [전달] **오늘(8/18) 국내 개장에 가장 직접적인 재료**다. 3거래일 휴장 동안 미국 메모리가 급등했고 SKHY도 +3.04%. SK하이닉스(000660)·삼성전자(005930)에 강한 상방 압력.

**상승 ②  반도체 장비 (전날 낙폭 되돌림)**
어플라이드머티리얼즈 **+5.54%(\$535.28)**로 전날 −5.12%를 완전히 되돌렸고, 테라다인 +5.81%, 마벨 +5.55%가 동반 상승했다. 메모리 증설 사이클이 결국 장비 발주로 이어진다는 기대가 하루 만에 복원됐다.

> 🇰🇷 [전달] 8/14 리포트에서 부담 요인으로 지목했던 **장비주 약세가 하루 만에 반전**됐다. 국내 반도체 소부장(원익IPS·주성엔지니어링 등)에 대한 경계를 완화할 근거.

**상승 ③  인프라·에너지 관련**
콴타서비스 +5.33%, 스페이스X +4.49%, 마이크로스트래티지 +4.98%. 유가 상승과 전력 인프라 수요가 맞물린 종목군이 강했다.

**하락 ①  대형 플랫폼·소프트웨어 (이날 최약)**
메타 **−3.54%(\$568.97)**, 마이크로소프트 **−3.04%(\$480.35)**, 넷플릭스 −2.74%, 서비스나우 −5.08%. 금리 상승이 고밸류 성장주의 할인율을 높였고, **자금이 메모리 하드웨어로 빠져나간 정황**이 뚜렷하다.

> 🇰🇷 [전달] '소프트웨어 → 하드웨어' 자금 이동은 국내에서도 **플랫폼(네이버·카카오)보다 반도체**를 유리하게 만드는 구도다.

**하락 ②  통신·미디어**
차터커뮤니케이션스 −6.62%로 이날 최대 낙폭을 기록했다. 넷플릭스 −2.74%까지 겹치며 미디어 전반이 약했다.

**하락 ③  필수소비재·방산**
컨스텔레이션브랜즈 −6.19%, 몰슨쿠어스 −4.75%, L3해리스 −4.61%, 아멘텀 −4.84%. 유가 상승에 따른 원가 부담과 방어주 이탈이 겹쳤다.

**[판정 — 오늘 8/18(화) 국내 3거래일 만에 개장]** **상방 우세로 본다.** 8/14와 8/17 두 미국 세션이 오늘 한꺼번에 반영되는데, **반도체 관련 신호가 압도적으로 우호적**이다. ①**SOX가 두 세션 합쳐 +1.32%**(12,417.10 → 12,621.00, 8/14 −0.31% + 8/17 +1.64%), ②**SKHY 두 세션 합쳐 +3.45%**(\$165.67 → \$171.38), ③마이크론 \$1,000 돌파·샌디스크 4일 연속 급등, ④**중국산 메모리 배제 압박**이라는 정책 재료, ⑤어플라이드 등 장비주 반등. 여기에 **괴리율 +47.4%**가 국내 저평가 여지를 시사한다.
다만 세 가지를 경계한다. 첫째, **유가 급등(브렌트 90달러 돌파)과 금리 상승**은 지수 전반에 부담이며 항공·화학·해운에는 직접 악재다. 둘째, 미국 3대 지수가 모두 하락했으므로 **반도체 외 업종은 갭업 폭이 제한**될 수 있다. 셋째, SK하이닉스(000660)는 직전 한 주에 이미 **+15.68%** 오른 상태라 갭업 후 차익 실현이 나올 여지가 있다. (무효화: 개장 후 외국인 순매도 전환, 또는 유가 \$88 추가 돌파 시)

## 🔍 섹션 2. 이슈 종목 10선

**1. SK하이닉스 ADR (SKHY) +3.04% — \$171.38, 괴리율 +47.4%로 재확대**
시가 **\$172.60**으로 갭업 출발해 장중 **\$178.43**까지 올랐지만 **\$171.38**에 마감하며 고점 대비 **3.95%를 반납**했다. 저가는 \$169.57. **사흘 연속 장중 고점에서 밀린 마감**으로, 상승 자체는 유지되지만 매수 강도가 약해지는 패턴이다. 거래량 2,220만 주, 시간외 +0.04%(\$171.44).
**애널리스트 목표주가는 \$244.92 → \$245.21로 소폭 상향**됐다(14인 Strong Buy 유지). 현재가 대비 상승 여력은 +43.1%다.
국내 SK하이닉스(000660)는 **8/17 광복절 대체공휴일로 휴장**해 8/14 종가 1,645,000원에 멈춰 있다. 그 사이 ADR만 +3.04% 오르면서 괴리율이 **+43.4% → +47.4%로 4.0%p 재확대**됐다. 8/14에 모처럼 좁혀졌던 격차가 **국내 휴장이라는 기술적 요인으로 다시 벌어진 것**이므로, 오늘 국내 개장에서 이 격차가 얼마나 메워지는지가 관건이다.

**2. 마이크론 (MU) +4.15% — \$1,012.03, 사상 첫 \$1,000 돌파**
메모리 대표주가 **사상 처음 \$1,000선을 넘었다.** 거래량 3,003만 주로 이날 거래대금 상위 2위였다. 장 시작 전부터 \$1,000선을 두고 공방이 벌어졌고 결국 돌파에 성공했다.
직접적 촉매는 **트럼프 행정부의 중국산 메모리 배제 압박**이다. 애플이 CXMT 대신 마이크론·샌디스크에서 조달하도록 유도한다는 소식이 전해지며 **미국 내 유일한 대형 메모리 사업자**로서의 지위가 부각됐다.
이번 주 들어서만 \$911 → \$1,012로 **+11.1%** 올랐다. 국내 SK하이닉스(000660)와 같은 방향의 재료를 공유하지만, **정책 수혜의 강도는 미국 기업이 더 크다**는 점은 감안할 필요가 있다.

**3. 샌디스크 (SNDK) +8.88% — \$1,786.85, 4거래일 만에 +40.6%**
낸드·SSD 대표주가 또 9% 가까이 급등했다. 8/11 \$1,271.05 → 8/12 \$1,528.11 → 8/13 \$1,641.28 → 8/17 \$1,786.85로 **4거래일 연속 상승, 누적 +40.6%**다. 거래량 1,727만 주로 이날 최다.
결정적 재료는 **장기 영업마진 80% 전망**이었다. 메모리 기업이 소프트웨어에 준하는 마진을 제시한 것으로, 업계 전반의 이익 구조에 대한 인식을 바꿔놓았다.
이 전망은 **삼성전자(005930)·SK하이닉스(000660)의 밸류에이션 재평가 근거**로도 직접 인용되고 있다. 낸드 비중이 큰 삼성전자에 특히 유리한 논리다.

**4. 웨스턴디지털 (WDC) +5.35% — \$536.01, 스토리지 3인방 동반 강세**
거래량 792만 주와 함께 5% 넘게 올랐다. 샌디스크·마이크론과 함께 **스토리지 전 계층이 다시 한번 동반 상승**했다.
8/13 +7.31%, 8/14 +1.4%에 이어 사흘째 상승으로, 이번 주 내내 가장 일관된 강세를 보인 섹터다.
AI 데이터센터가 SSD와 HDD를 동시에 요구한다는 구조적 논리가 계속 작동 중이다.

**5. 어플라이드머티리얼즈 (AMAT) +5.54% — \$535.28, 하루 만에 전날 낙폭 회복**
전날 실적 실망으로 −5.12% 급락했던 종목이 **+5.54%로 완전히 되돌렸다.** 거래량 683만 주.
메모리 가격과 마진 전망이 개선되면서 **결국 증설 발주로 이어질 수밖에 없다**는 논리가 하루 만에 우세해졌다. 실적 자체보다 **메모리 사이클의 방향**이 장비주를 움직인 셈이다.
테라다인 +5.81%, 마벨 +5.55%까지 겹쳐 **반도체 장비·설계 전반이 함께 반등**했다. 국내 소부장에 대한 경계를 낮출 근거다.

**6. 테라다인 (TER) +5.81% · 마벨 (MRVL) +5.55%**
테라다인이 \$443.14로 +5.81%(거래량 300만 주), 마벨이 \$234.34로 +5.55%(1,810만 주) 올랐다. 각각 **반도체 검사장비**와 **맞춤형 실리콘·데이터센터 연결**을 대표한다.
메모리 출하가 늘면 검사 수요도 함께 늘고, 데이터센터 확장은 커스텀 실리콘 수요로 이어진다. **메모리 랠리가 후공정·설계까지 파급**되고 있음을 보여준다.
반면 AMD는 −1.63%(\$506.00)로 전날 +6.46%를 일부 반납했다.

**7. 메타 (META) −3.54% — \$568.97, 빅테크 최대 낙폭**
거래량 기준으로도 큰 폭의 매도가 나왔다. 8/13 +2.74% → 8/14 −0.88% → 8/17 −3.54%로 사흘간 방향이 계속 뒤집혔다.
금리 상승(10년물 4.726%)이 고밸류 성장주에 부담으로 작용한 데다, **자금이 메모리 하드웨어로 빠져나간 반대급부** 성격도 있다.
AI 자본지출 부담 논쟁이 알파벳에서 시작해 메타·마이크로소프트로 번지는 흐름이 이번 주에도 이어졌다.

**8. 마이크로소프트 (MSFT) −3.04% — \$480.35, \$500선 이탈**
거래량 2,307만 주로 대형주 중 매도가 집중됐다. 8/12 −2.26%에 이어 이날 −3.04%로 **\$500선 아래에 자리 잡았다.**
하이퍼스케일러의 **부채 조달 확대**가 CNBC 분석으로 부각된 이후 AI 지출 주체들에 대한 시선이 계속 차가워지고 있다.
같은 날 메모리 공급사들이 5~9% 급등한 것과 정확히 대칭을 이룬다 — **AI 밸류체인에서 이익이 어디로 귀속되는가**에 대한 시장의 판단이 바뀌는 중이다.

**9. 서비스나우 (NOW) −5.08% — \$117.70, 소프트웨어 약세 지속**
엔터프라이즈 소프트웨어 대표주가 5% 넘게 밀렸다. 거래량 1,777만 주.
8/13 금리 급락 때 워크데이 등과 함께 급등했던 업종이, 금리가 되돌려지자 곧바로 반납하는 패턴을 반복하고 있다.
**금리 방향에 하루 단위로 반응하는 구간**이라 추세 판단보다 변동성 관리가 필요한 국면이다.

**10. 스페이스X (SPCX) +4.49% · 마이크로스트래티지 (MSTR) +4.98%**
스페이스X가 \$146.28로 +4.49%, 거래량 **1억 1,201만 주**로 이날 최다 거래를 기록했다. IPO가(\$135) 대비 +8.4% 수준을 회복했다.
마이크로스트래티지는 \$97.67로 +4.98% 반등해 전날 −4.16%를 되돌렸다.
두 종목 모두 **개인 자금 비중이 높아 지수와 무관하게 움직이는 특성**이 있다. 지수가 −0.5% 내린 날 4~5% 오른 것은 위험선호 자체가 죽지는 않았음을 시사한다.

## 💬 섹션 3. 구루·기관 코멘트

- **일론 머스크 (X) — "에이전틱 AI에서 메모리와 스토리지가 얼마나 중요한지 아는 사람이 거의 없다."** AI 1차 물결이 GPU 중심이었다면 **에이전트 시대는 메모리·스토리지가 병목**이라는 주장으로, 이날 메모리 랠리의 심리적 촉매가 됐다.
- **샌디스크 — 장기 영업마진 80% 전망.** 메모리 기업이 소프트웨어 수준의 마진을 제시하면서 **삼성전자·SK하이닉스의 이익 구조에 대한 재평가**가 촉발됐다.
- **연준 금리선물(9/16 FOMC) — 인상 36.3% vs 동결 63.7%.** 전 거래일 32.3%에서 **4%p 반등**했다. 유가 급등이 물가 재점화 우려를 되살린 결과로, 한 주간 이어진 '동결 굳히기' 흐름에 제동이 걸렸다.
- **마이클 크레이머 — "CPI·PPI 이후에도 장기 국채금리는 여전히 너무 낮아 보인다."** 물가 지표가 좋게 나왔음에도 장기 금리에 상방 위험이 남아 있다는 시각으로, 이날 10년물 상승(4.726%)과 맥이 닿는다.
- **모틀리풀 — "SK하이닉스는 매출이 257% 늘었는데도 내년 실적 기준 PER 약 5배에 거래된다."** 다만 **경기민감 기업의 낮은 배수는 사이클 정점 신호일 수 있다**는 경고도 함께 담았다. HBM 수요가 사이클을 완화했지만 **사이클이 사라졌다고 가정해선 안 된다**는 지적이다.
- **SKHY 컨센서스 — 애널리스트 14인 Strong Buy, 목표주가 \$244.92 → \$245.21로 상향.** 현재가 대비 +43.1%.
