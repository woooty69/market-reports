## 🗓 시장 요약

**① S&P500 7,765.36(−0.47%)·나스닥 27,193.34(−1.25%)·다우 51,231.64(+0.10%) — 반도체 급락에 기술주만 크게 밀린 '좁은 하락', 상승 종목 50.3%로 하락보다 많아**
목요일 미국 지수는 반도체가 이끄는 기술주 매도로 이틀째 내렸다. S&P500은 **7,765.36(−36.41, −0.47%)**, 나스닥은 **27,193.34(−345.35, −1.25%)**, 나스닥100은 **30,725.81(−434.27, −1.39%)**였다. 반면 다우는 **51,231.64(+51.77, +0.10%)**로 장중 저가 50,939.00에서 반등해 소폭 올랐고, 러셀2000도 2,794.13(+0.03%)로 보합을 지켰다. 장 마감 기준 상승 종목은 2,828개(50.3%)로 하락 종목 2,582개(46%)보다 많았고, 기술 업종이 가장 크게 내린 가운데 나머지 업종은 대부분 올랐다. VIX는 15.41(+2.19%)였다. 캐피털닷컴의 다니엘라 하손은 중동 긴장과 유가·채권 금리 때문에 시장이 방어적으로 돌아섰다며 "좁은 주도주 구조가 금리 변화에 취약하다"고 지적했다. 해석하면 지수 하락은 사실상 반도체와 AI 하드웨어에 집중됐고, 시장 내부 체력은 전날보다 오히려 나아졌다.

**② 10년물 장 초반 5.35%(2002년 이후 최고권)·30년물 5.69% — 신규 실업수당 청구 19.7만 건으로 예상 하회, 의사록은 "추가 인상은 보험성"**
채권시장은 장기물 약세가 이어졌다. 10년물은 장 초반 **5.35%(+5.32bp)**로 2002년 이후 최고 수준에 다시 다가섰다가 오후에는 5.3% 안팎에서 거래됐고, 30년물은 장 초반 **5.69%**로 24년 만의 최고에 근접했다. 지난주(10/3 마감) 신규 실업수당 청구는 **19.7만 건(−2,000건)**으로 예상치 20만 건을 밑돌며 4주째 57년 만의 최저권을 유지했다. 전날 공개된 9월 FOMC 의사록은 노동시장이 최대 고용에 가깝고 위험이 균형적이라고 평가하면서, 대부분 위원이 연내 한 차례 추가 인상을 예상하되 이를 긴축 사이클의 시작이 아닌 끈질긴 물가에 대한 '보험'으로 본다고 전했다. 하손은 의사록이 추가 인상에 대한 의지가 크지 않음을 보여 줬다고 해석했다. 해석하면 견조한 고용과 유가 급등이 겹쳐 장기 금리 상단이 쉽게 꺾이지 않는 구도다.

**③ WTI \$91.60(+1.64%)·브렌트 \$107 상회 — 페르시아만 유조선 공격·호르무즈 통항 감소·미국의 대이란 공습 준비 보도에 브렌트 장 초반 +4.89%, 정유주 강세**
유가는 이틀째 올랐다. 장 초반 WTI는 **\$92.52(+4.80%)**, 브렌트는 **\$105.10(+4.89%)**까지 뛰었고, 오후 2시 무렵 WTI는 약 **\$91.60**, 브렌트는 **\$107**을 웃돌아 전쟁 초기 고점(\$120 상회)에는 못 미쳤지만 WTI-브렌트 스프레드가 \$15를 넘었다. 페르시아만 유조선 공격과 호르무즈 해협 통항량 감소, 트럼프 대통령이 "더 이상 이란과의 합의를 원하지 않는다"고 밝힌 뒤 나온 미국의 공습 준비 보도, 허리케인을 앞둔 멕시코만 생산 감축이 겹쳤다. 의회조사국은 이란 전쟁에서 손실·파손된 미군 항공기를 81대로 집계해 5월(42대)의 두 배 가까이로 늘었다. 금 선물은 장 초반 \$4,147.60(+0.17%), 은은 \$58.96(−2.21%)였다. 마라톤 페트롤리엄(MPC)이 \$463.34(+4.77%)로 오른 것도 이 흐름이다. 해석하면 중동 공급 위험이 다시 커지며 유가가 장기 금리와 물가 기대를 함께 밀어 올리고 있다.

**④ AI·반도체 — SOX −3.39%, 엔비디아 −2.94%·AMD −3.90%·브로드컴 −4.35%·TSMC −3.01%, 메모리 마이크론 −4.79%·샌디스크 −4.90%·SK하이닉스 ADR −4.35%, 광통신 루멘텀 −5.62%·AAOI −13.58%**
필라델피아 반도체지수는 **12,623.72(−442.44, −3.39%)**로 장중 저가 12,483.95까지 밀렸다. 엔비디아(NVDA)는 **\$230.48(−2.94%)**, AMD(AMD)는 \$620.68(−3.90%), 브로드컴(AVGO)은 \$360.14(−4.35%), TSMC(TSM)는 분기 매출이 51% 늘었다는 발표에도 \$457.99(−3.01%)로 내렸다. 전날 반등했던 메모리도 다시 밀려 마이크론(MU)이 **\$1,035.84(−4.79%)**, 샌디스크(SNDK)가 \$1,609.46(−4.90%), SK하이닉스 ADR(SKHY)이 \$170.50(−4.35%)였다. 광통신·AI 포토닉스에서는 루멘텀(LITE)이 \$1,048.60(−5.62%), 어플라이드 옵토일렉트로닉스(AAOI)가 **\$6억 규모 유상증자(ATM)** 계획과 약한 3분기 가이던스에 \$105.90(−13.58%)로 급락했다. 아날로그 칩도 스카이웍스(SWKS) \$80.75(−3.21%), 알레그로 마이크로시스템즈(ALGM) \$36.27(−2.05%)로 동반 약세였다. 판뮤어 리베럼의 요아힘 클레멘트는 AI 버블이 2027~2028년에 꺼질 것이라며 2027년 말 S&P500 목표치를 5,000으로 제시했다. 해석하면 장기 금리 5%대 고착 우려 속에 AI 하드웨어 전반의 고밸류 부담이 한꺼번에 드러난 하루였다.

**⑤ 회사 고유 재료 — 헤모네틱스 +17.46%(CSL 공급 계약 확대), 치폴레 +6.21%·스타벅스 −0.40%(스타벅스의 치폴레 인수 검토 보도), 펩시코 +3.73%(3분기 실적 상회), 에퀴팩스 +2.18%, 스페이스X −4.19%(\$400억 차입 계획)**
혈액 관리 장비 업체 헤모네틱스(HAE)는 CSL과의 공급 계약 확대를 확인하는 공시에 **\$119.47(+17.46%)**로 급등했다. 스타벅스가 치폴레 인수를 검토했다는 보도에 치폴레(CMG)는 \$32.68(+6.21%)로 올랐고, 스타벅스(SBUX)는 장중 \$87.35(−6.66%)까지 밀렸다가 \$93.21(−0.40%)로 낙폭을 대부분 회복했다. 펩시코(PEP)는 3분기 순이익 \$30.5억(주당 \$2.23)으로 예상을 웃돌아 \$128.34(+3.73%)로 올랐다. 스페이스X(SPCX)는 엔비디아 칩 구매용 \$400억 차입 계획 부담에 \$160.57(−4.19%)로 내렸고, 울프스피드(WOLF)는 국방부의 최대 \$15억 조건부 자금 지원 소식에 장중 +14.54%까지 올랐다가 \$31.02(−1.12%)로 하락 반전했다. 일라이 릴리(LLY)는 차익 실현에 \$1,169.60(−1.61%)였다.

**⑥ 🇰🇷 SK하이닉스 ADR \$170.50(−4.35%)·SOX −3.39%·야간선물 1,028.55(−1.88%) — 오늘 10/9(금) 한글날 휴장, 다음 개장 10/12(월)**
SK하이닉스 ADR(SKHY)은 시가 \$176.38에서 저가 \$167.21(−6.19%)까지 밀린 뒤 **\$170.50(−\$7.75, −4.35%)**로 마감해 닷새째 약세였다. 코스피200 야간선물(10/8 세션)은 **1,028.55(−19.70, −1.88%)**로 저가 1,014.15까지 밀렸다. 오늘 10/9(금)은 한글날 휴장이라 이 약세는 10/12(월) 개장에 반영된다. 해석하면 사흘 연휴 동안 미국 반도체 흐름과 중동 변수가 쌓인 채 월요일을 맞게 된다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 치폴레 멕시칸 그릴 (CMG) +6.21% — 스타벅스가 치폴레 인수를 검토했다는 보도, 장중 +8.55%**
치폴레는 시가 \$30.68에서 고가 \$33.40(+8.55%)까지 오른 뒤 \$32.68(+\$1.91, +6.21%)로 마감했다. 스타벅스가 시가총액 약 \$390억 규모의 치폴레 인수를 검토했다는 보도가 나오며 인수 프리미엄 기대가 붙었다. 스타벅스의 브라이언 니콜 CEO가 과거 치폴레 CEO였다는 점이 보도의 신빙성을 높였다는 평가가 나왔다. 장중 저가는 \$30.46으로 하루 대부분 전일 종가 위에서 거래됐다.

**2. 스타벅스 (SBUX) −0.40% — 치폴레 인수 검토 보도에 장중 −6.66%까지 밀렸다가 낙폭 대부분 회복**
스타벅스는 시가 \$93.00에서 저가 \$87.35(−6.66%)까지 밀린 뒤 \$93.21(−\$0.37, −0.40%)로 낙폭을 거의 되돌려 마감했다. 시가총액 약 \$390억의 치폴레 인수를 검토했다는 보도가 나오자 대규모 인수 자금 부담과 본업 회복 지연 우려가 한때 부각됐다. 오후 들어 실제 인수 제안 여부가 확인되지 않으면서 매도세가 잦아들었다.

**3. 헤모네틱스 (HAE) +17.46% — CSL과의 공급 계약 확대를 확인하는 규제 공시, 장중 +18.69%**
헤모네틱스는 시가 \$115.00에서 고가 \$120.72(+18.69%)까지 오른 뒤 \$119.47(+\$17.76, +17.46%)로 마감했다. 회사는 혈장 제제 기업 CSL과의 공급 계약을 확대했다는 내용을 규제 공시로 확인했고, 혈장 채취 장비의 장기 매출 가시성이 높아졌다는 평가가 나왔다. 프리마켓 +16.25%로 출발한 상승세가 정규장 내내 이어졌고 장중 저가도 \$111.66(+9.78%)이었다.

펩시코는 시가 \$124.31에서 고가 \$128.90(+4.18%)까지 오른 뒤 \$128.34(+\$4.61, +3.73%)로 마감했다. 3분기 순이익은 \$30.5억(주당 \$2.23)으로 1년 전 \$26억(주당 \$1.90)보다 늘며 이익과 매출 모두 예상을 웃돌았다. 회사는 연간 매출 성장 전망을 약 6%로 올렸지만 핵심 주당순이익 성장률 전망은 기존 5~7%의 하단에서 2.5~3.5%로 낮췄다. 라몬 라구아르타 CEO는 북미 사업의 실적 개선에 집중하고 있다고 밝혔다.

**5. 어플라이드 옵토일렉트로닉스 (AAOI) −13.58% — \$6억 규모 ATM 유상증자 계획·내부자 매도·약한 3분기 가이던스**
어플라이드 옵토일렉트로닉스는 시가 \$117.44에서 저가 \$104.88(−14.41%)까지 밀린 뒤 \$105.90(−\$16.64, −13.58%)로 마감했다. 회사가 \$6억 규모의 시장가 분할 유상증자(ATM) 계획을 밝힌 데다 내부자 매도와 시장 기대에 못 미친 3분기 가이던스가 겹쳤다. 광통신·AI 포토닉스 전반의 약세 속에 루멘텀(LITE)도 \$1,048.60(−5.62%)로 내려 낙폭이 커졌다.

**7. 스카이댄스 (SKYD) +4.39% — 워너브러더스 디스커버리 인수 완료 뒤 공동 CEO 인터뷰, 통합 전략 발표에 거래 사흘째 반등**
스카이댄스는 시가 \$8.96에서 고가 \$9.52(+7.14%)까지 오른 뒤 \$9.28(+\$0.39, +4.39%)로 마감했다. 파라마운트의 워너브러더스 디스커버리 인수가 완료된 뒤 데이비드 엘리슨 공동 CEO가 CNBC 인터뷰에서 통합 회사가 모든 사업 영역에서 이길 수 있는 위치에 있다고 밝혔다. 회사는 또 다른 공동 CEO인 이논 크라이즈가 통합 작업과 일상 운영을 맡는다고 발표했다. 전날 −6.72% 급락 이후 새 경영 체제와 합병 시너지 기대가 부각되며 거래 사흘째 반등했다.
