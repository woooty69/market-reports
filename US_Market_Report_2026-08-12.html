## 🗓 시장 요약

**"유가는 오르고, 물가 지표는 내일이다."** 8/11 뉴욕증시는 3대 지수가 나란히 소폭 밀렸다. 하락의 성격은 매도라기보다 **관망**에 가깝다. 러셀2000이 +0.45%로 홀로 상승했고 VIX는 오히려 15.28로 내려앉았다. 대형주에서만 돈이 빠졌다는 뜻이다.

빠져나간 자리의 이유는 두 갈래다. 첫째는 **호르무즈**다. 이란 최고국가안보회의 사무총장이 "우리 조건이 충족되기 전까지 해협은 열리지 않는다"고 재확인하면서 WTI가 \$83.20(+1.30%)까지 올라섰다. 지난주 랠리를 떠받쳤던 '유가 안정' 전제가 이틀 연속 훼손된 셈이다. 둘째는 **알파벳**이다. GOOGL이 −3.84% 밀리며 커뮤니케이션서비스 업종을 −2% 넘게 끌어내렸고, 이 한 업종이 S&P 하락분의 상당 부분을 설명한다.

역설적인 건 **채권**이었다. 유가가 올랐는데도 2년물 −2.1bp, 10년물 −1.0bp로 금리가 내렸다. 이란 협상 관련 보도가 오가는 국면에서 안전자산 수요가 붙은 결과로, **유가 상승 → 금리 상승**이라는 지난주의 공식이 이날은 작동하지 않았다. 다만 9월 FOMC 인상 확률은 41.4% → **47.4%**로 되올라와, 시장이 물가 재점화 가능성을 완전히 지우지는 않았음을 보여준다.

한국 입장에서 중요한 건 지수가 아니라 **반도체**다. SOX가 +0.87%로 사흘 만에 반등했고, 마이크론 +0.84%·샌디스크 +2.68%로 메모리가 살아났다. 그중에서도 **SK하이닉스 ADR이 +4.70%($141.65)로 압도적**이었다. 국내 SK하이닉스(000660)가 같은 날 +0.35%에 그친 탓에 **괴리율은 +34.3% → +40.9%로 하루 만에 6.6%p 벌어졌다.** 8/13 실적을 앞두고 미국 쪽 기대가 국내를 크게 앞서고 있다는 신호다.

## 📰 헤드라인 3선

**1. 이란 "조건 충족 전엔 해협 안 연다" — 유가 이틀째 상승, CPI 전야에 악재**
이란 최고국가안보회의 사무총장이 호르무즈 해협 재개방에 선결 조건을 재차 못 박으면서 WTI가 배럴당 \$83.20으로 +1.30% 올랐다. 8/10 +5.05%에 이은 연속 상승으로, 이틀간 상승률은 6.4%에 달한다. **7월 CPI가 발표되는 바로 전날 에너지가격이 다시 튄 것**은 물가 경로에 대한 불확실성을 키우는 조합이다.

**2. 알파벳 −3.84%, 5거래일 중 4일 하락 — 자본지출 쇼크가 이어진다**
알파벳이 2026년 자본지출 전망을 **\$1,950억~2,050억**으로 상향하고, 분기 자본지출이 전년 대비 100% 늘어난 \$449억을 기록하면서 **잉여현금흐름이 사상 처음 마이너스**로 돌아선 여파가 계속되고 있다. 여기에 지난주 발표된 AI 조직 개편까지 겹치며 최근 5거래일 중 4일을 하락으로 마쳤다.

**3. 엔비디아, 하이퍼스케일러 데이터센터에 5,000억 달러 파이낸싱 컨소시엄 추진**
엔비디아가 6개 안팎의 금융사와 손잡고 하이퍼스케일러·프런티어 AI 연구소의 데이터센터 구축을 위한 **5,000억 달러 이상 자금 조달**을 준비 중이라는 소식이 전해졌다. 참여가 거론된 KKR이 +6.91% 급등했고, **AI 인프라 투자의 자금줄이 자기자본에서 구조화금융으로 넘어가는 국면**임을 보여주는 사건이다.

## 🏭 섹션 1. 업종별 흐름

**상승 ①  에너지**
호르무즈 재개방 지연으로 WTI가 \$83.20(+1.30%)까지 오르며 정유·에너지가 강세를 보였다. 마라톤페트롤리엄(MPC) +5.01%가 대표적이다.

> 🇰🇷 [전달] 유가 이틀 연속 상승은 국내 정유(S-Oil·GS)에 정제마진 개선 재료, 반대로 항공·화학·해운엔 원가 부담. 원/달러 1,417원대 약세와 겹치면 부담이 배가된다.

**상승 ②  반도체·메모리**
SOX가 +0.87%(12,098.50)로 사흘 만에 반등했다. 마이크론 +0.84%, 샌디스크 +2.68%, SK하이닉스 ADR +4.70%로 **메모리 3인방이 지수 상승을 주도**한 반면 엔비디아는 −0.03%로 이틀째 제자리였다. 전날 애플의 중국 CXMT 메모리 시험 적용 우려로 −2.94% 급락한 데 대한 되돌림 성격이 크다.

> 🇰🇷 [전달] SOX 반등 + SKHY +4.70%는 SK하이닉스(000660)·삼성전자(005930)에 우호적. 다만 어제 국내 반등이 삼성전자(+4%) 중심이었던 만큼 오늘은 **주도주 교대** 가능성.

**상승 ③  금융·대체투자**
KKR이 실적과 AI 파이낸싱 재료를 동시에 얻어 +6.91% 급등했다. 대형 사모펀드가 데이터센터 자금 조달의 핵심 통로로 재평가되는 흐름이다.

**하락 ①  커뮤니케이션서비스 (−2%대, S&P 최약)**
알파벳 −3.84%, 앱러빈 −6.01%가 업종을 끌어내렸다. 넷플릭스도 −1.97%로 부진했다. **AI 자본지출이 이익보다 앞서간다**는 우려가 이 업종에 집중되고 있다.

> 🇰🇷 [전달] 국내 직접 연결고리는 약하나, '자본지출 급증 → FCF 훼손' 논리는 **증설을 발표한 SK하이닉스(000660)에도 그대로 적용될 수 있는 프레임**이라 8/13 실적에서 주주환원 규모가 중요해졌다.

**하락 ②  산업재**
허니웰(HON) −5.27%가 다우 최약세권에 머물렀다. 항공우주 부문의 연간 유기적 매출 성장률 가이던스 하향(7~9% → 4~5%) 충격이 이어지는 흐름이다. 아멘텀(AMTM) −8.18%로 방산·정부용역도 약했다.

**하락 ③  소프트웨어**
데이터독(DDOG) −5.37%로 관측·모니터링 소프트웨어가 밀렸다. 벤타스(VTR) −5.43%로 리츠도 부진했다.

**[판정]** 지수 하락에도 **한국 관련 신호는 우호적**이다. SOX +0.87%, SKHY +4.70%, 괴리율 +40.9%의 조합은 국내 반도체에 상방 압력으로 작용한다. 다만 ①야간선물 미확인, ②유가 이틀 연속 상승에 따른 항공·화학·해운 부담, ③미국 CPI(오늘 밤 21:30 KST) 대기 관망이 상단을 제한할 소지가 있다. (무효화: CPI 예상 상회, 유가 \$85 돌파, 또는 외국인 순매도 재확대 시)

## 🔍 섹션 2. 이슈 종목 10선

**1. SK하이닉스 ADR (SKHY) +4.70% — $141.65, 괴리율 +40.9%로 재확대**
전 거래일 −1.90%의 낙폭을 하루 만에 되돌리며 \$141.65로 마감했다. 장중 고가 \$141.87로 사실상 고점 마감이었고, 시간외에서는 −0.46%(\$141.00)로 소폭 되밀렸다. 애널리스트 14인의 컨센서스는 여전히 **Strong Buy, 목표주가 \$244.92**다.
같은 날 국내 SK하이닉스(000660)는 **1,425,000원(+0.35%, +5,000원)**에 그쳤다. 외국인은 **−21만 592주 순매도**로 매도를 이어갔으나 전날 −28만 6,575주 대비 규모는 줄었고, 기관은 +6만 8,354주 순매수로 방향이 갈렸다.
그 결과 **괴리율이 +34.3% → +40.9%로 하루 만에 6.6%p 벌어졌다.** ADR이 +4.70% 오르는 동안 국내가 +0.35%에 머문 데다 환율까지 1,409.64원 → 1,417.00원으로 원화가 약해진 삼중 효과다. **8/13 실적과 3분기 주주환원안**이 이 격차를 좁힐지 벌릴지의 분기점이다.

**2. 알파벳 (GOOGL) −3.84% — $343.80, 자본지출이 주가를 누른다**
2026년 자본지출 가이던스를 **\$1,950억~2,050억**으로 올린 데 이어, 분기 자본지출이 전년 동기 대비 100% 급증한 **\$449억**을 기록하며 잉여현금흐름이 처음으로 마이너스 전환했다. 시장은 이를 "AI 투자 회수기가 예상보다 길다"는 신호로 읽고 있다.
여기에 구글이 지난주 AI 조직을 개편한다고 발표한 것도 불확실성을 더했다. 최근 **5거래일 중 4일을 하락**으로 마감하며 추세적 약세에 들어섰다.
거래량 2,775만 주로 대형주 중 매도가 집중됐고, 이 한 종목이 **커뮤니케이션서비스 업종을 −2% 넘게** 끌어내리며 S&P 500 전체 하락의 주된 원인이 됐다.

**3. KKR +6.91% — $111.00, 실적과 AI 파이낸싱의 겹경사**
분기 **사상 최대 실적**을 발표했다. 수수료 수익의 견조한 성장과 자산 매각(모네타이제이션)이 동시에 기여했고, 다년 목표로 잡았던 펀드레이징 규모도 초과 달성했다.
여기에 **엔비디아가 6개 안팎의 금융사와 5,000억 달러 이상의 하이퍼스케일러·AI 데이터센터 파이낸싱을 추진**한다는 보도가 겹치며 상승폭이 확대됐다. AI 인프라 투자가 자기자본에서 **구조화금융·사모대출로 이동**하는 흐름의 최대 수혜주로 지목된 것이다.
거래량 754만 주. 대형 대체투자사가 'AI 테마주'로 재분류되는 국면으로, 아폴로(APO) 등 동종 업체에도 파급됐다.

**4. 자빌 (JBL) +5.94% — $356.61, UBS 투자의견 상향**
UBS가 투자의견을 **Buy로 상향**하면서 급등했다. 회로기판(PCB) 제조를 기반으로 AI 데이터센터용 하드웨어 공급망에 깊숙이 편입돼 있다는 점이 상향 근거로 거론됐다.
거래량 87만 9,530주로 평소 대비 크게 늘었다. 대형 AI 반도체가 쉬어가는 날에도 **후공정·기판·조립 등 '두 번째 줄' 공급망은 별도로 재평가**받고 있다는 신호다.
국내로 보면 AI 서버용 기판·패키징 밸류체인(심텍·이수페타시스 등)에 심리적 온기를 줄 수 있는 재료다.

**5. 마라톤페트롤리엄 (MPC) +5.01% — $336.37, 유가 상승의 직접 수혜**
호르무즈 재개방 지연으로 WTI가 이틀간 6.4% 오르면서 정유 업종이 강세를 보였고, 그 선두에 섰다. 거래량 299만 주.
정유주는 유가 자체보다 **정제마진(크랙 스프레드)**에 반응하는데, 중동발 원유 공급 차질은 제품 가격을 더 크게 밀어올리는 경향이 있어 마진 확대 기대가 형성됐다.
브렌트유도 \$88.91(+1.4%)로 동반 상승해 WTI-브렌트 스프레드가 유지된 점도 미국 정유사에 우호적이었다.

**6. 앱러빈 (APP) −6.01% — $318.64, BofA 투자의견 하향**
뱅크오브아메리카가 투자의견을 **Neutral로 하향**하면서 급락했다. 알파벳과 함께 커뮤니케이션서비스 업종 하락을 이끈 두 축 중 하나였다.
거래량 739만 주. 광고 테크 업종 전반의 밸류에이션 부담이 지적되는 국면으로, 실적 자체보다 **주가가 이미 반영한 성장률의 높이**가 문제로 거론됐다.
AI 수혜주로 분류돼 급등했던 종목군이 개별 리서치 하향에 취약해진 모습이다.

**7. 데이터독 (DDOG) −5.37% — $246.78, 소프트웨어 디레이팅 지속**
클라우드 모니터링 소프트웨어 대표주가 −5%대로 밀렸다. 거래량 412만 주.
AI 인프라 투자가 늘어도 **애플리케이션 계층 SaaS의 수혜는 시차가 크다**는 인식이 확산되면서, 반도체·하드웨어와 소프트웨어 간 온도차가 벌어지고 있다.
같은 날 SOX가 +0.87% 오른 것과 대비되며, **AI 밸류체인 내부의 자금 이동**이 진행 중임을 보여준다.

**8. 허니웰 (HON) −5.27% — $230.12, 항공우주 가이던스 하향 여진**
항공우주 부문의 연간 유기적 매출 성장률 전망이 기존 **7~9%에서 4~5%로 하향**된 충격이 이어졌다. 거래량 535만 주.
다우 구성종목 중 최약세권에 머물며 지수 하락(−184.13)에 실질적으로 기여했다.
산업재 전반으로는 아멘텀(AMTM) −8.18%까지 겹치며, **방산·항공우주·정부용역**이 이날 가장 약한 하위 업종을 형성했다.

**9. 스페이스X (SPCX) −3.88% — $133.36, 거래량 1억 주의 변동성**
거래량 **1억 301만 주**로 이날 시장에서 두 번째로 많이 거래됐다. 상장 초기 종목 특유의 높은 회전율이 이어지고 있다.
−3.88%로 하락률 상위에도 이름을 올려, **거래대금 상위와 낙폭 상위에 동시 등재**되는 전형적인 고변동성 패턴을 보였다.
지수 영향은 제한적이지만, 개인 자금이 몰린 종목에서 차익실현이 나오는 국면이라는 점에서 시장 심리의 온도계 역할을 한다.

**10. 마이크론(MU)·샌디스크(SNDK) — 메모리가 SOX를 끌어올렸다**
마이크론은 **\$868.25(+0.84%)**에 마감하며 거래량 2,676만 주로 이날 가장 활발히 거래된 종목에 올랐다. 샌디스크는 **\$1,271.05(+2.68%)**로 상승폭이 더 컸다.
전날 애플의 중국 CXMT 메모리 시험 적용 소식으로 −2.94% 급락했던 SOX가 이날 +0.87% 반등한 배경에는 이 두 종목과 SKHY의 강세가 있다. 반면 엔비디아는 **\$217.48(−0.03%)**로 이틀째 보합에 머물렀다.
**로직(엔비디아)은 쉬고 메모리는 오르는 구도**는 국내 SK하이닉스(000660)·삼성전자(005930)에 직접적으로 유리한 조합이다.
