## 🗓 시장 요약

**① 하루 만에 반등 반납, 코스피 3.6% 급락…외국인·기관 2조원 매도**
코스피는 2.46% 내린 5,715.19로 출발해 장중 5,615.80까지 밀렸고 결국 210.29포인트(−3.59%) 떨어진 5,648.79에 마감했다. 최근 6거래일 중 3% 넘게 움직인 날이 4번일 만큼 변동성이 커졌다. 외국인은 1조 5,086억원, 기관은 4,941억원을 순매도했고 개인이 1조 6,388억원을 사들였다. 기관 안에서는 연기금만 순매수했고 금융투자·투신·사모가 동반 매도했다.

**② 반도체: 국내는 'AI 투자비 청구서'에 급락, 밤사이 미국은 반등**
오라클의 200억달러 자금조달 소식에 'AI 투자를 회수할 수 있느냐'는 의구심이 커지며 SK하이닉스(−5.03%, 거래대금 3조 2,267억원)·삼성전자(−4.15%)·삼성전기(−7.38%)가 동반 급락했고 반도체와반도체장비 업종은 −3.46%(168종목 중 157종목 하락)였다. 밤사이 미국에서는 AI 대형주가 반등하며 필라델피아 반도체지수가 2.63% 올라 전날 낙폭(−3.37%)의 상당 부분을 되찾았다. 다만 미국 상무부가 SK하이닉스 중국 공장에 대한 미국산 장비 수출 허가를 보류했다는 보도와 뉴욕 반도체 사업 계획이 대중 제재로 난관에 부딪혔다는 소식은 부담이다.

**③ 강세 업종: 항공(경영권 분쟁)·보안(해킹)·우주**
호반그룹과 조원태 회장의 한진칼 지분 경쟁이 불붙으며 한진칼·한진칼우가 상한가, 한진이 23.08% 올랐고 항공사 업종은 +14.74%였다. 밤사이에는 조원태 회장이 JAL에 판 지분을 되사고 LX판토스·이마트·네이버·GS리테일 등 우호지분을 확보했다는 보도가 이어졌다. 한양증권 해킹과 대통령 순방단 개인정보 유출이 잇따르며 한싹이 상한가, 에스투더블유가 +14.73%였고, KPS 시험장비 납품을 마친 AP위성도 상한가였다.

**④ 약세 업종: 정유·2차전지·전자부품·원전**
WTI가 7%대 급락한 배럴당 96달러선으로 내려오자 석유와가스 업종이 −5.25%로 밀려 S-Oil(−11.77%)·SK이노베이션(−9.36%)이 급락했다. LG에너지솔루션은 3분기 영업이익 7,560억원을 냈음에도 5.06% 내렸고 삼성SDI는 9.20% 빠졌다. 전자장비와기기(−5.40%)·전기제품(−4.81%)이 약했고 두산에너빌리티(−6.28%)는 체코 원전 지연 여파로 연중 최저가를 기록했다.

**⑤ 환율·물가·외부 변수: 원/달러 1,340원대, 10월 물가 2.8%, 중간선거 개표**
원/달러 환율은 15:30 기준 1,341.0원(−2.8원)으로 마감했고 하나은행 아침 고시는 1,345.50원(−0.50원)이다. 10월 소비자물가는 전년 대비 2.8% 올라 두 달 연속 2%대 후반을 이어갔고, 11월 금통위를 앞두고 금리 인상 고심 보도가 나왔다. 미국은 3일(현지) 중간선거를 치렀고 개표 결과가 오늘 장중 윤곽을 드러낸다. 밤사이 다우는 애플 약세에 0.38% 내렸지만 S&P500은 0.36% 올랐고, AMD는 장 마감 뒤 실적을 발표했다.

**⑥ 코스닥·장 마감 후: 700선 턱걸이, 하이브·심텍·알테오젠 깜짝 실적**
코스닥은 4.08% 내린 704.39로 장중 702.34까지 밀렸고 외국인(−713억원)·기관(−2,359억원)이 동반 매도했다. 새내기주 래블업은 거래대금 8,089억원 속에 25.16% 급락했다. 장 마감 뒤에는 하이브가 3분기 매출 1조 5,257억원·영업이익 1,885억원으로 분기 최대 실적을, 심텍이 영업이익 1,018억원(+721.6%)과 1,054억원 시설투자를 발표했다. 알테오젠은 첫 분기 매출 1,000억원 돌파를 알렸다.

## 1. 업종별 흐름

**상승 업종** — 항공사(+14.74%, 9종목 중 8종목 상승)가 한진칼 경영권 분쟁 기대에 독보적으로 올랐고 대한항공(+1.92%)도 동반 상승했다. 출판(+3.33%)·게임엔터테인먼트(+2.11%)·다각화된통신서비스(+1.67%)·종이와목재(+1.62%)·광고(+1.58%)·기타금융(+1.41%)이 뒤를 이었는데, 종이와목재는 깨끗한나라(+29.95%) 상한가 영향이 컸다. 해킹 사고가 잇따르며 보안주와 원화 강세 수혜주(항공)로 매수세가 몰렸다.

**하락 업종** — 전자장비와기기(−5.40%, 98종목 중 77종목 하락)·석유와가스(−5.25%)·전기제품(−4.81%)·전자제품(−4.76%)·통신장비(−3.78%)·기계(−3.78%)·디스플레이장비및부품(−3.70%)·철강(−3.66%)·반도체와반도체장비(−3.46%)가 약했다. 대덕전자(−13.30%)·이수페타시스(−9.32%)·삼성전기(−7.38%) 등 기판·부품주와 2차전지 소재·전력기기주 낙폭이 컸다. 하락률 상위에는 씨엠티엑스(−28.50%)·래블업(−25.16%)·디티에스(−19.60%)가 이름을 올렸다.

**시장의 시선** — 미국 빅테크가 호실적을 내도 '투자비 회수' 의구심이 반복되면서 시장은 AI 밸류체인(반도체·기판·전력기기·배터리)에서 돈을 빼 개별 재료주(경영권 분쟁·해킹 보안·우주)와 원화 강세 수혜주로 옮겨 가는 모습이다. 밤사이 필라델피아 반도체지수가 2.63% 반등하고 야간선물이 1.70% 올라 오늘은 반도체 중심의 되돌림이 먼저 나올 가능성이 있다. 다만 중간선거 개표 결과에 따른 AI·데이터센터 규제 우려와 SK하이닉스 중국 공장 장비 반입 문제가 반등 폭을 제한할 수 있다. 기사로는 LFP 양극재·철강·리튬·해킹 보안사고·자사주 소각·경영권 분쟁·ESS 테마가 많이 다뤄졌다.

## 🏛 새로운 정책
