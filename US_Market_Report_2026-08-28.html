## 🗓 시장 요약

**① 엔비디아 +8.74% — 하루 만에 뒤집혔다, 이유는 '내년 70% 성장' 한마디**
실적 발표 당일 시간외에서 1~2% 빠졌던 엔비디아가 정규장에서 **8.74% 급등**했다. 결정타는 숫자가 아니라 **가이던스**였다. 회사가 **다음 회계연도 매출이 약 70% 늘어날 것**이라고 밝힌 것이다. 모간스탠리는 이 전망이 **자사 추정치 52%는 물론 시장 평균 예상치 40%를 크게 웃돈다**고 평가했다. 조지프 무어 애널리스트는 **"엔비디아가 더 높은 성장을 가로막는 장벽을 계속 무너뜨릴 것"**이라고 했다. 나스닥이 **+411.16p(+1.57%)**, SOX가 **+2.33%** 뛰었다.

**② 진짜 놀라운 건 소프트웨어였다 — 세일즈포스 +22.60%, 크라우드스트라이크 +20.50%, 옥타 +23.30%**
이번 주 내내 두들겨 맞던 소프트웨어가 하루 만에 반전했다. **세일즈포스가 22.60% 급등**했다 — 연간 매출·이익 전망을 상향했고 **앤스로픽의 클로드와 연동되는 신규 기능**을 내놨다. 2분기 조정 EPS는 **5.90달러**로 LSEG 컨센서스 **3.27달러**를 압도했다. 크라우드스트라이크는 **+20.50%**, 옥타는 **+23.30%**, 비바시스템즈는 **+19.00%**로 뒤따랐다. **"AI 도구가 기존 소프트웨어 산업을 뒤흔들 것"이라는 공포가 실적으로 반박된 하루**다. 8/26 인튜이트 −9.20%로 시작된 소프트웨어 공포가 정확히 하루 만에 소멸했다.

**③ 그런데 오른 것은 기술주뿐이었다 — 11개 업종 중 10개가 하락**
**S&P500 정보기술 업종이 +3.4%로 홀로 크게 올랐고 나머지 업종은 모두 내렸다.** 그래서 나스닥은 +1.57%인데 다우는 **+0.20%**에 그쳤다. 찰리 리플리 알리안츠 선임투자전략가는 **"엔비디아의 실적 호조와 강한 가이던스가 잔치를 다시 시작했지만 시장의 모든 업종이 초대받은 것은 아니라는 점이 분명하다"**며 **높은 금리, 지정학적 긴장, 글로벌 무역**을 다른 업종 약세의 원인으로 지목했다. **폭이 극도로 좁은 랠리**라는 점이 이날의 경계 신호다.

**④ 연준 인사들은 매파로 정렬했다 — 그리고 오늘 밤 워시 연설**
전날 근원 PCE가 예상을 웃돈 뒤 연준 인사들이 일제히 매파적 발언을 내놨다. 제프 슈미드 캔자스시티 연은 총재는 **물가가 목표를 웃도는 상황에서 현재 금리가 경제를 억제하고 있지 않다**고 했고, 베스 해맥 클리블랜드 연은 총재는 **"지금이 물가 압력을 억제하기 위해 행동에 나설 때"**라고 밝혔다. 수전 콜린스 보스턴 연은 총재도 **"금리가 여전히 완만하게 제약적"**이라고 평가했다. 국채금리는 **10년물 4.680%(+2.8bp)로 오르고 2년물은 4.220%(−2.0bp)로 내리는 베어 스티프닝**이 나타났다. **오늘 밤 케빈 워시 의장의 잭슨홀 첫 연설**이 이번 주 마지막 관문이다.

**⑤ 유가가 다시 올랐다 — 이란 MOU 복귀 거부 보도**
WTI가 **배럴당 \$83.67(+1.75%)**로 반등했다. 월스트리트저널이 **트럼프 행정부가 지난 6월 이란과 맺은 양해각서 조건으로 돌아갈 의사가 없다고 중재국들에 통보했다**고 보도한 영향이다. 사흘간의 하락이 끊겼다. 엔비디아도 **메모리 부품 부족이 업계 성장 속도를 제약할 수 있다**고 경고했는데, **유가와 부품 부족이 동시에 물가를 밀어올리는 구조**가 워시 의장의 판단을 어렵게 만든다.

**⑥ 한국은 금리를 올렸다 — 그래도 코스피는 +1.53%**
한국은행 금융통화위원회가 **기준금리를 연 3.00%로 인상**했다. 7월에 이어 **2회 연속 인상('백투백')**이다. 코스피는 엔비디아 효과로 장 초반 **7,000선에 근접**했으나 금리 인상 발표 후 상승폭을 반납해 **+1.53%(6,912.37)**로 마감했다. 코스닥은 **+1.30%(837.65)**. SK하이닉스(000660)는 **+2.49%(1,730,000원)**로 나흘 연속 올라 시가총액 **1,263조원**을 회복했다. 외국인은 **−15만 9,385주**로 4일 연속 순매도지만 폭은 계속 줄고 있다. 원/달러는 **1,380.9원(−3.9원)**으로 **11개월 만의 최저**, 장중에는 1,370원대까지 내려갔다. 신현송 한은 총재는 **"아직도 높은 수준"**이라며 원화가 더 강해져야 한다고 밝혔다.

> *어제 판정 복기 — **맞았다.** '갭업 출발 후 상승 유지'를 기본으로 보고 **"엔비디아 본주는 sell the news로 빠졌지만 국내 메모리주에는 '마진 전가 확인'이라는 별개의 호재가 성립한다"**고 했다. 실제로 코스피 **+1.53%**, SK하이닉스 **+2.49%**, SKHY **+2.27%**로 그대로 나타났다. 상단 제한 요인으로 짚은 **금통위**도 정확히 작동했다(장중 7,000선 근접 → 금리 인상 후 반납). **다만 엔비디아 본주가 다음 날 +8.74%로 뒤집힐 것까지는 보지 못했다** — 시간외 반응만 보고 방향을 단정하면 안 된다는 사례가 하나 더 쌓였다.*

**상승 ①  소프트웨어 (이날 최강, 반전)**
세일즈포스 **+22.60%**, 옥타 **+23.30%**, 크라우드스트라이크 **+20.50%**, 비바시스템즈 **+19.00%**. 서비스나우·팔로알토네트웍스도 상승했다. 8/26 인튜이트 **−9.20%**로 촉발된 **"AI가 소프트웨어를 대체한다"는 공포가 실적으로 반박**됐다.

**상승 ②  AI 반도체**
엔비디아 **+8.74%**, SOX **+2.33%**, SK하이닉스 ADR **+2.27%**. 다만 소프트웨어 상승폭이 훨씬 커서 **AI 호황의 최대 수혜 업종으로 꼽히던 반도체와의 격차가 좁혀졌다.**

> 🇰🇷 [전달] 미 반도체·소프트웨어 동반 강세는 우호적이지만 **코스피200 야간선물은 −0.73%(1,081.85)로 되밀렸다.** 다만 장중을 보면 정규장 종가(1,089.85) 위 **1,096.85에서 출발해 고가 1,096.95까지 올랐다가 저가 1,066.75(−2.12%)까지 급락한 뒤 회복**한 흐름이다 — 미 강세를 반영했다가 되돌린 것이지 처음부터 반대로 간 것이 아니다. **엔비디아가 경고한 '메모리 부품 부족'**은 국내 메모리에는 오히려 가격 협상력 재료다.

**하락 ①  소비재·유통 (이날 최약)**
배스앤바디웍스가 **−23.00%** 폭락했다. 2분기 매출과 이익이 모두 전년 대비 감소했다. 호멜푸즈도 **−9.10%** 급락했다 — 매출이 예상을 밑돌았고 **연간 매출 전망까지 하향**했다.

**하락 ②  헬스케어**
모더나가 **−4.60%** 하락했다. **20억 달러 규모 전환사채 발행**을 발표한 것이 희석 우려로 이어졌다.

**하락 ③  하드웨어**
HP가 **−1.50%** 내렸다. 3분기 **PC 부문 출하량과 마진이 모두 감소**했다. 메모리 가격 상승이 PC 제조사의 원가를 압박하는 구조가 확인됐다.

**[판정]** **보합권 출발, 미 증시 강세에 비해 국내 상승 여력은 제한적으로 본다.**
**상방 근거**: ①**엔비디아 +8.74%**·내년 매출 70% 성장 가이던스, ②**SOX +2.33%**·SKHY **+2.27%**, ③**소프트웨어 대반전**(세일즈포스 +22.60%, 옥타 +23.30%)으로 AI 사이클 신뢰 회복, ④외국인 순매도 폭 4일 연속 축소(−123.4만 → −15.9만 주)에 더해 **코스피200 선물시장에서 외국인 1조 4,618억원 순매수**, ⑤**SK하이닉스 인디애나 40억 달러 기공식**으로 미국 내 HBM 생산 로드맵 구체화.
**하방 근거**: ①**코스피200 야간선물 −0.73%(1,081.85)** — 초반 +0.64%에서 **저가 1,066.75(−2.12%)까지 밀린 뒤 회복**, ②**S&P500 11개 업종 중 10개 하락**한 극도로 좁은 랠리, ③**연준 인사 매파 발언 정렬**(슈미드·해맥·콜린스), ④**10년물 4.680%로 재상승**, ⑤**WTI \$83.67로 반등**(이란 MOU 복귀 거부), ⑥**전날 기준금리 3.00% 인상** 여파.
**판정: 보합~소폭 상승 출발 후 상단 제한**으로 본다. **야간선물의 장중 궤적이 핵심이다** — 정규장 종가(1,089.85) 위 **1,096.85로 출발해 1,096.95까지 올랐다가 1,066.75(−2.12%)까지 급락한 뒤 1,081.85로 마감**했다. 미 반도체 강세는 초반에 분명히 반영됐고 이후 되돌려졌다는 뜻이며, **전날 코스피 +1.53%에 이미 선반영된 부분과 금리 인상 부담이 겹친 결과**로 해석된다. 다만 **하락 전환의 구체적 트리거는 확인되지 않았다.** **오늘 밤 워시 의장의 잭슨홀 첫 연설**을 앞둔 주말 포지션 정리도 겹친다. (무효화: 워시 연설이 비둘기적으로 해석될 경우 다음 주 상단 재평가)

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 엔비디아 (NVDA) +8.74% — "내년 매출 70% 성장", 시간외 하락을 하루 만에 뒤집었다**
실적 발표 직후 시간외에서 1~2% 하락했던 주가가 정규장에서 **8.74% 급등**했다. 반전의 계기는 발표 숫자가 아니라 **콘퍼런스콜에서 제시한 다음 회계연도 전망**이었다. 회사는 **매출이 약 70% 증가할 것**이라고 밝혔다.
모간스탠리는 이 전망이 **자사 추정치 52%와 시장 평균 예상치 40%를 크게 웃돈다**고 평가했다. 조지프 무어 애널리스트는 **"엔비디아가 더 높은 성장을 가로막는 장벽을 계속 무너뜨릴 것으로 본다"**고 밝혔다.
다만 회사는 경고도 남겼다. **메모리 부품 부족이 업계 성장 속도를 제약할 수 있다**는 것이다. 이토로의 랄레 아코네르 전략가는 **"엔비디아 실적은 AI 호황의 수요가 아직 고갈되지 않았음을 보여준다"**면서도 **"그 성장을 실현하는 데 드는 비용과 자본은 점점 커지고 있다"**고 진단했다. 엔비디아는 별도로 정치자금 모금 조직 **'NVPAC'을 신설**해 워싱턴 영향력 확대에 나섰다.

**2. SK하이닉스 ADR (SKHY) +2.27% — \$161.61 (괴리율: +29.0%), 인디애나에 첫 삽을 떴다**
엔비디아 훈풍에 2% 넘게 올랐다. 개장 전에는 **4.5%**까지 상승했다. 같은 날 **인디애나주 웨스트라파예트에서 40억 달러 규모 AI 메모리 첨단 패키징·R&D 공장 기공식**을 열었다. 곽노정 대표는 **2029년 '메이드 인 USA' HBM 양산**을 공언했고, 퍼듀대학교와 MOU도 체결했다. CNBC에 따르면 **2030년까지 인디애나를 핵심 메모리 생산 거점으로 삼겠다**는 구상이다.
SK그룹 차원의 투자 계획도 함께 발표됐다. 유정준 부회장은 **2030년까지 미국에 450억 달러 이상을 투자하겠다**고 밝혔다. 앞서 니덤은 목표주가를 **\$220**, BofA는 **\$250**으로 제시한 바 있다.
국내 주가는 **+2.49%(1,730,000원)**로 나흘 연속 올라 시가총액 **1,263조원**을 회복했다. 외국인은 **−15만 9,385주**로 4일 연속 순매도했지만 폭은 계속 줄고 있다. 거래대금 **10.3조원**. 원/달러가 **1,380.9원**까지 내려오며 괴리율은 **+29.6% → +29.0%**로 소폭 축소됐다.

**3. 세일즈포스 (CRM) +22.60% — EPS 5.90달러, 컨센서스 3.27달러를 압도했다**
CRM 소프트웨어 대표주가 22% 넘게 폭등했다. 2분기 **조정 주당순이익이 5.90달러**로 LSEG 컨센서스 **3.27달러**를 압도적으로 웃돌았다. 여기에 **연간 매출과 이익 전망을 동시에 상향**했다.
결정적 재료는 따로 있었다. **앤스로픽의 클로드(Claude)와 연동되는 신규 기능**을 공개하며 AI 파트너십을 확대한 것이다. 그동안 시장이 우려하던 **"AI가 기존 SaaS를 대체한다"는 구도**를, 오히려 **AI를 제품에 얹어 성장한다는 반대 서사**로 뒤집었다.
전날 이 종목은 인튜이트발 가이던스 충격에 **−2.00%** 하락했었다. 하루 만에 24%p 넘는 반전이다. **실적 시즌에서 소프트웨어 밸류에이션이 얼마나 얇은 근거 위에 서 있었는지**를 보여주는 사례다.

**4. 옥타 (OKTA) +23.30% — 이날 최대 상승, 실적과 가이던스 동시 상향**
클라우드 인증·보안 소프트웨어 기업이 23% 넘게 급등하며 이날 상승률 1위에 올랐다. **2분기 실적이 월가 예상을 상회**했고 **연간 가이던스까지 상향**했다.
옥타는 기업의 접속 권한 관리를 담당하는 회사다. **AI 에이전트가 기업 시스템에 접근하려면 인증·권한 관리 수요가 오히려 늘어난다**는 구조적 논리가 실적으로 확인됐다.
같은 날 크라우드스트라이크 **+20.50%**, 비바시스템즈 **+19.00%**도 실적 호조로 급등했다. **하루에 소프트웨어 4개 종목이 19~23% 오른 것**은 그만큼 직전까지 공포가 과도했다는 뜻이다.

**5. 크라우드스트라이크 (CRWD) +20.50% — 연간 전망 상향, 밸류에이션 부담을 실적으로 뚫었다**
사이버보안 대표주가 20% 넘게 급등했다. **2분기 매출과 주당순이익이 모두 시장 컨센서스를 상회**했고 **연간 매출 전망을 상향**했다.
이 종목은 8/20 리포트에서 **선행 P/E 166배, 선행 P/S 35배**라는 밸류에이션 부담 때문에 **−5.60%** 하락했던 종목이다. 당시 "실적이나 신규 순증 ARR 가속이 컨센서스를 넘지 못하면 하방 위험이 크다"는 분석이 지배적이었다.
결과는 정반대였다. **높은 밸류에이션은 실적이 따라오면 정당화된다**는 원론이 다시 확인됐다. 세일즈포스와 함께 **AI 도구가 기존 소프트웨어 산업을 뒤흔들 것이라는 우려를 누그러뜨린** 두 축이다.

**6. 호멜푸즈 (HRL) −9.10% — 매출 미달에 연간 전망까지 하향**
식품 가공업체가 9% 넘게 급락했다. **2분기 매출이 월가 예상을 밑돌았고 연간 매출 전망까지 하향**했다. 기술주가 폭등한 날에 나온 −9.10%라 대비가 더 선명했다.
이날 S&P500에서 **정보기술 업종만 +3.4% 올랐고 나머지 10개 업종은 모두 하락**했다. 필수소비재는 그 전형이었다.
소비 관련 지표도 우호적이지 않다. 8/25 발표된 **CB 소비자신뢰지수는 89.4**로 예상(90.2)을 밑돌았고, 8/26 **7월 근원 PCE는 +3.3%**로 예상을 웃돌았다. **물가는 오르는데 소비 심리는 나빠지는 조합**이 식품·유통주에 가장 먼저 반영되고 있다.

**7. 비바시스템즈 (VEEV) +19.00% — 제약 특화 소프트웨어도 가이던스 상향**
제약·바이오 산업 전용 소프트웨어·데이터 분석 기업이 **+19.00%** 급등했다. **FY2027 2분기 실적이 호조**를 보였고 **연간 가이던스를 상향**했다. 이날 소프트웨어 상승 종목 가운데 옥타(**+23.30%**), 세일즈포스(**+22.60%**), 크라우드스트라이크(**+20.50%**)에 이어 네 번째로 높은 상승률이다.
비바는 제약사의 임상시험 데이터와 영업 관리를 담당하는 버티컬 SaaS다. 범용 소프트웨어보다 **AI 대체 위험이 낮다는 인식**이 있었지만, 최근 소프트웨어 전반의 매도에는 함께 휩쓸렸었다.
이날 옥타·세일즈포스·크라우드스트라이크와 함께 오르면서 **소프트웨어 매도가 개별 펀더멘털이 아니라 섹터 일괄 디리스킹이었음**이 확인됐다.

**8. HP (HPQ) −1.50% — PC 출하량과 마진이 동시에 줄었다**
PC·프린터 제조사가 1.5% 하락했다. **3분기 PC 부문 출하량과 마진이 모두 감소**한 것이 원인이다. 실적 발표 전 개장 전 거래에서도 약세였다.
원인은 메모리다. 엔비디아가 이날 경고한 **메모리 부품 부족**과 최근의 **메모리 가격 15% 이상 인상**은 PC 제조사에게는 직접적인 원가 부담이다.
**같은 사건이 공급자와 수요자에게 정반대로 작용하는 구도**가 선명하다. SK하이닉스·마이크론은 오르고 HP는 내렸다. 메모리 슈퍼사이클이 길어질수록 이 격차는 더 벌어진다.

**9. 배스앤바디웍스 (BBWI) −23.00% — 이날 최대 낙폭, 매출과 이익이 모두 뒷걸음**
개인용품·향초 유통업체가 23% 폭락하며 이날 최악의 하루를 보냈다. **2분기 매출이 전년 대비 감소**했고 **이익도 전년 대비 줄었다.** 성장주도, 방어주도 아닌 위치에서 양쪽 모두를 놓쳤다.
이번 주 소비주 낙폭 릴레이의 연장선이다. 8/25 딕스스포팅굿즈 **−30.68%**, 8/26 인튜이트 **−9.20%**, 그리고 이날 배스앤바디웍스 **−23.00%**와 호멜푸즈 **−9.10%**.
공통점은 **가이던스**다. 실적 자체보다 **전망을 낮추거나 매출이 역성장한 기업**이 예외 없이 두 자릿수로 맞았다. **시장이 현재 실적보다 향후 6~12개월 이익 경로에 훨씬 민감하게 반응하는 국면**이다.

**10. 모더나 (MRNA) −4.60% — 20억 달러 전환사채, 희석이 재료를 이겼다**
바이오텍이 4.6% 하락했다. **20억 달러 규모 전환사채 발행**을 발표한 것이 직접적 원인이다. 전환사채는 주가 상승 시 주식으로 전환되므로 기존 주주 지분이 희석된다.
이 종목은 8/19 **암 백신 3상 성공**으로 사상 최대폭 급등한 뒤 8/20 **−23.55%**, 8/21 **+17.00%**로 극단적 변동을 반복해왔다. 임상 성공이 곧바로 현금흐름으로 이어지지 않는다는 점이 계속 확인되고 있다.
전환사채 발행은 그 구조적 문제의 반영이다. 회사는 2026년 2분기 **순손실 7억 8,200만 달러**를 기록했고 영업현금흐름도 마이너스다. **상업화까지의 자금 조달 필요성**이 주가 재평가를 계속 제약하고 있다.

- **⚠️ 야간선물이 장중 30포인트 뒤집혔다:** 정규장 종가 **1,089.85** 대비 **1,096.85(+0.64%)로 출발**해 고가 **1,096.95**까지 올랐다가, 저가 **1,066.75(−2.12%)**까지 급락한 뒤 **1,081.85(−0.73%)**로 마감했다. 미 반도체 강세(SOX +2.33%)는 초반에 반영됐고 이후 되돌려졌다. **종가만 보면 "미 증시와 반대로 갔다"고 오독하기 쉬운 사례**이며, 앞으로는 시가·고가·저가를 함께 확인한다. 하락 전환의 구체적 트리거는 미확인이다.
