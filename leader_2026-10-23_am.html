- **미국이 먼저 달리고 한국이 아직 안 따라온 테마 15개:** 유통·이커머스(격차 +14.7%p), 화장품·K뷰티(격차 +14.3%p), 보험(격차 +13.4%p), Finance: Consumer Services(격차 +13.3%p) — 이번 리포트의 핵심 선점 영역.

- **이제 막 힘 붙는 조기 테마:** 방산(조기 60), 조선·LNG선·함정 MRO(조기 58), 바이오텍·기술수출(조기 58) — 다음 주 선점 후보군.
