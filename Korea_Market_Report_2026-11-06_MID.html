## 🗓 시장 요약

**① 서킷브레이커 뒤 5,200선 회복, 외국인 1조원 순매도** — 미국 중간선거 '블루웨이브' 이후 AI 데이터센터 규제 우려에 퀄컴·마이크론 등 반도체주 투매가 이어지자 코스피는 개장 3분 만에 8%대 급락해 서킷브레이커가 발동됐다. 장중 저점 4,911.28에서 기관(+6,987억원)과 개인(+1,400억원) 매수로 5,200선을 되찾았고, 외국인은 코스피 1조 567억원·코스닥 1,503억원을 동시에 팔고 있다.

**② 반도체 대형주 낙폭 축소, 기판·장비주는 여전히 약세** — SK하이닉스는 장 초반 10% 넘게 빠졌다가 −5.30%(1,197,000원), 삼성전자는 −2.98%(195,500원)로 '20만 전자'를 내줬다. 삼성전기 −7.52%(거래대금 8,012억원)·SK스퀘어 −7.66%, 대덕전자 −9.15%·피에스케이홀딩스 −10.42%로 부품·장비주 낙폭이 더 크다. 마이크론이 성과급 노사 갈등으로 대만 공장 건설을 멈췄다는 소식도 투자 둔화 우려를 키웠다.

**③ 운송·인터넷·제약은 버티고 전력기기·증권·화학은 급락** — 도로와철도운송 +6.06%, 항공사 +2.15%, NAVER +1.41%·카카오 +0.93%, 삼성바이오로직스 +1.64%·한미약품 +3.98%가 오르고 있다. 반면 전기장비 −6.96%(효성중공업 −9.44%, LS ELECTRIC −8.40%), 증권 −5.43%(한국금융지주 −17.61%), 화학 −4.26%(엘앤에프 −13.07%)가 크게 밀렸다.

**④ 환율 보합, 미국 선물은 반등·닛케이는 5%대 급락** — 원/달러는 1,357.70원으로 거의 움직이지 않았다. 미국 지수 선물은 S&P500 +0.81%·나스닥100 +1.97%로 반등 중이지만, 일본 닛케이225는 −5.27%로 반도체주 매도가 아시아 전반으로 번졌다. 항셍은 −0.44%, 항셍 지수선물은 +0.89%로 엇갈린다.

## 1. 업종별 흐름

**상승 업종** — 도로와철도운송 +6.06%(롯데렌탈 +10.59%), 항공사 +2.15%, 레저용장비와제품 +1.84%, 양방향미디어와서비스 +1.09%(NAVER +1.41%, 카카오 +0.93%), 다각화된통신서비스 +0.76%(KT +0.97%)가 올랐다. 지주사 지분 경쟁의 한진칼 +7.93%, 블루웨이브 재생에너지 수혜로 꼽힌 강원에너지 +14.79%·대명에너지 +2.69%도 강하다.

**하락 업종** — 전기장비 −6.96%(27종목 하락), 전자장비와기기 −6.34%(88종목 하락), 손해보험 −5.55%(삼성화재 −7.52%), 증권 −5.43%(39종목 전부 하락), 석유와가스 −4.51%, 화학 −4.26%, 반도체와반도체장비 −3.88%가 약하다. 미국 데이터센터 규제 우려가 전력기기·기판·장비주로 번졌다.

**시장의 시선** — 오후장에는 외국인 순매도가 1조원대에서 더 커지는지, 기관 매수가 장중 저점 4,911선 위에서 지수를 받칠지가 관건이다. 미국 나스닥100 선물 +1.97% 반등이 반도체 낙폭 축소로 이어질지, 방어주(KT&G·통신)와 실적주(롯데렌탈·카카오)로의 순환매가 이어질지도 볼 대목이다.

## 섹션 2. 이슈 종목 — 오전장 언론 최다 보도 순 · 오늘 32종목

*① 12시 현재 새로 편입된 급등 대형주 3종목(1～3번) → ② 오전장 언론 최다 보도 29선(4～32번).*

**1. 롯데렌탈 (089860) 58,500원 · 2조 1,241억원 · +10.59% — 최대주주 TPG로 변경, 잔여 지분 공개매수·자진 상장폐지 추진**
매각 절차가 마무리돼 최대주주가 TPG로 바뀌었고, TPG가 남은 지분을 공개매수해 자진 상장폐지를 추진한다는 보도가 나오며 폭락장에서 거래대금 965억원과 함께 10%대 급등했다. 3분기 영업이익은 929억원(전년비 +4.4%, 전분기비 +9.8%)으로 컨센서스(915억원)를 웃돌았고 장기 렌탈 영업이익이 518억원(+20.2%)으로 본업을 이끌었다. NH는 목표가를 61,000원으로, LS는 51,000원에서 63,000원으로 올렸고 대신은 "2026～27년 최고 실적, 변동성 구간에 최적의 투자 대상"이라며 60,000원을 유지했다. [리포트: NH 2026-11-06](https://woooty69.github.io/hw-pdf-arch-037/%EB%A1%AF%EB%8D%B0%EB%A0%8C%ED%83%88%EF%BC%BB089860%EF%BC%BD_20261106_NH_4020148428.pdf) · [리포트: LS 2026-11-06](https://woooty69.github.io/hw-pdf-arch-038/%EB%A1%AF%EB%8D%B0%EB%A0%8C%ED%83%88%EF%BC%BB089860%EF%BC%BD_20261106_LS_2653853.pdf) · [리포트: Daishin 2026-11-06](https://woooty69.github.io/hw-pdf-arch-038/%EB%A1%AF%EB%8D%B0%EB%A0%8C%ED%83%88%EF%BC%BB089860%EF%BC%BD_20261106_Daishin_197792.pdf)

**2. 강원에너지 (114190) 8,770원 · 2,291억원 · +14.79% — 美 블루웨이브 재생에너지 정책 기대, 폭락장 속 '빨간불'**
코스피가 장중 8% 폭락한 가운데 대명에너지·금양그린파워와 함께 블루웨이브 수혜주로 묶여 14.79% 올랐다(거래대금 173억원). 민주당의 상·하원 장악으로 태양광·이차전지 등 친환경 정책 확대 기대가 커졌다는 분석이 최근 96시간 6건의 기사에서 반복됐다. 개별 공시나 실적 재료보다는 정책 테마 수급 성격이 강해, 시가총액 2,291억원 규모의 중소형주로서 변동성에 유의할 구간이다. 증권사 커버 리포트 없음

**3. 혜인 (003010) 8,010원 · 1,018억원 · +13.62% — AI 데이터센터 전력 수요 급증, 발전기 수주 확대 기대**
AI 데이터센터 전력 수요 증가로 비상·상시 발전기 수주가 늘 것이라는 기대에 13.62% 올라 시가총액이 1,018억원으로 커졌다. 건설·발전 장비 유통이 본업인 회사로, 데이터센터 백업 전원 수요가 실적에 반영될지가 관건이다. 다만 거래대금이 53억원으로 적고 관련 뉴스도 11월 4일 1건뿐이어서 단기 테마성 상승 가능성을 염두에 둬야 한다. 증권사 커버 리포트 없음

*— 오전장 언론 최다 보도 29선 —*

**4. SK하이닉스 (000660) 1,197,000원 · 874조 3,994억원 · −5.30% — 장 초반 10%대 폭락 뒤 낙폭 축소, '100만 닉스' 위태**

## 4. 일정·관전 포인트

- **오늘 오후 국내**: 3분기 실적 발표 시즌 막바지 — 장 마감 후 잠정실적 공시가 이어진다. 롯데렌탈 TPG 공개매수 조건(가격·기간) 공시 여부, 삼성바이오로직스 노조 부분파업 진행 상황, 한진칼 호반·조원태 측 지분 협상 추가 공시를 확인한다.
- **오늘 밤 해외**: 연준 위원 발언과 미국 기술주 반등 지속 여부(나스닥100 선물 +1.97%). 다음 주에는 미국 물가지표·코어위브 실적이 대기하고, 11월 9일 튀르키예 COP31이 개막한다. 영국 BOE는 기준금리를 4.00%로 25bp 올렸다.

### 🇰🇷 오후장 관전 포인트

<script>// scrollkeep.js (2026-10-07): PDF를 보고 돌아왔을 때 보던 위치로 복귀
//  1) PDF 링크는 새 탭으로 연다(원래 페이지가 그대로 남음)
//  2) 페이지별 스크롤 위치를 기억(localStorage) -> 뒤로가기로 돌아오면 자동 복귀
//  3) 자동 복귀가 안 되면 화면 왼쪽 아래에 "↩ 보던 위치로" 버튼
// 리포트 허브(Quartz SPA)와 market-reports 단일 페이지 양쪽에서 같은 코드를 쓴다(순수 JS).
;(function () {
  var W = window
  if (W.__hwScrollKeep) return
  W.__hwScrollKeep = true
  var KEY = "hw_scroll_v1"
  var ready = false
  var spaBack = false
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") } catch (e) { return {} }
  }
  function save(y) {
    try {
      var d = load()
      d[location.pathname] = { y: Math.round(y == null ? window.scrollY : y), t: Date.now() }
      var ks = Object.keys(d)
      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
