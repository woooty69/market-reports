## 🗓 시장 요약

**① 엔비디아는 완승했다 — 매출 962억 달러, 마진 75% 사수**
엔비디아가 FY2027 2분기 매출 **962억 2,100만 달러(약 133조 2,000억원)**를 발표했다. 전년 동기 467억 4,300만 달러 대비 **+106%**, 전분기 816억 1,500만 달러 대비 **+18%**로 **13분기 연속 최대 실적**이다. LSEG 컨센서스 **921억 7,000만 달러를 약 40억 달러 상회**했다. 비GAAP EPS **2.22달러**(+120%), GAAP EPS **2.46달러**(+128%). 3분기 가이던스는 **1,060억 달러**로 시장 예상(1,037억~1,042억 달러)을 크게 웃돌았다.

**② 가장 중요한 숫자는 매출총이익률 75%였다 — 그리고 이게 한국에 결정적이다**
어제 리포트에서 관건으로 짚었던 **매출총이익률**을 엔비디아는 **75% 수준으로 지켜냈다.** HBM 등 첨단 메모리 가격 상승 압박을 받으면서도 마진이 훼손되지 않았다는 뜻이다. 해석은 두 가지다 — 엔비디아의 **가격 결정력이 그만큼 강하고**, 동시에 **메모리 가격 인상분을 고객에게 전가할 수 있는 구조**라는 것이다. **메모리 공급사에게는 명백한 호재**다. 실제로 **SK하이닉스 ADR이 시간외에서 +3.31%(\$163.25)까지 급등**했다.

**③ 그런데 엔비디아 주가는 시간외에서 빠졌다 — 전형적인 'sell the news'**
정규장에서 **−1.59%**로 마감한 뒤 시간외에서도 **1~2% 추가 하락**했다. 실적은 완벽했는데 주가가 빠진 이유는 **기대치가 이미 너무 높았기 때문**이다. 옵션시장은 실적 발표 후 예상 변동폭을 **약 5.4%**로 잡고 있었고, 발표 전 조사에서 **매출총이익률이 74~76%에 착지할 확률 93%, 데이터센터 매출 800억 달러 초과 확률 95%**로 이미 대부분이 가격에 반영돼 있었다. 엔비디아는 최근 8차례 실적 발표일 중 **6차례 주가가 하락**했다.

**④ 정규장은 PCE 쇼크로 눌렸다 — 근원 3.3%, 예상 상회**
7월 **개인소비지출(PCE) 물가가 전년 대비 +3.7%**, 전월 대비 +0.2%로 한 달 만에 상승 전환했다. 연준이 주시하는 **근원 PCE는 전년 대비 +3.3%**, 전월 대비 +0.2%로 **시장 예상을 웃돌았다.** 이란 전쟁 장기화에 따른 유가 부담이 물가에 반영된 결과다. 국채금리가 1년물부터 10년물까지 일제히 올랐고(**2년물 4.240%, 10년물 4.652%**), **기준금리 0.25%p 추가 인상 관측**까지 나왔다. 3대 지수는 다우 **−0.21%**, S&P **−0.02%**, 나스닥 **−0.08%**로 약보합에 그쳤다.

**⑤ 경기는 둔화 신호를 보냈다 — 2분기 GDP 연율 +1.5%**
2분기 GDP 증가율이 연율 **+1.5%**로 나오며 경기 둔화를 확인시켰다. **물가는 오르는데 성장은 둔화되는 조합**은 연준에게 가장 어려운 상황이다. 여기에 캐나다와의 관세 전쟁이 물가에 추가 압력을 가할 전망이라, **8/28 잭슨홀 워시 의장 연설의 무게가 더 커졌다.** 다만 유가는 사흘 연속 내려 **WTI \$81.87(−0.60%)**, 브렌트 **\$86.4(−0.9%)**로 물가 압력을 일부 상쇄했다.

**⑥ 야간선물이 마지막 40분에 뒤집혔다 — 05:00 −0.07% → 06:00 마감 +0.64%**
오늘 새벽 **05:00 시점 코스피200 야간선물은 −0.07%(1,072.75)**로 부진했다. 그런데 **엔비디아 실적이 05:20(KST)에 공개된 직후 급반등해 06:00 마감 기준 +0.64%(1,080.35)**로 돌아섰다. 정규장 종가(1,073.50) 대비 플러스 전환이다. 전날 국내는 코스피 **+0.97%(6,808.21)**로 6,800선을 회복했고 SK하이닉스는 **+0.60%(1,688,000원)**로 사흘 연속 올랐다. 외국인 순매도는 **−22만 7,762주**로 폭이 크게 줄었다(전일 −123.4만 주). 원/달러는 **1,384.8원(−1.3원)**.

> *어제 판정 복기 — **맞았다.** '갭업 출발 후 상승폭 축소'를 기본으로 보고 '엔비디아 실적 전까지 적극적 매수가 붙기 어렵다'고 했다. 실제 코스피는 **+0.97%**로 올랐지만 SK하이닉스는 **+0.60%**에 그쳤고 코스닥은 **−0.03%**로 멈췄다 — 상승폭 축소와 관망 우세가 그대로 나타났다. 하방 근거로 짚은 **외국인 순매도**도 사흘 연속 이어졌다(다만 폭은 −123.4만 → −22.8만 주로 급감). **다만 야간선물이 실적 직후 뒤집힌 것까지는 예상하지 못했다** — 앞으로 실적 발표일에는 **야간선물 마감(06:00) 값을 반드시 확인**해야 한다는 교훈을 남겼다.*

## 🏭 섹션 1. 업종별 흐름

**상승 ①  소비·유통 (양극화)**
아베크롬비앤피치가 **+11.50%**로 급등했다. 2분기 실적이 예상을 상회했고 연간 전망까지 올렸다. 콜스도 **+2.00%** 상승했다 — 2분기 동일점포 매출은 **−0.9%**였지만 **1억 5,000만 달러 관세 환급**에 힘입어 연간 전망을 상향했다.

**상승 ②  소셜·플랫폼**
메타가 **+3.00%** 올랐다. 미 주정부들과 **청소년 중독 유발 소송을 합의로 종결**하며 불확실성을 걷어냈다.

**하락 ①  소프트웨어 (이날 최약)**
인튜이트가 **−9.20%**로 무너지며 소프트웨어 섹터 전체를 끌어내렸다. 서비스나우 **−2.50%**, 세일즈포스·워크데이 **−2%**대, 줌 **−6.20%**. **가이던스 하향이 연쇄 반응을 일으킨 전형적 패턴**이다.

**하락 ②  AI 반도체 (실적 대기 관망)**
엔비디아 **−1.59%**. 다만 SOX는 **+0.10%**로 강보합을 지켰고 마이크론이 **+0.70%** 올랐다. 실적 발표 전 방향성 베팅을 자제하는 흐름이었다.

> 🇰🇷 [전달] **엔비디아가 마진 75%를 지켰다는 사실이 오늘 국내 메모리주에 가장 중요한 정보**다. 메모리 가격 인상이 최종 고객까지 전가되는 구조가 확인됐다. SKHY 시간외 **+3.31%**, 야간선물 **+0.64%**가 그 신호다.

**하락 ③  전기차·우주**
테슬라, 스페이스X, 알파벳이 하락했다. 반면 애플·마이크로소프트·팔란티어는 상승해 **빅테크 내부에서도 방향이 갈렸다.**

**[판정]** **갭업 출발, 반도체 대형주 중심의 상승을 기본으로 본다.**
**상방 근거**: ①**엔비디아 마진 75% 사수 + 3분기 가이던스 1,060억 달러**로 메모리 가격 전가 구조 확인, ②**SKHY 시간외 +3.31%**, ③**야간선물 06:00 마감 +0.64%**(실적 직후 반전), ④외국인 순매도 폭 급감(−123.4만 → −22.8만 주), ⑤SOX **+0.10%**로 방어.
**하방 근거**: ①**엔비디아 정규장 −1.59%·시간외 추가 하락**(sell the news), ②**근원 PCE +3.3%로 예상 상회**·금리 인상 관측, ③**2년물 4.240%·10년물 4.652%** 반등, ④**2분기 GDP 연율 +1.5%**로 경기 둔화 확인, ⑤**오늘 한국은행 금통위**와 **8/28 잭슨홀 워시 연설** 대기.
**판정: 갭업 출발 후 상승 유지**를 기본으로 본다. 엔비디아 본주는 sell the news로 빠졌지만 **국내 메모리주에는 '마진 전가 확인'이라는 별개의 호재**가 성립한다 — 8/24 애플-중국 이슈로 눌렸던 부분의 되돌림이 이어질 여지가 있다. 다만 **PCE가 예상을 웃돌아 금리 부담이 되살아난 점**과 **오늘 금통위**가 상단을 제한한다. (무효화: 젠슨 황 콘퍼런스콜에서 루빈 양산 지연·순환금융 논란이 부각될 경우)

## 🔍 섹션 2. 이슈 종목 10선 — 당일 미국 언론 최다 보도 순

**1. 엔비디아 (NVDA) −1.59% — 완벽한 실적, 그런데 주가는 빠졌다**
FY2027 2분기 매출 **962억 2,100만 달러**로 전년 대비 **+106%**, 전분기 대비 **+18%** 증가하며 **13분기 연속 최대 실적**을 기록했다. LSEG 컨센서스 **921억 7,000만 달러**를 약 40억 달러 웃돌았고, 비GAAP EPS는 **2.22달러**로 전년 1.01달러 대비 **+120%** 늘었다. 매출의 90% 이상을 차지하는 데이터센터 부문이 실적을 견인했다.
핵심은 마진이었다. HBM 등 첨단 메모리 가격 상승 압박 속에서도 **매출총이익률 75% 수준을 유지**했다. 3분기 가이던스도 **1,060억 달러**로 시장 예상(1,037억~1,042억 달러)을 훌쩍 넘겼다.
그럼에도 정규장에서 1.59% 하락했고 시간외에서 추가로 밀렸다. 발표 전 조사에서 **매출총이익률 74~76% 착지 확률 93%**, **데이터센터 매출 800억 달러 초과 확률 95%**로 대부분이 선반영돼 있었다. 엔비디아는 최근 **8차례 실적 발표일 중 6차례** 주가가 하락했다.

**2. SK하이닉스 ADR (SKHY) −0.95% — \$158.02 (괴리율: +29.6%), 정규장은 눌리고 시간외에 뒤집혔다**
정규장에서는 실적 대기 관망 속에 1% 가까이 밀렸다. 그러나 **엔비디아 실적 발표 후 시간외 거래에서 +3.31%(\$163.25)까지 급등**했다. 엔비디아가 메모리 가격 상승에도 **마진 75%를 지켰다는 사실**이 곧 **메모리 가격 인상이 최종 수요를 훼손하지 않는다는 증거**로 읽혔기 때문이다.
국내 주가는 **+0.60%(1,688,000원)**로 사흘 연속 올라 시가총액 **1,233조원**을 회복했다. 수급도 개선됐다 — 외국인 순매도가 **−22만 7,762주**로 전일(−123만 4,309주) 대비 크게 줄었고, 기관은 **+2,290주**로 소폭 순매수 전환했다. 거래대금 **8.5조원**.
원/달러가 **1,384.8원**으로 내려오고 국내 주가가 오르면서 괴리율은 **+31.8% → +29.6%로 2.2%p 축소**됐다. 한편 니덤은 목표주가를 **\$220**으로, BofA도 매수 의견과 함께 **100조원 규모 주주환원 전망**을 제시했다.

**3. 인튜이트 (INTU) −9.20% — 실적은 이겼는데 가이던스가 무너뜨렸다**
세무·회계 소프트웨어 기업이 9% 넘게 급락했다. 분기 실적 자체는 월가 예상을 웃돌았지만 **다음 회계연도 가이던스가 문제**였다. FY2027 매출 전망을 **232억 8,000만~235억 1,000만 달러**로 제시해 컨센서스 **237억 4,000만 달러**를 밑돌았다.
더 충격적인 것은 이익 전망이다. 연간 조정 EPS 가이던스를 **22.88~23.12달러**로 내놨는데, 시장 예상은 **27.31달러**였다. **약 15% 낮은 수준**이다.
파장이 섹터 전체로 번졌다. 서비스나우가 **−2.50%**, 세일즈포스와 워크데이가 각각 **2%**대 하락했다. **AI 투자 비용이 소프트웨어 기업의 이익률을 갉아먹기 시작했다는 우려**가 이날 소프트웨어 매도의 근본 배경이다.

**4. 아베크롬비앤피치 (ANF) +11.50% — 이날 최대 상승, 실적·전망 동시 상향**
의류 유통업체가 11% 넘게 급등하며 이날 최대 상승 종목에 올랐다. **2분기 실적이 월가 전망을 상회**했고 **연간 전망까지 상향**했다. 두 가지를 동시에 해낸 소비주가 드물었기 때문에 반응이 컸다.
이날은 소비주 내부의 양극화가 극명했다. 콜스는 **+2.00%** 올랐지만 2분기 **동일점포 매출은 −0.9%**로 역성장했고, 전망 상향도 **1억 5,000만 달러 관세 환급**이라는 일회성 요인에 상당 부분 기댔다.
전날 딕스스포팅굿즈가 **−30.68%** 폭락한 것과 대조된다. **CB 소비자신뢰지수 89.4**로 체감경기가 나빠지는 국면에서, 시장은 **브랜드력과 가격 결정력을 가진 기업만 선별적으로 사고 있다.**

**5. 메타 (META) +3.00% — 23조원 내고 청소년 소송을 끝냈다**
메타가 3% 올랐다. 미 주정부들이 제기한 **"앱을 의도적으로 청소년 중독적으로 설계했다"는 소송을 합의로 종결**했기 때문이다. 합의금은 **약 23조원** 규모로 전해졌다. 장 초반에는 **4%**까지 올랐다.
합의 조건에는 실질적 규제가 포함됐다. 미국 청소년은 **자정부터 오전 6시까지 인스타그램·페이스북 접속이 자동 차단**된다. 메타는 유튜브와 틱톡도 같은 조치에 동참해야 한다고 요구하고 있다.
시장이 이를 호재로 읽은 것은 **불확실성 제거** 때문이다. 소송이 장기화되면 배상 규모를 가늠할 수 없지만, 합의로 상한이 확정됐다. 애플·마이크로소프트도 함께 오르며 **빅테크 내부에서 메타·애플·MS가 상승, 알파벳·테슬라가 하락**하는 분화가 나타났다.

**6. 줌 커뮤니케이션즈 (ZM) −6.20% — 더블 비트에도 3분기 전망이 발목**
화상회의 기업이 6% 넘게 하락했다. 회계 2분기는 매출과 이익 모두 예상을 웃돈 **더블 비트**였지만 **3분기 가이던스가 시장 기대에 미달**했다. 주당순이익 전망을 **1.46~1.48달러**로 제시했는데 팩트셋 컨센서스는 **1.50달러**였다.
차이는 크지 않다. 그런데도 6% 넘게 빠졌다는 사실이 **현재 소프트웨어 섹터의 밸류에이션 부담**을 보여준다. 인튜이트가 같은 날 **−9.20%**로 무너진 것과 맞물려 매도가 증폭됐다.
허브스팟과 먼데이닷컴도 동반 하락했다. **구독형 소프트웨어의 성장 둔화와 AI 투자 비용이 동시에 부각되는 국면**이 이어지고 있다.

**7. 콜스 (KSS) +2.00% — 동일점포는 마이너스인데 전망은 올렸다**
백화점 체인이 2% 상승했다. **연간 전망을 상향**한 것이 이유인데, 내용을 뜯어보면 **1억 5,000만 달러 관세 환급**이 상당 부분을 차지한다. 2분기 **동일점포 매출은 −0.9%**로 여전히 역성장이다.
개장 전에는 오히려 **5%** 하락했다. 동일점포 부진이 먼저 부각됐다가, 전망 상향과 환급 효과가 확인되면서 장중 방향이 뒤집혔다.
관세 환급은 반복되지 않는 일회성 항목이다. **본업의 회복 없이 회계적 요인으로 전망을 올린 구조**라 지속성에는 물음표가 남는다. 이날 소비주가 종목별로 크게 갈린 이유이기도 하다.

**8. 서비스나우 (NOW) −2.50% — 인튜이트 가이던스의 유탄**
기업용 소프트웨어 대표주가 2.5% 넘게 하락했다. 자체 악재는 없었다. **인튜이트의 FY2027 EPS 가이던스가 컨센서스보다 약 15% 낮게 제시된 것**이 소프트웨어 전반의 이익률 전망을 끌어내렸다.
서비스나우는 AI 에이전트 기능을 공격적으로 확장하고 있어 **AI 투자 비용이 마진에 미치는 영향**이 특히 민감하게 반영된다. 세일즈포스와 워크데이도 각각 **2%**대 하락했다.
같은 날 엔비디아는 마진 **75%**를 지켰지만 소프트웨어는 그러지 못할 수 있다는 인식이 확산됐다. **AI 수혜가 반도체에 집중되고 소프트웨어는 비용만 부담하는 구도**가 이번 실적 시즌의 쟁점으로 떠올랐다.

**9. 마이크론 (MU) +0.70% — 실적 대기 속 강보합, YMTC 도전장은 변수**
메모리 대표주가 강보합으로 마쳤다. 엔비디아 실적 발표를 앞둔 관망 속에서도 반도체 섹터에서 상승을 유지했다. 필라델피아 반도체지수도 **+0.10%**로 방어했다.
새 변수가 등장했다. 중국 **YMTC(양쯔메모리)가 내년 낸드플래시 1위를 목표로 선언**했다. 8/24 애플의 중국산 메모리 조달 허용 보도에 이어 **중국 메모리의 공세가 구체화되는 흐름**이다.
다만 이날 시간외에서 확인된 것은 반대 방향이다. 엔비디아가 **메모리 가격 상승에도 마진 75%를 지켰다**는 사실은 **HBM·고부가 메모리의 가격 결정력이 여전히 공급자 쪽에 있다**는 증거다. 범용 낸드 경쟁과 고부가 메모리 수익성은 분리해서 봐야 한다.

**10. 세일즈포스 (CRM) −2.00% — 실적 앞두고 동반 약세**
고객관계관리(CRM) 소프트웨어 대표주가 2% 하락했다. 인튜이트발 가이던스 충격에 휩쓸렸고, **자체 실적 발표를 앞둔 경계감**도 겹쳤다.
세일즈포스는 최근 AI 에이전트 제품을 전면에 내세우고 있어 **AI 매출이 실제 성장으로 전환되는지**가 실적의 핵심 확인 사항이다. 인튜이트가 **AI 투자 비용 때문에 이익 전망을 15% 가까이 낮춘 상황**이라 시장의 눈높이가 낮아졌다.
소프트웨어 섹터는 이번 주 내내 반도체와 정반대로 움직였다. **같은 AI 사이클 안에서도 비용을 지불하는 쪽과 수취하는 쪽이 갈리고 있다**는 것이 이날 가장 선명한 신호다.

## 💬 섹션 3. 구루·기관 코멘트

- **엔비디아 실적 요약 — 매출 \$962.21억(+106%), 비GAAP EPS \$2.22(+120%), 매출총이익률 75% 수준, 3분기 가이던스 \$1,060억.** 13분기 연속 최대 실적이며 컨센서스를 매출·이익·가이던스 세 항목 모두에서 상회했다.
- **옵션시장 — 실적 후 예상 변동폭 5.4%.** 발표 전 조사에서 **매출총이익률 74~76% 착지 확률 93%**, **데이터센터 매출 800억 달러 초과 확률 95%**였던 반면 **주가가 220달러 위에서 마감할 확률은 43%**에 그쳤다. 실적은 이겼지만 주가는 이미 그것을 알고 있었다는 뜻이다.
- **니덤(Needham) — SK하이닉스 ADR 목표주가 \$220.** BofA도 매수 의견과 함께 **100조원 규모 주주환원 전망**을 제시했다.
- **7월 PCE — 헤드라인 +3.7%(전월비 +0.2%), 근원 +3.3%(전월비 +0.2%).** 모두 시장 예상을 웃돌며 국채금리를 끌어올렸다. 한 달 만에 상승 전환이다.
- **2분기 GDP — 연율 +1.5%.** 경기 둔화가 확인됐다. 캐나다와의 관세 전쟁이 향후 물가에 추가 압력을 가할 전망이다.
- **중국 YMTC — "내년 낸드플래시 1위 목표."** 삼성·SK하이닉스에 정면으로 도전장을 냈다. 애플의 중국산 메모리 조달 허용 보도와 함께 중장기 변수로 남는다.

- **🇰🇷 오늘 한국은행 금융통화위원회:** 원/달러가 **1,384.8원**까지 내려온 상황에서 통화정책 변화 여부가 관건이다. 원화 강세와 가계부채 사이의 균형이 시험대에 오른다.

- **⚠️ 8/28 잭슨홀 워시 의장 연설:** **근원 PCE 3.3%(예상 상회)**와 **2분기 GDP 1.5%(둔화)**가 동시에 나온 직후다. 물가와 성장이 반대 방향을 가리키는 상황에서 연준 의장이 어느 쪽에 무게를 두는지가 다음 주 금리 경로를 결정한다.
- **📉 금리가 다시 올랐다:** 2년물 **4.240%**, 10년물 **4.652%**. 이틀간의 하락을 되돌렸다. **기준금리 0.25%p 추가 인상 관측**까지 나온 상태라, 반도체 반등이 금리 부담을 이겨낼 수 있을지가 오늘의 핵심이다.
- **🇰🇷 괴리율 +29.6% — 정상 범위 복귀:** 2.2%p 축소되며 20%대로 내려왔다. 다만 시간외에서 ADR이 **+3.31%** 급등했으므로, 오늘 국내가 얼마나 따라가느냐에 따라 다시 벌어질 수 있다.
- **🛢 유가 사흘 연속 하락 — WTI \$81.87:** 대이란 제재가 공급 차질로 이어지지 않는다는 평가가 굳어졌다. 물가 압력을 낮추는 방향이라 **PCE 쇼크를 일부 상쇄**한다. 국내 항공·해운·화학에 우호적이다.
