# 📊 한국증시 데일리 리포트
### 2026년 10월 16일(금) 작성 · 기준일: 10월 15일(목) 정규장

> 15일 코스피는 미국 CPI 쇼크와 'AI 빚잔치' 우려에 외국인이 3조 7,637억원을 던지며 5,554.22(−7.57%)로 폭락했고, 코스닥도 760.82(−7.65%)로 무너졌습니다. 양 시장에 매도 사이드카와 1단계 서킷브레이커가 잇따라 걸린 '검은 목요일'이었고 코스피는 7거래일 연속 하락했습니다. 밤사이 TSMC가 3분기 순이익 68.7% 증가와 4분기 매출 가이던스 523억～543억달러를 내놓은 가운데 다우가 1.08% 올랐고, 코스피200 야간선물은 4% 넘게 반등해 있습니다.

*코스피는 5,673.01(−5.59%)로 출발해 장 초반 5,751.45까지 반등을 시도했지만 9시 7분 매도 사이드카, 12시 38분 1단계 서킷브레이커(20분 매매 정지)가 발동되며 5,450.81까지 밀렸고 5,554.22(−7.57%)로 마감했다. 외국인이 3조 7,637억원을 순매도해 8거래일 연속 '팔자'였고 개인(+1조 3,967억원)과 기관(+1조 7,176억원)이 받아냈다. SK하이닉스(−12.76%)·삼성전자(−10.56%)·삼성전기(−18.34%)·SK스퀘어(−11.97%)가 낙폭을 키웠고 전자장비와기기(−16.12%)·전기장비(−14.31%)·반도체(−11.65%)가 가장 약했다. 오른 업종은 상업서비스(+5.33%)·담배(+4.40%)·통신(+2.20%)·은행(+0.90%) 정도였고, 삼성바이오로직스(+4.99%)·KT&G(+4.40%)·하나금융지주(+1.97%)가 방어주 역할을 했다.*

## 🗓 시장 요약

**① 코스피 5,554.22(−7.57%), 사이드카·서킷브레이커 겹친 '검은 목요일'**
코스피는 454.59포인트 내리며 7거래일 연속 하락했고, 이 기간 낙폭은 20%에 이른다. 오전 9시 7분(코스피)·9시 12분(코스닥) 매도 사이드카에 이어 12시 23분 코스닥, 12시 38분 코스피에 1단계 서킷브레이커가 걸렸는데 양 시장 동시 서킷브레이커는 올해 다섯 번째다. 7월 말 저점인 5,500선을 장중 하회했다가 마감 직전 5,550선을 되찾았고, 52주 신저가 종목은 200개를 넘었다. 증권가에서는 '코리아 디스카운트'가 돌아오는 것 아니냐는 우려와 함께 "내년 상반기까지 하락장"과 "1년 안 전고점 돌파"가 엇갈렸다.

**② 반도체: 하이닉스 −12.76%·삼성전자 −10.56%, 소부장·기판 투매**
간밤 필라델피아 반도체지수(−4.30%) 급락과 코어위브(−15%대) 폭락이 'AI 투자 수익성 의구심'으로 번지며 반도체 투톱에 외국인 매도가 집중됐다. 두 종목 거래대금은 14조 4,691억원으로 코스피 전체의 절반을 웃돌았고, 코스피 시가총액이 넉 달 새 2,868조원 줄어드는 동안 두 종목에서만 1,997조원이 사라졌다는 집계가 나왔다. 원익IPS(−18.35%)·주성엔지니어링(−18.05%)·테스(−18.59%)·유진테크(−18.31%) 등 전공정 장비와 삼성전기(−18.34%)·대덕전자(−15.38%)·코리아써키트(−17.81%) 등 기판주도 동반 급락했다. 밤사이 TSMC가 4분기 매출 가이던스를 523억～543억달러로 제시해 오늘은 AI 수요 확인 여부가 반등의 열쇠다.

**③ 버틴 업종: 자사주 매입·고배당·바이오 방어주**
상업서비스(+5.33%)는 4,500억원 규모 자사주 공개매수와 기존 자사주 전량 소각을 결정한 에스원(+14.94%)이 이끌었고, 담배(+4.40%)는 사상 최대 실적 기대의 KT&G(+4.40%)가 신고가 근처에서 버텼다. 삼성바이오로직스(+4.99%)는 시총 상위 10종목 중 유일하게 올랐고 유한양행(+4.13%)·셀트리온(+1.00%) 등 제약(+0.50%)도 강보합이었다. 은행(+0.90%)은 금융지주 주주환원이 올해 처음 10조원을 넘을 것이라는 분석 속에 하나금융지주(+1.97%)·우리금융지주(+1.29%)·신한지주(+1.16%)가 올랐다.

**④ 약세 업종: 전자장비·전기장비·반도체·통신장비·에너지장비**
전자장비와기기(−16.12%, 하락 89종목)와 전기장비(−14.31%, 상승 0·하락 32)가 가장 약했다. 효성중공업(−16.21%)·HD현대일렉트릭(−12.52%)·LS ELECTRIC(−14.73%)·산일전기(−18.96%)·가온전선(−17.45%) 등 AI 전력기기·전선주가 일제히 밀렸고, 에너지장비(−10.58%)·기계(−9.57%)·전기제품(−8.93%)·복합기업(−8.26%)·생명보험(−8.07%)도 크게 빠졌다. SK(−11.41%)·두산(−15.30%)·삼성물산(−9.61%)은 자회사 지분 가치 급감이, 삼성생명(−8.72%)은 보유 삼성전자 지분 가치 하락이 부담이 됐다.

**⑤ 환율·금리·외부 변수: 美 CPI 3.7% 여진 속 TSMC 서프라이즈**
미국 9월 CPI가 3.7%로 예상(3.6%)을 웃돌며 10월 27～28일 FOMC의 금리 인상 가능성이 부각된 상태다. 원/달러 하나은행 고시 환율은 1,343.00원으로 보합이며, 원화 강세가 자동차·조선 등 수출 제조업의 3분기 '환율 어닝쇼크' 우려를 키우고 있다는 지적이 나왔다. 밤사이 뉴욕에서는 다우(+1.08%)·러셀2000(+1.37%)이 올랐지만 나스닥(+0.08%)은 보합, 필라델피아 반도체(−0.88%)는 약세였다. TSMC는 3분기 매출 1조 4,942억 대만달러(+50.9% YoY), 순이익 7,631억 대만달러(+68.7% YoY), 매출총이익률 66.4%를 기록했다.

**⑥ 코스닥 760.82(−7.65%), 하락 1,591종목 속 신규상장·테마 급등**
코스닥은 784.45로 출발해 745.43까지 밀린 뒤 760.82로 마감했고, 상승 종목은 110개에 그쳤다. 외국인이 2,228억원을 순매수했지만 기관(−1,614억원)이 팔았고, 주성엔지니어링·원익IPS·HPSP(−16.46%)·피에스케이(−17.29%)·리노공업(−13.55%) 등 시총 상위 장비·부품주가 급락했다. 반면 상장 첫날 멜콘(+39.19%)과 피지컬AI 인증 과제를 따낸 라온시큐어(+10.44%), 치매약 허가 기대의 듀켐바이오(+30.00%)가 급등했고, 상장폐지 위기 초소형주의 상한가도 이어졌다.

## 1. 업종별 흐름

**상승 업종** — 상업서비스와공급품(+5.33%)·담배(+4.40%)·다각화된통신서비스(+2.20%)·은행(+0.90%)·가정용기기와용품(+0.79%)·손해보험(+0.54%)·제약(+0.50%)·카드(+0.12%)만 플러스였다. 상업서비스는 에스원(+14.94%)이 자사주 454만주(약 4,500억원) 공개매수와 기존 자사주 전량 소각으로 끌어올렸고, 담배는 KT&G(+4.40%)가 '실적 좋고 배당 많은' 방어주로 자금을 모았다. 통신은 LG유플러스(+2.38%)·KT(+2.20%), 은행은 하나금융지주(+1.97%)·우리금융지주(+1.29%)·신한지주(+1.16%), 손보는 삼성화재(+0.86%)·DB손해보험(+0.92%)이 버텼다. 제약은 삼성바이오로직스(+4.99%)·유한양행(+4.13%)이 앞장섰다.

**하락 업종** — 전자장비와기기(−16.12%)·전기장비(−14.31%)·반도체와반도체장비(−11.65%)·통신장비(−11.05%)·에너지장비및서비스(−10.58%)·기계(−9.57%)·전기제품(−8.93%)·핸드셋(−8.39%)·복합기업(−8.26%)·생명보험(−8.07%)·건강관리기술(−7.94%)·디스플레이장비및부품(−7.75%)이 크게 빠졌다. 전자장비는 삼성전기(−18.34%)·삼화콘덴서(−18.32%)·LG이노텍(−11.44%), 전기장비는 LS ELECTRIC(−14.73%)·HD현대에너지솔루션(−18.14%)·효성중공업(−16.21%), 반도체는 SK하이닉스(−12.76%)·한미반도체(−14.16%)·테크윙(−19.98%)이 급락을 이끌었다. 전기제품은 삼성SDI(−11.17%)·LG에너지솔루션(−6.87%), 복합기업은 SK(−11.41%)·삼성물산(−9.61%)이 끌어내렸다.

**시장의 시선** — 7거래일 동안 20% 빠지며 7월 말 저점(5,500선)을 시험하는 구간에 들어섰다. 증권가는 삼성전자·SK하이닉스 목표주가가 현 주가의 두 배 수준이라며 이익 대비 과도한 할인을 강조하지만, 외국인은 올해 코스피에서 200조원 넘게 팔았고 34조원 규모 신용융자에서 반대매매가 2개월여 만에 최고로 늘어나는 등 수급 부담이 크다. 불안한 증시를 떠난 자금이 보름 새 은행 예금으로 37조원 몰렸다는 집계도 나왔다. 다만 밤사이 TSMC의 4분기 가이던스가 AI 수요의 견조함을 확인시켰고 야간선물이 4% 넘게 반등해, 오늘은 반도체·전력기기 낙폭 과대주의 기술적 반등이 먼저 나올 가능성이 크다.

## 섹션 2. 이슈 종목 40선 — 언론 최다 보도 순 (등락률 순 아님) · 오늘 43종목

*1～40번은 뉴스 후보 풀(최근 40시간 보도 건수) 순을 기본으로 거래대금·급등락·장 마감 후 공시를 고려해 골랐고(36·39번은 ★), 41～43번은 ★ 필수 편입(시총 1,000억원 이상 · +10% 이상 상승) 중 1～40번에 없는 종목이다. 등락률은 10/15 종가 기준.*

**1. SK하이닉스 (000660) 1,238,000원 · 904조 3,495억원 · −12.76% — '120만닉스' 추락, 거래대금 7.5조원 시장 1위**

**5. 주성엔지니어링 (036930) 197,100원 · 9조 1,614억원 · −18.05% — 코스닥 장비 대장주, 거래대금 5,084억원 투매**

**6. 삼성SDI (006400) 525,000원 · 42조 3,074억원 · −11.17% — 신한 목표가 74만원 상향에도 2차전지 동반 급락, 포스코퓨처엠 신공장 연기**
삼성SDI는 11.17% 내렸고 거래대금은 4,874억원이었다. 신한투자증권은 3분기 영업이익 2,638억원(+29% QoQ)으로 컨센서스(1,654억원)를 웃돌 것으로 보며 미국 ESS 생산능력(2027년 약 30GWh)의 약 80%를 2029년까지 수주로 확보했다는 점을 근거로 목표주가를 740,000원으로 올렸고, 이 리포트는 조회 9,479회로 인기 1위였다. 2차전지 ETF의 석 달 수익률이 30%대라는 집계도 나왔다. 다만 새벽에는 포스코퓨처엠이 광양 양극재 신공장 가동을 내년까지 연기하고 LFP 비중을 늘린다는 보도가 나와 EV용 소재 수요 둔화가 다시 부각됐다. [리포트: Shinhan 2026-10-14](https://woooty69.github.io/hw-pdf-arch-025/%EC%82%BC%EC%84%B1SDI%EF%BC%BB006400%EF%BC%BD_20261014_Shinhan_196693.pdf) · [리포트: Shinhan 2026-10-14](https://woooty69.github.io/hw-pdf-arch-026/%EC%82%BC%EC%84%B1SDI%EF%BC%BB006400%EF%BC%BD_20261014_Shinhan_1138104.pdf) · [리포트: DS 2026-10-08](https://woooty69.github.io/hw-pdf-arch-024/%EC%82%BC%EC%84%B1SDI%EF%BC%BB006400%EF%BC%BD_20261008_DS_196564.pdf)

**7. 현대차 (005380) 289,500원 · 58조 9,035억원 · −7.66% — 로봇사업전략팀 신설·아틀라스 양산 속도, 3분기 눈높이는 하향**
현대차는 7.66% 내렸고 거래대금은 2,230억원이었다. 새벽 보도로 현대차가 로봇사업전략팀을 신설하고 보스턴다이내믹스 아틀라스의 양산 속도를 '1일→1시간' 단위로 끌어올린다는 소식과 전고체 전지 맞춤 양극재 기술 공개 계획이 전해졌다. 반면 원화 강세로 자동차·조선 등 제조업의 3분기 '어닝 쇼크' 공포가 커지고 있고, iM증권은 3분기 매출 45.3조원·영업이익 2.4조원(−2.8%)을 전망하며 목표가를 600,000원으로 낮췄다. 정의선 회장의 인도 20조원 투자 계획도 단기 주가를 지지하지 못했다. [리포트: iM 2026-10-15](https://woooty69.github.io/hw-pdf-arch-026/%ED%98%84%EB%8C%80%EC%B0%A8%EF%BC%BB005380%EF%BC%BD_20261015_iM_196735.pdf) · [리포트: Yuanta 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%ED%98%84%EB%8C%80%EC%B0%A8%EF%BC%BB005380%EF%BC%BD_20261012_Yuanta_196611.pdf) · [리포트: Shinhan 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/%ED%98%84%EB%8C%80%EC%B0%A8%EF%BC%BB005380%EF%BC%BD_20261012_Shinhan_196587.pdf)

**8. LG에너지솔루션 (373220) 393,000원 · 91조 9,620억원 · −6.87% — 벤틀리 첫 전기차에 배터리 단독 공급, 삼성 목표가 50만원**
LG에너지솔루션은 6.87% 내려 시총 상위 대형주 중 낙폭이 상대적으로 작았고 거래대금은 2,219억원이었다. 장 마감 뒤 벤틀리의 첫 전기차에 배터리를 단독 공급하고 해외 판매 차량에도 탑재된다는 소식이 나왔다. 삼성증권은 3분기 잠정 영업이익 7,560억원이 컨센서스를 크게 웃돈 점과 ESS 성장을 근거로 목표주가를 500,000원으로 올렸다. AI 전력난에 ESS가 급성장하며 K배터리 3사가 북미 공략을 강화한다는 분석도 이어졌다. [리포트: Samsung 2026-10-15](https://woooty69.github.io/hw-pdf-arch-026/LG%EC%97%90%EB%84%88%EC%A7%80%EC%86%94%EB%A3%A8%EC%85%98%EF%BC%BB373220%EF%BC%BD_20261015_Samsung_196753.pdf) · [리포트: MERITZ 2026-10-15](https://woooty69.github.io/hw-pdf-arch-026/LG%EC%97%90%EB%84%88%EC%A7%80%EC%86%94%EB%A3%A8%EC%85%98%EF%BC%BB373220%EF%BC%BD_20261015_MERITZ_2652965.pdf) · [리포트: iM 2026-10-12](https://woooty69.github.io/hw-pdf-arch-025/LG%EC%97%90%EB%84%88%EC%A7%80%EC%86%94%EB%A3%A8%EC%85%98%EF%BC%BB373220%EF%BC%BD_20261012_iM_196585.pdf)

**9. 두산에너빌리티 (034020) 61,400원 · 39조 3,305억원 · −11.53% — '팀 코리아' 웨스팅하우스 지분 투자에도 원전주 급락**

### 🇰🇷 오늘 개장 관전 포인트
1. **7거래일 폭락 뒤 기술적 반등 강도** — 코스피200 야간선물이 4% 넘게 올라 있어 갭 상승 출발이 예상된다. 다만 외국인이 8거래일 연속 순매도 중이어서, 반등 구간에서 외국인이 매수로 돌아서는지가 바닥 신호의 핵심이다.
2. **TSMC 서프라이즈가 반도체 투톱을 살릴까** — TSMC는 3분기 순이익 68.7% 증가, 4분기 매출 가이던스 523억～543억달러(3분기 대비 최대 +16%)로 AI 수요가 견조함을 보여줬다. 다만 밤사이 필라델피아 반도체 지수는 −0.88%로 약했고, 'AI 빚잔치' 논쟁은 끝나지 않았다.
3. **낙폭 과대 소부장·전력기기의 되돌림** — 전날 원익IPS·주성엔지니어링·테크윙(−18～20%)과 효성중공업·LS ELECTRIC·산일전기(−15～19%)가 투매에 가깝게 밀렸다. 신용융자 반대매매가 2개월여 만에 최고로 늘어난 점은 장 초반 매물 부담 요인이다.
4. **방어주·주주환원주의 차익실현 여부** — 에스원(+14.94%)·KT&G(+4.40%)·삼성바이오로직스(+4.99%)·금융지주가 폭락장의 피난처였다. 지수 반등 시 자금이 반도체로 되돌아가며 방어주가 상대적으로 약해질 수 있다.
5. **환율·금리와 실적 시즌** — 원화 강세에 따른 자동차·조선·전력기기의 3분기 '환율 어닝쇼크' 우려가 커지고 있다. 이달 FOMC 금리 인상 가능성과 미국 은행 실적, 다음 주부터 본격화하는 국내 3분기 실적 발표를 함께 봐야 한다.

  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
<script>document.getElementById('content').innerHTML=marked.parse(document.getElementById('md').textContent);document.querySelectorAll('#content a[href^="http"]').forEach(function(a){a.target='_blank';a.rel='noopener'});document.dispatchEvent(new Event('hwContentReady'));</script>
