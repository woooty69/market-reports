## 🗓 시장 요약

**① 코스피 4.39% 급반등·5,200선 회복, 외국인 8거래일 만에 순매수 전환**
코스피는 개장 직후 4～5%대 급등으로 매수 사이드카가 발동됐고, 장중 5,300.92까지 오른 뒤 5,239.13(+4.39%)으로 마감해 지난주 블루웨이브발 급락 이후 4거래일 만에 처음 올랐다. 외국인은 4,439억원, 기관은 4,642억원을 사들였고 개인은 1조 3,947억원을 팔아 '저가 매수는 외국인·기관, 개인은 반등에 매도'라는 구도가 나타났다. 상승 종목이 압도적이어서 시가총액 1,000억원 이상·10% 이상 상승 종목만 76개였고, 코스피200은 4.62% 올라 814.31이 됐다. 증권가에서는 '이익은 오르고 가격만 무너진 UnderShooting 국면'이라는 진단과 '반도체 급반등 추격은 신중'이라는 의견이 엇갈렸다.

**② 반도체: SK하이닉스 +6.69%·삼성전자 +4.74%, 소부장은 10%대 급등**
SK하이닉스는 1,212,000원(+6.69%)으로 거래대금 4조 1,487억원 1위였고 삼성전자는 198,900원(+4.74%)으로 20만원선에 다가섰다. 소부장은 이오테크닉스(+14.48%)·SFA반도체(+13.17%)·엑시콘(+13.14%)·케이씨텍(+12.79%, SK하이닉스와 211억원 장비 공급계약)·한미반도체(+7.90%)·주성엔지니어링(+7.48%)이 급등했다. 모건스탠리는 삼성전자 30만 9천원·SK하이닉스 160만원으로 목표가를 또 낮춘 반면 노무라는 SK하이닉스 470만원을 제시해 눈높이 격차가 컸다. 밤사이 필라델피아 반도체지수는 0.36% 내린 9,998.33으로 1만선을 다시 내줬고, 엔비디아는 젠슨 황 CEO 관련 논란(트럼프 대통령 "FBI가 살펴보는 중", 美 주주 손해배상 소송)이 이어졌다. 대만 TSMC의 10월 매출은 전년 대비 60% 늘어 사상 최대였다.

**③ 강세 업종: 항공·전력기기·건설·2차전지, 유가 급락과 美 전력망 기대**
트럼프 대통령이 "이란전 종식에 긍정적 모멘텀"이라고 말하며 국제유가가 급락하자 항공사(+13.26%, 8종목 모두 상승)가 업종 1위였고 진에어(+29.92%, 상한가)·에어부산(+17.19%)·한진칼(+15.18%)·아시아나항공(+11.68%)·대한항공(+11.51%)이 급등했다. 美 데이터센터 규제가 오히려 전력망·자가발전 투자를 늘린다는 해석에 효성중공업(+12.72%)·HD현대일렉트릭(+10.67%)·LS ELECTRIC(+8.33%)·가온전선(+16.48%) 등 전기장비(+8.97%)가 강했다. 재건 기대에 현대건설(+11.97%)·DL이앤씨(+10.47%)·대우건설(+9.21%)이 오른 건설(+6.88%), BMW가 LG에너지솔루션·삼성SDI를 46파이 원통형 배터리 공급사로 정한 2차전지(삼성SDI +9.88%·에코프로 +10.23%·엘앤에프 +10.98%)도 반등을 이끌었다.

**④ 약세 업종: 유틸리티·담배·통신·바이오 대형주, 방어주에서 자금 이탈**
위험선호가 살아나자 지난주 버팀목이던 방어주가 밀려 복합유틸리티(−5.56%)·담배(−3.13%, KT&G −3.67%)·음료(−3.08%)·다각화된통신서비스(−2.45%, KT −2.30%)가 하위권이었다. KT&G는 의학한림원의 '담뱃값 8,500원 인상' 권고가, KT는 3분기 영업이익 6% 감소가 부담이었다. 바이오 대형주도 셀트리온(−3.33%)·삼성바이오로직스(−2.78%, 노조 파업 관련 내부 갈등)가 내렸고, 게임(−1.38%)은 크래프톤 3분기 영업이익 2,250억원(−35%) 등 실적 부진이 겹쳤다. 하락률 상위는 리브스메드(−10.00%) 정도로, 하락 종목은 소수였다.

**⑤ 환율·물가·해외: 美 10월 CPI 예상 상회, 월러 '50bp 인상' 거론에 미 증시 하락**
원/달러는 10일 15:30 기준가 1,337.5원(−9.6원)으로 내려왔다가, 밤사이 美 물가 지표 발표 뒤 달러가 강세로 돌아서며 11일 새벽 하나은행 고시 1,344.00원(+2.00원)으로 올랐다. 美 10월 소비자물가는 전월 대비 0.4% 올라 전망치를 웃돌았고, 월러 연준 이사가 "12월 50bp 인상도 고려"한다고 말해 금리 인상 경계가 커졌다. 이에 S&P500(−0.38%)·나스닥(−0.74%)·다우(−0.30%)가 하락했고 코스피200 야간선물은 798.00으로 주간 종가보다 14.10포인트(−1.74%) 낮게 끝났다. 중국의 1～10월 무역흑자는 1조 달러를 넘어 2년 연속 1조 달러를 기록했다.

**⑥ 코스닥·장 마감 후: 코스닥 +4.48%, 넥슨·신세계·파라다이스 호실적과 크래프톤 부진**
코스닥은 4.48% 오른 667.61로 마감했고 기관(+2,147억원)이 사고 외국인(−1,479억원)·개인(−556억원)이 팔았다. 이오테크닉스·RFHIC(+19.20%)·에코프로(+10.23%)가 강했고 동원파츠는 거래대금 5,769억원으로 시장 4위에 오를 만큼 손바뀜이 컸다. 장 마감 후에는 신세계가 3분기 영업이익 1,643억원(+64.7%)으로 역대 최대를, 파라다이스가 641억원(+62.3%), 경동나비엔이 378억원(+373%), 메디톡스가 155억원(+75%)을 발표했고 넥슨은 3,718억원(+11%)을 냈다. 반면 크래프톤(2,250억원, −35%)·F&F(1,084억원, −15.3%)·동원산업(125억원, −34%)은 부진했고, 에코프로비엠은 투자 종속회사 주식 6,271억원어치를 추가 취득한다고 공시했다.

## 1. 업종별 흐름

### 🇰🇷 오늘 개장 관전 포인트
1. **야간선물 −1.74%, 5,200선 지지 여부** — 코스피200 야간선물은 798.00으로 주간 종가(812.10)보다 14.10포인트 낮게 끝났다. 어제 4.39% 급반등분 일부를 되돌리며 출발할 가능성이 크고, 코스피가 5,200선을 지키는지가 첫 관전 포인트다.
2. **외국인 매수의 이틀째 지속 여부** — 외국인은 8거래일 만에 4,439억원을 순매수했지만, 밤사이 美 CPI 상회로 달러가 강해져 원/달러가 1,344원으로 다시 올랐다. 금리 인상 경계 속에서도 반도체 대형주 매수가 이어지는지가 반등의 질을 가른다.
3. **반도체 급반등의 연속성** — SK하이닉스 +6.69%·이오테크닉스 +14.48% 등 소부장까지 급등했지만 필라델피아 반도체지수는 −0.36%로 1만선을 내줬다. 모건스탠리(하이닉스 160만원)와 노무라(470만원)의 극단적 시각차처럼 방향성 논쟁이 이어지는 만큼 추격 매수보다 수급 확인이 필요하다.
4. **★ 급등주 76개의 되돌림 위험** — 시가총액 1,000억원 이상·10% 이상 상승 종목이 76개였고, 이 중 상당수는 개별 뉴스 없이 업종 반등이나 거래가 적은 상태에서 올랐다. 동원파츠(거래대금 5,769억원)·JW신약·대동기어처럼 손바뀜이 컸던 종목과 재료 없는 관심 급증 종목은 이후 약세 경향이 있었다는 점에 유의해야 한다.
5. **유가·전력망·2차전지 테마의 지속 여부** — 항공(+13.26%)은 유가 하락, 전기장비(+8.97%)는 美 전력망 투자 기대, 2차전지는 BMW 수주가 근거였다. 흐름 전환 점검표상 항공은 이미 20일 코스피 대비 +30.1%로 호재가 상당 부분 반영된 반면, 전력기기·이차전지는 하락 단계여서 하루 반등이 추세 전환인지 확인이 필요하다.

      if (ks.length > 60) { ks.sort(function (a, b) { return d[a].t - d[b].t }); delete d[ks[0]] }
      localStorage.setItem(KEY, JSON.stringify(d))
    } catch (e) {}
  }
  function isPdf(a) {
    var h = a.getAttribute("href") || ""
    return /\.pdf($|[?#])/i.test(h) || /hw-pdf-arch/i.test(h)
  }
  function markLinks() {
    var as = document.querySelectorAll("a[href]")
    for (var i = 0; i < as.length; i++) {
      if (isPdf(as[i])) { as[i].setAttribute("target", "_blank"); as[i].setAttribute("rel", "noopener") }
    }
  }
  var btnEl = null
  function hideBtn() { if (btnEl) { btnEl.remove(); btnEl = null } }
  function showBtn(y) {
    hideBtn()
    var b = document.createElement("button")
    b.type = "button"
    b.textContent = "↩ 보던 위치로"
    b.setAttribute("style", "position:fixed;left:12px;bottom:14px;z-index:99999;background:#1f6feb;color:#fff;" +
      "border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer")
    b.onclick = function () { window.scrollTo(0, y); hideBtn() }
    document.body.appendChild(b)
    btnEl = b
    setTimeout(hideBtn, 20000)
  }
  function restore(isBack) {
    ready = false
    var r = load()[location.pathname]
    if (!r || Date.now() - r.t > 12 * 3600 * 1000 || r.y < 300) { ready = true; return }
    var tries = 0
    ;(function go() {
      if (Math.abs(window.scrollY - r.y) < 150) { ready = true; return }
      var h = document.documentElement.scrollHeight
      if (isBack && h >= r.y + window.innerHeight * 0.5) { window.scrollTo(0, r.y); ready = true; return }
      if (isBack && ++tries < 25) { setTimeout(go, 150); return }
      ready = true
      if (window.scrollY < r.y - 400) showBtn(r.y)   // 새로 연 경우·자동 복귀 실패 시 버튼으로 안내
    })()
  }
  function navType() {
    try { var e = performance.getEntriesByType("navigation")[0]; return e ? e.type : "" } catch (e) { return "" }
  }
  // 링크를 누르기 직전·페이지를 떠날 때·스크롤이 멈출 때 위치 저장
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null
    if (a) save()
  }, true)
  var tm = null
  window.addEventListener("scroll", function () {
    if (!ready) return
    clearTimeout(tm)
    tm = setTimeout(function () { save(); if (btnEl && window.scrollY > 300) hideBtn() }, 400)
  }, { passive: true })
  window.addEventListener("pagehide", function () { if (ready) save() })
  window.addEventListener("popstate", function () { spaBack = true })
  // bfcache 로 돌아온 경우엔 브라우저가 위치를 그대로 유지하므로 아무것도 안 한다
  var first = true
  function onPage() {
    markLinks()
    var back = first ? navType() === "back_forward" : spaBack
    first = false
    spaBack = false
    restore(back)
  }
  // Quartz(리포트 허브): 페이지 전환마다 'nav' 이벤트 / 단일 페이지(market-reports): 렌더 후 hwContentReady 이벤트
  document.addEventListener("nav", onPage)
  document.addEventListener("hwContentReady", onPage)
})()
</script>
