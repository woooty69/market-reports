## 🗓 시장 요약

**① 다우 51,670.10(−0.35%)·S&P500 7,805.45(−0.02%)·나스닥 27,204.38(−0.15%) — 은행 실적 시즌 개막, 장 초반 상승분 반납하며 보합 마감**
3분기 실적 시즌이 대형 은행들로 문을 열었지만 지수는 방향을 정하지 못했다. 다우는 장중 **52,317.32**까지 올랐다가 **51,670.10(−180.45, −0.35%)**로 밀려 사흘 연속 상승을 멈췄고, S&P500은 **7,805.45(−1.79, −0.02%)**, 나스닥은 **27,204.38(−41.52, −0.15%)**였다. 나스닥100은 30,569.48(−0.31%), 러셀2000은 2,783.37(−0.40%)였고 상장 종목의 약 56%가 내렸다. 에너지·유틸리티가 업종 상위였고 헬스케어·기술이 하위였다. 바클레이스의 제이슨 골드버그는 최근 은행주 약세가 펀더멘털보다 공포에 따른 것이라고 진단했다. 해석하면 좋은 실적에도 '뉴스에 판다'는 반응이 나올 만큼 기대가 높아진 상태에서 수요일 CPI를 기다리는 관망 장세였다.

**② 10년물 5.21%·2년물 4.79% — 휴장 뒤 첫 거래에서 소폭 하락, 수요일 9월 CPI 대기**
콜럼버스 데이 휴장 뒤 다시 열린 채권시장에서 미 재무부 기준 2년물은 **4.79%(−1.0bp)**, 10년물은 **5.21%(−3.0bp)**, 30년물은 **5.56%(−4.0bp)**로 내렸다. 10년물은 장중 5.236%까지 올랐다가 오후 들어 밀렸다. 연준은 9월에 금리를 올린 상태이고 크리스토퍼 월러 이사, 톰 바킨 리치먼드 연은 총재, 수전 콜린스 보스턴 연은 총재가 이날 연설 일정을 소화했다. 시장은 수요일 9월 CPI가 10월 28일 FOMC의 추가 인상 여부를 가를 것으로 보고 있다.

**③ WTI \$94.90(+1.24%)·브렌트 \$106.49(−0.15%) — 장중 \$91.70까지 밀렸다 반등, 러시아산 경유 제재 완화와 후티 공격이 교차**
유가는 장중 크게 흔들렸다. WTI는 장중 저가 **\$91.70**까지 내렸다가 **\$94.90(+1.24%)**로 정산했고 브렌트는 **\$106.49(−0.15%)**로 보합권이었다. 트럼프 행정부가 러시아산 경유 공급 제한을 일시 완화한 것은 하락 요인이었지만, 예멘 후티 반군의 사우디 공격과 미국의 이란 타격 가능성에 대한 불확실성이 다시 매수를 불렀다. 캐피털닷컴의 카일 로다는 러시아·우크라이나 긴장 완화 기대가 사그라들었다고 평가했다.

**④ AI·반도체 — 마이크론 −3.62%로 이틀째 급락, SK하이닉스 ADR −3.19%, SOX는 장중 −3.07%에서 −0.23%로 회복**
메모리 약세가 이틀째 이어졌다. 중국 CXMT의 새 D램 구조 개발 소식 여파로 마이크론(MU)은 장중 \$929.03(−6.07%)까지 밀린 뒤 **\$953.19(−3.62%)**로 마감했고, 웨스턴디지털(WDC)은 \$380.71(−1.61%), 시게이트(STX)는 \$747.20(−0.80%)로 장중 7%대 낙폭을 크게 줄였다. 브로드컴 혹 탄 CEO가 "많은 투자자가 무엇에 투자하는지 모른다"고 발언한 것도 반도체 심리에 부담이었다. 필라델피아 반도체지수는 장중 11,861.28까지 밀렸다가 **12,208.80(−0.23%)**으로 낙폭을 대부분 회복했다. 반면 메타(META)는 새 AI 모델군 공개와 잇단 투자의견 상향에 **\$762.50(+2.63%)**로 이틀째 강세였다.

**⑤ 회사 고유 재료 — 골드만 EPS \$17.01 깜짝 실적에도 −0.23%, 씨티 −5.60%, J&J 탤크 비용에 −5.73%, 식스플래그 롤러코스터 사고에 −14.43%**
골드만삭스(GS)는 주당순이익 \$17.01로 컨센서스 \$13.02를 크게 웃돌고 주식 트레이딩 매출이 72% 늘었지만 장중 +4.13%에서 **\$891.91(−0.23%)**로 밀렸다. JP모건(JPM)은 EPS \$5.57로 예상치 \$5.90에 못 미쳐 **\$331.43(−0.86%)**, 씨티그룹(C)은 \$124.53(−5.60%), 웰스파고(WFC)는 \$80.74(−3.10%)였다. 존슨앤드존슨(JNJ)은 탤크 소송 비용으로 순이익이 96% 줄며 **\$248.61(−5.73%)**, 유나이티드헬스(UNH)는 가이던스 상향에도 \$377.76(−0.20%)였다. 식스플래그(FUN)는 놀이공원 사망 사고에 \$10.20(−14.43%)로 폭락했다.

**⑥ 🇰🇷 SK하이닉스 ADR \$157.06(−3.19%)·마이크론 −3.62%·SOX −0.23% — 10/14(수) 메모리 부담 지속, 반도체지수 회복은 위안**
SK하이닉스 ADR(SKHY)은 시가 \$151.92(−6.36%)에서 출발해 낙폭을 줄였지만 **\$157.06(−\$5.17, −3.19%)**로 마감해 여드레째 약세였다. 해석하면 CXMT발 메모리 경쟁 우려는 이어졌지만 미국 반도체지수가 장중 저점에서 3% 가까이 반등한 만큼 수요일 국내 반도체 대형주는 낙폭 축소 시도가 가능하다.

## 섹션 2. 이슈 종목 10선 — 언론 최다 보도 순 (등락률 순 아님)

**1. 골드만삭스 (GS) −0.23% — 3분기 EPS \$17.01로 컨센서스 \$13.02 대폭 상회, 주식 트레이딩 매출 72% 급증에도 차익 매물**
골드만삭스는 시가 \$923.00에서 고가 \$930.88(+4.13%)까지 오른 뒤 \$891.91(−\$2.04, −0.23%)로 마감했다. 3분기 순이익은 \$52.9억으로 1년 전 \$41.0억에서 늘었고 주당순이익 \$17.01은 LSEG 집계 컨센서스 \$13.02를 30% 넘게 웃돌았다. 주식 부문 매출이 72% 늘어난 \$64.4억을 기록했지만 채권·외환·원자재(FICC) 매출은 1% 줄어든 \$34.7억이었다. 아거스 리서치의 스티븐 비가는 투자은행 부문이 확실한 서프라이즈였고 딜 파이프라인이 여전히 탄탄하다고 평가했지만, 주가는 장중 상승분을 모두 반납했다.

**2. JP모건체이스 (JPM) −0.86% — 3분기 EPS \$5.57로 예상치 \$5.90 하회, 투자증권 손실 \$6억5,800만 반영**
JP모건은 고가 \$344.36(+3.01%)까지 올랐다가 \$331.43(−\$2.87, −0.86%)로 마감했다. 3분기 순이익은 6% 늘어난 \$153억, 주당순이익은 \$5.57로 시장 예상치 \$5.90에 못 미쳤고, 세전 \$6억5,800만의 투자증권 손실을 제외하면 \$5.75였다. 순매출은 8% 늘어난 \$502억이었다. 제이미 다이먼 CEO는 앞으로의 변수들이 관리 가능할 수 있지만 폭넓은 결과에 대비하고 있다고 밝혔다.

**3. 존슨앤드존슨 (JNJ) −5.73% — 탤크 소송 비용·인수 비용에 순이익 96% 급감, 의료기기 부문 예상 하회**
존슨앤드존슨은 시가 \$254.56에서 저가 \$245.19(−7.03%)까지 밀린 뒤 \$248.61(−\$15.12, −5.73%)로 마감했다. 3분기 실적은 전반적으로 예상에 부합했고 연간 가이던스도 올렸지만, 탤크 소송 관련 비용과 인수 비용으로 순이익이 96% 급감했다. 메드테크(의료기기) 부문 매출도 시장 예상에 못 미쳐 헬스케어 업종 약세를 이끌었다.

**4. 유나이티드헬스 (UNH) −0.20% — 3분기 실적 예상 상회·연간 이익 전망 상향에도 장중 +5.64%에서 밀려**
유나이티드헬스는 시가 \$397.62에서 고가 \$399.86(+5.64%)까지 오른 뒤 \$377.76(−\$0.76, −0.20%)로 마감했다. 회사는 3분기 실적이 시장 예상을 웃돌았다고 밝히고 연간 이익 전망을 상향했으며 프리마켓에서는 4% 넘게 올랐다. 그러나 존슨앤드존슨 급락으로 헬스케어 업종 전체가 약해지면서 장중 저가 \$372.88(−1.49%)까지 밀렸다.

**5. 마이크론 (MU) −3.62% — 중국 CXMT의 새 D램 구조 개발 진전 여파 이틀째, 장중 −6.07%**
마이크론은 시가 \$934.07에서 저가 \$929.03(−6.07%)까지 밀린 뒤 \$953.19(−\$35.85, −3.62%)로 마감했다. 중국 창신메모리(CXMT)가 새 D램 구조 개발에서 진전을 이뤘다는 보도로 중국산 메모리 공급 확대와 가격 경쟁 우려가 이틀째 이어졌다. 전날 −3.88%에 이어 이틀 동안 7% 넘게 내렸고, 장 후반 반도체지수 반등에 고가 \$953.60 부근에서 마감했다.

**6. 메타 플랫폼스 (META) +2.63% — 새 AI 모델군 'Muse Wonder' 공개 뒤 투자의견 상향 잇따라, 이틀째 강세**
메타는 시가 \$736.09에서 고가 \$771.27(+3.81%)까지 오른 뒤 \$762.50(+\$19.54, +2.63%)로 마감했다. 회사가 'Muse Wonder' 모델군 등 AI 성과를 공개한 뒤 증권가의 투자의견 상향이 이어지면서 자체 모델 경쟁력과 광고 매출 기여 기대가 커졌다. 전날 +3.38%에 이어 이틀 동안 6% 넘게 올랐고, 기술주 약세 속에서도 통신서비스 업종을 지탱했다.

**7. 식스플래그 엔터테인먼트 (FUN) −14.43% — 식스플래그 오버 조지아 '골리앗' 롤러코스터 사고로 방문객 1명 사망·4명 부상**
식스플래그는 시가 \$10.90에서 저가 \$9.80(−17.79%)까지 밀린 뒤 \$10.20(−\$1.72, −14.43%)로 마감했다. 조지아주 식스플래그 오버 조지아의 골리앗 롤러코스터에서 방문객 1명이 숨지고 4명이 다치는 사고가 발생하면서 운영 차질과 소송·보험 비용 우려가 커졌다. 장중 고가 \$11.26도 전일 종가를 5.54% 밑돌 만큼 매도가 하루 종일 이어졌고 주가는 \$10선을 간신히 지켰다.

**8. 플렉스 (FLEX) −5.42% — 클라우드·전력 인프라 사업부를 '액시엄 솔루션스 인터내셔널'로 분사 계획 발표**
플렉스는 시가 \$115.00에서 저가 \$107.40(−8.39%)까지 밀린 뒤 \$110.88(−\$6.36, −5.42%)로 마감했다. 회사가 AI 데이터센터 수혜 사업인 클라우드·전력 인프라 부문을 '액시엄 솔루션스 인터내셔널'이라는 별도 회사로 분사하겠다고 발표했다. 고성장 사업이 떨어져 나가면 남는 본사의 가치가 낮아질 수 있다는 우려가 매도로 이어졌다.

**9. 웨스턴디지털 (WDC) −1.61% — UBS 목표주가 \$525→\$470 하향·'중립' 유지, 장중 −7.41%에서 낙폭 축소**
웨스턴디지털은 시가 \$359.01에서 저가 \$358.27(−7.41%)까지 밀린 뒤 \$380.71(−\$6.23, −1.61%)로 마감했다. UBS가 투자의견 '중립'을 유지하면서 목표주가를 \$525에서 \$470으로 10% 낮췄고, 메모리·스토리지 업종 전반의 매도도 겹쳤다. 다만 장 후반 반도체지수 반등과 함께 저가 대비 6% 넘게 회복했고 시게이트(STX)도 \$747.20(−0.80%)로 낙폭을 줄였다.

**10. 하트포드 보험 (HIG) +0.77% — 웰스파고 '매수' 의견·목표주가 \$158 재확인, 실적 발표 앞두고 강세**
하트포드는 고가 \$131.68(+1.14%)까지 오른 뒤 \$131.19(+\$1.00, +0.77%)로 마감했다. 웰스파고의 엘리스 그린스펀 애널리스트가 '매수' 의견과 목표주가 \$158을 재확인해 현재 주가 대비 20% 넘는 상승 여력을 제시했다. 은행주가 실적 뒤 일제히 밀린 가운데 손해보험주는 금리 하락과 견조한 보험료 인상 기대로 상대적 강세를 보였다.
